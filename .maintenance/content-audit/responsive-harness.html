<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>博客窄屏验收</title>
<style>html,body{margin:0;background:#eee}iframe{display:block;border:0;width:390px;height:844px}</style>
<iframe title="390像素博客验收"></iframe>
<script>
const route = new URLSearchParams(location.search).get('page');
if (new URLSearchParams(location.search).has('full')) document.querySelector('iframe').addEventListener('load', () => {
  const frame = document.querySelector('iframe');
  frame.style.height = `${frame.contentDocument.documentElement.scrollHeight}px`;
});
if (route && route.startsWith('/blog/')) document.querySelector('iframe').src = route;
</script>
</html>
