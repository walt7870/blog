  <title id="py-route-title">Python 基础工具与并发工程的衔接</title>
  <desc id="py-route-desc">先确认程序能产生正确结果。还不能时，从客户名单、规则、文件和交付学习基础工具；已有正确程序时，先测量瓶颈，再按网络等待、CPU 计算或 GPU 流水线选择并发方式。基础完成后可以进入性能诊断，两条路线都要求验证结果和失败恢复。</desc>

    <path data-node="decision" d="M240 120 400 200 240 280 80 200Z" fill="#fff" stroke="#c4d3c9"/>

    <text x="96" y="410" font-size="18">数据与规则 → 函数与文件</text><text x="96" y="438" font-size="18">异常与日志 → 参数化交付</text>
    <text x="592" y="172" font-size="21" font-weight="600" fill="#2b659b">并发系列：先测量瓶颈</text>
    <text x="592" y="208" font-size="18">网络等待：有限并发与超时</text><text x="592" y="244" font-size="18">CPU 计算：进程与数据传递成本</text><text x="592" y="280" font-size="18">GPU 推理：批次、显存与流水线</text>
