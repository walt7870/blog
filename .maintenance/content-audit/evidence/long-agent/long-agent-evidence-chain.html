<!doctype html>

<title id="long-agent-evidence-chain-title">数据变化沿依赖传播，使下游验收证据失效</title>
<desc id="long-agent-evidence-chain-desc">一月至七月的快照未变可复用有效分区证据，八月至十二月更新快照后须重查这些分区，再重新核对依赖两组分区的全年汇总和报告。</desc>

<rect width="960" height="600" fill="#f8fafc"/>
<text x="32" y="44" class="figure-title">版本变化，沿依赖找出需要重验的证据</text>
<text x="32" y="78" class="node-sub">只改变部分月份的数据；其他输入与授权仍有效。</text>
<path d="M268 180H344" class="edge"/>
<path d="M268 372H344" class="edge"/>
<path d="M576 180H604Q612 180 612 188V240Q612 248 620 248H656" class="edge"/>

<rect x="812" y="344" width="104" height="28" fill="#f8fafc"/><text x="824" y="365" class="node-sub">继续向下游</text>
<g data-node="unchanged"><rect x="36" y="136" width="232" height="88" rx="6" class="node"/><text x="56" y="172" class="node-name">一月至七月</text><text x="56" y="202" class="node-sub">快照 A · 未变</text></g>
