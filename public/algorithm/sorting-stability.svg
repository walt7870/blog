<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="464" viewBox="0 0 1040 464" role="img" aria-labelledby="sorting-stability-title sorting-stability-desc">
<title id="sorting-stability-title">稳定排序保留完整排序键相同时的原顺序</title>
<desc id="sorting-stability-desc">输入订单依次A、B、C、D，按优先级降序和时间升序排序后为D、A、C、B。A和C的完整键相同，稳定排序保留A先于C。</desc>
<style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#24343d}.title{font-size:23px;font-weight:700}.name{font-size:21px;font-weight:600}.sub{font-size:16px;fill:#52636d}.cell{fill:#fff;stroke:#b8c5cb;stroke-width:1.3}.focus{fill:#eaf6f1;stroke:#609789;stroke-width:1.5}</style>
<rect width="1040" height="464" fill="#f8fafb"/>
<text class="title" x="36" y="44">稳定性：完整排序键相同，才保留原来的先后</text>
<text class="sub" x="36" y="74">比较键 = (−优先级, 创建时间)；编号只用来识别记录，不参与排序。</text>
<text class="name" x="36" y="159">输入</text>
<rect class="cell" x="152" y="112" width="196" height="92" rx="4"/><text class="name" x="172" y="145">A</text><text class="sub" x="172" y="180">优先级 2 / 时间 10</text>
<rect class="cell" x="368" y="112" width="196" height="92" rx="4"/><text class="name" x="388" y="145">B</text><text class="sub" x="388" y="180">优先级 1 / 时间 5</text>
<rect class="cell" x="584" y="112" width="196" height="92" rx="4"/><text class="name" x="604" y="145">C</text><text class="sub" x="604" y="180">优先级 2 / 时间 10</text>
<rect class="cell" x="800" y="112" width="196" height="92" rx="4"/><text class="name" x="820" y="145">D</text><text class="sub" x="820" y="180">优先级 2 / 时间 8</text>
<text class="sub" x="152" y="242">先比较优先级（高在前），再比较时间（早在前）；A 与 C 的键完全相同。</text>
<text class="name" x="36" y="313">输出</text>
<rect class="cell" x="152" y="268" width="196" height="88" rx="4"/><text class="name" x="172" y="301">D</text><text class="sub" x="172" y="335">键 (−2, 8)</text>
<rect class="focus" x="368" y="268" width="196" height="88" rx="4"/><text class="name" x="388" y="301">A</text><text class="sub" x="388" y="335">键 (−2, 10)</text>
<rect class="focus" x="584" y="268" width="196" height="88" rx="4"/><text class="name" x="604" y="301">C</text><text class="sub" x="604" y="335">键 (−2, 10)</text>
<rect class="cell" x="800" y="268" width="196" height="88" rx="4"/><text class="name" x="820" y="301">B</text><text class="sub" x="820" y="335">键 (−1, 5)</text>
<text class="sub" x="36" y="408">A 在输入中先于 C，排序后仍先于 C；只验证数字升序看不到这种业务差异。</text>
<text class="sub" x="36" y="440">跨次分页还需唯一排序边界与一致快照；稳定排序不能固定本来就在变化的输入顺序。</text>
</svg>
