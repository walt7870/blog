<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="540" viewBox="0 0 1040 540" role="img" aria-labelledby="graph-path-model-title graph-path-model-desc">
<title id="graph-path-model-title">最少边数与最小总耗时的不同路线</title>
<desc id="graph-path-model-desc">仓库到分拨耗时4，到中转耗时1，中转到分拨耗时1，到门店耗时8，分拨到门店耗时1。BFS可得两条边成本5的路线，Dijkstra可得三条边成本3的路线。另有一个孤立站。</desc>
<defs><marker id="gp-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 7 3.5 0 7Z" fill="#71838c"/></marker></defs>
<style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#24343d}.title{font-size:23px;font-weight:700}.name{font-size:19px;font-weight:600}.sub{font-size:16px;fill:#52636d}.box{fill:#fff;stroke:#b8c5cb;stroke-width:1.3}.focus{fill:#eaf6f1;stroke:#609789;stroke-width:1.5}.line{fill:none;stroke:#71838c;stroke-width:1.4;marker-end:url(#gp-arrow)}.mask{fill:#f8fafb}</style>
<rect width="1040" height="540" fill="#f8fafb"/>
<text class="title" x="36" y="44">图的边权决定“最短”究竟在比较什么</text>
<text class="sub" x="36" y="74">箭头是可行方向，标签为模型中的非负耗时单位；不代表实时物流预测。</text>
<path class="line" d="M216 224H292 Q300 224 300 216V164 Q300 156 308 156H408"/>
<path class="line" d="M216 256H260 Q268 256 268 264V348 Q268 356 276 356H408"/>
<path class="line" d="M488 320V192"/>
<path class="line" d="M568 156H696 Q704 156 704 164V224 Q704 232 712 232H800"/>
<path class="line" d="M568 356H736 Q744 356 744 348V264 Q744 256 752 256H800"/>
<rect class="mask" x="320" y="120" width="54" height="25"/><text class="sub" x="328" y="138">4</text>
<rect class="mask" x="316" y="371" width="54" height="25"/><text class="sub" x="324" y="389">1</text>
<rect class="mask" x="506" y="242" width="54" height="25"/><text class="sub" x="514" y="260">1</text>
<rect class="mask" x="628" y="120" width="54" height="25"/><text class="sub" x="636" y="138">1</text>
<rect class="mask" x="632" y="371" width="54" height="25"/><text class="sub" x="640" y="389">8</text>
<rect class="box" x="56" y="204" width="160" height="72" rx="6"/><text class="name" x="112" y="248">仓库</text>
<rect class="box" x="408" y="120" width="160" height="72" rx="6"/><text class="name" x="464" y="164">分拨</text>
<rect class="box" x="408" y="320" width="160" height="72" rx="6"/><text class="name" x="464" y="364">中转</text>
<rect class="focus" x="800" y="208" width="184" height="72" rx="6"/><text class="name" x="868" y="252">门店</text>
<rect class="box" x="56" y="348" width="160" height="64" rx="6"/><text class="sub" x="92" y="387">孤立站：无边</text>
<text class="sub" x="36" y="461">BFS：仓库 → 分拨 → 门店，2 条边，总耗时 4 + 1 = 5。</text>
<text class="sub" x="36" y="496">Dijkstra：仓库 → 中转 → 分拨 → 门店，3 条边，总耗时 1 + 1 + 1 = 3。</text>
</svg>
