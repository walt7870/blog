<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="476" viewBox="0 0 1040 476" role="img" aria-labelledby="search-boundaries-title search-boundaries-desc">
<title id="search-boundaries-title">有重复时间戳时的二分边界</title>
<desc id="search-boundaries-desc">时间数组10、20、20、35、50中，20的下界为1，上界为3；时间范围20含到40不含，映射到下标1含到4不含，返回B、C、D。</desc>
<style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#24343d}.title{font-size:23px;font-weight:700}.name{font-size:20px;font-weight:600}.sub{font-size:16px;fill:#52636d}.cell{fill:#fff;stroke:#b8c5cb;stroke-width:1.3}.focus{fill:#eaf6f1;stroke:#609789;stroke-width:1.5}.bracket{fill:none;stroke:#609789;stroke-width:2}</style>
<rect width="1040" height="476" fill="#f8fafb"/>
<text class="title" x="36" y="44">搜索范围：找两个边界，而不是任意一个匹配项</text>
<text class="sub" x="36" y="74">升序时间戳；查询 [20,40)；数组与订单编号属于同一份索引快照。</text>
<text class="sub" x="36" y="134">下标</text><text class="sub" x="226" y="134">0</text><text class="sub" x="386" y="134">1</text><text class="sub" x="546" y="134">2</text><text class="sub" x="706" y="134">3</text><text class="sub" x="866" y="134">4</text>
<rect class="cell" x="152" y="152" width="160" height="64"/>
<rect class="focus" x="312" y="152" width="480" height="64"/>
<rect class="cell" x="792" y="152" width="160" height="64"/>
<path d="M472 152V216 M632 152V216" stroke="#b8c5cb" stroke-width="1.3"/>
<text class="name" x="216" y="191">10</text><text class="name" x="376" y="191">20</text><text class="name" x="536" y="191">20</text><text class="name" x="696" y="191">35</text><text class="name" x="856" y="191">50</text>
<text class="sub" x="36" y="252">订单</text><text class="name" x="222" y="252">A</text><text class="name" x="382" y="252">B</text><text class="name" x="542" y="252">C</text><text class="name" x="702" y="252">D</text><text class="name" x="862" y="252">E</text>
<path class="bracket" d="M312 280V296H792V280"/>
<text class="sub" x="312" y="326">lower_bound(20) = 1</text><text class="sub" x="700" y="326">lower_bound(40) = 4</text>
<text class="name" x="36" y="382">时间范围 [20,40) → 下标 [1,4) → 返回 B、C、D</text>
<text class="sub" x="36" y="420">精确查询所有 20：lower_bound(20)=1，upper_bound(20)=3，返回 B、C。</text>
<text class="sub" x="36" y="453">边界可以等于数组长度 n；先检查是否存在，不能把插入位置直接当作已找到的元素。</text>
</svg>
