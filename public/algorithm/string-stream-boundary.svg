<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="468" viewBox="0 0 1040 468" role="img" aria-labelledby="string-stream-boundary-title string-stream-boundary-desc">
<title id="string-stream-boundary-title">KMP跨文本块匹配已支付</title>
<desc id="string-stream-boundary-desc">原文订单A已支付分号订单B已支付在码点位置4处分块。第一块结束保存已匹配一个码点的状态，第二块继续匹配，输出全局起点3和10。</desc>
<style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#24343d}.title{font-size:23px;font-weight:700}.name{font-size:21px;font-weight:600}.sub{font-size:16px;fill:#52636d}.cell{fill:#fff;stroke:#b8c5cb;stroke-width:1.3}.focus{fill:#eaf6f1;stroke:#609789;stroke-width:1.5}</style>
<rect width="1040" height="468" fill="#f8fafb"/>
<text class="title" x="36" y="44">流式匹配：块边界不是文本边界</text>
<text class="sub" x="36" y="74">模式“已支付”；下标以 Python str 的 Unicode 码点为单位，允许匹配跨块。</text>
<text class="sub" x="148" y="118">输入块 1：订单A已</text><text class="sub" x="476" y="118">输入块 2：支付；订单B已支付</text>
<text class="sub" x="36" y="166">全局下标</text>
<text class="sub" x="174" y="166">0</text><text class="sub" x="238" y="166">1</text><text class="sub" x="302" y="166">2</text><text class="sub" x="366" y="166">3</text><text class="sub" x="430" y="166">4</text><text class="sub" x="494" y="166">5</text><text class="sub" x="558" y="166">6</text><text class="sub" x="622" y="166">7</text><text class="sub" x="686" y="166">8</text><text class="sub" x="750" y="166">9</text><text class="sub" x="808" y="166">10</text><text class="sub" x="872" y="166">11</text><text class="sub" x="936" y="166">12</text>
<rect class="cell" x="148" y="184" width="832" height="64"/>
<rect class="focus" x="340" y="184" width="192" height="64"/><rect class="focus" x="788" y="184" width="192" height="64"/>
<path d="M212 184V248 M276 184V248 M404 184V248 M468 184V248 M596 184V248 M660 184V248 M724 184V248 M852 184V248 M916 184V248" stroke="#b8c5cb" stroke-width="1"/>
<text class="name" x="170" y="224">订</text><text class="name" x="234" y="224">单</text><text class="name" x="302" y="224">A</text><text class="name" x="362" y="224">已</text><text class="name" x="426" y="224">支</text><text class="name" x="490" y="224">付</text><text class="name" x="554" y="224">；</text><text class="name" x="618" y="224">订</text><text class="name" x="682" y="224">单</text><text class="name" x="750" y="224">B</text><text class="name" x="810" y="224">已</text><text class="name" x="874" y="224">支</text><text class="name" x="938" y="224">付</text>
<path d="M404 126V176 M404 256V296" stroke="#71838c" stroke-width="1.5" stroke-dasharray="4 4"/>
<text class="sub" x="148" y="326">第一块结束：matched=1，offset=4；还没有完整匹配，返回 ()。</text>
<text class="sub" x="148" y="362">第二块从“支”继续：先完成跨块匹配，再完成下一次匹配，返回 (3,10)。</text>
<text class="sub" x="36" y="413">若每块重新开始匹配，会漏掉起点 3 的“已支付”；本例保留前缀状态与全局偏移。</text>
<text class="sub" x="36" y="448">原始 UTF-8 字节还需先正确增量解码；码点位置不能直接当作文件字节偏移。</text>
</svg>
