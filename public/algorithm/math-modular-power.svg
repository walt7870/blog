<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="452" viewBox="0 0 1040 452" role="img" aria-labelledby="math-modular-power-title math-modular-power-desc">
<title id="math-modular-power-title">3的13次方模17的状态变化</title>
<desc id="math-modular-power-desc">初始result为1，base为3，指数13。依次处理最低位1、0、1、1，指数变为6、3、1、0，result最终为12；base每轮平方并模17。</desc>
<defs><marker id="mp-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 7 3.5 0 7Z" fill="#71838c"/></marker></defs>
<style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#24343d}.title{font-size:23px;font-weight:700}.name{font-size:18px;font-weight:600}.sub{font-size:16px;fill:#52636d}.box{fill:#fff;stroke:#b8c5cb;stroke-width:1.3}.focus{fill:#eaf6f1;stroke:#609789;stroke-width:1.5}.line{fill:none;stroke:#71838c;stroke-width:1.4;marker-end:url(#mp-arrow)}</style>
<rect width="1040" height="452" fill="#f8fafb"/>
<text class="title" x="36" y="44">模幂：只处理指数的二进制位，不构造完整大幂</text>
<text class="sub" x="36" y="74">目标 3¹³ mod 17；每轮保持 result × baseᵉ 与目标同余。</text>
<path class="line" d="M204 230H236"/><path class="line" d="M404 230H436"/><path class="line" d="M604 230H636"/><path class="line" d="M804 230H836"/>
<rect class="box" x="36" y="144" width="168" height="168" rx="6"/><text class="name" x="56" y="176">初始</text><text class="sub" x="56" y="213">e = 13</text><text class="sub" x="56" y="250">base = 3</text><text class="sub" x="56" y="287">result = 1</text>
<rect class="box" x="236" y="144" width="168" height="168" rx="6"/><text class="name" x="256" y="176">位为 1：乘 3</text><text class="sub" x="256" y="213">e = 6</text><text class="sub" x="256" y="250">base = 9</text><text class="sub" x="256" y="287">result = 3</text>
<rect class="box" x="436" y="144" width="168" height="168" rx="6"/><text class="name" x="456" y="176">位为 0：跳过</text><text class="sub" x="456" y="213">e = 3</text><text class="sub" x="456" y="250">base = 13</text><text class="sub" x="456" y="287">result = 3</text>
<rect class="box" x="636" y="144" width="168" height="168" rx="6"/><text class="name" x="656" y="176">位为 1：乘 13</text><text class="sub" x="656" y="213">e = 1</text><text class="sub" x="656" y="250">base = 16</text><text class="sub" x="656" y="287">result = 5</text>
<rect class="focus" x="836" y="144" width="168" height="168" rx="6"/><text class="name" x="856" y="176">位为 1：乘 16</text><text class="sub" x="856" y="213">e = 0，结束</text><text class="sub" x="856" y="250">base = 1</text><text class="name" x="856" y="287">result = 12</text>
<text class="sub" x="36" y="368">每轮先按最低位更新 result，再令 base = base² mod 17、e = e // 2。</text>
<text class="sub" x="36" y="402">所有乘法后立即取模；图中每框给出该轮处理后的状态，初始框除外。</text>
<text class="sub" x="36" y="435">模数为 1 时初始 result = 1 mod 1 = 0；指数为 0 时也要遵守这个边界。</text>
</svg>
