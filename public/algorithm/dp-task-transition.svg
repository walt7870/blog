<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="510" viewBox="0 0 1040 510" role="img" aria-labelledby="title desc">
<title id="title">0-1背包选择任务B时的两条状态来源</title>
<desc id="desc">处理花费3收益4的B，预算5的状态比较上一行预算5的3和上一行预算2的3加4得到7。两条来源都在上一行，因此不会重复选择B。</desc>
<defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 7 3.5 0 7Z" fill="#64748b"/></marker></defs>
<style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#24343d}.title{font-size:23px;font-weight:700}.name{font-size:19px;font-weight:600}.sub{font-size:16px;fill:#52636d}.box{fill:#fff;stroke:#b8c5cb;stroke-width:1.3}.focus{fill:#eaf6f1;stroke:#609789;stroke-width:1.5}.line{fill:none;stroke:#71838c;stroke-width:1.4;marker-end:url(#arrow)}.mask{fill:#f8fafb}</style>
<rect width="1040" height="510" fill="#f8fafb"/>
<text class="title" x="38" y="44">动态规划：同一状态，比较两条合法来源</text>
<text class="sub" x="38" y="73">当前处理任务 B：花费 3、收益 4；已考虑 A：花费 2、收益 3。</text>
<path class="line" d="M330 178 H442 Q450 178 450 186 V222 Q450 230 458 230 H590"/>
<path class="line" d="M330 338 H482 Q490 338 490 330 V298 Q490 290 498 290 H590"/>
<rect class="mask" x="476" y="195" width="98" height="25"/><text class="sub" x="486" y="213">不选 B</text>
<rect class="mask" x="496" y="306" width="87" height="25"/><text class="sub" x="504" y="324">选 B：+4</text>
<rect class="box" x="38" y="139" width="292" height="78" rx="6"/><text class="name" x="60" y="168">dp[1][5] = 3</text><text class="sub" x="60" y="197">只考虑 A，预算仍为 5</text>
<rect class="box" x="38" y="299" width="292" height="78" rx="6"/><text class="name" x="60" y="328">dp[1][2] = 3</text><text class="sub" x="60" y="357">只考虑 A，为 B 预留 3</text>
<rect class="focus" x="590" y="190" width="406" height="140" rx="6"/><text class="name" x="612" y="222">dp[2][5] = max(3, 3 + 4)</text><text class="name" x="612" y="257">最大收益为 7，选择 A + B</text><text class="sub" x="612" y="290">前 2 项，总花费不超过 5</text><text class="sub" x="612" y="316">允许预算剩余，每项最多一次</text>
<text class="sub" x="38" y="426">两条来源都读“上一行”，所以 B 不可能在同一轮被使用两次。</text>
<text class="sub" x="38" y="457">一维压缩必须倒序更新容量：读取尚未被本轮覆盖的旧状态。</text>
<text class="sub" x="38" y="488">若有任务依赖或互斥条件，先检查“前 i 项、预算 c”是否足够表达约束。</text>
</svg>
