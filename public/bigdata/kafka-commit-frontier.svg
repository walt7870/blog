<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="kafka-frontier-title kafka-frontier-desc">
  <title id="kafka-frontier-title">Kafka 多分区消费的连续提交边界</title>
  <desc id="kafka-frontier-desc">分区0的40成功、41未完成、42成功时只能提交41；分区1的70与71成功而72未完成时可以提交72。提交位置是各分区下一条待处理记录，不是全批最大offset。</desc>
  <defs><marker id="kafka-frontier-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#74818a"/></marker><style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#27343b;font-size:18px}.title{font-size:24px;font-weight:700}.head{font-size:20px;font-weight:600}.small{font-size:16px;fill:#52616a}.box{fill:#fff;stroke:#bac4c9;stroke-width:1.3;rx:6}.focus{fill:#e4f3ee;stroke:#3b8573;stroke-width:1.5;rx:6}.waiting{fill:#fff4e4;stroke:#bd8b46;stroke-width:1.5;rx:6}.line{fill:none;stroke:#74818a;stroke-width:1.5;marker-end:url(#kafka-frontier-arrow)}</style></defs>
  <rect width="1200" height="640" fill="#f7f9fa"/>
  <text x="36" y="44" class="title">只能跨过连续成功的记录，每个分区单独计算</text><text x="36" y="78" class="small">示意前提：分区0在40以前、分区1在70以前均已可靠处理。顺序从左到右；数字是各分区offset。</text>
  <path d="M270 256V280Q270 288 278 288H1072Q1080 288 1080 280V256" class="line"/>
  <path d="M534 480V504Q534 512 542 512H1072Q1080 512 1080 504V480" class="line"/>
  <text x="36" y="212" class="head">分区0</text><text x="36" y="436" class="head">分区1</text>
  <rect x="160" y="156" width="220" height="100" class="focus"/><text x="180" y="194" class="head">offset 40</text><text x="180" y="234">业务已持久化</text>
  <rect x="424" y="156" width="220" height="100" class="waiting"/><text x="444" y="194" class="head">offset 41</text><text x="444" y="234">失败 / 仍在处理</text>
  <rect x="688" y="156" width="220" height="100" class="box"/><text x="708" y="194" class="head">offset 42</text><text x="708" y="234">已完成，但前面有缺口</text>
  <rect x="992" y="156" width="176" height="100" class="box"/><text x="1012" y="194" class="head">提交位置 41</text><text x="1012" y="234">恢复从41继续</text>
  <text x="424" y="324">不能提交43；否则恢复时会跳过未完成的41。</text>
  <rect x="160" y="380" width="220" height="100" class="focus"/><text x="180" y="418" class="head">offset 70</text><text x="180" y="458">业务已持久化</text>
  <rect x="424" y="380" width="220" height="100" class="focus"/><text x="444" y="418" class="head">offset 71</text><text x="444" y="458">业务已持久化</text>
  <rect x="688" y="380" width="220" height="100" class="waiting"/><text x="708" y="418" class="head">offset 72</text><text x="708" y="458">尚未完成</text>
  <rect x="992" y="380" width="176" height="100" class="box"/><text x="1012" y="418" class="head">提交位置 72</text><text x="1012" y="458">恢复从72继续</text>
  <text x="424" y="548">同批可以提交 {分区0: 41, 分区1: 72}，不取全批最大值。</text>
  <path d="M36 588H1168" stroke="#bac4c9"/><text x="36" y="620" class="small">绿底：连续成功；黄底：缺口；白底：额外完成或提交结果。失败后重放仍需业务幂等，不能用提前提交来消除重复。</text>
</svg>
