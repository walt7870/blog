<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="760" viewBox="0 0 1240 760" role="img" aria-labelledby="ds-control-title ds-control-desc">
  <title id="ds-control-title">DolphinScheduler调度组件与执行边界</title>
  <desc id="ds-control-desc">UI调用API，API写元数据库，Master获取命令并更新状态，向Worker分发任务，Worker提交计算应用。Master和Worker通过ZooKeeper协调。Alert消费元数据库告警请求并发送通知。业务数据不经注册中心传递。</desc>
  <defs><marker id="ds-control-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#74818a"/></marker><style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#27343b;font-size:18px}.title{font-size:24px;font-weight:700}.head{font-size:20px;font-weight:600}.small{font-size:16px;fill:#52616a}.box{fill:#fff;stroke:#bac4c9;stroke-width:1.3;rx:6}.focus{fill:#e4f3ee;stroke:#3b8573;stroke-width:1.5;rx:6}.line{fill:none;stroke:#74818a;stroke-width:1.5;marker-end:url(#ds-control-arrow)}.dash{stroke-dasharray:5 4}.mask{fill:#f7f9fa}</style></defs>
  <rect width="1240" height="760" fill="#f7f9fa"/>
  <text x="36" y="44" class="title">调度安排任务，计算平台运行应用</text><text x="36" y="80" class="small">以3.4.3和ZooKeeper注册方案为例；箭头表达请求、状态或协调关系，不是业务数据流水线。</text>
  <path d="M228 184H324" class="line"/>
  <path d="M436 232V344" class="line"/>
  <path d="M548 380H672" class="line"/>
  <path d="M672 420H548" class="line"/>
  <path d="M896 392H996" class="line"/>
  <path d="M1084 440V552" class="line"/>
  <path d="M784 440V552" class="line dash"/>
  <path d="M1040 440V504Q1040 512 1032 512H840Q832 512 832 520V552" class="line dash"/>
  <path d="M896 184H996" class="line"/>
  <rect x="244" y="148" width="64" height="28" class="mask"/><text x="276" y="168" class="small" text-anchor="middle">调用</text>
  <rect x="448" y="272" width="112" height="28" class="mask"/><text x="460" y="292" class="small">定义与命令</text>
  <rect x="556" y="344" width="108" height="28" class="mask"/><text x="610" y="364" class="small" text-anchor="middle">获取命令</text>
  <rect x="556" y="432" width="108" height="28" class="mask"/><text x="610" y="452" class="small" text-anchor="middle">更新状态</text>
  <rect x="904" y="356" width="84" height="28" class="mask"/><text x="946" y="376" class="small" text-anchor="middle">分发任务</text>
  <rect x="1096" y="476" width="108" height="28" class="mask"/><text x="1108" y="496" class="small">提交与跟踪</text>
  <rect x="656" y="484" width="116" height="28" class="mask"/><text x="712" y="504" class="small" text-anchor="middle">发现与协调</text>
  <rect x="904" y="148" width="84" height="28" class="mask"/><text x="946" y="168" class="small" text-anchor="middle">插件通知</text>
  <text x="672" y="272" class="small">从元数据库消费告警请求</text>
  <rect x="36" y="136" width="192" height="96" class="box"/><text x="56" y="176" class="head">UI</text><text x="56" y="212" class="small">定义、运行与查看</text>
  <rect x="324" y="136" width="224" height="96" class="box"/><text x="344" y="176" class="head">API Server</text><text x="344" y="212" class="small">请求与权限检查</text>
  <rect x="672" y="136" width="224" height="96" class="box"/><text x="692" y="176" class="head">Alert Server</text><text x="692" y="212" class="small">告警与投递结果</text>
  <rect x="996" y="136" width="208" height="96" class="box"/><text x="1016" y="176" class="head">外部通知渠道</text><text x="1016" y="212" class="small">邮件、Webhook等</text>
  <rect x="324" y="344" width="224" height="96" class="focus"/><text x="344" y="384" class="head">元数据库</text><text x="344" y="420" class="small">定义、命令与实例</text>
  <rect x="672" y="344" width="224" height="96" class="focus"/><text x="692" y="384" class="head">Master</text><text x="692" y="420" class="small">推进DAG、接收状态</text>
  <rect x="996" y="344" width="208" height="96" class="box"/><text x="1016" y="384" class="head">Worker</text><text x="1016" y="420" class="small">执行插件、回报状态</text>
  <rect x="672" y="552" width="224" height="96" class="box"/><text x="692" y="592" class="head">ZooKeeper</text><text x="692" y="628" class="small">注册、心跳与协调</text>
  <rect x="996" y="552" width="208" height="96" class="box"/><text x="1016" y="592" class="head">外部计算平台</text><text x="1016" y="628" class="small">Spark / YARN / K8s</text>
  <text x="36" y="572" class="head">任务执行的两种情况</text><text x="36" y="608" class="small">Shell/Python可直接运行在Worker环境。</text><text x="36" y="640" class="small">Spark等插件还需跟踪外部应用的实际终态。</text>
  <path d="M36 700H1204" stroke="#bac4c9"/><text x="36" y="736" class="small">实线：控制请求或状态访问；虚线：节点协调。图省略回报连线，Worker向Master报告任务状态。</text>
</svg>
