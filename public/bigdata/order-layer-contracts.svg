<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="layer-title layer-desc">
  <title id="layer-title">订单数据分层与发布边界</title>
  <desc id="layer-desc">七条原始变更经质量门禁和版本收敛成为四个订单当前状态，再筛出三笔已支付订单，按业务日汇总。候选报表校验通过后发布；异常输入保留来源并阻断对应批次。</desc>
  <defs><marker id="layer-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#74818a"/></marker><style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#27343b;font-size:18px}.title{font-size:24px;font-weight:700}.head{font-size:20px;font-weight:600}.small{font-size:16px;fill:#52616a}.box{fill:#fff;stroke:#bac4c9;stroke-width:1.3;rx:6}.focus{fill:#e4f3ee;stroke:#3b8573;stroke-width:1.5;rx:6}.line{fill:none;stroke:#74818a;stroke-width:1.5;marker-end:url(#layer-arrow)}</style></defs>
  <rect width="1200" height="640" fill="#f7f9fa"/>
  <text x="36" y="44" class="title">每次改变粒度，都要保留能解释结果的合同</text>
  <text x="36" y="80" class="small">口径：截至输入截点，当前仍为已支付的订单；按订单创建业务日归属，金额单位为分。</text>
  <path d="M260 252H336" class="line"/><path d="M560 252H636" class="line"/><path d="M860 252H936" class="line"/>
  <path d="M448 344V424" class="line"/><path d="M1048 344V424" class="line"/>
  <rect x="36" y="160" width="224" height="184" class="box"/>
  <text x="56" y="200" class="head">ODS 原始变更</text><text x="56" y="244">7条接入记录</text><text x="56" y="284">重复、取消均保留</text><text x="56" y="320" class="small">接入日 ≠ 业务日</text>
  <rect x="336" y="160" width="224" height="184" class="focus"/>
  <text x="356" y="200" class="head">DWD 当前状态</text><text x="356" y="244">4张订单各取最高版本</text><text x="356" y="284">同版本内容必须一致</text><text x="356" y="320" class="small">之后再筛选paid</text>
  <rect x="636" y="160" width="224" height="184" class="box"/>
  <text x="656" y="200" class="head">DWS 日汇总</text><text x="656" y="244">19日：2单 / 8000</text><text x="656" y="284">20日：1单 / 3990</text><text x="656" y="320" class="small">保留金额和订单数</text>
  <rect x="936" y="160" width="224" height="184" class="box"/>
  <text x="956" y="200" class="head">ADS 候选报表</text><text x="956" y="244">3单 / 11990</text><text x="956" y="284">加权均值3996.67</text><text x="956" y="320" class="small">校验输入与口径版本</text>
  <rect x="312" y="424" width="272" height="112" class="box"/>
  <text x="332" y="464" class="head">冲突 / 异常输入</text><text x="332" y="504">保留来源，阻断对应发布</text>
  <rect x="912" y="424" width="272" height="112" class="focus"/>
  <text x="932" y="464" class="head">校验通过后切换版本</text><text x="932" y="504">失败时继续读取上一正式版</text>
  <text x="36" y="448" class="head">重放与补数</text><text x="36" y="488">固定输入截点</text><text x="36" y="524">重算受影响业务日</text>
  <path d="M36 576H1164" stroke="#bac4c9"/>
  <text x="36" y="612" class="small">箭头：加工或发布路径。取消版本不会被提前筛掉；跨日平均必须用总金额除以总订单数。</text>
</svg>
