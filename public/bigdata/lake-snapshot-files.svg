<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="lake-title lake-desc">
  <title id="lake-title">湖表快照与文件保留关系</title>
  <desc id="lake-desc">目录当前指针从快照42切换到43。快照42引用数据A和B，快照43引用A和C。旧读者固定42仍需要B；新读者读取43。上传文件C不等于已经发布表。</desc>
  <defs><marker id="lake-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#74818a"/></marker><style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#27343b;font-size:18px}.title{font-size:24px;font-weight:700}.head{font-size:20px;font-weight:600}.small{font-size:16px;fill:#52616a}.box{fill:#fff;stroke:#bac4c9;stroke-width:1.3;rx:6}.focus{fill:#e4f3ee;stroke:#3b8573;stroke-width:1.5;rx:6}.line{fill:none;stroke:#74818a;stroke-width:1.5;marker-end:url(#lake-arrow)}</style></defs>
  <rect width="1200" height="640" fill="#f7f9fa"/>
  <text x="36" y="44" class="title">上传新文件和发布表版本，是两件事</text>
  <text x="36" y="80" class="small">以Iceberg快照关系简化展示：省略manifest等中间元数据；箭头表示指针或文件引用。</text>
  <path d="M284 396H340Q348 396 348 404V428Q348 436 356 436H412" class="line"/>
  <path d="M672 240H780Q788 240 788 248V280Q788 288 796 288H904" class="line"/>
  <path d="M672 180H728Q736 180 736 172Q736 164 744 164H904" class="line"/>
  <path d="M672 400H820Q828 400 828 392V320Q828 312 836 312H904" class="line"/>
  <path d="M672 460H904" class="line"/>
  <rect x="36" y="288" width="248" height="192" class="focus"/>
  <text x="56" y="328" class="head">目录当前指针</text><text x="56" y="372">42 → 43</text><text x="56" y="412">兼容提交协议控制切换</text><text x="56" y="452" class="small">并发冲突需要检测与重试</text>
  <rect x="412" y="136" width="260" height="144" class="box"/>
  <text x="432" y="176" class="head">快照42：引用A、B</text><text x="432" y="216">已启动读者固定此版本</text><text x="432" y="256" class="small">仍需保留B及对应元数据</text>
  <rect x="412" y="368" width="260" height="144" class="focus"/>
  <text x="432" y="408" class="head">快照43：引用A、C</text><text x="432" y="448">提交后新读者读取此版本</text><text x="432" y="488" class="small">A复用，C替代本次更新的B</text>
  <rect x="904" y="124" width="248" height="80" class="box"/><text x="924" y="172">数据文件B：旧数据</text>
  <rect x="904" y="260" width="248" height="80" class="box"/><text x="924" y="308">数据文件A：两版共用</text>
  <rect x="904" y="420" width="248" height="80" class="box"/><text x="924" y="468">数据文件C：更新数据</text>
  <text x="36" y="164" class="head">提交过程</text><text x="36" y="204">先写C与新元数据</text><text x="36" y="244">再发布新表版本</text>
  <path d="M36 568H1164" stroke="#bac4c9"/>
  <text x="36" y="608" class="small">旧快照可读依赖元数据和文件同时保留。直接扫描整个目录会绕过快照语义；时间旅行不是独立备份。</text>
</svg>
