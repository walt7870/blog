<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="hdfs-title hdfs-desc">
  <title id="hdfs-title">HDFS元数据与数据读写路径</title>
  <desc id="hdfs-desc">客户端向NameNode请求文件元数据和块位置，再直接访问DataNode。三副本写入依次沿DataNode1、2、3管线传输，确认反向返回。各DataNode向NameNode上报心跳和块报告；NameNode不转发文件内容。</desc>
  <defs><marker id="hdfs-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#74818a"/></marker><style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#27343b;font-size:18px}.title{font-size:24px;font-weight:700}.head{font-size:20px;font-weight:600}.small{font-size:16px;fill:#52616a}.box{fill:#fff;stroke:#bac4c9;stroke-width:1.3;rx:6}.focus{fill:#e4f3ee;stroke:#3b8573;stroke-width:1.5;rx:6}.line{fill:none;stroke:#74818a;stroke-width:1.5;marker-end:url(#hdfs-arrow)}</style></defs>
  <rect width="1200" height="680" fill="#f7f9fa"/>
  <text x="36" y="44" class="title">NameNode定位文件，DataNode传输内容</text><text x="36" y="80" class="small">示意一个块的三副本写入；读取时客户端直接选择可用副本，图中DN1仅作示例。</text>
  <path d="M276 200H440" class="line"/><path d="M440 272H276" class="line" stroke-dasharray="5 4"/>
  <path d="M156 320V456Q156 464 164 464H360" class="line"/>
  <path d="M584 456H648" class="line"/><path d="M872 456H936" class="line"/>
  <path d="M760 384V344Q760 336 752 336H648Q640 336 640 328V296" class="line" stroke-dasharray="5 4"/>
  <rect x="36" y="152" width="240" height="168" class="box"/>
  <text x="56" y="192" class="head">HDFS 客户端</text><text x="56" y="236">文件路径 / 身份 / 权限</text><text x="56" y="280" class="small">取得位置后直连数据节点</text>
  <rect x="440" y="152" width="344" height="144" class="focus"/>
  <text x="460" y="192" class="head">NameNode</text><text x="460" y="232">目录、文件到块映射、放置决策</text><text x="460" y="272" class="small">命名空间：fsimage + edits</text>
  <rect x="360" y="384" width="224" height="144" class="box"/><text x="380" y="424" class="head">DataNode 1</text><text x="380" y="464">块副本 + 校验信息</text><text x="380" y="504" class="small">接收客户端数据</text>
  <rect x="648" y="384" width="224" height="144" class="box"/><text x="668" y="424" class="head">DataNode 2</text><text x="668" y="464">块副本 + 校验信息</text><text x="668" y="504" class="small">接收并继续转发</text>
  <rect x="936" y="384" width="224" height="144" class="box"/><text x="956" y="424" class="head">DataNode 3</text><text x="956" y="464">块副本 + 校验信息</text><text x="956" y="504" class="small">确认沿管线反向返回</text>
  <rect x="288" y="164" width="140" height="28" fill="#f7f9fa"/><text x="296" y="184" class="small">元数据请求</text>
  <rect x="288" y="236" width="140" height="28" fill="#f7f9fa"/><text x="296" y="256" class="small">返回块位置</text>
  <text x="36" y="564" class="small">实线：请求或数据传输。</text><text x="36" y="596" class="small">虚线：位置响应，以及各DN的心跳/块报告（上报线以DN2示意）。文件内容不流经NameNode。</text>
  <path d="M36 624H1164" stroke="#bac4c9"/><text x="36" y="660" class="small">副本提供故障冗余；HA保护元数据服务可用性；独立备份用于集群外恢复，三者职责不同。</text>
</svg>
