<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="464" viewBox="0 0 1000 464" role="img" aria-labelledby="metaspace-loader-retention-title metaspace-loader-retention-desc">
  <title id="metaspace-loader-retention-title">插件类加载器的外部保留与卸载边界</title>
  <desc id="metaspace-loader-retention-desc">宿主线程通过上下文类加载器保留旧插件加载器，加载器仍可达就无法卸载其普通类，内部循环本身不是泄漏证据。</desc>
  <defs><marker id="meta-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker></defs>
  <style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#1e293b}.title{font-size:26px;font-weight:700}.name{font-size:20px;font-weight:700}.body{font-size:17px}.note{font-size:15px;fill:#475569}.node{fill:#fff;stroke:#94a3b8;stroke-width:1.5}.link{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#meta-arrow)}</style>
  <rect width="1000" height="464" fill="#f8fafc"/>
  <text class="title" x="32" y="44">插件停用后，谁还在保留旧加载器？</text>
  <text class="body" x="32" y="76">示例保留路径：长期存活的宿主线程没有恢复上下文类加载器。</text>
  <rect x="340" y="112" width="628" height="252" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-dasharray="6 4"/>
  <text class="note" x="360" y="140">旧插件对象群与其类型信息</text>
  <path class="link" d="M280 240H360"/><path class="link" d="M612 240H724"/>
  <rect x="32" y="196" width="248" height="88" rx="6" fill="#fff7ed" stroke="#c27838" stroke-width="1.5"/><text class="name" x="52" y="228">宿主活跃线程</text><text class="note" x="52" y="256">contextClassLoader 字段</text>
  <rect class="node" x="360" y="196" width="252" height="88" rx="6"/><text class="name" x="380" y="228">旧插件 ClassLoader</text><text class="note" x="380" y="256">堆对象仍可达</text>
  <rect class="node" x="724" y="196" width="220" height="88" rx="6"/><text class="name" x="744" y="228">类元数据与普通类</text><text class="note" x="744" y="256">不能完成对应类卸载</text>
  <text class="note" x="360" y="328">加载器管理类型生命周期；此箭头不表示元空间是 Java 堆中的对象。</text>
  <text class="body" x="32" y="404">解除外部保留后，再等待支持并启用类卸载的回收周期；close() 不会强制卸载。</text>
  <text class="note" x="32" y="436">判据：重复装卸后旧加载器是否消失、当前类数是否趋稳；仅有内部循环或累计加载增长不够。</text>
</svg>
