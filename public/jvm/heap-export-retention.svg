<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="456" viewBox="0 0 1000 456" role="img" aria-labelledby="heap-export-retention-title heap-export-retention-desc">
  <title id="heap-export-retention-title">订单导出中的对象保留与释放</title>
  <desc id="heap-export-retention-desc">执行中线程和全局任务表都可以保留订单数据，方法返回只移除线程的引用，清理全局任务后数据才可能不可达。</desc>
  <defs><marker id="heap-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker></defs>
  <style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#1e293b}.title{font-size:26px;font-weight:700}.name{font-size:20px;font-weight:700}.body{font-size:17px}.note{font-size:15px;fill:#475569}.node{fill:#fff;stroke:#94a3b8;stroke-width:1.5}.link{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#heap-arrow)}</style>
  <rect width="1000" height="456" fill="#f8fafc"/>
  <text class="title" x="32" y="44">方法结束了，订单列表为什么还在？</text>
  <text class="body" x="32" y="76">以强引用为例：业务完成不是 GC 的释放条件，是否仍然可达才是关键。</text>
  <path class="link" d="M280 172H432"/><path class="link" d="M280 312H432"/><path class="link" d="M624 172H672Q680 172 680 180V220Q680 228 688 228H736"/><path class="link" d="M624 312H696Q704 312 704 304V284Q704 276 712 276H736"/>
  <rect class="node" x="32" y="128" width="248" height="88" rx="6"/><text class="name" x="52" y="160">执行中的线程现场</text><text class="note" x="52" y="188">当前任务的活跃引用</text>
  <rect class="node" x="32" y="268" width="248" height="88" rx="6"/><text class="name" x="52" y="300">长期存活的任务注册表</text><text class="note" x="52" y="328">从 GC Roots 可达</text>
  <rect class="node" x="432" y="128" width="192" height="88" rx="6"/><text class="name" x="452" y="160">方法参数 / 局部值</text><text class="note" x="452" y="188">退出后不再保留</text>
  <rect x="432" y="268" width="192" height="88" rx="6" fill="#fff7ed" stroke="#c27838" stroke-width="1.5"/><text class="name" x="452" y="300">已完成的任务对象</text><text class="note" x="452" y="328">仍挂在 tasks 中</text>
  <rect class="node" x="736" y="208" width="232" height="88" rx="6"/><text class="name" x="756" y="240">订单列表与导出数据</text><text class="note" x="756" y="268">同一批堆对象</text>
  <rect x="296" y="244" width="120" height="40" fill="#f8fafc"/><text class="note" x="304" y="268">终态清理此关系</text>
  <text class="body" x="32" y="404">方法返回只移除上方路径；下方引用仍在，整批订单仍然存活。</text>
  <text class="note" x="32" y="432">修复：任务终态移除记录或清空大结果。复验：相同负载下，任务数量与存活基线趋稳。</text>
</svg>
