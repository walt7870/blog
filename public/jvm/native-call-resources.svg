<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="464" viewBox="0 0 1000 464" role="img" aria-labelledby="native-call-resources-title native-call-resources-desc">
  <title id="native-call-resources-title">JNI 调用现场与 native 资源生命周期</title>
  <desc id="native-call-resources-desc">平台线程在同一个 OS 栈里进入 JNI 调用再返回，跨调用的解码器句柄、缓存与工作线程必须按库合同独立释放。</desc>
  <defs><marker id="native-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker></defs>
  <style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#1e293b}.title{font-size:26px;font-weight:700}.name{font-size:20px;font-weight:700}.body{font-size:17px}.note{font-size:15px;fill:#475569}.node{fill:#fff;stroke:#94a3b8;stroke-width:1.5}.link{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#native-arrow)}</style>
  <rect width="1000" height="464" fill="#f8fafc"/>
  <text class="title" x="32" y="44">decode 返回，只结束这次调用现场</text>
  <text class="body" x="32" y="76">以 HotSpot 平台线程为例：Java 与 native 帧通常共用 OS 栈。</text>
  <rect x="32" y="104" width="936" height="168" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
  <text class="note" x="52" y="132">同一平台线程 · OS 栈</text>
  <path class="link" d="M304 192H384"/><path class="link" d="M636 192H716"/>
  <path class="link" d="M508 252V312"/>
  <rect class="node" x="52" y="156" width="252" height="76" rx="6"/><text class="name" x="72" y="188">Java decode()</text><text class="note" x="72" y="216">参数与包装对象</text>
  <rect class="node" x="384" y="156" width="252" height="96" rx="6"/><text class="name" x="404" y="188">JNI / C++ decode</text><text class="body" x="404" y="216">临时调用帧</text><text class="note" x="404" y="240">使用跨调用的库资源</text>
  <rect class="node" x="716" y="156" width="232" height="76" rx="6"/><text class="name" x="736" y="188">返回 Java</text><text class="note" x="736" y="216">native 临时帧退出</text>
  <rect x="384" y="312" width="564" height="76" rx="6" fill="#fff7ed" stroke="#c27838"/><text class="name" x="404" y="344">解码器句柄 / native 缓存 / 工作线程</text><text class="note" x="404" y="372">生命周期可跨多次调用，须按库合同 destroy / close / stop</text>
  <text class="body" x="32" y="432">栈帧退出 ≠ 句柄释放。NMT 不完整跟踪第三方库分配，需结合库指标与 OS 观测。</text>
</svg>
