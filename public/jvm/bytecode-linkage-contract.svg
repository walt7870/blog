<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="500" viewBox="0 0 1100 500" role="img" aria-labelledby="bytecode-contract-title bytecode-contract-desc">
  <title id="bytecode-contract-title">编译期调用合同与运行期依赖</title>
  <desc id="bytecode-contract-desc">调用者按 v1 的 Price.cents 返回 int 编译，在 Class 常量池中记录描述符 ()I；运行时只提供返回 long 的 v2，描述符 ()J 不匹配，解析调用时报 NoSuchMethodError。</desc>
  <defs><marker id="bytecode-contract-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" fill="#64748b"/></marker></defs>
  <style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#1e293b}.title{font-size:26px;font-weight:700}.name{font-size:20px;font-weight:700}.body{font-size:17px}.note{font-size:15px;fill:#475569}.code{font:17px Menlo,Consolas,monospace;fill:#334155}.node{fill:#fff;stroke:#94a3b8;stroke-width:1.5}.edge{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#bytecode-contract-arrow)}</style>
  <rect width="1100" height="500" fill="#f8fafc"/>
  <text class="title" x="32" y="44">类找得到，方法合同却对不上</text>
  <text class="body" x="32" y="76">199 元商品价格：API 只把 int 改成 long，旧调用者也需要重新核对兼容性。</text>
  <rect x="32" y="110" width="680" height="250" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
  <text class="name" x="52" y="144">编译时</text>
  <path class="edge" d="M314 246H410"/>
  <rect x="328" y="210" width="70" height="26" fill="#eff6ff"/><text class="note" x="363" y="229" text-anchor="middle">javac</text>
  <rect class="node" x="52" y="176" width="262" height="150" rx="6"/>
  <text class="name" x="72" y="212">v1 · Price</text>
  <text class="code" x="72" y="248">int cents()</text>
  <text class="body" x="72" y="286">方法描述符：()I</text>
  <rect class="node" x="410" y="176" width="282" height="150" rx="6"/>
  <text class="name" x="430" y="212">Checkout.class</text>
  <text class="code" x="430" y="248">Price.cents:()I</text>
  <text class="body" x="430" y="286">调用点保留符号引用</text>
  <rect x="748" y="110" width="320" height="250" rx="8" fill="#fff7ed" stroke="#e4b68b"/>
  <text class="name" x="768" y="144">运行时替换为 v2</text>
  <rect class="node" x="768" y="176" width="280" height="150" rx="6"/>
  <text class="name" x="788" y="212">v2 · Price</text>
  <text class="code" x="788" y="248">long cents()</text>
  <text class="body" x="788" y="286">只提供 ()J，没有 ()I</text>
  <path class="edge" d="M552 326V394Q552 402 560 402H908Q916 402 916 394V326"/>
  <rect x="614" y="368" width="254" height="26" fill="#f8fafc"/>
  <text class="body" x="741" y="388" text-anchor="middle">解析旧调用点：合同不匹配</text>
  <text class="code" x="32" y="452">NoSuchMethodError: 'int Price.cents()'</text>
  <text class="note" x="32" y="482">应比较编译期与运行期依赖及描述符；增大堆、重复添加同名类不能补出缺失的方法。</text>
</svg>
