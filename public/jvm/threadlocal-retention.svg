<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="460" viewBox="0 0 1100 460" role="img" aria-labelledby="tl-retain-title tl-retain-desc">
  <title id="tl-retain-title">线程池中的 ThreadLocal 持有关系</title>
  <desc id="tl-retain-desc">活动线程通过 ThreadLocalMap 的 Entry 强引用 value；Entry 对 ThreadLocal key 使用弱引用。key 被回收不保证 value 立即释放。独立任务退出时清理，嵌套作用域应恢复外层上下文。</desc>
  <defs><marker id="tl-retain-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" fill="#64748b"/></marker></defs>
  <style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#1e293b}.title{font-size:26px;font-weight:700}.name{font-size:20px;font-weight:700}.body{font-size:17px}.note{font-size:15px;fill:#475569}.node{fill:#fff;stroke:#94a3b8;stroke-width:1.5}.edge{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#tl-retain-arrow)}</style>
  <rect width="1100" height="460" fill="#f8fafc"/>
  <text class="title" x="32" y="44">弱 key 不代表 value 也会立即释放</text>
  <text class="body" x="32" y="76">任务结束后，线程池里的活动线程可能继续持有整批订单与请求上下文。</text>
  <path class="edge" d="M230 177H286"/><path class="edge" d="M520 177H576"/><path class="edge" d="M766 177H822"/>
  <path class="edge" d="M671 224V312" stroke-dasharray="5 4"/>
  <rect class="node" x="32" y="130" width="198" height="94" rx="6"/>
  <text class="name" x="52" y="165">活动线程</text><text class="body" x="52" y="198">线程池继续复用</text>
  <rect class="node" x="286" y="130" width="234" height="94" rx="6"/>
  <text class="name" x="306" y="165">ThreadLocalMap</text><text class="body" x="306" y="198">属于该线程</text>
  <rect class="node" x="576" y="130" width="190" height="94" rx="6"/>
  <text class="name" x="596" y="165">Entry</text><text class="body" x="596" y="198">条目尚未清除</text>
  <rect x="822" y="130" width="246" height="94" rx="6" fill="#fff7ed" stroke="#e4b68b" stroke-width="1.5"/>
  <text class="name" x="842" y="165">value：导出上下文</text><text class="body" x="842" y="198">强引用订单列表</text>
  <rect x="572" y="312" width="496" height="104" rx="6" fill="#eff6ff" stroke="#93c5fd"/>
  <text class="name" x="592" y="347">key：ThreadLocal 对象</text><text class="body" x="592" y="382">可被弱引用清除；value 的清理并非同步保证。</text>
  <rect x="688" y="253" width="98" height="28" fill="#f8fafc"/><text class="note" x="702" y="273">弱引用</text>
  <rect x="32" y="286" width="488" height="130" rx="6" fill="#f0fdf4" stroke="#86b49b"/>
  <text class="name" x="52" y="321">释放发生在正确的任务边界</text>
  <text class="body" x="52" y="355">独立任务：同线程 finally 中 remove。</text>
  <text class="body" x="52" y="389">嵌套作用域：退出时恢复外层上下文。</text>
  <text class="note" x="32" y="444">上方实线表示强引用；即使静态字段一直持有 key，遗漏任务清理仍可能造成跨请求残留。</text>
</svg>
