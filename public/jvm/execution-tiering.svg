<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="480" viewBox="0 0 1100 480" role="img" aria-labelledby="jit-tier-title jit-tier-desc">
  <title id="jit-tier-title">HotSpot 编译与去优化关系</title>
  <desc id="jit-tier-desc">解释器和已编译代码都可提供热点信息，策略选择编译任务，生成的机器码放入 Code Cache。假设失效时可恢复解释状态，OSR 可在长循环中切入编译代码。每个方法不必固定经过所有层级。</desc>
  <defs><marker id="jit-tier-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" fill="#64748b"/></marker></defs>
  <style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#1e293b}.title{font-size:26px;font-weight:700}.name{font-size:20px;font-weight:700}.body{font-size:17px}.note{font-size:15px;fill:#475569}.node{fill:#fff;stroke:#94a3b8;stroke-width:1.5}.edge{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#jit-tier-arrow)}</style>
  <rect width="1100" height="480" fill="#f8fafc"/>
  <text class="title" x="32" y="44">同一个方法，可以拥有不同执行形态</text>
  <text class="body" x="32" y="76">常见 HotSpot 分层机制示意；具体层级、顺序与是否编译由配置和负载决定。</text>
  <path class="edge" d="M260 181H350"/><path class="edge" d="M600 181H690"/>
  <path class="edge" d="M920 230V280Q920 288 912 288H153Q145 288 145 280V230"/>
  <rect x="400" y="274" width="298" height="28" fill="#f8fafc"/><text class="note" x="414" y="294">假设失效：恢复状态、必要时重编译</text>
  <rect class="node" x="32" y="132" width="228" height="98" rx="8"/>
  <text class="name" x="52" y="166">解释器执行</text><text class="body" x="52" y="201">执行字节码并收集信息</text>
  <rect x="350" y="132" width="250" height="98" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text class="name" x="370" y="166">编译策略与任务</text><text class="body" x="370" y="201">选择 C1 / C2、层级与时机</text>
  <rect x="690" y="132" width="378" height="98" rx="8" fill="#f0fdf4" stroke="#86b49b" stroke-width="1.5"/>
  <text class="name" x="710" y="166">编译代码执行</text><text class="body" x="710" y="201">机器码存于 Code Cache，可继续采样</text>
  <rect x="264" y="166" width="82" height="28" fill="#f8fafc"/><text class="note" x="275" y="186">热点信息</text>
  <rect x="604" y="166" width="82" height="28" fill="#f8fafc"/><text class="note" x="615" y="186">产出代码</text>
  <rect class="node" x="32" y="336" width="498" height="98" rx="6"/>
  <text class="name" x="52" y="370">普通入口与 OSR 入口</text><text class="body" x="52" y="405">下一次调用进入；或长循环执行中切入。</text>
  <rect class="node" x="570" y="336" width="498" height="98" rx="6"/>
  <text class="name" x="590" y="370">不是固定流水线</text><text class="body" x="590" y="405">冷方法可一直解释，方法也可跳过某些层级。</text>
  <text class="note" x="32" y="464">代码失效不自动等于业务故障；需要与请求延迟、CPU、GC 和系统限额对齐。</text>
</svg>
