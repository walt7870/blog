<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="488" viewBox="0 0 1000 488" role="img" aria-labelledby="direct-memory-title direct-memory-desc">
  <title id="direct-memory-title">直接缓冲区与其他堆外分配的边界</title>
  <desc id="direct-memory-desc">堆中的 DirectByteBuffer 及其视图引用同一堆外数据，文件映射和 JNI 分配使用不同的预算和释放协议。</desc>
  <defs><marker id="direct-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker></defs>
  <style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#1e293b}.title{font-size:26px;font-weight:700}.name{font-size:20px;font-weight:700}.body{font-size:17px}.note{font-size:15px;fill:#475569}.node{fill:#fff;stroke:#94a3b8;stroke-width:1.5}.link{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#direct-arrow)}</style>
  <rect width="1000" height="488" fill="#f8fafc"/>
  <text class="title" x="32" y="44">堆里的是 buffer 对象，堆外的是数据</text>
  <text class="body" x="32" y="76">MaxDirectMemorySize 管 JDK direct 容量预算，不能当作全部堆外内存上限。</text>
  <rect x="32" y="104" width="292" height="300" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
  <text class="name" x="52" y="136">Java 堆</text>
  <rect x="448" y="104" width="520" height="300" rx="8" fill="#f0fdf4" stroke="#86b49b"/>
  <text class="name" x="468" y="136">堆外 / 进程地址空间</text>
  <path class="link" d="M304 212H472"/><path class="link" d="M304 332H352Q360 332 360 324V264Q360 256 368 256H472"/>
  <rect class="node" x="52" y="168" width="252" height="84" rx="6"/><text class="name" x="68" y="200">DirectByteBuffer</text><text class="note" x="68" y="228">分配拥有者与清理关联</text>
  <rect class="node" x="52" y="288" width="252" height="84" rx="6"/><text class="name" x="68" y="320">duplicate / slice 视图</text><text class="note" x="68" y="348">继续保留共享数据区</text>
  <rect x="472" y="168" width="208" height="204" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text class="name" x="488" y="204">direct 数据区</text><text class="body" x="488" y="240">JDK direct 预算</text><text class="note" x="488" y="272">direct BufferPool</text><text class="note" x="488" y="308">所有相关引用退出后</text><text class="note" x="488" y="336">才可能触发清理</text>
  <rect class="node" x="704" y="168" width="240" height="92" rx="6"/><text class="name" x="720" y="200">文件映射</text><text class="note" x="720" y="228">mapped 池与 OS 页驻留</text>
  <rect class="node" x="704" y="284" width="240" height="88" rx="6"/><text class="name" x="720" y="316">JNI / native 库</text><text class="note" x="720" y="344">库接口管理分配、池与释放</text>
  <text class="body" x="32" y="444">箭头：共享数据引用。右侧两类分配独立观察，不保证进入 direct 池或受其上限控制。</text>
  <text class="note" x="32" y="472">Netty 还要核对具体 allocator 路径、活动分配和池保留量；归还池不保证 RSS 立即下降。</text>
</svg>
