<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="520" viewBox="0 0 1120 520" role="img" aria-labelledby="android-jdk-title android-jdk-desc"><title id="android-jdk-title">Android 构建：运行环境、编译与设备 API</title><desc id="android-jdk-desc">IDE 的 JBR 运行 Studio，Gradle JVM 运行 AGP，toolchain 编译源代码；Android SDK 提供符号，minSdk 与脱糖限制设备可用能力。</desc><defs><marker id="android-jdk-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#54778a"/></marker></defs><style>text{font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#183248}.h{font-size:28px;font-weight:700}.n{font-size:21px;font-weight:700}.b{font-size:18px}.s{font-size:16px;fill:#526877}.box{fill:#fff;stroke:#b8cad5;stroke-width:1.5}.focus{fill:#e5f4ef;stroke:#27846b;stroke-width:2}.edge{fill:none;stroke:#54778a;stroke-width:2;marker-end:url(#android-jdk-arrow)}</style><rect width="1120" height="520" fill="#f4f8fa"/><text class="h" x="36" y="50">Android 构建：运行环境、编译与设备 API</text>
<text class="b" x="36" y="84">先找失败环节；切换 IDE 的 Runtime 不等于切换 Gradle 或目标设备能力。</text>
<path class="edge" d="M240 192H304"/><path class="edge" d="M580 192H644"/><path class="edge" d="M900 192H964"/>
<path class="edge" d="M772 350V258"/>
<rect class="box" x="36" y="130" width="204" height="128" rx="6"/><text class="n" x="56" y="168">IDE / 终端入口</text><text class="b" x="56" y="204">JBR 运行 Studio</text><text class="s" x="56" y="235">启动构建，不是编译目标</text>
<rect class="focus" x="304" y="130" width="276" height="128" rx="6"/><text class="n" x="324" y="168">Gradle Daemon JVM</text><text class="b" x="324" y="204">运行 Gradle 与 AGP</text><text class="s" x="324" y="235">criteria 或 JDK 设置选定</text>
<rect class="box" x="644" y="130" width="256" height="128" rx="6"/><text class="n" x="664" y="168">Java toolchain</text><text class="b" x="664" y="204">编译源代码 → class</text><text class="s" x="664" y="235">source / target 约束格式</text>
<rect class="box" x="964" y="130" width="120" height="128" rx="6"/><text class="n" x="984" y="168">D8 / R8</text><text class="b" x="984" y="204">DEX</text><text class="s" x="984" y="235">设备执行</text>
<rect class="box" x="644" y="350" width="440" height="100" rx="6"/><text class="n" x="664" y="387">Android SDK / compileSdk</text><text class="b" x="664" y="423">提供编译符号；设备可用性另看 minSdk / 脱糖</text>
<text class="n" x="36" y="337">订单应用的排错顺序</text><text class="b" x="36" y="375">Sync 失败：查 JVM、AGP 与 Wrapper</text><text class="b" x="36" y="411">API 飘红：查 Sync 模型、SDK 与依赖</text><text class="s" x="36" y="485">编译通过不代表低版本设备支持新 API；目标设备运行验证仍然必要。</text></svg>
