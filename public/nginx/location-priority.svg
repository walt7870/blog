<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="630" viewBox="0 0 1120 630" role="img" aria-labelledby="location-title location-desc">
<title id="location-title">同层传统location匹配的条件分支</title>
<desc id="location-desc">精确命中立即使用，否则记录最长前缀，最长前缀带^~时使用它，否则按顺序检查正则，命中用正则，未命中用记住的最长前缀。本图不覆盖嵌套和其他扩展匹配形式。</desc>
<defs><marker id="location-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#7d898c"/></marker><style>text{font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#253238}.h{font-size:25px;font-weight:700}.n{font-size:21px;font-weight:600}.b{font-size:18px;fill:#4d5d63}.box{fill:#fff;stroke:#c7d0d3;stroke-width:1.5}.edge{fill:none;stroke:#7d898c;stroke-width:1.5;marker-end:url(#location-arrow)}</style></defs>
<rect width="1120" height="630" fill="#f7f9fa"/>
<text class="h" x="36" y="46">先判断是否停止，再决定是否继续检查正则</text>
<text class="b" x="36" y="82">限定同层传统规则：无精确匹配后，先记录最长匹配前缀，再判断它是否带 ^~。</text>
<path class="edge" d="M180 222V176"/><path class="edge" d="M500 222V176"/><path class="edge" d="M852 222V176"/>
<path class="edge" d="M306 286H364"/><path class="edge" d="M636 286H716"/><path class="edge" d="M852 350V410"/>
<rect class="box" x="54" y="118" width="252" height="58" rx="6"/><text class="n" x="180" y="154" text-anchor="middle">使用精确位置</text>
<rect x="364" y="118" width="272" height="58" rx="6" fill="#e7f3ef" stroke="#69978c" stroke-width="1.5"/><text class="n" x="500" y="154" text-anchor="middle">使用最长前缀</text>
<rect class="box" x="716" y="118" width="272" height="58" rx="6"/><text class="n" x="852" y="154" text-anchor="middle">使用第一个命中正则</text>
<path d="M180 222L306 286L180 350L54 286Z" class="box"/>
<text class="n" x="180" y="280" text-anchor="middle">精确 =</text><text class="b" x="180" y="310" text-anchor="middle">是否命中？</text>
<path d="M500 222L636 286L500 350L364 286Z" fill="#eff5fc" stroke="#a4b9cc" stroke-width="1.5"/>
<text class="n" x="500" y="280" text-anchor="middle">最长前缀</text><text class="b" x="500" y="310" text-anchor="middle">是否带 ^~？</text>
<path d="M852 222L988 286L852 350L716 286Z" class="box"/>
<text class="n" x="852" y="280" text-anchor="middle">按顺序查正则</text><text class="b" x="852" y="310" text-anchor="middle">是否命中？</text>
<text class="b" x="194" y="202">是</text><text class="b" x="514" y="202">是</text><text class="b" x="866" y="202">是</text>
<text class="b" x="328" y="272">否</text><text class="b" x="662" y="272">否</text><text class="b" x="866" y="386">否</text>
<rect x="716" y="410" width="272" height="66" rx="6" fill="#e7f3ef" stroke="#69978c" stroke-width="1.5"/><text class="n" x="852" y="450" text-anchor="middle">使用记住的最长前缀</text>
<path d="M36 518H1084" stroke="#c7d0d3"/>
<text class="b" x="36" y="554">/api/report.csv：最长前缀若是 ^~ /api/，不会被扩展名正则抢走。</text>
<text class="b" x="36" y="594">嵌套逐层搜索、内部跳转和版本扩展需要单独复现；较短的 ^~ 不能代替最长前缀作决定。</text>
</svg>
