<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="630" viewBox="0 0 1120 630" role="img" aria-labelledby="cert-title cert-desc">
<title id="cert-title">证书续期从签发到公网生效的证据链</title>
<desc id="cert-desc">专用账户按计划执行ACME客户端，经DNS-01域名验证完成CA签发，部署fullchain和私钥，配置测试并reload，最后建立新TLS连接验证。私钥由客户端本地管理，不由CA生成。</desc>
<defs><marker id="cert-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#7d898c"/></marker><style>text{font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#253238}.h{font-size:25px;font-weight:700}.n{font-size:21px;font-weight:600}.b{font-size:18px;fill:#4d5d63}.box{fill:#fff;stroke:#c7d0d3;stroke-width:1.5}.edge{fill:none;stroke:#7d898c;stroke-width:1.5;marker-end:url(#cert-arrow)}</style></defs>
<rect width="1120" height="630" fill="#f7f9fa"/>
<text class="h" x="36" y="46">签发、部署、加载、握手，各自都要有成功证据</text>
<text class="b" x="36" y="82">测试CA与正式CA隔离；CA签发证书，私钥留在客户端及必要的部署端。</text>
<path class="edge" d="M324 206H416"/><path class="edge" d="M704 206H800"/>
<path class="edge" d="M942 278V402Q942 410 934 410H704"/><path class="edge" d="M416 410H324"/>
<rect class="box" x="36" y="134" width="288" height="144" rx="6"/>
<text class="n" x="54" y="170">定时ACME客户端</text><text class="b" x="54" y="208">专用身份 / home / 日志</text><text class="b" x="54" y="242">判断是否进入续期窗口</text>
<rect class="box" x="416" y="134" width="288" height="144" rx="6"/>
<text class="n" x="434" y="170">DNS-01与CA签发</text><text class="b" x="434" y="208">插件写TXT，CA验证域名</text><text class="b" x="434" y="242">核对权威记录与签发状态</text>
<rect x="800" y="134" width="284" height="144" rx="6" fill="#eff5fc" stroke="#a4b9cc" stroke-width="1.5"/>
<text class="n" x="818" y="170">固定部署目录</text><text class="b" x="818" y="208">install-cert复制链与私钥</text><text class="b" x="818" y="242">权限 / 路径 / 密钥配对</text>
<rect class="box" x="416" y="338" width="288" height="144" rx="6"/>
<text class="n" x="434" y="374">Nginx配置测试与加载</text><text class="b" x="434" y="412">真实二进制 / 配置 / unit</text><text class="b" x="434" y="446">hook失败：磁盘新、运行旧</text>
<rect x="36" y="338" width="288" height="144" rx="6" fill="#e7f3ef" stroke="#69978c" stroke-width="1.5"/>
<text class="n" x="54" y="374">新TLS连接验收</text><text class="b" x="54" y="412">SNI / 主机名 / 信任链</text><text class="b" x="54" y="446">指纹、有效期与多副本</text>
<path d="M36 518H1084" stroke="#c7d0d3"/>
<text class="b" x="36" y="554">DNS API权限与凭据需要受控；测试证书不部署到正式入口，force续期不是模拟。</text>
<text class="b" x="36" y="594">有CDN或负载均衡时分别验收TLS终止层与源站；定时任务存在不代表续期链可用。</text>
</svg>
