<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="630" viewBox="0 0 1120 630" role="img" aria-labelledby="request-title request-desc">
<title id="request-title">订单网站的Nginx请求路径</title>
<desc id="request-desc">请求按监听组、TLS SNI和HTTP名称进入站点，再按规范化URI选择location，静态资源读文件，API代理到订单服务，响应产生访问和错误证据；内部跳转可能重新选择location。</desc>
<defs><marker id="request-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#7d898c"/></marker><style>text{font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#253238}.h{font-size:25px;font-weight:700}.n{font-size:21px;font-weight:600}.b{font-size:18px;fill:#4d5d63}.box{fill:#fff;stroke:#c7d0d3;stroke-width:1.5}.edge{fill:none;stroke:#7d898c;stroke-width:1.5;marker-end:url(#request-arrow)}</style></defs>
<rect width="1120" height="630" fill="#f7f9fa"/>
<text class="h" x="36" y="46">同一个订单域名，文件与业务接口走不同处理路径</text>
<text class="b" x="36" y="82">先确认流量实际经过的入口，再区分站点选择、URI选择和上游业务结果。</text>
<path class="edge" d="M230 284H280"/><path class="edge" d="M508 284H558"/>
<path class="edge" d="M786 258H814Q822 258 822 250V194Q822 186 830 186H858"/>
<path class="edge" d="M786 310H838Q846 310 846 318V378Q846 386 854 386H858"/>
<rect class="box" x="36" y="216" width="194" height="136" rx="6"/>
<text class="n" x="54" y="254">客户端请求</text><text class="b" x="54" y="292">端口 / 名称 / URI</text><text class="b" x="54" y="328">可能先经CDN或LB</text>
<rect class="box" x="280" y="216" width="228" height="136" rx="6"/>
<text class="n" x="298" y="254">server选择</text><text class="b" x="298" y="292">监听组 / SNI / Host</text><text class="b" x="298" y="328">未匹配时用默认站点</text>
<rect x="558" y="216" width="228" height="136" rx="6" fill="#eff5fc" stroke="#a4b9cc" stroke-width="1.5"/>
<text class="n" x="576" y="254">location选择</text><text class="b" x="576" y="292">规范化URI / 匹配规则</text><text class="b" x="576" y="328">内部跳转可能重新选择</text>
<rect class="box" x="858" y="118" width="226" height="136" rx="6"/>
<text class="n" x="876" y="156">静态资源与页面</text><text class="b" x="876" y="194">root / alias / try_files</text><text class="b" x="876" y="230">资源404，页面路由回退</text>
<rect x="858" y="318" width="226" height="136" rx="6" fill="#e7f3ef" stroke="#69978c" stroke-width="1.5"/>
<text class="n" x="876" y="356">订单服务</text><text class="b" x="876" y="394">proxy_pass / 路径合同</text><text class="b" x="876" y="430">接口状态与业务结果</text>
<path d="M36 500H1084" stroke="#c7d0d3"/>
<text class="n" x="36" y="542">响应证据</text><text class="b" x="180" y="542">访问状态、请求耗时、上游地址与状态，结合error log定位失败阶段。</text>
<text class="b" x="36" y="586">配置测试通过不代表已生效；reload后用新请求验证，旧连接可能仍由旧worker处理。</text>
</svg>
