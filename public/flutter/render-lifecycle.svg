<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="580" viewBox="0 0 1120 580" role="img" aria-labelledby="render-lifecycle-t render-lifecycle-d"><title id="render-lifecycle-t">配置与运行时对象不是一一对应</title><desc id="render-lifecycle-d">先协调Widget配置，再按变化执行布局和绘制。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#607568"/></marker><style>text{font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;letter-spacing:0;fill:#253c30}.h{font-size:28px;font-weight:600}.n{font-size:21px;font-weight:600}.s{font-size:18px;fill:#52685b}.node{fill:white;stroke:#a6b9ad;stroke-width:1.5}.focus{fill:#e9f4ee;stroke:#397657;stroke-width:1.5}.info{fill:#edf3fb;stroke:#739bbf;stroke-width:1.5}.edge{fill:none;stroke:#607568;stroke-width:2;marker-end:url(#a)}</style></defs><rect width="1120" height="580" fill="white"/><text x="32" y="44" class="h">配置与运行时对象不是一一对应</text><text x="32" y="82" class="s">先协调Widget配置，再按变化执行布局和绘制。</text><path d="M336 190H408" class="edge"/><path d="M712 190H784" class="edge"/><path d="M936 250V344" class="edge"/><path d="M784 404H712" class="edge"/><g data-node="Widget配置"><rect x="32" y="130" width="304" height="120" rx="6" class="node"/><text x="50" y="162" class="n">Widget配置</text><text x="50" y="194" class="s">不可变参数与组件组合</text><text x="50" y="220" class="s">build可以频繁调用</text></g><g data-node="Element与State"><rect x="408" y="130" width="304" height="120" rx="6" class="focus"/><text x="426" y="162" class="n">Element与State</text><text x="426" y="194" class="s">保留位置、依赖和状态</text><text x="426" y="220" class="s">按类型与Key协调身份</text></g><g data-node="RenderObject"><rect x="784" y="130" width="304" height="120" rx="6" class="node"/><text x="802" y="162" class="n">RenderObject</text><text x="802" y="194" class="s">部分Element关联渲染对象</text><text x="802" y="220" class="s">约束、尺寸、布局与绘制</text></g><g data-node="引擎与宿主"><rect x="784" y="344" width="304" height="120" rx="6" class="node"/><text x="802" y="376" class="n">引擎与宿主</text><text x="802" y="408" class="s">合成、栅格与平台呈现</text><text x="802" y="434" class="s">线程组织依版本与平台</text></g><g data-node="真实帧证据"><rect x="408" y="344" width="304" height="120" rx="6" class="info"/><text x="426" y="376" class="n">真实帧证据</text><text x="426" y="408" class="s">UI与Raster轨迹及设备</text><text x="426" y="434" class="s">重建不等于整屏重绘</text></g><text x="32" y="378" class="n">业务事件 → 状态赋值</text><text x="32" y="414" class="s">setState标记需要更新</text><text x="32" y="446" class="s">异步回调先确认身份与寿命</text><text x="32" y="544" class="s">不是每个Widget都有独立RenderObject，const也不是永不重建的保证。</text></svg>
