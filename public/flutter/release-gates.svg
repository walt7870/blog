<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="580" viewBox="0 0 1120 580" role="img" aria-labelledby="release-gates-t release-gates-d"><title id="release-gates-t">同一应用版本从基线到灰度与恢复</title><desc id="release-gates-d">Android通过不代表iOS签名或Web行为已经验收。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#607568"/></marker><style>text{font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;letter-spacing:0;fill:#253c30}.h{font-size:28px;font-weight:600}.n{font-size:21px;font-weight:600}.s{font-size:18px;fill:#52685b}.node{fill:white;stroke:#a6b9ad;stroke-width:1.5}.focus{fill:#e9f4ee;stroke:#397657;stroke-width:1.5}.info{fill:#edf3fb;stroke:#739bbf;stroke-width:1.5}.edge{fill:none;stroke:#607568;stroke-width:2;marker-end:url(#a)}</style></defs><rect width="1120" height="580" fill="white"/><text x="32" y="44" class="h">同一应用版本从基线到灰度与恢复</text><text x="32" y="82" class="s">Android通过不代表iOS签名或Web行为已经验收。</text><path d="M336 190H408" class="edge"/><path d="M712 190H784" class="edge"/><path d="M936 250V344" class="edge"/><path d="M784 404H712" class="edge"/><path d="M408 404H336" class="edge"/><g data-node="固定工程输入"><rect x="32" y="130" width="304" height="120" rx="6" class="node"/><text x="50" y="162" class="n">固定工程输入</text><text x="50" y="194" class="s">提交、SDK revision与锁</text><text x="50" y="220" class="s">原生工具链和目标范围</text></g><g data-node="环境与初始化"><rect x="408" y="130" width="304" height="120" rx="6" class="focus"/><text x="426" y="162" class="n">环境与初始化</text><text x="426" y="194" class="s">地址、应用ID和配置</text><text x="426" y="220" class="s">dart-define不是秘密存储</text></g><g data-node="质量与真实设备"><rect x="784" y="130" width="304" height="120" rx="6" class="node"/><text x="802" y="162" class="n">质量与真实设备</text><text x="802" y="194" class="s">格式、分析、Widget测试</text><text x="802" y="220" class="s">权限、升级与弱网恢复</text></g><g data-node="生成签名产物"><rect x="784" y="344" width="304" height="120" rx="6" class="node"/><text x="802" y="376" class="n">生成签名产物</text><text x="802" y="408" class="s">版本、校验与签名身份</text><text x="802" y="434" class="s">验收和交付对应同一包</text></g><g data-node="保留符号并灰度"><rect x="408" y="344" width="304" height="120" rx="6" class="info"/><text x="426" y="376" class="n">保留符号并灰度</text><text x="426" y="408" class="s">Dart符号与原生mapping</text><text x="426" y="434" class="s">按版本、系统和设备观察</text></g><g data-node="停止扩大与修复"><rect x="32" y="344" width="304" height="120" rx="6" class="node"/><text x="50" y="376" class="n">停止扩大与修复</text><text x="50" y="408" class="s">服务兼容、开关和新版本</text><text x="50" y="434" class="s">商店客户端不能立即降级</text></g><text x="32" y="544" class="s">发布前验证符号化与数据迁移；签名秘密不进入仓库或日志。</text></svg>
