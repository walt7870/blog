<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="580" viewBox="0 0 1120 580" role="img" aria-labelledby="diagnostic-evidence-t diagnostic-evidence-d"><title id="diagnostic-evidence-t">按失败阶段进入Flutter排查证据</title><desc id="diagnostic-evidence-d">两行分别表示构建链路与运行链路，不把全部问题都归入清缓存。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#607568"/></marker><style>text{font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;letter-spacing:0;fill:#253c30}.h{font-size:28px;font-weight:600}.n{font-size:21px;font-weight:600}.s{font-size:18px;fill:#52685b}.node{fill:white;stroke:#a6b9ad;stroke-width:1.5}.focus{fill:#e9f4ee;stroke:#397657;stroke-width:1.5}.info{fill:#edf3fb;stroke:#739bbf;stroke-width:1.5}.edge{fill:none;stroke:#607568;stroke-width:2;marker-end:url(#a)}</style></defs><rect width="1120" height="580" fill="white"/><text x="32" y="44" class="h">按失败阶段进入Flutter排查证据</text><text x="32" y="82" class="s">两行分别表示构建链路与运行链路，不把全部问题都归入清缓存。</text><path d="M336 190H408" class="edge"/><path d="M712 190H784" class="edge"/><path d="M336 404H408" class="edge"/><path d="M712 404H784" class="edge"/><g data-node="环境或依赖失败"><rect x="32" y="130" width="304" height="120" rx="6" class="node"/><text x="50" y="162" class="n">环境或依赖失败</text><text x="50" y="194" class="s">SDK、目标与版本约束</text><text x="50" y="220" class="s">保留锁文件和原始命令</text></g><g data-node="构建证据"><rect x="408" y="130" width="304" height="120" rx="6" class="focus"/><text x="426" y="162" class="n">构建证据</text><text x="426" y="194" class="s">doctor、deps与首条错误</text><text x="426" y="220" class="s">Gradle/Xcode或链接日志</text></g><g data-node="定向修复"><rect x="784" y="130" width="304" height="120" rx="6" class="node"/><text x="802" y="162" class="n">定向修复</text><text x="802" y="194" class="s">核对平台、ABI与插件</text><text x="802" y="220" class="s">重跑原失败构建和安装</text></g><g data-node="运行、布局或性能"><rect x="32" y="344" width="304" height="120" rx="6" class="node"/><text x="50" y="376" class="n">运行、布局或性能</text><text x="50" y="408" class="s">状态、约束、异步与资源</text><text x="50" y="434" class="s">记录设备、模式与复现步骤</text></g><g data-node="实际轨迹"><rect x="408" y="344" width="304" height="120" rx="6" class="info"/><text x="426" y="376" class="n">实际轨迹</text><text x="426" y="408" class="s">请求计数、Inspector</text><text x="426" y="434" class="s">真机profile与帧耗时</text></g><g data-node="测试与复验"><rect x="784" y="344" width="304" height="120" rx="6" class="node"/><text x="802" y="376" class="n">测试与复验</text><text x="802" y="408" class="s">重建、竞态、字号与弱网</text><text x="802" y="434" class="s">用原路径证明修复成立</text></g><text x="32" y="544" class="s">debug不能代表发布性能；mounted也不能证明结果属于最新请求。</text></svg>
