<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="580" viewBox="0 0 1120 580" role="img" aria-labelledby="cache-sync-boundaries-t cache-sync-boundaries-d"><title id="cache-sync-boundaries-t">离线编辑与服务器事实的同步边界</title><desc id="cache-sync-boundaries-d">账号A离线修改任务42，恢复网络后仍可能遇到版本冲突。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#607568"/></marker><style>text{font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;letter-spacing:0;fill:#253c30}.h{font-size:28px;font-weight:600}.n{font-size:21px;font-weight:600}.s{font-size:18px;fill:#52685b}.node{fill:white;stroke:#a6b9ad;stroke-width:1.5}.focus{fill:#e9f4ee;stroke:#397657;stroke-width:1.5}.info{fill:#edf3fb;stroke:#739bbf;stroke-width:1.5}.edge{fill:none;stroke:#607568;stroke-width:2;marker-end:url(#a)}</style></defs><rect width="1120" height="580" fill="white"/><text x="32" y="44" class="h">离线编辑与服务器事实的同步边界</text><text x="32" y="82" class="s">账号A离线修改任务42，恢复网络后仍可能遇到版本冲突。</text><path d="M336 190H408" class="edge"/><path d="M712 190H784" class="edge"/><path d="M936 250V344" class="edge"/><path d="M784 404H712" class="edge"/><path d="M408 404H336" class="edge"/><g data-node="本地编辑"><rect x="32" y="130" width="304" height="120" rx="6" class="node"/><text x="50" y="162" class="n">本地编辑</text><text x="50" y="194" class="s">账号、任务ID、基准版本</text><text x="50" y="220" class="s">草稿与操作ID原子保存</text></g><g data-node="持久待同步队列"><rect x="408" y="130" width="304" height="120" rx="6" class="focus"/><text x="426" y="162" class="n">持久待同步队列</text><text x="426" y="194" class="s">记录待同步与结果未知</text><text x="426" y="220" class="s">按受控并发发送</text></g><g data-node="服务端条件更新"><rect x="784" y="130" width="304" height="120" rx="6" class="node"/><text x="802" y="162" class="n">服务端条件更新</text><text x="802" y="194" class="s">校验版本、权限与幂等</text><text x="802" y="220" class="s">不是客户端禁用按钮就够</text></g><g data-node="确定结果或冲突"><rect x="784" y="344" width="304" height="120" rx="6" class="node"/><text x="802" y="376" class="n">确定结果或冲突</text><text x="802" y="408" class="s">成功确认、版本冲突</text><text x="802" y="434" class="s">超时先按操作ID查状态</text></g><g data-node="更新本地与页面"><rect x="408" y="344" width="304" height="120" rx="6" class="info"/><text x="426" y="376" class="n">更新本地与页面</text><text x="426" y="408" class="s">确认后更新版本和队列</text><text x="426" y="434" class="s">冲突保留两方内容</text></g><g data-node="账号与进程边界"><rect x="32" y="344" width="304" height="120" rx="6" class="node"/><text x="50" y="376" class="n">账号与进程边界</text><text x="50" y="408" class="s">隔离旧缓存和请求</text><text x="50" y="434" class="s">重启恢复未确认操作</text></g><text x="32" y="544" class="s">示意策略需要本地事务与服务端合同配合，内存状态不能承诺掉电恢复。</text></svg>
