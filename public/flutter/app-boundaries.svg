<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="580" viewBox="0 0 1120 580" role="img" aria-labelledby="app-boundaries-t app-boundaries-d"><title id="app-boundaries-t">待办操作从页面到数据，再回到屏幕</title><desc id="app-boundaries-d">共享UI不等于抹去数据、资源和平台边界。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#607568"/></marker><style>text{font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;letter-spacing:0;fill:#253c30}.h{font-size:28px;font-weight:600}.n{font-size:21px;font-weight:600}.s{font-size:18px;fill:#52685b}.node{fill:white;stroke:#a6b9ad;stroke-width:1.5}.focus{fill:#e9f4ee;stroke:#397657;stroke-width:1.5}.info{fill:#edf3fb;stroke:#739bbf;stroke-width:1.5}.edge{fill:none;stroke:#607568;stroke-width:2;marker-end:url(#a)}</style></defs><rect width="1120" height="580" fill="white"/><text x="32" y="44" class="h">待办操作从页面到数据，再回到屏幕</text><text x="32" y="82" class="s">共享UI不等于抹去数据、资源和平台边界。</text><path d="M336 190H408" class="edge"/><path d="M712 190H784" class="edge"/><path d="M936 250V344" class="edge"/><path d="M784 404H712" class="edge"/><path d="M408 404H336" class="edge"/><g data-node="用户操作"><rect x="32" y="130" width="304" height="120" rx="6" class="node"/><text x="50" y="162" class="n">用户操作</text><text x="50" y="194" class="s">点击完成、刷新或重试</text><text x="50" y="220" class="s">页面状态表达当前动作</text></g><g data-node="状态与请求"><rect x="408" y="130" width="304" height="120" rx="6" class="focus"/><text x="426" y="162" class="n">状态与请求</text><text x="426" y="194" class="s">明确Future与任务归属</text><text x="426" y="220" class="s">不在build中创建请求</text></g><g data-node="Repository边界"><rect x="784" y="130" width="304" height="120" rx="6" class="node"/><text x="802" y="162" class="n">Repository边界</text><text x="802" y="194" class="s">接口、缓存、解析与错误</text><text x="802" y="220" class="s">账号隔离和业务规则</text></g><g data-node="状态结果"><rect x="784" y="344" width="304" height="120" rx="6" class="node"/><text x="802" y="376" class="n">状态结果</text><text x="802" y="408" class="s">成功、空、失败或冲突</text><text x="802" y="434" class="s">旧响应不能覆盖新查询</text></g><g data-node="框架与屏幕"><rect x="408" y="344" width="304" height="120" rx="6" class="info"/><text x="426" y="376" class="n">框架与屏幕</text><text x="426" y="408" class="s">配置更新、布局与绘制</text><text x="426" y="434" class="s">只处理需要变化的工作</text></g><g data-node="实际平台验收"><rect x="32" y="344" width="304" height="120" rx="6" class="node"/><text x="50" y="376" class="n">实际平台验收</text><text x="50" y="408" class="s">权限、返回、性能与发布</text><text x="50" y="434" class="s">各目标系统分别验证</text></g><text x="32" y="544" class="s">总览定位责任；机制、动手、实战、交付与排错分别深入。</text></svg>
