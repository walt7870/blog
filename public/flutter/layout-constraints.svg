<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="580" viewBox="0 0 1120 580" role="img" aria-labelledby="layout-constraints-t layout-constraints-d"><title id="layout-constraints-t">长标题如何获得有限宽度并完成布局</title><desc id="layout-constraints-d">父级传约束，子级返回尺寸，父级安排位置。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#607568"/></marker><style>text{font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;letter-spacing:0;fill:#253c30}.h{font-size:28px;font-weight:600}.n{font-size:21px;font-weight:600}.s{font-size:18px;fill:#52685b}.node{fill:white;stroke:#a6b9ad;stroke-width:1.5}.focus{fill:#e9f4ee;stroke:#397657;stroke-width:1.5}.info{fill:#edf3fb;stroke:#739bbf;stroke-width:1.5}.edge{fill:none;stroke:#607568;stroke-width:2;marker-end:url(#a)}</style></defs><rect width="1120" height="580" fill="white"/><text x="32" y="44" class="h">长标题如何获得有限宽度并完成布局</text><text x="32" y="82" class="s">父级传约束，子级返回尺寸，父级安排位置。</text><path d="M336 190H408" class="edge"/><path d="M712 190H784" class="edge"/><path d="M936 250V344" class="edge"/><path d="M784 404H712" class="edge"/><g data-node="屏幕与父容器"><rect x="32" y="130" width="304" height="120" rx="6" class="node"/><text x="50" y="162" class="n">屏幕与父容器</text><text x="50" y="194" class="s">有限可用宽度、内边距</text><text x="50" y="220" class="s">键盘与字号会改变需求</text></g><g data-node="Row分配剩余宽度"><rect x="408" y="130" width="304" height="120" rx="6" class="focus"/><text x="426" y="162" class="n">Row分配剩余宽度</text><text x="426" y="194" class="s">图标和按钮占用一部分</text><text x="426" y="220" class="s">Expanded约束标题区域</text></g><g data-node="Text在约束内排版"><rect x="784" y="130" width="304" height="120" rx="6" class="node"/><text x="802" y="162" class="n">Text在约束内排版</text><text x="802" y="194" class="s">换行或有意截断摘要</text><text x="802" y="220" class="s">关键金额不能静默隐藏</text></g><g data-node="返回Size与定位"><rect x="784" y="344" width="304" height="120" rx="6" class="node"/><text x="802" y="376" class="n">返回Size与定位</text><text x="802" y="408" class="s">子级给出合法尺寸</text><text x="802" y="434" class="s">父级决定最终摆放位置</text></g><g data-node="滚动与无限约束"><rect x="408" y="344" width="304" height="120" rx="6" class="info"/><text x="426" y="376" class="n">滚动与无限约束</text><text x="426" y="408" class="s">竖向滚动内无有限剩余高</text><text x="426" y="434" class="s">不能照搬Column+Expanded</text></g><text x="32" y="380" class="n">复验输入</text><text x="32" y="416" class="s">长文本、字号放大、横屏</text><text x="32" y="448" class="s">定位约束来源后再调整</text><text x="32" y="544" class="s">不是给所有组件补固定高度；滚动场景可改用适合的sliver结构。</text></svg>
