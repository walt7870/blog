<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="580" viewBox="0 0 1120 580" role="img" aria-labelledby="request-lifecycle-t request-lifecycle-d"><title id="request-lifecycle-t">请求Future绑定页面生命周期</title><desc id="request-lifecycle-d">普通重建消费原Future，显式重试才替换它。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#607568"/></marker><style>text{font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;letter-spacing:0;fill:#253c30}.h{font-size:28px;font-weight:600}.n{font-size:21px;font-weight:600}.s{font-size:18px;fill:#52685b}.node{fill:white;stroke:#a6b9ad;stroke-width:1.5}.focus{fill:#e9f4ee;stroke:#397657;stroke-width:1.5}.info{fill:#edf3fb;stroke:#739bbf;stroke-width:1.5}.edge{fill:none;stroke:#607568;stroke-width:2;marker-end:url(#a)}</style></defs><rect width="1120" height="580" fill="white"/><text x="32" y="44" class="h">请求Future绑定页面生命周期</text><text x="32" y="82" class="s">普通重建消费原Future，显式重试才替换它。</text><path d="M336 190H408" class="edge"/><path d="M712 190H784" class="edge"/><path d="M936 250V344" class="edge"/><path d="M784 404H712" class="edge"/><g data-node="初始化或数据源变化"><rect x="32" y="130" width="304" height="120" rx="6" class="node"/><text x="50" y="162" class="n">初始化或数据源变化</text><text x="50" y="194" class="s">initState / didUpdateWidget</text><text x="50" y="220" class="s">创建并保存请求Future</text></g><g data-node="等待结果"><rect x="408" y="130" width="304" height="120" rx="6" class="focus"/><text x="426" y="162" class="n">等待结果</text><text x="426" y="194" class="s">build只消费保存的Future</text><text x="426" y="220" class="s">父级重建不重复调用</text></g><g data-node="完成并展示"><rect x="784" y="130" width="304" height="120" rx="6" class="node"/><text x="802" y="162" class="n">完成并展示</text><text x="802" y="194" class="s">成功列表、空或错误</text><text x="802" y="220" class="s">检查当前Future身份</text></g><g data-node="用户明确重试"><rect x="784" y="344" width="304" height="120" rx="6" class="node"/><text x="802" y="376" class="n">用户明确重试</text><text x="802" y="408" class="s">替换Future并显示进度</text><text x="802" y="434" class="s">测试调用次数和状态</text></g><g data-node="销毁或替换之后"><rect x="408" y="344" width="304" height="120" rx="6" class="info"/><text x="426" y="376" class="n">销毁或替换之后</text><text x="426" y="408" class="s">旧Future结果不更新界面</text><text x="426" y="434" class="s">底层工作不自动取消</text></g><text x="32" y="378" class="n">验证完成顺序</text><text x="32" y="414" class="s">用Completer控制成功与失败</text><text x="32" y="446" class="s">A晚于B返回仍显示B</text><text x="32" y="544" class="s">FutureBuilder的结果隔离不等于取消HTTP，更不等于回滚服务端写入。</text></svg>
