<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="sdk-session-title sdk-session-desc" data-layout="editorial">
<title id="sdk-session-title">句段结束与会话结束是两种状态</title>
<desc id="sdk-session-desc">ASR 会话契约：onStart 前 Session 已发布，允许同步 write / finish / cancel</desc>
<style>text{font-family:"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif;letter-spacing:0;fill:#203c31}.title{font-size:28px;font-weight:600}.subtitle{font-size:14px;fill:#53685f}.zone-title{font-size:14px;font-weight:600}.node-title{font-size:18px;font-weight:600}.node-detail{font-size:14px;fill:#53685f}.tag{font-size:11px;fill:#357457}.arrow-label{font-size:13px;fill:#4b718c}.note{font-size:13px;fill:#53685f}</style>
<defs>
<marker id="arrow-blue" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M 0 0 L 8 4 L 0 8 Z" fill="#4b718c">
</path>
</marker>
<marker id="arrow-muted" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M 0 0 L 8 4 L 0 8 Z" fill="#6c8379">
</path>
</marker>
</defs>
<rect width="1280" height="720" fill="#fff">
</rect>
<text x="48" y="48" class="title">句段结束与会话结束是两种状态</text>
<text x="48" y="76" class="subtitle">ASR 会话契约：onStart 前 Session 已发布，允许同步 write / finish / cancel</text>
<g class="edge" data-from="published" data-to="active">
<path data-points="[[348,216],[488,216]]" d="M 348 216 L 488 216" fill="none" stroke="#4b718c" stroke-width="1.6" marker-end="url(#arrow-blue)">
</path>
</g>
<g class="edge" data-from="active" data-to="draining">
<path data-points="[[788,216],[928,216]]" d="M 788 216 L 928 216" fill="none" stroke="#4b718c" stroke-width="1.6" marker-end="url(#arrow-blue)">
</path>
</g>
<g class="edge" data-from="draining" data-to="completed">
<path data-points="[[1128,272],[1128,448]]" d="M 1128 272 L 1128 448" fill="none" stroke="#4b718c" stroke-width="1.6" marker-end="url(#arrow-blue)">
</path>
</g>
<g class="edge" data-from="active" data-to="cancelled">
<path data-points="[[638,272],[638,448]]" d="M 638 272 L 638 448" fill="none" stroke="#4b718c" stroke-width="1.6" marker-end="url(#arrow-blue)">
</path>
</g>
<g class="edge" data-from="draining" data-to="cancelled">
<path data-points="[[1000,272],[1000,400],[738,400],[738,448]]" d="M 1000 272 L 1000 392 Q 1000 400 992 400 L 746 400 Q 738 400 738 408 L 738 448" fill="none" stroke="#6c8379" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrow-muted)">
</path>
</g>
<g class="edge" data-from="active" data-to="active">
<path data-points="[[568,160],[568,116],[708,116],[708,160]]" d="M 568 160 L 568 124 Q 568 116 576 116 L 700 116 Q 708 116 708 124 L 708 160" fill="none" stroke="#4b718c" stroke-width="1.6" marker-end="url(#arrow-blue)">
</path>
</g>
<g class="edge-label" data-edge="0">
<rect x="395" y="181" width="46" height="22" fill="#fff">
</rect>
<text x="418" y="196" text-anchor="middle" class="arrow-label">write</text>
</g>
<g class="edge-label" data-edge="1">
<rect x="833.5" y="181" width="49" height="22" fill="#fff">
</rect>
<text x="858" y="196" text-anchor="middle" class="arrow-label">finish</text>
</g>
<g class="edge-label" data-edge="2">
<rect x="1158" y="345" width="68" height="22" fill="#fff">
</rect>
<text x="1192" y="360" text-anchor="middle" class="arrow-label">排空完成</text>
</g>
<g class="edge-label" data-edge="3">
<rect x="668" y="345" width="56" height="22" fill="#fff">
</rect>
<text x="696" y="360" text-anchor="middle" class="arrow-label">cancel</text>
</g>
<g class="edge-label" data-edge="4">
<rect x="844" y="365" width="56" height="22" fill="#fff">
</rect>
<text x="872" y="380" text-anchor="middle" class="arrow-label">cancel</text>
</g>
<g class="edge-label" data-edge="5">
<rect x="551" y="81" width="174" height="22" fill="#fff">
</rect>
<text x="638" y="96" text-anchor="middle" class="arrow-label">isFinal=true / isLast=false</text>
</g>
<g class="node" data-id="published">
<title>Session 已发布</title>
<rect class="node-box" x="48" y="160" width="300" height="112" rx="6" fill="#fff" stroke="#becdc5" stroke-width="1">
</rect>
<text x="64" y="182" class="tag">可用</text>
<text x="64" y="210" class="node-title">Session 已发布</text>
<text x="64" y="235" class="node-detail">onStart 回调可同步重入</text>
<text x="64" y="256" class="node-detail">本场 generation 已确定</text>
</g>
<g class="node" data-id="active">
<title>持续输入与解码</title>
<rect class="node-box" x="488" y="160" width="300" height="112" rx="6" fill="#eef6f1" stroke="#357457" stroke-width="1.6">
</rect>
<text x="504" y="182" class="tag">运行中</text>
<text x="504" y="210" class="node-title">持续输入与解码</text>
<text x="504" y="235" class="node-detail">writeAudio / partial</text>
<text x="504" y="256" class="node-detail">endpoint 不关闭会话</text>
</g>
<g class="node" data-id="draining">
<title>结束与排空</title>
<rect class="node-box" x="928" y="160" width="300" height="112" rx="6" fill="#fff" stroke="#becdc5" stroke-width="1">
</rect>
<text x="944" y="182" class="tag">收尾</text>
<text x="944" y="210" class="node-title">结束与排空</text>
<text x="944" y="235" class="node-detail">finish 停止接收新音频</text>
<text x="944" y="256" class="node-detail">串行完成解码与后处理</text>
</g>
<g class="node" data-id="completed">
<title>已完成</title>
<rect class="node-box" x="928" y="448" width="300" height="112" rx="6" fill="#fff" stroke="#becdc5" stroke-width="1">
</rect>
<text x="944" y="470" class="tag">终态</text>
<text x="944" y="498" class="node-title">已完成</text>
<text x="944" y="523" class="node-detail">唯一 isLast 结果</text>
<text x="944" y="544" class="node-detail">唯一 onComplete</text>
</g>
<g class="node" data-id="cancelled">
<title>已取消</title>
<rect class="node-box" x="488" y="448" width="300" height="112" rx="6" fill="#fff" stroke="#becdc5" stroke-width="1">
</rect>
<text x="504" y="470" class="tag">终态</text>
<text x="504" y="498" class="node-title">已取消</text>
<text x="504" y="523" class="node-detail">cancel 不补 final</text>
<text x="504" y="544" class="node-detail">不触发 complete</text>
</g>
<line x1="48" x2="1232" y1="652" y2="652" stroke="#dce5df">
</line>
<text x="48" y="676" class="note">onStart 内可立即 write、finish 或 cancel；图中主路径按持续输入展开。</text>
<text x="48" y="700" class="note">generation / gate 拒绝旧会话与迟到回调。此图为 ASR 契约，不扩大为各平台全路径验收。</text>
</svg>