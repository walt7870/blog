</g>
<g class="edge" data-from="mr" data-to="checks">
<path data-points="[[348,196],[488,196]]" d="M 348 196 L 488 196" fill="none" stroke="#4b718c" stroke-width="1.6" marker-end="url(#arrow-blue)">
</path>
</g>
<g class="edge" data-from="checks" data-to="build">
<path data-points="[[788,196],[928,196]]" d="M 788 196 L 928 196" fill="none" stroke="#4b718c" stroke-width="1.6" marker-end="url(#arrow-blue)">
</path>
</g>
<g class="edge" data-from="build" data-to="artifact">
<path data-points="[[1078,252],[1078,324]]" d="M 1078 252 L 1078 324" fill="none" stroke="#4b718c" stroke-width="1.6" marker-end="url(#arrow-blue)">
</path>
</g>
<g class="edge" data-from="artifact" data-to="test">
<path data-points="[[928,380],[788,380]]" d="M 928 380 L 788 380" fill="none" stroke="#4b718c" stroke-width="1.6" marker-end="url(#arrow-blue)">
</path>
</g>
<g class="edge" data-from="test" data-to="smoke">
<path data-points="[[488,380],[348,380]]" d="M 488 380 L 348 380" fill="none" stroke="#4b718c" stroke-width="1.6" marker-end="url(#arrow-blue)">
</path>
</g>
