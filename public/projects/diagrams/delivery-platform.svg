</rect>
<text x="858" y="360" text-anchor="middle" class="arrow-label">固定 digest</text>
</g>
<g class="edge-label" data-edge="4">
<rect x="384" y="345" width="68" height="22" fill="#fff">
</rect>
<text x="418" y="360" text-anchor="middle" class="arrow-label">实际调用</text>
