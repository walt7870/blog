<g class="node" data-id="mr">
<title>代码 / MR</title>
<rect class="node-box" x="48" y="140" width="300" height="112" rx="6" fill="#fff" stroke="#becdc5" stroke-width="1">
</rect>
<text x="64" y="162" class="tag">代码入口</text>
<text x="64" y="190" class="node-title">代码 / MR</text>
<text x="64" y="215" class="node-detail">固定版本共享模板</text>
<text x="64" y="236" class="node-detail">精确源码版本与人工审查</text>
</g>
<g class="node" data-id="checks">
<title>验证门禁</title>
<rect class="node-box" x="488" y="140" width="300" height="112" rx="6" fill="#fff" stroke="#becdc5" stroke-width="1">
</rect>
<text x="504" y="162" class="tag">验证 Runner</text>
<text x="504" y="190" class="node-title">验证门禁</text>
<text x="504" y="215" class="node-detail">静态检查 · 回归</text>
<text x="504" y="236" class="node-detail">凭据与密钥扫描</text>
</g>
<g class="node" data-id="build">
<title>构建制品</title>
<rect class="node-box" x="928" y="140" width="300" height="112" rx="6" fill="#fff" stroke="#becdc5" stroke-width="1">
</rect>
<text x="944" y="162" class="tag">构建 Runner</text>
<text x="944" y="190" class="node-title">构建制品</text>
<text x="944" y="215" class="node-detail">Builder 身份</text>
<text x="944" y="236" class="node-detail">模型底座 / 业务镜像分开</text>
</g>
<g class="node" data-id="artifact">
<title>不可变制品</title>
<rect class="node-box" x="928" y="324" width="300" height="112" rx="6" fill="#eef6f1" stroke="#357457" stroke-width="1.6">
</rect>
<text x="944" y="346" class="tag">Registry</text>
<text x="944" y="374" class="node-title">不可变制品</text>
<text x="944" y="399" class="node-detail">源码 SHA + 镜像 digest</text>
<text x="944" y="420" class="node-detail">晋级与回滚引用同一制品</text>
</g>
<g class="node" data-id="test">
<title>测试环境 rollout</title>
<rect class="node-box" x="488" y="324" width="300" height="112" rx="6" fill="#fff" stroke="#becdc5" stroke-width="1">
</rect>
<text x="504" y="346" class="tag">测试发布</text>
<text x="504" y="374" class="node-title">测试环境 rollout</text>
<text x="504" y="399" class="node-detail">受保护测试分支</text>
<text x="504" y="420" class="node-detail">独立区域发布身份</text>
</g>
<g class="node" data-id="smoke">
<title>真实业务验收</title>
<rect class="node-box" x="48" y="324" width="300" height="112" rx="6" fill="#fff" stroke="#becdc5" stroke-width="1">
</rect>
<text x="64" y="346" class="tag">晋级门禁</text>
<text x="64" y="374" class="node-title">真实业务验收</text>
<text x="64" y="399" class="node-detail">就绪 + 实际 API / 账务</text>
<text x="64" y="420" class="node-detail">测试证据绑定 digest</text>
</g>
<g class="node" data-id="release">
<title>生产受控发布</title>
<rect class="node-box" x="48" y="508" width="300" height="112" rx="6" fill="#eef6f1" stroke="#357457" stroke-width="1.6">
</rect>
<text x="64" y="530" class="tag">生产发布</text>
<text x="64" y="558" class="node-title">生产受控发布</text>
<text x="64" y="583" class="node-detail">晋级已验收制品</text>
<text x="64" y="604" class="node-detail">发布锁与环境配置</text>
</g>
<g class="node" data-id="observe">
<title>运行观测</title>
<rect class="node-box" x="488" y="508" width="300" height="112" rx="6" fill="#fff" stroke="#becdc5" stroke-width="1">
</rect>
<text x="504" y="530" class="tag">验收</text>
<text x="504" y="558" class="node-title">运行观测</text>
<text x="504" y="583" class="node-detail">日志 · 指标 · 业务请求</text>
<text x="504" y="604" class="node-detail">区分 Ready 与业务成功</text>
</g>
<g class="node" data-id="rollback">
<title>精确回滚</title>
<rect class="node-box" x="928" y="508" width="300" height="112" rx="6" fill="#fff" stroke="#becdc5" stroke-width="1">
</rect>
<text x="944" y="530" class="tag">异常恢复</text>
<text x="944" y="558" class="node-title">精确回滚</text>
<text x="944" y="583" class="node-detail">旧 digest + 对应配置</text>
<text x="944" y="604" class="node-detail">恢复后继续业务检查</text>
</g>
<line x1="48" x2="1232" y1="652" y2="652" stroke="#dce5df">
</line>
<text x="48" y="676" class="note">区域、环境与 Runner 身份独立；图中验证门禁为当前静态检查、回归和密钥扫描。</text>
<text x="48" y="700" class="note">回滚恢复旧版本不代表新版本验收通过；全服务生产发布仍按各项目证据分别确认。</text>
</svg>