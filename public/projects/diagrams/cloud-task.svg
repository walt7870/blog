<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="cloud-task-title cloud-task-desc" data-layout="editorial">
<title id="cloud-task-title">异步完成通知推进幂等结算</title>
<desc id="cloud-task-desc">稳定 task_id 贯穿准入、预算、执行事实与账务；消息可以重复，业务结算只有一份</desc>
<style>text{font-family:"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif;letter-spacing:0;fill:#203c31}.title{font-size:28px;font-weight:600}.subtitle{font-size:14px;fill:#53685f}.zone-title{font-size:14px;font-weight:600}.node-title{font-size:18px;font-weight:600}.node-detail{font-size:14px;fill:#53685f}.tag{font-size:11px;fill:#357457}.arrow-label{font-size:13px;fill:#4b718c}.note{font-size:13px;fill:#53685f}</style>
<defs>
<marker id="arrow-blue" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M 0 0 L 8 4 L 0 8 Z" fill="#4b718c">
</path>
</marker>
<marker id="arrow-muted" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M 0 0 L 8 4 L 0 8 Z" fill="#6c8379">
</path>
</marker>
</defs>
<rect width="1280" height="720" fill="#fff">
</rect>
<text x="48" y="48" class="title">异步完成通知推进幂等结算</text>
<text x="48" y="76" class="subtitle">稳定 task_id 贯穿准入、预算、执行事实与账务；消息可以重复，业务结算只有一份</text>
<g class="edge" data-from="admit" data-to="reserve">
<path data-points="[[288,216],[360,216]]" d="M 288 216 L 360 216" fill="none" stroke="#4b718c" stroke-width="1.6" marker-end="url(#arrow-blue)">
</path>
</g>
<g class="edge" data-from="reserve" data-to="submit">
<path data-points="[[600,216],[672,216]]" d="M 600 216 L 672 216" fill="none" stroke="#4b718c" stroke-width="1.6" marker-end="url(#arrow-blue)">
</path>
</g>
<g class="edge" data-from="submit" data-to="worker">
<path data-points="[[912,216],[984,216]]" d="M 912 216 L 984 216" fill="none" stroke="#6c8379" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrow-muted)">
</path>
</g>
<g class="edge" data-from="worker" data-to="tx">
<path data-points="[[1160,272],[1160,448]]" d="M 1160 272 L 1160 448" fill="none" stroke="#4b718c" stroke-width="1.6" marker-end="url(#arrow-blue)">
</path>
</g>
<g class="edge" data-from="tx" data-to="done">
<path data-points="[[984,504],[912,504]]" d="M 984 504 L 912 504" fill="none" stroke="#6c8379" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrow-muted)">
</path>
</g>
<g class="edge" data-from="done" data-to="query">
<path data-points="[[672,504],[600,504]]" d="M 672 504 L 600 504" fill="none" stroke="#6c8379" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrow-muted)">
</path>
</g>
<g class="edge" data-from="query" data-to="settle">
<path data-points="[[360,504],[288,504]]" d="M 360 504 L 288 504" fill="none" stroke="#4b718c" stroke-width="1.6" marker-end="url(#arrow-blue)">
</path>
</g>
<g class="edge" data-from="query" data-to="tx">
<path data-points="[[480,448],[480,360],[1104,360],[1104,448]]" d="M 480 448 L 480 368 Q 480 360 488 360 L 1096 360 Q 1104 360 1104 368 L 1104 448" fill="none" stroke="#4b718c" stroke-width="1.6" marker-end="url(#arrow-blue)">
</path>
</g>
<g class="edge-label" data-edge="0">
<rect x="303" y="181" width="42" height="22" fill="#fff">
</rect>
<text x="324" y="196" text-anchor="middle" class="arrow-label">预占</text>
</g>
<g class="edge-label" data-edge="1">
<rect x="615" y="181" width="42" height="22" fill="#fff">
</rect>
<text x="636" y="196" text-anchor="middle" class="arrow-label">提交</text>
</g>
<g class="edge-label" data-edge="2">
<rect x="927" y="181" width="42" height="22" fill="#fff">
</rect>
<text x="948" y="196" text-anchor="middle" class="arrow-label">消费</text>
</g>
<g class="edge-label" data-edge="3">
<rect x="1183" y="345" width="42" height="22" fill="#fff">
</rect>
<text x="1204" y="360" text-anchor="middle" class="arrow-label">落库</text>
</g>
<g class="edge-label" data-edge="4">
<rect x="918" y="469" width="60" height="22" fill="#fff">
</rect>
<text x="948" y="484" text-anchor="middle" class="arrow-label">Outbox</text>
</g>
<g class="edge-label" data-edge="5">
<rect x="615" y="469" width="42" height="22" fill="#fff">
</rect>
<text x="636" y="484" text-anchor="middle" class="arrow-label">通知</text>
</g>
<g class="edge-label" data-edge="6">
<rect x="303" y="469" width="42" height="22" fill="#fff">
</rect>
<text x="324" y="484" text-anchor="middle" class="arrow-label">计价</text>
</g>
<g class="edge-label" data-edge="7">
<rect x="731" y="325" width="122" height="22" fill="#fff">
</rect>
<text x="792" y="340" text-anchor="middle" class="arrow-label">回查终态与 usage</text>
</g>
<g class="node" data-id="admit">
<title>APIHub 准入</title>
<rect class="node-box" x="48" y="160" width="240" height="112" rx="6" fill="#fff" stroke="#becdc5" stroke-width="1">
</rect>
<text x="64" y="182" class="tag">接入</text>
<text x="64" y="210" class="node-title">APIHub 准入</text>
<text x="64" y="235" class="node-detail">校验身份与能力</text>
<text x="64" y="256" class="node-detail">分配稳定 task_id</text>
</g>
<g class="node" data-id="reserve">
<title>Portal 预算预占</title>
<rect class="node-box" x="360" y="160" width="240" height="112" rx="6" fill="#fff" stroke="#becdc5" stroke-width="1">
</rect>
<text x="376" y="182" class="tag">商业域</text>
<text x="376" y="210" class="node-title">Portal 预算预占</text>
<text x="376" y="235" class="node-detail">保存价格与预占上下文</text>
<text x="376" y="256" class="node-detail">关联同一 task_id</text>
</g>
<g class="node" data-id="submit">
<title>RocketMQ 提交</title>
<rect class="node-box" x="672" y="160" width="240" height="112" rx="6" fill="#fff" stroke="#becdc5" stroke-width="1">
</rect>
<text x="688" y="182" class="tag">异步消息</text>
<text x="688" y="210" class="node-title">RocketMQ 提交</text>
<text x="688" y="235" class="node-detail">task-submit</text>
<text x="688" y="256" class="node-detail">传递输入对象引用</text>
</g>
<g class="node" data-id="worker">
<title>Worker 执行</title>
<rect class="node-box" x="984" y="160" width="240" height="112" rx="6" fill="#fff" stroke="#becdc5" stroke-width="1">
</rect>
<text x="1000" y="182" class="tag">执行域</text>
<text x="1000" y="210" class="node-title">Worker 执行</text>
<text x="1000" y="235" class="node-detail">幂等消费 · 模型处理</text>
<text x="1000" y="256" class="node-detail">记录真实处理量</text>
</g>
<g class="node" data-id="tx">
<title>执行端数据库事务</title>
<rect class="node-box" x="984" y="448" width="240" height="112" rx="6" fill="#eef6f1" stroke="#357457" stroke-width="1.6">
</rect>
<text x="1000" y="470" class="tag">事实源</text>
<text x="1000" y="498" class="node-title">执行端数据库事务</text>
<text x="1000" y="523" class="node-detail">终态 + usage + Outbox</text>
<text x="1000" y="544" class="node-detail">同一事务持久化</text>
</g>
<g class="node" data-id="done">
<title>RocketMQ 通知</title>
<rect class="node-box" x="672" y="448" width="240" height="112" rx="6" fill="#fff" stroke="#becdc5" stroke-width="1">
</rect>
<text x="688" y="470" class="tag">可重投</text>
<text x="688" y="498" class="node-title">RocketMQ 通知</text>
<text x="688" y="523" class="node-detail">task.done</text>
<text x="688" y="544" class="node-detail">仅携带 task_id</text>
</g>
<g class="node" data-id="query">
<title>Portal 回查</title>
<rect class="node-box" x="360" y="448" width="240" height="112" rx="6" fill="#fff" stroke="#becdc5" stroke-width="1">
</rect>
<text x="376" y="470" class="tag">事实读取</text>
<text x="376" y="498" class="node-title">Portal 回查</text>
<text x="376" y="523" class="node-detail">通过执行端查询接口</text>
<text x="376" y="544" class="node-detail">获取终态与实际用量</text>
</g>
<g class="node" data-id="settle">
<title>幂等结算</title>
<rect class="node-box" x="48" y="448" width="240" height="112" rx="6" fill="#eef6f1" stroke="#357457" stroke-width="1.6">
</rect>
<text x="64" y="470" class="tag">商业事实</text>
<text x="64" y="498" class="node-title">幂等结算</text>
<text x="64" y="523" class="node-detail">按 task_id 命中唯一记录</text>
<text x="64" y="544" class="node-detail">结算完成后 Ack</text>
</g>
<line x1="48" x2="1232" y1="652" y2="652" stroke="#dce5df">
</line>
<text x="48" y="676" class="note">消息承担提交和完成通知；终态与 usage 保存在执行端数据库，Portal 通过接口回查。</text>
<text x="48" y="700" class="note">重复投递与确认不确定的恢复路径见异常对账视图。</text>
</svg>