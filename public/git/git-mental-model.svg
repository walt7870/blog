<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="460" viewBox="0 0 1120 460" role="img" aria-labelledby="git-loop-title git-loop-desc">
  <title id="git-loop-title">订单导出修改的交付闭环</title><desc id="git-loop-desc">开发者选择修复形成提交并推送，平台评审和测试后集成。集成与部署分别验收。</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#596b78" stroke-width="1.4"/></marker></defs>
  <rect width="1120" height="460" fill="#f7f9fb"/>
  <g font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" fill="#263541">
    <text x="48" y="56" font-size="27" font-weight="700">从“文件改好了”到“变更可交付”</text><text x="48" y="94" font-size="17" fill="#536470">同一条订单导出修复，逐步确认内容范围、历史关系和发布结果。</text>
    <text x="56" y="150" font-size="17">开发者：本地内容与提交</text><text x="608" y="150" font-size="17">协作平台：共享、检查与集成</text>
    <g fill="none" stroke="#596b78" stroke-width="2" marker-end="url(#arrow)"><path d="M264 248H320"/><path d="M528 248H584"/><path d="M792 248H848"/></g>
    <rect x="56" y="192" width="208" height="136" rx="6" fill="#fff" stroke="#a4b3be"/><text x="76" y="227" font-size="21" font-weight="700">选择内容</text><text x="76" y="263" font-size="17">保留空结果修复</text><text x="76" y="295" font-size="17">调试日志留在工作区</text>
    <rect x="320" y="192" width="208" height="136" rx="6" fill="#e9f5f0" stroke="#7caaa0"/><text x="340" y="227" font-size="21" font-weight="700">形成提交</text><text x="340" y="263" font-size="17">索引生成快照</text><text x="340" y="295" font-size="17">说明修复意图与测试</text>
    <rect x="584" y="192" width="208" height="136" rx="6" fill="#fff" stroke="#a4b3be"/><text x="604" y="227" font-size="21" font-weight="700">共享评审</text><text x="604" y="263" font-size="17">push 更新远程引用</text><text x="604" y="295" font-size="17">PR / MR 审查与 CI</text>
    <rect x="848" y="192" width="208" height="136" rx="6" fill="#edf4fc" stroke="#819bb6"/><text x="868" y="227" font-size="21" font-weight="700">集成验收</text><text x="868" y="263" font-size="17">合并权限与导出逻辑</text><text x="868" y="295" font-size="17">重新验证组合行为</text>
    <text x="48" y="390" font-size="18">发布系统再把已验证提交对应的制品部署到指定环境，记录摘要与验收结果。</text><text x="48" y="424" font-size="17" fill="#536470">commit、push、评审通过、合并和部署成功，各有独立的完成证据。</text>
  </g>
</svg>
