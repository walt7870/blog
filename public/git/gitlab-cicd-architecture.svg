<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="590" viewBox="0 0 1200 590" role="img" aria-labelledby="title desc">
  <title id="title">GitLab CI/CD 组件与权限关系</title>
  <desc id="desc">维护者合并代码后 GitLab 编排流水线，Runner manager 主动请求任务并创建临时作业 Pod。验证、制品发布和环境部署使用不同身份，产物进入镜像仓库或对象存储，运行验收完成后记录发布结果。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#64748b"/></marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #172b4d; }
      .title { font-size: 26px; font-weight: 700; }
      .label { font-size: 20px; font-weight: 600; }
      .body { font-size: 17px; }
      .small { font-size: 15px; fill: #475569; }
      .arrow { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1200" height="590" rx="16" fill="#f8fafc"/>
  <text x="34" y="44" class="title">从代码合并到运行验收</text>
  <text x="34" y="74" class="body">GitLab 编排流程；Runner 管理执行环境；作业身份决定能访问哪些资源。</text>
  <rect x="34" y="108" width="218" height="102" rx="12" fill="#e0e7ff" stroke="#a5b4fc"/>
  <text x="56" y="143" class="label">开发者 / 维护者</text>
  <text x="56" y="173" class="body">提交 MR → 审核合并</text>
  <text x="56" y="195" class="small">受保护的 test / main</text>
  <rect x="308" y="108" width="242" height="102" rx="12" fill="#e0e7ff" stroke="#a5b4fc"/>
  <text x="332" y="143" class="label">GitLab 控制面</text>
  <text x="332" y="173" class="body">仓库 / 流水线 / 作业状态</text>
  <text x="332" y="195" class="small">变量、制品与操作记录</text>
  <path d="M252 159 H302" class="arrow"/>
  <rect x="680" y="108" width="482" height="102" rx="12" fill="#dbeafe" stroke="#93c5fd"/>
  <text x="704" y="143" class="label">Runner manager（常驻）</text>
  <text x="704" y="173" class="body">创建、观察、清理临时作业 Pod</text>
  <text x="704" y="195" class="small">仅持有指定 CI namespace 的管理权限</text>
  <path d="M680 162 H557" class="arrow"/>
  <text x="563" y="141" class="small">主动请求任务</text>
  <path d="M918 210 V244 H592 V273" class="arrow"/>
  <rect x="34" y="282" width="1128" height="146" rx="14" fill="#eff6ff" stroke="#bfdbfe"/>
  <rect x="54" y="300" width="326" height="109" rx="10" fill="#fff" stroke="#cbd5e1"/>
  <text x="74" y="332" class="label">验证 Pod</text>
  <text x="74" y="362" class="body">测试 / 编译 / 检查</text>
  <text x="74" y="387" class="small">普通分支可用，无云发布权限</text>
  <rect x="418" y="300" width="326" height="109" rx="10" fill="#fff" stroke="#cbd5e1"/>
  <text x="438" y="332" class="label">制品发布 Pod</text>
  <text x="438" y="362" class="body">构建镜像 / 推送 / 保存 digest</text>
  <text x="438" y="387" class="small">只写指定镜像仓库或制品路径</text>
  <rect x="782" y="300" width="360" height="109" rx="10" fill="#fff" stroke="#cbd5e1"/>
  <text x="802" y="332" class="label">环境部署 Pod</text>
  <text x="802" y="362" class="body">切换版本 / 业务验收 / 记录结果</text>
  <text x="802" y="387" class="small">测试与生产使用各自的发布身份</text>
  <path d="M380 351 H410" class="arrow"/>
  <path d="M744 351 H774" class="arrow"/>
  <path d="M582 409 V461" class="arrow"/>
  <path d="M960 409 V461" class="arrow"/>
  <rect x="418" y="470" width="326" height="77" rx="10" fill="#fef3c7" stroke="#fcd34d"/>
  <text x="438" y="501" class="label">镜像仓库 / 对象存储</text>
  <text x="438" y="527" class="small">不可变制品、缓存、持久发布记录</text>
  <rect x="782" y="470" width="360" height="77" rx="10" fill="#dcfce7" stroke="#86efac"/>
  <text x="802" y="501" class="label">应用集群 / 静态站点</text>
  <text x="802" y="527" class="small">核对实际运行版本与业务响应</text>
  <text x="54" y="491" class="body">每个 CI Job 按需创建 Pod</text>
  <text x="54" y="519" class="small">作业结束后清理，缓存与制品独立保存</text>
  <text x="54" y="544" class="small">图中表示流程阶段，不表示共享一个身份</text>
</svg>
