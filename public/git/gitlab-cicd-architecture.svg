<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="650" viewBox="0 0 1120 650" role="img" aria-labelledby="gitlab-cicd-architecture-title gitlab-cicd-architecture-desc">
  <title id="gitlab-cicd-architecture-title">GitLab CI/CD 控制、制品与部署边界</title><desc id="gitlab-cicd-architecture-desc">GitLab保存仓库和编排结果。Runner manager主动请求任务，并分别创建验证、构建与部署Pod。验证通过后构建不可变制品；部署Pod按摘要取制品并更新运行环境，业务节点另有拉取身份。管理身份不应拥有业务发布权限。</desc>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#596b78" stroke-width="1.4"/></marker></defs><rect width="1120" height="650" fill="#f7f9fb"/>
  <g font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" fill="#263541">
    <text x="48" y="54" font-size="27" font-weight="700">编排、执行、制品和环境分别授权</text><text x="48" y="89" font-size="17" fill="#536470">虚线表示管理控制；实线表示验证依赖、制品或环境操作。每个作业按需创建独立 Pod。</text>
    <g fill="none" stroke="#596b78" stroke-width="2" marker-end="url(#a)"><path d="M440 176H328"/><path d="M328 346H440"/><path d="M680 346H840"/><path d="M560 408V486"/><path d="M960 408V486"/><path d="M680 531H796Q804 531 804 523V386Q804 378 812 378H840"/></g>
    <g fill="none" stroke="#81909d" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a)"><path d="M472 218V238Q472 246 464 246H196Q188 246 188 254V302"/><path d="M560 218V302"/><path d="M648 218V238Q648 246 656 246H952Q960 246 960 254V302"/></g>
    <rect x="48" y="134" width="280" height="84" rx="6" fill="#edf4fc" stroke="#819bb6"/><text x="70" y="168" font-size="21" font-weight="700">GitLab 控制面</text><text x="70" y="198" font-size="17">MR、源码、作业与制品元数据</text>
    <rect x="440" y="134" width="240" height="84" rx="6" fill="#fff" stroke="#a4b3be"/><text x="462" y="168" font-size="21" font-weight="700">Runner manager</text><text x="462" y="198" font-size="17">仅管理指定 CI 区域的 Pod</text>
    <text x="347" y="157" font-size="16">请求任务</text><text x="720" y="168" font-size="17">合并触发流水线；manager</text><text x="720" y="198" font-size="17">请求任务并上报执行状态。</text>
    <text x="48" y="283" font-size="17">普通验证身份</text><text x="440" y="283" font-size="17">限定仓库写入身份</text><text x="840" y="283" font-size="17">受保护的环境身份</text>
    <rect x="48" y="302" width="280" height="106" rx="6" fill="#fff" stroke="#a4b3be"/><text x="70" y="336" font-size="21" font-weight="700">验证 Pod</text><text x="70" y="370" font-size="17">测试、编译、检查</text><text x="70" y="394" font-size="16">不持有部署凭据</text>
    <rect x="440" y="302" width="240" height="106" rx="6" fill="#fff" stroke="#a4b3be"/><text x="462" y="336" font-size="21" font-weight="700">构建 / 发布 Pod</text><text x="462" y="370" font-size="17">构建、推送并保存 digest</text><text x="462" y="394" font-size="16">源提交与产物关联</text>
    <rect x="840" y="302" width="240" height="106" rx="6" fill="#e9f5f0" stroke="#7caaa0"/><text x="862" y="336" font-size="21" font-weight="700">环境部署 Pod</text><text x="862" y="370" font-size="17">版本锁、更新、业务验收</text><text x="862" y="394" font-size="16">记录前后版本及操作结果</text>
    <text x="348" y="330" font-size="16">检查通过</text><text x="704" y="330" font-size="16">制品就绪后</text><text x="578" y="452" font-size="16">上传</text><text x="982" y="452" font-size="16">更新</text>
    <rect x="440" y="486" width="240" height="90" rx="6" fill="#fff" stroke="#a4b3be"/><text x="462" y="519" font-size="21" font-weight="700">镜像 / 对象存储</text><text x="462" y="550" font-size="17">不可变产物、持久发布记录</text>
    <rect x="840" y="486" width="240" height="90" rx="6" fill="#fff" stroke="#a4b3be"/><text x="862" y="519" font-size="21" font-weight="700">应用集群 / 静态站点</text><text x="862" y="550" font-size="17">运行身份另配镜像读取权限</text>
    <text x="48" y="506" font-size="18">部署读取制品清单与摘要，</text><text x="48" y="538" font-size="18">按目标类型拉取或切换版本。</text><text x="48" y="618" font-size="17" fill="#536470">生产与测试分开授权；RBAC 的 patch 权限不只允许修改镜像字段，还需准入与运行身份约束。</text>
  </g>
</svg>
