<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="520" viewBox="0 0 1120 520" role="img" aria-labelledby="git-team-title git-team-desc">
  <title id="git-team-title">任务、集成和发布的责任边界</title><desc id="git-team-desc">开发者在任务分支提交并推送，评审与CI检查最终提交，集成到main后生成可追踪制品，部署再单独验收。检查失败回到任务分支修改。</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#596b78" stroke-width="1.4"/></marker></defs>
  <rect width="1120" height="520" fill="#f7f9fb"/>
  <g font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" fill="#263541">
    <text x="48" y="56" font-size="27" font-weight="700">检查最终提交，发布指定制品</text><text x="48" y="94" font-size="17" fill="#536470">短期任务分支示例；历史形态由 merge、squash 或 rebase 策略决定。</text>
    <g fill="none" stroke="#596b78" stroke-width="2" marker-end="url(#arrow)"><path d="M264 224H320"/><path d="M528 224H584"/><path d="M792 224H848"/><path d="M424 280V324Q424 332 416 332H168Q160 332 160 324V280" stroke-dasharray="5 4"/><path d="M952 280V368Q952 376 944 376H792"/></g>
    <text x="248" y="362" font-size="16">检查失败：修改后重新检查</text>
    <rect x="56" y="168" width="208" height="112" rx="6" fill="#fff" stroke="#a4b3be"/><text x="76" y="202" font-size="21" font-weight="700">任务分支</text><text x="76" y="235" font-size="17">开发者提交并推送</text><text x="76" y="261" font-size="16">记录修改与测试</text>
    <rect x="320" y="168" width="208" height="112" rx="6" fill="#e9f5f0" stroke="#7caaa0"/><text x="340" y="202" font-size="21" font-weight="700">PR / MR 与 CI</text><text x="340" y="235" font-size="17">审查最终提交</text><text x="340" y="261" font-size="16">测试、权限与保护规则</text>
    <rect x="584" y="168" width="208" height="112" rx="6" fill="#fff" stroke="#a4b3be"/><text x="604" y="202" font-size="21" font-weight="700">集成到 main</text><text x="604" y="235" font-size="17">验证组合结果</text><text x="604" y="261" font-size="16">记录最终提交 ID</text>
    <rect x="848" y="168" width="208" height="112" rx="6" fill="#edf4fc" stroke="#819bb6"/><text x="868" y="202" font-size="21" font-weight="700">构建与版本标记</text><text x="868" y="235" font-size="17">记录来源和制品摘要</text><text x="868" y="261" font-size="16">tag 本身不等于上线</text>
    <rect x="512" y="356" width="280" height="88" rx="6" fill="#fff" stroke="#a4b3be"/><text x="532" y="390" font-size="21" font-weight="700">指定环境部署与验收</text><text x="532" y="420" font-size="17">保留旧制品及恢复路径</text>
    <text x="48" y="486" font-size="17" fill="#536470">紧急修复从实际生产提交开始，验证发布后再回流主干与受支持版本。</text>
  </g>
</svg>
