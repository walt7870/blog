<svg xmlns="http://www.w3.org/2000/svg" width="960" height="460" viewBox="0 0 960 460" role="img" aria-labelledby="title desc">
  <title id="title">Git 仓库组织策略</title>
  <desc id="desc">依据制品边界、原子修改、源码引用和克隆体验选择包管理器、Monorepo、Submodule、Subtree 或多仓库。</desc>
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#f0fdf4"/>
    </linearGradient>
    <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <style>
      .title { font: 700 24px system-ui, sans-serif; fill: #14532d; }
      .label { font: 700 16px system-ui, sans-serif; fill: #1e293b; }
      .small { font: 14px system-ui, sans-serif; fill: #475569; }
      .yesno { font: 700 13px system-ui, sans-serif; fill: #64748b; }
      .line { stroke: #64748b; stroke-width: 2; fill: none; marker-end: url(#arrow2); }
    </style>
  </defs>
  <rect width="960" height="460" rx="24" fill="url(#bg2)"/>
  <text x="48" y="50" class="title">仓库组织选型：先判断边界，再选择工具</text>

  <rect x="342" y="78" width="276" height="66" rx="16" fill="#dcfce7" stroke="#22c55e"/>
  <text x="480" y="106" text-anchor="middle" class="label">依赖是否已有稳定制品？</text>
  <text x="480" y="129" text-anchor="middle" class="small">版本、来源、摘要、兼容范围</text>

  <rect x="70" y="190" width="220" height="84" rx="16" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="180" y="222" text-anchor="middle" class="label">包管理器 / 制品库</text>
  <text x="180" y="248" text-anchor="middle" class="small">接口稳定 · 独立发布</text>

  <rect x="370" y="178" width="220" height="106" rx="16" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="480" y="211" text-anchor="middle" class="label">是否高频原子修改？</text>
  <text x="480" y="238" text-anchor="middle" class="small">同一提交修改多个模块</text>
  <text x="480" y="261" text-anchor="middle" class="small">共享 CI 与发布门禁</text>

  <rect x="670" y="190" width="220" height="84" rx="16" fill="#ede9fe" stroke="#8b5cf6"/>
  <text x="780" y="222" text-anchor="middle" class="label">Monorepo</text>
  <text x="780" y="248" text-anchor="middle" class="small">统一历史 · 影响分析</text>

  <rect x="220" y="340" width="168" height="78" rx="16" fill="#fff" stroke="#ec4899"/>
  <text x="304" y="371" text-anchor="middle" class="label">Submodule</text>
  <text x="304" y="396" text-anchor="middle" class="small">固定外部提交</text>

  <rect x="396" y="340" width="168" height="78" rx="16" fill="#fff" stroke="#0ea5e9"/>
  <text x="480" y="371" text-anchor="middle" class="label">Subtree</text>
  <text x="480" y="396" text-anchor="middle" class="small">普通 Clone 完整</text>

  <rect x="572" y="340" width="168" height="78" rx="16" fill="#fff" stroke="#64748b"/>
  <text x="656" y="371" text-anchor="middle" class="label">多仓库</text>
  <text x="656" y="396" text-anchor="middle" class="small">团队与发布独立</text>

  <path d="M405 144 L220 190" class="line"/>
  <text x="301" y="160" class="yesno">是</text>
  <path d="M480 144 V178" class="line"/>
  <text x="492" y="165" class="yesno">否</text>
  <path d="M590 231 H670" class="line"/>
  <text x="624" y="220" class="yesno">是</text>
  <path d="M480 284 V318 H304 V340" class="line"/>
  <path d="M480 318 V340" class="line"/>
  <path d="M480 318 H656 V340" class="line"/>
  <text x="493" y="310" class="yesno">否：按源码引用和所有权选择</text>
</svg>
