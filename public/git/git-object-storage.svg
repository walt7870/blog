<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-labelledby="title desc">
  <title id="title">Git 对象存储与维护</title>
  <desc id="desc">展示工作区内容生成对象、引用定位提交、松散对象进入 Packfile，以及完整性检查和维护的关系。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef2ff"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <style>
      .title { font: 700 24px system-ui, sans-serif; fill: #172554; }
      .label { font: 700 16px system-ui, sans-serif; fill: #1e293b; }
      .small { font: 14px system-ui, sans-serif; fill: #475569; }
      .code { font: 13px ui-monospace, monospace; fill: #334155; }
      .line { stroke: #64748b; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="960" height="440" rx="24" fill="url(#bg)"/>
  <text x="48" y="50" class="title">Git 对象存储：从快照到可维护对象库</text>

  <rect x="48" y="92" width="166" height="104" rx="16" fill="#dbeafe" stroke="#60a5fa"/>
  <text x="131" y="126" text-anchor="middle" class="label">工作区与暂存区</text>
  <text x="131" y="153" text-anchor="middle" class="small">文件内容 + 路径</text>
  <text x="131" y="176" text-anchor="middle" class="code">git add / commit</text>

  <rect x="274" y="78" width="242" height="132" rx="18" fill="#dcfce7" stroke="#4ade80"/>
  <text x="395" y="110" text-anchor="middle" class="label">不可变对象图</text>
  <rect x="296" y="130" width="52" height="40" rx="8" fill="#fff" stroke="#22c55e"/>
  <rect x="370" y="130" width="52" height="40" rx="8" fill="#fff" stroke="#22c55e"/>
  <rect x="444" y="130" width="52" height="40" rx="8" fill="#fff" stroke="#22c55e"/>
  <text x="322" y="155" text-anchor="middle" class="small">Blob</text>
  <text x="396" y="155" text-anchor="middle" class="small">Tree</text>
  <text x="470" y="155" text-anchor="middle" class="small">Commit</text>
  <text x="395" y="193" text-anchor="middle" class="small">内容寻址 · 对象可复用</text>

  <rect x="576" y="92" width="154" height="104" rx="16" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="653" y="126" text-anchor="middle" class="label">引用入口</text>
  <text x="653" y="153" text-anchor="middle" class="code">HEAD / branch</text>
  <text x="653" y="176" text-anchor="middle" class="code">tag / reflog</text>

  <rect x="790" y="92" width="122" height="104" rx="16" fill="#fce7f3" stroke="#ec4899"/>
  <text x="851" y="126" text-anchor="middle" class="label">签名与权限</text>
  <text x="851" y="153" text-anchor="middle" class="small">验证身份</text>
  <text x="851" y="176" text-anchor="middle" class="small">控制发布</text>

  <path d="M214 144 H274" class="line"/>
  <path d="M516 144 H576" class="line"/>
  <path d="M730 144 H790" class="line"/>

  <rect x="48" y="266" width="236" height="116" rx="18" fill="#fff" stroke="#94a3b8"/>
  <text x="166" y="300" text-anchor="middle" class="label">松散对象</text>
  <text x="166" y="329" text-anchor="middle" class="code">.git/objects/ab/cdef...</text>
  <text x="166" y="354" text-anchor="middle" class="small">新对象先独立写入</text>

  <rect x="362" y="266" width="236" height="116" rx="18" fill="#fff" stroke="#8b5cf6"/>
  <text x="480" y="300" text-anchor="middle" class="label">Packfile + Index</text>
  <text x="480" y="329" text-anchor="middle" class="code">pack-*.pack / pack-*.idx</text>
  <text x="480" y="354" text-anchor="middle" class="small">压缩、Delta、快速定位</text>

  <rect x="676" y="252" width="236" height="144" rx="18" fill="#fff" stroke="#0ea5e9"/>
  <text x="794" y="286" text-anchor="middle" class="label">检查与维护</text>
  <text x="794" y="317" text-anchor="middle" class="code">git fsck --full</text>
  <text x="794" y="342" text-anchor="middle" class="code">git maintenance run --auto</text>
  <text x="794" y="367" text-anchor="middle" class="code">git count-objects -vH</text>

  <path d="M284 324 H362" class="line"/>
  <path d="M598 324 H676" class="line"/>
</svg>
