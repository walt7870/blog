<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="540" viewBox="0 0 1120 540" role="img" aria-labelledby="git-object-storage-title git-object-storage-desc">
  <title id="git-object-storage-title">Git 对象引用与存储表示</title><desc id="git-object-storage-desc">main引用提交C2，C2指向父提交C1和目录树，目录树引用文件Blob。带说明标签通过tag对象引用提交C1。松散对象和Pack是不同存储表示，不改变对象引用关系。</desc>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#596b78" stroke-width="1.4"/></marker></defs><rect width="1120" height="540" fill="#f7f9fb"/>
  <g font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" fill="#263541">
    <text x="48" y="54" font-size="27" font-weight="700">引用决定从哪里读，对象决定读到什么</text><text x="48" y="89" font-size="17" fill="#536470">箭头表示实际引用方向；提交指向父提交，Blob 本身不保存文件名。</text>
    <g fill="none" stroke="#596b78" stroke-width="2" marker-end="url(#a)"><path d="M242 166H318"/><path d="M522 166H610"/><path d="M420 202V268"/><path d="M522 304H610"/><path d="M804 304H870"/><path d="M870 166H804"/></g>
    <rect x="48" y="130" width="194" height="72" rx="6" fill="#edf4fc" stroke="#819bb6"/><text x="70" y="160" font-size="20" font-weight="700">refs/heads/main</text><text x="70" y="186" font-size="16">可移动引用</text>
    <rect x="318" y="130" width="204" height="72" rx="6" fill="#e9f5f0" stroke="#7caaa0"/><text x="340" y="160" font-size="21" font-weight="700">commit C2</text><text x="340" y="186" font-size="16">作者、说明与对象引用</text>
    <text x="539" y="151" font-size="16">parent</text><rect x="610" y="130" width="194" height="72" rx="6" fill="#fff" stroke="#a4b3be"/><text x="632" y="160" font-size="21" font-weight="700">commit C1</text><text x="632" y="186" font-size="16">仍引用自己的快照树</text>
    <rect x="870" y="130" width="202" height="72" rx="6" fill="#fff" stroke="#a4b3be"/><text x="892" y="160" font-size="21" font-weight="700">tag 对象</text><text x="892" y="186" font-size="16">说明、签名与目标 ID</text>
    <text x="48" y="294" font-size="18">同一文件内容可被</text><text x="48" y="324" font-size="18">不同目录树复用。</text>
    <rect x="318" y="268" width="204" height="72" rx="6" fill="#fff" stroke="#a4b3be"/><text x="340" y="298" font-size="21" font-weight="700">tree 根目录</text><text x="340" y="324" font-size="16">名称 → 模式与对象 ID</text>
    <rect x="610" y="268" width="194" height="72" rx="6" fill="#fff" stroke="#a4b3be"/><text x="632" y="298" font-size="21" font-weight="700">tree：src/</text><text x="632" y="324" font-size="16">未变的目录可以复用</text>
    <rect x="870" y="268" width="202" height="72" rx="6" fill="#fff" stroke="#a4b3be"/><text x="892" y="298" font-size="21" font-weight="700">blob</text><text x="892" y="324" font-size="16">例如导出函数文件内容</text><text x="450" y="242" font-size="16">tree</text>
    <text x="48" y="398" font-size="20" font-weight="700">同一对象图，两种存储表示</text><path d="M48 415H1072" stroke="#c9d3dc"/>
    <text x="48" y="450" font-size="18">松散对象：按对象 ID 分目录存放压缩数据</text><text x="600" y="450" font-size="18">Pack + 索引：批量压缩，可用 Delta 节省空间</text>
    <text x="48" y="500" font-size="17" fill="#536470">打包不会重写提交关系；同一对象的 ID 不因换成 Pack 存储而改变。</text>
  </g>
</svg>
