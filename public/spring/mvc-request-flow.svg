<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="760" viewBox="0 0 1240 760" role="img" aria-labelledby="mvc-title mvc-desc">
  <title id="mvc-title">Spring MVC的正常响应与异常分支</title><desc id="mvc-desc">请求经Servlet过滤链进入DispatcherServlet，映射后由适配器解析参数并调用Controller与Service。正常返回转换为响应；分派中捕获的异常交给异常解析器，已提交响应不一定能改写。</desc>
  <defs><marker id="mvc-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#74818a"/></marker><style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#27343b;font-size:18px}.title{font-size:24px;font-weight:700}.head{font-size:20px;font-weight:600}.small{font-size:16px;fill:#52616a}.box{fill:#fff;stroke:#bac4c9;stroke-width:1.3;rx:6}.focus{fill:#e4f3ee;stroke:#3b8573;stroke-width:1.5;rx:6}.line{fill:none;stroke:#74818a;stroke-width:1.5;marker-end:url(#mvc-arrow)}.error{fill:none;stroke:#74818a;stroke-width:1.5;stroke-dasharray:5 4;marker-end:url(#mvc-arrow)}</style></defs>
  <rect width="1240" height="760" fill="#f7f9fa"/><text x="36" y="44" class="title">异常解析是分支，正常响应不必经过异常处理器</text><text x="36" y="80" class="small">同步JSON请求主路径；省略返回栈、异步分派与流式响应。MVC外的Filter异常需要自身或安全链处理。</text>
  <path d="M316 222H420" class="line"/><path d="M780 222H900" class="line"/>
  <path d="M1048 296V432" class="line"/><path d="M900 502H780" class="line"/>
  <path d="M600 296V344Q600 352 592 352H176Q168 352 168 360V432" class="error"/>
  <path d="M316 502H420" class="error"/>
  <rect x="36" y="148" width="280" height="148" class="box"/><text x="56" y="192" class="head">Servlet容器与Filter</text><text x="56" y="232" class="small">接收HTTP请求</text><text x="56" y="270" class="small">安全过滤链、编码、请求标识</text>
  <rect x="420" y="148" width="360" height="148" class="focus"/><text x="440" y="192" class="head">DispatcherServlet</text><text x="440" y="232" class="small">HandlerMapping查找处理链</text><text x="440" y="270" class="small">统一组织调用与异常分派</text>
  <rect x="900" y="148" width="304" height="148" class="box"/><text x="920" y="192" class="head">HandlerAdapter</text><text x="920" y="232" class="small">参数解析、转换、校验</text><text x="920" y="270" class="small">调用Controller → Service</text>
  <rect x="900" y="432" width="304" height="148" class="box"/><text x="920" y="476" class="head">返回值处理与转换</text><text x="920" y="516" class="small">确定响应语义与媒体类型</text><text x="920" y="554" class="small">消息转换器写出JSON</text>
  <rect x="420" y="432" width="360" height="148" class="focus"/><text x="440" y="476" class="head">HTTP响应</text><text x="440" y="516" class="small">状态码、Header、Body</text><text x="440" y="554" class="small">正常结果或已解析的错误</text>
  <rect x="36" y="432" width="280" height="148" class="box"/><text x="56" y="476" class="head">异常解析器链</text><text x="56" y="516" class="small">处理分派捕获的异常</text><text x="56" y="554" class="small">Advice是其中一种机制</text>
  <text x="352" y="338" class="small">捕获分派异常</text><text x="1072" y="368" class="small">正常返回</text>
  <path d="M36 642H1204" stroke="#bac4c9"/><text x="36" y="684" class="small">没有解析器接住的异常继续交给容器；响应已提交时，后续失败可能无法替换状态码与响应体。</text><text x="36" y="724" class="small">404/405先查映射；400查读取、转换与校验；415查Content-Type；业务返回后失败继续查转换与响应提交。</text>
</svg>
