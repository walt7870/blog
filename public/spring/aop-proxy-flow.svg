<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="680" viewBox="0 0 1240 680" role="img" aria-labelledby="aop-title aop-desc">
  <title id="aop-title">Spring AOP的外部调用与自调用</title><desc id="aop-desc">外部调用从调用方进入代理、匹配的方法拦截器和目标对象；目标内部调用另一个方法不重新经过代理。吞掉异常改变回滚判断，不表示代理没有执行。</desc>
  <defs><marker id="aop-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#74818a"/></marker><style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#27343b;font-size:18px}.title{font-size:24px;font-weight:700}.head{font-size:20px;font-weight:600}.small{font-size:16px;fill:#52616a}.box{fill:#fff;stroke:#bac4c9;stroke-width:1.3;rx:6}.focus{fill:#e4f3ee;stroke:#3b8573;stroke-width:1.5;rx:6}.line{fill:none;stroke:#74818a;stroke-width:1.5;marker-end:url(#aop-arrow)}</style></defs>
  <rect width="1240" height="680" fill="#f7f9fa"/><text x="36" y="44" class="title">先确认是否经过代理，再判断事务和异常规则</text><text x="36" y="80" class="small">限定Spring AOP代理模式；AspectJ织入不是这条调用机制。通知只匹配可代理的方法。</text>
  <path d="M316 224H420" class="line"/><path d="M780 224H900" class="line"/>
  <path d="M1048 304V424" class="line"/>
  <rect x="36" y="144" width="280" height="160" class="box"/><text x="56" y="188" class="head">调用方</text><text x="56" y="232" class="small">Controller或其他Service</text><text x="56" y="272" class="small">持有容器最终暴露的Bean</text>
  <rect x="420" y="144" width="360" height="160" class="focus"/><text x="440" y="188" class="head">代理与方法拦截器链</text><text x="440" y="232" class="small">Advisor决定匹配与顺序</text><text x="440" y="272" class="small">事务、观测等分别按合同执行</text>
  <rect x="900" y="144" width="304" height="160" class="box"/><text x="920" y="188" class="head">目标对象outer()</text><text x="920" y="232" class="small">执行业务方法</text><text x="920" y="272" class="small">内部通过this调用inner()</text>
  <text x="1072" y="370" class="small">直接调用</text>
  <rect x="900" y="424" width="304" height="112" class="focus"/><text x="920" y="468" class="head">同一目标inner()</text><text x="920" y="508" class="small">不重新执行inner的代理通知</text>
  <text x="36" y="396" class="head">两个现象要分开判断</text><text x="36" y="440">this调用：新一次方法调用没有经过代理。</text><text x="36" y="480">内部吞异常：代理可能已经执行，但看到正常返回。</text><text x="36" y="520" class="small">内层若已标记rollback-only，即使外层捕获异常，最终仍可能回滚并报错。</text>
  <path d="M36 580H1204" stroke="#bac4c9"/><text x="36" y="618" class="small">inner仍运行在outer已经建立的事务中，但不会因此应用inner上单独声明的REQUIRES_NEW等规则。</text><text x="36" y="654" class="small">JDK接口代理和CGLIB类代理都存在自调用边界；final类/方法不能被CGLIB子类覆盖增强。</text>
</svg>
