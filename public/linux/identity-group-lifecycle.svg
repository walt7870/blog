<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="560" viewBox="0 0 1120 560" role="img" aria-labelledby="identity-group-title identity-group-desc">
<title id="identity-group-title">账号配置与运行中凭据有不同生命周期</title><desc id="identity-group-desc">NSS解析账号和组，登录或服务启动建立UID、GID和补充组。数据库中新增组成员不自动改变已有服务，需重建凭据并实测访问。</desc>
<defs><marker id="identity-group-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" fill="#738288"/></marker><style>text{font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#253238}.heading{font-size:25px;font-weight:600}.name{font-size:21px;font-weight:600}.body{font-size:18px}.note{font-size:17px;fill:#52656c}.line{fill:none;stroke:#738288;stroke-width:1.8;marker-end:url(#identity-group-arrow)}.box{fill:#fff;stroke:#bac6cc;stroke-width:1.3}.focus{fill:#e8f4ef;stroke:#67877b;stroke-width:1.5}.soft{fill:#f0f5fc;stroke:#a8bacd;stroke-width:1.3}</style></defs>
<rect width="1120" height="560" fill="#f8fafb"/><text class="heading" x="52" y="54">加入用户组后，已有服务不自动获得新组</text><text class="note" x="52" y="88">数据库查询与当前进程查询要分开；容器还要核对数值身份和命名空间映射。</text>
<path class="line" d="M332 224H416"/><path class="line" d="M692 224H772"/><path class="line" d="M188 288V412Q188 420 196 420H400"/><path class="line" d="M696 420H772"/>
<rect data-node="账号数据" class="box" x="52" y="160" width="280" height="128" rx="6"/><text class="name" x="72" y="196">NSS：本地或目录服务</text><text class="body" x="72" y="230">getent / id 账号</text><text class="body" x="72" y="260">用户、主组和补充组配置</text>
<rect data-node="建立凭据" class="focus" x="416" y="160" width="276" height="128" rx="6"/><text class="name" x="436" y="196">登录 / 服务启动</text><text class="body" x="436" y="230">管理器建立进程凭据</text><text class="body" x="436" y="260">UID、GID、补充组</text>
<rect data-node="已有进程" class="soft" x="772" y="160" width="296" height="128" rx="6"/><text class="name" x="792" y="196">运行中进程</text><text class="body" x="792" y="230">id：当前进程的组</text><text class="body" x="792" y="260">配置后来改变也不会自动刷新</text>
<rect data-node="重新启动" class="box" x="400" y="372" width="296" height="100" rx="6"/><text class="name" x="420" y="408">组变更后重新建立凭据</text><text class="body" x="420" y="440">新会话 / 按计划重启服务</text>
<rect data-node="访问复验" class="box" x="772" y="372" width="296" height="100" rx="6"/><text class="name" x="792" y="408">在新进程中复验</text><text class="body" x="792" y="440">身份正确 + 实际文件操作</text>
<text class="note" x="52" y="522">改用户名不自动迁移所有文件；删除账号也不自动停止进程或收回全部访问入口。</text></svg>
