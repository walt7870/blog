<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="510" viewBox="0 0 1120 510" role="img" aria-labelledby="process-thread-coroutine-t process-thread-coroutine-d">
<title id="process-thread-coroutine-t">进程、线程和协程在内存里的样子</title><desc id="process-thread-coroutine-d">一个进程有独立地址空间，包含代码、全局变量和堆，所有线程共用，每个线程只有自己的栈；其中一个线程运行事件循环，多个协程在它上面轮流执行，只在 await 处切换。fork 出的子进程起初与父进程共用物理页，修改时复制，所以子进程扣减库存不影响父进程。实验测得进程、线程、协程的创建代价依次相差约一个数量级。</desc>
<defs><marker id="process-thread-coroutine-a" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#596775"/></marker>
<marker id="process-thread-coroutine-r" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#b4473b"/></marker></defs>
<rect width="1120" height="510" fill="#f7f9fb"/>
<g font-family="Arial, 'PingFang SC', sans-serif" fill="#23313d">
<text x="40" y="56" font-size="28" fill="#23313d" font-weight="600">进程、线程和协程在内存里的样子</text><text x="40" y="92" font-size="18" fill="#52616d">线程共用进程的地址空间；协程在一个线程里轮流执行；子进程有自己的一份。</text><rect x="40" y="130" width="640" height="360" rx="6" fill="#eaf3fb" stroke="#7694aa"/><text x="60" y="166" font-size="19" fill="#23313d" font-weight="600">进程（PID 1）：一块独立的地址空间</text><rect x="60" y="186" width="190" height="76" rx="6" fill="#fff" stroke="#8fa3b1"/><text x="76" y="216" font-size="17" fill="#23313d" font-weight="600">代码</text><text x="76" y="244" font-size="15" fill="#52616d">所有线程执行同一份</text><rect x="265" y="186" width="190" height="76" rx="6" fill="#fff" stroke="#8fa3b1"/><text x="281" y="216" font-size="17" fill="#23313d" font-weight="600">全局变量</text><text x="281" y="244" font-size="15" fill="#b4473b">stock = 99</text><rect x="470" y="186" width="190" height="76" rx="6" fill="#fff" stroke="#8fa3b1"/><text x="486" y="216" font-size="17" fill="#23313d" font-weight="600">堆</text><text x="486" y="244" font-size="15" fill="#52616d">对象、缓存</text><text x="60" y="296" font-size="15" fill="#52616d">每个线程只有自己的栈和寄存器，其余全部共用</text><rect x="60" y="312" width="190" height="160" rx="6" fill="#fff" stroke="#8fa3b1"/><text x="76" y="342" font-size="17" fill="#23313d" font-weight="600">线程 1</text><rect x="76" y="356" width="158" height="40" rx="6" fill="#f2f5f8" stroke="#8fa3b1"/><text x="88" y="382" font-size="15" fill="#52616d">自己的栈</text><text x="76" y="426" font-size="15" fill="#52616d">内核调度</text><text x="76" y="452" font-size="15" fill="#52616d">可读写 stock</text><rect x="265" y="312" width="190" height="160" rx="6" fill="#fff" stroke="#8fa3b1"/><text x="281" y="342" font-size="17" fill="#23313d" font-weight="600">线程 2</text><rect x="281" y="356" width="158" height="40" rx="6" fill="#f2f5f8" stroke="#8fa3b1"/><text x="293" y="382" font-size="15" fill="#52616d">自己的栈</text><text x="281" y="426" font-size="15" fill="#52616d">内核调度</text><text x="281" y="452" font-size="15" fill="#52616d">可读写 stock</text><rect x="470" y="312" width="190" height="160" rx="6" fill="#fff" stroke="#8fa3b1"/><text x="486" y="342" font-size="17" fill="#23313d" font-weight="600">线程 3：事件循环</text><rect x="486" y="358" width="48" height="28" rx="14" fill="#e8f5ef" stroke="#74a28b"/><text x="510" y="377" font-size="12" fill="#23313d" text-anchor="middle">协程</text><rect x="486" y="396" width="48" height="28" rx="14" fill="#e8f5ef" stroke="#74a28b"/><text x="510" y="415" font-size="12" fill="#23313d" text-anchor="middle">协程</text><rect x="542" y="358" width="48" height="28" rx="14" fill="#e8f5ef" stroke="#74a28b"/><text x="566" y="377" font-size="12" fill="#23313d" text-anchor="middle">协程</text><rect x="542" y="396" width="48" height="28" rx="14" fill="#e8f5ef" stroke="#74a28b"/><text x="566" y="415" font-size="12" fill="#23313d" text-anchor="middle">协程</text><rect x="598" y="358" width="48" height="28" rx="14" fill="#e8f5ef" stroke="#74a28b"/><text x="622" y="377" font-size="12" fill="#23313d" text-anchor="middle">协程</text><rect x="598" y="396" width="48" height="28" rx="14" fill="#e8f5ef" stroke="#74a28b"/><text x="622" y="415" font-size="12" fill="#23313d" text-anchor="middle">协程</text><text x="486" y="452" font-size="15" fill="#52616d">只在 await 处切换</text><rect x="720" y="130" width="360" height="220" rx="6" fill="#fff" stroke="#8fa3b1"/><text x="740" y="166" font-size="19" fill="#23313d" font-weight="600">fork 出的子进程（PID 2）</text><rect x="740" y="186" width="320" height="70" rx="6" fill="#fff" stroke="#8fa3b1"/><text x="756" y="214" font-size="16" fill="#23313d">刚 fork 时与父进程共用物理页</text><text x="756" y="242" font-size="15" fill="#52616d">谁改哪一页，才给谁复制一份</text><rect x="740" y="268" width="320" height="62" rx="6" fill="#fbeceb" stroke="#b4473b"/><text x="756" y="296" font-size="16" fill="#23313d">子进程执行 stock -= 1</text><text x="756" y="320" font-size="15" fill="#b4473b">改的是自己那一份，父进程仍是 99</text><path d="M682 230H716" fill="none" stroke="#596775" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#process-thread-coroutine-a)"/><rect x="720" y="370" width="360" height="120" rx="6" fill="#e8f5ef" stroke="#74a28b"/><text x="740" y="402" font-size="17" fill="#23313d" font-weight="600">实验里创建一个的代价</text><text x="740" y="430" font-size="15" fill="#23313d">进程 约 0.2 ms，独占约 660 KiB</text><text x="740" y="454" font-size="15" fill="#23313d">线程 约 0.06 ms，约 17.6 KiB</text><text x="740" y="478" font-size="15" fill="#23313d">协程 约 0.002 ms，约 0.9 KiB</text>
</g></svg>
