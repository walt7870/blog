<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="550" viewBox="0 0 1120 550" role="img" aria-labelledby="race-and-deadlock-t race-and-deadlock-d">
<title id="race-and-deadlock-t">两个线程交错执行“先查后改”导致超卖，以及死锁的等待环</title><desc id="race-and-deadlock-d">左侧：线程甲和线程乙先后查到库存为 1，都决定卖出，各自扣减后库存变成负 1。右侧：线程 A→B 持有锁 A 等锁 B，线程 B→A 持有锁 B 等锁 A，形成等待环；修复方法是统一加锁顺序或设置等锁超时。</desc>
<defs><marker id="race-and-deadlock-a" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#596775"/></marker>
<marker id="race-and-deadlock-r" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#b4473b"/></marker></defs>
<rect width="1120" height="550" fill="#f7f9fb"/>
<g font-family="Arial, 'PingFang SC', sans-serif" fill="#23313d">
<text x="40" y="56" font-size="28" fill="#23313d" font-weight="600">先查后改被插队，和两把锁互相等待</text><text x="40" y="92" font-size="18" fill="#52616d">左：不加锁时两个线程交错执行；右：按相反顺序加锁形成等待环。</text><rect x="40" y="130" width="520" height="400" rx="6" fill="#fff" stroke="#8fa3b1"/><text x="60" y="166" font-size="19" fill="#23313d" font-weight="600">竞态：剩最后 1 件，卖给了两个人</text><text x="150" y="204" font-size="17" fill="#23313d" font-weight="600" text-anchor="middle">线程甲</text><text x="420" y="204" font-size="17" fill="#23313d" font-weight="600" text-anchor="middle">线程乙</text><path d="M150 214V500M420 214V500" stroke="#8fa3b1" stroke-dasharray="4 4"/><rect x="60" y="224" width="180" height="40" rx="6" fill="#fff" stroke="#8fa3b1"/><text x="150" y="250" font-size="15" fill="#23313d" text-anchor="middle">查：stock = 1，可以卖</text><rect x="330" y="284" width="180" height="40" rx="6" fill="#fff" stroke="#8fa3b1"/><text x="420" y="310" font-size="15" fill="#23313d" text-anchor="middle">查：stock = 1，可以卖</text><rect x="60" y="344" width="180" height="40" rx="6" fill="#fff" stroke="#8fa3b1"/><text x="150" y="370" font-size="15" fill="#23313d" text-anchor="middle">改：stock = 0</text><rect x="330" y="404" width="180" height="40" rx="6" fill="#fbeceb" stroke="#b4473b"/><text x="420" y="430" font-size="15" fill="#b4473b" text-anchor="middle">改：stock = −1</text><path d="M240 250L326 296" fill="none" stroke="#596775" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#race-and-deadlock-a)"/><path d="M330 304L244 356" fill="none" stroke="#596775" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#race-and-deadlock-a)"/><path d="M240 370L326 416" fill="none" stroke="#596775" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#race-and-deadlock-a)"/><text x="60" y="504" font-size="15" fill="#52616d">“查”和“改”之间没有保护，别的线程就能插进来</text><rect x="600" y="130" width="480" height="400" rx="6" fill="#fff" stroke="#8fa3b1"/><text x="620" y="166" font-size="19" fill="#23313d" font-weight="600">死锁：两笔转账按相反顺序加锁</text><rect x="640" y="210" width="160" height="60" rx="6" fill="#eaf3fb" stroke="#7694aa"/><text x="720" y="246" font-size="17" fill="#23313d" font-weight="600" text-anchor="middle">线程 A→B</text><rect x="880" y="210" width="160" height="60" rx="6" fill="#eaf3fb" stroke="#7694aa"/><text x="960" y="246" font-size="17" fill="#23313d" font-weight="600" text-anchor="middle">线程 B→A</text><rect x="640" y="360" width="160" height="60" rx="6" fill="#fdf1e4" stroke="#c7782f"/><text x="720" y="396" font-size="17" fill="#23313d" font-weight="600" text-anchor="middle">锁 A</text><rect x="880" y="360" width="160" height="60" rx="6" fill="#fdf1e4" stroke="#c7782f"/><text x="960" y="396" font-size="17" fill="#23313d" font-weight="600" text-anchor="middle">锁 B</text><path d="M720 356V274" fill="none" stroke="#596775" stroke-width="2" marker-end="url(#race-and-deadlock-a)"/><text x="660" y="318" font-size="14" fill="#52616d">持有</text><path d="M960 356V274" fill="none" stroke="#596775" stroke-width="2" marker-end="url(#race-and-deadlock-a)"/><text x="970" y="318" font-size="14" fill="#52616d">持有</text><path d="M790 272L888 356" fill="none" stroke="#b4473b" stroke-width="2" marker-end="url(#race-and-deadlock-r)"/><path d="M890 272L792 356" fill="none" stroke="#b4473b" stroke-width="2" marker-end="url(#race-and-deadlock-r)"/><text x="840" y="296" font-size="14" fill="#b4473b" text-anchor="middle">等待</text><text x="620" y="460" font-size="15" fill="#52616d">等待关系形成环，谁也不会先放手</text><text x="620" y="488" font-size="15" fill="#3f7a5c">修复：所有线程按同一顺序加锁，或等锁时设超时</text>
</g></svg>
