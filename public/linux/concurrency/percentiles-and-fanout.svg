<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="570" viewBox="0 0 1120 570" role="img" aria-labelledby="percentiles-and-fanout-t percentiles-and-fanout-d">
<title id="percentiles-and-fanout-t">延迟分布上的平均值与百分位，以及扇出放大慢请求的比例</title><desc id="percentiles-and-fanout-d">左图：扇出为 1 时，98% 的请求在 10 到 15 毫秒，2% 在 200 毫秒左右；P50 为 13 毫秒，P95 为 14 毫秒，平均 17 毫秒落在两堆之间，P99 为 206 毫秒。右图：超过 100 毫秒的请求比例随扇出增加，扇出 1、5、10、30 时分别为 2.2%、9.8%、18.9%、44.6%，与理论值 1 减 0.98 的 n 次方吻合。</desc>
<defs><marker id="percentiles-and-fanout-a" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#596775"/></marker>
<marker id="percentiles-and-fanout-r" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#b4473b"/></marker></defs>
<rect width="1120" height="570" fill="#f7f9fb"/>
<g font-family="Arial, 'PingFang SC', sans-serif" fill="#23313d">
<text x="40" y="56" font-size="28" fill="#23313d" font-weight="600">平均值落在没有请求的地方；扇出让慢请求成倍增加</text><text x="40" y="92" font-size="18" fill="#52616d">实测：下游 98% 的调用约 10 ms，2% 要 200 ms；每种扇出 2000 个请求。</text><rect x="40" y="130" width="520" height="420" rx="6" fill="#fff" stroke="#8fa3b1"/><text x="60" y="166" font-size="19" fill="#23313d" font-weight="600">扇出 1 时的耗时分布</text><path d="M70 440H540" stroke="#8fa3b1"/><path d="M70 440V446" stroke="#8fa3b1"/><text x="70.0" y="462" font-size="13" fill="#7a8794" text-anchor="middle">0</text><path d="M172 440V446" stroke="#8fa3b1"/><text x="172.17391304347825" y="462" font-size="13" fill="#7a8794" text-anchor="middle">50</text><path d="M274 440V446" stroke="#8fa3b1"/><text x="274.3478260869565" y="462" font-size="13" fill="#7a8794" text-anchor="middle">100</text><path d="M377 440V446" stroke="#8fa3b1"/><text x="376.5217391304348" y="462" font-size="13" fill="#7a8794" text-anchor="middle">150</text><path d="M479 440V446" stroke="#8fa3b1"/><text x="478.695652173913" y="462" font-size="13" fill="#7a8794" text-anchor="middle">200</text><text x="540" y="484" font-size="13" fill="#7a8794" text-anchor="end">ms</text><rect x="90.4" y="240" width="10.2" height="200" fill="#7694aa" stroke="none"/><text x="95.54347826086956" y="232" font-size="14" fill="#52616d" text-anchor="middle">98%</text><rect x="482.8" y="432" width="12.3" height="8" fill="#b4473b" stroke="none"/><text x="488.9130434782609" y="424" font-size="14" fill="#b4473b" text-anchor="middle">2%</text><path d="M96.6 240V440" stroke="#23313d" stroke-width="1.5" stroke-dasharray="3 3"/><path d="M96.6 265H129.4" stroke="#23313d" stroke-width="1"/><text x="135.3913043478261" y="270" font-size="14" fill="#23313d" font-weight="600">P50 = 13 ms</text><path d="M99.2 240V440" stroke="#23313d" stroke-width="1.5" stroke-dasharray="3 3"/><path d="M99.2 295H129.4" stroke="#23313d" stroke-width="1"/><text x="135.3913043478261" y="300" font-size="14" fill="#23313d" font-weight="600">P95 = 14 ms</text><path d="M104.9 240V440" stroke="#c7782f" stroke-width="1.5" stroke-dasharray="3 3"/><path d="M104.9 325H129.4" stroke="#c7782f" stroke-width="1"/><text x="135.3913043478261" y="330" font-size="14" fill="#c7782f" font-weight="600">平均 = 17 ms</text><path d="M491.6 240V440" stroke="#23313d" stroke-width="1.5" stroke-dasharray="3 3"/><text x="485.5695652173913" y="270" font-size="14" fill="#23313d" font-weight="600" text-anchor="end">P99 = 206 ms</text><text x="60" y="520" font-size="15" fill="#52616d">平均值 17 ms 夹在两堆之间，没有一个请求接近它</text><rect x="600" y="130" width="480" height="420" rx="6" fill="#fff" stroke="#8fa3b1"/><text x="620" y="166" font-size="19" fill="#23313d" font-weight="600">超过 100 ms 的请求比例</text><rect x="650.0" y="439.88" width="60.0" height="10.120000000000001" fill="#7694aa" stroke="none"/><text x="680" y="429.88" font-size="15" fill="#23313d" font-weight="600" text-anchor="middle">2.2%</text><text x="680" y="474" font-size="14" fill="#52616d" text-anchor="middle">扇出 1</text><rect x="755.0" y="404.92" width="60.0" height="45.08" fill="#c7782f" stroke="none"/><text x="785" y="394.92" font-size="15" fill="#23313d" font-weight="600" text-anchor="middle">9.8%</text><text x="785" y="474" font-size="14" fill="#52616d" text-anchor="middle">扇出 5</text><rect x="860.0" y="363.06" width="60.0" height="86.93999999999998" fill="#c7782f" stroke="none"/><text x="890" y="353.06" font-size="15" fill="#23313d" font-weight="600" text-anchor="middle">18.9%</text><text x="890" y="474" font-size="14" fill="#52616d" text-anchor="middle">扇出 10</text><rect x="965.0" y="244.84" width="60.0" height="205.16" fill="#c7782f" stroke="none"/><text x="995" y="234.84" font-size="15" fill="#23313d" font-weight="600" text-anchor="middle">44.6%</text><text x="995" y="474" font-size="14" fill="#52616d" text-anchor="middle">扇出 30</text><path d="M640 450H1060" stroke="#8fa3b1"/><text x="620" y="504" font-size="15" fill="#52616d">理论值 1 − 0.98ⁿ：2.0%、9.6%、18.3%、45.5%</text><text x="620" y="528" font-size="15" fill="#52616d">要等最慢的那个，任何一个慢，整个请求就慢</text>
</g></svg>
