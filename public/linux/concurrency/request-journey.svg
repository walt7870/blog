<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="520" viewBox="0 0 1120 520" role="img" aria-labelledby="request-journey-t request-journey-d">
<title id="request-journey-t">订单详情请求经过的地方</title><desc id="request-journey-d">请求到达后在队列排队，由线程池中的执行者处理；处理时大部分时间等待数据库和下游，小部分时间计算签名；修改库存这样的共享数据需要加锁；最后响应耗时进入 P50、P99 等统计。图中标出了每一处对应的篇号。</desc>
<defs><marker id="request-journey-a" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#596775"/></marker>
<marker id="request-journey-r" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#b4473b"/></marker></defs>
<rect width="1120" height="520" fill="#f7f9fb"/>
<g font-family="Arial, 'PingFang SC', sans-serif" fill="#23313d">
<text x="40" y="56" font-size="28" fill="#23313d" font-weight="600">订单详情请求经过的地方</text><text x="40" y="92" font-size="18" fill="#52616d">每一处对应系列里的一篇；方框右上角是篇号。</text><rect x="40" y="150" width="170" height="110" rx="6" fill="#fff" stroke="#8fa3b1"/><text x="58" y="190" font-size="19" fill="#23313d" font-weight="600">请求到达</text><text x="58" y="220" font-size="16" fill="#52616d">每秒 500 个</text><text x="58" y="244" font-size="16" fill="#52616d">到达时刻随机</text><rect x="250" y="150" width="200" height="110" rx="6" fill="#fdf1e4" stroke="#c7782f"/><text x="268" y="190" font-size="19" fill="#23313d" font-weight="600">队列</text><text x="268" y="220" font-size="16" fill="#52616d">线程都忙时排队</text><rect x="400" y="140" width="32" height="22" rx="11" fill="#23313d"/><text x="416.0" y="156" font-size="13" fill="#fff" font-weight="600" text-anchor="middle">05</text><rect x="270" y="232" width="22" height="16" rx="3" fill="#fff" stroke="#c7782f"/><rect x="298" y="232" width="22" height="16" rx="3" fill="#fff" stroke="#c7782f"/><rect x="326" y="232" width="22" height="16" rx="3" fill="#fff" stroke="#c7782f"/><rect x="354" y="232" width="22" height="16" rx="3" fill="#fff" stroke="#c7782f"/><rect x="382" y="232" width="22" height="16" rx="3" fill="#fff" stroke="#c7782f"/><rect x="410" y="232" width="22" height="16" rx="3" fill="#fff" stroke="#c7782f"/><rect x="490" y="130" width="270" height="150" rx="6" fill="#eaf3fb" stroke="#7694aa"/><text x="508" y="170" font-size="19" fill="#23313d" font-weight="600">工作线程池</text><text x="508" y="198" font-size="16" fill="#52616d">进程、线程或协程在执行</text><rect x="670" y="120" width="32" height="22" rx="11" fill="#23313d"/><text x="686.0" y="136" font-size="13" fill="#fff" font-weight="600" text-anchor="middle">01</text><rect x="712" y="120" width="32" height="22" rx="11" fill="#23313d"/><text x="728.0" y="136" font-size="13" fill="#fff" font-weight="600" text-anchor="middle">03</text><rect x="510" y="218" width="24" height="40" rx="4" fill="#fff" stroke="#7694aa"/><rect x="543" y="218" width="24" height="40" rx="4" fill="#fff" stroke="#7694aa"/><rect x="576" y="218" width="24" height="40" rx="4" fill="#fff" stroke="#7694aa"/><rect x="609" y="218" width="24" height="40" rx="4" fill="#fff" stroke="#7694aa"/><rect x="642" y="218" width="24" height="40" rx="4" fill="#fff" stroke="#7694aa"/><rect x="675" y="218" width="24" height="40" rx="4" fill="#d6e4ef" stroke="#7694aa"/><rect x="708" y="218" width="24" height="40" rx="4" fill="#d6e4ef" stroke="#7694aa"/><rect x="800" y="120" width="280" height="95" rx="6" fill="#fff" stroke="#8fa3b1"/><text x="818" y="156" font-size="17" fill="#23313d" font-weight="600">等待：查库、库存、物流、优惠</text><text x="818" y="186" font-size="16" fill="#52616d">约 38 ms，CPU 空闲</text><rect x="990" y="110" width="32" height="22" rx="11" fill="#23313d"/><text x="1006.0" y="126" font-size="13" fill="#fff" font-weight="600" text-anchor="middle">02</text><rect x="1032" y="110" width="32" height="22" rx="11" fill="#23313d"/><text x="1048.0" y="126" font-size="13" fill="#fff" font-weight="600" text-anchor="middle">06</text><rect x="800" y="230" width="280" height="70" rx="6" fill="#fff" stroke="#8fa3b1"/><text x="818" y="262" font-size="17" fill="#23313d" font-weight="600">计算：给响应签名</text><text x="818" y="288" font-size="16" fill="#52616d">约 2 ms，占用 CPU</text><rect x="1032" y="220" width="32" height="22" rx="11" fill="#23313d"/><text x="1048.0" y="236" font-size="13" fill="#fff" font-weight="600" text-anchor="middle">02</text><rect x="490" y="330" width="270" height="96" rx="6" fill="#fbeceb" stroke="#b4473b"/><text x="508" y="366" font-size="19" fill="#23313d" font-weight="600">共享数据：库存</text><text x="508" y="396" font-size="16" fill="#52616d">多个线程同时改，要靠锁</text><rect x="712" y="320" width="32" height="22" rx="11" fill="#23313d"/><text x="728.0" y="336" font-size="13" fill="#fff" font-weight="600" text-anchor="middle">04</text><rect x="800" y="330" width="280" height="96" rx="6" fill="#e8f5ef" stroke="#74a28b"/><text x="818" y="366" font-size="19" fill="#23313d" font-weight="600">返回响应</text><text x="818" y="396" font-size="16" fill="#52616d">耗时进入统计：P50、P99</text><rect x="1032" y="320" width="32" height="22" rx="11" fill="#23313d"/><text x="1048.0" y="336" font-size="13" fill="#fff" font-weight="600" text-anchor="middle">06</text><path d="M212 205H246" fill="none" stroke="#596775" stroke-width="2" marker-end="url(#request-journey-a)"/><path d="M452 205H486" fill="none" stroke="#596775" stroke-width="2" marker-end="url(#request-journey-a)"/><path d="M762 175H796" fill="none" stroke="#596775" stroke-width="2" marker-end="url(#request-journey-a)"/><path d="M762 255H796" fill="none" stroke="#596775" stroke-width="2" marker-end="url(#request-journey-a)"/><path d="M625 282V326" fill="none" stroke="#596775" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#request-journey-a)"/><path d="M940 302V326" fill="none" stroke="#596775" stroke-width="2" marker-end="url(#request-journey-a)"/><rect x="40" y="450" width="1040" height="50" rx="6" fill="#fff" stroke="#8fa3b1"/><text x="60" y="482" font-size="16" fill="#52616d">响应时间 = 排队时间 + 处理时间（等待 + 计算）。平均在途请求数 = 到达速率 × 响应时间，这是第 05 篇的 Little 定律。</text>
</g></svg>
