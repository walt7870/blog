<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="610" viewBox="0 0 1120 610" role="img" aria-labelledby="concurrency-vs-parallelism-t concurrency-vs-parallelism-d">
<title id="concurrency-vs-parallelism-t">并发让等待重叠，并行让计算分摊</title><desc id="concurrency-vs-parallelism-d">三条时间线：4 个线程等数据库，等待互相重叠，总共约 0.5 秒；4 个线程做纯 Python 计算，受 GIL 限制轮流执行，约 1.5 秒，与顺序执行相同；4 个进程在 4 个核上同时计算，约 0.54 秒。</desc>
<defs><marker id="concurrency-vs-parallelism-a" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#596775"/></marker>
<marker id="concurrency-vs-parallelism-r" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#b4473b"/></marker></defs>
<rect width="1120" height="610" fill="#f7f9fb"/>
