<title id="utilization-curve-t">利用率与平均响应时间的关系曲线</title><desc id="utilization-curve-d">横轴是工作线程的利用率，纵轴是平均响应时间。处理时间平均 10 毫秒，利用率 50% 时响应 20 毫秒，80% 时 51 毫秒，90% 时 103 毫秒，95% 时 207 毫秒，99% 时超过 1.5 秒；模拟点与公式曲线吻合，越接近 100% 曲线越陡。</desc>
<defs><marker id="utilization-curve-a" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#596775"/></marker>
