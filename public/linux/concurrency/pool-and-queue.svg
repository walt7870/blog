<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="594" viewBox="0 0 1120 594" role="img" aria-labelledby="pool-and-queue-t pool-and-queue-d">
<title id="pool-and-queue-t">线程池的排队模型与 Little 定律</title><desc id="pool-and-queue-d">请求以每秒 500 个到达，线程都忙时进入队列，由 N 个线程处理，每个约 42 毫秒。Little 定律给出平均在途数约 21 个。实测线程池 8 和 16 时跟不上到达速度，响应时间达到秒级和半秒；24 个以上时响应时间回到 42 毫秒。</desc>
<defs><marker id="pool-and-queue-a" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#596775"/></marker>
<marker id="pool-and-queue-r" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#b4473b"/></marker></defs>
<rect width="1120" height="594" fill="#f7f9fb"/>
<g font-family="Arial, 'PingFang SC', sans-serif" fill="#23313d">
<text x="40" y="56" font-size="28" fill="#23313d" font-weight="600">线程池的排队模型与 Little 定律</text><text x="40" y="92" font-size="18" fill="#52616d">实测：每秒到达 500 个请求，每个处理约 42 ms（等待 40 ms + 计算约 1.5 ms）。</text><rect x="40" y="140" width="160" height="100" rx="6" fill="#fff" stroke="#8fa3b1"/><text x="58" y="180" font-size="19" fill="#23313d" font-weight="600">到达</text><text x="58" y="210" font-size="16" fill="#52616d">λ = 500 个/秒</text><rect x="240" y="140" width="220" height="100" rx="6" fill="#fdf1e4" stroke="#c7782f"/><text x="258" y="180" font-size="19" fill="#23313d" font-weight="600">队列</text><text x="258" y="210" font-size="16" fill="#52616d">线程都忙时在这里等</text><rect x="500" y="120" width="330" height="140" rx="6" fill="#eaf3fb" stroke="#7694aa"/><text x="518" y="158" font-size="19" fill="#23313d" font-weight="600">线程池：N 个线程</text><text x="518" y="186" font-size="16" fill="#52616d">每个请求占一个线程 W ≈ 42 ms</text><rect x="518" y="204" width="24" height="40" rx="4" fill="#fff" stroke="#7694aa"/><rect x="551" y="204" width="24" height="40" rx="4" fill="#fff" stroke="#7694aa"/><rect x="584" y="204" width="24" height="40" rx="4" fill="#fff" stroke="#7694aa"/><rect x="617" y="204" width="24" height="40" rx="4" fill="#fff" stroke="#7694aa"/><rect x="650" y="204" width="24" height="40" rx="4" fill="#fff" stroke="#7694aa"/><rect x="683" y="204" width="24" height="40" rx="4" fill="#fff" stroke="#7694aa"/><rect x="716" y="204" width="24" height="40" rx="4" fill="#fff" stroke="#7694aa"/><rect x="749" y="204" width="24" height="40" rx="4" fill="#fff" stroke="#7694aa"/><rect x="782" y="204" width="24" height="40" rx="4" fill="#fff" stroke="#7694aa"/><rect x="870" y="140" width="210" height="100" rx="6" fill="#e8f5ef" stroke="#74a28b"/><text x="888" y="180" font-size="19" fill="#23313d" font-weight="600">完成</text><text x="888" y="210" font-size="16" fill="#52616d">吞吐量</text><path d="M202 190H236" fill="none" stroke="#596775" stroke-width="2" marker-end="url(#pool-and-queue-a)"/><path d="M462 190H496" fill="none" stroke="#596775" stroke-width="2" marker-end="url(#pool-and-queue-a)"/><path d="M832 190H866" fill="none" stroke="#596775" stroke-width="2" marker-end="url(#pool-and-queue-a)"/><rect x="40" y="290" width="1040" height="70" rx="6" fill="#fff" stroke="#8fa3b1"/><text x="60" y="322" font-size="19" fill="#23313d" font-weight="600">Little 定律：平均在途数 L = 到达速率 λ × 平均响应时间 W</text><text x="60" y="348" font-size="16" fill="#52616d">500 个/秒 × 0.042 秒 ≈ 21 个；实测线程池足够时，平均在途 20.6 个。</text><text x="60" y="400" font-size="15" fill="#7a8794">线程数</text><text x="220" y="400" font-size="15" fill="#7a8794">完成速度</text><text x="420" y="400" font-size="15" fill="#7a8794">平均响应</text><text x="60" y="432" font-size="17" fill="#b4473b" font-weight="600">8</text><text x="220" y="432" font-size="16" fill="#b4473b">178 个/秒</text><text x="420" y="432" font-size="16" fill="#b4473b">2655 ms</text><text x="600" y="432" font-size="16" fill="#b4473b">队列越积越长</text><text x="60" y="462" font-size="17" fill="#b4473b" font-weight="600">16</text><text x="220" y="462" font-size="16" fill="#b4473b">371 个/秒</text><text x="420" y="462" font-size="16" fill="#b4473b">519 ms</text><text x="600" y="462" font-size="16" fill="#b4473b">仍然跟不上</text><text x="60" y="492" font-size="17" fill="#23313d" font-weight="600">24</text><text x="220" y="492" font-size="16" fill="#23313d">493 个/秒</text><text x="420" y="492" font-size="16" fill="#23313d">43 ms</text><text x="600" y="492" font-size="16" fill="#23313d">刚好够用</text><text x="60" y="522" font-size="17" fill="#23313d" font-weight="600">256</text><text x="220" y="522" font-size="16" fill="#23313d">493 个/秒</text><text x="420" y="522" font-size="16" fill="#23313d">42 ms</text><text x="600" y="522" font-size="16" fill="#23313d">再多也没有变化</text><text x="60" y="568" font-size="16" fill="#52616d">线程数下限 ≈ λ × 处理时间 ≈ 21；上限参考 ≈ 核数 × (1 + 等待 ÷ 计算) = 2 × (1 + 40 ÷ 1.5) ≈ 55。</text>
</g></svg>
