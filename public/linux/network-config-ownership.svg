<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="648" viewBox="0 0 1120 648" role="img" aria-labelledby="ownership-title ownership-desc">
<title id="ownership-title">网络配置来源与运行状态</title>
<desc id="ownership-desc">持久声明交给实际网络管理器，再应用到内核地址和路由，并按配置把DNS交给解析服务；临时ip命令只改变运行状态，验收失败回到来源恢复。</desc>
<defs><marker id="ownership-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#7d898c"/></marker><style>text{font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#253238}.h{font-size:25px;font-weight:700}.n{font-size:21px;font-weight:600}.b{font-size:18px;fill:#4d5d63}.box{fill:#fff;stroke:#c7d0d3;stroke-width:1.5}.edge{fill:none;stroke:#7d898c;stroke-width:1.5;marker-end:url(#ownership-arrow)}</style></defs>
<rect width="1120" height="648" fill="#f7f9fa"/>
<text class="h" x="36" y="46">先找到配置管理者，再决定修改入口与回退</text>
<text class="b" x="36" y="82">选择当前系统实际使用的链路；同一接口不要同时交给多套管理器。</text>
<path class="edge" d="M324 206H416"/><path class="edge" d="M704 206H800"/>
<path class="edge" d="M560 278V372"/>
<path class="edge" d="M942 372V278" stroke-dasharray="5 4"/>
<rect class="box" x="36" y="134" width="288" height="144" rx="6"/>
<text class="n" x="54" y="170">持久配置来源</text><text class="b" x="54" y="208">连接配置 / .network</text><text class="b" x="54" y="242">Netplan 或云初始化声明</text>
<rect x="416" y="134" width="288" height="144" rx="6" fill="#eff5fc" stroke="#a4b9cc" stroke-width="1.5"/>
<text class="n" x="434" y="170">实际网络管理器</text><text class="b" x="434" y="208">NetworkManager / networkd</text><text class="b" x="434" y="242">应用、续租或重连时生成</text>
<rect class="box" x="800" y="134" width="284" height="144" rx="6"/>
<text class="n" x="818" y="170">内核运行状态</text><text class="b" x="818" y="208">地址 / 路由 / 策略规则</text><text class="b" x="818" y="242">用 ip 查询当前事实</text>
<rect x="416" y="372" width="288" height="144" rx="6" fill="#e7f3ef" stroke="#69978c" stroke-width="1.5"/>
<text class="n" x="434" y="408">解析服务与配置</text><text class="b" x="434" y="446">按配套设置接收链路 DNS</text><text class="b" x="434" y="480">核对 resolv.conf 管理关系</text>
<rect class="box" x="800" y="372" width="284" height="144" rx="6"/>
<text class="n" x="818" y="408">临时 ip 修改</text><text class="b" x="818" y="446">只改变当前运行状态</text><text class="b" x="818" y="480">重应用后可能被覆盖</text>
<text class="b" x="36" y="408">变更前备份配置来源</text><text class="b" x="36" y="446">保留控制台与回退入口</text><text class="b" x="36" y="484">失败从来源恢复再验收</text>
<text class="b" x="36" y="570">验收：新连接可达 → 应用解析正确 → 业务请求成功 → 维护窗口确认重新应用后的持久状态。</text>
<text class="b" x="36" y="608">实线表示管理器应用配置；虚线表示临时操作。防火墙和云安全组还需各自核对管理来源。</text>
</svg>
