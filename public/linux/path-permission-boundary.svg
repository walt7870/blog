<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="560" viewBox="0 0 1120 560" role="img" aria-labelledby="path-permission-boundary-title path-permission-boundary-desc">
<title id="path-permission-boundary-title">访问文件要经过父目录，删除修改的是目录项</title><desc id="path-permission-boundary-desc">以下画操作对象，不代表内核固定检查顺序；ACL、挂载与安全策略还会进一步限制。</desc>
<defs><marker id="path-permission-boundary-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" fill="#738288"/></marker>
<style>text{font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#253238} .heading{font-size:25px;font-weight:600}.name{font-size:21px;font-weight:600}.body{font-size:18px}.note{font-size:17px;fill:#52656c}.line{fill:none;stroke:#738288;stroke-width:1.8;marker-end:url(#path-permission-boundary-arrow)}.box{fill:#fff;stroke:#bac6cc;stroke-width:1.3}.focus{fill:#e8f4ef;stroke:#67877b;stroke-width:1.5}.soft{fill:#f0f5fc;stroke:#a8bacd;stroke-width:1.3}</style></defs>
<rect width="1120" height="560" fill="#f8fafb"/>
<text class="heading" x="52" y="54">访问文件要经过父目录，删除修改的是目录项</text><text class="note" x="52" y="88">以下画操作对象，不代表内核固定检查顺序；ACL、挂载与安全策略还会进一步限制。</text><path class="line" d="M280 200H370"/><path class="line" d="M650 200H740"/><path class="line" d="M204 360V286Q204 278 212 278H470Q478 278 478 270V250"/><path class="line" d="M782 360V298Q782 290 790 290H900V250"/><rect data-node="/opt" class="box" x="52" y="144" width="228" height="106" rx="6"/><text class="name" x="70" y="176">/opt</text><text class="body" x="70" y="205">路径搜索需要x</text><rect data-node="order-api/exports" class="focus" x="370" y="144" width="280" height="106" rx="6"/><text class="name" x="388" y="176">order-api/exports</text><text class="body" x="388" y="205">搜索x；创建/删除需w+x</text><rect data-node="orders.csv" class="box" x="740" y="144" width="328" height="106" rx="6"/><text class="name" x="758" y="176">orders.csv</text><text class="body" x="758" y="205">读取看文件r；修改看w</text><rect data-node="删除 orders.csv" class="box" x="52" y="360" width="464" height="106" rx="6"/><text class="name" x="70" y="392">删除 orders.csv</text><text class="body" x="70" y="421">改变父目录中的名称</text><text class="body" x="70" y="446">文件只读不一定阻止删除</text><rect data-node="读取 CSV内容" class="box" x="632" y="360" width="436" height="106" rx="6"/><text class="name" x="650" y="392">读取 CSV内容</text><text class="body" x="650" y="421">路径每级需能搜索</text><text class="body" x="650" y="446">再判断目标文件读取权限</text><text class="note" x="52" y="528">sticky目录、immutable、只读挂载等会增加约束；单独chmod文件不能替代逐层定位。</text></svg>
