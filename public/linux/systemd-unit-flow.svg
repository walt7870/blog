<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="560" viewBox="0 0 1120 560" role="img" aria-labelledby="systemd-unit-flow-title systemd-unit-flow-desc">
<title id="systemd-unit-flow-title">配置加载、进程执行与应用就绪有不同边界</title>
<desc id="systemd-unit-flow-desc">展示unit被管理器加载并启动进程、应用初始化与就绪验证，同时输出日志用于失败诊断。</desc>
<defs><marker id="systemd-unit-flow-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#7d898c"/></marker>
<style>text{font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#253238}.heading{font-size:25px;font-weight:700}.name{font-size:21px;font-weight:600}.body{font-size:17px;fill:#4d5d63}.box{fill:#fff;stroke:#c7d0d3;stroke-width:1.5}.focus{fill:#e7f3ef;stroke:#69978c;stroke-width:1.5}.blue{fill:#eff5fc;stroke:#a4b9cc;stroke-width:1.5}.edge{fill:none;stroke:#7d898c;stroke-width:1.5;marker-end:url(#systemd-unit-flow-arrow)}.label{font-size:16px;fill:#4d5d63}</style></defs>
<rect width="1120" height="560" fill="#f7f9fa"/>
<text class="heading" x="36" y="46">配置加载、进程执行与应用就绪有不同边界</text>
<text class="body" x="36" y="80">enable建立安装链接；start改变运行状态；daemon-reload不会自动重启服务。</text><path class="edge" d="M256 196H320"/><path class="edge" d="M540 196H604"/><path class="edge" d="M824 196H888"/><path class="edge" d="M714 252V364"/><path class="edge" d="M998 252V388Q998 396 990 396H824"/><rect x="262" y="162" width="54" height="24" fill="#f7f9fa"/><text class="label" x="266" y="180">加载</text><rect x="546" y="162" width="54" height="24" fill="#f7f9fa"/><text class="label" x="550" y="180">启动</text><rect x="828" y="162" width="56" height="24" fill="#f7f9fa"/><text class="label" x="832" y="180">初始化</text><rect x="724" y="304" width="100" height="24" fill="#f7f9fa"/><text class="label" x="728" y="322">标准输出</text><rect x="922" y="326" width="68" height="24" fill="#f7f9fa"/><text class="label" x="926" y="344">观测</text><rect class="box" x="36" y="140" width="220" height="112" rx="6"/><text class="name" x="54" y="172">unit / drop-in</text><text class="body" x="54" y="202">路径、身份、依赖</text><text class="body" x="54" y="228">Restart与启动限流</text><rect class="blue" x="320" y="140" width="220" height="112" rx="6"/><text class="name" x="338" y="172">systemd管理器</text><text class="body" x="338" y="202">读取配置并调度</text><text class="body" x="338" y="228">维护状态与cgroup</text><rect class="box" x="604" y="140" width="220" height="112" rx="6"/><text class="name" x="622" y="172">前台主进程</text><text class="body" x="622" y="202">Type=exec：执行成功</text><text class="body" x="622" y="228">不等于端口就绪</text><rect class="focus" x="888" y="140" width="196" height="112" rx="6"/><text class="name" x="906" y="172">应用就绪</text><text class="body" x="906" y="202">notify需主动通知</text><text class="body" x="906" y="228">仍要验业务请求</text><rect class="box" x="604" y="364" width="220" height="108" rx="6"/><text class="name" x="622" y="396">journal / 诊断</text><text class="body" x="622" y="426">日志、Result、退出码</text><text class="body" x="622" y="452">定位后同入口复验</text><text class="body" x="36" y="396">失败后的重启由管理器按Restart与限流策略决定。</text><text class="body" x="36" y="426">network-online只提供启动同步，不能保证远端依赖可用。</text><text class="body" x="36" y="516">这里分离了状态、日志与业务健康：日志不是依赖图的下一启动阶段。</text>
</svg>
