<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="560" viewBox="0 0 1120 560" role="img" aria-labelledby="process-model-title process-model-desc">
<title id="process-model-title">主机进程树中的用户服务与内核线程</title>
<desc id="process-model-desc">区分早期内核任务派生的PID1和kthreadd分支，并说明线程与cgroup不是相同关系。</desc>
<defs><marker id="process-model-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#7d898c"/></marker>
<style>text{font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#253238}.heading{font-size:25px;font-weight:700}.name{font-size:21px;font-weight:600}.body{font-size:17px;fill:#4d5d63}.box{fill:#fff;stroke:#c7d0d3;stroke-width:1.5}.focus{fill:#e7f3ef;stroke:#69978c;stroke-width:1.5}.blue{fill:#eff5fc;stroke:#a4b9cc;stroke-width:1.5}.edge{fill:none;stroke:#7d898c;stroke-width:1.5;marker-end:url(#process-model-arrow)}.label{font-size:16px;fill:#4d5d63}</style></defs>
<rect width="1120" height="560" fill="#f7f9fa"/>
<text class="heading" x="36" y="46">主机进程树中的用户服务与内核线程</text>
<text class="body" x="36" y="80">这是主机初始PID命名空间的简图，省略早期启动细节与部分内核线程创建路径。</text><path class="edge" d="M500 172V192Q500 200 492 200H208Q200 200 200 208V240"/><path class="edge" d="M620 172V192Q620 200 628 200H832Q840 200 840 208V240"/><path class="edge" d="M200 336V392"/><path class="edge" d="M840 336V392"/><rect class="blue" x="400" y="104" width="320" height="68" rx="6"/><text class="name" x="418" y="136">早期内核任务</text><rect class="focus" x="40" y="240" width="320" height="96" rx="6"/><text class="name" x="58" y="272">PID 1：init / systemd</text><text class="body" x="58" y="302">用户空间初始化与服务管理</text><rect class="blue" x="680" y="240" width="320" height="96" rx="6"/><text class="name" x="698" y="272">PID 2：kthreadd</text><text class="body" x="698" y="302">创建许多内核线程</text><rect class="box" x="40" y="392" width="320" height="96" rx="6"/><text class="name" x="58" y="424">用户服务与后代</text><text class="body" x="58" y="454">Shell、订单进程及其子进程</text><rect class="box" x="680" y="392" width="320" height="96" rx="6"/><text class="name" x="698" y="424">内核线程</text><text class="body" x="698" y="454">kworker、kswapd等</text><text class="body" x="40" y="532">父子树看PPID；线程共享看TID与地址空间；服务管理与资源归属另看cgroup。</text>
</svg>
