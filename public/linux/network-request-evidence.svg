<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="600" viewBox="0 0 1120 600" role="img" aria-labelledby="request-title request-desc">
<title id="request-title">HTTPS请求的分阶段证据</title>
<desc id="request-desc">从应用所在网络环境出发，依次检查名字与路由、TCP与TLS、HTTP与业务结果，每阶段都说明工具能证明和不能证明的范围。</desc>
<defs><marker id="request-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#7d898c"/></marker><style>text{font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#253238}.h{font-size:25px;font-weight:700}.n{font-size:22px;font-weight:600}.b{font-size:18px;fill:#4d5d63}.k{font-size:18px;font-weight:600}.box{fill:#fff;stroke:#c7d0d3;stroke-width:1.5}.edge{fill:none;stroke:#7d898c;stroke-width:1.5;marker-end:url(#request-arrow)}</style></defs>
<rect width="1120" height="600" fill="#f7f9fa"/>
<text class="h" x="36" y="48">支付接口超时，先定位停在哪个阶段</text>
<text class="b" x="36" y="84">在应用相同的 namespace、代理、地址族与证书环境中验证；宿主机成功不能代替容器成功。</text>
<path class="edge" d="M352 294H400"/><path class="edge" d="M720 294H768"/>
<rect class="box" x="36" y="140" width="316" height="320" rx="6"/>
<rect x="400" y="140" width="320" height="320" rx="6" fill="#eff5fc" stroke="#a4b9cc" stroke-width="1.5"/>
<rect x="768" y="140" width="316" height="320" rx="6" fill="#e7f3ef" stroke="#69978c" stroke-width="1.5"/>
<text class="n" x="56" y="182">名字与路由</text>
<text class="b" x="56" y="220">getent / dig / ip route get</text>
<text class="k" x="56" y="272">取得的证据</text>
<text class="b" x="56" y="310">解析结果、出口、源地址</text>
<text class="k" x="56" y="368">还不能证明</text>
<text class="b" x="56" y="406">连接可达、对端服务正常</text>
<text class="n" x="420" y="182">TCP 与 TLS</text>
<text class="b" x="420" y="220">ss / nc / curl</text>
<text class="k" x="420" y="272">取得的证据</text>
<text class="b" x="420" y="310">建连、证书与协议协商</text>
<text class="k" x="420" y="368">还不能证明</text>
<text class="b" x="420" y="406">HTTP 成功、订单已完成</text>
<text class="n" x="788" y="182">HTTP 与业务</text>
<text class="b" x="788" y="220">真实方法、鉴权、响应体</text>
<text class="k" x="788" y="272">取得的证据</text>
<text class="b" x="788" y="310">状态码、字段、订单状态</text>
<text class="k" x="788" y="368">仍需按合同核对</text>
<text class="b" x="788" y="406">幂等、重试与最终对账</text>
<text class="b" x="36" y="518">例：8080 正在监听，GET /missing 仍返回 404。TCP 连接成功，不等于请求资源存在。</text>
<text class="b" x="36" y="554">ping 不回包、路径中间跳丢探测包，也不能单独判定 HTTPS 故障。</text>
</svg>
