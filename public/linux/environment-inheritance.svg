<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="560" viewBox="0 0 1120 560" role="img" aria-labelledby="env-inherit-title env-inherit-desc">
<title id="env-inherit-title">环境在创建子进程时复制</title><desc id="env-inherit-desc">局部变量留在shell，export将变量传给之后创建的子进程；子进程修改不返回父进程，既有服务也不会同步更新。</desc>
<defs><marker id="env-inherit-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" fill="#738288"/></marker><style>text{font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#253238}.heading{font-size:25px;font-weight:600}.name{font-size:21px;font-weight:600}.body{font-size:18px}.note{font-size:17px;fill:#52656c}.line{fill:none;stroke:#738288;stroke-width:1.8;marker-end:url(#env-inherit-arrow)}.box{fill:#fff;stroke:#bac6cc;stroke-width:1.3}.focus{fill:#e8f4ef;stroke:#67877b;stroke-width:1.5}.soft{fill:#f0f5fc;stroke:#a8bacd;stroke-width:1.3}</style></defs>
<rect width="1120" height="560" fill="#f8fafb"/><text class="heading" x="52" y="54">export 影响之后启动的子进程</text><text class="note" x="52" y="88">环境是各进程自己的字符串集合；修改当前终端不会刷新已经运行的订单服务。</text>
<path class="line" d="M332 224H416"/><path class="line" d="M688 224H772"/>
<rect data-node="父shell" class="box" x="52" y="160" width="280" height="128" rx="6"/><text class="name" x="72" y="196">父 shell：MODE=local</text><text class="body" x="72" y="230">普通赋值留在 shell 中</text><text class="body" x="72" y="260">export 后加入子进程环境</text>
<rect data-node="子进程启动" class="focus" x="416" y="160" width="272" height="128" rx="6"/><text class="name" x="436" y="196">新建子进程</text><text class="body" x="436" y="230">启动时继承 local</text><text class="body" x="436" y="260">可接收单次命令前的赋值</text>
<rect data-node="子进程修改" class="soft" x="772" y="160" width="296" height="128" rx="6"/><text class="name" x="792" y="196">子进程改为 child</text><text class="body" x="792" y="230">只修改自己的副本</text><text class="body" x="792" y="260">父 shell 仍为 local</text>
<rect data-node="已有服务" class="box" x="52" y="372" width="440" height="100" rx="6"/><text class="name" x="72" y="408">之前启动的进程保留原环境</text><text class="body" x="72" y="440">由实际服务启动入口配置并重新启动后复验</text>
<text class="note" x="52" y="522">启动文件取决于 shell 与登录/交互模式；systemd 不自动读取用户的 .bashrc。</text></svg>
