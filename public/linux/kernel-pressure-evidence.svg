<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="560" viewBox="0 0 1120 560" role="img" aria-labelledby="kernel-pressure-evidence-title kernel-pressure-evidence-desc">
<title id="kernel-pressure-evidence-title">内核后台活动要与压力来源一起观察</title>
<desc id="kernel-pressure-evidence-desc">通过工作队列、软中断和页回收三条观测链关联资源压力、线程活动与同时间窗证据。</desc>
<defs><marker id="kernel-pressure-evidence-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#7d898c"/></marker>
<style>text{font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#253238}.heading{font-size:25px;font-weight:700}.name{font-size:21px;font-weight:600}.body{font-size:17px;fill:#4d5d63}.box{fill:#fff;stroke:#c7d0d3;stroke-width:1.5}.focus{fill:#e7f3ef;stroke:#69978c;stroke-width:1.5}.blue{fill:#eff5fc;stroke:#a4b9cc;stroke-width:1.5}.edge{fill:none;stroke:#7d898c;stroke-width:1.5;marker-end:url(#kernel-pressure-evidence-arrow)}.label{font-size:16px;fill:#4d5d63}</style></defs>
<rect width="1120" height="560" fill="#f7f9fa"/>
<text class="heading" x="36" y="46">内核后台活动要与压力来源一起观察</text>
<text class="body" x="36" y="80">箭头表达压力与观测关系，不是父子树；计数要比较采样增量。</text><path class="edge" d="M324 168H432"/><path class="edge" d="M688 168H800"/><path class="edge" d="M324 304H432"/><path class="edge" d="M688 304H800"/><path class="edge" d="M324 440H432"/><path class="edge" d="M688 440H800"/><rect class="box" x="36" y="112" width="288" height="104" rx="6"/><text class="name" x="54" y="144">设备与异步工作</text><text class="body" x="54" y="174">驱动回调、I/O或其他任务</text><rect class="blue" x="432" y="112" width="256" height="104" rx="6"/><text class="name" x="450" y="144">kworker</text><text class="body" x="450" y="174">执行工作队列</text><rect class="box" x="800" y="112" width="284" height="104" rx="6"/><text class="name" x="818" y="144">定位实际回调</text><text class="body" x="818" y="174">短时采样与驱动日志</text><rect class="box" x="36" y="248" width="288" height="104" rx="6"/><text class="name" x="54" y="280">网络及其他软中断</text><text class="body" x="54" y="310">包速率、队列与CPU热点</text><rect class="blue" x="432" y="248" width="256" height="104" rx="6"/><text class="name" x="450" y="280">ksoftirqd</text><text class="body" x="450" y="310">执行延后的软中断</text><rect class="box" x="800" y="248" width="284" height="104" rx="6"/><text class="name" x="818" y="280">各CPU计数增量</text><text class="body" x="818" y="310">softirqs、丢包、IRQ分布</text><rect class="box" x="36" y="384" width="288" height="104" rx="6"/><text class="name" x="54" y="416">页分配与内存压力</text><text class="body" x="54" y="446">文件页与匿名页回收</text><rect class="focus" x="432" y="384" width="256" height="104" rx="6"/><text class="name" x="450" y="416">kswapd</text><text class="body" x="450" y="446">后台回收，不只交换</text><rect class="box" x="800" y="384" width="284" height="104" rx="6"/><text class="name" x="818" y="416">扫描、回收与停顿</text><text class="body" x="818" y="446">pgscan/pgsteal、PSI、延迟</text><text class="body" x="36" y="532">部分工作在其他上下文执行；名称、CPU占用与单次快照不足以确定根因。</text>
</svg>
