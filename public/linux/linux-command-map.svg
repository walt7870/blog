<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="540" viewBox="0 0 1120 540" role="img" aria-labelledby="linux-command-map-title linux-command-map-desc">
<title id="linux-command-map-title">从业务现象找到对象，再验证原始操作</title><desc id="linux-command-map-desc">订单导出失败：文件、进程、网络与身份是关联视图，不是独立命令列表。</desc>
<defs><marker id="linux-command-map-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" fill="#738288"/></marker>
<style>text{font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#253238} .heading{font-size:25px;font-weight:600}.name{font-size:21px;font-weight:600}.body{font-size:18px}.note{font-size:17px;fill:#52656c}.line{fill:none;stroke:#738288;stroke-width:1.8;marker-end:url(#linux-command-map-arrow)}.box{fill:#fff;stroke:#bac6cc;stroke-width:1.3}.focus{fill:#e8f4ef;stroke:#67877b;stroke-width:1.5}.soft{fill:#f0f5fc;stroke:#a8bacd;stroke-width:1.3}</style></defs>
<rect width="1120" height="540" fill="#f8fafb"/>
<text class="heading" x="52" y="54">从业务现象找到对象，再验证原始操作</text><text class="note" x="52" y="88">订单导出失败：文件、进程、网络与身份是关联视图，不是独立命令列表。</text><path class="line" d="M292 216H390"/><path class="line" d="M658 216H760"/><path class="line" d="M898 278V342"/><path class="line" d="M760 403H658"/><path class="line" d="M390 403H292"/><rect data-node="1. 保存失败输入" class="box" x="52" y="154" width="240" height="124" rx="6"/><text class="name" x="70" y="186">1. 保存失败输入</text><text class="body" x="70" y="215">时间、请求编号</text><text class="body" x="70" y="240">输出路径与错误码</text><rect data-node="2. 确认实际环境" class="box" x="390" y="154" width="268" height="124" rx="6"/><text class="name" x="408" y="186">2. 确认实际环境</text><text class="body" x="408" y="215">身份、目录与命名空间</text><text class="body" x="408" y="240">服务管理器、挂载点</text><rect data-node="3. 读取相关证据" class="soft" x="760" y="154" width="308" height="124" rx="6"/><text class="name" x="778" y="186">3. 读取相关证据</text><text class="body" x="778" y="215">文件 / 进程 / 网络</text><text class="body" x="778" y="240">日志、端口、容量与权限</text><rect data-node="4. 定位并修改" class="box" x="760" y="342" width="308" height="124" rx="6"/><text class="name" x="778" y="374">4. 定位并修改</text><text class="body" x="778" y="403">错误路径、依赖或权限</text><text class="body" x="778" y="428">一次改变明确范围</text><rect data-node="5. 复验同一请求" class="focus" x="390" y="342" width="268" height="124" rx="6"/><text class="name" x="408" y="374">5. 复验同一请求</text><text class="body" x="408" y="403">内容、延迟与退出状态</text><text class="body" x="408" y="428">确认实际加载结果</text><rect data-node="6. 保存结果" class="box" x="52" y="342" width="240" height="124" rx="6"/><text class="name" x="70" y="374">6. 保存结果</text><text class="body" x="70" y="403">可重复证据与差异</text><text class="body" x="70" y="428">恢复办法与适用边界</text><text class="note" x="52" y="514">命令成功只证明该动作完成；业务验收仍需回到同一订单输入。</text></svg>
