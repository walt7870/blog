<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="560" viewBox="0 0 1120 560" role="img" aria-labelledby="text-record-title text-record-desc">
<title id="text-record-title">记录统计不等于业务对象统计</title>
<desc id="text-record-desc">四条日志中三条5xx对应两个请求编号，筛选、提取、排序和计数会改变数据形态，最终需回到完整请求核对结果。</desc>
<defs><marker id="text-record-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" fill="#738288"/></marker><style>text{font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#253238}.heading{font-size:25px;font-weight:600}.name{font-size:21px;font-weight:600}.body{font-size:18px}.note{font-size:17px;fill:#52656c}.line{fill:none;stroke:#738288;stroke-width:1.8;marker-end:url(#text-record-arrow)}.box{fill:#fff;stroke:#bac6cc;stroke-width:1.3}.focus{fill:#e8f4ef;stroke:#67877b;stroke-width:1.5}.soft{fill:#f0f5fc;stroke:#a8bacd;stroke-width:1.3}</style></defs>
<rect width="1120" height="560" fill="#f8fafb"/>
<text class="heading" x="52" y="54">同一请求可以产生多条失败记录</text><text class="note" x="52" y="88">输入格式：请求编号 / HTTP状态 / 路径 / 耗时；每一步先确认自己在数什么。</text>
<path class="line" d="M340 228H404"/><path class="line" d="M684 228H756"/><path class="line" d="M544 288V360"/><path class="line" d="M692 412H756"/>
<rect data-node="原始记录" class="box" x="52" y="164" width="288" height="128" rx="6"/><text class="name" x="72" y="200">四条原始日志</text><text class="body" x="72" y="234">req-2048 出现两次</text><text class="body" x="72" y="264">原件保留时间与完整上下文</text>
<rect data-node="筛选5xx" class="focus" x="404" y="164" width="280" height="124" rx="6"/><text class="name" x="424" y="200">按状态字段筛选</text><text class="body" x="424" y="234">awk 检查第二字段</text><text class="body" x="424" y="264">输出三条 5xx 记录</text>
<rect data-node="路径频次" class="box" x="756" y="164" width="312" height="128" rx="6"/><text class="name" x="776" y="200">提取路径并分组</text><text class="body" x="776" y="234">sort → uniq -c</text><text class="body" x="776" y="264">export 两次，payments 一次</text>
<rect data-node="请求集合" class="soft" x="404" y="360" width="288" height="104" rx="6"/><text class="name" x="424" y="396">提取请求编号并去重</text><text class="body" x="424" y="430">两个编号，不等于两个失败订单</text>
<rect data-node="回查业务结果" class="box" x="756" y="360" width="312" height="104" rx="6"/><text class="name" x="776" y="396">回查完整请求与最终状态</text><text class="body" x="776" y="430">重试成功？范围内日志齐全？</text>
<text class="note" x="52" y="522">分组、去重、采样都会丢失信息；保留输入与中间结果，检查每一步退出状态。</text>
</svg>
