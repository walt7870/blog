<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="600" viewBox="0 0 1120 600" role="img" aria-labelledby="find-scope-expression-title find-scope-expression-desc">
<title id="find-scope-expression-title">先选搜索对象，再检查表达式作用范围</title><desc id="find-scope-expression-desc">以订单配置和请求编号为例：查路径、查内容、查命令入口解决不同问题。</desc>
<defs><marker id="find-scope-expression-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" fill="#738288"/></marker>
<style>text{font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#253238} .heading{font-size:25px;font-weight:600}.name{font-size:21px;font-weight:600}.body{font-size:18px}.note{font-size:17px;fill:#52656c}.line{fill:none;stroke:#738288;stroke-width:1.8;marker-end:url(#find-scope-expression-arrow)}.box{fill:#fff;stroke:#bac6cc;stroke-width:1.3}.focus{fill:#e8f4ef;stroke:#67877b;stroke-width:1.5}.soft{fill:#f0f5fc;stroke:#a8bacd;stroke-width:1.3}</style></defs>
<rect width="1120" height="600" fill="#f8fafb"/>
<text class="heading" x="52" y="54">先选搜索对象，再检查表达式作用范围</text><text class="note" x="52" y="88">以订单配置和请求编号为例：查路径、查内容、查命令入口解决不同问题。</text><path class="line" d="M334 200H426"/><path class="line" d="M714 200H802"/><path class="line" d="M334 358H426"/><path class="line" d="M714 358H802"/><rect data-node="文件名与元数据" class="box" x="52" y="144" width="282" height="116" rx="6"/><text class="name" x="70" y="176">文件名与元数据</text><text class="body" x="70" y="205">/opt/order-api树内</text><text class="body" x="70" y="230">-type、-name、时间与大小</text><rect data-node="find筛选当前对象" class="focus" x="426" y="144" width="288" height="116" rx="6"/><text class="name" x="444" y="176">find筛选当前对象</text><text class="body" x="444" y="205">-type f AND</text><text class="body" x="444" y="230">(yaml OR yml)</text><rect data-node="路径集合" class="box" x="802" y="144" width="266" height="116" rx="6"/><text class="name" x="820" y="176">路径集合</text><text class="body" x="820" y="205">先-print核对</text><text class="body" x="820" y="230">再-exec保留参数边界</text><rect data-node="文件内容" class="box" x="52" y="302" width="282" height="116" rx="6"/><text class="name" x="70" y="334">文件内容</text><text class="body" x="70" y="363">已找到的配置或日志</text><text class="body" x="70" y="388">请求编号 req-2048</text><rect data-node="grep -nH -F" class="box" x="426" y="302" width="288" height="116" rx="6"/><text class="name" x="444" y="334">grep -nH -F</text><text class="body" x="444" y="363">固定字符串匹配</text><text class="body" x="444" y="388">保留文件名和行号</text><rect data-node="内容证据" class="box" x="802" y="302" width="266" height="116" rx="6"/><text class="name" x="820" y="334">内容证据</text><text class="body" x="820" y="363">同一次请求的上下文</text><text class="body" x="820" y="388">不是所有同名文件</text><path d="M52 468H1068" stroke="#cbd5dc"/><text class="name" x="52" y="508">命令入口</text><text class="body" x="220" y="508">Bash type -a / command -v：检查当前shell解析，输出不一定是文件路径。</text><text class="note" x="52" y="566">locate查询历史索引；无结果、无权限和对象已变化，需要分别解释。</text></svg>
