<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="540" viewBox="0 0 1120 540" role="img" aria-labelledby="linux-runtime-boundaries-title linux-runtime-boundaries-desc">
<title id="linux-runtime-boundaries-title">订单进程通过系统调用使用内核资源</title>
<desc id="linux-runtime-boundaries-desc">展示Nginx到订单进程的请求、系统库与系统调用边界以及内核管理的资源。</desc>
<defs><marker id="linux-runtime-boundaries-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#7d898c"/></marker>
<style>text{font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#253238}.heading{font-size:25px;font-weight:700}.name{font-size:21px;font-weight:600}.body{font-size:17px;fill:#4d5d63}.box{fill:#fff;stroke:#c7d0d3;stroke-width:1.5}.focus{fill:#e7f3ef;stroke:#69978c;stroke-width:1.5}.blue{fill:#eff5fc;stroke:#a4b9cc;stroke-width:1.5}.edge{fill:none;stroke:#7d898c;stroke-width:1.5;marker-end:url(#linux-runtime-boundaries-arrow)}.label{font-size:16px;fill:#4d5d63}</style></defs>
<rect width="1120" height="540" fill="#f7f9fa"/>
<text class="heading" x="36" y="46">订单进程通过系统调用使用内核资源</text>
<text class="body" x="36" y="80">用户空间运行应用与系统库；内核提供资源机制，发行版负责把它们组合成可维护系统。</text><path class="edge" d="M276 196H400"/><path class="edge" d="M700 196H800"/><path class="edge" d="M940 248V300"/><path class="edge" d="M560 360V408"/><rect x="300" y="162" width="90" height="24" fill="#f7f9fa"/><text class="label" x="304" y="180">转发请求</text><rect x="720" y="162" width="64" height="24" fill="#f7f9fa"/><text class="label" x="724" y="180">调用</text><rect class="box" x="36" y="140" width="240" height="108" rx="6"/><text class="name" x="54" y="172">Nginx</text><text class="body" x="54" y="202">监听与反向代理</text><text class="body" x="54" y="228">用户空间进程</text><rect class="focus" x="400" y="140" width="300" height="108" rx="6"/><text class="name" x="418" y="172">订单服务</text><text class="body" x="418" y="202">业务计算、请求和文件处理</text><text class="body" x="418" y="228">计算不必每次调用内核</text><rect class="blue" x="800" y="140" width="284" height="108" rx="6"/><text class="name" x="818" y="172">系统库</text><text class="body" x="818" y="202">libc及相关封装</text><text class="body" x="818" y="228">不等于内核</text><rect class="blue" x="36" y="300" width="1048" height="60" rx="6"/><text class="name" x="54" y="332">系统调用边界：read / write / socket / mmap</text><rect class="box" x="36" y="408" width="1048" height="88" rx="6"/><text class="name" x="54" y="440">Linux内核</text><text class="body" x="54" y="470">调度、虚拟内存、文件系统、网络栈与设备驱动；容器共享运行内核</text>
</svg>
