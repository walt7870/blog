<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="540" viewBox="0 0 1120 540" role="img" aria-labelledby="orphan-reaping-title orphan-reaping-desc">
<title id="orphan-reaping-title">父进程消失与子进程退出是两种顺序</title>
<desc id="orphan-reaping-desc">分别展示父先退时孤儿重新收养，以及子先退时保留状态并由父进程wait回收。</desc>
<defs><marker id="orphan-reaping-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#7d898c"/></marker>
<style>text{font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#253238}.heading{font-size:25px;font-weight:700}.name{font-size:21px;font-weight:600}.body{font-size:17px;fill:#4d5d63}.box{fill:#fff;stroke:#c7d0d3;stroke-width:1.5}.focus{fill:#e7f3ef;stroke:#69978c;stroke-width:1.5}.blue{fill:#eff5fc;stroke:#a4b9cc;stroke-width:1.5}.edge{fill:none;stroke:#7d898c;stroke-width:1.5;marker-end:url(#orphan-reaping-arrow)}.label{font-size:16px;fill:#4d5d63}</style></defs>
<rect width="1120" height="540" fill="#f7f9fa"/>
<text class="heading" x="36" y="46">父进程消失与子进程退出是两种顺序</text>
<text class="body" x="36" y="80">图示普通等待语义；SIGCHLD处置及PID命名空间会影响具体回收规则。</text><path class="edge" d="M276 188H412"/><path class="edge" d="M688 188H824"/><path class="edge" d="M276 376H412"/><path class="edge" d="M688 376H824"/><rect x="296" y="154" width="100" height="24" fill="#f7f9fa"/><text class="label" x="300" y="172">父先退出</text><rect x="708" y="154" width="100" height="24" fill="#f7f9fa"/><text class="label" x="712" y="172">重新挂接</text><rect x="296" y="342" width="100" height="24" fill="#f7f9fa"/><text class="label" x="300" y="360">子先退出</text><rect x="708" y="342" width="100" height="24" fill="#f7f9fa"/><text class="label" x="712" y="360">父调用wait</text><rect class="box" x="36" y="132" width="240" height="112" rx="6"/><text class="name" x="54" y="164">父与子都运行</text><text class="body" x="54" y="194">转换任务仍在执行</text><text class="body" x="54" y="220">父服务意外退出</text><rect class="blue" x="412" y="132" width="276" height="112" rx="6"/><text class="name" x="430" y="164">存活的孤儿</text><text class="body" x="430" y="194">优先找最近祖先subreaper</text><text class="body" x="430" y="220">否则适用命名空间init</text><rect class="box" x="824" y="132" width="260" height="112" rx="6"/><text class="name" x="842" y="164">新父负责回收</text><text class="body" x="842" y="194">子后来退出时需wait</text><text class="body" x="842" y="220">不是自动重跑业务</text><rect class="box" x="36" y="320" width="240" height="112" rx="6"/><text class="name" x="54" y="352">父仍在运行</text><text class="body" x="54" y="382">转换子进程退出</text><text class="body" x="54" y="408">大多数资源已经释放</text><rect class="blue" x="412" y="320" width="276" height="112" rx="6"/><text class="name" x="430" y="352">通常暂留Z</text><text class="body" x="430" y="382">保留PID与退出状态</text><text class="body" x="430" y="408">不能再继续执行</text><rect class="focus" x="824" y="320" width="260" height="112" rx="6"/><text class="name" x="842" y="352">读取状态并回收</text><text class="body" x="842" y="382">例如退出码7</text><text class="body" x="842" y="408">父服务据此判任务失败</text><text class="body" x="36" y="492">孤儿可仍在执行；僵尸已退出。发送SIGKILL不能代替父进程读取退出状态。</text>
</svg>
