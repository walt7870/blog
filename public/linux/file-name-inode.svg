<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="600" viewBox="0 0 1120 600" role="img" aria-labelledby="file-name-inode-title file-name-inode-desc">
<title id="file-name-inode-title">名称、inode与打开句柄是不同对象</title><desc id="file-name-inode-desc">同一文件系统中的简化关系：两个硬链接共享同一文件，软链接保存可失效的路径。</desc>
<defs><marker id="file-name-inode-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" fill="#738288"/></marker>
<style>text{font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#253238} .heading{font-size:25px;font-weight:600}.name{font-size:21px;font-weight:600}.body{font-size:18px}.note{font-size:17px;fill:#52656c}.line{fill:none;stroke:#738288;stroke-width:1.8;marker-end:url(#file-name-inode-arrow)}.box{fill:#fff;stroke:#bac6cc;stroke-width:1.3}.focus{fill:#e8f4ef;stroke:#67877b;stroke-width:1.5}.soft{fill:#f0f5fc;stroke:#a8bacd;stroke-width:1.3}</style></defs>
<rect width="1120" height="600" fill="#f8fafb"/>
<text class="heading" x="52" y="54">名称、inode与打开句柄是不同对象</text><text class="note" x="52" y="88">同一文件系统中的简化关系：两个硬链接共享同一文件，软链接保存可失效的路径。</text><path class="line" d="M312 200H438Q446 200 446 208V228H524"/><path class="line" d="M312 330H438Q446 330 446 322V284H524"/><path class="line" d="M804 256H878"/><path class="line" d="M610 430V360Q610 352 618 352H650V318"/><path class="line" stroke-dasharray="5 4" d="M52 479H32Q24 479 24 471V130Q24 122 32 122H172Q180 122 180 130V162"/><rect data-node="orders.csv" class="box" x="52" y="162" width="260" height="88" rx="6"/><text class="name" x="70" y="194">orders.csv</text><text class="body" x="70" y="223">目录项：名称A</text><rect data-node="orders-hard.csv" class="box" x="52" y="288" width="260" height="88" rx="6"/><text class="name" x="70" y="320">orders-hard.csv</text><text class="body" x="70" y="349">目录项：名称B</text><rect data-node="同一个inode" class="focus" x="524" y="194" width="280" height="124" rx="6"/><text class="name" x="542" y="226">同一个inode</text><text class="body" x="542" y="255">模式、身份、链接数</text><text class="body" x="542" y="280">引用文件内容</text><rect data-node="文件内容" class="box" x="878" y="212" width="190" height="88" rx="6"/><text class="name" x="896" y="244">文件内容</text><text class="body" x="896" y="273">CSV字节</text><rect data-node="orders-link.csv" class="soft" x="52" y="430" width="348" height="98" rx="6"/><text class="name" x="70" y="462">orders-link.csv</text><text class="body" x="70" y="491">独立inode，保存 orders.csv</text><text class="body" x="70" y="516">从链接所在目录解析</text><rect data-node="进程打开的文件描述符" class="box" x="494" y="430" width="370" height="98" rx="6"/><text class="name" x="512" y="462">进程打开的文件描述符</text><text class="body" x="512" y="491">即使名称被删，打开引用仍可能保留</text><text class="note" x="52" y="574">rm移除目录项；最后硬链接与打开引用消失后，空间释放还受文件系统机制影响。</text></svg>
