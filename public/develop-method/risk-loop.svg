<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" role="img" aria-labelledby="risk-loop-title risk-loop-desc"><title id="risk-loop-title">螺旋开发：用风险决定下一轮</title><desc id="risk-loop-desc">每轮确定目标和备选方案，试验关键风险，验证成果，决定继续、调整或停止。</desc><defs><marker id="risk-loop-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6 Z" fill="#64748b"/></marker><style>text{font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#0f172a;letter-spacing:0}.title{font-size:26px;font-weight:700}.heading{font-size:18px;font-weight:600}.body{font-size:14px;fill:#475569}.label{font-size:14px;fill:#475569}.box{fill:#fff;stroke:#cbd5e1;stroke-width:1.5}.focus{fill:#ecfdf5;stroke:#0f766e;stroke-width:2}.edge{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#risk-loop-arrow)}</style></defs><rect width="960" height="480" fill="#f8fafc"/><text class="title" x="40" y="46" text-anchor="start">螺旋开发：用风险决定下一轮</text><path d="M236 204 H268" class="edge" /><path d="M464 204 H496" class="edge" /><path d="M692 204 H724" class="edge" /><path d="M822 258 V320 Q822 328 814 328 H146 Q138 328 138 320 V258" class="edge" stroke-dasharray="6 5"/><g data-label="继续或调整：剩余风险决定下一轮"><rect x="367" y="291" width="226" height="22" fill="#f8fafc"/><text class="label" x="480" y="308" text-anchor="middle">继续或调整：剩余风险决定下一轮</text></g><g data-node="目标与选项"><rect x="40" y="150" width="196" height="108" rx="6" class="box"/><text class="heading" x="138" y="182" text-anchor="middle">目标与选项</text><text class="body" x="138" y="208" text-anchor="middle">规模与资源</text><text class="body" x="138" y="231" text-anchor="middle">备选方案</text></g><g data-node="风险试验"><rect x="268" y="150" width="196" height="108" rx="6" class="box"/><text class="heading" x="366" y="182" text-anchor="middle">风险试验</text><text class="body" x="366" y="208" text-anchor="middle">负载与中断</text><text class="body" x="366" y="231" text-anchor="middle">证伪关键假设</text></g><g data-node="开发验证"><rect x="496" y="150" width="196" height="108" rx="6" class="focus"/><text class="heading" x="594" y="182" text-anchor="middle">开发验证</text><text class="body" x="594" y="208" text-anchor="middle">只推进已验证</text><text class="body" x="594" y="231" text-anchor="middle">的方案与增量</text></g><g data-node="评审决策"><rect x="724" y="150" width="196" height="108" rx="6" class="box"/><text class="heading" x="822" y="182" text-anchor="middle">评审决策</text><text class="body" x="822" y="208" text-anchor="middle">继续 / 调整</text><text class="body" x="822" y="231" text-anchor="middle">或停止投入</text></g><line x1="40" y1="374" x2="920" y2="374" stroke="#cbd5e1"/><text class="heading" x="40" y="402" text-anchor="start">试验结果必须改变决策</text><text class="body" x="40" y="430" text-anchor="start">保留输入、环境、测量和失败条件；不能只写“方案可行”。</text></svg>
