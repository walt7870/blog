<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 512" role="img" aria-labelledby="delivery-loop-title delivery-loop-desc"><title id="delivery-loop-title">订单导出：探索、规格、实现和运行反馈</title><desc id="delivery-loop-desc">原型试用确定方向，规格确定规则，小批量实现经过验证再发布；异常反馈回到相应阶段。</desc><defs><marker id="delivery-loop-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6 Z" fill="#64748b"/></marker><style>text{font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#0f172a;letter-spacing:0}.title{font-size:26px;font-weight:700}.heading{font-size:18px;font-weight:600}.body{font-size:14px;fill:#475569}.label{font-size:14px;fill:#475569}.box{fill:#fff;stroke:#cbd5e1;stroke-width:1.5}.focus{fill:#ecfdf5;stroke:#0f766e;stroke-width:2}.edge{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#delivery-loop-arrow)}</style></defs><rect width="960" height="512" fill="#f8fafc"/><text class="title" x="40" y="46" text-anchor="start">订单导出：探索、规格、实现和运行反馈</text><path d="M190.4 204 H222.4" class="edge" /><path d="M372.8 204 H404.8" class="edge" /><path d="M555.2 204 H587.2" class="edge" /><path d="M737.6 204 H769.6" class="edge" /><path d="M844.8000000000001 258 V350 Q844.8000000000001 358 836.8000000000001 358 H305.6 Q297.6 358 297.6 350 V258" class="edge" stroke-dasharray="6 5"/><path d="M662.4000000000001 258 V302 Q662.4000000000001 310 654.4000000000001 310 H488 Q480 310 480 302 V258" class="edge" stroke-dasharray="6 5"/><g data-label="检查失败回修"><rect x="521.2" y="272" width="100" height="22" fill="#f8fafc"/><text class="label" x="571.2" y="289" text-anchor="middle">检查失败回修</text></g><g data-label="运行异常先恢复，再调整规格与约束"><rect x="360" y="321" width="240" height="22" fill="#f8fafc"/><text class="label" x="480" y="338" text-anchor="middle">运行异常先恢复，再调整规格与约束</text></g><g data-node="探索方向"><rect x="40" y="150" width="150.4" height="108" rx="6" class="box"/><text class="heading" x="115.2" y="182" text-anchor="middle">探索方向</text><text class="body" x="115.2" y="208" text-anchor="middle">字段与筛选</text><text class="body" x="115.2" y="231" text-anchor="middle">测试数据试用</text></g><g data-node="确认规格"><rect x="222.4" y="150" width="150.4" height="108" rx="6" class="box"/><text class="heading" x="297.6" y="182" text-anchor="middle">确认规格</text><text class="body" x="297.6" y="208" text-anchor="middle">权限与状态</text><text class="body" x="297.6" y="231" text-anchor="middle">验收与非目标</text></g><g data-node="增量实现"><rect x="404.8" y="150" width="150.4" height="108" rx="6" class="box"/><text class="heading" x="480" y="182" text-anchor="middle">增量实现</text><text class="body" x="480" y="208" text-anchor="middle">人或 Agent</text><text class="body" x="480" y="231" text-anchor="middle">小步修改</text></g><g data-node="检查评审"><rect x="587.2" y="150" width="150.4" height="108" rx="6" class="focus"/><text class="heading" x="662.4000000000001" y="182" text-anchor="middle">检查评审</text><text class="body" x="662.4000000000001" y="208" text-anchor="middle">测试与文件</text><text class="body" x="662.4000000000001" y="231" text-anchor="middle">核对差异</text></g><g data-node="发布观测"><rect x="769.6" y="150" width="150.4" height="108" rx="6" class="box"/><text class="heading" x="844.8000000000001" y="182" text-anchor="middle">发布观测</text><text class="body" x="844.8000000000001" y="208" text-anchor="middle">受控放量</text><text class="body" x="844.8000000000001" y="231" text-anchor="middle">失败恢复</text></g><line x1="40" y1="404" x2="920" y2="404" stroke="#cbd5e1"/><text class="heading" x="40" y="432" text-anchor="start">每一阶段都有完成依据</text><text class="body" x="40" y="460" text-anchor="start">探索看反馈；实现看行为证据；交付看真实运行与恢复。</text></svg>
