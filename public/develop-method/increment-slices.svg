<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" role="img" aria-labelledby="increment-slices-title increment-slices-desc"><title id="increment-slices-title">迭代与增量：每一批都是业务闭环</title><desc id="increment-slices-desc">受控 CSV、异步任务和导出历史逐批增加能力，每一批都贯通需求到验收，并根据反馈迭代。</desc><defs><marker id="increment-slices-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6 Z" fill="#64748b"/></marker><style>text{font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#0f172a;letter-spacing:0}.title{font-size:26px;font-weight:700}.heading{font-size:18px;font-weight:600}.body{font-size:14px;fill:#475569}.label{font-size:14px;fill:#475569}.box{fill:#fff;stroke:#cbd5e1;stroke-width:1.5}.focus{fill:#ecfdf5;stroke:#0f766e;stroke-width:2}.edge{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#increment-slices-arrow)}</style></defs><rect width="960" height="480" fill="#f8fafc"/><text class="title" x="40" y="46" text-anchor="start">迭代与增量：每一批都是业务闭环</text><path d="M300 218 H340" class="edge" /><path d="M600 218 H640" class="edge" /><g data-node="受控 CSV"><rect x="40" y="124" width="260" height="116" rx="6" class="box"/><text class="heading" x="170" y="156" text-anchor="middle">受控 CSV</text><text class="body" x="170" y="182" text-anchor="middle">权限、查询、生成、下载</text><text class="body" x="170" y="205" text-anchor="middle">隔离、金额、超限提示</text></g><text class="body" x="170" y="285" text-anchor="middle">需求 → 实现 → 检查 → 评审</text><path d="M70 302 H262 Q270 302 270 310 V322 Q270 330 262 330 H78 Q70 330 70 322 V312" class="edge" stroke-dasharray="6 5"/><g data-node="异步导出"><rect x="340" y="124" width="260" height="116" rx="6" class="focus"/><text class="heading" x="470" y="156" text-anchor="middle">异步导出</text><text class="body" x="470" y="182" text-anchor="middle">任务、进度、生成、下载</text><text class="body" x="470" y="205" text-anchor="middle">并发、超时、下载鉴权</text></g><text class="body" x="470" y="285" text-anchor="middle">需求 → 实现 → 检查 → 评审</text><path d="M370 302 H562 Q570 302 570 310 V322 Q570 330 562 330 H378 Q370 330 370 322 V312" class="edge" stroke-dasharray="6 5"/><g data-node="历史与恢复"><rect x="640" y="124" width="260" height="116" rx="6" class="box"/><text class="heading" x="770" y="156" text-anchor="middle">历史与恢复</text><text class="body" x="770" y="182" text-anchor="middle">查询、重试、过期、清理</text><text class="body" x="770" y="205" text-anchor="middle">失败恢复、审计记录</text></g><text class="body" x="770" y="285" text-anchor="middle">需求 → 实现 → 检查 → 评审</text><path d="M670 302 H862 Q870 302 870 310 V322 Q870 330 862 330 H678 Q670 330 670 322 V312" class="edge" stroke-dasharray="6 5"/><line x1="40" y1="377" x2="920" y2="377" stroke="#cbd5e1"/><text class="heading" x="40" y="405" text-anchor="start">增量增加能力，迭代完善能力</text><text class="body" x="40" y="433" text-anchor="start">不是先写完后端，再写前端，最后集中发现集成问题。</text></svg>
