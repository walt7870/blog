<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" role="img" aria-labelledby="devops-release-title devops-release-desc"><title id="devops-release-title">DevOps：同一制品进入发布与恢复闭环</title><desc id="devops-release-desc">代码通过 CI 与集成验证后构建可追溯制品，受控发布并观测，异常先恢复再修复。</desc><defs><marker id="devops-release-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6 Z" fill="#64748b"/></marker><style>text{font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#0f172a;letter-spacing:0}.title{font-size:26px;font-weight:700}.heading{font-size:18px;font-weight:600}.body{font-size:14px;fill:#475569}.label{font-size:14px;fill:#475569}.box{fill:#fff;stroke:#cbd5e1;stroke-width:1.5}.focus{fill:#ecfdf5;stroke:#0f766e;stroke-width:2}.edge{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#devops-release-arrow)}</style></defs><rect width="960" height="480" fill="#f8fafc"/><text class="title" x="40" y="46" text-anchor="start">DevOps：同一制品进入发布与恢复闭环</text><path d="M236 204 H268" class="edge" /><path d="M464 204 H496" class="edge" /><path d="M692 204 H724" class="edge" /><path d="M822 258 V320 Q822 328 814 328 H146 Q138 328 138 320 V258" class="edge" stroke-dasharray="6 5"/><g data-label="检查失败回到实现；运行异常先恢复再修复"><rect x="339" y="291" width="282" height="22" fill="#f8fafc"/><text class="label" x="480" y="308" text-anchor="middle">检查失败回到实现；运行异常先恢复再修复</text></g><g data-node="提交与 CI"><rect x="40" y="150" width="196" height="108" rx="6" class="box"/><text class="heading" x="138" y="182" text-anchor="middle">提交与 CI</text><text class="body" x="138" y="208" text-anchor="middle">测试与构建</text><text class="body" x="138" y="231" text-anchor="middle">失败阻断</text></g><g data-node="制品与集成"><rect x="268" y="150" width="196" height="108" rx="6" class="box"/><text class="heading" x="366" y="182" text-anchor="middle">制品与集成</text><text class="body" x="366" y="208" text-anchor="middle">同一制品标识</text><text class="body" x="366" y="231" text-anchor="middle">真实依赖验证</text></g><g data-node="受控发布"><rect x="496" y="150" width="196" height="108" rx="6" class="focus"/><text class="heading" x="594" y="182" text-anchor="middle">受控发布</text><text class="body" x="594" y="208" text-anchor="middle">配置与兼容</text><text class="body" x="594" y="231" text-anchor="middle">逐步开放</text></g><g data-node="观测恢复"><rect x="724" y="150" width="196" height="108" rx="6" class="box"/><text class="heading" x="822" y="182" text-anchor="middle">观测恢复</text><text class="body" x="822" y="208" text-anchor="middle">停止放量</text><text class="body" x="822" y="231" text-anchor="middle">回滚或前向修复</text></g><line x1="40" y1="374" x2="920" y2="374" stroke="#cbd5e1"/><text class="heading" x="40" y="402" text-anchor="start">部署成功不等于业务正确</text><text class="body" x="40" y="430" text-anchor="start">应用版本、配置、已有任务和数据变化需要分别核对。</text></svg>
