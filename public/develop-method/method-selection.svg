<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" role="img" aria-labelledby="method-selection-title method-selection-desc"><title id="method-selection-title">开发方法选型：先消除当前不确定性</title><desc id="method-selection-desc">目标不清时根据风险选择原型或澄清；目标明确时补齐规格和验证，再选择实现方式。</desc><defs><marker id="method-selection-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6 Z" fill="#64748b"/></marker><style>text{font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#0f172a;letter-spacing:0}.title{font-size:26px;font-weight:700}.heading{font-size:18px;font-weight:600}.body{font-size:14px;fill:#475569}.label{font-size:14px;fill:#475569}.box{fill:#fff;stroke:#cbd5e1;stroke-width:1.5}.focus{fill:#ecfdf5;stroke:#0f766e;stroke-width:2}.edge{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#method-selection-arrow)}</style></defs><rect width="960" height="640" fill="#f8fafc"/><text class="title" x="40" y="46" text-anchor="start">开发方法选型：先消除当前不确定性</text><path d="M210 160 H248" class="edge" /><path d="M472 160 H670" class="edge" /><g data-label="是"><rect x="555" y="123" width="30" height="22" fill="#f8fafc"/><text class="label" x="570" y="140" text-anchor="middle">是</text></g><path d="M360 216 V324" class="edge" /><g data-label="否"><rect x="373" y="261" width="30" height="22" fill="#f8fafc"/><text class="label" x="388" y="278" text-anchor="middle">否</text></g><path d="M248 380 H210" class="edge" /><g data-label="是"><rect x="214" y="339" width="30" height="22" fill="#f8fafc"/><text class="label" x="229" y="356" text-anchor="middle">是</text></g><path d="M472 380 H562 Q570 380 570 388 V452 Q570 460 578 460 H670" class="edge" /><g data-label="否"><rect x="530" y="343" width="30" height="22" fill="#f8fafc"/><text class="label" x="545" y="360" text-anchor="middle">否</text></g><path d="M790 214 V292" class="edge" /><g data-node="判断当前任务"><rect x="40" y="116" width="170" height="108" rx="6" class="box"/><text class="heading" x="125" y="148" text-anchor="middle">判断当前任务</text><text class="body" x="125" y="174" text-anchor="middle">目标、风险、证据</text></g><g data-node="目标已明确？"><polygon class="box" points="360,104 472,160 360,216 248,160"/><text class="heading" x="360" y="166" text-anchor="middle">目标已明确？</text></g><g data-node="明确合同与验收"><rect x="670" y="106" width="240" height="108" rx="6" class="focus"/><text class="heading" x="790" y="138" text-anchor="middle">明确合同与验收</text><text class="body" x="790" y="164" text-anchor="middle">补行为与范围</text><text class="body" x="790" y="187" text-anchor="middle">先建立验证入口</text></g><g data-node="选择实现方式"><rect x="670" y="292" width="240" height="108" rx="6" class="box"/><text class="heading" x="790" y="324" text-anchor="middle">选择实现方式</text><text class="body" x="790" y="350" text-anchor="middle">人工 / AI 辅助 / Agent</text><text class="body" x="790" y="373" text-anchor="middle">以证据和评审结束</text></g><g data-node="风险可控？"><polygon class="box" points="360,324 472,380 360,436 248,380"/><text class="heading" x="360" y="386" text-anchor="middle">风险可控？</text></g><g data-node="受控原型"><rect x="40" y="336" width="170" height="108" rx="6" class="box"/><text class="heading" x="125" y="368" text-anchor="middle">受控原型</text><text class="body" x="125" y="394" text-anchor="middle">Vibe 或手工探索</text><text class="body" x="125" y="417" text-anchor="middle">测试数据试用</text></g><g data-node="澄清与风险验证"><rect x="670" y="420" width="240" height="108" rx="6" class="box"/><text class="heading" x="790" y="452" text-anchor="middle">澄清与风险验证</text><text class="body" x="790" y="478" text-anchor="middle">澄清业务规则</text><text class="body" x="790" y="501" text-anchor="middle">先验证关键风险</text></g><line x1="40" y1="547" x2="920" y2="547" stroke="#cbd5e1"/><text class="heading" x="40" y="575" text-anchor="start">选择下一步，而非给项目永久贴标签</text><text class="body" x="40" y="603" text-anchor="start">目标清楚但无法验证时，先补复现、测试或基准，再扩大委托。</text></svg>
