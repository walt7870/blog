<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="test-loop-title test-loop-desc"><title id="test-loop-title">工程验证：业务示例、TDD 与独立验收</title><desc id="test-loop-desc">已确认的行为示例定义预期，TDD 经失败、实现和重构循环，最后用集成和真实路径补充验收。</desc><defs><marker id="test-loop-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6 Z" fill="#64748b"/></marker><style>text{font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#0f172a;letter-spacing:0}.title{font-size:26px;font-weight:700}.heading{font-size:18px;font-weight:600}.body{font-size:14px;fill:#475569}.label{font-size:14px;fill:#475569}.box{fill:#fff;stroke:#cbd5e1;stroke-width:1.5}.focus{fill:#ecfdf5;stroke:#0f766e;stroke-width:2}.edge{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#test-loop-arrow)}</style></defs><rect width="960" height="600" fill="#f8fafc"/><text class="title" x="40" y="46" text-anchor="start">工程验证：业务示例、TDD 与独立验收</text><path d="M290 110 H178 Q170 110 170 118 V162" class="edge" /><path d="M280 217 H350" class="edge" /><path d="M610 217 H680" class="edge" /><path d="M790 270 V314 Q790 322 782 322 H178 Q170 322 170 314 V270" class="edge" stroke-dasharray="6 5"/><g data-label="通过后重构；仍失败则定位并修复"><rect x="367" y="285" width="226" height="22" fill="#f8fafc"/><text class="label" x="480" y="302" text-anchor="middle">通过后重构；仍失败则定位并修复</text></g><path d="M900 217 H920 Q928 217 928 225 V417 Q928 425 920 425 H670" class="edge" /><g data-node="业务示例定义预期"><rect x="290" y="74" width="380" height="72" rx="6" class="box"/><text class="heading" x="480" y="106" text-anchor="middle">业务示例定义预期</text><text class="body" x="480" y="132" text-anchor="middle">正常、拒绝、恢复</text></g><g data-node="先看到目标失败"><rect x="60" y="162" width="220" height="108" rx="6" class="box"/><text class="heading" x="170" y="194" text-anchor="middle">先看到目标失败</text><text class="body" x="170" y="220" text-anchor="middle">缺陷复现</text><text class="body" x="170" y="243" text-anchor="middle">不是环境故障</text></g><g data-node="最小实现使其通过"><rect x="350" y="162" width="260" height="108" rx="6" class="focus"/><text class="heading" x="480" y="194" text-anchor="middle">最小实现使其通过</text><text class="body" x="480" y="220" text-anchor="middle">修正根因</text><text class="body" x="480" y="243" text-anchor="middle">不随意改变预期</text></g><g data-node="保持行为重构"><rect x="680" y="162" width="220" height="108" rx="6" class="box"/><text class="heading" x="790" y="194" text-anchor="middle">保持行为重构</text><text class="body" x="790" y="220" text-anchor="middle">改善结构</text><text class="body" x="790" y="243" text-anchor="middle">回归检查</text></g><g data-node="独立验收"><rect x="290" y="382" width="380" height="86" rx="6" class="focus"/><text class="heading" x="480" y="414" text-anchor="middle">独立验收</text><text class="body" x="480" y="440" text-anchor="middle">真实接口、实际文件、权限与恢复</text></g><line x1="40" y1="497" x2="920" y2="497" stroke="#cbd5e1"/><text class="heading" x="40" y="525" text-anchor="start">测试通过需要解释覆盖范围</text><text class="body" x="40" y="553" text-anchor="start">Mock、覆盖率和模型自述不能替代未验证的真实连接。</text></svg>
