<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" role="img" aria-labelledby="agent-swimlane-title agent-swimlane-desc"><title id="agent-swimlane-title">Agentic 开发：人的决策与工具证据</title><desc id="agent-swimlane-desc">人明确任务和边界，Agent 阅读并实现，工具检查提供反馈，失败回修，最后人核对交付证据。</desc><defs><marker id="agent-swimlane-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6 Z" fill="#64748b"/></marker><style>text{font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#0f172a;letter-spacing:0}.title{font-size:26px;font-weight:700}.heading{font-size:18px;font-weight:600}.body{font-size:14px;fill:#475569}.label{font-size:14px;fill:#475569}.box{fill:#fff;stroke:#cbd5e1;stroke-width:1.5}.focus{fill:#ecfdf5;stroke:#0f766e;stroke-width:2}.edge{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#agent-swimlane-arrow)}</style></defs><rect width="960" height="620" fill="#f8fafc"/><text class="title" x="40" y="46" text-anchor="start">Agentic 开发：人的决策与工具证据</text><rect x="32" y="104" width="896" height="124" fill="#fff"/><line x1="32" y1="228" x2="928" y2="228" stroke="#cbd5e1"/><text class="heading" x="56" y="168" text-anchor="start">人</text><rect x="32" y="244" width="896" height="124" fill="#eff6ff"/><line x1="32" y1="368" x2="928" y2="368" stroke="#cbd5e1"/><text class="heading" x="56" y="308" text-anchor="start">Agent</text><rect x="32" y="384" width="896" height="124" fill="#fff"/><line x1="32" y1="508" x2="928" y2="508" stroke="#cbd5e1"/><text class="heading" x="56" y="448" text-anchor="start">工具</text><path d="M224 206 V244 Q224 252 232 252 H272 Q280 252 280 260 V276" class="edge" /><path d="M410 316 H454" class="edge" /><path d="M570 356 V386 Q570 394 578 394 H706 Q714 394 714 402 V416" class="edge" /><path d="M818 416 V378 Q818 370 810 370 H610 Q602 370 602 362 V356" class="edge" stroke-dasharray="6 5"/><g data-label="失败定位与修复"><rect x="689" y="339" width="114" height="22" fill="#f8fafc"/><text class="label" x="746" y="356" text-anchor="middle">失败定位与修复</text></g><path d="M922 448 H936 V190 Q936 182 928 182 H902" class="edge" /><g data-node="目标与契约"><rect x="128" y="126" width="192" height="80" rx="6" class="focus"/><text class="heading" x="224" y="158" text-anchor="middle">目标与契约</text><text class="body" x="224" y="184" text-anchor="middle">范围、验收、授权</text></g><g data-node="核对证据与差异"><rect x="672" y="126" width="230" height="80" rx="6" class="focus"/><text class="heading" x="787" y="158" text-anchor="middle">核对证据与差异</text><text class="body" x="787" y="184" text-anchor="middle">决定是否交付</text></g><g data-node="读仓库与基线"><rect x="176" y="276" width="234" height="80" rx="6" class="box"/><text class="heading" x="293" y="308" text-anchor="middle">读仓库与基线</text><text class="body" x="293" y="334" text-anchor="middle">定位入口和约束</text></g><g data-node="小步实现"><rect x="454" y="276" width="234" height="80" rx="6" class="box"/><text class="heading" x="571" y="308" text-anchor="middle">小步实现</text><text class="body" x="571" y="334" text-anchor="middle">保持规格与边界</text></g><g data-node="执行检查"><rect x="714" y="416" width="208" height="80" rx="6" class="box"/><text class="heading" x="818" y="448" text-anchor="middle">执行检查</text><text class="body" x="818" y="474" text-anchor="middle">测试、构建、验收</text></g><line x1="40" y1="522" x2="920" y2="522" stroke="#cbd5e1"/><text class="heading" x="40" y="550" text-anchor="start">工具反馈约束执行，责任由人承担</text><text class="body" x="40" y="578" text-anchor="start">扩大行动范围前确认验证能力；实现授权不自动包含发布授权。</text></svg>
