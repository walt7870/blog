<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 512" role="img" aria-labelledby="agile-flow-title agile-flow-desc"><title id="agile-flow-title">Scrum 与看板：目标反馈和拉动流动</title><desc id="agile-flow-desc">Scrum 在 Sprint 中检查目标和增量，看板通过 WIP 限制控制工作流，两者均需明确完成标准。</desc><defs><marker id="agile-flow-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6 Z" fill="#64748b"/></marker><style>text{font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#0f172a;letter-spacing:0}.title{font-size:26px;font-weight:700}.heading{font-size:18px;font-weight:600}.body{font-size:14px;fill:#475569}.label{font-size:14px;fill:#475569}.box{fill:#fff;stroke:#cbd5e1;stroke-width:1.5}.focus{fill:#ecfdf5;stroke:#0f766e;stroke-width:2}.edge{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#agile-flow-arrow)}</style></defs><rect width="960" height="512" fill="#f8fafc"/><text class="title" x="40" y="46" text-anchor="start">Scrum 与看板：目标反馈和拉动流动</text><path d="M210 150 H276" class="edge" /><path d="M446 150 H512" class="edge" /><path d="M682 150 H748" class="edge" /><path d="M210 330 H276" class="edge" /><path d="M446 330 H512" class="edge" /><path d="M682 330 H748" class="edge" /><path d="M790 198 V230 Q790 238 782 238 H118 Q110 238 110 230 V198" class="edge" stroke-dasharray="6 5"/><g data-label="评审与回顾调整下一轮"><rect x="382" y="200" width="156" height="22" fill="#f8fafc"/><text class="label" x="460" y="217" text-anchor="middle">评审与回顾调整下一轮</text></g><g data-node="目标与规划"><rect x="40" y="102" width="170" height="96" rx="6" class="focus"/><text class="heading" x="125" y="134" text-anchor="middle">目标与规划</text><text class="body" x="125" y="160" text-anchor="middle">Sprint Goal</text></g><g data-node="实现与检查"><rect x="276" y="102" width="170" height="96" rx="6" class="box"/><text class="heading" x="361" y="134" text-anchor="middle">实现与检查</text><text class="body" x="361" y="160" text-anchor="middle">Daily / 持续协作</text></g><g data-node="形成可用增量"><rect x="512" y="102" width="170" height="96" rx="6" class="box"/><text class="heading" x="597" y="134" text-anchor="middle">形成可用增量</text><text class="body" x="597" y="160" text-anchor="middle">满足完成标准</text></g><g data-node="评审与回顾"><rect x="748" y="102" width="170" height="96" rx="6" class="box"/><text class="heading" x="833" y="134" text-anchor="middle">评审与回顾</text><text class="body" x="833" y="160" text-anchor="middle">结果与改进</text></g><g data-node="可开始"><rect x="40" y="282" width="170" height="96" rx="6" class="box"/><text class="heading" x="125" y="314" text-anchor="middle">可开始</text><text class="body" x="125" y="340" text-anchor="middle">规则已确认</text></g><g data-node="实现中"><rect x="276" y="282" width="170" height="96" rx="6" class="box"/><text class="heading" x="361" y="314" text-anchor="middle">实现中</text><text class="body" x="361" y="340" text-anchor="middle">限制 WIP</text></g><g data-node="评审验证"><rect x="512" y="282" width="170" height="96" rx="6" class="focus"/><text class="heading" x="597" y="314" text-anchor="middle">评审验证</text><text class="body" x="597" y="340" text-anchor="middle">下游容量有限</text></g><g data-node="完成"><rect x="748" y="282" width="170" height="96" rx="6" class="box"/><text class="heading" x="833" y="314" text-anchor="middle">完成</text><text class="body" x="833" y="340" text-anchor="middle">满足退出条件</text></g><text class="body" x="40" y="85" text-anchor="start">Scrum：Sprint 内持续检查；可用增量可以在评审前发布</text><text class="body" x="40" y="266" text-anchor="start">看板：下游有容量才拉入新工作</text><line x1="40" y1="414" x2="920" y2="414" stroke="#cbd5e1"/><text class="heading" x="40" y="442" text-anchor="start">待评审差异也是在制品</text><text class="body" x="40" y="470" text-anchor="start">评审积压时协助完成现有工作，避免继续扩大代码库存。</text></svg>
