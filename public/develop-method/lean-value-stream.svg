<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" role="img" aria-labelledby="lean-value-stream-title lean-value-stream-desc"><title id="lean-value-stream-title">精益：优化需求到使用的整体耗时</title><desc id="lean-value-stream-desc">澄清、实现、评审和发布都有处理与等待，瓶颈改善后以实际耗时与质量复核。</desc><defs><marker id="lean-value-stream-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6 Z" fill="#64748b"/></marker><style>text{font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#0f172a;letter-spacing:0}.title{font-size:26px;font-weight:700}.heading{font-size:18px;font-weight:600}.body{font-size:14px;fill:#475569}.label{font-size:14px;fill:#475569}.box{fill:#fff;stroke:#cbd5e1;stroke-width:1.5}.focus{fill:#ecfdf5;stroke:#0f766e;stroke-width:2}.edge{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#lean-value-stream-arrow)}</style></defs><rect width="960" height="480" fill="#f8fafc"/><text class="title" x="40" y="46" text-anchor="start">精益：优化需求到使用的整体耗时</text><path d="M236 204 H268" class="edge" /><path d="M464 204 H496" class="edge" /><path d="M692 204 H724" class="edge" /><path d="M822 258 V320 Q822 328 814 328 H146 Q138 328 138 320 V258" class="edge" stroke-dasharray="6 5"/><g data-label="观察瓶颈 → 改进一项策略 → 复核结果"><rect x="332" y="291" width="296" height="22" fill="#f8fafc"/><text class="label" x="480" y="308" text-anchor="middle">观察瓶颈 → 改进一项策略 → 复核结果</text></g><g data-node="澄清需求"><rect x="40" y="150" width="196" height="108" rx="6" class="box"/><text class="heading" x="138" y="182" text-anchor="middle">澄清需求</text><text class="body" x="138" y="208" text-anchor="middle">样本与规则</text><text class="body" x="138" y="231" text-anchor="middle">观察确认等待</text></g><g data-node="实现检查"><rect x="268" y="150" width="196" height="108" rx="6" class="box"/><text class="heading" x="366" y="182" text-anchor="middle">实现检查</text><text class="body" x="366" y="208" text-anchor="middle">小批量修改</text><text class="body" x="366" y="231" text-anchor="middle">观察切换返工</text></g><g data-node="评审验收"><rect x="496" y="150" width="196" height="108" rx="6" class="focus"/><text class="heading" x="594" y="182" text-anchor="middle">评审验收</text><text class="body" x="594" y="208" text-anchor="middle">差异与证据</text><text class="body" x="594" y="231" text-anchor="middle">观察评审排队</text></g><g data-node="发布使用"><rect x="724" y="150" width="196" height="108" rx="6" class="box"/><text class="heading" x="822" y="182" text-anchor="middle">发布使用</text><text class="body" x="822" y="208" text-anchor="middle">制品与恢复</text><text class="body" x="822" y="231" text-anchor="middle">观察放行等待</text></g><line x1="40" y1="374" x2="920" y2="374" stroke="#cbd5e1"/><text class="heading" x="40" y="402" text-anchor="start">AI 加速编码后仍需检查队列</text><text class="body" x="40" y="430" text-anchor="start">固定度量边界，比较总耗时、返工和质量，而非只看生成速度。</text></svg>
