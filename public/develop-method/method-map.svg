<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="method-map-title method-map-desc"><title id="method-map-title">开发方法：五个维度共同约束一次交付</title><desc id="method-map-desc">生命周期、组织、验证、交付和 AI 分工是可组合维度，均服务于可验证交付，而非互斥的模型。</desc><defs><marker id="method-map-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6 Z" fill="#64748b"/></marker><style>text{font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#0f172a;letter-spacing:0}.title{font-size:26px;font-weight:700}.heading{font-size:18px;font-weight:600}.body{font-size:14px;fill:#475569}.label{font-size:14px;fill:#475569}.box{fill:#fff;stroke:#cbd5e1;stroke-width:1.5}.focus{fill:#ecfdf5;stroke:#0f766e;stroke-width:2}.edge{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#method-map-arrow)}</style></defs><rect width="960" height="560" fill="#f8fafc"/><text class="title" x="40" y="46" text-anchor="start">开发方法：五个维度共同约束一次交付</text><path d="M650 128 H760" class="edge" /><path d="M650 194 H760" class="edge" /><path d="M650 260 H760" class="edge" /><path d="M650 326 H760" class="edge" /><path d="M650 392 H760" class="edge" /><g data-node="生命周期"><rect x="40" y="100" width="610" height="56" rx="6" class="box"/><text class="heading" x="60" y="134" text-anchor="start">生命周期</text><text class="body" x="206" y="134" text-anchor="start">瀑布 / 迭代 / 螺旋</text><text class="body" x="500" y="134" text-anchor="start">何时反馈与调整</text></g><g data-node="工作组织"><rect x="40" y="166" width="610" height="56" rx="6" class="box"/><text class="heading" x="60" y="200" text-anchor="start">工作组织</text><text class="body" x="206" y="200" text-anchor="start">Scrum / 看板 / 精益</text><text class="body" x="500" y="200" text-anchor="start">优先级与在制品</text></g><g data-node="实现验证"><rect x="40" y="232" width="610" height="56" rx="6" class="box"/><text class="heading" x="60" y="266" text-anchor="start">实现验证</text><text class="body" x="206" y="266" text-anchor="start">XP / TDD / BDD / 契约</text><text class="body" x="500" y="266" text-anchor="start">行为与边界</text></g><g data-node="交付运行"><rect x="40" y="298" width="610" height="56" rx="6" class="box"/><text class="heading" x="60" y="332" text-anchor="start">交付运行</text><text class="body" x="206" y="332" text-anchor="start">CI / 持续交付 / 恢复</text><text class="body" x="500" y="332" text-anchor="start">版本与运行证据</text></g><g data-node="人和 AI"><rect x="40" y="364" width="610" height="56" rx="6" class="focus"/><text class="heading" x="60" y="398" text-anchor="start">人和 AI</text><text class="body" x="206" y="398" text-anchor="start">辅助 / Vibe / Agentic</text><text class="body" x="500" y="398" text-anchor="start">分工与完成责任</text></g><g data-node="可验证交付"><rect x="760" y="100" width="160" height="336" rx="6" class="focus"/><text class="heading" x="840" y="132" text-anchor="middle">可验证交付</text><text class="body" x="840" y="158" text-anchor="middle">行为正确</text><text class="body" x="840" y="181" text-anchor="middle">差异可解释</text><text class="body" x="840" y="204" text-anchor="middle">失败可恢复</text></g><line x1="40" y1="462" x2="920" y2="462" stroke="#cbd5e1"/><text class="heading" x="40" y="490" text-anchor="start">选择的是方法组合</text><text class="body" x="40" y="518" text-anchor="start">这些维度不构成上下级；任何编码方式都需要对应的验收依据。</text></svg>
