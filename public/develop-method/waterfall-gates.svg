<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" role="img" aria-labelledby="waterfall-gates-title waterfall-gates-desc"><title id="waterfall-gates-title">阶段基线：需求与验收保持对应</title><desc id="waterfall-gates-desc">阶段评审确认输入和产物，变更后更新基线和受影响的验证。</desc><defs><marker id="waterfall-gates-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6 Z" fill="#64748b"/></marker><style>text{font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#0f172a;letter-spacing:0}.title{font-size:26px;font-weight:700}.heading{font-size:18px;font-weight:600}.body{font-size:14px;fill:#475569}.label{font-size:14px;fill:#475569}.box{fill:#fff;stroke:#cbd5e1;stroke-width:1.5}.focus{fill:#ecfdf5;stroke:#0f766e;stroke-width:2}.edge{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#waterfall-gates-arrow)}</style></defs><rect width="960" height="480" fill="#f8fafc"/><text class="title" x="40" y="46" text-anchor="start">阶段基线：需求与验收保持对应</text><path d="M190.4 204 H222.4" class="edge" /><path d="M372.8 204 H404.8" class="edge" /><path d="M555.2 204 H587.2" class="edge" /><path d="M737.6 204 H769.6" class="edge" /><path d="M844.8000000000001 258 V320 Q844.8000000000001 328 836.8000000000001 328 H123.2 Q115.2 328 115.2 320 V258" class="edge" stroke-dasharray="6 5"/><g data-label="变更影响分析后更新基线与验证"><rect x="374" y="291" width="212" height="22" fill="#f8fafc"/><text class="label" x="480" y="308" text-anchor="middle">变更影响分析后更新基线与验证</text></g><g data-node="需求基线"><rect x="40" y="150" width="150.4" height="108" rx="6" class="box"/><text class="heading" x="115.2" y="182" text-anchor="middle">需求基线</text><text class="body" x="115.2" y="208" text-anchor="middle">字段与权限</text><text class="body" x="115.2" y="231" text-anchor="middle">验收场景</text></g><g data-node="设计基线"><rect x="222.4" y="150" width="150.4" height="108" rx="6" class="box"/><text class="heading" x="297.6" y="182" text-anchor="middle">设计基线</text><text class="body" x="297.6" y="208" text-anchor="middle">接口与状态</text><text class="body" x="297.6" y="231" text-anchor="middle">恢复方案</text></g><g data-node="实现集成"><rect x="404.8" y="150" width="150.4" height="108" rx="6" class="box"/><text class="heading" x="480" y="182" text-anchor="middle">实现集成</text><text class="body" x="480" y="208" text-anchor="middle">持续测试</text><text class="body" x="480" y="231" text-anchor="middle">真实连接</text></g><g data-node="系统验收"><rect x="587.2" y="150" width="150.4" height="108" rx="6" class="focus"/><text class="heading" x="662.4000000000001" y="182" text-anchor="middle">系统验收</text><text class="body" x="662.4000000000001" y="208" text-anchor="middle">业务与兼容</text><text class="body" x="662.4000000000001" y="231" text-anchor="middle">阻断项关闭</text></g><g data-node="交付运行"><rect x="769.6" y="150" width="150.4" height="108" rx="6" class="box"/><text class="heading" x="844.8000000000001" y="182" text-anchor="middle">交付运行</text><text class="body" x="844.8000000000001" y="208" text-anchor="middle">版本与配置</text><text class="body" x="844.8000000000001" y="231" text-anchor="middle">支持与恢复</text></g><line x1="40" y1="374" x2="920" y2="374" stroke="#cbd5e1"/><text class="heading" x="40" y="402" text-anchor="start">测试从设计阶段准备</text><text class="body" x="40" y="430" text-anchor="start">需求对应验收，接口对应集成，局部逻辑对应单元检查。</text></svg>
