<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="660" viewBox="0 0 1120 660" role="img" aria-labelledby="enc-title enc-desc">
<title id="enc-title">HTTPS 的 TCP 与 QUIC 封装路径</title><desc id="enc-desc">HTTP/1.1和HTTP/2使用TLS记录及TCP，HTTP/3使用集成TLS的QUIC及UDP，两条路径再经IP和逐跳链路帧承载。</desc>
<rect width="1120" height="660" fill="#f7f9fb"/>
<g font-family="Arial, 'PingFang SC', sans-serif" fill="#23313d">
<text x="48" y="56" font-size="28" font-weight="700">HTTPS 有两条安全传输路径</text>
<text x="48" y="92" font-size="18" fill="#52616d">从上向下封装；应用写入、TLS Record、TCP Segment 并非一一对应。</text>
<g fill="#fff" stroke="#8fa3b1">
<rect x="48" y="132" width="488" height="64"/><rect x="48" y="196" width="488" height="64" fill="#eaf3fb"/><rect x="48" y="260" width="488" height="64"/>
<rect x="584" y="132" width="488" height="64"/><rect x="584" y="196" width="488" height="64" fill="#e8f5ef"/><rect x="584" y="260" width="488" height="64"/>
<rect x="48" y="360" width="1024" height="68"/><rect x="48" y="428" width="1024" height="68"/>
</g>
<g font-size="22" font-weight="600" text-anchor="middle">
<text x="292" y="172">HTTP/1.1 或 HTTP/2</text><text x="292" y="236">TLS Record：加密应用数据</text><text x="292" y="300">TCP：可靠有序字节流</text>
<text x="828" y="172">HTTP/3：请求与响应 Stream</text><text x="828" y="236">QUIC：集成 TLS 1.3 握手与包保护</text><text x="828" y="300">UDP：承载 QUIC Packet</text>
<text x="560" y="402">IP Packet：端到端寻址，逐跳路由</text><text x="560" y="470">链路 Frame：每一跳重新封装，目的地址指向下一跳</text>
</g>
<g stroke="#596775" stroke-width="2"><path d="M292 324V360"/><path d="M828 324V360"/></g>
<g font-size="18" fill="#52616d">
<text x="48" y="548">QUIC 用 TLS 派生密钥，不使用普通 TLS Record 承载 HTTP/3 应用数据。</text>
<text x="48" y="584">访问远端主机：本机通过 ARP / NDP 解析本地下一跳，而不是远端服务器的 MAC。</text>
<text x="48" y="620">代理若终止安全连接，会建立另一条上游连接；加密边界需要逐段确认。</text>
</g></g></svg>
