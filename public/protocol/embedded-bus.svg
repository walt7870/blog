<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="780" viewBox="0 0 1120 780" role="img" aria-labelledby="bus-title bus-desc">
<title id="bus-title">UART、I²C、SPI 与 CAN 信号关系</title><desc id="bus-desc">UART交叉连接收发，I²C共享带上拉的数据与时钟，SPI共享时钟数据并独立片选，CAN通过收发器接入两端端接的差分总线。图省略电源、地与保护电路。</desc>
<rect width="1120" height="780" fill="#f7f9fb"/>
<g font-family="Arial, 'PingFang SC', sans-serif" fill="#23313d">
<text x="48" y="50" font-size="28" font-weight="700">先区分接口、信号方向与总线接入规则</text>
<text x="48" y="84" font-size="18" fill="#52616d">信号关系示意：省略电源、参考地与保护电路；不能作为完整接线原理图。</text>
<g fill="#fff" stroke="#8fa3b1"><rect x="48" y="116" width="488" height="280" rx="6"/><rect x="584" y="116" width="488" height="280" rx="6"/><rect x="48" y="420" width="488" height="280" rx="6"/><rect x="584" y="420" width="488" height="280" rx="6"/></g>
<g font-size="22" font-weight="600"><text x="70" y="154">UART：异步串行、收发交叉</text><text x="606" y="154">I²C：共享两线、地址寻址</text><text x="70" y="458">SPI：时钟、数据与片选</text><text x="606" y="458">CAN：收发器接入差分总线</text></g>
<g fill="#eaf3fb" stroke="#7694aa"><rect x="76" y="182" width="108" height="128"/><rect x="400" y="182" width="108" height="128"/><rect x="612" y="182" width="108" height="128"/><rect x="936" y="182" width="108" height="128"/><rect x="76" y="486" width="108" height="152"/><rect x="400" y="486" width="108" height="152"/><rect x="612" y="490" width="116" height="64"/><rect x="770" y="490" width="116" height="64"/><rect x="928" y="490" width="116" height="64"/></g>
<g fill="none" stroke="#596775" stroke-width="2">
<path d="M184 220H400"/><path d="M184 278H400"/>
<path d="M720 220H936"/><path d="M720 278H936"/>
<path d="M184 510H400"/><path d="M184 548H400"/><path d="M184 586H400"/><path d="M184 624H400"/>
<path d="M612 584H1044"/><path d="M612 618H1044"/>
<path d="M650 554V584"/><path d="M690 554V618"/><path d="M808 554V584"/><path d="M848 554V618"/><path d="M966 554V584"/><path d="M1006 554V618"/>
<path d="M612 584V592M612 610V618"/><path d="M1044 584V592M1044 610V618"/>
</g>
<g fill="#fff" stroke="#596775"><rect x="606" y="592" width="12" height="18"/><rect x="1038" y="592" width="12" height="18"/></g>
<g font-size="18" text-anchor="middle">
<text x="130" y="212">MCU A</text><text x="130" y="244">TX</text><text x="130" y="292">RX</text><text x="454" y="212">MCU B</text><text x="454" y="244">RX</text><text x="454" y="292">TX</text>
<text x="292" y="210">TX → RX</text><text x="292" y="268">RX ← TX</text>
<text x="666" y="244">控制器</text><text x="990" y="244">外设</text><text x="828" y="210">SDA</text><text x="828" y="268">SCL</text>
<text x="130" y="570">控制器</text><text x="454" y="570">外设</text><text x="292" y="500">SCLK →</text><text x="292" y="538">MOSI →</text><text x="292" y="576">MISO ←</text><text x="292" y="614">CS →</text>
<text x="670" y="516">节点 1</text><text x="670" y="540">含收发器</text><text x="828" y="516">节点 2</text><text x="828" y="540">含收发器</text><text x="986" y="516">节点 N</text><text x="986" y="540">含收发器</text>
<text x="752" y="578">CAN_H</text><text x="752" y="644">CAN_L</text>
</g>
<g font-size="17" fill="#52616d">
<text x="70" y="346">须确认电平兼容；RS-485 是另一种电气接口。</text><text x="70" y="376">双方约定波特率、数据位、校验与停止位。</text>
<text x="606" y="346">开漏模式须加上拉电阻（此处省略），不能悬空。</text><text x="606" y="376">增加外设时共享 SDA/SCL，先解决地址冲突。</text>
<text x="70" y="674">多外设常共享前三线，各自独立片选并释放 MISO。</text>
<text x="606" y="674">主干两端 120Ω 端接（竖线处），不是逐节点端接。</text>
<text x="48" y="746">CAN 优先级来自逐位仲裁；CRC、错误界定和重传不能代替应用层时效与控制安全检查。</text>
</g></g></svg>
