<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="550" viewBox="0 0 1120 550" role="img" aria-labelledby="fd-accept-t fd-accept-d">
<title id="fd-accept-t">fd 用完时，握手照样完成，连接堆在 accept 队列</title><desc id="fd-accept-d">客户端 connect 后内核完成握手，连接进入 accept 队列；应用 accept 时分配 fd。fd 额度满时 accept 返回 EMFILE，新连接停留在队列中，客户端看起来已连接但无人处理。</desc>
<defs><marker id="fd-accept-a" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#596775"/></marker>
<marker id="fd-accept-r" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#b4473b"/></marker></defs>
<rect width="1120" height="550" fill="#f7f9fb"/>
<g font-family="Arial, 'PingFang SC', sans-serif" fill="#23313d">
<text x="40" y="56" font-size="28" fill="#23313d" font-weight="600">fd 用完时，握手照样完成，连接堆在 accept 队列</text><text x="40" y="92" font-size="18" fill="#52616d">内核替应用完成三次握手；应用调用 accept() 才会为连接分配文件描述符。</text><rect x="40" y="140" width="200" height="96" rx="6" fill="#fff" stroke="#8fa3b1"/><text x="60" y="178" font-size="19" fill="#23313d" font-weight="600">客户端 connect()</text><text x="60" y="210" font-size="16" fill="#52616d">返回成功</text><rect x="270" y="140" width="200" height="96" rx="6" fill="#fff" stroke="#8fa3b1"/><text x="290" y="178" font-size="19" fill="#23313d" font-weight="600">内核完成握手</text><text x="290" y="210" font-size="16" fill="#52616d">连接进入队列</text><rect x="500" y="140" width="200" height="96" rx="6" fill="#eaf3fb" stroke="#7694aa"/><text x="520" y="178" font-size="19" fill="#23313d" font-weight="600">accept 队列</text><text x="520" y="210" font-size="16" fill="#52616d">等应用来取</text><rect x="760" y="140" width="320" height="96" rx="6" fill="#fff" stroke="#8fa3b1"/><text x="780" y="178" font-size="19" fill="#23313d" font-weight="600">应用 accept()</text><text x="780" y="210" font-size="16" fill="#52616d">分配一个 fd</text><path d="M242 188H266" fill="none" stroke="#596775" stroke-width="2" marker-end="url(#fd-accept-a)"/><path d="M472 188H496" fill="none" stroke="#596775" stroke-width="2" marker-end="url(#fd-accept-a)"/><path d="M702 188H756" fill="none" stroke="#596775" stroke-width="2" marker-end="url(#fd-accept-a)"/><path d="M920 238V286" fill="none" stroke="#b4473b" stroke-width="2" marker-end="REDurl(#fd-accept-a)"/><rect x="760" y="290" width="320" height="96" rx="6" fill="#fbeceb" stroke="#b4473b"/><text x="780" y="328" font-size="19" fill="#b4473b" font-weight="600">fd 额度已满</text><text x="780" y="358" font-size="16" fill="#b4473b">accept() 返回 EMFILE</text><path d="M760 338H600Q590 338 590 328V242" fill="none" stroke="#b4473b" stroke-width="2" stroke-dasharray="6 5" marker-end="REDurl(#fd-accept-a)"/><text x="380" y="330" font-size="15" fill="#b4473b">新连接取不走，留在队列里</text><rect x="40" y="420" width="1040" height="110" rx="6" fill="#e8f5ef" stroke="#74a28b"/><text x="60" y="456" font-size="17" fill="#23313d">实验：服务端软限制 64 个 fd，accept 到第 61 条失败；客户端 100 条 connect() 全部成功。</text><text x="60" y="490" font-size="17" fill="#23313d">ss -lnt 显示监听 Socket 的 Recv-Q = 40：这 40 条连接对客户端来说已经“连上”，但没有任何程序在处理。</text>
</g></svg>
