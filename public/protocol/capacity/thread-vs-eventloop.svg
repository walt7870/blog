<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="560" viewBox="0 0 1120 560" role="img" aria-labelledby="thread-vs-eventloop-t thread-vs-eventloop-d">
<title id="thread-vs-eventloop-t">一连接一线程，和一个线程等所有连接</title><desc id="thread-vs-eventloop-d">实测 5000 条空闲连接：一连接一线程模型有 5002 个线程、常驻内存 114 MiB、虚拟地址空间 44.4 GiB；epoll 事件循环只有 2 个线程、常驻内存 16 MiB。</desc>
<defs><marker id="thread-vs-eventloop-a" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#596775"/></marker>
<marker id="thread-vs-eventloop-r" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#b4473b"/></marker></defs>
<rect width="1120" height="560" fill="#f7f9fb"/>
<g font-family="Arial, 'PingFang SC', sans-serif" fill="#23313d">
<text x="40" y="56" font-size="28" fill="#23313d" font-weight="600">一连接一线程，和一个线程等所有连接</text><text x="40" y="92" font-size="18" fill="#52616d">实测：Python 3.13，同一进程保持 5,000 条空闲连接。</text><rect x="40" y="130" width="500" height="300" rx="6" fill="#fff" stroke="#8fa3b1"/><rect x="580" y="130" width="500" height="300" rx="6" fill="#eaf3fb" stroke="#7694aa"/><text x="60" y="166" font-size="20" fill="#23313d" font-weight="600">一连接一线程</text><text x="600" y="166" font-size="20" fill="#23313d" font-weight="600">事件循环（epoll）</text><rect x="60" y="190" width="66" height="34" rx="6" fill="#fff" stroke="#8fa3b1"/><text x="70" y="213" font-size="14" fill="#52616d">线程</text><rect x="138" y="190" width="66" height="34" rx="6" fill="#fff" stroke="#8fa3b1"/><text x="148" y="213" font-size="14" fill="#52616d">线程</text><rect x="216" y="190" width="66" height="34" rx="6" fill="#fff" stroke="#8fa3b1"/><text x="226" y="213" font-size="14" fill="#52616d">线程</text><rect x="294" y="190" width="66" height="34" rx="6" fill="#fff" stroke="#8fa3b1"/><text x="304" y="213" font-size="14" fill="#52616d">线程</text><rect x="372" y="190" width="66" height="34" rx="6" fill="#fff" stroke="#8fa3b1"/><text x="382" y="213" font-size="14" fill="#52616d">线程</text><rect x="450" y="190" width="66" height="34" rx="6" fill="#fff" stroke="#8fa3b1"/><text x="460" y="213" font-size="14" fill="#52616d">线程</text><rect x="60" y="236" width="66" height="34" rx="6" fill="#fff" stroke="#8fa3b1"/><text x="70" y="259" font-size="14" fill="#52616d">线程</text><rect x="138" y="236" width="66" height="34" rx="6" fill="#fff" stroke="#8fa3b1"/><text x="148" y="259" font-size="14" fill="#52616d">线程</text><rect x="216" y="236" width="66" height="34" rx="6" fill="#fff" stroke="#8fa3b1"/><text x="226" y="259" font-size="14" fill="#52616d">线程</text><rect x="294" y="236" width="66" height="34" rx="6" fill="#fff" stroke="#8fa3b1"/><text x="304" y="259" font-size="14" fill="#52616d">线程</text><rect x="372" y="236" width="66" height="34" rx="6" fill="#fff" stroke="#8fa3b1"/><text x="382" y="259" font-size="14" fill="#52616d">线程</text><rect x="450" y="236" width="66" height="34" rx="6" fill="#fff" stroke="#8fa3b1"/><text x="460" y="259" font-size="14" fill="#52616d">线程</text><rect x="60" y="282" width="66" height="34" rx="6" fill="#fff" stroke="#8fa3b1"/><text x="70" y="305" font-size="14" fill="#52616d">线程</text><rect x="138" y="282" width="66" height="34" rx="6" fill="#fff" stroke="#8fa3b1"/><text x="148" y="305" font-size="14" fill="#52616d">线程</text><rect x="216" y="282" width="66" height="34" rx="6" fill="#fff" stroke="#8fa3b1"/><text x="226" y="305" font-size="14" fill="#52616d">线程</text><rect x="294" y="282" width="66" height="34" rx="6" fill="#fff" stroke="#8fa3b1"/><text x="304" y="305" font-size="14" fill="#52616d">线程</text><rect x="372" y="282" width="66" height="34" rx="6" fill="#fff" stroke="#8fa3b1"/><text x="382" y="305" font-size="14" fill="#52616d">线程</text><rect x="450" y="282" width="66" height="34" rx="6" fill="#fff" stroke="#8fa3b1"/><text x="460" y="305" font-size="14" fill="#52616d">线程</text><text x="60" y="352" font-size="16" fill="#52616d">每条连接一个线程阻塞在 recv()</text><text x="60" y="386" font-size="17" fill="#23313d">线程 5,002 个 · 常驻内存 114 MiB</text><text x="60" y="414" font-size="16" fill="#52616d">虚拟地址空间 44.4 GiB（每个线程预留栈）</text><rect x="600" y="190" width="150" height="120" rx="6" fill="#fff" stroke="#8fa3b1"/><text x="620" y="230" font-size="18" fill="#23313d" font-weight="600">一个线程</text><text x="620" y="260" font-size="15" fill="#52616d">epoll_wait()</text><text x="620" y="288" font-size="15" fill="#52616d">只处理就绪的</text><path d="M752 250L900 198" fill="none" stroke="#9fb3c2" stroke-width="1.5"/><rect x="900" y="190" width="150" height="14" rx="3" fill="#fff" stroke="#8fa3b1"/><path d="M752 250L900 218" fill="none" stroke="#9fb3c2" stroke-width="1.5"/><rect x="900" y="210" width="150" height="14" rx="3" fill="#fff" stroke="#8fa3b1"/><path d="M752 250L900 238" fill="none" stroke="#9fb3c2" stroke-width="1.5"/><rect x="900" y="230" width="150" height="14" rx="3" fill="#fff" stroke="#8fa3b1"/><path d="M752 250L900 258" fill="none" stroke="#9fb3c2" stroke-width="1.5"/><rect x="900" y="250" width="150" height="14" rx="3" fill="#fff" stroke="#8fa3b1"/><path d="M752 250L900 278" fill="none" stroke="#9fb3c2" stroke-width="1.5"/><rect x="900" y="270" width="150" height="14" rx="3" fill="#fff" stroke="#8fa3b1"/><path d="M752 250L900 298" fill="none" stroke="#9fb3c2" stroke-width="1.5"/><rect x="900" y="290" width="150" height="14" rx="3" fill="#fff" stroke="#8fa3b1"/><text x="900" y="334" font-size="15" fill="#52616d">5,000 个 fd 登记在 epoll</text><text x="600" y="386" font-size="17" fill="#23313d">线程 2 个 · 常驻内存 16 MiB</text><text x="600" y="414" font-size="16" fill="#52616d">虚拟地址空间 0.1 GiB</text><rect x="40" y="456" width="1040" height="84" rx="6" fill="#e8f5ef" stroke="#74a28b"/><text x="60" y="490" font-size="17" fill="#23313d">空闲时两种模型都几乎不占 CPU，差别先出现在线程数和内存上；连接一多，线程模型还会多出调度切换。</text><text x="60" y="522" font-size="15" fill="#52616d">数字包含同进程里客户端 Socket 的开销，只用于对比两种模型。</text>
</g></svg>
