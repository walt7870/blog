<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="560" viewBox="0 0 1120 560" role="img" aria-labelledby="accept-queue-t accept-queue-d">
<title id="accept-queue-t">握手的两段排队：SYN 队列和 accept 队列</title><desc id="accept-queue-d">客户端 SYN 先进入 SYN 队列，握手完成后进入 accept 队列等待应用 accept。accept 队列满时新 SYN 被丢弃并计入 ListenOverflows，客户端重传直到超时。实验中 backlog 为 4，前 5 个连接成功，后 7 个超时。</desc>
<defs><marker id="accept-queue-a" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#596775"/></marker>
<marker id="accept-queue-r" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#b4473b"/></marker></defs>
<rect width="1120" height="560" fill="#f7f9fb"/>
<g font-family="Arial, 'PingFang SC', sans-serif" fill="#23313d">
<text x="40" y="56" font-size="28" fill="#23313d" font-weight="600">握手的两段排队：SYN 队列和 accept 队列</text><text x="40" y="92" font-size="18" fill="#52616d">accept 队列长度取 listen(backlog) 与 net.core.somaxconn 中较小的值。</text><rect x="40" y="140" width="170" height="90" rx="6" fill="#fff" stroke="#8fa3b1"/><text x="60" y="178" font-size="19" fill="#23313d" font-weight="600">客户端</text><text x="60" y="208" font-size="16" fill="#52616d">发出 SYN</text><rect x="270" y="140" width="220" height="90" rx="6" fill="#fff" stroke="#8fa3b1"/><text x="290" y="178" font-size="19" fill="#23313d" font-weight="600">SYN 队列</text><text x="290" y="208" font-size="16" fill="#52616d">半连接，等第三次握手</text><rect x="550" y="140" width="240" height="90" rx="6" fill="#eaf3fb" stroke="#7694aa"/><text x="570" y="178" font-size="19" fill="#23313d" font-weight="600">accept 队列</text><text x="570" y="208" font-size="16" fill="#52616d">握手完成，等应用取走</text><rect x="850" y="140" width="230" height="90" rx="6" fill="#fff" stroke="#8fa3b1"/><text x="870" y="178" font-size="19" fill="#23313d" font-weight="600">应用 accept()</text><text x="870" y="208" font-size="16" fill="#52616d">拿到连接开始处理</text><path d="M212 185H266" fill="none" stroke="#596775" stroke-width="2" marker-end="url(#accept-queue-a)"/><path d="M492 185H546" fill="none" stroke="#596775" stroke-width="2" marker-end="url(#accept-queue-a)"/><path d="M792 185H846" fill="none" stroke="#596775" stroke-width="2" marker-end="url(#accept-queue-a)"/><path d="M670 232V282" fill="none" stroke="#b4473b" stroke-width="2" marker-end="REDurl(#accept-queue-a)"/><rect x="470" y="286" width="400" height="100" rx="6" fill="#fbeceb" stroke="#b4473b"/><text x="490" y="322" font-size="19" fill="#b4473b" font-weight="600">accept 队列满</text><text x="490" y="352" font-size="16" fill="#b4473b">新的 SYN 被丢弃，计入 ListenOverflows</text><path d="M470 336H135Q125 336 125 326V236" fill="none" stroke="#b4473b" stroke-width="2" stroke-dasharray="6 5" marker-end="REDurl(#accept-queue-a)"/><text x="140" y="324" font-size="15" fill="#b4473b">收不到回应，1 秒后重发 SYN，直到超时</text><rect x="40" y="412" width="1040" height="128" rx="6" fill="#e8f5ef" stroke="#74a28b"/><text x="60" y="446" font-size="17" fill="#23313d">实验：backlog = 4，应用从不 accept，依次来 12 个客户端，各等 2 秒。</text><text x="60" y="478" font-size="17" fill="#23313d">前 5 个立即连上（队列可放 backlog + 1 条），后 7 个全部超时；ss -lnt 显示 Recv-Q 5、Send-Q 4。</text><text x="60" y="510" font-size="17" fill="#23313d">ListenOverflows 增加 14：7 个客户端各发了首个 SYN 和 1 秒后的重传，每次都被丢弃。</text>
</g></svg>
