<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="560" viewBox="0 0 1120 560" role="img" aria-labelledby="connection-memory-t connection-memory-d">
<title id="connection-memory-t">同一条连接，空闲和积压的内存成本相差上百倍</title><desc id="connection-memory-d">实测空闲连接每个 Socket 约 3.7 KiB，客户端不读时服务端每条连接平均积压 492 KiB。8 GiB 内存只算服务端内核对象可容纳约 227 万条空闲连接，但只需约 1.7 万条积压连接就会占满。</desc>
<defs><marker id="connection-memory-a" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#596775"/></marker>
<marker id="connection-memory-r" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#b4473b"/></marker></defs>
<rect width="1120" height="560" fill="#f7f9fb"/>
<g font-family="Arial, 'PingFang SC', sans-serif" fill="#23313d">
<text x="40" y="56" font-size="28" fill="#23313d" font-weight="600">同一条连接，空闲和积压的内存成本相差上百倍</text><text x="40" y="92" font-size="18" fill="#52616d">实测：Linux 7.0 容器，10,000 条回环连接；其中 1,000 条的客户端不读数据。</text><text x="40" y="150" font-size="17" fill="#23313d">空闲连接，每个 Socket</text><rect x="220" y="134" width="6.4" height="24" fill="#7694aa"/><text x="236" y="152" font-size="16" fill="#52616d">约 3.7 KiB（Slab 里的固定对象，没有收发缓冲）</text><text x="40" y="210" font-size="17" fill="#23313d">客户端不读的连接</text><rect x="220" y="194" width="860" height="24" fill="#c7782f"/><text x="236" y="212" font-size="16" fill="#fff">服务端发送队列平均 492 KiB / 条</text><rect x="40" y="260" width="500" height="200" rx="6" fill="#fff" stroke="#8fa3b1"/><rect x="580" y="260" width="500" height="200" rx="6" fill="#fff" stroke="#8fa3b1"/><text x="60" y="296" font-size="19" fill="#23313d" font-weight="600">8 GiB 内存全给空闲连接</text><text x="60" y="334" font-size="18" fill="#52616d">8 GiB ÷ 3.7 KiB</text><text x="60" y="366" font-size="18" fill="#23313d">≈ 227 万条</text><text x="60" y="404" font-size="16" fill="#52616d">只算服务端一侧的内核对象</text><text x="60" y="432" font-size="16" fill="#52616d">再加应用层会话、TLS 状态，会少得多</text><text x="600" y="296" font-size="19" fill="#23313d" font-weight="600">8 GiB 遇上读得慢的客户端</text><text x="600" y="334" font-size="18" fill="#52616d">8 GiB ÷ 492 KiB</text><text x="600" y="366" font-size="18" fill="#b4473b">≈ 1.7 万条就能占满</text><text x="600" y="404" font-size="16" fill="#52616d">积压量取决于 tcp_wmem 上限和对端窗口</text><text x="600" y="432" font-size="16" fill="#52616d">要靠应用层的有界队列和背压控制</text><rect x="40" y="486" width="1040" height="54" rx="6" fill="#e8f5ef" stroke="#74a28b"/><text x="60" y="519" font-size="17" fill="#23313d">容量规划看的是“多少连接会积压、积压多少”，而不只是连接总数乘以一个固定值。</text>
</g></svg>
