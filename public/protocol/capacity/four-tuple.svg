<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="560" viewBox="0 0 1120 560" role="img" aria-labelledby="four-tuple-t four-tuple-d">
<title id="four-tuple-t">65535 卡住的是发起连接的一方</title><desc id="four-tuple-d">服务端只监听 443，不同客户端地址和端口组成不同四元组。反向代理用一个出口 IP 连同一个上游时，四元组只剩源端口可变，临时端口约 2.8 万个，用完报 EADDRNOTAVAIL。</desc>
<defs><marker id="four-tuple-a" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#596775"/></marker>
<marker id="four-tuple-r" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#b4473b"/></marker></defs>
<rect width="1120" height="560" fill="#f7f9fb"/>
<g font-family="Arial, 'PingFang SC', sans-serif" fill="#23313d">
<text x="40" y="56" font-size="28" fill="#23313d" font-weight="600">65535 卡住的是发起连接的一方</text><text x="40" y="92" font-size="18" fill="#52616d">服务端一个端口靠对方地址区分连接；发起方连同一目标时，只剩源端口能变。</text><rect x="40" y="130" width="500" height="330" rx="6" fill="#fff" stroke="#8fa3b1"/><rect x="580" y="130" width="500" height="330" rx="6" fill="#fff" stroke="#8fa3b1"/><text x="60" y="166" font-size="20" fill="#23313d" font-weight="600">服务端：一个监听端口</text><text x="600" y="166" font-size="20" fill="#23313d" font-weight="600">发起方：连同一个上游地址</text><rect x="70" y="250" width="150" height="90" rx="6" fill="#eaf3fb" stroke="#7694aa"/><text x="90" y="288" font-size="18" fill="#23313d" font-weight="600">推送网关</text><text x="90" y="316" font-size="16" fill="#52616d">:443</text><rect x="360" y="186" width="160" height="60" rx="6" fill="#fff" stroke="#8fa3b1"/><text x="374" y="212" font-size="15" fill="#23313d">198.51.100.7</text><text x="374" y="234" font-size="15" fill="#52616d">端口 51200</text><path d="M222 295L356 216" fill="none" stroke="#596775" stroke-width="2"/><rect x="360" y="264" width="160" height="60" rx="6" fill="#fff" stroke="#8fa3b1"/><text x="374" y="290" font-size="15" fill="#23313d">198.51.100.7</text><text x="374" y="312" font-size="15" fill="#52616d">端口 51201</text><path d="M222 295L356 294" fill="none" stroke="#596775" stroke-width="2"/><rect x="360" y="342" width="160" height="60" rx="6" fill="#fff" stroke="#8fa3b1"/><text x="374" y="368" font-size="15" fill="#23313d">203.0.113.42</text><text x="374" y="390" font-size="15" fill="#52616d">端口 38110</text><path d="M222 295L356 372" fill="none" stroke="#596775" stroke-width="2"/><text x="60" y="446" font-size="15" fill="#52616d">三条连接的目标都是 :443，四元组不同就是不同连接</text><rect x="610" y="250" width="120" height="90" rx="6" fill="#eaf3fb" stroke="#7694aa"/><text x="626" y="288" font-size="18" fill="#23313d" font-weight="600">反向代理</text><text x="626" y="316" font-size="15" fill="#52616d">出口 IP ×1</text><rect x="930" y="250" width="120" height="90" rx="6" fill="#fff" stroke="#8fa3b1"/><text x="946" y="288" font-size="18" fill="#23313d" font-weight="600">上游服务</text><text x="946" y="316" font-size="14" fill="#52616d">10.0.0.5:8080</text><path d="M732 295H926" fill="none" stroke="#596775" stroke-width="2" marker-end="url(#four-tuple-a)"/><rect x="612" y="372" width="38" height="26" rx="3" fill="#d6e4ef" stroke="#7694aa"/><rect x="656" y="372" width="38" height="26" rx="3" fill="#d6e4ef" stroke="#7694aa"/><rect x="700" y="372" width="38" height="26" rx="3" fill="#d6e4ef" stroke="#7694aa"/><rect x="744" y="372" width="38" height="26" rx="3" fill="#d6e4ef" stroke="#7694aa"/><rect x="788" y="372" width="38" height="26" rx="3" fill="#d6e4ef" stroke="#7694aa"/><rect x="832" y="372" width="38" height="26" rx="3" fill="#d6e4ef" stroke="#7694aa"/><rect x="876" y="372" width="38" height="26" rx="3" fill="#d6e4ef" stroke="#7694aa"/><rect x="920" y="372" width="38" height="26" rx="3" fill="#d6e4ef" stroke="#7694aa"/><rect x="964" y="372" width="38" height="26" rx="3" fill="#d6e4ef" stroke="#7694aa"/><rect x="1008" y="372" width="38" height="26" rx="3" fill="#fbeceb" stroke="#b4473b"/><text x="612" y="420" font-size="15" fill="#52616d">临时端口池 32768–60999，约 2.8 万个</text><text x="612" y="446" font-size="15" fill="#b4473b">用完后 connect() 返回 EADDRNOTAVAIL</text><rect x="40" y="486" width="1040" height="54" rx="6" fill="#e8f5ef" stroke="#74a28b"/><text x="60" y="519" font-size="17" fill="#23313d">实验：端口范围缩到 10 个，连 :9000 成功 10 条后报错；换连 :9001，同样 10 个端口又能再建 10 条。</text>
</g></svg>
