<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="580" viewBox="0 0 1120 580" role="img" aria-labelledby="stability-timeline-t stability-timeline-d"><title id="stability-timeline-t">Rust稳定版与Edition节点</title><desc id="stability-timeline-d">横轴按年份间隔布局；Edition名称并不等于实际发布日期。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#607568"/></marker><style>text{font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;letter-spacing:0;fill:#253c30}.h{font-size:28px;font-weight:600}.n{font-size:21px;font-weight:600}.s{font-size:18px;fill:#52685b}.node{fill:white;stroke:#a6b9ad;stroke-width:1.5}.focus{fill:#e9f4ee;stroke:#397657;stroke-width:1.5}.info{fill:#edf3fb;stroke:#739bbf;stroke-width:1.5}.edge{fill:none;stroke:#607568;stroke-width:2;marker-end:url(#a)}</style></defs><rect width="1120" height="580" fill="white"/><text x="32" y="44" class="h">Rust稳定版与Edition节点</text><text x="32" y="82" class="s">横轴按年份间隔布局；Edition名称并不等于实际发布日期。</text><path d="M90 292H1026" stroke="#a6b9ad" fill="none"/><circle cx="120" cy="292" r="5" fill="#397657"/><path d="M120 292V200" stroke="#a6b9ad"/><text x="54" y="182" class="s">2015-05-15</text><text x="54" y="210" class="s">1.0稳定版</text><circle cx="370" cy="292" r="5" fill="#397657"/><path d="M370 292V352" stroke="#a6b9ad"/><text x="304" y="378" class="s">2018-12-06</text><text x="304" y="406" class="s">1.31 / Edition 2018</text><circle cx="590" cy="292" r="5" fill="#397657"/><path d="M590 292V200" stroke="#a6b9ad"/><text x="524" y="182" class="s">2021-10-21</text><text x="524" y="210" class="s">1.56 / Edition 2021</text><circle cx="850" cy="292" r="5" fill="#397657"/><path d="M850 292V352" stroke="#a6b9ad"/><text x="784" y="378" class="s">2025-02-20</text><text x="784" y="406" class="s">1.85 / Edition 2024</text><text x="32" y="544" class="s">同一依赖图可含不同Edition；编译器版本、Edition与MSRV需要分别维护。</text></svg>
