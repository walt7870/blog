<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="580" viewBox="0 0 1120 580" role="img" aria-labelledby="ownership-lifecycle-t ownership-lifecycle-d"><title id="ownership-lifecycle-t">一个字符串的借用、修改与移交</title><desc id="ownership-lifecycle-d">同一资源的访问阶段依次结束；标注生命周期不能延长所有者寿命。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#607568"/></marker><style>text{font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;letter-spacing:0;fill:#253c30}.h{font-size:28px;font-weight:600}.n{font-size:21px;font-weight:600}.s{font-size:18px;fill:#52685b}.node{fill:white;stroke:#a6b9ad;stroke-width:1.5}.focus{fill:#e9f4ee;stroke:#397657;stroke-width:1.5}.info{fill:#edf3fb;stroke:#739bbf;stroke-width:1.5}.edge{fill:none;stroke:#607568;stroke-width:2;marker-end:url(#a)}</style></defs><rect width="1120" height="580" fill="white"/><text x="32" y="44" class="h">一个字符串的借用、修改与移交</text><text x="32" y="82" class="s">同一资源的访问阶段依次结束；标注生命周期不能延长所有者寿命。</text><path class="edge" d="M336 190H408"/><path class="edge" d="M712 190H784"/><path class="edge" d="M936 250V344"/><path class="edge" d="M784 404H712"/><path class="edge" d="M408 404H336"/><g data-node="draft拥有String"><rect x="32" y="130" width="304" height="120" rx="6" class="node"/><text x="50" y="162" class="n">draft拥有String</text><text x="50" y="194" class="s">负责正常作用域退出释放</text><text x="50" y="220" class="s">原文含首尾空格</text></g><g data-node="只读借用 &amp;str"><rect x="408" y="130" width="304" height="120" rx="6" class="focus"/><text x="426" y="162" class="n">只读借用 &amp;str</text><text x="426" y="194" class="s">读取与打印，不接管</text><text x="426" y="220" class="s">最后一次使用后结束</text></g><g data-node="独占修改 &amp;mut"><rect x="784" y="130" width="304" height="120" rx="6" class="node"/><text x="802" y="162" class="n">独占修改 &amp;mut</text><text x="802" y="194" class="s">规范化缓冲区</text><text x="802" y="220" class="s">与同位置活跃借用冲突</text></g><g data-node="移动到job"><rect x="784" y="344" width="304" height="120" rx="6" class="node"/><text x="802" y="376" class="n">移动到job</text><text x="802" y="408" class="s">新绑定接管资源</text><text x="802" y="434" class="s">原draft不能继续读取</text></g><g data-node="任务处理与释放"><rect x="408" y="344" width="304" height="120" rx="6" class="info"/><text x="426" y="376" class="n">任务处理与释放</text><text x="426" y="408" class="s">新所有者负责Drop</text><text x="426" y="434" class="s">终止或遗忘可能不析构</text></g><g data-node="共享是另一种模型"><rect x="32" y="344" width="304" height="120" rx="6" class="node"/><text x="50" y="376" class="n">共享是另一种模型</text><text x="50" y="408" class="s">Rc/Arc管理共享分配</text><text x="50" y="434" class="s">clone句柄不是深复制</text></g><text x="32" y="544" class="s">Copy由类型实现决定，不按栈或堆判断；共享与独占引用有各自边界。</text></svg>
