<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="580" viewBox="0 0 1120 580" role="img" aria-labelledby="toolchain-gates-t toolchain-gates-d"><title id="toolchain-gates-t">固定输入后，对同一提交执行不同检查</title><desc id="toolchain-gates-d">检查各有职责；通过静态分析不替代行为与目标平台验证。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#607568"/></marker><style>text{font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;letter-spacing:0;fill:#253c30}.h{font-size:28px;font-weight:600}.n{font-size:21px;font-weight:600}.s{font-size:18px;fill:#52685b}.node{fill:white;stroke:#a6b9ad;stroke-width:1.5}.focus{fill:#e9f4ee;stroke:#397657;stroke-width:1.5}.info{fill:#edf3fb;stroke:#739bbf;stroke-width:1.5}.edge{fill:none;stroke:#607568;stroke-width:2;marker-end:url(#a)}</style></defs><rect width="1120" height="580" fill="white"/><text x="32" y="44" class="h">固定输入后，对同一提交执行不同检查</text><text x="32" y="82" class="s">检查各有职责；通过静态分析不替代行为与目标平台验证。</text><path class="edge" d="M336 190H408"/><path class="edge" d="M712 190H784"/><path class="edge" d="M936 250V344"/><path class="edge" d="M784 404H712"/><path class="edge" d="M408 404H336"/><g data-node="工具链与解析图"><rect x="32" y="130" width="304" height="120" rx="6" class="node"/><text x="50" y="162" class="n">工具链与解析图</text><text x="50" y="194" class="s">精确版本、锁文件、目标</text><text x="50" y="220" class="s">stable通道会继续移动</text></g><g data-node="格式与静态检查"><rect x="408" y="130" width="304" height="120" rx="6" class="focus"/><text x="426" y="162" class="n">格式与静态检查</text><text x="426" y="194" class="s">rustfmt、Clippy</text><text x="426" y="220" class="s">规则升级要评估新增诊断</text></g><g data-node="行为与文档"><rect x="784" y="130" width="304" height="120" rx="6" class="node"/><text x="802" y="162" class="n">行为与文档</text><text x="802" y="194" class="s">单元、集成和doc tests</text><text x="802" y="220" class="s">all-targets不含文档测试</text></g><g data-node="Release制品"><rect x="784" y="344" width="304" height="120" rx="6" class="node"/><text x="802" y="376" class="n">Release制品</text><text x="802" y="408" class="s">目标ABI、系统库与CPU</text><text x="802" y="434" class="s">构建成功不等于跨平台</text></g><g data-node="实际环境验收"><rect x="408" y="344" width="304" height="120" rx="6" class="info"/><text x="426" y="376" class="n">实际环境验收</text><text x="426" y="408" class="s">参数、响应、关闭与恢复</text><text x="426" y="434" class="s">验证和发布对应同一产物</text></g><g data-node="依赖与升级治理"><rect x="32" y="344" width="304" height="120" rx="6" class="node"/><text x="50" y="376" class="n">依赖与升级治理</text><text x="50" y="408" class="s">扩展审计工具独立安装</text><text x="50" y="434" class="s">锁文件不限制构建脚本权限</text></g><text x="32" y="544" class="s">互斥feature按支持矩阵分组，不用all-features代替全部组合。</text></svg>
