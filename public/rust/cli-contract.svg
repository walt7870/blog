<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="580" viewBox="0 0 1120 580" role="img" aria-labelledby="cli-contract-t cli-contract-d"><title id="cli-contract-t">订单CLI的计算与进程合同</title><desc id="cli-contract-d">核心库不打印、不终止进程；入口负责协议适配。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#607568"/></marker><style>text{font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;letter-spacing:0;fill:#253c30}.h{font-size:28px;font-weight:600}.n{font-size:21px;font-weight:600}.s{font-size:18px;fill:#52685b}.node{fill:white;stroke:#a6b9ad;stroke-width:1.5}.focus{fill:#e9f4ee;stroke:#397657;stroke-width:1.5}.info{fill:#edf3fb;stroke:#739bbf;stroke-width:1.5}.edge{fill:none;stroke:#607568;stroke-width:2;marker-end:url(#a)}</style></defs><rect width="1120" height="580" fill="white"/><text x="32" y="44" class="h">订单CLI的计算与进程合同</text><text x="32" y="82" class="s">核心库不打印、不终止进程；入口负责协议适配。</text><path class="edge" d="M336 190H408"/><path class="edge" d="M712 190H784"/><path class="edge" d="M936 250V344"/><path class="edge" d="M784 404H712"/><path class="edge" d="M408 404H336"/><g data-node="操作系统参数"><rect x="32" y="130" width="304" height="120" rx="6" class="node"/><text x="50" y="162" class="n">操作系统参数</text><text x="50" y="194" class="s">args_os读取原始参数</text><text x="50" y="220" class="s">拒绝缺少和多余参数</text></g><g data-node="边界解析"><rect x="408" y="130" width="304" height="120" rx="6" class="focus"/><text x="426" y="162" class="n">边界解析</text><text x="426" y="194" class="s">UTF-8、整数与数量范围</text><text x="426" y="220" class="s">单价允许零，数量不允许零</text></g><g data-node="核心计算"><rect x="784" y="130" width="304" height="120" rx="6" class="node"/><text x="802" y="162" class="n">核心计算</text><text x="802" y="194" class="s">Quantity与total_cents</text><text x="802" y="220" class="s">乘法溢出为领域错误</text></g><g data-node="输出与退出"><rect x="784" y="344" width="304" height="120" rx="6" class="node"/><text x="802" y="376" class="n">输出与退出</text><text x="802" y="408" class="s">成功stdout及退出0</text><text x="802" y="434" class="s">错误stderr及退出2</text></g><g data-node="实际进程测试"><rect x="408" y="344" width="304" height="120" rx="6" class="info"/><text x="426" y="376" class="n">实际进程测试</text><text x="426" y="408" class="s">检查内容、流向和状态码</text><text x="426" y="434" class="s">测试直接运行二进制</text></g><g data-node="Release交付"><rect x="32" y="344" width="304" height="120" rx="6" class="node"/><text x="50" y="376" class="n">Release交付</text><text x="50" y="408" class="s">目标环境实机运行</text><text x="50" y="434" class="s">不以cargo run代替分发验收</text></g><text x="32" y="544" class="s">规则测试保护金额；进程测试保护参数、输出与退出码。</text></svg>
