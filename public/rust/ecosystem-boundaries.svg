<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="580" viewBox="0 0 1120 580" role="img" aria-labelledby="ecosystem-boundaries-t ecosystem-boundaries-d"><title id="ecosystem-boundaries-t">运行目标决定库与系统依赖</title><desc id="ecosystem-boundaries-d">Cargo管理crate；文件、网络、调度与ABI由具体环境提供。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#607568"/></marker><style>text{font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;letter-spacing:0;fill:#253c30}.h{font-size:28px;font-weight:600}.n{font-size:21px;font-weight:600}.s{font-size:18px;fill:#52685b}.node{fill:white;stroke:#a6b9ad;stroke-width:1.5}.focus{fill:#e9f4ee;stroke:#397657;stroke-width:1.5}.info{fill:#edf3fb;stroke:#739bbf;stroke-width:1.5}.edge{fill:none;stroke:#607568;stroke-width:2;marker-end:url(#a)}</style></defs><rect width="1120" height="580" fill="white"/><text x="32" y="44" class="h">运行目标决定库与系统依赖</text><text x="32" y="82" class="s">Cargo管理crate；文件、网络、调度与ABI由具体环境提供。</text><g data-node="服务端 / CLI"><rect x="32" y="130" width="480" height="120" rx="6" class="focus"/><text x="50" y="162" class="n">服务端 / CLI</text><text x="50" y="194" class="s">标准库与原生系统能力</text><text x="50" y="220" class="s">TLS、数据库与系统运行库</text></g><g data-node="浏览器WASM"><rect x="608" y="130" width="480" height="120" rx="6" class="info"/><text x="626" y="162" class="n">浏览器WASM</text><text x="626" y="194" class="s">JS与Web API提供宿主能力</text><text x="626" y="220" class="s">不是原生文件和套接字</text></g><g data-node="MCU / no_std"><rect x="32" y="344" width="480" height="120" rx="6" class="node"/><text x="50" y="376" class="n">MCU / no_std</text><text x="50" y="408" class="s">PAC、HAL、启动与链接脚本</text><text x="50" y="434" class="s">按板级验证中断和时序</text></g><g data-node="跨语言FFI"><rect x="608" y="344" width="480" height="120" rx="6" class="node"/><text x="626" y="376" class="n">跨语言FFI</text><text x="626" y="408" class="s">ABI、长度、编码与对象寿命</text><text x="626" y="434" class="s">线程、释放及错误传播</text></g><text x="32" y="544" class="s">先在目标环境跑通最小I/O与错误路径，再比较生态和性能。</text></svg>
