<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="580" viewBox="0 0 1120 580" role="img" aria-labelledby="type-validation-boundary-t type-validation-boundary-d"><title id="type-validation-boundary-t">在领域边界集中校验订单数量</title><desc id="type-validation-boundary-d">私有字段限制外部构造，所有入口仍需遵守同一不变量。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#607568"/></marker><style>text{font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;letter-spacing:0;fill:#253c30}.h{font-size:28px;font-weight:600}.n{font-size:21px;font-weight:600}.s{font-size:18px;fill:#52685b}.node{fill:white;stroke:#a6b9ad;stroke-width:1.5}.focus{fill:#e9f4ee;stroke:#397657;stroke-width:1.5}.info{fill:#edf3fb;stroke:#739bbf;stroke-width:1.5}.edge{fill:none;stroke:#607568;stroke-width:2;marker-end:url(#a)}</style></defs><rect width="1120" height="580" fill="white"/><text x="32" y="44" class="h">在领域边界集中校验订单数量</text><text x="32" y="82" class="s">私有字段限制外部构造，所有入口仍需遵守同一不变量。</text><path class="edge" d="M336 190H408"/><path class="edge" d="M712 190H784"/><path class="edge" d="M936 250V344"/><path class="edge" d="M784 404H712"/><path class="edge" d="M408 404H336"/><g data-node="不可信输入"><rect x="32" y="130" width="304" height="120" rx="6" class="node"/><text x="50" y="162" class="n">不可信输入</text><text x="50" y="194" class="s">CLI参数、JSON或数据库</text><text x="50" y="220" class="s">不是有类型就天然可信</text></g><g data-node="Quantity::parse"><rect x="408" y="130" width="304" height="120" rx="6" class="focus"/><text x="426" y="162" class="n">Quantity::parse</text><text x="426" y="194" class="s">u8解析与1..99检查</text><text x="426" y="220" class="s">失败返回InvalidQuantity</text></g><g data-node="领域核心"><rect x="784" y="130" width="304" height="120" rx="6" class="node"/><text x="802" y="162" class="n">领域核心</text><text x="802" y="194" class="s">接收Quantity而非字符串</text><text x="802" y="220" class="s">私有字段防外部直接构造</text></g><g data-node="金额计算"><rect x="784" y="344" width="304" height="120" rx="6" class="node"/><text x="802" y="376" class="n">金额计算</text><text x="802" y="408" class="s">checked_mul检测溢出</text><text x="802" y="434" class="s">错误保留可匹配原因</text></g><g data-node="协议适配"><rect x="408" y="344" width="304" height="120" rx="6" class="info"/><text x="426" y="376" class="n">协议适配</text><text x="426" y="408" class="s">CLI退出码或HTTP响应</text><text x="426" y="434" class="s">不把内部故障当输入错误</text></g><g data-node="验证边界"><rect x="32" y="344" width="304" height="120" rx="6" class="node"/><text x="50" y="376" class="n">验证边界</text><text x="50" y="408" class="s">非法输入、溢出、构造拒绝</text><text x="50" y="434" class="s">故意改错计算应测试失败</text></g><text x="32" y="544" class="s">类型保证仅与实际构造规则一样强，新增加载入口不能绕过校验。</text></svg>
