<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="580" viewBox="0 0 1120 580" role="img" aria-labelledby="bounded-work-lifecycle-t bounded-work-lifecycle-d"><title id="bounded-work-lifecycle-t">有界队列中的接受、处理与关闭</title><desc id="bounded-work-lifecycle-d">通道容量控制排队，业务完成需等待处理结果。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#607568"/></marker><style>text{font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;letter-spacing:0;fill:#253c30}.h{font-size:28px;font-weight:600}.n{font-size:21px;font-weight:600}.s{font-size:18px;fill:#52685b}.node{fill:white;stroke:#a6b9ad;stroke-width:1.5}.focus{fill:#e9f4ee;stroke:#397657;stroke-width:1.5}.info{fill:#edf3fb;stroke:#739bbf;stroke-width:1.5}.edge{fill:none;stroke:#607568;stroke-width:2;marker-end:url(#a)}</style></defs><rect width="1120" height="580" fill="white"/><text x="32" y="44" class="h">有界队列中的接受、处理与关闭</text><text x="32" y="82" class="s">通道容量控制排队，业务完成需等待处理结果。</text><path class="edge" d="M336 190H408"/><path class="edge" d="M712 190H784"/><path class="edge" d="M936 250V344"/><path class="edge" d="M784 404H712"/><path class="edge" d="M408 404H336"/><g data-node="生产者提交"><rect x="32" y="130" width="304" height="120" rx="6" class="node"/><text x="50" y="162" class="n">生产者提交</text><text x="50" y="194" class="s">拥有任务数据后发送</text><text x="50" y="220" class="s">发送端可能还有克隆</text></g><g data-node="有界队列"><rect x="408" y="130" width="304" height="120" rx="6" class="focus"/><text x="426" y="162" class="n">有界队列</text><text x="426" y="194" class="s">容量2，满时等待或拒绝</text><text x="426" y="220" class="s">出队空位不等于执行完成</text></g><g data-node="工作任务"><rect x="784" y="130" width="304" height="120" rx="6" class="node"/><text x="802" y="162" class="n">工作任务</text><text x="802" y="194" class="s">受控并发、区分两层错误</text><text x="802" y="220" class="s">阻塞工作不占异步调度线程</text></g><g data-node="停止接收新工作"><rect x="784" y="344" width="304" height="120" rx="6" class="node"/><text x="802" y="376" class="n">停止接收新工作</text><text x="802" y="408" class="s">关闭最后一个发送端</text><text x="802" y="434" class="s">明确剩余任务处理策略</text></g><g data-node="排空与等待"><rect x="408" y="344" width="304" height="120" rx="6" class="info"/><text x="426" y="376" class="n">排空与等待</text><text x="426" y="408" class="s">读完队列再join或await</text><text x="426" y="434" class="s">异常退出记录未完成任务</text></g><g data-node="副作用与恢复"><rect x="32" y="344" width="304" height="120" rx="6" class="node"/><text x="50" y="376" class="n">副作用与恢复</text><text x="50" y="408" class="s">取消不回滚外部操作</text><text x="50" y="434" class="s">幂等键、查状态和恢复</text></g><text x="32" y="544" class="s">Send/Sync防数据竞争；死锁、重复扣款和关闭恢复仍需工程合同。</text></svg>
