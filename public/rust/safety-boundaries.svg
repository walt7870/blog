<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="580" viewBox="0 0 1120 580" role="img" aria-labelledby="safety-boundaries-t safety-boundaries-d"><title id="safety-boundaries-t">语言保证与工程责任的边界</title><desc id="safety-boundaries-d">同一个日志解析器仍需同时满足安全、资源和业务约束。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#607568"/></marker><style>text{font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;letter-spacing:0;fill:#253c30}.h{font-size:28px;font-weight:600}.n{font-size:21px;font-weight:600}.s{font-size:18px;fill:#52685b}.node{fill:white;stroke:#a6b9ad;stroke-width:1.5}.focus{fill:#e9f4ee;stroke:#397657;stroke-width:1.5}.info{fill:#edf3fb;stroke:#739bbf;stroke-width:1.5}.edge{fill:none;stroke:#607568;stroke-width:2;marker-end:url(#a)}</style></defs><rect width="1120" height="580" fill="white"/><text x="32" y="44" class="h">语言保证与工程责任的边界</text><text x="32" y="82" class="s">同一个日志解析器仍需同时满足安全、资源和业务约束。</text><path class="edge" d="M336 190H408"/><path class="edge" d="M712 190H784"/><path class="edge" d="M936 250V344"/><path class="edge" d="M784 404H712"/><path class="edge" d="M408 404H336"/><g data-node="安全接口"><rect x="32" y="130" width="304" height="120" rx="6" class="node"/><text x="50" y="162" class="n">安全接口</text><text x="50" y="194" class="s">约束悬垂、越界与别名</text><text x="50" y="220" class="s">底层unsafe仍需正确实现</text></g><g data-node="显式资源模型"><rect x="408" y="130" width="304" height="120" rx="6" class="focus"/><text x="426" y="162" class="n">显式资源模型</text><text x="426" y="194" class="s">Box分配、Arc计数</text><text x="426" y="220" class="s">锁等待与析构都有边界</text></g><g data-node="运行表现"><rect x="784" y="130" width="304" height="120" rx="6" class="node"/><text x="802" y="162" class="n">运行表现</text><text x="802" y="194" class="s">输入规模、算法与I/O</text><text x="802" y="220" class="s">编译成功不证明低延迟</text></g><g data-node="业务合同"><rect x="784" y="344" width="304" height="120" rx="6" class="node"/><text x="802" y="376" class="n">业务合同</text><text x="802" y="408" class="s">幂等、事务与状态转换</text><text x="802" y="434" class="s">数据竞争安全不等于正确</text></g><g data-node="证据与验收"><rect x="408" y="344" width="304" height="120" rx="6" class="info"/><text x="426" y="376" class="n">证据与验收</text><text x="426" y="408" class="s">畸形输入、峰值与尾延迟</text><text x="426" y="434" class="s">固定负载、平台和profile</text></g><g data-node="采用与回退"><rect x="32" y="344" width="304" height="120" rx="6" class="node"/><text x="50" y="376" class="n">采用与回退</text><text x="50" y="408" class="s">先替换边界清晰的模块</text><text x="50" y="434" class="s">保留对照与恢复方案</text></g><text x="32" y="544" class="s">无通用GC不等于无分配、无泄漏或无暂停。</text></svg>
