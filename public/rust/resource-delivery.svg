<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="580" viewBox="0 0 1120 580" role="img" aria-labelledby="resource-delivery-t resource-delivery-d"><title id="resource-delivery-t">Rust程序从输入到交付的阅读地图</title><desc id="resource-delivery-d">以订单CLI和报价服务为主线，先建立规则，再选择运行环境。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#607568"/></marker><style>text{font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;letter-spacing:0;fill:#253c30}.h{font-size:28px;font-weight:600}.n{font-size:21px;font-weight:600}.s{font-size:18px;fill:#52685b}.node{fill:white;stroke:#a6b9ad;stroke-width:1.5}.focus{fill:#e9f4ee;stroke:#397657;stroke-width:1.5}.info{fill:#edf3fb;stroke:#739bbf;stroke-width:1.5}.edge{fill:none;stroke:#607568;stroke-width:2;marker-end:url(#a)}</style></defs><rect width="1120" height="580" fill="white"/><text x="32" y="44" class="h">Rust程序从输入到交付的阅读地图</text><text x="32" y="82" class="s">以订单CLI和报价服务为主线，先建立规则，再选择运行环境。</text><path class="edge" d="M336 190H408"/><path class="edge" d="M712 190H784"/><path class="edge" d="M936 250V344"/><path class="edge" d="M784 404H712"/><path class="edge" d="M408 404H336"/><g data-node="输入与语法"><rect x="32" y="130" width="304" height="120" rx="6" class="node"/><text x="50" y="162" class="n">输入与语法</text><text x="50" y="194" class="s">文本数量、整数金额</text><text x="50" y="220" class="s">区分缺失、非法与溢出</text></g><g data-node="资源归属"><rect x="408" y="130" width="304" height="120" rx="6" class="focus"/><text x="426" y="162" class="n">资源归属</text><text x="426" y="194" class="s">只读、修改、移交任务</text><text x="426" y="220" class="s">所有权和借用限制别名</text></g><g data-node="领域类型"><rect x="784" y="130" width="304" height="120" rx="6" class="node"/><text x="802" y="162" class="n">领域类型</text><text x="802" y="194" class="s">私有字段与校验入口</text><text x="802" y="220" class="s">状态、Trait与错误合同</text></g><g data-node="运行与并发"><rect x="784" y="344" width="304" height="120" rx="6" class="node"/><text x="802" y="376" class="n">运行与并发</text><text x="802" y="408" class="s">同步线程或异步运行时</text><text x="802" y="434" class="s">队列容量、取消与关闭</text></g><g data-node="工程验证"><rect x="408" y="344" width="304" height="120" rx="6" class="info"/><text x="426" y="376" class="n">工程验证</text><text x="426" y="408" class="s">固定工具链与依赖</text><text x="426" y="434" class="s">规则、进程与HTTP测试</text></g><g data-node="目标环境交付"><rect x="32" y="344" width="304" height="120" rx="6" class="node"/><text x="50" y="376" class="n">目标环境交付</text><text x="50" y="408" class="s">CPU、系统库与配置</text><text x="50" y="434" class="s">实机运行及恢复路径</text></g><text x="32" y="544" class="s">语言保证、运行时行为和部署合同需要分别验证。</text></svg>
