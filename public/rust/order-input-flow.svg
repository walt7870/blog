<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="580" viewBox="0 0 1120 580" role="img" aria-labelledby="order-input-flow-t order-input-flow-d"><title id="order-input-flow-t">订单金额的输入与计算边界</title><desc id="order-input-flow-d">数量只允许1到99；本例以整数分计算，失败不伪装成零金额。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#607568"/></marker><style>text{font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;letter-spacing:0;fill:#253c30}.h{font-size:28px;font-weight:600}.n{font-size:21px;font-weight:600}.s{font-size:18px;fill:#52685b}.node{fill:white;stroke:#a6b9ad;stroke-width:1.5}.focus{fill:#e9f4ee;stroke:#397657;stroke-width:1.5}.info{fill:#edf3fb;stroke:#739bbf;stroke-width:1.5}.edge{fill:none;stroke:#607568;stroke-width:2;marker-end:url(#a)}</style></defs><rect width="1120" height="580" fill="white"/><text x="32" y="44" class="h">订单金额的输入与计算边界</text><text x="32" y="82" class="s">数量只允许1到99；本例以整数分计算，失败不伪装成零金额。</text><path class="edge" d="M336 190H408"/><path class="edge" d="M712 190H784"/><path class="edge" d="M936 250V344"/><path class="edge" d="M784 404H712"/><path class="edge" d="M408 404H336"/><g data-node="外部文本"><rect x="32" y="130" width="304" height="120" rx="6" class="node"/><text x="50" y="162" class="n">外部文本</text><text x="50" y="194" class="s">数量字符串、单价分</text><text x="50" y="220" class="s">例如2件、每件1990分</text></g><g data-node="解析与范围校验"><rect x="408" y="130" width="304" height="120" rx="6" class="focus"/><text x="426" y="162" class="n">解析与范围校验</text><text x="426" y="194" class="s">文本转整数，数量1..99</text><text x="426" y="220" class="s">空串、负数、文字拒绝</text></g><g data-node="受控整数计算"><rect x="784" y="130" width="304" height="120" rx="6" class="node"/><text x="802" y="162" class="n">受控整数计算</text><text x="802" y="194" class="s">checked_mul检测溢出</text><text x="802" y="220" class="s">不依赖构建溢出行为</text></g><g data-node="Result结果"><rect x="784" y="344" width="304" height="120" rx="6" class="node"/><text x="802" y="376" class="n">Result结果</text><text x="802" y="408" class="s">Ok金额或明确错误</text><text x="802" y="434" class="s">正常结果3980分</text></g><g data-node="调用边界"><rect x="408" y="344" width="304" height="120" rx="6" class="info"/><text x="426" y="376" class="n">调用边界</text><text x="426" y="408" class="s">成功输出，失败报告原因</text><text x="426" y="434" class="s">传播不等于重试或补偿</text></g><g data-node="后续扩展"><rect x="32" y="344" width="304" height="120" rx="6" class="node"/><text x="50" y="376" class="n">后续扩展</text><text x="50" y="408" class="s">税率、币种与舍入另建模</text><text x="50" y="434" class="s">逐行处理不自动形成事务</text></g><text x="32" y="544" class="s">Option表达缺失；Result表达需要解释原因的失败。</text></svg>
