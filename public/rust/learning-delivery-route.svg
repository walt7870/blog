<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="580" viewBox="0 0 1120 580" role="img" aria-labelledby="learning-delivery-route-t learning-delivery-route-d"><title id="learning-delivery-route-t">以可独立交付的能力推进Rust学习</title><desc id="learning-delivery-route-d">每阶段完成一个可观察结果，再决定是否引入更复杂机制。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#607568"/></marker><style>text{font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;letter-spacing:0;fill:#253c30}.h{font-size:28px;font-weight:600}.n{font-size:21px;font-weight:600}.s{font-size:18px;fill:#52685b}.node{fill:white;stroke:#a6b9ad;stroke-width:1.5}.focus{fill:#e9f4ee;stroke:#397657;stroke-width:1.5}.info{fill:#edf3fb;stroke:#739bbf;stroke-width:1.5}.edge{fill:none;stroke:#607568;stroke-width:2;marker-end:url(#a)}</style></defs><rect width="1120" height="580" fill="white"/><text x="32" y="44" class="h">以可独立交付的能力推进Rust学习</text><text x="32" y="82" class="s">每阶段完成一个可观察结果，再决定是否引入更复杂机制。</text><path class="edge" d="M336 190H408"/><path class="edge" d="M712 190H784"/><path class="edge" d="M936 250V344"/><path class="edge" d="M784 404H712"/><path class="edge" d="M408 404H336"/><g data-node="语法与结果"><rect x="32" y="130" width="304" height="120" rx="6" class="node"/><text x="50" y="162" class="n">语法与结果</text><text x="50" y="194" class="s">数量转换与金额计算</text><text x="50" y="220" class="s">解释非法输入与溢出</text></g><g data-node="资源与接口"><rect x="408" y="130" width="304" height="120" rx="6" class="focus"/><text x="426" y="162" class="n">资源与接口</text><text x="426" y="194" class="s">借用、修改、移交数据</text><text x="426" y="220" class="s">复现并修正编译反例</text></g><g data-node="领域模型"><rect x="784" y="130" width="304" height="120" rx="6" class="node"/><text x="802" y="162" class="n">领域模型</text><text x="802" y="194" class="s">私有构造、状态与错误</text><text x="802" y="220" class="s">库外无法绕过校验</text></g><g data-node="CLI交付"><rect x="784" y="344" width="304" height="120" rx="6" class="node"/><text x="802" y="376" class="n">CLI交付</text><text x="802" y="408" class="s">参数、输出、退出码</text><text x="802" y="434" class="s">单元与真实进程测试</text></g><g data-node="服务与任务"><rect x="408" y="344" width="304" height="120" rx="6" class="info"/><text x="426" y="376" class="n">服务与任务</text><text x="426" y="408" class="s">HTTP、有界队列、关闭</text><text x="426" y="434" class="s">区分接受、完成和取消</text></g><g data-node="选择目标环境"><rect x="32" y="344" width="304" height="120" rx="6" class="node"/><text x="50" y="376" class="n">选择目标环境</text><text x="50" y="408" class="s">服务、WASM、FFI或MCU</text><text x="50" y="434" class="s">按实际约束验证收益</text></g><text x="32" y="544" class="s">克隆、Trait和异步由具体需要引入，不是必须同时掌握的清单。</text></svg>
