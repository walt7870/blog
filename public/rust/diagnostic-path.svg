<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="580" viewBox="0 0 1120 580" role="img" aria-labelledby="diagnostic-path-t diagnostic-path-d"><title id="diagnostic-path-t">按失败阶段收集Rust排错证据</title><desc id="diagnostic-path-d">先复现第一条相关诊断，再改变与原因对应的代码或环境。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#607568"/></marker><style>text{font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;letter-spacing:0;fill:#253c30}.h{font-size:28px;font-weight:600}.n{font-size:21px;font-weight:600}.s{font-size:18px;fill:#52685b}.node{fill:white;stroke:#a6b9ad;stroke-width:1.5}.focus{fill:#e9f4ee;stroke:#397657;stroke-width:1.5}.info{fill:#edf3fb;stroke:#739bbf;stroke-width:1.5}.edge{fill:none;stroke:#607568;stroke-width:2;marker-end:url(#a)}</style></defs><rect width="1120" height="580" fill="white"/><text x="32" y="44" class="h">按失败阶段收集Rust排错证据</text><text x="32" y="82" class="s">先复现第一条相关诊断，再改变与原因对应的代码或环境。</text><path class="edge" d="M336 190H408"/><path class="edge" d="M712 190H784"/><path class="edge" d="M336 404H408"/><path class="edge" d="M712 404H784"/><g data-node="依赖与下载失败"><rect x="32" y="130" width="304" height="120" rx="6" class="node"/><text x="50" y="162" class="n">依赖与下载失败</text><text x="50" y="194" class="s">版本、feature、TLS或MSRV</text><text x="50" y="220" class="s">保留命令与锁文件</text></g><g data-node="解析证据"><rect x="408" y="130" width="304" height="120" rx="6" class="focus"/><text x="426" y="162" class="n">解析证据</text><text x="426" y="194" class="s">cargo tree / metadata</text><text x="426" y="220" class="s">不直接删除锁文件</text></g><g data-node="定向修复与回归"><rect x="784" y="130" width="304" height="120" rx="6" class="node"/><text x="802" y="162" class="n">定向修复与回归</text><text x="802" y="194" class="s">审查解析变化和支持矩阵</text><text x="802" y="220" class="s">重跑原失败命令</text></g><g data-node="编译或运行失败"><rect x="32" y="344" width="304" height="120" rx="6" class="node"/><text x="50" y="376" class="n">编译或运行失败</text><text x="50" y="408" class="s">移动、借用、类型或panic</text><text x="50" y="434" class="s">记录位置与触发输入</text></g><g data-node="最小复现"><rect x="408" y="344" width="304" height="120" rx="6" class="info"/><text x="426" y="376" class="n">最小复现</text><text x="426" y="408" class="s">check、错误解释和栈</text><text x="426" y="434" class="s">先证明具体失败原因</text></g><g data-node="修复及行为测试"><rect x="784" y="344" width="304" height="120" rx="6" class="node"/><text x="802" y="376" class="n">修复及行为测试</text><text x="802" y="408" class="s">资源归属、返回或错误传播</text><text x="802" y="434" class="s">故意变异验证断言有效</text></g><text x="32" y="544" class="s">图中两行分别表示依赖与代码路径；缓存清理不能修复类型或ABI合同。</text></svg>
