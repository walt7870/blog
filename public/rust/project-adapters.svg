<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="580" viewBox="0 0 1120 580" role="img" aria-labelledby="project-adapters-t project-adapters-d"><title id="project-adapters-t">核心规则与不同协议入口的关系</title><desc id="project-adapters-d">报价为纯计算；创建订单的持久化与幂等需要新增合同。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#607568"/></marker><style>text{font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;letter-spacing:0;fill:#253c30}.h{font-size:28px;font-weight:600}.n{font-size:21px;font-weight:600}.s{font-size:18px;fill:#52685b}.node{fill:white;stroke:#a6b9ad;stroke-width:1.5}.focus{fill:#e9f4ee;stroke:#397657;stroke-width:1.5}.info{fill:#edf3fb;stroke:#739bbf;stroke-width:1.5}.edge{fill:none;stroke:#607568;stroke-width:2;marker-end:url(#a)}</style></defs><rect width="1120" height="580" fill="white"/><text x="32" y="44" class="h">核心规则与不同协议入口的关系</text><text x="32" y="82" class="s">报价为纯计算；创建订单的持久化与幂等需要新增合同。</text><path class="edge" d="M336 190H408"/><path class="edge" d="M336 404H384V218H408"/><path class="edge" d="M712 190H784"/><path class="edge" d="M936 250V344"/><g data-node="CLI入口"><rect x="32" y="130" width="304" height="120" rx="6" class="node"/><text x="50" y="162" class="n">CLI入口</text><text x="50" y="194" class="s">参数解析与退出码</text><text x="50" y="220" class="s">stdout和stderr合同</text></g><g data-node="HTTP入口"><rect x="32" y="344" width="304" height="120" rx="6" class="node"/><text x="50" y="376" class="n">HTTP入口</text><text x="50" y="408" class="s">Query解析与状态码</text><text x="50" y="434" class="s">本机Axum报价服务</text></g><g data-node="共享领域核心"><rect x="408" y="130" width="304" height="120" rx="6" class="focus"/><text x="426" y="162" class="n">共享领域核心</text><text x="426" y="194" class="s">Quantity校验、整数金额</text><text x="426" y="220" class="s">不依赖打印或Web框架</text></g><g data-node="规则与协议验收"><rect x="784" y="130" width="304" height="120" rx="6" class="info"/><text x="802" y="162" class="n">规则与协议验收</text><text x="802" y="194" class="s">非法值、正常值与溢出</text><text x="802" y="220" class="s">实际进程和HTTP请求</text></g><g data-node="目标环境发布"><rect x="784" y="344" width="304" height="120" rx="6" class="node"/><text x="802" y="376" class="n">目标环境发布</text><text x="802" y="408" class="s">同一产物、监听与配置</text><text x="802" y="434" class="s">关闭、观测和恢复策略</text></g><text x="32" y="544" class="s">添加存储、鉴权或任务队列时，不能把此纯计算示例当作生产订单系统。</text></svg>
