<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="590" viewBox="0 0 1160 590" role="img" aria-labelledby="title desc">
  <title id="title">MySQL复制的提交、接收与应用进度</title>
  <desc id="desc">主库提交订单事务到本地存储和binlog。副本接收线程把日志写入relay log，再由应用线程执行到副本数据。异步提交不等副本；半同步确认日志接收不代表已应用，GTID等待检查目标集合执行完成。</desc>
  <defs>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#74818a"/></marker>
    <style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#27343b;font-size:17px}.title{font-size:23px;font-weight:700}.head{font-size:19px;font-weight:600}.small{font-size:16px;fill:#52616a}.box{fill:#fff;stroke:#bac4c9;stroke-width:1.3;rx:6}.focus{fill:#e4f3ee;stroke:#3b8573;stroke-width:1.5;rx:6}.line{fill:none;stroke:#74818a;stroke-width:1.5;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1160" height="590" fill="#f7f9fa"/>
  <text x="36" y="44" class="title">订单已提交，不代表副本已经能读到</text>
  <text x="36" y="78" class="small">异步复制的三个进度：主库提交 → 副本收到日志 → 副本执行完成。</text>
  <rect x="380" y="116" width="744" height="300" rx="8" fill="none" stroke="#bac4c9" stroke-dasharray="6 5"/>
  <text x="400" y="148" class="small">同一个副本内，接收与应用仍可有不同进度</text>
  <path d="M304 248H416" class="line"/><path d="M704 248H816" class="line"/>
  <rect x="36" y="186" width="268" height="124" class="focus"/>
  <text x="56" y="220" class="head">主库提交订单 1001</text><text x="56" y="256">本地数据与 binlog</text><text x="56" y="290" class="small">异步提交不等待副本</text>
  <rect x="416" y="186" width="288" height="124" class="box"/>
  <text x="436" y="220" class="head">接收线程保存日志</text><text x="436" y="256">1001 已在 relay log</text><text x="436" y="290" class="small">但应用线程可能仍被阻塞</text>
  <rect x="816" y="186" width="276" height="124" class="focus"/>
  <text x="836" y="220" class="head">应用线程执行完成</text><text x="836" y="256">1001 进入副本数据</text><text x="836" y="290" class="small">新快照才能读取相应结果</text>
  <path d="M548 310V352Q548 360 540 360H170Q162 360 162 352V310" fill="none" stroke="#74818a" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
  <rect x="240" y="345" width="230" height="30" fill="#f7f9fa"/>
  <text x="355" y="366" text-anchor="middle" class="small">半同步确认日志已接收刷盘</text>
  <text x="36" y="462" class="head">等待目标 GTID，检查的是执行进度</text>
  <text x="36" y="500">WAIT_FOR_EXECUTED_GTID_SET：0 已执行；1 超时，需要回主库或按约定重试。</text>
  <text x="36" y="537" class="small">半同步仍可能超时降级为异步；等待成功也要在同一副本、合适的新事务中读取。</text>
</svg>
