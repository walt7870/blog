<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="680" viewBox="0 0 1120 680" role="img" aria-labelledby="title desc">
  <title id="title">RR快照读与当前读的双会话时序</title>
  <desc id="desc">A首次普通SELECT建立库存2的快照，B加一提交为3。A普通SELECT仍读2，FOR UPDATE读并锁定当前记录3。锁定读没有更换A已有快照；A没有自行写入时，再次普通读仍为2。</desc>
  <defs>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#74818a"/></marker>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#27343b;font-size:16px}
      .title{font-size:22px;font-weight:700}.head{font-size:18px;font-weight:600}.small{fill:#52616a}
      .box{fill:#fff;stroke:#bac4c9;stroke-width:1.3;rx:6}.line{fill:none;stroke:#74818a;stroke-width:1.5;marker-end:url(#arrow)}
      .return{stroke-dasharray:5 4}.life{stroke:#bac4c9;stroke-dasharray:4 5}
    </style>
  </defs>
  <rect width="1120" height="680" fill="#f7f9fa"/>
  <text x="36" y="44" class="title">同一事务中，普通一致性读与锁定读可以看到不同版本</text>
  <text x="36" y="78" class="small">时间由上向下；初始库存为 2，A 使用 REPEATABLE READ，两个连接按顺序交错执行。</text>
  <path d="M151 166V558M560 166V558M969 166V558" class="life"/>
  <rect x="556" y="200" width="8" height="52" fill="#e5e9eb"/>
  <rect x="556" y="290" width="8" height="52" fill="#e5e9eb"/>
  <rect x="556" y="380" width="8" height="52" fill="#e5e9eb"/>
  <rect x="556" y="470" width="8" height="52" fill="#e5e9eb"/>
  <path d="M151 210H556" class="line"/><path d="M969 300H564" class="line"/>
  <path d="M151 390H556" class="line"/><path d="M151 480H556" class="line"/>
  <path d="M556 250H151" class="line return"/><path d="M564 340H969" class="line return"/>
  <path d="M556 430H151" class="line return"/><path d="M556 520H151" class="line return"/>
  <rect x="36" y="110" width="230" height="56" class="box"/><text x="70" y="145" class="head">连接 A · 显式事务</text>
  <rect x="443" y="110" width="234" height="56" class="box"/><text x="472" y="145" class="head">InnoDB · SKU 101</text>
  <rect x="854" y="110" width="230" height="56" class="box"/><text x="888" y="145" class="head">连接 B · 独立事务</text>
  <rect x="205" y="177" width="302" height="24" fill="#f7f9fa"/><text x="219" y="194">开始事务；首次普通 SELECT</text>
  <rect x="205" y="217" width="302" height="24" fill="#f7f9fa"/><text x="219" y="234">返回 2，建立并保留快照</text>
  <rect x="621" y="267" width="302" height="24" fill="#f7f9fa"/><text x="635" y="284">库存加 1；COMMIT</text>
  <rect x="621" y="307" width="302" height="24" fill="#f7f9fa"/><text x="635" y="324">提交完成，当前记录变为 3</text>
  <rect x="205" y="357" width="302" height="24" fill="#f7f9fa"/><text x="219" y="374">再次普通 SELECT</text>
  <rect x="205" y="397" width="302" height="24" fill="#f7f9fa"/><text x="219" y="414">仍返回 2，使用原快照</text>
  <rect x="205" y="447" width="302" height="24" fill="#f7f9fa"/><text x="219" y="464">SELECT ... FOR UPDATE</text>
  <rect x="205" y="487" width="302" height="24" fill="#f7f9fa"/><text x="219" y="504">返回 3，并持有记录排他锁</text>
  <text x="36" y="594" class="small">A 未自行修改该行：随后普通 SELECT 仍返回 2，最后 ROLLBACK 释放锁并结束事务。</text>
  <text x="36" y="628" class="small">普通 RC/RR 快照读通常不被这类行排他锁阻塞；元数据锁等其他等待要另行排查。</text>
  <text x="36" y="660" class="small">条件扣减使用当前记录判断 available ≥ quantity，不能把旧快照值直接当作写入保证。</text>
</svg>
