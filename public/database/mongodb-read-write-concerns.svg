<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="648" viewBox="0 0 1200 648" role="img" aria-labelledby="mongo-concern-title mongo-concern-desc">
  <title id="mongo-concern-title">MongoDB读写位置与确认条件</title>
  <desc id="mongo-concern-desc">写请求发向主节点，由writeConcern决定等待何种确认，数据经复制到副本。readPreference为读请求选择主节点或副本，readConcern决定可见性。副本可能滞后，majority读不等于任意会话的最新业务写入；需要写后读保证时还要明确会话和因果顺序条件。</desc>
  <defs>
    <marker id="mongo-concern-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#74818a"/></marker>
    <style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#27343b;font-size:18px}.title{font-size:24px;font-weight:700}.head{font-size:20px;font-weight:600}.small{font-size:16px;fill:#52616a}.box{fill:#fff;stroke:#bac4c9;stroke-width:1.3;rx:6}.focus{fill:#e4f3ee;stroke:#3b8573;stroke-width:1.5;rx:6}.line{fill:none;stroke:#74818a;stroke-width:1.5;marker-end:url(#mongo-concern-arrow)}</style>
  </defs>
  <rect width="1200" height="648" fill="#f7f9fa"/>
  <text x="36" y="44" class="title">写入等到哪里、读取发给谁、能看见什么，要分别选择</text>
  <text x="36" y="78" class="small">简化为一个主节点和一个副本；生产多数确认还取决于完整投票与数据节点拓扑。</text>
  <path d="M296 224H464" class="line"/><path d="M736 224H904" class="line"/>
  <path d="M296 460H464" class="line"/>
  <path d="M596 400V292" class="line"/>
  <path d="M736 460H1028Q1036 460 1036 452V292" class="line"/>
  <rect x="312" y="176" width="136" height="32" fill="#f7f9fa"/><text x="380" y="199" text-anchor="middle" class="small">writeConcern</text>
  <rect x="776" y="176" width="88" height="32" fill="#f7f9fa"/><text x="820" y="199" text-anchor="middle" class="small">复制</text>
  <rect x="312" y="412" width="136" height="32" fill="#f7f9fa"/><text x="380" y="435" text-anchor="middle" class="small">readConcern</text>
  <rect x="612" y="328" width="96" height="28" fill="#f7f9fa"/><text x="660" y="349" text-anchor="middle" class="small">primary</text>
  <rect x="1048" y="328" width="124" height="28" fill="#f7f9fa"/><text x="1110" y="349" text-anchor="middle" class="small">secondary</text>
  <rect x="36" y="156" width="260" height="136" class="box"/>
  <text x="56" y="196" class="head">应用写请求</text><text x="56" y="236">主节点处理修改</text><text x="56" y="272" class="small">确认超时不等于未写入</text>
  <rect x="464" y="156" width="272" height="136" class="focus"/>
  <text x="484" y="196" class="head">Primary</text><text x="484" y="236">处理写入与主节点读取</text><text x="484" y="272" class="small">readConcern 约束可见性</text>
  <rect x="904" y="156" width="260" height="136" class="box"/>
  <text x="924" y="196" class="head">Secondary</text><text x="924" y="236">复制应用可能落后</text><text x="924" y="272" class="small">readConcern 约束可见性</text>
  <rect x="36" y="400" width="260" height="120" class="box"/>
  <text x="56" y="440" class="head">应用读请求</text><text x="56" y="480">先定义写后读与旧值要求</text>
  <rect x="464" y="400" width="272" height="120" class="focus"/>
  <text x="484" y="440" class="head">readPreference</text><text x="484" y="480">选择读取位置与回退规则</text>
  <text x="36" y="576">majority 读取不自动等于最新业务写入；因果保证还需会话、关注级别与顺序条件配合。</text>
  <text x="36" y="616" class="small">仲裁者不保存数据。单节点副本集只能练习事务，不证明多节点故障容忍或自动切换已通过。</text>
</svg>
