<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="640" viewBox="0 0 1120 640" role="img" aria-labelledby="title desc">
  <title id="title">用户与订单的字段合同</title>
  <desc id="desc">field_demo.users的活跃用户名由生成列和唯一键限制，orders.user_id以外键引用users.id，删除用户受RESTRICT限制。订单金额为非负DECIMAL，支付时间允许空，JSON属性另有生成列索引。订单省略三个时间与版本列，完整定义在正文。</desc>
  <defs>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#74818a"/></marker>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#27343b;font-size:16px}
      .title{font-size:22px;font-weight:700}.head{font-size:18px;font-weight:600}.type{fill:#52616a;font-size:14px}.small{fill:#52616a}
      .box{fill:#fff;stroke:#bac4c9;stroke-width:1.3;rx:6}.rule{fill:none;stroke:#bac4c9}.line{fill:none;stroke:#74818a;stroke-width:1.5;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1120" height="640" fill="#f7f9fa"/>
  <text x="36" y="44" class="title">字段保证值的边界，外键保证引用存在</text>
  <text x="36" y="78" class="small">PK：主键；UQ：唯一键；FK：外键。未标 NULL 的普通输入列在示例中均为 NOT NULL。</text>
  <path d="M684 260H564Q556 260 556 252V204Q556 196 548 196H436" class="line"/>
  <rect x="36" y="124" width="400" height="300" class="box"/>
  <rect x="684" y="124" width="400" height="370" class="box"/>
  <path d="M36 168H436M36 212H436M36 244H436M36 276H436M36 308H436M36 340H436M36 372H436M684 168H1084M684 212H1084M684 244H1084M684 276H1084M684 308H1084M684 340H1084M684 372H1084M684 404H1084M684 436H1084" class="rule"/>
  <text x="56" y="153" class="head">field_demo.users</text>
  <text x="56" y="201">id · PK</text><text x="416" y="201" class="type" text-anchor="end">BIGINT UNSIGNED</text>
  <text x="56" y="233">username</text><text x="416" y="233" class="type" text-anchor="end">VARCHAR(50)</text>
  <text x="56" y="265">is_active</text><text x="416" y="265" class="type" text-anchor="end">BOOLEAN + CHECK</text>
  <text x="56" y="297">active_username · UQ</text><text x="416" y="297" class="type" text-anchor="end">VARCHAR(50)</text>
  <text x="56" y="329">phone · NULL</text><text x="416" y="329" class="type" text-anchor="end">VARCHAR(20)</text>
  <text x="56" y="361">birth_date · NULL</text><text x="416" y="361" class="type" text-anchor="end">DATE</text>
  <text x="56" y="398" class="type">活跃时生成 username，非活跃时生成 NULL</text>
  <text x="458" y="297" class="type">ON DELETE RESTRICT</text>
  <text x="458" y="325" class="type">有订单时拒绝删除用户</text>
  <text x="704" y="153" class="head">field_demo.orders</text>
  <text x="704" y="201">id · PK</text><text x="1064" y="201" class="type" text-anchor="end">BIGINT UNSIGNED</text>
  <text x="704" y="233">order_no · UQ</text><text x="1064" y="233" class="type" text-anchor="end">VARCHAR(32) ASCII</text>
  <text x="704" y="265">user_id · FK</text><text x="1064" y="265" class="type" text-anchor="end">BIGINT UNSIGNED</text>
  <text x="704" y="297">currency</text><text x="1064" y="297" class="type" text-anchor="end">CHAR(3) + CHECK</text>
  <text x="704" y="329">amount</text><text x="1064" y="329" class="type" text-anchor="end">DECIMAL(12,2) ≥ 0</text>
  <text x="704" y="361">paid_at · NULL</text><text x="1064" y="361" class="type" text-anchor="end">DATETIME(6)</text>
  <text x="704" y="393">metadata</text><text x="1064" y="393" class="type" text-anchor="end">JSON 对象</text>
  <text x="704" y="425">channel · 生成列</text><text x="1064" y="425" class="type" text-anchor="end">VARCHAR(20) + 索引</text>
  <text x="704" y="471" class="type">另有 created_at、updated_at、version 三列</text>
  <text x="36" y="546" class="small">39.90 CNY 是订单快照；未付款时 paid_at 为 NULL，不用零日期冒充真实时刻。</text>
  <text x="36" y="582" class="small">CHECK 只表达列值条件，不能替代完整支付状态机、回调幂等或跨行账务对账。</text>
  <text x="36" y="616" class="small">时间列按 UTC 合同写入；客户端传输大整数、金额时，还要保持精度与单位。</text>
</svg>
