<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="570" viewBox="0 0 1120 570" role="img" aria-labelledby="title desc">
  <title id="title">订单联合索引的覆盖读取与回表</title>
  <desc id="desc">联合索引按买家、状态、创建时间和编号排序。固定买家10及paid后，反向扫描返回订单5、3，查询编号和时间可由索引覆盖，查询金额需要凭主键读取聚簇记录。</desc>
  <defs>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#74818a"/></marker>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#27343b;font-size:16px}
      .title{font-size:22px;font-weight:700}.head{font-size:18px;font-weight:600}.small{fill:#52616a}
      .box{fill:#fff;stroke:#bac4c9;stroke-width:1.3;rx:6}.line{fill:none;stroke:#74818a;stroke-width:1.5;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1120" height="570" fill="#f7f9fa"/>
  <text x="36" y="44" class="title">固定联合键前缀，在连续范围内反向取最近两笔</text>
  <text x="36" y="78" class="small">buyer_id = 10 AND status = 'paid'；ORDER BY created_at DESC, id DESC LIMIT 2</text>
  <text x="36" y="126" class="head">二级索引叶子记录（示意）</text>
  <rect x="36" y="148" width="570" height="280" class="box"/>
  <rect x="37" y="192" width="568" height="141" fill="#eaf5ef"/>
  <path d="M36 192H606M36 239H606M36 286H606M36 333H606M36 380H606" fill="none" stroke="#bac4c9"/>
  <text x="56" y="178">buyer_id</text><text x="176" y="178">status</text><text x="292" y="178">created_at</text><text x="492" y="178">id</text>
  <text x="56" y="224">10</text><text x="176" y="224">paid</text><text x="292" y="224">10:01</text><text x="492" y="224">1</text>
  <text x="56" y="271">10</text><text x="176" y="271">paid</text><text x="292" y="271">10:03</text><text x="492" y="271">3</text>
  <text x="56" y="318">10</text><text x="176" y="318">paid</text><text x="292" y="318">10:05</text><text x="492" y="318">5</text>
  <text x="56" y="365">10</text><text x="176" y="365">unpaid</text><text x="292" y="365">10:02</text><text x="492" y="365">2</text>
  <text x="56" y="412">20</text><text x="176" y="412">paid</text><text x="292" y="412">10:04</text><text x="492" y="412">4</text>
  <path class="line" d="M558 314V252"/>
  <path class="line" d="M606 220H650Q658 220 658 212V192Q658 184 666 184H716"/>
  <path class="line" d="M606 310H716"/>
  <rect x="716" y="140" width="368" height="88" class="box"/><text x="736" y="174" class="head">只取 id、created_at</text><text x="736" y="208" class="small">覆盖访问：返回 5、3 与对应时间</text>
  <rect x="716" y="266" width="368" height="92" class="box"/><text x="736" y="300" class="head">还需要 amount</text><text x="736" y="334" class="small">按主键 5、3 回表：取 60.00、40.00</text>
  <text x="36" y="478" class="small">所有时间均在 2026-01-01；相同时间再按 id 排序，保证同次查询的确定顺序。</text>
  <text x="36" y="514" class="small">图中仅画逻辑键序；实际页不要求物理连续，计划与可见性判断仍由优化器、执行器和引擎处理。</text>
  <text x="36" y="546" class="small">绿色区域是前缀匹配范围，不是独立的部分索引；普通索引仍保存其他记录。</text>
</svg>
