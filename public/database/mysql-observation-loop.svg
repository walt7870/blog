<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="630" viewBox="0 0 1160 630" role="img" aria-labelledby="title desc">
  <title id="title">MySQL业务症状与数据库观测闭环</title>
  <desc id="desc">订单请求的错误率、延迟与连接池等待，以及MySQL的语句、锁、复制和主机资源观测，分别汇入监控。告警按业务影响和采集链路故障判断，再通过同时间窗口定位根因、调整并验证业务与数据库副作用。</desc>
  <defs>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#74818a"/></marker>
    <style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#27343b;font-size:17px}.title{font-size:23px;font-weight:700}.head{font-size:19px;font-weight:600}.small{font-size:16px;fill:#52616a}.box{fill:#fff;stroke:#bac4c9;stroke-width:1.3;rx:6}.focus{fill:#e4f3ee;stroke:#3b8573;stroke-width:1.5;rx:6}.line{fill:none;stroke:#74818a;stroke-width:1.5;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1160" height="630" fill="#f7f9fa"/>
  <text x="36" y="44" class="title">先看到订单受影响，再沿等待位置查证据</text>
  <text x="36" y="78" class="small">相同实例、角色与时间窗口关联；数据库平均耗时不能代替用户的 P99。</text>
  <path d="M336 184H416Q424 184 424 192V218Q424 226 432 226H476" class="line"/>
  <path d="M336 354H416Q424 354 424 346V300Q424 292 432 292H476" class="line"/>
  <path d="M752 258H832" class="line"/>
  <path d="M978 328V454Q978 462 970 462H752" class="line"/>
  <path d="M476 462H336" class="line"/>
  <rect x="36" y="124" width="300" height="120" class="focus"/>
  <text x="56" y="160" class="head">订单请求与应用连接池</text><text x="56" y="196">错误率、P95/P99、池等待</text><text x="56" y="230" class="small">业务是否受影响，等待在哪里</text>
  <rect x="36" y="294" width="300" height="120" class="box"/>
  <text x="56" y="330" class="head">MySQL 与主机观测</text><text x="56" y="366">语句、事务锁、复制、I/O</text><text x="56" y="400" class="small">连接到实例角色与采样时刻</text>
  <rect x="476" y="190" width="276" height="138" class="box"/>
  <text x="496" y="226" class="head">采集与时间序列</text><text x="496" y="262">exporter / Prometheus</text><text x="496" y="294" class="small">累计量取增量，缺失单独告警</text>
  <rect x="832" y="190" width="292" height="138" class="box"/>
  <text x="852" y="226" class="head">区分两类异常</text><text x="852" y="262">业务变慢：关联证据</text><text x="852" y="294">采集失败：先修观测链路</text>
  <rect x="476" y="410" width="276" height="104" class="focus"/>
  <text x="496" y="446" class="head">定位后再调整</text><text x="496" y="480">阻塞连接 / SQL / 资源瓶颈</text>
  <rect x="36" y="434" width="300" height="104" class="box"/>
  <text x="56" y="470" class="head">验证业务与副作用</text><text x="56" y="504">延迟、错误率、复制与空间</text>
  <text x="36" y="590" class="small">先关联事实，再执行受控动作；不自动杀全部 Sleep、不盲跳复制事务、不例行重建全库。</text>
</svg>
