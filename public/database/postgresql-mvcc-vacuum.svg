<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="760" viewBox="0 0 1240 760" role="img" aria-labelledby="pg-mvcc-title pg-mvcc-desc">
  <title id="pg-mvcc-title">旧快照、提交与VACUUM的时间关系</title>
  <desc id="pg-mvcc-desc">时间向下。会话A在可重复读事务首次查询订单101得到50；B更新为55并提交。A仍读取50，B此时VACUUM不能回收A需要的旧版本。A提交后新查询得到55；在没有其他保留因素时，后续VACUUM才可回收旧版本。</desc>
  <defs>
    <marker id="pg-mvcc-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#74818a"/></marker>
    <style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#27343b;font-size:17px}.title{font-size:24px;font-weight:700}.head{font-size:20px;font-weight:600}.small{font-size:16px;fill:#52616a}.box{fill:#fff;stroke:#bac4c9;stroke-width:1.3;rx:6}.line{fill:none;stroke:#74818a;stroke-width:1.5;marker-end:url(#pg-mvcc-arrow)}.return{stroke-dasharray:5,4}.life{stroke:#bac4c9;stroke-width:1.2;stroke-dasharray:4,4}.label{fill:#f7f9fa}</style>
  </defs>
  <rect width="1240" height="760" fill="#f7f9fa"/>
  <text x="36" y="44" class="title">B 已提交，为什么 A 还读到旧金额？</text>
  <text x="36" y="78" class="small">同一订单 101；A 使用 REPEATABLE READ，B 的 UPDATE 自动提交。时间从上向下。</text>
  <path d="M184 156V648M620 156V648M1056 156V648" class="life"/>
  <rect x="612" y="180" width="16" height="452" fill="#e4f3ee" stroke="#3b8573"/>
  <path d="M184 208H612" class="line"/><path d="M612 248H184" class="line return"/>
  <path d="M1056 304H628" class="line"/>
  <path d="M184 360H612" class="line"/><path d="M612 400H184" class="line return"/>
  <path d="M1056 456H628" class="line"/>
  <path d="M184 512H612" class="line"/>
  <path d="M184 568H612" class="line"/><path d="M612 608H184" class="line return"/>
  <path d="M1056 632H628" class="line"/>
  <rect x="244" y="168" width="312" height="28" class="label"/><text x="400" y="189" text-anchor="middle">开始事务，首次查询</text>
  <rect x="324" y="212" width="152" height="24" class="label"/><text x="400" y="230" text-anchor="middle">50.00</text>
  <rect x="716" y="264" width="252" height="28" class="label"/><text x="842" y="285" text-anchor="middle">更新为 55，并提交</text>
  <rect x="272" y="320" width="256" height="28" class="label"/><text x="400" y="341" text-anchor="middle">同一事务再次查询</text>
  <rect x="272" y="364" width="256" height="24" class="label"/><text x="400" y="382" text-anchor="middle">仍为 50.00</text>
  <rect x="688" y="416" width="308" height="28" class="label"/><text x="842" y="437" text-anchor="middle">VACUUM：A 仍需旧版本</text>
  <rect x="272" y="472" width="256" height="28" class="label"/><text x="400" y="493" text-anchor="middle">COMMIT，释放快照</text>
  <rect x="272" y="528" width="256" height="28" class="label"/><text x="400" y="549" text-anchor="middle">新事务查询</text>
  <rect x="324" y="572" width="152" height="24" class="label"/><text x="400" y="590" text-anchor="middle">55.00</text>
  <rect x="688" y="592" width="308" height="28" class="label"/><text x="842" y="613" text-anchor="middle">后续 VACUUM 可回收旧版本</text>
  <rect x="48" y="108" width="272" height="48" class="box"/><text x="184" y="139" text-anchor="middle" class="head">会话 A：旧快照读者</text>
  <rect x="484" y="108" width="272" height="48" class="box"/><text x="620" y="139" text-anchor="middle" class="head">数据库与行版本</text>
  <rect x="920" y="108" width="272" height="48" class="box"/><text x="1056" y="139" text-anchor="middle" class="head">会话 B：更新与维护</text>
  <text x="36" y="696">前提：没有其他旧快照、复制反馈等保留因素。A 提交不是让 VACUUM 立即自动完成。</text>
  <text x="36" y="732" class="small">回收为可重用空间，不等于表文件立即缩小；普通查询快照也不等于持有阻止 B 更新的行锁。</text>
</svg>
