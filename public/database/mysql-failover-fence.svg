<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="610" viewBox="0 0 1160 610" role="img" aria-labelledby="title desc">
  <title id="title">MySQL主库切换的写入隔离边界</title>
  <desc id="desc">故障后先冻结写入口并隔离旧主，再核对候选GTID历史、应用积压和业务数据。隔离及数据未确认时保持冻结；确认后仅提升一个候选，更新路由和连接池，再恢复流量。旧主保持隔离并按恢复节点重新接入。</desc>
  <defs>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#74818a"/></marker>
    <style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#27343b;font-size:17px}.title{font-size:23px;font-weight:700}.head{font-size:19px;font-weight:600}.small{font-size:16px;fill:#52616a}.box{fill:#fff;stroke:#bac4c9;stroke-width:1.3;rx:6}.focus{fill:#e4f3ee;stroke:#3b8573;stroke-width:1.5;rx:6}.line{fill:none;stroke:#74818a;stroke-width:1.5;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1160" height="610" fill="#f7f9fa"/>
  <text x="36" y="44" class="title">先关闭旧的写入可能，再开放新的写入口</text>
  <text x="36" y="78" class="small">故障检测不等于旧主已停机；DNS 更新也不会自动断开旧连接。</text>
  <path d="M324 178H408" class="line"/><path d="M744 178H832" class="line"/>
  <rect x="36" y="120" width="288" height="116" class="focus"/>
  <text x="56" y="154" class="head">冻结入口，隔离旧主</text><text x="56" y="190">覆盖直连、后台任务和重试</text><text x="56" y="222" class="small">确认网络或实例隔离生效</text>
  <rect x="408" y="120" width="336" height="116" class="box"/>
  <text x="428" y="154" class="head">核对候选历史与业务数据</text><text x="428" y="190">GTID 集合、积压、应用错误</text><text x="428" y="222" class="small">分叉或数据缺口先调查与决策</text>
  <path d="M966 116L1100 178L966 240L832 178Z" fill="#fff" stroke="#74818a" stroke-width="1.4"/>
  <text x="966" y="173" text-anchor="middle" class="head">隔离与数据</text><text x="966" y="199" text-anchor="middle">均已确认？</text>
  <path d="M966 240V350" class="line"/>
  <rect x="978" y="274" width="44" height="26" fill="#f7f9fa"/><text x="990" y="293" class="small">否</text>
  <rect x="808" y="350" width="316" height="110" class="box"/>
  <text x="828" y="386" class="head">保持冻结，修复证据链</text><text x="828" y="420">不盲目提升或重新引导集群</text><text x="828" y="450" class="small">避免形成两个写入历史</text>
  <path d="M1100 178H1130Q1138 178 1138 186V496Q1138 504 1130 504H576Q568 504 568 496V460" class="line"/>
  <rect x="1108" y="266" width="40" height="26" fill="#f7f9fa"/><text x="1120" y="285" class="small">是</text>
  <path d="M408 406H324" class="line"/>
  <rect x="408" y="350" width="328" height="110" class="focus"/>
  <text x="428" y="386" class="head">仅提升一个候选</text><text x="428" y="420">调整角色、路由与连接池</text><text x="428" y="450" class="small">业务验证后逐步恢复流量</text>
  <rect x="36" y="350" width="288" height="110" class="box"/>
  <text x="56" y="386" class="head">旧主作为恢复节点接入</text><text x="56" y="420">隔离中核对或重新初始化</text><text x="56" y="450" class="small">禁止自动抢回主角色</text>
  <text x="36" y="560" class="small">异步切换可能遗漏尚未传出的成功事务；业务重试复用原幂等键，并查询原订单结果。</text>
</svg>
