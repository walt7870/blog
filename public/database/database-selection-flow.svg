<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="360" viewBox="0 0 1040 360" role="img" aria-labelledby="title desc">
  <title id="title">数据库选型先确认四个业务合同</title>
  <desc id="desc">依次确认事实责任、访问模式、事务边界和恢复目标，以订单、文章、设备采样等场景进入正文选型表。</desc>
  <defs>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#74818a"/></marker>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#27343b;font-size:16px}
      .title{font-size:22px;font-weight:700}.head{font-size:18px;font-weight:600}.small{fill:#52616a}
      .box{fill:#fff;stroke:#bac4c9;stroke-width:1.3;rx:6}.line{fill:none;stroke:#74818a;stroke-width:1.5;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1040" height="360" fill="#f7f9fa"/>
  <text x="36" y="44" class="title">先问数据怎么用，再选数据库</text>
  <text x="36" y="78" class="small">同一业务可以组合多个系统；每项事实需要明确修改责任。</text>
  <path class="line" d="M260 184H292"/><path class="line" d="M508 184H540"/><path class="line" d="M756 184H788"/>
  <rect x="36" y="120" width="224" height="132" class="box"/>
  <text x="56" y="154" class="head">1. 事实责任</text><text x="56" y="190">订单 / 文章 / 设备采样</text><text x="56" y="224" class="small">谁是这一事实的权威源</text>
  <rect x="292" y="120" width="216" height="132" class="box"/>
  <text x="312" y="154" class="head">2. 访问模式</text><text x="312" y="190">按键 / 文本 / 时间 / 路径</text><text x="312" y="224" class="small">高频查询要如何取数</text>
  <rect x="540" y="120" width="216" height="132" class="box"/>
  <text x="560" y="154" class="head">3. 事务边界</text><text x="560" y="190">订单与扣库存一起成功</text><text x="560" y="224" class="small">跨对象操作能否原子完成</text>
  <rect x="788" y="120" width="216" height="132" rx="6" fill="#eaf5ef" stroke="#638d7d" stroke-width="1.3"/>
  <text x="808" y="154" class="head">4. 恢复目标</text><text x="808" y="190">允许丢多少 / 停多久</text><text x="808" y="224" class="small">验证备份、重建和成本</text>
  <text x="36" y="298" class="small">例如：交易约束评估关系库，文档聚合评估 MongoDB，时间窗口评估时序库。</text>
  <text x="36" y="328" class="small">缓存、搜索、图与数据平台按访问需求组合；具体产品与边界见正文表格。</text>
</svg>
