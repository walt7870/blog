<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="es-derived-title es-derived-desc">
  <title id="es-derived-title">Elasticsearch 派生视图与 PIT 分页边界</title>
  <desc id="es-derived-desc">源库提交后通过CDC或outbox消费者以业务ID和递增版本更新搜索索引，重复旧版本不能覆盖新状态。分页从已刷新索引打开PIT，用同一查询和排序加上实际sort数组续页，最后关闭PIT；PIT不锁定源库也不包含以后写入。</desc>
  <defs>
    <marker id="es-derived-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#74818a"/></marker>
    <style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#27343b;font-size:18px}.title{font-size:24px;font-weight:700}.head{font-size:20px;font-weight:600}.small{font-size:16px;fill:#52616a}.box{fill:#fff;stroke:#bac4c9;stroke-width:1.3;rx:6}.focus{fill:#e4f3ee;stroke:#3b8573;stroke-width:1.5;rx:6}.line{fill:none;stroke:#74818a;stroke-width:1.5;marker-end:url(#es-derived-arrow)}</style>
  </defs>
  <rect width="1200" height="720" fill="#f7f9fa"/>
  <text x="36" y="44" class="title">同步保证新旧顺序，PIT 保证一次遍历的搜索视图</text>
  <text x="36" y="78" class="small">业务事实仍在源库；两个边界各自维护版本与进度，不能互相替代。</text>
  <path d="M316 200H432" class="line"/><path d="M768 200H884" class="line"/>
  <path d="M1024 276V332Q1024 340 1016 340H184Q176 340 176 348V412" class="line" stroke-dasharray="5,4"/>
  <path d="M316 484H432" class="line"/><path d="M768 484H884" class="line"/>
  <rect x="448" y="356" width="336" height="32" fill="#f7f9fa"/><text x="616" y="378" text-anchor="middle" class="small">从已刷新视图打开 PIT</text>
  <rect x="36" y="128" width="280" height="148" class="box"/>
  <text x="56" y="168" class="head">源库本地事务</text><text x="56" y="208">订单 102：版本 1 → 2</text><text x="56" y="246" class="small">提交订单及可靠事件记录</text>
  <rect x="432" y="128" width="336" height="148" class="box"/>
  <text x="452" y="168" class="head">CDC / outbox 消费者</text><text x="452" y="208">固定 _id，携带源记录版本</text><text x="452" y="246" class="small">逐项确认、退避、失败隔离与重建</text>
  <rect x="884" y="128" width="280" height="148" class="focus"/>
  <text x="904" y="168" class="head">订单搜索索引</text><text x="904" y="208">external 只接受更大版本</text><text x="904" y="246" class="small">旧版本与同版本重放返回 409</text>
  <rect x="36" y="412" width="280" height="148" class="focus"/>
  <text x="56" y="452" class="head">打开 PIT，查询首页</text><text x="56" y="492">保存最新 pit_id</text><text x="56" y="530" class="small">查询与 sort 在续页时保持一致</text>
  <rect x="432" y="412" width="336" height="148" class="box"/>
  <text x="452" y="452" class="head">search_after 续页</text><text x="452" y="492">复制末条命中完整 sort 数组</text><text x="452" y="530" class="small">包括 PIT 隐含的 _shard_doc 值</text>
  <rect x="884" y="412" width="280" height="148" class="box"/>
  <text x="904" y="452" class="head">完成或取消：关闭 PIT</text><text x="904" y="492">释放旧段与上下文资源</text><text x="904" y="530" class="small">过期后不能用新 PIT 冒充旧视图</text>
  <path d="M36 608H1164" stroke="#bac4c9"/>
  <text x="36" y="646">PIT 内没有后续新增订单；源库照常更新。对账或导出还要记录业务时间、租户与版本口径。</text>
  <text x="36" y="686" class="small">实线：写入或分页步骤。虚线：从已刷新索引创建一个独立的搜索视图。</text>
</svg>
