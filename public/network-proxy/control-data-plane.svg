<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="620" viewBox="0 0 1120 620" role="img" aria-labelledby="ctrl-title ctrl-desc">
<title id="ctrl-title">配置下发不等于访问成功</title><desc id="ctrl-desc">节点来源生成配置，经客户端解析检查后应用到内核，检查失败保留旧配置。业务应用由内核匹配代理规则后经远端访问目标，控制面和数据面分别验收。</desc>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1L9 5L1 9Z" fill="#527184"/></marker></defs>
<rect width="1120" height="620" fill="#f7f9fb"/>
<g font-family="Arial, 'PingFang SC', sans-serif" fill="#23313d">
<text x="40" y="52" font-size="28" font-weight="700">配置生效与业务可用，分别验收</text><text x="40" y="88" font-size="18" fill="#52616d">下方只展开命中代理的分支；DIRECT 与 REJECT 见数据分流图。</text>
<text x="40" y="140" font-size="20" font-weight="600">控制面：节点与配置变更</text>
<g fill="none" stroke="#527184" stroke-width="2" marker-end="url(#a)"><path d="M242 214H300"/><path d="M510 214H568"/><path d="M778 214H836"/><path d="M944 258V300Q944 308 936 308H414Q406 308 406 316V388" stroke-dasharray="6 5"/>
<path d="M242 432H300"/><path d="M510 432H568"/><path d="M778 432H836"/></g>
<g stroke="#91a6b5" fill="#eaf3fb"><rect x="40" y="170" width="202" height="88" rx="6"/><rect x="300" y="170" width="210" height="88" rx="6"/><rect x="568" y="170" width="210" height="88" rx="6"/><rect x="836" y="170" width="244" height="88" rx="6"/></g>
<g stroke="#91a6b5" fill="#fff"><rect x="40" y="388" width="202" height="88" rx="6"/><rect x="300" y="388" width="210" height="88" rx="6" fill="#e8f5ef"/><rect x="568" y="388" width="210" height="88" rx="6"/><rect x="836" y="388" width="244" height="88" rx="6"/></g>
<g font-size="22" font-weight="600"><text x="62" y="205">节点与策略来源</text><text x="322" y="205">订阅 / 本地文件</text><text x="590" y="205">客户端检查</text><text x="858" y="205">应用到运行内核</text><text x="62" y="423">应用请求</text><text x="322" y="423">内核匹配规则</text><text x="590" y="423">远端代理服务</text><text x="858" y="423">目标 API</text></g>
<g font-size="17" fill="#52616d"><text x="62" y="236">人工维护或平台</text><text x="322" y="236">可能仅含节点列表</text><text x="590" y="236">解析、合并与引用</text><text x="858" y="236">失败保留旧配置</text><text x="62" y="454">真实接入本机端口</text><text x="322" y="454">选择有效出站</text><text x="590" y="454">认证与出口连接</text><text x="858" y="454">验证真实响应</text></g>
<rect x="562" y="292" width="228" height="30" fill="#f7f9fb"/><text x="574" y="314" font-size="18">配置决定后续连接策略</text>
<text x="40" y="358" font-size="20" font-weight="600">数据面：真实连接与业务响应</text>
<g font-size="18" fill="#52616d"><text x="40" y="530">配置能解析：不能证明远端在线；节点测速成功：不能证明业务目标与规则正确。</text><text x="40" y="568">例：节点改名但代理组仍引用旧名，应拒绝该次配置更新，再修复引用后重试。</text></g>
</g></svg>
