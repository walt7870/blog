<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="700" viewBox="0 0 1120 700" role="img" aria-labelledby="cross-border-title cross-border-desc">
  <title id="cross-border-title">上传停顿的证据与实验分支</title>
  <desc id="cross-border-desc">先固定请求与路径，资源或目标有异常则处理对应层；接收不完整时检查传输与网关，完整时检查业务。使用同一探针对照通道再决定是否发布。</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#596b78" stroke-width="1.4"/></marker></defs>
  <rect width="1120" height="700" fill="#f7f9fb"/>
  <g font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" fill="#263541">
    <text x="48" y="57" font-size="27" font-weight="700">上传停顿：先证明在哪一段，再比较通道</text>
    <text x="48" y="91" font-size="17" fill="#536470">固定客户端、请求体、目标与时间；记录实际节点，停止并发配置变更。</text>
    <g stroke="#596b78" stroke-width="2" fill="none" marker-end="url(#arrow)">
      <path d="M280 172H402Q410 172 410 180V206"/><path d="M545 256H720"/>
      <path d="M410 306V358"/><path d="M545 408H720"/>
      <path d="M410 458V512"/><path d="M545 562H720"/>
      <path d="M410 612V654"/>
    </g>
    <rect x="48" y="139" width="232" height="66" rx="20" fill="#edf4fc" stroke="#819bb6"/>
    <text x="68" y="167" font-size="20" font-weight="700">确认请求真实路径</text>
    <text x="68" y="190" font-size="15">本机接入、命中规则、节点</text>
    <path d="M410 206L545 256L410 306L275 256Z" fill="#edf4fc" stroke="#819bb6"/>
    <text x="410" y="251" text-anchor="middle" font-size="18">资源或目标</text>
    <text x="410" y="275" text-anchor="middle" font-size="18">有异常证据？</text>
    <text x="622" y="244" font-size="17">是</text>
    <text x="431" y="338" font-size="17">否 / 尚未发现</text>
    <rect x="720" y="220" width="352" height="72" rx="5" fill="#fff" stroke="#a4b3be"/>
    <text x="740" y="250" font-size="20" font-weight="700">处理对应资源、出口或目标故障</text>
    <text x="740" y="276" font-size="16">保留故障时点证据，再回到相同探针</text>
    <path d="M410 358L545 408L410 458L275 408Z" fill="#e9f5f0" stroke="#7caaa0"/>
    <text x="410" y="403" text-anchor="middle" font-size="18">完整接收的</text>
    <text x="410" y="427" text-anchor="middle" font-size="18">长度与摘要匹配？</text>
    <text x="622" y="396" font-size="17">是</text>
    <text x="431" y="490" font-size="17">否 / 无接收证明</text>
    <rect x="720" y="372" width="352" height="72" rx="5" fill="#fff" stroke="#a4b3be"/>
    <text x="740" y="402" font-size="20" font-weight="700">继续检查目标业务与响应返回</text>
    <text x="740" y="428" font-size="16">上传完成，不代表鉴权与业务成功</text>
    <path d="M410 512L545 562L410 612L275 562Z" fill="#edf4fc" stroke="#819bb6"/>
    <text x="410" y="557" text-anchor="middle" font-size="18">通道对照</text>
    <text x="410" y="581" text-anchor="middle" font-size="18">持续有差异？</text>
    <text x="622" y="550" font-size="17">是</text>
    <text x="431" y="640" font-size="17">否</text>
    <rect x="720" y="526" width="352" height="72" rx="5" fill="#e9f5f0" stroke="#7caaa0"/>
    <text x="740" y="556" font-size="20" font-weight="700">小批次试用收益明确的通道</text>
    <text x="740" y="582" font-size="16">真实上传、长连接与兜底再验收</text>
    <text x="48" y="403" font-size="17" font-weight="700">尚未完整接收时采集：</text>
    <text x="48" y="435" font-size="16">网关读请求体错误</text>
    <text x="48" y="463" font-size="16">TCP 重传 / UDP 包长</text>
    <text x="48" y="491" font-size="16">双向源地址与 MTU 线索</text>
    <rect x="276" y="654" width="540" height="34" rx="17" fill="#fff" stroke="#a4b3be"/>
    <text x="546" y="677" text-anchor="middle" font-size="16">返回分层排查；不凭一次超时推导协议根因</text>
  </g>
</svg>
