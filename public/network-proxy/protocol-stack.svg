<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="680" viewBox="0 0 1120 680" role="img" aria-labelledby="stack-title stack-desc">
<title id="stack-title">代理实现与四种封装组合</title><desc id="stack-desc">代理内核实现协议，GUI管理配置，systemd或Docker托管进程。四列自上向下展示Shadowsocks直连、Shadowsocks加WebSocket和TLS、Trojan加TLS、Hysteria2加QUIC的封装顺序，并说明可选网关与TLS终止边界。</desc>
<rect width="1120" height="680" fill="#f7f9fb"/>
<g font-family="Arial, 'PingFang SC', sans-serif" fill="#23313d">
<text x="40" y="52" font-size="28" font-weight="700">程序负责实现，协议组合决定封装</text><text x="40" y="88" font-size="18" fill="#52616d">各列从上向下封装，接收端反向解包；不是任意协议都能组合所有承载方式。</text>
<path d="M40 126H1080M40 230H1080" stroke="#a1b3be"/>
<g font-size="21" font-weight="600"><text x="48" y="163">代理内核：实现协议与路由</text><text x="454" y="163">GUI：管理配置</text><text x="758" y="163">systemd / Docker：托管</text></g>
<g font-size="17" fill="#52616d"><text x="48" y="199">sing-box / Mihomo 等</text><text x="454" y="199">不转发业务字节</text><text x="758" y="199">不参与协议封装</text></g>
<g fill="#fff" stroke="#91a6b5"><rect x="40" y="274" width="236" height="60"/><rect x="308" y="274" width="236" height="60"/><rect x="576" y="274" width="236" height="60"/><rect x="844" y="274" width="236" height="60"/>
<rect x="40" y="334" width="236" height="60"/><rect x="308" y="334" width="236" height="60" fill="#e8f5ef"/><rect x="576" y="334" width="236" height="60" fill="#eaf3fb"/><rect x="844" y="334" width="236" height="60" fill="#e8f5ef"/>
<rect x="40" y="394" width="236" height="60"/><rect x="308" y="394" width="236" height="60" fill="#eaf3fb"/><rect x="576" y="394" width="236" height="60"/><rect x="844" y="394" width="236" height="60"/>
<rect x="40" y="454" width="236" height="60"/><rect x="308" y="454" width="236" height="60"/><rect x="576" y="454" width="236" height="60"/><rect x="844" y="454" width="236" height="60"/></g>
<g font-size="21" font-weight="600" text-anchor="middle"><text x="158" y="312">Shadowsocks</text><text x="426" y="312">Shadowsocks</text><text x="694" y="312">Trojan</text><text x="962" y="312">Hysteria2</text>
<text x="158" y="372">TCP</text><text x="426" y="372">WebSocket</text><text x="694" y="372">TLS</text><text x="962" y="372">QUIC：集成 TLS</text>
<text x="158" y="432">IP</text><text x="426" y="432">TLS（WSS）</text><text x="694" y="432">TCP</text><text x="962" y="432">UDP</text>
<text x="158" y="492">此列仅展示 TCP 分支</text><text x="426" y="492">TCP → IP</text><text x="694" y="492">IP</text><text x="962" y="492">IP</text></g>
<g font-size="18" fill="#52616d"><text x="40" y="564">SIP003 插件用于适配 Shadowsocks 与额外承载；sing-box 内置支持范围需区分出站与入站。</text><text x="40" y="602">Nginx / Caddy 是可选部署组件，不是传输协议，也不位于每一列的固定层次。</text><text x="40" y="640">网关若终止外层 TLS，保护边界到网关为止；目标 HTTPS 仍需独立校验证书。</text></g>
</g></svg>
