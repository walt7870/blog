<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="660" viewBox="0 0 1120 660" role="img" aria-labelledby="arch-title arch-desc">
<title id="arch-title">网络代理的控制与访问边界</title><desc id="arch-desc">订阅由客户端界面加载给内核，业务应用直接进入内核。内核按规则直连目标或经远端服务访问目标。可选网关需与传输兼容，DNS策略参与决策。</desc>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1L9 5L1 9Z" fill="#527184"/></marker></defs>
<rect width="1120" height="660" fill="#f7f9fb"/>
<g font-family="Arial, 'PingFang SC', sans-serif" fill="#23313d">
<text x="40" y="52" font-size="28" font-weight="700">网络代理：配置决定路径，内核转发业务流量</text>
<text x="40" y="88" font-size="18" fill="#52616d">GUI 不串在请求中；直连流量不经过远端代理服务。</text>
<g fill="none" stroke="#a1b3be" stroke-dasharray="6 5"><rect x="28" y="126" width="506" height="398" rx="6"/><rect x="702" y="278" width="390" height="246" rx="6"/></g>
<g font-size="18" fill="#52616d"><text x="48" y="154">本机：应用接入、配置加载与规则决策</text><text x="722" y="308">远端：公网入口与出口连接</text></g>
<g fill="none" stroke="#527184" stroke-width="2" marker-end="url(#a)">
<path d="M180 256V350"/><path d="M414 256V350" stroke-dasharray="6 5"/>
<path d="M544 206H508" stroke-dasharray="6 5"/><path d="M280 478V540Q280 548 288 548H1092Q1100 548 1100 540V224Q1100 216 1092 216H1072"/>
<path d="M500 440H730"/><path d="M874 350V326Q874 318 882 318H998Q1006 318 1006 310V256"/>
</g>
<g stroke="#91a6b5" fill="#fff"><rect x="60" y="178" width="226" height="78" rx="6"/><rect x="320" y="178" width="188" height="78" rx="6"/><rect x="544" y="178" width="206" height="78" rx="6" fill="#eaf3fb"/>
<rect x="60" y="350" width="440" height="128" rx="6" fill="#e8f5ef"/><rect x="866" y="178" width="206" height="78" rx="6"/>
<rect x="730" y="350" width="318" height="128" rx="6" fill="#eaf3fb"/></g>
<g font-size="22" font-weight="600"><text x="84" y="211">业务应用</text><text x="342" y="211">客户端 GUI</text><text x="566" y="211">订阅 / 本地配置</text><text x="888" y="211">目标服务</text>
<text x="84" y="386">代理内核：Mihomo / sing-box</text><text x="752" y="386">远端代理服务</text></g>
<g font-size="17" fill="#52616d"><text x="84" y="239">HTTP/SOCKS 或 TUN 接入</text><text x="342" y="239">管理与加载</text><text x="566" y="239">节点、规则、DNS</text><text x="888" y="239">网站 / 下载 API</text>
<text x="84" y="420">规则与 DNS 策略共同决定目标及出口</text><text x="84" y="452">REJECT 终止；DIRECT 直连；代理组选择节点</text>
<text x="752" y="420">校验代理身份，再建立目标连接</text><text x="752" y="452">可选网关必须兼容所用传输</text></g>
<g font-size="18" fill="#23313d"><rect x="578" y="534" width="150" height="28" fill="#f7f9fb"/><text x="586" y="554">DIRECT 直连</text><rect x="548" y="422" width="136" height="28" fill="#f7f9fb"/><text x="556" y="443">代理连接</text></g>
<g font-size="18" fill="#52616d"><text x="40" y="588">实线：连接建立方向；虚线：配置加载。响应沿对应连接返回。</text>
<text x="40" y="620">代理外层加密保护本机到远端；目标 HTTPS 还需独立验证目标证书。</text><text x="40" y="650">例：内部制品库走企业 DNS 与直连，外部下载 API 才进入代理组。</text></g>
</g></svg>
