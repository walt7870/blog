<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="600" viewBox="0 0 1120 600" role="img" aria-labelledby="credential-title credential-desc">
  <title id="credential-title">代理账号计划轮换与泄漏撤销两条路径</title>
  <desc id="credential-desc">计划轮换允许限时新旧并存后撤销旧凭据；泄漏时优先撤销和终止旧连接，然后下发新凭据。两条路径都验证新密码可用旧密码失效，恢复不得重启用泄漏凭据。</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#596b78" stroke-width="1.4"/></marker></defs>
  <rect width="1120" height="600" fill="#f7f9fb"/>
  <g font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" fill="#263541">
    <text x="48" y="57" font-size="27" font-weight="700">是否泄漏，决定先迁移还是先撤销</text>
    <text x="48" y="91" font-size="17" fill="#536470">name 是标签，password 才参与认证；订阅 URL 与节点密码分别管理。</text>
    <text x="48" y="157" font-size="21" font-weight="700">计划轮换</text>
    <text x="48" y="191" font-size="16">凭据未泄漏</text>
    <text x="48" y="328" font-size="21" font-weight="700">泄漏 / 紧急停用</text>
    <text x="48" y="362" font-size="16">缩短旧密码有效期</text>
    <g stroke="#596b78" stroke-width="2" fill="none" marker-end="url(#arrow)">
      <path d="M470 193H526"/><path d="M751 193H807"/>
      <path d="M470 364H526"/><path d="M751 364H807"/>
    </g>
    <rect x="245" y="139" width="225" height="108" rx="5" fill="#fff" stroke="#a4b3be"/>
    <text x="265" y="175" font-size="20" font-weight="700">新增替代凭据</text>
    <text x="265" y="207" font-size="16">检查并应用到所有入口</text>
    <text x="265" y="232" font-size="16">限时允许新旧并存</text>
    <rect x="526" y="139" width="225" height="108" rx="5" fill="#fff" stroke="#a4b3be"/>
    <text x="546" y="175" font-size="20" font-weight="700">客户端迁移</text>
    <text x="546" y="207" font-size="16">重载配置并发起新连接</text>
    <text x="546" y="232" font-size="16">确认新密码访问成功</text>
    <rect x="807" y="139" width="265" height="108" rx="5" fill="#e9f5f0" stroke="#7caaa0"/>
    <text x="827" y="175" font-size="20" font-weight="700">到期撤销旧项</text>
    <text x="827" y="207" font-size="16">确认旧密码新连接失败</text>
    <text x="827" y="232" font-size="16">按要求处理仍存活连接</text>
    <rect x="245" y="310" width="225" height="108" rx="5" fill="#fcf1eb" stroke="#c6a291"/>
    <text x="265" y="346" font-size="20" font-weight="700">立即撤销旧凭据</text>
    <text x="265" y="378" font-size="16">所有节点同步应用</text>
    <text x="265" y="403" font-size="16">必要时终止已有连接</text>
    <rect x="526" y="310" width="225" height="108" rx="5" fill="#fff" stroke="#a4b3be"/>
    <text x="546" y="346" font-size="20" font-weight="700">验证撤销已生效</text>
    <text x="546" y="378" font-size="16">旧密码不能建立新连接</text>
    <text x="546" y="403" font-size="16">不只观察日志数量</text>
    <rect x="807" y="310" width="265" height="108" rx="5" fill="#fff" stroke="#a4b3be"/>
    <text x="827" y="346" font-size="20" font-weight="700">发放新的凭据</text>
    <text x="827" y="378" font-size="16">受控渠道分发并验证</text>
    <text x="827" y="403" font-size="16">轮换暴露过的订阅材料</text>
    <path d="M48 467H1072" stroke="#c2cbd2"/>
    <text x="48" y="509" font-size="19" font-weight="700">恢复边界</text>
    <text x="48" y="545" font-size="17">备份同样含密码，限制访问与保留期。恢复配置前排除已泄漏的旧凭据，不能直接原样回滚。</text>
  </g>
</svg>
