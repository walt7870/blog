<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="600" viewBox="0 0 1120 600" role="img" aria-labelledby="systemd-title systemd-desc">
  <title id="systemd-title">systemd代理部署的进程文件与网络边界</title>
  <desc id="systemd-desc">Linux宿主机上的systemd按unit启动sing-box，进程读取配置证书并输出journal日志。客户端通过TCP443连接进程，认证后由远端出口连接目标。</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#596b78" stroke-width="1.4"/></marker></defs>
  <rect width="1120" height="600" fill="#f7f9fb"/>
  <g font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" fill="#263541">
    <text x="48" y="57" font-size="27" font-weight="700">unit 决定身份与路径，配置决定代理行为</text>
    <text x="48" y="91" font-size="17" fill="#536470">单进程示例；安装版本需固定，ExecStart 与检查命令必须一致。</text>
    <rect x="287" y="127" width="538" height="398" rx="6" fill="none" stroke="#a4b3be" stroke-dasharray="7 5"/>
    <text x="309" y="157" font-size="18" fill="#536470">远端 Linux 宿主机</text>
    <g stroke="#596b78" stroke-width="2" fill="none" marker-end="url(#arrow)">
      <path d="M236 357H337"/><path d="M769 357H874"/>
      <path d="M553 235V306"/><path d="M454 460V408"/>
      <path d="M642 408V460"/>
    </g>
    <rect x="48" y="306" width="188" height="102" rx="5" fill="#fff" stroke="#a4b3be"/>
    <text x="68" y="343" font-size="21" font-weight="700">客户端内核</text>
    <text x="68" y="376" font-size="17">Trojan + TLS</text>
    <rect x="337" y="185" width="432" height="50" rx="5" fill="#fff" stroke="#a4b3be"/>
    <text x="356" y="217" font-size="20">systemd unit：程序、User、ExecStart</text>
    <rect x="337" y="306" width="432" height="102" rx="5" fill="#e9f5f0" stroke="#7caaa0"/>
    <text x="357" y="344" font-size="23" font-weight="700">sing-box · 选定发行版本</text>
    <text x="357" y="377" font-size="17">监听 0.0.0.0:443，认证后访问目标</text>
    <rect x="874" y="306" width="198" height="102" rx="5" fill="#fff" stroke="#a4b3be"/>
    <text x="894" y="343" font-size="21" font-weight="700">目标服务</text>
    <text x="894" y="376" font-size="17">远端 DNS 与出口</text>
    <rect x="310" y="460" width="288" height="42" rx="4" fill="#edf4fc" stroke="#819bb6"/>
    <text x="327" y="488" font-size="16">配置 + 证书 /etc/sing-box/</text>
    <rect x="620" y="460" width="180" height="42" rx="4" fill="#fff" stroke="#a4b3be"/>
    <text x="638" y="488" font-size="17">journal 日志</text>
    <rect x="243" y="329" width="87" height="22" fill="#f7f9fb"/><text x="250" y="346" font-size="15">TCP 443</text>
    <rect x="503" y="257" width="100" height="23" fill="#f7f9fb"/><text x="516" y="274" font-size="15">启动 / 重启</text>
    <text x="48" y="566" font-size="17" fill="#536470">check 不验证公网、防火墙和业务认证；root 检查通过，也不能代替实际服务身份的读取验证。</text>
  </g>
</svg>
