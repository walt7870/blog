<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="700" viewBox="0 0 1440 700" role="img" aria-labelledby="title desc">
  <title id="title">订阅批量下发与回滚流程</title>
  <desc id="desc">从开户、同步 Hysteria2 凭据、真实解析器校验到小批量下发和全量通知，校验失败时从备份回滚。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06101f"/>
      <stop offset=".52" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <pattern id="grid" width="38" height="38" patternUnits="userSpaceOnUse">
      <path d="M38 0H0V38" fill="none" stroke="#233e63" stroke-width="1" opacity=".32"/>
    </pattern>
    <filter id="glow" filterUnits="userSpaceOnUse" x="0" y="0" width="1440" height="700">
      <feGaussianBlur stdDeviation="3.6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto">
      <path d="M2 2L12 7L2 12Z" fill="#67e8f9"/>
    </marker>
    <marker id="arrow-red" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto">
      <path d="M2 2L12 7L2 12Z" fill="#fb7185"/>
    </marker>
    <marker id="arrow-violet" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto">
      <path d="M2 2L12 7L2 12Z" fill="#a78bfa"/>
    </marker>
    <style>
      .bg { fill: url(#bg); }
      .grid { fill: url(#grid); }
      .title { font: 800 34px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #e0f2fe; }
      .sub { font: 500 16px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #94a3b8; }
      .stage { fill: rgba(15,23,42,.76); stroke: #1f9cbd; stroke-width: 1.4; rx: 26; }
      .step { fill: rgba(8,47,73,.92); stroke: #38bdf8; stroke-width: 1.8; rx: 18; filter: url(#glow); }
      .step2 { fill: rgba(49,46,129,.86); stroke: #a78bfa; stroke-width: 1.8; rx: 18; filter: url(#glow); }
      .verify { fill: rgba(6,78,59,.86); stroke: #34d399; stroke-width: 1.8; rx: 18; filter: url(#glow); }
      .risk { fill: rgba(76,5,25,.78); stroke: #fb7185; stroke-width: 1.7; rx: 18; filter: url(#glow); }
      .diamond { fill: rgba(88,28,135,.88); stroke: #c084fc; stroke-width: 2; filter: url(#glow); }
      .lane { font: 800 21px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #cffafe; }
      .text { font: 750 18px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #f8fafc; text-anchor: middle; }
      .tl { font: 750 18px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #f8fafc; }
      .small { font: 500 13px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #bfdbfe; text-anchor: middle; }
      .sl { font: 500 14px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #bfdbfe; }
      .label { font: 700 14px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #e0f2fe; text-anchor: middle; }
      .labelr { font: 700 14px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #fecdd3; text-anchor: middle; }
      .labelv { font: 700 14px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #ddd6fe; text-anchor: middle; }
      .line { stroke: #67e8f9; stroke-width: 2.4; fill: none; marker-end: url(#arrow); filter: url(#glow); }
      .viol { stroke: #a78bfa; stroke-width: 2.4; fill: none; stroke-dasharray: 9 7; marker-end: url(#arrow-violet); }
      .dash { stroke: #fb7185; stroke-width: 2.2; fill: none; stroke-dasharray: 8 8; marker-end: url(#arrow-red); }
    </style>
  </defs>
  <rect class="bg" width="1440" height="700"/>
  <rect class="grid" width="1440" height="700"/>
  <circle cx="1250" cy="120" r="230" fill="#2563eb" opacity=".16"/>
  <circle cx="230" cy="610" r="260" fill="#14b8a6" opacity=".12"/>

  <text class="title" x="64" y="72">订阅下发流程：先备份，再校验，最后放量</text>
  <text class="sub" x="64" y="102">同步脚本幂等：重复执行不会改变已有凭据；只有凭据列表变化时才重启 Hysteria2。</text>
  <rect class="stage" x="64" y="140" width="1312" height="270"/>
  <text class="lane" x="92" y="180">下发</text>
  <rect class="step" x="96" y="220" width="200" height="100"/>
  <text class="text" x="196.0" y="256">① 开户</text>
  <text class="small" x="196.0" y="278">创建 SS 账号</text>
  <text class="small" x="196.0" y="297">限速 · 台账</text>
  <rect class="step2" x="350" y="220" width="220" height="100"/>
  <text class="text" x="460.0" y="256">② 同步 HY2</text>
  <text class="small" x="460.0" y="278">生成凭据 · 改写订阅</text>
  <text class="small" x="460.0" y="297">写入前自动备份</text>
  <rect class="verify" x="620" y="220" width="220" height="100"/>
  <text class="text" x="730.0" y="256">③ 校验</text>
  <text class="small" x="730.0" y="278">真实解析器加载</text>
  <text class="small" x="730.0" y="297">结构 · 凭据 · HTTP 200</text>
  <polygon class="diamond" points="965,210.0 1060.0,270 965,330.0 870.0,270"/>
  <text class="text" x="965" y="276" style="font-size:16px">校验通过？</text>
  <rect class="step" x="1100" y="220" width="240" height="100"/>
  <text class="text" x="1220.0" y="256">④ 小批量试用</text>
  <text class="small" x="1220.0" y="278">自己的订阅先行</text>
  <text class="small" x="1220.0" y="297">观察长连接与速度</text>
  <path class="line" d="M296 270 H350"/>
  <path class="line" d="M570 270 H620"/>
  <path class="line" d="M840 270 H870"/>
  <path class="line" d="M1060 270 H1100"/>
  <text class="label" x="1080" y="258">是</text>
  <rect class="verify" x="1100" y="342" width="240" height="52"/>
  <text class="text" x="1220.0" y="373">⑤ 全量并通知刷新订阅</text>
  <path class="line" d="M1220 320 V342"/>
  <path class="dash" d="M965 330 V470"/>
  <text class="labelr" x="990" y="392">否</text>
  <rect class="risk" x="780" y="470" width="370" height="80"/>
  <text class="text" x="965.0" y="506">回滚</text>
  <text class="small" x="965.0" y="528">从备份恢复订阅与服务端配置，再复查</text>
  <path class="dash" d="M780 510 H300 V320"/>
  <text class="labelr" x="540" y="498">定位原因后重新执行</text>
  <rect class="stage" x="64" y="580" width="1312" height="96"/>
  <text class="lane" x="92" y="620"></text>
  <rect class="step" x="96" y="600" width="240" height="56"/>
  <text class="text" x="216.0" y="633">写入前备份</text>
  <rect class="risk" x="372" y="600" width="350" height="56"/>
  <text class="text" x="547.0" y="633">备份目录不进入发布目录</text>
  <rect class="step2" x="760" y="600" width="310" height="56"/>
  <text class="text" x="915.0" y="633">同一时刻只有一个会话改服务端</text>
  <rect class="verify" x="1108" y="600" width="240" height="56"/>
  <text class="text" x="1228.0" y="633">不同时改多个变量</text>
  <text class="lane" x="1232" y="635" style="font-size:16px"> </text>
</svg>