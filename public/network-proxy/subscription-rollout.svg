<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="620" viewBox="0 0 1120 620" role="img" aria-labelledby="subscription-rollout-title subscription-rollout-desc">
  <title id="subscription-rollout-title">订阅候选校验与分批发布恢复</title>
  <desc id="subscription-rollout-desc">受控输入与受限备份后生成候选文件；校验通过后测试账号应用，业务通过才分批发布。校验失败不触碰线上，业务失败按白名单恢复兼容且未泄漏版本。</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#596b78" stroke-width="1.4"/></marker></defs>
  <rect width="1120" height="620" fill="#f7f9fb"/>
  <g font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" fill="#263541">
    <text x="48" y="57" font-size="27" font-weight="700">先验证候选，再应用测试账号，最后分批发布</text>
    <text x="48" y="91" font-size="17" fill="#536470">发布互斥、凭据幂等、精确文件清单；多服务与多文件不构成天然原子事务。</text>
    <g stroke="#596b78" stroke-width="2" fill="none" marker-end="url(#arrow)">
      <path d="M280 176H352"/><path d="M632 176H708"/>
      <path d="M840 218V282"/><path d="M708 332H632"/>
      <path d="M352 332H280"/><path d="M840 382V446"/>
      <path d="M48 176H24Q16 176 16 184V482Q16 490 24 490H48"/>
    </g>
    <rect x="48" y="134" width="232" height="84" rx="5" fill="#edf4fc" stroke="#819bb6"/>
    <text x="68" y="166" font-size="20" font-weight="700">输入与写前备份</text>
    <text x="68" y="193" font-size="16">发布白名单、备份受限隔离</text>
    <rect x="352" y="134" width="280" height="84" rx="5" fill="#fff" stroke="#a4b3be"/>
    <text x="372" y="166" font-size="20" font-weight="700">生成候选、目标内核检查</text>
    <text x="372" y="193" font-size="16">账号 / 节点 / 引用 / 规则一致</text>
    <path d="M840 134L972 176L840 218L708 176Z" fill="#edf4fc" stroke="#819bb6"/>
    <text x="840" y="183" font-size="18" text-anchor="middle">候选校验通过？</text>
    <text x="862" y="252" font-size="17">是</text>
    <path d="M972 176H1036Q1044 176 1044 184V446" fill="none" stroke="#596b78" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="1060" y="293" font-size="17">否</text>
    <path d="M840 282L972 332L840 382L708 332Z" fill="#e9f5f0" stroke="#7caaa0"/>
    <text x="840" y="326" font-size="18" text-anchor="middle">测试账号应用后</text>
    <text x="840" y="350" font-size="18" text-anchor="middle">业务验收通过？</text>
    <text x="657" y="319" font-size="17">是</text>
    <text x="862" y="419" font-size="17">否</text>
    <rect x="352" y="290" width="280" height="84" rx="5" fill="#e9f5f0" stroke="#7caaa0"/>
    <text x="372" y="322" font-size="20" font-weight="700">小批次应用并发布订阅</text>
    <text x="372" y="349" font-size="16">变化才重启，文件原子替换</text>
    <rect x="48" y="290" width="232" height="84" rx="5" fill="#fff" stroke="#a4b3be"/>
    <text x="68" y="322" font-size="20" font-weight="700">客户端刷新并实测</text>
    <text x="68" y="349" font-size="16">实际节点、完整上传与兜底</text>
    <rect x="48" y="446" width="370" height="88" rx="5" fill="#fff" stroke="#a4b3be"/>
    <text x="68" y="479" font-size="20" font-weight="700">备份始终位于发布目录之外</text>
    <text x="68" y="507" font-size="16">恢复按清单，不使用通配符复制所有 YAML</text>
    <rect x="664" y="446" width="408" height="88" rx="5" fill="#fff" stroke="#a4b3be"/>
    <text x="684" y="478" font-size="20" font-weight="700">停止该批次，定位失败阶段</text>
    <text x="684" y="503" font-size="16">未应用则不动线上；已应用则按白名单恢复</text>
    <text x="684" y="525" font-size="15">恢复后复验，禁止重新启用泄漏凭据</text>
    <text x="48" y="583" font-size="17">任何阶段失败都停止扩批；HTTP 200 与配置解析成功均不能代替客户端运行验收。</text>
  </g>
</svg>
