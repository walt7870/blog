<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="680" viewBox="0 0 1120 680" role="img" aria-labelledby="hy2-architecture-title hy2-architecture-desc">
  <title id="hy2-architecture-title">Hysteria2与TCP双通道及订阅控制面</title>
  <desc id="hy2-architecture-desc">Mihomo规则可直连目标或经故障切换组选择Hysteria2与Trojan通道，远端代理再访问目标。独立控制面生成服务配置和个人订阅；切换不迁移已有请求。</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#596b78" stroke-width="1.4"/></marker></defs>
  <rect width="1120" height="680" fill="#f7f9fb"/>
  <g font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" fill="#263541">
    <text x="48" y="57" font-size="27" font-weight="700">双通道承载业务，订阅独立分发配置</text>
    <text x="48" y="91" font-size="17" fill="#536470">本例优先 QUIC；网络不支持 UDP 时为后续 TCP 连接选择兜底。</text>
    <rect x="32" y="138" width="462" height="325" rx="6" fill="#f2f6fa" stroke="#a4b3be" stroke-dasharray="5 4"/>
    <rect x="568" y="138" width="284" height="325" rx="6" fill="#f2f6fa" stroke="#a4b3be" stroke-dasharray="5 4"/>
    <text x="50" y="166" font-size="17">客户端主机</text><text x="588" y="166" font-size="17">远端代理主机</text>
    <g stroke="#596b78" stroke-width="2" fill="none" marker-end="url(#arrow)">
      <path d="M236 225H302"/><path d="M388 263V327"/>
      <path d="M474 358H516Q524 358 524 350V242Q524 234 532 234H590"/>
      <path d="M474 389H590"/>
      <path d="M830 234H878Q886 234 886 242V296Q886 304 894 304H922"/>
      <path d="M830 389H878Q886 389 886 381V344Q886 336 894 336H922"/>
      <path d="M388 187V119Q388 111 396 111H988Q996 111 996 119V280"/>
      <path d="M297 556H360"/><path d="M687 556H752"/>
    </g>
    <rect x="50" y="187" width="186" height="76" rx="5" fill="#fff" stroke="#a4b3be"/>
    <text x="70" y="219" font-size="20" font-weight="700">应用请求</text>
    <text x="70" y="245" font-size="16">接入本机代理端口</text>
    <rect x="302" y="187" width="172" height="76" rx="5" fill="#edf4fc" stroke="#819bb6"/>
    <text x="320" y="219" font-size="20" font-weight="700">Mihomo 规则</text>
    <text x="320" y="245" font-size="16">DNS 与策略匹配</text>
    <rect x="588" y="100" width="194" height="24" fill="#f7f9fb"/>
    <text x="604" y="118" font-size="16">DIRECT 绕过远端</text>
    <rect x="302" y="327" width="172" height="88" rx="5" fill="#e9f5f0" stroke="#7caaa0"/>
    <text x="320" y="356" font-size="20" font-weight="700">PROXY</text>
    <text x="320" y="382" font-size="16">fallback 顺序选择</text>
    <text x="320" y="403" font-size="15">影响后续连接</text>
    <rect x="590" y="192" width="240" height="84" rx="5" fill="#e9f5f0" stroke="#7caaa0"/>
    <text x="610" y="223" font-size="20" font-weight="700">Hysteria2</text>
    <text x="610" y="249" font-size="16">QUIC / UDP 443</text>
    <rect x="590" y="347" width="240" height="84" rx="5" fill="#fff" stroke="#a4b3be"/>
    <text x="610" y="378" font-size="20" font-weight="700">Trojan + TLS</text>
    <text x="610" y="404" font-size="16">TCP 443，兜底仅验证 TCP</text>
    <rect x="922" y="280" width="166" height="80" rx="5" fill="#fff" stroke="#a4b3be"/>
    <text x="940" y="312" font-size="20" font-weight="700">目标服务</text>
    <text x="940" y="338" font-size="16">目标 TLS 独立验证</text>
    <text x="50" y="442" font-size="16">已建立连接不会自动迁移或重放。</text>
    <path d="M48 488H1072" stroke="#c2cbd2"/>
    <rect x="48" y="517" width="249" height="78" rx="5" fill="#edf4fc" stroke="#819bb6"/>
    <text x="68" y="548" font-size="20" font-weight="700">受限账号与配置生成</text>
    <text x="68" y="575" font-size="16">独立凭据、候选校验与备份</text>
    <rect x="360" y="517" width="327" height="78" rx="5" fill="#fff" stroke="#a4b3be"/>
    <text x="380" y="548" font-size="20" font-weight="700">应用服务配置、发布个人订阅</text>
    <text x="380" y="575" font-size="16">HTTPS 下载，备份不进入发布目录</text>
    <rect x="752" y="517" width="320" height="78" rx="5" fill="#fff" stroke="#a4b3be"/>
    <text x="772" y="548" font-size="20" font-weight="700">客户端刷新并加载</text>
    <text x="772" y="575" font-size="16">核对实际节点与完整上传结果</text>
    <text x="48" y="641" font-size="17">下方为控制面变更流程，不承载上方业务数据；任一通道仍需认证、出口和目标访问验收。</text>
  </g>
</svg>
