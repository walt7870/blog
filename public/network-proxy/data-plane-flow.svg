<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="660" viewBox="0 0 1120 660" role="img" aria-labelledby="flow-title flow-desc">
<title id="flow-title">应用进入代理后的三种路由结果</title><desc id="flow-desc">应用先经端口或TUN进入内核，规则根据可用域名IP等元数据决策。直连访问目标，代理经远端服务访问目标，拒绝则终止。DNS解析位置由策略确定。</desc>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1L9 5L1 9Z" fill="#527184"/></marker></defs>
<rect width="1120" height="660" fill="#f7f9fb"/>
<g font-family="Arial, 'PingFang SC', sans-serif" fill="#23313d">
<text x="40" y="52" font-size="28" font-weight="700">一条连接的分流：接入、决策、建立出口</text><text x="40" y="88" font-size="18" fill="#52616d">DNS 可以在不同阶段发生；并不是所有流量都先进行一次独立 DNS 查询。</text>
<g fill="none" stroke="#527184" stroke-width="2" marker-end="url(#a)"><path d="M240 238H302"/><path d="M502 238H540"/><path d="M780 238H832Q840 238 840 230V218Q840 210 848 210H866"/><path d="M660 320V376"/><path d="M660 450V494Q660 502 668 502H866"/><path d="M720 279H806Q814 279 814 287V344Q814 352 822 352H866"/></g>
<g stroke="#91a6b5" fill="#fff"><rect x="40" y="194" width="200" height="88" rx="6"/><rect x="302" y="194" width="200" height="88" rx="6"/>
<polygon points="660,158 780,238 660,320 540,238" fill="#e8f5ef"/>
<rect x="866" y="166" width="214" height="88" rx="6"/><rect x="548" y="376" width="224" height="74" rx="6" fill="#eaf3fb"/><rect x="866" y="458" width="214" height="88" rx="6"/><rect x="866" y="316" width="214" height="72" rx="20" fill="#fff3ec"/></g>
<g font-size="22" font-weight="600"><text x="64" y="229">应用连接</text><text x="326" y="229">本机内核接入</text><text x="608" y="234">规则决策</text><text x="888" y="201">目标服务</text><text x="574" y="408">远端代理服务</text><text x="888" y="493">目标服务</text><text x="888" y="359">拒绝 / 终止</text></g>
<g font-size="17" fill="#52616d"><text x="64" y="258">浏览器 / curl</text><text x="326" y="258">HTTP/SOCKS / TUN</text><text x="608" y="262">域名 / IP 等</text><text x="888" y="230">本机出口直连</text><text x="574" y="434">身份校验、远端 DNS</text><text x="888" y="522">使用远端出口</text></g>
<g font-size="18"><rect x="790" y="168" width="72" height="28" fill="#f7f9fb"/><text x="796" y="189">DIRECT</text><rect x="624" y="334" width="76" height="28" fill="#f7f9fb"/><text x="628" y="355">PROXY</text><rect x="822" y="280" width="82" height="28" fill="#f7f9fb"/><text x="828" y="301">REJECT</text></g>
<g font-size="18" fill="#52616d"><text x="40" y="580">无内核连接记录：检查应用接入、NO_PROXY 与流量是否已结束，不直接判定节点故障。</text><text x="40" y="616">有记录但路径错误：核对最终匹配规则、域名映射、UDP 能力与代理组实际选择。</text></g>
</g></svg>
