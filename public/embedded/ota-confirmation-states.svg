<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="580" viewBox="0 0 1120 580" role="img" aria-labelledby="ota-confirmation-states-t ota-confirmation-states-d"><title id="ota-confirmation-states-t">OTA候选必须经过试启动与确认</title><desc id="ota-confirmation-states-d">固件写完不等于可以删除原来的可启动版本。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#607568"/></marker><style>text{font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;letter-spacing:0;fill:#253c30}.h{font-size:28px;font-weight:600}.n{font-size:21px;font-weight:600}.s{font-size:18px;fill:#52685b}.node{fill:white;stroke:#a6b9ad;stroke-width:1.5}.focus{fill:#e9f4ee;stroke:#397657;stroke-width:1.5}.info{fill:#edf3fb;stroke:#739bbf;stroke-width:1.5}.edge{fill:none;stroke:#607568;stroke-width:2;marker-end:url(#a)}</style></defs><rect width="1120" height="580" fill="white"/><text x="32" y="44" class="h">OTA候选必须经过试启动与确认</text><text x="32" y="82" class="s">固件写完不等于可以删除原来的可启动版本。</text><path d="M336 192H408" class="edge"/><path d="M712 192H784" class="edge"/><path d="M936 252V344" class="edge"/><path d="M784 404H712" class="edge"/><g data-node="已确认旧版本"><rect x="32" y="132" width="304" height="120" rx="6" class="node"/><text x="48" y="164" class="n">已确认旧版本</text><text x="48" y="196" class="s">保持可启动和可恢复</text><text x="48" y="224" class="s">下载不得破坏运行区</text></g><g data-node="写入候选"><rect x="408" y="132" width="304" height="120" rx="6" class="focus"/><text x="424" y="164" class="n">写入候选</text><text x="424" y="196" class="s">长度、型号、签名和版本</text><text x="424" y="224" class="s">掉电记录与真实擦除边界</text></g><g data-node="试启动候选"><rect x="784" y="132" width="304" height="120" rx="6" class="node"/><text x="800" y="164" class="n">试启动候选</text><text x="800" y="196" class="s">持久记录待确认和尝试</text><text x="800" y="224" class="s">采用平台支持的启动算法</text></g><g data-node="关键健康检查"><rect x="784" y="344" width="304" height="120" rx="6" class="node"/><text x="800" y="376" class="n">关键健康检查</text><text x="800" y="408" class="s">任务、存储和外设正常</text><text x="800" y="436" class="s">成功后才持久确认</text></g><g data-node="已确认新版本"><rect x="408" y="344" width="304" height="120" rx="6" class="info"/><text x="424" y="376" class="n">已确认新版本</text><text x="424" y="408" class="s">保留规定的恢复策略</text><text x="424" y="436" class="s">后续升级重走同一流程</text></g><text x="32" y="378" class="n">未确认复位 → 按算法回退</text><text x="32" y="416" class="s">坏签名、错误型号 → 拒绝候选</text><text x="32" y="448" class="s">旧版仍需读懂共享持久数据</text><text x="32" y="544" class="s">CRC/SHA不证明来源；普通A地址映像不能直接跳到B地址运行。</text></svg>
