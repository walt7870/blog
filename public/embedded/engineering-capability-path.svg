<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="580" viewBox="0 0 1120 580" role="img" aria-labelledby="engineering-capability-path-t engineering-capability-path-d"><title id="engineering-capability-path-t">用可检查的产物验证工程能力</title><desc id="engineering-capability-path-d">按独立完成的范围进阶，不用年限替代证据。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#607568"/></marker><style>text{font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;letter-spacing:0;fill:#253c30}.h{font-size:28px;font-weight:600}.n{font-size:21px;font-weight:600}.s{font-size:18px;fill:#52685b}.node{fill:white;stroke:#a6b9ad;stroke-width:1.5}.focus{fill:#e9f4ee;stroke:#397657;stroke-width:1.5}.info{fill:#edf3fb;stroke:#739bbf;stroke-width:1.5}.edge{fill:none;stroke:#607568;stroke-width:2;marker-end:url(#a)}</style></defs><rect width="1120" height="580" fill="white"/><text x="32" y="44" class="h">用可检查的产物验证工程能力</text><text x="32" y="82" class="s">按独立完成的范围进阶，不用年限替代证据。</text><path d="M336 192H408" class="edge"/><path d="M712 192H784" class="edge"/><path d="M936 252V344" class="edge"/><path d="M784 404H712" class="edge"/><path d="M408 404H336" class="edge"/><g data-node="单板基线"><rect x="32" y="132" width="304" height="120" rx="6" class="node"/><text x="48" y="164" class="n">单板基线</text><text x="48" y="196" class="s">板型、接线、SDK与构建</text><text x="48" y="224" class="s">复位启动与调试可复现</text></g><g data-node="模块交付"><rect x="408" y="132" width="304" height="120" rx="6" class="focus"/><text x="424" y="164" class="n">模块交付</text><text x="424" y="196" class="s">驱动、时序和错误返回</text><text x="424" y="224" class="s">边界输入与恢复测试</text></g><g data-node="系统集成"><rect x="784" y="132" width="304" height="120" rx="6" class="node"/><text x="800" y="164" class="n">系统集成</text><text x="800" y="196" class="s">任务、队列、内存与持久化</text><text x="800" y="224" class="s">断网不阻塞关键控制</text></g><g data-node="边界验证"><rect x="784" y="344" width="304" height="120" rx="6" class="node"/><text x="800" y="376" class="n">边界验证</text><text x="800" y="408" class="s">掉电、过载、弱网与低压</text><text x="800" y="436" class="s">保存原始条件和结果</text></g><g data-node="方案决策"><rect x="408" y="344" width="304" height="120" rx="6" class="info"/><text x="424" y="376" class="n">方案决策</text><text x="424" y="408" class="s">成本、功耗、支持与供应</text><text x="424" y="436" class="s">说明采用与拒绝的依据</text></g><g data-node="经验沉淀"><rect x="32" y="344" width="304" height="120" rx="6" class="node"/><text x="48" y="376" class="n">经验沉淀</text><text x="48" y="408" class="s">根因、取舍、反例与复验</text><text x="48" y="436" class="s">保留因果，移除秘密</text></g><text x="32" y="544" class="s">主机逻辑测试不替代目标板电气、时序和长期可靠性验证。</text></svg>
