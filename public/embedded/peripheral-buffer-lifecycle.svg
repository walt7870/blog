<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="580" viewBox="0 0 1120 580" role="img" aria-labelledby="peripheral-buffer-lifecycle-t peripheral-buffer-lifecycle-d"><title id="peripheral-buffer-lifecycle-t">一次异步发送的缓冲区寿命</title><desc id="peripheral-buffer-lifecycle-d">启动成功只表示已受理，完成前不能复用。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#607568"/></marker><style>text{font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;letter-spacing:0;fill:#253c30}.h{font-size:28px;font-weight:600}.n{font-size:21px;font-weight:600}.s{font-size:18px;fill:#52685b}.node{fill:white;stroke:#a6b9ad;stroke-width:1.5}.focus{fill:#e9f4ee;stroke:#397657;stroke-width:1.5}.info{fill:#edf3fb;stroke:#739bbf;stroke-width:1.5}.edge{fill:none;stroke:#607568;stroke-width:2;marker-end:url(#a)}</style></defs><rect width="1120" height="580" fill="white"/><text x="32" y="44" class="h">一次异步发送的缓冲区寿命</text><text x="32" y="82" class="s">启动成功只表示已受理，完成前不能复用。</text><path d="M336 192H408" class="edge"/><path d="M712 192H784" class="edge"/><path d="M936 252V344" class="edge"/><path d="M784 404H712" class="edge"/><path d="M408 404H336" class="edge"/><g data-node="软件准备"><rect x="32" y="132" width="304" height="120" rx="6" class="node"/><text x="48" y="164" class="n">软件准备</text><text x="48" y="196" class="s">填充数据并检查长度</text><text x="48" y="224" class="s">确认可达内存和对齐</text></g><g data-node="移交DMA"><rect x="408" y="132" width="304" height="120" rx="6" class="focus"/><text x="424" y="164" class="n">移交DMA</text><text x="424" y="196" class="s">必要的TX clean与屏障</text><text x="424" y="224" class="s">缓冲区保持存活且不改</text></g><g data-node="外设传输"><rect x="784" y="132" width="304" height="120" rx="6" class="node"/><text x="800" y="164" class="n">外设传输</text><text x="800" y="196" class="s">DMA完成与线尾完成不同</text><text x="800" y="224" class="s">按协议选择确认事件</text></g><g data-node="完成或停止"><rect x="784" y="344" width="304" height="120" rx="6" class="node"/><text x="800" y="376" class="n">完成或停止</text><text x="800" y="408" class="s">错误与取消也要等硬件停</text><text x="800" y="436" class="s">不能提前归还内存</text></g><g data-node="同步回收"><rect x="408" y="344" width="304" height="120" rx="6" class="info"/><text x="424" y="376" class="n">同步回收</text><text x="424" y="408" class="s">RX按平台方案invalidate</text><text x="424" y="436" class="s">仅处理已完成数据区</text></g><g data-node="消费与复用"><rect x="32" y="344" width="304" height="120" rx="6" class="node"/><text x="48" y="376" class="n">消费与复用</text><text x="48" y="408" class="s">再交给下一次传输</text><text x="48" y="436" class="s">过载时限流或明确丢弃</text></g><text x="32" y="544" class="s">Cache操作按方向和平台设计，不能无条件对所有缓冲区同时clean/invalidate。</text></svg>
