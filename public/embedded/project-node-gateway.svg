<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="580" viewBox="0 0 1120 580" role="img" aria-labelledby="project-node-gateway-t project-node-gateway-d"><title id="project-node-gateway-t">采样节点经网关上报，控制命令另行确认</title><desc id="project-node-gateway-d">数据路径与命令路径各自有身份、队列和故障恢复。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#607568"/></marker><style>text{font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;letter-spacing:0;fill:#253c30}.h{font-size:28px;font-weight:600}.n{font-size:21px;font-weight:600}.s{font-size:18px;fill:#52685b}.node{fill:white;stroke:#a6b9ad;stroke-width:1.5}.focus{fill:#e9f4ee;stroke:#397657;stroke-width:1.5}.info{fill:#edf3fb;stroke:#739bbf;stroke-width:1.5}.edge{fill:none;stroke:#607568;stroke-width:2;marker-end:url(#a)}</style></defs><rect width="1120" height="580" fill="white"/><text x="32" y="44" class="h">采样节点经网关上报，控制命令另行确认</text><text x="32" y="82" class="s">数据路径与命令路径各自有身份、队列和故障恢复。</text><path d="M336 192H408" class="edge"/><path d="M712 192H784" class="edge"/><g data-node="传感器节点"><rect x="32" y="132" width="304" height="120" rx="6" class="node"/><text x="48" y="164" class="n">传感器节点</text><text x="48" y="196" class="s">校准、采样序号与有效状态</text><text x="48" y="224" class="s">失败值不能冒充正常温度</text></g><g data-node="网关采集与缓存"><rect x="408" y="132" width="304" height="120" rx="6" class="focus"/><text x="424" y="164" class="n">网关采集与缓存</text><text x="424" y="196" class="s">BLE/有线输入，有界存储</text><text x="424" y="224" class="s">离线保留与过期策略</text></g><g data-node="平台数据处理"><rect x="784" y="132" width="304" height="120" rx="6" class="node"/><text x="800" y="164" class="n">平台数据处理</text><text x="800" y="196" class="s">验证身份、去重与缺口</text><text x="800" y="224" class="s">接收时间不同于采样时间</text></g><path d="M784 404H712" class="edge"/><path d="M408 404H336" class="edge"/><g data-node="平台控制命令"><rect x="784" y="344" width="304" height="120" rx="6" class="node"/><text x="800" y="376" class="n">平台控制命令</text><text x="800" y="408" class="s">命令ID、目标、权限与参数</text><text x="800" y="436" class="s">超时按ID查询设备事实</text></g><g data-node="网关命令分发"><rect x="408" y="344" width="304" height="120" rx="6" class="info"/><text x="424" y="376" class="n">网关命令分发</text><text x="424" y="408" class="s">校验、去重和受控重试</text><text x="424" y="436" class="s">保存待确认与结果未知</text></g><g data-node="执行器与回执"><rect x="32" y="344" width="304" height="120" rx="6" class="node"/><text x="48" y="376" class="n">执行器与回执</text><text x="48" y="408" class="s">执行、记录与故障处理</text><text x="48" y="436" class="s">报告实际完成或失败</text></g><text x="32" y="544" class="s">上行从左向右，下行从右向左；链路ACK不能代替执行结果。</text></svg>
