<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="580" viewBox="0 0 1120 580" role="img" aria-labelledby="node-delivery-map-t node-delivery-map-d"><title id="node-delivery-map-t">环境节点的交付链从电源延伸到恢复</title><desc id="node-delivery-map-d">同一个采样动作跨越多个边界，每层都要有可观察结果。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#607568"/></marker><style>text{font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;letter-spacing:0;fill:#253c30}.h{font-size:28px;font-weight:600}.n{font-size:21px;font-weight:600}.s{font-size:18px;fill:#52685b}.node{fill:white;stroke:#a6b9ad;stroke-width:1.5}.focus{fill:#e9f4ee;stroke:#397657;stroke-width:1.5}.info{fill:#edf3fb;stroke:#739bbf;stroke-width:1.5}.edge{fill:none;stroke:#607568;stroke-width:2;marker-end:url(#a)}</style></defs><rect width="1120" height="580" fill="white"/><text x="32" y="44" class="h">环境节点的交付链从电源延伸到恢复</text><text x="32" y="82" class="s">同一个采样动作跨越多个边界，每层都要有可观察结果。</text><path d="M336 192H408" class="edge"/><path d="M712 192H784" class="edge"/><path d="M936 252V344" class="edge"/><path d="M784 404H712" class="edge"/><path d="M408 404H336" class="edge"/><g data-node="供电与接线"><rect x="32" y="132" width="304" height="120" rx="6" class="node"/><text x="48" y="164" class="n">供电与接线</text><text x="48" y="196" class="s">电压、电流、参考地与复位</text><text x="48" y="224" class="s">上电前确认电气条件</text></g><g data-node="MCU与驱动"><rect x="408" y="132" width="304" height="120" rx="6" class="focus"/><text x="424" y="164" class="n">MCU与驱动</text><text x="424" y="196" class="s">时钟、引脚、寄存器和DMA</text><text x="424" y="224" class="s">获得可信原始数据</text></g><g data-node="采样与调度"><rect x="784" y="132" width="304" height="120" rx="6" class="node"/><text x="800" y="164" class="n">采样与调度</text><text x="800" y="196" class="s">补偿、时间戳与有效标记</text><text x="800" y="224" class="s">任务不被重连无限阻塞</text></g><g data-node="传输与确认"><rect x="784" y="344" width="304" height="120" rx="6" class="node"/><text x="800" y="376" class="n">传输与确认</text><text x="800" y="408" class="s">队列、连接和业务序号</text><text x="800" y="436" class="s">发出不等于平台已处理</text></g><g data-node="异常与恢复"><rect x="408" y="344" width="304" height="120" rx="6" class="info"/><text x="424" y="376" class="n">异常与恢复</text><text x="424" y="408" class="s">超时、掉电、重启与OTA</text><text x="424" y="436" class="s">明确保留和丢弃规则</text></g><g data-node="验收证据"><rect x="32" y="344" width="304" height="120" rx="6" class="node"/><text x="48" y="376" class="n">验收证据</text><text x="48" y="408" class="s">波形、日志、周期能耗</text><text x="48" y="436" class="s">对应板号与固件提交</text></g><text x="32" y="544" class="s">先完成可信采样，再加入离线、升级和功耗约束。</text></svg>
