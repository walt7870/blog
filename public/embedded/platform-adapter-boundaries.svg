<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="580" viewBox="0 0 1120 580" role="img" aria-labelledby="platform-adapter-boundaries-t platform-adapter-boundaries-d"><title id="platform-adapter-boundaries-t">采样业务不直接绑定所有厂商API</title><desc id="platform-adapter-boundaries-d">复用的是数据与错误合同，平台边界仍需各自验证。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#607568"/></marker><style>text{font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;letter-spacing:0;fill:#253c30}.h{font-size:28px;font-weight:600}.n{font-size:21px;font-weight:600}.s{font-size:18px;fill:#52685b}.node{fill:white;stroke:#a6b9ad;stroke-width:1.5}.focus{fill:#e9f4ee;stroke:#397657;stroke-width:1.5}.info{fill:#edf3fb;stroke:#739bbf;stroke-width:1.5}.edge{fill:none;stroke:#607568;stroke-width:2;marker-end:url(#a)}</style></defs><rect width="1120" height="580" fill="white"/><text x="32" y="44" class="h">采样业务不直接绑定所有厂商API</text><text x="32" y="82" class="s">复用的是数据与错误合同，平台边界仍需各自验证。</text><path d="M336 192H408" class="edge"/><path d="M712 192H784" class="edge"/><g data-node="纯业务逻辑"><rect x="32" y="132" width="304" height="120" rx="6" class="node"/><text x="48" y="164" class="n">纯业务逻辑</text><text x="48" y="196" class="s">校验、帧解析与重试决策</text><text x="48" y="224" class="s">主机测试正常与非法输入</text></g><g data-node="硬件适配合同"><rect x="408" y="132" width="304" height="120" rx="6" class="focus"/><text x="424" y="164" class="n">硬件适配合同</text><text x="424" y="196" class="s">读取、发送、时钟与完成</text><text x="424" y="224" class="s">明确阻塞、取消和归属</text></g><g data-node="目标平台验证"><rect x="784" y="132" width="304" height="120" rx="6" class="node"/><text x="800" y="164" class="n">目标平台验证</text><text x="800" y="196" class="s">固定板型、SDK与配置</text><text x="800" y="224" class="s">真实接线、启动和恢复</text></g><g data-node="STM32"><rect x="32" y="344" width="304" height="120" rx="6" class="node"/><text x="48" y="376" class="n">STM32</text><text x="48" y="408" class="s">Cube配置、HAL/LL与探针</text><text x="48" y="436" class="s">启动、时钟、中断与DMA</text></g><g data-node="ESP32 / RISC-V"><rect x="408" y="344" width="304" height="120" rx="6" class="info"/><text x="424" y="376" class="n">ESP32 / RISC-V</text><text x="424" y="408" class="s">核对具体芯片与ISA实现</text><text x="424" y="436" class="s">目标、ABI、无线和RTOS</text></g><g data-node="树莓派 / Linux"><rect x="784" y="344" width="304" height="120" rx="6" class="node"/><text x="800" y="376" class="n">树莓派 / Linux</text><text x="800" y="408" class="s">内核与设备接口后端</text><text x="800" y="436" class="s">编号、权限和调度边界</text></g><text x="32" y="544" class="s">下方为平台实现范围；相同函数名不能证明语义相同。</text></svg>
