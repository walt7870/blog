<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="580" viewBox="0 0 1120 580" role="img" aria-labelledby="c-memory-contract-t c-memory-contract-d"><title id="c-memory-contract-t">相同的读写语法，三种不同访问合同</title><desc id="c-memory-contract-d">volatile、锁、缓冲区寿命和Cache维护不能互相替代。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#607568"/></marker><style>text{font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;letter-spacing:0;fill:#253c30}.h{font-size:28px;font-weight:600}.n{font-size:21px;font-weight:600}.s{font-size:18px;fill:#52685b}.node{fill:white;stroke:#a6b9ad;stroke-width:1.5}.focus{fill:#e9f4ee;stroke:#397657;stroke-width:1.5}.info{fill:#edf3fb;stroke:#739bbf;stroke-width:1.5}.edge{fill:none;stroke:#607568;stroke-width:2;marker-end:url(#a)}</style></defs><rect width="1120" height="580" fill="white"/><text x="32" y="44" class="h">相同的读写语法，三种不同访问合同</text><text x="32" y="82" class="s">volatile、锁、缓冲区寿命和Cache维护不能互相替代。</text><path d="M336 192H408" class="edge"/><path d="M712 192H784" class="edge"/><g data-node="CPU与编译器"><rect x="32" y="132" width="304" height="120" rx="6" class="node"/><text x="48" y="164" class="n">CPU与编译器</text><text x="48" y="196" class="s">按类型和ABI生成访问</text><text x="48" y="224" class="s">普通对象遵守C语言规则</text></g><g data-node="内存映射寄存器"><rect x="408" y="132" width="304" height="120" rx="6" class="focus"/><text x="424" y="164" class="n">内存映射寄存器</text><text x="424" y="196" class="s">限定宽度、顺序与副作用</text><text x="424" y="224" class="s">W1C不能套读改写</text></g><g data-node="真实外设"><rect x="784" y="132" width="304" height="120" rx="6" class="node"/><text x="800" y="164" class="n">真实外设</text><text x="800" y="196" class="s">按数据手册响应访问</text><text x="800" y="224" class="s">不是普通RAM变量</text></g><path d="M336 404H408" class="edge"/><path d="M712 404H784" class="edge"/><g data-node="软件准备缓冲区"><rect x="32" y="344" width="304" height="120" rx="6" class="node"/><text x="48" y="376" class="n">软件准备缓冲区</text><text x="48" y="408" class="s">校验范围和对象寿命</text><text x="48" y="436" class="s">异步期间不可失效</text></g><g data-node="DMA访问内存"><rect x="408" y="344" width="304" height="120" rx="6" class="info"/><text x="424" y="376" class="n">DMA访问内存</text><text x="424" y="408" class="s">移交读写归属与同步</text><text x="424" y="436" class="s">核对内存可达和Cache</text></g><g data-node="完成后归还"><rect x="784" y="344" width="304" height="120" rx="6" class="node"/><text x="800" y="376" class="n">完成后归还</text><text x="800" y="408" class="s">确认停止硬件访问</text><text x="800" y="436" class="s">再消费、修改或释放</text></g><text x="32" y="544" class="s">两行分别表示寄存器控制与DMA数据访问，不是一次通用读写事务。</text></svg>
