<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="580" viewBox="0 0 1120 580" role="img" aria-labelledby="protocol-command-contract-t protocol-command-contract-d"><title id="protocol-command-contract-t">打开阀门的命令要跨过六个确认边界</title><desc id="protocol-command-contract-d">传输可靠性不等于业务动作恰好一次。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#607568"/></marker><style>text{font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;letter-spacing:0;fill:#253c30}.h{font-size:28px;font-weight:600}.n{font-size:21px;font-weight:600}.s{font-size:18px;fill:#52685b}.node{fill:white;stroke:#a6b9ad;stroke-width:1.5}.focus{fill:#e9f4ee;stroke:#397657;stroke-width:1.5}.info{fill:#edf3fb;stroke:#739bbf;stroke-width:1.5}.edge{fill:none;stroke:#607568;stroke-width:2;marker-end:url(#a)}</style></defs><rect width="1120" height="580" fill="white"/><text x="32" y="44" class="h">打开阀门的命令要跨过六个确认边界</text><text x="32" y="82" class="s">传输可靠性不等于业务动作恰好一次。</text><path d="M336 192H408" class="edge"/><path d="M712 192H784" class="edge"/><path d="M936 252V344" class="edge"/><path d="M784 404H712" class="edge"/><path d="M408 404H336" class="edge"/><g data-node="控制端命令"><rect x="32" y="132" width="304" height="120" rx="6" class="node"/><text x="48" y="164" class="n">控制端命令</text><text x="48" y="196" class="s">目标、权限、参数与命令ID</text><text x="48" y="224" class="s">重试沿用同一业务身份</text></g><g data-node="协议交付"><rect x="408" y="132" width="304" height="120" rx="6" class="focus"/><text x="424" y="164" class="n">协议交付</text><text x="424" y="196" class="s">CAN / BLE / MQTT</text><text x="424" y="224" class="s">ACK与QoS只覆盖各自层</text></g><g data-node="设备接收"><rect x="784" y="132" width="304" height="120" rx="6" class="node"/><text x="800" y="164" class="n">设备接收</text><text x="800" y="196" class="s">长度、分片、权限和去重</text><text x="800" y="224" class="s">有界缓存，拒绝非法值</text></g><g data-node="执行与记录"><rect x="784" y="344" width="304" height="120" rx="6" class="node"/><text x="800" y="376" class="n">执行与记录</text><text x="800" y="408" class="s">动作、状态和故障处理</text><text x="800" y="436" class="s">考虑执行后断电</text></g><g data-node="业务结果"><rect x="408" y="344" width="304" height="120" rx="6" class="info"/><text x="424" y="376" class="n">业务结果</text><text x="424" y="408" class="s">完成、失败或结果未知</text><text x="424" y="436" class="s">超时先按命令ID查询</text></g><g data-node="控制端收敛"><rect x="32" y="344" width="304" height="120" rx="6" class="node"/><text x="48" y="376" class="n">控制端收敛</text><text x="48" y="408" class="s">确认设备事实再展示</text><text x="48" y="436" class="s">不能把发送成功当已开阀</text></g><text x="32" y="544" class="s">MQTT QoS2、CAN ACK和BLE Indication都不能替代应用执行合同。</text></svg>
