<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="580" viewBox="0 0 1120 580" role="img" aria-labelledby="electrical-check-path-t electrical-check-path-d"><title id="electrical-check-path-t">总线读不到数据时按证据缩小范围</title><desc id="electrical-check-path-d">先验证物理条件，再解释解码结果。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#607568"/></marker><style>text{font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;letter-spacing:0;fill:#253c30}.h{font-size:28px;font-weight:600}.n{font-size:21px;font-weight:600}.s{font-size:18px;fill:#52685b}.node{fill:white;stroke:#a6b9ad;stroke-width:1.5}.focus{fill:#e9f4ee;stroke:#397657;stroke-width:1.5}.info{fill:#edf3fb;stroke:#739bbf;stroke-width:1.5}.edge{fill:none;stroke:#607568;stroke-width:2;marker-end:url(#a)}</style></defs><rect width="1120" height="580" fill="white"/><text x="32" y="44" class="h">总线读不到数据时按证据缩小范围</text><text x="32" y="82" class="s">先验证物理条件，再解释解码结果。</text><path d="M336 192H408" class="edge"/><path d="M712 192H784" class="edge"/><path d="M936 252V344" class="edge"/><path d="M784 404H712" class="edge"/><path d="M408 404H336" class="edge"/><g data-node="断电检查"><rect x="32" y="132" width="304" height="120" rx="6" class="node"/><text x="48" y="164" class="n">断电检查</text><text x="48" y="196" class="s">极性、短路、接线与地</text><text x="48" y="224" class="s">电阻档不用在带电电路</text></g><g data-node="限流上电"><rect x="408" y="132" width="304" height="120" rx="6" class="focus"/><text x="424" y="164" class="n">限流上电</text><text x="424" y="196" class="s">测电源、复位与峰值电流</text><text x="424" y="224" class="s">确认器件进入工作状态</text></g><g data-node="电平与边沿"><rect x="784" y="132" width="304" height="120" rx="6" class="node"/><text x="800" y="164" class="n">电平与边沿</text><text x="800" y="196" class="s">VIH/VIL、上拉与上升时间</text><text x="800" y="224" class="s">示波器观察跌落和过冲</text></g><g data-node="协议时序"><rect x="784" y="344" width="304" height="120" rx="6" class="node"/><text x="800" y="376" class="n">协议时序</text><text x="800" y="408" class="s">地址、ACK、模式与间隔</text><text x="800" y="436" class="s">逻辑分析保留原始帧</text></g><g data-node="数据解释"><rect x="408" y="344" width="304" height="120" rx="6" class="info"/><text x="424" y="376" class="n">数据解释</text><text x="424" y="408" class="s">寄存器、字节序与补偿</text><text x="424" y="436" class="s">异常值不能当正常采样</text></g><g data-node="重现与回归"><rect x="32" y="344" width="304" height="120" rx="6" class="node"/><text x="48" y="376" class="n">重现与回归</text><text x="48" y="408" class="s">只改明确因素并重测</text><text x="48" y="436" class="s">保留板号、条件与波形</text></g><text x="32" y="544" class="s">数字解码成功不能单独证明电气裕量足够。</text></svg>
