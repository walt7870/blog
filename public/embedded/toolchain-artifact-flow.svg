<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="580" viewBox="0 0 1120 580" role="img" aria-labelledby="toolchain-artifact-flow-t toolchain-artifact-flow-d"><title id="toolchain-artifact-flow-t">构建、烧录与定位使用同一份ELF</title><desc id="toolchain-artifact-flow-d">BIN不含加载地址，符号文件必须与设备固件对应。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#607568"/></marker><style>text{font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;letter-spacing:0;fill:#253c30}.h{font-size:28px;font-weight:600}.n{font-size:21px;font-weight:600}.s{font-size:18px;fill:#52685b}.node{fill:white;stroke:#a6b9ad;stroke-width:1.5}.focus{fill:#e9f4ee;stroke:#397657;stroke-width:1.5}.info{fill:#edf3fb;stroke:#739bbf;stroke-width:1.5}.edge{fill:none;stroke:#607568;stroke-width:2;marker-end:url(#a)}</style></defs><rect width="1120" height="580" fill="white"/><text x="32" y="44" class="h">构建、烧录与定位使用同一份ELF</text><text x="32" y="82" class="s">BIN不含加载地址，符号文件必须与设备固件对应。</text><path d="M336 192H408" class="edge"/><path d="M712 192H784" class="edge"/><path d="M936 252V344" class="edge"/><path d="M784 404H712" class="edge"/><path d="M408 404H336" class="edge"/><g data-node="固定输入"><rect x="32" y="132" width="304" height="120" rx="6" class="node"/><text x="48" y="164" class="n">固定输入</text><text x="48" y="196" class="s">芯片、源码、SDK与工具链</text><text x="48" y="224" class="s">CPU / FPU / ABI一致</text></g><g data-node="编译与链接"><rect x="408" y="132" width="304" height="120" rx="6" class="focus"/><text x="424" y="164" class="n">编译与链接</text><text x="424" y="196" class="s">启动文件、ld脚本和运行库</text><text x="424" y="224" class="s">检查段、向量表与map</text></g><g data-node="生成工件"><rect x="784" y="132" width="304" height="120" rx="6" class="node"/><text x="800" y="164" class="n">生成工件</text><text x="800" y="196" class="s">ELF、BIN/HEX与校验</text><text x="800" y="224" class="s">构建元数据随版本保存</text></g><g data-node="烧录与读回"><rect x="784" y="344" width="304" height="120" rx="6" class="node"/><text x="800" y="376" class="n">烧录与读回</text><text x="800" y="408" class="s">探针、目标和加载地址</text><text x="800" y="436" class="s">verify不等于启动正确</text></g><g data-node="运行与取证"><rect x="408" y="344" width="304" height="120" rx="6" class="info"/><text x="424" y="376" class="n">运行与取证</text><text x="424" y="408" class="s">复位、故障栈帧、PC/LR</text><text x="424" y="436" class="s">记录原始复现条件</text></g><g data-node="符号定位与复验"><rect x="32" y="344" width="304" height="120" rx="6" class="node"/><text x="48" y="376" class="n">符号定位与复验</text><text x="48" y="408" class="s">使用对应构建ELF解释地址</text><text x="48" y="436" class="s">回到原故障路径验证</text></g><text x="32" y="544" class="s">主机测试、交叉编译和目标板测试分别覆盖不同范围。</text></svg>
