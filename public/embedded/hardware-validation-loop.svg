<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="580" viewBox="0 0 1120 580" role="img" aria-labelledby="hardware-validation-loop-t hardware-validation-loop-d"><title id="hardware-validation-loop-t">采集板从约束到实板验证</title><desc id="hardware-validation-loop-d">电源与回流设计要接受实际负载和故障条件检验。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#607568"/></marker><style>text{font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;letter-spacing:0;fill:#253c30}.h{font-size:28px;font-weight:600}.n{font-size:21px;font-weight:600}.s{font-size:18px;fill:#52685b}.node{fill:white;stroke:#a6b9ad;stroke-width:1.5}.focus{fill:#e9f4ee;stroke:#397657;stroke-width:1.5}.info{fill:#edf3fb;stroke:#739bbf;stroke-width:1.5}.edge{fill:none;stroke:#607568;stroke-width:2;marker-end:url(#a)}</style></defs><rect width="1120" height="580" fill="white"/><text x="32" y="44" class="h">采集板从约束到实板验证</text><text x="32" y="82" class="s">电源与回流设计要接受实际负载和故障条件检验。</text><path d="M336 192H408" class="edge"/><path d="M712 192H784" class="edge"/><path d="M936 252V344" class="edge"/><path d="M784 404H712" class="edge"/><path d="M408 404H336" class="edge"/><g data-node="产品约束"><rect x="32" y="132" width="304" height="120" rx="6" class="node"/><text x="48" y="164" class="n">产品约束</text><text x="48" y="196" class="s">电压、温度、功耗与接口</text><text x="48" y="224" class="s">峰值和待机分别预算</text></g><g data-node="原理图与物料"><rect x="408" y="132" width="304" height="120" rx="6" class="focus"/><text x="424" y="164" class="n">原理图与物料</text><text x="424" y="196" class="s">电源域、引脚、保护与BOM</text><text x="424" y="224" class="s">完整料号及替代条件</text></g><g data-node="布局与制造"><rect x="784" y="132" width="304" height="120" rx="6" class="node"/><text x="800" y="164" class="n">布局与制造</text><text x="800" y="196" class="s">回流、热、去耦与测试点</text><text x="800" y="224" class="s">ERC/DRC与封装复核</text></g><g data-node="首板上电"><rect x="784" y="344" width="304" height="120" rx="6" class="node"/><text x="800" y="376" class="n">首板上电</text><text x="800" y="408" class="s">限流、静态电压与复位</text><text x="800" y="436" class="s">最小固件逐项启用</text></g><g data-node="负载与边界"><rect x="408" y="344" width="304" height="120" rx="6" class="info"/><text x="424" y="376" class="n">负载与边界</text><text x="424" y="408" class="s">发射、电机启动与低电压</text><text x="424" y="436" class="s">抓电流和电源跌落</text></g><g data-node="修复与再验证"><rect x="32" y="344" width="304" height="120" rx="6" class="node"/><text x="48" y="376" class="n">修复与再验证</text><text x="48" y="408" class="s">原故障与边界条件复验</text><text x="48" y="436" class="s">对应PCB/BOM/固件版本</text></g><text x="32" y="544" class="s">单板演示通过不等于小批量、合规或量产验证已经完成。</text></svg>
