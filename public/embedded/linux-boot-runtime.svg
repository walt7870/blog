<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="580" viewBox="0 0 1120 580" role="img" aria-labelledby="linux-boot-runtime-t linux-boot-runtime-d"><title id="linux-boot-runtime-t">Linux网关先经历启动链，再运行服务</title><desc id="linux-boot-runtime-d">这是常见路径，实际SoC可能还有其他固件阶段。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#607568"/></marker><style>text{font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;letter-spacing:0;fill:#253c30}.h{font-size:28px;font-weight:600}.n{font-size:21px;font-weight:600}.s{font-size:18px;fill:#52685b}.node{fill:white;stroke:#a6b9ad;stroke-width:1.5}.focus{fill:#e9f4ee;stroke:#397657;stroke-width:1.5}.info{fill:#edf3fb;stroke:#739bbf;stroke-width:1.5}.edge{fill:none;stroke:#607568;stroke-width:2;marker-end:url(#a)}</style></defs><rect width="1120" height="580" fill="white"/><text x="32" y="44" class="h">Linux网关先经历启动链，再运行服务</text><text x="32" y="82" class="s">这是常见路径，实际SoC可能还有其他固件阶段。</text><path d="M336 192H408" class="edge"/><path d="M712 192H784" class="edge"/><path d="M936 252V344" class="edge"/><path d="M784 404H712" class="edge"/><path d="M408 404H336" class="edge"/><g data-node="ROM与早期启动"><rect x="32" y="132" width="304" height="120" rx="6" class="node"/><text x="48" y="164" class="n">ROM与早期启动</text><text x="48" y="196" class="s">选择介质、验证和加载</text><text x="48" y="224" class="s">具体流程由SoC规定</text></g><g data-node="SPL与U-Boot等"><rect x="408" y="132" width="304" height="120" rx="6" class="focus"/><text x="424" y="164" class="n">SPL与U-Boot等</text><text x="424" y="196" class="s">初始化DDR和启动策略</text><text x="424" y="224" class="s">地址与保留区不能照抄</text></g><g data-node="内核与设备树"><rect x="784" y="132" width="304" height="120" rx="6" class="node"/><text x="800" y="164" class="n">内核与设备树</text><text x="800" y="196" class="s">硬件描述、驱动与根盘</text><text x="800" y="224" class="s">DTB和内核版本需匹配</text></g><g data-node="根文件系统与PID1"><rect x="784" y="344" width="304" height="120" rx="6" class="node"/><text x="800" y="376" class="n">根文件系统与PID1</text><text x="800" y="408" class="s">只读系统与持久数据边界</text><text x="800" y="436" class="s">服务、权限与日志策略</text></g><g data-node="网关应用"><rect x="408" y="344" width="304" height="120" rx="6" class="info"/><text x="424" y="376" class="n">网关应用</text><text x="424" y="408" class="s">标准设备接口与网络</text><text x="424" y="436" class="s">错误、离线和容量限制</text></g><g data-node="更新与恢复"><rect x="32" y="344" width="304" height="120" rx="6" class="node"/><text x="48" y="376" class="n">更新与恢复</text><text x="48" y="408" class="s">候选、试启动、确认与回退</text><text x="48" y="436" class="s">共享数据需兼容旧系统</text></g><text x="32" y="544" class="s">设备节点出现不证明传感器正常，仍要核对绑定、供电与实际读取。</text></svg>
