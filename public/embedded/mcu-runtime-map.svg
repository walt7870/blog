<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="580" viewBox="0 0 1120 580" role="img" aria-labelledby="mcu-runtime-map-t mcu-runtime-map-d"><title id="mcu-runtime-map-t">时钟与数据从不同路径进入外设</title><desc id="mcu-runtime-map-d">示意关系不表示全部存储区都可被DMA访问。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#607568"/></marker><style>text{font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;letter-spacing:0;fill:#253c30}.h{font-size:28px;font-weight:600}.n{font-size:21px;font-weight:600}.s{font-size:18px;fill:#52685b}.node{fill:white;stroke:#a6b9ad;stroke-width:1.5}.focus{fill:#e9f4ee;stroke:#397657;stroke-width:1.5}.info{fill:#edf3fb;stroke:#739bbf;stroke-width:1.5}.edge{fill:none;stroke:#607568;stroke-width:2;marker-end:url(#a)}</style></defs><rect width="1120" height="580" fill="white"/><text x="32" y="44" class="h">时钟与数据从不同路径进入外设</text><text x="32" y="82" class="s">示意关系不表示全部存储区都可被DMA访问。</text><path d="M336 192H408" class="edge"/><path d="M712 192H784" class="edge"/><g data-node="时钟源与PLL"><rect x="32" y="132" width="304" height="120" rx="6" class="node"/><text x="48" y="164" class="n">时钟源与PLL</text><text x="48" y="196" class="s">外部或内部振荡器</text><text x="48" y="224" class="s">满足电压和频率上限</text></g><g data-node="总线分频与选择"><rect x="408" y="132" width="304" height="120" rx="6" class="focus"/><text x="424" y="164" class="n">总线分频与选择</text><text x="424" y="196" class="s">SYSCLK / HCLK / PCLK</text><text x="424" y="224" class="s">定时器倍频按器件核对</text></g><g data-node="外设工作时钟"><rect x="784" y="132" width="304" height="120" rx="6" class="node"/><text x="800" y="164" class="n">外设工作时钟</text><text x="800" y="196" class="s">决定UART、SPI与定时</text><text x="800" y="224" class="s">不是全部直接取CPU主频</text></g><path d="M336 404H408" class="edge"/><path d="M712 404H784" class="edge"/><g data-node="Flash与SRAM"><rect x="32" y="344" width="304" height="120" rx="6" class="node"/><text x="48" y="376" class="n">Flash与SRAM</text><text x="48" y="408" class="s">代码、数据、栈与缓冲区</text><text x="48" y="436" class="s">容量和区域按完整料号</text></g><g data-node="CPU与DMA主设备"><rect x="408" y="344" width="304" height="120" rx="6" class="info"/><text x="424" y="376" class="n">CPU与DMA主设备</text><text x="424" y="408" class="s">读取、计算与搬运</text><text x="424" y="436" class="s">中断通知与软件同步</text></g><g data-node="外设寄存器与引脚"><rect x="784" y="344" width="304" height="120" rx="6" class="node"/><text x="800" y="376" class="n">外设寄存器与引脚</text><text x="800" y="408" class="s">配置控制，数据流入流出</text><text x="800" y="436" class="s">复用、电平和错误状态</text></g><text x="32" y="544" class="s">上行为时钟配置链，下行为访问链；架构地址范围不是实际容量。</text></svg>
