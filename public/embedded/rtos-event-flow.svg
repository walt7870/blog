<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="580" viewBox="0 0 1120 580" role="img" aria-labelledby="rtos-event-flow-t rtos-event-flow-d"><title id="rtos-event-flow-t">采样ISR把数据交给有界队列</title><desc id="rtos-event-flow-d">高优先级任务必须有等待点，过载必须有明确策略。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#607568"/></marker><style>text{font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;letter-spacing:0;fill:#253c30}.h{font-size:28px;font-weight:600}.n{font-size:21px;font-weight:600}.s{font-size:18px;fill:#52685b}.node{fill:white;stroke:#a6b9ad;stroke-width:1.5}.focus{fill:#e9f4ee;stroke:#397657;stroke-width:1.5}.info{fill:#edf3fb;stroke:#739bbf;stroke-width:1.5}.edge{fill:none;stroke:#607568;stroke-width:2;marker-end:url(#a)}</style></defs><rect width="1120" height="580" fill="white"/><text x="32" y="44" class="h">采样ISR把数据交给有界队列</text><text x="32" y="82" class="s">高优先级任务必须有等待点，过载必须有明确策略。</text><path d="M336 192H408" class="edge"/><path d="M712 192H784" class="edge"/><path d="M936 252V344" class="edge"/><path d="M784 404H712" class="edge"/><path d="M408 404H336" class="edge"/><g data-node="外设事件"><rect x="32" y="132" width="304" height="120" rx="6" class="node"/><text x="48" y="164" class="n">外设事件</text><text x="48" y="196" class="s">采样或接收就绪</text><text x="48" y="224" class="s">按手册读数据与清状态</text></g><g data-node="ISR最小处理"><rect x="408" y="132" width="304" height="120" rx="6" class="focus"/><text x="424" y="164" class="n">ISR最小处理</text><text x="424" y="196" class="s">仅在允许优先级用FromISR</text><text x="424" y="224" class="s">记录队列满与必要唤醒</text></g><g data-node="有界队列"><rect x="784" y="132" width="304" height="120" rx="6" class="node"/><text x="800" y="164" class="n">有界队列</text><text x="800" y="196" class="s">复制值或移交明确所有权</text><text x="800" y="224" class="s">元素复制不等于复制对象</text></g><g data-node="处理任务"><rect x="784" y="344" width="304" height="120" rx="6" class="node"/><text x="800" y="376" class="n">处理任务</text><text x="800" y="408" class="s">阻塞等事件，再做解析</text><text x="800" y="436" class="s">记录耗时与截止期</text></g><g data-node="业务与通信队列"><rect x="408" y="344" width="304" height="120" rx="6" class="info"/><text x="424" y="376" class="n">业务与通信队列</text><text x="424" y="408" class="s">控制优先，网络等待可隔离</text><text x="424" y="436" class="s">长期消费不足需限流</text></g><g data-node="监督与证据"><rect x="32" y="344" width="304" height="120" rx="6" class="node"/><text x="48" y="376" class="n">监督与证据</text><text x="48" y="408" class="s">队列峰值、延迟和栈余量</text><text x="48" y="436" class="s">关键任务推进后才喂狗</text></g><text x="32" y="544" class="s">单独喂狗任务继续运行，不能证明其他关键任务健康。</text></svg>
