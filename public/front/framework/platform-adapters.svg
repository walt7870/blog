<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="688" viewBox="0 0 1120 688" role="img" aria-labelledby="platform-adapters-title platform-adapters-desc"><title id="platform-adapters-title">跨端共享业务，平台适配器承担设备合同</title><desc id="platform-adapters-desc">录音备注：统一业务状态，分端处理权限、设备会话、文件与中断。</desc><defs><marker id="platform-adapters-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#607568"/></marker><style>text{font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;letter-spacing:0;fill:#253c30}.h{font-size:28px;font-weight:600}.n{font-size:21px;font-weight:600}.s{font-size:18px;fill:#52685b}.node{fill:white;stroke:#a6b9ad;stroke-width:1.5}.info{fill:#edf3fb;stroke:#739bbf;stroke-width:1.5}.good{fill:#e9f4ee;stroke:#397657;stroke-width:1.5}.edge{fill:none;stroke:#607568;stroke-width:2;marker-end:url(#platform-adapters-arrow)}</style></defs><rect width="1120" height="688" fill="white"/><text x="32" y="44" class="h">跨端共享业务，平台适配器承担设备合同</text><text x="32" y="82" class="s">录音备注：统一业务状态，分端处理权限、设备会话、文件与中断。</text><path d="M336 208H408" class="edge"/><path d="M712 208H784" class="edge"/><path d="M936 280V376" class="edge"/><path d="M784 440H712" class="edge"/><path d="M408 440H336" class="edge"/><g data-node="共享备注业务"><rect x="32" y="144" width="304" height="136" rx="6" class="node"/><text x="50" y="176" class="n">共享备注业务</text><text x="50" y="206" class="s">草稿、时长、订单状态</text><text x="50" y="233" class="s">发出录制或停止意图</text></g><g data-node="对应平台适配器"><rect x="408" y="144" width="304" height="136" rx="6" class="info"/><text x="426" y="176" class="n">对应平台适配器</text><text x="426" y="206" class="s">申请权限、启动会话</text><text x="426" y="233" class="s">浏览器或原生插件</text></g><g data-node="设备与系统"><rect x="784" y="144" width="304" height="136" rx="6" class="node"/><text x="802" y="176" class="n">设备与系统</text><text x="802" y="206" class="s">麦克风、来电、后台</text><text x="802" y="233" class="s">文件位置与访问期限</text></g><g data-node="平台结果归一化"><rect x="784" y="376" width="304" height="136" rx="6" class="node"/><text x="802" y="408" class="n">平台结果归一化</text><text x="802" y="438" class="s">完成 / 拒绝 / 中断</text><text x="802" y="465" class="s">返回音频句柄或错误</text></g><g data-node="草稿与上传恢复"><rect x="408" y="376" width="304" height="136" rx="6" class="good"/><text x="426" y="408" class="n">草稿与上传恢复</text><text x="426" y="438" class="s">保留可重试的数据</text><text x="426" y="465" class="s">提交后读取服务器结果</text></g><g data-node="共享业务更新界面"><rect x="32" y="376" width="304" height="136" rx="6" class="node"/><text x="50" y="408" class="n">共享业务更新界面</text><text x="50" y="438" class="s">拒绝时仍可文字输入</text><text x="50" y="465" class="s">中断不当作录制成功</text></g><text x="32" y="650" class="s">每端独立验证权限、文件有效期与审核交付；模拟器通过不能替代真机设备验收。</text></svg>
