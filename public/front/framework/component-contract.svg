<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="688" viewBox="0 0 1120 688" role="img" aria-labelledby="component-contract-title component-contract-desc"><title id="component-contract-title">跨框架组件通过明确合同连接宿主页面</title><desc id="component-contract-desc">库存组件报告补货意图，真正的业务写入由应用处理。</desc><defs><marker id="component-contract-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#607568"/></marker><style>text{font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;letter-spacing:0;fill:#253c30}.h{font-size:28px;font-weight:600}.n{font-size:21px;font-weight:600}.s{font-size:18px;fill:#52685b}.node{fill:white;stroke:#a6b9ad;stroke-width:1.5}.info{fill:#edf3fb;stroke:#739bbf;stroke-width:1.5}.good{fill:#e9f4ee;stroke:#397657;stroke-width:1.5}.edge{fill:none;stroke:#607568;stroke-width:2;marker-end:url(#component-contract-arrow)}</style></defs><rect width="1120" height="688" fill="white"/><text x="32" y="44" class="h">跨框架组件通过明确合同连接宿主页面</text><text x="32" y="82" class="s">库存组件报告补货意图，真正的业务写入由应用处理。</text><path d="M336 190H408" class="edge"/><path d="M712 230H784" class="edge"/><g data-node="宿主应用"><rect x="32" y="144" width="304" height="136" rx="6" class="node"/><text x="50" y="176" class="n">宿主应用</text><text x="50" y="206" class="s">React / Vue / 原生页面</text><text x="50" y="233" class="s">写入available属性</text></g><g data-node="stock-status组件"><rect x="408" y="144" width="304" height="136" rx="6" class="info"/><text x="426" y="176" class="n">stock-status组件</text><text x="426" y="206" class="s">解析库存与更新显示</text><text x="426" y="233" class="s">内部按钮与键盘交互</text></g><g data-node="应用事件处理器"><rect x="784" y="144" width="304" height="136" rx="6" class="good"/><text x="802" y="176" class="n">应用事件处理器</text><text x="802" y="206" class="s">接收restock-request</text><text x="802" y="233" class="s">验证后调用补货API</text></g><g data-node="属性与事件合同"><rect x="32" y="376" width="512" height="136" rx="6" class="node"/><text x="50" y="408" class="n">属性与事件合同</text><text x="50" y="438" class="s">字符串属性与对象property分别设计</text><text x="50" y="465" class="s">冒泡、跨Shadow边界与事件命名需验证</text></g><g data-node="样式与集成合同"><rect x="576" y="376" width="512" height="136" rx="6" class="node"/><text x="594" y="408" class="n">样式与集成合同</text><text x="594" y="438" class="s">CSS变量、slot、焦点与主题入口</text><text x="594" y="465" class="s">表单关联和SSR并非自动完成</text></g><text x="32" y="650" class="s">Shadow DOM封装样式，不是秘密数据的安全边界；轻量收益需要在实际依赖组合中量测。</text></svg>
