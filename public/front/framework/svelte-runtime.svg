<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="688" viewBox="0 0 1120 688" role="img" aria-labelledby="svelte-runtime-title svelte-runtime-desc"><title id="svelte-runtime-title">Svelte编译组件，运行时跟踪状态依赖</title><desc id="svelte-runtime-desc">编译产物仍包含运行时能力；派生计算与外部同步各有职责。</desc><defs><marker id="svelte-runtime-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#607568"/></marker><style>text{font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;letter-spacing:0;fill:#253c30}.h{font-size:28px;font-weight:600}.n{font-size:21px;font-weight:600}.s{font-size:18px;fill:#52685b}.node{fill:white;stroke:#a6b9ad;stroke-width:1.5}.info{fill:#edf3fb;stroke:#739bbf;stroke-width:1.5}.good{fill:#e9f4ee;stroke:#397657;stroke-width:1.5}.edge{fill:none;stroke:#607568;stroke-width:2;marker-end:url(#svelte-runtime-arrow)}</style></defs><rect width="1120" height="688" fill="white"/><text x="32" y="44" class="h">Svelte编译组件，运行时跟踪状态依赖</text><text x="32" y="82" class="s">编译产物仍包含运行时能力；派生计算与外部同步各有职责。</text><path d="M336 208H408" class="edge"/><path d="M712 208H784" class="edge"/><path d="M936 280V376" class="edge"/><path d="M784 440H712" class="edge"/><path d="M408 440H336" class="edge"/><g data-node="组件源码"><rect x="32" y="144" width="304" height="136" rx="6" class="node"/><text x="50" y="176" class="n">组件源码</text><text x="50" y="206" class="s">$state / $derived</text><text x="50" y="233" class="s">模板、事件、样式</text></g><g data-node="Svelte编译器"><rect x="408" y="144" width="304" height="136" rx="6" class="info"/><text x="426" y="176" class="n">Svelte编译器</text><text x="426" y="206" class="s">识别runes并生成代码</text><text x="426" y="233" class="s">浏览器与服务端目标不同</text></g><g data-node="浏览器组件实例"><rect x="784" y="144" width="304" height="136" rx="6" class="node"/><text x="802" y="176" class="n">浏览器组件实例</text><text x="802" y="206" class="s">初始化状态与DOM</text><text x="802" y="233" class="s">注册事件与依赖</text></g><g data-node="事件改变数量"><rect x="784" y="376" width="304" height="136" rx="6" class="node"/><text x="802" y="408" class="n">事件改变数量</text><text x="802" y="438" class="s">状态1 → 2</text><text x="802" y="465" class="s">清除已确认报价</text></g><g data-node="派生金额并更新DOM"><rect x="408" y="376" width="304" height="136" rx="6" class="good"/><text x="426" y="408" class="n">派生金额并更新DOM</text><text x="426" y="438" class="s">1990分 → 3980分</text><text x="426" y="465" class="s">运行时按依赖传播</text></g><g data-node="外部同步另有生命周期"><rect x="32" y="376" width="304" height="136" rx="6" class="node"/><text x="50" y="408" class="n">外部同步另有生命周期</text><text x="50" y="438" class="s">Effect重运行前清理</text><text x="50" y="465" class="s">销毁时释放监听与定时器</text></g><text x="32" y="650" class="s">SSR不执行onMount；用户状态不放进跨请求共享的模块级可变单例。</text></svg>
