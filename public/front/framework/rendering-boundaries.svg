<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="688" viewBox="0 0 1120 688" role="img" aria-labelledby="rendering-boundaries-title rendering-boundaries-desc"><title id="rendering-boundaries-title">页面按数据的新鲜度与身份边界选择渲染方式</title><desc id="rendering-boundaries-desc">公开介绍可预生成；动态订单要在受鉴权的运行环境读取，交互仍发生在浏览器。</desc><defs><marker id="rendering-boundaries-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#607568"/></marker><style>text{font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;letter-spacing:0;fill:#253c30}.h{font-size:28px;font-weight:600}.n{font-size:21px;font-weight:600}.s{font-size:18px;fill:#52685b}.node{fill:white;stroke:#a6b9ad;stroke-width:1.5}.info{fill:#edf3fb;stroke:#739bbf;stroke-width:1.5}.good{fill:#e9f4ee;stroke:#397657;stroke-width:1.5}.edge{fill:none;stroke:#607568;stroke-width:2;marker-end:url(#rendering-boundaries-arrow)}</style></defs><rect width="1120" height="688" fill="white"/><text x="32" y="44" class="h">页面按数据的新鲜度与身份边界选择渲染方式</text><text x="32" y="82" class="s">公开介绍可预生成；动态订单要在受鉴权的运行环境读取，交互仍发生在浏览器。</text><path d="M336 208H408" class="edge"/><path d="M712 208H784" class="edge"/><path d="M336 440H408" class="edge"/><path d="M712 440H784" class="edge"/><g data-node="构建时读取公开内容"><rect x="32" y="144" width="304" height="136" rx="6" class="node"/><text x="50" y="176" class="n">构建时读取公开内容</text><text x="50" y="206" class="s">商品图文与文档</text><text x="50" y="233" class="s">数据变更触发重建</text></g><g data-node="预生成HTML与资源"><rect x="408" y="144" width="304" height="136" rx="6" class="good"/><text x="426" y="176" class="n">预生成HTML与资源</text><text x="426" y="206" class="s">静态服务器或CDN</text><text x="426" y="233" class="s">可公共缓存</text></g><g data-node="浏览器读取与交互"><rect x="784" y="144" width="304" height="136" rx="6" class="node"/><text x="802" y="176" class="n">浏览器读取与交互</text><text x="802" y="206" class="s">接收HTML与所需脚本</text><text x="802" y="233" class="s">数量、草稿与局部激活</text></g><g data-node="请求携带访问者身份"><rect x="32" y="376" width="304" height="136" rx="6" class="node"/><text x="50" y="408" class="n">请求携带访问者身份</text><text x="50" y="438" class="s">登录后的订单URL</text><text x="50" y="465" class="s">服务器验证授权</text></g><g data-node="SSR或受保护API"><rect x="408" y="376" width="304" height="136" rx="6" class="info"/><text x="426" y="408" class="n">SSR或受保护API</text><text x="426" y="438" class="s">按身份查询与缓存隔离</text><text x="426" y="465" class="s">需要实际请求运行时</text></g><g data-node="当前访问者的结果"><rect x="784" y="376" width="304" height="136" rx="6" class="node"/><text x="802" y="408" class="n">当前访问者的结果</text><text x="802" y="438" class="s">请求失败有恢复入口</text><text x="802" y="465" class="s">不能误用他人缓存HTML</text></g><text x="32" y="650" class="s">初始HTML、脚本激活、数据请求和CDN缓存是不同环节，SSR不自动保证首屏更快。</text></svg>
