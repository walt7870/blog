<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="832" viewBox="0 0 1120 832" role="img" aria-labelledby="ep24-title ep24-desc"><title id="ep24-title">生成HTML与激活交互是两个维度</title><desc id="ep24-desc">CSR、SSR、SSG比较生成位置与时机；Islands可以结合SSR或SSG。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#607568"/></marker><style>text{font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;letter-spacing:0;fill:#253c30}.h{font-size:28px;font-weight:600}.n{font-size:21px;font-weight:600}.s{font-size:18px;fill:#52685b}.node{fill:#fff;stroke:#a6b9ad;stroke-width:1.5}.info{fill:#edf3fb;stroke:#739bbf;stroke-width:1.5}.good{fill:#e9f4ee;stroke:#397657;stroke-width:1.5}.warn{fill:#f8eef1;stroke:#ae7789;stroke-width:1.5}.edge{fill:none;stroke:#607568;stroke-width:2;marker-end:url(#arrow)}</style></defs><rect width="1120" height="832" fill="white"/><text x="32" y="44" class="h">生成HTML与激活交互是两个维度</text><text x="32" y="82" class="s">CSR、SSR、SSG比较生成位置与时机；Islands可以结合SSR或SSG。</text><path d="M184 272V376" class="edge"/><path d="M560 272V376" class="edge"/><path d="M936 272V376" class="edge"/><g data-node="CSR：浏览器生成"><rect x="32" y="144" width="304" height="128" rx="6" class="node"/><text x="50" y="176" class="n">CSR：浏览器生成</text><text x="50" y="206" class="s">基础HTML、脚本与数据</text><text x="50" y="233" class="s">客户端产生主要内容</text></g><g data-node="SSR：请求时生成"><rect x="408" y="144" width="304" height="128" rx="6" class="info"/><text x="426" y="176" class="n">SSR：请求时生成</text><text x="426" y="206" class="s">服务器读取所需数据</text><text x="426" y="233" class="s">返回内容HTML</text></g><g data-node="SSG：构建时生成"><rect x="784" y="144" width="304" height="128" rx="6" class="node"/><text x="802" y="176" class="n">SSG：构建时生成</text><text x="802" y="206" class="s">预生成内容HTML</text><text x="802" y="233" class="s">部署到静态分发层</text></g><g data-node="客户端界面与交互"><rect x="32" y="376" width="304" height="128" rx="6" class="node"/><text x="50" y="408" class="n">客户端界面与交互</text><text x="50" y="438" class="s">等待必要脚本和数据</text><text x="50" y="465" class="s">原生HTML行为可先存在</text></g><g data-node="按需求hydration"><rect x="408" y="376" width="304" height="128" rx="6" class="node"/><text x="426" y="408" class="n">按需求hydration</text><text x="426" y="438" class="s">复用已有DOM、建立关系</text><text x="426" y="465" class="s">初始数据应保持一致</text></g><g data-node="可静态阅读或激活"><rect x="784" y="376" width="304" height="128" rx="6" class="node"/><text x="802" y="408" class="n">可静态阅读或激活</text><text x="802" y="438" class="s">无需交互则不必接管</text><text x="802" y="465" class="s">有交互区域加载对应代码</text></g><g data-node="Islands：只激活需要交互的区域"><rect x="32" y="608" width="1056" height="112" rx="6" class="good"/><text x="50" y="640" class="n">Islands：只激活需要交互的区域</text><text x="50" y="670" class="s">正文静态，搜索与购物车按策略激活；共享状态与首次操作延迟仍需设计</text></g><text x="32" y="804" class="s">服务器状态按请求隔离；公开内容缓存与用户私有数据缓存必须分开。</text></svg>
