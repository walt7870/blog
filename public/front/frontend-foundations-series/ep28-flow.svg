<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="808" viewBox="0 0 1120 808" role="img" aria-labelledby="ep28-title ep28-desc"><title id="ep28-title">不同输入沿不同权限边界处理</title><desc id="ep28-desc">内容渲染、会话写入与构建安装不是一条顺序执行的安全流水线。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#607568"/></marker><style>text{font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;letter-spacing:0;fill:#253c30}.h{font-size:28px;font-weight:600}.n{font-size:21px;font-weight:600}.s{font-size:18px;fill:#52685b}.node{fill:#fff;stroke:#a6b9ad;stroke-width:1.5}.info{fill:#edf3fb;stroke:#739bbf;stroke-width:1.5}.good{fill:#e9f4ee;stroke:#397657;stroke-width:1.5}.warn{fill:#f8eef1;stroke:#ae7789;stroke-width:1.5}.edge{fill:none;stroke:#607568;stroke-width:2;marker-end:url(#arrow)}</style></defs><rect width="1120" height="808" fill="white"/><text x="32" y="44" class="h">不同输入沿不同权限边界处理</text><text x="32" y="82" class="s">内容渲染、会话写入与构建安装不是一条顺序执行的安全流水线。</text><path d="M336 208H408" class="edge"/><path d="M712 208H784" class="edge"/><path d="M336 440H408" class="edge"/><path d="M712 440H784" class="edge"/><g data-node="不可信商品名称"><rect x="32" y="144" width="304" height="128" rx="6" class="node"/><text x="50" y="176" class="n">不可信商品名称</text><text x="50" y="206" class="s">接口、存储或用户输入</text></g><g data-node="按内容用途处理"><rect x="408" y="144" width="304" height="128" rx="6" class="info"/><text x="426" y="176" class="n">按内容用途处理</text><text x="426" y="206" class="s">文本插值 / textContent</text><text x="426" y="233" class="s">富文本用受控清洗</text></g><g data-node="页面显示"><rect x="784" y="144" width="304" height="128" rx="6" class="node"/><text x="802" y="176" class="n">页面显示</text><text x="802" y="206" class="s">CSP作为补充约束</text><text x="802" y="233" class="s">HttpOnly不阻止所有动作</text></g><g data-node="带会话的写请求"><rect x="32" y="376" width="304" height="128" rx="6" class="node"/><text x="50" y="408" class="n">带会话的写请求</text><text x="50" y="438" class="s">浏览器可能自动带凭据</text></g><g data-node="服务端验证"><rect x="408" y="376" width="304" height="128" rx="6" class="good"/><text x="426" y="408" class="n">服务端验证</text><text x="426" y="438" class="s">身份、权限、token与来源</text><text x="426" y="465" class="s">SameSite与同源需区分</text></g><g data-node="授权后修改业务"><rect x="784" y="376" width="304" height="128" rx="6" class="node"/><text x="802" y="408" class="n">授权后修改业务</text><text x="802" y="438" class="s">失败应拒绝动作</text><text x="802" y="465" class="s">CORS不代替CSRF防护</text></g><g data-node="构建安装边界：包与生命周期脚本也能执行代码"><rect x="32" y="608" width="1056" height="104" rx="6" class="node"/><text x="50" y="640" class="n">构建安装边界：包与生命周期脚本也能执行代码</text><text x="50" y="670" class="s">审查依赖和锁文件、限制CI权限；完整性和无告警都不证明完全安全</text></g><text x="32" y="780" class="s">凭据不进入客户端构建变量或监控正文；策略先匹配真实资源再部署。</text></svg>
