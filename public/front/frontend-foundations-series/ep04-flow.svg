<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="608" viewBox="0 0 1120 608" role="img" aria-labelledby="title desc"><title id="title">先按现象选择证据，再追到代码</title><desc id="desc">面板是不同观察入口；并非每次都从Elements依次走到Performance。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#607568"/></marker><style>text{font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;letter-spacing:0;fill:#253c30}.h{font-size:28px;font-weight:600}.n{font-size:21px;font-weight:600}.s{font-size:18px;fill:#52685b}.node{fill:#fff;stroke:#a6b9ad;stroke-width:1.5}.info{fill:#edf3fb;stroke:#739bbf;stroke-width:1.5}.good{fill:#e9f4ee;stroke:#397657;stroke-width:1.5}.warn{fill:#f8eef1;stroke:#ae7789;stroke-width:1.5}.edge{fill:none;stroke:#607568;stroke-width:2;marker-end:url(#arrow)}</style></defs><rect width="1120" height="608" fill="white"/><text x="32" y="44" class="h">先按现象选择证据，再追到代码</text><text x="32" y="82" class="s">面板是不同观察入口；并非每次都从Elements依次走到Performance。</text><path d="M376 184H488" class="edge"/><path d="M376 296H488" class="edge"/><path d="M376 408H488" class="edge"/><g data-node="看不到按钮"><rect x="32" y="136" width="344" height="88" rx="6" class="node"/><text x="50" y="168" class="n">看不到按钮</text><text x="50" y="198" class="s">区分节点缺失与视觉隐藏</text></g><g data-node="Elements / Computed"><rect x="488" y="136" width="600" height="88" rx="6" class="info"/><text x="506" y="168" class="n">Elements / Computed</text><text x="506" y="198" class="s">DOM、最终样式、盒模型与遮挡</text></g><g data-node="点击或请求失败"><rect x="32" y="248" width="344" height="88" rx="6" class="node"/><text x="50" y="280" class="n">点击或请求失败</text><text x="50" y="310" class="s">确认事件与网络是否发生</text></g><g data-node="Console / Sources / Network"><rect x="488" y="248" width="600" height="88" rx="6" class="node"/><text x="506" y="280" class="n">Console / Sources / Network</text><text x="506" y="310" class="s">异常与断点输入；URL、状态码与响应合同</text></g><g data-node="响应完成仍卡顿"><rect x="32" y="360" width="344" height="88" rx="6" class="node"/><text x="50" y="392" class="n">响应完成仍卡顿</text><text x="50" y="422" class="s">固定数据量与复现条件</text></g><g data-node="Performance"><rect x="488" y="360" width="600" height="88" rx="6" class="node"/><text x="506" y="392" class="n">Performance</text><text x="506" y="422" class="s">主线程长任务、布局、绘制与交互时间</text></g><text x="32" y="580" class="s">每条分支都需要复现 → 保留证据 → 修改源码 → 同条件验收。</text></svg>
