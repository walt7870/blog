<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="656" viewBox="0 0 1120 656" role="img" aria-labelledby="title desc"><title id="title">请求、HTTP、解析与合同分别判断</title><desc id="desc">响应头就绪后还要消费响应体；只有全部满足才把items交给当前页面。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#607568"/></marker><style>text{font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;letter-spacing:0;fill:#253c30}.h{font-size:28px;font-weight:600}.n{font-size:21px;font-weight:600}.s{font-size:18px;fill:#52685b}.node{fill:#fff;stroke:#a6b9ad;stroke-width:1.5}.info{fill:#edf3fb;stroke:#739bbf;stroke-width:1.5}.good{fill:#e9f4ee;stroke:#397657;stroke-width:1.5}.warn{fill:#f8eef1;stroke:#ae7789;stroke-width:1.5}.edge{fill:none;stroke:#607568;stroke-width:2;marker-end:url(#arrow)}</style></defs><rect width="1120" height="656" fill="white"/><text x="32" y="44" class="h">请求、HTTP、解析与合同分别判断</text><text x="32" y="82" class="s">响应头就绪后还要消费响应体；只有全部满足才把items交给当前页面。</text><path d="M272 208H304" class="edge"/><path d="M544 208H576" class="edge"/><path d="M816 208H848" class="edge"/><g data-node="fetch Request"><rect x="32" y="144" width="240" height="136" rx="6" class="node"/><text x="50" y="176" class="n">fetch Request</text><text x="50" y="206" class="s">URL / headers / signal</text><text x="50" y="233" class="s">网络、CORS与取消</text></g><g data-node="HTTP Response"><rect x="304" y="144" width="240" height="136" rx="6" class="info"/><text x="322" y="176" class="n">HTTP Response</text><text x="322" y="206" class="s">检查ok与Content-Type</text><text x="322" y="233" class="s">404/500不自动reject</text></g><g data-node="读取响应体"><rect x="576" y="144" width="240" height="136" rx="6" class="node"/><text x="594" y="176" class="n">读取响应体</text><text x="594" y="206" class="s">JSON可能解析失败</text><text x="594" y="233" class="s">空204不能直接json()</text></g><g data-node="验证字段合同"><rect x="848" y="144" width="240" height="136" rx="6" class="good"/><text x="866" y="176" class="n">验证字段合同</text><text x="866" y="206" class="s">items及id/name</text><text x="866" y="233" class="s">只渲染最新版本</text></g><g data-node="每一层都有独立失败结果，界面恢复加载状态并显示准确原因"><rect x="32" y="392" width="1056" height="112" rx="6" class="node"/><text x="50" y="424" class="n">每一层都有独立失败结果，界面恢复加载状态并显示准确原因</text><text x="50" y="454" class="s">取消旧请求加结果版本校验；取消客户端等待不保证服务端写操作未发生</text></g><text x="32" y="628" class="s">CORS决定浏览器读取权限，不代替身份认证；Node请求通过不能证明浏览器跨源通过。</text></svg>
