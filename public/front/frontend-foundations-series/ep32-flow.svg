<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="752" viewBox="0 0 1120 752" role="img" aria-labelledby="ep32-title ep32-desc"><title id="ep32-title">Vue分别组织派生计算与外部查询</title><desc id="ep32-desc">读取时收集实际依赖；状态变化后使结果失效并调度相关消费者。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#607568"/></marker><style>text{font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;letter-spacing:0;fill:#253c30}.h{font-size:28px;font-weight:600}.n{font-size:21px;font-weight:600}.s{font-size:18px;fill:#52685b}.node{fill:#fff;stroke:#a6b9ad;stroke-width:1.5}.info{fill:#edf3fb;stroke:#739bbf;stroke-width:1.5}.good{fill:#e9f4ee;stroke:#397657;stroke-width:1.5}.warn{fill:#f8eef1;stroke:#ae7789;stroke-width:1.5}.edge{fill:none;stroke:#607568;stroke-width:2;marker-end:url(#arrow)}</style></defs><rect width="1120" height="752" fill="white"/><text x="32" y="44" class="h">Vue分别组织派生计算与外部查询</text><text x="32" y="82" class="s">读取时收集实际依赖；状态变化后使结果失效并调度相关消费者。</text><path d="M336 208H408" class="edge"/><path d="M712 208H784" class="edge"/><path d="M336 448H408" class="edge"/><path d="M712 448H784" class="edge"/><g data-node="ref / reactive"><rect x="32" y="144" width="304" height="136" rx="6" class="node"/><text x="50" y="176" class="n">ref / reactive</text><text x="50" y="206" class="s">关键字、库存筛选</text><text x="50" y="233" class="s">读写经过响应式入口</text></g><g data-node="computed派生列表"><rect x="408" y="144" width="304" height="136" rx="6" class="info"/><text x="426" y="176" class="n">computed派生列表</text><text x="426" y="206" class="s">执行时读取并追踪</text><text x="426" y="233" class="s">依赖变了使缓存失效</text></g><g data-node="组件渲染与DOM"><rect x="784" y="144" width="304" height="136" rx="6" class="good"/><text x="802" y="176" class="n">组件渲染与DOM</text><text x="802" y="206" class="s">渲染读取派生结果</text><text x="802" y="233" class="s">调度、patch与nextTick</text></g><g data-node="watch显式来源"><rect x="32" y="384" width="304" height="136" rx="6" class="node"/><text x="50" y="416" class="n">watch显式来源</text><text x="50" y="446" class="s">关键字变化启动查询</text><text x="50" y="473" class="s">与本地computed分工</text></g><g data-node="清理旧查询"><rect x="408" y="384" width="304" height="136" rx="6" class="node"/><text x="426" y="416" class="n">清理旧查询</text><text x="426" y="446" class="s">active = false</text><text x="426" y="473" class="s">abort客户端等待</text></g><g data-node="新查询结果"><rect x="784" y="384" width="304" height="136" rx="6" class="node"/><text x="802" y="416" class="n">新查询结果</text><text x="802" y="446" class="s">HTTP与字段合同通过</text><text x="802" y="473" class="s">active才写入页面</text></g><text x="32" y="696" class="s">上排为本地筛选；下排为接口查询，二者不是必须依次执行的一条流水线。</text><text x="32" y="724" class="s">setup内同步创建的watcher随组件停止；nextTick不代表图片加载或浏览器绘制完成。</text></svg>
