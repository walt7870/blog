<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="760" viewBox="0 0 1120 760" role="img" aria-labelledby="ep22-title ep22-desc"><title id="ep22-title">数量由父级拥有，总价从事实推导</title><desc id="ep22-desc">子组件提出修改意图；父级接受后重新传入，避免复制出第二份业务事实。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#607568"/></marker><style>text{font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;letter-spacing:0;fill:#253c30}.h{font-size:28px;font-weight:600}.n{font-size:21px;font-weight:600}.s{font-size:18px;fill:#52685b}.node{fill:#fff;stroke:#a6b9ad;stroke-width:1.5}.info{fill:#edf3fb;stroke:#739bbf;stroke-width:1.5}.good{fill:#e9f4ee;stroke:#397657;stroke-width:1.5}.warn{fill:#f8eef1;stroke:#ae7789;stroke-width:1.5}.edge{fill:none;stroke:#607568;stroke-width:2;marker-end:url(#arrow)}</style></defs><rect width="1120" height="760" fill="white"/><text x="32" y="44" class="h">数量由父级拥有，总价从事实推导</text><text x="32" y="82" class="s">子组件提出修改意图；父级接受后重新传入，避免复制出第二份业务事实。</text><path d="M336 224H456" class="edge"/><path d="M760 224H880" class="edge"/><path d="M984 304V464Q984 472 976 472H904" class="edge"/><path d="M608 304V408" class="edge"/><path d="M456 472H392Q384 472 384 464V288Q384 280 376 280H336" class="edge"/><g data-node="购物车页状态"><rect x="32" y="144" width="304" height="160" rx="6" class="info"/><text x="50" y="176" class="n">购物车页状态</text><text x="50" y="206" class="s">quantity=1 / max=5</text><text x="50" y="233" class="s">单价1290分</text><text x="50" y="260" class="s">total由单价×数量推导</text></g><g data-node="数量组件props"><rect x="456" y="144" width="304" height="160" rx="6" class="node"/><text x="474" y="176" class="n">数量组件props</text><text x="474" y="206" class="s">读取quantity与max</text><text x="474" y="233" class="s">显示数量和禁用状态</text><text x="474" y="260" class="s">不直接修改父级事实</text></g><g data-node="用户点击"><rect x="880" y="144" width="208" height="160" rx="6" class="node"/><text x="898" y="176" class="n">用户点击</text><text x="898" y="206" class="s">增加数量</text><text x="898" y="233" class="s">达到5后禁用</text></g><g data-node="change事件：提出next数量"><rect x="456" y="408" width="448" height="128" rx="6" class="good"/><text x="474" y="440" class="n">change事件：提出next数量</text><text x="474" y="470" class="s">父级校验并决定接受或拒绝</text><text x="474" y="497" class="s">接受后状态变化，界面安排更新</text></g><text x="32" y="620" class="s">渲染计算、DOM提交与浏览器绘制是不同时间点。</text><text x="32" y="732" class="s">服务端仍在提交时判断库存；列表key、外部订阅清理和请求竞态需要独立验收。</text></svg>
