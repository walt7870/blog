<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="640" viewBox="0 0 1120 640" role="img" aria-labelledby="title desc"><title id="title">按职责选择存储，不把容量当唯一标准</title><desc id="desc">浏览器可清理或限制存储；重要数据需要同步、备份或导出恢复路径。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#607568"/></marker><style>text{font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;letter-spacing:0;fill:#253c30}.h{font-size:28px;font-weight:600}.n{font-size:21px;font-weight:600}.s{font-size:18px;fill:#52685b}.node{fill:#fff;stroke:#a6b9ad;stroke-width:1.5}.info{fill:#edf3fb;stroke:#739bbf;stroke-width:1.5}.good{fill:#e9f4ee;stroke:#397657;stroke-width:1.5}.warn{fill:#f8eef1;stroke:#ae7789;stroke-width:1.5}.edge{fill:none;stroke:#607568;stroke-width:2;marker-end:url(#arrow)}</style></defs><rect width="1120" height="640" fill="white"/><text x="32" y="44" class="h">按职责选择存储，不把容量当唯一标准</text><text x="32" y="82" class="s">浏览器可清理或限制存储；重要数据需要同步、备份或导出恢复路径。</text><g data-node="会话标识 → Cookie"><rect x="32" y="144" width="512" height="136" rx="6" class="info"/><text x="50" y="176" class="n">会话标识 → Cookie</text><text x="50" y="206" class="s">按域、路径、SameSite与凭据条件发送</text><text x="50" y="233" class="s">HttpOnly不等于XSS无法发起动作</text></g><g data-node="少量偏好 → Web Storage"><rect x="576" y="144" width="512" height="136" rx="6" class="node"/><text x="594" y="176" class="n">少量偏好 → Web Storage</text><text x="594" y="206" class="s">同步字符串存取；JSON与版本要校验</text><text x="594" y="233" class="s">sessionStorage另受标签页上下文限制</text></g><g data-node="结构化草稿 → IndexedDB"><rect x="32" y="352" width="512" height="136" rx="6" class="good"/><text x="50" y="384" class="n">结构化草稿 → IndexedDB</text><text x="50" y="414" class="s">对象仓库、索引和事务</text><text x="50" y="441" class="s">事务complete才作为提交结果</text></g><g data-node="请求响应 → Cache API"><rect x="576" y="352" width="512" height="136" rx="6" class="node"/><text x="594" y="384" class="n">请求响应 → Cache API</text><text x="594" y="414" class="s">显式读取、更新与淘汰</text><text x="594" y="441" class="s">不是自动遵循过期头的HTTP缓存</text></g><text x="32" y="612" class="s">退出按账户清理必要数据；例子只操作自己的命名键，不使用localStorage.clear。</text></svg>
