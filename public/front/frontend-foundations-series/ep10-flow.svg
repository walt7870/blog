<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="696" viewBox="0 0 1120 696" role="img" aria-labelledby="title desc"><title id="title">出错后，用户应能理解并恢复操作</title><desc id="desc">本地输入检查与服务端保存结果分开；语义属性检查不能替代真实读屏验收。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#607568"/></marker><style>text{font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;letter-spacing:0;fill:#253c30}.h{font-size:28px;font-weight:600}.n{font-size:21px;font-weight:600}.s{font-size:18px;fill:#52685b}.node{fill:#fff;stroke:#a6b9ad;stroke-width:1.5}.info{fill:#edf3fb;stroke:#739bbf;stroke-width:1.5}.good{fill:#e9f4ee;stroke:#397657;stroke-width:1.5}.warn{fill:#f8eef1;stroke:#ae7789;stroke-width:1.5}.edge{fill:none;stroke:#607568;stroke-width:2;marker-end:url(#arrow)}</style></defs><rect width="1120" height="696" fill="white"/><text x="32" y="44" class="h">出错后，用户应能理解并恢复操作</text><text x="32" y="82" class="s">本地输入检查与服务端保存结果分开；语义属性检查不能替代真实读屏验收。</text><path d="M272 208H360" class="edge"/><path d="M640 208H760" class="edge"/><path d="M500 280V392" class="edge"/><g data-node="用户提交"><rect x="32" y="152" width="240" height="112" rx="6" class="node"/><text x="50" y="184" class="n">用户提交</text><text x="50" y="214" class="s">Tab到达按钮</text><text x="50" y="241" class="s">Enter / Space激活</text></g><g data-node="输入有效？"><path d="M500 136L640 208L500 280L360 208Z" class="info"/><text x="438" y="214" class="n">输入有效？</text></g><g data-node="继续处理"><rect x="760" y="152" width="328" height="112" rx="6" class="good"/><text x="778" y="184" class="n">继续处理</text><text x="778" y="214" class="s">展示本地检查结果</text><text x="778" y="241" class="s">真实保存需等待服务端</text></g><g data-node="错误可感知与可定位"><rect x="360" y="392" width="448" height="128" rx="6" class="warn"/><text x="378" y="424" class="n">错误可感知与可定位</text><text x="378" y="454" class="s">显示文字、关联描述、aria-invalid</text><text x="378" y="481" class="s">聚焦字段；修正后重新提交</text></g><text x="676" y="190" class="s">是</text><text x="516" y="336" class="s">否</text><text x="32" y="668" class="s">修正后清除旧错误与状态；检查键盘、放大文字和目标辅助技术的实际操作。</text></svg>
