<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="696" viewBox="0 0 1120 696" role="img" aria-labelledby="title desc"><title id="title">校验通过才进入常规submit处理</title><desc id="desc">此图描述未设置novalidate的正常提交；FormData本身不会校验或发请求。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#607568"/></marker><style>text{font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;letter-spacing:0;fill:#253c30}.h{font-size:28px;font-weight:600}.n{font-size:21px;font-weight:600}.s{font-size:18px;fill:#52685b}.node{fill:#fff;stroke:#a6b9ad;stroke-width:1.5}.info{fill:#edf3fb;stroke:#739bbf;stroke-width:1.5}.good{fill:#e9f4ee;stroke:#397657;stroke-width:1.5}.warn{fill:#f8eef1;stroke:#ae7789;stroke-width:1.5}.edge{fill:none;stroke:#607568;stroke-width:2;marker-end:url(#arrow)}</style></defs><rect width="1120" height="696" fill="white"/><text x="32" y="44" class="h">校验通过才进入常规submit处理</text><text x="32" y="82" class="s">此图描述未设置novalidate的正常提交；FormData本身不会校验或发请求。</text><path d="M256 184H360" class="edge"/><path d="M640 184H760" class="edge"/><path d="M500 256V376" class="edge"/><g data-node="用户提交"><rect x="32" y="136" width="224" height="112" rx="6" class="node"/><text x="50" y="168" class="n">用户提交</text><text x="50" y="198" class="s">或requestSubmit()</text></g><g data-node="约束满足？"><path d="M500 112L640 184L500 256L360 184Z" class="info"/><text x="438" y="190" class="n">约束满足？</text></g><g data-node="submit事件"><rect x="760" y="136" width="328" height="112" rx="6" class="node"/><text x="778" y="168" class="n">submit事件</text><text x="778" y="198" class="s">收集成功控件</text><text x="778" y="225" class="s">发送请求或由脚本接管</text></g><g data-node="显示错误并停止"><rect x="360" y="376" width="280" height="112" rx="6" class="warn"/><text x="378" y="408" class="n">显示错误并停止</text><text x="378" y="438" class="s">保留输入，修正后再提交</text></g><g data-node="服务端验证"><rect x="760" y="376" width="328" height="112" rx="6" class="good"/><text x="778" y="408" class="n">服务端验证</text><text x="778" y="438" class="s">身份、权限、字段与业务</text><text x="778" y="465" class="s">成功保存或返回错误</text></g><path d="M924 248V376" class="edge"/><text x="676" y="166" class="s">是</text><text x="516" y="320" class="s">否</text><text x="32" y="564" class="s">name决定字段；disabled、无name、未勾选checkbox不进入数据集合。</text><text x="32" y="668" class="s">form.submit()跳过约束校验与submit事件；客户端校验不能代替服务端验证。</text></svg>
