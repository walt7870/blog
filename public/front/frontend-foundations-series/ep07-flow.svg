<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="600" viewBox="0 0 1120 600" role="img" aria-labelledby="title desc"><title id="title">先筛选和层叠，再解释最终值</title><desc id="desc">相同属性逐步比较；specificity不能跨过来源、重要性和layer等前置条件。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#607568"/></marker><style>text{font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;letter-spacing:0;fill:#253c30}.h{font-size:28px;font-weight:600}.n{font-size:21px;font-weight:600}.s{font-size:18px;fill:#52685b}.node{fill:#fff;stroke:#a6b9ad;stroke-width:1.5}.info{fill:#edf3fb;stroke:#739bbf;stroke-width:1.5}.good{fill:#e9f4ee;stroke:#397657;stroke-width:1.5}.warn{fill:#f8eef1;stroke:#ae7789;stroke-width:1.5}.edge{fill:none;stroke:#607568;stroke-width:2;marker-end:url(#arrow)}</style></defs><rect width="1120" height="600" fill="white"/><text x="32" y="44" class="h">先筛选和层叠，再解释最终值</text><text x="32" y="82" class="s">相同属性逐步比较；specificity不能跨过来源、重要性和layer等前置条件。</text><path d="M272 208H304" class="edge"/><path d="M544 208H576" class="edge"/><path d="M816 208H848" class="edge"/><g data-node="候选声明"><rect x="32" y="144" width="240" height="136" rx="6" class="node"/><text x="50" y="176" class="n">候选声明</text><text x="50" y="206" class="s">选择器匹配</text><text x="50" y="233" class="s">条件成立、语法有效</text></g><g data-node="来源与层叠位置"><rect x="304" y="144" width="240" height="136" rx="6" class="info"/><text x="322" y="176" class="n">来源与层叠位置</text><text x="322" y="206" class="s">重要性、layer</text><text x="322" y="233" class="s">内联、动画与过渡</text></g><g data-node="同等条件继续比较"><rect x="576" y="144" width="240" height="136" rx="6" class="node"/><text x="594" y="176" class="n">同等条件继续比较</text><text x="594" y="206" class="s">specificity</text><text x="594" y="233" class="s">作用域邻近与顺序</text></g><g data-node="取值处理"><rect x="848" y="144" width="240" height="136" rx="6" class="good"/><text x="866" y="176" class="n">取值处理</text><text x="866" y="206" class="s">继承、默认、变量</text><text x="866" y="233" class="s">计算与布局使用值</text></g><g data-node="按钮实验：vendor层的 #buy 与后置app层的 .buy"><rect x="32" y="368" width="1056" height="112" rx="6" class="node"/><text x="50" y="400" class="n">按钮实验：vendor层的 #buy 与后置app层的 .buy</text><text x="50" y="430" class="s">同为作者普通声明：后置app层胜出；加入important后需要重新按规则比较</text></g><text x="32" y="572" class="s">getComputedStyle返回解析值；几何尺寸另看布局与getBoundingClientRect的适用边界。</text></svg>
