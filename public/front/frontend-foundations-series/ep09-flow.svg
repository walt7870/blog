<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="640" viewBox="0 0 1120 640" role="img" aria-labelledby="title desc"><title id="title">同一视口中，组件容器仍有不同宽度</title><desc id="desc">媒体查询控制页面环境；容器查询让同一个组件适应主栏与侧栏。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#607568"/></marker><style>text{font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;letter-spacing:0;fill:#253c30}.h{font-size:28px;font-weight:600}.n{font-size:21px;font-weight:600}.s{font-size:18px;fill:#52685b}.node{fill:#fff;stroke:#a6b9ad;stroke-width:1.5}.info{fill:#edf3fb;stroke:#739bbf;stroke-width:1.5}.good{fill:#e9f4ee;stroke:#397657;stroke-width:1.5}.warn{fill:#f8eef1;stroke:#ae7789;stroke-width:1.5}.edge{fill:none;stroke:#607568;stroke-width:2;marker-end:url(#arrow)}</style></defs><rect width="1120" height="640" fill="white"/><text x="32" y="44" class="h">同一视口中，组件容器仍有不同宽度</text><text x="32" y="82" class="s">媒体查询控制页面环境；容器查询让同一个组件适应主栏与侧栏。</text><g data-node="页面视口：宽屏"><rect x="32" y="136" width="1056" height="112" rx="6" class="info"/><text x="50" y="168" class="n">页面视口：宽屏</text><text x="50" y="198" class="s">@media可切换整页骨架；它不直接说明每个组件实际可用的空间</text></g><g data-node="主栏容器 ≥ 32rem"><rect x="32" y="328" width="656" height="160" rx="6" class="node"/><text x="50" y="360" class="n">主栏容器 ≥ 32rem</text><text x="50" y="390" class="s">@container命中：组件横排</text><text x="50" y="417" class="s">商品标题        配送说明与购买信息</text></g><g data-node="侧栏容器 &lt; 32rem"><rect x="760" y="328" width="328" height="160" rx="6" class="node"/><text x="778" y="360" class="n">侧栏容器 &lt; 32rem</text><text x="778" y="390" class="s">基础布局：组件纵排</text><text x="778" y="417" class="s">商品标题</text><text x="778" y="444" class="s">配送说明与购买信息</text></g><text x="32" y="612" class="s">container-type:inline-size声明在外层，规则影响后代；断点按内容拥挤位置确定。</text></svg>
