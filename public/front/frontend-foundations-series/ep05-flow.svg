<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="608" viewBox="0 0 1120 608" role="img" aria-labelledby="title desc"><title id="title">正确元素同时提供结构与原生行为</title><desc id="desc">DOM与可访问性树并非逐节点复制；ARIA只声明语义，不自动实现交互。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#607568"/></marker><style>text{font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;letter-spacing:0;fill:#253c30}.h{font-size:28px;font-weight:600}.n{font-size:21px;font-weight:600}.s{font-size:18px;fill:#52685b}.node{fill:#fff;stroke:#a6b9ad;stroke-width:1.5}.info{fill:#edf3fb;stroke:#739bbf;stroke-width:1.5}.good{fill:#e9f4ee;stroke:#397657;stroke-width:1.5}.warn{fill:#f8eef1;stroke:#ae7789;stroke-width:1.5}.edge{fill:none;stroke:#607568;stroke-width:2;marker-end:url(#arrow)}</style></defs><rect width="1120" height="608" fill="white"/><text x="32" y="44" class="h">正确元素同时提供结构与原生行为</text><text x="32" y="82" class="s">DOM与可访问性树并非逐节点复制；ARIA只声明语义，不自动实现交互。</text><path d="M336 208H432" class="edge"/><path d="M720 208H816" class="edge"/><path d="M576 272V376" class="edge"/><g data-node="HTML"><rect x="32" y="144" width="304" height="128" rx="6" class="node"/><text x="50" y="176" class="n">HTML</text><text x="50" y="206" class="s">button / a href / main</text><text x="50" y="233" class="s">文本、属性与嵌套</text></g><g data-node="DOM与原生行为"><rect x="432" y="144" width="288" height="128" rx="6" class="info"/><text x="450" y="176" class="n">DOM与原生行为</text><text x="450" y="206" class="s">按钮焦点与键盘激活</text><text x="450" y="233" class="s">链接导航与默认动作</text></g><g data-node="可访问性树"><rect x="816" y="144" width="272" height="128" rx="6" class="node"/><text x="834" y="176" class="n">可访问性树</text><text x="834" y="206" class="s">role / name / state</text><text x="834" y="233" class="s">结合语义与可见性</text></g><g data-node="实际验收"><rect x="432" y="376" width="656" height="112" rx="6" class="good"/><text x="450" y="408" class="n">实际验收</text><text x="450" y="438" class="s">Tab顺序、Enter/Space、名称与结果反馈</text><text x="450" y="465" class="s">页面区域的landmark角色还取决于上下文</text></g><text x="32" y="580" class="s">视觉相似不能证明语义相同；给div添加role不会补齐原生按钮的键盘与禁用行为。</text></svg>
