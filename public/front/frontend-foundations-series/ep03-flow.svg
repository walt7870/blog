<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="592" viewBox="0 0 1120 592" role="img" aria-labelledby="title desc"><title id="title">三门语言围绕浏览器模型协作</title><desc id="desc">结构、呈现和行为是职责分工，不是HTML执行完再执行CSS与JavaScript。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#607568"/></marker><style>text{font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;letter-spacing:0;fill:#253c30}.h{font-size:28px;font-weight:600}.n{font-size:21px;font-weight:600}.s{font-size:18px;fill:#52685b}.node{fill:#fff;stroke:#a6b9ad;stroke-width:1.5}.info{fill:#edf3fb;stroke:#739bbf;stroke-width:1.5}.good{fill:#e9f4ee;stroke:#397657;stroke-width:1.5}.warn{fill:#f8eef1;stroke:#ae7789;stroke-width:1.5}.edge{fill:none;stroke:#607568;stroke-width:2;marker-end:url(#arrow)}</style></defs><rect width="1120" height="592" fill="white"/><text x="32" y="44" class="h">三门语言围绕浏览器模型协作</text><text x="32" y="82" class="s">结构、呈现和行为是职责分工，不是HTML执行完再执行CSS与JavaScript。</text><path d="M312 192H424" class="edge"/><path d="M312 360H424" class="edge"/><path d="M760 192H648" class="edge"/><path d="M760 360H648" class="edge"/><g data-node="HTML"><rect x="32" y="136" width="280" height="112" rx="6" class="node"/><text x="50" y="168" class="n">HTML</text><text x="50" y="198" class="s">标题、段落、原生按钮</text></g><g data-node="CSS"><rect x="32" y="304" width="280" height="112" rx="6" class="node"/><text x="50" y="336" class="n">CSS</text><text x="50" y="366" class="s">选择器、层叠与布局</text></g><g data-node="浏览器模型"><rect x="424" y="136" width="224" height="280" rx="6" class="info"/><text x="442" y="168" class="n">浏览器模型</text><text x="442" y="198" class="s">DOM与样式计算</text><text x="442" y="225" class="s">布局、绘制与合成</text><text x="442" y="252" class="s"></text><text x="442" y="279" class="s">屏幕与可访问性</text></g><g data-node="JavaScript"><rect x="760" y="136" width="328" height="112" rx="6" class="node"/><text x="778" y="168" class="n">JavaScript</text><text x="778" y="198" class="s">事件处理与运行时状态</text></g><g data-node="Web API"><rect x="760" y="304" width="328" height="112" rx="6" class="node"/><text x="778" y="336" class="n">Web API</text><text x="778" y="366" class="s">DOM / Fetch / Storage</text><text x="778" y="393" class="s">由浏览器宿主提供</text></g><text x="32" y="564" class="s">JavaScript通过Web API读写页面；禁用脚本后，已有HTML仍可显示，动态增强停止。</text></svg>
