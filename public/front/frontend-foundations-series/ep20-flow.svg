<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="696" viewBox="0 0 1120 696" role="img" aria-labelledby="ep20-title ep20-desc"><title id="ep20-title">开发反馈与生产交付使用两条路径</title><desc id="ep20-desc">Vite 8采用Rolldown与Oxc；底层实现和配置应随实际版本核对。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#607568"/></marker><style>text{font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;letter-spacing:0;fill:#253c30}.h{font-size:28px;font-weight:600}.n{font-size:21px;font-weight:600}.s{font-size:18px;fill:#52685b}.node{fill:#fff;stroke:#a6b9ad;stroke-width:1.5}.info{fill:#edf3fb;stroke:#739bbf;stroke-width:1.5}.good{fill:#e9f4ee;stroke:#397657;stroke-width:1.5}.warn{fill:#f8eef1;stroke:#ae7789;stroke-width:1.5}.edge{fill:none;stroke:#607568;stroke-width:2;marker-end:url(#arrow)}</style></defs><rect width="1120" height="696" fill="white"/><text x="32" y="44" class="h">开发反馈与生产交付使用两条路径</text><text x="32" y="82" class="s">Vite 8采用Rolldown与Oxc；底层实现和配置应随实际版本核对。</text><path d="M336 208H408" class="edge"/><path d="M712 208H784" class="edge"/><path d="M336 440H408" class="edge"/><path d="M712 440H784" class="edge"/><g data-node="开发浏览器请求"><rect x="32" y="144" width="304" height="128" rx="6" class="node"/><text x="50" y="176" class="n">开发浏览器请求</text><text x="50" y="206" class="s">HTML入口与源码模块</text></g><g data-node="Dev Server与插件"><rect x="408" y="144" width="304" height="128" rx="6" class="info"/><text x="426" y="176" class="n">Dev Server与插件</text><text x="426" y="206" class="s">按需转换、依赖预构建</text><text x="426" y="233" class="s">建立受影响模块关系</text></g><g data-node="HMR边界"><rect x="784" y="144" width="304" height="128" rx="6" class="node"/><text x="802" y="176" class="n">HMR边界</text><text x="802" y="206" class="s">局部更新或整页刷新</text><text x="802" y="233" class="s">状态不保证始终保留</text></g><g data-node="生产源码入口"><rect x="32" y="376" width="304" height="128" rx="6" class="node"/><text x="50" y="408" class="n">生产源码入口</text><text x="50" y="438" class="s">静态与动态依赖图</text></g><g data-node="生产构建"><rect x="408" y="376" width="304" height="128" rx="6" class="node"/><text x="426" y="408" class="n">生产构建</text><text x="426" y="438" class="s">转换、打包、分包、压缩</text><text x="426" y="465" class="s">类型检查另行执行</text></g><g data-node="部署产物"><rect x="784" y="376" width="304" height="128" rx="6" class="good"/><text x="802" y="408" class="n">部署产物</text><text x="802" y="438" class="s">HTML / JS / CSS / 资源</text><text x="802" y="465" class="s">校验base与旧chunk</text></g><text x="32" y="668" class="s">preview只检查构建产物；客户端环境变量可见，不能携带服务端密钥。</text></svg>
