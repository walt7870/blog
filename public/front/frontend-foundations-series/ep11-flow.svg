<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="800" viewBox="0 0 1120 800" role="img" aria-labelledby="title desc"><title id="title">浅拷贝只复制外层，闭包环境按调用建立</title><desc id="desc">变量绑定、对象身份和词法环境共同解释状态为何共享或独立。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#607568"/></marker><style>text{font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;letter-spacing:0;fill:#253c30}.h{font-size:28px;font-weight:600}.n{font-size:21px;font-weight:600}.s{font-size:18px;fill:#52685b}.node{fill:#fff;stroke:#a6b9ad;stroke-width:1.5}.info{fill:#edf3fb;stroke:#739bbf;stroke-width:1.5}.good{fill:#e9f4ee;stroke:#397657;stroke-width:1.5}.warn{fill:#f8eef1;stroke:#ae7789;stroke-width:1.5}.edge{fill:none;stroke:#607568;stroke-width:2;marker-end:url(#arrow)}</style></defs><rect width="1120" height="800" fill="white"/><text x="32" y="44" class="h">浅拷贝只复制外层，闭包环境按调用建立</text><text x="32" y="82" class="s">变量绑定、对象身份和词法环境共同解释状态为何共享或独立。</text><path d="M256 200H320" class="edge"/><path d="M256 392H320" class="edge"/><path d="M608 200H744Q752 200 752 208V260Q752 268 760 268H816" class="edge"/><path d="M608 392H768Q776 392 776 384V340Q776 332 784 332H816" class="edge"/><g data-node="cart / alias"><rect x="32" y="144" width="224" height="112" rx="6" class="node"/><text x="50" y="176" class="n">cart / alias</text><text x="50" y="206" class="s">指向同一外层对象</text></g><g data-node="外层对象A"><rect x="320" y="144" width="288" height="112" rx="6" class="node"/><text x="338" y="176" class="n">外层对象A</text><text x="338" y="206" class="s">quantity = 2</text><text x="338" y="233" class="s">delivery引用</text></g><g data-node="copy"><rect x="32" y="336" width="224" height="112" rx="6" class="node"/><text x="50" y="368" class="n">copy</text><text x="50" y="398" class="s">展开产生新外层对象</text></g><g data-node="外层对象B"><rect x="320" y="336" width="288" height="112" rx="6" class="node"/><text x="338" y="368" class="n">外层对象B</text><text x="338" y="398" class="s">quantity独立</text><text x="338" y="425" class="s">delivery仍共享</text></g><g data-node="同一个delivery"><rect x="816" y="240" width="272" height="128" rx="6" class="info"/><text x="834" y="272" class="n">同一个delivery</text><text x="834" y="302" class="s">city改为杭州</text><text x="834" y="329" class="s">A和B都能观察到</text></g><g data-node="第一次createCounter调用"><rect x="32" y="568" width="512" height="112" rx="6" class="good"/><text x="50" y="600" class="n">第一次createCounter调用</text><text x="50" y="630" class="s">first闭包访问环境1：1 → 2</text></g><g data-node="第二次createCounter调用"><rect x="576" y="568" width="512" height="112" rx="6" class="node"/><text x="594" y="600" class="n">第二次createCounter调用</text><text x="594" y="630" class="s">second闭包访问环境2：1</text></g><text x="32" y="772" class="s">const限制绑定重赋值，不冻结对象；函数定义位置决定词法查找。</text></svg>
