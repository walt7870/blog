<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="680" viewBox="0 0 1120 680" role="img" aria-labelledby="ep17-title ep17-desc"><title id="ep17-title">模块图表达静态依赖与动态加载边界</title><desc id="ep17-desc">箭头从使用方指向依赖；同一环境中相同模块URL共享模块实例。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#607568"/></marker><style>text{font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;letter-spacing:0;fill:#253c30}.h{font-size:28px;font-weight:600}.n{font-size:21px;font-weight:600}.s{font-size:18px;fill:#52685b}.node{fill:#fff;stroke:#a6b9ad;stroke-width:1.5}.info{fill:#edf3fb;stroke:#739bbf;stroke-width:1.5}.good{fill:#e9f4ee;stroke:#397657;stroke-width:1.5}.warn{fill:#f8eef1;stroke:#ae7789;stroke-width:1.5}.edge{fill:none;stroke:#607568;stroke-width:2;marker-end:url(#arrow)}</style></defs><rect width="1120" height="680" fill="white"/><text x="32" y="44" class="h">模块图表达静态依赖与动态加载边界</text><text x="32" y="82" class="s">箭头从使用方指向依赖；同一环境中相同模块URL共享模块实例。</text><path d="M272 208H408" class="edge"/><path d="M712 184H848" class="edge"/><path d="M560 272V392" class="edge"/><path d="M712 448H848" class="edge"/><g data-node="HTML入口"><rect x="32" y="144" width="240" height="128" rx="6" class="node"/><text x="50" y="176" class="n">HTML入口</text><text x="50" y="206" class="s">type=module</text><text x="50" y="233" class="s">加载app.js</text></g><g data-node="app.js"><rect x="408" y="144" width="304" height="128" rx="6" class="info"/><text x="426" y="176" class="n">app.js</text><text x="426" y="206" class="s">静态导入cart.js</text><text x="426" y="233" class="s">事件触发后动态导入</text></g><g data-node="cart.js"><rect x="848" y="144" width="240" height="128" rx="6" class="node"/><text x="866" y="176" class="n">cart.js</text><text x="866" y="206" class="s">quantity实时绑定</text><text x="866" y="233" class="s">add修改状态</text></g><g data-node="import(report.js)"><rect x="408" y="392" width="304" height="112" rx="6" class="node"/><text x="426" y="424" class="n">import(report.js)</text><text x="426" y="454" class="s">Promise：加载与求值</text></g><g data-node="report.js"><rect x="848" y="392" width="240" height="112" rx="6" class="good"/><text x="866" y="424" class="n">report.js</text><text x="866" y="454" class="s">成功生成报表</text><text x="866" y="481" class="s">失败显示恢复提示</text></g><text x="32" y="652" class="s">浏览器URL、执行环境与构建分包要分开判断；循环依赖还受绑定初始化时机约束。</text></svg>
