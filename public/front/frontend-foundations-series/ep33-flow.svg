<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="752" viewBox="0 0 1120 752" role="img" aria-labelledby="ep33-title ep33-desc"><title id="ep33-title">Angular的实例共享由提供者作用域决定</title><desc id="ep33-desc">箭头表示消费者获取实例；局部提供者遮蔽祖先，service类名不保证全局单例。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#607568"/></marker><style>text{font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;letter-spacing:0;fill:#253c30}.h{font-size:28px;font-weight:600}.n{font-size:21px;font-weight:600}.s{font-size:18px;fill:#52685b}.node{fill:#fff;stroke:#a6b9ad;stroke-width:1.5}.info{fill:#edf3fb;stroke:#739bbf;stroke-width:1.5}.good{fill:#e9f4ee;stroke:#397657;stroke-width:1.5}.warn{fill:#f8eef1;stroke:#ae7789;stroke-width:1.5}.edge{fill:none;stroke:#607568;stroke-width:2;marker-end:url(#arrow)}</style></defs><rect width="1120" height="752" fill="white"/><text x="32" y="44" class="h">Angular的实例共享由提供者作用域决定</text><text x="32" y="82" class="s">箭头表示消费者获取实例；局部提供者遮蔽祖先，service类名不保证全局单例。</text><path d="M256 208H408" class="edge"/><path d="M256 448H408" class="edge"/><path d="M712 208H784" class="edge"/><path d="M712 448H784" class="edge"/><g data-node="顶部购物车"><rect x="32" y="144" width="224" height="128" rx="6" class="node"/><text x="50" y="176" class="n">顶部购物车</text><text x="50" y="206" class="s">inject(CartService)</text></g><g data-node="应用根提供者"><rect x="408" y="144" width="304" height="128" rx="6" class="info"/><text x="426" y="176" class="n">应用根提供者</text><text x="426" y="206" class="s">providedIn:root</text><text x="426" y="233" class="s">根消费者共享实例</text></g><g data-node="根购物车状态"><rect x="784" y="144" width="304" height="128" rx="6" class="node"/><text x="802" y="176" class="n">根购物车状态</text><text x="802" y="206" class="s">quantity → totalCents</text><text x="802" y="233" class="s">模板读signal并更新</text></g><g data-node="编辑区A"><rect x="32" y="384" width="224" height="128" rx="6" class="node"/><text x="50" y="416" class="n">编辑区A</text><text x="50" y="446" class="s">局部providers</text></g><g data-node="A的CartService"><rect x="408" y="384" width="304" height="128" rx="6" class="good"/><text x="426" y="416" class="n">A的CartService</text><text x="426" y="446" class="s">局部实例</text><text x="426" y="473" class="s">不修改根购物车</text></g><g data-node="A的数量与金额"><rect x="784" y="384" width="304" height="128" rx="6" class="node"/><text x="802" y="416" class="n">A的数量与金额</text><text x="802" y="446" class="s">随编辑区生命周期</text><text x="802" y="473" class="s">兄弟区可有独立实例</text></g><g data-node="注入入口与销毁边界"><rect x="32" y="592" width="1056" height="88" rx="6" class="node"/><text x="50" y="624" class="n">注入入口与销毁边界</text><text x="50" y="654" class="s">inject在注入上下文获取依赖；组件事件调用已取得的对象，订阅另需清理</text></g><text x="32" y="724" class="s">示例为客户端数量规则；API校验、服务器库存和SSR请求隔离分别验证。</text></svg>
