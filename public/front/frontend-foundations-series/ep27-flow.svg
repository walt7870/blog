<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="696" viewBox="0 0 1120 696" role="img" aria-labelledby="ep27-title ep27-desc"><title id="ep27-title">按用户现象寻找性能证据</title><desc id="ep27-desc">先固定版本、设备、网络、缓存冷热与操作，再比较同条件的修改结果。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#607568"/></marker><style>text{font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;letter-spacing:0;fill:#253c30}.h{font-size:28px;font-weight:600}.n{font-size:21px;font-weight:600}.s{font-size:18px;fill:#52685b}.node{fill:#fff;stroke:#a6b9ad;stroke-width:1.5}.info{fill:#edf3fb;stroke:#739bbf;stroke-width:1.5}.good{fill:#e9f4ee;stroke:#397657;stroke-width:1.5}.warn{fill:#f8eef1;stroke:#ae7789;stroke-width:1.5}.edge{fill:none;stroke:#607568;stroke-width:2;marker-end:url(#arrow)}</style></defs><rect width="1120" height="696" fill="white"/><text x="32" y="44" class="h">按用户现象寻找性能证据</text><text x="32" y="82" class="s">先固定版本、设备、网络、缓存冷热与操作，再比较同条件的修改结果。</text><path d="M376 192H488" class="edge"/><path d="M376 368H488" class="edge"/><path d="M376 544H488" class="edge"/><g data-node="主要内容出现晚"><rect x="32" y="136" width="344" height="112" rx="6" class="node"/><text x="50" y="168" class="n">主要内容出现晚</text><text x="50" y="198" class="s">LCP：良好≤2.5秒</text></g><g data-node="文档响应、发现与下载、解码和显示"><rect x="488" y="136" width="600" height="112" rx="6" class="info"/><text x="506" y="168" class="n">文档响应、发现与下载、解码和显示</text><text x="506" y="198" class="s">检查主图何时被发现，避免把关键资源延后</text></g><g data-node="点击到反馈慢"><rect x="32" y="312" width="344" height="112" rx="6" class="node"/><text x="50" y="344" class="n">点击到反馈慢</text><text x="50" y="374" class="s">INP：良好≤200毫秒</text></g><g data-node="输入排队、处理函数与下一次绘制"><rect x="488" y="312" width="600" height="112" rx="6" class="node"/><text x="506" y="344" class="n">输入排队、处理函数与下一次绘制</text><text x="506" y="374" class="s">定位主线程与布局；长任务是线索而不是INP本身</text></g><g data-node="按钮被内容推开"><rect x="32" y="488" width="344" height="112" rx="6" class="node"/><text x="50" y="520" class="n">按钮被内容推开</text><text x="50" y="550" class="s">CLS：良好≤0.1</text></g><g data-node="按规则聚合的非预期布局偏移"><rect x="488" y="488" width="600" height="112" rx="6" class="node"/><text x="506" y="520" class="n">按规则聚合的非预期布局偏移</text><text x="506" y="550" class="s">图片比例、异步占位、字体替换和目标位置</text></g><text x="32" y="668" class="s">阈值用于第75百分位等规定口径；本地一次分数不能冒充真实用户结果。</text></svg>
