<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="680" viewBox="0 0 1120 680" role="img" aria-labelledby="title desc"><title id="title">任务结束后检查微任务，渲染按机会发生</title><desc id="desc">Promise与await延续不会自动把计算移到后台；日志顺序不能证明某帧已经显示。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#607568"/></marker><style>text{font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;letter-spacing:0;fill:#253c30}.h{font-size:28px;font-weight:600}.n{font-size:21px;font-weight:600}.s{font-size:18px;fill:#52685b}.node{fill:#fff;stroke:#a6b9ad;stroke-width:1.5}.info{fill:#edf3fb;stroke:#739bbf;stroke-width:1.5}.good{fill:#e9f4ee;stroke:#397657;stroke-width:1.5}.warn{fill:#f8eef1;stroke:#ae7789;stroke-width:1.5}.edge{fill:none;stroke:#607568;stroke-width:2;marker-end:url(#arrow)}</style></defs><rect width="1120" height="680" fill="white"/><text x="32" y="44" class="h">任务结束后检查微任务，渲染按机会发生</text><text x="32" y="82" class="s">Promise与await延续不会自动把计算移到后台；日志顺序不能证明某帧已经显示。</text><path d="M336 208H408" class="edge"/><path d="M712 208H784" class="edge"/><path d="M936 272V392" class="edge"/><g data-node="当前任务"><rect x="32" y="144" width="304" height="128" rx="6" class="node"/><text x="50" y="176" class="n">当前任务</text><text x="50" y="206" class="s">同步调用栈运行至完成</text><text x="50" y="233" class="s">定时器0也不能插入</text></g><g data-node="微任务检查点"><rect x="408" y="144" width="304" height="128" rx="6" class="info"/><text x="426" y="176" class="n">微任务检查点</text><text x="426" y="206" class="s">then / queueMicrotask</text><text x="426" y="233" class="s">继续消耗新加的微任务</text></g><g data-node="渲染机会（可跳过）"><rect x="784" y="144" width="304" height="128" rx="6" class="node"/><text x="802" y="176" class="n">渲染机会（可跳过）</text><text x="802" y="206" class="s">rAF等更新阶段</text><text x="802" y="233" class="s">不承诺每轮都绘制</text></g><g data-node="后续任务"><rect x="784" y="392" width="304" height="112" rx="6" class="node"/><text x="802" y="424" class="n">后续任务</text><text x="802" y="454" class="s">从可调度任务源选择</text><text x="802" y="481" class="s">输入、计时器等</text></g><g data-node="反复补微任务会延迟后续任务与渲染"><rect x="32" y="392" width="656" height="112" rx="6" class="warn"/><text x="50" y="424" class="n">反复补微任务会延迟后续任务与渲染</text><text x="50" y="454" class="s">await Promise.resolve()并不等于让浏览器先画一帧</text></g><text x="32" y="652" class="s">浏览器存在多个任务源；需要让出时采用有界分批，独立重计算可考虑Worker。</text></svg>
