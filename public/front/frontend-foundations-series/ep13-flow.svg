<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="584" viewBox="0 0 1120 584" role="img" aria-labelledby="title desc"><title id="title">监听器在事件传播途中执行</title><desc id="desc">以下为可冒泡click的简化路径，祖先捕获、目标与祖先冒泡各有监听位置。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#607568"/></marker><style>text{font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;letter-spacing:0;fill:#253c30}.h{font-size:28px;font-weight:600}.n{font-size:21px;font-weight:600}.s{font-size:18px;fill:#52685b}.node{fill:#fff;stroke:#a6b9ad;stroke-width:1.5}.info{fill:#edf3fb;stroke:#739bbf;stroke-width:1.5}.good{fill:#e9f4ee;stroke:#397657;stroke-width:1.5}.warn{fill:#f8eef1;stroke:#ae7789;stroke-width:1.5}.edge{fill:none;stroke:#607568;stroke-width:2;marker-end:url(#arrow)}</style></defs><rect width="1120" height="584" fill="white"/><text x="32" y="44" class="h">监听器在事件传播途中执行</text><text x="32" y="82" class="s">以下为可冒泡click的简化路径，祖先捕获、目标与祖先冒泡各有监听位置。</text><path d="M272 208H304" class="edge"/><path d="M544 208H576" class="edge"/><path d="M816 208H848" class="edge"/><g data-node="document捕获"><rect x="32" y="144" width="240" height="136" rx="6" class="node"/><text x="50" y="176" class="n">document捕获</text><text x="50" y="206" class="s">外层到目标方向</text><text x="50" y="233" class="s">capture:true</text></g><g data-node="ul捕获"><rect x="304" y="144" width="240" height="136" rx="6" class="node"/><text x="322" y="176" class="n">ul捕获</text><text x="322" y="206" class="s">列表祖先的监听器</text><text x="322" y="233" class="s">capture:true</text></g><g data-node="span目标"><rect x="576" y="144" width="240" height="136" rx="6" class="node"/><text x="594" y="176" class="n">span目标</text><text x="594" y="206" class="s">按钮内部被点击元素</text><text x="594" y="233" class="s">目标阶段</text></g><g data-node="ul冒泡委托"><rect x="848" y="144" width="240" height="136" rx="6" class="info"/><text x="866" y="176" class="n">ul冒泡委托</text><text x="866" y="206" class="s">target = span</text><text x="866" y="233" class="s">currentTarget = ul</text></g><g data-node="closest回到button，并检查所属列表，再处理业务动作"><rect x="32" y="368" width="1056" height="104" rx="6" class="node"/><text x="50" y="400" class="n">closest回到button，并检查所属列表，再处理业务动作</text><text x="50" y="430" class="s">preventDefault取消可取消的默认行为；stopPropagation只影响后续路径传播</text></g><text x="32" y="556" class="s">Shadow DOM可重定向target；不是所有事件都冒泡，passive监听不能取消默认动作。</text></svg>
