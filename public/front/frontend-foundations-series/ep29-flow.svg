<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="808" viewBox="0 0 1120 808" role="img" aria-labelledby="ep29-title ep29-desc"><title id="ep29-title">新旧页面会同时访问不同版本资源</title><desc id="ep29-desc">切换文档前先部署资源；保留旧chunk保护尚未关闭的页面。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#607568"/></marker><style>text{font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;letter-spacing:0;fill:#253c30}.h{font-size:28px;font-weight:600}.n{font-size:21px;font-weight:600}.s{font-size:18px;fill:#52685b}.node{fill:#fff;stroke:#a6b9ad;stroke-width:1.5}.info{fill:#edf3fb;stroke:#739bbf;stroke-width:1.5}.good{fill:#e9f4ee;stroke:#397657;stroke-width:1.5}.warn{fill:#f8eef1;stroke:#ae7789;stroke-width:1.5}.edge{fill:none;stroke:#607568;stroke-width:2;marker-end:url(#arrow)}</style></defs><rect width="1120" height="808" fill="white"/><text x="32" y="44" class="h">新旧页面会同时访问不同版本资源</text><text x="32" y="82" class="s">切换文档前先部署资源；保留旧chunk保护尚未关闭的页面。</text><path d="M336 208H408" class="edge"/><path d="M712 208H784" class="edge"/><path d="M336 440H408" class="edge"/><path d="M712 440H784" class="edge"/><g data-node="上午已打开的页面A"><rect x="32" y="144" width="304" height="128" rx="6" class="node"/><text x="50" y="176" class="n">上午已打开的页面A</text><text x="50" y="206" class="s">仍记住旧资源URL</text></g><g data-node="下午才触发动态导入"><rect x="408" y="144" width="304" height="128" rx="6" class="info"/><text x="426" y="176" class="n">下午才触发动态导入</text><text x="426" y="206" class="s">请求A版本报表chunk</text><text x="426" y="233" class="s">不能因上线B立即删除A</text></g><g data-node="保留的A资源"><rect x="784" y="144" width="304" height="128" rx="6" class="node"/><text x="802" y="176" class="n">保留的A资源</text><text x="802" y="206" class="s">完整旧产物可供回滚</text><text x="802" y="233" class="s">监控关联release A</text></g><g data-node="发布后新打开的页面B"><rect x="32" y="376" width="304" height="128" rx="6" class="node"/><text x="50" y="408" class="n">发布后新打开的页面B</text><text x="50" y="438" class="s">重新验证文档入口</text></g><g data-node="B版本完整资源"><rect x="408" y="376" width="304" height="128" rx="6" class="node"/><text x="426" y="408" class="n">B版本完整资源</text><text x="426" y="438" class="s">内容指纹可长期缓存</text><text x="426" y="465" class="s">public同名资源另行管理</text></g><g data-node="B错误与性能证据"><rect x="784" y="376" width="304" height="128" rx="6" class="good"/><text x="802" y="408" class="n">B错误与性能证据</text><text x="802" y="438" class="s">匹配B的Source Map</text><text x="802" y="465" class="s">先验证再扩大发布</text></g><g data-node="回滚：文档入口、资源、缓存策略和后端兼容共同验证"><rect x="32" y="608" width="1056" height="104" rx="6" class="node"/><text x="50" y="640" class="n">回滚：文档入口、资源、缓存策略和后端兼容共同验证</text><text x="50" y="670" class="s">切回源码不等于恢复完整旧产物；旧map不能解释新文件</text></g><text x="32" y="780" class="s">no-cache表示复用前验证；CDN、浏览器HTTP缓存和Service Worker需分别排查。</text></svg>
