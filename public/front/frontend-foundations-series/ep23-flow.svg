<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="840" viewBox="0 0 1120 840" role="img" aria-labelledby="ep23-title ep23-desc"><title id="ep23-title">同一数量变化，不同框架使用不同更新模型</title><desc id="ep23-desc">这四行并非执行先后；编译与运行时共同参与，实际配置取决于项目版本。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#607568"/></marker><style>text{font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;letter-spacing:0;fill:#253c30}.h{font-size:28px;font-weight:600}.n{font-size:21px;font-weight:600}.s{font-size:18px;fill:#52685b}.node{fill:#fff;stroke:#a6b9ad;stroke-width:1.5}.info{fill:#edf3fb;stroke:#739bbf;stroke-width:1.5}.good{fill:#e9f4ee;stroke:#397657;stroke-width:1.5}.warn{fill:#f8eef1;stroke:#ae7789;stroke-width:1.5}.edge{fill:none;stroke:#607568;stroke-width:2;marker-end:url(#arrow)}</style></defs><rect width="1120" height="840" fill="white"/><text x="32" y="44" class="h">同一数量变化，不同框架使用不同更新模型</text><text x="32" y="82" class="s">这四行并非执行先后；编译与运行时共同参与，实际配置取决于项目版本。</text><path d="M432 200H640" class="edge"/><path d="M432 360H640" class="edge"/><path d="M432 520H640" class="edge"/><path d="M432 680H640" class="edge"/><g data-node="React：state更新"><rect x="32" y="144" width="400" height="112" rx="6" class="node"/><text x="50" y="176" class="n">React：state更新</text><text x="50" y="206" class="s">安排组件计算，读取本轮快照</text></g><g data-node="协调结果 → 提交DOM"><rect x="640" y="144" width="448" height="112" rx="6" class="node"/><text x="658" y="176" class="n">协调结果 → 提交DOM</text><text x="658" y="206" class="s">路由与完整应用能力由配套方案组织</text></g><g data-node="Vue 3：响应式值变化"><rect x="32" y="304" width="400" height="112" rx="6" class="info"/><text x="50" y="336" class="n">Vue 3：响应式值变化</text><text x="50" y="366" class="s">读取依赖，通知受影响任务</text></g><g data-node="调度组件 → 更新DOM"><rect x="640" y="304" width="448" height="112" rx="6" class="node"/><text x="658" y="336" class="n">调度组件 → 更新DOM</text><text x="658" y="366" class="s">SFC编译配合运行时依赖追踪</text></g><g data-node="Angular：signal等更新入口"><rect x="32" y="464" width="400" height="112" rx="6" class="node"/><text x="50" y="496" class="n">Angular：signal等更新入口</text><text x="50" y="526" class="s">模板消费者与变更检测机制</text></g><g data-node="更新模板绑定"><rect x="640" y="464" width="448" height="112" rx="6" class="node"/><text x="658" y="496" class="n">更新模板绑定</text><text x="658" y="526" class="s">DI、路由与表单等组成应用体系</text></g><g data-node="Svelte 5：runes声明状态"><rect x="32" y="624" width="400" height="112" rx="6" class="node"/><text x="50" y="656" class="n">Svelte 5：runes声明状态</text><text x="50" y="686" class="s">由编译器转换，并与运行时协作</text></g><g data-node="执行生成的更新逻辑"><rect x="640" y="624" width="448" height="112" rx="6" class="node"/><text x="658" y="656" class="n">执行生成的更新逻辑</text><text x="658" y="686" class="s">SvelteKit承担更完整应用职责</text></g><text x="32" y="812" class="s">选型试验固定业务、数据、失败场景和设备；框架模型本身不是性能排名。</text></svg>
