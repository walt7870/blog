<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="696" viewBox="0 0 1120 696" role="img" aria-labelledby="ep18-title ep18-desc"><title id="ep18-title">静态检查与运行时校验覆盖不同边界</title><desc id="ep18-desc">通过类型检查的代码，仍可能接收到字段错误的外部JSON。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#607568"/></marker><style>text{font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;letter-spacing:0;fill:#253c30}.h{font-size:28px;font-weight:600}.n{font-size:21px;font-weight:600}.s{font-size:18px;fill:#52685b}.node{fill:#fff;stroke:#a6b9ad;stroke-width:1.5}.info{fill:#edf3fb;stroke:#739bbf;stroke-width:1.5}.good{fill:#e9f4ee;stroke:#397657;stroke-width:1.5}.warn{fill:#f8eef1;stroke:#ae7789;stroke-width:1.5}.edge{fill:none;stroke:#607568;stroke-width:2;marker-end:url(#arrow)}</style></defs><rect width="1120" height="696" fill="white"/><text x="32" y="44" class="h">静态检查与运行时校验覆盖不同边界</text><text x="32" y="82" class="s">通过类型检查的代码，仍可能接收到字段错误的外部JSON。</text><path d="M336 208H408" class="edge"/><path d="M712 208H784" class="edge"/><path d="M336 440H408" class="edge"/><path d="M712 440H784" class="edge"/><g data-node="开发期TS源码"><rect x="32" y="144" width="304" height="128" rx="6" class="node"/><text x="50" y="176" class="n">开发期TS源码</text><text x="50" y="206" class="s">参数、对象与联合状态</text></g><g data-node="tsc / 框架检查器"><rect x="408" y="144" width="304" height="128" rx="6" class="info"/><text x="426" y="176" class="n">tsc / 框架检查器</text><text x="426" y="206" class="s">推断、收窄与类型关系</text><text x="426" y="233" class="s">noEmit只检查</text></g><g data-node="诊断结果"><rect x="784" y="144" width="304" height="128" rx="6" class="node"/><text x="802" y="176" class="n">诊断结果</text><text x="802" y="206" class="s">失败则修正合同</text><text x="802" y="233" class="s">通过也不验证真实JSON</text></g><g data-node="运行时外部输入"><rect x="32" y="376" width="304" height="128" rx="6" class="node"/><text x="50" y="408" class="n">运行时外部输入</text><text x="50" y="438" class="s">网络、存储与用户输入</text><text x="50" y="465" class="s">先作为unknown</text></g><g data-node="parseProduct"><rect x="408" y="376" width="304" height="128" rx="6" class="good"/><text x="426" y="408" class="n">parseProduct</text><text x="426" y="438" class="s">检查对象、字段、整数分</text><text x="426" y="465" class="s">不匹配则抛错</text></g><g data-node="内部Product"><rect x="784" y="376" width="304" height="128" rx="6" class="node"/><text x="802" y="408" class="n">内部Product</text><text x="802" y="438" class="s">只返回已校验字段</text><text x="802" y="465" class="s">业务权限仍需服务端</text></g><text x="32" y="668" class="s">as Product与泛型参数不执行校验；enum等TS语法还可能生成运行时代码。</text></svg>
