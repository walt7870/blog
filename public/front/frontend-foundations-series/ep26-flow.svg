<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="816" viewBox="0 0 1120 816" role="img" aria-labelledby="ep26-title ep26-desc"><title id="ep26-title">测试范围决定结果能证明什么</title><desc id="ep26-desc">同一个商品保存需求，在不同层验证不同合同；截图是补充证据。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#607568"/></marker><style>text{font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;letter-spacing:0;fill:#253c30}.h{font-size:28px;font-weight:600}.n{font-size:21px;font-weight:600}.s{font-size:18px;fill:#52685b}.node{fill:#fff;stroke:#a6b9ad;stroke-width:1.5}.info{fill:#edf3fb;stroke:#739bbf;stroke-width:1.5}.good{fill:#e9f4ee;stroke:#397657;stroke-width:1.5}.warn{fill:#f8eef1;stroke:#ae7789;stroke-width:1.5}.edge{fill:none;stroke:#607568;stroke-width:2;marker-end:url(#arrow)}</style></defs><rect width="1120" height="816" fill="white"/><text x="32" y="44" class="h">测试范围决定结果能证明什么</text><text x="32" y="82" class="s">同一个商品保存需求，在不同层验证不同合同；截图是补充证据。</text><g data-node="单元：规则与边界"><rect x="32" y="144" width="512" height="152" rx="6" class="node"/><text x="50" y="176" class="n">单元：规则与边界</text><text x="50" y="206" class="s">页码、金额、名称合同</text><text x="50" y="233" class="s">输入 → 函数 → 断言</text><text x="50" y="260" class="s">不证明组件绑定</text></g><g data-node="组件：交互与反馈"><rect x="576" y="144" width="512" height="152" rx="6" class="info"/><text x="594" y="176" class="n">组件：交互与反馈</text><text x="594" y="206" class="s">输入、提交、禁用、错误与焦点</text><text x="594" y="233" class="s">组件可在模拟DOM或真实浏览器运行</text><text x="594" y="260" class="s">替代接口不证明真实保存</text></g><g data-node="集成：模块连接"><rect x="32" y="368" width="512" height="152" rx="6" class="node"/><text x="50" y="400" class="n">集成：模块连接</text><text x="50" y="430" class="s">路由ID、缓存、草稿与保存服务</text><text x="50" y="457" class="s">故意安排慢请求和412冲突</text><text x="50" y="484" class="s">明确哪些依赖被mock</text></g><g data-node="端到端：受控完整链路"><rect x="576" y="368" width="512" height="152" rx="6" class="good"/><text x="594" y="400" class="n">端到端：受控完整链路</text><text x="594" y="430" class="s">专用环境编辑后刷新并回读</text><text x="594" y="457" class="s">包含真实服务才证明持久化</text><text x="594" y="484" class="s">测试数据与外部动作可清理</text></g><g data-node="视觉回归：固定字体、数据、主题与实际布局宽度，再审查差异"><rect x="32" y="600" width="1056" height="104" rx="6" class="node"/><text x="50" y="632" class="n">视觉回归：固定字体、数据、主题与实际布局宽度，再审查差异</text><text x="50" y="662" class="s">不能用截图正确代替业务正确，也不能自动接受所有新基线</text></g><text x="32" y="788" class="s">失败保留版本与复现证据；覆盖率和重试成功都不能单独证明全部需求正确。</text></svg>
