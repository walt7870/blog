<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="696" viewBox="0 0 1120 696" role="img" aria-labelledby="ep21-title ep21-desc"><title id="ep21-title">各类检查独立提供证据，再汇入门禁</title><desc id="ep21-desc">图中没有format通过就代表lint通过的依赖；串行或并行属于流水线安排。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#607568"/></marker><style>text{font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;letter-spacing:0;fill:#253c30}.h{font-size:28px;font-weight:600}.n{font-size:21px;font-weight:600}.s{font-size:18px;fill:#52685b}.node{fill:#fff;stroke:#a6b9ad;stroke-width:1.5}.info{fill:#edf3fb;stroke:#739bbf;stroke-width:1.5}.good{fill:#e9f4ee;stroke:#397657;stroke-width:1.5}.warn{fill:#f8eef1;stroke:#ae7789;stroke-width:1.5}.edge{fill:none;stroke:#607568;stroke-width:2;marker-end:url(#arrow)}</style></defs><rect width="1120" height="696" fill="white"/><text x="32" y="44" class="h">各类检查独立提供证据，再汇入门禁</text><text x="32" y="82" class="s">图中没有format通过就代表lint通过的依赖；串行或并行属于流水线安排。</text><path d="M432 184H632Q640 184 640 192V328Q640 336 648 336H784" class="edge"/><path d="M432 320H592Q600 320 600 328V368Q600 376 608 376H784" class="edge"/><path d="M432 456H592Q600 456 600 448V416Q600 408 608 408H784" class="edge"/><path d="M432 592H632Q640 592 640 584V456Q640 448 648 448H784" class="edge"/><g data-node="Formatter"><rect x="32" y="128" width="400" height="112" rx="6" class="node"/><text x="50" y="160" class="n">Formatter</text><text x="50" y="190" class="s">固定格式与可审查diff</text></g><g data-node="Lint"><rect x="32" y="264" width="400" height="112" rx="6" class="node"/><text x="50" y="296" class="n">Lint</text><text x="50" y="326" class="s">已启用规则与潜在错误</text></g><g data-node="类型检查"><rect x="32" y="400" width="400" height="112" rx="6" class="node"/><text x="50" y="432" class="n">类型检查</text><text x="50" y="462" class="s">内部数据和函数关系</text></g><g data-node="行为测试"><rect x="32" y="536" width="400" height="112" rx="6" class="info"/><text x="50" y="568" class="n">行为测试</text><text x="50" y="598" class="s">1290分必须显示¥12.90</text></g><g data-node="CI发布门禁"><rect x="784" y="296" width="304" height="192" rx="6" class="good"/><text x="802" y="328" class="n">CI发布门禁</text><text x="802" y="358" class="s">干净安装、固定版本</text><text x="802" y="385" class="s">构建与其余检查也需通过</text><text x="802" y="412" class="s">未覆盖需求仍有风险</text></g></svg>
