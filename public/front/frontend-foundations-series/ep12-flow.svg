<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="584" viewBox="0 0 1120 584" role="img" aria-labelledby="title desc"><title id="title">文本先进入节点，再替换展示列表</title><desc id="desc">textContent把商品名当文本；重复渲染替换列表，避免重复累加。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#607568"/></marker><style>text{font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;letter-spacing:0;fill:#253c30}.h{font-size:28px;font-weight:600}.n{font-size:21px;font-weight:600}.s{font-size:18px;fill:#52685b}.node{fill:#fff;stroke:#a6b9ad;stroke-width:1.5}.info{fill:#edf3fb;stroke:#739bbf;stroke-width:1.5}.good{fill:#e9f4ee;stroke:#397657;stroke-width:1.5}.warn{fill:#f8eef1;stroke:#ae7789;stroke-width:1.5}.edge{fill:none;stroke:#607568;stroke-width:2;marker-end:url(#arrow)}</style></defs><rect width="1120" height="584" fill="white"/><text x="32" y="44" class="h">文本先进入节点，再替换展示列表</text><text x="32" y="82" class="s">textContent把商品名当文本；重复渲染替换列表，避免重复累加。</text><path d="M272 208H304" class="edge"/><path d="M544 208H576" class="edge"/><path d="M816 208H848" class="edge"/><g data-node="商品名称数组"><rect x="32" y="144" width="240" height="136" rx="6" class="node"/><text x="50" y="176" class="n">商品名称数组</text><text x="50" y="206" class="s">含尖括号的名称</text><text x="50" y="233" class="s">仍是普通字符串</text></g><g data-node="createElement(li)"><rect x="304" y="144" width="240" height="136" rx="6" class="info"/><text x="322" y="176" class="n">createElement(li)</text><text x="322" y="206" class="s">设置textContent</text><text x="322" y="233" class="s">不解析为img节点</text></g><g data-node="DocumentFragment"><rect x="576" y="144" width="240" height="136" rx="6" class="node"/><text x="594" y="176" class="n">DocumentFragment</text><text x="594" y="206" class="s">离线组织子树</text><text x="594" y="233" class="s">插入时子节点移动</text></g><g data-node="replaceChildren"><rect x="848" y="144" width="240" height="136" rx="6" class="good"/><text x="866" y="176" class="n">replaceChildren</text><text x="866" y="206" class="s">替换展示列表</text><text x="866" y="233" class="s">有意重建这些li</text></g><g data-node="后续样式、布局与绘制由浏览器调度"><rect x="32" y="368" width="1056" height="104" rx="6" class="node"/><text x="50" y="400" class="n">后续样式、布局与绘制由浏览器调度</text><text x="50" y="430" class="s">读写几何交错可能强制同步布局；Fragment不保证固定次数的重排或性能收益</text></g><text x="32" y="556" class="s">交互式编辑列表另需保留焦点与节点身份；更新DOM不等于同一时刻已经上屏。</text></svg>
