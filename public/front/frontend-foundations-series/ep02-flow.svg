<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="752" viewBox="0 0 1120 752" role="img" aria-labelledby="title desc"><title id="title">HTML 与样式分别进入渲染计算</title><desc id="desc">HTML解析会发现子资源；下载、解析与执行可以交错，图示表达依赖关系。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#607568"/></marker><style>text{font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;letter-spacing:0;fill:#253c30}.h{font-size:28px;font-weight:600}.n{font-size:21px;font-weight:600}.s{font-size:18px;fill:#52685b}.node{fill:#fff;stroke:#a6b9ad;stroke-width:1.5}.info{fill:#edf3fb;stroke:#739bbf;stroke-width:1.5}.good{fill:#e9f4ee;stroke:#397657;stroke-width:1.5}.warn{fill:#f8eef1;stroke:#ae7789;stroke-width:1.5}.edge{fill:none;stroke:#607568;stroke-width:2;marker-end:url(#arrow)}</style></defs><rect width="1120" height="752" fill="white"/><text x="32" y="44" class="h">HTML 与样式分别进入渲染计算</text><text x="32" y="82" class="s">HTML解析会发现子资源；下载、解析与执行可以交错，图示表达依赖关系。</text><path d="M288 196H360" class="edge"/><path d="M656 196H760" class="edge"/><path d="M508 264V336" class="edge"/><path d="M656 392H760" class="edge"/><path d="M924 264V336" class="edge"/><path d="M924 448V528" class="edge"/><g data-node="导航取文档"><rect x="32" y="136" width="256" height="128" rx="6" class="node"/><text x="50" y="168" class="n">导航取文档</text><text x="50" y="198" class="s">缓存 / Service Worker</text><text x="50" y="225" class="s">或DNS、连接与HTTP</text></g><g data-node="HTML解析"><rect x="360" y="136" width="296" height="128" rx="6" class="info"/><text x="378" y="168" class="n">HTML解析</text><text x="378" y="198" class="s">边接收边解析</text><text x="378" y="225" class="s">发现CSS、脚本与图片</text></g><g data-node="DOM"><rect x="760" y="136" width="328" height="128" rx="6" class="node"/><text x="778" y="168" class="n">DOM</text><text x="778" y="198" class="s">文档结构</text><text x="778" y="225" class="s">脚本可在运行中修改</text></g><g data-node="CSS资源 → 样式规则"><rect x="360" y="336" width="296" height="112" rx="6" class="node"/><text x="378" y="368" class="n">CSS资源 → 样式规则</text><text x="378" y="398" class="s">经网络或缓存取得</text></g><g data-node="样式计算与布局"><rect x="760" y="336" width="328" height="112" rx="6" class="node"/><text x="778" y="368" class="n">样式计算与布局</text><text x="778" y="398" class="s">DOM与CSS规则共同参与</text></g><g data-node="绘制与合成"><rect x="760" y="528" width="328" height="112" rx="6" class="good"/><text x="778" y="560" class="n">绘制与合成</text><text x="778" y="590" class="s">生成屏幕结果</text></g><text x="32" y="556" class="s">JavaScript可修改DOM和样式</text><text x="32" y="590" class="s">交互、图片与字体会引发后续更新</text><text x="32" y="724" class="s">经典脚本可能暂停解析；defer、async与模块脚本的执行时机不同。</text></svg>
