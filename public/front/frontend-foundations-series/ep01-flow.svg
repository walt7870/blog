<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="624" viewBox="0 0 1120 624" role="img" aria-labelledby="title desc"><title id="title">开发机与浏览器使用不同的运行入口</title><desc id="desc">构建产物连接开发流程与用户访问；SSR还需要请求时的服务端运行环境。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#607568"/></marker><style>text{font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;letter-spacing:0;fill:#253c30}.h{font-size:28px;font-weight:600}.n{font-size:21px;font-weight:600}.s{font-size:18px;fill:#52685b}.node{fill:#fff;stroke:#a6b9ad;stroke-width:1.5}.info{fill:#edf3fb;stroke:#739bbf;stroke-width:1.5}.good{fill:#e9f4ee;stroke:#397657;stroke-width:1.5}.warn{fill:#f8eef1;stroke:#ae7789;stroke-width:1.5}.edge{fill:none;stroke:#607568;stroke-width:2;marker-end:url(#arrow)}</style></defs><rect width="1120" height="624" fill="white"/><text x="32" y="44" class="h">开发机与浏览器使用不同的运行入口</text><text x="32" y="82" class="s">构建产物连接开发流程与用户访问；SSR还需要请求时的服务端运行环境。</text><text x="32" y="124" class="s">开发与发布</text><path d="M336 208H408" class="edge"/><path d="M712 208H784" class="edge"/><path d="M936 272V376" class="edge"/><g data-node="源码与依赖"><rect x="32" y="144" width="304" height="128" rx="6" class="node"/><text x="50" y="176" class="n">源码与依赖</text><text x="50" y="206" class="s">HTML / CSS / TS / 组件</text><text x="50" y="233" class="s">锁文件固定依赖</text></g><g data-node="开发机工具"><rect x="408" y="144" width="304" height="128" rx="6" class="info"/><text x="426" y="176" class="n">开发机工具</text><text x="426" y="206" class="s">Node / Vite / 类型检查</text><text x="426" y="233" class="s">Lint / 测试</text></g><g data-node="部署产物"><rect x="784" y="144" width="304" height="128" rx="6" class="node"/><text x="802" y="176" class="n">部署产物</text><text x="802" y="206" class="s">HTML / CSS / JS / 资源</text><text x="802" y="233" class="s">Web服务器或CDN</text></g><text x="32" y="344" class="s">用户访问</text><path d="M784 440H712" class="edge"/><path d="M408 440H336" class="edge"/><g data-node="浏览器加载"><rect x="784" y="376" width="304" height="128" rx="6" class="node"/><text x="802" y="408" class="n">浏览器加载</text><text x="802" y="438" class="s">请求文档与依赖资源</text></g><g data-node="平台与组件运行"><rect x="408" y="376" width="304" height="128" rx="6" class="good"/><text x="426" y="408" class="n">平台与组件运行</text><text x="426" y="438" class="s">DOM / 样式 / 事件</text><text x="426" y="465" class="s">框架组织状态更新</text></g><g data-node="业务接口"><rect x="32" y="376" width="304" height="128" rx="6" class="node"/><text x="50" y="408" class="n">业务接口</text><text x="50" y="438" class="s">服务端校验身份与库存</text><text x="50" y="465" class="s">页面处理成功与失败</text></g><text x="32" y="596" class="s">图中业务接口箭头表示请求；响应沿调用返回。SSR服务另在服务器生成HTML。</text></svg>
