<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="640" viewBox="0 0 1120 640" role="img" aria-labelledby="title desc"><title id="title">布局机制按空间关系组合</title><desc id="desc">普通内容、工具栏、网格与角标可以同时出现在一个页面中。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#607568"/></marker><style>text{font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;letter-spacing:0;fill:#253c30}.h{font-size:28px;font-weight:600}.n{font-size:21px;font-weight:600}.s{font-size:18px;fill:#52685b}.node{fill:#fff;stroke:#a6b9ad;stroke-width:1.5}.info{fill:#edf3fb;stroke:#739bbf;stroke-width:1.5}.good{fill:#e9f4ee;stroke:#397657;stroke-width:1.5}.warn{fill:#f8eef1;stroke:#ae7789;stroke-width:1.5}.edge{fill:none;stroke:#607568;stroke-width:2;marker-end:url(#arrow)}</style></defs><rect width="1120" height="640" fill="white"/><text x="32" y="44" class="h">布局机制按空间关系组合</text><text x="32" y="82" class="s">普通内容、工具栏、网格与角标可以同时出现在一个页面中。</text><g data-node="普通流：商品说明"><rect x="32" y="144" width="304" height="320" rx="6" class="node"/><text x="50" y="176" class="n">普通流：商品说明</text><text x="50" y="206" class="s">标题</text><text x="50" y="233" class="s">正文随内容向下排</text><text x="50" y="260" class="s">后续说明保持阅读顺序</text></g><g data-node="Flex：工具栏"><rect x="408" y="144" width="680" height="136" rx="6" class="node"/><text x="426" y="176" class="n">Flex：工具栏</text><text x="426" y="206" class="s">名称占剩余空间，操作按钮保持尺寸</text><text x="426" y="233" class="s">主轴分配；换行后各行独立</text></g><g data-node="Grid：商品列表"><rect x="408" y="336" width="416" height="128" rx="6" class="node"/><text x="426" y="368" class="n">Grid：商品列表</text><text x="426" y="398" class="s">列1        列2</text><text x="426" y="425" class="s">行列轨道共同约束</text></g><g data-node="定位：角标"><rect x="856" y="336" width="232" height="128" rx="6" class="info"/><text x="874" y="368" class="n">定位：角标</text><text x="874" y="398" class="s">relative容器</text><text x="874" y="425" class="s">absolute覆盖</text></g><text x="32" y="612" class="s">border-box包含padding与border、不含margin；自动最小尺寸与长内容需独立检查。</text></svg>
