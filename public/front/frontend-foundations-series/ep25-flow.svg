<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="808" viewBox="0 0 1120 808" role="img" aria-labelledby="ep25-title ep25-desc"><title id="ep25-title">商品编辑区分查询快照与本地草稿</title><desc id="ep25-desc">后台重新验证不能直接覆盖用户未提交的名称。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#607568"/></marker><style>text{font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;letter-spacing:0;fill:#253c30}.h{font-size:28px;font-weight:600}.n{font-size:21px;font-weight:600}.s{font-size:18px;fill:#52685b}.node{fill:#fff;stroke:#a6b9ad;stroke-width:1.5}.info{fill:#edf3fb;stroke:#739bbf;stroke-width:1.5}.good{fill:#e9f4ee;stroke:#397657;stroke-width:1.5}.warn{fill:#f8eef1;stroke:#ae7789;stroke-width:1.5}.edge{fill:none;stroke:#607568;stroke-width:2;marker-end:url(#arrow)}</style></defs><rect width="1120" height="808" fill="white"/><text x="32" y="44" class="h">商品编辑区分查询快照与本地草稿</text><text x="32" y="82" class="s">后台重新验证不能直接覆盖用户未提交的名称。</text><path d="M336 208H408" class="edge"/><path d="M712 208H784" class="edge"/><path d="M936 272V392" class="edge"/><path d="M784 448H712" class="edge"/><path d="M936 504V592" class="edge"/><g data-node="URL确定资源"><rect x="32" y="144" width="304" height="128" rx="6" class="node"/><text x="50" y="176" class="n">URL确定资源</text><text x="50" y="206" class="s">商品ID、筛选与页码</text><text x="50" y="233" class="s">参数校验，旧请求保护</text></g><g data-node="查询与缓存"><rect x="408" y="144" width="304" height="128" rx="6" class="node"/><text x="426" y="176" class="n">查询与缓存</text><text x="426" y="206" class="s">服务端快照、ETag</text><text x="426" y="233" class="s">按身份与条件隔离</text></g><g data-node="编辑草稿"><rect x="784" y="144" width="304" height="128" rx="6" class="info"/><text x="802" y="176" class="n">编辑草稿</text><text x="802" y="206" class="s">名称、dirty、基准版本</text><text x="802" y="233" class="s">不被后台刷新静默覆盖</text></g><g data-node="条件保存"><rect x="784" y="392" width="304" height="112" rx="6" class="node"/><text x="802" y="424" class="n">条件保存</text><text x="802" y="454" class="s">PATCH与If-Match</text><text x="802" y="481" class="s">服务端验证权限和版本</text></g><g data-node="412：保留草稿"><rect x="408" y="392" width="304" height="112" rx="6" class="warn"/><text x="426" y="424" class="n">412：保留草稿</text><text x="426" y="454" class="s">读取新版本，比较与合并</text></g><text x="732" y="420" class="s">412</text><text x="960" y="556" class="s">2xx</text><g data-node="保存确认后更新查询"><rect x="784" y="592" width="304" height="112" rx="6" class="good"/><text x="802" y="624" class="n">保存确认后更新查询</text><text x="802" y="654" class="s">重新读取详情和列表</text><text x="802" y="681" class="s">刷新失败单独反馈</text></g><text x="32" y="780" class="s">其他保存失败也需保留草稿；客户端取消等待不能证明写入没有发生。</text></svg>
