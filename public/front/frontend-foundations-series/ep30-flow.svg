<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="696" viewBox="0 0 1120 696" role="img" aria-labelledby="ep30-title ep30-desc"><title id="ep30-title">AI前端改造从可验证行为开始</title><desc id="ep30-desc">例：名称筛选进入URL，旧请求不能覆盖新结果，失败后条件仍保留。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#607568"/></marker><style>text{font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;letter-spacing:0;fill:#253c30}.h{font-size:28px;font-weight:600}.n{font-size:21px;font-weight:600}.s{font-size:18px;fill:#52685b}.node{fill:#fff;stroke:#a6b9ad;stroke-width:1.5}.info{fill:#edf3fb;stroke:#739bbf;stroke-width:1.5}.good{fill:#e9f4ee;stroke:#397657;stroke-width:1.5}.warn{fill:#f8eef1;stroke:#ae7789;stroke-width:1.5}.edge{fill:none;stroke:#607568;stroke-width:2;marker-end:url(#arrow)}</style></defs><rect width="1120" height="696" fill="white"/><text x="32" y="44" class="h">AI前端改造从可验证行为开始</text><text x="32" y="82" class="s">例：名称筛选进入URL，旧请求不能覆盖新结果，失败后条件仍保留。</text><path d="M272 208H304" class="edge"/><path d="M544 208H576" class="edge"/><path d="M816 208H848" class="edge"/><g data-node="任务合同"><rect x="32" y="144" width="240" height="136" rx="6" class="node"/><text x="50" y="176" class="n">任务合同</text><text x="50" y="206" class="s">目标、现状、边界</text><text x="50" y="233" class="s">行为与独立反例</text></g><g data-node="上下文与改动"><rect x="304" y="144" width="240" height="136" rx="6" class="info"/><text x="322" y="176" class="n">上下文与改动</text><text x="322" y="206" class="s">真实入口和版本</text><text x="322" y="233" class="s">沿用现有组件与层次</text></g><g data-node="分层验证"><rect x="576" y="144" width="240" height="136" rx="6" class="node"/><text x="594" y="176" class="n">分层验证</text><text x="594" y="206" class="s">类型、行为与浏览器</text><text x="594" y="233" class="s">按风险检查其他边界</text></g><g data-node="可追踪交付"><rect x="848" y="144" width="240" height="136" rx="6" class="good"/><text x="866" y="176" class="n">可追踪交付</text><text x="866" y="206" class="s">审查diff与依赖</text><text x="866" y="233" class="s">版本、范围和恢复</text></g><g data-node="基础能力验证：能独立解释状态归属、请求竞态和失败恢复"><rect x="32" y="392" width="1056" height="112" rx="6" class="node"/><text x="50" y="424" class="n">基础能力验证：能独立解释状态归属、请求竞态和失败恢复</text><text x="50" y="454" class="s">原型探索、规范约束与代理执行可以组合；生成代码和生成测试可能共享错误假设</text></g><text x="32" y="668" class="s">受控夹具不冒充真实接口验收；性能和截图结论必须来自实际运行与观察。</text></svg>
