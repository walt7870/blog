<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="736" viewBox="0 0 1120 736" role="img" aria-labelledby="ep31-title ep31-desc"><title id="ep31-title">React先处理更新，再提交采用的界面</title><desc id="ep31-desc">同一次点击从数量1开始，三次函数式更新依次得到2、3、4。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#607568"/></marker><style>text{font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;letter-spacing:0;fill:#253c30}.h{font-size:28px;font-weight:600}.n{font-size:21px;font-weight:600}.s{font-size:18px;fill:#52685b}.node{fill:#fff;stroke:#a6b9ad;stroke-width:1.5}.info{fill:#edf3fb;stroke:#739bbf;stroke-width:1.5}.good{fill:#e9f4ee;stroke:#397657;stroke-width:1.5}.warn{fill:#f8eef1;stroke:#ae7789;stroke-width:1.5}.edge{fill:none;stroke:#607568;stroke-width:2;marker-end:url(#arrow)}</style></defs><rect width="1120" height="736" fill="white"/><text x="32" y="44" class="h">React先处理更新，再提交采用的界面</text><text x="32" y="82" class="s">同一次点击从数量1开始，三次函数式更新依次得到2、3、4。</text><path d="M272 208H304" class="edge"/><path d="M544 208H576" class="edge"/><path d="M816 208H848" class="edge"/><g data-node="事件中的快照"><rect x="32" y="144" width="240" height="136" rx="6" class="node"/><text x="50" y="176" class="n">事件中的快照</text><text x="50" y="206" class="s">quantity = 1</text><text x="50" y="233" class="s">闭包值不会原地变</text></g><g data-node="更新队列"><rect x="304" y="144" width="240" height="136" rx="6" class="info"/><text x="322" y="176" class="n">更新队列</text><text x="322" y="206" class="s">q→q+1，连续三次</text><text x="322" y="233" class="s">待处理值依次传递</text></g><g data-node="渲染尝试"><rect x="576" y="144" width="240" height="136" rx="6" class="node"/><text x="594" y="176" class="n">渲染尝试</text><text x="594" y="206" class="s">读取新状态4</text><text x="594" y="233" class="s">纯计算下一份界面</text></g><g data-node="Commit"><rect x="848" y="144" width="240" height="136" rx="6" class="good"/><text x="866" y="176" class="n">Commit</text><text x="866" y="206" class="s">采用的结果写DOM</text><text x="866" y="233" class="s">绘制由浏览器完成</text></g><g data-node="列表身份：同一父级中的类型、位置与key"><rect x="32" y="392" width="512" height="160" rx="6" class="node"/><text x="50" y="424" class="n">列表身份：同一父级中的类型、位置与key</text><text x="50" y="454" class="s">业务ID随商品移动，备注仍属于原商品</text><text x="50" y="481" class="s">位置索引保留的是原位置状态</text><text x="50" y="508" class="s">每次随机key会重建并丢失草稿</text></g><g data-node="Effect：建立与撤销外部同步"><rect x="576" y="392" width="512" height="160" rx="6" class="node"/><text x="594" y="424" class="n">Effect：建立与撤销外部同步</text><text x="594" y="454" class="s">依赖变化：旧cleanup → 新setup</text><text x="594" y="481" class="s">卸载：cleanup；开发期还有额外检查</text><text x="594" y="508" class="s">不用于复制总价或自动触发下单</text></g><text x="32" y="708" class="s">渲染可重新尝试或放弃；组件函数和状态更新函数都不能直接产生外部副作用。</text></svg>
