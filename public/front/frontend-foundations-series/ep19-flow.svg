<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="680" viewBox="0 0 1120 680" role="img" aria-labelledby="ep19-title ep19-desc"><title id="ep19-title">依赖锁定后，安装仍受环境合同约束</title><desc id="ep19-desc">声明说明需要什么；锁文件记录解析结果，工具版本与平台决定安装环境。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#607568"/></marker><style>text{font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;letter-spacing:0;fill:#253c30}.h{font-size:28px;font-weight:600}.n{font-size:21px;font-weight:600}.s{font-size:18px;fill:#52685b}.node{fill:#fff;stroke:#a6b9ad;stroke-width:1.5}.info{fill:#edf3fb;stroke:#739bbf;stroke-width:1.5}.good{fill:#e9f4ee;stroke:#397657;stroke-width:1.5}.warn{fill:#f8eef1;stroke:#ae7789;stroke-width:1.5}.edge{fill:none;stroke:#607568;stroke-width:2;marker-end:url(#arrow)}</style></defs><rect width="1120" height="680" fill="white"/><text x="32" y="44" class="h">依赖锁定后，安装仍受环境合同约束</text><text x="32" y="82" class="s">声明说明需要什么；锁文件记录解析结果，工具版本与平台决定安装环境。</text><path d="M336 208H408" class="edge"/><path d="M712 208H784" class="edge"/><path d="M936 272V392" class="edge"/><g data-node="package.json"><rect x="32" y="144" width="304" height="128" rx="6" class="node"/><text x="50" y="176" class="n">package.json</text><text x="50" y="206" class="s">直接依赖、版本范围</text><text x="50" y="233" class="s">scripts与项目约定</text></g><g data-node="受控依赖更新"><rect x="408" y="144" width="304" height="128" rx="6" class="node"/><text x="426" y="176" class="n">受控依赖更新</text><text x="426" y="206" class="s">审查包与生命周期脚本</text><text x="426" y="233" class="s">生成或更新lockfile</text></g><g data-node="已提交锁文件"><rect x="784" y="144" width="304" height="128" rx="6" class="info"/><text x="802" y="176" class="n">已提交锁文件</text><text x="802" y="206" class="s">具体版本与完整性</text><text x="802" y="233" class="s">变更和声明一起审查</text></g><g data-node="Node与包管理器版本、参数、平台及原生扩展"><rect x="32" y="392" width="656" height="112" rx="6" class="node"/><text x="50" y="424" class="n">Node与包管理器版本、参数、平台及原生扩展</text><text x="50" y="454" class="s">完整性不证明包安全；间接依赖不能代替直接声明</text></g><g data-node="CI冻结安装"><rect x="784" y="392" width="304" height="112" rx="6" class="good"/><text x="802" y="424" class="n">CI冻结安装</text><text x="802" y="454" class="s">npm ci / pnpm冻结安装</text><text x="802" y="481" class="s">检查后生成浏览器产物</text></g><text x="32" y="652" class="s">devDependencies也可能参与浏览器打包；静态部署与SSR运行依赖应分别核对。</text></svg>
