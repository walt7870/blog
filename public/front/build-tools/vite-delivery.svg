<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="688" viewBox="0 0 1120 688" role="img" aria-labelledby="vite-delivery-title vite-delivery-desc"><title id="vite-delivery-title">Vite开发与生产使用不同的资源路径</title><desc id="vite-delivery-desc">Vite 8：Rolldown组织依赖与打包，Oxc处理JavaScript转换和默认压缩。</desc><defs><marker id="vite-delivery-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#607568"/></marker><style>text{font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;letter-spacing:0;fill:#253c30}.h{font-size:28px;font-weight:600}.n{font-size:21px;font-weight:600}.s{font-size:18px;fill:#52685b}.node{fill:white;stroke:#a6b9ad;stroke-width:1.5}.info{fill:#edf3fb;stroke:#739bbf;stroke-width:1.5}.good{fill:#e9f4ee;stroke:#397657;stroke-width:1.5}.edge{fill:none;stroke:#607568;stroke-width:2;marker-end:url(#vite-delivery-arrow)}</style></defs><rect width="1120" height="688" fill="white"/><text x="32" y="44" class="h">Vite开发与生产使用不同的资源路径</text><text x="32" y="82" class="s">Vite 8：Rolldown组织依赖与打包，Oxc处理JavaScript转换和默认压缩。</text><path d="M336 208H408" class="edge"/><path d="M712 208H784" class="edge"/><path d="M336 440H408" class="edge"/><path d="M712 440H784" class="edge"/><g data-node="开发浏览器"><rect x="32" y="144" width="304" height="128" rx="6" class="node"/><text x="50" y="176" class="n">开发浏览器</text><text x="50" y="206" class="s">请求源码模块</text><text x="50" y="233" class="s">index.html → main.ts</text></g><g data-node="Dev Server与插件"><rect x="408" y="144" width="304" height="128" rx="6" class="info"/><text x="426" y="176" class="n">Dev Server与插件</text><text x="426" y="206" class="s">按需转换与依赖优化</text><text x="426" y="233" class="s">受影响模块寻找HMR边界</text></g><g data-node="局部更新或整页刷新"><rect x="784" y="144" width="304" height="128" rx="6" class="node"/><text x="802" y="176" class="n">局部更新或整页刷新</text><text x="802" y="206" class="s">取决于模块与框架插件</text><text x="802" y="233" class="s">不保证任意状态保留</text></g><g data-node="生产源码与锁文件"><rect x="32" y="376" width="304" height="128" rx="6" class="node"/><text x="50" y="408" class="n">生产源码与锁文件</text><text x="50" y="438" class="s">先独立类型检查</text><text x="50" y="465" class="s">vite build</text></g><g data-node="生产产物"><rect x="408" y="376" width="304" height="128" rx="6" class="good"/><text x="426" y="408" class="n">生产产物</text><text x="426" y="438" class="s">HTML / CSS / JS / 资源</text><text x="426" y="465" class="s">base = /shop/</text></g><g data-node="生产服务器与浏览器"><rect x="784" y="376" width="304" height="128" rx="6" class="node"/><text x="802" y="408" class="n">生产服务器与浏览器</text><text x="802" y="438" class="s">按前缀提供完整资源</text><text x="802" y="465" class="s">API、重写和缓存另配置</text></g><text x="32" y="660" class="s">开发代理不会进入dist；客户端环境变量都是可见配置，不存服务端密钥。</text></svg>
