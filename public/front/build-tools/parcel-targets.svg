<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="704" viewBox="0 0 1120 704" role="img" aria-labelledby="parcel-targets-title parcel-targets-desc"><title id="parcel-targets-title">Parcel沿资源图为目标环境生成产物</title><desc id="parcel-targets-desc">入口发现依赖，target决定环境与输出，public-url决定资源引用前缀。</desc><defs><marker id="parcel-targets-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#607568"/></marker><style>text{font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;letter-spacing:0;fill:#253c30}.h{font-size:28px;font-weight:600}.n{font-size:21px;font-weight:600}.s{font-size:18px;fill:#52685b}.node{fill:white;stroke:#a6b9ad;stroke-width:1.5}.info{fill:#edf3fb;stroke:#739bbf;stroke-width:1.5}.good{fill:#e9f4ee;stroke:#397657;stroke-width:1.5}.edge{fill:none;stroke:#607568;stroke-width:2;marker-end:url(#parcel-targets-arrow)}</style></defs><rect width="1120" height="704" fill="white"/><text x="32" y="44" class="h">Parcel沿资源图为目标环境生成产物</text><text x="32" y="82" class="s">入口发现依赖，target决定环境与输出，public-url决定资源引用前缀。</text><path d="M272 208H304" class="edge"/><path d="M544 208H576" class="edge"/><path d="M816 208H848" class="edge"/><g data-node="HTML入口"><rect x="32" y="144" width="240" height="136" rx="6" class="node"/><text x="50" y="176" class="n">HTML入口</text><text x="50" y="206" class="s">module脚本</text><text x="50" y="233" class="s">CSS与资源URL</text></g><g data-node="资源依赖图"><rect x="304" y="144" width="240" height="136" rx="6" class="info"/><text x="322" y="176" class="n">资源依赖图</text><text x="322" y="206" class="s">解析、转换、打包</text><text x="322" y="233" class="s">插件按类型参与</text></g><g data-node="Target合同"><rect x="576" y="144" width="240" height="136" rx="6" class="node"/><text x="594" y="176" class="n">Target合同</text><text x="594" y="206" class="s">浏览器或Node目标</text><text x="594" y="233" class="s">输出格式与目录</text></g><g data-node="Web产物"><rect x="848" y="144" width="240" height="136" rx="6" class="good"/><text x="866" y="176" class="n">Web产物</text><text x="866" y="206" class="s">HTML / CSS / JS</text><text x="866" y="233" class="s">资源前缀/shop/</text></g><g data-node="package.json也影响目标"><rect x="32" y="392" width="512" height="128" rx="6" class="node"/><text x="50" y="424" class="n">package.json也影响目标</text><text x="50" y="454" class="s">应用示例移除默认main字段</text><text x="50" y="481" class="s">browserslist控制实际支持环境</text></g><g data-node="浏览器验收"><rect x="576" y="392" width="512" height="128" rx="6" class="node"/><text x="594" y="424" class="n">浏览器验收</text><text x="594" y="454" class="s">从产物服务器打开、点击并刷新</text><text x="594" y="481" class="s">检查URL、类型、CSS与错误恢复</text></g><text x="32" y="676" class="s">转换TypeScript不等于完整类型检查；零配置不等于无需部署和兼容性合同。</text></svg>
