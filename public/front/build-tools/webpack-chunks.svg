<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="736" viewBox="0 0 1120 736" role="img" aria-labelledby="webpack-chunks-title webpack-chunks-desc"><title id="webpack-chunks-title">Webpack产物由HTML与运行时共同加载</title><desc id="webpack-chunks-desc">loader转换模块，plugin参与编译与输出；动态导入建立延迟加载边界。</desc><defs><marker id="webpack-chunks-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#607568"/></marker><style>text{font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;letter-spacing:0;fill:#253c30}.h{font-size:28px;font-weight:600}.n{font-size:21px;font-weight:600}.s{font-size:18px;fill:#52685b}.node{fill:white;stroke:#a6b9ad;stroke-width:1.5}.info{fill:#edf3fb;stroke:#739bbf;stroke-width:1.5}.good{fill:#e9f4ee;stroke:#397657;stroke-width:1.5}.edge{fill:none;stroke:#607568;stroke-width:2;marker-end:url(#webpack-chunks-arrow)}</style></defs><rect width="1120" height="736" fill="white"/><text x="32" y="44" class="h">Webpack产物由HTML与运行时共同加载</text><text x="32" y="82" class="s">loader转换模块，plugin参与编译与输出；动态导入建立延迟加载边界。</text><path d="M272 208H304" class="edge"/><path d="M544 208H576" class="edge"/><path d="M816 208H848" class="edge"/><g data-node="入口main.js"><rect x="32" y="144" width="240" height="136" rx="6" class="node"/><text x="50" y="176" class="n">入口main.js</text><text x="50" y="206" class="s">import style.css</text><text x="50" y="233" class="s">import(report.js)</text></g><g data-node="模块图与转换"><rect x="304" y="144" width="240" height="136" rx="6" class="info"/><text x="322" y="176" class="n">模块图与转换</text><text x="322" y="206" class="s">CSS loader链</text><text x="322" y="233" class="s">插件参与输出</text></g><g data-node="完整产物"><rect x="576" y="144" width="240" height="136" rx="6" class="good"/><text x="594" y="176" class="n">完整产物</text><text x="594" y="206" class="s">HTML、入口JS、CSS</text><text x="594" y="233" class="s">独立报表chunk</text></g><g data-node="/shop/资源服务"><rect x="848" y="144" width="240" height="136" rx="6" class="node"/><text x="866" y="176" class="n">/shop/资源服务</text><text x="866" y="206" class="s">URL前缀正确</text><text x="866" y="233" class="s">缺chunk应返回404</text></g><path d="M336 440H408" class="edge"/><path d="M712 440H784" class="edge"/><g data-node="打开页面"><rect x="32" y="376" width="304" height="128" rx="6" class="node"/><text x="50" y="408" class="n">打开页面</text><text x="50" y="438" class="s">HTML引用入口JS和CSS</text></g><g data-node="点击导出"><rect x="408" y="376" width="304" height="128" rx="6" class="node"/><text x="426" y="408" class="n">点击导出</text><text x="426" y="438" class="s">运行时请求报表chunk</text><text x="426" y="465" class="s">成功后计算49.80元</text></g><g data-node="失败恢复"><rect x="784" y="376" width="304" height="128" rx="6" class="node"/><text x="802" y="408" class="n">失败恢复</text><text x="802" y="438" class="s">显示错误，恢复按钮</text><text x="802" y="465" class="s">新发布保留旧版本chunk</text></g><text x="32" y="708" class="s">output.path是磁盘位置，publicPath是资源URL；production不保证任意代码都能删除。</text></svg>
