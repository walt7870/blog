<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="752" viewBox="0 0 1120 752" role="img" aria-labelledby="ecosystem-boundaries-title ecosystem-boundaries-desc"><title id="ecosystem-boundaries-title">从组件到交付，各层负责不同问题</title><desc id="ecosystem-boundaries-desc">商品页可以同时采用组件框架、应用框架与构建工具；选择不是互斥四选一。</desc><defs><marker id="ecosystem-boundaries-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#607568"/></marker><style>text{font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;letter-spacing:0;fill:#253c30}.h{font-size:28px;font-weight:600}.n{font-size:21px;font-weight:600}.s{font-size:18px;fill:#52685b}.node{fill:white;stroke:#a6b9ad;stroke-width:1.5}.info{fill:#edf3fb;stroke:#739bbf;stroke-width:1.5}.good{fill:#e9f4ee;stroke:#397657;stroke-width:1.5}.edge{fill:none;stroke:#607568;stroke-width:2;marker-end:url(#ecosystem-boundaries-arrow)}</style></defs><rect width="1120" height="752" fill="white"/><text x="32" y="44" class="h">从组件到交付，各层负责不同问题</text><text x="32" y="82" class="s">商品页可以同时采用组件框架、应用框架与构建工具；选择不是互斥四选一。</text><path d="M336 208H408" class="edge"/><path d="M712 208H784" class="edge"/><path d="M936 280V392" class="edge"/><g data-node="组件与状态"><rect x="32" y="144" width="304" height="136" rx="6" class="node"/><text x="50" y="176" class="n">组件与状态</text><text x="50" y="206" class="s">数量、筛选、草稿</text><text x="50" y="233" class="s">React / Vue / Angular / Svelte</text></g><g data-node="Web应用组织"><rect x="408" y="144" width="304" height="136" rx="6" class="info"/><text x="426" y="176" class="n">Web应用组织</text><text x="426" y="206" class="s">路由、数据加载、渲染</text><text x="426" y="233" class="s">Next / Nuxt / SvelteKit等</text></g><g data-node="工程构建"><rect x="784" y="144" width="304" height="136" rx="6" class="node"/><text x="802" y="176" class="n">工程构建</text><text x="802" y="206" class="s">模块、资源、质量检查</text><text x="802" y="233" class="s">Vite / Webpack / Parcel</text></g><g data-node="Web交付"><rect x="784" y="392" width="304" height="128" rx="6" class="good"/><text x="802" y="424" class="n">Web交付</text><text x="802" y="454" class="s">SSG：静态资源服务器</text><text x="802" y="481" class="s">SSR：请求运行时与资源</text></g><g data-node="跨端采用另需平台合同"><rect x="32" y="392" width="656" height="128" rx="6" class="node"/><text x="50" y="424" class="n">跨端采用另需平台合同</text><text x="50" y="454" class="s">移动端、小程序、桌面各有渲染与插件边界</text><text x="50" y="481" class="s">共享业务逻辑不代表支付、权限与发布审核通用</text></g><text x="32" y="724" class="s">库发布另看Rollup的消费格式与外部依赖；首屏与交互性能必须用同条件数据验证。</text></svg>
