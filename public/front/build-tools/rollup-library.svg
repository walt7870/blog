<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="736" viewBox="0 0 1120 736" role="img" aria-labelledby="rollup-library-title rollup-library-desc"><title id="rollup-library-title">库发布需要同时满足生成与消费合同</title><desc id="rollup-library-desc">入口导出是公共API；外部依赖保留导入，由消费环境按合同提供。</desc><defs><marker id="rollup-library-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#607568"/></marker><style>text{font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;letter-spacing:0;fill:#253c30}.h{font-size:28px;font-weight:600}.n{font-size:21px;font-weight:600}.s{font-size:18px;fill:#52685b}.node{fill:white;stroke:#a6b9ad;stroke-width:1.5}.info{fill:#edf3fb;stroke:#739bbf;stroke-width:1.5}.good{fill:#e9f4ee;stroke:#397657;stroke-width:1.5}.edge{fill:none;stroke:#607568;stroke-width:2;marker-end:url(#rollup-library-arrow)}</style></defs><rect width="1120" height="736" fill="white"/><text x="32" y="44" class="h">库发布需要同时满足生成与消费合同</text><text x="32" y="82" class="s">入口导出是公共API；外部依赖保留导入，由消费环境按合同提供。</text><path d="M336 208H408" class="edge"/><path d="M712 180H784" class="edge"/><path d="M712 236H744Q752 236 752 244V292Q752 300 760 300H784" class="edge"/><g data-node="src/index.js"><rect x="32" y="144" width="304" height="136" rx="6" class="node"/><text x="50" y="176" class="n">src/index.js</text><text x="50" y="206" class="s">formatCents / sumCents</text><text x="50" y="233" class="s">输入验证与稳定导出</text></g><g data-node="Rollup构建"><rect x="408" y="144" width="304" height="136" rx="6" class="info"/><text x="426" y="176" class="n">Rollup构建</text><text x="426" y="206" class="s">模块解析与Tree Shaking</text><text x="426" y="233" class="s">按output生成格式</text></g><g data-node="dist/index.js"><rect x="784" y="120" width="304" height="104" rx="6" class="good"/><text x="802" y="152" class="n">dist/index.js</text><text x="802" y="182" class="s">ESM消费者import</text></g><g data-node="dist/index.cjs"><rect x="784" y="248" width="304" height="104" rx="6" class="good"/><text x="802" y="280" class="n">dist/index.cjs</text><text x="802" y="310" class="s">CJS消费者require</text></g><g data-node="exports与安装包"><rect x="32" y="440" width="512" height="136" rx="6" class="node"/><text x="50" y="472" class="n">exports与安装包</text><text x="50" y="502" class="s">条件路径指向真实文件</text><text x="50" y="529" class="s">files包含dist；类型声明另生成</text></g><g data-node="external与peerDependency"><rect x="576" y="440" width="512" height="136" rx="6" class="node"/><text x="594" y="472" class="n">external与peerDependency</text><text x="594" y="502" class="s">打包合同与安装版本合同分别声明</text><text x="594" y="529" class="s">不会自动提供浏览器全局对象或解析器</text></g><text x="32" y="708" class="s">消费端只用部分导出后可再裁剪；库入口未在当前工程调用的导出仍属于公共API。</text></svg>
