<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="650" viewBox="0 0 1120 650" role="img" aria-labelledby="state-ownership-t state-ownership-d"><title id="state-ownership-t">草稿、共享偏好和服务端事实分开管理</title><desc id="state-ownership-d">保存成功前保留草稿；服务端返回结果后再同步详情与列表。</desc><defs><marker id="state-ownership-a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#607568"/></marker><style>text{font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;letter-spacing:0;fill:#253c30}.h{font-size:28px;font-weight:600}.n{font-size:21px;font-weight:600}.s{font-size:18px;fill:#52685b}.node{fill:white;stroke:#a6b9ad;stroke-width:1.5}.info{fill:#edf3fb;stroke:#739bbf;stroke-width:1.5}.good{fill:#e9f4ee;stroke:#397657;stroke-width:1.5}.edge{fill:none;stroke:#607568;stroke-width:2;marker-end:url(#state-ownership-a)}</style></defs><rect width="1120" height="650" fill="white"/><text x="32" y="44" class="h">草稿、共享偏好和服务端事实分开管理</text><text x="32" y="82" class="s">保存成功前保留草稿；服务端返回结果后再同步详情与列表。</text><path d="M336 205H408" class="edge"/><path d="M712 205H784" class="edge"/><path d="M936 270V354" class="edge"/><path d="M784 419H712" class="edge"/><g data-node="URL与组件草稿"><rect x="32" y="140" width="304" height="130" rx="6" class="node"/><text x="50" y="172" class="n">URL与组件草稿</text><text x="50" y="202" class="s">筛选、页码、编辑数量</text><text x="50" y="228" class="s">输入校验和未保存提醒</text></g><g data-node="提交边界"><rect x="408" y="140" width="304" height="130" rx="6" class="info"/><text x="426" y="172" class="n">提交边界</text><text x="426" y="202" class="s">禁用重复点击</text><text x="426" y="228" class="s">后端幂等与权限仍必需</text></g><g data-node="服务端事实"><rect x="784" y="140" width="304" height="130" rx="6" class="node"/><text x="802" y="172" class="n">服务端事实</text><text x="802" y="202" class="s">库存、金额、订单状态</text><text x="802" y="228" class="s">校验响应与错误分支</text></g><g data-node="查询缓存"><rect x="784" y="354" width="304" height="130" rx="6" class="node"/><text x="802" y="386" class="n">查询缓存</text><text x="802" y="416" class="s">按租户与订单标识分键</text><text x="802" y="442" class="s">旧请求不能覆盖新页面</text></g><g data-node="显示与后续同步"><rect x="408" y="354" width="304" height="130" rx="6" class="good"/><text x="426" y="386" class="n">显示与后续同步</text><text x="426" y="416" class="s">更新详情，使列表失效</text><text x="426" y="442" class="s">失败保留草稿并可重试</text></g><g data-node="客户端共享store"><rect x="32" y="354" width="304" height="130" rx="6" class="node"/><text x="50" y="386" class="n">客户端共享store</text><text x="50" y="416" class="s">主题、跨页购物车</text><text x="50" y="442" class="s">持久化结构需迁移与清理</text></g><text x="32" y="612" class="s">缓存新鲜度、无观察者回收和真正的服务端事务，是不同生命周期。</text></svg>
