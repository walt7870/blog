<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="650" viewBox="0 0 1120 650" role="img" aria-labelledby="quality-gates-t quality-gates-d"><title id="quality-gates-t">让不同检查层覆盖不同的失败方式</title><desc id="quality-gates-d">检查命令可独立执行，CI对同一提交快照保留可复查结果。</desc><defs><marker id="quality-gates-a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#607568"/></marker><style>text{font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;letter-spacing:0;fill:#253c30}.h{font-size:28px;font-weight:600}.n{font-size:21px;font-weight:600}.s{font-size:18px;fill:#52685b}.node{fill:white;stroke:#a6b9ad;stroke-width:1.5}.info{fill:#edf3fb;stroke:#739bbf;stroke-width:1.5}.good{fill:#e9f4ee;stroke:#397657;stroke-width:1.5}.edge{fill:none;stroke:#607568;stroke-width:2;marker-end:url(#quality-gates-a)}</style></defs><rect width="1120" height="650" fill="white"/><text x="32" y="44" class="h">让不同检查层覆盖不同的失败方式</text><text x="32" y="82" class="s">检查命令可独立执行，CI对同一提交快照保留可复查结果。</text><path d="M336 205H408" class="edge"/><path d="M712 205H784" class="edge"/><path d="M936 270V354" class="edge"/><path d="M784 419H712" class="edge"/><g data-node="格式检查"><rect x="32" y="140" width="304" height="130" rx="6" class="node"/><text x="50" y="172" class="n">格式检查</text><text x="50" y="202" class="s">Prettier检查差异</text><text x="50" y="228" class="s">CI不自动修复后直接发布</text></g><g data-node="静态规则"><rect x="408" y="140" width="304" height="130" rx="6" class="info"/><text x="426" y="172" class="n">静态规则</text><text x="426" y="202" class="s">ESLint与Stylelint</text><text x="426" y="228" class="s">核对匹配文件与配置版本</text></g><g data-node="类型合同"><rect x="784" y="140" width="304" height="130" rx="6" class="node"/><text x="802" y="172" class="n">类型合同</text><text x="802" y="202" class="s">tsc或vue-tsc</text><text x="802" y="228" class="s">远端JSON仍需运行时校验</text></g><g data-node="行为与真实页面"><rect x="784" y="354" width="304" height="130" rx="6" class="good"/><text x="802" y="386" class="n">行为与真实页面</text><text x="802" y="416" class="s">金额、失败恢复、权限</text><text x="802" y="442" class="s">浏览器布局和操作</text></g><g data-node="同一制品交付"><rect x="408" y="354" width="304" height="130" rx="6" class="node"/><text x="426" y="386" class="n">同一制品交付</text><text x="426" y="416" class="s">构建、验收与发布对应</text><text x="426" y="442" class="s">不重新安装生成另一份</text></g><g data-node="故意制造失败"><rect x="32" y="354" width="304" height="130" rx="6" class="node"/><text x="50" y="386" class="n">故意制造失败</text><text x="50" y="416" class="s">坏缩进、未声明变量</text><text x="50" y="442" class="s">证明检查确实能阻止错误</text></g><text x="32" y="612" class="s">编辑器与hook提供快速反馈；可跳过的本地hook不能作为唯一质量门禁。</text></svg>
