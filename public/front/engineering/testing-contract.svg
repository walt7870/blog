<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="650" viewBox="0 0 1120 650" role="img" aria-labelledby="testing-contract-t testing-contract-d"><title id="testing-contract-t">按订单提交的失败后果分配测试</title><desc id="testing-contract-d">单元保护规则，集成保护协作，浏览器保护实际运行链路。</desc><defs><marker id="testing-contract-a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#607568"/></marker><style>text{font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;letter-spacing:0;fill:#253c30}.h{font-size:28px;font-weight:600}.n{font-size:21px;font-weight:600}.s{font-size:18px;fill:#52685b}.node{fill:white;stroke:#a6b9ad;stroke-width:1.5}.info{fill:#edf3fb;stroke:#739bbf;stroke-width:1.5}.good{fill:#e9f4ee;stroke:#397657;stroke-width:1.5}.edge{fill:none;stroke:#607568;stroke-width:2;marker-end:url(#testing-contract-a)}</style></defs><rect width="1120" height="650" fill="white"/><text x="32" y="44" class="h">按订单提交的失败后果分配测试</text><text x="32" y="82" class="s">单元保护规则，集成保护协作，浏览器保护实际运行链路。</text><path d="M336 205H408" class="edge"/><path d="M712 205H784" class="edge"/><path d="M936 270V354" class="edge"/><path d="M784 419H712" class="edge"/><g data-node="规则测试"><rect x="32" y="140" width="304" height="130" rx="6" class="node"/><text x="50" y="172" class="n">规则测试</text><text x="50" y="202" class="s">数量边界、金额溢出</text><text x="50" y="228" class="s">故意改错计算应失败</text></g><g data-node="组件与受控接口"><rect x="408" y="140" width="304" height="130" rx="6" class="info"/><text x="426" y="172" class="n">组件与受控接口</text><text x="426" y="202" class="s">输入、校验、409冲突</text><text x="426" y="228" class="s">慢响应与失败保留草稿</text></g><g data-node="真实浏览器"><rect x="784" y="140" width="304" height="130" rx="6" class="node"/><text x="802" y="172" class="n">真实浏览器</text><text x="802" y="202" class="s">隔离账号与唯一订单</text><text x="802" y="228" class="s">保存后刷新并读持久结果</text></g><g data-node="实际交付环境"><rect x="784" y="354" width="304" height="130" rx="6" class="good"/><text x="802" y="386" class="n">实际交付环境</text><text x="802" y="416" class="s">深层路由、缓存、旧分包</text><text x="802" y="442" class="s">窄屏、焦点、错误提示</text></g><g data-node="失败证据与清理"><rect x="408" y="354" width="304" height="130" rx="6" class="node"/><text x="426" y="386" class="n">失败证据与清理</text><text x="426" y="416" class="s">截图、请求与测试标识</text><text x="426" y="442" class="s">重置缓存、计时器和数据</text></g><g data-node="模拟能力的边界"><rect x="32" y="354" width="304" height="130" rx="6" class="node"/><text x="50" y="386" class="n">模拟能力的边界</text><text x="50" y="416" class="s">mock能控制异常输入</text><text x="50" y="442" class="s">不能证明真实后端正确</text></g><text x="32" y="612" class="s">比例和覆盖率不是正确性证明；关键是可执行断言与明确的环境边界。</text></svg>
