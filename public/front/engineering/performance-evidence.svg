<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="650" viewBox="0 0 1120 650" role="img" aria-labelledby="performance-evidence-t performance-evidence-d"><title id="performance-evidence-t">从用户现象进入对应的性能证据</title><desc id="performance-evidence-d">先记录同设备、网络、数据量与缓存状态，再决定优化动作。</desc><defs><marker id="performance-evidence-a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#607568"/></marker><style>text{font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;letter-spacing:0;fill:#253c30}.h{font-size:28px;font-weight:600}.n{font-size:21px;font-weight:600}.s{font-size:18px;fill:#52685b}.node{fill:white;stroke:#a6b9ad;stroke-width:1.5}.info{fill:#edf3fb;stroke:#739bbf;stroke-width:1.5}.good{fill:#e9f4ee;stroke:#397657;stroke-width:1.5}.edge{fill:none;stroke:#607568;stroke-width:2;marker-end:url(#performance-evidence-a)}</style></defs><rect width="1120" height="650" fill="white"/><text x="32" y="44" class="h">从用户现象进入对应的性能证据</text><text x="32" y="82" class="s">先记录同设备、网络、数据量与缓存状态，再决定优化动作。</text><path d="M336 205H408" class="edge"/><path d="M712 205H784" class="edge"/><path d="M336 419H408" class="edge"/><path d="M712 419H784" class="edge"/><g data-node="主要内容迟到"><rect x="32" y="140" width="304" height="130" rx="6" class="node"/><text x="50" y="172" class="n">主要内容迟到</text><text x="50" y="202" class="s">LCP、HTML响应时间</text><text x="50" y="228" class="s">Network关键资源瀑布</text></g><g data-node="资源还是渲染等待"><rect x="408" y="140" width="304" height="130" rx="6" class="info"/><text x="426" y="172" class="n">资源还是渲染等待</text><text x="426" y="202" class="s">首字节、图片与关键CSS</text><text x="426" y="228" class="s">脚本和主线程工作</text></g><g data-node="针对原因调整"><rect x="784" y="140" width="304" height="130" rx="6" class="node"/><text x="802" y="172" class="n">针对原因调整</text><text x="802" y="202" class="s">缩短关键路径、按需加载</text><text x="802" y="228" class="s">首屏主图不机械懒加载</text></g><g data-node="交互卡顿或布局跳动"><rect x="32" y="354" width="304" height="130" rx="6" class="node"/><text x="50" y="386" class="n">交互卡顿或布局跳动</text><text x="50" y="416" class="s">INP交互与长任务</text><text x="50" y="442" class="s">CLS轨迹与缺失尺寸</text></g><g data-node="计算、DOM与几何"><rect x="408" y="354" width="304" height="130" rx="6" class="node"/><text x="426" y="386" class="n">计算、DOM与几何</text><text x="426" y="416" class="s">排序、重复渲染与布局</text><text x="426" y="442" class="s">图片、字体和异步内容</text></g><g data-node="受控复测与线上观察"><rect x="784" y="354" width="304" height="130" rx="6" class="good"/><text x="802" y="386" class="n">受控复测与线上观察</text><text x="802" y="416" class="s">检查功能、多个样本分布</text><text x="802" y="442" class="s">真实访问按版本与设备看</text></g><text x="32" y="612" class="s">LCP≤2.5秒、INP≤200毫秒、CLS≤0.1；真实访问第75百分位，不能用单次高分替代。</text></svg>
