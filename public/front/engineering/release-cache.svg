<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="650" viewBox="0 0 1120 650" role="img" aria-labelledby="release-cache-t release-cache-d"><title id="release-cache-t">先提供完整资源，再切换入口并保留旧会话</title><desc id="release-cache-d">旧标签页在发布后首次加载导出模块，仍会请求旧chunk的原URL。</desc><defs><marker id="release-cache-a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#607568"/></marker><style>text{font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;letter-spacing:0;fill:#253c30}.h{font-size:28px;font-weight:600}.n{font-size:21px;font-weight:600}.s{font-size:18px;fill:#52685b}.node{fill:white;stroke:#a6b9ad;stroke-width:1.5}.info{fill:#edf3fb;stroke:#739bbf;stroke-width:1.5}.good{fill:#e9f4ee;stroke:#397657;stroke-width:1.5}.edge{fill:none;stroke:#607568;stroke-width:2;marker-end:url(#release-cache-a)}</style></defs><rect width="1120" height="650" fill="white"/><text x="32" y="44" class="h">先提供完整资源，再切换入口并保留旧会话</text><text x="32" y="82" class="s">旧标签页在发布后首次加载导出模块，仍会请求旧chunk的原URL。</text><path d="M336 205H408" class="edge"/><path d="M712 205H784" class="edge"/><path d="M936 270V354" class="edge"/><path d="M784 419H712" class="edge"/><path d="M408 419H336" class="edge"/><g data-node="固定输入与构建"><rect x="32" y="140" width="304" height="130" rx="6" class="node"/><text x="50" y="172" class="n">固定输入与构建</text><text x="50" y="202" class="s">运行环境、安装器和锁</text><text x="50" y="228" class="s">提交标识与产物校验</text></g><g data-node="先上传hash资源"><rect x="408" y="140" width="304" height="130" rx="6" class="info"/><text x="426" y="172" class="n">先上传hash资源</text><text x="426" y="202" class="s">新资源可访问后再切换</text><text x="426" y="228" class="s">仍支持的旧资源继续提供</text></g><g data-node="切换HTML入口"><rect x="784" y="140" width="304" height="130" rx="6" class="node"/><text x="802" y="172" class="n">切换HTML入口</text><text x="802" y="202" class="s">入口及时再验证</text><text x="802" y="228" class="s">新HTML只引用已存在资源</text></g><g data-node="新旧页面并存"><rect x="784" y="354" width="304" height="130" rx="6" class="good"/><text x="802" y="386" class="n">新旧页面并存</text><text x="802" y="416" class="s">深层路由与动态导入</text><text x="802" y="442" class="s">API合同与配置兼容</text></g><g data-node="观察与回退"><rect x="408" y="354" width="304" height="130" rx="6" class="node"/><text x="426" y="386" class="n">观察与回退</text><text x="426" y="416" class="s">资源错误、接口和业务</text><text x="426" y="442" class="s">回退检查CDN与配置</text></g><g data-node="支持窗口后清理"><rect x="32" y="354" width="304" height="130" rx="6" class="node"/><text x="50" y="386" class="n">支持窗口后清理</text><text x="50" y="416" class="s">核对旧资源使用与保留期</text><text x="50" y="442" class="s">不在发布时无差别删除</text></g><text x="32" y="612" class="s">只保留旧版本目录但原URL不可达，仍不能保护旧标签页；HTTP200也不证明客户端启动。</text></svg>
