<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="650" viewBox="0 0 1120 650" role="img" aria-labelledby="frontend-delivery-t frontend-delivery-d"><title id="frontend-delivery-t">订单页面从交互到交付的责任边界</title><desc id="frontend-delivery-d">相同用户流程会跨越组件、接口、构建和部署，需要按证据定位。</desc><defs><marker id="frontend-delivery-a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#607568"/></marker><style>text{font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;letter-spacing:0;fill:#253c30}.h{font-size:28px;font-weight:600}.n{font-size:21px;font-weight:600}.s{font-size:18px;fill:#52685b}.node{fill:white;stroke:#a6b9ad;stroke-width:1.5}.info{fill:#edf3fb;stroke:#739bbf;stroke-width:1.5}.good{fill:#e9f4ee;stroke:#397657;stroke-width:1.5}.edge{fill:none;stroke:#607568;stroke-width:2;marker-end:url(#frontend-delivery-a)}</style></defs><rect width="1120" height="650" fill="white"/><text x="32" y="44" class="h">订单页面从交互到交付的责任边界</text><text x="32" y="82" class="s">相同用户流程会跨越组件、接口、构建和部署，需要按证据定位。</text><path d="M336 205H408" class="edge"/><path d="M712 205H784" class="edge"/><path d="M936 270V354" class="edge"/><path d="M784 419H712" class="edge"/><path d="M408 419H336" class="edge"/><g data-node="浏览器与组件"><rect x="32" y="140" width="304" height="130" rx="6" class="node"/><text x="50" y="172" class="n">浏览器与组件</text><text x="50" y="202" class="s">结构、事件、输入数量</text><text x="50" y="228" class="s">先处理空值与可访问性</text></g><g data-node="状态与接口"><rect x="408" y="140" width="304" height="130" rx="6" class="info"/><text x="426" y="172" class="n">状态与接口</text><text x="426" y="202" class="s">草稿、请求、缓存身份</text><text x="426" y="228" class="s">保存失败保留编辑内容</text></g><g data-node="检查与构建"><rect x="784" y="140" width="304" height="130" rx="6" class="node"/><text x="802" y="172" class="n">检查与构建</text><text x="802" y="202" class="s">规则、类型、行为测试</text><text x="802" y="228" class="s">生成带版本的静态产物</text></g><g data-node="资源与入口发布"><rect x="784" y="354" width="304" height="130" rx="6" class="node"/><text x="802" y="386" class="n">资源与入口发布</text><text x="802" y="416" class="s">先上传不可变资源</text><text x="802" y="442" class="s">再切换HTML入口</text></g><g data-node="真实页面验收"><rect x="408" y="354" width="304" height="130" rx="6" class="good"/><text x="426" y="386" class="n">真实页面验收</text><text x="426" y="416" class="s">深层路由刷新与分包</text><text x="426" y="442" class="s">明暗、窄屏和错误状态</text></g><g data-node="观测与恢复"><rect x="32" y="354" width="304" height="130" rx="6" class="node"/><text x="50" y="386" class="n">观测与恢复</text><text x="50" y="416" class="s">按版本定位失败</text><text x="50" y="442" class="s">保留旧资源与回滚路径</text></g><text x="32" y="612" class="s">框架组织代码；运行环境、接口合同与发布缓存仍各有独立边界。</text></svg>
