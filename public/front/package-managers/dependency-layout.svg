<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="688" viewBox="0 0 1120 688" role="img" aria-labelledby="dependency-layout-title dependency-layout-desc"><title id="dependency-layout-title">pnpm把内容复用与项目依赖图分开组织</title><desc id="dependency-layout-desc">假设admin直接依赖ui，ui直接依赖helper；admin使用helper时仍应自己声明。</desc><defs><marker id="dependency-layout-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#607568"/></marker><style>text{font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;letter-spacing:0;fill:#253c30}.h{font-size:28px;font-weight:600}.n{font-size:21px;font-weight:600}.s{font-size:18px;fill:#52685b}.node{fill:white;stroke:#a6b9ad;stroke-width:1.5}.info{fill:#edf3fb;stroke:#739bbf;stroke-width:1.5}.good{fill:#e9f4ee;stroke:#397657;stroke-width:1.5}.edge{fill:none;stroke:#607568;stroke-width:2;marker-end:url(#dependency-layout-arrow)}</style></defs><rect width="1120" height="688" fill="white"/><text x="32" y="44" class="h">pnpm把内容复用与项目依赖图分开组织</text><text x="32" y="82" class="s">假设admin直接依赖ui，ui直接依赖helper；admin使用helper时仍应自己声明。</text><path d="M336 208H408" class="edge"/><path d="M712 208H784" class="edge"/><path d="M936 280V376" class="edge"/><g data-node="内容寻址store"><rect x="32" y="144" width="304" height="136" rx="6" class="node"/><text x="50" y="176" class="n">内容寻址store</text><text x="50" y="206" class="s">共享包文件内容</text><text x="50" y="233" class="s">导入方式受文件系统影响</text></g><g data-node="项目虚拟store"><rect x="408" y="144" width="304" height="136" rx="6" class="info"/><text x="426" y="176" class="n">项目虚拟store</text><text x="426" y="206" class="s">.pnpm中的依赖实例</text><text x="426" y="233" class="s">按依赖图组织链接</text></g><g data-node="admin的直接依赖"><rect x="784" y="144" width="304" height="136" rx="6" class="node"/><text x="802" y="176" class="n">admin的直接依赖</text><text x="802" y="206" class="s">admin → ui</text><text x="802" y="233" class="s">根目录可见性受配置影响</text></g><g data-node="ui的依赖上下文"><rect x="784" y="376" width="304" height="136" rx="6" class="node"/><text x="802" y="408" class="n">ui的依赖上下文</text><text x="802" y="438" class="s">ui → helper</text><text x="802" y="465" class="s">peer上下文可产生多实例</text></g><g data-node="依赖合同仍要在每个包声明"><rect x="32" y="376" width="656" height="136" rx="6" class="good"/><text x="50" y="408" class="n">依赖合同仍要在每个包声明</text><text x="50" y="438" class="s">admin若直接import helper，应在admin声明它</text><text x="50" y="465" class="s">提升与工具解析可能使未声明依赖偶然可见，不能当作正确性证明</text></g><text x="32" y="650" class="s">workspace:*要求本地工作区匹配；锁文件、脚本批准与peer版本需要分别核对。</text></svg>
