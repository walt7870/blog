<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="688" viewBox="0 0 1120 688" role="img" aria-labelledby="bun-script-trust-title bun-script-trust-desc"><title id="bun-script-trust-title">依赖安装成功，不代表构建脚本与运行时都已验证</title><desc id="bun-script-trust-desc">Bun安装器、生命周期策略和应用运行时是三个不同选择。</desc><defs><marker id="bun-script-trust-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#607568"/></marker><style>text{font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;letter-spacing:0;fill:#253c30}.h{font-size:28px;font-weight:600}.n{font-size:21px;font-weight:600}.s{font-size:18px;fill:#52685b}.node{fill:white;stroke:#a6b9ad;stroke-width:1.5}.info{fill:#edf3fb;stroke:#739bbf;stroke-width:1.5}.good{fill:#e9f4ee;stroke:#397657;stroke-width:1.5}.edge{fill:none;stroke:#607568;stroke-width:2;marker-end:url(#bun-script-trust-arrow)}</style></defs><rect width="1120" height="688" fill="white"/><text x="32" y="44" class="h">依赖安装成功，不代表构建脚本与运行时都已验证</text><text x="32" y="82" class="s">Bun安装器、生命周期策略和应用运行时是三个不同选择。</text><path d="M336 208H408" class="edge"/><path d="M712 208H784" class="edge"/><path d="M936 280V376" class="edge"/><g data-node="清单与bun.lock"><rect x="32" y="144" width="304" height="136" rx="6" class="node"/><text x="50" y="176" class="n">清单与bun.lock</text><text x="50" y="206" class="s">固定Bun版本</text><text x="50" y="233" class="s">冻结安装核对一致性</text></g><g data-node="依赖脚本信任策略"><rect x="408" y="144" width="304" height="136" rx="6" class="info"/><text x="426" y="176" class="n">依赖脚本信任策略</text><text x="426" y="206" class="s">内置名单与项目声明</text><text x="426" y="233" class="s">先审查再允许执行</text></g><g data-node="安装与原生构建"><rect x="784" y="144" width="304" height="136" rx="6" class="node"/><text x="802" y="176" class="n">安装与原生构建</text><text x="802" y="206" class="s">未批准可能跳过脚本</text><text x="802" y="233" class="s">退出0不保证二进制存在</text></g><g data-node="实际运行与回归"><rect x="784" y="376" width="304" height="136" rx="6" class="good"/><text x="802" y="408" class="n">实际运行与回归</text><text x="802" y="438" class="s">确认Node或Bun运行时</text><text x="802" y="465" class="s">验证平台模块与测试</text></g><g data-node="失败恢复与迁移基线"><rect x="32" y="376" width="656" height="136" rx="6" class="node"/><text x="50" y="408" class="n">失败恢复与迁移基线</text><text x="50" y="438" class="s">脚本缺失先定位包与用途，不全局允许全部代码</text><text x="50" y="465" class="s">迁移在副本进行，保留旧锁、旧安装器和可重现构建</text></g><text x="32" y="650" class="s">packageManager记录预期，不会自动让Corepack管理Bun；速度收益需同环境量测。</text></svg>
