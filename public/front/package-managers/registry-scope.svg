<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="688" viewBox="0 0 1120 688" role="img" aria-labelledby="registry-scope-title registry-scope-desc"><title id="registry-scope-title">包名路由与凭证作用范围分别配置</title><desc id="registry-scope-desc">公共包与@company私有包走各自入口，认证只发送到绑定的仓库。</desc><defs><marker id="registry-scope-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#607568"/></marker><style>text{font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;letter-spacing:0;fill:#253c30}.h{font-size:28px;font-weight:600}.n{font-size:21px;font-weight:600}.s{font-size:18px;fill:#52685b}.node{fill:white;stroke:#a6b9ad;stroke-width:1.5}.info{fill:#edf3fb;stroke:#739bbf;stroke-width:1.5}.good{fill:#e9f4ee;stroke:#397657;stroke-width:1.5}.edge{fill:none;stroke:#607568;stroke-width:2;marker-end:url(#registry-scope-arrow)}</style></defs><rect width="1120" height="688" fill="white"/><text x="32" y="44" class="h">包名路由与凭证作用范围分别配置</text><text x="32" y="82" class="s">公共包与@company私有包走各自入口，认证只发送到绑定的仓库。</text><path d="M336 208H408" class="edge"/><path d="M712 208H784" class="edge"/><path d="M336 440H408" class="edge"/><path d="M712 440H784" class="edge"/><g data-node="公共包请求"><rect x="32" y="144" width="304" height="136" rx="6" class="node"/><text x="50" y="176" class="n">公共包请求</text><text x="50" y="206" class="s">如is-number</text><text x="50" y="233" class="s">检查锁中解析地址</text></g><g data-node="公共registry或代理"><rect x="408" y="144" width="304" height="136" rx="6" class="node"/><text x="426" y="176" class="n">公共registry或代理</text><text x="426" y="206" class="s">公共镜像、企业缓存</text><text x="426" y="233" class="s">不附私有源认证</text></g><g data-node="公共包内容"><rect x="784" y="144" width="304" height="136" rx="6" class="node"/><text x="802" y="176" class="n">公共包内容</text><text x="802" y="206" class="s">校验完整性与来源</text><text x="802" y="233" class="s">仍需审查执行脚本</text></g><g data-node="@company私有包"><rect x="32" y="376" width="304" height="136" rx="6" class="node"/><text x="50" y="408" class="n">@company私有包</text><text x="50" y="438" class="s">显式scope映射</text><text x="50" y="465" class="s">不随意回退公共同名包</text></g><g data-node="企业私有仓库"><rect x="408" y="376" width="304" height="136" rx="6" class="info"/><text x="426" y="408" class="n">企业私有仓库</text><text x="426" y="438" class="s">仅此目标读取NPM_TOKEN</text><text x="426" y="465" class="s">证书链与权限有效</text></g><g data-node="授权读取包内容"><rect x="784" y="376" width="304" height="136" rx="6" class="good"/><text x="802" y="408" class="n">授权读取包内容</text><text x="802" y="438" class="s">安装只读与发布分权</text><text x="802" y="465" class="s">令牌不进入产物或日志</text></g><text x="32" y="650" class="s">现代Yarn使用.yarnrc.yml；npm/pnpm使用对应.npmrc合同，发布还要检查包内容与目标。</text></svg>
