<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="688" viewBox="0 0 1120 688" role="img" aria-labelledby="yarn-resolution-title yarn-resolution-desc"><title id="yarn-resolution-title">Yarn两种linker提供不同的模块解析入口</title><desc id="yarn-resolution-desc">同一个业务导入，在node_modules与PnP下需要不同的解析环境。</desc><defs><marker id="yarn-resolution-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#607568"/></marker><style>text{font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;letter-spacing:0;fill:#253c30}.h{font-size:28px;font-weight:600}.n{font-size:21px;font-weight:600}.s{font-size:18px;fill:#52685b}.node{fill:white;stroke:#a6b9ad;stroke-width:1.5}.info{fill:#edf3fb;stroke:#739bbf;stroke-width:1.5}.good{fill:#e9f4ee;stroke:#397657;stroke-width:1.5}.edge{fill:none;stroke:#607568;stroke-width:2;marker-end:url(#yarn-resolution-arrow)}</style></defs><rect width="1120" height="688" fill="white"/><text x="32" y="44" class="h">Yarn两种linker提供不同的模块解析入口</text><text x="32" y="82" class="s">同一个业务导入，在node_modules与PnP下需要不同的解析环境。</text><path d="M336 208H408" class="edge"/><path d="M712 208H784" class="edge"/><path d="M336 440H408" class="edge"/><path d="M712 440H784" class="edge"/><g data-node="node-modules模式"><rect x="32" y="144" width="304" height="136" rx="6" class="node"/><text x="50" y="176" class="n">node-modules模式</text><text x="50" y="206" class="s">业务代码import包</text><text x="50" y="233" class="s">传统Node工具链</text></g><g data-node="磁盘node_modules"><rect x="408" y="144" width="304" height="136" rx="6" class="node"/><text x="426" y="176" class="n">磁盘node_modules</text><text x="426" y="206" class="s">Node沿目录寻找依赖</text><text x="426" y="233" class="s">布局及提升影响可见范围</text></g><g data-node="包文件执行"><rect x="784" y="144" width="304" height="136" rx="6" class="node"/><text x="802" y="176" class="n">包文件执行</text><text x="802" y="206" class="s">仍需直接依赖声明</text><text x="802" y="233" class="s">工作区有构建先后关系</text></g><g data-node="PnP模式"><rect x="32" y="376" width="304" height="136" rx="6" class="node"/><text x="50" y="408" class="n">PnP模式</text><text x="50" y="438" class="s">yarn node或项目脚本</text><text x="50" y="465" class="s">加载对应解析环境</text></g><g data-node=".pnp.cjs解析映射"><rect x="408" y="376" width="304" height="136" rx="6" class="info"/><text x="426" y="408" class="n">.pnp.cjs解析映射</text><text x="426" y="438" class="s">把请求映射到包内容</text><text x="426" y="465" class="s">编辑器可能需要SDK</text></g><g data-node="缓存或解包内容"><rect x="784" y="376" width="304" height="136" rx="6" class="good"/><text x="802" y="408" class="n">缓存或解包内容</text><text x="802" y="438" class="s">并非必须node_modules</text><text x="802" y="465" class="s">原生包可能需要解包</text></g><text x="32" y="650" class="s">现代Yarn配置在.yarnrc.yml；--immutable禁止修改锁文件，不是禁止所有缓存写入。</text></svg>
