<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="688" viewBox="0 0 1120 688" role="img" aria-labelledby="install-contract-title install-contract-desc"><title id="install-contract-title">固定环境、安装器和依赖图，再验证真实产物</title><desc id="install-contract-desc">锁文件记录解析结果；系统、安装脚本、原生模块和构建仍有独立影响。</desc><defs><marker id="install-contract-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#607568"/></marker><style>text{font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;letter-spacing:0;fill:#253c30}.h{font-size:28px;font-weight:600}.n{font-size:21px;font-weight:600}.s{font-size:18px;fill:#52685b}.node{fill:white;stroke:#a6b9ad;stroke-width:1.5}.info{fill:#edf3fb;stroke:#739bbf;stroke-width:1.5}.good{fill:#e9f4ee;stroke:#397657;stroke-width:1.5}.edge{fill:none;stroke:#607568;stroke-width:2;marker-end:url(#install-contract-arrow)}</style></defs><rect width="1120" height="688" fill="white"/><text x="32" y="44" class="h">固定环境、安装器和依赖图，再验证真实产物</text><text x="32" y="82" class="s">锁文件记录解析结果；系统、安装脚本、原生模块和构建仍有独立影响。</text><path d="M336 208H408" class="edge"/><path d="M712 208H784" class="edge"/><path d="M936 280V376" class="edge"/><path d="M784 440H712" class="edge"/><g data-node="运行环境"><rect x="32" y="144" width="304" height="136" rx="6" class="node"/><text x="50" y="176" class="n">运行环境</text><text x="50" y="206" class="s">Node、操作系统、架构</text><text x="50" y="233" class="s">镜像或版本工具选择</text></g><g data-node="安装器版本"><rect x="408" y="144" width="304" height="136" rx="6" class="info"/><text x="426" y="176" class="n">安装器版本</text><text x="426" y="206" class="s">packageManager声明</text><text x="426" y="233" class="s">Corepack选择pnpm/Yarn</text></g><g data-node="依赖清单与锁文件"><rect x="784" y="144" width="304" height="136" rx="6" class="node"/><text x="802" y="176" class="n">依赖清单与锁文件</text><text x="802" y="206" class="s">名称、范围、确切解析</text><text x="802" y="233" class="s">冻结安装拒绝不一致</text></g><g data-node="下载、链接与脚本"><rect x="784" y="376" width="304" height="136" rx="6" class="node"/><text x="802" y="408" class="n">下载、链接与脚本</text><text x="802" y="438" class="s">registry、缓存与完整性</text><text x="802" y="465" class="s">按工具信任策略执行</text></g><g data-node="构建、测试与产物"><rect x="408" y="376" width="304" height="136" rx="6" class="good"/><text x="426" y="408" class="n">构建、测试与产物</text><text x="426" y="438" class="s">类型、原生能力、资源</text><text x="426" y="465" class="s">不能只看安装退出0</text></g><g data-node="缓存只是输入加速"><rect x="32" y="376" width="304" height="136" rx="6" class="node"/><text x="50" y="408" class="n">缓存只是输入加速</text><text x="50" y="438" class="s">安装器与包内容分别缓存</text><text x="50" y="465" class="s">不代替版本及合同验证</text></g><text x="32" y="650" class="s">Node25起不再捆绑Corepack；普通npm调用默认不由Corepack代理接管。</text></svg>
