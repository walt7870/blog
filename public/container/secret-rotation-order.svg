<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="680" viewBox="0 0 1120 680" role="img" aria-labelledby="secret-rotation-order-title secret-rotation-order-desc">
  <title id="secret-rotation-order-title">数据库凭据轮换时序</title>
  <desc id="secret-rotation-order-desc">发布方先让数据库接受新旧账号，再更新 Secret 并切换应用，验证所有副本的新连接后才撤销旧账号。</desc>
  <defs><marker id="secret-rotation-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#526779"/></marker></defs>
  <style>text{font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#172b3a}.title{font-size:28px;font-weight:700}.h{font-size:20px;font-weight:700}.t{font-size:17px;fill:#465c6b}.box{fill:#fff;stroke:#b6c5cf;stroke-width:1.5}.api{fill:#eaf4fc;stroke:#5686a6;stroke-width:1.5}.run{fill:#edf8f1;stroke:#729c87;stroke-width:1.5}.line{stroke:#b6c5cf;stroke-width:1.5;stroke-dasharray:6 5}.edge{fill:none;stroke:#526779;stroke-width:2;marker-end:url(#secret-rotation-arrow)}.return{stroke-dasharray:6 5}.label{fill:#f7f9fb}</style>
  <rect width="1120" height="680" fill="#f7f9fb"/><text class="title" x="48" y="52">先建立新连接，再撤销旧凭据</text><text class="t" x="48" y="84">前提：数据库允许账号 A、B 在迁移窗口内并存；时间从上向下。</text>
  <path class="line" d="M136 176V572M416 176V572M696 176V572M976 176V572"/>
  <path class="edge" d="M136 228H416"/><path class="edge" d="M136 300H696"/><path class="edge" d="M136 372H976"/>
  <path class="edge" d="M976 444H416"/><path class="edge return" d="M976 508H136"/><path class="edge" d="M136 572H416"/>
  <rect class="box" x="48" y="120" width="176" height="56" rx="6"/><text class="h" x="76" y="156">发布方</text>
  <rect class="run" x="328" y="120" width="176" height="56" rx="6"/><text class="h" x="356" y="156">数据库</text>
  <rect class="api" x="608" y="120" width="176" height="56" rx="6"/><text class="h" x="636" y="156">Secret 对象</text>
  <rect class="box" x="888" y="120" width="176" height="56" rx="6"/><text class="h" x="912" y="156">订单 API 副本</text>
  <rect class="label" x="148" y="194" width="256" height="26"/><text class="t" x="156" y="214">1. 创建 B，A 仍可认证</text>
  <rect class="label" x="240" y="266" width="320" height="26"/><text class="t" x="248" y="286">2. 更新为 B；等待投影同步</text>
  <rect class="label" x="432" y="338" width="388" height="26"/><text class="t" x="440" y="358">3. 重载连接池或受控替换全部副本</text>
  <rect class="label" x="536" y="410" width="332" height="26"/><text class="t" x="544" y="430">4. 使用 B 建立新的业务连接</text>
  <rect class="label" x="336" y="474" width="396" height="26"/><text class="t" x="344" y="494">5. 确认全部消费者已切换及错误率正常</text>
  <rect class="label" x="148" y="538" width="256" height="26"/><text class="t" x="156" y="558">6. 撤销 A，结束重叠窗口</text>
  <text class="t" x="48" y="624">实线表示操作，虚线表示验收结果返回；Secret 不会自行通知数据库修改密码。</text>
  <text class="t" x="48" y="656">撤销 A 前可回退；撤销后，旧工作负载也必须兼容仍有效的凭据 B。</text>
</svg>
