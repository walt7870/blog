<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="650" viewBox="0 0 1120 650" role="img" aria-labelledby="title desc">
  <title id="title">NetworkPolicy 入口来源选择范围</title>
  <desc id="desc">目标是orders中的order-api。同一from项同时设置namespaceSelector与podSelector，选中gateway-system内的gateway。拆成两项则扩大为gateway-system所有Pod和orders内gateway的并集。</desc>
  <style>text{font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#172b3a}.title{font-size:28px;font-weight:700}.h{font-size:20px;font-weight:700}.t{font-size:17px;fill:#465c6b}.zone{fill:none;stroke:#a4b5c1;stroke-width:1.5;stroke-dasharray:6 5}.box{fill:#fff;stroke:#b6c5cf;stroke-width:1.5}.selected{fill:#edf8f1;stroke:#729c87;stroke-width:2}.note{fill:#fbf3e4;stroke:#c1ab7e;stroke-width:1.5}</style>
  <rect width="1120" height="650" fill="#f7f9fb"/>
  <text class="title" x="48" y="54">一个列表项取交集，两个列表项扩大为并集</text>
  <text class="t" x="48" y="88">目标：orders / app=order-api 的入口规则；绿色表示被此来源规则选中的 Pod。</text>
  <text class="h" x="48" y="137">同一项：namespaceSelector AND podSelector</text>
  <text class="h" x="590" y="137">拆成两项：namespaceSelector OR podSelector</text>
  <rect class="zone" x="48" y="162" width="482" height="162" rx="6"/>
  <text class="t" x="68" y="193">namespace：gateway-system</text>
  <rect class="selected" x="68" y="216" width="210" height="80" rx="6"/>
  <text class="h" x="86" y="248">gateway Pod</text><text class="t" x="86" y="279">app=gateway：选中</text>
  <rect class="box" x="298" y="216" width="210" height="80" rx="6"/>
  <text class="h" x="316" y="248">probe Pod</text><text class="t" x="316" y="279">app=probe：不选中</text>
  <rect class="zone" x="590" y="162" width="482" height="162" rx="6"/>
  <text class="t" x="610" y="193">namespace：gateway-system</text>
  <rect class="selected" x="610" y="216" width="210" height="80" rx="6"/>
  <text class="h" x="628" y="248">gateway Pod</text><text class="t" x="628" y="279">命名空间选中</text>
  <rect class="selected" x="840" y="216" width="210" height="80" rx="6"/>
  <text class="h" x="858" y="248">probe Pod</text><text class="t" x="858" y="279">命名空间也选中</text>
  <rect class="zone" x="48" y="350" width="482" height="144" rx="6"/>
  <text class="t" x="68" y="382">namespace：orders（策略所在命名空间）</text>
  <rect class="box" x="68" y="404" width="440" height="66" rx="6"/>
  <text class="h" x="86" y="432">gateway Pod：不选中</text><text class="t" x="86" y="457">不满足 gateway-system 的命名空间条件</text>
  <rect class="zone" x="590" y="350" width="482" height="144" rx="6"/>
  <text class="t" x="610" y="382">namespace：orders（策略所在命名空间）</text>
  <rect class="selected" x="610" y="404" width="440" height="66" rx="6"/>
  <text class="h" x="628" y="432">gateway Pod：也选中</text><text class="t" x="628" y="457">单独的 podSelector 仅作用于本命名空间</text>
  <rect class="note" x="48" y="530" width="1024" height="86" rx="6"/>
  <text class="h" x="68" y="564">来源选中还不够：端口规则和源端 Egress 也必须允许</text>
  <text class="t" x="68" y="596">其他入口策略的允许集合会叠加；新建连接实测才能确认 CNI 数据面已执行预期规则。</text>
</svg>
