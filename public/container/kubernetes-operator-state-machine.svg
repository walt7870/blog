<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560" role="img" aria-labelledby="title desc">
  <title id="title">Operator 调谐状态机</title>
  <desc id="desc">展示读取对象、处理删除、计算差异、执行幂等动作和更新状态的循环。</desc>
  <rect width="1280" height="560" fill="#f5f7fa"/>
  <text x="64" y="58" font-family="sans-serif" font-size="30" font-weight="700" fill="#172033">Reconcile 根据当前事实恢复，不依赖完整事件历史</text>
  <g font-family="sans-serif" text-anchor="middle">
    <rect x="65" y="190" width="165" height="82" rx="8" fill="#fff" stroke="#326ce5" stroke-width="3"/><text x="147" y="224" font-size="20" fill="#172033">读取 CR</text><text x="147" y="251" font-size="17" fill="#526078">不存在则结束</text>
    <polygon points="330,175 430,231 330,287 230,231" fill="#fff4e5" stroke="#d88416" stroke-width="3"/><text x="330" y="226" font-size="19" fill="#172033">正在删除？</text><text x="330" y="250" font-size="16" fill="#526078">deletionTimestamp</text>
    <rect x="490" y="80" width="190" height="82" rx="8" fill="#fff4e5" stroke="#d88416" stroke-width="3"/><text x="585" y="114" font-size="20" fill="#172033">清理外部资源</text><text x="585" y="141" font-size="17" fill="#526078">成功后移除 finalizer</text>
    <rect x="490" y="190" width="190" height="82" rx="8" fill="#fff" stroke="#326ce5" stroke-width="3"/><text x="585" y="224" font-size="20" fill="#172033">计算期望与差异</text><text x="585" y="251" font-size="17" fill="#526078">只看当前事实</text>
    <rect x="760" y="190" width="190" height="82" rx="8" fill="#eaf1ff" stroke="#326ce5" stroke-width="3"/><text x="855" y="224" font-size="20" fill="#172033">执行必要动作</text><text x="855" y="251" font-size="17" fill="#526078">幂等键 + 可查询结果</text>
    <rect x="1030" y="190" width="190" height="82" rx="8" fill="#eaf8ef" stroke="#2f8f57" stroke-width="3"/><text x="1125" y="224" font-size="20" fill="#172033">更新 Status</text><text x="1125" y="251" font-size="17" fill="#526078">Condition + generation</text>
  </g>
  <g stroke="#5b677a" stroke-width="3" fill="none"><path d="M430 231H480"/><path d="M680 231H750"/><path d="M950 231H1020"/><path d="M330 175V121H480"/><path d="M1125 282V365H147V282" stroke-dasharray="9 7"/></g>
  <g fill="#5b677a"><path d="M480 231l-12-7v14z"/><path d="M750 231l-12-7v14z"/><path d="M1020 231l-12-7v14z"/><path d="M480 121l-12-7v14z"/><path d="M147 282l-7 12h14z"/></g>
  <text x="447" y="108" font-family="sans-serif" font-size="17" fill="#7a4a00">是</text><text x="452" y="216" font-family="sans-serif" font-size="17" fill="#326ce5">否</text>
  <text x="640" y="396" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#526078">对象变化、下级资源变化、定时重排或失败重试再次触发</text>
  <rect x="90" y="438" width="1100" height="72" rx="8" fill="#fff" stroke="#b7c0ce"/>
  <text x="120" y="469" font-family="sans-serif" font-size="18" fill="#172033">验收故障点：</text><text x="255" y="469" font-family="sans-serif" font-size="18" fill="#526078">动作前退出　动作后退出　Status 写回前退出　API 冲突　缓存陈旧　删除清理失败</text>
  <text x="120" y="496" font-family="sans-serif" font-size="18" fill="#172033">恢复要求：</text><text x="255" y="496" font-family="sans-serif" font-size="18" fill="#526078">重启后不重复副作用，能从当前对象与外部事实继续收敛</text>
</svg>
