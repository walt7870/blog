<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560" role="img" aria-labelledby="title desc">
  <title id="title">Kubernetes 跨层可观测证据链</title>
  <desc id="desc">从用户症状到应用、数据面、工作负载、控制面和基础设施的证据关联。</desc>
  <rect width="1280" height="560" fill="#f7f8fa"/>
  <text x="64" y="58" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#17212b">从用户症状还原跨层时间线</text>
  <text x="64" y="91" font-family="Arial, sans-serif" font-size="16" fill="#53606d">同一时间窗，用对象身份、版本和 trace context 关联证据</text>
  <g font-family="Arial, sans-serif">
    <g transform="translate(64 134)">
      <rect width="184" height="210" rx="8" fill="#ffffff" stroke="#a64b4b" stroke-width="2"/>
      <text x="20" y="38" font-size="18" font-weight="700" fill="#17212b">用户结果</text>
      <text x="20" y="72" font-size="14" fill="#53606d">成功率 / P99</text>
      <text x="20" y="99" font-size="14" fill="#53606d">业务正确性</text>
      <text x="20" y="126" font-size="14" fill="#53606d">队列等待</text>
      <text x="20" y="177" font-size="13" fill="#a64b4b">先定时间与影响</text>
    </g>
    <g transform="translate(286 134)">
      <rect width="184" height="210" rx="8" fill="#ffffff" stroke="#c66a3d" stroke-width="2"/>
      <text x="20" y="38" font-size="18" font-weight="700" fill="#17212b">应用链路</text>
      <text x="20" y="72" font-size="14" fill="#53606d">Trace / Logs</text>
      <text x="20" y="99" font-size="14" fill="#53606d">依赖与重试</text>
      <text x="20" y="126" font-size="14" fill="#53606d">镜像与配置版本</text>
      <text x="20" y="177" font-size="13" fill="#c66a3d">定位具体请求</text>
    </g>
    <g transform="translate(508 134)">
      <rect width="184" height="210" rx="8" fill="#ffffff" stroke="#356a9a" stroke-width="2"/>
      <text x="20" y="38" font-size="18" font-weight="700" fill="#17212b">集群数据面</text>
      <text x="20" y="72" font-size="14" fill="#53606d">Gateway / Service</text>
      <text x="20" y="99" font-size="14" fill="#53606d">DNS / CNI / CSI</text>
      <text x="20" y="126" font-size="14" fill="#53606d">Mesh flow</text>
      <text x="20" y="177" font-size="13" fill="#356a9a">验证真实执行</text>
    </g>
    <g transform="translate(730 134)">
      <rect width="184" height="210" rx="8" fill="#ffffff" stroke="#2f6f61" stroke-width="2"/>
      <text x="20" y="38" font-size="18" font-weight="700" fill="#17212b">对象与控制环</text>
      <text x="20" y="72" font-size="14" fill="#53606d">Conditions</text>
      <text x="20" y="99" font-size="14" fill="#53606d">Events / Queue</text>
      <text x="20" y="126" font-size="14" fill="#53606d">generation</text>
      <text x="20" y="177" font-size="13" fill="#2f6f61">解释为何未收敛</text>
    </g>
    <g transform="translate(952 134)">
      <rect width="264" height="210" rx="8" fill="#ffffff" stroke="#936f18" stroke-width="2"/>
      <text x="20" y="38" font-size="18" font-weight="700" fill="#17212b">控制面与基础设施</text>
      <text x="20" y="72" font-size="14" fill="#53606d">API / etcd / scheduler</text>
      <text x="20" y="99" font-size="14" fill="#53606d">node / kernel / network</text>
      <text x="20" y="126" font-size="14" fill="#53606d">Audit / component metrics</text>
      <text x="20" y="177" font-size="13" fill="#936f18">确认系统性边界</text>
    </g>
  </g>
  <path d="M248 239H278M470 239H500M692 239H722M914 239H944" stroke="#7b8792" stroke-width="3" marker-end="url(#arrow)"/>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7b8792"/></marker></defs>
  <rect x="64" y="390" width="1152" height="96" rx="8" fill="#17212b"/>
  <text x="88" y="425" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#ffffff">关联键</text>
  <text x="88" y="456" font-family="Arial, sans-serif" font-size="15" fill="#d9e0e6">time window · trace_id · cluster · namespace · workload · pod · node · zone · image digest · revision</text>
  <text x="64" y="530" font-family="Arial, sans-serif" font-size="15" fill="#53606d">单条日志只能证明一个组件的观察；根因需要跨层、可证伪的时间线。</text>
</svg>
