<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="700" viewBox="0 0 1120 700" role="img" aria-labelledby="gateway-ambient-data-path-title gateway-ambient-data-path-desc">
  <title id="gateway-ambient-data-path-title">Gateway配置关系与Ambient服务通信</title>
  <desc id="gateway-ambient-data-path-desc">上部为Gateway与HTTPRoute经实现控制器编程入口代理的配置关系；下部单独展示已启用waypoint的ambient工作负载间请求。两图不表示所有入口流量必经waypoint。</desc>
  <defs><marker id="arrow" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#596775"/></marker></defs>
  <rect width="1120" height="700" fill="#f7f9fb"/>
  <g font-family="Arial, 'PingFang SC', sans-serif" fill="#23313d">
    <text x="48" y="56" font-size="28" font-weight="700">配置被接受、转发已编程、请求成功，是三类证据</text>
    <text x="48" y="91" font-size="17" fill="#52616d">上部仅表示配置关系；下部是独立的服务间请求示例，不把所有产品画成固定串联代理。</text>
    <text x="48" y="139" font-size="20" font-weight="700">Gateway 配置与控制</text>
    <g fill="none" stroke="#596775" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#arrow)"><path d="M352 244H432"/><path d="M720 244H800"/></g>
    <g fill="#fff" stroke="#8fa3b1"><rect x="48" y="172" width="304" height="144" rx="6"/><rect x="432" y="172" width="288" height="144" rx="6"/><rect x="800" y="172" width="272" height="144" rx="6"/></g>
    <text x="68" y="209" font-size="21" font-weight="700">Gateway / HTTPRoute</text><text x="68" y="245" font-size="17" fill="#52616d">parentRefs + allowedRoutes</text><text x="68" y="281" font-size="17" fill="#52616d">跨空间后端另需 ReferenceGrant</text>
    <text x="452" y="209" font-size="21" font-weight="700">实现控制器</text><text x="452" y="245" font-size="17" fill="#52616d">验证引用、写 Conditions</text><text x="452" y="281" font-size="17" fill="#52616d">按实现下发数据面配置</text>
    <text x="820" y="209" font-size="21" font-weight="700">入口代理 / LB</text><text x="820" y="245" font-size="17" fill="#52616d">实际接收客户端请求</text><text x="820" y="281" font-size="17" fill="#52616d">再按已生效路由选择后端</text>
    <text x="48" y="375" font-size="20" font-weight="700">Ambient 服务间请求：目标已启用 waypoint</text>
    <g fill="none" stroke="#596775" stroke-width="2" marker-end="url(#arrow)"><path d="M208 478H264"/><path d="M424 478H480"/><path d="M640 478H696"/><path d="M856 478H912"/></g>
    <g fill="#fff" stroke="#8fa3b1"><rect x="48" y="420" width="160" height="116" rx="6"/><rect x="264" y="420" width="160" height="116" rx="6"/><rect x="696" y="420" width="160" height="116" rx="6"/><rect x="912" y="420" width="160" height="116" rx="6"/></g>
    <rect x="480" y="420" width="160" height="116" rx="6" fill="#eaf3fb" stroke="#7694aa"/>
    <g font-size="20" font-weight="700"><text x="64" y="455">源 Pod</text><text x="280" y="455">源 ztunnel</text><text x="496" y="455">waypoint</text><text x="712" y="455">目标 ztunnel</text><text x="928" y="455">目标 Pod</text></g>
    <g font-size="17" fill="#52616d"><text x="64" y="492">发起业务请求</text><text x="280" y="492">身份与 L4 隧道</text><text x="496" y="492">L7 策略与路由</text><text x="712" y="492">入站身份与授权</text><text x="928" y="492">应用处理与依赖</text>
      <text x="48" y="587">没有目标 waypoint 时，源 ztunnel 可直接连接目标 ztunnel；网格外来源另按实际配置验证。</text>
      <text x="48" y="625">底层 Cilium / 其他 CNI 承载网络；eBPF、Service 与 Mesh 的转发位置随模式变化。</text>
      <text x="48" y="663">虚线：配置读取或下发；实线：该场景的请求方向。返回流量、证书控制链在此省略。</text>
    </g>
  </g>
</svg>
