<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="560" viewBox="0 0 1440 560" role="img" aria-labelledby="title desc">
  <title id="title">Kubernetes 生产排障链路</title>
  <desc id="desc">从用户症状依次检查入口、服务发现、工作负载、节点运行时和存储配置，最后结合观测信号完成修复验证。</desc>
  <rect width="1440" height="560" rx="24" fill="#071f1a"/>
  <text x="72" y="72" fill="#f4f7f5" font-family="Arial, PingFang SC, sans-serif" font-size="34" font-weight="700">Kubernetes 生产排障链路</text>
  <text x="72" y="110" fill="#9bb8ae" font-family="Arial, PingFang SC, sans-serif" font-size="20">从现象进入，按请求与控制链逐层收集证据，再用同一指标验证恢复</text>
  <g font-family="Arial, PingFang SC, sans-serif">
    <g transform="translate(72 176)">
      <rect width="190" height="126" rx="12" fill="#123b31" stroke="#74d5b5" stroke-width="2"/>
      <text x="24" y="42" fill="#74d5b5" font-size="19">01 影响范围</text>
      <text x="24" y="76" fill="#f4f7f5" font-size="23" font-weight="700">用户症状</text>
      <text x="24" y="105" fill="#b8c9c3" font-size="17">错误率 · 延迟 · 时间</text>
    </g>
    <g transform="translate(290 176)">
      <rect width="190" height="126" rx="12" fill="#123b31" stroke="#5d8f7f" stroke-width="2"/>
      <text x="24" y="42" fill="#74d5b5" font-size="19">02 流量入口</text>
      <text x="24" y="76" fill="#f4f7f5" font-size="23" font-weight="700">Ingress / LB</text>
      <text x="24" y="105" fill="#b8c9c3" font-size="17">域名 · TLS · 路由</text>
    </g>
    <g transform="translate(508 176)">
      <rect width="190" height="126" rx="12" fill="#123b31" stroke="#5d8f7f" stroke-width="2"/>
      <text x="24" y="42" fill="#74d5b5" font-size="19">03 服务发现</text>
      <text x="24" y="76" fill="#f4f7f5" font-size="23" font-weight="700">Service</text>
      <text x="24" y="105" fill="#b8c9c3" font-size="17">Selector · Endpoint</text>
    </g>
    <g transform="translate(726 176)">
      <rect width="190" height="126" rx="12" fill="#123b31" stroke="#5d8f7f" stroke-width="2"/>
      <text x="24" y="42" fill="#74d5b5" font-size="19">04 工作负载</text>
      <text x="24" y="76" fill="#f4f7f5" font-size="23" font-weight="700">Deployment / Pod</text>
      <text x="24" y="105" fill="#b8c9c3" font-size="17">发布 · 探针 · 日志</text>
    </g>
    <g transform="translate(944 176)">
      <rect width="190" height="126" rx="12" fill="#123b31" stroke="#5d8f7f" stroke-width="2"/>
      <text x="24" y="42" fill="#74d5b5" font-size="19">05 节点执行</text>
      <text x="24" y="76" fill="#f4f7f5" font-size="23" font-weight="700">Node / Runtime</text>
      <text x="24" y="105" fill="#b8c9c3" font-size="17">调度 · 资源 · 镜像</text>
    </g>
    <g transform="translate(1162 176)">
      <rect width="206" height="126" rx="12" fill="#123b31" stroke="#5d8f7f" stroke-width="2"/>
      <text x="24" y="42" fill="#74d5b5" font-size="19">06 外部依赖</text>
      <text x="24" y="76" fill="#f4f7f5" font-size="23" font-weight="700">存储 / 配置</text>
      <text x="24" y="105" fill="#b8c9c3" font-size="17">PVC · Secret · 数据库</text>
    </g>
    <g fill="none" stroke="#f5c85b" stroke-width="4" stroke-linecap="round">
      <path d="M262 239h20"/><path d="M480 239h20"/><path d="M698 239h20"/><path d="M916 239h20"/><path d="M1134 239h20"/>
    </g>
    <g fill="#f5c85b">
      <path d="M282 239l-10-7v14z"/><path d="M500 239l-10-7v14z"/><path d="M718 239l-10-7v14z"/><path d="M936 239l-10-7v14z"/><path d="M1154 239l-10-7v14z"/>
    </g>
    <rect x="72" y="370" width="850" height="118" rx="12" fill="#0d3028" stroke="#5d8f7f" stroke-width="2"/>
    <text x="104" y="410" fill="#74d5b5" font-size="19">证据面</text>
    <text x="104" y="449" fill="#f4f7f5" font-size="24" font-weight="700">资源状态 · Events · 日志 · 指标 · 追踪 · 最近变更</text>
    <text x="104" y="475" fill="#b8c9c3" font-size="17">先定位层级，再执行修复；避免只凭单条日志猜测</text>
    <rect x="958" y="370" width="410" height="118" rx="12" fill="#4a3b16" stroke="#f5c85b" stroke-width="2"/>
    <text x="990" y="410" fill="#f5c85b" font-size="19">恢复闭环</text>
    <text x="990" y="449" fill="#f4f7f5" font-size="24" font-weight="700">修复 -> 发布 -> 指标复核</text>
    <text x="990" y="475" fill="#d7c994" font-size="17">确认用户影响消失，并记录预防措施</text>
  </g>
</svg>
