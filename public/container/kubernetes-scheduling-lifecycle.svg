<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="520" viewBox="0 0 1280 520" role="img" aria-labelledby="title desc">
  <title id="title">Pod 从调度到终止的生命周期</title>
  <desc id="desc">展示 API、调度周期、绑定、节点准备、就绪服务和终止六个阶段及其负责组件。</desc>
  <rect width="1280" height="520" fill="#f7f8fa"/>
  <text x="64" y="62" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#17212b">Pod 生命周期不是一个原子动作</text>
  <text x="64" y="96" font-family="Arial, sans-serif" font-size="16" fill="#53606d">每一段都有独立状态、失败方式和证据来源</text>
  <path d="M154 250H1128" stroke="#aab3bc" stroke-width="4"/>
  <g font-family="Arial, sans-serif">
    <g transform="translate(44 154)">
      <rect width="178" height="184" rx="8" fill="#ffffff" stroke="#2f6f61" stroke-width="2"/>
      <circle cx="89" cy="96" r="17" fill="#2f6f61"/>
      <text x="18" y="35" font-size="17" font-weight="700" fill="#17212b">1. API 接受</text>
      <text x="18" y="61" font-size="14" fill="#53606d">Pod 无 nodeName</text>
      <text x="18" y="143" font-size="13" fill="#53606d">证据：对象版本</text>
      <text x="18" y="164" font-size="13" fill="#53606d">审计、Admission</text>
    </g>
    <g transform="translate(246 154)">
      <rect width="178" height="184" rx="8" fill="#ffffff" stroke="#c66a3d" stroke-width="2"/>
      <circle cx="89" cy="96" r="17" fill="#c66a3d"/>
      <text x="18" y="35" font-size="17" font-weight="700" fill="#17212b">2. 调度周期</text>
      <text x="18" y="61" font-size="14" fill="#53606d">Filter / Score</text>
      <text x="18" y="143" font-size="13" fill="#53606d">证据：PodScheduled</text>
      <text x="18" y="164" font-size="13" fill="#53606d">FailedScheduling</text>
    </g>
    <g transform="translate(448 154)">
      <rect width="178" height="184" rx="8" fill="#ffffff" stroke="#936f18" stroke-width="2"/>
      <circle cx="89" cy="96" r="17" fill="#936f18"/>
      <text x="18" y="35" font-size="17" font-weight="700" fill="#17212b">3. 绑定周期</text>
      <text x="18" y="61" font-size="14" fill="#53606d">Reserve / Bind</text>
      <text x="18" y="143" font-size="13" fill="#53606d">证据：nodeName</text>
      <text x="18" y="164" font-size="13" fill="#53606d">卷与绑定 Event</text>
    </g>
    <g transform="translate(650 154)">
      <rect width="178" height="184" rx="8" fill="#ffffff" stroke="#356a9a" stroke-width="2"/>
      <circle cx="89" cy="96" r="17" fill="#356a9a"/>
      <text x="18" y="35" font-size="17" font-weight="700" fill="#17212b">4. 节点准备</text>
      <text x="18" y="61" font-size="14" fill="#53606d">CRI / CNI / CSI</text>
      <text x="18" y="143" font-size="13" fill="#53606d">证据：kubelet</text>
      <text x="18" y="164" font-size="13" fill="#53606d">容器与卷状态</text>
    </g>
    <g transform="translate(852 154)">
      <rect width="178" height="184" rx="8" fill="#ffffff" stroke="#2f6f61" stroke-width="2"/>
      <circle cx="89" cy="96" r="17" fill="#2f6f61"/>
      <text x="18" y="35" font-size="17" font-weight="700" fill="#17212b">5. 就绪服务</text>
      <text x="18" y="61" font-size="14" fill="#53606d">Probe / EndpointSlice</text>
      <text x="18" y="143" font-size="13" fill="#53606d">证据：Ready</text>
      <text x="18" y="164" font-size="13" fill="#53606d">真实请求 SLI</text>
    </g>
    <g transform="translate(1054 154)">
      <rect width="178" height="184" rx="8" fill="#ffffff" stroke="#a64b4b" stroke-width="2"/>
      <circle cx="89" cy="96" r="17" fill="#a64b4b"/>
      <text x="18" y="35" font-size="17" font-weight="700" fill="#17212b">6. 摘流终止</text>
      <text x="18" y="61" font-size="14" fill="#53606d">preStop / grace</text>
      <text x="18" y="143" font-size="13" fill="#53606d">证据：流量变化</text>
      <text x="18" y="164" font-size="13" fill="#53606d">进程退出时间</text>
    </g>
  </g>
  <text x="64" y="405" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#17212b">判断边界</text>
  <text x="64" y="438" font-family="Arial, sans-serif" font-size="15" fill="#53606d">Scheduled ≠ Running　　Running ≠ Ready　　删除请求 ≠ 进程和连接已清理</text>
  <rect x="64" y="465" width="1152" height="4" fill="#2f6f61"/>
</svg>
