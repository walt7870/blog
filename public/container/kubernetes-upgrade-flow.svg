<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="720" viewBox="0 0 1120 720" role="img" aria-labelledby="title desc">
  <title id="title">Kubernetes 分阶段升级与停止条件</title>
  <desc id="desc">兼容矩阵和恢复预演通过后，先升级控制面，再灰度节点、扩大范围，最后观察清理。任一阶段越过停止阈值都暂停扩大，回退依赖已验证恢复方案。</desc>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#526779"/></marker></defs>
  <style>text{font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#172b3a}.title{font-size:28px;font-weight:700}.h{font-size:20px;font-weight:700}.t{font-size:17px;fill:#465c6b}.box{fill:#fff;stroke:#b6c5cf;stroke-width:1.5}.focus{fill:#eaf4fc;stroke:#5686a6;stroke-width:1.5}.ok{fill:#edf8f1;stroke:#729c87;stroke-width:1.5}.edge{fill:none;stroke:#526779;stroke-width:2;marker-end:url(#a)}</style>
  <rect width="1120" height="720" fill="#f7f9fb"/><text class="title" x="48" y="54">每跨过一个升级阶段，都重新验证依赖与业务</text><text class="t" x="48" y="89">逐小版本推进；版本偏差是临时兼容上限，不能替代发行版支持流程。</text>
  <path class="edge" d="M348 205H410"/><path class="edge" d="M710 205H772"/><path class="edge" d="M922 275V350"/><path class="edge" d="M772 420H710"/><path class="edge" d="M410 420H348"/>
  <rect class="box" x="48" y="135" width="300" height="140" rx="6"/><text class="h" x="68" y="173">1. 兼容矩阵</text><text class="t" x="68" y="210">API、CRD、Webhook</text><text class="t" x="68" y="245">CNI、CSI、插件、工作负载</text>
  <rect class="box" x="410" y="135" width="300" height="140" rx="6"/><text class="h" x="430" y="173">2. 恢复预演</text><text class="t" x="430" y="210">隔离恢复快照、证书与数据</text><text class="t" x="430" y="245">测量恢复点与恢复时间</text>
  <rect class="focus" x="772" y="135" width="300" height="140" rx="6"/><text class="h" x="792" y="173">3. 控制面升级</text><text class="t" x="792" y="210">先 API Server，再控制组件</text><text class="t" x="792" y="245">验证 API 与 Webhook 行为</text>
  <rect class="focus" x="772" y="350" width="300" height="140" rx="6"/><text class="h" x="792" y="388">4. 节点池灰度</text><text class="t" x="792" y="425">排空、调度、网络、卷与探针</text><text class="t" x="792" y="460">保留旧池及故障容量余量</text>
  <rect class="box" x="410" y="350" width="300" height="140" rx="6"/><text class="h" x="430" y="388">5. 扩大范围</text><text class="t" x="430" y="425">分池分区推进，持续看业务</text><text class="t" x="430" y="460">不能只看 Node 版本号</text>
  <rect class="ok" x="48" y="350" width="300" height="140" rx="6"/><text class="h" x="68" y="388">6. 观察与清理</text><text class="t" x="68" y="425">完整业务周期重新验收</text><text class="t" x="68" y="460">确认后再清理旧池与旧 API</text>
  <rect x="48" y="545" width="1024" height="122" rx="6" fill="#fff4e4" stroke="#c29551"/>
  <text class="h" x="68" y="582">越过停止阈值：暂停扩大范围，保存证据，再选择前滚或已验证的恢复</text>
  <text class="t" x="68" y="617">API 5xx、Webhook P99、Pending、挂卷失败、业务错误率和尾延迟。</text>
  <text class="t" x="68" y="648">通过版本检查不等于完整恢复；API 快照不会撤销外部数据库与云资源副作用。</text>
</svg>
