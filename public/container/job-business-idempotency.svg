<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="580" viewBox="0 0 1120 580" role="img" aria-labelledby="title desc">
  <title id="title">Job 执行尝试与业务幂等</title>
  <desc id="desc">两个Pod尝试使用同一个业务日期和报表类型，在数据库事务和唯一约束下提交或读取同一份逻辑结果。任务创建去重不能替代外部副作用的幂等处理。</desc>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#526779"/></marker></defs>
  <style>text{font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#172b3a}.title{font-size:28px;font-weight:700}.h{font-size:20px;font-weight:700}.t{font-size:17px;fill:#465c6b}.box{fill:#fff;stroke:#b6c5cf;stroke-width:1.5}.edge{fill:none;stroke:#526779;stroke-width:2;marker-end:url(#a)}</style>
  <rect width="1120" height="580" fill="#f7f9fb"/><text class="title" x="48" y="54">可以有多次执行尝试，业务结果由同一个键约束</text><text class="t" x="48" y="90">业务键：报表类型 daily-report + 业务日期 2026-07-18；不用随机 Pod 名去重。</text>
  <path class="edge" d="M328 205H370Q378 205 378 213V240Q378 248 386 248H430"/><path class="edge" d="M328 365H394Q402 365 402 357V320Q402 312 410 312H430"/><path class="edge" d="M730 280H812"/>
  <rect class="box" x="48" y="150" width="280" height="110" rx="6"/><text class="h" x="68" y="189">Pod 尝试 A</text><text class="t" x="68" y="228">完成计算，尝试提交结果</text>
  <rect class="box" x="48" y="310" width="280" height="110" rx="6"/><text class="h" x="68" y="349">Pod 尝试 B</text><text class="t" x="68" y="388">重试、补跑或重复创建</text>
  <rect x="430" y="210" width="300" height="140" rx="6" fill="#eaf4fc" stroke="#5686a6"/><text class="h" x="450" y="249">数据库事务 + 唯一约束</text><text class="t" x="450" y="286">结果与完成状态一起提交</text><text class="t" x="450" y="323">冲突时读取结果或恢复任务</text>
  <rect x="812" y="225" width="260" height="110" rx="6" fill="#edf8f1" stroke="#729c87"/><text class="h" x="832" y="264">同一份逻辑日报</text><text class="t" x="832" y="303">不重复发布相同业务结果</text>
  <rect x="48" y="465" width="1024" height="75" rx="6" fill="#fff4e4" stroke="#c29551"/><text class="t" x="68" y="497">发邮件、转账等外部动作不受此数据库事务自动保护。</text><text class="t" x="68" y="524">需结合 outbox、下游幂等键和对账；仅记录“已开始”仍会留下崩溃窗口。</text>
</svg>
