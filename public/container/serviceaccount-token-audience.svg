<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="640" viewBox="0 0 1120 640" role="img" aria-labelledby="serviceaccount-token-audience-title serviceaccount-token-audience-desc">
  <title id="serviceaccount-token-audience-title">ServiceAccount Token 的签发与接收方边界</title>
  <desc id="serviceaccount-token-audience-desc">kubelet 请求短期 Token 并投影给 Pod，应用重读后按受众调用 Kubernetes API 或外部对账服务，接收方分别验证身份和执行授权。</desc>
  <defs><marker id="sa-token-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#526779"/></marker></defs>
  <style>text{font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#172b3a}.title{font-size:28px;font-weight:700}.h{font-size:20px;font-weight:700}.t{font-size:17px;fill:#465c6b}.box{fill:#fff;stroke:#b6c5cf;stroke-width:1.5}.api{fill:#eaf4fc;stroke:#5686a6;stroke-width:1.5}.run{fill:#edf8f1;stroke:#729c87;stroke-width:1.5}.edge{fill:none;stroke:#526779;stroke-width:2;marker-end:url(#sa-token-arrow)}.return{stroke-dasharray:6 5}.label{fill:#f7f9fb}</style>
  <rect width="1120" height="640" fill="#f7f9fb"/><text class="title" x="48" y="52">Token 证明身份，接收方继续决定权限</text><text class="t" x="48" y="84">面向不同 audience 的两条消费路径；按实际需求选择，不要求每个应用同时持有两份 Token。</text>
  <path class="edge" d="M288 164H416"/><path class="edge return" d="M416 212H288"/><path class="edge" d="M168 256V372"/>
  <path class="edge" d="M288 424H416"/><path class="edge" d="M696 424H792"/>
  <path class="edge" d="M288 456H328Q336 456 336 464V512Q336 520 344 520H752Q760 520 760 512V432a8 8 0 0 1 0 -16V264Q760 256 768 256H792"/>
  <rect class="box" x="48" y="128" width="240" height="128" rx="6"/><text class="h" x="68" y="164">节点 kubelet</text><text class="t" x="68" y="200">代 Pod 请求短期 Token</text><text class="t" x="68" y="232">在到期前轮换文件</text>
  <rect class="api" x="416" y="128" width="280" height="128" rx="6"/><text class="h" x="436" y="164">API Server 签发</text><text class="t" x="436" y="200">ServiceAccount / Pod 绑定</text><text class="t" x="436" y="232">签名、audience、有效期</text>
  <rect class="run" x="48" y="372" width="240" height="116" rx="6"/><text class="h" x="68" y="408">订单 API 进程</text><text class="t" x="68" y="440">重读投影路径并使用新值</text><text class="t" x="68" y="472">不永久缓存启动时 Token</text>
  <rect class="api" x="416" y="372" width="280" height="116" rx="6"/><text class="h" x="436" y="408">Kubernetes API</text><text class="t" x="436" y="440">验证 API 接受的 audience</text><text class="t" x="436" y="472">认证后执行 RBAC 等授权</text>
  <rect class="run" x="792" y="372" width="280" height="116" rx="6"/><text class="h" x="812" y="408">读取 orders 配置</text><text class="t" x="812" y="440">只允许指定对象的 get</text><text class="t" x="812" y="472">仍需正确 Namespace / verb</text>
  <rect class="box" x="792" y="176" width="280" height="128" rx="6"/><text class="h" x="812" y="212">外部对账服务</text><text class="t" x="812" y="244">验证自身 audience 与签名</text><text class="t" x="812" y="276">再执行外部业务授权</text>
  <rect class="label" x="68" y="300" width="216" height="28"/><text class="t" x="76" y="320">投影文件；应用负责重读</text>
  <text class="t" x="48" y="568">实线：请求与消费路径；虚线：签发结果。外部 audience 不自动获得 Kubernetes API 权限。</text>
  <text class="t" x="48" y="600">关闭默认自动挂载后，仍可显式声明面向外部接收方的 projected Token 卷。</text>
</svg>
