<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="600" viewBox="0 0 1120 600" role="img" aria-labelledby="title desc">
  <title id="title">StatefulSet 稳定身份与替代 Pod</title>
  <desc id="desc">orders-db-0重建后保留名称和PVC关联，但获得新UID且IP可能变化。两条卷引用分别表示过去与当前，不表示允许两个进程同时写同一卷。</desc>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#526779"/></marker></defs>
  <style>text{font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#172b3a}.title{font-size:28px;font-weight:700}.h{font-size:20px;font-weight:700}.t{font-size:17px;fill:#465c6b}.box{fill:#fff;stroke:#b6c5cf;stroke-width:1.5}.edge{fill:none;stroke:#526779;stroke-width:2;marker-end:url(#a)}</style>
  <rect width="1120" height="600" fill="#f7f9fb"/><text class="title" x="48" y="54">名称与卷关联稳定，Pod 实例仍会更换</text><text class="t" x="48" y="90">以 orders-db-0 为例：过去与替代实例，不是两个同时运行的写入者。</text>
  <path class="edge" d="M348 205H772"/><text class="t" x="457" y="184">旧实例退出后重建</text>
  <path class="edge" d="M198 280V397Q198 405 206 405H410" stroke-dasharray="5 4"/>
  <path class="edge" d="M922 280V397Q922 405 914 405H710"/>
  <text class="t" x="222" y="389">过去的卷引用</text><text class="t" x="743" y="389">替代实例复用</text>
  <rect class="box" x="48" y="135" width="300" height="145" rx="6"/><text class="h" x="68" y="174">过去：orders-db-0</text><text class="t" x="68" y="211">UID=A，旧 IP</text><text class="t" x="68" y="248">应用成员序号：0</text>
  <rect x="772" y="135" width="300" height="145" rx="6" fill="#eaf4fc" stroke="#5686a6"/><text class="h" x="792" y="174">替代：orders-db-0</text><text class="t" x="792" y="211">UID=B，IP 可能变化</text><text class="t" x="792" y="248">保留成员序号和 DNS 名</text>
  <rect x="410" y="350" width="300" height="110" rx="6" fill="#edf8f1" stroke="#729c87"/><text class="h" x="430" y="389">data-orders-db-0</text><text class="t" x="430" y="428">仍是原 PVC 及其绑定存储</text>
  <text class="t" x="48" y="525">网络分区时先隔离旧实例；强删 Pod 对象不能证明旧进程已停止。</text><text class="t" x="48" y="560">卷重挂载受拓扑与 CSI 约束；稳定身份不会自动提供数据库复制、一致性或备份。</text>
</svg>
