<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="568" viewBox="0 0 1120 568" role="img" aria-labelledby="title desc"><title id="title">双击图标后，运行时按边界启动</title><desc id="desc">操作系统启动可执行入口；页面就绪与编辑器业务就绪分别观测。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#607568"/></marker><style>text{font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;letter-spacing:0;fill:#253c30}.h{font-size:28px;font-weight:600}.n{font-size:21px;font-weight:600}.s{font-size:18px;fill:#52685b}.node{fill:#fff;stroke:#a6b9ad;stroke-width:1.5}.info{fill:#edf3fb;stroke:#739bbf;stroke-width:1.5}.good{fill:#e9f4ee;stroke:#397657;stroke-width:1.5}.warn{fill:#f8eef1;stroke:#ae7789;stroke-width:1.5}.edge{fill:none;stroke:#607568;stroke-width:2;marker-end:url(#arrow)}.dashed{stroke-dasharray:6 5}</style></defs><rect width="1120" height="568" fill="white"/><text x="32" y="44" class="h">双击图标后，运行时按边界启动</text><text x="32" y="82" class="s">操作系统启动可执行入口；页面就绪与编辑器业务就绪分别观测。</text><path d="M272 212H304" class="edge"/><path d="M544 212H576" class="edge"/><path d="M816 212H848" class="edge"/><g data-node="操作系统入口"><rect x="32" y="144" width="240" height="136" rx="6" class="node"/><text x="50" y="177" class="n">操作系统入口</text><text x="50" y="208" class="s">启动 DeskLab</text><text x="50" y="235" class="s">加载 Electron Runtime</text></g><g data-node="Main / app"><rect x="304" y="144" width="240" height="136" rx="6" class="node"/><text x="322" y="177" class="n">Main / app</text><text x="322" y="208" class="s">执行 main.js</text><text x="322" y="235" class="s">等待 whenReady</text></g><g data-node="BrowserWindow"><rect x="576" y="144" width="240" height="136" rx="6" class="node"/><text x="594" y="177" class="n">BrowserWindow</text><text x="594" y="208" class="s">创建窗口与webContents</text><text x="594" y="235" class="s">导航 index.html</text></g><g data-node="Renderer"><rect x="848" y="144" width="240" height="136" rx="6" class="good"/><text x="866" y="177" class="n">Renderer</text><text x="866" y="208" class="s">运行页面脚本</text><text x="866" y="235" class="s">DOM / 数据 / 交互</text></g><g data-node="没有窗口：先查 Main"><rect x="32" y="352" width="512" height="112" rx="6" class="info"/><text x="50" y="385" class="n">没有窗口：先查 Main</text><text x="50" y="416" class="s">入口路径、app ready、窗口创建异常</text></g><g data-node="窗口白屏：再查页面"><rect x="576" y="352" width="512" height="112" rx="6" class="node"/><text x="594" y="385" class="n">窗口白屏：再查页面</text><text x="594" y="416" class="s">导航失败、Preload、Renderer脚本与资源</text></g><text x="32" y="540" class="s">app.asar只是应用代码与资源；Chromium、Node.js和Helper也属于交付产物。</text></svg>
