<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="724" viewBox="0 0 1120 724" role="img" aria-labelledby="title desc"><title id="title">窗口隐藏、销毁与应用退出分别建模</title><desc id="desc">应用仍在运行时才可能重建窗口；退出前的异步收尾需要显式等待与截止时间。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#607568"/></marker><style>text{font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;letter-spacing:0;fill:#253c30}.h{font-size:28px;font-weight:600}.n{font-size:21px;font-weight:600}.s{font-size:18px;fill:#52685b}.node{fill:#fff;stroke:#a6b9ad;stroke-width:1.5}.info{fill:#edf3fb;stroke:#739bbf;stroke-width:1.5}.good{fill:#e9f4ee;stroke:#397657;stroke-width:1.5}.warn{fill:#f8eef1;stroke:#ae7789;stroke-width:1.5}.edge{fill:none;stroke:#607568;stroke-width:2;marker-end:url(#arrow)}.dashed{stroke-dasharray:6 5}</style></defs><rect width="1120" height="724" fill="white"/><text x="32" y="44" class="h">窗口隐藏、销毁与应用退出分别建模</text><text x="32" y="82" class="s">应用仍在运行时才可能重建窗口；退出前的异步收尾需要显式等待与截止时间。</text><text x="32" y="124" class="s">应用意图</text><path d="M320 208H416" class="edge"/><path d="M704 208H800" class="edge"/><text x="332" y="196" class="s">确认退出</text><text x="716" y="196" class="s">收尾完成</text><g data-node="running"><rect x="32" y="152" width="288" height="112" rx="6" class="node"/><text x="50" y="185" class="n">running</text><text x="50" y="216" class="s">托盘与后台任务仍可存在</text></g><g data-node="quitting"><rect x="416" y="152" width="288" height="112" rx="6" class="info"/><text x="434" y="185" class="n">quitting</text><text x="434" y="216" class="s">确认保存，停止接收任务</text></g><g data-node="exited"><rect x="800" y="152" width="288" height="112" rx="6" class="good"/><text x="818" y="185" class="n">exited</text><text x="818" y="216" class="s">Main与所持资源结束</text></g><text x="32" y="324" class="s">窗口状态（应用仍在运行）</text><path d="M264 442H416" class="edge"/><path d="M532 388V352Q532 344 524 344H156Q148 344 148 352V388" class="edge dashed"/><path d="M152 500V560Q152 568 160 568H928Q936 568 936 560V500" class="edge"/><path d="M1040 500V604Q1040 612 1032 612H88Q80 612 80 604V500" class="edge dashed"/><g data-node="visible"><rect x="32" y="388" width="232" height="112" rx="6" class="node"/><text x="50" y="421" class="n">visible</text><text x="50" y="452" class="s">窗口可见</text></g><g data-node="hidden"><rect x="416" y="388" width="232" height="112" rx="6" class="node"/><text x="434" y="421" class="n">hidden</text><text x="434" y="452" class="s">close被阻止后隐藏</text></g><g data-node="destroyed"><rect x="800" y="388" width="288" height="112" rx="6" class="node"/><text x="818" y="421" class="n">destroyed</text><text x="818" y="452" class="s">窗口closed，清空引用</text></g><text x="292" y="430" class="s">隐藏</text><text x="284" y="374" class="s">show</text><text x="376" y="556" class="s">放行close → 销毁</text><text x="348" y="646" class="s">activate → 重建（应用尚未退出）</text><text x="32" y="696" class="s">更新重启使用独立意图；系统强制结束可能跳过正常退出事件。</text></svg>
