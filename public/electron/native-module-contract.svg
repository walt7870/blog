<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="568" viewBox="0 0 1120 568" role="img" aria-labelledby="title desc"><title id="title">先识别加载层，再决定是否 rebuild</title><desc id="desc">纯JavaScript依赖与原生.node二进制的兼容性合同不同。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#607568"/></marker><style>text{font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;letter-spacing:0;fill:#253c30}.h{font-size:28px;font-weight:600}.n{font-size:21px;font-weight:600}.s{font-size:18px;fill:#52685b}.node{fill:#fff;stroke:#a6b9ad;stroke-width:1.5}.info{fill:#edf3fb;stroke:#739bbf;stroke-width:1.5}.good{fill:#e9f4ee;stroke:#397657;stroke-width:1.5}.warn{fill:#f8eef1;stroke:#ae7789;stroke-width:1.5}.edge{fill:none;stroke:#607568;stroke-width:2;marker-end:url(#arrow)}.dashed{stroke-dasharray:6 5}</style></defs><rect width="1120" height="568" fill="white"/><text x="32" y="44" class="h">先识别加载层，再决定是否 rebuild</text><text x="32" y="82" class="s">纯JavaScript依赖与原生.node二进制的兼容性合同不同。</text><path d="M312 208H420" class="edge"/><path d="M700 208H808" class="edge"/><path d="M560 272V376" class="edge"/><path d="M700 432H808" class="edge"/><g data-node="宿主与模块"><rect x="32" y="144" width="280" height="128" rx="6" class="node"/><text x="50" y="177" class="n">宿主与模块</text><text x="50" y="208" class="s">OS / CPU / ABI</text><text x="50" y="235" class="s">动态库、签名与打包路径</text></g><g data-node="逐层核对"><rect x="420" y="144" width="280" height="128" rx="6" class="info"/><text x="438" y="177" class="n">逐层核对</text><text x="438" y="208" class="s">实际运行时版本输出</text><text x="438" y="235" class="s">file与加载错误</text></g><g data-node="维度匹配"><rect x="808" y="144" width="280" height="128" rx="6" class="good"/><text x="826" y="177" class="n">维度匹配</text><text x="826" y="208" class="s">进入加载和功能验证</text><text x="826" y="235" class="s">仍需在Package中复验</text></g><g data-node="ABI 不同"><rect x="420" y="376" width="280" height="112" rx="6" class="node"/><text x="438" y="409" class="n">ABI 不同</text><text x="438" y="440" class="s">为目标Electron rebuild</text></g><g data-node="编译出现 API 错误"><rect x="808" y="376" width="280" height="112" rx="6" class="warn"/><text x="826" y="409" class="n">编译出现 API 错误</text><text x="826" y="440" class="s">升级依赖或调整宿主</text><text x="826" y="467" class="s">反复rebuild不修复源码</text></g><text x="32" y="540" class="s">N-API减少部分ABI变化；OS、架构、动态库与分发路径仍需独立匹配。</text></svg>
