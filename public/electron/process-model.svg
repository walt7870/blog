<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="568" viewBox="0 0 1120 568" role="img" aria-labelledby="title desc"><title id="title">按职责和 PID 观察应用</title><desc id="desc">BrowserWindow是窗口对象，webContents管理页面，不与Renderer进程固定一一对应。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#607568"/></marker><style>text{font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;letter-spacing:0;fill:#253c30}.h{font-size:28px;font-weight:600}.n{font-size:21px;font-weight:600}.s{font-size:18px;fill:#52685b}.node{fill:#fff;stroke:#a6b9ad;stroke-width:1.5}.info{fill:#edf3fb;stroke:#739bbf;stroke-width:1.5}.good{fill:#e9f4ee;stroke:#397657;stroke-width:1.5}.warn{fill:#f8eef1;stroke:#ae7789;stroke-width:1.5}.edge{fill:none;stroke:#607568;stroke-width:2;marker-end:url(#arrow)}.dashed{stroke-dasharray:6 5}</style></defs><rect width="1120" height="568" fill="white"/><text x="32" y="44" class="h">按职责和 PID 观察应用</text><text x="32" y="82" class="s">BrowserWindow是窗口对象，webContents管理页面，不与Renderer进程固定一一对应。</text><path d="M336 208H416" class="edge"/><path d="M720 208H816" class="edge"/><path d="M184 272V344" class="edge"/><g data-node="Main"><rect x="32" y="136" width="304" height="136" rx="6" class="info"/><text x="50" y="169" class="n">Main</text><text x="50" y="200" class="s">生命周期、窗口与IPC</text><text x="50" y="227" class="s">避免同步扫描和长计算</text></g><g data-node="Renderer"><rect x="416" y="136" width="304" height="136" rx="6" class="node"/><text x="434" y="169" class="n">Renderer</text><text x="434" y="200" class="s">DOM、CSS与页面状态</text><text x="434" y="227" class="s">记录webContents ID与PID</text></g><g data-node="GPU"><rect x="816" y="136" width="272" height="136" rx="6" class="node"/><text x="834" y="169" class="n">GPU</text><text x="834" y="200" class="s">合成、纹理与图形</text><text x="834" y="227" class="s">结合画布和视频排查</text></g><g data-node="应用 Utility worker"><rect x="32" y="344" width="688" height="112" rx="6" class="node"/><text x="50" y="377" class="n">应用 Utility worker</text><text x="50" y="408" class="s">Main通过有界消息协议提交索引任务；退出与重试由监督者决定</text></g><text x="32" y="540" class="s">系统还可能创建网络等Utility服务；各进程工作集相加会重复计入共享页。</text></svg>
