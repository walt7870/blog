<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="568" viewBox="0 0 1120 568" role="img" aria-labelledby="title desc"><title id="title">Main 在读取文件前校验调用身份</title><desc id="desc">Renderer只能发起固定业务动作；Preload不暴露任意channel或任意路径。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#607568"/></marker><style>text{font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;letter-spacing:0;fill:#253c30}.h{font-size:28px;font-weight:600}.n{font-size:21px;font-weight:600}.s{font-size:18px;fill:#52685b}.node{fill:#fff;stroke:#a6b9ad;stroke-width:1.5}.info{fill:#edf3fb;stroke:#739bbf;stroke-width:1.5}.good{fill:#e9f4ee;stroke:#397657;stroke-width:1.5}.warn{fill:#f8eef1;stroke:#ae7789;stroke-width:1.5}.edge{fill:none;stroke:#607568;stroke-width:2;marker-end:url(#arrow)}.dashed{stroke-dasharray:6 5}</style></defs><rect width="1120" height="568" fill="white"/><text x="32" y="44" class="h">Main 在读取文件前校验调用身份</text><text x="32" y="82" class="s">Renderer只能发起固定业务动作；Preload不暴露任意channel或任意路径。</text><path d="M272 212H304" class="edge"/><path d="M544 212H576" class="edge"/><path d="M816 212H848" class="edge"/><path d="M696 280V376" class="edge"/><g data-node="Renderer 页面"><rect x="32" y="144" width="240" height="136" rx="6" class="node"/><text x="50" y="177" class="n">Renderer 页面</text><text x="50" y="208" class="s">openDemoFile()</text><text x="50" y="235" class="s">处理成功或拒绝</text></g><g data-node="Preload 隔离世界"><rect x="304" y="144" width="240" height="136" rx="6" class="node"/><text x="322" y="177" class="n">Preload 隔离世界</text><text x="322" y="208" class="s">contextBridge</text><text x="322" y="235" class="s">固定IPC channel</text></g><g data-node="Main 身份校验"><rect x="576" y="144" width="240" height="136" rx="6" class="info"/><text x="594" y="177" class="n">Main 身份校验</text><text x="594" y="208" class="s">窗口 + 主frame</text><text x="594" y="235" class="s">精确页面URL</text></g><g data-node="固定文档"><rect x="848" y="144" width="240" height="136" rx="6" class="good"/><text x="866" y="177" class="n">固定文档</text><text x="866" y="208" class="s">只读 fixtures/demo.md</text><text x="866" y="235" class="s">返回业务内容</text></g><g data-node="身份不符 → 拒绝"><rect x="576" y="376" width="512" height="112" rx="6" class="warn"/><text x="594" y="409" class="n">身份不符 → 拒绝</text><text x="594" y="440" class="s">其他窗口、子frame或其他本地页面均不能获得读取能力</text></g><text x="32" y="540" class="s">结果沿原调用链返回；缺失文件使invoke拒绝，不能将空文本当成成功。</text></svg>
