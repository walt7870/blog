<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="536" viewBox="0 0 1120 536" role="img" aria-labelledby="title desc"><title id="title">Forge 各阶段产生不同的可验收结果</title><desc id="desc">源码与锁文件固定后，按目标OS、CPU和格式生成分发物。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#607568"/></marker><style>text{font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;letter-spacing:0;fill:#253c30}.h{font-size:28px;font-weight:600}.n{font-size:21px;font-weight:600}.s{font-size:18px;fill:#52685b}.node{fill:#fff;stroke:#a6b9ad;stroke-width:1.5}.info{fill:#edf3fb;stroke:#739bbf;stroke-width:1.5}.good{fill:#e9f4ee;stroke:#397657;stroke-width:1.5}.warn{fill:#f8eef1;stroke:#ae7789;stroke-width:1.5}.edge{fill:none;stroke:#607568;stroke-width:2;marker-end:url(#arrow)}.dashed{stroke-dasharray:6 5}</style></defs><rect width="1120" height="536" fill="white"/><text x="32" y="44" class="h">Forge 各阶段产生不同的可验收结果</text><text x="32" y="82" class="s">源码与锁文件固定后，按目标OS、CPU和格式生成分发物。</text><path d="M272 212H304" class="edge"/><path d="M544 212H576" class="edge"/><path d="M816 212H848" class="edge"/><g data-node="Package"><rect x="32" y="144" width="240" height="136" rx="6" class="node"/><text x="50" y="177" class="n">Package</text><text x="50" y="208" class="s">应用目录 + Runtime</text><text x="50" y="235" class="s">重建依赖与应用签名</text></g><g data-node="Make"><rect x="304" y="144" width="240" height="136" rx="6" class="node"/><text x="322" y="177" class="n">Make</text><text x="322" y="208" class="s">ZIP / 安装器 / 发行包</text><text x="322" y="235" class="s">按Maker处理分发要求</text></g><g data-node="Publish"><rect x="576" y="144" width="240" height="136" rx="6" class="node"/><text x="594" y="177" class="n">Publish</text><text x="594" y="208" class="s">上传产物与元数据</text><text x="594" y="235" class="s">核对公开下载内容</text></g><g data-node="目标客户端"><rect x="848" y="144" width="240" height="136" rx="6" class="good"/><text x="866" y="177" class="n">目标客户端</text><text x="866" y="208" class="s">首次启动与核心操作</text><text x="866" y="235" class="s">更新、重启与恢复</text></g><g data-node="先固定二进制，再签名；平台要求贯穿Package与Make"><rect x="32" y="352" width="1056" height="96" rx="6" class="info"/><text x="50" y="385" class="n">先固定二进制，再签名；平台要求贯穿Package与Make</text><text x="50" y="416" class="s">修改Fuse或替换原生模块后重新签名；上传完成还需验证公网地址与客户端行为</text></g><text x="32" y="508" class="s">macOS arm64 ZIP成功不等于Windows安装器、开发者签名或Apple公证通过。</text></svg>
