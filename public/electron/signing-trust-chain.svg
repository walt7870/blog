<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="536" viewBox="0 0 1120 536" role="img" aria-labelledby="title desc"><title id="title">macOS 的签名、公证与放行各有结果</title><desc id="desc">二进制和Fuse固定之后开始；验证最终下载分发物，而非只看构建目录。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#607568"/></marker><style>text{font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;letter-spacing:0;fill:#253c30}.h{font-size:28px;font-weight:600}.n{font-size:21px;font-weight:600}.s{font-size:18px;fill:#52685b}.node{fill:#fff;stroke:#a6b9ad;stroke-width:1.5}.info{fill:#edf3fb;stroke:#739bbf;stroke-width:1.5}.good{fill:#e9f4ee;stroke:#397657;stroke-width:1.5}.warn{fill:#f8eef1;stroke:#ae7789;stroke-width:1.5}.edge{fill:none;stroke:#607568;stroke-width:2;marker-end:url(#arrow)}.dashed{stroke-dasharray:6 5}</style></defs><rect width="1120" height="536" fill="white"/><text x="32" y="44" class="h">macOS 的签名、公证与放行各有结果</text><text x="32" y="82" class="s">二进制和Fuse固定之后开始；验证最终下载分发物，而非只看构建目录。</text><path d="M272 212H304" class="edge"/><path d="M544 212H576" class="edge"/><path d="M816 212H848" class="edge"/><g data-node="代码签名"><rect x="32" y="144" width="240" height="136" rx="6" class="node"/><text x="50" y="177" class="n">代码签名</text><text x="50" y="208" class="s">Developer ID身份</text><text x="50" y="235" class="s">codesign结构验证</text></g><g data-node="Apple 公证"><rect x="304" y="144" width="240" height="136" rx="6" class="node"/><text x="322" y="177" class="n">Apple 公证</text><text x="322" y="208" class="s">提交并保留请求ID</text><text x="322" y="235" class="s">等待最终 Accepted</text></g><g data-node="附加票据"><rect x="576" y="144" width="240" height="136" rx="6" class="node"/><text x="594" y="177" class="n">附加票据</text><text x="594" y="208" class="s">支持的.app / DMG等</text><text x="594" y="235" class="s">xcrun stapler validate</text></g><g data-node="系统评估"><rect x="848" y="144" width="240" height="136" rx="6" class="good"/><text x="866" y="177" class="n">系统评估</text><text x="866" y="208" class="s">spctl / Gatekeeper</text><text x="866" y="235" class="s">目标机器首次打开</text></g><g data-node="ZIP不能直接stapling：先处理其中.app，再重新压缩和计算摘要"><rect x="32" y="352" width="1056" height="96" rx="6" class="info"/><text x="50" y="385" class="n">ZIP不能直接stapling：先处理其中.app，再重新压缩和计算摘要</text><text x="50" y="416" class="s">Windows另查EXE/MSI签名、时间戳与信誉；签名有效不保证SmartScreen立刻放行</text></g><text x="32" y="508" class="s">公证提交成功不等于被接受；修改已签名二进制后重新签名与验证。</text></svg>
