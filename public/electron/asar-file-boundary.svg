<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="672" viewBox="0 0 1120 672" role="img" aria-labelledby="title desc"><title id="title">归档中的逻辑路径与系统真实路径不同</title><desc id="desc">ASAR可被提取，归档只读；它不提供代码保密或用户数据写入能力。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#607568"/></marker><style>text{font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;letter-spacing:0;fill:#253c30}.h{font-size:28px;font-weight:600}.n{font-size:21px;font-weight:600}.s{font-size:18px;fill:#52685b}.node{fill:#fff;stroke:#a6b9ad;stroke-width:1.5}.info{fill:#edf3fb;stroke:#739bbf;stroke-width:1.5}.good{fill:#e9f4ee;stroke:#397657;stroke-width:1.5}.warn{fill:#f8eef1;stroke:#ae7789;stroke-width:1.5}.edge{fill:none;stroke:#607568;stroke-width:2;marker-end:url(#arrow)}.dashed{stroke-dasharray:6 5}</style></defs><rect width="1120" height="672" fill="white"/><text x="32" y="44" class="h">归档中的逻辑路径与系统真实路径不同</text><text x="32" y="82" class="s">ASAR可被提取，归档只读；它不提供代码保密或用户数据写入能力。</text><path d="M480 200H640" class="edge"/><path d="M480 400H640" class="edge"/><g data-node="Electron归档感知读取"><rect x="32" y="136" width="448" height="128" rx="6" class="node"/><text x="50" y="169" class="n">Electron归档感知读取</text><text x="50" y="200" class="s">例如 fs.readFile读取模板</text><text x="50" y="227" class="s">支持范围由具体API决定</text></g><g data-node="app.asar"><rect x="640" y="136" width="448" height="128" rx="6" class="info"/><text x="658" y="169" class="n">app.asar</text><text x="658" y="200" class="s">main.js、HTML、模板和生产依赖</text><text x="658" y="227" class="s">操作系统眼中仍是单个文件</text></g><g data-node="要求真实路径的调用"><rect x="32" y="336" width="448" height="128" rx="6" class="node"/><text x="50" y="369" class="n">要求真实路径的调用</text><text x="50" y="400" class="s">原生库、外部工具、稳定文件访问</text><text x="50" y="427" class="s">部分API临时解包有额外成本</text></g><g data-node="app.asar.unpacked"><rect x="640" y="336" width="448" height="128" rx="6" class="node"/><text x="658" y="369" class="n">app.asar.unpacked</text><text x="658" y="400" class="s">显式解包必要的.node和动态库</text><text x="658" y="427" class="s">与app.asar一起交付</text></g><g data-node="用户文档 → 用户选择的位置；应用状态 → userData"><rect x="32" y="528" width="1056" height="88" rx="6" class="good"/><text x="50" y="561" class="n">用户文档 → 用户选择的位置；应用状态 → userData</text><text x="50" y="592" class="s">不写回__dirname；Fuse、完整性与签名不能替代文件授权</text></g><text x="32" y="644" class="s">解包规则从运行时需求反推；生产归档中排除测试夹具和长期服务端密钥。</text></svg>
