<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="648" viewBox="0 0 1120 648" role="img" aria-labelledby="title desc"><title id="title">候选匹配后，更新仍有等待与失败分支</title><desc id="desc">此处downloaded包含摘要和签名检查完成，不直接对应某个更新库的同名事件。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#607568"/></marker><style>text{font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;letter-spacing:0;fill:#253c30}.h{font-size:28px;font-weight:600}.n{font-size:21px;font-weight:600}.s{font-size:18px;fill:#52685b}.node{fill:#fff;stroke:#a6b9ad;stroke-width:1.5}.info{fill:#edf3fb;stroke:#739bbf;stroke-width:1.5}.good{fill:#e9f4ee;stroke:#397657;stroke-width:1.5}.warn{fill:#f8eef1;stroke:#ae7789;stroke-width:1.5}.edge{fill:none;stroke:#607568;stroke-width:2;marker-end:url(#arrow)}.dashed{stroke-dasharray:6 5}</style></defs><rect width="1120" height="648" fill="white"/><text x="32" y="44" class="h">候选匹配后，更新仍有等待与失败分支</text><text x="32" y="82" class="s">此处downloaded包含摘要和签名检查完成，不直接对应某个更新库的同名事件。</text><path d="M272 212H304" class="edge"/><path d="M544 212H576" class="edge"/><path d="M816 212H848" class="edge"/><path d="M152 280V392" class="edge"/><path d="M696 280V332Q696 340 688 340H432Q424 340 424 348V392" class="edge"/><path d="M968 280V392" class="edge"/><path d="M848 448H816" class="edge"/><g data-node="checking"><rect x="32" y="144" width="240" height="136" rx="6" class="info"/><text x="50" y="177" class="n">checking</text><text x="50" y="208" class="s">OS / CPU / channel</text><text x="50" y="235" class="s">最高兼容版本</text></g><g data-node="available"><rect x="304" y="144" width="240" height="136" rx="6" class="node"/><text x="322" y="177" class="n">available</text><text x="322" y="208" class="s">有候选，决定下载</text><text x="322" y="235" class="s">记录artifact身份</text></g><g data-node="downloading"><rect x="576" y="144" width="240" height="136" rx="6" class="node"/><text x="594" y="177" class="n">downloading</text><text x="594" y="208" class="s">长度与SHA-256</text><text x="594" y="235" class="s">验证平台签名</text></g><g data-node="downloaded"><rect x="848" y="144" width="240" height="136" rx="6" class="good"/><text x="866" y="177" class="n">downloaded</text><text x="866" y="208" class="s">校验完成</text><text x="866" y="235" class="s">稍后安装时停留</text></g><g data-node="not-available"><rect x="32" y="392" width="240" height="112" rx="6" class="node"/><text x="50" y="425" class="n">not-available</text><text x="50" y="456" class="s">无候选，继续使用</text></g><g data-node="failed"><rect x="304" y="392" width="240" height="112" rx="6" class="warn"/><text x="322" y="425" class="n">failed</text><text x="322" y="456" class="s">保留原因与重试计划</text></g><g data-node="restarting"><rect x="576" y="392" width="240" height="112" rx="6" class="node"/><text x="594" y="425" class="n">restarting</text><text x="594" y="456" class="s">启动新版本并验收</text></g><g data-node="installing"><rect x="848" y="392" width="240" height="112" rx="6" class="node"/><text x="866" y="425" class="n">installing</text><text x="866" y="456" class="s">用户确认、保存与收尾</text></g><text x="48" y="324" class="s">无候选</text><text x="456" y="328" class="s">下载或校验失败</text><text x="984" y="340" class="s">确认</text><text x="32" y="572" class="s">检查、下载、校验或安装失败均进入failed；按原因决定下一次重试。</text><text x="32" y="620" class="s">元数据也需可信；二进制可回退不代表数据库和配置迁移可逆。</text></svg>
