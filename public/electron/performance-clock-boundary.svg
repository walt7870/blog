<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="624" viewBox="0 0 1120 624" role="img" aria-labelledby="title desc"><title id="title">Main 与 Renderer 各自记录阶段耗时</title><desc id="desc">两个进程的performance.now原点不同；不能直接相减得到跨进程延迟。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#607568"/></marker><style>text{font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;letter-spacing:0;fill:#253c30}.h{font-size:28px;font-weight:600}.n{font-size:21px;font-weight:600}.s{font-size:18px;fill:#52685b}.node{fill:#fff;stroke:#a6b9ad;stroke-width:1.5}.info{fill:#edf3fb;stroke:#739bbf;stroke-width:1.5}.good{fill:#e9f4ee;stroke:#397657;stroke-width:1.5}.warn{fill:#f8eef1;stroke:#ae7789;stroke-width:1.5}.edge{fill:none;stroke:#607568;stroke-width:2;marker-end:url(#arrow)}.dashed{stroke-dasharray:6 5}</style></defs><rect width="1120" height="624" fill="white"/><text x="32" y="44" class="h">Main 与 Renderer 各自记录阶段耗时</text><text x="32" y="82" class="s">两个进程的performance.now原点不同；不能直接相减得到跨进程延迟。</text><text x="32" y="124" class="s">Main 单调时钟</text><path d="M336 208H408" class="edge"/><path d="M712 208H784" class="edge"/><g data-node="入口开始"><rect x="32" y="144" width="304" height="128" rx="6" class="node"/><text x="50" y="177" class="n">入口开始</text><text x="50" y="208" class="s">建立Main计时原点</text></g><g data-node="app ready"><rect x="408" y="144" width="304" height="128" rx="6" class="node"/><text x="426" y="177" class="n">app ready</text><text x="426" y="208" class="s">平台准备完成</text></g><g data-node="创建与导航"><rect x="784" y="144" width="304" height="128" rx="6" class="info"/><text x="802" y="177" class="n">创建与导航</text><text x="802" y="208" class="s">记录窗口及导航事件</text></g><text x="32" y="324" class="s">Renderer 单调时钟</text><path d="M336 408H408" class="edge"/><path d="M712 408H784" class="edge"/><g data-node="脚本启动"><rect x="32" y="344" width="304" height="128" rx="6" class="node"/><text x="50" y="377" class="n">脚本启动</text><text x="50" y="408" class="s">页面建立独立计时原点</text></g><g data-node="数据就绪"><rect x="408" y="344" width="304" height="128" rx="6" class="node"/><text x="426" y="377" class="n">数据就绪</text><text x="426" y="408" class="s">文档与插件加载完成</text></g><g data-node="交互可用"><rect x="784" y="344" width="304" height="128" rx="6" class="good"/><text x="802" y="377" class="n">交互可用</text><text x="802" y="408" class="s">实际可输入和保存</text></g><text x="32" y="536" class="s">通过受控IPC汇报各自阶段时长；跨进程完整计时需明确统一的测量定义。</text><text x="32" y="596" class="s">固定输入、版本和冷/热启动条件，重复取样；内存工作集不可简单相加去重。</text></svg>
