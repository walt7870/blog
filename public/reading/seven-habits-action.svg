<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="560" viewBox="0 0 1120 560" role="img" aria-labelledby="t d"><title id="t">七个习惯怎样转成行动</title><desc id="d">先处理自己的选择与方向，再形成合作；更新为下一轮行动保留能力。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#607568"/></marker><style>text{font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;letter-spacing:0;fill:#253c30}.title{font-size:28px;font-weight:600}.label{font-size:21px;font-weight:600}.body{font-size:18px;fill:#52685b}.node{fill:white;stroke:#a6b9ad;stroke-width:1.5}.green{fill:#e9f4ee;stroke:#397657;stroke-width:1.5}.blue{fill:#edf3fb;stroke:#739bbf;stroke-width:1.5}.edge{fill:none;stroke:#607568;stroke-width:2;marker-end:url(#a)}</style></defs><rect width="1120" height="560" fill="white"/><text x="32" y="44" class="title">七个习惯怎样转成行动</text><text x="32" y="82" class="body">先处理自己的选择与方向，再形成合作；更新为下一轮行动保留能力。</text><path d="M504 218H616" class="edge"/><text x="530" y="196" class="body">走向合作</text><path d="M744 354V286" class="edge" stroke-dasharray="6 5"/><path d="M376 354V286" class="edge" stroke-dasharray="6 5"/><g data-node="个人管理"><rect x="72" y="150" width="432" height="136" rx="6" class="green"/><text x="92" y="184" class="label">个人管理</text><text x="92" y="218" class="body">积极主动：选择可以采取的回应</text><text x="92" y="246" class="body">以终为始：确定结果与验收</text><text x="92" y="274" class="body">要事第一：为重要事项安排时间</text></g><g data-node="协作关系"><rect x="616" y="150" width="432" height="136" rx="6" class="blue"/><text x="636" y="184" class="label">协作关系</text><text x="636" y="218" class="body">双赢思维：寻找共同接受的目标</text><text x="636" y="246" class="body">知彼解己：先确认对方的需求</text><text x="636" y="274" class="body">统合综效：共同产生更好的方案</text></g><g data-node="不断更新：身体、学习、关系与方向"><rect x="272" y="354" width="576" height="136" rx="6" class="node"/><text x="292" y="388" class="label">不断更新：身体、学习、关系与方向</text><text x="292" y="422" class="body">检查工作结果与可持续节奏</text><text x="292" y="450" class="body">调整习惯，也调整目标、资源和制度</text></g><text x="32" y="530" class="body">例：延期项目先明确可交付范围，再共同确定验收与回退；不是要求个人无限加班。</text></svg>
