<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="560" viewBox="0 0 1120 560" role="img" aria-labelledby="t d"><title id="t">小程序内容与资源的两条边界</title><desc id="d">当前脚本生成分类与HTML；图片复制和Vue交互迁移不在这条生成链内。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#607568"/></marker><style>text{font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;letter-spacing:0;fill:#253c30}.title{font-size:28px;font-weight:600}.label{font-size:21px;font-weight:600}.body{font-size:18px;fill:#52685b}.node{fill:white;stroke:#a6b9ad;stroke-width:1.5}.green{fill:#e9f4ee;stroke:#397657;stroke-width:1.5}.blue{fill:#edf3fb;stroke:#739bbf;stroke-width:1.5}.edge{fill:none;stroke:#607568;stroke-width:2;marker-end:url(#a)}</style></defs><rect width="1120" height="560" fill="white"/><text x="32" y="44" class="title">小程序内容与资源的两条边界</text><text x="32" y="82" class="body">当前脚本生成分类与HTML；图片复制和Vue交互迁移不在这条生成链内。</text><path d="M336 218H408" class="edge"/><path d="M712 218H784" class="edge"/><path d="M936 286V354" class="edge"/><g data-node="博客源文件"><rect x="32" y="150" width="304" height="136" rx="6" class="node"/><text x="52" y="184" class="label">博客源文件</text><text x="52" y="218" class="body">根目录docs/中的Markdown</text><text x="52" y="246" class="body">只接收已定义分类</text><text x="52" y="274" class="body">不扫描全部站点入口</text></g><g data-node="解析与分包"><rect x="408" y="150" width="304" height="136" rx="6" class="green"/><text x="428" y="184" class="label">解析与分包</text><text x="428" y="218" class="body">markdown-it与内联样式</text><text x="428" y="246" class="body">18类分包与页面生成</text><text x="428" y="274" class="body">失败/跳过需要核对</text></g><g data-node="uni-app编译"><rect x="784" y="150" width="304" height="136" rx="6" class="node"/><text x="804" y="184" class="label">uni-app编译</text><text x="804" y="218" class="body">主包：分类和计数</text><text x="804" y="246" class="body">分包：标题、正文页面</text><text x="804" y="274" class="body">大小以编译产物为准</text></g><g data-node="设备阅读"><rect x="784" y="354" width="304" height="136" rx="6" class="blue"/><text x="804" y="388" class="label">设备阅读</text><text x="804" y="422" class="body">首次下载相应分包</text><text x="804" y="450" class="body">mp-html渲染兼容HTML</text><text x="804" y="478" class="body">下载与真机分别验证</text></g><g data-node="尚需独立适配的资源与能力"><rect x="32" y="354" width="640" height="136" rx="6" class="node"/><text x="52" y="388" class="label">尚需独立适配的资源与能力</text><text x="52" y="422" class="body">public/图片没有自动复制；站点根路径不会自动生效</text><text x="52" y="450" class="body">Vue实验与Mermaid不能直接作为小程序组件执行</text><text x="52" y="478" class="body">随包资源或远程资源，需要明确体积与离线条件</text></g><text x="32" y="530" class="body">分包已经下载，不代表远程图片已缓存；生成成功不代表所有文章完整可读。</text></svg>
