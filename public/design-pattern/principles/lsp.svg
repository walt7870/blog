<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="440" viewBox="0 0 1120 440" role="img" aria-labelledby="title desc"><title id="title">里氏替换：所有实现履行同一契约</title><desc id="desc">类型可赋值只证明语法兼容；输入条件、结果与异常约定也必须兼容。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker></defs>
<style>text{font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#172033}.title{font-size:27px;font-weight:700}.sub{font-size:16px;fill:#526173}.h{font-size:19px;font-weight:700}.t{font-size:16px}.small{font-size:14px;fill:#526173}.box{fill:#fff;stroke:#b8c8d7;stroke-width:1.5}.accent{fill:#e9f7f4;stroke:#339786;stroke-width:1.5}.warn{fill:#fff2eb;stroke:#d28a66;stroke-width:1.5}.line{fill:none;stroke:#64748b;stroke-width:1.7;marker-end:url(#arrow)}.rule{stroke:#d4dee7;stroke-width:1}</style><rect width="1120" height="440" fill="#f8fafc"/><text class="title" x="40" y="52">里氏替换：所有实现履行同一契约</text><text class="sub" x="40" y="84">类型可赋值只证明语法兼容；输入条件、结果与异常约定也必须兼容。</text><path class="line" d="M340 240H410"/><path class="line" d="M710 240H760V162H820"/><path class="line" d="M710 240H760V307H820"/><rect class="box" x="40" y="170" width="300" height="140" rx="6"/><text class="h" x="60" y="202">存储端口契约</text><text class="t" x="60" y="231">成功后按键读取相同字节</text><text class="t" x="60" y="257">明确覆盖与可见时点</text><rect class="accent" x="410" y="170" width="300" height="140" rx="6"/><text class="h" x="430" y="202">同一组契约测试</text><text class="t" x="430" y="231">正常输入 / 边界 / 异常</text><text class="t" x="430" y="257">针对每个实现执行</text><rect class="box" x="820" y="120" width="260" height="85" rx="6"/><text class="h" x="840" y="152">本地存储实现</text><text class="t" x="840" y="181">必须满足契约</text><rect class="box" x="820" y="265" width="260" height="85" rx="6"/><text class="h" x="840" y="297">远程存储实现</text><text class="t" x="840" y="326">必须满足契约</text><text class="sub" x="40" y="400">只有契约明确允许时，操作才可不支持；不能仅凭异常类型认定违规。</text></svg>
