<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="470" viewBox="0 0 1120 470" role="img" aria-labelledby="title desc"><title id="title">开闭原则：优惠实现扩展，计算入口稳定</title><desc id="desc">调用方选择已注册类型；未知类型、重复注册和非法金额均需明确处理。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker></defs>
<style>text{font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#172033}.title{font-size:27px;font-weight:700}.sub{font-size:16px;fill:#526173}.h{font-size:19px;font-weight:700}.t{font-size:16px}.small{font-size:14px;fill:#526173}.box{fill:#fff;stroke:#b8c8d7;stroke-width:1.5}.accent{fill:#e9f7f4;stroke:#339786;stroke-width:1.5}.warn{fill:#fff2eb;stroke:#d28a66;stroke-width:1.5}.line{fill:none;stroke:#64748b;stroke-width:1.7;marker-end:url(#arrow)}.rule{stroke:#d4dee7;stroke-width:1}</style><rect width="1120" height="470" fill="#f8fafc"/><text class="title" x="40" y="52">开闭原则：优惠实现扩展，计算入口稳定</text><text class="sub" x="40" y="84">调用方选择已注册类型；未知类型、重复注册和非法金额均需明确处理。</text><path class="line" d="M290 260H360"/><path class="line" d="M660 225H690V180H730"/><path class="line" d="M660 290H690V320H730"/><rect class="box" x="40" y="205" width="250" height="110" rx="6"/><text class="h" x="60" y="237">调用方</text><text class="t" x="60" y="266">显式指定优惠类型</text><rect class="accent" x="360" y="185" width="300" height="150" rx="6"/><text class="h" x="380" y="217">DiscountService</text><text class="t" x="380" y="246">通过注册表查找策略</text><text class="t" x="380" y="272">检查返回金额范围</text><rect class="box" x="730" y="135" width="350" height="90" rx="6"/><text class="h" x="750" y="167">DiscountPolicy</text><text class="t" x="750" y="196">统一应付金额契约</text><rect class="box" x="730" y="260" width="350" height="125" rx="6"/><text class="h" x="750" y="292">策略注册表</text><text class="t" x="750" y="321">会员 / 新用户 / 学生优惠</text><text class="t" x="750" y="347">新增实现后加入装配</text><text class="sub" x="40" y="430">稳定的是计算入口与金额契约；实现和注册配置仍然需要修改并验证。</text></svg>
