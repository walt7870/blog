<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="410" viewBox="0 0 1120 410" role="img" aria-labelledby="title desc"><title id="title">合成复用：按调用顺序组装日志能力</title><desc id="desc">外层对象持有内层 Logger；箭头表示运行时委托，不是继承关系。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker></defs>
<style>text{font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#172033}.title{font-size:27px;font-weight:700}.sub{font-size:16px;fill:#526173}.h{font-size:19px;font-weight:700}.t{font-size:16px}.small{font-size:14px;fill:#526173}.box{fill:#fff;stroke:#b8c8d7;stroke-width:1.5}.accent{fill:#e9f7f4;stroke:#339786;stroke-width:1.5}.warn{fill:#fff2eb;stroke:#d28a66;stroke-width:1.5}.line{fill:none;stroke:#64748b;stroke-width:1.7;marker-end:url(#arrow)}.rule{stroke:#d4dee7;stroke-width:1}</style><rect width="1120" height="410" fill="#f8fafc"/><text class="title" x="40" y="52">合成复用：按调用顺序组装日志能力</text><text class="sub" x="40" y="84">外层对象持有内层 Logger；箭头表示运行时委托，不是继承关系。</text><path class="line" d="M250 229H310"/><path class="line" d="M570 229H630"/><path class="line" d="M890 229H940"/><rect class="box" x="40" y="175" width="210" height="110" rx="6"/><text class="h" x="60" y="207">调用方</text><text class="t" x="60" y="236">log(message)</text><rect class="accent" x="310" y="175" width="260" height="110" rx="6"/><text class="h" x="330" y="207">PrefixLogger</text><text class="t" x="330" y="236">添加订单前缀</text><rect class="box" x="630" y="175" width="260" height="110" rx="6"/><text class="h" x="650" y="207">TokenMaskLogger</text><text class="t" x="650" y="236">遮盖约定 token 字段</text><rect class="box" x="940" y="175" width="140" height="110" rx="6"/><text class="h" x="960" y="207">控制台</text><text class="t" x="960" y="236">最终输出</text><text class="sub" x="40" y="335">共同接口：Logger.log(String)。先添加前缀，再遮盖字段，最后输出。</text><text class="sub" x="40" y="370">能力顺序需要测试；示例遮盖规则有限，不能当作完整敏感信息过滤器。</text></svg>
