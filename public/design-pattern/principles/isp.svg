<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="450" viewBox="0 0 1120 450" role="img" aria-labelledby="title desc"><title id="title">接口隔离：查询与审批依赖各自角色</title><desc id="desc">同一实现可以承载多个角色；接口拆分不等于拆进程，也不能替代权限检查。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker></defs>
<style>text{font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#172033}.title{font-size:27px;font-weight:700}.sub{font-size:16px;fill:#526173}.h{font-size:19px;font-weight:700}.t{font-size:16px}.small{font-size:14px;fill:#526173}.box{fill:#fff;stroke:#b8c8d7;stroke-width:1.5}.accent{fill:#e9f7f4;stroke:#339786;stroke-width:1.5}.warn{fill:#fff2eb;stroke:#d28a66;stroke-width:1.5}.line{fill:none;stroke:#64748b;stroke-width:1.7;marker-end:url(#arrow)}.rule{stroke:#d4dee7;stroke-width:1}</style><rect width="1120" height="450" fill="#f8fafc"/><text class="title" x="40" y="52">接口隔离：查询与审批依赖各自角色</text><text class="sub" x="40" y="84">同一实现可以承载多个角色；接口拆分不等于拆进程，也不能替代权限检查。</text><path class="line" d="M300 184H390"/><path class="line" d="M300 324H390"/><path class="line" d="M820 235H770V184H690"/><path class="line" d="M820 275H770V324H690"/><rect class="box" x="40" y="140" width="260" height="88" rx="6"/><text class="h" x="60" y="172">查询页面</text><text class="t" x="60" y="201">仅依赖查询能力</text><rect class="box" x="40" y="280" width="260" height="88" rx="6"/><text class="h" x="60" y="312">审批流程</text><text class="t" x="60" y="341">仅依赖审批能力</text><rect class="accent" x="390" y="140" width="300" height="88" rx="6"/><text class="h" x="410" y="172">UserQueryService</text><text class="t" x="410" y="201">get(id)</text><rect class="accent" x="390" y="280" width="300" height="88" rx="6"/><text class="h" x="410" y="312">UserApprovalService</text><text class="t" x="410" y="341">approve(id)</text><rect class="box" x="820" y="205" width="260" height="100" rx="6"/><text class="h" x="840" y="237">用户服务实现</text><text class="t" x="840" y="266">实现相关角色接口</text><text class="sub" x="40" y="412">箭头表示源码依赖；调用角色变更时，不应牵动无关调用者。</text></svg>
