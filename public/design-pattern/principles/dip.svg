<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="440" viewBox="0 0 1120 440" role="img" aria-labelledby="title desc"><title id="title">依赖倒置：抽象由业务意图决定</title><desc id="desc">箭头表示源码依赖方向，运行时仍由业务通过端口调用适配器。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker></defs>
<style>text{font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#172033}.title{font-size:27px;font-weight:700}.sub{font-size:16px;fill:#526173}.h{font-size:19px;font-weight:700}.t{font-size:16px}.small{font-size:14px;fill:#526173}.box{fill:#fff;stroke:#b8c8d7;stroke-width:1.5}.accent{fill:#e9f7f4;stroke:#339786;stroke-width:1.5}.warn{fill:#fff2eb;stroke:#d28a66;stroke-width:1.5}.line{fill:none;stroke:#64748b;stroke-width:1.7;marker-end:url(#arrow)}.rule{stroke:#d4dee7;stroke-width:1}</style><rect width="1120" height="440" fill="#f8fafc"/><text class="title" x="40" y="52">依赖倒置：抽象由业务意图决定</text><text class="sub" x="40" y="84">箭头表示源码依赖方向，运行时仍由业务通过端口调用适配器。</text><path class="line" d="M340 235H420"/><path class="line" d="M820 235H740"/><rect class="box" x="40" y="165" width="300" height="140" rx="6"/><text class="h" x="60" y="197">OrderService</text><text class="t" x="60" y="226">发送订单创建通知</text><text class="t" x="60" y="252">不引用厂商 SDK</text><rect class="accent" x="420" y="165" width="320" height="140" rx="6"/><text class="h" x="440" y="197">OrderMessagePort</text><text class="t" x="440" y="226">由业务定义通知契约</text><text class="t" x="440" y="252">约定失败与结果未知</text><rect class="box" x="820" y="165" width="260" height="140" rx="6"/><text class="h" x="840" y="197">AliyunSmsAdapter</text><text class="t" x="840" y="226">实现业务端口</text><text class="t" x="840" y="252">内部调用 SDK</text><text class="sub" x="40" y="370">组装入口创建 SDK、适配器和业务服务；构造器注入负责把它们连接起来。</text><text class="sub" x="40" y="402">依赖注入是组装手段，依赖倒置是源码边界，两者不能等同。</text></svg>
