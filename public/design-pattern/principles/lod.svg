<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="460" viewBox="0 0 1120 460" role="img" aria-labelledby="title desc"><title id="title">迪米特法则：表达配送意图，减少结构穿透</title><desc id="desc">订单持有配送地址快照；客户后续更改常用地址，不应改变已确认订单。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker></defs>
<style>text{font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#172033}.title{font-size:27px;font-weight:700}.sub{font-size:16px;fill:#526173}.h{font-size:19px;font-weight:700}.t{font-size:16px}.small{font-size:14px;fill:#526173}.box{fill:#fff;stroke:#b8c8d7;stroke-width:1.5}.accent{fill:#e9f7f4;stroke:#339786;stroke-width:1.5}.warn{fill:#fff2eb;stroke:#d28a66;stroke-width:1.5}.line{fill:none;stroke:#64748b;stroke-width:1.7;marker-end:url(#arrow)}.rule{stroke:#d4dee7;stroke-width:1}</style><rect width="1120" height="460" fill="#f8fafc"/><text class="title" x="40" y="52">迪米特法则：表达配送意图，减少结构穿透</text><text class="sub" x="40" y="84">订单持有配送地址快照；客户后续更改常用地址，不应改变已确认订单。</text><rect class="warn" x="40" y="130" width="480" height="125" rx="6"/><text class="h" x="60" y="162">外部拼接内部字段</text><text class="t" x="60" y="191">订单 → 客户 → 当前地址 → 字段</text><text class="t" x="60" y="217">调用方掌握模型细节且容易取错地址</text><rect class="accent" x="600" y="130" width="480" height="125" rx="6"/><text class="h" x="620" y="162">外部调用订单意图</text><text class="t" x="620" y="191">order.deliveryLabel()</text><text class="t" x="620" y="217">内部使用订单的配送地址快照</text><path class="line" d="M300 328H410"/><path class="line" d="M700 328H810"/><rect class="box" x="40" y="290" width="260" height="86" rx="6"/><text class="h" x="60" y="322">DeliveryService</text><text class="t" x="60" y="351">请求配送标签</text><rect class="box" x="410" y="290" width="290" height="86" rx="6"/><text class="h" x="430" y="322">Order</text><text class="t" x="430" y="351">封装地址快照</text><rect class="box" x="810" y="290" width="270" height="86" rx="6"/><text class="h" x="830" y="322">ShippingAddress</text><text class="t" x="830" y="351">生成标签文本</text><text class="sub" x="40" y="420">下方箭头表示调用方向。评价标准是知识边界与不变量，而不是 getter 数量。</text></svg>
