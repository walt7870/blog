<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="510" viewBox="0 0 1120 510" role="img" aria-labelledby="title desc"><title id="title">设计原则：从三类问题定位边界</title><desc id="desc">原则提供判断依据，模式提供组织方式；它们不是必须逐项套用的清单。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker></defs>
<style>text{font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#172033}.title{font-size:27px;font-weight:700}.sub{font-size:16px;fill:#526173}.h{font-size:19px;font-weight:700}.t{font-size:16px}.small{font-size:14px;fill:#526173}.box{fill:#fff;stroke:#b8c8d7;stroke-width:1.5}.accent{fill:#e9f7f4;stroke:#339786;stroke-width:1.5}.warn{fill:#fff2eb;stroke:#d28a66;stroke-width:1.5}.line{fill:none;stroke:#64748b;stroke-width:1.7;marker-end:url(#arrow)}.rule{stroke:#d4dee7;stroke-width:1}</style><rect width="1120" height="510" fill="#f8fafc"/><text class="title" x="40" y="52">设计原则：从三类问题定位边界</text><text class="sub" x="40" y="84">原则提供判断依据，模式提供组织方式；它们不是必须逐项套用的清单。</text><text class="h" x="40" y="150">变化原因</text><rect class="box" x="240" y="115" width="370" height="110" rx="6"/><text class="h" x="260" y="147">单一职责</text><text class="t" x="260" y="176">不同变化原因分别承载</text><rect class="box" x="650" y="115" width="420" height="110" rx="6"/><text class="h" x="670" y="147">开闭原则</text><text class="t" x="670" y="176">新增同类能力，稳定流程少改动</text><text class="h" x="40" y="292">依赖边界</text><rect class="box" x="240" y="255" width="250" height="110" rx="6"/><text class="h" x="260" y="287">依赖倒置</text><text class="t" x="260" y="316">策略依赖业务抽象</text><rect class="box" x="520" y="255" width="250" height="110" rx="6"/><text class="h" x="540" y="287">接口隔离</text><text class="t" x="540" y="316">按调用角色组织能力</text><rect class="box" x="800" y="255" width="270" height="110" rx="6"/><text class="h" x="820" y="287">迪米特法则</text><text class="t" x="820" y="316">少暴露内部对象结构</text><text class="h" x="40" y="432">行为与复用</text><rect class="box" x="240" y="395" width="370" height="90" rx="6"/><text class="h" x="260" y="427">里氏替换</text><text class="t" x="260" y="456">实现必须满足共同契约</text><rect class="box" x="650" y="395" width="420" height="90" rx="6"/><text class="h" x="670" y="427">合成复用</text><text class="t" x="670" y="456">独立能力用委托组装</text></svg>
