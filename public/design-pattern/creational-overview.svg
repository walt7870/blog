<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="480" viewBox="0 0 1120 480" role="img" aria-labelledby="title desc"><title id="title">创建型模式：明确创建与生命周期合同</title><desc id="desc">创建逻辑可以隔离变化，但资源、失败、复用范围仍需逐项约定。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker></defs><style>text{font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#172033}.title{font-size:27px;font-weight:700}.sub{font-size:16px;fill:#526173}.h{font-size:19px;font-weight:700}.t{font-size:16px}.small{font-size:14px;fill:#526173}.box{fill:#fff;stroke:#b8c8d7;stroke-width:1.5}.accent{fill:#e9f7f4;stroke:#339786;stroke-width:1.5}.warn{fill:#fff2eb;stroke:#d28a66;stroke-width:1.5}.line{fill:none;stroke:#64748b;stroke-width:1.7;marker-end:url(#arrow)}.rule{stroke:#d4dee7;stroke-width:1}</style><rect width="1120" height="480" fill="#f8fafc"/><text class="title" x="40" y="52">创建型模式：明确创建与生命周期合同</text><text class="sub" x="40" y="84">创建逻辑可以隔离变化，但资源、失败、复用范围仍需逐项约定。</text><path class="line" d="M300 185H390"/><path class="line" d="M710 185H800"/><rect class="box" x="40" y="130" width="260" height="110" rx="6"/><text class="h" x="60" y="162">使用方</text><text class="t" x="60" y="191">需要稳定的对象能力</text><rect class="accent" x="390" y="120" width="320" height="130" rx="6"/><text class="h" x="410" y="152">创建边界</text><text class="t" x="410" y="181">选择 / 组装 / 复制 / 复用</text><text class="t" x="410" y="207">失败时清理已创建资源</text><rect class="box" x="800" y="130" width="280" height="110" rx="6"/><text class="h" x="820" y="162">合法产品</text><text class="t" x="820" y="191">明确拥有者与关闭时机</text><text class="h" x="40" y="310">选择实现</text><text class="t" x="40" y="347">工厂方法：具体创建者覆盖创建操作</text><text class="t" x="40" y="380">抽象工厂：成套创建相关产品</text><text class="h" x="560" y="310">组装与复用</text><text class="t" x="560" y="347">建造者：校验并冻结配置</text><text class="t" x="560" y="380">原型：明确独立与共享字段</text><text class="t" x="560" y="413">单例：约定范围内共享实例</text><text class="sub" x="40" y="453">对象昂贵不意味着必须只有一个；返回新实例还是共享实例，都需要写进合同。</text></svg>
