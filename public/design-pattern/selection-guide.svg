<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="530" viewBox="0 0 1120 530" role="img" aria-labelledby="title desc"><title id="title">设计模式的判断路径</title><desc id="desc">先找到变化，再检查稳定接口；每条路径给出候选，不能代替业务判断。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker></defs>
<style>text{font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#172033}.title{font-size:27px;font-weight:700}.sub{font-size:16px;fill:#526173}.h{font-size:19px;font-weight:700}.t{font-size:16px}.small{font-size:14px;fill:#526173}.box{fill:#fff;stroke:#b8c8d7;stroke-width:1.5}.accent{fill:#e9f7f4;stroke:#339786;stroke-width:1.5}.warn{fill:#fff2eb;stroke:#d28a66;stroke-width:1.5}.line{fill:none;stroke:#64748b;stroke-width:1.7;marker-end:url(#arrow)}.rule{stroke:#d4dee7;stroke-width:1}</style><rect width="1120" height="530" fill="#f8fafc"/><text class="title" x="40" y="52">设计模式的判断路径</text><text class="sub" x="40" y="84">先找到变化，再检查稳定接口；每条路径给出候选，不能代替业务判断。</text><path class="line" d="M240 273H280V164H320"/><path class="line" d="M240 273H320"/><path class="line" d="M240 273H280V382H320"/><path class="line" d="M620 164H680"/><path class="line" d="M620 273H680"/><path class="line" d="M620 382H680"/><rect class="accent" x="40" y="220" width="200" height="105" rx="6"/><text class="h" x="60" y="252">变化位置</text><text class="t" x="60" y="281">哪里反复被修改？</text><rect class="box" x="320" y="120" width="300" height="88" rx="6"/><text class="h" x="340" y="152">创建过程</text><text class="t" x="340" y="181">类型、参数、初始化步骤</text><rect class="box" x="320" y="229" width="300" height="88" rx="6"/><text class="h" x="340" y="261">对象关系</text><text class="t" x="340" y="290">接口兼容、访问与叠加</text><rect class="box" x="320" y="338" width="300" height="88" rx="6"/><text class="h" x="340" y="370">协作行为</text><text class="t" x="340" y="399">算法、状态、通知与处理</text><rect class="box" x="680" y="120" width="390" height="88" rx="6"/><text class="h" x="700" y="152">工厂 / 建造者等</text><text class="t" x="700" y="181">先统一创建输入与产品契约</text><rect class="box" x="680" y="229" width="390" height="88" rx="6"/><text class="h" x="700" y="261">适配器 / 代理 / 装饰器等</text><text class="t" x="700" y="290">先区分接口转换与职责叠加</text><rect class="box" x="680" y="338" width="390" height="88" rx="6"/><text class="h" x="700" y="370">策略 / 状态 / 观察者等</text><text class="t" x="700" y="399">先明确谁选择、谁迁移、谁通知</text><text class="sub" x="40" y="485">验收：新增需求是否少改稳定代码？若直接实现已经清晰，保留简单结构。</text></svg>
