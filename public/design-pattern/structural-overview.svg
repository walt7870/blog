<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="500" viewBox="0 0 1120 500" role="img" aria-labelledby="title desc">
<title id="title">订单导出：结构边界与异步状态</title><desc id="desc">请求经过访问代理和导出外观记录任务；工作进程读取任务后生成文件，再经适配器提交通知。任务已创建和通知已受理均不等于业务全部完成。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker></defs><style>text{font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#172033}.title{font-size:27px;font-weight:700}.sub{font-size:16px;fill:#526173}.h{font-size:19px;font-weight:700}.t{font-size:16px}.box{fill:#fff;stroke:#b8c8d7;stroke-width:1.5}.accent{fill:#e9f7f4;stroke:#339786;stroke-width:1.5}.line{fill:none;stroke:#64748b;stroke-width:1.7;marker-end:url(#arrow)}.type{stroke-dasharray:5 4}</style>
<rect width="1120" height="500" fill="#f8fafc"/><text class="title" x="40" y="52">订单导出：结构边界与异步状态</text><text class="sub" x="40" y="84">场景模型：包装对象明确职责，任务状态与重试仍由业务协议维护。</text>
<path class="line" d="M240 185H300"/><path class="line" d="M510 185H570"/><path class="line" d="M780 185H850"/>
<path class="line type" d="M950 230V270H140V325"/>
<path class="line" d="M240 370H300"/><path class="line" d="M510 370H570"/><path class="line" d="M780 370H850"/>
<rect class="box" x="40" y="140" width="200" height="90" rx="6"/><text class="h" x="60" y="174">导出请求</text><text class="t" x="60" y="202">带当前用户与参数</text>
<rect class="accent" x="300" y="140" width="210" height="90" rx="6"/><text class="h" x="320" y="174">访问代理</text><text class="t" x="320" y="202">先鉴权，再访问目标</text>
<rect class="box" x="570" y="140" width="210" height="90" rx="6"/><text class="h" x="590" y="174">导出外观</text><text class="t" x="590" y="202">协调创建任务的入口</text>
<rect class="box" x="850" y="140" width="230" height="90" rx="6"/><text class="h" x="870" y="174">任务记录</text><text class="t" x="870" y="202">已创建 ≠ 已完成</text>
<rect x="408" y="255" width="330" height="30" fill="#f8fafc"/><text class="sub" x="425" y="276">后续读取任务；需要幂等与失败恢复</text>
<rect class="box" x="40" y="325" width="200" height="90" rx="6"/><text class="h" x="60" y="359">任务执行</text><text class="t" x="60" y="387">生成并保存导出文件</text>
<rect class="box" x="300" y="325" width="210" height="90" rx="6"/><text class="h" x="320" y="359">通知接口</text><text class="t" x="320" y="387">表达内部提交合同</text>
<rect class="accent" x="570" y="325" width="210" height="90" rx="6"/><text class="h" x="590" y="359">厂商适配器</text><text class="t" x="590" y="387">转换参数与返回状态</text>
<rect class="box" x="850" y="325" width="230" height="90" rx="6"/><text class="h" x="870" y="359">通知 SDK</text><text class="t" x="870" y="387">已受理 ≠ 已送达</text>
<text class="sub" x="40" y="466">实线表示调用，虚线表示后续任务处理；此图没有表达跨组件原子事务。</text>
</svg>
