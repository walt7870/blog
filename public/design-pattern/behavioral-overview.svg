<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="500" viewBox="0 0 1120 500" role="img" aria-labelledby="title desc">
<title id="title">行为协作：导出从检查到完成通知</title><desc id="desc">请求通过责任链检查后封装为命令，执行流程使用策略生成内容并更新任务状态。完成事件触发观察者。箭头表达场景中的处理关系，不表示命令自带可靠队列。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker></defs><style>text{font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#172033}.title{font-size:27px;font-weight:700}.sub{font-size:16px;fill:#526173}.h{font-size:19px;font-weight:700}.t{font-size:16px}.box{fill:#fff;stroke:#b8c8d7;stroke-width:1.5}.accent{fill:#e9f7f4;stroke:#339786;stroke-width:1.5}.line{fill:none;stroke:#64748b;stroke-width:1.7;marker-end:url(#arrow)}.type{stroke-dasharray:5 4}</style>
<rect width="1120" height="500" fill="#f8fafc"/><text class="title" x="40" y="52">行为协作：导出从检查到完成通知</text><text class="sub" x="40" y="84">场景模型：先找谁处理、谁选算法、谁持有状态，再确定扩展点。</text>
<path class="line" d="M280 195H440"/><path class="line" d="M680 195H840"/><path class="line" d="M960 250V325"/><path class="line type" d="M840 375H680"/>
<text class="sub" x="316" y="166">检查通过</text><text class="sub" x="718" y="166">调度执行</text><text class="sub" x="701" y="346">完成事件</text>
<rect class="accent" x="40" y="140" width="240" height="110" rx="6"/><text class="h" x="60" y="176">责任链：入口检查</text><text class="t" x="60" y="207">权限 → 参数 → 继续</text><text class="t" x="60" y="233">任一拒绝即停止</text>
<rect class="box" x="440" y="140" width="240" height="110" rx="6"/><text class="h" x="460" y="176">命令：导出操作</text><text class="t" x="460" y="207">保存要执行的请求</text><text class="t" x="460" y="233">持久化与幂等另行定义</text>
<rect class="box" x="840" y="140" width="240" height="110" rx="6"/><text class="h" x="860" y="176">执行流程</text><text class="t" x="860" y="207">模板固定公共步骤</text><text class="t" x="860" y="233">策略选择生成算法</text>
<rect class="box" x="840" y="325" width="240" height="100" rx="6"/><text class="h" x="860" y="360">状态：任务生命周期</text><text class="t" x="860" y="391">待处理 / 执行中 / 成败</text>
<rect class="box" x="440" y="325" width="240" height="100" rx="6"/><text class="h" x="460" y="360">观察者：订阅响应</text><text class="t" x="460" y="391">日志、刷新与通知等</text>
<text class="sub" x="40" y="468">实线为处理关系，虚线为事件通知；状态类与回调都不能代替持久化、并发控制与失败恢复。</text>
</svg>
