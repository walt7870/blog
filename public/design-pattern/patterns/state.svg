<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="510" viewBox="0 0 1120 510" role="img" aria-labelledby="title desc"><title id="title">状态：合法事件推进导出任务，终态拒绝后续迁移</title><desc id="desc">QUEUED通过START进入RUNNING，通过CANCEL进入CANCELLED。RUNNING通过COMPLETE且产物键非空进入SUCCEEDED，通过FAIL进入FAILED。三种终态拒绝其他事件。本模型不允许运行中取消。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker></defs><style>text{font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#172033}.title{font-size:27px;font-weight:700}.sub{font-size:16px;fill:#526173}.h{font-size:19px;font-weight:700}.t{font-size:16px}.box{fill:#fff;stroke:#b8c8d7;stroke-width:1.5}.accent{fill:#e9f7f4;stroke:#339786;stroke-width:1.5}.line{fill:none;stroke:#64748b;stroke-width:1.7;marker-end:url(#arrow)}.back{stroke-dasharray:5 4}</style>
<rect width="1120" height="510" fill="#f8fafc"/><text class="title" x="40" y="52">状态：合法事件推进导出任务</text><text class="sub" x="40" y="84">事件规则属于状态行为，Job 统一检查版本并提交新快照；拒绝事件不改变当前状态。</text>
<path class="line" d="M250 215H420"/><path class="line" d="M650 215H850"/><path class="line" d="M145 260V350"/><path class="line" d="M535 260V350"/>
<text class="t" x="295" y="194">START</text><text class="t" x="695" y="178">COMPLETE</text><text class="sub" x="677" y="199">[产物键非空]</text><text class="t" x="165" y="316">CANCEL</text><text class="t" x="555" y="316">FAIL</text>
<rect class="box" x="40" y="170" width="210" height="90" rx="8"/><text class="h" x="60" y="205">QUEUED</text><text class="t" x="60" y="236">初始：待执行</text>
<rect class="accent" x="420" y="170" width="230" height="90" rx="8"/><text class="h" x="440" y="205">RUNNING</text><text class="t" x="440" y="236">本次执行中</text>
<rect class="box" x="850" y="170" width="230" height="90" rx="8"/><text class="h" x="870" y="205">SUCCEEDED</text><text class="t" x="870" y="236">终态：成功</text>
<rect class="box" x="40" y="350" width="210" height="70" rx="8"/><text class="h" x="60" y="380">CANCELLED</text><text class="t" x="60" y="406">终态：启动前取消</text>
<rect class="box" x="420" y="350" width="230" height="70" rx="8"/><text class="h" x="440" y="380">FAILED</text><text class="t" x="440" y="406">终态：本次执行失败</text>
<text class="sub" x="40" y="462">仅绘允许的四条边；其他事件均拒绝，终态不再启动。</text><text class="sub" x="40" y="488">本例不含运行中取消和自动重试；外部产物与进程崩溃恢复需要独立合同。</text>
</svg>
