<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="530" viewBox="0 0 1120 530" role="img" aria-labelledby="title desc"><title id="title">抽象工厂：一次装配选择一套主题产品</title><desc id="desc">箭头表示客户端通过所选工厂创建产品；每个 Application 只使用一套工厂。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker></defs><style>text{font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#172033}.title{font-size:27px;font-weight:700}.sub{font-size:16px;fill:#526173}.h{font-size:19px;font-weight:700}.t{font-size:16px}.small{font-size:14px;fill:#526173}.box{fill:#fff;stroke:#b8c8d7;stroke-width:1.5}.accent{fill:#e9f7f4;stroke:#339786;stroke-width:1.5}.warn{fill:#fff2eb;stroke:#d28a66;stroke-width:1.5}.line{fill:none;stroke:#64748b;stroke-width:1.7;marker-end:url(#arrow)}.rule{stroke:#d4dee7;stroke-width:1}</style><rect width="1120" height="530" fill="#f8fafc"/><text class="title" x="40" y="52">抽象工厂：一次装配选择一套主题产品</text><text class="sub" x="40" y="84">箭头表示客户端通过所选工厂创建产品；每个 Application 只使用一套工厂。</text><path class="line" d="M280 278H320V175H370"/><path class="line" d="M280 278H320V385H370"/><path class="line" d="M660 175H710V148H760"/><path class="line" d="M660 175H710V248H760"/><path class="line" d="M660 385H710V358H760"/><path class="line" d="M660 385H710V458H760"/><rect class="accent" x="40" y="220" width="240" height="120" rx="6"/><text class="h" x="60" y="252">Application</text><text class="t" x="60" y="281">依赖 WidgetFactory</text><text class="t" x="60" y="307">从同一工厂取得产品</text><rect class="box" x="370" y="130" width="290" height="90" rx="6"/><text class="h" x="390" y="162">LightFactory</text><text class="t" x="390" y="191">浅色产品族</text><rect class="box" x="370" y="340" width="290" height="90" rx="6"/><text class="h" x="390" y="372">DarkFactory</text><text class="t" x="390" y="401">深色产品族</text><rect class="box" x="760" y="110" width="320" height="76" rx="6"/><text class="h" x="780" y="142">Button / LIGHT</text><text class="t" x="780" y="171">按钮种类</text><rect class="box" x="760" y="210" width="320" height="76" rx="6"/><text class="h" x="780" y="242">TextBox / LIGHT</text><text class="t" x="780" y="271">文本框种类</text><rect class="box" x="760" y="320" width="320" height="76" rx="6"/><text class="h" x="780" y="352">Button / DARK</text><text class="t" x="780" y="381">按钮种类</text><rect class="box" x="760" y="420" width="320" height="76" rx="6"/><text class="h" x="780" y="452">TextBox / DARK</text><text class="t" x="780" y="481">文本框种类</text></svg>
