<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="465" viewBox="0 0 1120 465" role="img" aria-labelledby="title desc"><title id="title">原型：复制可变列表，共享不可变列名</title><desc id="desc">箭头表示持有引用；副本使用新列表，String 值可以安全共享。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker></defs><style>text{font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#172033}.title{font-size:27px;font-weight:700}.sub{font-size:16px;fill:#526173}.h{font-size:19px;font-weight:700}.t{font-size:16px}.small{font-size:14px;fill:#526173}.box{fill:#fff;stroke:#b8c8d7;stroke-width:1.5}.accent{fill:#e9f7f4;stroke:#339786;stroke-width:1.5}.warn{fill:#fff2eb;stroke:#d28a66;stroke-width:1.5}.line{fill:none;stroke:#64748b;stroke-width:1.7;marker-end:url(#arrow)}.rule{stroke:#d4dee7;stroke-width:1}</style><rect width="1120" height="465" fill="#f8fafc"/><text class="title" x="40" y="52">原型：复制可变列表，共享不可变列名</text><text class="sub" x="40" y="84">箭头表示持有引用；副本使用新列表，String 值可以安全共享。</text><path class="line" d="M300 185H400"/><path class="line" d="M300 345H400"/><path class="line" d="M660 185H730V245H810"/><path class="line" d="M660 345H730V290H810"/><rect class="box" x="40" y="140" width="260" height="90" rx="6"/><text class="h" x="60" y="172">原模板：订单基础</text><text class="t" x="60" y="201">name 独立</text><rect class="box" x="40" y="300" width="260" height="90" rx="6"/><text class="h" x="60" y="332">副本：订单物流</text><text class="t" x="60" y="361">新名称 / 新对象</text><rect class="box" x="400" y="140" width="260" height="90" rx="6"/><text class="h" x="420" y="172">原列表</text><text class="t" x="420" y="201">订单号 / 金额</text><rect class="accent" x="400" y="300" width="260" height="90" rx="6"/><text class="h" x="420" y="332">副本列表</text><text class="t" x="420" y="361">可独立增加物流单号</text><rect class="box" x="810" y="205" width="270" height="125" rx="6"/><text class="h" x="830" y="237">不可变 String</text><text class="t" x="830" y="266">订单号 / 金额</text><text class="t" x="830" y="292">不需要逐个克隆</text><text class="sub" x="40" y="438">若列元素是可变对象，仅新建列表仍不够；身份、任务状态和外部句柄不能盲目复制。</text></svg>
