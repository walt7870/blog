<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="490" viewBox="0 0 1120 490" role="img" aria-labelledby="title desc">
<title id="title">保护代理：每次访问判断当前授权</title><desc id="desc">可信Session作为每次read的参数进入ProtectedReader。policy.allowed通过后才访问目标；没有授权则抛出SecurityException。本例不包含缓存。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker></defs><style>text{font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#172033}.title{font-size:27px;font-weight:700}.sub{font-size:16px;fill:#526173}.h{font-size:19px;font-weight:700}.t{font-size:16px}.box{fill:#fff;stroke:#b8c8d7;stroke-width:1.5}.accent{fill:#e9f7f4;stroke:#339786;stroke-width:1.5}.line{fill:none;stroke:#64748b;stroke-width:1.7;marker-end:url(#arrow)}.type{stroke-dasharray:5 4}</style>
<rect width="1120" height="490" fill="#f8fafc"/><text class="title" x="40" y="52">保护代理：每次访问判断当前授权</text><text class="sub" x="40" y="84">ProtectedReader 与目标均实现 ReportReader；箭头表示一次 read() 的处理流程。</text>
<path class="line" d="M240 207H310"/><path class="line" d="M560 207H600"/><path class="line" d="M800 207H890"/><path class="line" d="M700 274V350"/>
<text class="t" x="827" y="185">允许</text><text class="t" x="720" y="320">拒绝</text>
<rect class="box" x="40" y="160" width="200" height="95" rx="6"/><text class="h" x="60" y="195">调用方</text><text class="t" x="60" y="225">可信身份 + 报告号</text>
<rect class="box" x="310" y="160" width="250" height="95" rx="6"/><text class="h" x="330" y="195">ProtectedReader</text><text class="t" x="330" y="225">不保存 currentUser</text>
<path class="accent" d="M700 140L800 207L700 274L600 207Z"/><text class="h" x="655" y="202">当前授权</text><text class="t" x="642" y="228">policy.allowed</text>
<rect class="box" x="890" y="160" width="190" height="95" rx="6"/><text class="h" x="910" y="195">目标读取</text><text class="t" x="910" y="225">按租户与编号查找</text>
<rect class="box" x="570" y="350" width="260" height="75" rx="6"/><text class="h" x="590" y="381">SecurityException</text><text class="t" x="590" y="409">不得访问目标</text>
<text class="sub" x="40" y="461">撤销后下一次判断应拒绝；已通过检查的在途请求需要另定合同。本例未加入缓存。</text>
</svg>
