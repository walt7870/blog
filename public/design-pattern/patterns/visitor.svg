<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="550" viewBox="0 0 1040 550" role="img" aria-labelledby="title desc">
<title id="title">文档元素通过accept分派到具体访问操作</title>
<desc id="desc">调用方持有Block类型的Text对象，先动态分派到Text.accept，再在Text内选择visit(Text)，执行PlainText访问者，返回纯文本。换Statistics可以执行统计操作。</desc>
<defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 7 3.5 0 7Z" fill="#64748b"/></marker></defs>
<style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#24343d}.title{font-size:23px;font-weight:700}.name{font-size:18px;font-weight:600}.sub{font-size:15px;fill:#52636d}.box{fill:#fff;stroke:#b8c5cb;stroke-width:1.3}.focus{fill:#eaf6f1;stroke:#609789;stroke-width:1.5}.call{fill:none;stroke:#64748b;stroke-width:1.4;marker-end:url(#arrow)}.life{stroke:#b8c5cb;stroke-dasharray:5 5;stroke-width:1.2}.mask{fill:#f8fafb}</style>
<rect width="1040" height="550" fill="#f8fafb"/>
<text class="title" x="38" y="44">访问者：先选具体元素，再执行具体操作</text>
<text class="sub" x="38" y="73">例：Block block = new Text("订单说明")；visitor = new PlainText()。</text>
<path class="life" d="M150 155 V452 M490 155 V452 M880 155 V452"/>
<rect x="486" y="200" width="8" height="230" fill="#e6ecef" stroke="#9cabb2"/>
<rect x="876" y="282" width="8" height="84" fill="#e6ecef" stroke="#9cabb2"/>
<path class="call" d="M150 200 H484"/>
<rect class="mask" x="215" y="166" width="222" height="24"/><text class="sub" x="225" y="184">1. block.accept(visitor)</text>
<path class="call" d="M494 282 H874"/>
<rect class="mask" x="572" y="248" width="235" height="24"/><text class="sub" x="582" y="266">2. visitor.visit(this: Text)</text>
<path class="call" stroke-dasharray="5 4" d="M876 366 H496"/>
<rect class="mask" x="627" y="332" width="156" height="24"/><text class="sub" x="637" y="350">3. 返回 text.content</text>
<path class="call" stroke-dasharray="5 4" d="M486 430 H152"/>
<rect class="mask" x="220" y="396" width="180" height="24"/><text class="sub" x="230" y="414">4. 返回“订单说明”</text>
<rect class="box" x="55" y="101" width="190" height="54" rx="6"/><text class="name" x="75" y="135">调用方：export</text>
<rect class="focus" x="383" y="101" width="214" height="54" rx="6"/><text class="name" x="403" y="135">元素：Text.accept</text>
<rect class="box" x="773" y="101" width="214" height="54" rx="6"/><text class="name" x="793" y="135">操作：PlainText</text>
<text class="sub" x="38" y="491">换成 Statistics：Text 返回码点数，Image 返回图片计数；元素无需增加统计方法。</text>
<text class="sub" x="38" y="520">增加元素类型则需要更新访问者接口及各实现；遍历顺序由外层负责。</text>
</svg>
