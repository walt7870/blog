<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="435" viewBox="0 0 1120 435" role="img" aria-labelledby="title desc">
<title id="title">装饰器：字节沿同接口包装链向内写入</title><desc id="desc">调用方依次经过BufferedOutputStream、GZIPOutputStream写入ByteArrayOutputStream。关闭最外层会刷新缓冲、完成GZIP尾部并关闭底层流。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker></defs><style>text{font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#172033}.title{font-size:27px;font-weight:700}.sub{font-size:16px;fill:#526173}.h{font-size:19px;font-weight:700}.t{font-size:16px}.box{fill:#fff;stroke:#b8c8d7;stroke-width:1.5}.accent{fill:#e9f7f4;stroke:#339786;stroke-width:1.5}.line{fill:none;stroke:#64748b;stroke-width:1.7;marker-end:url(#arrow)}.type{stroke-dasharray:5 4}</style>
<rect width="1120" height="435" fill="#f8fafc"/><text class="title" x="40" y="52">装饰器：字节沿同接口包装链向内写入</text><text class="sub" x="40" y="84">调用方使用 OutputStream；实线表示 write() 的委托与字节流向。</text>
<path class="line" d="M215 195H275"/><path class="line" d="M515 195H575"/><path class="line" d="M815 195H875"/>
<rect class="box" x="40" y="145" width="175" height="100" rx="6"/><text class="h" x="60" y="180">UTF-8 字节</text><text class="t" x="60" y="210">导出内容</text>
<rect class="accent" x="275" y="145" width="240" height="100" rx="6"/><text class="h" x="295" y="180">BufferedOutputStream</text><text class="t" x="295" y="210">缓冲小批写入</text>
<rect class="box" x="575" y="145" width="240" height="100" rx="6"/><text class="h" x="595" y="180">GZIPOutputStream</text><text class="t" x="595" y="210">生成 GZIP 格式</text>
<rect class="box" x="875" y="145" width="205" height="100" rx="6"/><text class="h" x="895" y="180">内存存储流</text><text class="t" x="895" y="210">压缩后的字节</text>
<text class="h" x="40" y="311">关闭最外层</text><text class="t" x="40" y="341">刷新缓冲 → 完成压缩尾部 → 关闭底层流</text>
<text class="h" x="650" y="311">往返验证</text><text class="t" x="650" y="341">GZIP 解压后逐字节比较原文</text>
<text class="sub" x="40" y="404">flush() 不等于压缩完成；只有确定关闭责任后，才能把调用方提供的流交给包装链管理。</text>
</svg>
