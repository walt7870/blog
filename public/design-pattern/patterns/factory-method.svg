<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="460" viewBox="0 0 1120 460" role="img" aria-labelledby="title desc"><title id="title">工厂方法：具体创建者决定产品实现</title><desc id="desc">箭头表示执行时的创建选择链；两条分支由启动装配选择，产品能力统一为 Logger。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker></defs><style>text{font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#172033}.title{font-size:27px;font-weight:700}.sub{font-size:16px;fill:#526173}.h{font-size:19px;font-weight:700}.t{font-size:16px}.small{font-size:14px;fill:#526173}.box{fill:#fff;stroke:#b8c8d7;stroke-width:1.5}.accent{fill:#e9f7f4;stroke:#339786;stroke-width:1.5}.warn{fill:#fff2eb;stroke:#d28a66;stroke-width:1.5}.line{fill:none;stroke:#64748b;stroke-width:1.7;marker-end:url(#arrow)}.rule{stroke:#d4dee7;stroke-width:1}</style><rect width="1120" height="460" fill="#f8fafc"/><text class="title" x="40" y="52">工厂方法：具体创建者决定产品实现</text><text class="sub" x="40" y="84">箭头表示执行时的创建选择链；两条分支由启动装配选择，产品能力统一为 Logger。</text><path class="line" d="M250 255H300"/><path class="line" d="M550 255H580V175H610"/><path class="line" d="M550 255H580V335H610"/><path class="line" d="M840 175H890"/><path class="line" d="M840 335H890"/><rect class="box" x="40" y="200" width="210" height="110" rx="6"/><text class="h" x="60" y="232">LogJob.execute</text><text class="t" x="60" y="261">调用工厂方法</text><text class="t" x="60" y="287">取得产品后 log</text><rect class="accent" x="300" y="200" width="250" height="110" rx="6"/><text class="h" x="320" y="232">createLogger()</text><text class="t" x="320" y="261">抽象创建操作</text><text class="t" x="320" y="287">由具体创建者覆盖</text><rect class="box" x="610" y="130" width="230" height="90" rx="6"/><text class="h" x="630" y="162">ConsoleLogJob</text><text class="t" x="630" y="191">创建控制台记录器</text><rect class="box" x="610" y="290" width="230" height="90" rx="6"/><text class="h" x="630" y="322">MemoryLogJob</text><text class="t" x="630" y="351">创建内存记录器</text><rect class="box" x="890" y="130" width="190" height="90" rx="6"/><text class="h" x="910" y="162">ConsoleLogger</text><text class="t" x="910" y="191">输出到控制台</text><rect class="box" x="890" y="290" width="190" height="90" rx="6"/><text class="h" x="910" y="322">MemoryLogger</text><text class="t" x="910" y="351">记录在内存中</text><text class="sub" x="40" y="423">新增创建者后仍需装配；本例每次创建新产品，真实资源产品必须约定关闭责任。</text></svg>
