<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="510" viewBox="0 0 1120 510" role="img" aria-labelledby="title desc">
<title id="title">模板方法：固定报表顺序，子类只生成内容</title><desc id="desc">父类generate固定校验快照、打开输出、调用子类render、关闭输出的顺序。明细与汇总实现render。生成失败仍关闭，关闭成功后才返回；两者同时失败保留主异常及suppressed异常。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker></defs>
<style>text{font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#172033}.title{font-size:27px;font-weight:700}.sub{font-size:16px;fill:#526173}.h{font-size:19px;font-weight:700}.t{font-size:16px}.box{fill:#fff;stroke:#b8c8d7;stroke-width:1.5}.accent{fill:#e9f7f4;stroke:#339786;stroke-width:1.5}.line{fill:none;stroke:#64748b;stroke-width:1.7;marker-end:url(#arrow)}.impl{stroke-dasharray:5 4}</style>
<rect width="1120" height="510" fill="#f8fafc"/><text class="title" x="40" y="52">模板方法：固定报表顺序，子类只生成内容</text><text class="sub" x="40" y="84">实线：父类 generate() 的调用顺序；虚线：子类实现 render() 扩展点。</text>
<path class="line" d="M250 190H310"/><path class="line" d="M510 190H570"/><path class="line" d="M790 190H850"/>
<path class="line impl" d="M610 330V235"/><path class="line impl" d="M750 330V235"/>
<text class="sub" x="594" y="292">实现</text><text class="sub" x="749" y="292">实现</text>
<rect class="box" x="40" y="145" width="210" height="90" rx="6"/><text class="h" x="60" y="180">1. 校验与快照</text><text class="t" x="60" y="210">非法输入不打开输出</text>
<rect class="box" x="310" y="145" width="200" height="90" rx="6"/><text class="h" x="330" y="180">2. 打开输出</text><text class="t" x="330" y="210">模板取得关闭权</text>
<rect class="accent" x="570" y="145" width="220" height="90" rx="6"/><text class="h" x="590" y="180">3. render()</text><text class="t" x="590" y="210">子类只写入内容</text>
<rect class="box" x="850" y="145" width="230" height="90" rx="6"/><text class="h" x="870" y="180">4. 关闭输出</text><text class="t" x="870" y="210">成功后才返回行数</text>
<rect class="box" x="480" y="330" width="190" height="75" rx="6"/><text class="h" x="500" y="362">明细报表</text><text class="t" x="500" y="388">逐行写订单与金额</text>
<rect class="box" x="710" y="330" width="190" height="75" rx="6"/><text class="h" x="730" y="362">汇总报表</text><text class="t" x="730" y="388">订单数与金额合计</text>
<text class="sub" x="40" y="462">生成抛异常仍关闭输出；生成与关闭同时失败，保留主异常及 suppressed 异常。</text>
<text class="sub" x="40" y="488">关闭不代表持久化或远端发布成功；失败可能已写出部分内容。</text>
</svg>
