<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="480" viewBox="0 0 1120 480" role="img" aria-labelledby="title desc">
<title id="title">外观：集中协调入口，各组件保留规则</title><desc id="desc">客户端调用ReportFacade.create，依次完成Validator校验、TextRenderer生成和Storage保存；只有保存成功返回有效引用后，才能返回READY。连线是调用关系，非事务边界。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker></defs><style>text{font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#172033}.title{font-size:27px;font-weight:700}.sub{font-size:16px;fill:#526173}.h{font-size:19px;font-weight:700}.t{font-size:16px}.box{fill:#fff;stroke:#b8c8d7;stroke-width:1.5}.accent{fill:#e9f7f4;stroke:#339786;stroke-width:1.5}.line{fill:none;stroke:#64748b;stroke-width:1.7;marker-end:url(#arrow)}.type{stroke-dasharray:5 4}</style>
<rect width="1120" height="480" fill="#f8fafc"/><text class="title" x="40" y="52">外观：集中协调入口，各组件保留规则</text><text class="sub" x="40" y="84">ReportFacade.create() 统一用例入口；编号表示调用顺序，不表示跨组件原子事务。</text>
<path class="line" d="M260 235H395"/>
<path class="line" d="M675 205H735V170H820"/><path class="line" d="M675 235H820"/><path class="line" d="M675 265H735V310H820"/>
<rect class="box" x="40" y="185" width="220" height="100" rx="6"/><text class="h" x="60" y="220">调用方</text><text class="t" x="60" y="250">请求生成导出摘要</text>
<rect class="accent" x="395" y="175" width="280" height="120" rx="6"/><text class="h" x="415" y="212">ReportFacade</text><text class="t" x="415" y="242">create(request)</text><text class="t" x="415" y="272">协调顺序与结果合同</text>
<rect class="box" x="820" y="135" width="260" height="70" rx="6"/><text class="h" x="840" y="165">1. Validator</text><text class="t" x="840" y="191">非法参数在此拒绝</text>
<rect class="box" x="820" y="215" width="260" height="70" rx="6"/><text class="h" x="840" y="245">2. TextRenderer</text><text class="t" x="840" y="271">生成 UTF-8 内容</text>
<rect class="box" x="820" y="295" width="260" height="70" rx="6"/><text class="h" x="840" y="325">3. Storage</text><text class="t" x="840" y="351">保存并返回有效引用</text>
<text class="h" x="40" y="382">成功回执：READY + 引用</text><text class="t" x="40" y="412">只在全部同步步骤成功后返回；异步用例应返回待处理任务号。</text>
<text class="sub" x="40" y="456">保存失败不能返回成功；部分写入、结果未知和恢复仍须由存储合同定义。</text>
</svg>
