<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="440" viewBox="0 0 1120 440" role="img" aria-labelledby="title desc"><title id="title">单例：唯一性有范围，初始化与使用要分别判断</title><desc id="desc">Java 静态实例以定义该类的类加载器为边界；多个进程不会自动共享。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker></defs><style>text{font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#172033}.title{font-size:27px;font-weight:700}.sub{font-size:16px;fill:#526173}.h{font-size:19px;font-weight:700}.t{font-size:16px}.small{font-size:14px;fill:#526173}.box{fill:#fff;stroke:#b8c8d7;stroke-width:1.5}.accent{fill:#e9f7f4;stroke:#339786;stroke-width:1.5}.warn{fill:#fff2eb;stroke:#d28a66;stroke-width:1.5}.line{fill:none;stroke:#64748b;stroke-width:1.7;marker-end:url(#arrow)}.rule{stroke:#d4dee7;stroke-width:1}</style><rect width="1120" height="440" fill="#f8fafc"/><text class="title" x="40" y="52">单例：唯一性有范围，初始化与使用要分别判断</text><text class="sub" x="40" y="84">Java 静态实例以定义该类的类加载器为边界；多个进程不会自动共享。</text><rect x="40" y="115" width="1040" height="225" rx="6" fill="none" stroke="#b8c8d7" stroke-dasharray="6 4"/><text class="small" x="60" y="145">同一类加载器中的 Holder 访问范围</text><path class="line" d="M310 235H400"/><path class="line" d="M720 235H800"/><rect class="box" x="80" y="185" width="230" height="110" rx="6"/><text class="h" x="100" y="217">多个调用方</text><text class="t" x="100" y="246">getInstance()</text><rect class="accent" x="400" y="185" width="320" height="110" rx="6"/><text class="h" x="420" y="217">Holder.INSTANCE</text><text class="t" x="420" y="246">类初始化时创建并发布</text><rect class="box" x="800" y="185" width="240" height="110" rx="6"/><text class="h" x="820" y="217">同一对象引用</text><text class="t" x="820" y="246">可变字段仍需保护</text><text class="sub" x="40" y="385">另一个类加载器或进程可以有另一份实例；集群唯一需要额外协调。</text><text class="sub" x="40" y="417">连接池等外部资源还必须约定关闭、失败恢复与配置更新。</text></svg>
