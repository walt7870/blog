<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="490" viewBox="0 0 1120 490" role="img" aria-labelledby="title desc">
<title id="title">桥接：通知形式与发送渠道独立扩展</title><desc id="desc">摘要与完整通知继承Notice；Notice持有Channel并向其提交内容。邮件与站内信实现Channel。实线为调用，虚线为声明的继承或实现关系。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker></defs><style>text{font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#172033}.title{font-size:27px;font-weight:700}.sub{font-size:16px;fill:#526173}.h{font-size:19px;font-weight:700}.t{font-size:16px}.box{fill:#fff;stroke:#b8c8d7;stroke-width:1.5}.accent{fill:#e9f7f4;stroke:#339786;stroke-width:1.5}.line{fill:none;stroke:#64748b;stroke-width:1.7;marker-end:url(#arrow)}.type{stroke-dasharray:5 4}</style>
<rect width="1120" height="490" fill="#f8fafc"/><text class="title" x="40" y="52">桥接：通知形式与发送渠道独立扩展</text><text class="sub" x="40" y="84">实线：运行调用；虚线：继承 / 实现方向。此图不使用 UML 专用箭头。</text>
<path class="line" d="M450 190H670"/>
<path class="line type" d="M150 320V280H215V235"/><path class="line type" d="M380 320V280H310V235"/>
<path class="line type" d="M740 320V280H805V235"/><path class="line type" d="M970 320V280H900V235"/>
<text class="sub" x="484" y="154">持有 Channel</text><text class="sub" x="482" y="220">submit() 委托</text>
<rect class="accent" x="80" y="140" width="370" height="95" rx="6"/><text class="h" x="100" y="175">Notice：通知抽象</text><text class="t" x="100" y="205">固定发送步骤，允许 format() 扩展</text>
<rect class="box" x="670" y="140" width="370" height="95" rx="6"/><text class="h" x="690" y="175">Channel：渠道接口</text><text class="t" x="690" y="205">submit(recipient, content)</text>
<rect class="box" x="40" y="320" width="220" height="85" rx="6"/><text class="h" x="60" y="354">SummaryNotice</text><text class="t" x="60" y="381">订单号与完成提示</text>
<rect class="box" x="280" y="320" width="220" height="85" rx="6"/><text class="h" x="300" y="354">FullNotice</text><text class="t" x="300" y="381">订单号与导出行数</text>
<rect class="box" x="630" y="320" width="220" height="85" rx="6"/><text class="h" x="650" y="354">MailChannel</text><text class="t" x="650" y="381">邮件提交入口</text>
<rect class="box" x="870" y="320" width="220" height="85" rx="6"/><text class="h" x="890" y="354">InboxChannel</text><text class="t" x="890" y="381">站内信提交入口</text>
<text class="sub" x="40" y="458">两种形式 × 两种渠道；允许的组合须满足能力合同，桥接不会自动解决送达、重试与并发。</text>
</svg>
