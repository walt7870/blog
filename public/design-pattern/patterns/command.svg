<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="510" viewBox="0 0 1120 510" role="img" aria-labelledby="title desc">
<title id="title">命令：请求可复用，历史逐次保存</title><desc id="desc">按钮向Editor提交Replace命令，执行得到新内容后记录Entry，包括命令、执行前和执行后的文本。重复命令拥有独立记录，撤销回到该次before，重做恢复after。失败不入历史，新编辑清空重做。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker></defs><style>text{font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#172033}.title{font-size:27px;font-weight:700}.sub{font-size:16px;fill:#526173}.h{font-size:19px;font-weight:700}.t{font-size:16px}.box{fill:#fff;stroke:#b8c8d7;stroke-width:1.5}.accent{fill:#e9f7f4;stroke:#339786;stroke-width:1.5}.line{fill:none;stroke:#64748b;stroke-width:1.7;marker-end:url(#arrow)}</style>
<rect width="1120" height="510" fill="#f8fafc"/><text class="title" x="40" y="52">命令：请求可复用，历史逐次保存</text><text class="sub" x="40" y="84">单线程内存编辑；命令仅描述修改，每次执行的前后状态保存在独立 Entry 中。</text>
<path class="line" d="M220 190H280"/><path class="line" d="M520 190H590"/><path class="line" d="M800 190H860"/>
<rect class="box" x="40" y="145" width="180" height="100" rx="6"/><text class="h" x="60" y="181">按钮 / 菜单</text><text class="t" x="60" y="213">提交编辑请求</text>
<rect class="box" x="280" y="145" width="240" height="100" rx="6"/><text class="h" x="300" y="181">Editor</text><text class="t" x="300" y="213">控制执行与两条历史栈</text>
<rect class="box" x="590" y="145" width="210" height="100" rx="6"/><text class="h" x="610" y="181">Replace.apply()</text><text class="t" x="610" y="213">先校验，再计算新文本</text>
<rect class="accent" x="860" y="145" width="220" height="100" rx="6"/><text class="h" x="880" y="181">成功后记录 Entry</text><text class="t" x="880" y="213">command / before / after</text>
<text class="h" x="40" y="316">同一插入命令执行两次</text><text class="t" x="40" y="350">第 1 次：ABCD → AB,CD</text><text class="t" x="40" y="382">第 2 次：AB,CD → AB,,CD</text>
<text class="h" x="590" y="316">恢复对应的那一次状态</text><text class="t" x="590" y="350">撤销第 2 次：回到 AB,CD</text><text class="t" x="590" y="382">重做第 2 次：恢复 AB,,CD</text>
<text class="sub" x="40" y="462">非法编辑不进入历史；新编辑清空旧重做分支；历史容量有界。</text><text class="sub" x="40" y="488">快照恢复只覆盖本地文本，不等同数据库事务回滚或外部退款。</text>
</svg>
