<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="445" viewBox="0 0 1120 445" role="img" aria-labelledby="title desc"><title id="title">建造者：暂存配置，校验后交付快照</title><desc id="desc">示例使用链式建造者；record 本身不会使集合不可变，构造边界需要防御性复制。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker></defs><style>text{font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#172033}.title{font-size:27px;font-weight:700}.sub{font-size:16px;fill:#526173}.h{font-size:19px;font-weight:700}.t{font-size:16px}.small{font-size:14px;fill:#526173}.box{fill:#fff;stroke:#b8c8d7;stroke-width:1.5}.accent{fill:#e9f7f4;stroke:#339786;stroke-width:1.5}.warn{fill:#fff2eb;stroke:#d28a66;stroke-width:1.5}.line{fill:none;stroke:#64748b;stroke-width:1.7;marker-end:url(#arrow)}.rule{stroke:#d4dee7;stroke-width:1}</style><rect width="1120" height="445" fill="#f8fafc"/><text class="title" x="40" y="52">建造者：暂存配置，校验后交付快照</text><text class="sub" x="40" y="84">示例使用链式建造者；record 本身不会使集合不可变，构造边界需要防御性复制。</text><path class="line" d="M310 230H390"/><path class="line" d="M710 230H800"/><rect class="box" x="40" y="160" width="270" height="140" rx="6"/><text class="h" x="60" y="192">ExportBuilder</text><text class="t" x="60" y="221">日期 / 列 / 格式 / 分页</text><text class="t" x="60" y="247">可变且不跨请求共享</text><rect class="accent" x="390" y="145" width="320" height="170" rx="6"/><text class="h" x="410" y="177">build → ExportSpec</text><text class="t" x="410" y="206">产品构造器检查组合约束</text><text class="t" x="410" y="232">List.copyOf 复制列列表</text><text class="t" x="410" y="258">非法输入立即拒绝</text><rect class="box" x="800" y="160" width="280" height="140" rx="6"/><text class="h" x="820" y="192">ExportSpec 快照</text><text class="t" x="820" y="221">合法参数与只读列表</text><text class="t" x="820" y="247">后续 builder 修改不影响</text><text class="sub" x="40" y="375">重复构建：第一次两列，增加物流单号后第二次三列；第一次仍保持两列。</text><text class="sub" x="40" y="412">若元素本身可变，还需元素级复制；构建完成不等于已通过业务授权。</text></svg>
