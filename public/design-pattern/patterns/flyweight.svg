<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="480" viewBox="0 0 1120 480" role="img" aria-labelledby="title desc">
<title id="title">享元：样式共享，行号与内容独立保存</title><desc id="desc">有界StyleFactory按TEXT和AMOUNT缓存两种不可变ColumnStyle。三个Cell分别持有样式引用，两个文本单元格共用一个样式，但各自保存行号和值。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker></defs><style>text{font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#172033}.title{font-size:27px;font-weight:700}.sub{font-size:16px;fill:#526173}.h{font-size:19px;font-weight:700}.t{font-size:16px}.box{fill:#fff;stroke:#b8c8d7;stroke-width:1.5}.accent{fill:#e9f7f4;stroke:#339786;stroke-width:1.5}.line{fill:none;stroke:#64748b;stroke-width:1.7;marker-end:url(#arrow)}.type{stroke-dasharray:5 4}</style>
<rect width="1120" height="480" fill="#f8fafc"/><text class="title" x="40" y="52">享元：样式共享，行号与内容独立保存</text><text class="sub" x="40" y="84">箭头表示持有引用；内部状态在 ColumnStyle，外部状态在各自 Cell。</text>
<path class="line" d="M300 245H350V225H420"/><path class="line" d="M300 340H330V385H420"/>
<path class="line" d="M820 165H760V210H680"/><path class="line" d="M820 265H740V250H680"/><path class="line" d="M820 385H680"/>
<rect class="box" x="40" y="210" width="260" height="170" rx="6"/><text class="h" x="60" y="245">StyleFactory</text><text class="t" x="60" y="277">TEXT / AMOUNT 两种键</text><text class="t" x="60" y="307">最多保留两个样式</text><text class="t" x="60" y="337">并发按键查找</text>
<rect class="accent" x="420" y="175" width="260" height="110" rx="6"/><text class="h" x="440" y="210">TEXT 样式</text><text class="t" x="440" y="240">默认字体 / 12 / 左对齐</text><text class="t" x="440" y="266">不可变，可同时共享</text>
<rect class="box" x="420" y="340" width="260" height="90" rx="6"/><text class="h" x="440" y="375">AMOUNT 样式</text><text class="t" x="440" y="405">默认字体 / 12 / 右对齐</text>
<rect class="box" x="820" y="130" width="260" height="70" rx="6"/><text class="h" x="840" y="160">Cell 1</text><text class="t" x="840" y="186">第 1 行 / O-1001</text>
<rect class="box" x="820" y="230" width="260" height="70" rx="6"/><text class="h" x="840" y="260">Cell 2</text><text class="t" x="840" y="286">第 2 行 / O-1002</text>
<rect class="box" x="820" y="350" width="260" height="70" rx="6"/><text class="h" x="840" y="380">Cell 3</text><text class="t" x="840" y="406">第 1 行 / 88.00</text>
<text class="sub" x="40" y="462">减少的是重复样式；单元格对象和工厂仍有开销，不能把对象数量比例当成内存节省率。</text>
</svg>
