<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="440" viewBox="0 0 1120 440" role="img" aria-labelledby="title desc">
<title id="title">适配器：在边界转换参数与状态</title><desc id="desc">业务通过NotificationPort调用MailAdapter，适配器持有LegacyMailSdk。202映射受理回执，429和其他失败分别显式抛出异常。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker></defs><style>text{font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#172033}.title{font-size:27px;font-weight:700}.sub{font-size:16px;fill:#526173}.h{font-size:19px;font-weight:700}.t{font-size:16px}.box{fill:#fff;stroke:#b8c8d7;stroke-width:1.5}.accent{fill:#e9f7f4;stroke:#339786;stroke-width:1.5}.line{fill:none;stroke:#64748b;stroke-width:1.7;marker-end:url(#arrow)}.type{stroke-dasharray:5 4}</style>
<rect width="1120" height="440" fill="#f8fafc"/><text class="title" x="40" y="52">适配器：在边界转换参数与状态</text><text class="sub" x="40" y="84">对象适配：实现内部接口，持有旧 SDK；箭头表示运行时调用方向。</text>
<path class="line" d="M290 190H415"/><path class="line" d="M705 190H830"/>
<text class="sub" x="310" y="155">submit()</text><text class="sub" x="735" y="155">push()</text>
<rect class="box" x="40" y="140" width="250" height="100" rx="6"/><text class="h" x="60" y="175">订单导出业务</text><text class="t" x="60" y="204">只依赖 NotificationPort</text>
<rect class="accent" x="415" y="140" width="290" height="100" rx="6"/><text class="h" x="435" y="175">MailAdapter</text><text class="t" x="435" y="204">实现 NotificationPort</text><text class="t" x="435" y="227">持有 LegacyMailSdk</text>
<rect class="box" x="830" y="140" width="250" height="100" rx="6"/><text class="h" x="850" y="175">LegacyMailSdk</text><text class="t" x="850" y="204">厂商模板、字段、状态码</text>
<text class="h" x="40" y="302">202 + 有效编号</text><text class="t" x="40" y="334">返回 Receipt：仅表示受理</text>
<text class="h" x="415" y="302">429 明确限流</text><text class="t" x="415" y="334">抛 RateLimited，由上层处理</text>
<text class="h" x="830" y="302">失败 / 无效回执</text><text class="t" x="830" y="334">抛 VendorFailure</text>
<text class="sub" x="40" y="406">调用超时可能结果未知；重试需要幂等或查询合同，不能把未知结果转换成成功。</text>
</svg>
