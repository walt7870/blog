<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="510" viewBox="0 0 1120 510" role="img" aria-labelledby="title desc"><title id="title">备忘录：对象保存内部状态，管理者只持有句柄</title><desc id="desc">Draft.save创建私有Saved快照，包含对象归属和不可变State。CheckpointStore使用稳定编号保存有界强引用。取出句柄交回Draft.restore，验证对象归属和当前版本后恢复内容，版本递增。管理者不读内部字段。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker></defs><style>text{font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#172033}.title{font-size:27px;font-weight:700}.sub{font-size:16px;fill:#526173}.h{font-size:19px;font-weight:700}.t{font-size:16px}.box{fill:#fff;stroke:#b8c8d7;stroke-width:1.5}.accent{fill:#e9f7f4;stroke:#339786;stroke-width:1.5}.line{fill:none;stroke:#64748b;stroke-width:1.7;marker-end:url(#arrow)}.back{stroke-dasharray:5 4}</style>
<rect width="1120" height="510" fill="#f8fafc"/><text class="title" x="40" y="52">备忘录：对象保存内部状态，管理者只持有句柄</text><text class="sub" x="40" y="84">实线：创建与保存；虚线：按编号取句柄后交回原对象恢复。快照不负责撤回外部邮件。</text>
<path class="line" d="M330 210H450"/><path class="line" d="M670 210H770"/>
<path class="line back" d="M925 280V360Q925 370 915 370H195Q185 370 185 360V280"/>
<text class="t" x="362" y="188">save()</text><text class="t" x="691" y="188">add()</text>
<rect class="accent" x="40" y="140" width="290" height="140" rx="6"/><text class="h" x="60" y="178">Draft：发起人</text><text class="t" x="60" y="213">标题 / 收件人 / 当前版本</text><text class="t" x="60" y="247">负责创建与解释快照</text>
<rect class="box" x="450" y="140" width="220" height="140" rx="6"/><text class="h" x="470" y="178">Saved：私有快照</text><text class="t" x="470" y="213">owner + 不可变 State</text><text class="t" x="470" y="247">对外仅为 Checkpoint</text>
<rect class="box" x="770" y="140" width="310" height="140" rx="6"/><text class="h" x="790" y="178">CheckpointStore：管理者</text><text class="t" x="790" y="213">稳定编号 → 检查点句柄</text><text class="t" x="790" y="247">容量有界，不读内部字段</text>
<text class="t" x="288" y="405">get(id) 后调用 restore(checkpoint, expectedVersion)</text>
<text class="sub" x="40" y="462">归属或当前版本不符则拒绝；恢复旧内容仍生成新版本，不倒退版本号。</text><text class="sub" x="40" y="488">已淘汰编号明确报错；本例仅在进程内有效，没有磁盘存档或跨重启加载。</text>
</svg>
