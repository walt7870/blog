<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="510" viewBox="0 0 1120 510" role="img" aria-labelledby="title desc">
<title id="title">组合：文件与目录统一统计，容器递归求和</title><desc id="desc">导出目录包含文档与媒体。文档包含100字节订单文件，媒体包含2000字节图片和5000字节视频，总计7100字节。连线表示包含关系。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker></defs><style>text{font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#172033}.title{font-size:27px;font-weight:700}.sub{font-size:16px;fill:#526173}.h{font-size:19px;font-weight:700}.t{font-size:16px}.box{fill:#fff;stroke:#b8c8d7;stroke-width:1.5}.accent{fill:#e9f7f4;stroke:#339786;stroke-width:1.5}.line{fill:none;stroke:#64748b;stroke-width:1.7;marker-end:url(#arrow)}.type{stroke-dasharray:5 4}</style>
<rect width="1120" height="510" fill="#f8fafc"/><text class="title" x="40" y="52">组合：文件与目录统一统计，容器递归求和</text><text class="sub" x="40" y="84">Folder 与 FileLeaf 都实现 Node.bytes()；连线表示目录包含子项，不是类继承。</text>
<path class="line" style="marker-end:none" d="M560 202V221H260V245M560 221H850V245"/>
<path class="line" style="marker-end:none" d="M260 315V370M850 315V340H680V370M850 340H1000V370"/>
<rect class="accent" x="425" y="120" width="270" height="82" rx="6"/><text class="h" x="445" y="153">导出 / Folder</text><text class="t" x="445" y="181">bytes() = 7100</text>
<rect class="box" x="135" y="245" width="250" height="70" rx="6"/><text class="h" x="155" y="274">文档 / Folder</text><text class="t" x="155" y="300">100 字节</text>
<rect class="box" x="725" y="245" width="250" height="70" rx="6"/><text class="h" x="745" y="274">媒体 / Folder</text><text class="t" x="745" y="300">7000 字节</text>
<rect class="box" x="135" y="370" width="250" height="70" rx="6"/><text class="h" x="155" y="399">订单.csv / FileLeaf</text><text class="t" x="155" y="425">100 字节</text>
<rect class="box" x="555" y="370" width="250" height="70" rx="6"/><text class="h" x="575" y="399">图片.png / FileLeaf</text><text class="t" x="575" y="425">2000 字节</text>
<rect class="box" x="845" y="370" width="250" height="70" rx="6"/><text class="h" x="865" y="399">视频.mp4 / FileLeaf</text><text class="t" x="865" y="425">5000 字节</text>
<text class="sub" x="40" y="486">这里只统计逻辑条目；同一节点出现两次就累计两次，实际磁盘占用须另行定义去重与链接语义。</text>
</svg>
