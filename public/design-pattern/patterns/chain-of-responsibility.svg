<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="510" viewBox="0 0 1120 510" role="img" aria-labelledby="title desc">
<title id="title">责任链：继续、短路与后置收尾</title><desc id="desc">追踪层调用权限与参数过滤器，通过后进入业务。任一过滤器拒绝则不继续；返回或异常沿调用栈退出，追踪层finally收尾。每个请求有独立推进索引。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker></defs><style>text{font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#172033}.title{font-size:27px;font-weight:700}.sub{font-size:16px;fill:#526173}.h{font-size:19px;font-weight:700}.t{font-size:16px}.box{fill:#fff;stroke:#b8c8d7;stroke-width:1.5}.accent{fill:#e9f7f4;stroke:#339786;stroke-width:1.5}.line{fill:none;stroke:#64748b;stroke-width:1.7;marker-end:url(#arrow)}.type{stroke-dasharray:5 4}</style>
<rect width="1120" height="510" fill="#f8fafc"/><text class="title" x="40" y="52">责任链：继续、短路与后置收尾</text><text class="sub" x="40" y="84">实线：next.proceed()；虚线：返回或异常后的收尾。链定义可复用，推进状态不可共享。</text>
<path class="line" d="M260 190H340"/><path class="line" d="M560 190H640"/><path class="line" d="M860 190H940"/>
<path class="line" d="M450 235V325"/><path class="line" d="M750 235V325"/>
<path class="line type" d="M1000 235V442H150V235"/>
<text class="sub" x="280" y="160">继续</text><text class="sub" x="580" y="160">通过</text><text class="sub" x="880" y="160">通过</text>
<text class="sub" x="467" y="286">拒绝</text><text class="sub" x="767" y="286">拒绝</text>
<rect class="box" x="40" y="145" width="220" height="90" rx="6"/><text class="h" x="60" y="180">追踪过滤器</text><text class="t" x="60" y="210">进入 / finally 退出</text>
<rect class="accent" x="340" y="145" width="220" height="90" rx="6"/><text class="h" x="360" y="180">权限过滤器</text><text class="t" x="360" y="210">使用可信授权结果</text>
<rect class="box" x="640" y="145" width="220" height="90" rx="6"/><text class="h" x="660" y="180">参数过滤器</text><text class="t" x="660" y="210">行数 1 到 10000</text>
<rect class="box" x="940" y="145" width="140" height="90" rx="6"/><text class="h" x="960" y="180">业务终点</text><text class="t" x="960" y="210">演示成功</text>
<rect class="box" x="340" y="325" width="220" height="75" rx="6"/><text class="h" x="360" y="357">403：无权限</text><text class="t" x="360" y="383">不调用后续节点</text>
<rect class="box" x="640" y="325" width="220" height="75" rx="6"/><text class="h" x="660" y="357">400：参数非法</text><text class="t" x="660" y="383">不执行业务</text>
<rect x="355" y="427" width="470" height="30" fill="#f8fafc"/><text class="sub" x="370" y="448">返回或异常沿调用栈退出；拒绝分支也执行外层收尾</text>
<text class="sub" x="40" y="488">本例同步执行；重复调用同一 next 会报错，异步取消与超时需要另行定义。</text>
</svg>
