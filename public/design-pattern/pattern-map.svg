<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="570" viewBox="0 0 1120 570" role="img" aria-labelledby="title desc"><title id="title">设计模式：创建、组织与协作</title><desc id="desc">从变化位置选择类别，再进入具体模式；单例的唯一性必须说明作用范围。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker></defs>
<style>text{font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#172033}.title{font-size:27px;font-weight:700}.sub{font-size:16px;fill:#526173}.h{font-size:19px;font-weight:700}.t{font-size:16px}.small{font-size:14px;fill:#526173}.box{fill:#fff;stroke:#b8c8d7;stroke-width:1.5}.accent{fill:#e9f7f4;stroke:#339786;stroke-width:1.5}.warn{fill:#fff2eb;stroke:#d28a66;stroke-width:1.5}.line{fill:none;stroke:#64748b;stroke-width:1.7;marker-end:url(#arrow)}.rule{stroke:#d4dee7;stroke-width:1}</style><rect width="1120" height="570" fill="#f8fafc"/><text class="title" x="40" y="52">设计模式：创建、组织与协作</text><text class="sub" x="40" y="84">从变化位置选择类别，再进入具体模式；单例的唯一性必须说明作用范围。</text><text class="h" x="40" y="140">创建型：对象怎么来</text><path class="rule" d="M40 158h310"/><text class="t" x="40" y="196">单例：范围内唯一</text><text class="t" x="40" y="236">工厂方法：产品创建</text><text class="t" x="40" y="276">抽象工厂：相关产品族</text><text class="t" x="40" y="316">建造者：复杂对象组装</text><text class="t" x="40" y="356">原型：复制已有对象</text><text class="h" x="400" y="140">结构型：对象怎么搭</text><path class="rule" d="M400 158h310"/><text class="t" x="400" y="196">适配器：接口转换</text><text class="t" x="400" y="236">桥接：分离两个变化维度</text><text class="t" x="400" y="276">组合：树的统一使用</text><text class="t" x="400" y="316">装饰器：逐层叠加职责</text><text class="t" x="400" y="356">代理：管理目标访问</text><text class="t" x="400" y="396">外观：简化子系统入口</text><text class="t" x="400" y="436">享元：共享内部状态</text><text class="h" x="760" y="140">行为型：对象怎么协作</text><path class="rule" d="M760 158h310"/><text class="t" x="760" y="196">策略 / 模板方法：算法与步骤</text><text class="t" x="760" y="236">状态：允许动作随状态变化</text><text class="t" x="760" y="276">观察者 / 中介者：通知与协调</text><text class="t" x="760" y="316">责任链 / 命令：处理与请求</text><text class="t" x="760" y="356">迭代器 / 访问者：遍历与操作</text><text class="t" x="760" y="396">备忘录：状态保存与恢复</text><text class="t" x="760" y="436">解释器：简单语言解释</text><text class="sub" x="40" y="540">先确认真实变化与稳定契约，再用回归测试检查重构收益。</text></svg>
