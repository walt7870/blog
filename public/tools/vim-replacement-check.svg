<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="400" viewBox="0 0 1120 400" role="img" aria-labelledby="vim-replace-title vim-replace-desc"><title id="vim-replace-title">Vim 替换：先确定语义，再检查修改范围</title><desc id="vim-replace-desc">搜索准确配置键，确认匹配后逐个替换，再检查diff；错误时撤销，不用全局数字替换误伤其他字段。</desc><defs><marker id="vim-replace-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#54778a"/></marker></defs><style>text{font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#183248}.h{font-size:28px;font-weight:700}.n{font-size:21px;font-weight:700}.b{font-size:18px}.s{font-size:16px;fill:#526877}.box{fill:#fff;stroke:#b8cad5;stroke-width:1.5}.focus{fill:#e5f4ef;stroke:#27846b;stroke-width:2}.edge{fill:none;stroke:#54778a;stroke-width:2;marker-end:url(#vim-replace-arrow)}</style><rect width="1120" height="400" fill="#f4f8fa"/><text class="h" x="36" y="50">Vim 替换：先确定语义，再检查修改范围</text>
<text class="b" x="36" y="86">timeout=30 与 timeout_ms=3000 同时存在时，不要对全文的 30 直接替换。</text>
<path class="edge" d="M256 198H320"/><path class="edge" d="M560 198H624"/><path class="edge" d="M844 198H908"/>
<rect class="box" x="36" y="136" width="220" height="124" rx="6"/><text class="n" x="56" y="176">搜索准确字段</text><text class="b" x="56" y="212">确认键名和数值</text><text class="s" x="56" y="243">不是所有相同数字</text>
<rect class="focus" x="320" y="136" width="240" height="124" rx="6"/><text class="n" x="340" y="176">带 c 逐个确认</text><text class="b" x="340" y="212">y 替换 / n 跳过</text><text class="s" x="340" y="243">选区行范围另行核对</text>
<rect class="box" x="624" y="136" width="220" height="124" rx="6"/><text class="n" x="644" y="176">查看 diff</text><text class="b" x="644" y="212">只改目标配置</text><text class="s" x="644" y="243">检查单位与相邻字段</text>
<rect class="box" x="908" y="136" width="176" height="124" rx="6"/><text class="n" x="928" y="176">决定保存</text><text class="b" x="928" y="212">正确后 :w</text><text class="s" x="928" y="243">错误先 u 撤销</text>
<text class="b" x="36" y="333">字符选择涉及的行，不等于字符选区；局部替换用匹配范围约束并预览。</text></svg>
