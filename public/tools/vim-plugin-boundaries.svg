<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="460" viewBox="0 0 1120 460" role="img" aria-labelledby="vim-plugin-title vim-plugin-desc"><title id="vim-plugin-title">Vim 插件：配置、适配器与外部程序</title><desc id="vim-plugin-desc">vimrc声明插件与映射，插件提供Vim命令并调用外部工具，外部语言服务再读取项目配置；按故障层级排查。</desc><defs><marker id="vim-plugin-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#54778a"/></marker></defs><style>text{font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#183248}.h{font-size:28px;font-weight:700}.n{font-size:21px;font-weight:700}.b{font-size:18px}.s{font-size:16px;fill:#526877}.box{fill:#fff;stroke:#b8cad5;stroke-width:1.5}.focus{fill:#e5f4ef;stroke:#27846b;stroke-width:2}.edge{fill:none;stroke:#54778a;stroke-width:2;marker-end:url(#vim-plugin-arrow)}</style><rect width="1120" height="460" fill="#f4f8fa"/><text class="h" x="36" y="50">Vim 插件：配置、适配器与外部程序</text>
<text class="b" x="36" y="86">:Rg 命令不存在先查加载；界面已打开但 rg 不存在，则查外部工具。</text>
<path class="edge" d="M260 202H324"/><path class="edge" d="M584 202H648"/><path class="edge" d="M856 202H920"/>
<rect class="box" x="36" y="136" width="224" height="132" rx="6"/><text class="n" x="56" y="175">用户配置</text><text class="b" x="56" y="211">vimrc / 映射 / 声明</text><text class="s" x="56" y="244">独立 dotfiles 管理</text>
<rect class="focus" x="324" y="136" width="260" height="132" rx="6"/><text class="n" x="344" y="175">已加载的插件</text><text class="b" x="344" y="211">fzf.vim / coc.nvim</text><text class="s" x="344" y="244">提供命令、UI 与协议适配</text>
<rect class="box" x="648" y="136" width="208" height="132" rx="6"/><text class="n" x="668" y="175">外部程序</text><text class="b" x="668" y="211">rg / LSP / 格式化器</text><text class="s" x="668" y="244">另有安装与运行依赖</text>
<rect class="box" x="920" y="136" width="164" height="132" rx="6"/><text class="n" x="940" y="175">项目输入</text><text class="b" x="940" y="211">源码 / 配置</text><text class="s" x="940" y="244">决定诊断与规则</text>
<text class="n" x="36" y="338">排查入口</text><text class="b" x="36" y="376">:messages / :scriptnames → 插件状态 → 外部命令版本 → 项目配置</text>
<text class="s" x="36" y="420">--noplugin 仍运行 vimrc；用临时副本和 vim -Nu NONE -n 区分用户配置与编辑器本体。</text></svg>
