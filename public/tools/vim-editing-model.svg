<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="540" viewBox="0 0 1120 540" role="img" aria-labelledby="vim-model-title vim-model-desc"><title id="vim-model-title">Vim：编辑动作与显示窗口是两套关系</title><desc id="vim-model-desc">修改动作由操作符和文本对象组合，两个窗口可以显示同一个 buffer，tab 是窗口布局而非一个文件。</desc><defs><marker id="vim-model-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#54778a"/></marker></defs><style>text{font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#183248}.h{font-size:28px;font-weight:700}.n{font-size:21px;font-weight:700}.b{font-size:18px}.s{font-size:16px;fill:#526877}.box{fill:#fff;stroke:#b8cad5;stroke-width:1.5}.focus{fill:#e5f4ef;stroke:#27846b;stroke-width:2}.edge{fill:none;stroke:#54778a;stroke-width:2;marker-end:url(#vim-model-arrow)}</style><rect width="1120" height="540" fill="#f4f8fa"/><text class="h" x="36" y="50">Vim：编辑动作与显示窗口是两套关系</text>
<text class="b" x="36" y="86">将 order_status = "pending" 改为 "paid"：光标在值内，执行 ci"paid&lt;Esc&gt;。</text>
<path class="edge" d="M252 194H316"/><path class="edge" d="M560 194H624"/>
<rect class="box" x="36" y="132" width="216" height="124" rx="6"/><text class="n" x="56" y="171">c · 修改操作符</text><text class="b" x="56" y="208">删除目标后进入插入</text><text class="s" x="56" y="239">动作：要做什么</text>
<rect class="box" x="316" y="132" width="244" height="124" rx="6"/><text class="n" x="336" y="171">i" · 引号内部</text><text class="b" x="336" y="208">确定修改范围</text><text class="s" x="336" y="239">对象：作用在哪里</text>
<rect class="focus" x="624" y="132" width="460" height="124" rx="6"/><text class="n" x="644" y="171">paid + Esc · 完成本次修改</text><text class="b" x="644" y="208">下一处用 . 重复；范围错误用 u 撤销</text><text class="s" x="644" y="239">重复之前仍需确认光标所在对象</text>
<path class="edge" d="M336 396H400"/><path class="edge" d="M656 396H720"/>
<rect class="box" x="36" y="334" width="300" height="124" rx="6"/><text class="n" x="56" y="373">tab：一组窗口布局</text><text class="b" x="56" y="410">例如左右分屏对照</text><text class="s" x="56" y="441">不是必须与文件一一对应</text>
<rect class="box" x="400" y="334" width="256" height="124" rx="6"/><text class="n" x="420" y="373">window：显示视图</text><text class="b" x="420" y="410">各有光标与滚动位置</text><text class="s" x="420" y="441">多个窗口可看同一 buffer</text>
<rect class="box" x="720" y="334" width="364" height="124" rx="6"/><text class="n" x="740" y="373">buffer：内存中的文本</text><text class="b" x="740" y="410">修改先在这里发生，:w 后写盘</text><text class="s" x="740" y="441">也可以是尚未命名的新内容</text>
<text class="s" x="36" y="507">上排表示编辑组合；下排表示布局包含窗口、窗口显示缓冲区。</text></svg>
