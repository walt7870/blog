<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="470" viewBox="0 0 1120 470" role="img" aria-labelledby="sdkman-scope-title sdkman-scope-desc"><title id="sdkman-scope-title">SDKMAN!：文件声明与当前 shell 的生效范围</title><desc id="sdkman-scope-desc">项目文件经 sdk env 选择安装目录并改变当前 shell 的路径，新进程继承环境；已经运行的 IDE 和服务不会自动改变。</desc><defs><marker id="sdkman-scope-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#54778a"/></marker></defs><style>text{font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#183248}.h{font-size:28px;font-weight:700}.n{font-size:21px;font-weight:700}.b{font-size:18px}.s{font-size:16px;fill:#526877}.box{fill:#fff;stroke:#b8cad5;stroke-width:1.5}.focus{fill:#e5f4ef;stroke:#27846b;stroke-width:2}.edge{fill:none;stroke:#54778a;stroke-width:2;marker-end:url(#sdkman-scope-arrow)}</style><rect width="1120" height="470" fill="#f4f8fa"/><text class="h" x="36" y="50">SDKMAN!：文件声明与当前 shell 的生效范围</text>
<text class="b" x="36" y="86">订单项目声明 JDK 17；报表项目声明 JDK 21。声明、激活和实际运行要分别验证。</text>
<path class="edge" d="M260 201H324"/><path class="edge" d="M564 201H628"/><path class="edge" d="M856 201H920"/>
<rect class="box" x="36" y="140" width="224" height="122" rx="6"/><text class="n" x="56" y="179">.sdkmanrc</text><text class="b" x="56" y="213">精确版本声明</text><text class="s" x="56" y="243">提交到项目仓库</text>
<rect class="focus" x="324" y="140" width="240" height="122" rx="6"/><text class="n" x="344" y="179">sdk env</text><text class="b" x="344" y="213">选择已安装的 SDK</text><text class="s" x="344" y="243">缺版本先 env install</text>
<rect class="box" x="628" y="140" width="228" height="122" rx="6"/><text class="n" x="648" y="179">当前 shell</text><text class="b" x="648" y="213">PATH / JAVA_HOME</text><text class="s" x="648" y="243">java -version 验证</text>
<rect class="box" x="920" y="140" width="164" height="122" rx="6"/><text class="n" x="940" y="179">新建子进程</text><text class="b" x="940" y="213">继承环境</text><text class="s" x="940" y="243">仍可另选工具链</text>
<text class="n" x="36" y="332">离开项目</text><text class="b" x="36" y="369">sdk env clear 恢复默认；自动切换需开启 sdkman_auto_env。</text>
<text class="b" x="36" y="408">已运行的 IDE、Daemon、服务保留原进程环境，分别检查它们的 JVM 选择。</text></svg>
