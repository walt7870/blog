<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="500" viewBox="0 0 1120 500" role="img" aria-labelledby="vfox-scope-title vfox-scope-desc"><title id="vfox-scope-title">vfox 1.x：优先级与可共享内容</title><desc id="vfox-scope-desc">项目优先于会话、全局和系统 PATH，声明存于 .vfox.toml，实际 SDK 链接留在本机；插件负责安装 SDK。</desc><defs><marker id="vfox-scope-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#54778a"/></marker></defs><style>text{font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#183248}.h{font-size:28px;font-weight:700}.n{font-size:21px;font-weight:700}.b{font-size:18px}.s{font-size:16px;fill:#526877}.box{fill:#fff;stroke:#b8cad5;stroke-width:1.5}.focus{fill:#e5f4ef;stroke:#27846b;stroke-width:2}.edge{fill:none;stroke:#54778a;stroke-width:2;marker-end:url(#vfox-scope-arrow)}</style><rect width="1120" height="500" fill="#f4f8fa"/><text class="h" x="36" y="50">vfox 1.x：优先级与可共享内容</text>
<text class="b" x="36" y="86">已激活 shell 后，按优先级命中工具路径；更低层不会自动覆盖更高层。</text>
<path class="edge" d="M260 194H324"/><path class="edge" d="M564 194H628"/><path class="edge" d="M856 194H920"/>
<rect class="focus" x="36" y="136" width="224" height="116" rx="6"/><text class="n" x="56" y="174">1 · 项目 -p</text><text class="b" x="56" y="207">.vfox/sdks</text><text class="s" x="56" y="236">当前项目路径优先</text>
<rect class="box" x="324" y="136" width="240" height="116" rx="6"/><text class="n" x="344" y="174">2 · 会话 -s</text><text class="b" x="344" y="207">当前终端临时选择</text><text class="s" x="344" y="236">关闭会话后结束</text>
<rect class="box" x="628" y="136" width="228" height="116" rx="6"/><text class="n" x="648" y="174">3 · 全局 -g</text><text class="b" x="648" y="207">用户默认版本</text><text class="s" x="648" y="236">供缺少更具体选择时用</text>
<rect class="box" x="920" y="136" width="164" height="116" rx="6"/><text class="n" x="940" y="174">4 · 系统</text><text class="b" x="940" y="207">其余 PATH</text><text class="s" x="940" y="236">原有安装来源</text>
<text class="n" x="36" y="328">提交到仓库</text><text class="b" x="36" y="365">.vfox.toml：共享精确版本；包管理器锁文件：共享依赖解析结果。</text>
<text class="n" x="36" y="414">留在每台机器</text><text class="b" x="36" y="451">.vfox/ 中的 SDK 链接与安装目录；新机器安装后验证实际命令路径和版本。</text></svg>
