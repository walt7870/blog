<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="long-agent-unknown-recovery-title long-agent-unknown-recovery-desc">
  <title id="long-agent-unknown-recovery-title">响应丢失后的归档恢复时序</title>
  <desc id="long-agent-unknown-recovery-desc">执行端先持久化原操作身份，服务端归档成功但响应丢失；接手进程用相同操作身份查询并回读原报告，验证后补齐检查点。</desc>
  <defs>
    <marker id="long-agent-unknown-recovery-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker>
    <style>text{font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#172b3a}.title{font-size:26px;font-weight:700}.name{font-size:20px;font-weight:700}.body{font-size:17px;fill:#475569}.line{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#long-agent-unknown-recovery-arrow)}.return{stroke-dasharray:6 5}.life{stroke:#cbd5e1;stroke-width:2;stroke-dasharray:4 6}.mask{fill:#f8fafc}.actor{fill:#fff;stroke:#cbd5e1;stroke-width:2}</style>
  </defs>
  <rect width="960" height="600" fill="#f8fafc"/>
  <text x="32" y="44" class="title">远端已经成功，本地检查点仍可能是未知</text>
  <text x="32" y="76" class="body">同一逻辑归档保持同一操作身份；时间从上向下。</text>
  <path d="M160 160V508M480 160V508M800 160V508" class="life"/>
  <rect x="156" y="176" width="8" height="116" fill="#dbeafe" stroke="#60a5fa"/>
  <rect x="796" y="212" width="8" height="68" fill="#e2e8f0" stroke="#94a3b8"/>
  <rect x="156" y="348" width="8" height="144" fill="#dbeafe" stroke="#60a5fa"/>
  <path d="M164 192H476" class="line"/>
  <path d="M164 232H796" class="line"/>
  <path d="M796 276H188" class="line return"/>
  <path d="M164 364H476" class="line"/>
  <path d="M164 408H796" class="line"/>
  <path d="M796 452H164" class="line return"/>
  <path d="M164 492H476" class="line"/>
  <rect x="60" y="104" width="200" height="56" rx="6" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
  <rect x="380" y="104" width="200" height="56" rx="6" class="actor"/>
  <rect x="700" y="104" width="200" height="56" rx="6" class="actor"/>
  <text x="160" y="138" class="name" text-anchor="middle">执行端 / 接手进程</text>
  <text x="480" y="138" class="name" text-anchor="middle">持久化检查点</text>
  <text x="800" y="138" class="name" text-anchor="middle">归档服务</text>
  <rect x="180" y="162" width="272" height="22" class="mask"/><text x="316" y="179" class="body" text-anchor="middle">先保存操作 ID、幂等键与参数摘要</text>
  <rect x="524" y="202" width="248" height="22" class="mask"/><text x="648" y="219" class="body" text-anchor="middle">提交原操作，服务端保存报告</text>
  <rect x="524" y="246" width="248" height="22" class="mask"/><text x="648" y="263" class="body" text-anchor="middle">成功响应在途中丢失</text>
  <path d="M176 268L192 284M192 268L176 284" stroke="#c65365" stroke-width="3"/>
  <rect x="32" y="308" width="896" height="28" fill="#fff1f2"/>
  <text x="480" y="328" class="body" text-anchor="middle">进程中断或超时：归档已存在，本地仍为 unknown</text>
  <rect x="188" y="334" width="252" height="22" class="mask"/><text x="314" y="351" class="body" text-anchor="middle">接手后读取原操作身份与输入摘要</text>
  <rect x="536" y="378" width="224" height="22" class="mask"/><text x="648" y="395" class="body" text-anchor="middle">查询原操作并回读原报告</text>
  <rect x="536" y="422" width="224" height="22" class="mask"/><text x="648" y="439" class="body" text-anchor="middle">返回原报告 ID 与内容</text>
  <rect x="192" y="462" width="248" height="22" class="mask"/><text x="316" y="479" class="body" text-anchor="middle">验证当前内容，补记 succeeded</text>
  <path d="M32 528H928" stroke="#cbd5e1"/>
  <text x="32" y="562" class="body">实线为请求，虚线为返回；暂未查到不保证未执行，后续动作取决于服务端合同。</text>
</svg>
