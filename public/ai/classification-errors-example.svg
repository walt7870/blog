<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="535" viewBox="0 0 1120 535" role="img" aria-labelledby="classification-errors-example-title classification-errors-example-desc">
<title id="classification-errors-example-title">找到 8 笔欺诈，需要审核 20 笔交易</title><desc id="classification-errors-example-desc">教学数据共 1000 笔，真实欺诈 10 笔；列是真实标签，行是预测结果。</desc>
<defs><marker id="classification-errors-example-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker><style>text{font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#172b3a}.head{font-size:28px;font-weight:700}.node{font-size:20px;font-weight:700}.body{font-size:17px;fill:#475569}.value{font-size:32px;font-weight:700}.box{fill:white;stroke:#cbd5e1;stroke-width:2}.blue{fill:#eff6ff;stroke:#60a5fa;stroke-width:2}.green{fill:#ecfdf5;stroke:#14b8a6;stroke-width:2}.red{fill:#fff1f2;stroke:#e88191;stroke-width:2}.line{stroke:#64748b;stroke-width:2;fill:none}.dashed{stroke-dasharray:6 5}</style></defs>
<rect width="1120" height="535" fill="#f8fafc"/>
<text class="head" x="40" y="48" text-anchor="start">找到 8 笔欺诈，需要审核 20 笔交易</text><text class="body" x="40" y="80" text-anchor="start">教学数据共 1000 笔，真实欺诈 10 笔；列是真实标签，行是预测结果。</text><text class="node" x="330" y="140" text-anchor="middle">真实欺诈</text><text class="node" x="560" y="140" text-anchor="middle">真实正常</text><text class="node" x="45" y="220" text-anchor="start">预测欺诈</text><text class="node" x="45" y="350" text-anchor="start">预测正常</text><rect class="green" x="210" y="165" width="220" height="110" rx="6"/><rect class="red" x="450" y="165" width="220" height="110" rx="6"/><rect class="red" x="210" y="295" width="220" height="110" rx="6"/><rect class="blue" x="450" y="295" width="220" height="110" rx="6"/><text class="value" x="320" y="211" text-anchor="middle">TP = 8</text><text class="body" x="320" y="247" text-anchor="middle">正确报出</text><text class="value" x="560" y="211" text-anchor="middle">FP = 12</text><text class="body" x="560" y="247" text-anchor="middle">误报，增加审核</text><text class="value" x="320" y="341" text-anchor="middle">FN = 2</text><text class="body" x="320" y="377" text-anchor="middle">漏报，承担损失</text><text class="value" x="560" y="341" text-anchor="middle">TN = 978</text><text class="body" x="560" y="377" text-anchor="middle">正确放过</text><text class="node" x="740" y="205" text-anchor="start">精确率 8 / 20 = 40%</text><text class="node" x="740" y="250" text-anchor="start">召回率 8 / 10 = 80%</text><text class="body" x="740" y="295" text-anchor="start">准确率 986 / 1000 = 98.6%</text><text class="body" x="740" y="355" text-anchor="start">全部预测正常：准确率 99%</text><text class="body" x="740" y="385" text-anchor="start">但找不到任何欺诈</text><text class="body" x="45" y="465" text-anchor="start">决策要同时比较：漏报损失、误报干扰、人工审核容量。</text><text class="body" x="45" y="500" text-anchor="start">真实正例只有 10 个：每变化 1 个，召回率就变化 10 个百分点；需要报告样本量与不确定性。</text>
</svg>
