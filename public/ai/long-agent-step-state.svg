<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="long-agent-step-state-title long-agent-step-state-desc">
  <title id="long-agent-step-state-title">任务步骤的主要状态与恢复路径</title>
  <desc id="long-agent-step-state-desc">执行结果先验证，异步作业可等待，写入结果未知先回查；校验失败返回就绪，权限或输入缺失时阻塞，不可恢复错误终止。</desc>
  <defs>
    <marker id="long-agent-step-state-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker>
    <style>text{font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#172b3a}.title{font-size:26px;font-weight:700}.name{font-size:20px;font-weight:700}.body{font-size:17px;fill:#475569}.key{font-family:Consolas,monospace;font-size:15px;fill:#475569}.box{fill:#fff;stroke:#cbd5e1;stroke-width:2}.blue{fill:#eff6ff;stroke:#60a5fa;stroke-width:2}.green{fill:#ecfdf5;stroke:#14b8a6;stroke-width:2}.rose{fill:#fff1f2;stroke:#e88191;stroke-width:2}.line{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#long-agent-step-state-arrow)}.dash{stroke-dasharray:6 5}</style>
  </defs>
  <rect width="960" height="600" fill="#f8fafc"/>
  <text x="32" y="44" class="title">步骤完成，要有当前版本的验证证据</text>
  <text x="32" y="76" class="body">主路径向右推进；等待与结果未知分别恢复，不能统一按失败重跑。</text>
  <path d="M200 204H280" class="line"/>
  <path d="M440 204H520" class="line"/>
  <path d="M680 204H760" class="line"/>
  <path d="M600 156V116Q600 108 592 108H128Q120 108 120 116V156" class="line dash"/>
  <path d="M312 252V356" class="line"/>
  <path d="M408 356V252" class="line dash"/>
  <path d="M432 252V300Q432 308 440 308H544Q552 308 552 316V356" class="line"/>
  <path d="M632 356V252" class="line dash"/>
  <path d="M680 404H760" class="line"/>
  <path d="M288 252V308Q288 316 280 316H128Q120 316 120 324V356" class="line"/>
  <rect x="204" y="168" width="72" height="26" fill="#f8fafc"/><text x="240" y="188" class="body" text-anchor="middle">依赖齐全</text>
  <rect x="444" y="168" width="72" height="26" fill="#f8fafc"/><text x="480" y="188" class="body" text-anchor="middle">返回结果</text>
  <rect x="684" y="168" width="72" height="26" fill="#f8fafc"/><text x="720" y="188" class="body" text-anchor="middle">证据通过</text>
  <rect x="232" y="116" width="264" height="26" fill="#f8fafc"/><text x="364" y="136" class="body" text-anchor="middle">校验失败，修正后重新执行</text>
  <text x="324" y="280" class="body">异步</text>
  <text x="396" y="344" class="body" text-anchor="end">可继续</text>
  <rect x="448" y="272" width="112" height="26" fill="#f8fafc"/><text x="504" y="292" class="body" text-anchor="middle">写入响应丢失</text>
  <text x="644" y="286" class="body">回查</text><text x="644" y="312" class="body">成功</text>
  <rect x="684" y="368" width="72" height="26" fill="#f8fafc"/><text x="720" y="388" class="body" text-anchor="middle">无法核清</text>
  <rect x="144" y="324" width="132" height="26" fill="#f8fafc"/><text x="210" y="344" class="body" text-anchor="middle">不可恢复错误</text>
  <g data-node="ready"><rect x="40" y="156" width="160" height="96" rx="6" class="box"/><text x="60" y="190" class="name">就绪</text><text x="60" y="220" class="key">ready</text></g>
  <g data-node="running"><rect x="280" y="156" width="160" height="96" rx="6" class="blue"/><text x="300" y="190" class="name">执行中</text><text x="300" y="220" class="key">running</text></g>
  <g data-node="verifying"><rect x="520" y="156" width="160" height="96" rx="6" class="box"/><text x="540" y="190" class="name">验证中</text><text x="540" y="220" class="key">verifying</text></g>
  <g data-node="succeeded"><rect x="760" y="156" width="160" height="96" rx="6" class="green"/><text x="780" y="190" class="name">已完成</text><text x="780" y="220" class="key">succeeded</text></g>
  <g data-node="failed"><rect x="40" y="356" width="160" height="96" rx="6" class="box"/><text x="60" y="390" class="name">本次终止</text><text x="60" y="420" class="key">failed</text></g>
  <g data-node="waiting"><rect x="280" y="356" width="160" height="96" rx="6" class="box"/><text x="300" y="390" class="name">等待作业</text><text x="300" y="420" class="key">waiting</text></g>
  <g data-node="unknown"><rect x="520" y="356" width="160" height="96" rx="6" class="rose"/><text x="540" y="390" class="name">结果未知</text><text x="540" y="420" class="key">unknown</text></g>
  <g data-node="blocked"><rect x="760" y="356" width="160" height="96" rx="6" class="box"/><text x="780" y="390" class="name">等待外部条件</text><text x="780" y="420" class="key">blocked</text></g>
  <path d="M32 492H928" stroke="#cbd5e1"/>
  <text x="32" y="524" class="body">通用阻塞条件：权限或输入缺失、预算耗尽时，保存状态并停止新调度。</text>
  <text x="32" y="556" class="body">结果未知只能先核查原操作；取消请求与远端取消确认按正文单独处理。</text>
</svg>
