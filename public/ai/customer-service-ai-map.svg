<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="620" viewBox="0 0 1120 620" role="img" aria-labelledby="customer-service-ai-map-title customer-service-ai-map-desc">
<title id="customer-service-ai-map-title">客服回答与退款动作承担不同责任</title><desc id="customer-service-ai-map-desc">技术可以组合：规则校验资格，模型理解表达，检索提供政策，接口执行受控动作。</desc>
<defs><marker id="customer-service-ai-map-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker><style>text{font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#172b3a}.head{font-size:28px;font-weight:700}.node{font-size:20px;font-weight:700}.body{font-size:17px;fill:#475569}.value{font-size:32px;font-weight:700}.box{fill:white;stroke:#cbd5e1;stroke-width:2}.blue{fill:#eff6ff;stroke:#60a5fa;stroke-width:2}.green{fill:#ecfdf5;stroke:#14b8a6;stroke-width:2}.red{fill:#fff1f2;stroke:#e88191;stroke-width:2}.line{stroke:#64748b;stroke-width:2;fill:none}.dashed{stroke-dasharray:6 5}</style></defs>
<rect width="1120" height="620" fill="#f8fafc"/>
<text class="head" x="40" y="48" text-anchor="start">客服回答与退款动作承担不同责任</text><text class="body" x="40" y="80" text-anchor="start">技术可以组合：规则校验资格，模型理解表达，检索提供政策，接口执行受控动作。</text><path class="line" marker-end="url(#customer-service-ai-map-arrow)" d="M260 205H320"/><path class="line" marker-end="url(#customer-service-ai-map-arrow)" d="M570 205H630"/><path class="line" marker-end="url(#customer-service-ai-map-arrow)" d="M850 205H900"/><path class="line dashed" marker-end="url(#customer-service-ai-map-arrow)" d="M745 150V125H445V150"/><path class="line" marker-end="url(#customer-service-ai-map-arrow)" d="M1000 260V350H845V390"/><path class="line" marker-end="url(#customer-service-ai-map-arrow)" d="M695 450H615"/><path class="line" marker-end="url(#customer-service-ai-map-arrow)" d="M325 450H270"/><rect class="box" x="40" y="150" width="220" height="110" rx="6"/><text class="node" x="60" y="183" text-anchor="start">用户消息</text><text class="body" x="60" y="212" text-anchor="start">订单没到</text><text class="body" x="60" y="237" text-anchor="start">能退款吗？</text><rect class="blue" x="320" y="150" width="250" height="110" rx="6"/><text class="node" x="340" y="183" text-anchor="start">分类与上下文</text><text class="body" x="340" y="212" text-anchor="start">分类器 / 语言模型</text><text class="body" x="340" y="237" text-anchor="start">识别售后意图、订单</text><rect class="green" x="630" y="150" width="220" height="110" rx="6"/><text class="node" x="650" y="183" text-anchor="start">检索政策</text><text class="body" x="650" y="212" text-anchor="start">RAG 提供相关条款</text><text class="body" x="650" y="237" text-anchor="start">无依据时转人工</text><rect class="box" x="900" y="150" width="180" height="110" rx="6"/><text class="node" x="920" y="183" text-anchor="start">生成回答</text><text class="body" x="920" y="212" text-anchor="start">说明政策依据</text><text class="body" x="920" y="237" text-anchor="start">提出动作请求</text><rect class="blue" x="695" y="390" width="300" height="120" rx="6"/><text class="node" x="715" y="423" text-anchor="start">应用与工具网关</text><text class="body" x="715" y="452" text-anchor="start">核对身份、参数、授权</text><text class="body" x="715" y="477" text-anchor="start">按业务政策触发确认</text><rect class="green" x="325" y="390" width="290" height="120" rx="6"/><text class="node" x="345" y="423" text-anchor="start">订单 / 退款服务</text><text class="body" x="345" y="452" text-anchor="start">校验归属、状态与金额</text><text class="body" x="345" y="477" text-anchor="start">幂等执行，返回真实结果</text><rect class="box" x="40" y="390" width="230" height="120" rx="6"/><text class="node" x="60" y="423" text-anchor="start">结果与失败处理</text><text class="body" x="60" y="452" text-anchor="start">成功回读交易状态</text><text class="body" x="60" y="477" text-anchor="start">失败保留可追踪记录</text><text class="body" x="40" y="570" text-anchor="start">虚线：检索结果加入上下文。实线：处理与动作链路。模型生成退款请求，不代表退款已经成功。</text>
</svg>
