<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="600" viewBox="0 0 1120 600" role="img" aria-labelledby="practice-project-routes-title practice-project-routes-desc"><title id="practice-project-routes-title">从需要交付的业务输出选择项目</title><desc id="practice-project-routes-desc">四个方向可以独立起步；共同要求是输入可追溯、结果可验收、失败可恢复。</desc><defs><marker id="practice-project-routes-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker><style>text{font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#172b3a}.head{font-size:27px;font-weight:700}.node{font-size:20px;font-weight:700}.body{font-size:17px;fill:#475569}.box{fill:white;stroke:#cbd5e1;stroke-width:2}.blue{fill:#eff6ff;stroke:#60a5fa;stroke-width:2}.green{fill:#ecfdf5;stroke:#14b8a6;stroke-width:2}.red{fill:#fff1f2;stroke:#e88191;stroke-width:2}.line{fill:none;stroke:#64748b;stroke-width:2}.dash{stroke-dasharray:6 5}</style></defs><rect width="1120" height="600" fill="#f8fafc"/><text x="40" y="48" class="head" text-anchor="start">从需要交付的业务输出选择项目</text><text x="40" y="80" class="body" text-anchor="start">四个方向可以独立起步；共同要求是输入可追溯、结果可验收、失败可恢复。</text><path d="M480 208H226Q218 208 218 216V292" class="line" marker-end="url(#practice-project-routes-arrow)"/><path d="M560 208V292" class="line" marker-end="url(#practice-project-routes-arrow)"/><path d="M640 208H894Q902 208 902 216V292" class="line" marker-end="url(#practice-project-routes-arrow)"/><rect x="376" y="120" width="368" height="88" rx="6" class="blue"/><text x="392" y="152" class="node" text-anchor="start">先确定输出与使用者</text><text x="392" y="182" class="body" text-anchor="start">名单 / 图片判定 / 回答 / 工单</text><rect x="40" y="292" width="356" height="136" rx="6" class="box"/><text x="56" y="324" class="node" text-anchor="start">预测与感知</text><text x="56" y="354" class="body" text-anchor="start">运营名单：时间快照与Top-K</text><text x="56" y="379" class="body" text-anchor="start">产线质检：图片标签与漏检成本</text><rect x="436" y="292" width="248" height="136" rx="6" class="green"/><text x="452" y="324" class="node" text-anchor="start">有依据的回答</text><text x="452" y="354" class="body" text-anchor="start">知识库：检索与引用</text><text x="452" y="379" class="body" text-anchor="start">证据不支持则拒答</text><rect x="724" y="292" width="356" height="136" rx="6" class="box"/><text x="740" y="324" class="node" text-anchor="start">可回读的业务记录</text><text x="740" y="354" class="body" text-anchor="start">工单：草稿版本与用户确认</text><text x="740" y="379" class="body" text-anchor="start">工具写入：权限、幂等与回查</text><text x="40" y="492" class="node" text-anchor="start">固定步骤先用工作流；需要根据中间结果选择追问或工具时，再引入 Agent。</text><text x="40" y="542" class="body" text-anchor="start">知识库不要求先训练视觉模型；模型评分也不能直接证明业务干预有效。</text></svg>
