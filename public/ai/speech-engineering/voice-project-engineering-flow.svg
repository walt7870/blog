<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="voice-project-engineering-flow-title voice-project-engineering-flow-desc">
  <title id="voice-project-engineering-flow-title">语音项目工程闭环</title>
  <desc id="voice-project-engineering-flow-desc">从责任边界到证据回归、时延分析、工件绑定和接手交付的工程闭环。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker>
    <style>.box{stroke-width:2;rx:14;ry:14}.title{font:600 19px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#0f172a}.sub{font:14px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#334155}.edge{stroke:#475569;stroke-width:2.5;fill:none;marker-end:url(#arrow)}.caption{font:13px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#475569}</style>
  </defs>
  <rect width="1200" height="420" fill="#f8fafc"/>
  <text x="60" y="52" class="title" font-size="25">语音项目工程闭环</text>
  <text x="60" y="79" class="caption">把“模型效果”拆成边界、证据、状态和工件四个可复核对象</text>
  <rect x="55" y="145" width="200" height="110" fill="#dbeafe" stroke="#2563eb" class="box"/><text x="155" y="187" text-anchor="middle" class="title">责任边界</text><text x="155" y="214" text-anchor="middle" class="sub">会话 / VAD / 角色 / ASR</text>
  <rect x="335" y="145" width="200" height="110" fill="#dcfce7" stroke="#16a34a" class="box"/><text x="435" y="187" text-anchor="middle" class="title">证据回归</text><text x="435" y="214" text-anchor="middle" class="sub">协议 / 质量 / 性能</text>
  <rect x="615" y="145" width="200" height="110" fill="#fef3c7" stroke="#d97706" class="box"/><text x="715" y="187" text-anchor="middle" class="title">状态时延</text><text x="715" y="214" text-anchor="middle" class="sub">末音 / Final / terminal</text>
  <rect x="895" y="145" width="250" height="110" fill="#ede9fe" stroke="#7c3aed" class="box"/><text x="1020" y="187" text-anchor="middle" class="title">工件与接手</text><text x="1020" y="214" text-anchor="middle" class="sub">环境 / 摘要 / 文档 / 回滚</text>
  <path d="M255 200 H335" class="edge"/><path d="M535 200 H615" class="edge"/><path d="M815 200 H895" class="edge"/>
  <path d="M1020 255 V320 H155 V255" class="edge"/>
  <text x="600" y="355" text-anchor="middle" class="caption">每轮交付都回到责任边界，确认变更影响了哪些证据和验收项</text>
</svg>
