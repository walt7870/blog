<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="570" viewBox="0 0 1000 570" role="img" aria-labelledby="title desc">
  <title id="title">从末音到 Final，从停止到 terminal</title><desc id="desc">时序示意，不按耗时比例。主 VAD 封口后提交 Final 任务，等待解码和必要角色覆盖。EOF 进入排空，所有已接受任务结束后才发 terminal。Preview 是可修订假设。</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#52616b"/></marker><style>text{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;fill:#17252a;letter-spacing:0}.h{font-size:24px;font-weight:600}.t{font-size:20px;font-weight:600}.s{font-size:17px;fill:#43545b}.e{stroke:#52616b;stroke-width:2;fill:none;marker-end:url(#a)}.d{stroke:#b7c5cc;stroke-dasharray:5 5;fill:none}.b{fill:#edf4fa;stroke:#4280a8;rx:6}</style></defs>
  <rect width="1000" height="570" fill="#fff"/><text x="30" y="41" class="h">一句话完成，与整个会话结束是两件事</text><text x="30" y="73" class="s">时间向下；只表示依赖顺序，不表示各阶段耗时比例</text>
  <rect x="30" y="100" width="180" height="50" class="b"/><text x="120" y="132" text-anchor="middle" class="t">客户端</text>
  <rect x="290" y="100" width="180" height="50" class="b"/><text x="380" y="132" text-anchor="middle" class="t">会话 / VAD</text>
  <rect x="550" y="100" width="180" height="50" class="b"/><text x="640" y="132" text-anchor="middle" class="t">Final worker</text>
  <rect x="790" y="100" width="180" height="50" class="b"/><text x="880" y="132" text-anchor="middle" class="t">合并与发布</text>
  <path d="M120 150V482M380 150V482M640 150V482M880 150V482" class="d"/>
  <path d="M120 194H380" class="e"/><text x="145" y="182" class="s">最后有效语音帧</text>
  <path d="M380 248H640" class="e"/><text x="399" y="235" class="s">尾部保留、封口、入队</text>
  <rect x="545" y="268" width="425" height="48" fill="#eaf5ed" stroke="#488661" rx="6"/><text x="757" y="298" text-anchor="middle" class="s">完成解码；必要角色证据覆盖该音频区间</text>
  <path d="M880 345H120" class="e" stroke-dasharray="6 4"/><rect x="400" y="321" width="208" height="28" fill="#fff"/><text x="504" y="342" text-anchor="middle" class="t">Final：只提交一次</text>
  <path d="M120 390H380" class="e"/><text x="148" y="378" class="s">stop / EOF：停止接收</text>
  <path d="M380 431H880" class="e"/><rect x="478" y="408" width="317" height="27" fill="#fff"/><text x="636" y="428" text-anchor="middle" class="s">尾段封口 + 排空所有已接受任务</text>
  <path d="M880 478H120" class="e" stroke-dasharray="6 4"/><rect x="440" y="455" width="130" height="28" fill="#fff"/><text x="505" y="476" text-anchor="middle" class="t">terminal</text>
  <text x="30" y="521" class="s">Preview 可在定稿前更新，可能包含非目标词；不等于 Final，也不承担身份确认。</text>
  <text x="30" y="550" class="s">分别计时：真实末音 → Final；stop / EOF → terminal。EOF 也可能在 Final 尚未完成时到达。</text>
</svg>
