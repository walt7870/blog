<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="640" viewBox="0 0 1320 640" role="img" aria-labelledby="title desc">
  <title id="title">流式语音处理链路</title>
  <desc id="desc">连续 PCM 经 TEN-VAD 主分段，普通与多人模式使用普通 ASR，目标模式携带登记参考使用 TS-ASR，波形门控独立可选。角色证据不等于登记身份，热词能力共享，Final 冻结后输出。</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#52616b"/></marker>
    <style>.box{rx:6;stroke-width:1.5}.h{font:600 23px -apple-system,"PingFang SC",sans-serif;fill:#17252a}.t{font:600 17px -apple-system,"PingFang SC",sans-serif;fill:#17252a}.s{font:14px -apple-system,"PingFang SC",sans-serif;fill:#43545b}.e{fill:none;stroke:#52616b;stroke-width:2;marker-end:url(#a)}.d{stroke-dasharray:5 4}</style>
  </defs>
  <rect width="1320" height="640" fill="#fff"/>
  <text x="36" y="42" class="h">连续收音、分模式识别与结果定稿</text>
  <text x="36" y="70" class="s">实线：音频或结果依赖　虚线：身份条件与共享能力</text>
  <rect x="30" y="108" width="205" height="80" fill="#edf4fa" stroke="#4280a8" class="box"/>
  <text x="132" y="140" text-anchor="middle" class="t">WebSocket / PCM</text><text x="132" y="166" text-anchor="middle" class="s">有序帧与样本时间轴</text>
  <rect x="280" y="108" width="220" height="80" fill="#eaf5ed" stroke="#488661" class="box"/>
  <text x="390" y="140" text-anchor="middle" class="t">TEN-VAD 主分段</text><text x="390" y="166" text-anchor="middle" class="s">封口段与尾部缓存</text>
  <path d="M235 148H280" class="e"/>
  <rect x="280" y="225" width="220" height="92" fill="#fff5e6" stroke="#ae8135" class="box"/>
  <text x="390" y="254" text-anchor="middle" class="t">Nemotron 角色证据</text><text x="390" y="280" text-anchor="middle" class="s">连续上下文 / 活动区间</text><text x="390" y="302" text-anchor="middle" class="s">局部槽位 → 会话身份</text>
  <path d="M132 188V271H280" class="e"/>
  <rect x="570" y="108" width="225" height="80" fill="#eaf5ed" stroke="#488661" class="box"/>
  <text x="682" y="140" text-anchor="middle" class="t">普通 / 多人模式</text><text x="682" y="166" text-anchor="middle" class="s">父段或角色核心子段</text>
  <path d="M500 148H570" class="e"/><path d="M500 271H535V177H570" class="e"/>
  <rect x="860" y="108" width="185" height="80" fill="#edf4fa" stroke="#4280a8" class="box"/>
  <text x="952" y="140" text-anchor="middle" class="t">普通 ASR</text><text x="952" y="166" text-anchor="middle" class="s">全量文字转写</text><path d="M795 148H860" class="e"/>
  <rect x="570" y="352" width="225" height="92" fill="#fff5e6" stroke="#ae8135" class="box"/>
  <text x="682" y="382" text-anchor="middle" class="t">目标说话人模式</text><text x="682" y="408" text-anchor="middle" class="s">可选波形门控（默认关）</text><text x="682" y="432" text-anchor="middle" class="s">保留混合语音上下文</text>
  <path d="M500 170H520V398H570" class="e"/>
  <rect x="280" y="352" width="220" height="92" fill="#f5eef2" stroke="#a46a84" class="box"/>
  <text x="390" y="386" text-anchor="middle" class="t">登记参考</text><text x="390" y="412" text-anchor="middle" class="s">参考波形 / 声纹证据</text><path d="M500 398H570" class="e d"/>
  <rect x="860" y="352" width="185" height="92" fill="#edf4fa" stroke="#4280a8" class="box"/>
  <text x="952" y="382" text-anchor="middle" class="t">TS-ASR</text><text x="952" y="408" text-anchor="middle" class="s">参考 + learned SEP</text><text x="952" y="432" text-anchor="middle" class="s">+ 混合语音编码</text><path d="M795 398H860" class="e"/>
  <rect x="860" y="225" width="185" height="80" fill="#f1f3f4" stroke="#748188" class="box"/>
  <text x="952" y="258" text-anchor="middle" class="t">共享热词解析</text><text x="952" y="282" text-anchor="middle" class="s">当前 PCM / pool ID</text><path d="M952 225V188" class="e d"/><path d="M952 305V352" class="e d"/>
  <rect x="1110" y="225" width="180" height="115" fill="#f5eef2" stroke="#a46a84" class="box"/>
  <text x="1200" y="256" text-anchor="middle" class="t">结果合并与冻结</text><text x="1200" y="282" text-anchor="middle" class="s">文字 / 区间 / 身份</text><text x="1200" y="306" text-anchor="middle" class="s">Final → 稳定协议</text><text x="1200" y="328" text-anchor="middle" class="s">排空后 terminal</text>
  <path d="M1045 148H1200V225" class="e"/><path d="M1045 398H1200V340" class="e"/>
  <path d="M390 317V480H1080V282H1110" class="e d"/>
  <text x="36" y="537" class="t">决策权</text><text x="36" y="565" class="s">TEN-VAD 决定主音频段；角色证据决定多人子段与身份关联；登记参考约束目标识别。</text>
  <text x="36" y="593" class="s">匿名槽位不等于登记身份。普通模式不启用目标门控。热词共享不合并普通与目标解码路径。</text>
</svg>
