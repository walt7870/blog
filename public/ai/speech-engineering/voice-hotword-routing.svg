<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="630" viewBox="0 0 1040 630" role="img" aria-labelledby="title desc">
  <title id="title">热词进入提示之后，两种路径如何处理</title>
  <desc id="desc">普通 Final 先解码，仅对未进入提示的内置同音候选补召并重解一次，未达到采用条件保留原文。目标 TS-ASR 不走该重解路径，使用受限同音纠正后进入 ITN。</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#52616b"/></marker><style>text{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;fill:#17252a;letter-spacing:0}.h{font-size:25px;font-weight:600}.t{font-size:20px;font-weight:600}.s{font-size:17px;fill:#43545b}.b{fill:#edf4fa;stroke:#4280a8;stroke-width:1.5;rx:6}.e{fill:none;stroke:#52616b;stroke-width:2;marker-end:url(#a)}.g{fill:#eaf5ed;stroke:#488661}.r{fill:#f5eef2;stroke:#a46a84}</style></defs>
  <rect width="1040" height="630" fill="#fff"/>
  <text x="32" y="43" class="h">同一词库，不同纠错边界</text>
  <text x="32" y="76" class="s">共享解析器：显式词 + 按场景选池 + 当前 PCM 召回 → 请求局部提示</text>
  <path d="M32 98H1008" stroke="#d9e1e5"/>
  <text x="32" y="135" class="t">普通分句 Final</text><text x="32" y="163" class="s">预览、带登记请求不进入此重解分支</text>
  <rect x="32" y="188" width="210" height="82" class="b"/><text x="137" y="222" text-anchor="middle" class="t">第一遍解码</text><text x="137" y="249" text-anchor="middle" class="s">保留原始文本与提示</text>
  <path d="M242 229H286" class="e"/>
  <rect x="286" y="188" width="300" height="82" class="b g"/><text x="436" y="222" text-anchor="middle" class="t">拼音查内置词索引</text><text x="436" y="249" text-anchor="middle" class="s">只补未进提示的词，最多 8 个</text>
  <path d="M586 229H648" class="e"/>
  <rect x="648" y="188" width="360" height="82" class="b"/><text x="828" y="222" text-anchor="middle" class="t">有候选：同 PCM 重解一次</text><text x="828" y="249" text-anchor="middle" class="s">候选词放前面，不直接改写文字</text>
  <path d="M828 270V313" class="e"/>
  <rect x="648" y="313" width="360" height="84" class="b g"/><text x="828" y="346" text-anchor="middle" class="t">新增命中词 + 长度 ≥ 原文 80%</text><text x="828" y="375" text-anchor="middle" class="s">满足才采用，否则保留第一遍</text>
  <path d="M648 355H586" class="e"/>
  <rect x="286" y="313" width="300" height="84" class="b"/><text x="436" y="346" text-anchor="middle" class="t">ITN + 逐块审核 → Final</text><text x="436" y="375" text-anchor="middle" class="s">保护词形、号码与自然表达</text>
  <path d="M436 270V313" class="e"/><rect x="338" y="280" width="196" height="24" fill="#fff"/><text x="436" y="298" text-anchor="middle" class="s">无候选：保留第一遍</text>
  <path d="M32 425H1008" stroke="#d9e1e5"/>
  <text x="32" y="465" class="t">目标 TS-ASR</text>
  <rect x="32" y="489" width="280" height="78" class="b r"/><text x="172" y="521" text-anchor="middle" class="t">登记参考 + 混合语音</text><text x="172" y="547" text-anchor="middle" class="s">目标约束与热词进入解码</text>
  <path d="M312 528H364" class="e"/>
  <rect x="364" y="489" width="280" height="78" class="b r"/><text x="504" y="521" text-anchor="middle" class="t">解析 → 受限同音纠正</text><text x="504" y="547" text-anchor="middle" class="s">等长、消歧、锚点约束</text>
  <path d="M644 528H696" class="e"/>
  <rect x="696" y="489" width="312" height="78" class="b"/><text x="852" y="521" text-anchor="middle" class="t">ITN → 目标 Final</text><text x="852" y="547" text-anchor="middle" class="s">不能补造漏词，过滤另行验收</text>
  <text x="32" y="605" class="s">已进提示却仍写错：不属于普通补召的适用范围。跨词同音不能成为直接替换的依据。</text>
</svg>
