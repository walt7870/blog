<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">共享热词召回与请求隔离</title><desc id="desc">普通、角色子段和目标识别共用热词解析器，实时召回与管理更新隔离，请求局部结果进入各自模型提示词。</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#52616b"/></marker><style>.b{rx:6;stroke-width:1.5}.h{font:600 23px -apple-system,"PingFang SC",sans-serif;fill:#17252a}.t{font:600 17px -apple-system,"PingFang SC",sans-serif;fill:#17252a}.s{font:14px -apple-system,"PingFang SC",sans-serif;fill:#43545b}.e{fill:none;stroke:#52616b;stroke-width:2;marker-end:url(#a)}</style></defs>
  <rect width="1200" height="520" fill="#fff"/><text x="35" y="43" class="h">共享资源，请求局部结果</text>
  <rect x="35" y="110" width="240" height="105" fill="#edf4fa" stroke="#4280a8" class="b"/><text x="155" y="143" text-anchor="middle" class="t">Finalizer / Preview</text><text x="155" y="170" text-anchor="middle" class="s">普通、角色子段、目标</text><text x="155" y="195" text-anchor="middle" class="s">PCM / pool ID / 显式词</text>
  <rect x="345" y="110" width="240" height="105" fill="#eaf5ed" stroke="#488661" class="b"/><text x="465" y="145" text-anchor="middle" class="t">一个 HotwordResolver</text><text x="465" y="172" text-anchor="middle" class="s">快照 → 编码 → 召回</text><text x="465" y="195" text-anchor="middle" class="s">合并 / 去重 / 预算回退</text><path d="M275 162H345" class="e"/>
  <rect x="665" y="110" width="205" height="105" fill="#fff5e6" stroke="#ae8135" class="b"/><text x="767" y="145" text-anchor="middle" class="t">请求局部热词</text><text x="767" y="172" text-anchor="middle" class="s">不写回共享对象</text><text x="767" y="195" text-anchor="middle" class="s">重试保留提示词</text><path d="M585 162H665" class="e"/>
  <rect x="945" y="90" width="220" height="75" fill="#edf4fa" stroke="#4280a8" class="b"/><text x="1055" y="121" text-anchor="middle" class="t">普通解码</text><text x="1055" y="147" text-anchor="middle" class="s">普通提示词 + 热词</text>
  <rect x="945" y="200" width="220" height="75" fill="#f5eef2" stroke="#a46a84" class="b"/><text x="1055" y="231" text-anchor="middle" class="t">目标解码</text><text x="1055" y="257" text-anchor="middle" class="s">目标约束 + 热词</text><path d="M870 145H910V127H945" class="e"/><path d="M870 180H910V237H945" class="e"/>
  <rect x="345" y="310" width="240" height="92" fill="#eaf5ed" stroke="#488661" class="b"/><text x="465" y="343" text-anchor="middle" class="t">共享实时 RAG worker</text><text x="465" y="370" text-anchor="middle" class="s">音频召回 / 模型向量缓存</text><path d="M465 215V310" class="e"/>
  <rect x="665" y="310" width="205" height="92" fill="#f1f3f4" stroke="#748188" class="b"/><text x="767" y="343" text-anchor="middle" class="t">按池隔离的快照</text><text x="767" y="370" text-anchor="middle" class="s">更新成功后原子替换</text><path d="M665 356H585" class="e"/>
  <rect x="945" y="310" width="220" height="92" fill="#f1f3f4" stroke="#748188" class="b"/><text x="1055" y="343" text-anchor="middle" class="t">独立管理 worker</text><text x="1055" y="370" text-anchor="middle" class="s">文本编码 / 导入 / 重载</text><path d="M945 356H870" class="e"/>
  <text x="35" y="454" class="s">按场景选择内置池与客户池；有效池为空跳过编码；召回失败保留显式词。</text><text x="35" y="483" class="s">目标路径：解析转写 → 受限同音纠正 → ITN；热词传入不等于正确字形必然命中。</text>
</svg>
