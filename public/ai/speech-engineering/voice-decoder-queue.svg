<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="628" viewBox="0 0 1120 628" role="img" aria-labelledby="voice-decoder-queue-title voice-decoder-queue-desc"><title id="voice-decoder-queue-title">连接继续收音，封口任务竞争有限解码容量</title><desc id="voice-decoder-queue-desc">教学快照：队列中有3项等待；容量数字只解释调度，不代表实际设备推荐配置。</desc><defs><marker id="voice-decoder-queue-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#52616b"/></marker><style>text{font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;fill:#17252a;letter-spacing:0}.h{font-size:26px;font-weight:600}.t{font-size:20px;font-weight:600}.s{font-size:17px;fill:#43545b}.b{fill:#edf4fa;stroke:#4280a8;stroke-width:1.5}.g{fill:#eaf5ed;stroke:#488661;stroke-width:1.5}.r{fill:#f5eef2;stroke:#a46a84;stroke-width:1.5}.e{fill:none;stroke:#52616b;stroke-width:2;marker-end:url(#voice-decoder-queue-arrow)}</style></defs><rect width="1120" height="628" fill="white"/><text x="32" y="44" class="h" text-anchor="start">连接继续收音，封口任务竞争有限解码容量</text><text x="32" y="78" class="s" text-anchor="start">教学快照：队列中有3项等待；容量数字只解释调度，不代表实际设备推荐配置。</text><path d="M228 174H270Q278 174 278 182V214Q278 222 286 222H332" class="e"/><path d="M228 286H332" class="e"/><path d="M228 398H270Q278 398 278 390V358Q278 350 286 350H332" class="e"/><path d="M636 270H700" class="e"/><path d="M636 350H664Q672 350 672 358V480Q672 488 680 488H700" class="e"/><path d="M892 270H944" class="e"/><rect x="32" y="132" width="196" height="84" rx="6" class="b"/><text x="48" y="164" class="t" text-anchor="start">会话 A</text><text x="48" y="192" class="s" text-anchor="start">长句已封口</text><rect x="32" y="244" width="196" height="84" rx="6" class="b"/><text x="48" y="276" class="t" text-anchor="start">会话 B</text><text x="48" y="304" class="s" text-anchor="start">短句已封口</text><rect x="32" y="356" width="196" height="84" rx="6" class="b"/><text x="48" y="388" class="t" text-anchor="start">会话 C</text><text x="48" y="416" class="s" text-anchor="start">尾段已封口</text><rect x="332" y="174" width="304" height="216" rx="6" class="b"/><text x="348" y="206" class="t" text-anchor="start">有界任务队列</text><text x="348" y="234" class="s" text-anchor="start">冻结 PCM / 参考 / 提示</text><text x="348" y="260" class="s" text-anchor="start">携带原始 deadline</text><rect x="352" y="300" width="72" height="60" rx="6" class="b"/><text x="368" y="332" class="t" text-anchor="start">A2</text><rect x="440" y="300" width="72" height="60" rx="6" class="b"/><text x="456" y="332" class="t" text-anchor="start">B1</text><rect x="528" y="300" width="72" height="60" rx="6" class="b"/><text x="544" y="332" class="t" text-anchor="start">C3</text><rect x="700" y="190" width="192" height="174" rx="6" class="g"/><text x="716" y="222" class="t" text-anchor="start">单进程解码</text><text x="716" y="250" class="s" text-anchor="start">共享模型权重</text><text x="716" y="276" class="s" text-anchor="start">示例容量 B = 2</text><text x="716" y="302" class="s" text-anchor="start">退出后补入新任务</text><rect x="944" y="214" width="144" height="112" rx="6" class="g"/><text x="960" y="246" class="t" text-anchor="start">结果合并</text><text x="960" y="274" class="s" text-anchor="start">按协议顺序</text><text x="960" y="300" class="s" text-anchor="start">发布 Final</text><rect x="700" y="438" width="388" height="100" rx="6" class="r"/><text x="716" y="470" class="t" text-anchor="start">满队列或截止时间已到</text><text x="716" y="498" class="s" text-anchor="start">拒绝 / 背压 / 明确失败；不能无限等待</text><text x="32" y="488" class="t" text-anchor="start">等待顺序与完成顺序可以不同。</text><text x="32" y="522" class="s" text-anchor="start">长短句、KV cache和角色依赖共同影响等待。</text><text x="32" y="580" class="s" text-anchor="start">取消 HTTP 等待后，原生任务仍占用执行许可；真实线程退出后才能回收容量。</text><text x="32" y="610" class="s" text-anchor="start">示意只展开解码竞争；角色、声纹和热词各有独立队列与资源预算。</text></svg>
