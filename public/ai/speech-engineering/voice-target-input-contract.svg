<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="626" viewBox="0 0 1120 626" role="img" aria-labelledby="voice-target-input-contract-title voice-target-input-contract-desc"><title id="voice-target-input-contract-title">目标条件来自参考编码，SEP 是模型训练得到的表示</title><desc id="voice-target-input-contract-desc">支持 learned SEP 的目标模型示意；门控是否开启，不改变必须携带登记参考的输入合同。</desc><defs><marker id="voice-target-input-contract-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#52616b"/></marker><style>text{font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;fill:#17252a;letter-spacing:0}.h{font-size:26px;font-weight:600}.t{font-size:20px;font-weight:600}.s{font-size:17px;fill:#43545b}.b{fill:#edf4fa;stroke:#4280a8;stroke-width:1.5}.g{fill:#eaf5ed;stroke:#488661;stroke-width:1.5}.r{fill:#f5eef2;stroke:#a46a84;stroke-width:1.5}.e{fill:none;stroke:#52616b;stroke-width:2;marker-end:url(#voice-target-input-contract-arrow)}</style></defs><rect width="1120" height="626" fill="white"/><text x="32" y="44" class="h" text-anchor="start">目标条件来自参考编码，SEP 是模型训练得到的表示</text><text x="32" y="78" class="s" text-anchor="start">支持 learned SEP 的目标模型示意；门控是否开启，不改变必须携带登记参考的输入合同。</text><path d="M266 186H328" class="e"/><path d="M266 350H328" class="e"/><path d="M576 186H606Q614 186 614 194V236Q614 244 622 244H656" class="e"/><path d="M576 350H606Q614 350 614 342V308Q614 300 622 300H656" class="e"/><path d="M1048 340V408" class="e"/><rect x="32" y="132" width="234" height="108" rx="6" class="b"/><text x="48" y="164" class="t" text-anchor="start">登记参考波形</text><text x="48" y="192" class="s" text-anchor="start">参考身份与版本</text><text x="48" y="218" class="s" text-anchor="start">有效语音、固定截取边界</text><rect x="32" y="296" width="234" height="108" rx="6" class="b"/><text x="48" y="328" class="t" text-anchor="start">当前混合语音</text><text x="48" y="356" class="s" text-anchor="start">保留目标上下文</text><text x="48" y="382" class="s" text-anchor="start">原始样本区间不变</text><rect x="328" y="132" width="248" height="108" rx="6" class="b"/><text x="344" y="164" class="t" text-anchor="start">参考编码</text><text x="344" y="192" class="s" text-anchor="start">输出长度 E(R)</text><text x="344" y="218" class="s" text-anchor="start">不能用声纹向量代替</text><rect x="328" y="296" width="248" height="108" rx="6" class="b"/><text x="344" y="328" class="t" text-anchor="start">混合音频编码</text><text x="344" y="356" class="s" text-anchor="start">输出长度 E(M)</text><text x="344" y="382" class="s" text-anchor="start">按实际前处理计算</text><rect x="656" y="174" width="432" height="166" rx="6" class="g"/><text x="672" y="206" class="t" text-anchor="start">按训练顺序装配</text><text x="672" y="234" class="s" text-anchor="start">[参考编码, learned SEP, 混合编码]</text><text x="672" y="260" class="s" text-anchor="start">占位符数量 = E(R) + 1 + E(M)</text><text x="672" y="286" class="s" text-anchor="start">SEP 不是静音波形或字符串</text><rect x="656" y="408" width="432" height="100" rx="6" class="g"/><text x="672" y="440" class="t" text-anchor="start">目标解码与输出核对</text><text x="672" y="468" class="s" text-anchor="start">正例保留与负例误输出分别验收</text><text x="32" y="480" class="t" text-anchor="start">参考缺失：明确失败，不自动放开目标约束。</text><text x="32" y="554" class="s" text-anchor="start">编码长度由模型决定，E(R + M) 不保证等于 E(R) + E(M)；漏掉 SEP 会使占位符错位。</text><text x="32" y="590" class="s" text-anchor="start">门控、参考条件和模型能力分开验证；传入参考不等于已经证明非目标输出为空。</text></svg>
