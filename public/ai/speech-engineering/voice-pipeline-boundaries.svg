<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" role="img" aria-labelledby="voice-pipeline-boundaries-title voice-pipeline-boundaries-desc">
  <title id="voice-pipeline-boundaries-title">流式语音处理边界</title>
  <desc id="voice-pipeline-boundaries-desc">从客户端 PCM 到会话编排、VAD、角色证据、普通和目标 ASR，再到结果冻结和兼容协议输出的流程图。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker>
    <style>
      .box{stroke-width:2;rx:12;ry:12}.label{font:600 18px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#0f172a}.sub{font:14px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#334155}.edge{stroke:#475569;stroke-width:2;fill:none;marker-end:url(#arrow)}.note{font:13px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#475569}
    </style>
  </defs>
  <rect width="1200" height="540" fill="#f8fafc"/>
  <text x="60" y="48" class="label" font-size="24">流式语音处理边界</text>
  <text x="60" y="75" class="note">每一层只对自己的输入、输出和生命周期负责</text>
  <rect x="50" y="125" width="150" height="86" fill="#dbeafe" stroke="#2563eb" class="box"/>
  <text x="125" y="160" text-anchor="middle" class="label">客户端</text><text x="125" y="187" text-anchor="middle" class="sub">PCM / 控制帧</text>
  <rect x="245" y="125" width="170" height="86" fill="#e0f2fe" stroke="#0284c7" class="box"/>
  <text x="330" y="160" text-anchor="middle" class="label">会话编排</text><text x="330" y="187" text-anchor="middle" class="sub">顺序 / 生命周期</text>
  <rect x="460" y="125" width="150" height="86" fill="#dcfce7" stroke="#16a34a" class="box"/>
  <text x="535" y="160" text-anchor="middle" class="label">VAD</text><text x="535" y="187" text-anchor="middle" class="sub">语音边界</text>
  <rect x="655" y="125" width="180" height="86" fill="#fef3c7" stroke="#d97706" class="box"/>
  <text x="745" y="160" text-anchor="middle" class="label">角色证据</text><text x="745" y="187" text-anchor="middle" class="sub">匿名槽位 / 区间</text>
  <rect x="880" y="90" width="150" height="76" fill="#f1f5f9" stroke="#64748b" class="box"/>
  <text x="955" y="123" text-anchor="middle" class="label">普通 ASR</text><text x="955" y="147" text-anchor="middle" class="sub">常规转写</text>
  <rect x="880" y="185" width="150" height="76" fill="#f1f5f9" stroke="#64748b" class="box"/>
  <text x="955" y="218" text-anchor="middle" class="label">目标 ASR</text><text x="955" y="242" text-anchor="middle" class="sub">角色门控</text>
  <rect x="655" y="330" width="180" height="86" fill="#fce7f3" stroke="#db2777" class="box"/>
  <text x="745" y="365" text-anchor="middle" class="label">结果合并</text><text x="745" y="392" text-anchor="middle" class="sub">Preview / Final 冻结</text>
  <rect x="880" y="330" width="220" height="86" fill="#ede9fe" stroke="#7c3aed" class="box"/>
  <text x="990" y="365" text-anchor="middle" class="label">兼容协议输出</text><text x="990" y="392" text-anchor="middle" class="sub">事件 / 字段 / terminal</text>
  <path d="M200 168 H245" class="edge"/><path d="M415 168 H460" class="edge"/><path d="M610 168 H655" class="edge"/>
  <path d="M535 125 V105 H880" class="edge"/><path d="M835 205 H880" class="edge"/>
  <path d="M745 211 V330" class="edge"/><path d="M955 261 V300 H835 V373" class="edge"/><path d="M955 166 V300 H835" class="edge"/>
  <path d="M835 373 H880" class="edge"/>
  <text x="53" y="475" class="note">角色槽位是会话内证据，不自动等于注册身份；Final 之后结果进入只读状态。</text>
  <text x="53" y="500" class="note">内部可以替换模型，客户端继续消费稳定的协议字段。</text>
</svg>
