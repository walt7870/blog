<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="500" viewBox="0 0 1120 500" role="img" aria-labelledby="order-cancel-state-title order-cancel-state-desc">
  <title id="order-cancel-state-title">订单取消的状态与查询失败</title><desc id="order-cancel-state-desc">CREATED 取消得到 CANCELLED；CANCELLED 再取消返回自身，不再保存；PAID 拒绝且保持原状态；未知 UUID 是查询失败，不是订单状态。</desc>
  <defs><marker id="order-cancel-state-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0L8 3L0 6Z" fill="#64748b"/></marker><style>text{font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#0f172a;letter-spacing:0}.title{font-size:26px;font-weight:700}.h{font-size:22px;font-weight:700}.b{font-size:17px;fill:#475569}.box{fill:white;stroke:#cbd5e1;stroke-width:1.5}.core{fill:#ecfdf5;stroke:#0f766e;stroke-width:2}.line{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#order-cancel-state-arrow)}</style></defs>
  <rect width="1120" height="500" fill="#f8fafc"/><text class="title" x="40" y="48">状态转换与查询结果分开建模</text>
  <path class="line" d="M330 190H680"/>
  <path class="line" d="M950 150V107Q950 97 940 97H780Q770 97 770 107V150"/>
  <rect class="box" x="80" y="150" width="250" height="100" rx="8"/><text class="h" x="205" y="190" text-anchor="middle">CREATED</text><text class="b" x="205" y="223" text-anchor="middle">原订单保持不变</text>
  <rect x="405" y="151" width="200" height="28" fill="#f8fafc"/><text class="b" x="505" y="171" text-anchor="middle">cancel / 保存新副本</text>
  <rect class="core" x="680" y="150" width="300" height="100" rx="8"/><text class="h" x="830" y="190" text-anchor="middle">CANCELLED</text><text class="b" x="830" y="223" text-anchor="middle">返回成功 / HTTP 200</text>
  <text class="b" x="860" y="82" text-anchor="middle">再次 cancel：返回自身，不再保存</text>
  <rect class="box" x="80" y="305" width="250" height="100" rx="8"/><text class="h" x="205" y="345" text-anchor="middle">PAID</text><text class="b" x="205" y="378" text-anchor="middle">拒绝取消，保持 PAID</text>
  <text class="b" x="390" y="341">领域异常 → Advice → HTTP 409</text><text class="b" x="390" y="376">不保存；没有 PAID → CANCELLED 的边。</text>
  <path d="M40 432H1080" stroke="#cbd5e1"/><text class="b" x="40" y="468">未知 UUID：Repository 返回空 → 应用异常 → HTTP 404；它不是订单的一种状态。</text>
</svg>
