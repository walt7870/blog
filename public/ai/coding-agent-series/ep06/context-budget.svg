<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="570" viewBox="0 0 1120 570" role="img" aria-labelledby="context-budget-t context-budget-d">
<title id="context-budget-t">上下文预算怎样被消耗</title><desc id="context-budget-d">示意图：系统指令与工具说明是每轮固定成本，常驻规则每轮加载，代码与文档随探索增加，命令输出一次可能占很多，对话历史持续累积；接近窗口上限时 Harness 压缩，历史变成摘要、日志退出，但摘要可能丢掉关键约束。</desc>
<defs><marker id="context-budget-a" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#596775"/></marker>
<marker id="context-budget-r" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#b4473b"/></marker>
<marker id="context-budget-g" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#74a28b"/></marker></defs>
<rect width="1120" height="570" fill="#f7f9fb"/>
<g font-family="Arial, 'PingFang SC', sans-serif" fill="#23313d">
<text x="40" y="52" font-size="26" fill="#23313d" font-weight="600">上下文预算怎样被消耗</text><text x="40" y="84" font-size="16" fill="#52616d">示意：各轮占窗口的比例为教学数据，用来说明哪一类最先膨胀。</text><text x="214" y="155" font-size="15" fill="#52616d" font-weight="600" text-anchor="end">第 1 轮：读任务</text><rect x="230" y="130" width="106" height="38" fill="#eef1f4" stroke="#8fa3b1"/><rect x="336" y="130" width="61" height="38" fill="#eaf3fb" stroke="#7694aa"/><rect x="397" y="130" width="46" height="38" fill="#e8f5ef" stroke="#74a28b"/><rect x="443" y="130" width="15" height="38" fill="#e9e4f5" stroke="#8e7cc3"/><text x="214" y="217" font-size="15" fill="#52616d" font-weight="600" text-anchor="end">第 2 轮：搜索代码</text><rect x="230" y="192" width="106" height="38" fill="#eef1f4" stroke="#8fa3b1"/><rect x="336" y="192" width="61" height="38" fill="#eaf3fb" stroke="#7694aa"/><rect x="397" y="192" width="152" height="38" fill="#e8f5ef" stroke="#74a28b"/><rect x="549" y="192" width="15" height="38" fill="#fdf1e4" stroke="#c7782f"/><rect x="564" y="192" width="46" height="38" fill="#e9e4f5" stroke="#8e7cc3"/><text x="214" y="279" font-size="15" fill="#52616d" font-weight="600" text-anchor="end">第 3 轮：跑测试</text><rect x="230" y="254" width="106" height="38" fill="#eef1f4" stroke="#8fa3b1"/><rect x="336" y="254" width="61" height="38" fill="#eaf3fb" stroke="#7694aa"/><rect x="397" y="254" width="167" height="38" fill="#e8f5ef" stroke="#74a28b"/><rect x="564" y="254" width="182" height="38" fill="#fdf1e4" stroke="#c7782f"/><rect x="747" y="254" width="76" height="38" fill="#e9e4f5" stroke="#8e7cc3"/><text x="214" y="341" font-size="15" fill="#52616d" font-weight="600" text-anchor="end">第 4 轮：再修一次</text><rect x="230" y="316" width="106" height="38" fill="#eef1f4" stroke="#8fa3b1"/><rect x="336" y="316" width="61" height="38" fill="#eaf3fb" stroke="#7694aa"/><rect x="397" y="316" width="198" height="38" fill="#e8f5ef" stroke="#74a28b"/><rect x="595" y="316" width="228" height="38" fill="#fdf1e4" stroke="#c7782f"/><rect x="823" y="316" width="122" height="38" fill="#e9e4f5" stroke="#8e7cc3"/><text x="214" y="403" font-size="15" fill="#74a28b" font-weight="600" text-anchor="end">压缩之后</text><rect x="230" y="378" width="106" height="38" fill="#eef1f4" stroke="#8fa3b1"/><rect x="336" y="378" width="61" height="38" fill="#eaf3fb" stroke="#7694aa"/><rect x="397" y="378" width="76" height="38" fill="#e8f5ef" stroke="#74a28b"/><rect x="473" y="378" width="61" height="38" fill="#e9e4f5" stroke="#8e7cc3"/><text x="546.0" y="403" font-size="14" fill="#74a28b">历史换成摘要，日志退出</text><path d="M929 116V440" stroke="#b4473b" stroke-width="2" stroke-dasharray="6 5"/><text x="921.2" y="112" font-size="14" fill="#b4473b" text-anchor="end">Harness 开始压缩</text><text x="990" y="112" font-size="14" fill="#7a8794" text-anchor="end">窗口上限</text><path d="M990 116V440" stroke="#7a8794" stroke-width="1"/><rect x="40" y="458" width="18" height="14" fill="#eef1f4" stroke="#8fa3b1"/><text x="66" y="470" font-size="14" fill="#52616d">固定：系统指令与工具</text><rect x="250" y="458" width="18" height="14" fill="#eaf3fb" stroke="#7694aa"/><text x="276" y="470" font-size="14" fill="#52616d">常驻规则</text><rect x="460" y="458" width="18" height="14" fill="#e8f5ef" stroke="#74a28b"/><text x="486" y="470" font-size="14" fill="#52616d">代码与文档</text><rect x="670" y="458" width="18" height="14" fill="#fdf1e4" stroke="#c7782f"/><text x="696" y="470" font-size="14" fill="#52616d">命令输出</text><rect x="880" y="458" width="18" height="14" fill="#e9e4f5" stroke="#8e7cc3"/><text x="906" y="470" font-size="14" fill="#52616d">对话历史</text><rect x="40" y="492" width="1040" height="52" rx="6" fill="#fbeceb" stroke="#b4473b"/><text x="60" y="524" font-size="15" fill="#23313d">压缩风险：摘要容易留下目标和结论，省掉“PAID 不允许取消”这类字数少、风险高的约束。关键约束要写进任务、测试或规则。</text>
</g></svg>
