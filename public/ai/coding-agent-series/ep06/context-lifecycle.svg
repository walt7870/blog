<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="560" viewBox="0 0 1120 560" role="img" aria-labelledby="context-lifecycle-t context-lifecycle-d">
<title id="context-lifecycle-t">上下文生命周期：进入、使用、沉淀或退出</title><desc id="context-lifecycle-d">信息从任务和仓库规则创建，经搜索和按需加载被选择，支持一次决策，再由编译、测试和日志验证；验证失败带着反馈回到选择；稳定知识沉淀到测试、设计记录、README 或 AGENTS.md、规则与 Hook、Skill，临时日志和被推翻的假设退出；下一个任务从仓库重新读取沉淀。</desc>
<defs><marker id="context-lifecycle-a" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#596775"/></marker>
<marker id="context-lifecycle-r" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#b4473b"/></marker>
<marker id="context-lifecycle-g" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#74a28b"/></marker></defs>
<rect width="1120" height="560" fill="#f7f9fb"/>
<g font-family="Arial, 'PingFang SC', sans-serif" fill="#23313d">
<text x="40" y="52" font-size="26" fill="#23313d" font-weight="600">上下文生命周期：进入、使用、沉淀或退出</text><text x="40" y="84" font-size="16" fill="#52616d">会话里的信息有两种去向：稳定的写回仓库，临时的及时退出。</text><rect x="40" y="140" width="200" height="86" rx="6" fill="#eef1f4" stroke="#7694aa"/><text x="56" y="170" font-size="17" fill="#23313d" font-weight="600">创建</text><text x="56" y="196" font-size="14" fill="#52616d">任务与仓库规则</text><path d="M242 183H266" fill="none" stroke="#596775" stroke-width="2" marker-end="url(#context-lifecycle-a)"/><rect x="270" y="140" width="200" height="86" rx="6" fill="#eaf3fb" stroke="#7694aa"/><text x="286" y="170" font-size="17" fill="#23313d" font-weight="600">选择</text><text x="286" y="196" font-size="14" fill="#52616d">搜索、按需加载</text><path d="M472 183H496" fill="none" stroke="#596775" stroke-width="2" marker-end="url(#context-lifecycle-a)"/><rect x="500" y="140" width="200" height="86" rx="6" fill="#eaf3fb" stroke="#7694aa"/><text x="516" y="170" font-size="17" fill="#23313d" font-weight="600">使用</text><text x="516" y="196" font-size="14" fill="#52616d">支持一次决策</text><path d="M702 183H726" fill="none" stroke="#596775" stroke-width="2" marker-end="url(#context-lifecycle-a)"/><rect x="730" y="140" width="200" height="86" rx="6" fill="#eaf3fb" stroke="#7694aa"/><text x="746" y="170" font-size="17" fill="#23313d" font-weight="600">验证</text><text x="746" y="196" font-size="14" fill="#52616d">编译、测试、日志</text><path d="M830 138V118H270V136" fill="none" stroke="#b4473b" stroke-width="2" marker-end="url(#context-lifecycle-r)"/><text x="550" y="112" font-size="14" fill="#b4473b" text-anchor="middle">验证失败：带着反馈回到选择</text><path d="M800 228V272H290V316" fill="none" stroke="#74a28b" stroke-width="2" marker-end="url(#context-lifecycle-g)"/><text x="545" y="264" font-size="14" fill="#74a28b" text-anchor="middle">稳定的知识</text><path d="M880 228V316" fill="none" stroke="#596775" stroke-width="2" marker-end="url(#context-lifecycle-a)"/><text x="892" y="278" font-size="14" fill="#52616d">临时的信息</text><rect x="40" y="320" width="500" height="190" rx="6" fill="#e8f5ef" stroke="#74a28b"/><text x="56" y="350" font-size="17" fill="#23313d" font-weight="600">沉淀：写回仓库</text><text x="60" y="378" font-size="15" fill="#52616d">业务行为 → 测试和任务规格</text><text x="60" y="404" font-size="15" fill="#52616d">架构选择 → 设计记录</text><text x="60" y="430" font-size="15" fill="#52616d">构建命令 → README 或 AGENTS.md</text><text x="60" y="456" font-size="15" fill="#52616d">高频错误 → 规则、Linter 或 Hook</text><text x="60" y="482" font-size="15" fill="#52616d">低频流程 → Skill</text><rect x="580" y="320" width="500" height="120" rx="6" fill="#eef1f4" stroke="#8fa3b1"/><text x="596" y="350" font-size="17" fill="#23313d" font-weight="600">退出：不再留在上下文里</text><text x="596" y="376" font-size="14" fill="#52616d">成功构建的完整日志、试错的候选方案</text><text x="596" y="398" font-size="14" fill="#52616d">已被推翻的假设、完成后的临时调查笔记</text><path d="M40 470H24V183H36" fill="none" stroke="#74a28b" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#context-lifecycle-g)"/><text x="40" y="540" font-size="14" fill="#74a28b">虚线：下一个任务从仓库里重新读取这些沉淀，而不是继承上一段聊天。</text>
</g></svg>
