<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="550" viewBox="0 0 1120 550" role="img" aria-labelledby="retrieval-pipeline-t retrieval-pipeline-d">
<title id="retrieval-pipeline-t">代码检索从任务实体开始</title><desc id="retrieval-pipeline-d">检索顺序：目录与构建文件，任务实体与入口，定义、引用与调用者，相邻测试与相似实现，最后形成五到八个文件的最小集合；直接读取整个 src 会让无关内容占满预算；命中文件要用调用关系、运行行为和版本历史交叉确认。</desc>
<defs><marker id="retrieval-pipeline-a" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#596775"/></marker>
<marker id="retrieval-pipeline-r" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#b4473b"/></marker>
<marker id="retrieval-pipeline-g" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#74a28b"/></marker></defs>
<rect width="1120" height="550" fill="#f7f9fb"/>
<g font-family="Arial, 'PingFang SC', sans-serif" fill="#23313d">
<text x="40" y="52" font-size="26" fill="#23313d" font-weight="600">代码检索从任务实体开始</text><text x="40" y="84" font-size="16" fill="#52616d">任务：实现取消订单。每一步只把下一步需要的文件加进来。</text><rect x="40" y="120" width="188" height="118" rx="6" fill="#fff" stroke="#8fa3b1"/><text x="56" y="150" font-size="16" fill="#23313d" font-weight="600">目录与构建文件</text><text x="56" y="176" font-size="14" fill="#52616d">pom.xml、模块划分</text><text x="56" y="198" font-size="14" fill="#52616d">测试怎么运行</text><path d="M230 179H248" fill="none" stroke="#596775" stroke-width="2" marker-end="url(#retrieval-pipeline-a)"/><rect x="252" y="120" width="188" height="118" rx="6" fill="#fff" stroke="#8fa3b1"/><text x="268" y="150" font-size="16" fill="#23313d" font-weight="600">任务实体与入口</text><text x="268" y="176" font-size="14" fill="#52616d">Order、cancel</text><text x="268" y="198" font-size="14" fill="#52616d">POST /orders/{id}/cancel</text><path d="M442 179H460" fill="none" stroke="#596775" stroke-width="2" marker-end="url(#retrieval-pipeline-a)"/><rect x="464" y="120" width="188" height="118" rx="6" fill="#fff" stroke="#8fa3b1"/><text x="480" y="150" font-size="16" fill="#23313d" font-weight="600">定义、引用与调用者</text><text x="480" y="176" font-size="14" fill="#52616d">OrderService.cancel</text><text x="480" y="198" font-size="14" fill="#52616d">谁调用、谁被调用</text><path d="M654 179H672" fill="none" stroke="#596775" stroke-width="2" marker-end="url(#retrieval-pipeline-a)"/><rect x="676" y="120" width="188" height="118" rx="6" fill="#fff" stroke="#8fa3b1"/><text x="692" y="150" font-size="16" fill="#23313d" font-weight="600">相邻测试与相似实现</text><text x="692" y="176" font-size="14" fill="#52616d">OrderServiceTest</text><text x="692" y="198" font-size="14" fill="#52616d">已有的状态流转</text><path d="M866 179H884" fill="none" stroke="#596775" stroke-width="2" marker-end="url(#retrieval-pipeline-a)"/><rect x="888" y="120" width="188" height="118" rx="6" fill="#e8f5ef" stroke="#74a28b"/><text x="904" y="150" font-size="16" fill="#23313d" font-weight="600">最小相关文件集</text><text x="904" y="176" font-size="14" fill="#52616d">五到八个文件</text><text x="904" y="198" font-size="14" fill="#52616d">进入上下文</text><rect x="40" y="280" width="1040" height="92" rx="6" fill="#fbeceb" stroke="#b4473b"/><text x="60" y="314" font-size="17" fill="#b4473b" font-weight="600">直接读取整个 src</text><text x="60" y="344" font-size="15" fill="#23313d">配置、支付、无关示例一起进入：预算被占满，同名旧模块被当成当前实现，决策信号被稀释。</text><rect x="40" y="400" width="1040" height="120" rx="6" fill="#fff" stroke="#8fa3b1"/><text x="60" y="434" font-size="17" fill="#23313d" font-weight="600">命中的文件还要交叉确认</text><text x="60" y="464" font-size="15" fill="#52616d">已废弃的模块、过时的注释、只覆盖旧路径的测试都会被搜到。</text><text x="60" y="492" font-size="15" fill="#52616d">用三样东西核对：代码当前的调用关系、实际运行行为、版本控制里的最近修改。</text>
</g></svg>
