<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="550" viewBox="0 0 1120 550" role="img" aria-labelledby="context-debugging-t context-debugging-d">
<title id="context-debugging-t">Context Debugging：调试 Agent 看到了什么</title><desc id="context-debugging-d">结果异常时依次检查六个问题：在哪一步首次偏离、当时读了哪些文件和工具结果、有无过期规则或错误假设、关键非目标是否在压缩后消失、工具描述是否误导、测试反馈是否过弱；然后缩小上下文加入权威证据，用只追踪调用链的小任务验证。</desc>
<defs><marker id="context-debugging-a" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#596775"/></marker>
<marker id="context-debugging-r" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#b4473b"/></marker>
<marker id="context-debugging-g" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#74a28b"/></marker></defs>
<rect width="1120" height="550" fill="#f7f9fb"/>
<g font-family="Arial, 'PingFang SC', sans-serif" fill="#23313d">
<text x="40" y="52" font-size="26" fill="#23313d" font-weight="600">Context Debugging：调试 Agent 看到了什么</text><text x="40" y="84" font-size="16" fill="#52616d">结果异常时，先查它当时的输入，再改指令。</text><rect x="40" y="112" width="200" height="70" rx="6" fill="#fbeceb" stroke="#b4473b"/><text x="60" y="154" font-size="18" fill="#23313d" font-weight="600">结果异常</text><rect x="290" y="112" width="250" height="84" rx="6" fill="#fff" stroke="#8fa3b1"/><text x="306" y="142" font-size="16" fill="#23313d" font-weight="600">1 首次偏离</text><text x="306" y="168" font-size="14" fill="#52616d">它在哪一步开始偏离任务？</text><rect x="560" y="112" width="250" height="84" rx="6" fill="#fff" stroke="#8fa3b1"/><text x="576" y="142" font-size="16" fill="#23313d" font-weight="600">2 当时的输入</text><text x="576" y="168" font-size="14" fill="#52616d">那一步读了哪些文件和工具结果？</text><rect x="830" y="112" width="250" height="84" rx="6" fill="#fff" stroke="#8fa3b1"/><text x="846" y="142" font-size="16" fill="#23313d" font-weight="600">3 过期信息</text><text x="846" y="168" font-size="14" fill="#52616d">有没有过期规则或错误的用户假设？</text><rect x="290" y="216" width="250" height="84" rx="6" fill="#fff" stroke="#8fa3b1"/><text x="306" y="246" font-size="16" fill="#23313d" font-weight="600">4 压缩丢失</text><text x="306" y="272" font-size="14" fill="#52616d">关键非目标是否在压缩后消失？</text><rect x="560" y="216" width="250" height="84" rx="6" fill="#fff" stroke="#8fa3b1"/><text x="576" y="246" font-size="16" fill="#23313d" font-weight="600">5 工具误导</text><text x="576" y="272" font-size="14" fill="#52616d">工具描述是否让它选错了能力？</text><rect x="830" y="216" width="250" height="84" rx="6" fill="#fff" stroke="#8fa3b1"/><text x="846" y="246" font-size="16" fill="#23313d" font-weight="600">6 反馈过弱</text><text x="846" y="272" font-size="14" fill="#52616d">测试是否给了错误或太弱的反馈？</text><path d="M242 147H286" fill="none" stroke="#596775" stroke-width="2" marker-end="url(#context-debugging-a)"/><path d="M955 198V206H415V212" fill="none" stroke="#596775" stroke-width="2" marker-end="url(#context-debugging-a)"/><rect x="40" y="340" width="500" height="104" rx="6" fill="#e8f5ef" stroke="#74a28b"/><text x="60" y="372" font-size="17" fill="#23313d" font-weight="600">修正：缩小上下文，加入权威证据</text><text x="60" y="400" font-size="14" fill="#52616d">删掉噪声，引用真实文件和当前规则。</text><text x="60" y="424" font-size="14" fill="#52616d">每个验证证据都写明目录和目标模块。</text><rect x="580" y="340" width="500" height="104" rx="6" fill="#e8f5ef" stroke="#74a28b"/><text x="600" y="372" font-size="17" fill="#23313d" font-weight="600">验证：用一个小任务重跑</text><text x="600" y="400" font-size="14" fill="#52616d">例如只追踪创建订单的调用链，不允许编辑。</text><text x="600" y="424" font-size="14" fill="#52616d">仍读错模块，问题在仓库地图或搜索。</text><path d="M415 302V336" fill="none" stroke="#74a28b" stroke-width="2" marker-end="url(#context-debugging-g)"/><path d="M542 392H576" fill="none" stroke="#74a28b" stroke-width="2" marker-end="url(#context-debugging-g)"/><rect x="40" y="468" width="1040" height="52" rx="6" fill="#fff" stroke="#8fa3b1"/><text x="60" y="500" font-size="15" fill="#52616d">Monorepo 里命令成功不等于验证了正确对象：Agent 可能在根目录跑了另一个模块的脚本。</text>
</g></svg>
