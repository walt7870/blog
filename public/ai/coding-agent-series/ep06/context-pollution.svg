<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="540" viewBox="0 0 1120 540" role="img" aria-labelledby="context-pollution-t context-pollution-d">
<title id="context-pollution-t">上下文污染怎样形成错误轨迹</title><desc id="context-pollution-d">第 2 轮读到旧模块并推断取消要退款，错误进入计划、代码和测试，测试按同一假设编写并全部通过，结果自洽但偏离任务；修复路径是定位错误首次出现、在任务文件写明废弃假设与新证据、只撤销本次错误 Diff、必要时用 handoff 开新会话。</desc>
<defs><marker id="context-pollution-a" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#596775"/></marker>
<marker id="context-pollution-r" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#b4473b"/></marker>
<marker id="context-pollution-g" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#74a28b"/></marker></defs>
<rect width="1120" height="540" fill="#f7f9fb"/>
<g font-family="Arial, 'PingFang SC', sans-serif" fill="#23313d">
<text x="40" y="52" font-size="26" fill="#23313d" font-weight="600">上下文污染怎样形成错误轨迹</text><text x="40" y="84" font-size="16" fill="#52616d">错误假设进入计划后，后续每一步都围绕它构建，测试也一起被带偏。</text><rect x="40" y="120" width="188" height="110" rx="6" fill="#fbeceb" stroke="#b4473b"/><text x="56" y="150" font-size="16" fill="#23313d" font-weight="600">第 2 轮：读到旧模块</text><text x="56" y="176" font-size="14" fill="#52616d">LegacyOrderService</text><text x="56" y="198" font-size="14" fill="#52616d">推断“取消要退款”</text><path d="M230 175H248" fill="none" stroke="#b4473b" stroke-width="2" marker-end="url(#context-pollution-r)"/><rect x="252" y="120" width="188" height="110" rx="6" fill="#fff" stroke="#8fa3b1"/><text x="268" y="150" font-size="16" fill="#23313d" font-weight="600">计划</text><text x="268" y="176" font-size="14" fill="#52616d">加入退款步骤</text><path d="M442 175H460" fill="none" stroke="#596775" stroke-width="2" marker-end="url(#context-pollution-a)"/><rect x="464" y="120" width="188" height="110" rx="6" fill="#fff" stroke="#8fa3b1"/><text x="480" y="150" font-size="16" fill="#23313d" font-weight="600">代码</text><text x="480" y="176" font-size="14" fill="#52616d">cancel 调用退款接口</text><path d="M654 175H672" fill="none" stroke="#596775" stroke-width="2" marker-end="url(#context-pollution-a)"/><rect x="676" y="120" width="188" height="110" rx="6" fill="#fff" stroke="#8fa3b1"/><text x="692" y="150" font-size="16" fill="#23313d" font-weight="600">测试</text><text x="692" y="176" font-size="14" fill="#52616d">按同一假设编写</text><text x="692" y="198" font-size="14" fill="#52616d">全部通过</text><path d="M866 175H884" fill="none" stroke="#596775" stroke-width="2" marker-end="url(#context-pollution-a)"/><rect x="888" y="120" width="188" height="110" rx="6" fill="#fbeceb" stroke="#b4473b"/><text x="904" y="150" font-size="16" fill="#23313d" font-weight="600">结果偏离任务</text><text x="904" y="176" font-size="14" fill="#52616d">自洽，但错了</text><text x="134" y="256" font-size="14" fill="#b4473b" font-weight="600" text-anchor="middle">▲ 错误首次出现</text><text x="40" y="300" font-size="18" fill="#74a28b" font-weight="600">修复路径</text><rect x="40" y="316" width="240" height="112" rx="6" fill="#e8f5ef" stroke="#74a28b"/><text x="56" y="346" font-size="16" fill="#23313d" font-weight="600">定位首次出现</text><text x="56" y="372" font-size="14" fill="#52616d">找到最早引入</text><text x="56" y="394" font-size="14" fill="#52616d">错误假设的那一轮</text><path d="M282 372H300" fill="none" stroke="#74a28b" stroke-width="2" marker-end="url(#context-pollution-g)"/><rect x="304" y="316" width="240" height="112" rx="6" fill="#e8f5ef" stroke="#74a28b"/><text x="320" y="346" font-size="16" fill="#23313d" font-weight="600">写明废弃与新证据</text><text x="320" y="372" font-size="14" fill="#52616d">在任务文件里</text><text x="320" y="394" font-size="14" fill="#52616d">标注旧假设已作废</text><path d="M546 372H564" fill="none" stroke="#74a28b" stroke-width="2" marker-end="url(#context-pollution-g)"/><rect x="568" y="316" width="240" height="112" rx="6" fill="#e8f5ef" stroke="#74a28b"/><text x="584" y="346" font-size="16" fill="#23313d" font-weight="600">只撤本次错误 Diff</text><text x="584" y="372" font-size="14" fill="#52616d">保留用户未提交的改动</text><text x="584" y="394" font-size="14" fill="#52616d">交织时先存补丁</text><path d="M810 372H828" fill="none" stroke="#74a28b" stroke-width="2" marker-end="url(#context-pollution-g)"/><rect x="832" y="316" width="240" height="112" rx="6" fill="#e8f5ef" stroke="#74a28b"/><text x="848" y="346" font-size="16" fill="#23313d" font-weight="600">必要时开新会话</text><text x="848" y="372" font-size="14" fill="#52616d">用简短 handoff</text><text x="848" y="394" font-size="14" fill="#52616d">代替长聊天历史</text><rect x="40" y="452" width="1040" height="56" rx="6" fill="#fff" stroke="#8fa3b1"/><text x="60" y="486" font-size="15" fill="#52616d">在聊天里追加一句纠正，不会删掉历史里的错误信息；会话越长，模型越倾向维护已经建立的解释。</text>
</g></svg>
