<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="570" viewBox="0 0 1120 570" role="img" aria-labelledby="prompt-in-context-t prompt-in-context-d">
<title id="prompt-in-context-t">Prompt 只是模型这一轮看到的一部分</title><desc id="prompt-in-context-d">模型一轮看到的上下文包括系统指令、工具说明、仓库规则、对话历史、检索结果与 Diff、终端输出，用户 Prompt 只是其中一行；Prompt 与规则冲突、引用错文件或缺少测试环境时，改写措辞解决不了，应先确认事实来源和工具。</desc>
<defs><marker id="prompt-in-context-a" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#596775"/></marker>
<marker id="prompt-in-context-r" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#b4473b"/></marker>
<marker id="prompt-in-context-g" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#74a28b"/></marker></defs>
<rect width="1120" height="570" fill="#f7f9fb"/>
<g font-family="Arial, 'PingFang SC', sans-serif" fill="#23313d">
<text x="40" y="52" font-size="26" fill="#23313d" font-weight="600">Prompt 只是模型这一轮看到的一部分</text><text x="40" y="84" font-size="16" fill="#52616d">用户说“实现取消订单”时，这句话和下面这些内容一起进入模型。</text><rect x="40" y="110" width="640" height="430" rx="6" fill="#fff" stroke="#8fa3b1"/><text x="60" y="140" font-size="17" fill="#23313d" font-weight="600">模型这一轮实际看到的上下文</text><rect x="60" y="158" width="600" height="42" rx="6" fill="#eef1f4" stroke="#8fa3b1"/><text x="76" y="185" font-size="16" fill="#23313d" font-weight="600">系统与安全指令</text><text x="644" y="185" font-size="14" fill="#52616d" text-anchor="end">Harness 提供，每轮都在</text><rect x="60" y="210" width="600" height="42" rx="6" fill="#eef1f4" stroke="#8fa3b1"/><text x="76" y="237" font-size="16" fill="#23313d" font-weight="600">工具说明与 Schema</text><text x="644" y="237" font-size="14" fill="#52616d" text-anchor="end">加载了哪些工具，就占多少</text><rect x="60" y="262" width="600" height="42" rx="6" fill="#eaf3fb" stroke="#7694aa"/><text x="76" y="289" font-size="16" fill="#23313d" font-weight="600">AGENTS.md 与路径规则</text><text x="644" y="289" font-size="14" fill="#52616d" text-anchor="end">仓库约束，每轮加载</text><rect x="60" y="314" width="600" height="42" rx="6" fill="#eaf3fb" stroke="#7694aa"/><text x="76" y="341" font-size="16" fill="#23313d" font-weight="600">对话历史与压缩摘要</text><text x="644" y="341" font-size="14" fill="#52616d" text-anchor="end">随会话累积</text><rect x="60" y="366" width="600" height="42" rx="6" fill="#e8f5ef" stroke="#74a28b"/><text x="76" y="393" font-size="16" fill="#23313d" font-weight="600">检索结果、打开的文件、当前 Diff</text><text x="644" y="393" font-size="14" fill="#52616d" text-anchor="end">按探索加入</text><rect x="60" y="418" width="600" height="42" rx="6" fill="#fdf1e4" stroke="#c7782f"/><text x="76" y="445" font-size="16" fill="#23313d" font-weight="600">终端与测试输出</text><text x="644" y="445" font-size="14" fill="#52616d" text-anchor="end">一次可能很长</text><rect x="60" y="474" width="600" height="48" rx="6" fill="#fbeceb" stroke="#b4473b"/><text x="76" y="504" font-size="16" fill="#23313d" font-weight="600">用户这一轮的 Prompt：实现取消订单</text><text x="644" y="504" font-size="14" fill="#b4473b" text-anchor="end">只占一行</text><rect x="720" y="130" width="360" height="128" rx="6" fill="#fbeceb" stroke="#b4473b"/><text x="736" y="160" font-size="17" fill="#23313d" font-weight="600">Prompt 写得再好也会失败</text><text x="736" y="186" font-size="14" fill="#52616d">与仓库规则冲突</text><text x="736" y="208" font-size="14" fill="#52616d">引用了错误的文件</text><text x="736" y="230" font-size="14" fill="#52616d">缺少能运行的测试环境</text><rect x="720" y="290" width="360" height="128" rx="6" fill="#e8f5ef" stroke="#74a28b"/><text x="736" y="320" font-size="17" fill="#23313d" font-weight="600">排查顺序</text><text x="736" y="346" font-size="14" fill="#52616d">1. 事实来源和工具是否可用</text><text x="736" y="368" font-size="14" fill="#52616d">2. 任务决策是否写清</text><text x="736" y="390" font-size="14" fill="#52616d">3. 最后才是措辞和格式</text>
</g></svg>
