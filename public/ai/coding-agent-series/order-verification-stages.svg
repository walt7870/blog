<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="480" viewBox="0 0 1120 480" role="img" aria-labelledby="order-verification-stages-title order-verification-stages-desc">
  <title id="order-verification-stages-title">订单示例的可复现验证阶段</title><desc id="order-verification-stages-desc">先运行 baseline 八个测试，加入取消契约后预期测试编译失败，再选 final 源码运行同一套十六个测试，最后验证本地 HTTP。所有结果限于教学示例。</desc>
  <defs><marker id="order-verification-stages-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0L8 3L0 6Z" fill="#64748b"/></marker><style>text{font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#0f172a;letter-spacing:0}.title{font-size:26px;font-weight:700}.h{font-size:21px;font-weight:700}.b{font-size:16px;fill:#475569}.box{fill:white;stroke:#cbd5e1;stroke-width:1.5}.core{fill:#ecfdf5;stroke:#0f766e;stroke-width:2}.line{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#order-verification-stages-arrow)}</style></defs>
  <rect width="1120" height="480" fill="#f8fafc"/><text class="title" x="40" y="48">同一份契约，比较实现前后的结果</text>
  <path class="line" d="M260 190H305"/><path class="line" d="M550 190H595"/><path class="line" d="M815 190H860"/>
  <rect class="box" x="40" y="120" width="220" height="145" rx="6"/><text class="h" x="150" y="160" text-anchor="middle">baseline</text><text class="b" x="150" y="195" text-anchor="middle">8 个创建测试</text><text class="b" x="150" y="226" text-anchor="middle">原接口与环境基线</text>
  <rect class="box" x="305" y="120" width="245" height="145" rx="6"/><text class="h" x="427" y="160" text-anchor="middle">加入取消契约</text><text class="b" x="427" y="195" text-anchor="middle">预期 testCompile 失败</text><text class="b" x="427" y="226" text-anchor="middle">缺少 cancel、查询和状态</text>
  <rect class="core" x="595" y="120" width="220" height="145" rx="6"/><text class="h" x="705" y="160" text-anchor="middle">final</text><text class="b" x="705" y="195" text-anchor="middle">16 个测试</text><text class="b" x="705" y="226" text-anchor="middle">原行为与新契约一起跑</text>
  <rect class="box" x="860" y="120" width="220" height="145" rx="6"/><text class="h" x="970" y="160" text-anchor="middle">本地 HTTP</text><text class="b" x="970" y="195" text-anchor="middle">201 → 200 → 200</text><text class="b" x="970" y="226" text-anchor="middle">未知 UUID 返回 404</text>
  <text class="h" x="40" y="329">编译红灯的边界</text><text class="b" x="40" y="362">它表明新接口尚不存在，还不能单独证明测试能发现错误业务实现。</text>
  <text class="b" x="40" y="395">继续检查：放开 PAID、重复保存、错误 HTTP 映射时，对应断言是否失败。</text>
  <text class="b" x="40" y="444">已支付 409 由 MockMvc 夹具验证；没有支付 HTTP 入口，也没有部署或生产验证。</text>
</svg>
