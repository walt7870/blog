<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="672" viewBox="0 0 1120 672" role="img" aria-labelledby="ticket-confirmation-lifecycle-title ticket-confirmation-lifecycle-desc"><title id="ticket-confirmation-lifecycle-title">工单提交：确认版本与结果回查共同决定下一步</title><desc id="ticket-confirmation-lifecycle-desc">主要状态与恢复路径；权限拒绝、资料冲突和持续失败按正文规则停止自动执行。</desc><defs><marker id="ticket-confirmation-lifecycle-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker><style>text{font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#172b3a}.head{font-size:27px;font-weight:700}.node{font-size:20px;font-weight:700}.body{font-size:17px;fill:#475569}.box{fill:white;stroke:#cbd5e1;stroke-width:2}.blue{fill:#eff6ff;stroke:#60a5fa;stroke-width:2}.green{fill:#ecfdf5;stroke:#14b8a6;stroke-width:2}.red{fill:#fff1f2;stroke:#e88191;stroke-width:2}.line{fill:none;stroke:#64748b;stroke-width:2}.dash{stroke-dasharray:6 5}</style></defs><rect width="1120" height="672" fill="#f8fafc"/><text x="40" y="48" class="head" text-anchor="start">工单提交：确认版本与结果回查共同决定下一步</text><text x="40" y="80" class="body" text-anchor="start">主要状态与恢复路径；权限拒绝、资料冲突和持续失败按正文规则停止自动执行。</text><path d="M255 236H315" class="line" marker-end="url(#ticket-confirmation-lifecycle-arrow)"/><path d="M530 236H590" class="line" marker-end="url(#ticket-confirmation-lifecycle-arrow)"/><path d="M805 236H865" class="line" marker-end="url(#ticket-confirmation-lifecycle-arrow)"/><path d="M420 180V128Q420 120 412 120H156Q148 120 148 128V180" class="line dash" marker-end="url(#ticket-confirmation-lifecycle-arrow)"/><path d="M650 292V432" class="line" marker-end="url(#ticket-confirmation-lifecycle-arrow)"/><path d="M744 432V292" class="line dash" marker-end="url(#ticket-confirmation-lifecycle-arrow)"/><path d="M805 460H824Q832 460 832 452V348Q832 340 840 340H964Q972 340 972 332V292" class="line dash" marker-end="url(#ticket-confirmation-lifecycle-arrow)"/><path d="M805 504H900" class="line" marker-end="url(#ticket-confirmation-lifecycle-arrow)"/><rect x="250" y="196" width="70" height="26" fill="#f8fafc"/><text x="285" y="216" class="body" text-anchor="middle">就绪</text><rect x="520" y="196" width="80" height="26" fill="#f8fafc"/><text x="560" y="216" class="body" text-anchor="middle">确认</text><rect x="798" y="196" width="72" height="26" fill="#f8fafc"/><text x="834" y="216" class="body" text-anchor="middle">成功</text><rect x="216" y="88" width="164" height="26" fill="#f8fafc"/><text x="298" y="108" class="body" text-anchor="middle">修改，旧确认失效</text><rect x="608" y="336" width="32" height="26" fill="#f8fafc"/><text x="624" y="356" class="body" text-anchor="middle">超时</text><rect x="756" y="377" width="64" height="26" fill="#f8fafc"/><text x="788" y="397" class="body" text-anchor="middle">可重试</text><rect x="856" y="304" width="108" height="26" fill="#f8fafc"/><text x="910" y="324" class="body" text-anchor="middle">回查已成功</text><rect x="812" y="468" width="80" height="26" fill="#f8fafc"/><text x="852" y="488" class="body" text-anchor="middle">无法核实</text><rect x="40" y="180" width="215" height="112" rx="6" class="box"/><text x="56" y="212" class="node" text-anchor="start">生成草稿</text><text x="56" y="242" class="body" text-anchor="start">D7 / revision=2</text><text x="56" y="267" class="body" text-anchor="start">保存参数摘要</text><rect x="315" y="180" width="215" height="112" rx="6" class="blue"/><text x="331" y="212" class="node" text-anchor="start">等待确认</text><text x="331" y="242" class="body" text-anchor="start">绑定用户与版本</text><text x="331" y="267" class="body" text-anchor="start">有效期内才可用</text><rect x="590" y="180" width="215" height="112" rx="6" class="box"/><text x="606" y="212" class="node" text-anchor="start">提交中</text><text x="606" y="242" class="body" text-anchor="start">复查权限与条件</text><text x="606" y="267" class="body" text-anchor="start">固定操作ID与幂等键</text><rect x="865" y="180" width="215" height="112" rx="6" class="green"/><text x="881" y="212" class="node" text-anchor="start">已创建</text><text x="881" y="242" class="body" text-anchor="start">返回原 ticket_id</text><text x="881" y="267" class="body" text-anchor="start">工单可回读</text><rect x="590" y="432" width="215" height="112" rx="6" class="red"/><text x="606" y="464" class="node" text-anchor="start">结果未知</text><text x="606" y="494" class="body" text-anchor="start">先查询原操作</text><text x="606" y="519" class="body" text-anchor="start">不创建第二次提交</text><rect x="900" y="432" width="180" height="112" rx="6" class="box"/><text x="916" y="464" class="node" text-anchor="start">人工核查</text><text x="916" y="494" class="body" text-anchor="start">保留原操作 ID</text><text x="916" y="519" class="body" text-anchor="start">停止自动写入</text><text x="40" y="604" class="body" text-anchor="start">相同键、相同提交复用结果；相同键、不同参数拒绝。取消等待不等于撤销远端工单。</text></svg>
