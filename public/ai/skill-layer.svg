<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="540" viewBox="0 0 1120 540" role="img" aria-labelledby="skill-layer-title skill-layer-desc"><title id="skill-layer-title">Skill 提供规程，工具和运行时落实动作边界</title><desc id="skill-layer-desc">名称与描述用于发现，正文与参考按需读取；规程不是操作系统权限控制。</desc><defs><marker id="skill-layer-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker><marker id="skill-layer-open" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#64748b"/></marker><style>text{font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#172b3a}.head{font-size:27px;font-weight:700}.node{font-size:20px;font-weight:700}.body{font-size:17px;fill:#475569}.box{fill:white;stroke:#cbd5e1;stroke-width:2}.blue{fill:#eff6ff;stroke:#60a5fa;stroke-width:2}.green{fill:#ecfdf5;stroke:#14b8a6;stroke-width:2}.red{fill:#fff1f2;stroke:#e88191;stroke-width:2}.line{fill:none;stroke:#64748b;stroke-width:2}.dash{stroke-dasharray:6 5}</style></defs><rect width="1120" height="540" fill="#f8fafc"/><text x="40" y="48" class="head" text-anchor="start">Skill 提供规程，工具和运行时落实动作边界</text><text x="40" y="80" class="body" text-anchor="start">名称与描述用于发现，正文与参考按需读取；规程不是操作系统权限控制。</text><path d="M250 240H310" class="line" marker-end="url(#skill-layer-arrow)"/><path d="M530 240H590" class="line" marker-end="url(#skill-layer-arrow)"/><path d="M810 240H870" class="line" marker-end="url(#skill-layer-arrow)"/><rect x="40" y="180" width="210" height="120" rx="6" class="box"/><text x="56" y="212" class="node" text-anchor="start">任务与项目约定</text><text x="56" y="244" class="body" text-anchor="start">目录 / 业务边界</text><text x="56" y="269" class="body" text-anchor="start">当前目标与授权</text><rect x="310" y="180" width="220" height="120" rx="6" class="blue"/><text x="326" y="212" class="node" text-anchor="start">匹配并加载 Skill</text><text x="326" y="244" class="body" text-anchor="start">触发范围 / 输入</text><text x="326" y="269" class="body" text-anchor="start">步骤 / 禁区 / 验收</text><rect x="590" y="180" width="220" height="120" rx="6" class="box"/><text x="606" y="212" class="node" text-anchor="start">Agent 组织执行</text><text x="606" y="244" class="body" text-anchor="start">调用本地工具</text><text x="606" y="269" class="body" text-anchor="start">或经 MCP 接入能力</text><rect x="870" y="180" width="210" height="120" rx="6" class="green"/><text x="886" y="212" class="node" text-anchor="start">结果与证据</text><text x="886" y="244" class="body" text-anchor="start">测试 / 页面 / 回读</text><text x="886" y="269" class="body" text-anchor="start">未通过时恢复</text><rect x="310" y="380" width="770" height="104" rx="6" class="red"/><text x="326" y="412" class="node" text-anchor="start">执行端仍负责权限与状态</text><text x="326" y="444" class="body" text-anchor="start">脚本继承运行环境权限；写入授权、幂等和持久状态不能只写在Markdown里。</text><text x="40" y="520" class="body" text-anchor="start">是否更稳定要用代表任务和失败用例验证；没有加载、误触发和命令过期都可能使规程失效。</text></svg>
