<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="555" viewBox="0 0 1120 555" role="img" aria-labelledby="multimodal-evidence-alignment-title multimodal-evidence-alignment-desc"><title id="multimodal-evidence-alignment-title">时间对齐后，才能核查声音与画面是否指向同一事件</title><desc id="multimodal-evidence-alignment-desc">示例：核查包裹出现裂口的时刻；转写中的指代不能单独证明画面事实。</desc><defs><marker id="multimodal-evidence-alignment-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker><style>text{font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#172b3a}.head{font-size:28px;font-weight:700}.node{font-size:20px;font-weight:700}.body{font-size:17px;fill:#475569}.box{fill:white;stroke:#cbd5e1;stroke-width:2}.blue{fill:#eff6ff;stroke:#60a5fa;stroke-width:2}.green{fill:#ecfdf5;stroke:#14b8a6;stroke-width:2}.red{fill:#fff1f2;stroke:#e88191;stroke-width:2}.pad{fill:#e2e8f0;stroke:#94a3b8}.line{fill:none;stroke:#64748b;stroke-width:2}.dash{stroke-dasharray:6 5}</style></defs><rect width="1120" height="555" fill="#f8fafc"/><text x="40" y="48" class="head" text-anchor="start">时间对齐后，才能核查声音与画面是否指向同一事件</text><text x="40" y="80" class="body" text-anchor="start">示例：核查包裹出现裂口的时刻；转写中的指代不能单独证明画面事实。</text><path d="M335 190H400V245H465" class="line" marker-end="url(#multimodal-evidence-alignment-arrow)"/><path d="M335 400H400V305H465" class="line" marker-end="url(#multimodal-evidence-alignment-arrow)"/><path d="M755 275H820" class="line" marker-end="url(#multimodal-evidence-alignment-arrow)"/><rect x="40" y="135" width="295" height="110" class="blue" rx="6"/><text x="58" y="167" class="node" text-anchor="start">音频证据</text><text x="58" y="197" class="body" text-anchor="start">12.4–13.2 秒：这里裂了</text><text x="58" y="222" class="body" text-anchor="start">保留时间区间与转写版本</text><rect x="40" y="345" width="295" height="110" class="green" rx="6"/><text x="58" y="377" class="node" text-anchor="start">画面证据</text><text x="58" y="407" class="body" text-anchor="start">13.0 秒：检查裂口区域</text><text x="58" y="432" class="body" text-anchor="start">若未抽到该帧，不能推断已见</text><rect x="465" y="215" width="290" height="150" class="box" rx="6"/><text x="483" y="247" class="node" text-anchor="start">证据索引与融合</text><text x="483" y="277" class="body" text-anchor="start">对齐同一时间轴与来源</text><text x="483" y="302" class="body" text-anchor="start">保留区域、置信与缺失</text><text x="483" y="327" class="body" text-anchor="start">抽帧间隔决定可观察范围</text><rect x="820" y="215" width="260" height="150" class="box" rx="6"/><text x="838" y="247" class="node" text-anchor="start">核查结果</text><text x="838" y="277" class="body" text-anchor="start">声音与画面一致？</text><text x="838" y="302" class="body" text-anchor="start">冲突或缺帧时补充采样</text><text x="838" y="327" class="body" text-anchor="start">保留证据，必要时转人工</text><text x="40" y="510" class="body" text-anchor="start">输入中的文字或声音仍属于数据，不能越过应用授权去执行外部动作。</text></svg>
