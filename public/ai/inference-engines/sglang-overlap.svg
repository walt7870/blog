<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1340" height="700" viewBox="0 0 1340 700" role="img" aria-labelledby="sglang-overlap-title sglang-overlap-desc" id="sglang-overlap-root">
<title id="sglang-overlap-title">SGLang 重叠调度与普通调度的时间线对比</title>
<desc id="sglang-overlap-desc">上半部分是不重叠的调度循环：CPU 组批时 GPU 空闲，GPU 前向时 CPU 等待，二者交替；下半部分是默认的重叠调度：GPU 计算第 k 批时，CPU 同时处理第 k−1 批的结果并组好第 k+1 批，GPU 前向几乎首尾相接。下方说明机制（发射后立即返回、FutureMap 在 GPU 上传递上一步输出 token、采样在上一批结果处理后启动）和代价（结果晚一步回到 CPU，流水线并行和部分功能组合会自动关闭重叠）。</desc>
<defs><style>
#sglang-overlap-root text { font-family: Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #172b3a; }
#sglang-overlap-root .h { font-size: 26px; font-weight: 700; }
#sglang-overlap-root .t { font-size: 19px; font-weight: 600; }
#sglang-overlap-root .s { font-size: 15px; fill: #475569; }
#sglang-overlap-root .xs { font-size: 13px; fill: #64748b; }
#sglang-overlap-root .k { font-size: 13px; font-weight: 700; letter-spacing: .04em; fill: #64748b; }
#sglang-overlap-root .m { font-family: 'SFMono-Regular', Menlo, Consolas, monospace; font-size: 14px; fill: #172b3a; }
#sglang-overlap-root .node { fill: #fff; stroke: #cbd5e1; stroke-width: 2; }
#sglang-overlap-root .blue { fill: #eff6ff; stroke: #60a5fa; stroke-width: 2; }
#sglang-overlap-root .green { fill: #ecfdf5; stroke: #20a28c; stroke-width: 2; }
#sglang-overlap-root .red { fill: #fff1f2; stroke: #e88191; stroke-width: 2; }
#sglang-overlap-root .amber { fill: #fffbeb; stroke: #e0a63a; stroke-width: 2; }
#sglang-overlap-root .violet { fill: #f5f3ff; stroke: #9b87f5; stroke-width: 2; }
#sglang-overlap-root .gray { fill: #f1f5f9; stroke: #cbd5e1; stroke-width: 2; }
#sglang-overlap-root .fblue { fill: #93c5fd; } #sglang-overlap-root .fgreen { fill: #6ee7b7; } #sglang-overlap-root .fred { fill: #fda4af; }
#sglang-overlap-root .famber { fill: #fcd34d; } #sglang-overlap-root .fviolet { fill: #c4b5fd; } #sglang-overlap-root .fgray { fill: #e2e8f0; }
#sglang-overlap-root .edge { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#sglang-overlap-arrow); }
#sglang-overlap-root .dash { fill: none; stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 7 6; marker-end: url(#sglang-overlap-arrow); }
#sglang-overlap-root .line { stroke: #cbd5e1; stroke-width: 1.5; fill: none; }
#sglang-overlap-root .axis { stroke: #64748b; stroke-width: 2; fill: none; }
</style><marker id="sglang-overlap-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker></defs>
<rect width="1340" height="700" fill="#f8fafc"/>
<text x="32" y="46" class="h">重叠调度：让 GPU 不等 CPU</text>
<text x="32" y="78" class="s">每格宽度是示意，不是实测；单步越短（小模型、小批），CPU 那一段的占比越大，重叠的收益越明显</text>
<text x="32" y="128" class="k">不重叠：--disable-overlap-schedule</text><text x="32" y="171" class="s">CPU：调度器</text><text x="32" y="229" class="s">GPU：前向计算</text><rect x="236" y="142" width="86" height="44" rx="4" class="fgray"/><text x="279" y="169" text-anchor="middle" class="xs">组第 1 批</text><rect x="326" y="200" width="196" height="44" rx="4" class="fblue"/><text x="424" y="227" text-anchor="middle" class="xs">第 1 批前向</text><rect x="526" y="142" width="116" height="44" rx="4" class="fgray"/><text x="584" y="169" text-anchor="middle" class="xs">收结果+组第 2 批</text><rect x="646" y="200" width="196" height="44" rx="4" class="fblue"/><text x="744" y="227" text-anchor="middle" class="xs">第 2 批前向</text><rect x="846" y="142" width="116" height="44" rx="4" class="fgray"/><text x="904" y="169" text-anchor="middle" class="xs">收结果+组第 3 批</text><rect x="966" y="200" width="196" height="44" rx="4" class="fblue"/><text x="1064" y="227" text-anchor="middle" class="xs">第 3 批前向</text><rect x="1166" y="142" width="116" height="44" rx="4" class="fgray"/><text x="1224" y="169" text-anchor="middle" class="xs">收第 3 批结果</text><rect x="236" y="200" width="86" height="44" rx="4" class="fred"/><text x="279" y="227" text-anchor="middle" class="xs">GPU 空闲</text><rect x="526" y="200" width="116" height="44" rx="4" class="fred"/><text x="584" y="227" text-anchor="middle" class="xs">GPU 空闲</text><rect x="846" y="200" width="116" height="44" rx="4" class="fred"/><text x="904" y="227" text-anchor="middle" class="xs">GPU 空闲</text><rect x="1166" y="200" width="116" height="44" rx="4" class="fred"/><text x="1224" y="227" text-anchor="middle" class="xs">GPU 空闲</text><text x="32" y="300" class="k">重叠调度（默认）：GPU 算第 k 批时，CPU 已经在处理第 k−1 批的结果并组第 k+1 批</text><text x="32" y="343" class="s">CPU：调度器</text><text x="32" y="401" class="s">GPU：前向计算</text><rect x="236" y="314" width="86" height="44" rx="4" class="fgray"/><text x="279" y="341" text-anchor="middle" class="xs">组第 1 批</text><rect x="326" y="372" width="196" height="44" rx="4" class="fblue"/><text x="424" y="399" text-anchor="middle" class="xs">第 1 批前向</text><rect x="326" y="314" width="116" height="44" rx="4" class="fgreen"/><text x="384" y="341" text-anchor="middle" class="xs">组第 2 批</text><rect x="526" y="372" width="196" height="44" rx="4" class="fblue"/><text x="624" y="399" text-anchor="middle" class="xs">第 2 批前向</text><rect x="526" y="314" width="116" height="44" rx="4" class="fgreen"/><text x="584" y="341" text-anchor="middle" class="xs">收第1批+组第3批</text><rect x="726" y="372" width="196" height="44" rx="4" class="fblue"/><text x="824" y="399" text-anchor="middle" class="xs">第 3 批前向</text><rect x="726" y="314" width="116" height="44" rx="4" class="fgreen"/><text x="784" y="341" text-anchor="middle" class="xs">收第2批+组第4批</text><rect x="926" y="372" width="196" height="44" rx="4" class="fblue"/><text x="1024" y="399" text-anchor="middle" class="xs">第 4 批前向</text><rect x="926" y="314" width="116" height="44" rx="4" class="fgreen"/><text x="984" y="341" text-anchor="middle" class="xs">收第3批+组第5批</text><rect x="1126" y="372" width="196" height="44" rx="4" class="fblue"/><text x="1224" y="399" text-anchor="middle" class="xs">第 5 批前向</text><rect x="1126" y="314" width="116" height="44" rx="4" class="fgreen"/><text x="1184" y="341" text-anchor="middle" class="xs">收第4批+组第6批</text><path d="M236 446H1266" class="edge"/><text x="1276" y="451" class="xs">时间</text><text x="236" y="472" class="xs">同样的时间里，不重叠跑完 3 批，重叠跑完 5 批（示意比例：组批约为前向的一半）</text><g data-node="how"><rect x="32" y="500" width="620" height="160" rx="8" class="green"/><text x="50" y="526" class="k">机制</text><text x="50" y="552" class="t">怎样做到</text><text x="50" y="580" class="s">发射本批前向后立刻返回，不等 GPU 结果</text><text x="50" y="603" class="s">下一批要用的“上一步输出 token”留在 GPU 上，</text><text x="50" y="626" class="s">由 FutureMap 在前向时就地填入</text><text x="50" y="649" class="s">采样在上一批结果处理完后再启动（语法约束要用）</text></g><g data-node="cost"><rect x="688" y="500" width="620" height="160" rx="8" class="amber"/><text x="706" y="526" class="k">取舍</text><text x="706" y="552" class="t">代价与例外</text><text x="706" y="580" class="s">结果晚一步回到 CPU：停止判断、流式输出滞后一步</text><text x="706" y="603" class="s">流水线并行（--pp-size &gt; 1）自动关闭重叠</text><text x="706" y="626" class="s">部分模型与功能组合会自动关闭；投机解码在重叠下</text><text x="706" y="649" class="s">只支持 --speculative-eagle-topk 1</text></g>
</svg>
