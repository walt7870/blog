<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1340" height="1092" viewBox="0 0 1340 1092" role="img" aria-labelledby="orch-layers-title orch-layers-desc" id="orch-layers-root">
<title id="orch-layers-title">推理编排层的分层结构与各开源项目的位置</title>
<desc id="orch-layers-desc">请求从 API 网关进入，路由层根据各副本的 KV 缓存与负载选择副本，引擎层可以合并部署或拆成 Prefill 与 Decode 两个池，KV 通过 NIXL 或 Mooncake Transfer Engine 传输，放不下的 KV 下沉到 CPU 内存、SSD 和远端缓存池。右侧列出 Dynamo、llm-d、production-stack、AIBrix、LMCache、Mooncake 各自主要落在哪一层；扩缩容控制器横跨各层。</desc>
<defs><style>
#orch-layers-root text { font-family: Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #172b3a; }
#orch-layers-root .h { font-size: 26px; font-weight: 700; }
#orch-layers-root .t { font-size: 19px; font-weight: 600; }
#orch-layers-root .s { font-size: 15px; fill: #475569; }
#orch-layers-root .xs { font-size: 13px; fill: #64748b; }
#orch-layers-root .k { font-size: 13px; font-weight: 700; letter-spacing: .04em; fill: #64748b; }
#orch-layers-root .m { font-family: 'SFMono-Regular', Menlo, Consolas, monospace; font-size: 14px; fill: #172b3a; }
#orch-layers-root .node { fill: #fff; stroke: #cbd5e1; stroke-width: 2; }
#orch-layers-root .blue { fill: #eff6ff; stroke: #60a5fa; stroke-width: 2; }
#orch-layers-root .green { fill: #ecfdf5; stroke: #20a28c; stroke-width: 2; }
#orch-layers-root .red { fill: #fff1f2; stroke: #e88191; stroke-width: 2; }
#orch-layers-root .amber { fill: #fffbeb; stroke: #e0a63a; stroke-width: 2; }
#orch-layers-root .violet { fill: #f5f3ff; stroke: #9b87f5; stroke-width: 2; }
#orch-layers-root .gray { fill: #f1f5f9; stroke: #cbd5e1; stroke-width: 2; }
#orch-layers-root .fblue { fill: #93c5fd; } #orch-layers-root .fgreen { fill: #6ee7b7; } #orch-layers-root .fred { fill: #fda4af; }
#orch-layers-root .famber { fill: #fcd34d; } #orch-layers-root .fviolet { fill: #c4b5fd; } #orch-layers-root .fgray { fill: #e2e8f0; }
#orch-layers-root .edge { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#orch-layers-arrow); }
#orch-layers-root .dash { fill: none; stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 7 6; marker-end: url(#orch-layers-arrow); }
#orch-layers-root .line { stroke: #cbd5e1; stroke-width: 1.5; fill: none; }
#orch-layers-root .axis { stroke: #64748b; stroke-width: 2; fill: none; }
</style><marker id="orch-layers-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker></defs>
<rect width="1340" height="1092" fill="#f8fafc"/>
<text x="32" y="46" class="h">引擎之上的编排层：五层，各项目各占几层</text>
<text x="32" y="78" class="s">左侧是请求经过的层次；右侧是承担这一层的开源组件。底部的控制面按指标增减各层副本。</text>
<text x="32" y="104" class="k">请求怎样往下走</text><text x="712" y="104" class="k">各项目落在哪一层</text><g data-node="l-gw"><rect x="32" y="112" width="640" height="120" rx="8" class="gray"/><text x="50" y="138" class="k">入口</text><text x="50" y="164" class="t">API 网关</text><text x="50" y="192" class="s">鉴权、限流、配额、TLS（第 21 篇已讲）</text></g><g data-node="r-gw"><rect x="712" y="112" width="596" height="120" rx="8" class="node"/><text x="730" y="138" class="k">入口</text><text x="730" y="164" class="t">网关与入口</text><text x="730" y="192" class="s">· Envoy、Istio、agentgateway 等网关</text><text x="730" y="215" class="s">· Dynamo Frontend：OpenAI 兼容入口</text></g><path d="M676 172H706" class="dash"/><path d="M152 234V252" class="edge"/><g data-node="l-router"><rect x="32" y="256" width="640" height="168" rx="8" class="blue"/><text x="50" y="282" class="k">路由层</text><text x="50" y="308" class="t">选择哪个副本处理这个请求</text><text x="50" y="336" class="s">前缀/KV 感知 + 负载感知 + 会话亲和</text><text x="50" y="359" class="s">读取各副本的 KV 事件与负载指标</text></g><g data-node="r-router"><rect x="712" y="256" width="596" height="168" rx="8" class="node"/><text x="730" y="282" class="k">路由层</text><text x="730" y="308" class="t">路由器 / 调度器</text><text x="730" y="336" class="s">· Dynamo Router（KV 路由）</text><text x="730" y="359" class="s">· llm-d Router（GAIE 的 Endpoint Picker）</text><text x="730" y="382" class="s">· production-stack router</text><text x="730" y="405" class="s">· AIBrix 网关路由插件</text></g><path d="M676 340H706" class="dash"/><path d="M152 426V444" class="edge"/><g data-node="l-engine"><rect x="32" y="448" width="640" height="150" rx="8" class="green"/><text x="50" y="474" class="k">引擎层</text><text x="50" y="500" class="t">推理引擎副本：合并部署或 P/D 两个池</text><text x="50" y="528" class="s">Prefill 池  →  KV  →  Decode 池</text><text x="50" y="551" class="s">vLLM / SGLang / TensorRT-LLM 不变</text></g><g data-node="r-engine"><rect x="712" y="448" width="596" height="150" rx="8" class="node"/><text x="730" y="474" class="k">引擎层</text><text x="730" y="500" class="t">引擎与包装进程</text><text x="730" y="528" class="s">· 引擎本身：vLLM、SGLang、TensorRT-LLM</text><text x="730" y="551" class="s">· Dynamo 的 dynamo.vllm 等包装进程</text><text x="730" y="574" class="s">· llm-d / AIBrix 直接管理引擎 Pod</text></g><path d="M676 523H706" class="dash"/><path d="M152 600V618" class="edge"/><g data-node="l-xfer"><rect x="32" y="622" width="640" height="120" rx="8" class="violet"/><text x="50" y="648" class="k">KV 传输</text><text x="50" y="674" class="t">把 KV 从一台机器搬到另一台</text><text x="50" y="702" class="s">RDMA / NVLink / TCP，GPU 直接读写</text></g><g data-node="r-xfer"><rect x="712" y="622" width="596" height="120" rx="8" class="node"/><text x="730" y="648" class="k">KV 传输</text><text x="730" y="674" class="t">传输库</text><text x="730" y="702" class="s">· NIXL（vLLM NixlConnector、Dynamo、llm-d）</text><text x="730" y="725" class="s">· Mooncake Transfer Engine（SGLang P/D 默认）</text></g><path d="M676 682H706" class="dash"/><path d="M152 744V762" class="edge"/><g data-node="l-tier"><rect x="32" y="766" width="640" height="150" rx="8" class="amber"/><text x="50" y="792" class="k">KV 缓存层级</text><text x="50" y="818" class="t">GPU 显存放不下的 KV 往下放</text><text x="50" y="846" class="s">GPU HBM → CPU 内存 → 本地 SSD → 远端池</text><text x="50" y="869" class="s">命中则少算一次 Prefill</text></g><g data-node="r-tier"><rect x="712" y="766" width="596" height="150" rx="8" class="node"/><text x="730" y="792" class="k">KV 缓存层级</text><text x="730" y="818" class="t">多级 KV 缓存组件</text><text x="730" y="846" class="s">· LMCache（vLLM/SGLang 的 KV 层）</text><text x="730" y="869" class="s">· Mooncake Store · Dynamo KVBM</text><text x="730" y="892" class="s">· llm-d 分级前缀缓存 · AIBrix KV 缓存</text></g><path d="M676 841H706" class="dash"/><g data-node="ctl"><rect x="32" y="948" width="1276" height="112" rx="8" class="red"/><text x="50" y="974" class="k">控制面（横跨各层）</text><text x="50" y="1000" class="t">按 SLO 或负载指标增减副本，调整 Prefill 与 Decode 的比例</text><text x="50" y="1028" class="s">Dynamo Planner · llm-d 用 KEDA + 路由器指标 · AIBrix PodAutoscaler · production-stack 用 KEDA</text></g><path d="M552 946V920" class="dash"/>
</svg>
