<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="trtllm-architecture-title trtllm-architecture-desc" id="trtllm-architecture-root">
<title id="trtllm-architecture-title">TensorRT-LLM 1.2.1 默认 PyTorch 后端的进程与模块关系</title>
<desc id="trtllm-architecture-desc">trtllm-serve 主进程负责 OpenAI 兼容接口、对话模板与分词，并持有 LLM 对象和 GenerationExecutorProxy；它通过 ZMQ IPC 把请求交给每个 GPU rank 上的 MPI 工作进程。工作进程里的 PyExecutor 循环依次取请求、由 Scheduler 按 max_batch_size 与 max_num_tokens 选批、由 KVCacheManager 分配分页块并复用前缀、由 ModelEngine 执行前向、由 Sampler 采样，然后把结果交回主进程。重叠调度让 CPU 处理上一步结果的同时 GPU 已经开始下一步。</desc>
<defs><style>
#trtllm-architecture-root text { font-family: Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #172b3a; }
#trtllm-architecture-root .h { font-size: 26px; font-weight: 700; }
#trtllm-architecture-root .t { font-size: 19px; font-weight: 600; }
#trtllm-architecture-root .s { font-size: 15px; fill: #475569; }
#trtllm-architecture-root .xs { font-size: 13px; fill: #64748b; }
#trtllm-architecture-root .k { font-size: 13px; font-weight: 700; letter-spacing: .04em; fill: #64748b; }
#trtllm-architecture-root .m { font-family: 'SFMono-Regular', Menlo, Consolas, monospace; font-size: 14px; fill: #172b3a; }
#trtllm-architecture-root .node { fill: #fff; stroke: #cbd5e1; stroke-width: 2; }
#trtllm-architecture-root .blue { fill: #eff6ff; stroke: #60a5fa; stroke-width: 2; }
#trtllm-architecture-root .green { fill: #ecfdf5; stroke: #20a28c; stroke-width: 2; }
#trtllm-architecture-root .red { fill: #fff1f2; stroke: #e88191; stroke-width: 2; }
#trtllm-architecture-root .amber { fill: #fffbeb; stroke: #e0a63a; stroke-width: 2; }
#trtllm-architecture-root .violet { fill: #f5f3ff; stroke: #9b87f5; stroke-width: 2; }
#trtllm-architecture-root .gray { fill: #f1f5f9; stroke: #cbd5e1; stroke-width: 2; }
#trtllm-architecture-root .fblue { fill: #93c5fd; } #trtllm-architecture-root .fgreen { fill: #6ee7b7; } #trtllm-architecture-root .fred { fill: #fda4af; }
#trtllm-architecture-root .famber { fill: #fcd34d; } #trtllm-architecture-root .fviolet { fill: #c4b5fd; } #trtllm-architecture-root .fgray { fill: #e2e8f0; }
#trtllm-architecture-root .edge { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#trtllm-architecture-arrow); }
#trtllm-architecture-root .dash { fill: none; stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 7 6; marker-end: url(#trtllm-architecture-arrow); }
#trtllm-architecture-root .line { stroke: #cbd5e1; stroke-width: 1.5; fill: none; }
#trtllm-architecture-root .axis { stroke: #64748b; stroke-width: 2; fill: none; }
</style><marker id="trtllm-architecture-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker></defs>
<rect width="1400" height="760" fill="#f8fafc"/>
<text x="32" y="46" class="h">TensorRT-LLM 1.2.1：一个请求经过哪些进程和模块</text>
<text x="32" y="78" class="s">默认 PyTorch 后端。左边是 HTTP 服务进程，右边是每张卡上的执行循环。</text>
<g data-node="client"><rect x="32" y="128" width="200" height="150" rx="8" class="node"/><text x="50" y="154" class="k">调用方</text><text x="50" y="180" class="t">客户端</text><text x="50" y="208" class="s">资料助手后端</text><text x="50" y="231" class="s">POST /v1/chat/</text><text x="50" y="254" class="s">completions</text></g><path d="M234 203H270" class="edge"/><g data-node="main"><rect x="272" y="112" width="320" height="300" rx="8" class="blue"/><text x="290" y="138" class="k">进程 1 · 默认监听 localhost:8000</text><text x="290" y="164" class="t">trtllm-serve 主进程</text><text x="290" y="192" class="s">FastAPI：OpenAI 兼容接口</text><text x="290" y="215" class="s">/health、/metrics、/v1/models</text><text x="290" y="238" class="s">对话模板、分词与反分词</text><text x="290" y="261" class="s">推理解析、工具调用解析</text><text x="290" y="284" class="s">LLM 对象</text><text x="290" y="307" class="s">GenerationExecutorProxy</text></g><g data-node="region"><rect x="668" y="104" width="712" height="520" rx="10" class="gray"/><text x="688" y="132" class="k">每个 GPU rank 一个 MPI 工作进程（TP=2 就有两个，循环逐步同步）</text><text x="688" y="162" class="t">GenerationExecutorWorker 里的 PyExecutor 循环</text></g><path d="M594 236H664" class="edge"/><text x="604" y="222" class="xs">ZMQ IPC</text><g data-node="s1"><rect x="688" y="188" width="220" height="150" rx="8" class="node"/><text x="706" y="224" class="t">① 取请求</text><text x="706" y="252" class="s">从请求队列取新请求</text><text x="706" y="275" class="s">多卡时广播到各 rank</text></g><g data-node="s2"><rect x="920" y="188" width="220" height="150" rx="8" class="violet"/><text x="938" y="224" class="t">② Scheduler</text><text x="938" y="252" class="s">预算 max_batch_size</text><text x="938" y="275" class="s">与 max_num_tokens</text><text x="938" y="298" class="s">生成阶段优先排入</text></g><g data-node="s3"><rect x="1152" y="188" width="220" height="150" rx="8" class="green"/><text x="1170" y="224" class="t">③ KVCacheManager</text><text x="1170" y="252" class="s">分页块，每块 32 token</text><text x="1170" y="275" class="s">基数树复用相同前缀</text><text x="1170" y="298" class="s">可下沉到主机内存</text></g><g data-node="s4"><rect x="1152" y="404" width="220" height="150" rx="8" class="amber"/><text x="1170" y="440" class="t">④ ModelEngine</text><text x="1170" y="468" class="s">PyTorch 模型代码</text><text x="1170" y="491" class="s">TRTLLM 注意力内核</text><text x="1170" y="514" class="s">CUDA Graph 回放</text></g><g data-node="s5"><rect x="920" y="404" width="220" height="150" rx="8" class="node"/><text x="938" y="440" class="t">⑤ Sampler</text><text x="938" y="468" class="s">TorchSampler 采样</text><text x="938" y="491" class="s">停止条件、logprobs</text></g><g data-node="s6"><rect x="688" y="404" width="220" height="150" rx="8" class="node"/><text x="706" y="440" class="t">⑥ 交回结果</text><text x="706" y="468" class="s">经 IPC 回到主进程</text><text x="706" y="491" class="s">流式推给客户端</text></g><path d="M910 263H916" class="edge"/><path d="M1142 263H1148" class="edge"/><path d="M1262 340V400" class="edge"/><path d="M1150 479H1144" class="edge"/><path d="M918 479H912" class="edge"/><path d="M798 402V342" class="dash"/><text x="808" y="378" class="xs">下一轮</text><path d="M686 514H630V382H596" class="dash"/><text x="688" y="602" class="xs">② ③ 的核心算法在 C++ batch_manager 中实现，经 Python 绑定调用；其余逻辑是 Python 与 PyTorch。</text><g data-node="overlap"><rect x="32" y="448" width="560" height="176" rx="8" class="red"/><text x="50" y="474" class="k">和 ①—⑥ 并行发生的事</text><text x="50" y="500" class="t">重叠调度（默认开启）</text><text x="50" y="528" class="s">GPU 执行第 n+1 步的前向时，CPU 处理第 n 步的</text><text x="50" y="551" class="s">采样结果：检查停止条件、更新输出、准备下一批。</text><text x="50" y="574" class="s">代价是多跑一步；两模型投机解码会自动关闭它。</text></g><text x="32" y="668" class="s">多机时由 mpirun / Slurm（trtllm-llmapi-launch）拉起各 rank；1.2 起也可设 orchestrator_type: ray（原型）。</text><text x="32" y="698" class="xs">图中模块名与 1.2.1 源码一致：tensorrt_llm/executor/proxy.py、worker.py，tensorrt_llm/_torch/pyexecutor/。</text>
</svg>
