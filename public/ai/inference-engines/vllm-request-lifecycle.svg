<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="690" viewBox="0 0 960 690" role="img" aria-labelledby="vllm-request-lifecycle-title vllm-request-lifecycle-desc" id="vllm-request-lifecycle-root">
<title id="vllm-request-lifecycle-title">vLLM 中一个请求的生命周期</title>
<desc id="vllm-request-lifecycle-desc">资料助手的一次提问共 2,100 个 token，其中 2,000 个是与之前请求相同的前缀。第一步在 API 服务进程里套对话模板并分词；第二步经 ZMQ 进入 EngineCore 的等待队列；第三步调度器查前缀缓存命中 2,000 个 token，为剩余部分分配块并排进本步；第四、五步在 Worker 上做前向计算和采样；第六步 EngineCore 检查结束符和长度，没结束就在下一步回到第三步；第七步 API 服务进程增量反分词、检查停止字符串并流式推送，命中停止字符串时向 EngineCore 发 abort。</desc>
<defs><style>
#vllm-request-lifecycle-root text { font-family: Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #172b3a; }
#vllm-request-lifecycle-root .h { font-size: 26px; font-weight: 700; }
#vllm-request-lifecycle-root .t { font-size: 19px; font-weight: 600; }
#vllm-request-lifecycle-root .s { font-size: 15px; fill: #475569; }
#vllm-request-lifecycle-root .xs { font-size: 13px; fill: #64748b; }
#vllm-request-lifecycle-root .k { font-size: 13px; font-weight: 700; letter-spacing: .04em; fill: #64748b; }
#vllm-request-lifecycle-root .m { font-family: 'SFMono-Regular', Menlo, Consolas, monospace; font-size: 14px; fill: #172b3a; }
#vllm-request-lifecycle-root .node { fill: #fff; stroke: #cbd5e1; stroke-width: 2; }
#vllm-request-lifecycle-root .blue { fill: #eff6ff; stroke: #60a5fa; stroke-width: 2; }
#vllm-request-lifecycle-root .green { fill: #ecfdf5; stroke: #20a28c; stroke-width: 2; }
#vllm-request-lifecycle-root .red { fill: #fff1f2; stroke: #e88191; stroke-width: 2; }
#vllm-request-lifecycle-root .amber { fill: #fffbeb; stroke: #e0a63a; stroke-width: 2; }
#vllm-request-lifecycle-root .violet { fill: #f5f3ff; stroke: #9b87f5; stroke-width: 2; }
#vllm-request-lifecycle-root .gray { fill: #f1f5f9; stroke: #cbd5e1; stroke-width: 2; }
#vllm-request-lifecycle-root .fblue { fill: #93c5fd; } #vllm-request-lifecycle-root .fgreen { fill: #6ee7b7; } #vllm-request-lifecycle-root .fred { fill: #fda4af; }
#vllm-request-lifecycle-root .famber { fill: #fcd34d; } #vllm-request-lifecycle-root .fviolet { fill: #c4b5fd; } #vllm-request-lifecycle-root .fgray { fill: #e2e8f0; }
#vllm-request-lifecycle-root .edge { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#vllm-request-lifecycle-arrow); }
#vllm-request-lifecycle-root .dash { fill: none; stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 7 6; marker-end: url(#vllm-request-lifecycle-arrow); }
#vllm-request-lifecycle-root .line { stroke: #cbd5e1; stroke-width: 1.5; fill: none; }
#vllm-request-lifecycle-root .axis { stroke: #64748b; stroke-width: 2; fill: none; }
</style><marker id="vllm-request-lifecycle-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker></defs>
<rect width="960" height="690" fill="#f8fafc"/>
<text x="32" y="46" class="h">一个请求在三个进程之间怎样推进</text>
<text x="32" y="78" class="s">资料助手的一次提问：输入 2,100 个 token，其中 2,000 个和之前的请求共享前缀。</text>
<g data-node="lane-api"><rect x="32" y="104" width="896" height="150" rx="8" class="gray"/><text x="50" y="130" class="k">API 服务进程</text></g>
<g data-node="lane-core"><rect x="32" y="270" width="896" height="170" rx="8" class="gray"/><text x="50" y="296" class="k">EngineCore 进程</text></g>
<g data-node="lane-worker"><rect x="32" y="456" width="896" height="150" rx="8" class="gray"/><text x="50" y="482" class="k">Worker 进程（GPU）</text></g>
<g data-node="s1"><rect x="170" y="124" width="170" height="100" rx="8" class="blue"/><text x="188" y="160" class="t">① 渲染、分词</text><text x="188" y="188" class="s">套对话模板</text><text x="188" y="211" class="s">得到 2,100 token</text></g>
<g data-node="s2"><rect x="360" y="320" width="170" height="100" rx="8" class="green"/><text x="378" y="356" class="t">② 进入队列</text><text x="378" y="384" class="s">状态 WAITING</text><text x="378" y="407" class="s">FCFS 先来先服务</text></g>
<g data-node="s3"><rect x="550" y="320" width="170" height="100" rx="8" class="green"/><text x="568" y="356" class="t">③ 调度本步</text><text x="568" y="384" class="s">命中前缀 2,000</text><text x="568" y="407" class="s">分配块、排 100</text></g>
<g data-node="s4"><rect x="550" y="476" width="170" height="100" rx="8" class="amber"/><text x="568" y="512" class="t">④ 前向计算</text><text x="568" y="540" class="s">准备输入张量</text><text x="568" y="563" class="s">CUDA Graph 重放</text></g>
<g data-node="s5"><rect x="740" y="476" width="170" height="100" rx="8" class="amber"/><text x="758" y="512" class="t">⑤ 采样</text><text x="758" y="540" class="s">语法掩码、采样</text><text x="758" y="563" class="s">得到 1 个 token</text></g>
<g data-node="s6"><rect x="740" y="320" width="170" height="100" rx="8" class="green"/><text x="758" y="356" class="t">⑥ 更新状态</text><text x="758" y="384" class="s">检查 EOS、长度</text><text x="758" y="407" class="s">已结束则释放块</text></g>
<g data-node="s7"><rect x="740" y="124" width="170" height="100" rx="8" class="blue"/><text x="758" y="160" class="t">⑦ 反分词推送</text><text x="758" y="188" class="s">增量反分词</text><text x="758" y="211" class="s">停止字符串、SSE</text></g>
<path d="M340 174H400V320" class="edge"/>
<rect x="342" y="146" width="44" height="26" rx="4" fill="#f8fafc"/><text x="348" y="164" class="s">ZMQ</text>
<path d="M530 370H550" class="edge"/>
<path d="M635 420V476" class="edge"/>
<path d="M720 526H740" class="edge"/>
<path d="M825 476V420" class="edge"/>
<path d="M840 320V224" class="edge"/>
<path d="M885 224V320" class="dash"/>
<text x="420" y="214" class="xs">命中停止字符串时，⑦ 经 ZMQ 向 ⑥ 发 abort</text>
<path d="M760 320V292H650V320" class="dash"/>
<rect x="434" y="282" width="168" height="26" rx="4" fill="#f8fafc"/><text x="440" y="300" class="s">未结束：下一步回到 ③</text>
<text x="32" y="640" class="s">③→⑥ 每个引擎步重复一次：第一步算完剩余的 100 个输入 token 并产出首个 token，之后每步追加 1 个。</text>
<text x="32" y="666" class="s">请求结束后块引用计数归零，满块连同哈希留在前缀缓存里，直到显存紧张时按 LRU 被回收。</text>
</svg>
