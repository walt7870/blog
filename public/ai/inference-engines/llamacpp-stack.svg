<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1340" height="640" viewBox="0 0 1340 640" role="img" aria-labelledby="llamacpp-stack-title llamacpp-stack-desc" id="llamacpp-stack-root">
<title id="llamacpp-stack-title">llama.cpp 从原始权重到运行服务的流程与进程内分层</title>
<desc id="llamacpp-stack-desc">上排：safetensors 权重经 convert_hf_to_gguf.py 转成 GGUF，可选用 llama-imatrix 校准，再由 llama-quantize 量化，最后由 llama-server 或 llama-cli 加载。下排：一个服务进程内由工具层、libllama、ggml 三层组成，ggml 的后端调度器把计算分给 CPU、Metal、CUDA、Vulkan、SYCL 或 RPC 后端。</desc>
<defs><style>
#llamacpp-stack-root text { font-family: Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #172b3a; }
#llamacpp-stack-root .h { font-size: 26px; font-weight: 700; }
#llamacpp-stack-root .t { font-size: 19px; font-weight: 600; }
#llamacpp-stack-root .s { font-size: 15px; fill: #475569; }
#llamacpp-stack-root .xs { font-size: 13px; fill: #64748b; }
#llamacpp-stack-root .k { font-size: 13px; font-weight: 700; letter-spacing: .04em; fill: #64748b; }
#llamacpp-stack-root .m { font-family: 'SFMono-Regular', Menlo, Consolas, monospace; font-size: 14px; fill: #172b3a; }
#llamacpp-stack-root .node { fill: #fff; stroke: #cbd5e1; stroke-width: 2; }
#llamacpp-stack-root .blue { fill: #eff6ff; stroke: #60a5fa; stroke-width: 2; }
#llamacpp-stack-root .green { fill: #ecfdf5; stroke: #20a28c; stroke-width: 2; }
#llamacpp-stack-root .red { fill: #fff1f2; stroke: #e88191; stroke-width: 2; }
#llamacpp-stack-root .amber { fill: #fffbeb; stroke: #e0a63a; stroke-width: 2; }
#llamacpp-stack-root .violet { fill: #f5f3ff; stroke: #9b87f5; stroke-width: 2; }
#llamacpp-stack-root .gray { fill: #f1f5f9; stroke: #cbd5e1; stroke-width: 2; }
#llamacpp-stack-root .fblue { fill: #93c5fd; } #llamacpp-stack-root .fgreen { fill: #6ee7b7; } #llamacpp-stack-root .fred { fill: #fda4af; }
#llamacpp-stack-root .famber { fill: #fcd34d; } #llamacpp-stack-root .fviolet { fill: #c4b5fd; } #llamacpp-stack-root .fgray { fill: #e2e8f0; }
#llamacpp-stack-root .edge { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#llamacpp-stack-arrow); }
#llamacpp-stack-root .dash { fill: none; stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 7 6; marker-end: url(#llamacpp-stack-arrow); }
#llamacpp-stack-root .line { stroke: #cbd5e1; stroke-width: 1.5; fill: none; }
#llamacpp-stack-root .axis { stroke: #64748b; stroke-width: 2; fill: none; }
</style><marker id="llamacpp-stack-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker></defs>
<rect width="1340" height="640" fill="#f8fafc"/>
<text x="32" y="46" class="h">llama.cpp：一条模型流水线，三层代码</text>
<text x="32" y="78" class="s">上排是模型文件怎样准备出来；下排是加载之后，一次推理在进程里经过的层次</text>
<g data-node="step-0"><rect x="32" y="112" width="230" height="132" rx="8" class="node"/><text x="50" y="138" class="k">原始权重</text><text x="50" y="164" class="t">safetensors</text><text x="50" y="192" class="s">Hugging Face 仓库</text><text x="50" y="215" class="s">config + tokenizer</text></g><path d="M264 178H294" class="edge"/><g data-node="step-1"><rect x="298" y="112" width="230" height="132" rx="8" class="blue"/><text x="316" y="138" class="k">转换</text><text x="316" y="164" class="t">HF → GGUF</text><text x="316" y="192" class="s">convert_hf_to_gguf.py</text><text x="316" y="215" class="s">通常输出 BF16/F16</text></g><path d="M530 178H560" class="edge"/><g data-node="step-2"><rect x="564" y="112" width="230" height="132" rx="8" class="violet"/><text x="582" y="138" class="k">校准（可选）</text><text x="582" y="164" class="t">llama-imatrix</text><text x="582" y="192" class="s">用一段文本统计</text><text x="582" y="215" class="s">每列权重的重要性</text></g><path d="M796 178H826" class="edge"/><g data-node="step-3"><rect x="830" y="112" width="230" height="132" rx="8" class="amber"/><text x="848" y="138" class="k">量化</text><text x="848" y="164" class="t">llama-quantize</text><text x="848" y="192" class="s">BF16 → Q4_K_M 等</text><text x="848" y="215" class="s">IQ1/IQ2 必须 imatrix</text></g><path d="M1062 178H1092" class="edge"/><g data-node="step-4"><rect x="1096" y="112" width="230" height="132" rx="8" class="green"/><text x="1114" y="138" class="k">运行</text><text x="1114" y="164" class="t">llama-server / cli</text><text x="1114" y="192" class="s">加载 GGUF</text><text x="1114" y="215" class="s">按 -ngl 放到设备</text></g><path d="M413 246C413 284 870 284 870 248" class="dash"/><rect x="548" y="264" width="250" height="26" rx="4" fill="#f8fafc"/><text x="554" y="282" class="s">不需要 IQ 低位类型时可跳过校准</text><rect x="32" y="320" width="1276" height="296" rx="10" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="6 6"/><text x="50" y="348" class="k">一个 llama-server 进程的内部分层</text><g data-node="tools"><rect x="50" y="364" width="400" height="100" rx="8" class="green"/><text x="68" y="400" class="t">工具层（tools/）</text><text x="68" y="428" class="s">HTTP 接口、槽位调度、对话模板</text><text x="68" y="451" class="s">采样、语法约束、投机解码</text></g><g data-node="libllama"><rect x="470" y="364" width="400" height="100" rx="8" class="blue"/><text x="488" y="400" class="t">libllama（src/）</text><text x="488" y="428" class="s">读 GGUF、分词、按架构建计算图</text><text x="488" y="451" class="s">KV Cache、批次拆分、上下文</text></g><g data-node="ggml"><rect x="890" y="364" width="400" height="100" rx="8" class="violet"/><text x="908" y="400" class="t">ggml</text><text x="908" y="428" class="s">张量与计算图、量化格式</text><text x="908" y="451" class="s">后端调度器把节点分给设备</text></g><path d="M452 414H466" class="edge"/><path d="M872 414H886" class="edge"/><g data-node="be-0"><rect x="50" y="506" width="196" height="88" rx="8" class="node"/><text x="68" y="542" class="t">CPU</text><text x="68" y="570" class="s">NEON / AVX / AMX</text></g><g data-node="be-1"><rect x="262" y="506" width="196" height="88" rx="8" class="node"/><text x="280" y="542" class="t">Metal</text><text x="280" y="570" class="s">Apple GPU</text></g><g data-node="be-2"><rect x="474" y="506" width="196" height="88" rx="8" class="node"/><text x="492" y="542" class="t">CUDA / HIP</text><text x="492" y="570" class="s">NVIDIA / AMD</text></g><g data-node="be-3"><rect x="686" y="506" width="196" height="88" rx="8" class="node"/><text x="704" y="542" class="t">Vulkan</text><text x="704" y="570" class="s">跨厂商 GPU</text></g><g data-node="be-4"><rect x="898" y="506" width="196" height="88" rx="8" class="node"/><text x="916" y="542" class="t">SYCL / CANN</text><text x="916" y="570" class="s">Intel / 昇腾</text></g><g data-node="be-5"><rect x="1110" y="506" width="196" height="88" rx="8" class="gray"/><text x="1128" y="542" class="t">RPC</text><text x="1128" y="570" class="s">远端机器上的后端</text></g><path d="M1090 466V486M148 486H1208" fill="none" stroke="#64748b" stroke-width="2"/><path d="M148 486V502" class="edge"/><path d="M360 486V502" class="edge"/><path d="M572 486V502" class="edge"/><path d="M784 486V502" class="edge"/><path d="M996 486V502" class="edge"/><path d="M1208 486V502" class="edge"/>
</svg>
