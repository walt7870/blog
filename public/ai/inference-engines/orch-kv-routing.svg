<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1340" height="820" viewBox="0 0 1340 820" role="img" aria-labelledby="orch-kv-routing-title orch-kv-routing-desc" id="orch-kv-routing-root">
<title id="orch-kv-routing-title">KV 感知路由怎样为一个请求选择副本</title>
<desc id="orch-kv-routing-desc">路由器把请求按 KV 块计算前缀哈希，在全局 KV 索引中查出每个副本已缓存的连续前缀块数，再按“待算 Prefill 块数加预计 Decode 块数”为每个副本计算成本。示例中副本 A 命中 40 块但活跃 300 块，成本 360；副本 B 不命中但活跃 120 块，成本 220；副本 C 命中 40 块、活跃 150 块，成本 210，被选中。副本通过 KV 事件把块的存入和淘汰报告给索引。</desc>
<defs><style>
#orch-kv-routing-root text { font-family: Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #172b3a; }
#orch-kv-routing-root .h { font-size: 26px; font-weight: 700; }
#orch-kv-routing-root .t { font-size: 19px; font-weight: 600; }
#orch-kv-routing-root .s { font-size: 15px; fill: #475569; }
#orch-kv-routing-root .xs { font-size: 13px; fill: #64748b; }
#orch-kv-routing-root .k { font-size: 13px; font-weight: 700; letter-spacing: .04em; fill: #64748b; }
#orch-kv-routing-root .m { font-family: 'SFMono-Regular', Menlo, Consolas, monospace; font-size: 14px; fill: #172b3a; }
#orch-kv-routing-root .node { fill: #fff; stroke: #cbd5e1; stroke-width: 2; }
#orch-kv-routing-root .blue { fill: #eff6ff; stroke: #60a5fa; stroke-width: 2; }
#orch-kv-routing-root .green { fill: #ecfdf5; stroke: #20a28c; stroke-width: 2; }
#orch-kv-routing-root .red { fill: #fff1f2; stroke: #e88191; stroke-width: 2; }
#orch-kv-routing-root .amber { fill: #fffbeb; stroke: #e0a63a; stroke-width: 2; }
#orch-kv-routing-root .violet { fill: #f5f3ff; stroke: #9b87f5; stroke-width: 2; }
#orch-kv-routing-root .gray { fill: #f1f5f9; stroke: #cbd5e1; stroke-width: 2; }
#orch-kv-routing-root .fblue { fill: #93c5fd; } #orch-kv-routing-root .fgreen { fill: #6ee7b7; } #orch-kv-routing-root .fred { fill: #fda4af; }
#orch-kv-routing-root .famber { fill: #fcd34d; } #orch-kv-routing-root .fviolet { fill: #c4b5fd; } #orch-kv-routing-root .fgray { fill: #e2e8f0; }
#orch-kv-routing-root .edge { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#orch-kv-routing-arrow); }
#orch-kv-routing-root .dash { fill: none; stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 7 6; marker-end: url(#orch-kv-routing-arrow); }
#orch-kv-routing-root .line { stroke: #cbd5e1; stroke-width: 1.5; fill: none; }
#orch-kv-routing-root .axis { stroke: #64748b; stroke-width: 2; fill: none; }
</style><marker id="orch-kv-routing-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker></defs>
<rect width="1340" height="820" fill="#f8fafc"/>
<text x="32" y="46" class="h">KV 感知路由：命中和负载一起算</text>
<text x="32" y="78" class="s">公式取自 Dynamo Router 的默认成本函数（重叠抵扣 1.0、Prefill 权重 1.0）；llm-d、AIBrix 用打分插件表达同一种取舍</text>
<g data-node="req"><rect x="32" y="112" width="300" height="150" rx="8" class="blue"/><text x="50" y="138" class="k">1 进入路由器</text><text x="50" y="164" class="t">新请求：资料问答</text><text x="50" y="192" class="s">系统提示 + 员工手册片段 + 问题</text><text x="50" y="215" class="s">共 50 个 KV 块</text></g><g data-node="hash"><rect x="32" y="300" width="300" height="150" rx="8" class="node"/><text x="50" y="326" class="k">2 分词与切块</text><text x="50" y="352" class="t">按块计算前缀哈希</text><text x="50" y="380" class="s">h1 → h2 → … → h50</text><text x="50" y="403" class="s">每个哈希包含前面所有块</text></g><path d="M182 264V298" class="edge"/><g data-node="index"><rect x="380" y="300" width="340" height="150" rx="8" class="violet"/><text x="398" y="326" class="k">3 查索引</text><text x="398" y="352" class="t">全局 KV 索引</text><text x="398" y="380" class="s">记录每个哈希在哪些副本上</text><text x="398" y="403" class="s">查到最长连续命中前缀</text></g><path d="M334 375H378" class="edge"/><g data-node="w-A"><rect x="800" y="112" width="508" height="150" rx="8" class="node"/><text x="818" y="138" class="k">4 打分</text><text x="818" y="164" class="t">副本 A：命中 40 块，活跃 300 块</text><text x="818" y="192" class="s">成本 = 待算 Prefill 块 + 预计 Decode 块</text><text x="818" y="215" class="s">max(0, 50−40) + (300+50) = 360</text></g><g data-node="w-B"><rect x="800" y="300" width="508" height="150" rx="8" class="node"/><text x="818" y="326" class="k">4 打分</text><text x="818" y="352" class="t">副本 B：命中 0 块，活跃 120 块</text><text x="818" y="380" class="s">成本 = 待算 Prefill 块 + 预计 Decode 块</text><text x="818" y="403" class="s">max(0, 50−0) + (120+50) = 220</text></g><g data-node="w-C"><rect x="800" y="488" width="508" height="150" rx="8" class="green"/><text x="818" y="514" class="k">4 选中：成本最低</text><text x="818" y="540" class="t">副本 C：命中 40 块，活跃 150 块</text><text x="818" y="568" class="s">成本 = 待算 Prefill 块 + 预计 Decode 块</text><text x="818" y="591" class="s">max(0, 50−40) + (150+50) = 210</text></g><path d="M722 340C760 340 760 187 798 187" class="edge"/><path d="M722 375H798" class="edge"/><path d="M722 410C760 410 760 563 798 563" class="edge"/><g data-node="events"><rect x="380" y="676" width="928" height="112" rx="8" class="amber"/><text x="398" y="702" class="k">5 反馈</text><text x="398" y="728" class="t">副本上报 KV 事件：块存入、块淘汰</text><text x="398" y="756" class="s">路由器据此更新索引；事件滞后或丢失时，索引会和真实缓存不一致，只能当作“估计”</text></g><path d="M1054 640V674" class="dash"/><path d="M550 674V452" class="dash"/><g data-node="note"><rect x="32" y="488" width="300" height="300" rx="8" class="gray"/><text x="50" y="524" class="t">读法</text><text x="50" y="552" class="s">A 缓存最多但很忙；</text><text x="50" y="575" class="s">B 最闲但要从头算；</text><text x="50" y="598" class="s">C 两头都过得去。</text><text x="50" y="621" class="s">只看命中会选 A，</text><text x="50" y="644" class="s">只看负载会选 B。</text><text x="50" y="667" class="s">数字为教学示例。</text></g>
</svg>
