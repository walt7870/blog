<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1340" height="560" viewBox="0 0 1340 560" role="img" aria-labelledby="mlx-memory-title mlx-memory-desc" id="mlx-memory-root">
<title id="mlx-memory-title">独立显卡与 Apple 统一内存的对比</title>
<desc id="mlx-memory-desc">独立显卡需要把权重从系统内存经 PCIe 拷贝到显存；Apple 统一内存中 CPU 和 GPU 共用同一块内存，本机 24 GiB 中 GPU 推荐工作集约 17.8 GiB，8B 模型 4 位权重约 4.3 GiB，8192 token 的 KV 约 1.1 GiB。</desc>
<defs><style>
#mlx-memory-root text { font-family: Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #172b3a; }
#mlx-memory-root .h { font-size: 26px; font-weight: 700; }
#mlx-memory-root .t { font-size: 19px; font-weight: 600; }
#mlx-memory-root .s { font-size: 15px; fill: #475569; }
#mlx-memory-root .xs { font-size: 13px; fill: #64748b; }
#mlx-memory-root .k { font-size: 13px; font-weight: 700; letter-spacing: .04em; fill: #64748b; }
#mlx-memory-root .m { font-family: 'SFMono-Regular', Menlo, Consolas, monospace; font-size: 14px; fill: #172b3a; }
#mlx-memory-root .node { fill: #fff; stroke: #cbd5e1; stroke-width: 2; }
#mlx-memory-root .blue { fill: #eff6ff; stroke: #60a5fa; stroke-width: 2; }
#mlx-memory-root .green { fill: #ecfdf5; stroke: #20a28c; stroke-width: 2; }
#mlx-memory-root .red { fill: #fff1f2; stroke: #e88191; stroke-width: 2; }
#mlx-memory-root .amber { fill: #fffbeb; stroke: #e0a63a; stroke-width: 2; }
#mlx-memory-root .violet { fill: #f5f3ff; stroke: #9b87f5; stroke-width: 2; }
#mlx-memory-root .gray { fill: #f1f5f9; stroke: #cbd5e1; stroke-width: 2; }
#mlx-memory-root .fblue { fill: #93c5fd; } #mlx-memory-root .fgreen { fill: #6ee7b7; } #mlx-memory-root .fred { fill: #fda4af; }
#mlx-memory-root .famber { fill: #fcd34d; } #mlx-memory-root .fviolet { fill: #c4b5fd; } #mlx-memory-root .fgray { fill: #e2e8f0; }
#mlx-memory-root .edge { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#mlx-memory-arrow); }
#mlx-memory-root .dash { fill: none; stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 7 6; marker-end: url(#mlx-memory-arrow); }
#mlx-memory-root .line { stroke: #cbd5e1; stroke-width: 1.5; fill: none; }
#mlx-memory-root .axis { stroke: #64748b; stroke-width: 2; fill: none; }
</style><marker id="mlx-memory-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker></defs>
<rect width="1340" height="560" fill="#f8fafc"/>
<text x="32" y="46" class="h">统一内存：省掉拷贝，但上限比标称小</text>
<text x="32" y="78" class="s">下方条形按比例绘制：24 GiB 总量中，GPU 默认能稳定使用的约四分之三</text>
<g data-node="dgpu"><rect x="32" y="108" width="1276" height="150" rx="8" class="node"/><text x="50" y="134" class="k">独立显卡：两块内存，权重要先拷进显存</text></g><g data-node="ram"><rect x="64" y="152" width="300" height="82" rx="8" class="gray"/><text x="82" y="188" class="t">系统内存</text><text x="82" y="216" class="s">CPU 使用</text></g><g data-node="vram"><rect x="560" y="152" width="300" height="82" rx="8" class="blue"/><text x="578" y="188" class="t">显存</text><text x="578" y="216" class="s">GPU 只能读这里</text></g><path d="M364 193H556" class="edge"/><rect x="392" y="164" width="128" height="26" rx="4" fill="#f8fafc"/><text x="398" y="182" class="s">PCIe 拷贝权重</text><text x="900" y="186" class="s">显存容量决定能放多大的模型，</text><text x="900" y="212" class="s">系统内存再大也帮不上 GPU。</text><g data-node="uma"><rect x="32" y="282" width="1276" height="254" rx="8" class="node"/><text x="50" y="308" class="k">Apple 统一内存（本机 M4，24 GiB）：CPU 和 GPU 读同一块内存</text></g><rect x="64" y="360" width="1200" height="56" rx="4" class="fgray"/><rect x="64" y="360" width="888" height="56" rx="4" class="fblue"/><rect x="64" y="360" width="215" height="56" rx="4" class="famber"/><text x="171.5" y="393" text-anchor="middle" class="xs">8B 4 位权重 ≈ 4.3 GiB</text><rect x="279" y="360" width="56" height="56" rx="4" class="fgreen"/><text x="307" y="393" text-anchor="middle" class="xs">KV</text><path d="M863 346V430" class="axis"/><text x="857" y="340" class="xs" text-anchor="end">90%：mlx-lm 开始警告</text><text x="960" y="394" class="xs">系统与其他应用</text><text x="64" y="448" class="s">蓝色：GPU 推荐工作集上限 ≈ 17.8 GiB（总量的 74%，本机 mx.device_info() 实测）</text><text x="64" y="474" class="s">绿色 KV：Qwen3-8B 上下文 8192 token 时约 1.1 GiB；超出蓝色区域后会变慢，可用 sysctl iogpu.wired_limit_mb 调整上限</text>
</svg>
