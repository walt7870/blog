<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1340" height="560" viewBox="0 0 1340 560" role="img" aria-labelledby="lmdeploy-proxy-title lmdeploy-proxy-desc" id="lmdeploy-proxy-root">
<title id="lmdeploy-proxy-title">LMDeploy proxy 的两种部署方式</title>
<desc id="lmdeploy-proxy-desc">左侧 Hybrid 模式下，客户端访问 proxy，proxy 按路由策略把请求分给多个完整的 api_server；右侧 DistServe 模式下，proxy 先把请求交给 Prefill 实例，KV 迁移到 Decode 实例后继续生成并经 proxy 返回。</desc>
<defs><style>
#lmdeploy-proxy-root text { font-family: Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #172b3a; }
#lmdeploy-proxy-root .h { font-size: 26px; font-weight: 700; }
#lmdeploy-proxy-root .t { font-size: 19px; font-weight: 600; }
#lmdeploy-proxy-root .s { font-size: 15px; fill: #475569; }
#lmdeploy-proxy-root .xs { font-size: 13px; fill: #64748b; }
#lmdeploy-proxy-root .k { font-size: 13px; font-weight: 700; letter-spacing: .04em; fill: #64748b; }
#lmdeploy-proxy-root .m { font-family: 'SFMono-Regular', Menlo, Consolas, monospace; font-size: 14px; fill: #172b3a; }
#lmdeploy-proxy-root .node { fill: #fff; stroke: #cbd5e1; stroke-width: 2; }
#lmdeploy-proxy-root .blue { fill: #eff6ff; stroke: #60a5fa; stroke-width: 2; }
#lmdeploy-proxy-root .green { fill: #ecfdf5; stroke: #20a28c; stroke-width: 2; }
#lmdeploy-proxy-root .red { fill: #fff1f2; stroke: #e88191; stroke-width: 2; }
#lmdeploy-proxy-root .amber { fill: #fffbeb; stroke: #e0a63a; stroke-width: 2; }
#lmdeploy-proxy-root .violet { fill: #f5f3ff; stroke: #9b87f5; stroke-width: 2; }
#lmdeploy-proxy-root .gray { fill: #f1f5f9; stroke: #cbd5e1; stroke-width: 2; }
#lmdeploy-proxy-root .fblue { fill: #93c5fd; } #lmdeploy-proxy-root .fgreen { fill: #6ee7b7; } #lmdeploy-proxy-root .fred { fill: #fda4af; }
#lmdeploy-proxy-root .famber { fill: #fcd34d; } #lmdeploy-proxy-root .fviolet { fill: #c4b5fd; } #lmdeploy-proxy-root .fgray { fill: #e2e8f0; }
#lmdeploy-proxy-root .edge { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#lmdeploy-proxy-arrow); }
#lmdeploy-proxy-root .dash { fill: none; stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 7 6; marker-end: url(#lmdeploy-proxy-arrow); }
#lmdeploy-proxy-root .line { stroke: #cbd5e1; stroke-width: 1.5; fill: none; }
#lmdeploy-proxy-root .axis { stroke: #64748b; stroke-width: 2; fill: none; }
</style><marker id="lmdeploy-proxy-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker></defs>
<rect width="1340" height="560" fill="#f8fafc"/>
<text x="32" y="46" class="h">多个实例怎样组织成一个入口</text>
<text x="32" y="78" class="s">同一个 lmdeploy serve proxy，换一个 --serving-strategy 就是两种拓扑</text>
<g data-node="hybrid"><rect x="32" y="108" width="620" height="420" rx="8" class="node"/><text x="50" y="134" class="k">Hybrid（默认）：每个实例完整地处理请求</text></g><g data-node="h-client"><rect x="56" y="196" width="150" height="96" rx="8" class="gray"/><text x="74" y="232" class="t">客户端</text><text x="74" y="260" class="s">只认代理地址</text></g><g data-node="h-proxy"><rect x="246" y="166" width="170" height="156" rx="8" class="amber"/><text x="264" y="192" class="k">serve proxy</text><text x="264" y="218" class="t">proxy</text><text x="264" y="246" class="s">端口 8000</text><text x="264" y="269" class="s">按估算完成</text><text x="264" y="292" class="s">时间选节点</text></g><g data-node="h-n1"><rect x="458" y="150" width="170" height="72" rx="8" class="blue"/><text x="476" y="186" class="t">api_server</text></g><g data-node="h-n2"><rect x="458" y="240" width="170" height="72" rx="8" class="blue"/><text x="476" y="276" class="t">api_server</text></g><g data-node="h-n3"><rect x="458" y="330" width="170" height="72" rx="8" class="blue"/><text x="476" y="366" class="t">api_server</text></g><path d="M206 244H242" class="edge"/><path d="M416 200C436 200 436 186 454 186" class="edge"/><path d="M416 244C436 244 436 276 454 276" class="edge"/><path d="M416 290C436 290 436 366 454 366" class="edge"/><text x="56" y="440" class="s">实例启动时加 --proxy-url 自动注册；</text><text x="56" y="466" class="s">也可用 /nodes/add、/nodes/remove 管理。</text><text x="56" y="492" class="s">路由策略不考虑前缀缓存命中。</text><g data-node="dist"><rect x="688" y="108" width="620" height="420" rx="8" class="node"/><text x="706" y="134" class="k">DistServe：Prefill 与 Decode 分到不同实例</text></g><g data-node="d-client"><rect x="712" y="196" width="150" height="96" rx="8" class="gray"/><text x="730" y="232" class="t">客户端</text><text x="730" y="260" class="s">同样只认代理</text></g><g data-node="d-proxy"><rect x="902" y="166" width="170" height="156" rx="8" class="amber"/><text x="920" y="192" class="k">serve proxy</text><text x="920" y="218" class="t">proxy</text><text x="920" y="246" class="s">按 DistServe</text><text x="920" y="269" class="s">策略编排</text><text x="920" y="292" class="s">先 P 后 D</text></g><g data-node="d-pre"><rect x="1114" y="150" width="170" height="112" rx="8" class="blue"/><text x="1132" y="186" class="t">Prefill 实例</text><text x="1132" y="214" class="s">--role Prefill</text></g><g data-node="d-dec"><rect x="1114" y="340" width="170" height="112" rx="8" class="green"/><text x="1132" y="376" class="t">Decode 实例</text><text x="1132" y="404" class="s">--role Decode</text></g><path d="M862 244H898" class="edge"/><path d="M1072 206H1110" class="edge"/><path d="M1199 262V336" class="edge"/><path d="M1110 396H988V326" class="dash"/><rect x="1204" y="272" width="72" height="26" rx="4" fill="#f8fafc"/><text x="1210" y="290" class="s">KV 迁移</text><text x="712" y="440" class="s">KV 经 DLSlime 或 Mooncake 传输，</text><text x="712" y="466" class="s">默认 RDMA，可选 NVLink；</text><text x="712" y="492" class="s">两类实例都必须用 PyTorch 引擎。</text>
</svg>
