<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1340" height="600" viewBox="0 0 1340 600" role="img" aria-labelledby="llamacpp-slots-title llamacpp-slots-desc" id="llamacpp-slots-root">
<title id="llamacpp-slots-title">llama-server 的槽位、连续批处理和 KV 池两种分配方式</title>
<desc id="llamacpp-slots-desc">请求进入任务队列，分配到空闲槽位；每一步把所有活跃槽的 token 拼成一个批次调用 llama_decode，结束的槽释放后补入新请求。下方对比：不写 -np 时 4 个槽共用一个 16384 单元的 KV 池；显式写 -np 4 时池被平均切成每槽 4096。</desc>
<defs><style>
#llamacpp-slots-root text { font-family: Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #172b3a; }
#llamacpp-slots-root .h { font-size: 26px; font-weight: 700; }
#llamacpp-slots-root .t { font-size: 19px; font-weight: 600; }
#llamacpp-slots-root .s { font-size: 15px; fill: #475569; }
#llamacpp-slots-root .xs { font-size: 13px; fill: #64748b; }
#llamacpp-slots-root .k { font-size: 13px; font-weight: 700; letter-spacing: .04em; fill: #64748b; }
#llamacpp-slots-root .m { font-family: 'SFMono-Regular', Menlo, Consolas, monospace; font-size: 14px; fill: #172b3a; }
#llamacpp-slots-root .node { fill: #fff; stroke: #cbd5e1; stroke-width: 2; }
#llamacpp-slots-root .blue { fill: #eff6ff; stroke: #60a5fa; stroke-width: 2; }
#llamacpp-slots-root .green { fill: #ecfdf5; stroke: #20a28c; stroke-width: 2; }
#llamacpp-slots-root .red { fill: #fff1f2; stroke: #e88191; stroke-width: 2; }
#llamacpp-slots-root .amber { fill: #fffbeb; stroke: #e0a63a; stroke-width: 2; }
#llamacpp-slots-root .violet { fill: #f5f3ff; stroke: #9b87f5; stroke-width: 2; }
#llamacpp-slots-root .gray { fill: #f1f5f9; stroke: #cbd5e1; stroke-width: 2; }
#llamacpp-slots-root .fblue { fill: #93c5fd; } #llamacpp-slots-root .fgreen { fill: #6ee7b7; } #llamacpp-slots-root .fred { fill: #fda4af; }
#llamacpp-slots-root .famber { fill: #fcd34d; } #llamacpp-slots-root .fviolet { fill: #c4b5fd; } #llamacpp-slots-root .fgray { fill: #e2e8f0; }
#llamacpp-slots-root .edge { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#llamacpp-slots-arrow); }
#llamacpp-slots-root .dash { fill: none; stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 7 6; marker-end: url(#llamacpp-slots-arrow); }
#llamacpp-slots-root .line { stroke: #cbd5e1; stroke-width: 1.5; fill: none; }
#llamacpp-slots-root .axis { stroke: #64748b; stroke-width: 2; fill: none; }
</style><marker id="llamacpp-slots-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker></defs>
<rect width="1340" height="600" fill="#f8fafc"/>
<text x="32" y="46" class="h">llama-server：槽位、批次与 KV 池</text>
<text x="32" y="78" class="s">-c 是整个 KV 池的大小；它怎样分给各槽，取决于有没有显式写 -np</text>
<g data-node="clients"><rect x="32" y="120" width="220" height="170" rx="8" class="node"/><text x="50" y="146" class="k">HTTP</text><text x="50" y="172" class="t">客户端请求</text><text x="50" y="200" class="s">/v1/chat/completions</text><text x="50" y="223" class="s">/v1/embeddings</text><text x="50" y="246" class="s">多个用户同时发</text></g><g data-node="queue"><rect x="300" y="120" width="220" height="170" rx="8" class="amber"/><text x="318" y="146" class="k">服务端</text><text x="318" y="172" class="t">任务队列</text><text x="318" y="200" class="s">有空槽：立刻分配</text><text x="318" y="223" class="s">无空槽：排队等待</text><text x="318" y="246" class="s">前缀相似的优先同槽</text></g><path d="M254 205H296" class="edge"/><path d="M522 205H562" class="edge"/><text x="566" y="100" class="k">-np 个槽位（默认 auto = 4）</text><rect x="566" y="108" width="250" height="44" rx="4" class="fgreen"/><text x="691" y="135" text-anchor="middle" class="s">槽 0  生成中</text><rect x="566" y="162" width="250" height="44" rx="4" class="fblue"/><text x="691" y="189" text-anchor="middle" class="s">槽 1  处理 Prompt</text><rect x="566" y="216" width="250" height="44" rx="4" class="fgreen"/><text x="691" y="243" text-anchor="middle" class="s">槽 2  生成中</text><rect x="566" y="270" width="250" height="44" rx="4" class="fgray"/><text x="691" y="297" text-anchor="middle" class="s">槽 3  空闲</text><path d="M820 205H860" class="edge"/><g data-node="batch"><rect x="864" y="120" width="200" height="170" rx="8" class="violet"/><text x="882" y="146" class="k">每一步</text><text x="882" y="172" class="t">拼一个批次</text><text x="882" y="200" class="s">所有活跃槽</text><text x="882" y="223" class="s">这一步的 token</text><text x="882" y="246" class="s">一起送进模型</text></g><path d="M1066 205H1104" class="edge"/><g data-node="decode"><rect x="1108" y="120" width="200" height="170" rx="8" class="blue"/><text x="1126" y="146" class="k">libllama</text><text x="1126" y="172" class="t">llama_decode</text><text x="1126" y="200" class="s">一次前向</text><text x="1126" y="223" class="s">各槽各自采样</text><text x="1126" y="246" class="s">新 token 回到槽</text></g><path d="M1208 292V320H691V316" class="dash"/><rect x="794" y="326" width="420" height="26" rx="4" fill="#f8fafc"/><text x="800" y="344" class="s">下一步：结束的槽释放，新请求补进来（连续批处理）</text><g data-node="unified"><rect x="32" y="380" width="620" height="190" rx="8" class="green"/><text x="50" y="406" class="k">-c 16384</text><text x="50" y="432" class="t">不写 -np：统一 KV 池（kv_unified = true）</text></g><rect x="50" y="442" width="33.5" height="34" rx="4" class="fgreen"/><rect x="86.5" y="442" width="33.5" height="34" rx="4" class="fgreen"/><rect x="123" y="442" width="33.5" height="34" rx="4" class="fgreen"/><rect x="159.5" y="442" width="33.5" height="34" rx="4" class="fgreen"/><rect x="196" y="442" width="33.5" height="34" rx="4" class="fgreen"/><rect x="232.5" y="442" width="33.5" height="34" rx="4" class="fblue"/><rect x="269" y="442" width="33.5" height="34" rx="4" class="fblue"/><rect x="305.5" y="442" width="33.5" height="34" rx="4" class="fblue"/><rect x="342" y="442" width="33.5" height="34" rx="4" class="fgreen"/><rect x="378.5" y="442" width="33.5" height="34" rx="4" class="fgreen"/><rect x="415" y="442" width="33.5" height="34" rx="4" class="fgreen"/><rect x="451.5" y="442" width="33.5" height="34" rx="4" class="fgray"/><rect x="488" y="442" width="33.5" height="34" rx="4" class="fgray"/><rect x="524.5" y="442" width="33.5" height="34" rx="4" class="fgray"/><rect x="561" y="442" width="33.5" height="34" rx="4" class="fgray"/><rect x="597.5" y="442" width="33.5" height="34" rx="4" class="fgray"/><text x="50" y="506" class="s">16384 个单元由 4 个槽共用，哪个槽长就多占。</text><text x="50" y="532" class="s">单个请求最长可以用到 16384；总量仍是 16384。</text><g data-node="split"><rect x="688" y="380" width="620" height="190" rx="8" class="amber"/><text x="706" y="406" class="k">-c 16384 -np 4</text><text x="706" y="432" class="t">写了 -np 4：平均切分（kv_unified = false）</text></g><rect x="706" y="442" width="33.5" height="34" rx="4" class="fgreen"/><rect x="742.5" y="442" width="33.5" height="34" rx="4" class="fgreen"/><rect x="779" y="442" width="33.5" height="34" rx="4" class="fgray"/><rect x="815.5" y="442" width="33.5" height="34" rx="4" class="fgray"/><rect x="852" y="442" width="33.5" height="34" rx="4" class="fblue"/><rect x="888.5" y="442" width="33.5" height="34" rx="4" class="fblue"/><rect x="925" y="442" width="33.5" height="34" rx="4" class="fblue"/><rect x="961.5" y="442" width="33.5" height="34" rx="4" class="fgray"/><rect x="998" y="442" width="33.5" height="34" rx="4" class="fgreen"/><rect x="1034.5" y="442" width="33.5" height="34" rx="4" class="fgreen"/><rect x="1071" y="442" width="33.5" height="34" rx="4" class="fgreen"/><rect x="1107.5" y="442" width="33.5" height="34" rx="4" class="fgreen"/><rect x="1144" y="442" width="33.5" height="34" rx="4" class="fgray"/><rect x="1180.5" y="442" width="33.5" height="34" rx="4" class="fgray"/><rect x="1217" y="442" width="33.5" height="34" rx="4" class="fgray"/><rect x="1253.5" y="442" width="33.5" height="34" rx="4" class="fgray"/><rect x="849" y="436" width="3" height="46" fill="#172b3a"/><rect x="995" y="436" width="3" height="46" fill="#172b3a"/><rect x="1141" y="436" width="3" height="46" fill="#172b3a"/><text x="706" y="506" class="s">每个槽固定 4096，超过就要截断或报错，</text><text x="706" y="532" class="s">即使别的槽空着也借不到。</text>
</svg>
