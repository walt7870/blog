<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1340" height="430" viewBox="0 0 1340 430" role="img" aria-labelledby="llamacpp-gguf-title llamacpp-gguf-desc" id="llamacpp-gguf-root">
<title id="llamacpp-gguf-title">GGUF 文件的四段结构</title>
<desc id="llamacpp-gguf-desc">GGUF 文件依次是文件头、元数据键值对、张量信息表和按对齐存放的张量数据。加载器读完前三段就知道模型架构和张量位置，数据区可以直接内存映射。</desc>
<defs><style>
#llamacpp-gguf-root text { font-family: Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #172b3a; }
#llamacpp-gguf-root .h { font-size: 26px; font-weight: 700; }
#llamacpp-gguf-root .t { font-size: 19px; font-weight: 600; }
#llamacpp-gguf-root .s { font-size: 15px; fill: #475569; }
#llamacpp-gguf-root .xs { font-size: 13px; fill: #64748b; }
#llamacpp-gguf-root .k { font-size: 13px; font-weight: 700; letter-spacing: .04em; fill: #64748b; }
#llamacpp-gguf-root .m { font-family: 'SFMono-Regular', Menlo, Consolas, monospace; font-size: 14px; fill: #172b3a; }
#llamacpp-gguf-root .node { fill: #fff; stroke: #cbd5e1; stroke-width: 2; }
#llamacpp-gguf-root .blue { fill: #eff6ff; stroke: #60a5fa; stroke-width: 2; }
#llamacpp-gguf-root .green { fill: #ecfdf5; stroke: #20a28c; stroke-width: 2; }
#llamacpp-gguf-root .red { fill: #fff1f2; stroke: #e88191; stroke-width: 2; }
#llamacpp-gguf-root .amber { fill: #fffbeb; stroke: #e0a63a; stroke-width: 2; }
#llamacpp-gguf-root .violet { fill: #f5f3ff; stroke: #9b87f5; stroke-width: 2; }
#llamacpp-gguf-root .gray { fill: #f1f5f9; stroke: #cbd5e1; stroke-width: 2; }
#llamacpp-gguf-root .fblue { fill: #93c5fd; } #llamacpp-gguf-root .fgreen { fill: #6ee7b7; } #llamacpp-gguf-root .fred { fill: #fda4af; }
#llamacpp-gguf-root .famber { fill: #fcd34d; } #llamacpp-gguf-root .fviolet { fill: #c4b5fd; } #llamacpp-gguf-root .fgray { fill: #e2e8f0; }
#llamacpp-gguf-root .edge { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#llamacpp-gguf-arrow); }
#llamacpp-gguf-root .dash { fill: none; stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 7 6; marker-end: url(#llamacpp-gguf-arrow); }
#llamacpp-gguf-root .line { stroke: #cbd5e1; stroke-width: 1.5; fill: none; }
#llamacpp-gguf-root .axis { stroke: #64748b; stroke-width: 2; fill: none; }
</style><marker id="llamacpp-gguf-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker></defs>
<rect width="1340" height="430" fill="#f8fafc"/>
<text x="32" y="46" class="h">GGUF：一个文件装下模型需要的一切</text>
<text x="32" y="78" class="s">权重、超参数、分词器和对话模板都在同一个文件里，换机器不用再找配置</text>
<g data-node="part-0"><rect x="32" y="120" width="190" height="150" rx="8" class="gray"/><text x="50" y="156" class="t">文件头</text><text x="50" y="184" class="s">magic "GGUF"</text><text x="50" y="207" class="s">版本 3</text><text x="50" y="230" class="s">张量数、KV 数</text></g><g data-node="part-1"><rect x="238" y="120" width="360" height="150" rx="8" class="blue"/><text x="256" y="156" class="t">元数据 KV</text><text x="256" y="184" class="s">general.architecture</text><text x="256" y="207" class="s">qwen3.block_count = 28</text><text x="256" y="230" class="s">tokenizer.chat_template …</text></g><g data-node="part-2"><rect x="614" y="120" width="300" height="150" rx="8" class="violet"/><text x="632" y="156" class="t">张量信息表</text><text x="632" y="184" class="s">名字、维度、类型</text><text x="632" y="207" class="s">数据区内的偏移</text><text x="632" y="230" class="s">blk.0.attn_q.weight q4_K</text></g><g data-node="part-3"><rect x="930" y="120" width="378" height="150" rx="8" class="green"/><text x="948" y="156" class="t">张量数据（按对齐存放）</text><text x="948" y="184" class="s">可以直接 mmap 进内存</text><text x="948" y="207" class="s">每个张量各有量化类型</text><text x="948" y="230" class="s">同一文件里 q4_K、q6_K、f32 并存</text></g><text x="32" y="318" class="t">读法：</text><text x="98" y="318" class="s">加载器先读前三段（几 MB），就知道架构、超参数、分词器和每个张量在哪；数据区按偏移映射，不必整个读入。</text><text x="98" y="348" class="s">实测 Qwen3-0.6B Q4_K_M：28 个元数据键、310 个张量（f32 113、q4_K 168、q6_K 29），词表嵌入 121.7 MiB 用 q6_K。</text><text x="98" y="378" class="s">同一个模型换量化，只是张量数据和 general.file_type 变了；对话模板等元数据跟着文件走。</text>
</svg>
