<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1380" height="800" viewBox="0 0 1380 800" role="img" aria-labelledby="trtllm-workflow-title trtllm-workflow-desc" id="trtllm-workflow-root">
<title id="trtllm-workflow-title">TensorRT-LLM 从引擎构建流程到 PyTorch 后端的变化与版本时间线</title>
<desc id="trtllm-workflow-desc">上方是旧的 TensorRT 引擎流程：HF 检查点经 convert_checkpoint.py 转换、trtllm-build 编译成绑定 GPU 与上限参数的引擎，再由 C++ Executor 运行。中间是 1.0 起默认的 PyTorch 流程：直接加载 HF 或 ModelOpt 量化检查点，预热、按剩余显存分配 KV、录制 CUDA Graph 后服务。下方时间线：2023-10 发布 0.5.0，2025-09 的 1.0 把 PyTorch 设为默认，2026-04 的 1.2.1 是最新正式版，2026-06 的 1.3.0rc20 是最后带 TensorRT 后端的预发布版，2026-07 的 1.3.0rc21 删除了它，2026-10 的最新预发布是 1.4.0rc1。</desc>
<defs><style>
#trtllm-workflow-root text { font-family: Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #172b3a; }
#trtllm-workflow-root .h { font-size: 26px; font-weight: 700; }
#trtllm-workflow-root .t { font-size: 19px; font-weight: 600; }
#trtllm-workflow-root .s { font-size: 15px; fill: #475569; }
#trtllm-workflow-root .xs { font-size: 13px; fill: #64748b; }
#trtllm-workflow-root .k { font-size: 13px; font-weight: 700; letter-spacing: .04em; fill: #64748b; }
#trtllm-workflow-root .m { font-family: 'SFMono-Regular', Menlo, Consolas, monospace; font-size: 14px; fill: #172b3a; }
#trtllm-workflow-root .node { fill: #fff; stroke: #cbd5e1; stroke-width: 2; }
#trtllm-workflow-root .blue { fill: #eff6ff; stroke: #60a5fa; stroke-width: 2; }
#trtllm-workflow-root .green { fill: #ecfdf5; stroke: #20a28c; stroke-width: 2; }
#trtllm-workflow-root .red { fill: #fff1f2; stroke: #e88191; stroke-width: 2; }
#trtllm-workflow-root .amber { fill: #fffbeb; stroke: #e0a63a; stroke-width: 2; }
#trtllm-workflow-root .violet { fill: #f5f3ff; stroke: #9b87f5; stroke-width: 2; }
#trtllm-workflow-root .gray { fill: #f1f5f9; stroke: #cbd5e1; stroke-width: 2; }
#trtllm-workflow-root .fblue { fill: #93c5fd; } #trtllm-workflow-root .fgreen { fill: #6ee7b7; } #trtllm-workflow-root .fred { fill: #fda4af; }
#trtllm-workflow-root .famber { fill: #fcd34d; } #trtllm-workflow-root .fviolet { fill: #c4b5fd; } #trtllm-workflow-root .fgray { fill: #e2e8f0; }
#trtllm-workflow-root .edge { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#trtllm-workflow-arrow); }
#trtllm-workflow-root .dash { fill: none; stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 7 6; marker-end: url(#trtllm-workflow-arrow); }
#trtllm-workflow-root .line { stroke: #cbd5e1; stroke-width: 1.5; fill: none; }
#trtllm-workflow-root .axis { stroke: #64748b; stroke-width: 2; fill: none; }
</style><marker id="trtllm-workflow-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker></defs>
<rect width="1380" height="800" fill="#f8fafc"/>
<text x="32" y="46" class="h">两条流程：先编译引擎，还是直接加载 PyTorch 模型</text>
<text x="32" y="78" class="s">名字里的 TensorRT 来自旧流程；当前默认路径不再生成 TensorRT 引擎。</text>
<text x="32" y="116" class="k">旧流程：TensorRT 引擎（0.x 的主线；1.2.1 仍可用，1.3.0rc21 起已删除）</text><g data-node="old-0"><rect x="32" y="132" width="236" height="132" rx="8" class="node"/><text x="50" y="168" class="t">HF 检查点</text><text x="50" y="196" class="s">config.json</text><text x="50" y="219" class="s">+ safetensors</text></g><path d="M270 198H294" class="edge"/><g data-node="old-1"><rect x="298" y="132" width="236" height="132" rx="8" class="node"/><text x="316" y="168" class="t">convert_checkpoint.py</text><text x="316" y="196" class="s">每个模型一份脚本</text><text x="316" y="219" class="s">转成 TRT-LLM 检查点</text></g><path d="M536 198H560" class="edge"/><g data-node="old-2"><rect x="564" y="132" width="236" height="132" rx="8" class="amber"/><text x="582" y="168" class="t">trtllm-build</text><text x="582" y="196" class="s">编译 TensorRT 引擎</text><text x="582" y="219" class="s">常需几分钟到更久</text></g><path d="M802 198H826" class="edge"/><g data-node="old-3"><rect x="830" y="132" width="236" height="132" rx="8" class="red"/><text x="848" y="168" class="t">引擎文件</text><text x="848" y="196" class="s">绑定 GPU 架构、TP/PP</text><text x="848" y="219" class="s">max_batch_size 等上限</text></g><path d="M1068 198H1092" class="edge"/><g data-node="old-4"><rect x="1096" y="132" width="236" height="132" rx="8" class="node"/><text x="1114" y="168" class="t">C++ Executor 运行</text><text x="1114" y="196" class="s">改上限要重新构建</text><text x="1114" y="219" class="s">换卡型要重新构建</text></g><text x="32" y="318" class="k">现流程：PyTorch 后端（1.0 起默认，预发布版中是唯一后端）</text><g data-node="new-0"><rect x="32" y="334" width="236" height="132" rx="8" class="node"/><text x="50" y="370" class="t">HF 或 ModelOpt 检查点</text><text x="50" y="398" class="s">原始 BF16 权重</text><text x="50" y="421" class="s">或 FP8 / NVFP4 预量化</text></g><path d="M270 400H294" class="edge"/><g data-node="new-1"><rect x="298" y="334" width="236" height="132" rx="8" class="blue"/><text x="316" y="370" class="t">LLM(model=…)</text><text x="316" y="398" class="s">或 trtllm-serve &lt;模型&gt;</text><text x="316" y="421" class="s">参数写进 YAML</text></g><path d="M536 400H560" class="edge"/><g data-node="new-2"><rect x="564" y="334" width="236" height="132" rx="8" class="blue"/><text x="582" y="370" class="t">加载与预热</text><text x="582" y="398" class="s">加载权重，试跑测峰值</text><text x="582" y="421" class="s">自动调优 GEMM 内核</text></g><path d="M802 400H826" class="edge"/><g data-node="new-3"><rect x="830" y="334" width="236" height="132" rx="8" class="green"/><text x="848" y="370" class="t">分配 KV 与录图</text><text x="848" y="398" class="s">剩余显存 × 0.9 给 KV</text><text x="848" y="421" class="s">按批大小录 CUDA Graph</text></g><path d="M1068 400H1092" class="edge"/><g data-node="new-4"><rect x="1096" y="334" width="236" height="132" rx="8" class="green"/><text x="1114" y="370" class="t">PyExecutor 服务</text><text x="1114" y="398" class="s">改参数只需重启</text><text x="1114" y="421" class="s">无需编译步骤</text></g><text x="32" y="530" class="k">版本时间线（GitHub 发布日期）</text><path d="M60 600H1320" class="axis"/><circle cx="60" cy="600" r="7" class="fblue"/><text x="60" y="554" class="t">0.5.0 首个版本</text><text x="60" y="580" class="s">TensorRT 引擎流程</text><text x="60" y="636" class="xs">2023-10</text><circle cx="438" cy="600" r="7" class="fblue"/><text x="438" y="636" class="t" text-anchor="middle">1.0</text><text x="438" y="662" class="s" text-anchor="middle">PyTorch 成为默认</text><text x="438" y="580" class="xs" text-anchor="middle">2025-09</text><circle cx="715.2" cy="600" r="7" class="fgreen"/><text x="715.2" y="554" class="t" text-anchor="middle">1.2.1</text><text x="715.2" y="580" class="s" text-anchor="middle">最新正式版</text><text x="715.2" y="636" class="xs" text-anchor="middle">2026-04</text><circle cx="942" cy="600" r="7" class="fblue"/><text x="942" y="636" class="t" text-anchor="middle">1.3.0rc20</text><text x="942" y="662" class="s" text-anchor="middle">最后带 TRT 后端</text><text x="942" y="580" class="xs" text-anchor="middle">2026-06</text><circle cx="1118.3999999999999" cy="600" r="7" class="fred"/><text x="1118.3999999999999" y="554" class="t" text-anchor="middle">1.3.0rc21</text><text x="1118.3999999999999" y="580" class="s" text-anchor="middle">删除 TRT 后端</text><text x="1118.3999999999999" y="636" class="xs" text-anchor="middle">2026-07</text><circle cx="1320" cy="600" r="7" class="fred"/><text x="1320" y="636" class="t" text-anchor="end">1.4.0rc1</text><text x="1320" y="662" class="s" text-anchor="end">最新预发布</text><text x="1320" y="580" class="xs" text-anchor="end">2026-10</text><text x="32" y="742" class="s">1.3.0 没有正式版：1.3 系列停在 rc29，随后版本号进入 1.4.0 预发布。</text><text x="32" y="770" class="s">生产环境按正式版 1.2.1 规划；需要预发布版的新模型或新特性时，单独验证并固定镜像。</text>
</svg>
