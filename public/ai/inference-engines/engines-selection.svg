<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="620" viewBox="0 0 1360 620" role="img" aria-labelledby="engines-selection-title engines-selection-desc" id="engines-selection-root">
<title id="engines-selection-title">推理框架的选型路径</title>
<desc id="engines-selection-desc">先看运行位置：个人设备选 Ollama、llama.cpp、MLX-LM 或端侧运行时；GPU 服务器再看硬件，国产卡查插件和 LMDeploy；默认从 vLLM 建基线，前缀复用多或大 MoE 时试 SGLang，固定模型和 NVIDIA 卡追性能时试 TensorRT-LLM；最后按规模决定是否需要 Dynamo、llm-d 这类编排层。</desc>
<defs><style>
#engines-selection-root text { font-family: Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #172b3a; }
#engines-selection-root .h { font-size: 26px; font-weight: 700; }
#engines-selection-root .t { font-size: 19px; font-weight: 600; }
#engines-selection-root .s { font-size: 15px; fill: #475569; }
#engines-selection-root .xs { font-size: 13px; fill: #64748b; }
#engines-selection-root .k { font-size: 13px; font-weight: 700; letter-spacing: .04em; fill: #64748b; }
#engines-selection-root .m { font-family: 'SFMono-Regular', Menlo, Consolas, monospace; font-size: 14px; fill: #172b3a; }
#engines-selection-root .node { fill: #fff; stroke: #cbd5e1; stroke-width: 2; }
#engines-selection-root .blue { fill: #eff6ff; stroke: #60a5fa; stroke-width: 2; }
#engines-selection-root .green { fill: #ecfdf5; stroke: #20a28c; stroke-width: 2; }
#engines-selection-root .red { fill: #fff1f2; stroke: #e88191; stroke-width: 2; }
#engines-selection-root .amber { fill: #fffbeb; stroke: #e0a63a; stroke-width: 2; }
#engines-selection-root .violet { fill: #f5f3ff; stroke: #9b87f5; stroke-width: 2; }
#engines-selection-root .gray { fill: #f1f5f9; stroke: #cbd5e1; stroke-width: 2; }
#engines-selection-root .fblue { fill: #93c5fd; } #engines-selection-root .fgreen { fill: #6ee7b7; } #engines-selection-root .fred { fill: #fda4af; }
#engines-selection-root .famber { fill: #fcd34d; } #engines-selection-root .fviolet { fill: #c4b5fd; } #engines-selection-root .fgray { fill: #e2e8f0; }
#engines-selection-root .edge { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#engines-selection-arrow); }
#engines-selection-root .dash { fill: none; stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 7 6; marker-end: url(#engines-selection-arrow); }
#engines-selection-root .line { stroke: #cbd5e1; stroke-width: 1.5; fill: none; }
#engines-selection-root .axis { stroke: #64748b; stroke-width: 2; fill: none; }
</style><marker id="engines-selection-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker></defs>
<rect width="1360" height="620" fill="#f8fafc"/>
<text x="32" y="46" class="h">怎样选推理框架</text>
<text x="32" y="78" class="s">实线是主路径，虚线是满足条件时的分支；每个候选都要用自己的模型和请求实测</text>
<g data-node="q1"><rect x="32" y="112" width="300" height="104" rx="8" class="amber"/><text x="50" y="148" class="t">在哪里运行？</text><text x="50" y="176" class="s">个人电脑、手机</text><text x="50" y="199" class="s">还是 GPU 服务器</text></g><g data-node="a-local"><rect x="32" y="300" width="300" height="124" rx="8" class="green"/><text x="50" y="336" class="t">本地与端侧</text><text x="50" y="364" class="s">想要现成服务：Ollama</text><text x="50" y="387" class="s">要细调参数：llama.cpp</text><text x="50" y="410" class="s">Mac 上量化微调：MLX-LM</text></g><g data-node="a-edge"><rect x="32" y="470" width="300" height="104" rx="8" class="gray"/><text x="50" y="506" class="t">打包进 App</text><text x="50" y="534" class="s">ExecuTorch、MLC-LLM</text><text x="50" y="557" class="s">或 llama.cpp 库</text></g><g data-node="q2"><rect x="372" y="112" width="300" height="104" rx="8" class="amber"/><text x="390" y="148" class="t">硬件是什么？</text><text x="390" y="176" class="s">NVIDIA、AMD、昇腾等</text><text x="390" y="199" class="s">决定能选哪些引擎</text></g><g data-node="a-cn"><rect x="372" y="300" width="300" height="124" rx="8" class="gray"/><text x="390" y="336" class="t">昇腾等国产卡</text><text x="390" y="364" class="s">各引擎的硬件插件</text><text x="390" y="387" class="s">LMDeploy PyTorch 引擎</text><text x="390" y="410" class="s">先查型号支持矩阵</text></g><g data-node="q3"><rect x="712" y="112" width="300" height="104" rx="8" class="amber"/><text x="730" y="148" class="t">默认起点：vLLM</text><text x="730" y="176" class="s">模型、量化、接口最全</text><text x="730" y="199" class="s">先建基线再比较</text></g><g data-node="a-sgl"><rect x="712" y="300" width="300" height="124" rx="8" class="blue"/><text x="730" y="336" class="t">换 SGLang 试试</text><text x="730" y="364" class="s">前缀复用多：多轮、Agent</text><text x="730" y="387" class="s">大 MoE 多机、P/D</text></g><g data-node="a-trt"><rect x="712" y="470" width="300" height="104" rx="8" class="blue"/><text x="730" y="506" class="t">换 TensorRT-LLM 试试</text><text x="730" y="534" class="s">模型和 NVIDIA 卡固定</text><text x="730" y="557" class="s">FP8/NVFP4 追极致性能</text></g><g data-node="q4"><rect x="1052" y="112" width="300" height="104" rx="8" class="amber"/><text x="1070" y="148" class="t">规模多大？</text><text x="1070" y="176" class="s">几个副本还是几十张卡</text><text x="1070" y="199" class="s">是否共享长前缀</text></g><g data-node="a-few"><rect x="1052" y="300" width="300" height="124" rx="8" class="green"/><text x="1070" y="336" class="t">几个副本</text><text x="1070" y="364" class="s">负载均衡 + 会话亲和</text><text x="1070" y="387" class="s">不需要编排层</text></g><g data-node="a-many"><rect x="1052" y="470" width="300" height="104" rx="8" class="violet"/><text x="1070" y="506" class="t">十个副本以上</text><text x="1070" y="534" class="s">Dynamo 或 llm-d</text><text x="1070" y="557" class="s">KV 感知路由、P/D</text></g><path d="M182 218V292" class="edge"/><path d="M182 426V462" class="dash"/><path d="M334 164H364" class="edge"/><path d="M522 218V292" class="dash"/><path d="M674 164H704" class="edge"/><path d="M862 218V292" class="dash"/><path d="M862 426V462" class="dash"/><path d="M1014 164H1044" class="edge"/><path d="M1202 218V292" class="edge"/><path d="M1202 426V462" class="dash"/><text x="372" y="470" class="s">每一步都用业务数据实测：</text><text x="372" y="496" class="s">质量 → 模型与硬件支持 →</text><text x="372" y="522" class="s">真实负载下的 Goodput</text>
</svg>
