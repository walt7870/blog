<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="570" viewBox="0 0 1120 570" role="img" aria-labelledby="ai-learning-roadmap-title ai-learning-roadmap-desc">
<title id="ai-learning-roadmap-title">根据目标选择学习主线</title><desc id="ai-learning-roadmap-desc">共同起点是任务、数据与评估；应用开发不需要先修完所有模型训练课程。</desc>
<defs><marker id="ai-learning-roadmap-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker><style>text{font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#172b3a}.head{font-size:28px;font-weight:700}.node{font-size:20px;font-weight:700}.body{font-size:17px;fill:#475569}.value{font-size:32px;font-weight:700}.box{fill:white;stroke:#cbd5e1;stroke-width:2}.blue{fill:#eff6ff;stroke:#60a5fa;stroke-width:2}.green{fill:#ecfdf5;stroke:#14b8a6;stroke-width:2}.red{fill:#fff1f2;stroke:#e88191;stroke-width:2}.line{stroke:#64748b;stroke-width:2;fill:none}.dashed{stroke-dasharray:6 5}</style></defs>
<rect width="1120" height="570" fill="#f8fafc"/>
<text class="head" x="40" y="48" text-anchor="start">根据目标选择学习主线</text><text class="body" x="40" y="80" text-anchor="start">共同起点是任务、数据与评估；应用开发不需要先修完所有模型训练课程。</text><path class="line" marker-end="url(#ai-learning-roadmap-arrow)" d="M310 290H355V175H400"/><path class="line" marker-end="url(#ai-learning-roadmap-arrow)" d="M310 320H400"/><path class="line" marker-end="url(#ai-learning-roadmap-arrow)" d="M310 350H355V465H400"/><path class="line" marker-end="url(#ai-learning-roadmap-arrow)" d="M760 175H805V285H850"/><path class="line" marker-end="url(#ai-learning-roadmap-arrow)" d="M760 320H850"/><path class="line" marker-end="url(#ai-learning-roadmap-arrow)" d="M760 465H805V355H850"/><rect class="green" x="40" y="255" width="270" height="120" rx="6"/><text class="node" x="60" y="288" text-anchor="start">共同基础</text><text class="body" x="60" y="317" text-anchor="start">AI 全景、输入输出与权限</text><text class="body" x="60" y="342" text-anchor="start">数据边界、基线与错误代价</text><rect class="blue" x="400" y="120" width="360" height="110" rx="6"/><text class="node" x="420" y="153" text-anchor="start">应用开发主线</text><text class="body" x="420" y="182" text-anchor="start">模型 API → 检索 / 工具 → 状态与回归</text><text class="body" x="420" y="207" text-anchor="start">交付：带依据、可追踪的客服助手</text><rect class="box" x="400" y="265" width="360" height="110" rx="6"/><text class="node" x="420" y="298" text-anchor="start">数据建模主线</text><text class="body" x="420" y="327" text-anchor="start">样本 / 特征 → 简单模型 → 阈值与误差</text><text class="body" x="420" y="352" text-anchor="start">交付：按时间评估的销量或流失预测</text><rect class="box" x="400" y="410" width="360" height="110" rx="6"/><text class="node" x="420" y="443" text-anchor="start">模型训练主线</text><text class="body" x="420" y="472" text-anchor="start">张量 / 梯度 → 架构 → 迁移与推理</text><text class="body" x="420" y="497" text-anchor="start">交付：可重载、输入合同一致的模型</text><rect class="green" x="850" y="255" width="230" height="120" rx="6"/><text class="node" x="870" y="288" text-anchor="start">共同工程能力</text><text class="body" x="870" y="317" text-anchor="start">监控、成本与安全</text><text class="body" x="870" y="342" text-anchor="start">灰度、降级与回滚</text>
</svg>
