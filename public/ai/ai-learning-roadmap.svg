<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">AI 学习路线图</title><desc id="desc">从全景认知到生产工程的八阶段学习路线及对应实践</desc>
  <defs><style>
    .bg{fill:#f8fafc}.stage{fill:#fff;stroke:#cbd5e1;stroke-width:2}.s1{fill:#ecfdf5;stroke:#14b8a6}.s2{fill:#eff6ff;stroke:#3b82f6}.s3{fill:#f5f3ff;stroke:#8b5cf6}.s4{fill:#fff7ed;stroke:#f97316}
    text{font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#0f172a}.head{font-size:28px;font-weight:700}.num{font-size:16px;font-weight:700;fill:#fff}.title{font-size:18px;font-weight:700}.body{font-size:14px;fill:#475569}.line{stroke:#64748b;stroke-width:2.5;fill:none}
  </style><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9z" fill="#64748b"/></marker></defs>
  <rect class="bg" width="1200" height="620"/><text class="head" x="60" y="56">从全局认知走到可上线系统</text><text class="body" x="60" y="84">每个阶段都对应一个可验证交付物，工具随项目逐步引入。</text>
  <path class="line" marker-end="url(#arrow)" d="M260 190 L330 190"/><path class="line" marker-end="url(#arrow)" d="M540 190 L610 190"/><path class="line" marker-end="url(#arrow)" d="M820 190 L890 190"/>
  <path class="line" marker-end="url(#arrow)" d="M1000 255 C1000 315 200 285 200 350"/>
  <path class="line" marker-end="url(#arrow)" d="M260 430 L330 430"/><path class="line" marker-end="url(#arrow)" d="M540 430 L610 430"/><path class="line" marker-end="url(#arrow)" d="M820 430 L890 430"/>
  <g transform="translate(50 125)"><rect class="stage s1" width="210" height="130" rx="12"/><circle cx="32" cy="32" r="18" fill="#0f766e"/><text class="num" x="32" y="38" text-anchor="middle">1</text><text class="title" x="62" y="38">AI 全景</text><text class="body" x="24" y="75">技术边界与发展脉络</text><text class="body" x="24" y="101">交付：需求技术地图</text></g>
  <g transform="translate(330 125)"><rect class="stage s1" width="210" height="130" rx="12"/><circle cx="32" cy="32" r="18" fill="#0f766e"/><text class="num" x="32" y="38" text-anchor="middle">2</text><text class="title" x="62" y="38">数据与训练</text><text class="body" x="24" y="75">样本、损失、泛化、指标</text><text class="body" x="24" y="101">交付：任务与评估定义</text></g>
  <g transform="translate(610 125)"><rect class="stage s2" width="210" height="130" rx="12"/><circle cx="32" cy="32" r="18" fill="#2563eb"/><text class="num" x="32" y="38" text-anchor="middle">3</text><text class="title" x="62" y="38">机器学习</text><text class="body" x="24" y="75">特征、模型、阈值</text><text class="body" x="24" y="101">交付：流失预测项目</text></g>
  <g transform="translate(890 125)"><rect class="stage s2" width="210" height="130" rx="12"/><circle cx="32" cy="32" r="18" fill="#2563eb"/><text class="num" x="32" y="38" text-anchor="middle">4</text><text class="title" x="62" y="38">深度学习</text><text class="body" x="24" y="75">网络、反向传播、架构</text><text class="body" x="24" y="101">交付：视觉分类项目</text></g>
  <g transform="translate(50 365)"><rect class="stage s3" width="210" height="130" rx="12"/><circle cx="32" cy="32" r="18" fill="#7c3aed"/><text class="num" x="32" y="38" text-anchor="middle">5</text><text class="title" x="62" y="38">领域方向</text><text class="body" x="24" y="75">语言、视觉、语音、推荐</text><text class="body" x="24" y="101">交付：专项模型项目</text></g>
  <g transform="translate(330 365)"><rect class="stage s3" width="210" height="130" rx="12"/><circle cx="32" cy="32" r="18" fill="#7c3aed"/><text class="num" x="32" y="38" text-anchor="middle">6</text><text class="title" x="62" y="38">大模型</text><text class="body" x="24" y="75">Transformer、训练、推理</text><text class="body" x="24" y="101">交付：模型对比实验</text></g>
  <g transform="translate(610 365)"><rect class="stage s4" width="210" height="130" rx="12"/><circle cx="32" cy="32" r="18" fill="#c2410c"/><text class="num" x="32" y="38" text-anchor="middle">7</text><text class="title" x="62" y="38">AI 应用</text><text class="body" x="24" y="75">RAG、工具、Agent</text><text class="body" x="24" y="101">交付：知识与工单助手</text></g>
  <g transform="translate(890 365)"><rect class="stage s4" width="210" height="130" rx="12"/><circle cx="32" cy="32" r="18" fill="#c2410c"/><text class="num" x="32" y="38" text-anchor="middle">8</text><text class="title" x="62" y="38">生产工程</text><text class="body" x="24" y="75">部署、评估、安全、成本</text><text class="body" x="24" y="101">交付：上线与回滚方案</text></g>
  <rect x="50" y="545" width="1050" height="42" rx="8" fill="#e2e8f0"/><text class="body" x="575" y="571" text-anchor="middle">贯穿全程：Python / 数据分析 / Git / API / 容器 / 测试 / 文档 / 错误复盘</text>
</svg>
