<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="620" viewBox="0 0 1180 620" role="img" aria-labelledby="title desc">
  <title id="title">AI 编程的协作关系</title>
  <desc id="desc">Vibe 原型反馈进入规格。规格和上下文输入 Agent，Harness 在行动前控制权限，独立验证产生证据并反馈到团队维护的资料和规则。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 10 4 0 8Z" fill="#64748b"/></marker>
    <style>
      text{font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#0f172a}
      .title{font-size:24px;font-weight:700}.h{font-size:20px;font-weight:700}.b{font-size:16px;fill:#475569}.s{font-size:14px;fill:#64748b}
      .node{fill:#fff;stroke:#cbd5e1;stroke-width:2;rx:8}.focus{fill:#eff6ff;stroke:#2563eb;stroke-width:2;rx:8}.guard{fill:#fff7ed;stroke:#ea580c;stroke-width:2;rx:8}
      .line{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#arrow)}.feedback{stroke-dasharray:6 5}
    </style>
  </defs>
  <rect width="1180" height="620" fill="#f8fafc"/>
  <text class="title" x="40" y="43">AI 编程的协作关系</text>
  <text class="b" x="40" y="72">按任务组合能力；权限约束在行动前生效，证据独立于模型的完成声明</text>
  <path class="line" d="M165 190V245"/>
  <path class="line" d="M290 280H440"/>
  <path class="line" d="M290 440H338Q346 440 346 432V338Q346 330 354 330H440"/>
  <path class="line" d="M575 190V245"/>
  <path class="line" d="M710 300H850"/>
  <path class="line" d="M990 365V450"/>
  <path class="line feedback" d="M440 510H382Q374 510 374 502V480Q374 472 366 472H290"/>
  <rect class="node" x="40" y="105" width="250" height="85"/>
  <text class="h" x="60" y="137">Vibe 原型探索</text>
  <text class="b" x="60" y="165">测试数据试用，反馈真实需求</text>
  <rect class="node" x="40" y="245" width="250" height="120"/>
  <text class="h" x="60" y="278">任务与规格</text>
  <text class="b" x="60" y="309">提示词明确目标、范围和禁区</text>
  <text class="b" x="60" y="337">Spec-Driven 对齐验收与测试</text>
  <rect class="node" x="40" y="405" width="250" height="120"/>
  <text class="h" x="60" y="439">上下文包</text>
  <text class="b" x="60" y="470">当前代码、数据合同、权限</text>
  <text class="b" x="60" y="498">测试入口与已确认的决策</text>
  <rect class="guard" x="440" y="105" width="270" height="85"/>
  <text class="h" x="460" y="137">Harness 执行约束</text>
  <text class="b" x="460" y="165">运行时权限、沙箱、CI 门禁</text>
  <rect class="focus" x="440" y="245" width="270" height="120"/>
  <text class="h" x="460" y="279">Agent 与工具</text>
  <text class="b" x="460" y="310">读代码、修改、运行检查</text>
  <text class="b" x="460" y="338">定位失败后继续修复</text>
  <rect class="node" x="850" y="245" width="280" height="120"/>
  <text class="h" x="870" y="279">独立验证与评审</text>
  <text class="b" x="870" y="310">测试结果、差异、实际产物</text>
  <text class="b" x="870" y="338">按规格判断是否可以交付</text>
  <rect class="node" x="440" y="450" width="690" height="100"/>
  <text class="h" x="460" y="483">组织维护与反馈</text>
  <text class="b" x="460" y="514">把重复问题更新到规格、上下文、测试和 Harness 规则，再用于下一轮</text>
  <rect x="740" y="285" width="82" height="28" fill="#f8fafc"/>
  <text class="s" x="781" y="304" text-anchor="middle">交付证据</text>
  <text class="s" x="1010" y="409">失败与运行反馈</text>
  <text class="s" x="40" y="587">例：订单导出先明确字段与租户范围，再实现；测试直接尝试越权请求，不能只看按钮能否下载。</text>
</svg>
