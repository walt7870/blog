<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">模型训练与泛化闭环</title><desc id="desc">展示数据切分、前向传播、损失、反向传播、参数更新、验证和测试的关系</desc>
  <defs><style>.bg{fill:#f8fafc}.box{fill:#fff;stroke:#cbd5e1;stroke-width:2}.focus{fill:#eff6ff;stroke:#3b82f6;stroke-width:2}.good{fill:#ecfdf5;stroke:#14b8a6;stroke-width:2}.warn{fill:#fff7ed;stroke:#f97316;stroke-width:2}text{font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#0f172a}.head{font-size:27px;font-weight:700}.title{font-size:17px;font-weight:700}.body{font-size:14px;fill:#475569}.line{stroke:#64748b;stroke-width:2.5;fill:none}.dash{stroke-dasharray:7 6}</style><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9z" fill="#64748b"/></marker></defs>
  <rect class="bg" width="1200" height="520"/><text class="head" x="55" y="55">模型训练不是一次计算，而是“学习、验证、再决策”的闭环</text>
  <g transform="translate(55 100)"><rect class="box" width="220" height="135" rx="12"/><text class="title" x="110" y="35" text-anchor="middle">数据集</text><text class="body" x="25" y="70">训练集：更新参数</text><text class="body" x="25" y="94">验证集：选择方案</text><text class="body" x="25" y="118">测试集：最终评估</text></g>
  <path class="line" marker-end="url(#arrow)" d="M275 168 L335 168"/>
  <g transform="translate(335 100)"><rect class="focus" width="165" height="135" rx="12"/><text class="title" x="82" y="38" text-anchor="middle">前向传播</text><text class="body" x="82" y="73" text-anchor="middle">输入经过模型</text><text class="body" x="82" y="98" text-anchor="middle">得到当前预测</text></g>
  <path class="line" marker-end="url(#arrow)" d="M500 168 L545 168"/>
  <g transform="translate(545 100)"><rect class="warn" width="165" height="135" rx="12"/><text class="title" x="82" y="38" text-anchor="middle">计算损失</text><text class="body" x="82" y="73" text-anchor="middle">预测与目标</text><text class="body" x="82" y="98" text-anchor="middle">相差多少</text></g>
  <path class="line" marker-end="url(#arrow)" d="M710 168 L755 168"/>
  <g transform="translate(755 100)"><rect class="focus" width="165" height="135" rx="12"/><text class="title" x="82" y="38" text-anchor="middle">反向传播</text><text class="body" x="82" y="73" text-anchor="middle">计算每个参数</text><text class="body" x="82" y="98" text-anchor="middle">对损失的梯度</text></g>
  <path class="line" marker-end="url(#arrow)" d="M920 168 L965 168"/>
  <g transform="translate(965 100)"><rect class="good" width="180" height="135" rx="12"/><text class="title" x="90" y="38" text-anchor="middle">更新参数</text><text class="body" x="90" y="73" text-anchor="middle">优化器沿梯度</text><text class="body" x="90" y="98" text-anchor="middle">调整权重</text></g>
  <path class="line dash" marker-end="url(#arrow)" d="M1055 235 C1055 300 420 300 420 235"/>
  <text class="body" x="745" y="328" text-anchor="middle">多批样本反复训练，直到达到停止条件</text>
  <g transform="translate(250 370)"><rect class="good" width="280" height="95" rx="12"/><text class="title" x="140" y="34" text-anchor="middle">验证：能否泛化</text><text class="body" x="140" y="64" text-anchor="middle">不更新参数，用来选模型和阈值</text></g>
  <g transform="translate(670 370)"><rect class="warn" width="280" height="95" rx="12"/><text class="title" x="140" y="34" text-anchor="middle">测试：最终一次检查</text><text class="body" x="140" y="64" text-anchor="middle">不得参与训练和反复调参</text></g>
  <path class="line" marker-end="url(#arrow)" d="M600 325 C600 355 500 350 475 370"/><path class="line" marker-end="url(#arrow)" d="M600 325 C600 355 700 350 725 370"/>
</svg>
