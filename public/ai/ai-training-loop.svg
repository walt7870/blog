<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="605" viewBox="0 0 1120 605" role="img" aria-labelledby="ai-training-loop-title ai-training-loop-desc">
<title id="ai-training-loop-title">参数更新、模型选择与推理的边界</title><desc id="ai-training-loop-desc">监督神经网络示例：训练样本更新参数；验证选方案；独立测试估计效果。</desc>
<defs><marker id="ai-training-loop-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker><style>text{font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#172b3a}.head{font-size:28px;font-weight:700}.node{font-size:20px;font-weight:700}.body{font-size:17px;fill:#475569}.value{font-size:32px;font-weight:700}.box{fill:white;stroke:#cbd5e1;stroke-width:2}.blue{fill:#eff6ff;stroke:#60a5fa;stroke-width:2}.green{fill:#ecfdf5;stroke:#14b8a6;stroke-width:2}.red{fill:#fff1f2;stroke:#e88191;stroke-width:2}.line{stroke:#64748b;stroke-width:2;fill:none}.dashed{stroke-dasharray:6 5}</style></defs>
<rect width="1120" height="605" fill="#f8fafc"/>
<text class="head" x="40" y="48" text-anchor="start">参数更新、模型选择与推理的边界</text><text class="body" x="40" y="80" text-anchor="start">监督神经网络示例：训练样本更新参数；验证选方案；独立测试估计效果。</text><path class="line" marker-end="url(#ai-training-loop-arrow)" d="M200 190H260"/><path class="line" marker-end="url(#ai-training-loop-arrow)" d="M420 190H480"/><path class="line" marker-end="url(#ai-training-loop-arrow)" d="M640 190H700"/><path class="line" marker-end="url(#ai-training-loop-arrow)" d="M860 190H920"/><path class="line dashed" marker-end="url(#ai-training-loop-arrow)" d="M1000 245V280H340V245"/><path class="line" marker-end="url(#ai-training-loop-arrow)" d="M1080 190H1100V330H185V370"/><path class="line" marker-end="url(#ai-training-loop-arrow)" d="M330 425H415"/><path class="line" marker-end="url(#ai-training-loop-arrow)" d="M705 425H790"/><rect class="box" x="40" y="135" width="160" height="110" rx="6"/><text class="node" x="60" y="168" text-anchor="start">训练批次</text><text class="body" x="60" y="197" text-anchor="start">输入与标签</text><text class="body" x="60" y="222" text-anchor="start">仅训练集</text><rect class="blue" x="260" y="135" width="160" height="110" rx="6"/><text class="node" x="280" y="168" text-anchor="start">模型前向</text><text class="body" x="280" y="197" text-anchor="start">读取参数</text><text class="body" x="280" y="222" text-anchor="start">输出预测</text><rect class="box" x="480" y="135" width="160" height="110" rx="6"/><text class="node" x="500" y="168" text-anchor="start">损失</text><text class="body" x="500" y="197" text-anchor="start">比较预测</text><text class="body" x="500" y="222" text-anchor="start">与真实标签</text><rect class="blue" x="700" y="135" width="160" height="110" rx="6"/><text class="node" x="720" y="168" text-anchor="start">反向传播</text><text class="body" x="720" y="197" text-anchor="start">链式求导</text><text class="body" x="720" y="222" text-anchor="start">计算梯度</text><rect class="green" x="920" y="135" width="160" height="110" rx="6"/><text class="node" x="940" y="168" text-anchor="start">优化器</text><text class="body" x="940" y="197" text-anchor="start">根据梯度</text><text class="body" x="940" y="222" text-anchor="start">更新参数</text><text class="body" x="520" y="310" text-anchor="start">虚线：下一训练批次使用更新后的参数。</text><rect class="box" x="40" y="370" width="290" height="120" rx="6"/><text class="node" x="60" y="403" text-anchor="start">验证与独立测试</text><text class="body" x="60" y="432" text-anchor="start">验证集选模型、校准和阈值</text><text class="body" x="60" y="457" text-anchor="start">固定方案后再评估独立测试</text><rect class="green" x="415" y="370" width="290" height="120" rx="6"/><text class="node" x="435" y="403" text-anchor="start">部署合同</text><text class="body" x="435" y="432" text-anchor="start">输入顺序 / 预处理 + 权重</text><text class="body" x="435" y="457" text-anchor="start">类别映射 + 阈值 + 版本</text><rect class="blue" x="790" y="370" width="290" height="120" rx="6"/><text class="node" x="810" y="403" text-anchor="start">生产推理</text><text class="body" x="810" y="432" text-anchor="start">前向计算 + 后处理</text><text class="body" x="810" y="457" text-anchor="start">不做损失反传和参数更新</text><text class="body" x="40" y="550" text-anchor="start">部署前核对合同、错误样例和资源预算；生产反馈进入后续数据治理，不直接混入本次测试。</text>
</svg>
