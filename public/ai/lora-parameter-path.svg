<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="615" viewBox="0 0 1120 615" role="img" aria-labelledby="lora-parameter-path-title lora-parameter-path-desc"><title id="lora-parameter-path-title">LoRA 更新低秩分支，原矩阵保持冻结</title><desc id="lora-parameter-path-desc">以单个4096×4096线性矩阵、秩r=8为例；仅比较参数数目，不代表整模型资源倍数。</desc><defs><marker id="lora-parameter-path-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker><style>text{font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#172b3a}.head{font-size:27px;font-weight:700}.node{font-size:20px;font-weight:700}.body{font-size:17px;fill:#475569}.box{fill:white;stroke:#cbd5e1;stroke-width:2}.blue{fill:#eff6ff;stroke:#60a5fa;stroke-width:2}.green{fill:#ecfdf5;stroke:#14b8a6;stroke-width:2}.red{fill:#fff1f2;stroke:#e88191;stroke-width:2}.line{fill:none;stroke:#64748b;stroke-width:2}.dash{stroke-dasharray:6 5}</style></defs><rect width="1120" height="615" fill="#f8fafc"/><text x="40" y="48" class="head" text-anchor="start">LoRA 更新低秩分支，原矩阵保持冻结</text><text x="40" y="80" class="body" text-anchor="start">以单个4096×4096线性矩阵、秩r=8为例；仅比较参数数目，不代表整模型资源倍数。</text><path d="M200 270H242Q250 270 250 262V198Q250 190 258 190H320" class="line" marker-end="url(#lora-parameter-path-arrow)"/><path d="M170 320V417Q170 425 178 425H320" class="line" marker-end="url(#lora-parameter-path-arrow)"/><path d="M650 190H822Q830 190 830 198V262Q830 270 838 270H880" class="line" marker-end="url(#lora-parameter-path-arrow)"/><path d="M540 425H590" class="line" marker-end="url(#lora-parameter-path-arrow)"/><path d="M790 425H842Q850 425 850 417V328Q850 320 858 320H880" class="line" marker-end="url(#lora-parameter-path-arrow)"/><path d="M960 295H1000" class="line" marker-end="url(#lora-parameter-path-arrow)"/><rect x="40" y="230" width="160" height="90" rx="6" class="box"/><text x="56" y="262" class="node" text-anchor="start">输入 x</text><text x="56" y="292" class="body" text-anchor="start">4096 维</text><rect x="320" y="135" width="330" height="110" rx="6" class="box"/><text x="336" y="167" class="node" text-anchor="start">冻结底座 W</text><text x="336" y="197" class="body" text-anchor="start">16777216 个参数</text><text x="336" y="222" class="body" text-anchor="start">计算 Wx，不更新 W</text><rect x="320" y="370" width="220" height="115" rx="6" class="blue"/><text x="336" y="402" class="node" text-anchor="start">训练 A</text><text x="336" y="432" class="body" text-anchor="start">8 × 4096</text><text x="336" y="457" class="body" text-anchor="start">将输入投影到 8 维</text><rect x="590" y="370" width="200" height="115" rx="6" class="blue"/><text x="606" y="402" class="node" text-anchor="start">训练 B</text><text x="606" y="432" class="body" text-anchor="start">4096 × 8</text><text x="606" y="457" class="body" text-anchor="start">映回 4096 维</text><rect x="880" y="245" width="80" height="100" rx="6" class="green"/><text x="920" y="304" class="node" text-anchor="middle">相加</text><text x="1000" y="300" class="node" text-anchor="start">输出</text><text x="40" y="545" class="node" text-anchor="start">输出 = Wx + (alpha/r)BAx；A+B 共65536参数，是该原矩阵的1/256。</text><text x="40" y="585" class="body" text-anchor="start">适配器绑定底座、目标模块与Tokenizer；激活、其他可训练模块及优化器状态另计。</text></svg>
