<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="570" viewBox="0 0 1120 570" role="img" aria-labelledby="kv-cache-memory-contract-title kv-cache-memory-contract-desc"><title id="kv-cache-memory-contract-title">缓存历史 Key / Value，不缓存可任意复用的答案</title><desc id="kv-cache-memory-contract-desc">常规全注意力Transformer示例；实际结构、滑窗、KV类型和运行时分配会改变内存。</desc><defs><marker id="kv-cache-memory-contract-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker><style>text{font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#172b3a}.head{font-size:27px;font-weight:700}.node{font-size:20px;font-weight:700}.body{font-size:17px;fill:#475569}.box{fill:white;stroke:#cbd5e1;stroke-width:2}.blue{fill:#eff6ff;stroke:#60a5fa;stroke-width:2}.green{fill:#ecfdf5;stroke:#14b8a6;stroke-width:2}.red{fill:#fff1f2;stroke:#e88191;stroke-width:2}.line{fill:none;stroke:#64748b;stroke-width:2}.dash{stroke-dasharray:6 5}</style></defs><rect width="1120" height="570" fill="#f8fafc"/><text x="40" y="48" class="head" text-anchor="start">缓存历史 Key / Value，不缓存可任意复用的答案</text><text x="40" y="80" class="body" text-anchor="start">常规全注意力Transformer示例；实际结构、滑窗、KV类型和运行时分配会改变内存。</text><path d="M285 190H355" class="line" marker-end="url(#kv-cache-memory-contract-arrow)"/><path d="M650 190H720" class="line" marker-end="url(#kv-cache-memory-contract-arrow)"/><path d="M890 250V330" class="line" marker-end="url(#kv-cache-memory-contract-arrow)"/><rect x="40" y="135" width="245" height="115" rx="6" class="box"/><text x="56" y="167" class="node" text-anchor="start">输入与 Prefill</text><text x="56" y="197" class="body" text-anchor="start">按输入一次构建历史KV</text><text x="56" y="222" class="body" text-anchor="start">Token、位置和配置匹配</text><rect x="355" y="135" width="295" height="115" rx="6" class="blue"/><text x="371" y="167" class="node" text-anchor="start">各层历史 KV</text><text x="371" y="197" class="body" text-anchor="start">存储每个位置的 K 与 V</text><text x="371" y="222" class="body" text-anchor="start">保留在当前序列的缓存中</text><rect x="720" y="135" width="360" height="115" rx="6" class="green"/><text x="736" y="167" class="node" text-anchor="start">Decode 新位置</text><text x="736" y="197" class="body" text-anchor="start">计算当前Q与新K/V</text><text x="736" y="222" class="body" text-anchor="start">读取历史KV后选择下一Token</text><rect x="720" y="330" width="360" height="110" rx="6" class="box"/><text x="736" y="362" class="node" text-anchor="start">追加新位置，再继续</text><text x="736" y="392" class="body" text-anchor="start">上下文改变时重算受影响后缀</text><text x="736" y="417" class="body" text-anchor="start">不能把旧政策状态当新输入</text><rect x="40" y="330" width="610" height="145" rx="6" class="box"/><text x="56" y="362" class="node" text-anchor="start">单序列缓存演算</text><text x="56" y="392" class="body" text-anchor="start">2 × 32层 × 8个KV头 × 128维 × 4096位置 × 2字节</text><text x="56" y="417" class="body" text-anchor="start">= 536870912 字节 = 512 MiB</text><text x="56" y="442" class="body" text-anchor="start">4个同长序列约2 GiB，不含权重、激活与块分配开销</text><text x="40" y="530" class="body" text-anchor="start">权重量化与缓存量化是不同设置；使用KV头数，不是Query头数。</text></svg>
