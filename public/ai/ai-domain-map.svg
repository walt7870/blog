<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">AI 主要应用方向地图</title><desc id="desc">展示语言、视觉、语音、推荐、时序、强化学习和多模态的输入输出及组合关系</desc>
  <defs><style>.bg{fill:#f8fafc}.core{fill:#0f766e}.card{fill:#fff;stroke:#cbd5e1;stroke-width:2}.accent{fill:#eff6ff;stroke:#60a5fa;stroke-width:2}text{font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#0f172a}.head{font-size:27px;font-weight:700}.ct{font-size:22px;font-weight:700;fill:#fff!important}.title{font-size:18px;font-weight:700}.body{font-size:14px;fill:#475569}.line{stroke:#94a3b8;stroke-width:2;fill:none}</style></defs>
  <rect class="bg" width="1200" height="650"/><text class="head" x="55" y="55">不同数据结构形成不同 AI 方向，真实系统通常组合使用</text>
  <g transform="translate(485 260)"><rect class="core" width="230" height="120" rx="18"/><text class="ct" fill="#fff" x="115" y="50" text-anchor="middle">AI 能力层</text><text class="ct" style="font-size:18px;fill:#fff" x="115" y="82" text-anchor="middle">感知 · 预测 · 生成 · 决策</text></g>
  <path class="line" d="M485 300 L335 185"/><path class="line" d="M485 330 L335 440"/><path class="line" d="M715 300 L865 185"/><path class="line" d="M715 330 L865 440"/><path class="line" d="M600 260 L600 175"/><path class="line" d="M600 380 L600 470"/>
  <g transform="translate(70 100)"><rect class="card" width="265" height="135" rx="12"/><text class="title" x="25" y="35">自然语言处理</text><text class="body" x="25" y="67">输入：文本、文档、对话</text><text class="body" x="25" y="92">输出：分类、抽取、检索、生成</text><text class="body" x="25" y="117">关键：上下文、歧义、事实依据</text></g>
  <g transform="translate(467 80)"><rect class="card" width="266" height="135" rx="12"/><text class="title" x="25" y="35">语音技术</text><text class="body" x="25" y="67">输入：连续音频信号</text><text class="body" x="25" y="92">输出：文字、语音、说话人</text><text class="body" x="25" y="117">关键：噪声、口音、实时延迟</text></g>
  <g transform="translate(865 100)"><rect class="card" width="265" height="135" rx="12"/><text class="title" x="25" y="35">计算机视觉</text><text class="body" x="25" y="67">输入：图片、视频</text><text class="body" x="25" y="92">输出：分类、位置、区域、生成</text><text class="body" x="25" y="117">关键：尺度、遮挡、环境变化</text></g>
  <g transform="translate(70 420)"><rect class="card" width="265" height="135" rx="12"/><text class="title" x="25" y="35">推荐与排序</text><text class="body" x="25" y="67">输入：用户、物品、行为</text><text class="body" x="25" y="92">输出：候选和排序列表</text><text class="body" x="25" y="117">关键：反馈偏差、冷启动、长期价值</text></g>
  <g transform="translate(467 455)"><rect class="card" width="266" height="135" rx="12"/><text class="title" x="25" y="35">强化学习</text><text class="body" x="25" y="67">输入：状态、动作、奖励</text><text class="body" x="25" y="92">输出：连续行动策略</text><text class="body" x="25" y="117">关键：探索、长期回报、安全</text></g>
  <g transform="translate(865 420)"><rect class="card" width="265" height="135" rx="12"/><text class="title" x="25" y="35">时间序列</text><text class="body" x="25" y="67">输入：按时间排列的观测值</text><text class="body" x="25" y="92">输出：趋势、异常、未来数值</text><text class="body" x="25" y="117">关键：周期、漂移、未来不可见</text></g>
  <g transform="translate(380 600)"><rect class="accent" width="440" height="40" rx="10"/><text class="title" x="220" y="27" text-anchor="middle">多模态：对齐并联合处理文本、图像、音频和视频</text></g>
</svg>
