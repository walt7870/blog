<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="650" viewBox="0 0 1120 650" role="img" aria-labelledby="ai-domain-map-title ai-domain-map-desc"><title id="ai-domain-map-title">同一个电商平台，需要不同任务的验收标准</title><desc id="ai-domain-map-desc">图示为三个业务链路，不是模型分类树；领域能力可以组合，错误也要分别定位。</desc><defs><marker id="ai-domain-map-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker><style>text{font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#172b3a}.head{font-size:28px;font-weight:700}.node{font-size:20px;font-weight:700}.body{font-size:17px;fill:#475569}.box{fill:white;stroke:#cbd5e1;stroke-width:2}.blue{fill:#eff6ff;stroke:#60a5fa;stroke-width:2}.green{fill:#ecfdf5;stroke:#14b8a6;stroke-width:2}.red{fill:#fff1f2;stroke:#e88191;stroke-width:2}.pad{fill:#e2e8f0;stroke:#94a3b8}.line{fill:none;stroke:#64748b;stroke-width:2}.dash{stroke-dasharray:6 5}</style></defs><rect width="1120" height="650" fill="#f8fafc"/><text x="40" y="48" class="head" text-anchor="start">同一个电商平台，需要不同任务的验收标准</text><text x="40" y="80" class="body" text-anchor="start">图示为三个业务链路，不是模型分类树；领域能力可以组合，错误也要分别定位。</text><path d="M315 175H390" class="line" marker-end="url(#ai-domain-map-arrow)"/><path d="M720 175H800" class="line" marker-end="url(#ai-domain-map-arrow)"/><path d="M315 345H390" class="line" marker-end="url(#ai-domain-map-arrow)"/><path d="M720 345H800" class="line" marker-end="url(#ai-domain-map-arrow)"/><path d="M315 515H390" class="line" marker-end="url(#ai-domain-map-arrow)"/><path d="M720 515H800" class="line" marker-end="url(#ai-domain-map-arrow)"/><rect x="40" y="120" width="275" height="110" class="box" rx="6"/><text x="58" y="152" class="node" text-anchor="start">售后咨询输入</text><text x="58" y="182" class="body" text-anchor="start">语音、破损照片、文字</text><rect x="390" y="120" width="330" height="110" class="blue" rx="6"/><text x="408" y="152" class="node" text-anchor="start">语音 / 视觉 / NLP / 多模态</text><text x="408" y="182" class="body" text-anchor="start">转写、定位缺陷、对齐证据</text><rect x="800" y="120" width="280" height="110" class="green" rx="6"/><text x="818" y="152" class="node" text-anchor="start">带依据的服务结果</text><text x="818" y="182" class="body" text-anchor="start">核对数字、区域、原文</text><text x="818" y="207" class="body" text-anchor="start">动作仍需授权与业务校验</text><rect x="40" y="290" width="275" height="110" class="box" rx="6"/><text x="58" y="322" class="node" text-anchor="start">商品与用户行为</text><text x="58" y="352" class="body" text-anchor="start">候选、画像、曝光与点击</text><rect x="390" y="290" width="330" height="110" class="blue" rx="6"/><text x="408" y="322" class="node" text-anchor="start">推荐与排序</text><text x="408" y="352" class="body" text-anchor="start">召回、约束、排序与多样性</text><rect x="800" y="290" width="280" height="110" class="green" rx="6"/><text x="818" y="322" class="node" text-anchor="start">展示与反馈</text><text x="818" y="352" class="body" text-anchor="start">检查可见曝光和转化</text><text x="818" y="377" class="body" text-anchor="start">不是只看点击分数</text><rect x="40" y="460" width="275" height="110" class="box" rx="6"/><text x="58" y="492" class="node" text-anchor="start">仓储与需求数据</text><text x="58" y="522" class="body" text-anchor="start">按时间记录销量和库存</text><rect x="390" y="460" width="330" height="110" class="blue" rx="6"/><text x="408" y="492" class="node" text-anchor="start">时间序列 / 连续决策</text><text x="408" y="522" class="body" text-anchor="start">预测需求，再比较调度策略</text><text x="408" y="547" class="body" text-anchor="start">强化学习需可训练环境</text><rect x="800" y="460" width="280" height="110" class="green" rx="6"/><text x="818" y="492" class="node" text-anchor="start">补货或调度决策</text><text x="818" y="522" class="body" text-anchor="start">核对缺货、积压与约束</text><text x="818" y="547" class="body" text-anchor="start">预测准确不等于决策最优</text></svg>
