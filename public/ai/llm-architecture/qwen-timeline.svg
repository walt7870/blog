<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="904" viewBox="0 0 1400 904" role="img" aria-labelledby="qwen-timeline-title qwen-timeline-desc" id="qwen-timeline-root">
<title id="qwen-timeline-title">Qwen 各代结构变化时间线</title>
<desc id="qwen-timeline-desc">从 2023 年的 Qwen 到 2026 年 8 月的 Qwen3.8-Flash-Next，每一行列出发布时间、结构变化和规格：Qwen 保留 QKV 偏置；Qwen1.5 换到 qwen2 实现；Qwen2 全面 GQA、小模型共享词嵌入；Qwen2.5 结构不变；Qwen3 去掉 QKV 偏置、加 QK-Norm，MoE 不设共享专家；Qwen3-Next 改为 3:1 的 Gated DeltaNet 与门控注意力混合、高稀疏 MoE 和 MTP；Qwen3.5 把这套结构带进主线并原生多模态；Qwen3.8-Flash-Next 换上稀疏注意力 QSA、加宽残差流和 n-gram 嵌入。</desc>
<defs><style>
#qwen-timeline-root text { font-family: Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #172b3a; }
#qwen-timeline-root .h { font-size: 26px; font-weight: 700; }
#qwen-timeline-root .t { font-size: 19px; font-weight: 600; }
#qwen-timeline-root .s { font-size: 15px; fill: #475569; }
#qwen-timeline-root .xs { font-size: 13px; fill: #64748b; }
#qwen-timeline-root .k { font-size: 13px; font-weight: 700; letter-spacing: .04em; fill: #64748b; }
#qwen-timeline-root .m { font-family: 'SFMono-Regular', Menlo, Consolas, monospace; font-size: 14px; fill: #172b3a; }
#qwen-timeline-root .node { fill: #fff; stroke: #cbd5e1; stroke-width: 2; }
#qwen-timeline-root .blue { fill: #eff6ff; stroke: #60a5fa; stroke-width: 2; }
#qwen-timeline-root .green { fill: #ecfdf5; stroke: #20a28c; stroke-width: 2; }
#qwen-timeline-root .red { fill: #fff1f2; stroke: #e88191; stroke-width: 2; }
#qwen-timeline-root .amber { fill: #fffbeb; stroke: #e0a63a; stroke-width: 2; }
#qwen-timeline-root .violet { fill: #f5f3ff; stroke: #9b87f5; stroke-width: 2; }
#qwen-timeline-root .gray { fill: #f1f5f9; stroke: #cbd5e1; stroke-width: 2; }
#qwen-timeline-root .fblue { fill: #93c5fd; } #qwen-timeline-root .fgreen { fill: #6ee7b7; } #qwen-timeline-root .fred { fill: #fda4af; }
#qwen-timeline-root .famber { fill: #fcd34d; } #qwen-timeline-root .fviolet { fill: #c4b5fd; } #qwen-timeline-root .fgray { fill: #e2e8f0; }
#qwen-timeline-root .edge { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#qwen-timeline-arrow); }
#qwen-timeline-root .dash { fill: none; stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 7 6; marker-end: url(#qwen-timeline-arrow); }
#qwen-timeline-root .line { stroke: #cbd5e1; stroke-width: 1.5; fill: none; }
#qwen-timeline-root .axis { stroke: #64748b; stroke-width: 2; fill: none; }
</style><marker id="qwen-timeline-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker></defs>
<rect width="1400" height="904" fill="#f8fafc"/>
<text x="32" y="46" class="h">Qwen → Qwen3.8：每一代动了哪里</text>
<text x="32" y="78" class="s">中间一栏是结构变化，右栏是尺寸和许可；日期取官方仓库首次发布的月份。</text>
<path d="M60 104V876" class="axis"/><circle cx="60" cy="154" r="8" fill="#fff" stroke="#64748b" stroke-width="2"/><g data-node="qwen-timeline-n0"><rect x="84" y="112" width="236" height="84" rx="8" class="gray"/><text x="102" y="138" class="k">2023</text><text x="102" y="164" class="t">Qwen</text></g><g data-node="qwen-timeline-c0"><rect x="336" y="112" width="780" height="84" rx="8" class="node"/></g><text x="354" y="146" class="s">与 Llama 同一套配方，但保留 Q/K/V 投影的偏置，词表约 152K</text><text x="354" y="174" class="s">输入输出词嵌入不共享；长文本靠 NTK 插值、LogN 缩放和窗口注意力</text><g data-node="qwen-timeline-s0"><rect x="1132" y="112" width="240" height="84" rx="8" class="gray"/></g><text x="1150" y="146" class="m">1.8B–72B</text><text x="1150" y="174" class="xs">Tongyi Qianwen 许可</text><circle cx="60" cy="250" r="8" fill="#fff" stroke="#64748b" stroke-width="2"/><g data-node="qwen-timeline-n1"><rect x="84" y="208" width="236" height="84" rx="8" class="gray"/><text x="102" y="234" class="k">2024-02</text><text x="102" y="260" class="t">Qwen1.5</text></g><g data-node="qwen-timeline-c1"><rect x="336" y="208" width="780" height="84" rx="8" class="node"/></g><text x="354" y="242" class="s">换成 Transformers 标准的 qwen2 实现，上下文 32K，rope_theta 1,000,000</text><text x="354" y="270" class="s">多数尺寸仍是 MHA；Qwen1.5-MoE-A2.7B：60 个专家选 4 + 共享专家</text><g data-node="qwen-timeline-s1"><rect x="1132" y="208" width="240" height="84" rx="8" class="gray"/></g><text x="1150" y="242" class="m">0.5B–110B</text><text x="1150" y="270" class="xs">首个 MoE</text><circle cx="60" cy="346" r="8" fill="#fff" stroke="#64748b" stroke-width="2"/><g data-node="qwen-timeline-n2"><rect x="84" y="304" width="236" height="84" rx="8" class="blue"/><text x="102" y="330" class="k">2024-06</text><text x="102" y="356" class="t">Qwen2</text></g><g data-node="qwen-timeline-c2"><rect x="336" y="304" width="780" height="84" rx="8" class="node"/></g><text x="354" y="338" class="s">全部尺寸改用 GQA；0.5B/1.5B 共享词嵌入</text><text x="354" y="366" class="s">DCA + YaRN 把 32K 训练长度外推到 128K；57B-A14B 由 7B 升级成 MoE</text><g data-node="qwen-timeline-s2"><rect x="1132" y="304" width="240" height="84" rx="8" class="gray"/></g><text x="1150" y="338" class="m">0.5B–72B</text><text x="1150" y="366" class="xs">7T token</text><circle cx="60" cy="442" r="8" fill="#fff" stroke="#64748b" stroke-width="2"/><g data-node="qwen-timeline-n3"><rect x="84" y="400" width="236" height="84" rx="8" class="blue"/><text x="102" y="426" class="k">2024-09</text><text x="102" y="452" class="t">Qwen2.5</text></g><g data-node="qwen-timeline-c3"><rect x="336" y="400" width="780" height="84" rx="8" class="node"/></g><text x="354" y="434" class="s">结构与 Qwen2 相同，训练数据扩到 18T token</text><text x="354" y="462" class="s">1M 版本：rope_theta 1e7 + 双块注意力配置；3B/72B 用自有许可</text><g data-node="qwen-timeline-s3"><rect x="1132" y="400" width="240" height="84" rx="8" class="gray"/></g><text x="1150" y="434" class="m">0.5B–72B</text><text x="1150" y="462" class="xs">同 Qwen2 架构</text><circle cx="60" cy="538" r="8" fill="#fff" stroke="#64748b" stroke-width="2"/><g data-node="qwen-timeline-n4"><rect x="84" y="496" width="236" height="84" rx="8" class="violet"/><text x="102" y="522" class="k">2025-04</text><text x="102" y="548" class="t">Qwen3</text></g><g data-node="qwen-timeline-c4"><rect x="336" y="496" width="780" height="84" rx="8" class="node"/></g><text x="354" y="530" class="s">去掉 QKV 偏置，改用逐头 QK-Norm；head_dim 固定 128</text><text x="354" y="558" class="s">MoE：128 个细粒度专家选 8，不设共享专家；一个模型兼容思考/非思考</text><g data-node="qwen-timeline-s4"><rect x="1132" y="496" width="240" height="84" rx="8" class="gray"/></g><text x="1150" y="530" class="m">0.6B–32B · 30B/235B MoE</text><text x="1150" y="558" class="xs">Apache 2.0</text><circle cx="60" cy="634" r="8" fill="#fff" stroke="#64748b" stroke-width="2"/><g data-node="qwen-timeline-n5"><rect x="84" y="592" width="236" height="84" rx="8" class="amber"/><text x="102" y="618" class="k">2025-09</text><text x="102" y="644" class="t">Qwen3-Next</text></g><g data-node="qwen-timeline-c5"><rect x="336" y="592" width="780" height="84" rx="8" class="node"/></g><text x="354" y="626" class="s">混合注意力：3 层 Gated DeltaNet + 1 层带输出门的注意力</text><text x="354" y="654" class="s">512 个专家选 10 + 1 个共享专家；MTP；零中心、带权重衰减的 RMSNorm</text><g data-node="qwen-timeline-s5"><rect x="1132" y="592" width="240" height="84" rx="8" class="gray"/></g><text x="1150" y="626" class="m">80B 总 / 3B 激活</text><text x="1150" y="654" class="xs">每 token 激活 3.75%</text><circle cx="60" cy="730" r="8" fill="#fff" stroke="#64748b" stroke-width="2"/><g data-node="qwen-timeline-n6"><rect x="84" y="688" width="236" height="84" rx="8" class="amber"/><text x="102" y="714" class="k">2026-02</text><text x="102" y="740" class="t">Qwen3.5 / 3.6 / 3.8</text></g><g data-node="qwen-timeline-c6"><rect x="336" y="688" width="780" height="84" rx="8" class="node"/></g><text x="354" y="722" class="s">Qwen3-Next 结构进入主线，并接上视觉编码器做早期融合训练</text><text x="354" y="750" class="s">词表扩到 248,320；3.6（4 月）、3.8（8 月）沿用同一 qwen3_5 实现</text><g data-node="qwen-timeline-s6"><rect x="1132" y="688" width="240" height="84" rx="8" class="gray"/></g><text x="1150" y="722" class="m">0.8B–397B · 3.8 到 2.4T</text><text x="1150" y="750" class="xs">多为 Apache 2.0</text><circle cx="60" cy="826" r="8" fill="#fff" stroke="#64748b" stroke-width="2"/><g data-node="qwen-timeline-n7"><rect x="84" y="784" width="236" height="84" rx="8" class="red"/><text x="102" y="810" class="k">2026-08</text><text x="102" y="836" class="t">Qwen3.8-Flash-Next</text></g><g data-node="qwen-timeline-c7"><rect x="336" y="784" width="780" height="84" rx="8" class="node"/></g><text x="354" y="818" class="s">Transformers 里的 qwen4_exp：全注意力层换成块级稀疏的 QSA</text><text x="354" y="846" class="s">4 路加宽残差流（Gated Residual）；第 2 层加 n-gram 嵌入</text><g data-node="qwen-timeline-s7"><rect x="1132" y="784" width="240" height="84" rx="8" class="gray"/></g><text x="1150" y="818" class="m">125B/6B + 51B n-gram</text><text x="1150" y="846" class="xs">Qwen Community 1.0</text>
</svg>
