<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="600" viewBox="0 0 1320 600" role="img" aria-labelledby="moe-params-title moe-params-desc" id="moe-params-root">
<title id="moe-params-title">四个 MoE 模型的总参数与每 token 激活参数</title>
<desc id="moe-params-desc">Mixtral-8x7B 总 46.7B、激活 12.9B（27.6%）；Qwen3-235B-A22B 总 235.1B、激活 22.2B（9.4%）；Qwen3.5-397B-A17B 文本部分总 396.3B、激活 17.3B（4.4%）；DeepSeek-V3 总 671.0B、激活 37.6B（5.6%）。条形长度按参数量等比例绘制。</desc>
<defs><style>
#moe-params-root text { font-family: Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #172b3a; }
#moe-params-root .h { font-size: 26px; font-weight: 700; }
#moe-params-root .t { font-size: 19px; font-weight: 600; }
#moe-params-root .s { font-size: 15px; fill: #475569; }
#moe-params-root .xs { font-size: 13px; fill: #64748b; }
#moe-params-root .k { font-size: 13px; font-weight: 700; letter-spacing: .04em; fill: #64748b; }
#moe-params-root .m { font-family: 'SFMono-Regular', Menlo, Consolas, monospace; font-size: 14px; fill: #172b3a; }
#moe-params-root .node { fill: #fff; stroke: #cbd5e1; stroke-width: 2; }
#moe-params-root .blue { fill: #eff6ff; stroke: #60a5fa; stroke-width: 2; }
#moe-params-root .green { fill: #ecfdf5; stroke: #20a28c; stroke-width: 2; }
#moe-params-root .red { fill: #fff1f2; stroke: #e88191; stroke-width: 2; }
#moe-params-root .amber { fill: #fffbeb; stroke: #e0a63a; stroke-width: 2; }
#moe-params-root .violet { fill: #f5f3ff; stroke: #9b87f5; stroke-width: 2; }
#moe-params-root .gray { fill: #f1f5f9; stroke: #cbd5e1; stroke-width: 2; }
#moe-params-root .fblue { fill: #93c5fd; } #moe-params-root .fgreen { fill: #6ee7b7; } #moe-params-root .fred { fill: #fda4af; }
#moe-params-root .famber { fill: #fcd34d; } #moe-params-root .fviolet { fill: #c4b5fd; } #moe-params-root .fgray { fill: #e2e8f0; }
#moe-params-root .edge { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#moe-params-arrow); }
#moe-params-root .dash { fill: none; stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 7 6; marker-end: url(#moe-params-arrow); }
#moe-params-root .line { stroke: #cbd5e1; stroke-width: 1.5; fill: none; }
#moe-params-root .axis { stroke: #64748b; stroke-width: 2; fill: none; }
</style><marker id="moe-params-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker></defs>
<rect width="1320" height="600" fill="#f8fafc"/>
<text x="32" y="46" class="h">总参数决定要放多少权重，激活参数决定每个 token 算多少</text>
<text x="32" y="78" class="s">灰色是总参数，橙色是每个 token 实际参与计算的部分；按 config.json 手算，条形等比例。</text>
<text x="32" y="180" class="t">Mixtral-8x7B</text><text x="32" y="206" class="xs">8 选 2，无共享</text><rect x="300" y="158" width="55" height="40" rx="4" class="fgray"/><rect x="300" y="158" width="15" height="40" rx="4" class="famber"/><text x="367" y="176" class="s">总 46.7B</text><text x="367" y="198" class="s">激活 12.9B（27.6%）</text><text x="32" y="284" class="t">Qwen3-235B-A22B</text><text x="32" y="310" class="xs">128 选 8，无共享</text><rect x="300" y="262" width="277" height="40" rx="4" class="fgray"/><rect x="300" y="262" width="26" height="40" rx="4" class="famber"/><text x="589" y="280" class="s">总 235.1B</text><text x="589" y="302" class="s">激活 22.2B（9.4%）</text><text x="32" y="388" class="t">Qwen3.5-397B-A17B</text><text x="32" y="414" class="xs">512 选 10 + 1 共享</text><rect x="300" y="366" width="466" height="40" rx="4" class="fgray"/><rect x="300" y="366" width="20" height="40" rx="4" class="famber"/><text x="778" y="384" class="s">总 396.3B</text><text x="778" y="406" class="s">激活 17.3B（4.4%）</text><text x="32" y="492" class="t">DeepSeek-V3</text><text x="32" y="518" class="xs">256 选 8 + 1 共享</text><rect x="300" y="470" width="789" height="40" rx="4" class="fgray"/><rect x="300" y="470" width="44" height="40" rx="4" class="famber"/><text x="1101" y="488" class="s">总 671.0B</text><text x="1101" y="510" class="s">激活 37.6B（5.6%）</text>
<text x="32" y="576" class="xs">激活参数包含注意力、词嵌入和输出层；Qwen3.5 只计文本部分，不含视觉编码器和 MTP 模块；DeepSeek-V3 不含 MTP 模块。</text>
</svg>
