<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="730" viewBox="0 0 1320 730" role="img" aria-labelledby="family-recipe-title family-recipe-desc" id="family-recipe-root">
<title id="family-recipe-title">GPT-2 与 Llama-3.1-8B 单层结构对照及现代配方的改动</title>
<desc id="family-recipe-desc">GPT-2 的一层：学习式位置嵌入加在输入上，LayerNorm 带 bias，12 头多头注意力，GELU 四倍宽 FFN，dropout 0.1。Llama-3.1-8B 的一层：没有位置嵌入、在注意力里对 q 和 k 做 RoPE，RMSNorm 无 bias，32 个查询头共用 8 个 KV 头，SwiGLU FFN，没有 dropout。两者都是 Pre-Norm。</desc>
<defs><style>
#family-recipe-root text { font-family: Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #172b3a; }
#family-recipe-root .h { font-size: 26px; font-weight: 700; }
#family-recipe-root .t { font-size: 19px; font-weight: 600; }
#family-recipe-root .s { font-size: 15px; fill: #475569; }
#family-recipe-root .xs { font-size: 13px; fill: #64748b; }
#family-recipe-root .k { font-size: 13px; font-weight: 700; letter-spacing: .04em; fill: #64748b; }
#family-recipe-root .m { font-family: 'SFMono-Regular', Menlo, Consolas, monospace; font-size: 14px; fill: #172b3a; }
#family-recipe-root .node { fill: #fff; stroke: #cbd5e1; stroke-width: 2; }
#family-recipe-root .blue { fill: #eff6ff; stroke: #60a5fa; stroke-width: 2; }
#family-recipe-root .green { fill: #ecfdf5; stroke: #20a28c; stroke-width: 2; }
#family-recipe-root .red { fill: #fff1f2; stroke: #e88191; stroke-width: 2; }
#family-recipe-root .amber { fill: #fffbeb; stroke: #e0a63a; stroke-width: 2; }
#family-recipe-root .violet { fill: #f5f3ff; stroke: #9b87f5; stroke-width: 2; }
#family-recipe-root .gray { fill: #f1f5f9; stroke: #cbd5e1; stroke-width: 2; }
#family-recipe-root .fblue { fill: #93c5fd; } #family-recipe-root .fgreen { fill: #6ee7b7; } #family-recipe-root .fred { fill: #fda4af; }
#family-recipe-root .famber { fill: #fcd34d; } #family-recipe-root .fviolet { fill: #c4b5fd; } #family-recipe-root .fgray { fill: #e2e8f0; }
#family-recipe-root .edge { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#family-recipe-arrow); }
#family-recipe-root .dash { fill: none; stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 7 6; marker-end: url(#family-recipe-arrow); }
#family-recipe-root .line { stroke: #cbd5e1; stroke-width: 1.5; fill: none; }
#family-recipe-root .axis { stroke: #64748b; stroke-width: 2; fill: none; }
</style><marker id="family-recipe-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker></defs>
<rect width="1320" height="730" fill="#f8fafc"/>
<text x="32" y="46" class="h">“现代配方”：同一个骨架，换了六七个零件</text>
<text x="32" y="78" class="s">左：GPT-2 small（2019）；中：Llama-3.1-8B（2024）；右：每一项改动与它最早的公开出处。</text>
<g data-node="GPT-2 small · 2019"><rect x="32" y="104" width="360" height="600" rx="8" class="node"/><text x="50" y="130" class="k">GPT-2 small · 2019</text><text x="50" y="156" class="t">GPT-2</text></g><g data-node="GPT-2 small · 2019-0"><rect x="52" y="190" width="320" height="72" rx="8" class="gray"/><text x="70" y="226" class="t">词嵌入 + 学习式位置嵌入</text><text x="70" y="254" class="s">位置表 1024 行，超出就没有</text></g><g data-node="GPT-2 small · 2019-1"><rect x="52" y="276" width="320" height="72" rx="8" class="violet"/><text x="70" y="312" class="t">LayerNorm（有 bias）</text><text x="70" y="340" class="s">Pre-Norm：放在子层输入</text></g><path d="M212 262V276" class="edge"/><g data-node="GPT-2 small · 2019-2"><rect x="52" y="362" width="320" height="72" rx="8" class="blue"/><text x="70" y="398" class="t">多头注意力 12 头</text><text x="70" y="426" class="s">Q、K、V 各 12 头，带 bias</text></g><path d="M212 348V362" class="edge"/><g data-node="GPT-2 small · 2019-3"><rect x="52" y="448" width="320" height="72" rx="8" class="violet"/><text x="70" y="484" class="t">LayerNorm（有 bias）</text><text x="70" y="512" class="s">残差加回后再进 FFN</text></g><path d="M212 434V448" class="edge"/><g data-node="GPT-2 small · 2019-4"><rect x="52" y="534" width="320" height="72" rx="8" class="amber"/><text x="70" y="570" class="t">FFN：GELU，4 倍宽</text><text x="70" y="598" class="s">768 → 3072 → 768，带 bias</text></g><path d="M212 520V534" class="edge"/><g data-node="GPT-2 small · 2019-5"><rect x="52" y="620" width="320" height="72" rx="8" class="red"/><text x="70" y="656" class="t">dropout 0.1</text><text x="70" y="684" class="s">注意力、残差、嵌入处都有</text></g>
<g data-node="Llama-3.1-8B · 2024"><rect x="422" y="104" width="360" height="600" rx="8" class="node"/><text x="440" y="130" class="k">Llama-3.1-8B · 2024</text><text x="440" y="156" class="t">Llama-3.1-8B</text></g><g data-node="Llama-3.1-8B · 2024-0"><rect x="442" y="190" width="320" height="72" rx="8" class="gray"/><text x="460" y="226" class="t">词嵌入（无位置嵌入）</text><text x="460" y="254" class="s">位置交给注意力里的 RoPE</text></g><g data-node="Llama-3.1-8B · 2024-1"><rect x="442" y="276" width="320" height="72" rx="8" class="violet"/><text x="460" y="312" class="t">RMSNorm（无 bias）</text><text x="460" y="340" class="s">Pre-Norm，只除均方根</text></g><path d="M602 262V276" class="edge"/><g data-node="Llama-3.1-8B · 2024-2"><rect x="442" y="362" width="320" height="72" rx="8" class="blue"/><text x="460" y="398" class="t">GQA：32 Q 头 / 8 KV 头</text><text x="460" y="426" class="s">q、k 加 RoPE；投影无 bias</text></g><path d="M602 348V362" class="edge"/><g data-node="Llama-3.1-8B · 2024-3"><rect x="442" y="448" width="320" height="72" rx="8" class="violet"/><text x="460" y="484" class="t">RMSNorm（无 bias）</text><text x="460" y="512" class="s">残差加回后再进 FFN</text></g><path d="M602 434V448" class="edge"/><g data-node="Llama-3.1-8B · 2024-4"><rect x="442" y="534" width="320" height="72" rx="8" class="amber"/><text x="460" y="570" class="t">FFN：SwiGLU，3.5 倍宽</text><text x="460" y="598" class="s">4096 → 14336（门控）→ 4096</text></g><path d="M602 520V534" class="edge"/><g data-node="Llama-3.1-8B · 2024-5"><rect x="442" y="620" width="320" height="72" rx="8" class="green"/><text x="460" y="656" class="t">无 dropout</text><text x="460" y="684" class="s">attention_dropout 0.0</text></g>
<path d="M392 404H422" class="dash"/>
<g data-node="chg"><rect x="812" y="104" width="476" height="600" rx="8" class="blue"/><text x="830" y="130" class="k">对照</text><text x="830" y="156" class="t">从 GPT-2 到 Llama 改了什么</text></g><text x="832" y="186" class="k">位置</text><text x="916" y="186" class="s">学习式绝对位置 → RoPE</text><text x="916" y="210" class="xs">RoFormer 2021</text><text x="832" y="256" class="k">归一化</text><text x="916" y="256" class="s">LayerNorm → RMSNorm</text><text x="916" y="280" class="xs">2019；T5 已用</text><line x1="832" y1="226" x2="1268" y2="226" class="line"/><text x="832" y="326" class="k">FFN</text><text x="916" y="326" class="s">GELU → SwiGLU</text><text x="916" y="350" class="xs">Shazeer 2020</text><line x1="832" y1="296" x2="1268" y2="296" class="line"/><text x="832" y="396" class="k">bias</text><text x="916" y="396" class="s">全部去掉</text><text x="916" y="420" class="xs">PaLM 2022</text><line x1="832" y1="366" x2="1268" y2="366" class="line"/><text x="832" y="466" class="k">KV 头</text><text x="916" y="466" class="s">MHA → GQA</text><text x="916" y="490" class="xs">2023；Llama 2 70B</text><line x1="832" y1="436" x2="1268" y2="436" class="line"/><text x="832" y="536" class="k">dropout</text><text x="916" y="536" class="s">0.1 → 0</text><text x="916" y="560" class="xs">常见解释：数据量大</text><line x1="832" y1="506" x2="1268" y2="506" class="line"/><text x="832" y="606" class="k">嵌入</text><text x="916" y="606" class="s">共享 → 8B 起不共享</text><text x="916" y="630" class="xs">小模型仍常共享</text><line x1="832" y1="576" x2="1268" y2="576" class="line"/><text x="832" y="684" class="xs">没改的：Pre-Norm（GPT-2 已采用）、因果掩码、残差流</text>
</svg>
