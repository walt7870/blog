<text x="32" y="572" class="s">每层后面的 FFN：Qwen3.5、Kimi Linear 每层都是 MoE（Kimi Linear 第 1 层为稠密）；Jamba 隔层一个 16 选 2 的 MoE；Nemotron-H-8B 为稠密 MLP。</text>
<text x="32" y="600" class="xs">排布来自各自的 config.json：layer_types、linear_attn_config、attn_layer_period/offset、hybrid_override_pattern。</text>
