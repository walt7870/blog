</style><marker id="linear-hybrid-layers-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker></defs>
<rect width="1320" height="660" fill="#f8fafc"/>
<text x="32" y="46" class="h">混合架构：大部分层用固定状态，少数层保留完整注意力</text>
<text x="32" y="78" class="s">蓝色 = 线性注意力 / SSM 层，红色 = 完整注意力层，灰色 = 单独的 MLP 块（Nemotron-H 把混合层和 FFN 拆成独立块）。</text>
