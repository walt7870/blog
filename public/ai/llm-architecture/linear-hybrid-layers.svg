#linear-hybrid-layers-root .fblue { fill: #93c5fd; } #linear-hybrid-layers-root .fgreen { fill: #6ee7b7; } #linear-hybrid-layers-root .fred { fill: #fda4af; }
#linear-hybrid-layers-root .famber { fill: #fcd34d; } #linear-hybrid-layers-root .fviolet { fill: #c4b5fd; } #linear-hybrid-layers-root .fgray { fill: #e2e8f0; }
#linear-hybrid-layers-root .edge { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#linear-hybrid-layers-arrow); }
#linear-hybrid-layers-root .dash { fill: none; stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 7 6; marker-end: url(#linear-hybrid-layers-arrow); }
