<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="660" viewBox="0 0 1320 660" role="img" aria-labelledby="linear-hybrid-layers-title linear-hybrid-layers-desc" id="linear-hybrid-layers-root">
<title id="linear-hybrid-layers-title">四个混合架构的层排布</title>
<desc id="linear-hybrid-layers-desc">Qwen3.5-397B-A17B 60 层，按“3 层 Gated DeltaNet + 1 层门控注意力”重复 15 次；Kimi Linear 48B 27 层，第 4、8、12、16、20、24、27 层是 MLA，其余 20 层是 KDA；Jamba v0.1 32 层，每 8 层的第 5 层是注意力，共 4 层；Nemotron-H-8B 52 个块里 24 个 Mamba2、4 个注意力、24 个 MLP。</desc>
<defs><style>
#linear-hybrid-layers-root text { font-family: Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #172b3a; }
