<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="470" viewBox="0 0 1400 470" role="img" aria-labelledby="deepseek-timeline-title deepseek-timeline-desc" id="deepseek-timeline-root">
<title id="deepseek-timeline-title">DeepSeek 各代改了什么</title>
<desc id="deepseek-timeline-desc">V2 引入 MLA 和 DeepSeekMoE；V3 放大规模并加入无辅助损失负载均衡和 MTP；R1 和 V3.1 结构与 V3 相同，改的是训练；V3.2 在 MLA 上加闪电索引器做稀疏注意力；V4 换成共享 KV 的 MQA，加入压缩稀疏注意力、mHC 残差和哈希路由。</desc>
<defs><style>
#deepseek-timeline-root text { font-family: Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #172b3a; }
#deepseek-timeline-root .h { font-size: 26px; font-weight: 700; }
#deepseek-timeline-root .t { font-size: 19px; font-weight: 600; }
#deepseek-timeline-root .s { font-size: 15px; fill: #475569; }
#deepseek-timeline-root .xs { font-size: 13px; fill: #64748b; }
#deepseek-timeline-root .k { font-size: 13px; font-weight: 700; letter-spacing: .04em; fill: #64748b; }
#deepseek-timeline-root .m { font-family: 'SFMono-Regular', Menlo, Consolas, monospace; font-size: 14px; fill: #172b3a; }
#deepseek-timeline-root .node { fill: #fff; stroke: #cbd5e1; stroke-width: 2; }
#deepseek-timeline-root .blue { fill: #eff6ff; stroke: #60a5fa; stroke-width: 2; }
#deepseek-timeline-root .green { fill: #ecfdf5; stroke: #20a28c; stroke-width: 2; }
#deepseek-timeline-root .red { fill: #fff1f2; stroke: #e88191; stroke-width: 2; }
#deepseek-timeline-root .amber { fill: #fffbeb; stroke: #e0a63a; stroke-width: 2; }
#deepseek-timeline-root .violet { fill: #f5f3ff; stroke: #9b87f5; stroke-width: 2; }
#deepseek-timeline-root .gray { fill: #f1f5f9; stroke: #cbd5e1; stroke-width: 2; }
#deepseek-timeline-root .fblue { fill: #93c5fd; } #deepseek-timeline-root .fgreen { fill: #6ee7b7; } #deepseek-timeline-root .fred { fill: #fda4af; }
#deepseek-timeline-root .famber { fill: #fcd34d; } #deepseek-timeline-root .fviolet { fill: #c4b5fd; } #deepseek-timeline-root .fgray { fill: #e2e8f0; }
#deepseek-timeline-root .edge { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#deepseek-timeline-arrow); }
#deepseek-timeline-root .dash { fill: none; stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 7 6; marker-end: url(#deepseek-timeline-arrow); }
#deepseek-timeline-root .line { stroke: #cbd5e1; stroke-width: 1.5; fill: none; }
#deepseek-timeline-root .axis { stroke: #64748b; stroke-width: 2; fill: none; }
</style><marker id="deepseek-timeline-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker></defs>
<rect width="1400" height="470" fill="#f8fafc"/>
<text x="32" y="46" class="h">DeepSeek 各代：哪些改了结构，哪些只改了训练</text>
<text x="32" y="78" class="s">日期为官方发布日期。判断依据是 config.json 的字段差异和 Transformers 里是否有新的模型类。</text>
<path d="M32 128H1376" class="axis"/><circle cx="56" cy="128" r="7" fill="#64748b"/><text x="72" y="120" class="xs">2024-05</text><g data-node="tl-V2"><rect x="32" y="150" width="214" height="196" rx="8" class="blue"/><text x="50" y="176" class="k">架构</text><text x="50" y="202" class="t">V2</text><text x="50" y="230" class="s">MLA：KV 压成 512+64</text><text x="50" y="253" class="s">160 路由 + 2 共享专家</text><text x="50" y="276" class="s">236B 总 / 21B 激活</text></g><circle cx="282" cy="128" r="7" fill="#64748b"/><text x="298" y="120" class="xs">2024-12</text><g data-node="tl-V3"><rect x="258" y="150" width="214" height="196" rx="8" class="blue"/><text x="276" y="176" class="k">架构 + 训练</text><text x="276" y="202" class="t">V3</text><text x="276" y="230" class="s">256 专家 + 1 共享，top-8</text><text x="276" y="253" class="s">无辅助损失偏置、MTP</text><text x="276" y="276" class="s">FP8 训练（训练配方）</text></g><circle cx="508" cy="128" r="7" fill="#64748b"/><text x="524" y="120" class="xs">2025-01</text><g data-node="tl-R1"><rect x="484" y="150" width="214" height="196" rx="8" class="gray"/><text x="502" y="176" class="k">训练</text><text x="502" y="202" class="t">R1</text><text x="502" y="230" class="s">config 与 V3 逐项相同</text><text x="502" y="253" class="s">V3-Base 上做强化学习</text><text x="502" y="276" class="s">长思维链来自训练</text></g><circle cx="734" cy="128" r="7" fill="#64748b"/><text x="750" y="120" class="xs">2025-08</text><g data-node="tl-V3.1"><rect x="710" y="150" width="214" height="196" rx="8" class="gray"/><text x="728" y="176" class="k">训练</text><text x="728" y="202" class="t">V3.1</text><text x="728" y="230" class="s">同一架构继续长文本训练</text><text x="728" y="253" class="s">思考/非思考靠对话模板</text><text x="728" y="276" class="s">FP8 缩放改为 UE8M0</text></g><circle cx="960" cy="128" r="7" fill="#64748b"/><text x="976" y="120" class="xs">2025-09 / 12</text><g data-node="tl-V3.2"><rect x="936" y="150" width="214" height="196" rx="8" class="amber"/><text x="954" y="176" class="k">架构</text><text x="954" y="202" class="t">V3.2</text><text x="954" y="230" class="s">MLA 上加闪电索引器</text><text x="954" y="253" class="s">每个查询只看 2048 位置</text><text x="954" y="276" class="s">其余结构不变</text></g><circle cx="1186" cy="128" r="7" fill="#64748b"/><text x="1202" y="120" class="xs">2026-04</text><g data-node="tl-V4"><rect x="1162" y="150" width="214" height="196" rx="8" class="violet"/><text x="1180" y="176" class="k">架构</text><text x="1180" y="202" class="t">V4</text><text x="1180" y="230" class="s">共享 KV 的 MQA</text><text x="1180" y="253" class="s">滑动窗口 + CSA/HCA</text><text x="1180" y="276" class="s">mHC、哈希路由、1M</text></g><g data-node="tl-legend-a"><rect x="32" y="376" width="520" height="70" rx="8" class="blue"/><text x="50" y="402" class="k">彩色框</text><text x="50" y="430" class="s">改了网络结构：config 出现新字段或新的模型类</text></g><g data-node="tl-legend-b"><rect x="576" y="376" width="520" height="70" rx="8" class="gray"/><text x="594" y="402" class="k">灰色框</text><text x="594" y="430" class="s">结构不变：改的是数据、训练流程或对话模板</text></g>
</svg>
