<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="690" viewBox="0 0 1400 690" role="img" aria-labelledby="multimodal-image-tokens-title multimodal-image-tokens-desc" id="multimodal-image-tokens-root">
<title id="multimodal-image-tokens-title">一张 448×448 的图在 Qwen2.5-VL 里变成 256 个 token 的过程</title>
<desc id="multimodal-image-tokens-desc">448×448 的图按 14×14 像素切成 32×32 共 1024 个 patch，经 ViT 编码成 1024 个 1280 维向量，相邻 2×2 个合并成 256 个 5120 维向量，再由 MLP 投影到语言模型的 3584 维，和文字 token 拼接。下方对比同一张图在 ViT-L/14、Qwen2.5-VL、Qwen3-VL、Gemma 3、Gemma 4 中的 token 数。</desc>
