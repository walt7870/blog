<text x="40" y="384" class="xs">橙框：相邻 2×2 个 patch</text>
<text x="40" y="404" class="xs">每格 = 14×14 像素</text>
<g data-node="p1"><rect x="290" y="124" width="196" height="176" rx="8" class="node"/><text x="308" y="150" class="k">① Conv3d</text><text x="308" y="176" class="t">切成 patch</text><text x="308" y="204" class="s">32×32 = 1024 个</text><text x="308" y="227" class="s">2 帧×14×14×3 通道</text><text x="308" y="250" class="s">每个 1176 个数</text></g>
<path d="M486 212H508" class="edge"/>
<g data-node="p2"><rect x="508" y="124" width="196" height="176" rx="8" class="blue"/><text x="526" y="150" class="k">② 视觉编码器</text><text x="526" y="176" class="t">ViT 编码</text><text x="526" y="204" class="s">32 层，宽 1280</text><text x="526" y="227" class="s">[1024, 1176]</text><text x="526" y="250" class="s">→ [1024, 1280]</text></g>
<path d="M704 212H726" class="edge"/>
<g data-node="p3"><rect x="726" y="124" width="196" height="176" rx="8" class="amber"/><text x="744" y="150" class="k">③ 相邻合并</text><text x="744" y="176" class="t">2×2 合并</text><text x="744" y="204" class="s">4 个相邻向量拼成 1 个</text><text x="744" y="227" class="s">[1024, 1280]</text><text x="744" y="250" class="s">→ [256, 5120]</text></g>
<path d="M922 212H944" class="edge"/>
<g data-node="p4"><rect x="944" y="124" width="196" height="176" rx="8" class="violet"/><text x="962" y="150" class="k">④ 投影层</text><text x="962" y="176" class="t">MLP 投影</text><text x="962" y="204" class="s">两层线性 + GELU</text><text x="962" y="227" class="s">[256, 5120]</text><text x="962" y="250" class="s">→ [256, 3584]</text></g>
<path d="M1140 212H1162" class="edge"/>
<g data-node="p5"><rect x="1162" y="124" width="196" height="176" rx="8" class="green"/><text x="1180" y="150" class="k">⑤ 拼接</text><text x="1180" y="176" class="t">进入语言模型</text><text x="1180" y="204" class="s">和文字 token 拼成</text><text x="1180" y="227" class="s">一条序列，共 28 层</text><text x="1180" y="250" class="s">256 个图像 token</text></g>
<path d="M254 254H290" class="edge"/>
<text x="40" y="442" class="s">同一张 448×448 的图，在不同模型里变成多少个 token（按各自源码和预处理配置计算）</text>
<text x="40" y="482" class="s">ViT-L/14 不合并</text>
<rect x="260" y="464" width="640.0" height="26" rx="4" class="fgray"/>
<text x="910" y="483" class="m">1024</text>
<text x="960" y="482" class="xs">按 448 原尺寸切 32×32 个，全部送进去</text>
<text x="40" y="524" class="s">Qwen2.5-VL</text>
<rect x="260" y="506" width="160.0" height="26" rx="4" class="famber"/>
<text x="430" y="525" class="m">256</text>
<text x="960" y="524" class="xs">patch 14，2×2 合并</text>
<text x="40" y="566" class="s">Qwen3-VL</text>
<rect x="260" y="548" width="122.5" height="26" rx="4" class="fviolet"/>
<text x="392.5" y="567" class="m">196</text>
<text x="960" y="566" class="xs">patch 16：28×28 = 784，2×2 合并</text>
<text x="40" y="608" class="s">Gemma 3</text>
<rect x="260" y="590" width="160.0" height="26" rx="4" class="fblue"/>
<text x="430" y="609" class="m">256</text>
<text x="960" y="608" class="xs">固定缩放到 896，4096 个 patch 平均池化 4×4</text>
<text x="40" y="650" class="s">Gemma 4（预算 280）</text>
<rect x="260" y="632" width="160.0" height="26" rx="4" class="fgreen"/>
<text x="430" y="651" class="m">256</text>
<text x="960" y="650" class="xs">放大到 768×768，2304 个 patch，3×3 池化</text>
