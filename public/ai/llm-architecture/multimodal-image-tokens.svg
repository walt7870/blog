#multimodal-image-tokens-root .fblue { fill: #93c5fd; } #multimodal-image-tokens-root .fgreen { fill: #6ee7b7; } #multimodal-image-tokens-root .fred { fill: #fda4af; }
#multimodal-image-tokens-root .famber { fill: #fcd34d; } #multimodal-image-tokens-root .fviolet { fill: #c4b5fd; } #multimodal-image-tokens-root .fgray { fill: #e2e8f0; }
#multimodal-image-tokens-root .edge { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#multimodal-image-tokens-arrow); }
