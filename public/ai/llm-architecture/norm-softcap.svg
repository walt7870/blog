<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" role="img" aria-labelledby="norm-softcap-title norm-softcap-desc" id="norm-softcap-root">
<title id="norm-softcap-title">logit soft-capping 的形状</title>
<desc id="norm-softcap-desc">soft-capping 把 logit x 换成 cap·tanh(x/cap)。cap 为 30 时，10 变成 9.6，60 变成 28.9，再大也不会超过 30；cap 为 50 的曲线更晚弯折。灰色虚线为不截断时的 y=x。</desc>
<defs><style>
#norm-softcap-root text { font-family: Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #172b3a; }
#norm-softcap-root .h { font-size: 26px; font-weight: 700; }
#norm-softcap-root .t { font-size: 19px; font-weight: 600; }
#norm-softcap-root .s { font-size: 15px; fill: #475569; }
#norm-softcap-root .xs { font-size: 13px; fill: #64748b; }
#norm-softcap-root .k { font-size: 13px; font-weight: 700; letter-spacing: .04em; fill: #64748b; }
#norm-softcap-root .m { font-family: 'SFMono-Regular', Menlo, Consolas, monospace; font-size: 14px; fill: #172b3a; }
#norm-softcap-root .node { fill: #fff; stroke: #cbd5e1; stroke-width: 2; }
#norm-softcap-root .blue { fill: #eff6ff; stroke: #60a5fa; stroke-width: 2; }
#norm-softcap-root .green { fill: #ecfdf5; stroke: #20a28c; stroke-width: 2; }
#norm-softcap-root .red { fill: #fff1f2; stroke: #e88191; stroke-width: 2; }
#norm-softcap-root .amber { fill: #fffbeb; stroke: #e0a63a; stroke-width: 2; }
#norm-softcap-root .violet { fill: #f5f3ff; stroke: #9b87f5; stroke-width: 2; }
#norm-softcap-root .gray { fill: #f1f5f9; stroke: #cbd5e1; stroke-width: 2; }
#norm-softcap-root .fblue { fill: #93c5fd; } #norm-softcap-root .fgreen { fill: #6ee7b7; } #norm-softcap-root .fred { fill: #fda4af; }
#norm-softcap-root .famber { fill: #fcd34d; } #norm-softcap-root .fviolet { fill: #c4b5fd; } #norm-softcap-root .fgray { fill: #e2e8f0; }
#norm-softcap-root .edge { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#norm-softcap-arrow); }
#norm-softcap-root .dash { fill: none; stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 7 6; marker-end: url(#norm-softcap-arrow); }
#norm-softcap-root .line { stroke: #cbd5e1; stroke-width: 1.5; fill: none; }
#norm-softcap-root .axis { stroke: #64748b; stroke-width: 2; fill: none; }
</style><marker id="norm-softcap-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker></defs>
<rect width="1200" height="540" fill="#f8fafc"/>
<text x="32" y="46" class="h">soft-capping：小值几乎不变，大值被压到上限以内</text>
<text x="32" y="78" class="s">Gemma 2 对注意力分数用 cap = 50，对最终输出 logits 用 cap = 30。</text>
