<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="860" viewBox="0 0 1360 860" role="img" aria-labelledby="transformer-architecture-title transformer-architecture-desc" id="transformer-architecture-root">
<title id="transformer-architecture-title">原始 Transformer 的编码器-解码器结构</title>
<desc id="transformer-architecture-desc">左边编码器 6 层，每层是双向多头自注意力和逐位置 FFN，各自带残差相加和 LayerNorm，把原文变成每个位置一个 512 维向量；右边解码器 6 层，每层依次是只看左边的自注意力、读取编码器输出的交叉注意力和 FFN，最后经线性层和 softmax 给出下一个词。</desc>
<defs><style>
#transformer-architecture-root text { font-family: Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #172b3a; }
#transformer-architecture-root .h { font-size: 26px; font-weight: 700; }
#transformer-architecture-root .t { font-size: 19px; font-weight: 600; }
#transformer-architecture-root .s { font-size: 15px; fill: #475569; }
#transformer-architecture-root .xs { font-size: 13px; fill: #64748b; }
#transformer-architecture-root .k { font-size: 13px; font-weight: 700; letter-spacing: .04em; fill: #64748b; }
#transformer-architecture-root .m { font-family: 'SFMono-Regular', Menlo, Consolas, monospace; font-size: 14px; fill: #172b3a; }
#transformer-architecture-root .node { fill: #fff; stroke: #cbd5e1; stroke-width: 2; }
#transformer-architecture-root .blue { fill: #eff6ff; stroke: #60a5fa; stroke-width: 2; }
#transformer-architecture-root .green { fill: #ecfdf5; stroke: #20a28c; stroke-width: 2; }
#transformer-architecture-root .red { fill: #fff1f2; stroke: #e88191; stroke-width: 2; }
#transformer-architecture-root .amber { fill: #fffbeb; stroke: #e0a63a; stroke-width: 2; }
#transformer-architecture-root .violet { fill: #f5f3ff; stroke: #9b87f5; stroke-width: 2; }
#transformer-architecture-root .gray { fill: #f1f5f9; stroke: #cbd5e1; stroke-width: 2; }
#transformer-architecture-root .fblue { fill: #93c5fd; } #transformer-architecture-root .fgreen { fill: #6ee7b7; } #transformer-architecture-root .fred { fill: #fda4af; }
#transformer-architecture-root .famber { fill: #fcd34d; } #transformer-architecture-root .fviolet { fill: #c4b5fd; } #transformer-architecture-root .fgray { fill: #e2e8f0; }
#transformer-architecture-root .edge { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#transformer-architecture-arrow); }
#transformer-architecture-root .dash { fill: none; stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 7 6; marker-end: url(#transformer-architecture-arrow); }
#transformer-architecture-root .line { stroke: #cbd5e1; stroke-width: 1.5; fill: none; }
#transformer-architecture-root .axis { stroke: #64748b; stroke-width: 2; fill: none; }
</style><marker id="transformer-architecture-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker></defs>
<rect width="1360" height="860" fill="#f8fafc"/>
<text x="32" y="46" class="h">2017 年的 Transformer：编码器读、解码器写</text>
<text x="32" y="78" class="s">base 配置：d_model 512、8 个头、FFN 2048、编码器和解码器各 6 层；形状以 5 个原文 token、4 个已写出的译文 token 为例</text>
<text x="120" y="128" class="k">编码器：读原文（×6 层）</text><text x="700" y="128" class="k">解码器：写译文（×6 层）</text><g data-node="enc-in"><rect x="120" y="730" width="420" height="76" rx="8" class="gray"/><text x="138" y="766" class="t">原文 token：年 假 怎么 申请 ？</text><text x="138" y="794" class="s">词嵌入 ×√512 + 正弦位置编码 → [5, 512]</text></g><rect x="100" y="148" width="460" height="550" rx="12" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="8 6"/><g data-node="enc-attn"><rect x="120" y="508" width="420" height="104" rx="8" class="blue"/><text x="138" y="544" class="t">多头自注意力（双向）</text><text x="138" y="572" class="s">8 个头 × 64 维；每个位置看整句</text><text x="138" y="595" class="s">之后：残差相加 + LayerNorm</text></g><g data-node="enc-ffn"><rect x="120" y="318" width="420" height="104" rx="8" class="green"/><text x="138" y="354" class="t">FFN（逐位置）</text><text x="138" y="382" class="s">512 → 2048 → 512，ReLU</text><text x="138" y="405" class="s">之后：残差相加 + LayerNorm</text></g><g data-node="enc-out"><rect x="120" y="168" width="420" height="76" rx="8" class="violet"/><text x="138" y="204" class="t">编码器输出（“记忆”）</text><text x="138" y="232" class="s">原文每个位置一个向量 [5, 512]</text></g><path d="M330 728V616" class="edge"/><path d="M330 506V426" class="edge"/><path d="M330 328V248" class="edge"/><g data-node="dec-in"><rect x="700" y="730" width="420" height="76" rx="8" class="gray"/><text x="718" y="766" class="t">已写出的译文：&lt;s&gt; How to apply</text><text x="718" y="794" class="s">词嵌入 ×√512 + 正弦位置编码 → [4, 512]</text></g><rect x="680" y="148" width="460" height="550" rx="12" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="8 6"/><g data-node="dec-self"><rect x="700" y="590" width="420" height="84" rx="8" class="blue"/><text x="718" y="626" class="t">带掩码的自注意力（只看左边）</text><text x="718" y="654" class="s">之后：残差相加 + LayerNorm</text></g><g data-node="dec-cross"><rect x="700" y="442" width="420" height="104" rx="8" class="amber"/><text x="718" y="478" class="t">交叉注意力</text><text x="718" y="506" class="s">Q 来自译文，K、V 来自编码器输出</text><text x="718" y="529" class="s">之后：残差相加 + LayerNorm</text></g><g data-node="dec-ffn"><rect x="700" y="318" width="420" height="84" rx="8" class="green"/><text x="718" y="354" class="t">FFN（逐位置）</text><text x="718" y="382" class="s">之后：残差相加 + LayerNorm</text></g><g data-node="dec-out"><rect x="700" y="168" width="420" height="100" rx="8" class="red"/><text x="718" y="204" class="t">线性层 + softmax</text><text x="718" y="232" class="s">对 37000 个 token 打分</text><text x="718" y="255" class="s">取最后一个位置：下一个词 “for”</text></g><path d="M910 728V678" class="edge"/><path d="M910 588V546" class="edge"/><path d="M910 448V406" class="edge"/><path d="M910 316V272" class="edge"/><path d="M540 206H620V496H696" class="edge"/><text x="574" y="530" class="xs">每层解码器</text><text x="574" y="550" class="xs">都读这一份</text>
</svg>
