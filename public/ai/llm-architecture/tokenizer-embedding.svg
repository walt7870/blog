<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="700" viewBox="0 0 1400 700" role="img" aria-labelledby="tokenizer-embedding-title tokenizer-embedding-desc" id="tokenizer-embedding-root">
<title id="tokenizer-embedding-title">词嵌入查表与输出层是否共享</title>
<desc id="tokenizer-embedding-desc">5 个 token 编号在形状 [128256, 4096] 的词嵌入矩阵里各取一行，得到 [5, 4096] 送进第 1 层。Llama-3.1-8B 输出层另存一份同样大小的矩阵，两份共 10.5 亿参数占 13.1%；Qwen2.5-0.5B 让输出层复用词嵌入矩阵，只存一份 1.36 亿，仍占 27.6%；Llama-3.2-1B 共享后占 21.3%。</desc>
<defs><style>
#tokenizer-embedding-root text { font-family: Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #172b3a; }
#tokenizer-embedding-root .h { font-size: 26px; font-weight: 700; }
#tokenizer-embedding-root .t { font-size: 19px; font-weight: 600; }
#tokenizer-embedding-root .s { font-size: 15px; fill: #475569; }
#tokenizer-embedding-root .xs { font-size: 13px; fill: #64748b; }
#tokenizer-embedding-root .k { font-size: 13px; font-weight: 700; letter-spacing: .04em; fill: #64748b; }
#tokenizer-embedding-root .m { font-family: 'SFMono-Regular', Menlo, Consolas, monospace; font-size: 14px; fill: #172b3a; }
#tokenizer-embedding-root .node { fill: #fff; stroke: #cbd5e1; stroke-width: 2; }
#tokenizer-embedding-root .blue { fill: #eff6ff; stroke: #60a5fa; stroke-width: 2; }
#tokenizer-embedding-root .green { fill: #ecfdf5; stroke: #20a28c; stroke-width: 2; }
#tokenizer-embedding-root .red { fill: #fff1f2; stroke: #e88191; stroke-width: 2; }
#tokenizer-embedding-root .amber { fill: #fffbeb; stroke: #e0a63a; stroke-width: 2; }
#tokenizer-embedding-root .violet { fill: #f5f3ff; stroke: #9b87f5; stroke-width: 2; }
#tokenizer-embedding-root .gray { fill: #f1f5f9; stroke: #cbd5e1; stroke-width: 2; }
#tokenizer-embedding-root .fblue { fill: #93c5fd; } #tokenizer-embedding-root .fgreen { fill: #6ee7b7; } #tokenizer-embedding-root .fred { fill: #fda4af; }
#tokenizer-embedding-root .famber { fill: #fcd34d; } #tokenizer-embedding-root .fviolet { fill: #c4b5fd; } #tokenizer-embedding-root .fgray { fill: #e2e8f0; }
#tokenizer-embedding-root .edge { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#tokenizer-embedding-arrow); }
#tokenizer-embedding-root .dash { fill: none; stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 7 6; marker-end: url(#tokenizer-embedding-arrow); }
#tokenizer-embedding-root .line { stroke: #cbd5e1; stroke-width: 1.5; fill: none; }
#tokenizer-embedding-root .axis { stroke: #64748b; stroke-width: 2; fill: none; }
</style><marker id="tokenizer-embedding-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker></defs>
<rect width="1400" height="700" fill="#f8fafc"/>
<text x="32" y="46" class="h">词嵌入是一张表：编号就是行号</text>
<text x="32" y="78" class="s">左边：查表过程；右边：输出层要不要复用这张表；下方：词表在不同规模模型里的参数占比。</text>
<text x="32" y="128" class="k">输入编号 [5]</text><rect x="32" y="142" width="170" height="40" rx="4" class="fgray"/><text x="117" y="167" text-anchor="middle" class="s">年  8107</text><rect x="32" y="192" width="170" height="40" rx="4" class="fgray"/><text x="117" y="217" text-anchor="middle" class="s">假  107099</text><rect x="32" y="242" width="170" height="40" rx="4" class="fgray"/><text x="117" y="267" text-anchor="middle" class="s">怎么  104237</text><rect x="32" y="292" width="170" height="40" rx="4" class="fgray"/><text x="117" y="317" text-anchor="middle" class="s">申请  112838</text><rect x="32" y="342" width="170" height="40" rx="4" class="fgray"/><text x="117" y="367" text-anchor="middle" class="s">？  11571</text><rect x="300" y="120" width="260" height="300" rx="6" class="blue"/><text x="430" y="448" class="s" text-anchor="middle">词嵌入矩阵 [128256, 4096]</text><text x="430" y="470" class="xs" text-anchor="middle">每行是一个 token 的向量</text><rect x="306" y="145.4" width="248" height="8" fill="#2563eb" opacity=".75"/><path d="M202 162L298 149.4" class="line"/><rect x="306" y="358.2" width="248" height="8" fill="#2563eb" opacity=".75"/><path d="M202 212L298 362.2" class="line"/><rect x="306" y="352.4" width="248" height="8" fill="#2563eb" opacity=".75"/><path d="M202 262L298 356.4" class="line"/><rect x="306" y="370.9" width="248" height="8" fill="#2563eb" opacity=".75"/><path d="M202 312L298 374.9" class="line"/><rect x="306" y="152.8" width="248" height="8" fill="#2563eb" opacity=".75"/><path d="M202 362L298 156.8" class="line"/><path d="M560 270H640" class="edge"/><text x="572" y="258" class="xs">取出 5 行</text><rect x="650" y="142" width="240" height="40" rx="4" class="fblue"/><rect x="650" y="192" width="240" height="40" rx="4" class="fblue"/><rect x="650" y="242" width="240" height="40" rx="4" class="fblue"/><rect x="650" y="292" width="240" height="40" rx="4" class="fblue"/><rect x="650" y="342" width="240" height="40" rx="4" class="fblue"/><text x="770" y="128" class="k" text-anchor="middle">[5, 4096]，送进第 1 层</text><text x="770" y="416" class="xs" text-anchor="middle">查表不做乘法，只是按编号取行</text><g data-node="untie"><rect x="940" y="112" width="428" height="150" rx="8" class="amber"/><text x="958" y="138" class="k">tie_word_embeddings: false</text><text x="958" y="164" class="t">Llama-3.1-8B：不共享</text><text x="958" y="192" class="s">词嵌入 128256 × 4096 = 5.25 亿</text><text x="958" y="215" class="s">输出层再存一份同样大小的矩阵</text><text x="958" y="238" class="s">两份合计 10.5 亿，占全模型 13.1%</text></g><g data-node="tie"><rect x="940" y="282" width="428" height="150" rx="8" class="green"/><text x="958" y="308" class="k">tie_word_embeddings: true</text><text x="958" y="334" class="t">Qwen2.5-0.5B：共享</text><text x="958" y="362" class="s">词嵌入 151936 × 896 = 1.36 亿</text><text x="958" y="385" class="s">输出层直接复用这张表，不另存</text><text x="958" y="408" class="s">只存一份，仍占全模型 27.6%</text></g><text x="32" y="530" class="k">词嵌入 + 输出层占全部参数的比例：模型越小，词表这块越显眼</text><text x="32" y="572" class="s">Llama-3.1-8B（两份）</text><rect x="300" y="548" width="393.0" height="32" rx="4" class="famber"/><text x="703" y="570" class="s">13.1%</text><text x="32" y="616" class="s">Llama-3.2-1B（共享）</text><rect x="300" y="592" width="639.0" height="32" rx="4" class="fgreen"/><text x="949" y="614" class="s">21.3%</text><text x="32" y="660" class="s">Qwen2.5-0.5B（共享）</text><rect x="300" y="636" width="828.0" height="32" rx="4" class="fgreen"/><text x="1138" y="658" class="s">27.6%</text><text x="1368" y="680" class="xs" text-anchor="end">比例按各自 config.json 计算</text>
</svg>
