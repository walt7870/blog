<rect width="1320" height="680" fill="#f8fafc"/>
<text x="32" y="46" class="h">三种结构的差别，主要在“谁能看见谁”</text>
<text x="32" y="78" class="s">方格表示注意力能否看见：行是当前位置，列是被看的位置，彩色为可见。</text>
<g data-node="enc"><rect x="32" y="104" width="400" height="552" rx="8" class="node"/><text x="50" y="130" class="k">双向</text><text x="50" y="156" class="t">编码器（encoder-only）</text><text x="50" y="184" class="s">BERT（2018）</text></g>
<rect x="130" y="220" width="19" height="19" rx="3" class="fblue"/><rect x="152" y="220" width="19" height="19" rx="3" class="fblue"/><rect x="174" y="220" width="19" height="19" rx="3" class="fblue"/><rect x="196" y="220" width="19" height="19" rx="3" class="fblue"/><rect x="218" y="220" width="19" height="19" rx="3" class="fblue"/><rect x="240" y="220" width="19" height="19" rx="3" class="fblue"/><rect x="130" y="242" width="19" height="19" rx="3" class="fblue"/><rect x="152" y="242" width="19" height="19" rx="3" class="fblue"/><rect x="174" y="242" width="19" height="19" rx="3" class="fblue"/><rect x="196" y="242" width="19" height="19" rx="3" class="fblue"/><rect x="218" y="242" width="19" height="19" rx="3" class="fblue"/><rect x="240" y="242" width="19" height="19" rx="3" class="fblue"/><rect x="130" y="264" width="19" height="19" rx="3" class="fblue"/><rect x="152" y="264" width="19" height="19" rx="3" class="fblue"/><rect x="174" y="264" width="19" height="19" rx="3" class="fblue"/><rect x="196" y="264" width="19" height="19" rx="3" class="fblue"/><rect x="218" y="264" width="19" height="19" rx="3" class="fblue"/><rect x="240" y="264" width="19" height="19" rx="3" class="fblue"/><rect x="130" y="286" width="19" height="19" rx="3" class="fblue"/><rect x="152" y="286" width="19" height="19" rx="3" class="fblue"/><rect x="174" y="286" width="19" height="19" rx="3" class="fblue"/><rect x="196" y="286" width="19" height="19" rx="3" class="fblue"/><rect x="218" y="286" width="19" height="19" rx="3" class="fblue"/><rect x="240" y="286" width="19" height="19" rx="3" class="fblue"/><rect x="130" y="308" width="19" height="19" rx="3" class="fblue"/><rect x="152" y="308" width="19" height="19" rx="3" class="fblue"/><rect x="174" y="308" width="19" height="19" rx="3" class="fblue"/><rect x="196" y="308" width="19" height="19" rx="3" class="fblue"/><rect x="218" y="308" width="19" height="19" rx="3" class="fblue"/><rect x="240" y="308" width="19" height="19" rx="3" class="fblue"/><rect x="130" y="330" width="19" height="19" rx="3" class="fblue"/><rect x="152" y="330" width="19" height="19" rx="3" class="fblue"/><rect x="174" y="330" width="19" height="19" rx="3" class="fblue"/><rect x="196" y="330" width="19" height="19" rx="3" class="fblue"/><rect x="218" y="330" width="19" height="19" rx="3" class="fblue"/><rect x="240" y="330" width="19" height="19" rx="3" class="fblue"/>
<text x="52" y="394" class="s">训练：遮住 15% 的词再填回</text>
<text x="52" y="420" class="s">输出：每个位置一个向量</text>
<text x="52" y="446" class="s">不能直接逐字生成</text>
<g data-node="enc-use"><rect x="52" y="480" width="360" height="156" rx="8" class="blue"/><text x="70" y="516" class="t">适合</text><text x="70" y="544" class="s">文本分类、命名实体识别</text><text x="70" y="567" class="s">检索向量、重排序</text><text x="70" y="590" class="s">输入整段已知、只需“读懂”</text></g>
