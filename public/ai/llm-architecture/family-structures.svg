<text x="480" y="330" class="xs">输入 4 个 token</text>
<text x="640" y="330" class="xs">输出看全部输入</text>
<text x="760" y="330" class="xs">输出只看左边</text>
<text x="480" y="394" class="s">训练：给输入，生成目标（T5 填空段）</text>
<text x="480" y="420" class="s">输入和输出是两条序列</text>
<text x="480" y="446" class="s">输入只编码一次，解码时反复查看</text>
