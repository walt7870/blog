308" width="19" height="19" rx="3" class="fgray"/><rect x="986" y="330" width="19" height="19" rx="3" class="fgreen"/><rect x="1008" y="330" width="19" height="19" rx="3" class="fgreen"/><rect x="1030" y="330" width="19" height="19" rx="3" class="fgreen"/><rect x="1052" y="330" width="19" height="19" rx="3" class="fgreen"/><rect x="1074" y="330" width="19" height="19" rx="3" class="fgreen"/><rect x="1096" y="330" width="19" height="19" rx="3" class="fgreen"/>
