<rect x="640" y="222" width="17" height="17" rx="3" class="fviolet"/><rect x="660" y="222" width="17" height="17" rx="3" class="fviolet"/><rect x="680" y="222" width="17" height="17" rx="3" class="fviolet"/><rect x="700" y="222" width="17" height="17" rx="3" class="fviolet"/><rect x="640" y="242" width="17" height="17" rx="3" class="fviolet"/><rect x="660" y="242" width="17" height="17" rx="3" class="fviolet"/><rect x="680" y="242" width="17" height="17" rx="3" class="fviolet"/><rect x="700" y="242" width="17" height="17" rx="3" class="fviolet"/><rect x="640" y="262" width="17" height="17" rx="3" class="fviolet"/><rect x="660" y="262" width="17" height="17" rx="3" class="fviolet"/><rect x="680" y="262" width="17" height="17" rx="3" class="fviolet"/><rect x="700" y="262" width="17" height="17" rx="3" class="fviolet"/><rect x="640" y="282" width="17" height="17" rx="3" class="fviolet"/><rect x="660" y="282" width="17" height="17" rx="3" class="fviolet"/><rect x="680" y="282" width="17" height="17" rx="3" class="fviolet"/><rect x="700" y="282" width="17" height="17" rx="3" class="fviolet"/>
