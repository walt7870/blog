<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="680" viewBox="0 0 1320 680" role="img" aria-labelledby="family-structures-title family-structures-desc" id="family-structures-root">
<title id="family-structures-title">编码器、编码器-解码器、解码器三种 Transformer 结构的注意力可见范围与适用任务</title>
<desc id="family-structures-desc">编码器（BERT）每个位置能看见整句前后所有位置，训练目标是填回被遮住的词，适合分类、检索向量。编码器-解码器（原始 Transformer、T5）先用双向注意力读完输入，解码器用因果注意力逐个生成，并通过交叉注意力查看输入，适合翻译、摘要。解码器（GPT、Llama）只有因果注意力，每个位置只看左边，训练目标是预测下一个 token，输入和输出在同一条序列里。</desc>
<defs><style>
#family-structures-root text { font-family: Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #172b3a; }
