<title id="attention-mask-matrix-title">注意力分数矩阵、因果掩码与 softmax 权重</title>
<desc id="attention-mask-matrix-desc">左：4×4 的分数矩阵 QKᵀ÷√2；中：因果掩码在对角线右上方加负无穷；右：按行 softmax 后的权重，年一行为 1，假一行为 0.5、0.5，怎么一行为 0.284、0.576、0.140，申请一行为 0.179、0.735、0.043、0.043，右上角全为 0。没有掩码时“假”会把 0.578 的权重放到未来的“怎么”上。</desc>
