<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="510" viewBox="0 0 1320 510" role="img" aria-labelledby="overview-autoregressive-title overview-autoregressive-desc" id="overview-autoregressive-root">
<title id="overview-autoregressive-title">自回归生成：每步把选出的 token 接到输入末尾</title>
<desc id="overview-autoregressive-desc">第 1 步把“年假怎么申请？”5 个 token 一起算，只用最后一个位置的输出选出“根据”；第 2 步把“根据”接到末尾，只为这个新位置计算，前面的 K、V 从缓存读取，选出“《”；第 3 步同理选出“员工”。</desc>
<defs><style>
#overview-autoregressive-root text { font-family: Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #172b3a; }
#overview-autoregressive-root .h { font-size: 26px; font-weight: 700; }
#overview-autoregressive-root .t { font-size: 19px; font-weight: 600; }
#overview-autoregressive-root .s { font-size: 15px; fill: #475569; }
#overview-autoregressive-root .xs { font-size: 13px; fill: #64748b; }
#overview-autoregressive-root .k { font-size: 13px; font-weight: 700; letter-spacing: .04em; fill: #64748b; }
#overview-autoregressive-root .m { font-family: 'SFMono-Regular', Menlo, Consolas, monospace; font-size: 14px; fill: #172b3a; }
#overview-autoregressive-root .node { fill: #fff; stroke: #cbd5e1; stroke-width: 2; }
#overview-autoregressive-root .blue { fill: #eff6ff; stroke: #60a5fa; stroke-width: 2; }
#overview-autoregressive-root .green { fill: #ecfdf5; stroke: #20a28c; stroke-width: 2; }
#overview-autoregressive-root .red { fill: #fff1f2; stroke: #e88191; stroke-width: 2; }
#overview-autoregressive-root .amber { fill: #fffbeb; stroke: #e0a63a; stroke-width: 2; }
#overview-autoregressive-root .violet { fill: #f5f3ff; stroke: #9b87f5; stroke-width: 2; }
#overview-autoregressive-root .gray { fill: #f1f5f9; stroke: #cbd5e1; stroke-width: 2; }
#overview-autoregressive-root .fblue { fill: #93c5fd; } #overview-autoregressive-root .fgreen { fill: #6ee7b7; } #overview-autoregressive-root .fred { fill: #fda4af; }
#overview-autoregressive-root .famber { fill: #fcd34d; } #overview-autoregressive-root .fviolet { fill: #c4b5fd; } #overview-autoregressive-root .fgray { fill: #e2e8f0; }
#overview-autoregressive-root .edge { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#overview-autoregressive-arrow); }
#overview-autoregressive-root .dash { fill: none; stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 7 6; marker-end: url(#overview-autoregressive-arrow); }
#overview-autoregressive-root .line { stroke: #cbd5e1; stroke-width: 1.5; fill: none; }
#overview-autoregressive-root .axis { stroke: #64748b; stroke-width: 2; fill: none; }
</style><marker id="overview-autoregressive-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker></defs>
<rect width="1320" height="510" fill="#f8fafc"/>
<text x="32" y="46" class="h">一次只出一个 token：生成就是不断接龙</text>
<text x="32" y="78" class="s">每一步模型只回答“下一个 token 是什么”，答案接到末尾，成为下一步的输入。</text>
<text x="32" y="160" class="t">第 1 步</text><rect x="130" y="130" width="52" height="46" rx="4" class="fblue"/><text x="156" y="158" text-anchor="middle" class="s">年</text><rect x="190" y="130" width="52" height="46" rx="4" class="fblue"/><text x="216" y="158" text-anchor="middle" class="s">假</text><rect x="250" y="130" width="72" height="46" rx="4" class="fblue"/><text x="286" y="158" text-anchor="middle" class="s">怎么</text><rect x="330" y="130" width="72" height="46" rx="4" class="fblue"/><text x="366" y="158" text-anchor="middle" class="s">申请</text><rect x="410" y="130" width="52" height="46" rx="4" class="fblue"/><text x="436" y="158" text-anchor="middle" class="s">？</text><path d="M476 153H536" class="edge"/><g data-node="o0"><rect x="542" y="126" width="120" height="54" rx="8" class="green"/><text x="560" y="162" class="t">根据</text></g><text x="684" y="158" class="s">5 个位置一起算（Prefill），只用最后一行 logits</text><text x="32" y="264" class="t">第 2 步</text><rect x="130" y="234" width="52" height="46" rx="4" class="fgray"/><text x="156" y="262" text-anchor="middle" class="s">年</text><rect x="190" y="234" width="52" height="46" rx="4" class="fgray"/><text x="216" y="262" text-anchor="middle" class="s">假</text><rect x="250" y="234" width="72" height="46" rx="4" class="fgray"/><text x="286" y="262" text-anchor="middle" class="s">怎么</text><rect x="330" y="234" width="72" height="46" rx="4" class="fgray"/><text x="366" y="262" text-anchor="middle" class="s">申请</text><rect x="410" y="234" width="52" height="46" rx="4" class="fgray"/><text x="436" y="262" text-anchor="middle" class="s">？</text><rect x="470" y="234" width="72" height="46" rx="4" class="fblue"/><text x="506" y="262" text-anchor="middle" class="s">根据</text><path d="M556 257H616" class="edge"/><g data-node="o1"><rect x="622" y="230" width="120" height="54" rx="8" class="green"/><text x="640" y="266" class="t">《</text></g><text x="764" y="262" class="s">只算新来的 1 个位置，前 5 个读 KV Cache</text><text x="32" y="368" class="t">第 3 步</text><rect x="130" y="338" width="52" height="46" rx="4" class="fgray"/><text x="156" y="366" text-anchor="middle" class="s">年</text><rect x="190" y="338" width="52" height="46" rx="4" class="fgray"/><text x="216" y="366" text-anchor="middle" class="s">假</text><rect x="250" y="338" width="72" height="46" rx="4" class="fgray"/><text x="286" y="366" text-anchor="middle" class="s">怎么</text><rect x="330" y="338" width="72" height="46" rx="4" class="fgray"/><text x="366" y="366" text-anchor="middle" class="s">申请</text><rect x="410" y="338" width="52" height="46" rx="4" class="fgray"/><text x="436" y="366" text-anchor="middle" class="s">？</text><rect x="470" y="338" width="72" height="46" rx="4" class="fgray"/><text x="506" y="366" text-anchor="middle" class="s">根据</text><rect x="550" y="338" width="52" height="46" rx="4" class="fblue"/><text x="576" y="366" text-anchor="middle" class="s">《</text><path d="M616 361H676" class="edge"/><g data-node="o2"><rect x="682" y="334" width="120" height="54" rx="8" class="green"/><text x="700" y="370" class="t">员工</text></g><text x="824" y="366" class="s">只算 1 个位置，读前 6 个的 K、V</text><rect x="130" y="450" width="40" height="26" rx="4" class="fblue"/><text x="180" y="469" class="s">本步新算的位置</text><rect x="360" y="450" width="40" height="26" rx="4" class="fgray"/><text x="410" y="469" class="s">已缓存，只被读取</text><text x="640" y="469" class="xs">续写内容为示意，真实输出取决于模型和解码设置</text>
</svg>
