<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="540" viewBox="0 0 1240 540" role="img" aria-labelledby="output-temperature-title output-temperature-desc" id="output-temperature-root">
<title id="output-temperature-title">同一组 logits 在三种温度下的概率</title>
<desc id="output-temperature-desc">6 个候选 token 的分数为 根据 5.0、您 4.0、申请 3.0、首先 2.5、请 1.5、好 0.0。温度 0.5 时“根据”的概率 0.861，温度 1 时 0.616，温度 1.5 时 0.477；温度越高，排在后面的候选分到的概率越多，但排序不变。</desc>
<defs><style>
#output-temperature-root text { font-family: Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #172b3a; }
#output-temperature-root .h { font-size: 26px; font-weight: 700; }
#output-temperature-root .t { font-size: 19px; font-weight: 600; }
#output-temperature-root .s { font-size: 15px; fill: #475569; }
#output-temperature-root .xs { font-size: 13px; fill: #64748b; }
#output-temperature-root .k { font-size: 13px; font-weight: 700; letter-spacing: .04em; fill: #64748b; }
#output-temperature-root .m { font-family: 'SFMono-Regular', Menlo, Consolas, monospace; font-size: 14px; fill: #172b3a; }
#output-temperature-root .node { fill: #fff; stroke: #cbd5e1; stroke-width: 2; }
#output-temperature-root .blue { fill: #eff6ff; stroke: #60a5fa; stroke-width: 2; }
#output-temperature-root .green { fill: #ecfdf5; stroke: #20a28c; stroke-width: 2; }
#output-temperature-root .red { fill: #fff1f2; stroke: #e88191; stroke-width: 2; }
#output-temperature-root .amber { fill: #fffbeb; stroke: #e0a63a; stroke-width: 2; }
#output-temperature-root .violet { fill: #f5f3ff; stroke: #9b87f5; stroke-width: 2; }
#output-temperature-root .gray { fill: #f1f5f9; stroke: #cbd5e1; stroke-width: 2; }
#output-temperature-root .fblue { fill: #93c5fd; } #output-temperature-root .fgreen { fill: #6ee7b7; } #output-temperature-root .fred { fill: #fda4af; }
#output-temperature-root .famber { fill: #fcd34d; } #output-temperature-root .fviolet { fill: #c4b5fd; } #output-temperature-root .fgray { fill: #e2e8f0; }
#output-temperature-root .edge { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#output-temperature-arrow); }
#output-temperature-root .dash { fill: none; stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 7 6; marker-end: url(#output-temperature-arrow); }
#output-temperature-root .line { stroke: #cbd5e1; stroke-width: 1.5; fill: none; }
#output-temperature-root .axis { stroke: #64748b; stroke-width: 2; fill: none; }
</style><marker id="output-temperature-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker></defs>
<rect width="1240" height="540" fill="#f8fafc"/>
<text x="32" y="46" class="h">温度只改差距，不改排序</text>
<text x="32" y="78" class="s">教学用的 6 个候选（假设词表只有这 6 个）；括号里是 logit。柱上数字是 softmax(logit ÷ T) 后的概率。</text>
