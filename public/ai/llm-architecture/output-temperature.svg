t="42.7" class="famber"/><text x="612" y="429.2925913134028" class="xs" text-anchor="middle">.126</text><text x="566" y="506" class="s" text-anchor="middle">申请（3.0）</text><rect x="680" y="478.0" width="40" height="2.0" class="fblue"/><text x="700" y="470.0273736838259" class="xs" text-anchor="middle">.006</text><rect x="726" y="462.8" width="40" height="17.2" class="fgreen"/><text x="746" y="454.7960199277447" class="xs" text-anchor="middle">.051</text><rect x="772" y="449.4" width="40" height="30.6" class="famber"/><text x="792" y="441.3988044825821" class="xs" text-anchor="middle">.090</text><text x="746" y="506" class="s" text-anchor="middle">首先（2.5）</text><rect x="860" y="479.7" width="40" height="1.0" class="fblue"/><text x="880" y="471.73303405878056" class="xs" text-anchor="middle">.001</text><rect x="906" y="473.7" width="40" height="6.3" class="fgreen"/><text x="926" y="465.6710094250941" class="xs" text-anchor="middle">.019</text><rect x="952" y="464.3" width="40" height="15.7" class="famber"/><text x="972" y="456.2888223584942" class="xs" text-anchor="middle">.046</text><text x="926" y="506" class="s" text-anchor="middle">请（1.5）</text><rect x="1040" y="480.0" width="40" height="1.0" class="fblue"/><text x="1060" y="471.9867085484326" class="xs" text-anchor="middle">0</text><rect x="1086" y="478.6" width="40" height="1.4" class="fgreen"/><text x="1106" y="470.58781131944335" class="xs" text-anchor="middle">.004</text><rect x="1132" y="474.2" width="40" height="5.8" class="famber"/><text x="1152" y="466.2201807490976" class="xs" text-anchor="middle">.017</text><text x="1106" y="506" class="s" text-anchor="middle">好（0.0）</text><rect x="860" y="128" width="20" height="20" rx="4" class="fblue"/><text x="888" y="144" class="s">T = 0.5</text><rect x="980" y="128" width="20" height="20" rx="4" class="fgreen"/><text x="1008" y="144" class="s">T = 1</text><rect x="1100" y="128" width="20" height="20" rx="4" class="famber"/><text x="1128" y="144" class="s">T = 1.5</text>
</svg>
