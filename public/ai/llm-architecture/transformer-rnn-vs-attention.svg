<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="520" viewBox="0 0 1360 520" role="img" aria-labelledby="transformer-rnn-vs-attention-title transformer-rnn-vs-attention-desc" id="transformer-rnn-vs-attention-root">
<title id="transformer-rnn-vs-attention-title">RNN 与自注意力的信息传递方式</title>
<desc id="transformer-rnn-vs-attention-desc">左边 RNN 按顺序逐个读入“年 假 怎么 申请 ？”，第一个词的信息要经过 4 次传递才到最后一个位置，且各步不能并行；右边自注意力让每对位置直接相连，路径长度为 1，所有位置可以并行计算，但关系数随长度平方增长。</desc>
<defs><style>
#transformer-rnn-vs-attention-root text { font-family: Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #172b3a; }
#transformer-rnn-vs-attention-root .h { font-size: 26px; font-weight: 700; }
#transformer-rnn-vs-attention-root .t { font-size: 19px; font-weight: 600; }
#transformer-rnn-vs-attention-root .s { font-size: 15px; fill: #475569; }
#transformer-rnn-vs-attention-root .xs { font-size: 13px; fill: #64748b; }
#transformer-rnn-vs-attention-root .k { font-size: 13px; font-weight: 700; letter-spacing: .04em; fill: #64748b; }
#transformer-rnn-vs-attention-root .m { font-family: 'SFMono-Regular', Menlo, Consolas, monospace; font-size: 14px; fill: #172b3a; }
#transformer-rnn-vs-attention-root .node { fill: #fff; stroke: #cbd5e1; stroke-width: 2; }
#transformer-rnn-vs-attention-root .blue { fill: #eff6ff; stroke: #60a5fa; stroke-width: 2; }
#transformer-rnn-vs-attention-root .green { fill: #ecfdf5; stroke: #20a28c; stroke-width: 2; }
#transformer-rnn-vs-attention-root .red { fill: #fff1f2; stroke: #e88191; stroke-width: 2; }
#transformer-rnn-vs-attention-root .amber { fill: #fffbeb; stroke: #e0a63a; stroke-width: 2; }
#transformer-rnn-vs-attention-root .violet { fill: #f5f3ff; stroke: #9b87f5; stroke-width: 2; }
#transformer-rnn-vs-attention-root .gray { fill: #f1f5f9; stroke: #cbd5e1; stroke-width: 2; }
#transformer-rnn-vs-attention-root .fblue { fill: #93c5fd; } #transformer-rnn-vs-attention-root .fgreen { fill: #6ee7b7; } #transformer-rnn-vs-attention-root .fred { fill: #fda4af; }
#transformer-rnn-vs-attention-root .famber { fill: #fcd34d; } #transformer-rnn-vs-attention-root .fviolet { fill: #c4b5fd; } #transformer-rnn-vs-attention-root .fgray { fill: #e2e8f0; }
#transformer-rnn-vs-attention-root .edge { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#transformer-rnn-vs-attention-arrow); }
#transformer-rnn-vs-attention-root .dash { fill: none; stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 7 6; marker-end: url(#transformer-rnn-vs-attention-arrow); }
#transformer-rnn-vs-attention-root .line { stroke: #cbd5e1; stroke-width: 1.5; fill: none; }
#transformer-rnn-vs-attention-root .axis { stroke: #64748b; stroke-width: 2; fill: none; }
</style><marker id="transformer-rnn-vs-attention-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker></defs>
<rect width="1360" height="520" fill="#f8fafc"/>
<text x="32" y="46" class="h">为什么是注意力：路径更短，可以并行</text>
<text x="32" y="78" class="s">同一句话，两种处理方式</text>
<text x="60" y="130" class="t">RNN：一个接一个地读</text><g data-node="r0"><rect x="70" y="170" width="90" height="56" rx="8" class="gray"/><text x="88" y="206" class="t">年</text></g><g data-node="h0"><rect x="70" y="290" width="90" height="56" rx="8" class="blue"/><text x="88" y="326" class="t">h1</text></g><path d="M115 228V286" class="edge"/><path d="M162 318H188" class="edge"/><g data-node="r1"><rect x="190" y="170" width="90" height="56" rx="8" class="gray"/><text x="208" y="206" class="t">假</text></g><g data-node="h1"><rect x="190" y="290" width="90" height="56" rx="8" class="blue"/><text x="208" y="326" class="t">h2</text></g><path d="M235 228V286" class="edge"/><path d="M282 318H308" class="edge"/><g data-node="r2"><rect x="310" y="170" width="90" height="56" rx="8" class="gray"/><text x="328" y="206" class="t">怎么</text></g><g data-node="h2"><rect x="310" y="290" width="90" height="56" rx="8" class="blue"/><text x="328" y="326" class="t">h3</text></g><path d="M355 228V286" class="edge"/><path d="M402 318H428" class="edge"/><g data-node="r3"><rect x="430" y="170" width="90" height="56" rx="8" class="gray"/><text x="448" y="206" class="t">申请</text></g><g data-node="h3"><rect x="430" y="290" width="90" height="56" rx="8" class="blue"/><text x="448" y="326" class="t">h4</text></g><path d="M475 228V286" class="edge"/><path d="M522 318H548" class="edge"/><g data-node="r4"><rect x="550" y="170" width="90" height="56" rx="8" class="gray"/><text x="568" y="206" class="t">？</text></g><g data-node="h4"><rect x="550" y="290" width="90" height="56" rx="8" class="blue"/><text x="568" y="326" class="t">h5</text></g><path d="M595 228V286" class="edge"/><text x="60" y="390" class="s">“年”的信息要经过 4 次传递才到“？”</text><text x="60" y="414" class="s">第 5 步必须等第 4 步算完，训练时无法按位置并行</text><text x="60" y="438" class="s">长句里早期的信息被反复压缩进固定大小的状态，容易被冲淡</text><text x="760" y="130" class="t">自注意力：每对位置直接相连</text><path d="M840 368L950 268" stroke="#93c5fd" stroke-width="2" fill="none"/><path d="M840 368L1060 368" stroke="#93c5fd" stroke-width="2" fill="none"/><path d="M840 368L1170 268" stroke="#93c5fd" stroke-width="2" fill="none"/><path d="M840 368L1280 368" stroke="#93c5fd" stroke-width="2" fill="none"/><path d="M950 268L1060 368" stroke="#93c5fd" stroke-width="2" fill="none"/><path d="M950 268L1170 268" stroke="#93c5fd" stroke-width="2" fill="none"/><path d="M950 268L1280 368" stroke="#93c5fd" stroke-width="2" fill="none"/><path d="M1060 368L1170 268" stroke="#93c5fd" stroke-width="2" fill="none"/><path d="M1060 368L1280 368" stroke="#93c5fd" stroke-width="2" fill="none"/><path d="M1170 268L1280 368" stroke="#93c5fd" stroke-width="2" fill="none"/><g data-node="a0"><rect x="800" y="340" width="80" height="56" rx="8" class="blue"/><text x="818" y="376" class="t">年</text></g><g data-node="a1"><rect x="910" y="240" width="80" height="56" rx="8" class="blue"/><text x="928" y="276" class="t">假</text></g><g data-node="a2"><rect x="1020" y="340" width="80" height="56" rx="8" class="blue"/><text x="1038" y="376" class="t">怎么</text></g><g data-node="a3"><rect x="1130" y="240" width="80" height="56" rx="8" class="blue"/><text x="1148" y="276" class="t">申请</text></g><g data-node="a4"><rect x="1240" y="340" width="80" height="56" rx="8" class="blue"/><text x="1258" y="376" class="t">？</text></g><text x="760" y="414" class="s">任意两个词之间只隔一步，所有位置可以一次矩阵乘法同时算</text><text x="760" y="438" class="s">代价：n 个 token 要算 n² 对关系，5 个是 25 对，10 万个是 100 亿对</text>
</svg>
