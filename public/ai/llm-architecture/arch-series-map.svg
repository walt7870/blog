<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="470" viewBox="0 0 1360 470" role="img" aria-labelledby="arch-series-map-title arch-series-map-desc" id="arch-series-map-root">
<title id="arch-series-map-title">大模型架构系列的四个部分</title>
<desc id="arch-series-map-desc">第一部分沿着一个 token 走完分词、嵌入、注意力、FFN、残差归一化、位置编码和输出层；第二部分讲编码器与解码器结构、MoE、高效注意力和线性混合架构；第三部分拆解 Llama、Qwen、DeepSeek 和其他开源模型；第四部分讲多模态结构、读懂配置与源码，以及整体对比。</desc>
<defs><style>
#arch-series-map-root text { font-family: Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #172b3a; }
#arch-series-map-root .h { font-size: 26px; font-weight: 700; }
#arch-series-map-root .t { font-size: 19px; font-weight: 600; }
#arch-series-map-root .s { font-size: 15px; fill: #475569; }
#arch-series-map-root .xs { font-size: 13px; fill: #64748b; }
#arch-series-map-root .k { font-size: 13px; font-weight: 700; letter-spacing: .04em; fill: #64748b; }
#arch-series-map-root .m { font-family: 'SFMono-Regular', Menlo, Consolas, monospace; font-size: 14px; fill: #172b3a; }
#arch-series-map-root .node { fill: #fff; stroke: #cbd5e1; stroke-width: 2; }
#arch-series-map-root .blue { fill: #eff6ff; stroke: #60a5fa; stroke-width: 2; }
#arch-series-map-root .green { fill: #ecfdf5; stroke: #20a28c; stroke-width: 2; }
#arch-series-map-root .red { fill: #fff1f2; stroke: #e88191; stroke-width: 2; }
#arch-series-map-root .amber { fill: #fffbeb; stroke: #e0a63a; stroke-width: 2; }
#arch-series-map-root .violet { fill: #f5f3ff; stroke: #9b87f5; stroke-width: 2; }
#arch-series-map-root .gray { fill: #f1f5f9; stroke: #cbd5e1; stroke-width: 2; }
#arch-series-map-root .fblue { fill: #93c5fd; } #arch-series-map-root .fgreen { fill: #6ee7b7; } #arch-series-map-root .fred { fill: #fda4af; }
#arch-series-map-root .famber { fill: #fcd34d; } #arch-series-map-root .fviolet { fill: #c4b5fd; } #arch-series-map-root .fgray { fill: #e2e8f0; }
#arch-series-map-root .edge { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#arch-series-map-arrow); }
#arch-series-map-root .dash { fill: none; stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 7 6; marker-end: url(#arch-series-map-arrow); }
#arch-series-map-root .line { stroke: #cbd5e1; stroke-width: 1.5; fill: none; }
#arch-series-map-root .axis { stroke: #64748b; stroke-width: 2; fill: none; }
</style><marker id="arch-series-map-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker></defs>
<rect width="1360" height="470" fill="#f8fafc"/>
<text x="32" y="46" class="h">大模型架构：四个部分</text>
<text x="32" y="78" class="s">从一个 token 的计算过程出发，到架构演进、具体模型和读模型的方法</text>
<g data-node="p1"><rect x="32" y="112" width="306" height="276" rx="8" class="blue"/><text x="50" y="138" class="k">01—08 + 实践</text><text x="50" y="164" class="t">一、一个 token 的旅程</text><text x="50" y="192" class="s">全景与参数分解</text><text x="50" y="215" class="s">分词与词嵌入</text><text x="50" y="238" class="s">注意力：Q、K、V</text><text x="50" y="261" class="s">多头与 KV 头：GQA、MLA</text><text x="50" y="284" class="s">FFN：参数的大头</text><text x="50" y="307" class="s">残差连接与归一化</text><text x="50" y="330" class="s">位置编码：RoPE</text><text x="50" y="353" class="s">输出层与解码</text><text x="50" y="376" class="s">实践：逐层拆开小模型</text></g><path d="M340 250H352" class="edge"/><g data-node="p2"><rect x="354" y="112" width="306" height="276" rx="8" class="green"/><text x="372" y="138" class="k">09—12</text><text x="372" y="164" class="t">二、架构演进</text><text x="372" y="192" class="s">编码器、解码器与 GPT</text><text x="372" y="215" class="s">混合专家 MoE</text><text x="372" y="238" class="s">长上下文与高效注意力</text><text x="372" y="261" class="s">线性注意力与混合架构</text></g><path d="M662 250H674" class="edge"/><g data-node="p3"><rect x="676" y="112" width="306" height="276" rx="8" class="amber"/><text x="694" y="138" class="k">13—16</text><text x="694" y="164" class="t">三、主流模型拆解</text><text x="694" y="192" class="s">Llama 家族</text><text x="694" y="215" class="s">Qwen 家族</text><text x="694" y="238" class="s">DeepSeek：MLA、MoE、MTP</text><text x="694" y="261" class="s">Mistral、Gemma、GLM、</text><text x="694" y="284" class="s">Kimi、gpt-oss、MiniMax</text></g><path d="M984 250H996" class="edge"/><g data-node="p4"><rect x="998" y="112" width="306" height="276" rx="8" class="violet"/><text x="1016" y="138" class="k">17—19</text><text x="1016" y="164" class="t">四、多模态与读懂模型</text><text x="1016" y="192" class="s">图像和语音怎样变成 token</text><text x="1016" y="215" class="s">读懂 config.json 与源码</text><text x="1016" y="238" class="s">手算参数、FLOPs、KV Cache</text><text x="1016" y="261" class="s">主流架构对比与趋势</text></g><text x="32" y="436" class="s">第一部分是基础，按顺序读；第二部分讲每种改动解决什么问题；第三部分用前两部分的知识读懂具体模型；第四部分把方法变成工具。</text>
</svg>
