#arch-series-map-root .axis { stroke: #64748b; stroke-width: 2; fill: none; }
</style><marker id="arch-series-map-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker></defs>
<rect width="1400" height="500" fill="#f8fafc"/>
<text x="32" y="46" class="h">大模型架构：五个部分</text>
<text x="32" y="78" class="s">从 Transformer 的整体结构出发，到每个部件、架构演进、具体模型和读模型的方法</text>
<g data-node="p1"><rect x="28" y="112" width="260" height="300" rx="8" class="gray"/><text x="46" y="138" class="k">一 · 01—03</text><text x="46" y="164" class="t">从 Transformer 到大模型</text><text x="46" y="192" class="s">原始 Transformer</text><text x="46" y="215" class="s">三种结构与 decoder-only</text><text x="46" y="238" class="s">今天大模型的全景</text></g><path d="M290 262H300" class="edge"/><g data-node="p2"><rect x="302" y="112" width="260" height="300" rx="8" class="blue"/><text x="320" y="138" class="k">二 · 04—10 + 实践</text><text x="320" y="164" class="t">逐层拆解</text><text x="320" y="192" class="s">分词与词嵌入</text><text x="320" y="215" class="s">注意力：Q、K、V</text><text x="320" y="238" class="s">多头与 KV 头</text><text x="320" y="261" class="s">FFN</text><text x="320" y="284" class="s">残差与归一化</text><text x="320" y="307" class="s">位置编码：RoPE</text><text x="320" y="330" class="s">输出层与解码</text><text x="320" y="353" class="s">实践：拆开小模型</text></g><path d="M564 262H574" class="edge"/><g data-node="p3"><rect x="576" y="112" width="260" height="300" rx="8" class="green"/><text x="594" y="138" class="k">三 · 11—14</text><text x="594" y="164" class="t">架构演进</text><text x="594" y="192" class="s">混合专家 MoE</text><text x="594" y="215" class="s">长上下文与高效注意力</text><text x="594" y="238" class="s">线性注意力与混合架构</text><text x="594" y="261" class="s">多模态的结构</text></g><path d="M838 262H848" class="edge"/><g data-node="p4"><rect x="850" y="112" width="260" height="300" rx="8" class="amber"/><text x="868" y="138" class="k">四 · 15—18</text><text x="868" y="164" class="t">主流模型拆解</text><text x="868" y="192" class="s">Llama 家族</text><text x="868" y="215" class="s">Qwen 家族</text><text x="868" y="238" class="s">DeepSeek</text><text x="868" y="261" class="s">Mistral、Gemma、GLM、</text><text x="868" y="284" class="s">Kimi、gpt-oss、MiniMax</text></g><path d="M1112 262H1122" class="edge"/><g data-node="p5"><rect x="1124" y="112" width="260" height="300" rx="8" class="violet"/><text x="1142" y="138" class="k">五 · 19—20</text><text x="1142" y="164" class="t">读懂与对比</text><text x="1142" y="192" class="s">读懂 config 与源码</text><text x="1142" y="215" class="s">手算参数、FLOPs、KV</text><text x="1142" y="238" class="s">主流架构对比与趋势</text></g><text x="28" y="462" class="s">先整体、再部件、再变化、再实例、最后方法：前两部分按顺序读，后三部分可按需要挑读。</text>
</svg>
