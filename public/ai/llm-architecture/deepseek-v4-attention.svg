h="13" height="40" rx="2" class="fgray"/><rect x="495" y="150" width="13" height="40" rx="2" class="fgray"/><rect x="510" y="150" width="13" height="40" rx="2" class="fgray"/><rect x="525" y="150" width="13" height="40" rx="2" class="fgray"/><rect x="540" y="150" width="13" height="40" rx="2" class="fgray"/><rect x="555" y="150" width="13" height="40" rx="2" class="fgray"/><rect x="570" y="150" width="13" height="40" rx="2" class="fgray"/><rect x="585" y="150" width="13" height="40" rx="2" class="fgray"/><rect x="600" y="150" width="13" height="40" rx="2" class="fgray"/><rect x="615" y="150" width="13" height="40" rx="2" class="fgray"/><rect x="630" y="150" width="13" height="40" rx="2" class="fgray"/><rect x="645" y="150" width="13" height="40" rx="2" class="fgray"/><rect x="660" y="150" width="13" height="40" rx="2" class="fgreen"/><rect x="675" y="150" width="13" height="40" rx="2" class="fgreen"/><rect x="690" y="150" width="13" height="40" rx="2" class="fgray"/><rect x="705" y="150" width="13" height="40" rx="2" class="fgray"/><rect x="720" y="150" width="13" height="40" rx="2" class="fgray"/><rect x="735" y="150" width="13" height="40" rx="2" class="fgray"/><rect x="750" y="150" width="13" height="40" rx="2" class="fgray"/><rect x="765" y="150" width="13" height="40" rx="2" class="fgray"/><rect x="780" y="150" width="13" height="40" rx="2" class="fgray"/><rect x="795" y="150" width="13" height="40" rx="2" class="fgray"/><rect x="810" y="150" width="13" height="40" rx="2" class="fgray"/><rect x="825" y="150" width="13" height="40" rx="2" class="fgray"/><rect x="840" y="150" width="13" height="40" rx="2" class="fgreen"/><rect x="855" y="150" width="13" height="40" rx="2" class="fgray"/><rect x="870" y="150" width="13" height="40" rx="2" class="fgray"/><rect x="885" y="150" width="13" height="40" rx="2" class="fgray"/><rect x="900" y="150" width="13" height="40" rx="2" class="fgray"/><rect x="915" y="150" width="13" height="40" rx="2" class="fgray"/><rect x="930" y="150" width="13" height="40" rx="2" class="fgray"/><rect x="945" y="150" width="13" height="40" rx="2" class="fgray"/><rect x="960" y="150" width="13" height="40" rx="2" class="fgray"/><rect x="975" y="150" width="13" height="40" rx="2" class="fgray"/><rect x="990" y="150" width="13" height="40" rx="2" class="fgray"/><rect x="1005" y="150" width="13" height="40" rx="2" class="fgray"/><rect x="1030" y="150" width="190" height="40" rx="4" class="fblue"/><text x="1040" y="176" class="s">最近 128 个原样</text><text x="60" y="214" class="xs">压缩条目（每格代表 4 个 token；窗口宽 8、步长 4，相邻窗口有重叠）</text><text x="60" y="314" class="s">HCA 层：每 128 个 token 压成 1 个条目，全部条目都参与注意力</text><rect x="60" y="330" width="56" height="40" rx="2" class="fviolet"/><rect x="120" y="330" width="56" height="40" rx="2" class="fviolet"/><rect x="180" y="330" width="56" height="40" rx="2" class="fviolet"/><rect x="240" y="330" width="56" height="40" rx="2" class="fviolet"/><rect x="300" y="330" width="56" height="40" rx="2" class="fviolet"/><rect x="360" y="330" width="56" height="40" rx="2" class="fviolet"/><rect x="420" y="330" width="56" height="40" rx="2" class="fviolet"/><rect x="480" y="330" width="56" height="40" rx="2" class="fviolet"/><rect x="540" y="330" width="56" height="40" rx="2" class="fviolet"/><rect x="600" y="330" width="56" height="40" rx="2" class="fviolet"/><rect x="660" y="330" width="56" height="40" rx="2" class="fviolet"/><rect x="720" y="330" width="56" height="40" rx="2" class="fviolet"/><rect x="780" y="330" width="56" height="40" rx="2" class="fviolet"/><rect x="840" y="330" width="56" height="40" rx="2" class="fviolet"/><rect x="900" y="330" width="56" height="40" rx="2" class="fviolet"/><rect x="960" y="330" width="56" height="40" rx="2" class="fviolet"/><rect x="1030" y="330" width="190" height="40" rx="4" class="fblue"/><text x="1040" y="356" class="s">最近 128 个原样</text><text x="60" y="394" class="xs">压缩条目（每格代表 128 个 token；窗口不重叠，不做挑选）</text><g data-node="v4-kv"><rect x="60" y="440" width="370" height="120" rx="8" class="node"/><text x="78" y="466" class="k">缓存单位</text><text x="78" y="492" class="t">每个条目 512 个数</text><text x="78" y="520" class="s">K 和 V 是同一个向量</text><text x="78" y="543" class="s">所有查询头共用（MQA）</text></g><g data-node="v4-grow"><rect x="455" y="440" width="370" height="120" rx="8" class="green"/><text x="473" y="466" class="k">随长度增长的部分</text><text x="473" y="492" class="t">每层每 token 新增缓存</text><text x="473" y="520" class="s">CSA：512 ÷ 4 = 128 个数</text><text x="473" y="543" class="s">HCA：512 ÷ 128 = 4 个数</text></g><g data-node="v4-ref"><rect x="850" y="440" width="370" height="120" rx="8" class="amber"/><text x="868" y="466" class="k">对照</text><text x="868" y="492" class="t">对照 V3.2 的 MLA</text><text x="868" y="520" class="s">每层每 token 576 个数</text><text x="868" y="543" class="s">全部保存</text></g>
</svg>
