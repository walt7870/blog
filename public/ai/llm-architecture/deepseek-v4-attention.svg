<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="590" viewBox="0 0 1280 590" role="img" aria-labelledby="deepseek-v4-attention-title deepseek-v4-attention-desc" id="deepseek-v4-attention-root">
<title id="deepseek-v4-attention-title">DeepSeek-V4 的两种压缩注意力层</title>
<desc id="deepseek-v4-attention-desc">DeepSeek-V4 每层都保留最近 128 个 token 的原样 KV。CSA 层把更早的内容每 4 个 token 压成一个 512 维条目，再由闪电索引器挑出 top-k 个参与注意力；HCA 层每 128 个 token 压成一个条目，全部参与注意力。CSA 每层每 token 新增 128 个数，HCA 新增 4 个数，对照 V3.2 MLA 的 576 个数。</desc>
<defs><style>
#deepseek-v4-attention-root text { font-family: Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #172b3a; }
#deepseek-v4-attention-root .h { font-size: 26px; font-weight: 700; }
#deepseek-v4-attention-root .t { font-size: 19px; font-weight: 600; }
#deepseek-v4-attention-root .s { font-size: 15px; fill: #475569; }
#deepseek-v4-attention-root .xs { font-size: 13px; fill: #64748b; }
#deepseek-v4-attention-root .k { font-size: 13px; font-weight: 700; letter-spacing: .04em; fill: #64748b; }
#deepseek-v4-attention-root .m { font-family: 'SFMono-Regular', Menlo, Consolas, monospace; font-size: 14px; fill: #172b3a; }
#deepseek-v4-attention-root .node { fill: #fff; stroke: #cbd5e1; stroke-width: 2; }
#deepseek-v4-attention-root .blue { fill: #eff6ff; stroke: #60a5fa; stroke-width: 2; }
#deepseek-v4-attention-root .green { fill: #ecfdf5; stroke: #20a28c; stroke-width: 2; }
#deepseek-v4-attention-root .red { fill: #fff1f2; stroke: #e88191; stroke-width: 2; }
#deepseek-v4-attention-root .amber { fill: #fffbeb; stroke: #e0a63a; stroke-width: 2; }
#deepseek-v4-attention-root .violet { fill: #f5f3ff; stroke: #9b87f5; stroke-width: 2; }
#deepseek-v4-attention-root .gray { fill: #f1f5f9; stroke: #cbd5e1; stroke-width: 2; }
#deepseek-v4-attention-root .fblue { fill: #93c5fd; } #deepseek-v4-attention-root .fgreen { fill: #6ee7b7; } #deepseek-v4-attention-root .fred { fill: #fda4af; }
#deepseek-v4-attention-root .famber { fill: #fcd34d; } #deepseek-v4-attention-root .fviolet { fill: #c4b5fd; } #deepseek-v4-attention-root .fgray { fill: #e2e8f0; }
#deepseek-v4-attention-root .edge { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#deepseek-v4-attention-arrow); }
#deepseek-v4-attention-root .dash { fill: none; stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 7 6; marker-end: url(#deepseek-v4-attention-arrow); }
#deepseek-v4-attention-root .line { stroke: #cbd5e1; stroke-width: 1.5; fill: none; }
#deepseek-v4-attention-root .axis { stroke: #64748b; stroke-width: 2; fill: none; }
</style><marker id="deepseek-v4-attention-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker></defs>
<rect width="1280" height="590" fill="#f8fafc"/>
<text x="32" y="46" class="h">V4：近处看原文，远处看压缩摘要</text>
<text x="32" y="78" class="s">两种层在网络里交替出现。格子数量为示意，不按真实长度比例。</text>
