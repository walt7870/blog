<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="600" viewBox="0 0 1400 600" role="img" aria-labelledby="multimodal-mrope-title multimodal-mrope-desc" id="multimodal-mrope-root">
<title id="multimodal-mrope-title">M-RoPE 为文字和图像 token 分配三维位置</title>
<desc id="multimodal-mrope-desc">序列为“看、图、视觉开始、6 个图像 token、视觉结束、金额”。文字 token 的 t、h、w 三个位置相同、逐个加 1；6 个图像 token 来自合并后 2 行 3 列的网格，t 都是 3，h 按行取 3、4，w 按列取 3、4、5；图后的文字从 6 继续。下方显示每个头 64 对旋转频率分给 t、h、w 的方式：Qwen2.5-VL 按 16、24、24 分段，Qwen3-VL 交错分配。</desc>
