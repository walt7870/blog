<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="584" viewBox="0 0 1300 584" role="img" aria-labelledby="open-gemma4-layers-title open-gemma4-layers-desc" id="open-gemma4-layers-root">
<title id="open-gemma4-layers-title">Gemma 4 31B 的局部层与全局层</title>
<desc id="open-gemma4-layers-desc">Gemma 4 31B 共 60 层，每 6 层中 5 层是局部层：16 个 KV 头、头维度 256、只看最近 1024 个 token；第 6 层是全局层：只有 4 个 KV 头但头维度 512，V 复用 K 的投影，用只旋转 25% 维度的 p-RoPE。两种层都有 QK-Norm、V-Norm、夹心归一化，最终 logits 软截断 30。</desc>
<defs><style>
#open-gemma4-layers-root text { font-family: Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #172b3a; }
#open-gemma4-layers-root .h { font-size: 26px; font-weight: 700; }
#open-gemma4-layers-root .t { font-size: 19px; font-weight: 600; }
#open-gemma4-layers-root .s { font-size: 15px; fill: #475569; }
#open-gemma4-layers-root .xs { font-size: 13px; fill: #64748b; }
#open-gemma4-layers-root .k { font-size: 13px; font-weight: 700; letter-spacing: .04em; fill: #64748b; }
#open-gemma4-layers-root .m { font-family: 'SFMono-Regular', Menlo, Consolas, monospace; font-size: 14px; fill: #172b3a; }
#open-gemma4-layers-root .node { fill: #fff; stroke: #cbd5e1; stroke-width: 2; }
#open-gemma4-layers-root .blue { fill: #eff6ff; stroke: #60a5fa; stroke-width: 2; }
#open-gemma4-layers-root .green { fill: #ecfdf5; stroke: #20a28c; stroke-width: 2; }
#open-gemma4-layers-root .red { fill: #fff1f2; stroke: #e88191; stroke-width: 2; }
#open-gemma4-layers-root .amber { fill: #fffbeb; stroke: #e0a63a; stroke-width: 2; }
#open-gemma4-layers-root .violet { fill: #f5f3ff; stroke: #9b87f5; stroke-width: 2; }
#open-gemma4-layers-root .gray { fill: #f1f5f9; stroke: #cbd5e1; stroke-width: 2; }
#open-gemma4-layers-root .fblue { fill: #93c5fd; } #open-gemma4-layers-root .fgreen { fill: #6ee7b7; } #open-gemma4-layers-root .fred { fill: #fda4af; }
#open-gemma4-layers-root .famber { fill: #fcd34d; } #open-gemma4-layers-root .fviolet { fill: #c4b5fd; } #open-gemma4-layers-root .fgray { fill: #e2e8f0; }
#open-gemma4-layers-root .edge { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#open-gemma4-layers-arrow); }
#open-gemma4-layers-root .dash { fill: none; stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 7 6; marker-end: url(#open-gemma4-layers-arrow); }
#open-gemma4-layers-root .line { stroke: #cbd5e1; stroke-width: 1.5; fill: none; }
#open-gemma4-layers-root .axis { stroke: #64748b; stroke-width: 2; fill: none; }
</style><marker id="open-gemma4-layers-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker></defs>
<rect width="1300" height="584" fill="#f8fafc"/>
<text x="32" y="46" class="h">Gemma 4：局部层多而窄，全局层少而宽</text>
<text x="32" y="78" class="s">以 31B 为例。格子宽度表示头维度：窄格 256 维，宽格 512 维。</text>
