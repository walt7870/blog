="274" width="7" height="26" rx="2" class="fgreen"/><rect x="148" y="274" width="7" height="26" rx="2" class="fgreen"/><rect x="157" y="274" width="7" height="26" rx="2" class="fgreen"/><rect x="166" y="274" width="7" height="26" rx="2" class="fgreen"/><rect x="175" y="274" width="7" height="26" rx="2" class="fgreen"/><rect x="184" y="274" width="7" height="26" rx="2" class="fgreen"/><rect x="193" y="274" width="7" height="26" rx="2" class="fgreen"/><rect x="202" y="274" width="7" height="26" rx="2" class="fgreen"/><rect x="211" y="274" width="7" height="26" rx="2" class="fgreen"/><text x="50" y="336" class="s">32 个 Q 头、16 个 KV 头，每头 256 维；只看最近 1024 个 token</text><text x="50" y="360" class="s">RoPE 底数 1 万，全部维度旋转</text><text x="50" y="384" class="s">KV 每层每 token 16 KiB，超出窗口的丢掉</text></g><g data-node="10 层 · full_attention"><rect x="668" y="112" width="600" height="300" rx="8" class="blue"/><text x="686" y="138" class="k">10 层 · full_attention</text><text x="686" y="164" class="t">全局层：每 6 层的第 6 层，最后一层必为全局</text><text x="686" y="208" class="m">Q</text><text x="686" y="250" class="m">K</text><text x="686" y="292" class="m">V</text><rect x="712" y="190" width="14" height="26" rx="2" class="fgray"/><rect x="728" y="190" width="14" height="26" rx="2" class="fgray"/><rect x="744" y="190" width="14" height="26" rx="2" class="fgray"/><rect x="760" y="190" width="14" height="26" rx="2" class="fgray"/><rect x="776" y="190" width="14" height="26" rx="2" class="fgray"/><rect x="792" y="190" width="14" height="26" rx="2" class="fgray"/><rect x="808" y="190" width="14" height="26" rx="2" class="fgray"/><rect x="824" y="190" width="14" height="26" rx="2" class="fgray"/><rect x="840" y="190" width="14" height="26" rx="2" class="fgray"/><rect x="856" y="190" width="14" height="26" rx="2" class="fgray"/><rect x="872" y="190" width="14" height="26" rx="2" class="fgray"/><rect x="888" y="190" width="14" height="26" rx="2" class="fgray"/><rect x="904" y="190" width="14" height="26" rx="2" class="fgray"/><rect x="920" y="190" width="14" height="26" rx="2" class="fgray"/><rect x="936" y="190" width="14" height="26" rx="2" class="fgray"/><rect x="952" y="190" width="14" height="26" rx="2" class="fgray"/><rect x="968" y="190" width="14" height="26" rx="2" class="fgray"/><rect x="984" y="190" width="14" height="26" rx="2" class="fgray"/><rect x="1000" y="190" width="14" height="26" rx="2" class="fgray"/><rect x="1016" y="190" width="14" height="26" rx="2" class="fgray"/><rect x="1032" y="190" width="14" height="26" rx="2" class="fgray"/><rect x="1048" y="190" width="14" height="26" rx="2" class="fgray"/><rect x="1064" y="190" width="14" height="26" rx="2" class="fgray"/><rect x="1080" y="190" width="14" height="26" rx="2" class="fgray"/><rect x="1096" y="190" width="14" height="26" rx="2" class="fgray"/><rect x="1112" y="190" width="14" height="26" rx="2" class="fgray"/><rect x="1128" y="190" width="14" height="26" rx="2" class="fgray"/><rect x="1144" y="190" width="14" height="26" rx="2" class="fgray"/><rect x="1160" y="190" width="14" height="26" rx="2" class="fgray"/><rect x="1176" y="190" width="14" height="26" rx="2" class="fgray"/><rect x="1192" y="190" width="14" height="26" rx="2" class="fgray"/><rect x="1208" y="190" width="14" height="26" rx="2" class="fgray"/><rect x="712" y="232" width="14" height="26" rx="2" class="fblue"/><rect x="728" y="232" width="14" height="26" rx="2" class="fblue"/><rect x="744" y="232" width="14" height="26" rx="2" class="fblue"/><rect x="760" y="232" width="14" height="26" rx="2" class="fblue"/><text x="712" y="292" class="s">V = K 的投影（没有 v_proj，V 另做一次 RMSNorm）</text><text x="686" y="336" class="s">32 个 Q 头、只有 4 个 KV 头，每头 512 维；看全部上下文</text><text x="686" y="360" class="s">p-RoPE 底数 100 万，只旋转 25% 的维度</text><text x="686" y="384" class="s">KV 每层每 token 8 KiB，随上下文增长</text></g><g data-node="g4-both"><rect x="32" y="436" width="1236" height="124" rx="8" class="gray"/><text x="50" y="462" class="k">两种层共有</text><text x="50" y="490" class="s">Q、K 各做 RMSNorm（QK-Norm），V 做一次不带缩放的 RMSNorm；注意力缩放系数取 1.0，不再除以 √d。</text><text x="50" y="514" class="s">每层 4 个 RMSNorm（夹心归一化）：注意力前后各一个、FFN 前后各一个；词嵌入乘 √5376 后进入第 1 层。</text><text x="50" y="538" class="s">输出层与词嵌入共享，最终 logits 做 tanh 软截断，上限 30。</text></g>
</svg>
