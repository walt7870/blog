<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="730" viewBox="0 0 1400 730" role="img" aria-labelledby="reading-config-map-title reading-config-map-desc" id="reading-config-map-root">
<title id="reading-config-map-title">config.json 字段和权重矩阵形状的对应关系</title>
<desc id="reading-config-map-desc">左边是 Llama-3.1-8B 的 7 个关键字段，右边是它们决定的权重矩阵：vocab_size 和 hidden_size 决定词嵌入 [128256, 4096]，注意力头数乘头维度决定 q_proj 和 o_proj，KV 头数决定 k_proj、v_proj 为 [4096, 1024]，intermediate_size 决定 FFN 三个矩阵，num_hidden_layers 决定重复 32 份，tie_word_embeddings 为 false 时输出层单独一份 [4096, 128256]。hidden_size 是所有矩阵的一条边。</desc>
<defs><style>
#reading-config-map-root text { font-family: Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #172b3a; }
#reading-config-map-root .h { font-size: 26px; font-weight: 700; }
#reading-config-map-root .t { font-size: 19px; font-weight: 600; }
#reading-config-map-root .s { font-size: 15px; fill: #475569; }
#reading-config-map-root .xs { font-size: 13px; fill: #64748b; }
#reading-config-map-root .k { font-size: 13px; font-weight: 700; letter-spacing: .04em; fill: #64748b; }
#reading-config-map-root .m { font-family: 'SFMono-Regular', Menlo, Consolas, monospace; font-size: 14px; fill: #172b3a; }
#reading-config-map-root .node { fill: #fff; stroke: #cbd5e1; stroke-width: 2; }
#reading-config-map-root .blue { fill: #eff6ff; stroke: #60a5fa; stroke-width: 2; }
#reading-config-map-root .green { fill: #ecfdf5; stroke: #20a28c; stroke-width: 2; }
#reading-config-map-root .red { fill: #fff1f2; stroke: #e88191; stroke-width: 2; }
#reading-config-map-root .amber { fill: #fffbeb; stroke: #e0a63a; stroke-width: 2; }
#reading-config-map-root .violet { fill: #f5f3ff; stroke: #9b87f5; stroke-width: 2; }
#reading-config-map-root .gray { fill: #f1f5f9; stroke: #cbd5e1; stroke-width: 2; }
#reading-config-map-root .fblue { fill: #93c5fd; } #reading-config-map-root .fgreen { fill: #6ee7b7; } #reading-config-map-root .fred { fill: #fda4af; }
#reading-config-map-root .famber { fill: #fcd34d; } #reading-config-map-root .fviolet { fill: #c4b5fd; } #reading-config-map-root .fgray { fill: #e2e8f0; }
#reading-config-map-root .edge { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#reading-config-map-arrow); }
#reading-config-map-root .dash { fill: none; stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 7 6; marker-end: url(#reading-config-map-arrow); }
#reading-config-map-root .line { stroke: #cbd5e1; stroke-width: 1.5; fill: none; }
#reading-config-map-root .axis { stroke: #64748b; stroke-width: 2; fill: none; }
</style><marker id="reading-config-map-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker></defs>
<rect width="1400" height="730" fill="#f8fafc"/>
<text x="32" y="46" class="h">从 config.json 读出每个矩阵的形状</text>
<text x="32" y="78" class="s">左边是字段（Llama-3.1-8B 的取值），右边是它决定的权重；虚线表示 vocab_size 同时决定输出层</text>
<g data-node="f1"><rect x="40" y="120" width="390" height="62" rx="8" class="gray"/><text x="56" y="147" class="m">vocab_size</text><text x="56" y="170" class="xs">Llama-3.1-8B：128256</text></g>
<g data-node="f2"><rect x="40" y="200" width="390" height="62" rx="8" class="gray"/><text x="56" y="227" class="m">hidden_size</text><text x="56" y="250" class="xs">Llama-3.1-8B：4096</text></g>
<g data-node="f3"><rect x="40" y="280" width="390" height="62" rx="8" class="gray"/><text x="56" y="307" class="m">num_attention_heads × head_dim</text><text x="56" y="330" class="xs">Llama-3.1-8B：32 × 128</text></g>
<g data-node="f4"><rect x="40" y="360" width="390" height="62" rx="8" class="gray"/><text x="56" y="387" class="m">num_key_value_heads</text><text x="56" y="410" class="xs">Llama-3.1-8B：8</text></g>
<g data-node="f5"><rect x="40" y="440" width="390" height="62" rx="8" class="gray"/><text x="56" y="467" class="m">intermediate_size</text><text x="56" y="490" class="xs">Llama-3.1-8B：14336</text></g>
<g data-node="f6"><rect x="40" y="520" width="390" height="62" rx="8" class="gray"/><text x="56" y="547" class="m">num_hidden_layers</text><text x="56" y="570" class="xs">Llama-3.1-8B：32</text></g>
<g data-node="f7"><rect x="40" y="600" width="390" height="62" rx="8" class="gray"/><text x="56" y="627" class="m">tie_word_embeddings</text><text x="56" y="650" class="xs">Llama-3.1-8B：false</text></g>
<g data-node="m1"><rect x="820" y="116" width="400" height="70" rx="8" class="blue"/></g>
<text x="838" y="144" class="m">embed_tokens</text><text x="838" y="170" class="xs">[128256, 4096]</text>
<path d="M430 151H820" class="edge"/>
<g data-node="m2"><rect x="820" y="276" width="400" height="70" rx="8" class="violet"/></g>
<text x="838" y="304" class="m">q_proj / o_proj</text><text x="838" y="330" class="xs">[4096, 4096] 各一个</text>
<path d="M430 311H820" class="edge"/>
<g data-node="m3"><rect x="820" y="356" width="400" height="70" rx="8" class="violet"/></g>
<text x="838" y="384" class="m">k_proj / v_proj</text><text x="838" y="410" class="xs">[4096, 1024] 各一个</text>
<path d="M430 391H820" class="edge"/>
<g data-node="m4"><rect x="820" y="436" width="400" height="70" rx="8" class="green"/></g>
<text x="838" y="464" class="m">gate / up / down</text><text x="838" y="490" class="xs">[4096, 14336] 三个</text>
<path d="M430 471H820" class="edge"/>
<g data-node="m5"><rect x="820" y="516" width="400" height="70" rx="8" class="node"/></g>
<text x="838" y="544" class="m">layers × 32</text><text x="838" y="570" class="xs">上面三行每层一份</text>
<path d="M430 551H820" class="edge"/>
<g data-node="m6"><rect x="820" y="596" width="400" height="70" rx="8" class="amber"/></g>
<text x="838" y="624" class="m">lm_head</text><text x="838" y="650" class="xs">[4096, 128256]，不共享</text>
<path d="M430 631H820" class="edge"/>
<path d="M430 159C 620 160, 640 610, 820 620" class="dash"/>
<path d="M430 231H600" class="line"/>
<rect x="464" y="201" width="150" height="26" rx="4" fill="#f8fafc"/><text x="470" y="219" class="s">所有矩阵的一条边</text>
<text x="40" y="700" class="s">形状决定参数：每层 4194 万（注意力）+ 1.76 亿（FFN），×32 层，再加两个 5.25 亿的词表矩阵，合计 80.3 亿。</text>
</svg>
