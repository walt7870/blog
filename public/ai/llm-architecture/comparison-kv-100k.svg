<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="690" viewBox="0 0 1320 690" role="img" aria-labelledby="comparison-kv-100k-title comparison-kv-100k-desc" id="comparison-kv-100k-root">
<title id="comparison-kv-100k-title">10 万 token 时各模型随长度增长的缓存</title>
<desc id="comparison-kv-100k-desc">把 10 万 token 的员工手册放进上下文，各模型需要随长度增长保存的缓存：MiniMax-M2 约 23.6 GiB，Qwen3-8B 13.7，Llama-3.1-8B 12.2，Gemma 3 27B 7.6，DeepSeek-V3 6.5，Llama 4 Maverick 4.6，gpt-oss-120b 3.4，Qwen3.5-397B 2.9，Kimi Linear 0.75。局部层窗口和线性层状态另占固定大小，未计入。</desc>
<defs><style>
#comparison-kv-100k-root text { font-family: Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #172b3a; }
#comparison-kv-100k-root .h { font-size: 26px; font-weight: 700; }
#comparison-kv-100k-root .t { font-size: 19px; font-weight: 600; }
#comparison-kv-100k-root .s { font-size: 15px; fill: #475569; }
#comparison-kv-100k-root .xs { font-size: 13px; fill: #64748b; }
#comparison-kv-100k-root .k { font-size: 13px; font-weight: 700; letter-spacing: .04em; fill: #64748b; }
#comparison-kv-100k-root .m { font-family: 'SFMono-Regular', Menlo, Consolas, monospace; font-size: 14px; fill: #172b3a; }
#comparison-kv-100k-root .node { fill: #fff; stroke: #cbd5e1; stroke-width: 2; }
#comparison-kv-100k-root .blue { fill: #eff6ff; stroke: #60a5fa; stroke-width: 2; }
#comparison-kv-100k-root .green { fill: #ecfdf5; stroke: #20a28c; stroke-width: 2; }
#comparison-kv-100k-root .red { fill: #fff1f2; stroke: #e88191; stroke-width: 2; }
#comparison-kv-100k-root .amber { fill: #fffbeb; stroke: #e0a63a; stroke-width: 2; }
#comparison-kv-100k-root .violet { fill: #f5f3ff; stroke: #9b87f5; stroke-width: 2; }
#comparison-kv-100k-root .gray { fill: #f1f5f9; stroke: #cbd5e1; stroke-width: 2; }
#comparison-kv-100k-root .fblue { fill: #93c5fd; } #comparison-kv-100k-root .fgreen { fill: #6ee7b7; } #comparison-kv-100k-root .fred { fill: #fda4af; }
#comparison-kv-100k-root .famber { fill: #fcd34d; } #comparison-kv-100k-root .fviolet { fill: #c4b5fd; } #comparison-kv-100k-root .fgray { fill: #e2e8f0; }
#comparison-kv-100k-root .edge { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#comparison-kv-100k-arrow); }
#comparison-kv-100k-root .dash { fill: none; stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 7 6; marker-end: url(#comparison-kv-100k-arrow); }
#comparison-kv-100k-root .line { stroke: #cbd5e1; stroke-width: 1.5; fill: none; }
#comparison-kv-100k-root .axis { stroke: #64748b; stroke-width: 2; fill: none; }
</style><marker id="comparison-kv-100k-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker></defs>
<rect width="1320" height="690" fill="#f8fafc"/>
<text x="32" y="46" class="h">同一本手册，缓存差了 30 倍</text>
<text x="32" y="78" class="s">只计随上下文增长的部分；滑动窗口缓存和线性层状态大小固定，另计</text>
<path d="M430 112V552" class="line"/><text x="430" y="574" class="xs" text-anchor="middle">0</text><path d="M556.6666666666666 112V552" class="line"/><text x="556.6666666666666" y="574" class="xs" text-anchor="middle">4</text><path d="M683.3333333333334 112V552" class="line"/><text x="683.3333333333334" y="574" class="xs" text-anchor="middle">8</text><path d="M810 112V552" class="line"/><text x="810" y="574" class="xs" text-anchor="middle">12</text><path d="M936.6666666666667 112V552" class="line"/><text x="936.6666666666667" y="574" class="xs" text-anchor="middle">16</text><path d="M1063.3333333333335 112V552" class="line"/><text x="1063.3333333333335" y="574" class="xs" text-anchor="middle">20</text><path d="M1190 112V552" class="line"/><text x="1190" y="574" class="xs" text-anchor="middle">24</text><text x="416" y="143" class="s" text-anchor="end">MiniMax-M2（62 层全局 GQA）</text><rect x="430" y="120" width="748.9522298177084" height="34" rx="4" class="fgray"/><text x="1188.9522298177085" y="143" class="s">23.7 GiB</text><text x="416" y="191" class="s" text-anchor="end">Qwen3-8B（36 层 GQA）</text><rect x="430" y="168" width="434.87548828125" height="34" rx="4" class="fgray"/><text x="874.87548828125" y="191" class="s">13.7 GiB</text><text x="416" y="239" class="s" text-anchor="end">Llama-3.1-8B（32 层 GQA）</text><rect x="430" y="216" width="386.55598958333337" height="34" rx="4" class="fgray"/><text x="826.5559895833334" y="239" class="s">12.2 GiB</text><text x="416" y="287" class="s" text-anchor="end">Gemma 3 27B（10 个全局层）</text><rect x="430" y="264" width="241.59749348958334" height="34" rx="4" class="fblue"/><text x="681.5974934895834" y="287" class="s">7.6 GiB</text><text x="416" y="335" class="s" text-anchor="end">DeepSeek-V3（MLA 576 个数）</text><rect x="430" y="312" width="207.2453498840332" height="34" rx="4" class="fviolet"/><text x="647.2453498840332" y="335" class="s">6.5 GiB</text><text x="416" y="383" class="s" text-anchor="end">Llama 4 Maverick（12 个 NoPE 全局层）</text><rect x="430" y="360" width="144.95849609375" height="34" rx="4" class="fblue"/><text x="584.95849609375" y="383" class="s">4.6 GiB</text><text x="416" y="431" class="s" text-anchor="end">gpt-oss-120b（18 个全局层）</text><rect x="430" y="408" width="108.7188720703125" height="34" rx="4" class="fblue"/><text x="548.7188720703125" y="431" class="s">3.4 GiB</text><text x="416" y="479" class="s" text-anchor="end">Qwen3.5-397B-A17B（15 个注意力层）</text><rect x="430" y="456" width="90.59906005859375" height="34" rx="4" class="fgreen"/><text x="530.5990600585938" y="479" class="s">2.9 GiB</text><text x="416" y="527" class="s" text-anchor="end">Kimi Linear（7 个 MLA 层）</text><rect x="430" y="504" width="23.79735310872396" height="34" rx="4" class="fgreen"/><text x="463.79735310872394" y="527" class="s">0.8 GiB</text><text x="810" y="604" class="s" text-anchor="middle">10 万 token 时随长度增长的缓存（GiB，BF16）</text><rect x="60" y="626" width="16" height="16" class="fgray"/><text x="84" y="640" class="s">每层都看全文</text><rect x="360" y="626" width="16" height="16" class="fblue"/><text x="384" y="640" class="s">局部层 + 少数全局层</text><rect x="660" y="626" width="16" height="16" class="fviolet"/><text x="684" y="640" class="s">压缩 KV（MLA）</text><rect x="960" y="626" width="16" height="16" class="fgreen"/><text x="984" y="640" class="s">线性层 + 少数注意力层</text>
</svg>
