<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="628" viewBox="0 0 1300 628" role="img" aria-labelledby="open-layer-patterns-title open-layer-patterns-desc" id="open-layer-patterns-root">
<title id="open-layer-patterns-title">各开源模型每层用哪种注意力</title>
<desc id="open-layer-patterns-desc">Mistral 7B 每层都是 4096 的滑动窗口；Gemma 2 局部与全局 1:1 交替，Gemma 3 为 5:1；gpt-oss 窗口 128 的带状注意力与全局交替；MiniMax-Text-01 每 7 层闪电注意力后接 1 层 softmax；Kimi Linear 每 3 层 KDA 后接 1 层 MLA；MiniMax-M2 全部是完整注意力。右侧是每 token 随长度增长的 KV Cache。</desc>
<defs><style>
#open-layer-patterns-root text { font-family: Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #172b3a; }
#open-layer-patterns-root .h { font-size: 26px; font-weight: 700; }
#open-layer-patterns-root .t { font-size: 19px; font-weight: 600; }
#open-layer-patterns-root .s { font-size: 15px; fill: #475569; }
#open-layer-patterns-root .xs { font-size: 13px; fill: #64748b; }
#open-layer-patterns-root .k { font-size: 13px; font-weight: 700; letter-spacing: .04em; fill: #64748b; }
#open-layer-patterns-root .m { font-family: 'SFMono-Regular', Menlo, Consolas, monospace; font-size: 14px; fill: #172b3a; }
#open-layer-patterns-root .node { fill: #fff; stroke: #cbd5e1; stroke-width: 2; }
#open-layer-patterns-root .blue { fill: #eff6ff; stroke: #60a5fa; stroke-width: 2; }
#open-layer-patterns-root .green { fill: #ecfdf5; stroke: #20a28c; stroke-width: 2; }
#open-layer-patterns-root .red { fill: #fff1f2; stroke: #e88191; stroke-width: 2; }
#open-layer-patterns-root .amber { fill: #fffbeb; stroke: #e0a63a; stroke-width: 2; }
#open-layer-patterns-root .violet { fill: #f5f3ff; stroke: #9b87f5; stroke-width: 2; }
#open-layer-patterns-root .gray { fill: #f1f5f9; stroke: #cbd5e1; stroke-width: 2; }
#open-layer-patterns-root .fblue { fill: #93c5fd; } #open-layer-patterns-root .fgreen { fill: #6ee7b7; } #open-layer-patterns-root .fred { fill: #fda4af; }
#open-layer-patterns-root .famber { fill: #fcd34d; } #open-layer-patterns-root .fviolet { fill: #c4b5fd; } #open-layer-patterns-root .fgray { fill: #e2e8f0; }
#open-layer-patterns-root .edge { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#open-layer-patterns-arrow); }
#open-layer-patterns-root .dash { fill: none; stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 7 6; marker-end: url(#open-layer-patterns-arrow); }
#open-layer-patterns-root .line { stroke: #cbd5e1; stroke-width: 1.5; fill: none; }
#open-layer-patterns-root .axis { stroke: #64748b; stroke-width: 2; fill: none; }
</style><marker id="open-layer-patterns-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker></defs>
<rect width="1300" height="628" fill="#f8fafc"/>
<text x="32" y="46" class="h">同样几十层，各家把“看全文”的层放在哪里</text>
<text x="32" y="78" class="s">只有蓝色和黄色的层要为每个历史 token 存 KV；绿色只存窗口内的，紫色只存固定大小的状态。</text>
