<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="690" viewBox="0 0 1400 690" role="img" aria-labelledby="overview-dataflow-title overview-dataflow-desc" id="overview-dataflow-root">
<title id="overview-dataflow-title">Llama-3.1-8B 从输入文本到下一个 token 的数据流</title>
<desc id="overview-dataflow-desc">输入“年假怎么申请？”经分词器切成 5 个 token，词嵌入查表得到形状 [5, 4096] 的矩阵，依次经过 32 个结构相同的解码器层，每层先 RMSNorm 再自注意力并加回残差流，再 RMSNorm、FFN 并加回残差流；最后经最终 RMSNorm 和输出层得到 [5, 128256] 的 logits，取最后一行经 softmax 选出下一个 token，再接到输入末尾重复。</desc>
<defs><style>
#overview-dataflow-root text { font-family: Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #172b3a; }
#overview-dataflow-root .h { font-size: 26px; font-weight: 700; }
#overview-dataflow-root .t { font-size: 19px; font-weight: 600; }
#overview-dataflow-root .s { font-size: 15px; fill: #475569; }
#overview-dataflow-root .xs { font-size: 13px; fill: #64748b; }
#overview-dataflow-root .k { font-size: 13px; font-weight: 700; letter-spacing: .04em; fill: #64748b; }
#overview-dataflow-root .m { font-family: 'SFMono-Regular', Menlo, Consolas, monospace; font-size: 14px; fill: #172b3a; }
#overview-dataflow-root .node { fill: #fff; stroke: #cbd5e1; stroke-width: 2; }
#overview-dataflow-root .blue { fill: #eff6ff; stroke: #60a5fa; stroke-width: 2; }
#overview-dataflow-root .green { fill: #ecfdf5; stroke: #20a28c; stroke-width: 2; }
#overview-dataflow-root .red { fill: #fff1f2; stroke: #e88191; stroke-width: 2; }
#overview-dataflow-root .amber { fill: #fffbeb; stroke: #e0a63a; stroke-width: 2; }
#overview-dataflow-root .violet { fill: #f5f3ff; stroke: #9b87f5; stroke-width: 2; }
#overview-dataflow-root .gray { fill: #f1f5f9; stroke: #cbd5e1; stroke-width: 2; }
#overview-dataflow-root .fblue { fill: #93c5fd; } #overview-dataflow-root .fgreen { fill: #6ee7b7; } #overview-dataflow-root .fred { fill: #fda4af; }
#overview-dataflow-root .famber { fill: #fcd34d; } #overview-dataflow-root .fviolet { fill: #c4b5fd; } #overview-dataflow-root .fgray { fill: #e2e8f0; }
#overview-dataflow-root .edge { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#overview-dataflow-arrow); }
#overview-dataflow-root .dash { fill: none; stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 7 6; marker-end: url(#overview-dataflow-arrow); }
#overview-dataflow-root .line { stroke: #cbd5e1; stroke-width: 1.5; fill: none; }
#overview-dataflow-root .axis { stroke: #64748b; stroke-width: 2; fill: none; }
</style><marker id="overview-dataflow-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker></defs>
<rect width="1400" height="690" fill="#f8fafc"/>
<text x="32" y="46" class="h">一个 token 的旅程：Llama-3.1-8B 的整体结构</text>
<text x="32" y="78" class="s">上排是从文本到下一个 token 的七步，方括号里是张量形状；下方放大一个解码器层。</text>
<g data-node="txt"><rect x="28" y="132" width="172" height="132" rx="8" class="gray"/><text x="46" y="158" class="k">文本</text><text x="46" y="184" class="t">输入文本</text><text x="46" y="212" class="s">年假怎么申请？</text><text x="46" y="235" class="s">7 个字符</text></g><path d="M200 198H222" class="edge"/><g data-node="tok"><rect x="222" y="132" width="172" height="132" rx="8" class="node"/><text x="240" y="158" class="k">整数编号</text><text x="240" y="184" class="t">分词器</text><text x="240" y="212" class="s">切成 5 个 token</text><text x="240" y="235" class="s">形状 [5]</text></g><path d="M394 198H416" class="edge"/><g data-node="emb"><rect x="416" y="132" width="172" height="132" rx="8" class="blue"/><text x="434" y="158" class="k">向量</text><text x="434" y="184" class="t">词嵌入</text><text x="434" y="212" class="s">按编号查表取行</text><text x="434" y="235" class="s">[5] → [5, 4096]</text></g><path d="M588 198H610" class="edge"/><g data-node="layers"><rect x="610" y="132" width="172" height="132" rx="8" class="violet"/><text x="628" y="158" class="k">主体</text><text x="628" y="184" class="t">解码器层 ×32</text><text x="628" y="212" class="s">注意力 + FFN</text><text x="628" y="235" class="s">[5, 4096] 进出</text></g><path d="M782 198H804" class="edge"/><g data-node="norm"><rect x="804" y="132" width="172" height="132" rx="8" class="node"/><text x="822" y="158" class="k">归一化</text><text x="822" y="184" class="t">最终 RMSNorm</text><text x="822" y="212" class="s">统一数值尺度</text><text x="822" y="235" class="s">[5, 4096]</text></g><path d="M976 198H998" class="edge"/><g data-node="head"><rect x="998" y="132" width="172" height="132" rx="8" class="amber"/><text x="1016" y="158" class="k">logits</text><text x="1016" y="184" class="t">输出层</text><text x="1016" y="212" class="s">4096 → 128256</text><text x="1016" y="235" class="s">[5, 128256]</text></g><path d="M1170 198H1192" class="edge"/><g data-node="next"><rect x="1192" y="132" width="172" height="132" rx="8" class="green"/><text x="1210" y="158" class="k">结果</text><text x="1210" y="184" class="t">下一个 token</text><text x="1210" y="212" class="s">取最后一行</text><text x="1210" y="235" class="s">softmax 后选出</text></g>
<path d="M1278 132V104H114V132" class="dash"/>
<rect x="554" y="94" width="380" height="26" rx="4" fill="#f8fafc"/><text x="560" y="112" class="s">选出的 token 接到输入末尾，再算下一步（自回归）</text>
<rect x="28" y="330" width="1344" height="330" rx="10" fill="none" stroke="#9b87f5" stroke-width="2" stroke-dasharray="6 5"/>
<path d="M610 264L120 330" class="line"/>
<path d="M782 264L1280 330" class="line"/>
<text x="48" y="358" class="k">放大其中一层（32 层结构相同、参数各不相同）</text>
<path d="M60 560H1330" stroke="#60a5fa" stroke-width="10" stroke-linecap="round" opacity=".35" fill="none"/>
<path d="M60 560H1336" class="edge"/>
<text x="60" y="600" class="s">残差流 [5, 4096]：每个子层只把结果加回来，不替换原来的向量</text>
<text x="60" y="626" class="xs">第 06 篇讲残差与归一化；第 03、04 篇讲注意力；第 05 篇讲 FFN</text>
<path d="M130 560V478" class="edge"/>
<g data-node="n1"><rect x="70" y="398" width="150" height="80" rx="8" class="node"/><text x="88" y="434" class="t">RMSNorm</text><text x="88" y="462" class="s">[5, 4096]</text></g>
<path d="M220 438H252" class="edge"/>
<g data-node="attn"><rect x="252" y="382" width="300" height="112" rx="8" class="blue"/><text x="270" y="418" class="t">自注意力</text><text x="270" y="446" class="s">Q [5, 32, 128]，K/V [5, 8, 128]</text><text x="270" y="469" class="s">每个 token 看前面的 token</text></g>
<path d="M552 438H600V546" class="edge"/>
<circle cx="600" cy="560" r="14" fill="#fff" stroke="#64748b" stroke-width="2"/>
<text x="600" y="566" class="t" text-anchor="middle">+</text>
<path d="M720 560V478" class="edge"/>
<g data-node="n2"><rect x="660" y="398" width="150" height="80" rx="8" class="node"/><text x="678" y="434" class="t">RMSNorm</text><text x="678" y="462" class="s">[5, 4096]</text></g>
<path d="M810 438H842" class="edge"/>
<g data-node="ffn"><rect x="842" y="382" width="380" height="112" rx="8" class="green"/><text x="860" y="418" class="t">FFN（SwiGLU）</text><text x="860" y="446" class="s">[5, 4096] → [5, 14336] → [5, 4096]</text><text x="860" y="469" class="s">每个 token 各算各的</text></g>
<path d="M1222 438H1270V546" class="edge"/>
<circle cx="1270" cy="560" r="14" fill="#fff" stroke="#64748b" stroke-width="2"/>
<text x="1270" y="566" class="t" text-anchor="middle">+</text>
<text x="560" y="400" class="xs">每层 4194 万参数</text>
<text x="1230" y="400" class="xs">每层 1.76 亿</text>
</svg>
