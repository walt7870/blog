<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="ffn-shapes-title ffn-shapes-desc" id="ffn-shapes-root">
<title id="ffn-shapes-title">Llama-3.1-8B 一层 FFN 的数据流与张量形状</title>
<desc id="ffn-shapes-desc">输入 [n,4096] 分别经 gate_proj 和 up_proj 变成两个 [n,14336]，gate 一路过 SiLU 后与 up 一路逐元素相乘，再经 down_proj 回到 [n,4096]。下方说明 5 个 token 共用同一组权重但各自独立计算。</desc>
<defs><style>
#ffn-shapes-root text { font-family: Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #172b3a; }
#ffn-shapes-root .h { font-size: 26px; font-weight: 700; }
#ffn-shapes-root .t { font-size: 19px; font-weight: 600; }
#ffn-shapes-root .s { font-size: 15px; fill: #475569; }
#ffn-shapes-root .xs { font-size: 13px; fill: #64748b; }
#ffn-shapes-root .k { font-size: 13px; font-weight: 700; letter-spacing: .04em; fill: #64748b; }
#ffn-shapes-root .m { font-family: 'SFMono-Regular', Menlo, Consolas, monospace; font-size: 14px; fill: #172b3a; }
#ffn-shapes-root .node { fill: #fff; stroke: #cbd5e1; stroke-width: 2; }
#ffn-shapes-root .blue { fill: #eff6ff; stroke: #60a5fa; stroke-width: 2; }
#ffn-shapes-root .green { fill: #ecfdf5; stroke: #20a28c; stroke-width: 2; }
#ffn-shapes-root .red { fill: #fff1f2; stroke: #e88191; stroke-width: 2; }
#ffn-shapes-root .amber { fill: #fffbeb; stroke: #e0a63a; stroke-width: 2; }
#ffn-shapes-root .violet { fill: #f5f3ff; stroke: #9b87f5; stroke-width: 2; }
#ffn-shapes-root .gray { fill: #f1f5f9; stroke: #cbd5e1; stroke-width: 2; }
#ffn-shapes-root .fblue { fill: #93c5fd; } #ffn-shapes-root .fgreen { fill: #6ee7b7; } #ffn-shapes-root .fred { fill: #fda4af; }
#ffn-shapes-root .famber { fill: #fcd34d; } #ffn-shapes-root .fviolet { fill: #c4b5fd; } #ffn-shapes-root .fgray { fill: #e2e8f0; }
#ffn-shapes-root .edge { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#ffn-shapes-arrow); }
#ffn-shapes-root .dash { fill: none; stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 7 6; marker-end: url(#ffn-shapes-arrow); }
#ffn-shapes-root .line { stroke: #cbd5e1; stroke-width: 1.5; fill: none; }
#ffn-shapes-root .axis { stroke: #64748b; stroke-width: 2; fill: none; }
</style><marker id="ffn-shapes-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker></defs>
<rect width="1200" height="560" fill="#f8fafc"/>
<text x="32" y="46" class="h">FFN：先升到 14336 维，再降回 4096 维</text>
<text x="32" y="78" class="s">SwiGLU 版本有三个矩阵：gate_proj、up_proj、down_proj，每个 4096 × 14336。</text>
<g data-node="x"><rect x="32" y="170" width="190" height="150" rx="8" class="node"/><text x="50" y="206" class="t">输入 x</text><text x="50" y="234" class="s">[n, 4096]</text><text x="50" y="257" class="s">已经过 RMSNorm</text></g><g data-node="gate"><rect x="282" y="112" width="250" height="120" rx="8" class="blue"/><text x="300" y="138" class="k">门</text><text x="300" y="164" class="t">gate_proj</text><text x="300" y="192" class="s">4096 → 14336</text><text x="300" y="215" class="s">输出 [n, 14336]</text></g><g data-node="up"><rect x="282" y="262" width="250" height="120" rx="8" class="violet"/><text x="300" y="288" class="k">值</text><text x="300" y="314" class="t">up_proj</text><text x="300" y="342" class="s">4096 → 14336</text><text x="300" y="365" class="s">输出 [n, 14336]</text></g><g data-node="act"><rect x="582" y="112" width="170" height="120" rx="8" class="blue"/><text x="600" y="148" class="t">SiLU</text><text x="600" y="176" class="s">逐元素</text><text x="600" y="199" class="s">[n, 14336]</text></g><g data-node="mul"><rect x="802" y="170" width="150" height="150" rx="8" class="amber"/><text x="820" y="206" class="t">逐元素相乘</text><text x="820" y="234" class="s">⊙</text><text x="820" y="257" class="s">[n, 14336]</text></g><g data-node="down"><rect x="1002" y="170" width="166" height="150" rx="8" class="green"/><text x="1020" y="206" class="t">down_proj</text><text x="1020" y="234" class="s">14336 → 4096</text><text x="1020" y="257" class="s">输出 [n, 4096]</text></g><path d="M222 220Q252 220 252 172Q252 172 278 172" class="edge"/><path d="M222 270Q252 270 252 322Q252 322 278 322" class="edge"/><path d="M532 172H578" class="edge"/><path d="M752 172Q776 172 776 230Q776 236 798 236" class="edge"/><path d="M532 322H776Q776 322 776 262Q776 256 798 256" class="edge"/><path d="M952 245H998" class="edge"/><text x="32" y="422" class="t">每个位置各算各的：5 个 token 共用同一套权重，但彼此之间不交换数据</text><rect x="32" y="446" width="64" height="44" rx="4" class="fgray"/><text x="64" y="473" text-anchor="middle" class="s">年</text><path d="M96 468H124" class="edge"/><rect x="128" y="446" width="64" height="44" rx="4" class="fgreen"/><text x="160" y="473" text-anchor="middle" class="xs">FFN</text><path d="M192 468H220" class="edge"/><rect x="224" y="446" width="20" height="44" rx="4" class="fblue"/><rect x="262" y="446" width="64" height="44" rx="4" class="fgray"/><text x="294" y="473" text-anchor="middle" class="s">假</text><path d="M326 468H354" class="edge"/><rect x="358" y="446" width="64" height="44" rx="4" class="fgreen"/><text x="390" y="473" text-anchor="middle" class="xs">FFN</text><path d="M422 468H450" class="edge"/><rect x="454" y="446" width="20" height="44" rx="4" class="fblue"/><rect x="492" y="446" width="64" height="44" rx="4" class="fgray"/><text x="524" y="473" text-anchor="middle" class="s">怎么</text><path d="M556 468H584" class="edge"/><rect x="588" y="446" width="64" height="44" rx="4" class="fgreen"/><text x="620" y="473" text-anchor="middle" class="xs">FFN</text><path d="M652 468H680" class="edge"/><rect x="684" y="446" width="20" height="44" rx="4" class="fblue"/><rect x="722" y="446" width="64" height="44" rx="4" class="fgray"/><text x="754" y="473" text-anchor="middle" class="s">申请</text><path d="M786 468H814" class="edge"/><rect x="818" y="446" width="64" height="44" rx="4" class="fgreen"/><text x="850" y="473" text-anchor="middle" class="xs">FFN</text><path d="M882 468H910" class="edge"/><rect x="914" y="446" width="20" height="44" rx="4" class="fblue"/><rect x="952" y="446" width="64" height="44" rx="4" class="fgray"/><text x="984" y="473" text-anchor="middle" class="s">？</text><path d="M1016 468H1044" class="edge"/><rect x="1048" y="446" width="64" height="44" rx="4" class="fgreen"/><text x="1080" y="473" text-anchor="middle" class="xs">FFN</text><path d="M1112 468H1140" class="edge"/><rect x="1144" y="446" width="20" height="44" rx="4" class="fblue"/><text x="32" y="530" class="s">对照：注意力里每个位置要读前面所有位置的 K、V；FFN 只看自己这一个向量，所以 n 个位置可以拼成一次大矩阵乘法。</text>
</svg>
