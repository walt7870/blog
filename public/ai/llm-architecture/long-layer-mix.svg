<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="640" viewBox="0 0 1320 640" role="img" aria-labelledby="long-layer-mix-title long-layer-mix-desc" id="long-layer-mix-root">
<title id="long-layer-mix-title">局部与全局注意力交替的层排布与 KV Cache</title>
<desc id="long-layer-mix-desc">Gemma 3 27B 的 62 层里每 6 层有 1 层全局注意力，共 10 层全局、52 层窗口 1024；gpt-oss-120b 的 36 层奇偶交替，18 层窗口 128、18 层全局。128K 上下文时 Gemma 3 的 KV 约 10.4 GiB，全部用全局注意力要 62 GiB；gpt-oss-120b 约 4.5 GiB，全部全局要 9 GiB。</desc>
