<text x="32" y="46" class="h">局部层只存最近一段，全局层存全部：KV 主要由全局层决定</text>
<text x="32" y="78" class="s">蓝色 = 滑动窗口层，红色 = 全局层；KV 按 BF16、单个 128K 请求计算。</text>
