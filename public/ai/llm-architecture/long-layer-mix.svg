#long-layer-mix-root .famber { fill: #fcd34d; } #long-layer-mix-root .fviolet { fill: #c4b5fd; } #long-layer-mix-root .fgray { fill: #e2e8f0; }
#long-layer-mix-root .edge { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#long-layer-mix-arrow); }
#long-layer-mix-root .dash { fill: none; stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 7 6; marker-end: url(#long-layer-mix-arrow); }
