<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="808" viewBox="0 0 1400 808" role="img" aria-labelledby="llama-timeline-title llama-timeline-desc" id="llama-timeline-root">
<title id="llama-timeline-title">Llama 各代结构变化时间线</title>
<desc id="llama-timeline-desc">从 2023 年 2 月的 Llama 1 到 2025 年 4 月的 Llama 4，每一行列出发布时间、主要结构变化和规格。Llama 1 定下 RMSNorm、SwiGLU、RoPE 的配方；Llama 2 在大模型上引入 GQA；Llama 3 换 128K 词表、全尺寸 GQA、rope_theta 500000；Llama 3.1 用 llama3 RoPE 缩放扩到 128K；Llama 3.2 有剪枝蒸馏的小模型和交叉注意力视觉模型；Llama 3.3 结构不变；Llama 4 改为 MoE、iRoPE 和早期融合多模态。</desc>
<defs><style>
#llama-timeline-root text { font-family: Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #172b3a; }
#llama-timeline-root .h { font-size: 26px; font-weight: 700; }
#llama-timeline-root .t { font-size: 19px; font-weight: 600; }
#llama-timeline-root .s { font-size: 15px; fill: #475569; }
#llama-timeline-root .xs { font-size: 13px; fill: #64748b; }
#llama-timeline-root .k { font-size: 13px; font-weight: 700; letter-spacing: .04em; fill: #64748b; }
#llama-timeline-root .m { font-family: 'SFMono-Regular', Menlo, Consolas, monospace; font-size: 14px; fill: #172b3a; }
#llama-timeline-root .node { fill: #fff; stroke: #cbd5e1; stroke-width: 2; }
#llama-timeline-root .blue { fill: #eff6ff; stroke: #60a5fa; stroke-width: 2; }
#llama-timeline-root .green { fill: #ecfdf5; stroke: #20a28c; stroke-width: 2; }
#llama-timeline-root .red { fill: #fff1f2; stroke: #e88191; stroke-width: 2; }
#llama-timeline-root .amber { fill: #fffbeb; stroke: #e0a63a; stroke-width: 2; }
#llama-timeline-root .violet { fill: #f5f3ff; stroke: #9b87f5; stroke-width: 2; }
#llama-timeline-root .gray { fill: #f1f5f9; stroke: #cbd5e1; stroke-width: 2; }
#llama-timeline-root .fblue { fill: #93c5fd; } #llama-timeline-root .fgreen { fill: #6ee7b7; } #llama-timeline-root .fred { fill: #fda4af; }
#llama-timeline-root .famber { fill: #fcd34d; } #llama-timeline-root .fviolet { fill: #c4b5fd; } #llama-timeline-root .fgray { fill: #e2e8f0; }
#llama-timeline-root .edge { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#llama-timeline-arrow); }
#llama-timeline-root .dash { fill: none; stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 7 6; marker-end: url(#llama-timeline-arrow); }
#llama-timeline-root .line { stroke: #cbd5e1; stroke-width: 1.5; fill: none; }
#llama-timeline-root .axis { stroke: #64748b; stroke-width: 2; fill: none; }
</style><marker id="llama-timeline-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker></defs>
<rect width="1400" height="808" fill="#f8fafc"/>
<text x="32" y="46" class="h">Llama 1 → Llama 4：每一代动了哪里</text>
<text x="32" y="78" class="s">中间一栏是结构变化，右栏是尺寸和训练量；Llama 3.3 之前都是同一个 LlamaForCausalLM 类。</text>
<path d="M60 104V780" class="axis"/><circle cx="60" cy="154" r="8" fill="#fff" stroke="#64748b" stroke-width="2"/><g data-node="llama-timeline-n0"><rect x="84" y="112" width="236" height="84" rx="8" class="gray"/><text x="102" y="138" class="k">2023-02</text><text x="102" y="164" class="t">Llama 1</text></g><g data-node="llama-timeline-c0"><rect x="336" y="112" width="780" height="84" rx="8" class="node"/></g><text x="354" y="146" class="s">现代配方成形：Pre-Norm + RMSNorm、SwiGLU、RoPE、全部线性层无偏置</text><text x="354" y="174" class="s">多头注意力（MHA），SentencePiece 词表 32,000，上下文 2,048</text><g data-node="llama-timeline-s0"><rect x="1132" y="112" width="240" height="84" rx="8" class="gray"/></g><text x="1150" y="146" class="m">7B–65B</text><text x="1150" y="174" class="xs">1.0T/1.4T token · 非商用</text><circle cx="60" cy="250" r="8" fill="#fff" stroke="#64748b" stroke-width="2"/><g data-node="llama-timeline-n1"><rect x="84" y="208" width="236" height="84" rx="8" class="blue"/><text x="102" y="234" class="k">2023-07</text><text x="102" y="260" class="t">Llama 2</text></g><g data-node="llama-timeline-c1"><rect x="336" y="208" width="780" height="84" rx="8" class="node"/></g><text x="354" y="242" class="s">结构几乎不变：上下文翻倍到 4,096，训练 token 增到 2T</text><text x="354" y="270" class="s">只有 34B/70B 改用 GQA（8 个 KV 头），7B/13B 仍是 MHA</text><g data-node="llama-timeline-s1"><rect x="1132" y="208" width="240" height="84" rx="8" class="gray"/></g><text x="1150" y="242" class="m">7B / 13B / 70B</text><text x="1150" y="270" class="xs">社区许可，可商用</text><circle cx="60" cy="346" r="8" fill="#fff" stroke="#64748b" stroke-width="2"/><g data-node="llama-timeline-n2"><rect x="84" y="304" width="236" height="84" rx="8" class="blue"/><text x="102" y="330" class="k">2024-04</text><text x="102" y="356" class="t">Llama 3</text></g><g data-node="llama-timeline-c2"><rect x="336" y="304" width="780" height="84" rx="8" class="node"/></g><text x="354" y="338" class="s">分词器换成 128,256 词表（tiktoken 系），全部尺寸都用 GQA</text><text x="354" y="366" class="s">rope_theta 从 10,000 调到 500,000，上下文 8,192，跨文档注意力掩码</text><g data-node="llama-timeline-s2"><rect x="1132" y="304" width="240" height="84" rx="8" class="gray"/></g><text x="1150" y="338" class="m">8B / 70B</text><text x="1150" y="366" class="xs">15T+ token</text><circle cx="60" cy="442" r="8" fill="#fff" stroke="#64748b" stroke-width="2"/><g data-node="llama-timeline-n3"><rect x="84" y="400" width="236" height="84" rx="8" class="violet"/><text x="102" y="426" class="k">2024-07</text><text x="102" y="452" class="t">Llama 3.1</text></g><g data-node="llama-timeline-c3"><rect x="336" y="400" width="780" height="84" rx="8" class="node"/></g><text x="354" y="434" class="s">rope_scaling 类型 llama3：按频率分段缩放，上下文扩到 131,072</text><text x="354" y="462" class="s">新增 405B，仍是密集结构；许可证允许用输出训练其他模型</text><g data-node="llama-timeline-s3"><rect x="1132" y="400" width="240" height="84" rx="8" class="gray"/></g><text x="1150" y="434" class="m">8B / 70B / 405B</text><text x="1150" y="462" class="xs">128K 上下文</text><circle cx="60" cy="538" r="8" fill="#fff" stroke="#64748b" stroke-width="2"/><g data-node="llama-timeline-n4"><rect x="84" y="496" width="236" height="84" rx="8" class="green"/><text x="102" y="522" class="k">2024-09</text><text x="102" y="548" class="t">Llama 3.2</text></g><g data-node="llama-timeline-c4"><rect x="336" y="496" width="780" height="84" rx="8" class="node"/></g><text x="354" y="530" class="s">1B/3B：剪枝后用 3.1 8B/70B 的 logits 做蒸馏，共享词嵌入</text><text x="354" y="558" class="s">11B/90B Vision：在 3.1 文本模型旁插入交叉注意力层接图像</text><g data-node="llama-timeline-s4"><rect x="1132" y="496" width="240" height="84" rx="8" class="gray"/></g><text x="1150" y="530" class="m">1B / 3B / 11B / 90B</text><text x="1150" y="558" class="xs">端侧 + 视觉</text><circle cx="60" cy="634" r="8" fill="#fff" stroke="#64748b" stroke-width="2"/><g data-node="llama-timeline-n5"><rect x="84" y="592" width="236" height="84" rx="8" class="green"/><text x="102" y="618" class="k">2024-12</text><text x="102" y="644" class="t">Llama 3.3</text></g><g data-node="llama-timeline-c5"><rect x="336" y="592" width="780" height="84" rx="8" class="node"/></g><text x="354" y="626" class="s">只发布 70B Instruct，config 与 3.1-70B 相同</text><text x="354" y="654" class="s">改进全在后训练，结构没有变化</text><g data-node="llama-timeline-s5"><rect x="1132" y="592" width="240" height="84" rx="8" class="gray"/></g><text x="1150" y="626" class="m">70B</text><text x="1150" y="654" class="xs">同 3.1 架构</text><circle cx="60" cy="730" r="8" fill="#fff" stroke="#64748b" stroke-width="2"/><g data-node="llama-timeline-n6"><rect x="84" y="688" width="236" height="84" rx="8" class="amber"/><text x="102" y="714" class="k">2025-04</text><text x="102" y="740" class="t">Llama 4</text></g><g data-node="llama-timeline-c6"><rect x="336" y="688" width="780" height="84" rx="8" class="node"/></g><text x="354" y="722" class="s">MoE：每 token 激活 1 个路由专家 + 1 个共享专家；Maverick 密集/MoE 层交替</text><text x="354" y="750" class="s">iRoPE：每 4 层 1 层不用 RoPE 且看全文；早期融合原生多模态；词表 202,048</text><g data-node="llama-timeline-s6"><rect x="1132" y="688" width="240" height="84" rx="8" class="gray"/></g><text x="1150" y="722" class="m">Scout 109B/17B</text><text x="1150" y="750" class="xs">Maverick 400B/17B</text>
</svg>
