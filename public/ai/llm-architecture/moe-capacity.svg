<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="560" viewBox="0 0 1320 560" role="img" aria-labelledby="moe-capacity-title moe-capacity-desc" id="moe-capacity-root">
<title id="moe-capacity-title">专家容量与被丢弃的 token</title>
<desc id="moe-capacity-desc">一批 8 个 token、4 个专家、每个 token 选 1 个专家。5 个 token 都选了 E1。容量因子 1.0 时每个专家最多收 2 个，t3、t5、t7 被丢弃；容量因子 1.25 时每个专家收 3 个，t5、t7 被丢弃；被丢弃的 token 跳过 FFN，只经残差连接传到下一层。</desc>
<defs><style>
#moe-capacity-root text { font-family: Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #172b3a; }
#moe-capacity-root .h { font-size: 26px; font-weight: 700; }
#moe-capacity-root .t { font-size: 19px; font-weight: 600; }
#moe-capacity-root .s { font-size: 15px; fill: #475569; }
#moe-capacity-root .xs { font-size: 13px; fill: #64748b; }
#moe-capacity-root .k { font-size: 13px; font-weight: 700; letter-spacing: .04em; fill: #64748b; }
#moe-capacity-root .m { font-family: 'SFMono-Regular', Menlo, Consolas, monospace; font-size: 14px; fill: #172b3a; }
#moe-capacity-root .node { fill: #fff; stroke: #cbd5e1; stroke-width: 2; }
#moe-capacity-root .blue { fill: #eff6ff; stroke: #60a5fa; stroke-width: 2; }
#moe-capacity-root .green { fill: #ecfdf5; stroke: #20a28c; stroke-width: 2; }
#moe-capacity-root .red { fill: #fff1f2; stroke: #e88191; stroke-width: 2; }
#moe-capacity-root .amber { fill: #fffbeb; stroke: #e0a63a; stroke-width: 2; }
#moe-capacity-root .violet { fill: #f5f3ff; stroke: #9b87f5; stroke-width: 2; }
#moe-capacity-root .gray { fill: #f1f5f9; stroke: #cbd5e1; stroke-width: 2; }
#moe-capacity-root .fblue { fill: #93c5fd; } #moe-capacity-root .fgreen { fill: #6ee7b7; } #moe-capacity-root .fred { fill: #fda4af; }
#moe-capacity-root .famber { fill: #fcd34d; } #moe-capacity-root .fviolet { fill: #c4b5fd; } #moe-capacity-root .fgray { fill: #e2e8f0; }
#moe-capacity-root .edge { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#moe-capacity-arrow); }
#moe-capacity-root .dash { fill: none; stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 7 6; marker-end: url(#moe-capacity-arrow); }
#moe-capacity-root .line { stroke: #cbd5e1; stroke-width: 1.5; fill: none; }
#moe-capacity-root .axis { stroke: #64748b; stroke-width: 2; fill: none; }
</style><marker id="moe-capacity-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker></defs>
<rect width="1320" height="560" fill="#f8fafc"/>
<text x="32" y="46" class="h">路由不均时，容量有限的专家会把多出来的 token 挡在门外</text>
<text x="32" y="78" class="s">8 个 token、4 个专家、每个 token 选 1 个；红色 token 超出容量，本层 FFN 不处理它，只沿残差连接往下走。</text>
<text x="280" y="132" class="k">每个 token 选中的专家（按顺序到达）</text>
<text x="832" y="132" class="k">各专家的容量槽</text>
<text x="32" y="176" class="t">容量因子 1.0</text><rect x="280" y="150" width="54" height="40" rx="4" class="fblue"/><text x="307" y="175" text-anchor="middle" class="xs">t1→E1</text><rect x="344" y="150" width="54" height="40" rx="4" class="fblue"/><text x="371" y="175" text-anchor="middle" class="xs">t2→E1</text><rect x="408" y="150" width="54" height="40" rx="4" class="fred"/><text x="435" y="175" text-anchor="middle" class="xs">t3→E1</text><rect x="472" y="150" width="54" height="40" rx="4" class="fblue"/><text x="499" y="175" text-anchor="middle" class="xs">t4→E2</text><rect x="536" y="150" width="54" height="40" rx="4" class="fred"/><text x="563" y="175" text-anchor="middle" class="xs">t5→E1</text><rect x="600" y="150" width="54" height="40" rx="4" class="fblue"/><text x="627" y="175" text-anchor="middle" class="xs">t6→E3</text><rect x="664" y="150" width="54" height="40" rx="4" class="fred"/><text x="691" y="175" text-anchor="middle" class="xs">t7→E1</text><rect x="728" y="150" width="54" height="40" rx="4" class="fblue"/><text x="755" y="175" text-anchor="middle" class="xs">t8→E4</text><rect x="832" y="150" width="96" height="40" rx="4" fill="none" stroke="#94a3b8" stroke-width="1.5"/><rect x="836" y="154" width="40" height="32" rx="4" class="fgreen"/><rect x="880" y="154" width="40" height="32" rx="4" class="fgreen"/><text x="880" y="210" class="xs" text-anchor="middle">E1：2/2</text><rect x="944" y="150" width="96" height="40" rx="4" fill="none" stroke="#94a3b8" stroke-width="1.5"/><rect x="948" y="154" width="40" height="32" rx="4" class="fgreen"/><rect x="992" y="154" width="40" height="32" rx="4" class="fgray"/><text x="992" y="210" class="xs" text-anchor="middle">E2：1/2</text><rect x="1056" y="150" width="96" height="40" rx="4" fill="none" stroke="#94a3b8" stroke-width="1.5"/><rect x="1060" y="154" width="40" height="32" rx="4" class="fgreen"/><rect x="1104" y="154" width="40" height="32" rx="4" class="fgray"/><text x="1104" y="210" class="xs" text-anchor="middle">E3：1/2</text><rect x="1168" y="150" width="96" height="40" rx="4" fill="none" stroke="#94a3b8" stroke-width="1.5"/><rect x="1172" y="154" width="40" height="32" rx="4" class="fgreen"/><rect x="1216" y="154" width="40" height="32" rx="4" class="fgray"/><text x="1216" y="210" class="xs" text-anchor="middle">E4：1/2</text>
<text x="32" y="286" class="t">容量因子 1.25</text><rect x="280" y="260" width="54" height="40" rx="4" class="fblue"/><text x="307" y="285" text-anchor="middle" class="xs">t1→E1</text><rect x="344" y="260" width="54" height="40" rx="4" class="fblue"/><text x="371" y="285" text-anchor="middle" class="xs">t2→E1</text><rect x="408" y="260" width="54" height="40" rx="4" class="fblue"/><text x="435" y="285" text-anchor="middle" class="xs">t3→E1</text><rect x="472" y="260" width="54" height="40" rx="4" class="fblue"/><text x="499" y="285" text-anchor="middle" class="xs">t4→E2</text><rect x="536" y="260" width="54" height="40" rx="4" class="fred"/><text x="563" y="285" text-anchor="middle" class="xs">t5→E1</text><rect x="600" y="260" width="54" height="40" rx="4" class="fblue"/><text x="627" y="285" text-anchor="middle" class="xs">t6→E3</text><rect x="664" y="260" width="54" height="40" rx="4" class="fred"/><text x="691" y="285" text-anchor="middle" class="xs">t7→E1</text><rect x="728" y="260" width="54" height="40" rx="4" class="fblue"/><text x="755" y="285" text-anchor="middle" class="xs">t8→E4</text><rect x="832" y="260" width="96" height="40" rx="4" fill="none" stroke="#94a3b8" stroke-width="1.5"/><rect x="836" y="264" width="25.333333333333332" height="32" rx="4" class="fgreen"/><rect x="865.3333333333334" y="264" width="25.333333333333332" height="32" rx="4" class="fgreen"/><rect x="894.6666666666666" y="264" width="25.333333333333332" height="32" rx="4" class="fgreen"/><text x="880" y="320" class="xs" text-anchor="middle">E1：3/3</text><rect x="944" y="260" width="96" height="40" rx="4" fill="none" stroke="#94a3b8" stroke-width="1.5"/><rect x="948" y="264" width="25.333333333333332" height="32" rx="4" class="fgreen"/><rect x="977.3333333333334" y="264" width="25.333333333333332" height="32" rx="4" class="fgray"/><rect x="1006.6666666666666" y="264" width="25.333333333333332" height="32" rx="4" class="fgray"/><text x="992" y="320" class="xs" text-anchor="middle">E2：1/3</text><rect x="1056" y="260" width="96" height="40" rx="4" fill="none" stroke="#94a3b8" stroke-width="1.5"/><rect x="1060" y="264" width="25.333333333333332" height="32" rx="4" class="fgreen"/><rect x="1089.3333333333333" y="264" width="25.333333333333332" height="32" rx="4" class="fgray"/><rect x="1118.6666666666667" y="264" width="25.333333333333332" height="32" rx="4" class="fgray"/><text x="1104" y="320" class="xs" text-anchor="middle">E3：1/3</text><rect x="1168" y="260" width="96" height="40" rx="4" fill="none" stroke="#94a3b8" stroke-width="1.5"/><rect x="1172" y="264" width="25.333333333333332" height="32" rx="4" class="fgreen"/><rect x="1201.3333333333333" y="264" width="25.333333333333332" height="32" rx="4" class="fgray"/><rect x="1230.6666666666667" y="264" width="25.333333333333332" height="32" rx="4" class="fgray"/><text x="1216" y="320" class="xs" text-anchor="middle">E4：1/3</text>
<g data-node="fix"><rect x="32" y="380" width="600" height="148" rx="8" class="green"/><text x="50" y="416" class="t">不丢 token 的做法</text><text x="50" y="444" class="s">训练时让负载本身均衡：辅助损失或偏置调整</text><text x="50" y="467" class="s">推理时按实际负载分配：DeepSeek-V3 训练和推理都不丢</text><text x="50" y="490" class="s">代价：热门专家所在的卡更忙，其他卡要等它</text></g>
<g data-node="cost"><rect x="664" y="380" width="624" height="148" rx="8" class="red"/><text x="682" y="416" class="t">丢 token 的代价</text><text x="682" y="444" class="s">这一层对该 token 等于什么都没做</text><text x="682" y="467" class="s">训练时影响学习，推理时同一句话的结果会随</text><text x="682" y="490" class="s">同批其他请求变化，难复现</text></g>
</svg>
