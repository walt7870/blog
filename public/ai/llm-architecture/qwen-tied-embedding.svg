<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="580" viewBox="0 0 1400 580" role="img" aria-labelledby="qwen-tied-embedding-title qwen-tied-embedding-desc" id="qwen-tied-embedding-root">
<title id="qwen-tied-embedding-title">词嵌入在小模型和大模型中的参数占比</title>
<desc id="qwen-tied-embedding-desc">五条横条把模型参数按词嵌入、解码器层、输出层分开：Qwen2.5-0.5B 共享词嵌入时词嵌入占 27.6%，同一结构如果不共享，输入输出两张表合计占 43.2%，总参数从 4.94 亿增到 6.30 亿；Qwen3-0.6B 共享时占 26.1%；Llama-3.2-1B 共享时占 21.3%；Qwen3-8B 不共享，两张表各占 7.6%。</desc>
<defs><style>
#qwen-tied-embedding-root text { font-family: Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #172b3a; }
#qwen-tied-embedding-root .h { font-size: 26px; font-weight: 700; }
#qwen-tied-embedding-root .t { font-size: 19px; font-weight: 600; }
#qwen-tied-embedding-root .s { font-size: 15px; fill: #475569; }
#qwen-tied-embedding-root .xs { font-size: 13px; fill: #64748b; }
#qwen-tied-embedding-root .k { font-size: 13px; font-weight: 700; letter-spacing: .04em; fill: #64748b; }
#qwen-tied-embedding-root .m { font-family: 'SFMono-Regular', Menlo, Consolas, monospace; font-size: 14px; fill: #172b3a; }
#qwen-tied-embedding-root .node { fill: #fff; stroke: #cbd5e1; stroke-width: 2; }
#qwen-tied-embedding-root .blue { fill: #eff6ff; stroke: #60a5fa; stroke-width: 2; }
#qwen-tied-embedding-root .green { fill: #ecfdf5; stroke: #20a28c; stroke-width: 2; }
#qwen-tied-embedding-root .red { fill: #fff1f2; stroke: #e88191; stroke-width: 2; }
#qwen-tied-embedding-root .amber { fill: #fffbeb; stroke: #e0a63a; stroke-width: 2; }
#qwen-tied-embedding-root .violet { fill: #f5f3ff; stroke: #9b87f5; stroke-width: 2; }
#qwen-tied-embedding-root .gray { fill: #f1f5f9; stroke: #cbd5e1; stroke-width: 2; }
#qwen-tied-embedding-root .fblue { fill: #93c5fd; } #qwen-tied-embedding-root .fgreen { fill: #6ee7b7; } #qwen-tied-embedding-root .fred { fill: #fda4af; }
#qwen-tied-embedding-root .famber { fill: #fcd34d; } #qwen-tied-embedding-root .fviolet { fill: #c4b5fd; } #qwen-tied-embedding-root .fgray { fill: #e2e8f0; }
#qwen-tied-embedding-root .edge { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#qwen-tied-embedding-arrow); }
#qwen-tied-embedding-root .dash { fill: none; stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 7 6; marker-end: url(#qwen-tied-embedding-arrow); }
#qwen-tied-embedding-root .line { stroke: #cbd5e1; stroke-width: 1.5; fill: none; }
#qwen-tied-embedding-root .axis { stroke: #64748b; stroke-width: 2; fill: none; }
</style><marker id="qwen-tied-embedding-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker></defs>
<rect width="1400" height="580" fill="#f8fafc"/>
<text x="32" y="46" class="h">为什么小模型共享词嵌入：一张 15 万行的表有多重</text>
<text x="32" y="78" class="s">每条按各自总参数归一到 100%；右侧是总参数。数字按 config.json 逐项计算。</text>
<text x="32" y="158" class="t">Qwen2.5-0.5B（共享）</text>
<rect x="330" y="128" width="248.00215357374836" height="46" rx="4" class="fblue"/><text x="454.0010767868742" y="156" text-anchor="middle" class="s">词嵌入 27.6%</text>
<rect x="578.0021535737484" y="128" width="651.9978464262516" height="46" rx="4" class="fgray"/><text x="904.0010767868741" y="156" text-anchor="middle" class="s">解码器层 72.4%</text>
<text x="1246" y="158" class="m">0.49B</text>
<text x="32" y="240" class="t">同一结构若不共享</text>
<rect x="330" y="210" width="194.42641071843155" height="46" rx="4" class="fblue"/><text x="427.21320535921575" y="238" text-anchor="middle" class="s">词嵌入 21.6%</text>
<rect x="524.4264107184315" y="210" width="511.14717856313695" height="46" rx="4" class="fgray"/><text x="780" y="238" text-anchor="middle" class="s">解码器层 56.8%</text>
<rect x="1035.5735892815685" y="210" width="194.42641071843155" height="46" rx="4" class="famber"/><text x="1132.7867946407844" y="238" text-anchor="middle" class="s">输出层 21.6%</text>
<text x="1246" y="240" class="m">0.63B</text>
<text x="32" y="322" class="t">Qwen3-0.6B（共享）</text>
<rect x="330" y="292" width="234.9202858713579" height="46" rx="4" class="fblue"/><text x="447.46014293567896" y="320" text-anchor="middle" class="s">词嵌入 26.1%</text>
<rect x="564.9202858713579" y="292" width="665.0797141286421" height="46" rx="4" class="fgray"/><text x="897.460142935679" y="320" text-anchor="middle" class="s">解码器层 73.9%</text>
<text x="1246" y="322" class="m">0.60B</text>
<text x="32" y="404" class="t">Llama-3.2-1B（共享）</text>
<rect x="330" y="374" width="191.29204126444878" height="46" rx="4" class="fblue"/><text x="425.6460206322244" y="402" text-anchor="middle" class="s">词嵌入 21.3%</text>
<rect x="521.2920412644488" y="374" width="708.7079587355512" height="46" rx="4" class="fgray"/><text x="875.6460206322245" y="402" text-anchor="middle" class="s">解码器层 78.7%</text>
<text x="1246" y="404" class="m">1.24B</text>
<text x="32" y="486" class="t">Qwen3-8B（不共享）</text>
<rect x="330" y="456" width="68.38175643364944" height="46" rx="4" class="fblue"/>
<text x="330" y="522" class="xs">词嵌入 7.6%</text>
<rect x="398.38175643364946" y="456" width="763.2364871327011" height="46" rx="4" class="fgray"/><text x="780" y="484" text-anchor="middle" class="s">解码器层 84.8%</text>
<rect x="1161.6182435663504" y="456" width="68.38175643364944" height="46" rx="4" class="famber"/>
<text x="1246" y="486" class="m">8.19B</text>
<text x="1195.8091217831752" y="522" class="xs" text-anchor="middle">输出层 7.6%</text>
<text x="32" y="552" class="s">共享时输出层直接复用词嵌入矩阵，不占额外参数；但每个 token 的输出层矩阵乘法照算，省的是显存和权重，不是计算。</text>
</svg>
