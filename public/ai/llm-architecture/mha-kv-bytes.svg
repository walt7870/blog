<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="mha-kv-bytes-title mha-kv-bytes-desc" id="mha-kv-bytes-root">
<title id="mha-kv-bytes-title">不同注意力结构每个 token 的 KV Cache 字节数</title>
<desc id="mha-kv-bytes-desc">BF16 下每 token 的 KV Cache：Llama-3.1-8B 若用 MHA 为 512 KiB，实际 GQA 为 128 KiB，若用 MQA 为 16 KiB；DeepSeek-V3 的 MLA 为 68.6 KiB。DeepSeek-V3 若用 128 头 MHA 约为 4880 KiB，是 MLA 的 71 倍。</desc>
<defs><style>
#mha-kv-bytes-root text { font-family: Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #172b3a; }
#mha-kv-bytes-root .h { font-size: 26px; font-weight: 700; }
#mha-kv-bytes-root .t { font-size: 19px; font-weight: 600; }
#mha-kv-bytes-root .s { font-size: 15px; fill: #475569; }
#mha-kv-bytes-root .xs { font-size: 13px; fill: #64748b; }
#mha-kv-bytes-root .k { font-size: 13px; font-weight: 700; letter-spacing: .04em; fill: #64748b; }
#mha-kv-bytes-root .m { font-family: 'SFMono-Regular', Menlo, Consolas, monospace; font-size: 14px; fill: #172b3a; }
#mha-kv-bytes-root .node { fill: #fff; stroke: #cbd5e1; stroke-width: 2; }
#mha-kv-bytes-root .blue { fill: #eff6ff; stroke: #60a5fa; stroke-width: 2; }
#mha-kv-bytes-root .green { fill: #ecfdf5; stroke: #20a28c; stroke-width: 2; }
#mha-kv-bytes-root .red { fill: #fff1f2; stroke: #e88191; stroke-width: 2; }
#mha-kv-bytes-root .amber { fill: #fffbeb; stroke: #e0a63a; stroke-width: 2; }
#mha-kv-bytes-root .violet { fill: #f5f3ff; stroke: #9b87f5; stroke-width: 2; }
#mha-kv-bytes-root .gray { fill: #f1f5f9; stroke: #cbd5e1; stroke-width: 2; }
#mha-kv-bytes-root .fblue { fill: #93c5fd; } #mha-kv-bytes-root .fgreen { fill: #6ee7b7; } #mha-kv-bytes-root .fred { fill: #fda4af; }
#mha-kv-bytes-root .famber { fill: #fcd34d; } #mha-kv-bytes-root .fviolet { fill: #c4b5fd; } #mha-kv-bytes-root .fgray { fill: #e2e8f0; }
#mha-kv-bytes-root .edge { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#mha-kv-bytes-arrow); }
#mha-kv-bytes-root .dash { fill: none; stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 7 6; marker-end: url(#mha-kv-bytes-arrow); }
#mha-kv-bytes-root .line { stroke: #cbd5e1; stroke-width: 1.5; fill: none; }
#mha-kv-bytes-root .axis { stroke: #64748b; stroke-width: 2; fill: none; }
</style><marker id="mha-kv-bytes-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker></defs>
<rect width="1200" height="610" fill="#f8fafc"/>
<text x="32" y="46" class="h">每多一个 token，KV Cache 增加多少</text>
<text x="32" y="78" class="s">条形长度按字节数等比例绘制（BF16）。右侧数字同时给出 32,768 个 token 的总量。</text>
<text x="32" y="148" class="t">Llama-3.1-8B 换成 MHA</text><text x="32" y="174" class="xs">32 层 × 32 个 KV 头 × 128 维 × 2（K、V）</text><rect x="470" y="128" width="460" height="40" rx="4" class="fred"/><text x="942" y="154" class="s">512 KiB · 32K 上下文 16 GiB</text><text x="32" y="240" class="t">Llama-3.1-8B 实际 GQA</text><text x="32" y="266" class="xs">32 层 × 8 个 KV 头 × 128 维 × 2</text><rect x="470" y="220" width="115" height="40" rx="4" class="fblue"/><text x="597" y="246" class="s">128 KiB · 32K 上下文 4 GiB</text><text x="32" y="332" class="t">Llama-3.1-8B 换成 MQA</text><text x="32" y="358" class="xs">32 层 × 1 个 KV 头 × 128 维 × 2</text><rect x="470" y="312" width="14.375" height="40" rx="4" class="fgray"/><text x="496.375" y="338" class="s">16 KiB · 32K 上下文 0.5 GiB</text><text x="32" y="424" class="t">DeepSeek-V3 MLA</text><text x="32" y="450" class="xs">61 层 × (512 + 64) 个数，所有头共用</text><rect x="470" y="404" width="61.6552734375" height="40" rx="4" class="fgreen"/><text x="543.6552734375" y="430" class="s">68.6 KiB · 32K 上下文 2.1 GiB</text><path d="M470 116V490" class="axis"/><g data-node="note"><rect x="32" y="500" width="1136" height="86" rx="8" class="amber"/><text x="50" y="536" class="t">DeepSeek-V3 若用普通 MHA：每 token 约 4,880 KiB（4.77 MiB），是 MLA 的 71 倍</text><text x="50" y="564" class="s">61 层 × 128 个头 × (K 192 维 + V 128 维) × 2 字节。条形超出画幅，未画出；全部按 BF16、每个数 2 字节计。</text></g>
</svg>
