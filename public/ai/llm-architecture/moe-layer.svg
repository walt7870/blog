<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="700" viewBox="0 0 1320 700" role="img" aria-labelledby="moe-layer-title moe-layer-desc" id="moe-layer-root">
<title id="moe-layer-title">稠密 FFN 与 MoE 层的对比</title>
<desc id="moe-layer-desc">左边稠密模型每个 token 都经过同一个大 FFN；右边 MoE 层先由路由器给 8 个专家打分，只选分数最高的 2 个专家计算，再按归一化后的权重相加；DeepSeek 和 Qwen3.5 还加一个所有 token 都经过的共享专家。输入输出形状都是 [序列长度, 4096]。</desc>
<defs><style>
#moe-layer-root text { font-family: Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #172b3a; }
#moe-layer-root .h { font-size: 26px; font-weight: 700; }
#moe-layer-root .t { font-size: 19px; font-weight: 600; }
#moe-layer-root .s { font-size: 15px; fill: #475569; }
#moe-layer-root .xs { font-size: 13px; fill: #64748b; }
#moe-layer-root .k { font-size: 13px; font-weight: 700; letter-spacing: .04em; fill: #64748b; }
#moe-layer-root .m { font-family: 'SFMono-Regular', Menlo, Consolas, monospace; font-size: 14px; fill: #172b3a; }
#moe-layer-root .node { fill: #fff; stroke: #cbd5e1; stroke-width: 2; }
#moe-layer-root .blue { fill: #eff6ff; stroke: #60a5fa; stroke-width: 2; }
#moe-layer-root .green { fill: #ecfdf5; stroke: #20a28c; stroke-width: 2; }
#moe-layer-root .red { fill: #fff1f2; stroke: #e88191; stroke-width: 2; }
#moe-layer-root .amber { fill: #fffbeb; stroke: #e0a63a; stroke-width: 2; }
#moe-layer-root .violet { fill: #f5f3ff; stroke: #9b87f5; stroke-width: 2; }
#moe-layer-root .gray { fill: #f1f5f9; stroke: #cbd5e1; stroke-width: 2; }
#moe-layer-root .fblue { fill: #93c5fd; } #moe-layer-root .fgreen { fill: #6ee7b7; } #moe-layer-root .fred { fill: #fda4af; }
#moe-layer-root .famber { fill: #fcd34d; } #moe-layer-root .fviolet { fill: #c4b5fd; } #moe-layer-root .fgray { fill: #e2e8f0; }
#moe-layer-root .edge { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#moe-layer-arrow); }
#moe-layer-root .dash { fill: none; stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 7 6; marker-end: url(#moe-layer-arrow); }
#moe-layer-root .line { stroke: #cbd5e1; stroke-width: 1.5; fill: none; }
#moe-layer-root .axis { stroke: #64748b; stroke-width: 2; fill: none; }
</style><marker id="moe-layer-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker></defs>
<rect width="1320" height="700" fill="#f8fafc"/>
<text x="32" y="46" class="h">同一个位置，稠密 FFN 与 MoE 层各做了什么</text>
<text x="32" y="78" class="s">形状不变：进来 [序列长度, 4096]，出去 [序列长度, 4096]；变的是中间经过哪些参数。</text>
<g data-node="dense"><rect x="32" y="112" width="380" height="556" rx="8" class="node"/><text x="50" y="138" class="k">稠密：Llama-3.1-8B 的 FFN</text></g>
<rect x="72" y="160" width="300" height="44" rx="4" class="fblue"/><text x="222" y="187" text-anchor="middle" class="s">“年假”的向量 [4096]</text>
<path d="M222 204V244" class="edge"/>
<g data-node="ffn"><rect x="72" y="248" width="300" height="168" rx="8" class="blue"/><text x="90" y="284" class="t">一个 SwiGLU FFN</text><text x="90" y="312" class="s">gate / up：4096 → 14336</text><text x="90" y="335" class="s">down：14336 → 4096</text><text x="90" y="358" class="s">1.76 亿参数，每个 token 都用</text></g>
<path d="M222 416V456" class="edge"/>
<rect x="72" y="460" width="300" height="44" rx="4" class="fblue"/><text x="222" y="487" text-anchor="middle" class="s">输出 [4096]，加回残差流</text>
<text x="72" y="616" class="s">每层 FFN 参数全部参与计算</text>
<text x="72" y="642" class="s">计算量 ∝ 总参数</text>
<g data-node="moe"><rect x="444" y="112" width="844" height="556" rx="8" class="node"/><text x="462" y="138" class="k">MoE：Mixtral-8x7B 一层（top-2 / 8 个专家）</text></g>
<rect x="484" y="160" width="300" height="44" rx="4" class="fblue"/><text x="634" y="187" text-anchor="middle" class="s">“年假”的向量 [4096]</text>
<path d="M634 204V236" class="edge"/>
<g data-node="router"><rect x="484" y="240" width="300" height="96" rx="8" class="violet"/><text x="502" y="276" class="t">路由器 [4096] → [8]</text><text x="502" y="304" class="s">softmax 后取最大的 2 个</text></g>
<rect x="820" y="240" width="440" height="96" rx="4" class="fgray"/>
<text x="836" y="268" class="xs">8 个分数（softmax 后）</text>
<rect x="840" y="276" width="36" height="50" rx="4" class="famber"/><text x="858" y="326" class="xs"></text>
<rect x="892" y="320" width="36" height="6" rx="4" class="fviolet"/><text x="910" y="326" class="xs"></text>
<rect x="944" y="322" width="36" height="4" rx="4" class="fviolet"/><text x="962" y="326" class="xs"></text>
<rect x="996" y="291" width="36" height="35" rx="4" class="famber"/><text x="1014" y="326" class="xs"></text>
<rect x="1048" y="316" width="36" height="10" rx="4" class="fviolet"/><text x="1066" y="326" class="xs"></text>
<rect x="1100" y="319" width="36" height="7" rx="4" class="fviolet"/><text x="1118" y="326" class="xs"></text>
<rect x="1152" y="321" width="36" height="5" rx="4" class="fviolet"/><text x="1170" y="326" class="xs"></text>
<rect x="1204" y="322" width="36" height="4" rx="4" class="fviolet"/><text x="1222" y="326" class="xs"></text>
<path d="M634 336V384" class="edge"/>
<rect x="484" y="388" width="56" height="64" rx="4" class="famber"/><text x="512" y="425" text-anchor="middle" class="m">E1</text><rect x="550" y="388" width="56" height="64" rx="4" class="fgray"/><text x="578" y="425" text-anchor="middle" class="m">E2</text><rect x="616" y="388" width="56" height="64" rx="4" class="fgray"/><text x="644" y="425" text-anchor="middle" class="m">E3</text><rect x="682" y="388" width="56" height="64" rx="4" class="famber"/><text x="710" y="425" text-anchor="middle" class="m">E4</text><rect x="748" y="388" width="56" height="64" rx="4" class="fgray"/><text x="776" y="425" text-anchor="middle" class="m">E5</text><rect x="814" y="388" width="56" height="64" rx="4" class="fgray"/><text x="842" y="425" text-anchor="middle" class="m">E6</text><rect x="880" y="388" width="56" height="64" rx="4" class="fgray"/><text x="908" y="425" text-anchor="middle" class="m">E7</text><rect x="946" y="388" width="56" height="64" rx="4" class="fgray"/><text x="974" y="425" text-anchor="middle" class="m">E8</text>
<text x="484" y="616" class="s">只算 E1 和 E4：每个专家与稠密 FFN 同样大小（1.76 亿参数）</text>
<text x="484" y="642" class="s">其余 6 个专家的权重留在显存里，这一步不参与计算</text>
<path d="M512 452V508" class="edge"/>
<path d="M710 452V508" class="edge"/>
<g data-node="sum"><rect x="484" y="512" width="520" height="64" rx="8" class="amber"/><text x="502" y="548" class="t">0.59 × E1(x) + 0.41 × E4(x) → 输出 [4096]</text></g>
<g data-node="shared"><rect x="1032" y="388" width="228" height="188" rx="8" class="green"/><text x="1050" y="414" class="k">可选</text><text x="1050" y="440" class="t">共享专家</text><text x="1050" y="468" class="s">DeepSeek-V3、Qwen3.5</text><text x="1050" y="491" class="s">每个 token 都经过</text><text x="1050" y="514" class="s">结果直接加到</text><text x="1050" y="537" class="s">路由专家的输出上</text></g>
</svg>
