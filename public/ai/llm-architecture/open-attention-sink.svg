<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="536" viewBox="0 0 1300 536" role="img" aria-labelledby="open-attention-sink-title open-attention-sink-desc" id="open-attention-sink-root">
<title id="open-attention-sink-title">gpt-oss 的注意力汇聚项</title>
<desc id="open-attention-sink-desc">“？”对前面四个 token 的分数为 1.0、0.2、2.0、0.5。普通 softmax 后四个权重和为 1；gpt-oss 在 softmax 的分母里多加一个可学习的汇聚分数 1.5，四个权重按比例缩小，合计约 0.74，剩下约 0.26 不分给任何 token。</desc>
<defs><style>
#open-attention-sink-root text { font-family: Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #172b3a; }
#open-attention-sink-root .h { font-size: 26px; font-weight: 700; }
#open-attention-sink-root .t { font-size: 19px; font-weight: 600; }
#open-attention-sink-root .s { font-size: 15px; fill: #475569; }
#open-attention-sink-root .xs { font-size: 13px; fill: #64748b; }
#open-attention-sink-root .k { font-size: 13px; font-weight: 700; letter-spacing: .04em; fill: #64748b; }
#open-attention-sink-root .m { font-family: 'SFMono-Regular', Menlo, Consolas, monospace; font-size: 14px; fill: #172b3a; }
#open-attention-sink-root .node { fill: #fff; stroke: #cbd5e1; stroke-width: 2; }
#open-attention-sink-root .blue { fill: #eff6ff; stroke: #60a5fa; stroke-width: 2; }
#open-attention-sink-root .green { fill: #ecfdf5; stroke: #20a28c; stroke-width: 2; }
#open-attention-sink-root .red { fill: #fff1f2; stroke: #e88191; stroke-width: 2; }
#open-attention-sink-root .amber { fill: #fffbeb; stroke: #e0a63a; stroke-width: 2; }
#open-attention-sink-root .violet { fill: #f5f3ff; stroke: #9b87f5; stroke-width: 2; }
#open-attention-sink-root .gray { fill: #f1f5f9; stroke: #cbd5e1; stroke-width: 2; }
#open-attention-sink-root .fblue { fill: #93c5fd; } #open-attention-sink-root .fgreen { fill: #6ee7b7; } #open-attention-sink-root .fred { fill: #fda4af; }
#open-attention-sink-root .famber { fill: #fcd34d; } #open-attention-sink-root .fviolet { fill: #c4b5fd; } #open-attention-sink-root .fgray { fill: #e2e8f0; }
#open-attention-sink-root .edge { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#open-attention-sink-arrow); }
#open-attention-sink-root .dash { fill: none; stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 7 6; marker-end: url(#open-attention-sink-arrow); }
#open-attention-sink-root .line { stroke: #cbd5e1; stroke-width: 1.5; fill: none; }
#open-attention-sink-root .axis { stroke: #64748b; stroke-width: 2; fill: none; }
</style><marker id="open-attention-sink-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker></defs>
<rect width="1300" height="536" fill="#f8fafc"/>
<text x="32" y="46" class="h">gpt-oss：每个头多一个“哪里都不看”的选项</text>
<text x="32" y="78" class="s">示意数字：“？”这个位置对前面 4 个 token 的注意力分数。条形长度与权重成正比。</text>
<text x="32" y="150" class="t">注意力分数</text><text x="32" y="236" class="t">普通 softmax</text><text x="32" y="258" class="xs">权重和 = 1</text><text x="32" y="336" class="t">加汇聚项</text><text x="32" y="358" class="xs">权重和 &lt; 1</text><text x="320" y="116" class="s" text-anchor="middle">年假</text><rect x="260" y="126" width="120" height="40" rx="4" class="fgray"/><text x="320" y="151" text-anchor="middle" class="m">1.0</text><rect x="260" y="212" width="41.89234902206607" height="40" rx="4" class="fblue"/><text x="260" y="278" class="xs">0.209</text><rect x="260" y="312" width="31.138762982454864" height="40" rx="4" class="fgreen"/><text x="260" y="378" class="xs">0.156</text><text x="470" y="116" class="s" text-anchor="middle">怎么</text><rect x="410" y="126" width="120" height="40" rx="4" class="fgray"/><text x="470" y="151" text-anchor="middle" class="m">0.2</text><rect x="410" y="212" width="18.82344579052205" height="40" rx="4" class="fblue"/><text x="410" y="278" class="xs">0.094</text><rect x="410" y="312" width="13.99154811479813" height="40" rx="4" class="fgreen"/><text x="410" y="378" class="xs">0.070</text><text x="620" y="116" class="s" text-anchor="middle">申请</text><rect x="560" y="126" width="120" height="40" rx="4" class="fgray"/><text x="620" y="151" text-anchor="middle" class="m">2.0</text><rect x="560" y="212" width="113.87521109814627" height="40" rx="4" class="fblue"/><text x="560" y="278" class="xs">0.569</text><rect x="560" y="312" width="84.64393357590025" height="40" rx="4" class="fgreen"/><text x="560" y="378" class="xs">0.423</text><text x="770" y="116" class="s" text-anchor="middle">？</text><rect x="710" y="126" width="120" height="40" rx="4" class="fgray"/><text x="770" y="151" text-anchor="middle" class="m">0.5</text><rect x="710" y="212" width="25.40899408926563" height="40" rx="4" class="fblue"/><text x="710" y="278" class="xs">0.127</text><rect x="710" y="312" width="18.88661445438368" height="40" rx="4" class="fgreen"/><text x="710" y="378" class="xs">0.094</text><text x="950" y="116" class="s" text-anchor="middle">汇聚项</text><rect x="890" y="126" width="120" height="40" rx="4" class="famber"/><text x="950" y="151" text-anchor="middle" class="m">1.5</text><rect x="890" y="312" width="51.3391408724631" height="40" rx="4" class="famber"/><text x="890" y="378" class="xs">0.257（丢弃）</text><g data-node="sink-note"><rect x="32" y="410" width="1236" height="100" rx="8" class="gray"/><text x="50" y="436" class="k">算法</text><text x="50" y="464" class="s">分母多一项 e^1.5：四个权重从合计 1 变成合计 0.743，相对大小不变，被“汇聚项”分走的那部分不读任何 V。</text><text x="50" y="488" class="s">这个分数是每个头一个可学习参数（gpt-oss 的 sinks），不对应任何 token，也不进 KV Cache。</text></g>
</svg>
