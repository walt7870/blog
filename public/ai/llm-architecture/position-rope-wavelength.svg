<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="620" viewBox="0 0 1240 620" role="img" aria-labelledby="position-rope-wavelength-title position-rope-wavelength-desc" id="position-rope-wavelength-root">
<title id="position-rope-wavelength-title">Llama-3.1-8B 的 64 个 RoPE 频率对的波长与 llama3 分频缩放</title>
<desc id="position-rope-wavelength-desc">head_dim 128 分成 64 个频率对，rope_theta 500000 时波长从约 6.3 个位置增长到约 256 万个位置，在对数刻度上是一条直线。llama3 缩放把原始训练长度 8192 作为分界：波长小于 2048 的 29 个高频对不变，波长大于 8192 的 29 个低频对频率除以 8，中间 6 对在两者之间平滑过渡。</desc>
<defs><style>
#position-rope-wavelength-root text { font-family: Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #172b3a; }
#position-rope-wavelength-root .h { font-size: 26px; font-weight: 700; }
#position-rope-wavelength-root .t { font-size: 19px; font-weight: 600; }
#position-rope-wavelength-root .s { font-size: 15px; fill: #475569; }
#position-rope-wavelength-root .xs { font-size: 13px; fill: #64748b; }
