#position-rope-wavelength-root .m { font-family: 'SFMono-Regular', Menlo, Consolas, monospace; font-size: 14px; fill: #172b3a; }
#position-rope-wavelength-root .node { fill: #fff; stroke: #cbd5e1; stroke-width: 2; }
#position-rope-wavelength-root .blue { fill: #eff6ff; stroke: #60a5fa; stroke-width: 2; }
#position-rope-wavelength-root .green { fill: #ecfdf5; stroke: #20a28c; stroke-width: 2; }
#position-rope-wavelength-root .red { fill: #fff1f2; stroke: #e88191; stroke-width: 2; }
#position-rope-wavelength-root .amber { fill: #fffbeb; stroke: #e0a63a; stroke-width: 2; }
#position-rope-wavelength-root .violet { fill: #f5f3ff; stroke: #9b87f5; stroke-width: 2; }
#position-rope-wavelength-root .gray { fill: #f1f5f9; stroke: #cbd5e1; stroke-width: 2; }
#position-rope-wavelength-root .fblue { fill: #93c5fd; } #position-rope-wavelength-root .fgreen { fill: #6ee7b7; } #position-rope-wavelength-root .fred { fill: #fda4af; }
#position-rope-wavelength-root .famber { fill: #fcd34d; } #position-rope-wavelength-root .fviolet { fill: #c4b5fd; } #position-rope-wavelength-root .fgray { fill: #e2e8f0; }
#position-rope-wavelength-root .edge { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#position-rope-wavelength-arrow); }
#position-rope-wavelength-root .dash { fill: none; stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 7 6; marker-end: url(#position-rope-wavelength-arrow); }
#position-rope-wavelength-root .line { stroke: #cbd5e1; stroke-width: 1.5; fill: none; }
#position-rope-wavelength-root .axis { stroke: #64748b; stroke-width: 2; fill: none; }
</style><marker id="position-rope-wavelength-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker></defs>
<rect width="1240" height="620" fill="#f8fafc"/>
<text x="32" y="46" class="h">64 个频率对：快的数“隔几个字”，慢的数“隔几千字”</text>
<text x="32" y="78" class="s">Llama-3.1-8B，head_dim 128，rope_theta 500000。llama3 缩放只拉长慢的那部分频率，快的保持原样。</text>
