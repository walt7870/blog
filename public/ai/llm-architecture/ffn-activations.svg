<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" role="img" aria-labelledby="ffn-activations-title ffn-activations-desc" id="ffn-activations-root">
<title id="ffn-activations-title">ReLU、GELU、SiLU 三种激活函数与 SwiGLU 手算</title>
<desc id="ffn-activations-desc">左图在 -4 到 4 之间画出 ReLU、GELU 和 SiLU：三者在正数一侧都接近直线，负数一侧 ReLU 直接为 0，GELU 和 SiLU 平滑并允许小的负值。右侧手算 d=2、d_ff=3 的 SwiGLU：gate [1,2,-1]、SiLU 后 [0.731,1.762,-0.269]、up [3,0.5,4]、相乘得 [2.193,0.881,-1.076]，经 W_d 得 [1.117,1.957]。</desc>
<defs><style>
