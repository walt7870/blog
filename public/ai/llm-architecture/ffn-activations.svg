oke-width="3"/><text x="82" y="466" class="s">GELU：负数一侧平滑地趋近 0</text><path d="M40 490H72" fill="none" stroke="#2563eb" stroke-width="3"/><text x="82" y="496" class="s">SiLU = z·sigmoid(z)：-1 处约 -0.27</text><g data-node="toy"><rect x="540" y="104" width="628" height="330" rx="8" class="node"/><text x="558" y="130" class="k">矩阵见正文</text><text x="558" y="156" class="t">手算一次 SwiGLU（d = 2，d_ff = 3）</text><text x="558" y="184" class="s">x = [1, 2]</text><text x="558" y="207" class="s">gate = x·W_g = [1, 2, -1]</text><text x="558" y="230" class="s">SiLU(gate) = [0.731, 1.762, -0.269]</text><text x="558" y="253" class="s">up = x·W_u = [3, 0.5, 4]</text><text x="558" y="276" class="s">h = SiLU(gate) ⊙ up = [2.193, 0.881, -1.076]</text><text x="558" y="299" class="s">y = h·W_d = [1.117, 1.957]</text><text x="558" y="322" class="s"></text><text x="558" y="345" class="s">第 2 个中间单元：门值 1.762 大，但 up 只有 0.5；</text><text x="558" y="368" class="s">第 3 个中间单元：up 有 4，门值 -0.269 把它压小并变号。</text><text x="558" y="391" class="s">每个中间单元的输出 = 门的开合程度 × 值的大小。</text></g>
</svg>
