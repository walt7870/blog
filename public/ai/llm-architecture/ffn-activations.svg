#ffn-activations-root .violet { fill: #f5f3ff; stroke: #9b87f5; stroke-width: 2; }
#ffn-activations-root .gray { fill: #f1f5f9; stroke: #cbd5e1; stroke-width: 2; }
#ffn-activations-root .fblue { fill: #93c5fd; } #ffn-activations-root .fgreen { fill: #6ee7b7; } #ffn-activations-root .fred { fill: #fda4af; }
#ffn-activations-root .famber { fill: #fcd34d; } #ffn-activations-root .fviolet { fill: #c4b5fd; } #ffn-activations-root .fgray { fill: #e2e8f0; }
#ffn-activations-root .edge { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#ffn-activations-arrow); }
