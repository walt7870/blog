</style><marker id="ffn-activations-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker></defs>
<rect width="1200" height="540" fill="#f8fafc"/>
<text x="32" y="46" class="h">激活函数决定“哪些中间单元放行多少”</text>
<text x="32" y="78" class="s">左：三种激活函数的形状。右：SwiGLU 用一路线性结果当门，去调节另一路。</text>
