#ffn-activations-root .node { fill: #fff; stroke: #cbd5e1; stroke-width: 2; }
#ffn-activations-root .blue { fill: #eff6ff; stroke: #60a5fa; stroke-width: 2; }
#ffn-activations-root .green { fill: #ecfdf5; stroke: #20a28c; stroke-width: 2; }
