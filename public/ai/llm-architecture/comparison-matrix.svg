="628" width="18" height="18" rx="3" class="violet"/><text x="698" y="642" class="s">稀疏化：MoE 或 KV 压缩</text><rect x="992" y="628" width="18" height="18" rx="3" class="green"/><text x="1018" y="642" class="s">线性注意力混合</text>
