<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="686" viewBox="0 0 1360 686" role="img" aria-labelledby="comparison-matrix-title comparison-matrix-desc" id="comparison-matrix-root">
<title id="comparison-matrix-title">代表模型在四个模块上的选择</title>
<desc id="comparison-matrix-desc">八个代表模型在注意力与 KV、FFN、位置编码、稳定性四个模块上的选择：Llama-3.1-8B 全是基线配方；Qwen3 和 DeepSeek-V3 在 FFN 上改用 MoE，DeepSeek 还压缩了 KV；Gemma 3、gpt-oss、Llama 4 改为局部与全局层交替；Qwen3.5 用线性注意力混合；DeepSeek-V4 改用压缩注意力和多路残差。</desc>
<defs><style>
#comparison-matrix-root text { font-family: Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #172b3a; }
#comparison-matrix-root .h { font-size: 26px; font-weight: 700; }
#comparison-matrix-root .t { font-size: 19px; font-weight: 600; }
#comparison-matrix-root .s { font-size: 15px; fill: #475569; }
#comparison-matrix-root .xs { font-size: 13px; fill: #64748b; }
#comparison-matrix-root .k { font-size: 13px; font-weight: 700; letter-spacing: .04em; fill: #64748b; }
#comparison-matrix-root .m { font-family: 'SFMono-Regular', Menlo, Consolas, monospace; font-size: 14px; fill: #172b3a; }
#comparison-matrix-root .node { fill: #fff; stroke: #cbd5e1; stroke-width: 2; }
#comparison-matrix-root .blue { fill: #eff6ff; stroke: #60a5fa; stroke-width: 2; }
#comparison-matrix-root .green { fill: #ecfdf5; stroke: #20a28c; stroke-width: 2; }
#comparison-matrix-root .red { fill: #fff1f2; stroke: #e88191; stroke-width: 2; }
#comparison-matrix-root .amber { fill: #fffbeb; stroke: #e0a63a; stroke-width: 2; }
#comparison-matrix-root .violet { fill: #f5f3ff; stroke: #9b87f5; stroke-width: 2; }
#comparison-matrix-root .gray { fill: #f1f5f9; stroke: #cbd5e1; stroke-width: 2; }
#comparison-matrix-root .fblue { fill: #93c5fd; } #comparison-matrix-root .fgreen { fill: #6ee7b7; } #comparison-matrix-root .fred { fill: #fda4af; }
#comparison-matrix-root .famber { fill: #fcd34d; } #comparison-matrix-root .fviolet { fill: #c4b5fd; } #comparison-matrix-root .fgray { fill: #e2e8f0; }
#comparison-matrix-root .edge { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#comparison-matrix-arrow); }
#comparison-matrix-root .dash { fill: none; stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 7 6; marker-end: url(#comparison-matrix-arrow); }
#comparison-matrix-root .line { stroke: #cbd5e1; stroke-width: 1.5; fill: none; }
#comparison-matrix-root .axis { stroke: #64748b; stroke-width: 2; fill: none; }
</style><marker id="comparison-matrix-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker></defs>
<rect width="1360" height="686" fill="#f8fafc"/>
<text x="32" y="46" class="h">同一副骨架，四处不同的改法</text>
<text x="32" y="78" class="s">颜色表示与 Llama 式基线相比改在哪里；细节见各模型的单篇</text>
