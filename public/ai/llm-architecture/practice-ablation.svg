#practice-ablation-root .edge { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#practice-ablation-arrow); }
#practice-ablation-root .dash { fill: none; stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 7 6; marker-end: url(#practice-ablation-arrow); }
#practice-ablation-root .line { stroke: #cbd5e1; stroke-width: 1.5; fill: none; }
#practice-ablation-root .axis { stroke: #64748b; stroke-width: 2; fill: none; }
