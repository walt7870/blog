<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="600" viewBox="0 0 1320 600" role="img" aria-labelledby="practice-ablation-title practice-ablation-desc" id="practice-ablation-root">
<title id="practice-ablation-title">逐层置零注意力或 FFN 后的损失</title>
<desc id="practice-ablation-desc">把 Qwen2.5-0.5B-Instruct 某一层的注意力或 FFN 输出置零，测一句参考回答的交叉熵损失。去掉第 0 层 FFN 损失从 2.15 升到 13.97，第 0、1 层注意力和第 2 层 FFN 也影响很大；中间各层单独去掉几乎不变，但一次去掉 4—19 层的全部 FFN 或全部注意力，损失升到 9.36 和 8.19。</desc>
