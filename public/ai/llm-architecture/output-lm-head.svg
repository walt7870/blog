<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="600" viewBox="0 0 1320 600" role="img" aria-labelledby="output-lm-head-title output-lm-head-desc" id="output-lm-head-root">
<title id="output-lm-head-title">从最后一层隐藏向量到一个 token 的流程</title>
<desc id="output-lm-head-desc">第 32 层输出的最后一个位置向量 [1, 4096] 经过最终 RMSNorm，乘以输出层矩阵 4096×128256 得到 128256 个分数，这一段由模型结构和权重决定。之后的重复惩罚、温度、top-k、top-p、min-p、softmax 和抽样由解码参数决定，选出 token 110747“根据”，追加到输入末尾进入下一步。</desc>
<defs><style>
#output-lm-head-root text { font-family: Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #172b3a; }
#output-lm-head-root .h { font-size: 26px; font-weight: 700; }
#output-lm-head-root .t { font-size: 19px; font-weight: 600; }
#output-lm-head-root .s { font-size: 15px; fill: #475569; }
#output-lm-head-root .xs { font-size: 13px; fill: #64748b; }
#output-lm-head-root .k { font-size: 13px; font-weight: 700; letter-spacing: .04em; fill: #64748b; }
#output-lm-head-root .m { font-family: 'SFMono-Regular', Menlo, Consolas, monospace; font-size: 14px; fill: #172b3a; }
#output-lm-head-root .node { fill: #fff; stroke: #cbd5e1; stroke-width: 2; }
#output-lm-head-root .blue { fill: #eff6ff; stroke: #60a5fa; stroke-width: 2; }
#output-lm-head-root .green { fill: #ecfdf5; stroke: #20a28c; stroke-width: 2; }
#output-lm-head-root .red { fill: #fff1f2; stroke: #e88191; stroke-width: 2; }
#output-lm-head-root .amber { fill: #fffbeb; stroke: #e0a63a; stroke-width: 2; }
#output-lm-head-root .violet { fill: #f5f3ff; stroke: #9b87f5; stroke-width: 2; }
#output-lm-head-root .gray { fill: #f1f5f9; stroke: #cbd5e1; stroke-width: 2; }
#output-lm-head-root .fblue { fill: #93c5fd; } #output-lm-head-root .fgreen { fill: #6ee7b7; } #output-lm-head-root .fred { fill: #fda4af; }
#output-lm-head-root .famber { fill: #fcd34d; } #output-lm-head-root .fviolet { fill: #c4b5fd; } #output-lm-head-root .fgray { fill: #e2e8f0; }
#output-lm-head-root .edge { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#output-lm-head-arrow); }
#output-lm-head-root .dash { fill: none; stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 7 6; marker-end: url(#output-lm-head-arrow); }
#output-lm-head-root .line { stroke: #cbd5e1; stroke-width: 1.5; fill: none; }
#output-lm-head-root .axis { stroke: #64748b; stroke-width: 2; fill: none; }
</style><marker id="output-lm-head-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker></defs>
<rect width="1320" height="600" fill="#f8fafc"/>
<text x="32" y="46" class="h">最后一步：4096 维向量 → 128256 个分数 → 一个 token</text>
<text x="32" y="78" class="s">左边由架构和权重决定，同一输入每次结果相同；右边由解码参数决定，改参数不用改模型。</text>
<rect x="24" y="100" width="604" height="420" rx="10" fill="none" stroke="#60a5fa" stroke-width="2" stroke-dasharray="6 5"/>
<text x="40" y="126" class="k">架构决定（forward 的最后几行）</text>
<rect x="652" y="100" width="644" height="420" rx="10" fill="none" stroke="#e0a63a" stroke-width="2" stroke-dasharray="6 5"/>
<text x="668" y="126" class="k">解码策略决定（generation_config / 请求参数）</text>
<g data-node="h"><rect x="44" y="146" width="172" height="150" rx="8" class="node"/><text x="62" y="182" class="t">第 32 层输出</text><text x="62" y="210" class="s">只取最后位置</text><text x="62" y="233" class="s">[1, 4096]</text></g>
<g data-node="norm"><rect x="236" y="146" width="170" height="150" rx="8" class="violet"/><text x="254" y="182" class="t">最终 RMSNorm</text><text x="254" y="210" class="s">形状不变</text><text x="254" y="233" class="s">[1, 4096]</text></g>
<g data-node="head"><rect x="426" y="146" width="182" height="150" rx="8" class="blue"/><text x="444" y="182" class="t">lm_head</text><text x="444" y="210" class="s">4096 × 128256</text><text x="444" y="233" class="s">5.25 亿参数</text><text x="444" y="256" class="s">无 bias</text></g>
<g data-node="logits"><rect x="240" y="340" width="368" height="150" rx="8" class="blue"/><text x="258" y="376" class="t">logits [1, 128256]</text><text x="258" y="404" class="s">每个 token 一个分数</text><text x="258" y="427" class="s">根据 5.0  您 4.0  申请 3.0 …</text><text x="258" y="450" class="s">FP32 时约 501 KiB</text></g>
<path d="M216 221H236" class="edge"/>
<path d="M406 221H426" class="edge"/>
<path d="M517 296V340" class="edge"/>
<g data-node="proc"><rect x="672" y="146" width="300" height="150" rx="8" class="amber"/><text x="690" y="182" class="t">改分数</text><text x="690" y="210" class="s">重复惩罚、禁用词</text><text x="690" y="233" class="s">温度：分数 ÷ T</text><text x="690" y="256" class="s">结构化输出掩码</text></g>
<g data-node="filt"><rect x="996" y="146" width="280" height="150" rx="8" class="amber"/><text x="1014" y="182" class="t">砍候选</text><text x="1014" y="210" class="s">top-k：留前 k 个</text><text x="1014" y="233" class="s">top-p：累计到 p</text><text x="1014" y="256" class="s">min-p：≥ 最高 × p</text></g>
<g data-node="samp"><rect x="996" y="340" width="280" height="150" rx="8" class="green"/><text x="1014" y="376" class="t">softmax + 抽样</text><text x="1014" y="404" class="s">剩下的重新归一</text><text x="1014" y="427" class="s">按概率抽一个</text><text x="1014" y="450" class="s">温度 0 时直接取最大</text></g>
<g data-node="tok"><rect x="672" y="340" width="300" height="150" rx="8" class="green"/><text x="690" y="376" class="t">输出 token 110747</text><text x="690" y="404" class="s">“根据”</text><text x="690" y="427" class="s">是停止 token 就结束</text><text x="690" y="450" class="s">否则追加进下一步</text></g>
<path d="M608 415H640Q652 415 652 403V233Q652 221 664 221H672" class="edge"/>
<path d="M972 221H996" class="edge"/>
<path d="M1136 296V340" class="edge"/>
<path d="M996 415H972" class="edge"/>
<path d="M822 490V560H130V296" class="dash"/>
<rect x="294" y="548" width="470" height="26" rx="4" fill="#f8fafc"/><text x="300" y="566" class="s">追加到输入末尾，下一步只为这 1 个新 token 跑一遍 32 层</text>
</svg>
