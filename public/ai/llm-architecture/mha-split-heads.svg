<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="600" viewBox="0 0 1300 600" role="img" aria-labelledby="mha-split-heads-title mha-split-heads-desc" id="mha-split-heads-root">
<title id="mha-split-heads-title">Llama-3.1-8B 一层注意力里的 Q 头与 KV 头</title>
<desc id="mha-split-heads-desc">输入 [n,4096] 经 q_proj 拆成 32 个 128 维的 Q 头，经 k_proj、v_proj 各得到 8 个 KV 头；每 4 个 Q 头共用一组 K、V。每个头各自算注意力得到 [n,128]，32 个结果拼成 [n,4096]，再经 o_proj 输出并加回残差流。KV Cache 只存 8 组 K、V。</desc>
<defs><style>
#mha-split-heads-root text { font-family: Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #172b3a; }
#mha-split-heads-root .h { font-size: 26px; font-weight: 700; }
#mha-split-heads-root .t { font-size: 19px; font-weight: 600; }
#mha-split-heads-root .s { font-size: 15px; fill: #475569; }
#mha-split-heads-root .xs { font-size: 13px; fill: #64748b; }
#mha-split-heads-root .k { font-size: 13px; font-weight: 700; letter-spacing: .04em; fill: #64748b; }
#mha-split-heads-root .m { font-family: 'SFMono-Regular', Menlo, Consolas, monospace; font-size: 14px; fill: #172b3a; }
#mha-split-heads-root .node { fill: #fff; stroke: #cbd5e1; stroke-width: 2; }
#mha-split-heads-root .blue { fill: #eff6ff; stroke: #60a5fa; stroke-width: 2; }
#mha-split-heads-root .green { fill: #ecfdf5; stroke: #20a28c; stroke-width: 2; }
#mha-split-heads-root .red { fill: #fff1f2; stroke: #e88191; stroke-width: 2; }
#mha-split-heads-root .amber { fill: #fffbeb; stroke: #e0a63a; stroke-width: 2; }
#mha-split-heads-root .violet { fill: #f5f3ff; stroke: #9b87f5; stroke-width: 2; }
#mha-split-heads-root .gray { fill: #f1f5f9; stroke: #cbd5e1; stroke-width: 2; }
#mha-split-heads-root .fblue { fill: #93c5fd; } #mha-split-heads-root .fgreen { fill: #6ee7b7; } #mha-split-heads-root .fred { fill: #fda4af; }
#mha-split-heads-root .famber { fill: #fcd34d; } #mha-split-heads-root .fviolet { fill: #c4b5fd; } #mha-split-heads-root .fgray { fill: #e2e8f0; }
#mha-split-heads-root .edge { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#mha-split-heads-arrow); }
#mha-split-heads-root .dash { fill: none; stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 7 6; marker-end: url(#mha-split-heads-arrow); }
#mha-split-heads-root .line { stroke: #cbd5e1; stroke-width: 1.5; fill: none; }
#mha-split-heads-root .axis { stroke: #64748b; stroke-width: 2; fill: none; }
</style><marker id="mha-split-heads-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker></defs>
<rect width="1300" height="600" fill="#f8fafc"/>
<text x="32" y="46" class="h">一层注意力：32 个 Q 头，8 组 K、V</text>
<text x="32" y="78" class="s">Llama-3.1-8B 的分组查询注意力（GQA）。颜色相同的 4 个 Q 头共用同一组 K、V。</text>
<g data-node="in"><rect x="32" y="150" width="220" height="250" rx="8" class="node"/><text x="50" y="176" class="k">每层注意力的输入</text><text x="50" y="202" class="t">输入 x</text><text x="50" y="230" class="s">[n, 4096]</text><text x="50" y="253" class="s">已经过 RMSNorm</text><text x="50" y="276" class="s">n 为 token 数</text></g><text x="300" y="132" class="s">q_proj 4096 → 4096：拆成 32 个 Q 头，每头 128 维</text><text x="300" y="252" class="s">k_proj 4096 → 1024：8 个 K 头</text><text x="300" y="352" class="s">v_proj 4096 → 1024：8 个 V 头</text><rect x="300" y="146" width="18" height="40" rx="4" class="fblue"/><text x="309" y="171" text-anchor="middle" class="xs">0</text><rect x="322" y="146" width="18" height="40" rx="4" class="fblue"/><text x="331" y="171" text-anchor="middle" class="xs">1</text><rect x="344" y="146" width="18" height="40" rx="4" class="fblue"/><text x="353" y="171" text-anchor="middle" class="xs">2</text><rect x="366" y="146" width="18" height="40" rx="4" class="fblue"/><text x="375" y="171" text-anchor="middle" class="xs">3</text><rect x="388" y="146" width="18" height="40" rx="4" class="fviolet"/><text x="397" y="171" text-anchor="middle" class="xs">4</text><rect x="410" y="146" width="18" height="40" rx="4" class="fviolet"/><text x="419" y="171" text-anchor="middle" class="xs">5</text><rect x="432" y="146" width="18" height="40" rx="4" class="fviolet"/><text x="441" y="171" text-anchor="middle" class="xs">6</text><rect x="454" y="146" width="18" height="40" rx="4" class="fviolet"/><text x="463" y="171" text-anchor="middle" class="xs">7</text><rect x="476" y="146" width="18" height="40" rx="4" class="fblue"/><text x="485" y="171" text-anchor="middle" class="xs">8</text><rect x="498" y="146" width="18" height="40" rx="4" class="fblue"/><text x="507" y="171" text-anchor="middle" class="xs">9</text><rect x="520" y="146" width="18" height="40" rx="4" class="fblue"/><text x="529" y="171" text-anchor="middle" class="xs">10</text><rect x="542" y="146" width="18" height="40" rx="4" class="fblue"/><text x="551" y="171" text-anchor="middle" class="xs">11</text><rect x="564" y="146" width="18" height="40" rx="4" class="fviolet"/><text x="573" y="171" text-anchor="middle" class="xs">12</text><rect x="586" y="146" width="18" height="40" rx="4" class="fviolet"/><text x="595" y="171" text-anchor="middle" class="xs">13</text><rect x="608" y="146" width="18" height="40" rx="4" class="fviolet"/><text x="617" y="171" text-anchor="middle" class="xs">14</text><rect x="630" y="146" width="18" height="40" rx="4" class="fviolet"/><text x="639" y="171" text-anchor="middle" class="xs">15</text><rect x="652" y="146" width="18" height="40" rx="4" class="fblue"/><text x="661" y="171" text-anchor="middle" class="xs">16</text><rect x="674" y="146" width="18" height="40" rx="4" class="fblue"/><text x="683" y="171" text-anchor="middle" class="xs">17</text><rect x="696" y="146" width="18" height="40" rx="4" class="fblue"/><text x="705" y="171" text-anchor="middle" class="xs">18</text><rect x="718" y="146" width="18" height="40" rx="4" class="fblue"/><text x="727" y="171" text-anchor="middle" class="xs">19</text><rect x="740" y="146" width="18" height="40" rx="4" class="fviolet"/><text x="749" y="171" text-anchor="middle" class="xs">20</text><rect x="762" y="146" width="18" height="40" rx="4" class="fviolet"/><text x="771" y="171" text-anchor="middle" class="xs">21</text><rect x="784" y="146" width="18" height="40" rx="4" class="fviolet"/><text x="793" y="171" text-anchor="middle" class="xs">22</text><rect x="806" y="146" width="18" height="40" rx="4" class="fviolet"/><text x="815" y="171" text-anchor="middle" class="xs">23</text><rect x="828" y="146" width="18" height="40" rx="4" class="fblue"/><text x="837" y="171" text-anchor="middle" class="xs">24</text><rect x="850" y="146" width="18" height="40" rx="4" class="fblue"/><text x="859" y="171" text-anchor="middle" class="xs">25</text><rect x="872" y="146" width="18" height="40" rx="4" class="fblue"/><text x="881" y="171" text-anchor="middle" class="xs">26</text><rect x="894" y="146" width="18" height="40" rx="4" class="fblue"/><text x="903" y="171" text-anchor="middle" class="xs">27</text><rect x="916" y="146" width="18" height="40" rx="4" class="fviolet"/><text x="925" y="171" text-anchor="middle" class="xs">28</text><rect x="938" y="146" width="18" height="40" rx="4" class="fviolet"/><text x="947" y="171" text-anchor="middle" class="xs">29</text><rect x="960" y="146" width="18" height="40" rx="4" class="fviolet"/><text x="969" y="171" text-anchor="middle" class="xs">30</text><rect x="982" y="146" width="18" height="40" rx="4" class="fviolet"/><text x="991" y="171" text-anchor="middle" class="xs">31</text><rect x="300" y="266" width="84" height="40" rx="4" class="fblue"/><text x="342" y="291" text-anchor="middle" class="xs">K0</text><rect x="300" y="366" width="84" height="40" rx="4" class="fblue"/><text x="342" y="391" text-anchor="middle" class="xs">V0</text><path d="M342 188V264" class="line"/><rect x="388" y="266" width="84" height="40" rx="4" class="fviolet"/><text x="430" y="291" text-anchor="middle" class="xs">K1</text><rect x="388" y="366" width="84" height="40" rx="4" class="fviolet"/><text x="430" y="391" text-anchor="middle" class="xs">V1</text><path d="M430 188V264" class="line"/><rect x="476" y="266" width="84" height="40" rx="4" class="fblue"/><text x="518" y="291" text-anchor="middle" class="xs">K2</text><rect x="476" y="366" width="84" height="40" rx="4" class="fblue"/><text x="518" y="391" text-anchor="middle" class="xs">V2</text><path d="M518 188V264" class="line"/><rect x="564" y="266" width="84" height="40" rx="4" class="fviolet"/><text x="606" y="291" text-anchor="middle" class="xs">K3</text><rect x="564" y="366" width="84" height="40" rx="4" class="fviolet"/><text x="606" y="391" text-anchor="middle" class="xs">V3</text><path d="M606 188V264" class="line"/><rect x="652" y="266" width="84" height="40" rx="4" class="fblue"/><text x="694" y="291" text-anchor="middle" class="xs">K4</text><rect x="652" y="366" width="84" height="40" rx="4" class="fblue"/><text x="694" y="391" text-anchor="middle" class="xs">V4</text><path d="M694 188V264" class="line"/><rect x="740" y="266" width="84" height="40" rx="4" class="fviolet"/><text x="782" y="291" text-anchor="middle" class="xs">K5</text><rect x="740" y="366" width="84" height="40" rx="4" class="fviolet"/><text x="782" y="391" text-anchor="middle" class="xs">V5</text><path d="M782 188V264" class="line"/><rect x="828" y="266" width="84" height="40" rx="4" class="fblue"/><text x="870" y="291" text-anchor="middle" class="xs">K6</text><rect x="828" y="366" width="84" height="40" rx="4" class="fblue"/><text x="870" y="391" text-anchor="middle" class="xs">V6</text><path d="M870 188V264" class="line"/><rect x="916" y="266" width="84" height="40" rx="4" class="fviolet"/><text x="958" y="291" text-anchor="middle" class="xs">K7</text><rect x="916" y="366" width="84" height="40" rx="4" class="fviolet"/><text x="958" y="391" text-anchor="middle" class="xs">V7</text><path d="M958 188V264" class="line"/><path d="M252 275H292" class="edge"/><g data-node="rule"><rect x="1024" y="140" width="244" height="140" rx="8" class="amber"/><text x="1042" y="166" class="k">32 ÷ 8 = 4</text><text x="1042" y="192" class="t">分组规则</text><text x="1042" y="220" class="s">Q 头 0—3 用 K0、V0</text><text x="1042" y="243" class="s">Q 头 4—7 用 K1、V1</text><text x="1042" y="266" class="s">……每组 4 个头</text></g><g data-node="cache"><rect x="1024" y="296" width="244" height="110" rx="8" class="green"/><text x="1042" y="322" class="k">KV Cache</text><text x="1042" y="348" class="t">缓存的只有 K、V</text><text x="1042" y="376" class="s">每层每 token 存</text><text x="1042" y="399" class="s">8 × 128 × 2 个数</text></g><g data-node="head"><rect x="32" y="452" width="330" height="112" rx="8" class="blue"/><text x="50" y="488" class="t">每个头各算一次注意力</text><text x="50" y="516" class="s">softmax(Q_j·K_gᵀ/√128)·V_g</text><text x="50" y="539" class="s">输出 [n, 128]</text></g><g data-node="cat"><rect x="412" y="452" width="250" height="112" rx="8" class="node"/><text x="430" y="488" class="t">32 个头拼接</text><text x="430" y="516" class="s">[n, 32 × 128] = [n, 4096]</text></g><g data-node="o"><rect x="712" y="452" width="220" height="112" rx="8" class="node"/><text x="730" y="488" class="t">o_proj</text><text x="730" y="516" class="s">4096 → 4096</text><text x="730" y="539" class="s">把各头结果混合</text></g><g data-node="out"><rect x="982" y="452" width="286" height="112" rx="8" class="node"/><text x="1000" y="488" class="t">输出</text><text x="1000" y="516" class="s">[n, 4096]</text><text x="1000" y="539" class="s">加回残差流</text></g><path d="M362 508H412" class="edge"/><path d="M662 508H712" class="edge"/><path d="M932 508H982" class="edge"/><path d="M330 410V448" class="dash"/>
</svg>
