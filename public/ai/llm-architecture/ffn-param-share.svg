<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="ffn-param-share-title ffn-param-share-desc" id="ffn-param-share-root">
<title id="ffn-param-share-title">Llama-3.1-8B 的参数构成与每 token 计算构成</title>
<desc id="ffn-param-share-desc">参数里 FFN 占 70.2%，注意力 16.7%，词嵌入与输出层 13.1%。每 token 计算：上下文很短时 FFN 占 75%；8192 个 token 时 58%；32768 时 35%，注意力分数部分升到 53%；131072 时 FFN 只占 13.5%。</desc>
<defs><style>
#ffn-param-share-root text { font-family: Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #172b3a; }
#ffn-param-share-root .h { font-size: 26px; font-weight: 700; }
#ffn-param-share-root .t { font-size: 19px; font-weight: 600; }
