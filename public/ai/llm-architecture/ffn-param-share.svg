#ffn-param-share-root .node { fill: #fff; stroke: #cbd5e1; stroke-width: 2; }
#ffn-param-share-root .blue { fill: #eff6ff; stroke: #60a5fa; stroke-width: 2; }
#ffn-param-share-root .green { fill: #ecfdf5; stroke: #20a28c; stroke-width: 2; }
#ffn-param-share-root .red { fill: #fff1f2; stroke: #e88191; stroke-width: 2; }
#ffn-param-share-root .amber { fill: #fffbeb; stroke: #e0a63a; stroke-width: 2; }
#ffn-param-share-root .violet { fill: #f5f3ff; stroke: #9b87f5; stroke-width: 2; }
#ffn-param-share-root .gray { fill: #f1f5f9; stroke: #cbd5e1; stroke-width: 2; }
#ffn-param-share-root .fblue { fill: #93c5fd; } #ffn-param-share-root .fgreen { fill: #6ee7b7; } #ffn-param-share-root .fred { fill: #fda4af; }
#ffn-param-share-root .famber { fill: #fcd34d; } #ffn-param-share-root .fviolet { fill: #c4b5fd; } #ffn-param-share-root .fgray { fill: #e2e8f0; }
#ffn-param-share-root .edge { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#ffn-param-share-arrow); }
#ffn-param-share-root .dash { fill: none; stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 7 6; marker-end: url(#ffn-param-share-arrow); }
#ffn-param-share-root .line { stroke: #cbd5e1; stroke-width: 1.5; fill: none; }
#ffn-param-share-root .axis { stroke: #64748b; stroke-width: 2; fill: none; }
</style><marker id="ffn-param-share-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker></defs>
<rect width="1200" height="600" fill="#f8fafc"/>
<text x="32" y="46" class="h">FFN 占七成参数；上下文变长后，计算的大头转向注意力</text>
<text x="32" y="78" class="s">Llama-3.1-8B，BF16。计算量只计矩阵乘法，每个乘加记 2 FLOPs，注意力分数部分取第 n 个位置看前 n 个位置。</text>
