<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="570" viewBox="0 0 1280 570" role="img" aria-labelledby="deepseek-dsa-title deepseek-dsa-desc" id="deepseek-dsa-root">
<title id="deepseek-dsa-title">DeepSeek-V3.2 的稀疏注意力</title>
<desc id="deepseek-dsa-desc">在 10 万 token 的上下文里，闪电索引器用 64 个小头给前面每个位置打分，只把分数最高的 2048 个位置交给 MLA 主注意力。索引器的计算仍随长度平方增长，但单价很低；主注意力的计算变成长度乘 2048。KV Cache 仍保存全部位置。</desc>
<defs><style>
#deepseek-dsa-root text { font-family: Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #172b3a; }
#deepseek-dsa-root .h { font-size: 26px; font-weight: 700; }
#deepseek-dsa-root .t { font-size: 19px; font-weight: 600; }
#deepseek-dsa-root .s { font-size: 15px; fill: #475569; }
#deepseek-dsa-root .xs { font-size: 13px; fill: #64748b; }
#deepseek-dsa-root .k { font-size: 13px; font-weight: 700; letter-spacing: .04em; fill: #64748b; }
#deepseek-dsa-root .m { font-family: 'SFMono-Regular', Menlo, Consolas, monospace; font-size: 14px; fill: #172b3a; }
#deepseek-dsa-root .node { fill: #fff; stroke: #cbd5e1; stroke-width: 2; }
#deepseek-dsa-root .blue { fill: #eff6ff; stroke: #60a5fa; stroke-width: 2; }
#deepseek-dsa-root .green { fill: #ecfdf5; stroke: #20a28c; stroke-width: 2; }
#deepseek-dsa-root .red { fill: #fff1f2; stroke: #e88191; stroke-width: 2; }
#deepseek-dsa-root .amber { fill: #fffbeb; stroke: #e0a63a; stroke-width: 2; }
#deepseek-dsa-root .violet { fill: #f5f3ff; stroke: #9b87f5; stroke-width: 2; }
#deepseek-dsa-root .gray { fill: #f1f5f9; stroke: #cbd5e1; stroke-width: 2; }
#deepseek-dsa-root .fblue { fill: #93c5fd; } #deepseek-dsa-root .fgreen { fill: #6ee7b7; } #deepseek-dsa-root .fred { fill: #fda4af; }
#deepseek-dsa-root .famber { fill: #fcd34d; } #deepseek-dsa-root .fviolet { fill: #c4b5fd; } #deepseek-dsa-root .fgray { fill: #e2e8f0; }
#deepseek-dsa-root .edge { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#deepseek-dsa-arrow); }
#deepseek-dsa-root .dash { fill: none; stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 7 6; marker-end: url(#deepseek-dsa-arrow); }
#deepseek-dsa-root .line { stroke: #cbd5e1; stroke-width: 1.5; fill: none; }
#deepseek-dsa-root .axis { stroke: #64748b; stroke-width: 2; fill: none; }
</style><marker id="deepseek-dsa-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker></defs>
<rect width="1280" height="570" fill="#f8fafc"/>
<text x="32" y="46" class="h">V3.2：先用便宜的索引器挑 2048 个位置，再做正常的 MLA</text>
<text x="32" y="78" class="s">以资料助手把 10 万 token 的员工手册放进上下文为例。绿色竖线表示被选中的位置，分布为示意。</text>
<text x="60" y="140" class="s">闪电索引器：给前面全部 100,000 个位置打分（每层 64 个小头 × 128 维，可用 FP8）</text><rect x="60" y="170" width="1160" height="40" rx="4" class="famber"/><text x="72" y="196" class="s">每个位置一个分数：Σ 权重 × ReLU(q · k)</text><rect x="60" y="330" width="1160" height="40" rx="4" class="fgray"/><rect x="625" y="330" width="4" height="40" class="fgreen"/><rect x="707" y="330" width="4" height="40" class="fgreen"/><rect x="193" y="330" width="4" height="40" class="fgreen"/><rect x="341" y="330" width="4" height="40" class="fgreen"/><rect x="571" y="330" width="4" height="40" class="fgreen"/><rect x="644" y="330" width="4" height="40" class="fgreen"/><rect x="150" y="330" width="4" height="40" class="fgreen"/><rect x="1074" y="330" width="4" height="40" class="fgreen"/><rect x="740" y="330" width="4" height="40" class="fgreen"/><rect x="534" y="330" width="4" height="40" class="fgreen"/><rect x="388" y="330" width="4" height="40" class="fgreen"/><rect x="961" y="330" width="4" height="40" class="fgreen"/><rect x="818" y="330" width="4" height="40" class="fgreen"/><rect x="148" y="330" width="4" height="40" class="fgreen"/><rect x="635" y="330" width="4" height="40" class="fgreen"/><rect x="331" y="330" width="4" height="40" class="fgreen"/><rect x="835" y="330" width="4" height="40" class="fgreen"/><rect x="242" y="330" width="4" height="40" class="fgreen"/><rect x="706" y="330" width="4" height="40" class="fgreen"/><rect x="622" y="330" width="4" height="40" class="fgreen"/><rect x="263" y="330" width="4" height="40" class="fgreen"/><rect x="117" y="330" width="4" height="40" class="fgreen"/><rect x="1143" y="330" width="4" height="40" class="fgreen"/><rect x="1179" y="330" width="4" height="40" class="fgreen"/><rect x="199" y="330" width="4" height="40" class="fgreen"/><rect x="572" y="330" width="4" height="40" class="fgreen"/><rect x="1162" y="330" width="4" height="40" class="fgreen"/><rect x="278" y="330" width="4" height="40" class="fgreen"/><rect x="543" y="330" width="4" height="40" class="fgreen"/><rect x="695" y="330" width="4" height="40" class="fgreen"/><rect x="835" y="330" width="4" height="40" class="fgreen"/><rect x="384" y="330" width="4" height="40" class="fgreen"/><rect x="256" y="330" width="4" height="40" class="fgreen"/><rect x="1197" y="330" width="4" height="40" class="fgreen"/><rect x="574" y="330" width="4" height="40" class="fgreen"/><rect x="328" y="330" width="4" height="40" class="fgreen"/><rect x="691" y="330" width="4" height="40" class="fgreen"/><rect x="441" y="330" width="4" height="40" class="fgreen"/><rect x="237" y="330" width="4" height="40" class="fgreen"/><rect x="951" y="330" width="4" height="40" class="fgreen"/><rect x="465" y="330" width="4" height="40" class="fgreen"/><rect x="463" y="330" width="4" height="40" class="fgreen"/><rect x="151" y="330" width="4" height="40" class="fgreen"/><rect x="1128" y="330" width="4" height="40" class="fgreen"/><rect x="335" y="330" width="4" height="40" class="fgreen"/><rect x="1080" y="330" width="4" height="40" class="fgreen"/><rect x="603" y="330" width="4" height="40" class="fgreen"/><rect x="332" y="330" width="4" height="40" class="fgreen"/><rect x="755" y="330" width="4" height="40" class="fgreen"/><rect x="523" y="330" width="4" height="40" class="fgreen"/><rect x="935" y="330" width="4" height="40" class="fgreen"/><rect x="813" y="330" width="4" height="40" class="fgreen"/><rect x="216" y="330" width="4" height="40" class="fgreen"/><rect x="318" y="330" width="4" height="40" class="fgreen"/><rect x="579" y="330" width="4" height="40" class="fgreen"/><rect x="164" y="330" width="4" height="40" class="fgreen"/><rect x="114" y="330" width="4" height="40" class="fgreen"/><rect x="535" y="330" width="4" height="40" class="fgreen"/><rect x="845" y="330" width="4" height="40" class="fgreen"/><rect x="806" y="330" width="4" height="40" class="fgreen"/><rect x="1162" y="330" width="4" height="40" class="fgreen"/><rect x="434" y="330" width="4" height="40" class="fgreen"/><rect x="565" y="330" width="4" height="40" class="fgreen"/><rect x="632" y="330" width="4" height="40" class="fgreen"/><rect x="566" y="330" width="4" height="40" class="fgreen"/><rect x="1027" y="330" width="4" height="40" class="fgreen"/><rect x="580" y="330" width="4" height="40" class="fgreen"/><rect x="566" y="330" width="4" height="40" class="fgreen"/><rect x="364" y="330" width="4" height="40" class="fgreen"/><rect x="333" y="330" width="4" height="40" class="fgreen"/><rect x="917" y="330" width="4" height="40" class="fgreen"/><rect x="212" y="330" width="4" height="40" class="fgreen"/><rect x="371" y="330" width="4" height="40" class="fgreen"/><rect x="944" y="330" width="4" height="40" class="fgreen"/><rect x="1050" y="330" width="4" height="40" class="fgreen"/><rect x="1177" y="330" width="4" height="40" class="fgreen"/><rect x="1129" y="330" width="4" height="40" class="fgreen"/><rect x="1052" y="330" width="4" height="40" class="fgreen"/><rect x="922" y="330" width="4" height="40" class="fgreen"/><rect x="798" y="330" width="4" height="40" class="fgreen"/><rect x="699" y="330" width="4" height="40" class="fgreen"/><rect x="87" y="330" width="4" height="40" class="fgreen"/><rect x="433" y="330" width="4" height="40" class="fgreen"/><rect x="472" y="330" width="4" height="40" class="fgreen"/><rect x="308" y="330" width="4" height="40" class="fgreen"/><rect x="514" y="330" width="4" height="40" class="fgreen"/><rect x="851" y="330" width="4" height="40" class="fgreen"/><rect x="910" y="330" width="4" height="40" class="fgreen"/><rect x="367" y="330" width="4" height="40" class="fgreen"/><rect x="1163" y="330" width="4" height="40" class="fgreen"/><path d="M627 212V326" class="dash"/><path d="M536 212V326" class="dash"/><path d="M708 212V326" class="dash"/><path d="M280 212V326" class="dash"/><path d="M693 212V326" class="dash"/><path d="M1082 212V326" class="dash"/><text x="60" y="392" class="xs">位置 1</text><text x="1220" y="392" class="xs" text-anchor="end">位置 100,000</text><text x="640" y="392" class="s" text-anchor="middle">MLA 主注意力：只读分数最高的 2048 个位置的潜向量（每个 576 个数）</text><g data-node="d-cost1"><rect x="60" y="430" width="560" height="116" rx="8" class="amber"/><text x="78" y="456" class="k">代价</text><text x="78" y="482" class="t">索引器仍是 O(L²)</text><text x="78" y="510" class="s">每对位置都要打分，但头少、维度小、可用 FP8</text><text x="78" y="533" class="s">比 128 个头 × 576 维的 MLA 便宜得多</text></g><g data-node="d-cost2"><rect x="660" y="430" width="560" height="116" rx="8" class="green"/><text x="678" y="456" class="k">收益</text><text x="678" y="482" class="t">主注意力变成 O(L × 2048)</text><text x="678" y="510" class="s">上下文再长，每个查询也只看 2048 个位置</text><text x="678" y="533" class="s">KV Cache 仍要存全部位置，只是少读</text></g>
</svg>
