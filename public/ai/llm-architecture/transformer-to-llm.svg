<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="640" viewBox="0 0 1360 640" role="img" aria-labelledby="transformer-to-llm-title transformer-to-llm-desc" id="transformer-to-llm-root">
<title id="transformer-to-llm-title">原始 Transformer 与今天大模型的部件对照</title>
<desc id="transformer-to-llm-desc">八个部件的对照：结构从编码器加解码器变成只保留解码器；词表从约 3.7 万变成十几到二十几万；注意力加上 GQA 或 MLA；FFN 从 ReLU 变成 SwiGLU 或 MoE；Post-Norm LayerNorm 变成 Pre-Norm RMSNorm；正弦位置编码变成 RoPE；输出层基本不变；规模从约 6500 万参数到数十亿以上。</desc>
<defs><style>
#transformer-to-llm-root text { font-family: Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #172b3a; }
#transformer-to-llm-root .h { font-size: 26px; font-weight: 700; }
#transformer-to-llm-root .t { font-size: 19px; font-weight: 600; }
#transformer-to-llm-root .s { font-size: 15px; fill: #475569; }
#transformer-to-llm-root .xs { font-size: 13px; fill: #64748b; }
#transformer-to-llm-root .k { font-size: 13px; font-weight: 700; letter-spacing: .04em; fill: #64748b; }
#transformer-to-llm-root .m { font-family: 'SFMono-Regular', Menlo, Consolas, monospace; font-size: 14px; fill: #172b3a; }
#transformer-to-llm-root .node { fill: #fff; stroke: #cbd5e1; stroke-width: 2; }
#transformer-to-llm-root .blue { fill: #eff6ff; stroke: #60a5fa; stroke-width: 2; }
#transformer-to-llm-root .green { fill: #ecfdf5; stroke: #20a28c; stroke-width: 2; }
#transformer-to-llm-root .red { fill: #fff1f2; stroke: #e88191; stroke-width: 2; }
#transformer-to-llm-root .amber { fill: #fffbeb; stroke: #e0a63a; stroke-width: 2; }
#transformer-to-llm-root .violet { fill: #f5f3ff; stroke: #9b87f5; stroke-width: 2; }
#transformer-to-llm-root .gray { fill: #f1f5f9; stroke: #cbd5e1; stroke-width: 2; }
#transformer-to-llm-root .fblue { fill: #93c5fd; } #transformer-to-llm-root .fgreen { fill: #6ee7b7; } #transformer-to-llm-root .fred { fill: #fda4af; }
#transformer-to-llm-root .famber { fill: #fcd34d; } #transformer-to-llm-root .fviolet { fill: #c4b5fd; } #transformer-to-llm-root .fgray { fill: #e2e8f0; }
#transformer-to-llm-root .edge { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#transformer-to-llm-arrow); }
#transformer-to-llm-root .dash { fill: none; stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 7 6; marker-end: url(#transformer-to-llm-arrow); }
#transformer-to-llm-root .line { stroke: #cbd5e1; stroke-width: 1.5; fill: none; }
#transformer-to-llm-root .axis { stroke: #64748b; stroke-width: 2; fill: none; }
</style><marker id="transformer-to-llm-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker></defs>
<rect width="1360" height="640" fill="#f8fafc"/>
<text x="32" y="46" class="h">骨架没变，零件几乎全换了</text>
<text x="32" y="78" class="s">最右列是本系列详细讲解该部件的篇号</text>
<text x="42" y="116" class="k">部件</text><text x="242" y="116" class="k">2017 年原始 Transformer</text><text x="630" y="116" class="k">今天的 decoder-only 大模型</text><text x="1200" y="116" class="k">本系列</text><g data-node="n0"><rect x="32" y="132" width="186" height="56" rx="8" class="node"/><text x="50" y="168" class="t">整体结构</text></g><rect x="232" y="132" width="372" height="56" rx="4" class="gray"/><text x="418" y="165" text-anchor="middle" class="s">编码器 + 解码器</text><rect x="620" y="132" width="554" height="56" rx="4" class="blue"/><text x="897" y="165" text-anchor="middle" class="s">只保留解码器（去掉交叉注意力）</text><rect x="1190" y="132" width="138" height="56" rx="4" class="violet"/><text x="1259" y="165" text-anchor="middle" class="s">02</text><g data-node="n1"><rect x="32" y="194" width="186" height="56" rx="8" class="node"/><text x="50" y="230" class="t">词表与嵌入</text></g><rect x="232" y="194" width="372" height="56" rx="4" class="gray"/><text x="418" y="227" text-anchor="middle" class="s">约 3.7 万，输入输出共享</text><rect x="620" y="194" width="554" height="56" rx="4" class="blue"/><text x="897" y="227" text-anchor="middle" class="s">12.8 万—25 万；小模型共享、大模型多不共享</text><rect x="1190" y="194" width="138" height="56" rx="4" class="violet"/><text x="1259" y="227" text-anchor="middle" class="s">04</text><g data-node="n2"><rect x="32" y="256" width="186" height="56" rx="8" class="node"/><text x="50" y="292" class="t">注意力</text></g><rect x="232" y="256" width="372" height="56" rx="4" class="gray"/><text x="418" y="289" text-anchor="middle" class="s">多头注意力 8 头</text><rect x="620" y="256" width="554" height="56" rx="4" class="blue"/><text x="897" y="289" text-anchor="middle" class="s">多头 + GQA / MLA，KV 头更少</text><rect x="1190" y="256" width="138" height="56" rx="4" class="violet"/><text x="1259" y="289" text-anchor="middle" class="s">05 · 06</text><g data-node="n3"><rect x="32" y="318" width="186" height="56" rx="8" class="node"/><text x="50" y="354" class="t">FFN</text></g><rect x="232" y="318" width="372" height="56" rx="4" class="gray"/><text x="418" y="351" text-anchor="middle" class="s">ReLU，512 → 2048 → 512</text><rect x="620" y="318" width="554" height="56" rx="4" class="blue"/><text x="897" y="351" text-anchor="middle" class="s">SwiGLU 三个矩阵，或拆成 MoE 专家</text><rect x="1190" y="318" width="138" height="56" rx="4" class="violet"/><text x="1259" y="351" text-anchor="middle" class="s">07 · 11</text><g data-node="n4"><rect x="32" y="380" width="186" height="56" rx="8" class="node"/><text x="50" y="416" class="t">残差与归一化</text></g><rect x="232" y="380" width="372" height="56" rx="4" class="gray"/><text x="418" y="413" text-anchor="middle" class="s">相加之后 LayerNorm（Post-Norm）</text><rect x="620" y="380" width="554" height="56" rx="4" class="blue"/><text x="897" y="413" text-anchor="middle" class="s">子层之前 RMSNorm（Pre-Norm），常加 QK-Norm</text><rect x="1190" y="380" width="138" height="56" rx="4" class="violet"/><text x="1259" y="413" text-anchor="middle" class="s">08</text><g data-node="n5"><rect x="32" y="442" width="186" height="56" rx="8" class="node"/><text x="50" y="478" class="t">位置</text></g><rect x="232" y="442" width="372" height="56" rx="4" class="gray"/><text x="418" y="475" text-anchor="middle" class="s">正弦位置编码加在输入上</text><rect x="620" y="442" width="554" height="56" rx="4" class="blue"/><text x="897" y="475" text-anchor="middle" class="s">每层对 Q、K 做旋转（RoPE），配合缩放扩展长度</text><rect x="1190" y="442" width="138" height="56" rx="4" class="violet"/><text x="1259" y="475" text-anchor="middle" class="s">09</text><g data-node="n6"><rect x="32" y="504" width="186" height="56" rx="8" class="node"/><text x="50" y="540" class="t">输出</text></g><rect x="232" y="504" width="372" height="56" rx="4" class="gray"/><text x="418" y="537" text-anchor="middle" class="s">线性层 + softmax，束搜索</text><rect x="620" y="504" width="554" height="56" rx="4" class="gray"/><text x="897" y="537" text-anchor="middle" class="s">同样打分，采样或贪心逐个生成</text><rect x="1190" y="504" width="138" height="56" rx="4" class="violet"/><text x="1259" y="537" text-anchor="middle" class="s">10</text><g data-node="n7"><rect x="32" y="566" width="186" height="56" rx="8" class="node"/><text x="50" y="602" class="t">规模</text></g><rect x="232" y="566" width="372" height="56" rx="4" class="gray"/><text x="418" y="599" text-anchor="middle" class="s">6+6 层，512 维，约 0.65 亿</text><rect x="620" y="566" width="554" height="56" rx="4" class="blue"/><text x="897" y="599" text-anchor="middle" class="s">Llama-3.1-8B：32 层，4096 维，80 亿</text><rect x="1190" y="566" width="138" height="56" rx="4" class="violet"/><text x="1259" y="599" text-anchor="middle" class="s">03</text>
</svg>
