<rect x="170" y="262" width="22" height="22" rx="4" class="famber"/>
<text x="202" y="279" class="s">MoE 层：1 个共享专家 + 1 个路由专家</text>
<rect x="560" y="262" width="22" height="22" rx="4" class="fgreen"/>
<text x="592" y="279" class="s">密集 FFN 层（intermediate_size_mlp 16384）</text>
<rect x="958" y="260" width="26" height="26" rx="5" fill="none" stroke="#1d4ed8" stroke-width="3"/>
<text x="994" y="279" class="s">NoPE 层：不加 RoPE，看完整上下文</text>
<text x="170" y="312" class="xs">其余 36 层加 RoPE，只在 8,192 token 的块内做注意力（chunked_attention）</text>
<rect x="28" y="350" width="1344" height="324" rx="10" fill="none" stroke="#e0a63a" stroke-width="2" stroke-dasharray="6 5"/>
<text x="48" y="380" class="k">放大一个 MoE 层（Llama4TextMoe）</text>
<g data-node="m-in"><rect x="60" y="458" width="180" height="84" rx="8" class="node"/><text x="78" y="494" class="t">一个 token</text><text x="78" y="522" class="s">[5120]</text></g>
<path d="M240 500H270" class="line"/>
<g data-node="m-r"><rect x="300" y="400" width="280" height="104" rx="8" class="violet"/><text x="318" y="436" class="t">路由器 router</text><text x="318" y="464" class="s">5120 → 16 或 128 个分数</text><text x="318" y="487" class="s">top-1 后取 sigmoid</text></g>
<g data-node="m-s"><rect x="300" y="518" width="280" height="104" rx="8" class="green"/><text x="318" y="554" class="t">共享专家 shared_expert</text><text x="318" y="582" class="s">SwiGLU，中间维 8192</text><text x="318" y="605" class="s">每个 token 都经过</text></g>
<path d="M270 500V452H300" class="edge"/>
<path d="M270 500V570H300" class="edge"/>
<path d="M580 452H640" class="edge"/>
<rect x="640" y="414" width="40" height="32" rx="4" class="fgray"/><rect x="686" y="414" width="40" height="32" rx="4" class="fgray"/><rect x="732" y="414" width="40" height="32" rx="4" class="fgray"/><rect x="778" y="414" width="40" height="32" rx="4" class="fgray"/><rect x="824" y="414" width="40" height="32" rx="4" class="fgray"/><rect x="870" y="414" width="40" height="32" rx="4" class="famber"/><text x="890" y="435" text-anchor="middle" class="xs">选中</text><rect x="916" y="414" width="40" height="32" rx="4" class="fgray"/><rect x="962" y="414" width="40" height="32" rx="4" class="fgray"/><rect x="640" y="454" width="40" height="32" rx="4" class="fgray"/><rect x="686" y="454" width="40" height="32" rx="4" class="fgray"/><rect x="732" y="454" width="40" height="32" rx="4" class="fgray"/><rect x="778" y="454" width="40" height="32" rx="4" class="fgray"/><rect x="824" y="454" width="40" height="32" rx="4" class="fgray"/><rect x="870" y="454" width="40" height="32" rx="4" class="fgray"/><rect x="916" y="454" width="40" height="32" rx="4" class="fgray"/><rect x="962" y="454" width="40" height="32" rx="4" class="fgray"/>
<text x="640" y="518" class="xs">路由专家（Scout 16 个 / Maverick 128 个）</text>
<text x="640" y="540" class="xs">输入先乘以门控分数，再进选中的专家</text>
<path d="M1008 450H1094V486" class="edge"/>
<path d="M580 570H1094V514" class="edge"/>
<circle cx="1094" cy="500" r="14" fill="#fff" stroke="#64748b" stroke-width="2"/>
<text x="1094" y="506" class="t" text-anchor="middle">+</text>
<path d="M1108 500H1150" class="edge"/>
<g data-node="m-out"><rect x="1150" y="458" width="200" height="84" rx="8" class="node"/><text x="1168" y="494" class="t">输出</text><text x="1168" y="522" class="s">[5120]，加回残差流</text></g>
<text x="60" y="650" class="s">每个 MoE 层每 token 只算 2 个专家（各约 1.26 亿参数）；两个模型都是 17B 激活，差别在专家总数和 MoE 层数</text>
</svg>
