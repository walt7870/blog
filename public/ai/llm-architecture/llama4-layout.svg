<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="700" viewBox="0 0 1400 700" role="img" aria-labelledby="llama4-layout-title llama4-layout-desc" id="llama4-layout-root">
<title id="llama4-layout-title">Llama 4 Scout 与 Maverick 的 48 层布局和 MoE 层结构</title>
<desc id="llama4-layout-desc">上方用 48 个小格表示 Llama 4 Scout 和 Maverick 的 48 层：Scout 每层都是 MoE，Maverick 奇数层是 MoE、偶数层是密集 FFN；每第 4 层（第 3、7、11……47 层）是不加 RoPE、看完整上下文的 NoPE 层，其余层加 RoPE 并只在 8192 token 块内做注意力。下方放大一个 MoE 层：token 同时进入共享专家和路由器，路由器从 16 或 128 个专家里选 1 个，用 sigmoid 门控分数缩放输入后送进该专家，两路输出相加后加回残差流。</desc>
<defs><style>
#llama4-layout-root text { font-family: Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #172b3a; }
#llama4-layout-root .h { font-size: 26px; font-weight: 700; }
#llama4-layout-root .t { font-size: 19px; font-weight: 600; }
#llama4-layout-root .s { font-size: 15px; fill: #475569; }
#llama4-layout-root .xs { font-size: 13px; fill: #64748b; }
#llama4-layout-root .k { font-size: 13px; font-weight: 700; letter-spacing: .04em; fill: #64748b; }
#llama4-layout-root .m { font-family: 'SFMono-Regular', Menlo, Consolas, monospace; font-size: 14px; fill: #172b3a; }
#llama4-layout-root .node { fill: #fff; stroke: #cbd5e1; stroke-width: 2; }
#llama4-layout-root .blue { fill: #eff6ff; stroke: #60a5fa; stroke-width: 2; }
#llama4-layout-root .green { fill: #ecfdf5; stroke: #20a28c; stroke-width: 2; }
#llama4-layout-root .red { fill: #fff1f2; stroke: #e88191; stroke-width: 2; }
#llama4-layout-root .amber { fill: #fffbeb; stroke: #e0a63a; stroke-width: 2; }
#llama4-layout-root .violet { fill: #f5f3ff; stroke: #9b87f5; stroke-width: 2; }
#llama4-layout-root .gray { fill: #f1f5f9; stroke: #cbd5e1; stroke-width: 2; }
#llama4-layout-root .fblue { fill: #93c5fd; } #llama4-layout-root .fgreen { fill: #6ee7b7; } #llama4-layout-root .fred { fill: #fda4af; }
#llama4-layout-root .famber { fill: #fcd34d; } #llama4-layout-root .fviolet { fill: #c4b5fd; } #llama4-layout-root .fgray { fill: #e2e8f0; }
#llama4-layout-root .edge { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#llama4-layout-arrow); }
#llama4-layout-root .dash { fill: none; stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 7 6; marker-end: url(#llama4-layout-arrow); }
#llama4-layout-root .line { stroke: #cbd5e1; stroke-width: 1.5; fill: none; }
#llama4-layout-root .axis { stroke: #64748b; stroke-width: 2; fill: none; }
</style><marker id="llama4-layout-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker></defs>
<rect width="1400" height="700" fill="#f8fafc"/>
<text x="32" y="46" class="h">Llama 4：哪些层是 MoE，哪些层不用 RoPE</text>
<text x="32" y="78" class="s">每格一层；颜色表示 FFN 类型，蓝框表示 NoPE 全局注意力层。数据读自两个模型的 config.json 与 modeling_llama4.py。</text>
<text x="170" y="118" class="xs">第 0 层</text>
<text x="1338.8" y="118" class="xs" text-anchor="end">第 47 层</text>
