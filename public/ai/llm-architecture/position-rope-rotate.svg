<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="600" viewBox="0 0 1240 600" role="img" aria-labelledby="position-rope-rotate-title position-rope-rotate-desc" id="position-rope-rotate-root">
<title id="position-rope-rotate-title">二维 RoPE：旋转后的点积只取决于两个位置的差</title>
<desc id="position-rope-rotate-desc">“申请”的查询向量 q=(1,0)、“年假”的键向量 k=(0,1)，每个位置转 0.5 弧度。q 在位置 3、k 在位置 1 时夹角为 π/2−1，点积 0.8415；整体后移到位置 5 和 3，两个向量一起多转了 1 弧度，夹角不变，点积仍是 0.8415。右侧表格列出不同位置对的点积，只有位置差相同的行结果相同。</desc>
<defs><style>
#position-rope-rotate-root text { font-family: Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #172b3a; }
#position-rope-rotate-root .h { font-size: 26px; font-weight: 700; }
#position-rope-rotate-root .t { font-size: 19px; font-weight: 600; }
#position-rope-rotate-root .s { font-size: 15px; fill: #475569; }
#position-rope-rotate-root .xs { font-size: 13px; fill: #64748b; }
#position-rope-rotate-root .k { font-size: 13px; font-weight: 700; letter-spacing: .04em; fill: #64748b; }
#position-rope-rotate-root .m { font-family: 'SFMono-Regular', Menlo, Consolas, monospace; font-size: 14px; fill: #172b3a; }
#position-rope-rotate-root .node { fill: #fff; stroke: #cbd5e1; stroke-width: 2; }
#position-rope-rotate-root .blue { fill: #eff6ff; stroke: #60a5fa; stroke-width: 2; }
#position-rope-rotate-root .green { fill: #ecfdf5; stroke: #20a28c; stroke-width: 2; }
#position-rope-rotate-root .red { fill: #fff1f2; stroke: #e88191; stroke-width: 2; }
#position-rope-rotate-root .amber { fill: #fffbeb; stroke: #e0a63a; stroke-width: 2; }
#position-rope-rotate-root .violet { fill: #f5f3ff; stroke: #9b87f5; stroke-width: 2; }
#position-rope-rotate-root .gray { fill: #f1f5f9; stroke: #cbd5e1; stroke-width: 2; }
#position-rope-rotate-root .fblue { fill: #93c5fd; } #position-rope-rotate-root .fgreen { fill: #6ee7b7; } #position-rope-rotate-root .fred { fill: #fda4af; }
#position-rope-rotate-root .famber { fill: #fcd34d; } #position-rope-rotate-root .fviolet { fill: #c4b5fd; } #position-rope-rotate-root .fgray { fill: #e2e8f0; }
#position-rope-rotate-root .edge { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#position-rope-rotate-arrow); }
#position-rope-rotate-root .dash { fill: none; stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 7 6; marker-end: url(#position-rope-rotate-arrow); }
#position-rope-rotate-root .line { stroke: #cbd5e1; stroke-width: 1.5; fill: none; }
#position-rope-rotate-root .axis { stroke: #64748b; stroke-width: 2; fill: none; }
</style><marker id="position-rope-rotate-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker></defs>
<rect width="1240" height="600" fill="#f8fafc"/>
<text x="32" y="46" class="h">把 q 和 k 按位置转一个角度，打分只剩“相隔多远”</text>
<text x="32" y="78" class="s">q=(1,0) 代表“申请”，k=(0,1) 代表“年假”；每个位置转 θ=0.5 弧度。蓝色为 q，绿色为 k，橙色弧是两者夹角。</text>
<g data-node="pa"><rect x="32" y="112" width="380" height="440" rx="8" class="node"/><text x="50" y="138" class="k">情形 A</text></g><text x="50" y="166" class="t">“申请”在 3，“年假”在 1</text><circle cx="222" cy="350" r="130" class="line"/><line x1="78" y1="350" x2="366" y2="350" class="line"/><line x1="222" y1="206" x2="222" y2="494" class="line"/><path d="M226.0 294.1A56 56 0 0 0 195.2 300.9" fill="none" stroke="#e0a63a" stroke-width="3"/><line x1="222" y1="350" x2="231.2" y2="220.3" stroke="#2563eb" stroke-width="4"/><line x1="222" y1="350" x2="159.7" y2="235.9" stroke="#0f9f86" stroke-width="4"/><circle cx="231.2" cy="220.3" r="6" fill="#2563eb"/><circle cx="159.7" cy="235.9" r="6" fill="#0f9f86"/><text x="241.19583621680138" y="214.3256517414729" class="s">q（位置 3）</text><text x="149.6746799814536" y="225.91426695425156" class="s" text-anchor="end">k（位置 1）</text><text x="50" y="520" class="s">q 转 1.5 弧度，k 转 0.5 弧度</text><text x="50" y="542" class="xs">夹角 = (π/2 + 1×0.5) − 3×0.5 = π/2 − 1，点积 0.8415</text>
<g data-node="pb"><rect x="436" y="112" width="380" height="440" rx="8" class="node"/><text x="454" y="138" class="k">情形 B</text></g><text x="454" y="166" class="t">两个词整体后移 2 个位置</text><circle cx="626" cy="350" r="130" class="line"/><line x1="482" y1="350" x2="770" y2="350" class="line"/><line x1="626" y1="206" x2="626" y2="494" class="line"/><path d="M581.1 316.5A56 56 0 0 0 570.1 346.0" fill="none" stroke="#e0a63a" stroke-width="3"/><line x1="626" y1="350" x2="521.9" y2="272.2" stroke="#2563eb" stroke-width="4"/><line x1="626" y1="350" x2="496.3" y2="340.8" stroke="#0f9f86" stroke-width="4"/><circle cx="521.9" cy="272.2" r="6" fill="#2563eb"/><circle cx="496.3" cy="340.8" r="6" fill="#0f9f86"/><text x="531.8513299788987" y="266.19862126648565" class="s">q（位置 5）</text><text x="500.32565174147294" y="370.8041637831986" class="s">k（位置 3）</text><text x="454" y="520" class="s">q 转 2.5 弧度，k 转 1.5 弧度</text><text x="454" y="542" class="xs">夹角 = (π/2 + 3×0.5) − 5×0.5 = π/2 − 1，点积 0.8415</text>
<g data-node="tbl"><rect x="840" y="112" width="368" height="440" rx="8" class="blue"/><text x="858" y="138" class="k">脚本验证</text><text x="858" y="164" class="t">旋转后的点积</text></g>
<text x="858" y="202" class="s">q 位置</text>
<text x="938" y="202" class="s">k 位置</text>
<text x="1018" y="202" class="s">位置差</text>
<text x="1182" y="202" class="s" text-anchor="end">点积</text>
<line x1="858" y1="214" x2="1190" y2="214" class="line"/>
<text x="858" y="246" class="m">3</text><text x="938" y="246" class="m">1</text><text x="1018" y="246" class="m">2</text><text x="1182" y="246" class="m" text-anchor="end">0.8415</text>
<text x="858" y="280" class="m">5</text><text x="938" y="280" class="m">3</text><text x="1018" y="280" class="m">2</text><text x="1182" y="280" class="m" text-anchor="end">0.8415</text>
<text x="858" y="314" class="m">12</text><text x="938" y="314" class="m">10</text><text x="1018" y="314" class="m">2</text><text x="1182" y="314" class="m" text-anchor="end">0.8415</text>
<text x="858" y="348" class="m">3</text><text x="938" y="348" class="m">3</text><text x="1018" y="348" class="m">0</text><text x="1182" y="348" class="m" text-anchor="end">0.0000</text>
<text x="858" y="382" class="m">1</text><text x="938" y="382" class="m">3</text><text x="1018" y="382" class="m">−2</text><text x="1182" y="382" class="m" text-anchor="end">−0.8415</text>
<text x="858" y="438" class="s">不旋转时点积恒为 0（两个向量垂直）。</text>
<text x="858" y="464" class="s">128 维、theta 500000 的随机向量：</text>
<text x="858" y="488" class="s">(10,7)、(1003,1000)、(100003,100000)</text>
<text x="858" y="512" class="s">点积都是 4.422094；(7,10) 为 −6.585。</text>
</svg>
