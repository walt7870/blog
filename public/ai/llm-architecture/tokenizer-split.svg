<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="680" viewBox="0 0 1400 680" role="img" aria-labelledby="tokenizer-split-title tokenizer-split-desc" id="tokenizer-split-root">
<title id="tokenizer-split-title">“年假怎么申请？”在 Llama 3 和 Qwen2.5 分词器里的切分过程</title>
<desc id="tokenizer-split-desc">分词分三步：先用正则预切分成“年假怎么申请”和“？”两段，再转成 21 个 UTF-8 字节，最后按合并规则合并成 token 并查出编号。实测两种分词器都切成 年、假、怎么、申请、？ 五个 token，编号不同。“钉钉审批”在 Llama 3 里切成 6 个 token，“钉”拆成 E9 92 和 89 两段字节；Qwen2.5 只要 3 个。</desc>
<defs><style>
#tokenizer-split-root text { font-family: Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #172b3a; }
#tokenizer-split-root .h { font-size: 26px; font-weight: 700; }
#tokenizer-split-root .t { font-size: 19px; font-weight: 600; }
#tokenizer-split-root .s { font-size: 15px; fill: #475569; }
#tokenizer-split-root .xs { font-size: 13px; fill: #64748b; }
#tokenizer-split-root .k { font-size: 13px; font-weight: 700; letter-spacing: .04em; fill: #64748b; }
#tokenizer-split-root .m { font-family: 'SFMono-Regular', Menlo, Consolas, monospace; font-size: 14px; fill: #172b3a; }
#tokenizer-split-root .node { fill: #fff; stroke: #cbd5e1; stroke-width: 2; }
#tokenizer-split-root .blue { fill: #eff6ff; stroke: #60a5fa; stroke-width: 2; }
#tokenizer-split-root .green { fill: #ecfdf5; stroke: #20a28c; stroke-width: 2; }
#tokenizer-split-root .red { fill: #fff1f2; stroke: #e88191; stroke-width: 2; }
#tokenizer-split-root .amber { fill: #fffbeb; stroke: #e0a63a; stroke-width: 2; }
#tokenizer-split-root .violet { fill: #f5f3ff; stroke: #9b87f5; stroke-width: 2; }
#tokenizer-split-root .gray { fill: #f1f5f9; stroke: #cbd5e1; stroke-width: 2; }
#tokenizer-split-root .fblue { fill: #93c5fd; } #tokenizer-split-root .fgreen { fill: #6ee7b7; } #tokenizer-split-root .fred { fill: #fda4af; }
#tokenizer-split-root .famber { fill: #fcd34d; } #tokenizer-split-root .fviolet { fill: #c4b5fd; } #tokenizer-split-root .fgray { fill: #e2e8f0; }
#tokenizer-split-root .edge { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#tokenizer-split-arrow); }
#tokenizer-split-root .dash { fill: none; stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 7 6; marker-end: url(#tokenizer-split-arrow); }
#tokenizer-split-root .line { stroke: #cbd5e1; stroke-width: 1.5; fill: none; }
#tokenizer-split-root .axis { stroke: #64748b; stroke-width: 2; fill: none; }
</style><marker id="tokenizer-split-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker></defs>
<rect width="1400" height="680" fill="#f8fafc"/>
<text x="32" y="46" class="h">文字怎样变成编号：预切分、字节、合并</text>
<text x="32" y="78" class="s">字节级 BPE 分词器的三步；编号来自本机加载 tokenizer.json 实测（Llama 3.1 与 Qwen2.5-0.5B-Instruct）。</text>
<text x="32" y="128" class="k">① 预切分：正则把连续的汉字归为一段，标点单独一段</text><text x="32" y="172" class="t">文本</text><rect x="250" y="142" width="940" height="46" rx="4" class="fgray"/><text x="720" y="170" text-anchor="middle" class="t">年假怎么申请</text><rect x="1198" y="142" width="150" height="46" rx="4" class="fgray"/><text x="1273" y="170" text-anchor="middle" class="t">？</text><text x="32" y="230" class="k">② 转成 UTF-8 字节：每个汉字 3 字节，共 21 字节，词表的起点是 256 个字节</text><text x="32" y="276" class="t">UTF-8 字节</text><rect x="250" y="244" width="150" height="52" rx="4" class="node"/><text x="325" y="266" class="s" text-anchor="middle">年</text><text x="325" y="287" class="m" text-anchor="middle">E5 B9 B4</text><rect x="408" y="244" width="150" height="52" rx="4" class="node"/><text x="483" y="266" class="s" text-anchor="middle">假</text><text x="483" y="287" class="m" text-anchor="middle">E5 81 87</text><rect x="566" y="244" width="150" height="52" rx="4" class="node"/><text x="641" y="266" class="s" text-anchor="middle">怎</text><text x="641" y="287" class="m" text-anchor="middle">E6 80 8E</text><rect x="724" y="244" width="150" height="52" rx="4" class="node"/><text x="799" y="266" class="s" text-anchor="middle">么</text><text x="799" y="287" class="m" text-anchor="middle">E4 B9 88</text><rect x="882" y="244" width="150" height="52" rx="4" class="node"/><text x="957" y="266" class="s" text-anchor="middle">申</text><text x="957" y="287" class="m" text-anchor="middle">E7 94 B3</text><rect x="1040" y="244" width="150" height="52" rx="4" class="node"/><text x="1115" y="266" class="s" text-anchor="middle">请</text><text x="1115" y="287" class="m" text-anchor="middle">E8 AF B7</text><rect x="1198" y="244" width="150" height="52" rx="4" class="node"/><text x="1273" y="266" class="s" text-anchor="middle">？</text><text x="1273" y="287" class="m" text-anchor="middle">EF BC 9F</text><text x="32" y="340" class="k">③ 按训练时学到的合并规则把字节合并成 token，再换成编号（实测）</text><text x="32" y="386" class="t">Llama 3</text><rect x="250" y="356" width="150" height="56" rx="4" class="fblue"/><text x="325" y="380" class="s" text-anchor="middle">年</text><text x="325" y="402" class="m" text-anchor="middle">8107</text><rect x="408" y="356" width="150" height="56" rx="4" class="fblue"/><text x="483" y="380" class="s" text-anchor="middle">假</text><text x="483" y="402" class="m" text-anchor="middle">107099</text><rect x="566" y="356" width="308" height="56" rx="4" class="fblue"/><text x="720" y="380" class="s" text-anchor="middle">怎么</text><text x="720" y="402" class="m" text-anchor="middle">104237</text><rect x="882" y="356" width="308" height="56" rx="4" class="fblue"/><text x="1036" y="380" class="s" text-anchor="middle">申请</text><text x="1036" y="402" class="m" text-anchor="middle">112838</text><rect x="1198" y="356" width="150" height="56" rx="4" class="fblue"/><text x="1273" y="380" class="s" text-anchor="middle">？</text><text x="1273" y="402" class="m" text-anchor="middle">11571</text><text x="32" y="458" class="t">Qwen2.5</text><rect x="250" y="428" width="150" height="56" rx="4" class="fblue"/><text x="325" y="452" class="s" text-anchor="middle">年</text><text x="325" y="474" class="m" text-anchor="middle">7948</text><rect x="408" y="428" width="150" height="56" rx="4" class="fblue"/><text x="483" y="452" class="s" text-anchor="middle">假</text><text x="483" y="474" class="m" text-anchor="middle">99436</text><rect x="566" y="428" width="308" height="56" rx="4" class="fblue"/><text x="720" y="452" class="s" text-anchor="middle">怎么</text><text x="720" y="474" class="m" text-anchor="middle">99494</text><rect x="882" y="428" width="308" height="56" rx="4" class="fblue"/><text x="1036" y="452" class="s" text-anchor="middle">申请</text><text x="1036" y="474" class="m" text-anchor="middle">101915</text><rect x="1198" y="428" width="150" height="56" rx="4" class="fblue"/><text x="1273" y="452" class="s" text-anchor="middle">？</text><text x="1273" y="474" class="m" text-anchor="middle">11319</text><text x="32" y="534" class="k">同样的流程，词表里没有的字只能停在字节片段：“钉钉审批”（实测）</text><text x="32" y="580" class="t">Llama 3</text><rect x="250" y="550" width="100" height="46" rx="4" class="fred"/><text x="300" y="578" text-anchor="middle" class="s">E9 92</text><rect x="358" y="550" width="64" height="46" rx="4" class="fred"/><text x="390" y="578" text-anchor="middle" class="s">89</text><rect x="430" y="550" width="100" height="46" rx="4" class="fred"/><text x="480" y="578" text-anchor="middle" class="s">E9 92</text><rect x="538" y="550" width="64" height="46" rx="4" class="fred"/><text x="570" y="578" text-anchor="middle" class="s">89</text><rect x="610" y="550" width="64" height="46" rx="4" class="fblue"/><text x="642" y="578" text-anchor="middle" class="s">审</text><rect x="682" y="550" width="64" height="46" rx="4" class="fblue"/><text x="714" y="578" text-anchor="middle" class="s">批</text><text x="766" y="580" class="s">6 个 token：“钉”拆成两段字节，单独解码是乱码</text><text x="32" y="638" class="t">Qwen2.5</text><rect x="250" y="608" width="64" height="46" rx="4" class="fblue"/><text x="282" y="636" text-anchor="middle" class="s">钉</text><rect x="322" y="608" width="64" height="46" rx="4" class="fblue"/><text x="354" y="636" text-anchor="middle" class="s">钉</text><rect x="394" y="608" width="132" height="46" rx="4" class="fblue"/><text x="460" y="636" text-anchor="middle" class="s">审批</text><text x="546" y="638" class="s">3 个 token：“钉”是整字，“审批”是一个词</text>
</svg>
