<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="560" viewBox="0 0 1240 560" role="img" aria-labelledby="family-multiturn-title family-multiturn-desc" id="family-multiturn-root">
<title id="family-multiturn-title">多轮对话中解码器与编码器-解码器的缓存复用差异</title>
<desc id="family-multiturn-desc">解码器只有因果注意力，第一轮已有 token 的表示不受后来 token 影响，第二轮只需计算新增的 token，前面的 KV Cache 可以直接复用。编码器是双向的，新问题加入输入后，所有旧 token 的编码表示都会改变，整段历史要重新编码；解码器侧的交叉注意力 K、V 也要重算。</desc>
<defs><style>
#family-multiturn-root text { font-family: Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #172b3a; }
#family-multiturn-root .h { font-size: 26px; font-weight: 700; }
#family-multiturn-root .t { font-size: 19px; font-weight: 600; }
#family-multiturn-root .s { font-size: 15px; fill: #475569; }
#family-multiturn-root .xs { font-size: 13px; fill: #64748b; }
#family-multiturn-root .k { font-size: 13px; font-weight: 700; letter-spacing: .04em; fill: #64748b; }
#family-multiturn-root .m { font-family: 'SFMono-Regular', Menlo, Consolas, monospace; font-size: 14px; fill: #172b3a; }
#family-multiturn-root .node { fill: #fff; stroke: #cbd5e1; stroke-width: 2; }
#family-multiturn-root .blue { fill: #eff6ff; stroke: #60a5fa; stroke-width: 2; }
#family-multiturn-root .green { fill: #ecfdf5; stroke: #20a28c; stroke-width: 2; }
#family-multiturn-root .red { fill: #fff1f2; stroke: #e88191; stroke-width: 2; }
#family-multiturn-root .amber { fill: #fffbeb; stroke: #e0a63a; stroke-width: 2; }
#family-multiturn-root .violet { fill: #f5f3ff; stroke: #9b87f5; stroke-width: 2; }
#family-multiturn-root .gray { fill: #f1f5f9; stroke: #cbd5e1; stroke-width: 2; }
#family-multiturn-root .fblue { fill: #93c5fd; } #family-multiturn-root .fgreen { fill: #6ee7b7; } #family-multiturn-root .fred { fill: #fda4af; }
#family-multiturn-root .famber { fill: #fcd34d; } #family-multiturn-root .fviolet { fill: #c4b5fd; } #family-multiturn-root .fgray { fill: #e2e8f0; }
#family-multiturn-root .edge { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#family-multiturn-arrow); }
#family-multiturn-root .dash { fill: none; stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 7 6; marker-end: url(#family-multiturn-arrow); }
#family-multiturn-root .line { stroke: #cbd5e1; stroke-width: 1.5; fill: none; }
#family-multiturn-root .axis { stroke: #64748b; stroke-width: 2; fill: none; }
</style><marker id="family-multiturn-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker></defs>
<rect width="1240" height="560" fill="#f8fafc"/>
<text x="32" y="46" class="h">第二轮提问时，哪些计算能复用</text>
<text x="32" y="78" class="s">第一轮：system + “年假怎么申请？” + 回答；第二轮追加“要提前几天？”。灰色为复用，彩色为本轮要重新计算。</text>
<g data-node="d"><rect x="32" y="110" width="1176" height="190" rx="8" class="node"/><text x="50" y="136" class="k">Llama、Qwen</text><text x="50" y="162" class="t">解码器（因果注意力）</text></g>
<text x="52" y="196" class="xs">第一轮 + 回答</text>
<rect x="52" y="206" width="30" height="30" rx="4" class="fgray"/><rect x="86" y="206" width="30" height="30" rx="4" class="fgray"/><rect x="120" y="206" width="30" height="30" rx="4" class="fgray"/><rect x="154" y="206" width="30" height="30" rx="4" class="fgray"/><rect x="188" y="206" width="30" height="30" rx="4" class="fgray"/><rect x="222" y="206" width="30" height="30" rx="4" class="fgray"/><rect x="256" y="206" width="30" height="30" rx="4" class="fgray"/><rect x="290" y="206" width="30" height="30" rx="4" class="fgray"/><rect x="324" y="206" width="30" height="30" rx="4" class="fgray"/><rect x="358" y="206" width="30" height="30" rx="4" class="fgray"/><rect x="392" y="206" width="30" height="30" rx="4" class="fgray"/><rect x="426" y="206" width="30" height="30" rx="4" class="fgray"/><rect x="460" y="206" width="30" height="30" rx="4" class="fgray"/><rect x="494" y="206" width="30" height="30" rx="4" class="fgray"/><rect x="528" y="206" width="30" height="30" rx="4" class="fgray"/><rect x="562" y="206" width="30" height="30" rx="4" class="fgray"/>
<text x="604" y="196" class="xs">第二轮新增</text>
<rect x="604" y="206" width="30" height="30" rx="4" class="fgreen"/><rect x="638" y="206" width="30" height="30" rx="4" class="fgreen"/><rect x="672" y="206" width="30" height="30" rx="4" class="fgreen"/><rect x="706" y="206" width="30" height="30" rx="4" class="fgreen"/><rect x="740" y="206" width="30" height="30" rx="4" class="fgreen"/><rect x="774" y="206" width="30" height="30" rx="4" class="fgreen"/>
<text x="52" y="274" class="s">每个位置只看左边，旧 token 的 K、V 不会因为后面来了新问题而改变：只为 6 个新 token 计算。</text>
<g data-node="e"><rect x="32" y="324" width="1176" height="210" rx="8" class="node"/><text x="50" y="350" class="k">T5 式</text><text x="50" y="376" class="t">编码器-解码器（双向编码）</text></g>
<text x="52" y="410" class="xs">编码器输入：历史 + 新问题</text>
<rect x="52" y="420" width="30" height="30" rx="4" class="fblue"/><rect x="86" y="420" width="30" height="30" rx="4" class="fblue"/><rect x="120" y="420" width="30" height="30" rx="4" class="fblue"/><rect x="154" y="420" width="30" height="30" rx="4" class="fblue"/><rect x="188" y="420" width="30" height="30" rx="4" class="fblue"/><rect x="222" y="420" width="30" height="30" rx="4" class="fblue"/><rect x="256" y="420" width="30" height="30" rx="4" class="fblue"/><rect x="290" y="420" width="30" height="30" rx="4" class="fblue"/><rect x="324" y="420" width="30" height="30" rx="4" class="fblue"/><rect x="358" y="420" width="30" height="30" rx="4" class="fblue"/><rect x="392" y="420" width="30" height="30" rx="4" class="fblue"/><rect x="426" y="420" width="30" height="30" rx="4" class="fblue"/><rect x="460" y="420" width="30" height="30" rx="4" class="fblue"/><rect x="494" y="420" width="30" height="30" rx="4" class="fblue"/><rect x="528" y="420" width="30" height="30" rx="4" class="fblue"/><rect x="562" y="420" width="30" height="30" rx="4" class="fblue"/><rect x="596" y="420" width="30" height="30" rx="4" class="fblue"/><rect x="630" y="420" width="30" height="30" rx="4" class="fblue"/><rect x="664" y="420" width="30" height="30" rx="4" class="fblue"/><rect x="698" y="420" width="30" height="30" rx="4" class="fblue"/><rect x="732" y="420" width="30" height="30" rx="4" class="fblue"/><rect x="766" y="420" width="30" height="30" rx="4" class="fblue"/>
<text x="52" y="488" class="s">双向注意力里，旧 token 也要看新问题：22 个位置的编码全部重算，交叉注意力用的 K、V 跟着重算。</text>
<text x="52" y="514" class="s">把“历史”和“新问题”拆开编码可以省算力，但新问题就看不到上下文，或要改模型结构。</text>
</svg>
