<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="660" viewBox="0 0 1400 660" role="img" aria-labelledby="attention-qkv-example-title attention-qkv-example-desc" id="attention-qkv-example-root">
<title id="attention-qkv-example-title">4 个 token 的注意力手算：从 X 到 Q、K、V，再到“申请”的输出</title>
<desc id="attention-qkv-example-desc">4 个 token 年、假、怎么、申请各有一个 4 维向量，组成 X；X 分别乘 W_Q、W_K、W_V 得到 4×2 的 Q、K、V。“申请”的 q=[2,0] 与各位置 k 的点积是 2、4、0、0，除以 √2 得 1.414、2.828、0、0，取指数后归一化，权重为 0.179、0.735、0.043、0.043，按权重加权 V 得到输出 [1.648, 0.087]，主要来自“假”。</desc>
