<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="560" viewBox="0 0 1240 560" role="img" aria-labelledby="position-llama4-layers-title position-llama4-layers-desc" id="position-llama4-layers-root">
<title id="position-llama4-layers-title">Llama 4 的 iRoPE：每 4 层中 3 层用 RoPE 加分块注意力，1 层不用位置编码看全局</title>
<desc id="position-llama4-layers-desc">Llama 4 Scout 的 48 层里，第 3、7、11 … 47 层（每第 4 层）是 NoPE 层，不加旋转位置编码，做全局因果注意力，并按位置对查询向量做温度缩放；其余 36 层用 RoPE，注意力限制在 8192 个 token 的块内。下方用 8 个 token、块长 4 示意两种掩码。</desc>
<defs><style>
