#position-llama4-layers-root .axis { stroke: #64748b; stroke-width: 2; fill: none; }
</style><marker id="position-llama4-layers-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker></defs>
<rect width="1240" height="560" fill="#f8fafc"/>
<text x="32" y="46" class="h">Llama 4：3 层 RoPE 管“附近”，1 层 NoPE 管“全局”</text>
<text x="32" y="78" class="s">Llama 4 Scout config.json：no_rope_layers 每第 4 项为 0，attention_chunk_size 8192；Maverick 的层模式相同。</text>
