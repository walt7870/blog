<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="730" viewBox="0 0 1400 730" role="img" aria-labelledby="reading-class-tree-title reading-class-tree-desc" id="reading-class-tree-root">
<title id="reading-class-tree-title">Transformers 中 Llama 的类嵌套结构与 modular 文件</title>
<desc id="reading-class-tree-desc">LlamaForCausalLM 包含 model（LlamaModel）和 lm_head；LlamaModel 包含 embed_tokens、rotary_emb、norm 和 32 个 LlamaDecoderLayer；每个解码器层包含 LlamaAttention（q、k、v、o 四个投影）和 LlamaMLP（gate、up、down），以及两个 RMSNorm。LlamaConfig 传给所有模块的构造函数。右侧：modular_qwen3.py 只写与父类不同的部分，由转换脚本生成完整的 modeling_qwen3.py。</desc>
<defs><style>
#reading-class-tree-root text { font-family: Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #172b3a; }
#reading-class-tree-root .h { font-size: 26px; font-weight: 700; }
#reading-class-tree-root .t { font-size: 19px; font-weight: 600; }
#reading-class-tree-root .s { font-size: 15px; fill: #475569; }
#reading-class-tree-root .xs { font-size: 13px; fill: #64748b; }
#reading-class-tree-root .k { font-size: 13px; font-weight: 700; letter-spacing: .04em; fill: #64748b; }
#reading-class-tree-root .m { font-family: 'SFMono-Regular', Menlo, Consolas, monospace; font-size: 14px; fill: #172b3a; }
#reading-class-tree-root .node { fill: #fff; stroke: #cbd5e1; stroke-width: 2; }
#reading-class-tree-root .blue { fill: #eff6ff; stroke: #60a5fa; stroke-width: 2; }
#reading-class-tree-root .green { fill: #ecfdf5; stroke: #20a28c; stroke-width: 2; }
#reading-class-tree-root .red { fill: #fff1f2; stroke: #e88191; stroke-width: 2; }
#reading-class-tree-root .amber { fill: #fffbeb; stroke: #e0a63a; stroke-width: 2; }
#reading-class-tree-root .violet { fill: #f5f3ff; stroke: #9b87f5; stroke-width: 2; }
#reading-class-tree-root .gray { fill: #f1f5f9; stroke: #cbd5e1; stroke-width: 2; }
#reading-class-tree-root .fblue { fill: #93c5fd; } #reading-class-tree-root .fgreen { fill: #6ee7b7; } #reading-class-tree-root .fred { fill: #fda4af; }
#reading-class-tree-root .famber { fill: #fcd34d; } #reading-class-tree-root .fviolet { fill: #c4b5fd; } #reading-class-tree-root .fgray { fill: #e2e8f0; }
#reading-class-tree-root .edge { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#reading-class-tree-arrow); }
#reading-class-tree-root .dash { fill: none; stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 7 6; marker-end: url(#reading-class-tree-arrow); }
#reading-class-tree-root .line { stroke: #cbd5e1; stroke-width: 1.5; fill: none; }
#reading-class-tree-root .axis { stroke: #64748b; stroke-width: 2; fill: none; }
</style><marker id="reading-class-tree-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker></defs>
<rect width="1400" height="730" fill="#f8fafc"/>
<text x="32" y="46" class="h">modeling_*.py 里的类怎样一层套一层</text>
<text x="32" y="78" class="s">左边是 LlamaForCausalLM 的模块树（冒号前是属性名，冒号后是类名）；右边是 modular 文件和生成文件的关系</text>
<g data-node="c0"><rect x="40" y="110" width="900" height="590" rx="8" class="node"/><text x="56" y="138" class="m">LlamaForCausalLM</text><text x="56" y="162" class="xs">加上 lm_head，算 logits 和损失，提供 generate()</text></g>
<g data-node="c1"><rect x="70" y="180" width="840" height="430" rx="8" class="gray"/><text x="86" y="208" class="m">model: LlamaModel</text><text x="86" y="232" class="xs">词嵌入 → 32 层 → 最终 norm；负责掩码和 RoPE 的 cos/sin</text></g>
<g data-node="c2"><rect x="100" y="250" width="240" height="64" rx="8" class="blue"/><text x="116" y="278" class="m">embed_tokens</text><text x="116" y="302" class="xs">nn.Embedding</text></g>
<g data-node="c3"><rect x="360" y="250" width="250" height="64" rx="8" class="node"/><text x="376" y="278" class="m">rotary_emb</text><text x="376" y="302" class="xs">LlamaRotaryEmbedding</text></g>
<g data-node="c4"><rect x="630" y="250" width="250" height="64" rx="8" class="node"/><text x="646" y="278" class="m">norm</text><text x="646" y="302" class="xs">LlamaRMSNorm</text></g>
<g data-node="c5"><rect x="100" y="334" width="780" height="256" rx="8" class="violet"/><text x="116" y="362" class="m">layers: ModuleList[LlamaDecoderLayer] × 32</text><text x="116" y="386" class="xs">每层：norm → 注意力 → 加残差 → norm → MLP → 加残差</text></g>
<g data-node="c6"><rect x="130" y="404" width="330" height="166" rx="8" class="node"/><text x="146" y="432" class="m">self_attn: LlamaAttention</text><text x="146" y="456" class="xs">q_proj  k_proj  v_proj  o_proj</text></g>
<text x="146" y="490" class="xs">缓存读写 past_key_values</text>
<text x="146" y="512" class="xs">按 _attn_implementation 选 sdpa / flash</text>
<g data-node="c7"><rect x="480" y="404" width="370" height="166" rx="8" class="node"/><text x="496" y="432" class="m">mlp: LlamaMLP</text><text x="496" y="456" class="xs">gate_proj  up_proj  down_proj</text></g>
<text x="496" y="490" class="xs">down(act(gate(x)) * up(x))</text>
<text x="496" y="512" class="xs">另有 input_layernorm、post_attention_layernorm</text>
<g data-node="c8"><rect x="70" y="626" width="840" height="56" rx="8" class="amber"/><text x="86" y="654" class="m">lm_head: nn.Linear(4096, 128256)</text></g>
<g data-node="d1"><rect x="1000" y="110" width="360" height="110" rx="8" class="gray"/><text x="1016" y="138" class="m">LlamaConfig</text><text x="1016" y="162" class="xs">读 config.json；每个 __init__ 都收它</text></g>
<path d="M1000 165H940" class="dash"/>
<g data-node="d2"><rect x="1000" y="330" width="360" height="92" rx="8" class="amber"/><text x="1016" y="358" class="m">modular_qwen3.py</text><text x="1016" y="382" class="xs">156 行：只写和父类不同的部分</text></g>
<g data-node="d3"><rect x="1000" y="520" width="360" height="92" rx="8" class="green"/><text x="1016" y="548" class="m">modeling_qwen3.py</text><text x="1016" y="572" class="xs">515 行：展开后的完整代码</text></g>
<path d="M1180 422V520" class="edge"/>
<rect x="1186" y="460" width="110" height="26" rx="4" fill="#f8fafc"/><text x="1192" y="478" class="s">转换脚本生成</text>
</svg>
