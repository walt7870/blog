<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="610" viewBox="0 0 1400 610" role="img" aria-labelledby="attention-quadratic-title attention-quadratic-desc" id="attention-quadratic-root">
<title id="attention-quadratic-title">注意力计算量与分数矩阵随上下文长度增长</title>
<desc id="attention-quadratic-desc">Llama-3.1-8B 处理第 n 个 token 时，和权重相乘的部分固定约 15 GFLOPs；注意力部分约 4×n×4096×32 FLOPs，8K 时 4.3、32K 时 17.2、128K 时 68.7 GFLOPs，超过固定部分。如果把每层 32 个头的 n×n 分数矩阵按 BF16 存下来，8K 要 4 GiB，32K 要 64 GiB，128K 要 1024 GiB。</desc>
<defs><style>
#attention-quadratic-root text { font-family: Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #172b3a; }
#attention-quadratic-root .h { font-size: 26px; font-weight: 700; }
#attention-quadratic-root .t { font-size: 19px; font-weight: 600; }
#attention-quadratic-root .s { font-size: 15px; fill: #475569; }
#attention-quadratic-root .xs { font-size: 13px; fill: #64748b; }
#attention-quadratic-root .k { font-size: 13px; font-weight: 700; letter-spacing: .04em; fill: #64748b; }
#attention-quadratic-root .m { font-family: 'SFMono-Regular', Menlo, Consolas, monospace; font-size: 14px; fill: #172b3a; }
#attention-quadratic-root .node { fill: #fff; stroke: #cbd5e1; stroke-width: 2; }
#attention-quadratic-root .blue { fill: #eff6ff; stroke: #60a5fa; stroke-width: 2; }
#attention-quadratic-root .green { fill: #ecfdf5; stroke: #20a28c; stroke-width: 2; }
#attention-quadratic-root .red { fill: #fff1f2; stroke: #e88191; stroke-width: 2; }
#attention-quadratic-root .amber { fill: #fffbeb; stroke: #e0a63a; stroke-width: 2; }
#attention-quadratic-root .violet { fill: #f5f3ff; stroke: #9b87f5; stroke-width: 2; }
#attention-quadratic-root .gray { fill: #f1f5f9; stroke: #cbd5e1; stroke-width: 2; }
#attention-quadratic-root .fblue { fill: #93c5fd; } #attention-quadratic-root .fgreen { fill: #6ee7b7; } #attention-quadratic-root .fred { fill: #fda4af; }
#attention-quadratic-root .famber { fill: #fcd34d; } #attention-quadratic-root .fviolet { fill: #c4b5fd; } #attention-quadratic-root .fgray { fill: #e2e8f0; }
#attention-quadratic-root .edge { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#attention-quadratic-arrow); }
#attention-quadratic-root .dash { fill: none; stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 7 6; marker-end: url(#attention-quadratic-arrow); }
#attention-quadratic-root .line { stroke: #cbd5e1; stroke-width: 1.5; fill: none; }
#attention-quadratic-root .axis { stroke: #64748b; stroke-width: 2; fill: none; }
</style><marker id="attention-quadratic-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker></defs>
<rect width="1400" height="610" fill="#f8fafc"/>
<text x="32" y="46" class="h">长度的代价：每个 token 的注意力计算随长度线性涨，整段随长度平方涨</text>
<text x="32" y="78" class="s">Llama-3.1-8B，单个 token 在第 n 个位置时的前向计算量（估算）；右侧为分数矩阵的理论大小。</text>
<path d="M140 520H840" class="line"/><text x="128" y="525" class="xs" text-anchor="end">0</text><path d="M140 435H840" class="line"/><text x="128" y="440" class="xs" text-anchor="end">20</text><path d="M140 350H840" class="line"/><text x="128" y="355" class="xs" text-anchor="end">40</text><path d="M140 265H840" class="line"/><text x="128" y="270" class="xs" text-anchor="end">60</text><path d="M140 180H840" class="line"/><text x="128" y="185" class="xs" text-anchor="end">80</text><path d="M140 520H850" class="axis"/><path d="M140 520V166" class="axis"/><text x="128" y="154" class="xs">GFLOPs / token</text><rect x="200" y="456.25" width="70" height="63.8" class="fgray"/><rect x="280" y="501.7" width="70" height="18.3" class="fred"/><text x="235" y="448.25" class="xs" text-anchor="middle">15.0</text><text x="315" y="493.746388992" class="xs" text-anchor="middle">4.3</text><text x="275" y="546" class="s" text-anchor="middle">上下文 8K</text><rect x="420" y="456.25" width="70" height="63.8" class="fgray"/><rect x="500" y="447.0" width="70" height="73.0" class="fred"/><text x="455" y="448.25" class="xs" text-anchor="middle">15.0</text><text x="535" y="438.98555596799997" class="xs" text-anchor="middle">17.2</text><text x="495" y="546" class="s" text-anchor="middle">上下文 32K</text><rect x="640" y="456.25" width="70" height="63.8" class="fgray"/><rect x="720" y="227.9" width="70" height="292.1" class="fred"/><text x="675" y="448.25" class="xs" text-anchor="middle">15.0</text><text x="755" y="219.942223872" class="xs" text-anchor="middle">68.7</text><text x="715" y="546" class="s" text-anchor="middle">上下文 128K</text><rect x="140" y="568" width="26" height="18" rx="4" class="fgray"/><text x="176" y="583" class="xs">与权重相乘（固定）</text><rect x="370" y="568" width="26" height="18" rx="4" class="fred"/><text x="406" y="583" class="xs">注意力 QKᵀ 与加权 V（随长度增长）</text><g data-node="mem"><rect x="920" y="150" width="450" height="200" rx="8" class="red"/><text x="938" y="186" class="t">如果把分数矩阵整张存下来</text><text x="938" y="214" class="s">每层 32 个头，每个 n × n，BF16</text><text x="938" y="237" class="s">8K：4 GiB / 层</text><text x="938" y="260" class="s">32K：64 GiB / 层</text><text x="938" y="283" class="s">128K：1024 GiB / 层</text><text x="938" y="306" class="s">长度翻 4 倍，这张表涨 16 倍</text></g><g data-node="fa"><rect x="920" y="380" width="450" height="140" rx="8" class="green"/><text x="938" y="416" class="t">实际推理怎样避开</text><text x="938" y="444" class="s">FlashAttention 分块计算，不写出整张表</text><text x="938" y="467" class="s">计算量不变，显存不再随 n² 增长</text><text x="938" y="490" class="s">见第 11 篇和推理系列第 12 篇</text></g>
</svg>
