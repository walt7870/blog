<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
  <title id="title">AI 应用架构</title><desc id="desc">展示一次 AI 请求经过交互、编排、知识模型工具与治理层的完整链路</desc>
  <defs><style>.bg{fill:#f8fafc}.lane{fill:#fff;stroke:#cbd5e1;stroke-width:2}.label{fill:#334155}.card{fill:#eff6ff;stroke:#60a5fa;stroke-width:2}.tool{fill:#ecfdf5;stroke:#2dd4bf;stroke-width:2}.guard{fill:#fff7ed;stroke:#fb923c;stroke-width:2}text{font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#0f172a}.head{font-size:27px;font-weight:700}.lt{font-size:17px;font-weight:700;fill:#fff!important}.title{font-size:17px;font-weight:700}.body{font-size:13px;fill:#475569}.line{stroke:#64748b;stroke-width:2.3;fill:none}</style><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9z" fill="#64748b"/></marker></defs>
  <rect class="bg" width="1200" height="600"/><text class="head" x="55" y="55">模型位于应用内部，事实、动作和责任来自完整系统</text>
  <g transform="translate(55 95)"><rect class="lane" width="1090" height="90" rx="12"/><rect class="label" width="145" height="90" rx="12"/><rect class="label" x="133" width="12" height="90"/><text class="lt" fill="#fff" x="72" y="53" text-anchor="middle">交互入口</text><g transform="translate(180 18)"><rect class="card" width="230" height="54" rx="8"/><text class="title" x="115" y="33" text-anchor="middle">Web / App / API / 语音</text></g><g transform="translate(445 18)"><rect class="guard" width="260" height="54" rx="8"/><text class="title" x="130" y="33" text-anchor="middle">身份、限流、输入校验</text></g><g transform="translate(740 18)"><rect class="card" width="300" height="54" rx="8"/><text class="title" x="150" y="33" text-anchor="middle">流式响应、引用、用户确认</text></g></g>
  <path class="line" marker-end="url(#arrow)" d="M600 185 L600 210"/>
  <g transform="translate(55 212)"><rect class="lane" width="1090" height="105" rx="12"/><rect class="label" width="145" height="105" rx="12"/><rect class="label" x="133" width="12" height="105"/><text class="lt" fill="#fff" x="72" y="60" text-anchor="middle">应用编排</text><g transform="translate(180 18)"><rect class="card" width="260" height="69" rx="8"/><text class="title" x="130" y="30" text-anchor="middle">上下文构建</text><text class="body" x="130" y="53" text-anchor="middle">目标、历史、权限、资料</text></g><g transform="translate(475 18)"><rect class="card" width="260" height="69" rx="8"/><text class="title" x="130" y="30" text-anchor="middle">工作流 / Agent</text><text class="body" x="130" y="53" text-anchor="middle">状态、步骤、停止条件</text></g><g transform="translate(770 18)"><rect class="guard" width="270" height="69" rx="8"/><text class="title" x="135" y="30" text-anchor="middle">输出与动作校验</text><text class="body" x="135" y="53" text-anchor="middle">schema、规则、确认、幂等</text></g></g>
  <path class="line" marker-end="url(#arrow)" d="M600 317 L600 342"/>
  <g transform="translate(55 344)"><rect class="lane" width="1090" height="112" rx="12"/><rect class="label" width="145" height="112" rx="12"/><rect class="label" x="133" width="12" height="112"/><text class="lt" fill="#fff" x="72" y="51" text-anchor="middle">能力与事实</text><text class="lt" fill="#fff" x="72" y="77" text-anchor="middle">外部动作</text><g transform="translate(180 20)"><rect class="card" width="250" height="72" rx="8"/><text class="title" x="125" y="31" text-anchor="middle">模型能力</text><text class="body" x="125" y="55" text-anchor="middle">理解、预测、生成、识别</text></g><g transform="translate(465 20)"><rect class="tool" width="250" height="72" rx="8"/><text class="title" x="125" y="31" text-anchor="middle">知识与检索</text><text class="body" x="125" y="55" text-anchor="middle">文档、搜索、RAG、数据库</text></g><g transform="translate(750 20)"><rect class="tool" width="290" height="72" rx="8"/><text class="title" x="145" y="31" text-anchor="middle">受控工具</text><text class="body" x="145" y="55" text-anchor="middle">业务 API、MCP、查询与写入</text></g></g>
  <path class="line" marker-end="url(#arrow)" d="M600 456 L600 481"/>
  <g transform="translate(55 483)"><rect class="lane" width="1090" height="82" rx="12"/><rect class="label" width="145" height="82" rx="12"/><rect class="label" x="133" width="12" height="82"/><text class="lt" fill="#fff" x="72" y="49" text-anchor="middle">治理底座</text><text class="body" x="220" y="36">评估与回归</text><text class="body" x="420" y="36">日志与 Trace</text><text class="body" x="610" y="36">权限与审计</text><text class="body" x="795" y="36">成本与容量</text><text class="body" x="980" y="36">降级与回滚</text><text class="body" x="590" y="63" text-anchor="middle">模型、Prompt、索引、工具和业务代码统一版本化</text></g>
</svg>
