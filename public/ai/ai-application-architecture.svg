<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="550" viewBox="0 0 1120 550" role="img" aria-labelledby="ai-application-architecture-title ai-application-architecture-desc"><title id="ai-application-architecture-title">退款助手：模型组织说明，业务系统决定事实与动作</title><desc id="ai-application-architecture-desc">用户身份先鉴权，应用查询政策和订单，再调用模型；退款等写入走独立业务网关。</desc><defs><marker id="ai-application-architecture-a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#526678"/></marker><style>text{font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#243746}.h{font-size:26px;font-weight:700}.t{font-size:19px;font-weight:700}.s{font-size:16px;fill:#526678}.b{fill:#fff;stroke:#b9cbd4;stroke-width:1.5}.f{fill:#e5f4ee;stroke:#43836e;stroke-width:1.5}.l{fill:none;stroke:#526678;stroke-width:2;marker-end:url(#ai-application-architecture-a)}.d{stroke-dasharray:6 5}</style></defs><rect width="1120" height="550" fill="#f4f8fa"/><text x="36" y="48" class="h">退款助手：模型组织说明，业务系统决定事实与动作</text><text x="36" y="80" class="s">用户问“我的退款到账了吗？”：政策解释与实时退款状态来自不同数据源。</text>
<path class="l" d="M240 186H300"/><path class="l" d="M520 186H580"/><path class="l" d="M800 186H860"/>
<rect x="36" y="140" width="204" height="118" rx="6" class="f"/><text x="52" y="171" class="t">入口与身份</text><text x="52" y="197" class="s">会话鉴权、限流</text><text x="52" y="222" class="s">校验订单归属</text>
<rect x="300" y="140" width="220" height="118" rx="6" class="b"/><text x="316" y="171" class="t">应用编排</text><text x="316" y="197" class="s">目标、状态、步骤</text><text x="316" y="222" class="s">组装最小必要上下文</text>
<rect x="580" y="140" width="220" height="118" rx="6" class="b"/><text x="596" y="171" class="t">模型服务</text><text x="596" y="197" class="s">解释政策与查询结果</text><text x="596" y="222" class="s">不能自证订单已退款</text>
<rect x="860" y="140" width="224" height="118" rx="6" class="b"/><text x="876" y="171" class="t">校验与回复</text><text x="876" y="197" class="s">引用、字段、业务条件</text><text x="876" y="222" class="s">展示状态或请求确认</text>
<path class="l" d="M365 258V340"/><path class="l d" d="M455 340V258"/>
<rect x="280" y="340" width="260" height="118" rx="6" class="b"/><text x="296" y="371" class="t">受权读取</text><text x="296" y="397" class="s">文档索引：有效退款政策</text><text x="296" y="422" class="s">订单API：真实退款状态</text>
<path class="l" d="M972 258V340"/>
<rect x="820" y="340" width="264" height="118" rx="6" class="f"/><text x="836" y="371" class="t">动作网关（需要写入时）</text><text x="836" y="397" class="s">重新鉴权、确认、幂等</text><text x="836" y="422" class="s">执行后按业务ID回读</text>
<text x="36" y="509" class="s">业务状态留在业务库；Trace记录节点与版本并脱敏。重试模型调用不能重复触发业务写入。</text></svg>
