<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="652" viewBox="0 0 1120 652" role="img" aria-labelledby="skill-selection-boundaries-title skill-selection-boundaries-desc"><title id="skill-selection-boundaries-title">先判断任务与规则，再选择保存和执行方式</title><desc id="skill-selection-boundaries-desc">不同方式可组合：项目文档保存事实，Skill组织语义步骤，脚本或CI执行确定性门禁。</desc><defs><marker id="skill-selection-boundaries-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker><marker id="skill-selection-boundaries-open" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#64748b"/></marker><style>text{font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#172b3a}.head{font-size:27px;font-weight:700}.node{font-size:20px;font-weight:700}.body{font-size:17px;fill:#475569}.box{fill:white;stroke:#cbd5e1;stroke-width:2}.blue{fill:#eff6ff;stroke:#60a5fa;stroke-width:2}.green{fill:#ecfdf5;stroke:#14b8a6;stroke-width:2}.red{fill:#fff1f2;stroke:#e88191;stroke-width:2}.line{fill:none;stroke:#64748b;stroke-width:2}.dash{stroke-dasharray:6 5}</style></defs><rect width="1120" height="652" fill="#f8fafc"/><text x="40" y="48" class="head" text-anchor="start">先判断任务与规则，再选择保存和执行方式</text><text x="40" y="80" class="body" text-anchor="start">不同方式可组合：项目文档保存事实，Skill组织语义步骤，脚本或CI执行确定性门禁。</text><path d="M260 310H314Q322 310 322 302V184Q322 176 330 176H392" class="line" marker-end="url(#skill-selection-boundaries-arrow)"/><path d="M260 344H392" class="line" marker-end="url(#skill-selection-boundaries-arrow)"/><path d="M260 378H306Q314 378 314 386V504Q314 512 322 512H392" class="line" marker-end="url(#skill-selection-boundaries-arrow)"/><path d="M724 176H812" class="line" marker-end="url(#skill-selection-boundaries-arrow)"/><path d="M724 344H812" class="line" marker-end="url(#skill-selection-boundaries-arrow)"/><path d="M724 512H812" class="line" marker-end="url(#skill-selection-boundaries-arrow)"/><rect x="40" y="280" width="220" height="120" rx="6" class="box"/><text x="56" y="312" class="node" text-anchor="start">检查当前任务</text><text x="56" y="344" class="body" text-anchor="start">重复吗？规则稳定吗？</text><text x="56" y="369" class="body" text-anchor="start">需要模型判断吗？</text><rect x="392" y="120" width="332" height="120" rx="6" class="box"/><text x="408" y="152" class="node" text-anchor="start">事实说明或偶发探索</text><text x="408" y="184" class="body" text-anchor="start">目录、技术栈、临时目标</text><text x="408" y="209" class="body" text-anchor="start">还没有稳定的多步规程</text><rect x="812" y="120" width="268" height="120" rx="6" class="box"/><text x="828" y="152" class="node" text-anchor="start">项目文档 / 提示</text><text x="828" y="184" class="body" text-anchor="start">保留事实与任务边界</text><text x="828" y="209" class="body" text-anchor="start">探索后再决定是否固化</text><rect x="392" y="288" width="332" height="120" rx="6" class="blue"/><text x="408" y="320" class="node" text-anchor="start">重复且需要语义判断</text><text x="408" y="352" class="body" text-anchor="start">如文档机制审查、错误归因</text><text x="408" y="377" class="body" text-anchor="start">步骤可描述，结果需要核验</text><rect x="812" y="288" width="268" height="120" rx="6" class="green"/><text x="828" y="320" class="node" text-anchor="start">Skill</text><text x="828" y="352" class="body" text-anchor="start">窄触发、明确动作</text><text x="828" y="377" class="body" text-anchor="start">代表任务验证效果</text><rect x="392" y="456" width="332" height="120" rx="6" class="box"/><text x="408" y="488" class="node" text-anchor="start">输入输出与步骤固定</text><text x="408" y="520" class="body" text-anchor="start">如死链扫描、格式校验</text><text x="408" y="545" class="body" text-anchor="start">可直接确定通过或失败</text><rect x="812" y="456" width="268" height="120" rx="6" class="box"/><text x="828" y="488" class="node" text-anchor="start">脚本 / CI</text><text x="828" y="520" class="body" text-anchor="start">自动执行并硬性拦截</text><text x="828" y="545" class="body" text-anchor="start">Skill可调用但不替代它</text><text x="40" y="624" class="body" text-anchor="start">现成Skill也需审查脚本、联网与工具许可；规则数量不等于任务成功率。</text></svg>
