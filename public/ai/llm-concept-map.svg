<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="690" viewBox="0 0 1120 690" role="img" aria-labelledby="llm-concept-map-title llm-concept-map-desc"><title id="llm-concept-map-title">把概念放回离线训练与在线问答，才能看清各自作用</title><desc id="llm-concept-map-desc">以退款助手为例；训练更新参数，在线检索和工具结果进入当前上下文。</desc><defs><marker id="llm-concept-map-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker><style>text{font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#172b3a}.head{font-size:27px;font-weight:700}.node{font-size:20px;font-weight:700}.body{font-size:17px;fill:#475569}.box{fill:white;stroke:#cbd5e1;stroke-width:2}.blue{fill:#eff6ff;stroke:#60a5fa;stroke-width:2}.green{fill:#ecfdf5;stroke:#14b8a6;stroke-width:2}.red{fill:#fff1f2;stroke:#e88191;stroke-width:2}.line{fill:none;stroke:#64748b;stroke-width:2}.dash{stroke-dasharray:6 5}</style></defs><rect width="1120" height="690" fill="#f8fafc"/><text x="40" y="48" class="head" text-anchor="start">把概念放回离线训练与在线问答，才能看清各自作用</text><text x="40" y="80" class="body" text-anchor="start">以退款助手为例；训练更新参数，在线检索和工具结果进入当前上下文。</text><path d="M310 205H380" class="line" marker-end="url(#llm-concept-map-arrow)"/><path d="M690 205H760" class="line" marker-end="url(#llm-concept-map-arrow)"/><path d="M920 270V333Q920 341 912 341H568Q560 341 560 349V405" class="line" marker-end="url(#llm-concept-map-arrow)"/><path d="M310 465H380" class="line" marker-end="url(#llm-concept-map-arrow)"/><path d="M690 465H760" class="line" marker-end="url(#llm-concept-map-arrow)"/><rect x="40" y="140" width="270" height="130" rx="6" class="box"/><text x="56" y="172" class="node" text-anchor="start">训练数据与目标</text><text x="56" y="202" class="body" text-anchor="start">预训练 / SFT / 偏好数据</text><text x="56" y="227" class="body" text-anchor="start">独立评估与数据授权</text><rect x="380" y="140" width="310" height="130" rx="6" class="blue"/><text x="396" y="172" class="node" text-anchor="start">模型结构与参数适配</text><text x="396" y="202" class="body" text-anchor="start">Transformer / Attention / MoE</text><text x="396" y="227" class="body" text-anchor="start">全参数或 LoRA / QLoRA</text><text x="396" y="252" class="body" text-anchor="start">SFT可采用LoRA，不是二选一</text><rect x="760" y="140" width="320" height="130" rx="6" class="box"/><text x="776" y="172" class="node" text-anchor="start">模型与适配器工件</text><text x="776" y="202" class="body" text-anchor="start">权重、Tokenizer、配置</text><text x="776" y="227" class="body" text-anchor="start">绑定底座与输入输出合同</text><rect x="40" y="405" width="270" height="130" rx="6" class="green"/><text x="56" y="437" class="node" text-anchor="start">当前请求上下文</text><text x="56" y="467" class="body" text-anchor="start">政策RAG / 订单只读工具</text><text x="56" y="492" class="body" text-anchor="start">编码为Token与内部Embedding</text><rect x="380" y="405" width="310" height="130" rx="6" class="blue"/><text x="396" y="437" class="node" text-anchor="start">在线推理运行时</text><text x="396" y="467" class="body" text-anchor="start">加载工件，按序生成</text><text x="396" y="492" class="body" text-anchor="start">KV Cache / 量化 / 批处理</text><text x="396" y="517" class="body" text-anchor="start">流式片段仍需输出核验</text><rect x="760" y="405" width="320" height="130" rx="6" class="green"/><text x="776" y="437" class="node" text-anchor="start">应用结果与受控执行</text><text x="776" y="467" class="body" text-anchor="start">回答核对证据，工具独立鉴权</text><text x="776" y="492" class="body" text-anchor="start">Agent编排任务，MCP连接能力</text><text x="40" y="610" class="node" text-anchor="start">贯穿离线与在线：质量评估、版本记录、隐私、权限与故障恢复。</text><text x="40" y="652" class="body" text-anchor="start">概念不是互相替代的产品：新政策先更新证据，固定任务可评估SFT，退款仍由业务服务执行。</text></svg>
