<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="580" viewBox="0 0 1120 580" role="img" aria-labelledby="model-response-contract-title model-response-contract-desc"><title id="model-response-contract-title">模型响应：分清结果类型，再决定下一步</title><desc id="model-response-contract-desc">完整结构化结果经过schema和业务检查，工具请求进入受控执行，拒绝或截断不得执行。</desc><defs><marker id="model-response-contract-a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#526678"/></marker><style>text{font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#243746}.h{font-size:26px;font-weight:700}.t{font-size:19px;font-weight:700}.s{font-size:16px;fill:#526678}.b{fill:#fff;stroke:#b9cbd4;stroke-width:1.5}.f{fill:#e5f4ee;stroke:#43836e;stroke-width:1.5}.l{fill:none;stroke:#526678;stroke-width:2;marker-end:url(#model-response-contract-a)}.d{stroke-dasharray:6 5}</style></defs><rect width="1120" height="580" fill="#f4f8fa"/><text x="36" y="48" class="h">模型响应：分清结果类型，再决定下一步</text><text x="36" y="80" class="s">JSON可解析不等于字段正确；temperature=0也不保证每次输出相同。</text>
<rect x="36" y="240" width="220" height="102" rx="6" class="b"/><text x="52" y="271" class="t">模型服务</text><text x="52" y="297" class="s">返回最终结果或调用请求</text>
<rect x="330" y="240" width="220" height="102" rx="6" class="f"/><text x="346" y="271" class="t">协议解析与分派</text><text x="346" y="297" class="s">先确认停止原因</text><text x="346" y="322" class="s">再读取对应结果类型</text>
<path class="l" d="M256 291H330"/>
<path class="l" d="M550 260H590V151H650"/>
<path class="l" d="M550 291H650"/>
<path class="l" d="M550 320H610V451H650"/>
<rect x="650" y="100" width="434" height="102" rx="6" class="b"/><text x="666" y="131" class="t">工具调用请求</text><text x="666" y="157" class="s">校验参数、白名单、业务权限、幂等</text><text x="666" y="182" class="s">执行与回读后再决定是否请求模型</text>
<rect x="650" y="240" width="434" height="102" rx="6" class="b"/><text x="666" y="271" class="t">完整结构化结果</text><text x="666" y="297" class="s">Schema校验 → 业务条件检查 → 展示</text><text x="666" y="322" class="s">置信度字段不能直接当作校准概率</text>
<rect x="650" y="400" width="434" height="102" rx="6" class="b"/><text x="666" y="431" class="t">拒绝 / 截断 / 超时</text><text x="666" y="457" class="s">停止动作，按错误类型有限重试或降级</text><text x="666" y="482" class="s">流式半成品JSON不能用于业务执行</text>
<text x="36" y="550" class="s">API重试和业务动作重试分别记账；部分供应商只支持JSON Schema子集，需按实际能力配置。</text></svg>
