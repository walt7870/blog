<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 430" role="img" aria-labelledby="training-cycle-title training-cycle-desc"><title id="training-cycle-title">一次更新与独立验证</title><desc id="training-cycle-desc">训练数据经过预测、损失、梯度与参数更新形成循环，验证数据不参与梯度计算或更新。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#607d86"/></marker></defs><style>text{font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif;letter-spacing:0}</style><rect width="800" height="430" fill="#f7fafb"/><text x="24" y="36" font-size="27" fill="#263d45" text-anchor="start">每轮计算，都使用当前参数</text><path d="M200 132H210" stroke="#607d86" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M392 132H402" stroke="#607d86" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M584 132H594" stroke="#607d86" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="24" y="88" width="176" height="88" rx="6" fill="white" stroke="#a9bec5"/><text x="38" y="122" font-size="21" fill="#263d45" text-anchor="start">取训练样本</text><text x="38" y="153" font-size="17" fill="#526a74" text-anchor="start">固定输入与目标</text><rect x="216" y="88" width="176" height="88" rx="6" fill="white" stroke="#a9bec5"/><text x="230" y="122" font-size="21" fill="#263d45" text-anchor="start">前向与损失</text><text x="230" y="153" font-size="17" fill="#526a74" text-anchor="start">计算预测及偏差</text><rect x="408" y="88" width="176" height="88" rx="6" fill="white" stroke="#a9bec5"/><text x="422" y="122" font-size="21" fill="#263d45" text-anchor="start">反向求梯度</text><text x="422" y="153" font-size="17" fill="#526a74" text-anchor="start">计算局部变化率</text><rect x="600" y="88" width="176" height="88" rx="6" fill="white" stroke="#287356"/><text x="614" y="122" font-size="21" fill="#263d45" text-anchor="start">优化器更新</text><text x="614" y="153" font-size="17" fill="#526a74" text-anchor="start">修改 w 和 b</text><path d="M688 176V224H112V182" stroke="#287356" stroke-width="2" stroke-dasharray="5 4" fill="none" marker-end="url(#arrow)"/><text x="400" y="256" font-size="20" fill="#287356" text-anchor="middle">下一轮读取更新后的参数</text><text x="24" y="370" font-size="24" fill="#a16910" text-anchor="start">验证集：只观察，不反向更新</text><text x="24" y="406" font-size="22" fill="#526a74" text-anchor="start">最终测试：方案确定后独立评估</text></svg>
