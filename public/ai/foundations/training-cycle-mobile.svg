<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 620" role="img" aria-labelledby="training-cycle-mobile-title training-cycle-mobile-desc"><title id="training-cycle-mobile-title">一次更新与独立验证</title><desc id="training-cycle-mobile-desc">训练数据经过预测、损失、梯度与参数更新形成循环，验证数据不参与梯度计算或更新。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#607d86"/></marker></defs><style>text{font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif;letter-spacing:0}</style><rect width="480" height="620" fill="#f7fafb"/><text x="24" y="36" font-size="23" fill="#263d45" text-anchor="start">每轮计算，都使用当前参数</text><path d="M240 152V170" stroke="#607d86" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M240 264V282" stroke="#607d86" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M240 376V394" stroke="#607d86" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="40" y="64" width="400" height="88" rx="6" fill="white" stroke="#a9bec5"/><text x="54" y="98" font-size="23" fill="#263d45" text-anchor="start">取训练样本</text><text x="54" y="129" font-size="19" fill="#526a74" text-anchor="start">固定输入与目标</text><rect x="40" y="176" width="400" height="88" rx="6" fill="white" stroke="#a9bec5"/><text x="54" y="210" font-size="23" fill="#263d45" text-anchor="start">前向与损失</text><text x="54" y="241" font-size="19" fill="#526a74" text-anchor="start">计算预测及偏差</text><rect x="40" y="288" width="400" height="88" rx="6" fill="white" stroke="#a9bec5"/><text x="54" y="322" font-size="23" fill="#263d45" text-anchor="start">反向求梯度</text><text x="54" y="353" font-size="19" fill="#526a74" text-anchor="start">计算局部变化率</text><rect x="40" y="400" width="400" height="88" rx="6" fill="white" stroke="#287356"/><text x="54" y="434" font-size="23" fill="#263d45" text-anchor="start">优化器更新</text><text x="54" y="465" font-size="19" fill="#526a74" text-anchor="start">修改 w 和 b</text><path d="M440 444H460V54H240V60" stroke="#287356" stroke-width="2" stroke-dasharray="5 4" fill="none" marker-end="url(#arrow)"/><text x="24" y="528" font-size="20" fill="#287356" text-anchor="start">每轮重新读取已更新的参数</text><text x="24" y="560" font-size="21" fill="#a16910" text-anchor="start">验证集：只观察，不反向更新</text><text x="24" y="596" font-size="20" fill="#526a74" text-anchor="start">最终测试：方案确定后独立评估</text></svg>
