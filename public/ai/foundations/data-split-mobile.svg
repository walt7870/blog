<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 620" role="img" aria-labelledby="data-split-mobile-title data-split-mobile-desc"><title id="data-split-mobile-title">训练、验证与测试的职责</title><desc id="data-split-mobile-desc">先切分原始样本，同一来源的变体留在同一集合，只有训练集合用于更新参数。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#607d86"/></marker></defs><style>text{font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif;letter-spacing:0}</style><rect width="480" height="620" fill="#f7fafb"/><text x="24" y="36" font-size="23" fill="#263d45" text-anchor="start">先分开样本，再学习和选型</text><text x="24" y="80" font-size="20" fill="#263d45" text-anchor="start">原始样本按来源分组</text><circle cx="100" cy="116" r="7" fill="#2b78aa"/><circle cx="120" cy="116" r="7" fill="#2b78aa"/><circle cx="240" cy="116" r="7" fill="#287356"/><circle cx="260" cy="116" r="7" fill="#287356"/><circle cx="380" cy="116" r="7" fill="#a16910"/><circle cx="400" cy="116" r="7" fill="#a16910"/><path d="M250 132V146H32V462" stroke="#607d86" stroke-width="2" fill="none"/><path d="M32 222H56" stroke="#607d86" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="64" y="174" width="392" height="96" rx="6" fill="white" stroke="#2b78aa"/><text x="82" y="209" font-size="23" fill="#2b78aa" text-anchor="start">训练集</text><text x="82" y="243" font-size="19" fill="#263d45" text-anchor="start">更新参数</text><path d="M32 342H56" stroke="#607d86" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="64" y="294" width="392" height="96" rx="6" fill="white" stroke="#287356"/><text x="82" y="329" font-size="23" fill="#287356" text-anchor="start">验证集</text><text x="82" y="363" font-size="19" fill="#263d45" text-anchor="start">选择方案</text><path d="M32 462H56" stroke="#607d86" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="64" y="414" width="392" height="96" rx="6" fill="white" stroke="#a16910"/><text x="82" y="449" font-size="23" fill="#a16910" text-anchor="start">测试集</text><text x="82" y="483" font-size="19" fill="#263d45" text-anchor="start">方案冻结后评估</text><text x="24" y="572" font-size="19" fill="#263d45" text-anchor="start">同一原图及其增强版本放在同一组</text><text x="24" y="602" font-size="18" fill="#a0434d" text-anchor="start">测试结果不回流到本轮调参</text></svg>
