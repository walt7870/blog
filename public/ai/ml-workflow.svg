<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="400" viewBox="0 0 1120 400" role="img" aria-labelledby="ml-workflow-title ml-workflow-desc">
<title id="ml-workflow-title">模型效果需要在数据与业务之间闭环</title><desc id="ml-workflow-desc">监督学习示例：先定义决策和标签，离线评估后仍需验证真实运行效果。</desc>
<defs><marker id="ml-workflow-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker><style>text{font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#172b3a}.head{font-size:28px;font-weight:700}.node{font-size:20px;font-weight:700}.body{font-size:17px;fill:#475569}.value{font-size:32px;font-weight:700}.box{fill:white;stroke:#cbd5e1;stroke-width:2}.blue{fill:#eff6ff;stroke:#60a5fa;stroke-width:2}.green{fill:#ecfdf5;stroke:#14b8a6;stroke-width:2}.red{fill:#fff1f2;stroke:#e88191;stroke-width:2}.line{stroke:#64748b;stroke-width:2;fill:none}.dashed{stroke-dasharray:6 5}</style></defs>
<rect width="1120" height="400" fill="#f8fafc"/>
<text class="head" x="40" y="48" text-anchor="start">模型效果需要在数据与业务之间闭环</text><text class="body" x="40" y="80" text-anchor="start">监督学习示例：先定义决策和标签，离线评估后仍需验证真实运行效果。</text><path class="line" marker-end="url(#ml-workflow-arrow)" d="M180 200H220"/><path class="line" marker-end="url(#ml-workflow-arrow)" d="M360 200H400"/><path class="line" marker-end="url(#ml-workflow-arrow)" d="M540 200H580"/><path class="line" marker-end="url(#ml-workflow-arrow)" d="M720 200H760"/><path class="line" marker-end="url(#ml-workflow-arrow)" d="M900 200H940"/><path class="line dashed" marker-end="url(#ml-workflow-arrow)" d="M1010 255V300H290V255"/><rect class="box" x="40" y="145" width="140" height="110" rx="6"/><text class="node" x="60" y="178" text-anchor="start">业务决策</text><text class="body" x="60" y="207" text-anchor="start">输出给谁</text><text class="body" x="60" y="232" text-anchor="start">错误代价</text><rect class="green" x="220" y="145" width="140" height="110" rx="6"/><text class="node" x="240" y="178" text-anchor="start">样本标签</text><text class="body" x="240" y="207" text-anchor="start">历史可用性</text><text class="body" x="240" y="232" text-anchor="start">独立切分</text><rect class="box" x="400" y="145" width="140" height="110" rx="6"/><text class="node" x="420" y="178" text-anchor="start">特征处理</text><text class="body" x="420" y="207" text-anchor="start">只拟合训练</text><text class="body" x="420" y="232" text-anchor="start">统一预处理</text><rect class="blue" x="580" y="145" width="140" height="110" rx="6"/><text class="node" x="600" y="178" text-anchor="start">训练模型</text><text class="body" x="600" y="207" text-anchor="start">规则做基线</text><text class="body" x="600" y="232" text-anchor="start">比较复杂度</text><rect class="green" x="760" y="145" width="140" height="110" rx="6"/><text class="node" x="780" y="178" text-anchor="start">评估选择</text><text class="body" x="780" y="207" text-anchor="start">指标与阈值</text><text class="body" x="780" y="232" text-anchor="start">典型错误</text><rect class="box" x="940" y="145" width="140" height="110" rx="6"/><text class="node" x="960" y="178" text-anchor="start">部署监控</text><text class="body" x="960" y="207" text-anchor="start">质量与漂移</text><text class="body" x="960" y="232" text-anchor="start">降级与回滚</text><text class="body" x="40" y="355" text-anchor="start">虚线：线上反馈经治理后进入下一轮数据；反馈不直接替换独立测试。</text>
</svg>
