<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="530" viewBox="0 0 1120 530" role="img" aria-labelledby="inference-request-budget-title inference-request-budget-desc"><title id="inference-request-budget-title">一次请求只有一份剩余时间预算</title><desc id="inference-request-budget-desc">教学 Trace 为串行阶段，不按时间长短绘制宽度；实际系统可能存在并行与流式返回。</desc><defs><marker id="inference-request-budget-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker><style>text{font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#172b3a}.head{font-size:27px;font-weight:700}.node{font-size:20px;font-weight:700}.body{font-size:17px;fill:#475569}.box{fill:white;stroke:#cbd5e1;stroke-width:2}.blue{fill:#eff6ff;stroke:#60a5fa;stroke-width:2}.green{fill:#ecfdf5;stroke:#14b8a6;stroke-width:2}.red{fill:#fff1f2;stroke:#e88191;stroke-width:2}.line{fill:none;stroke:#64748b;stroke-width:2}.dash{stroke-dasharray:6 5}</style></defs><rect width="1120" height="530" fill="#f8fafc"/><text x="40" y="48" class="head" text-anchor="start">一次请求只有一份剩余时间预算</text><text x="40" y="80" class="body" text-anchor="start">教学 Trace 为串行阶段，不按时间长短绘制宽度；实际系统可能存在并行与流式返回。</text><path d="M250 205H310" class="line" marker-end="url(#inference-request-budget-arrow)"/><path d="M520 205H580" class="line" marker-end="url(#inference-request-budget-arrow)"/><path d="M790 205H850" class="line" marker-end="url(#inference-request-budget-arrow)"/><rect x="40" y="145" width="210" height="120" rx="6" class="box"/><text x="58" y="177" class="node" text-anchor="start">校验与预处理</text><text x="58" y="207" class="body" text-anchor="start">80 ms</text><text x="58" y="233" class="body" text-anchor="start">身份、输入与格式</text><rect x="310" y="145" width="210" height="120" rx="6" class="blue"/><text x="328" y="177" class="node" text-anchor="start">队列与批处理</text><text x="328" y="207" class="body" text-anchor="start">300 ms</text><text x="328" y="233" class="body" text-anchor="start">剩余 deadline 核对</text><rect x="580" y="145" width="210" height="120" rx="6" class="blue"/><text x="598" y="177" class="node" text-anchor="start">模型计算</text><text x="598" y="207" class="body" text-anchor="start">900 ms</text><text x="598" y="233" class="body" text-anchor="start">运行时取消能力</text><rect x="850" y="145" width="230" height="120" rx="6" class="green"/><text x="868" y="177" class="node" text-anchor="start">后处理与返回</text><text x="868" y="207" class="body" text-anchor="start">120 ms</text><text x="868" y="233" class="body" text-anchor="start">结构、引用与业务校验</text><text x="40" y="325" class="node" text-anchor="start">总耗时 80 + 300 + 900 + 120 = 1400 ms；1500 ms 预算仅剩 100 ms。</text><rect x="40" y="375" width="500" height="110" rx="6" class="box"/><text x="58" y="407" class="node" text-anchor="start">过期、取消与迟到结果</text><text x="58" y="437" class="body" text-anchor="start">入队前拒绝过期任务；运行中尽力取消</text><text x="58" y="463" class="body" text-anchor="start">无法立即停算时，限制占用并丢弃旧结果</text><rect x="580" y="375" width="500" height="110" rx="6" class="red"/><text x="598" y="407" class="node" text-anchor="start">业务副作用单独核对</text><text x="598" y="437" class="body" text-anchor="start">推理超时不等于退款未发生</text><text x="598" y="463" class="body" text-anchor="start">按操作 ID 查状态，重试沿用幂等键</text></svg>
