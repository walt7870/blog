<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="595" viewBox="0 0 1120 595" role="img" aria-labelledby="vision-coordinate-contract-title vision-coordinate-contract-desc"><title id="vision-coordinate-contract-title">模型框需要逆变换，才能回到原图</title><desc id="vision-coordinate-contract-desc">示意采用像素 xyxy 坐标：先等比缩放，再上下填充；不代表实际产品截图。</desc><defs><marker id="vision-coordinate-contract-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker><style>text{font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#172b3a}.head{font-size:28px;font-weight:700}.node{font-size:20px;font-weight:700}.body{font-size:17px;fill:#475569}.box{fill:white;stroke:#cbd5e1;stroke-width:2}.blue{fill:#eff6ff;stroke:#60a5fa;stroke-width:2}.green{fill:#ecfdf5;stroke:#14b8a6;stroke-width:2}.red{fill:#fff1f2;stroke:#e88191;stroke-width:2}.pad{fill:#e2e8f0;stroke:#94a3b8}.line{fill:none;stroke:#64748b;stroke-width:2}.dash{stroke-dasharray:6 5}</style></defs><rect width="1120" height="595" fill="#f8fafc"/><text x="40" y="48" class="head" text-anchor="start">模型框需要逆变换，才能回到原图</text><text x="40" y="80" class="body" text-anchor="start">示意采用像素 xyxy 坐标：先等比缩放，再上下填充；不代表实际产品截图。</text><text x="40" y="130" class="node" text-anchor="start">原图 1280 × 720</text><rect x="40" y="155" width="360" height="202.5" class="blue" rx="6"/><rect x="96.25" y="188.75" width="112.5" height="56.25" class="green" rx="6"/><text x="60" y="335" class="body" text-anchor="start">原图框 [200,120,600,320]</text><path d="M400 245H480" class="line" marker-end="url(#vision-coordinate-contract-arrow)"/><text x="480" y="130" class="node" text-anchor="start">模型输入 640 × 640</text><rect x="480" y="155" width="256" height="256" class="pad" rx="6"/><rect x="480" y="211" width="256" height="144" class="blue" rx="6"/><rect x="520" y="235" width="80" height="40" class="green" rx="6"/><text x="496" y="187" class="body" text-anchor="start">上填充 140 px</text><text x="496" y="389" class="body" text-anchor="start">下填充 140 px</text><rect x="790" y="185" width="290" height="120" class="green" rx="6"/><text x="808" y="217" class="node" text-anchor="start">模型输出框</text><text x="808" y="247" class="body" text-anchor="start">[100,200,300,300]</text><text x="808" y="272" class="body" text-anchor="start">先去掉填充，再除缩放率</text><text x="40" y="465" class="node" text-anchor="start">逆变换：x 原 = x 模型 / 0.5；y 原 = (y 模型 − 140) / 0.5</text><text x="40" y="510" class="body" text-anchor="start">把纵坐标直接乘 2 会得到 [400,600]，正确纵范围是 [120,320]。</text><text x="40" y="550" class="body" text-anchor="start">边界检查：坐标格式、像素/归一化单位、裁剪偏移、原图范围、框与图的版本。</text></svg>
