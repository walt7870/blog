<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="800" viewBox="0 0 1120 800" role="img" aria-labelledby="mcp-tool-call-sequence-title mcp-tool-call-sequence-desc"><title id="mcp-tool-call-sequence-title">一次订单查询：先协商和发现，再调用受控工具</title><desc id="mcp-tool-call-sequence-desc">2025-11-25版本的教学时序；展示正常连接路径，错误与超时按正文另行判断。</desc><defs><marker id="mcp-tool-call-sequence-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker><marker id="mcp-tool-call-sequence-open" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#64748b"/></marker><style>text{font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#172b3a}.head{font-size:27px;font-weight:700}.node{font-size:20px;font-weight:700}.body{font-size:17px;fill:#475569}.box{fill:white;stroke:#cbd5e1;stroke-width:2}.blue{fill:#eff6ff;stroke:#60a5fa;stroke-width:2}.green{fill:#ecfdf5;stroke:#14b8a6;stroke-width:2}.red{fill:#fff1f2;stroke:#e88191;stroke-width:2}.line{fill:none;stroke:#64748b;stroke-width:2}.dash{stroke-dasharray:6 5}</style></defs><rect width="1120" height="800" fill="#f8fafc"/><text x="40" y="48" class="head" text-anchor="start">一次订单查询：先协商和发现，再调用受控工具</text><text x="40" y="80" class="body" text-anchor="start">2025-11-25版本的教学时序；展示正常连接路径，错误与超时按正文另行判断。</text><path d="M180 172V704" class="line dash"/><path d="M550 172V704" class="line dash"/><path d="M940 172V704" class="line dash"/><path d="M180 216H550" class="line" marker-end="url(#mcp-tool-call-sequence-arrow)"/><text x="365" y="200" class="body" text-anchor="middle">initialize：版本与能力</text><path d="M550 272H180" class="line dash" marker-end="url(#mcp-tool-call-sequence-arrow)"/><text x="365" y="256" class="body" text-anchor="middle">协商结果与 tools 能力</text><path d="M180 328H550" class="line dash" marker-end="url(#mcp-tool-call-sequence-open)"/><text x="365" y="312" class="body" text-anchor="middle">notifications/initialized</text><path d="M180 384H550" class="line" marker-end="url(#mcp-tool-call-sequence-arrow)"/><text x="365" y="368" class="body" text-anchor="middle">tools/list</text><path d="M550 440H180" class="line dash" marker-end="url(#mcp-tool-call-sequence-arrow)"/><text x="365" y="424" class="body" text-anchor="middle">工具名与 inputSchema</text><path d="M180 496H550" class="line" marker-end="url(#mcp-tool-call-sequence-arrow)"/><text x="365" y="480" class="body" text-anchor="middle">tools/call：订单 A102</text><path d="M550 552H940" class="line" marker-end="url(#mcp-tool-call-sequence-arrow)"/><text x="745" y="536" class="body" text-anchor="middle">按当前身份鉴权并查询</text><path d="M940 608H550" class="line dash" marker-end="url(#mcp-tool-call-sequence-arrow)"/><text x="745" y="592" class="body" text-anchor="middle">受限订单字段或业务错误</text><path d="M550 664H180" class="line dash" marker-end="url(#mcp-tool-call-sequence-arrow)"/><text x="365" y="648" class="body" text-anchor="middle">result：检查 content / isError</text><rect x="60" y="112" width="240" height="60" rx="6" class="box"/><text x="76" y="144" class="node" text-anchor="start">Host 中的 Client</text><rect x="430" y="112" width="240" height="60" rx="6" class="blue"/><text x="446" y="144" class="node" text-anchor="start">MCP Server</text><rect x="820" y="112" width="240" height="60" rx="6" class="green"/><text x="836" y="144" class="node" text-anchor="start">订单业务服务</text><text x="40" y="744" class="body" text-anchor="start">实线为请求，虚线实心箭头为响应，虚线空心箭头为通知；时间从上到下。</text><text x="40" y="780" class="body" text-anchor="start">Host 仍按策略决定是否执行及是否将结果交给模型；JSON-RPC id 不等于业务幂等键。</text></svg>
