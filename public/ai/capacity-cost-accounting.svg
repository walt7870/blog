<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="545" viewBox="0 0 1120 545" role="img" aria-labelledby="capacity-cost-accounting-title capacity-cost-accounting-desc"><title id="capacity-cost-accounting-title">用户任务、模型调用、在途请求是三个不同口径</title><desc id="capacity-cost-accounting-desc">全部数字为演算假设：稳定系统、同一统计窗口；不代表压测结果或厂商现行报价。</desc><defs><marker id="capacity-cost-accounting-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker><style>text{font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#172b3a}.head{font-size:27px;font-weight:700}.node{font-size:20px;font-weight:700}.body{font-size:17px;fill:#475569}.box{fill:white;stroke:#cbd5e1;stroke-width:2}.blue{fill:#eff6ff;stroke:#60a5fa;stroke-width:2}.green{fill:#ecfdf5;stroke:#14b8a6;stroke-width:2}.red{fill:#fff1f2;stroke:#e88191;stroke-width:2}.line{fill:none;stroke:#64748b;stroke-width:2}.dash{stroke-dasharray:6 5}</style></defs><rect width="1120" height="545" fill="#f8fafc"/><text x="40" y="48" class="head" text-anchor="start">用户任务、模型调用、在途请求是三个不同口径</text><text x="40" y="80" class="body" text-anchor="start">全部数字为演算假设：稳定系统、同一统计窗口；不代表压测结果或厂商现行报价。</text><path d="M290 205H360" class="line" marker-end="url(#capacity-cost-accounting-arrow)"/><path d="M650 205H720" class="line" marker-end="url(#capacity-cost-accounting-arrow)"/><rect x="40" y="145" width="250" height="120" rx="6" class="box"/><text x="58" y="177" class="node" text-anchor="start">业务入口</text><text x="58" y="207" class="body" text-anchor="start">10 个用户任务 / 秒</text><text x="58" y="233" class="body" text-anchor="start">每任务平均 3 次模型调用</text><rect x="360" y="145" width="290" height="120" rx="6" class="blue"/><text x="378" y="177" class="node" text-anchor="start">模型入口</text><text x="378" y="207" class="body" text-anchor="start">平均到达 30 次 / 秒</text><text x="378" y="233" class="body" text-anchor="start">从入队到完成平均 2 秒</text><rect x="720" y="145" width="360" height="120" rx="6" class="green"/><text x="738" y="177" class="node" text-anchor="start">平均在途 = 30 × 2 = 60</text><text x="738" y="207" class="body" text-anchor="start">包括排队与执行</text><text x="738" y="233" class="body" text-anchor="start">不等于批大小，也不能推出 P95</text><rect x="40" y="335" width="1040" height="120" rx="6" class="box"/><text x="58" y="367" class="node" text-anchor="start">单任务模型费用：3 × (1000×2 + 500×8) / 1000000 = 0.018 元</text><text x="58" y="397" class="body" text-anchor="start">每次输入 1000 Token、输出 500 Token；假设单价为每百万输入 2 元、输出 8 元。</text><text x="58" y="423" class="body" text-anchor="start">一万次同形态任务 = 180 元；尚未包含重试、检索、工具、缓存差价与基础设施。</text><text x="40" y="505" class="body" text-anchor="start">用请求 Trace 和供应商 usage 核对调用放大；容量仍需真实长度分布、突发和失败路径压测。</text></svg>
