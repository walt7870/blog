<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="612" viewBox="0 0 1120 612" role="img" aria-labelledby="skill-review-execution-title skill-review-execution-desc"><title id="skill-review-execution-title">文档修订规程：把动作与验收证据连接起来</title><desc id="skill-review-execution-desc">以VitePress文章为例；构建、页面和引用分别验证，缺少环境时保留未验收项。</desc><defs><marker id="skill-review-execution-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker><marker id="skill-review-execution-open" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#64748b"/></marker><style>text{font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#172b3a}.head{font-size:27px;font-weight:700}.node{font-size:20px;font-weight:700}.body{font-size:17px;fill:#475569}.box{fill:white;stroke:#cbd5e1;stroke-width:2}.blue{fill:#eff6ff;stroke:#60a5fa;stroke-width:2}.green{fill:#ecfdf5;stroke:#14b8a6;stroke-width:2}.red{fill:#fff1f2;stroke:#e88191;stroke-width:2}.line{fill:none;stroke:#64748b;stroke-width:2}.dash{stroke-dasharray:6 5}</style></defs><rect width="1120" height="612" fill="#f8fafc"/><text x="40" y="48" class="head" text-anchor="start">文档修订规程：把动作与验收证据连接起来</text><text x="40" y="80" class="body" text-anchor="start">以VitePress文章为例；构建、页面和引用分别验证，缺少环境时保留未验收项。</text><path d="M260 220H312" class="line" marker-end="url(#skill-review-execution-arrow)"/><path d="M544 220H596" class="line" marker-end="url(#skill-review-execution-arrow)"/><path d="M828 220H880" class="line" marker-end="url(#skill-review-execution-arrow)"/><path d="M996 280V416Q996 424 988 424H836" class="line" marker-end="url(#skill-review-execution-arrow)"/><path d="M560 424H436Q428 424 428 416V280" class="line dash" marker-end="url(#skill-review-execution-arrow)"/><rect x="40" y="160" width="220" height="120" rx="6" class="box"/><text x="56" y="192" class="node" text-anchor="start">项目事实</text><text x="56" y="224" class="body" text-anchor="start">目录 / 导航 / 命令</text><text x="56" y="249" class="body" text-anchor="start">写作与资源规范</text><rect x="312" y="160" width="232" height="120" rx="6" class="blue"/><text x="328" y="192" class="node" text-anchor="start">按任务加载规程</text><text x="328" y="224" class="body" text-anchor="start">读全文与相邻入口</text><text x="328" y="249" class="body" text-anchor="start">补机制、案例和图示</text><rect x="596" y="160" width="232" height="120" rx="6" class="box"/><text x="612" y="192" class="node" text-anchor="start">执行工具检查</text><text x="612" y="224" class="body" text-anchor="start">构建与引用检查</text><text x="612" y="249" class="body" text-anchor="start">双视口和图片放大</text><rect x="880" y="160" width="200" height="120" rx="6" class="green"/><text x="896" y="192" class="node" text-anchor="start">对照验收</text><text x="896" y="224" class="body" text-anchor="start">正文、图、页面</text><text x="896" y="249" class="body" text-anchor="start">与实际结果一致</text><rect x="560" y="368" width="276" height="120" rx="6" class="red"/><text x="576" y="400" class="node" text-anchor="start">失败或证据缺失</text><text x="576" y="432" class="body" text-anchor="start">定位具体文件或环境</text><text x="576" y="457" class="body" text-anchor="start">修复后重验；不能假通过</text><text x="1012" y="340" class="body" text-anchor="start">未通过</text><text x="40" y="528" class="node" text-anchor="start">失败反馈回到修订环节；只有环境缺失时，记录缺口并保留已完成的工作。</text><text x="40" y="576" class="body" text-anchor="start">目录与命令升级后也要更新Skill；“注意质量”无法替代可执行检查。</text></svg>
