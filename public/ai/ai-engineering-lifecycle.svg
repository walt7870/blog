<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">AI 生产工程生命周期</title><desc id="desc">展示从数据版本、训练配置、评估注册、灰度部署、线上观测到反馈回流的闭环</desc>
  <defs><style>.bg{fill:#f8fafc}.card{fill:#fff;stroke:#cbd5e1;stroke-width:2}.blue{fill:#eff6ff;stroke:#60a5fa}.green{fill:#ecfdf5;stroke:#2dd4bf}.orange{fill:#fff7ed;stroke:#fb923c}text{font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#0f172a}.head{font-size:27px;font-weight:700}.title{font-size:17px;font-weight:700}.body{font-size:14px;fill:#475569}.line{stroke:#64748b;stroke-width:2.5;fill:none}.back{stroke:#f97316;stroke-dasharray:8 7}</style><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9z" fill="#64748b"/></marker><marker id="arrow2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9z" fill="#f97316"/></marker></defs>
  <rect class="bg" width="1200" height="520"/><text class="head" x="55" y="55">AI 系统通过版本、证据和反馈持续演进</text>
  <g transform="translate(45 125)"><rect class="card blue" width="150" height="110" rx="12"/><text class="title" x="75" y="35" text-anchor="middle">数据与知识</text><text class="body" x="75" y="66" text-anchor="middle">样本 / 文档</text><text class="body" x="75" y="88" text-anchor="middle">权限 / 版本</text></g>
  <g transform="translate(235 125)"><rect class="card blue" width="150" height="110" rx="12"/><text class="title" x="75" y="35" text-anchor="middle">训练与配置</text><text class="body" x="75" y="66" text-anchor="middle">模型 / Prompt</text><text class="body" x="75" y="88" text-anchor="middle">索引 / 工具</text></g>
  <g transform="translate(425 125)"><rect class="card green" width="150" height="110" rx="12"/><text class="title" x="75" y="35" text-anchor="middle">离线评估</text><text class="body" x="75" y="66" text-anchor="middle">质量 / 安全</text><text class="body" x="75" y="88" text-anchor="middle">性能 / 成本</text></g>
  <g transform="translate(615 125)"><rect class="card green" width="150" height="110" rx="12"/><text class="title" x="75" y="35" text-anchor="middle">注册与审批</text><text class="body" x="75" y="66" text-anchor="middle">版本证据</text><text class="body" x="75" y="88" text-anchor="middle">上线门禁</text></g>
  <g transform="translate(805 125)"><rect class="card orange" width="150" height="110" rx="12"/><text class="title" x="75" y="35" text-anchor="middle">灰度部署</text><text class="body" x="75" y="66" text-anchor="middle">影子 / 小流量</text><text class="body" x="75" y="88" text-anchor="middle">自动回滚</text></g>
  <g transform="translate(995 125)"><rect class="card orange" width="150" height="110" rx="12"/><text class="title" x="75" y="35" text-anchor="middle">线上观测</text><text class="body" x="75" y="66" text-anchor="middle">质量 / 漂移</text><text class="body" x="75" y="88" text-anchor="middle">延迟 / 费用</text></g>
  <path class="line" marker-end="url(#arrow)" d="M195 180 L235 180"/><path class="line" marker-end="url(#arrow)" d="M385 180 L425 180"/><path class="line" marker-end="url(#arrow)" d="M575 180 L615 180"/><path class="line" marker-end="url(#arrow)" d="M765 180 L805 180"/><path class="line" marker-end="url(#arrow)" d="M955 180 L995 180"/>
  <path class="line back" marker-end="url(#arrow2)" d="M1070 235 C1070 370 120 370 120 235"/><text class="title" x="595" y="382" text-anchor="middle" fill="#c2410c">真实反馈回到数据、评估集和系统设计</text>
  <g transform="translate(170 420)"><rect x="0" y="0" width="860" height="58" rx="10" fill="#e2e8f0"/><text class="body" x="430" y="24" text-anchor="middle">贯穿每一阶段：身份权限 · Trace 与审计 · 可复现配置 · 变更记录 · 降级与回滚</text><text class="body" x="430" y="45" text-anchor="middle">大模型应用还要共同管理模型、Prompt、索引、工具 schema 和评估集</text></g>
</svg>
