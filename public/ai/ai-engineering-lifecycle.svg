<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="610" viewBox="0 0 1120 610" role="img" aria-labelledby="ai-engineering-lifecycle-title ai-engineering-lifecycle-desc"><title id="ai-engineering-lifecycle-title">退款助手发布的是一组兼容版本，不只是模型权重</title><desc id="ai-engineering-lifecycle-desc">教学示例：政策 v3 → v4；离线候选与生产隔离，回滚配置不能撤销真实交易。</desc><defs><marker id="ai-engineering-lifecycle-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker><style>text{font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#172b3a}.head{font-size:27px;font-weight:700}.node{font-size:20px;font-weight:700}.body{font-size:17px;fill:#475569}.box{fill:white;stroke:#cbd5e1;stroke-width:2}.blue{fill:#eff6ff;stroke:#60a5fa;stroke-width:2}.green{fill:#ecfdf5;stroke:#14b8a6;stroke-width:2}.red{fill:#fff1f2;stroke:#e88191;stroke-width:2}.line{fill:none;stroke:#64748b;stroke-width:2}.dash{stroke-dasharray:6 5}</style></defs><rect width="1120" height="610" fill="#f8fafc"/><text x="40" y="48" class="head" text-anchor="start">退款助手发布的是一组兼容版本，不只是模型权重</text><text x="40" y="80" class="body" text-anchor="start">教学示例：政策 v3 → v4；离线候选与生产隔离，回滚配置不能撤销真实交易。</text><path d="M300 200H370" class="line" marker-end="url(#ai-engineering-lifecycle-arrow)"/><path d="M680 200H750" class="line" marker-end="url(#ai-engineering-lifecycle-arrow)"/><path d="M920 270V342Q920 350 912 350H488a8 8 0 0 0 -16 0H228Q220 350 220 358V410" class="line dash" marker-end="url(#ai-engineering-lifecycle-arrow)"/><path d="M840 410V385Q840 377 832 377H488Q480 377 480 369V270" class="line dash" marker-end="url(#ai-engineering-lifecycle-arrow)"/><rect x="40" y="135" width="260" height="135" rx="6" class="blue"/><text x="58" y="167" class="node" text-anchor="start">候选发布包 r4</text><text x="58" y="197" class="body" text-anchor="start">模型 / Prompt / 工具 / 权限</text><text x="58" y="223" class="body" text-anchor="start">文档与索引 v4 / 评估集</text><rect x="370" y="135" width="310" height="135" rx="6" class="green"/><text x="388" y="167" class="node" text-anchor="start">隔离验证与灰度门禁</text><text x="388" y="197" class="body" text-anchor="start">适用渠道、引用、越权、成本</text><text x="388" y="223" class="body" text-anchor="start">影子工具记录候选，不退款</text><text x="388" y="249" class="body" text-anchor="start">按发布号比较真实流量</text><rect x="750" y="135" width="330" height="135" rx="6" class="box"/><text x="768" y="167" class="node" text-anchor="start">生产路由与可观察结果</text><text x="768" y="197" class="body" text-anchor="start">切换完整配置引用</text><text x="768" y="223" class="body" text-anchor="start">版本化缓存 / Trace / 告警</text><text x="768" y="249" class="body" text-anchor="start">业务写入由稳定服务校验</text><rect x="40" y="410" width="360" height="115" rx="6" class="box"/><text x="58" y="442" class="node" text-anchor="start">反馈治理与下一轮候选</text><text x="58" y="472" class="body" text-anchor="start">脱敏、授权、分类后形成回归样例</text><text x="58" y="498" class="body" text-anchor="start">不自动污染当前未见测试集</text><rect x="620" y="410" width="460" height="115" rx="6" class="red"/><text x="638" y="442" class="node" text-anchor="start">异常时切回 r3 的完整配置</text><text x="638" y="472" class="body" text-anchor="start">保留旧索引和依赖，处理缓存失效</text><text x="638" y="498" class="body" text-anchor="start">已执行退款按操作 ID 核对与补偿</text><text x="40" y="575" class="body" text-anchor="start">虚线：左侧为后续迭代；右侧为异常回退。供应商模型不可锁定时，复现能力有边界。</text></svg>
