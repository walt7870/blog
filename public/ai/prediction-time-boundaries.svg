<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="530" viewBox="0 0 1120 530" role="img" aria-labelledby="prediction-time-boundaries-title prediction-time-boundaries-desc">
<title id="prediction-time-boundaries-title">预测时刻决定哪些信息能进入模型</title><desc id="prediction-time-boundaries-desc">示例：6 月 1 日零点预测未来 14 天是否无购买；图中时长按天等比例。</desc>
<defs><marker id="prediction-time-boundaries-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker><style>text{font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#172b3a}.head{font-size:28px;font-weight:700}.node{font-size:20px;font-weight:700}.body{font-size:17px;fill:#475569}.value{font-size:32px;font-weight:700}.box{fill:white;stroke:#cbd5e1;stroke-width:2}.blue{fill:#eff6ff;stroke:#60a5fa;stroke-width:2}.green{fill:#ecfdf5;stroke:#14b8a6;stroke-width:2}.red{fill:#fff1f2;stroke:#e88191;stroke-width:2}.line{stroke:#64748b;stroke-width:2;fill:none}.dashed{stroke-dasharray:6 5}</style></defs>
<rect width="1120" height="530" fill="#f8fafc"/>
<text class="head" x="40" y="48" text-anchor="start">预测时刻决定哪些信息能进入模型</text><text class="body" x="40" y="80" text-anchor="start">示例：6 月 1 日零点预测未来 14 天是否无购买；图中时长按天等比例。</text><rect class="blue" x="80" y="150" width="600" height="110" rx="6"/><rect class="green" x="680" y="150" width="280" height="110" rx="6"/><text class="node" x="110" y="190" text-anchor="start">过去 30 天：观察窗口</text><text class="body" x="110" y="225" text-anchor="start">仅使用 T 时已经到达、可读取的数据</text><text class="node" x="710" y="190" text-anchor="start">未来 14 天</text><text class="body" x="710" y="225" text-anchor="start">等待真实结果</text><path d="M80 285H1000M680 130V320M960 130V320" stroke="#64748b" fill="none"/><text class="body" x="80" y="345" text-anchor="start">T − 30 天</text><text class="node" x="680" y="345" text-anchor="middle">T：6 月 1 日</text><text class="node" x="960" y="345" text-anchor="middle">6 月 15 日</text><rect class="red" x="80" y="390" width="440" height="110" rx="6"/><text class="node" x="100" y="423" text-anchor="start">迟到数据不能穿越时间</text><text class="body" x="100" y="452" text-anchor="start">5 月 31 日发生，6 月 2 日入库</text><text class="body" x="100" y="477" text-anchor="start">在 T 时不可用，不能回填成已知特征</text><rect class="box" x="560" y="390" width="480" height="110" rx="6"/><text class="node" x="580" y="423" text-anchor="start">标签还需要等待成熟</text><text class="body" x="580" y="452" text-anchor="start">目标窗口结束后，再等待约定的到达延迟</text><text class="body" x="580" y="477" text-anchor="start">6 月 10 日的“暂未购买”还不是最终结果</text>
</svg>
