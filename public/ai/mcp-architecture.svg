<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="560" viewBox="0 0 1120 560" role="img" aria-labelledby="mcp-architecture-title mcp-architecture-desc"><title id="mcp-architecture-title">Host 管理模型与连接，Server 封装受控能力</title><desc id="mcp-architecture-desc">协议客户端在宿主内部；业务系统继续检查身份、资源归属和动作是否允许。</desc><defs><marker id="mcp-architecture-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker><marker id="mcp-architecture-open" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#64748b"/></marker><style>text{font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#172b3a}.head{font-size:27px;font-weight:700}.node{font-size:20px;font-weight:700}.body{font-size:17px;fill:#475569}.box{fill:white;stroke:#cbd5e1;stroke-width:2}.blue{fill:#eff6ff;stroke:#60a5fa;stroke-width:2}.green{fill:#ecfdf5;stroke:#14b8a6;stroke-width:2}.red{fill:#fff1f2;stroke:#e88191;stroke-width:2}.line{fill:none;stroke:#64748b;stroke-width:2}.dash{stroke-dasharray:6 5}</style></defs><rect width="1120" height="560" fill="#f8fafc"/><text x="40" y="48" class="head" text-anchor="start">Host 管理模型与连接，Server 封装受控能力</text><text x="40" y="80" class="body" text-anchor="start">协议客户端在宿主内部；业务系统继续检查身份、资源归属和动作是否允许。</text><rect x="40" y="136" width="500" height="252" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-dasharray="6 5"/><text x="64" y="176" class="node" text-anchor="start">Host：IDE / 桌面助手 / CLI</text><path d="M288 272H328" class="line" marker-end="url(#mcp-architecture-arrow)"/><path d="M516 272H600" class="line" marker-end="url(#mcp-architecture-arrow)"/><path d="M800 272H880" class="line" marker-end="url(#mcp-architecture-arrow)"/><rect x="64" y="212" width="224" height="120" rx="6" class="box"/><text x="80" y="244" class="node" text-anchor="start">模型与上下文</text><text x="80" y="276" class="body" text-anchor="start">接收用户任务</text><text x="80" y="301" class="body" text-anchor="start">提出工具调用意图</text><rect x="328" y="212" width="188" height="120" rx="6" class="blue"/><text x="344" y="244" class="node" text-anchor="start">MCP Client</text><text x="344" y="276" class="body" text-anchor="start">一条协议连接</text><text x="344" y="301" class="body" text-anchor="start">协商 / 发现 / 调用</text><rect x="600" y="212" width="200" height="120" rx="6" class="blue"/><text x="616" y="244" class="node" text-anchor="start">MCP Server</text><text x="616" y="276" class="body" text-anchor="start">校验参数与权限</text><text x="616" y="301" class="body" text-anchor="start">裁剪结果与审计</text><rect x="880" y="212" width="200" height="120" rx="6" class="green"/><text x="896" y="244" class="node" text-anchor="start">订单服务等</text><text x="896" y="276" class="body" text-anchor="start">会话身份与归属</text><text x="896" y="301" class="body" text-anchor="start">受限 API / 数据</text><text x="40" y="448" class="node" text-anchor="start">stdio：宿主启动本地子进程；进程权限来自启动环境。</text><text x="40" y="490" class="body" text-anchor="start">Streamable HTTP：独立服务端点；传输鉴权、业务权限与模型上下文分别控制。</text><text x="40" y="532" class="body" text-anchor="start">箭头表示调用方向，返回消息见时序图；连接成功不代表获准读取任意订单。</text></svg>
