<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="624" viewBox="0 0 1120 624" role="img" aria-labelledby="vision-quality-contract-title vision-quality-contract-desc"><title id="vision-quality-contract-title">质检结果可追溯，才能定位漏检来自哪个环节</title><desc id="vision-quality-contract-desc">整图多标签分类示例；生产阈值和复核容量由业务验收确定，不由教学数字代替。</desc><defs><marker id="vision-quality-contract-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker><style>text{font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#172b3a}.head{font-size:27px;font-weight:700}.node{font-size:20px;font-weight:700}.body{font-size:17px;fill:#475569}.box{fill:white;stroke:#cbd5e1;stroke-width:2}.blue{fill:#eff6ff;stroke:#60a5fa;stroke-width:2}.green{fill:#ecfdf5;stroke:#14b8a6;stroke-width:2}.red{fill:#fff1f2;stroke:#e88191;stroke-width:2}.line{fill:none;stroke:#64748b;stroke-width:2}.dash{stroke-dasharray:6 5}</style></defs><rect width="1120" height="624" fill="#f8fafc"/><text x="40" y="48" class="head" text-anchor="start">质检结果可追溯，才能定位漏检来自哪个环节</text><text x="40" y="80" class="body" text-anchor="start">整图多标签分类示例；生产阈值和复核容量由业务验收确定，不由教学数字代替。</text><path d="M340 200H410" class="line" marker-end="url(#vision-quality-contract-arrow)"/><path d="M710 200H780" class="line" marker-end="url(#vision-quality-contract-arrow)"/><path d="M930 256V332Q930 340 922 340H568Q560 340 560 348V400" class="line" marker-end="url(#vision-quality-contract-arrow)"/><path d="M710 456H780" class="line" marker-end="url(#vision-quality-contract-arrow)"/><rect x="40" y="144" width="300" height="112" rx="6" class="box"/><text x="56" y="176" class="node" text-anchor="start">标注与切分清单</text><text x="56" y="206" class="body" text-anchor="start">缺陷可同时存在</text><text x="56" y="231" class="body" text-anchor="start">同一件产品不跨集合</text><rect x="410" y="144" width="300" height="112" rx="6" class="blue"/><text x="426" y="176" class="node" text-anchor="start">训练与部署输入合同</text><text x="426" y="206" class="body" text-anchor="start">解码 / 颜色 / 缩放 / 归一化</text><text x="426" y="231" class="body" text-anchor="start">同一组原图逐项比对</text><rect x="780" y="144" width="300" height="112" rx="6" class="box"/><text x="796" y="176" class="node" text-anchor="start">各缺陷分数与版本</text><text x="796" y="206" class="body" text-anchor="start">独立标签，不用互斥softmax</text><text x="796" y="231" class="body" text-anchor="start">保留产品ID与模型版本</text><rect x="410" y="400" width="300" height="112" rx="6" class="red"/><text x="426" y="432" class="node" text-anchor="start">阈值和场景验收</text><text x="426" y="462" class="body" text-anchor="start">严重缺陷漏检单独核算</text><text x="426" y="487" class="body" text-anchor="start">未知场景也可能高分误判</text><rect x="780" y="400" width="300" height="112" rx="6" class="green"/><text x="796" y="432" class="node" text-anchor="start">放行或人工复核</text><text x="796" y="462" class="body" text-anchor="start">复核结果与原图关联</text><text x="796" y="487" class="body" text-anchor="start">超时按约定复核或停线</text><text x="40" y="572" class="body" text-anchor="start">教学破损结果：90检出、10漏检、45误报、855正确排除；准确率94.5%仍可能不满足要求。</text></svg>
