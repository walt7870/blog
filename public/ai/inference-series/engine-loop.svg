<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="500" viewBox="0 0 1120 500" role="img" aria-labelledby="title desc"><title id="title">vLLM 把“再生成一步”组织成执行循环</title><desc id="desc">API将请求加入队列，调度与KV管理确定本轮任务，runner执行，采样后返回并检查停止；未完成继续下一轮，完成或取消安全解除引用。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L7 4 L0 8 Z" fill="#475569"/></marker></defs><rect width="1120" height="500" fill="#f8fafc"/><g font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif"><text x="36" y="48" font-size="29" fill="#172b3a" text-anchor="start">vLLM 把“再生成一步”组织成执行循环</text><path d="M250 173 H344" fill="none" stroke="#475569" stroke-width="2"  marker-end="url(#arrow)"/><path d="M633 173 H728" fill="none" stroke="#475569" stroke-width="2"  marker-end="url(#arrow)"/><path d="M882 221 V289" fill="none" stroke="#475569" stroke-width="2"  marker-end="url(#arrow)"/><path d="M728 337 H675 V261 H489 V221" fill="none" stroke="#475569" stroke-width="2"  marker-end="url(#arrow)"/><rect x="36" y="124" width="214" height="97" rx="6" fill="#fff" stroke="#cbd5e1"/><text x="143" y="165" font-size="25" fill="#172b3a" text-anchor="middle">API / 队列</text><text x="143" y="198" font-size="20" fill="#475569" text-anchor="middle">问题与参数</text><rect x="345" y="124" width="288" height="97" rx="6" fill="#dbeafe" stroke="#cbd5e1"/><text x="489" y="165" font-size="25" fill="#172b3a" text-anchor="middle">调度 + KV 管理</text><text x="489" y="198" font-size="20" fill="#475569" text-anchor="middle">选请求、算预算、分块</text><rect x="729" y="124" width="355" height="97" rx="6" fill="#d1fae5" stroke="#cbd5e1"/><text x="906" y="165" font-size="26" fill="#172b3a" text-anchor="middle">Model runner</text><text x="906" y="198" font-size="20" fill="#475569" text-anchor="middle">执行本轮模型计算</text><rect x="729" y="289" width="355" height="97" rx="6" fill="#fff" stroke="#cbd5e1"/><text x="906" y="331" font-size="25" fill="#172b3a" text-anchor="middle">采样、返回与停止判断</text><text x="489" y="328" font-size="23" fill="#172b3a" text-anchor="middle">未结束：继续下一轮</text><path d="M906 386 V441 H633" fill="none" stroke="#475569" stroke-width="2"  marker-end="url(#arrow)"/><rect x="36" y="411" width="597" height="61" rx="6" fill="#ffe4e6" stroke="#cbd5e1"/><text x="334" y="450" font-size="23" fill="#172b3a" text-anchor="middle">完成 / 取消：在安全位置解除活跃引用</text></g></svg>
