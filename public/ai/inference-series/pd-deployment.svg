<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="650" viewBox="0 0 1120 650" role="img" aria-labelledby="title desc"><title id="title">Prefill / Decode 分离的状态交接</title><desc id="desc">路由器将输入交给prefill池，KV通过传输层交给decode池，后者继续生成并返回。超时或失败时向请求管理回报，停止交接并清理两侧状态。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 Z" fill="#64748b"/></marker><marker id="control" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 Z" fill="#e88191"/></marker></defs><rect width="1120" height="650" fill="#f8fafc"/><g font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif"><text x="32" y="45" font-size="27" fill="#172b3a" text-anchor="start">Prefill / Decode 分离的状态交接</text><g><rect x="32" y="112" width="235" height="104" rx="6" fill="#fff" stroke="#cbd5e1"/><text x="50" y="144" font-size="21" fill="#172b3a" text-anchor="start">路由与请求管理</text><text x="50" y="174" font-size="17" fill="#475569" text-anchor="start">长度、负载、缓存信息</text><text x="50" y="200" font-size="17" fill="#475569" text-anchor="start">维护请求与取消状态</text></g><g><rect x="376" y="112" width="280" height="104" rx="6" fill="#eff6ff" stroke="#60a5fa"/><text x="394" y="144" font-size="21" fill="#172b3a" text-anchor="start">Prefill worker 池</text><text x="394" y="174" font-size="17" fill="#475569" text-anchor="start">计算输入与历史状态</text><text x="394" y="200" font-size="17" fill="#475569" text-anchor="start">独立队列与资源配置</text></g><g><rect x="792" y="112" width="296" height="104" rx="6" fill="#ecfdf5" stroke="#14b8a6"/><text x="810" y="144" font-size="21" fill="#172b3a" text-anchor="start">Decode worker 池</text><text x="810" y="174" font-size="17" fill="#475569" text-anchor="start">接续状态，逐步生成</text><text x="810" y="200" font-size="17" fill="#475569" text-anchor="start">独立队列与资源配置</text></g><path d="M267 160 H376" fill="none" stroke="#64748b" stroke-width="2"   marker-end="url(#arrow)"/><text x="321" y="147" font-size="17" fill="#64748b" text-anchor="middle">输入</text><path d="M656 160 H792" fill="none" stroke="#64748b" stroke-width="2"   marker-end="url(#arrow)"/><text x="724" y="146" font-size="17" fill="#64748b" text-anchor="middle">KV + 元数据</text><text x="704" y="195" font-size="15" fill="#475569" text-anchor="middle">传输与布局恢复</text><g><rect x="376" y="331" width="280" height="104" rx="6" fill="#fff" stroke="#cbd5e1"/><text x="394" y="363" font-size="21" fill="#172b3a" text-anchor="start">可选共享 KV 后端</text><text x="394" y="393" font-size="17" fill="#475569" text-anchor="start">缓存、预取与传输协作</text><text x="394" y="419" font-size="17" fill="#475569" text-anchor="start">不替代模型执行</text></g><path d="M516 216 V331" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5"  marker-end="url(#arrow)"/><text x="590" y="282" font-size="17" fill="#64748b" text-anchor="middle">读写 / 预取</text><path d="M656 383 H940 V216" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5"  marker-end="url(#arrow)"/><text x="826" y="370" font-size="17" fill="#64748b" text-anchor="middle">恢复可复用状态</text><path d="M1088 196 H1100 V485 H150 V216" fill="none" stroke="#64748b" stroke-width="2"   marker-end="url(#arrow)"/><text x="609" y="475" font-size="17" fill="#64748b" text-anchor="middle">输出经请求管理返回客户端</text><path d="M64 216 V570 H346 V250 H400 V216" fill="none" stroke="#e88191" stroke-width="2" stroke-dasharray="7 5" marker-start="url(#control)" marker-end="url(#control)"/><path d="M64 216 V570 H1110 V250 H1050 V216" fill="none" stroke="#e88191" stroke-width="2" stroke-dasharray="7 5" marker-start="url(#control)" marker-end="url(#control)"/><text x="680" y="555" font-size="17" fill="#9f1239" text-anchor="middle">控制通道：失败 / 超时回报；取消与双侧清理</text><text x="32" y="613" font-size="17" fill="#475569" text-anchor="start">图示为职责关系，不绑定某种传输协议。是否分离取决于干扰收益、KV 成本和恢复复杂度。</text></g></svg>
