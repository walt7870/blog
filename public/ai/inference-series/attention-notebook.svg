<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="470" viewBox="0 0 1120 470" role="img" aria-labelledby="title desc"><title id="title">保存旧 K/V，仍然要查询旧 K/V</title><desc id="desc">历史位置的K和V已保存；新位置产生Q、K、V，当前Q与历史及当前位置K/V计算注意力，新K/V加入缓存。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L7 4 L0 8 Z" fill="#475569"/></marker></defs><rect width="1120" height="470" fill="#f8fafc"/><g font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif"><text x="36" y="48" font-size="29" fill="#172b3a" text-anchor="start">保存旧 K/V，仍然要查询旧 K/V</text><text x="36" y="108" font-size="25" fill="#172b3a" text-anchor="start">历史位置：已经写好的计算便笺</text><rect x="36" y="134" width="125" height="54" rx="6" fill="#d1fae5" stroke="#cbd5e1"/><text x="98.5" y="169" font-size="23" fill="#172b3a" text-anchor="middle">K/V₁</text><rect x="169" y="134" width="125" height="54" rx="6" fill="#d1fae5" stroke="#cbd5e1"/><text x="231.5" y="169" font-size="23" fill="#172b3a" text-anchor="middle">K/V₂</text><rect x="302" y="134" width="125" height="54" rx="6" fill="#d1fae5" stroke="#cbd5e1"/><text x="364.5" y="169" font-size="23" fill="#172b3a" text-anchor="middle">K/V₃</text><rect x="435" y="134" width="125" height="54" rx="6" fill="#d1fae5" stroke="#cbd5e1"/><text x="497.5" y="169" font-size="23" fill="#172b3a" text-anchor="middle">K/V₄</text><rect x="710" y="103" width="374" height="137" rx="6" fill="#dbeafe" stroke="#cbd5e1"/><text x="897" y="145" font-size="28" fill="#172b3a" text-anchor="middle">新位置</text><text x="897" y="193" font-size="26" fill="#172b3a" text-anchor="middle">产生 Q、K、V</text><path d="M822 240 V286 H300 V196" fill="none" stroke="#475569" stroke-width="2"  marker-end="url(#arrow)"/><text x="490" y="275" font-size="22" fill="#475569" text-anchor="middle">当前 Q 查询历史</text><path d="M976 240 V350 H574" fill="none" stroke="#475569" stroke-width="2"  marker-end="url(#arrow)"/><rect x="440" y="323" width="132" height="54" rx="6" fill="#dbeafe" stroke="#cbd5e1"/><text x="506" y="358" font-size="23" fill="#172b3a" text-anchor="middle">新 K/V</text><text x="36" y="361" font-size="25" fill="#172b3a" text-anchor="start">缓存末尾追加</text><text x="36" y="420" font-size="23" fill="#172b3a" text-anchor="start">省掉历史位置的 K/V 重建，不会省掉新位置对历史的 attention。</text><text x="36" y="453" font-size="19" fill="#475569" text-anchor="start">常规自回归 attention 示意；新位置也参与本轮注意力。</text></g></svg>
