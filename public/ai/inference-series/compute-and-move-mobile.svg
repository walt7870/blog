<svg xmlns="http://www.w3.org/2000/svg" width="480" height="557" viewBox="0 0 480 557" role="img" aria-labelledby="title desc"><title id="title">容量、带宽与算力</title><desc id="desc">用储存、搬运通道和计算格子，区分容量、带宽与算力。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L7 4 L0 8 Z" fill="#475569"/></marker></defs><rect width="480" height="557" fill="#f8fafc"/><g font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif"><text x="20" y="48" font-size="25" fill="#172b3a" text-anchor="start">容量、带宽与算力</text><rect x="20" y="87" width="171" height="104" rx="6" fill="#fff" stroke="#cbd5e1"/><rect x="37" y="103" width="137" height="16" rx="0" fill="#dbeafe" stroke="#60a5fa"/><rect x="37" y="130" width="137" height="16" rx="0" fill="#dbeafe" stroke="#60a5fa"/><rect x="37" y="157" width="137" height="16" rx="0" fill="#dbeafe" stroke="#60a5fa"/><text x="220" y="122" font-size="27" fill="#172b3a" text-anchor="start">容量</text><text x="220" y="164" font-size="23" fill="#172b3a" text-anchor="start">能装多少</text><path d="M105 192 V247" fill="none" stroke="#475569" stroke-width="2"  marker-end="url(#arrow)"/><rect x="20" y="249" width="171" height="76" rx="6" fill="#d1fae5" stroke="#cbd5e1"/><path d="M43 287 H165" fill="none" stroke="#475569" stroke-width="2"  marker-end="url(#arrow)"/><text x="220" y="275" font-size="27" fill="#172b3a" text-anchor="start">带宽</text><text x="220" y="314" font-size="23" fill="#172b3a" text-anchor="start">每秒搬多少</text><path d="M105 326 V383" fill="none" stroke="#475569" stroke-width="2"  marker-end="url(#arrow)"/><rect x="20" y="385" width="171" height="98" rx="6" fill="#fef3c7" stroke="#cbd5e1"/><rect x="34" y="408" width="40" height="47" rx="2" fill="#fff" stroke="#d6b863"/><rect x="85" y="408" width="40" height="47" rx="2" fill="#fff" stroke="#d6b863"/><rect x="136" y="408" width="40" height="47" rx="2" fill="#fff" stroke="#d6b863"/><text x="220" y="417" font-size="27" fill="#172b3a" text-anchor="start">算力</text><text x="220" y="461" font-size="23" fill="#172b3a" text-anchor="start">每秒算多少</text><text x="20" y="535" font-size="21" fill="#475569" text-anchor="start">装得下，不代表搬得快或算得快。</text></g></svg>
