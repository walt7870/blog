<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="430" viewBox="0 0 1120 430" role="img" aria-labelledby="title desc"><title id="title">同一条回答，有三种不同的等待</title><desc id="desc">教学时间线从发送请求到首个有效内容是TTFT，后续内容有间隔，到完成是E2E；网络chunk不一定对应单token。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L7 4 L0 8 Z" fill="#475569"/></marker></defs><rect width="1120" height="430" fill="#f8fafc"/><g font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif"><text x="36" y="48" font-size="29" fill="#172b3a" text-anchor="start">同一条回答，有三种不同的等待</text><path d="M84 196 H1040" fill="none" stroke="#475569" stroke-width="2"  marker-end="url(#arrow)"/><circle cx="84" cy="196" r="6" fill="#172b3a"/><circle cx="430" cy="196" r="6" fill="#172b3a"/><circle cx="590" cy="196" r="6" fill="#172b3a"/><circle cx="750" cy="196" r="6" fill="#172b3a"/><circle cx="995" cy="196" r="6" fill="#172b3a"/><text x="84" y="151" font-size="22" fill="#172b3a" text-anchor="start">发出请求</text><text x="430" y="151" font-size="22" fill="#172b3a" text-anchor="middle">首个有效内容</text><text x="995" y="151" font-size="22" fill="#172b3a" text-anchor="middle">完成</text><text x="430" y="242" font-size="23" fill="#172b3a" text-anchor="middle">先</text><text x="590" y="242" font-size="23" fill="#172b3a" text-anchor="middle">提交</text><text x="750" y="242" font-size="23" fill="#172b3a" text-anchor="middle">申请</text><text x="995" y="242" font-size="23" fill="#172b3a" text-anchor="middle">…结束</text><path d="M84 103 V89 H430 V103" fill="none" stroke="#2563eb" stroke-width="2"  /><text x="257" y="78" font-size="24" fill="#1d4ed8" text-anchor="middle">TTFT</text><path d="M430 292 V306 H590 V292" fill="none" stroke="#059669" stroke-width="2"  /><text x="510" y="343" font-size="22" fill="#047857" text-anchor="middle">内容片段间隔</text><path d="M84 369 V383 H995 V369" fill="none" stroke="#475569" stroke-width="2"  /><text x="36" y="414" font-size="20" fill="#475569" text-anchor="start">E2E：直到完整结束。首网络包可能只有元信息；片段间隔也不一定是 token 间隔。</text></g></svg>
