<svg xmlns="http://www.w3.org/2000/svg" width="480" height="448" viewBox="0 0 480 448" role="img" aria-labelledby="title desc"><title id="title">首次等待与后续间隔</title><desc id="desc">教学时间线，从发出到首内容是TTFT，从发出到完成是E2E，chunk间隔不等于token间隔。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L7 4 L0 8 Z" fill="#475569"/></marker></defs><rect width="480" height="448" fill="#f8fafc"/><g font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif"><text x="20" y="48" font-size="25" fill="#172b3a" text-anchor="start">首次等待与后续间隔</text><path d="M30 172 H452" fill="none" stroke="#475569" stroke-width="2"  marker-end="url(#arrow)"/><circle cx="30" cy="172" r="6" fill="#172b3a"/><circle cx="210" cy="172" r="6" fill="#172b3a"/><circle cx="290" cy="172" r="6" fill="#172b3a"/><circle cx="370" cy="172" r="6" fill="#172b3a"/><circle cx="445" cy="172" r="6" fill="#172b3a"/><text x="30" y="140" font-size="21" fill="#172b3a" text-anchor="start">发出</text><text x="210" y="140" font-size="21" fill="#172b3a" text-anchor="middle">首内容</text><text x="445" y="140" font-size="21" fill="#172b3a" text-anchor="end">完成</text><path d="M30 113 V96 H210 V113" fill="none" stroke="#2563eb" stroke-width="2"  /><text x="120" y="83" font-size="23" fill="#1d4ed8" text-anchor="middle">TTFT</text><text x="210" y="213" font-size="22" fill="#172b3a" text-anchor="middle">先</text><text x="290" y="213" font-size="22" fill="#172b3a" text-anchor="middle">提交</text><text x="370" y="213" font-size="22" fill="#172b3a" text-anchor="middle">申请</text><path d="M210 244 V258 H290 V244" fill="none" stroke="#059669" stroke-width="2"  /><text x="250" y="291" font-size="22" fill="#047857" text-anchor="middle">内容片段间隔</text><path d="M30 318 V332 H445 V318" fill="none" stroke="#475569" stroke-width="2"  /><text x="237" y="365" font-size="23" fill="#172b3a" text-anchor="middle">E2E：直到完整结束</text><text x="20" y="405" font-size="20" fill="#475569" text-anchor="start">首网络包可能只有元信息；</text><text x="20" y="430" font-size="20" fill="#475569" text-anchor="start">片段间隔不一定等于 token 间隔。</text></g></svg>
