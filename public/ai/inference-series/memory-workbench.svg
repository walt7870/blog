<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="510" viewBox="0 0 1120 510" role="img" aria-labelledby="title desc"><title id="title">显存像工作台：公共材料、个人便笺、临时空位</title><desc id="desc">共享模型权重、每请求KV状态与临时工作区占用不同资源；示意分区不按实际字节比例。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L7 4 L0 8 Z" fill="#475569"/></marker></defs><rect width="1120" height="510" fill="#f8fafc"/><g font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif"><text x="36" y="48" font-size="29" fill="#172b3a" text-anchor="start">显存像工作台：公共材料、个人便笺、临时空位</text><rect x="36" y="120" width="1048" height="270" rx="0" fill="#fff" stroke="#64748b"/><rect x="58" y="143" width="367" height="223" rx="6" fill="#dbeafe" stroke="#cbd5e1"/><rect x="83" y="169" width="280" height="50" rx="2" fill="#eff6ff" stroke="#60a5fa"/><rect x="99" y="189" width="280" height="50" rx="2" fill="#eff6ff" stroke="#60a5fa"/><rect x="115" y="209" width="280" height="50" rx="2" fill="#eff6ff" stroke="#60a5fa"/><rect x="131" y="229" width="280" height="50" rx="2" fill="#eff6ff" stroke="#60a5fa"/><text x="241" y="322" font-size="28" fill="#172b3a" text-anchor="middle">共享模型权重</text><text x="241" y="350" font-size="18" fill="#475569" text-anchor="middle">通常不随每个用户复制</text><rect x="456" y="157" width="89" height="130" rx="2" fill="#d1fae5" stroke="#14b8a6"/><text x="500" y="202" font-size="25" fill="#172b3a" text-anchor="middle">林</text><path d="M469 221 h60" fill="none" stroke="#6ee7b7" stroke-width="2"  /><path d="M469 236 h60" fill="none" stroke="#6ee7b7" stroke-width="2"  /><path d="M469 251 h60" fill="none" stroke="#6ee7b7" stroke-width="2"  /><rect x="561" y="174" width="89" height="130" rx="2" fill="#d1fae5" stroke="#14b8a6"/><text x="605" y="219" font-size="25" fill="#172b3a" text-anchor="middle">周</text><path d="M574 238 h60" fill="none" stroke="#6ee7b7" stroke-width="2"  /><path d="M574 253 h60" fill="none" stroke="#6ee7b7" stroke-width="2"  /><path d="M574 268 h60" fill="none" stroke="#6ee7b7" stroke-width="2"  /><rect x="666" y="191" width="89" height="130" rx="2" fill="#d1fae5" stroke="#14b8a6"/><text x="710" y="236" font-size="25" fill="#172b3a" text-anchor="middle">陈</text><path d="M679 255 h60" fill="none" stroke="#6ee7b7" stroke-width="2"  /><path d="M679 270 h60" fill="none" stroke="#6ee7b7" stroke-width="2"  /><path d="M679 285 h60" fill="none" stroke="#6ee7b7" stroke-width="2"  /><text x="609" y="337" font-size="27" fill="#172b3a" text-anchor="middle">各请求 KV</text><rect x="799" y="144" width="259" height="222" rx="0" fill="#fef3c7" stroke="#d6b863"/><text x="928" y="224" font-size="27" fill="#172b3a" text-anchor="middle">临时工作区</text><text x="928" y="265" font-size="21" fill="#475569" text-anchor="middle">激活、算子缓冲等</text><path d="M58 390 V423 H1060 V390" fill="none" stroke="#475569" stroke-width="2"  /><text x="560" y="461" font-size="24" fill="#172b3a" text-anchor="middle">容量有限：资料更长、独立请求更多，便笺区会扩张。</text><text x="36" y="496" font-size="19" fill="#475569" text-anchor="start">仅作分区示意，不按字节比例。真实分配还受并行、缓存池和后端影响。</text></g></svg>
