<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="480" viewBox="0 0 1120 480" role="img" aria-labelledby="title desc"><title id="title">屏幕上的回答，来自一条协作链</title><desc id="desc">教学场景：小林提问，应用检索虚构制度片段，模型服务生成文字，应用展示答复。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L7 4 L0 8 Z" fill="#475569"/></marker></defs><rect width="1120" height="480" fill="#f8fafc"/><g font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif"><text x="36" y="48" font-size="29" fill="#172b3a" text-anchor="start">屏幕上的回答，来自一条协作链</text><rect x="36" y="103" width="304" height="106" rx="6" fill="#dbeafe" stroke="#cbd5e1"/><text x="58" y="143" font-size="23" fill="#172b3a" text-anchor="start">小林的问题</text><text x="58" y="183" font-size="27" fill="#172b3a" text-anchor="start">年假怎么申请？</text><rect x="36" y="253" width="304" height="127" rx="6" fill="#fff" stroke="#cbd5e1"/><text x="58" y="292" font-size="23" fill="#172b3a" text-anchor="start">应用取到的制度片段</text><text x="58" y="331" font-size="21" fill="#172b3a" text-anchor="start">“先提交申请，再审批。”</text><text x="58" y="361" font-size="17" fill="#475569" text-anchor="start">虚构制度，仅用于教学</text><path d="M340 155 H389 V226 H438" fill="none" stroke="#475569" stroke-width="2"  marker-end="url(#arrow)"/><path d="M340 315 H389 V250 H438" fill="none" stroke="#475569" stroke-width="2"  marker-end="url(#arrow)"/><rect x="438" y="163" width="244" height="139" rx="6" fill="#d1fae5" stroke="#cbd5e1"/><text x="560" y="205" font-size="28" fill="#172b3a" text-anchor="middle">模型服务</text><text x="560" y="248" font-size="21" fill="#475569" text-anchor="middle">按输入计算答复</text><text x="560" y="282" font-size="20" fill="#475569" text-anchor="middle">引擎组织执行</text><path d="M682 233 H749" fill="none" stroke="#475569" stroke-width="2"  marker-end="url(#arrow)"/><rect x="751" y="129" width="333" height="206" rx="6" fill="#fff" stroke="#cbd5e1"/><text x="775" y="172" font-size="23" fill="#172b3a" text-anchor="start">小林看到的回复</text><text x="775" y="221" font-size="23" fill="#172b3a" text-anchor="start">先在系统中提交申请，</text><text x="775" y="259" font-size="23" fill="#172b3a" text-anchor="start">然后等待审批。</text><path d="M776 285 H1023" fill="none" stroke="#14b8a6" stroke-width="2"  /><text x="36" y="435" font-size="22" fill="#475569" text-anchor="start">生成文字 ≠ 真正提交业务申请；检索、权限与业务执行由应用负责。</text></g></svg>
