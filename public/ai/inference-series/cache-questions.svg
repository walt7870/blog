<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="560" viewBox="0 0 1120 560" role="img" aria-labelledby="title desc"><title id="title">四种机制，回答四个不同的问题</title><desc id="desc">KV cache保存历史状态，prefix cache在兼容请求间复用前缀，Paged管理物理位置，FlashAttention减少attention执行中的IO。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L7 4 L0 8 Z" fill="#475569"/></marker></defs><rect width="1120" height="560" fill="#f8fafc"/><g font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif"><text x="36" y="48" font-size="29" fill="#172b3a" text-anchor="start">四种机制，回答四个不同的问题</text><text x="36" y="110" font-size="25" fill="#172b3a" text-anchor="start">KV cache：旧位置还要重算吗？</text><rect x="36" y="132" width="86" height="54" rx="6" fill="#d1fae5" stroke="#cbd5e1"/><text x="79" y="167" font-size="23" fill="#172b3a" text-anchor="middle">旧</text><rect x="130" y="132" width="86" height="54" rx="6" fill="#d1fae5" stroke="#cbd5e1"/><text x="173" y="167" font-size="23" fill="#172b3a" text-anchor="middle">旧</text><rect x="224" y="132" width="86" height="54" rx="6" fill="#d1fae5" stroke="#cbd5e1"/><text x="267" y="167" font-size="23" fill="#172b3a" text-anchor="middle">旧</text><rect x="318" y="132" width="86" height="54" rx="6" fill="#dbeafe" stroke="#cbd5e1"/><text x="361" y="167" font-size="23" fill="#172b3a" text-anchor="middle">新</text><text x="471" y="167" font-size="24" fill="#172b3a" text-anchor="start">保留同一序列的历史 K/V</text><path d="M36 211 H1084" fill="none" stroke="#cbd5e1" stroke-width="2"  /><text x="36" y="250" font-size="25" fill="#172b3a" text-anchor="start">Prefix cache：别人能借这段吗？</text><rect x="36" y="271" width="86" height="54" rx="6" fill="#d1fae5" stroke="#cbd5e1"/><text x="79" y="306" font-size="23" fill="#172b3a" text-anchor="middle">a</text><rect x="130" y="271" width="86" height="54" rx="6" fill="#d1fae5" stroke="#cbd5e1"/><text x="173" y="306" font-size="23" fill="#172b3a" text-anchor="middle">b</text><rect x="224" y="271" width="86" height="54" rx="6" fill="#d1fae5" stroke="#cbd5e1"/><text x="267" y="306" font-size="23" fill="#172b3a" text-anchor="middle">c</text><rect x="318" y="271" width="86" height="54" rx="6" fill="#d1fae5" stroke="#cbd5e1"/><text x="361" y="306" font-size="23" fill="#172b3a" text-anchor="middle">d</text><path d="M414 298 H501" fill="none" stroke="#475569" stroke-width="2"  marker-end="url(#arrow)"/><rect x="527" y="271" width="86" height="54" rx="6" fill="#d1fae5" stroke="#cbd5e1"/><text x="570" y="306" font-size="23" fill="#172b3a" text-anchor="middle">a</text><rect x="621" y="271" width="86" height="54" rx="6" fill="#d1fae5" stroke="#cbd5e1"/><text x="664" y="306" font-size="23" fill="#172b3a" text-anchor="middle">b</text><rect x="715" y="271" width="86" height="54" rx="6" fill="#d1fae5" stroke="#cbd5e1"/><text x="758" y="306" font-size="23" fill="#172b3a" text-anchor="middle">c</text><rect x="809" y="271" width="86" height="54" rx="6" fill="#dbeafe" stroke="#cbd5e1"/><text x="852" y="306" font-size="23" fill="#172b3a" text-anchor="middle">x</text><path d="M36 350 H1084" fill="none" stroke="#cbd5e1" stroke-width="2"  /><text x="36" y="390" font-size="25" fill="#172b3a" text-anchor="start">Paged：便笺放在哪里？</text><rect x="36" y="414" width="106" height="54" rx="6" fill="#dbeafe" stroke="#cbd5e1"/><text x="89" y="449" font-size="23" fill="#172b3a" text-anchor="middle">页7</text><rect x="150" y="414" width="106" height="54" rx="6" fill="#dbeafe" stroke="#cbd5e1"/><text x="203" y="449" font-size="23" fill="#172b3a" text-anchor="middle">页2</text><rect x="264" y="414" width="106" height="54" rx="6" fill="#dbeafe" stroke="#cbd5e1"/><text x="317" y="449" font-size="23" fill="#172b3a" text-anchor="middle">页19</text><text x="470" y="451" font-size="24" fill="#172b3a" text-anchor="start">逻辑顺序 → 分散的物理块</text><text x="36" y="513" font-size="25" fill="#172b3a" text-anchor="start">FlashAttention：计算时怎样少搬中间数据？</text><text x="36" y="546" font-size="20" fill="#475569" text-anchor="start">分块与融合执行精确 attention；不等于减少为线性运算量。</text></g></svg>
