<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="640" viewBox="0 0 1120 640" role="img" aria-labelledby="title desc"><title id="title">模型能力怎样变成可用服务</title><desc id="desc">应用发起请求，推理引擎管理状态与调度，计算框架与算子库执行模型，硬件提供资源；模型权重和配置由引擎加载。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 Z" fill="#64748b"/></marker><marker id="control" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 Z" fill="#e88191"/></marker></defs><rect width="1120" height="640" fill="#f8fafc"/><g font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif"><text x="32" y="45" font-size="27" fill="#172b3a" text-anchor="start">模型能力怎样变成可用服务</text><g><rect x="32" y="90" width="735" height="82" rx="6" fill="#fff" stroke="#cbd5e1"/><text x="50" y="122" font-size="21" fill="#172b3a" text-anchor="start">应用与业务</text><text x="50" y="152" font-size="17" fill="#475569" text-anchor="start">检索、会话、工具、权限、质量校验</text></g><path d="M400 172 V214" fill="none" stroke="#64748b" stroke-width="2"  marker-start="url(#arrow)" marker-end="url(#arrow)"/><text x="580" y="199" font-size="17" fill="#64748b" text-anchor="middle">请求 ↓ / 结果 ↑</text><g><rect x="32" y="216" width="735" height="114" rx="6" fill="#eff6ff" stroke="#60a5fa"/><text x="50" y="248" font-size="21" fill="#172b3a" text-anchor="start">推理引擎：vLLM / SGLang 等</text><text x="50" y="278" font-size="17" fill="#475569" text-anchor="start">请求队列 → 调度与 KV 管理 → 模型执行 → 采样与返回</text><text x="50" y="304" font-size="17" fill="#475569" text-anchor="start">状态：已计算位置、活跃缓存、停止与取消</text></g><g><rect x="813" y="216" width="275" height="114" rx="6" fill="#ecfdf5" stroke="#14b8a6"/><text x="831" y="248" font-size="21" fill="#172b3a" text-anchor="start">模型与配置</text><text x="831" y="278" font-size="17" fill="#475569" text-anchor="start">架构、权重、tokenizer</text><text x="831" y="304" font-size="17" fill="#475569" text-anchor="start">chat template、模态处理</text></g><path d="M813 273 H767" fill="none" stroke="#64748b" stroke-width="2"   marker-end="url(#arrow)"/><text x="791" y="258" font-size="17" fill="#64748b" text-anchor="middle">加载</text><path d="M400 330 V374" fill="none" stroke="#64748b" stroke-width="2"  marker-start="url(#arrow)" marker-end="url(#arrow)"/><text x="590" y="357" font-size="17" fill="#64748b" text-anchor="middle">计算任务 ↓ / 张量结果 ↑</text><g><rect x="32" y="376" width="1056" height="82" rx="6" fill="#ecfdf5" stroke="#14b8a6"/><text x="50" y="408" font-size="21" fill="#172b3a" text-anchor="start">计算框架与算子</text><text x="50" y="438" font-size="17" fill="#475569" text-anchor="start">PyTorch / MLX；attention、GEMM、MoE、编译与执行图</text></g><path d="M400 458 V502" fill="none" stroke="#64748b" stroke-width="2"  marker-start="url(#arrow)" marker-end="url(#arrow)"/><text x="590" y="485" font-size="17" fill="#64748b" text-anchor="middle">设备执行 ↓ / 计算结果 ↑</text><g><rect x="32" y="504" width="1056" height="82" rx="6" fill="#fff" stroke="#cbd5e1"/><text x="50" y="536" font-size="21" fill="#172b3a" text-anchor="start">硬件与平台</text><text x="50" y="566" font-size="17" fill="#475569" text-anchor="start">GPU / CPU / 加速器；显存、内存带宽、卡间互联、CUDA / ROCm / Metal</text></g><text x="32" y="618" font-size="17" fill="#475569" text-anchor="start">分布式路由、KV 传输与存储可在引擎外围协作；不是所有项目都处于同一层。</text></g></svg>
