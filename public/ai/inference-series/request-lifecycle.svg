<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="760" viewBox="0 0 1120 760" role="img" aria-labelledby="title desc"><title id="title">常规文本生成请求的时序</title><desc id="desc">客户端经API进入引擎，引擎调度GPU完成prefill并返回首token，然后循环decode，结束后解除活跃引用。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 Z" fill="#64748b"/></marker><marker id="control" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 Z" fill="#e88191"/></marker></defs><rect width="1120" height="760" fill="#f8fafc"/><g font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif"><text x="32" y="45" font-size="27" fill="#172b3a" text-anchor="start">常规文本生成请求的时序</text><rect x="30" y="83" width="160" height="48" rx="6" fill="#eff6ff" stroke="#cbd5e1"/><text x="110" y="114" font-size="20" fill="#172b3a" text-anchor="middle">客户端</text><path d="M110 131 V675" stroke="#cbd5e1" stroke-dasharray="5 5"/><rect x="320" y="83" width="160" height="48" rx="6" fill="#eff6ff" stroke="#cbd5e1"/><text x="400" y="114" font-size="20" fill="#172b3a" text-anchor="middle">API 与分词</text><path d="M400 131 V675" stroke="#cbd5e1" stroke-dasharray="5 5"/><rect x="610" y="83" width="160" height="48" rx="6" fill="#eff6ff" stroke="#cbd5e1"/><text x="690" y="114" font-size="20" fill="#172b3a" text-anchor="middle">调度与 KV</text><path d="M690 131 V675" stroke="#cbd5e1" stroke-dasharray="5 5"/><rect x="920" y="83" width="160" height="48" rx="6" fill="#ecfdf5" stroke="#cbd5e1"/><text x="1000" y="114" font-size="20" fill="#172b3a" text-anchor="middle">GPU 执行</text><path d="M1000 131 V675" stroke="#cbd5e1" stroke-dasharray="5 5"/><path d="M110 174 H400" fill="none" stroke="#64748b" stroke-width="2"   marker-end="url(#arrow)"/><text x="255" y="163" font-size="17" fill="#64748b" text-anchor="middle">messages</text><path d="M400 230 H690" fill="none" stroke="#64748b" stroke-width="2"   marker-end="url(#arrow)"/><text x="545" y="219" font-size="17" fill="#64748b" text-anchor="middle">token 与生成参数</text><text x="705" y="264" font-size="16" fill="#475569" text-anchor="start">查前缀、分配页、扣预算</text><path d="M690 305 H1000" fill="none" stroke="#64748b" stroke-width="2"   marker-end="url(#arrow)"/><text x="845" y="294" font-size="17" fill="#64748b" text-anchor="middle">未命中输入的 prefill</text><path d="M1000 359 H690" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5"  marker-end="url(#arrow)"/><text x="845" y="348" font-size="17" fill="#64748b" text-anchor="middle">logits / 模型结果</text><path d="M690 411 H400" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5"  marker-end="url(#arrow)"/><text x="545" y="400" font-size="17" fill="#64748b" text-anchor="middle">采样后的首 token</text><path d="M400 455 H110" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5"  marker-end="url(#arrow)"/><text x="255" y="444" font-size="17" fill="#64748b" text-anchor="middle">首个有效流式片段</text><rect x="630" y="492" width="455" height="149" rx="4" fill="none" stroke="#cbd5e1"/><text x="644" y="516" font-size="16" fill="#475569" text-anchor="start">循环：未停止时</text><path d="M690 558 H1000" fill="none" stroke="#64748b" stroke-width="2"   marker-end="url(#arrow)"/><text x="845" y="546" font-size="17" fill="#64748b" text-anchor="middle">新 token + 历史 KV → decode</text><path d="M1000 614 H690" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5"  marker-end="url(#arrow)"/><text x="845" y="602" font-size="17" fill="#64748b" text-anchor="middle">模型结果；采样并继续返回</text><text x="690" y="693" font-size="18" fill="#172b3a" text-anchor="middle">结束：解除活跃引用</text><text x="32" y="733" font-size="17" fill="#475569" text-anchor="start">时间从上到下。图示为成功主路径；排队、取消与错误由请求状态机管理。</text></g></svg>
