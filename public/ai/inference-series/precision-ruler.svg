<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="470" viewBox="0 0 1120 470" role="img" aria-labelledby="title desc"><title id="title">量化像把连续数值放到有限刻度上</title><desc id="desc">示意均匀量化：原值0.37，细刻度近似0.375，粗刻度近似0.25。真实浮点格式和分组量化不限于这种刻度。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L7 4 L0 8 Z" fill="#475569"/></marker></defs><rect width="1120" height="470" fill="#f8fafc"/><g font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif"><text x="36" y="48" font-size="29" fill="#172b3a" text-anchor="start">量化像把连续数值放到有限刻度上</text><text x="36" y="158" font-size="24" fill="#172b3a" text-anchor="start">较细刻度</text><path d="M250 150 H1050" fill="none" stroke="#475569" stroke-width="2"  /><path d="M250 140 v20" fill="none" stroke="#475569" stroke-width="2"  /><path d="M300 140 v20" fill="none" stroke="#475569" stroke-width="2"  /><path d="M350 140 v20" fill="none" stroke="#475569" stroke-width="2"  /><path d="M400 140 v20" fill="none" stroke="#475569" stroke-width="2"  /><path d="M450 140 v20" fill="none" stroke="#475569" stroke-width="2"  /><path d="M500 140 v20" fill="none" stroke="#475569" stroke-width="2"  /><path d="M550 140 v20" fill="none" stroke="#475569" stroke-width="2"  /><path d="M600 140 v20" fill="none" stroke="#475569" stroke-width="2"  /><path d="M650 140 v20" fill="none" stroke="#475569" stroke-width="2"  /><path d="M700 140 v20" fill="none" stroke="#475569" stroke-width="2"  /><path d="M750 140 v20" fill="none" stroke="#475569" stroke-width="2"  /><path d="M800 140 v20" fill="none" stroke="#475569" stroke-width="2"  /><path d="M850 140 v20" fill="none" stroke="#475569" stroke-width="2"  /><path d="M900 140 v20" fill="none" stroke="#475569" stroke-width="2"  /><path d="M950 140 v20" fill="none" stroke="#475569" stroke-width="2"  /><path d="M1000 140 v20" fill="none" stroke="#475569" stroke-width="2"  /><path d="M1050 140 v20" fill="none" stroke="#475569" stroke-width="2"  /><circle cx="546" cy="150" r="8" fill="#be123c"/><circle cx="550" cy="185" r="7" fill="#2563eb"/><text x="250" y="217" font-size="20" fill="#475569" text-anchor="middle">0</text><text x="1050" y="217" font-size="20" fill="#475569" text-anchor="middle">1</text><text x="755" y="123" font-size="23" fill="#172b3a" text-anchor="start">0.37 → 0.375，误差较小</text><text x="36" y="298" font-size="24" fill="#172b3a" text-anchor="start">较粗刻度</text><path d="M250 290 H1050" fill="none" stroke="#475569" stroke-width="2"  /><path d="M250 280 v20" fill="none" stroke="#475569" stroke-width="2"  /><path d="M450 280 v20" fill="none" stroke="#475569" stroke-width="2"  /><path d="M650 280 v20" fill="none" stroke="#475569" stroke-width="2"  /><path d="M850 280 v20" fill="none" stroke="#475569" stroke-width="2"  /><path d="M1050 280 v20" fill="none" stroke="#475569" stroke-width="2"  /><circle cx="546" cy="290" r="8" fill="#be123c"/><circle cx="450" cy="325" r="7" fill="#2563eb"/><text x="250" y="357" font-size="20" fill="#475569" text-anchor="middle">0</text><text x="1050" y="357" font-size="20" fill="#475569" text-anchor="middle">1</text><text x="755" y="263" font-size="23" fill="#172b3a" text-anchor="start">0.37 → 0.25，误差较大</text><text x="36" y="403" font-size="23" fill="#172b3a" text-anchor="start">刻度越少，编码可以越短；实际计算能否更快，还要看 kernel 与硬件。</text><text x="36" y="445" font-size="20" fill="#475569" text-anchor="start">红点是原值，蓝点是近似值。均匀刻度仅用于建立直觉，不代表所有浮点格式。</text></g></svg>
