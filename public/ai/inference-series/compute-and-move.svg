<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="450" viewBox="0 0 1120 450" role="img" aria-labelledby="title desc"><title id="title">装得下、搬得快、算得快，是三件事</title><desc id="desc">容量是可保存字节，带宽是单位时间可搬字节，算力是单位时间可执行运算。简化示意不代表真实硬件比例。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L7 4 L0 8 Z" fill="#475569"/></marker></defs><rect width="1120" height="450" fill="#f8fafc"/><g font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif"><text x="36" y="48" font-size="29" fill="#172b3a" text-anchor="start">装得下、搬得快、算得快，是三件事</text><rect x="36" y="112" width="260" height="230" rx="6" fill="#fff" stroke="#cbd5e1"/><rect x="62" y="145" width="207" height="24" rx="0" fill="#dbeafe" stroke="#60a5fa"/><rect x="62" y="183" width="207" height="24" rx="0" fill="#dbeafe" stroke="#60a5fa"/><rect x="62" y="221" width="207" height="24" rx="0" fill="#dbeafe" stroke="#60a5fa"/><rect x="62" y="259" width="207" height="24" rx="0" fill="#dbeafe" stroke="#60a5fa"/><text x="166" y="386" font-size="25" fill="#172b3a" text-anchor="middle">容量：能装多少</text><path d="M330 180 H717" fill="none" stroke="#475569" stroke-width="2"  marker-end="url(#arrow)"/><path d="M330 248 H717" fill="none" stroke="#475569" stroke-width="2"  marker-end="url(#arrow)"/><rect x="371" y="195" width="70" height="37" rx="1" fill="#d1fae5" stroke="#14b8a6"/><rect x="476" y="195" width="70" height="37" rx="1" fill="#d1fae5" stroke="#14b8a6"/><rect x="581" y="195" width="70" height="37" rx="1" fill="#d1fae5" stroke="#14b8a6"/><text x="524" y="297" font-size="25" fill="#172b3a" text-anchor="middle">数据搬运通道</text><text x="524" y="386" font-size="25" fill="#172b3a" text-anchor="middle">带宽：每秒搬多少</text><rect x="760" y="112" width="324" height="230" rx="6" fill="#fef3c7" stroke="#cbd5e1"/><rect x="792" y="143" width="54" height="43" rx="2" fill="#fff" stroke="#d6b863"/><rect x="860" y="143" width="54" height="43" rx="2" fill="#fff" stroke="#d6b863"/><rect x="928" y="143" width="54" height="43" rx="2" fill="#fff" stroke="#d6b863"/><rect x="996" y="143" width="54" height="43" rx="2" fill="#fff" stroke="#d6b863"/><rect x="792" y="201" width="54" height="43" rx="2" fill="#fff" stroke="#d6b863"/><rect x="860" y="201" width="54" height="43" rx="2" fill="#fff" stroke="#d6b863"/><rect x="928" y="201" width="54" height="43" rx="2" fill="#fff" stroke="#d6b863"/><rect x="996" y="201" width="54" height="43" rx="2" fill="#fff" stroke="#d6b863"/><rect x="792" y="259" width="54" height="43" rx="2" fill="#fff" stroke="#d6b863"/><rect x="860" y="259" width="54" height="43" rx="2" fill="#fff" stroke="#d6b863"/><rect x="928" y="259" width="54" height="43" rx="2" fill="#fff" stroke="#d6b863"/><rect x="996" y="259" width="54" height="43" rx="2" fill="#fff" stroke="#d6b863"/><text x="922" y="386" font-size="25" fill="#172b3a" text-anchor="middle">算力：每秒算多少</text><text x="36" y="432" font-size="22" fill="#475569" text-anchor="start">任一环节成为瓶颈，都可能让另外两项资源等待。</text></g></svg>
