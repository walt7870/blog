<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="420" viewBox="0 0 1120 420" role="img" aria-labelledby="sherpa-runtime-title sherpa-runtime-desc">
  <title id="sherpa-runtime-title">从音频到文字，语音框架与计算后端的分工</title>
  <desc id="sherpa-runtime-desc">sherpa-onnx 组织特征与流管理，调用 ONNX Runtime 执行已适配模型，再解码为文字交给应用；应用负责资料权限、检索与后续语言模型调用。</desc>
  <defs><marker id="sherpa-runtime-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#64748b"/></marker></defs>
  <rect width="1120" height="420" fill="#f8fafc"/>
  <g font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" fill="#172b3a">
    <text x="32" y="44" font-size="27">从音频到文字，谁处理哪一步？</text>
    <rect x="16" y="88" width="772" height="220" rx="6" fill="#eff6ff" stroke="#60a5fa"/>
    <text x="32" y="120" font-size="21">sherpa-onnx：组织语音任务流程</text>
    <g fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#sherpa-runtime-arrow)"><path d="M240 216 H288"/><path d="M528 216 H576"/><path d="M768 216 H816"/></g>
    <g><rect x="32" y="152" width="208" height="128" rx="6" fill="#fff" stroke="#cbd5e1"/><text x="48" y="184" font-size="21">特征与流管理</text><text x="48" y="216" font-size="18" fill="#475569">输入：音频采样</text><text x="48" y="248" font-size="18" fill="#475569">准备特征与所需状态</text></g>
    <g><rect x="288" y="152" width="240" height="128" rx="6" fill="#ecfdf5" stroke="#14b8a6"/><text x="304" y="184" font-size="21">ONNX Runtime</text><text x="304" y="216" font-size="18" fill="#475569">执行已适配模型的计算</text><text x="304" y="248" font-size="18" fill="#475569">返回分数或中间表示</text></g>
    <g><rect x="576" y="152" width="192" height="128" rx="6" fill="#fff" stroke="#cbd5e1"/><text x="592" y="184" font-size="21">解码与结果</text><text x="592" y="216" font-size="18" fill="#475569">解释输出与词表</text><text x="592" y="248" font-size="18" fill="#475569">得到识别文字</text></g>
    <g><rect x="816" y="152" width="272" height="128" rx="6" fill="#fff" stroke="#cbd5e1"/><text x="832" y="184" font-size="21">应用接力</text><text x="832" y="216" font-size="18" fill="#475569">接收“年假怎么申请？”</text><text x="832" y="248" font-size="18" fill="#475569">权限、检索、调用语言模型</text></g>
    <text x="32" y="348" font-size="19">ONNX 是模型格式；ONNX Runtime 负责计算；sherpa-onnx 组织语音流程。</text>
    <text x="32" y="384" font-size="17" fill="#475569">常见识别路线的职责示意。具体特征、模型调用次数与解码流程依架构而定，部分设备使用专门后端。</text>
  </g>
</svg>
