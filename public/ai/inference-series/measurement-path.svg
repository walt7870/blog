<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="450" viewBox="0 0 1120 450" role="img" aria-labelledby="title desc"><title id="title">用户感到慢，要沿着同一请求定位</title><desc id="desc">教学时间线依次示意接入排队、prefill、生成首内容、继续decode和完成。客户端计时需要与服务端trace对齐，不能由chunk时间推断所有内部阶段。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L7 4 L0 8 Z" fill="#475569"/></marker></defs><rect width="1120" height="450" fill="#f8fafc"/><g font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif"><text x="36" y="48" font-size="29" fill="#172b3a" text-anchor="start">用户感到慢，要沿着同一请求定位</text><text x="36" y="112" font-size="24" fill="#172b3a" text-anchor="start">服务端分段</text><rect x="36" y="139" width="220" height="72" rx="0" fill="#e2e8f0" stroke="#fff"/><text x="146" y="184" font-size="25" fill="#172b3a" text-anchor="middle">接入 / 排队</text><rect x="256" y="139" width="300" height="72" rx="0" fill="#dbeafe" stroke="#fff"/><text x="406" y="184" font-size="25" fill="#172b3a" text-anchor="middle">Prefill</text><rect x="556" y="139" width="528" height="72" rx="0" fill="#d1fae5" stroke="#fff"/><text x="820" y="184" font-size="25" fill="#172b3a" text-anchor="middle">逐步 Decode</text><path d="M36 253 H1084" fill="none" stroke="#475569" stroke-width="2"  marker-end="url(#arrow)"/><circle cx="36" cy="253" r="6" fill="#172b3a"/><circle cx="556" cy="253" r="6" fill="#172b3a"/><circle cx="1084" cy="253" r="6" fill="#172b3a"/><text x="36" y="293" font-size="22" fill="#172b3a" text-anchor="start">客户端发出</text><text x="556" y="293" font-size="22" fill="#172b3a" text-anchor="middle">首个有效内容</text><text x="1084" y="293" font-size="22" fill="#172b3a" text-anchor="end">完成</text><path d="M36 330 V347 H556 V330" fill="none" stroke="#475569" stroke-width="2"  /><text x="296" y="383" font-size="24" fill="#172b3a" text-anchor="middle">TTFT：先查首段路径</text><path d="M591 330 V347 H1084 V330" fill="none" stroke="#475569" stroke-width="2"  /><text x="837" y="383" font-size="24" fill="#172b3a" text-anchor="middle">生成中停顿：查逐步执行</text><text x="36" y="430" font-size="20" fill="#475569" text-anchor="start">示意非实测比例；传输、分词、编码器等需按系统补齐，内部原因由 trace 验证。</text></g></svg>
