<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="530" viewBox="0 0 1120 530" role="img" aria-labelledby="title desc"><title id="title">先看瓶颈，再决定多卡怎样分工</title><desc id="desc">模型放不下需要拆模型，用户多需要请求副本，长prefill干扰生成可评估阶段分离。图示不表示性能倍数或完整通信拓扑。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L7 4 L0 8 Z" fill="#475569"/></marker></defs><rect width="1120" height="530" fill="#f8fafc"/><g font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif"><text x="36" y="48" font-size="29" fill="#172b3a" text-anchor="start">先看瓶颈，再决定多卡怎样分工</text><text x="36" y="112" font-size="25" fill="#172b3a" text-anchor="start">模型放不下</text><rect x="285" y="80" width="210" height="65" rx="6" fill="#dbeafe" stroke="#cbd5e1"/><text x="390" y="120.5" font-size="23" fill="#172b3a" text-anchor="middle">模型前半</text><path d="M495 112 H563" fill="none" stroke="#475569" stroke-width="2"  marker-end="url(#arrow)"/><rect x="565" y="80" width="210" height="65" rx="6" fill="#dbeafe" stroke="#cbd5e1"/><text x="670" y="120.5" font-size="23" fill="#172b3a" text-anchor="middle">模型后半</text><text x="836" y="120" font-size="23" fill="#172b3a" text-anchor="start">拆模型：如 PP</text><path d="M36 178 H1084" fill="none" stroke="#cbd5e1" stroke-width="2"  /><text x="36" y="245" font-size="25" fill="#172b3a" text-anchor="start">请求太多</text><rect x="285" y="207" width="210" height="65" rx="6" fill="#d1fae5" stroke="#cbd5e1"/><text x="390" y="247.5" font-size="23" fill="#172b3a" text-anchor="middle">完整副本 1</text><rect x="565" y="207" width="210" height="65" rx="6" fill="#d1fae5" stroke="#cbd5e1"/><text x="670" y="247.5" font-size="23" fill="#172b3a" text-anchor="middle">完整副本 2</text><text x="836" y="246" font-size="23" fill="#172b3a" text-anchor="start">分请求：DP</text><text x="390" y="307" font-size="21" fill="#475569" text-anchor="middle">小林的请求</text><text x="670" y="307" font-size="21" fill="#475569" text-anchor="middle">小周的请求</text><path d="M36 341 H1084" fill="none" stroke="#cbd5e1" stroke-width="2"  /><text x="36" y="408" font-size="25" fill="#172b3a" text-anchor="start">两阶段互相干扰</text><rect x="285" y="373" width="210" height="65" rx="6" fill="#dbeafe" stroke="#cbd5e1"/><text x="390" y="413.5" font-size="23" fill="#172b3a" text-anchor="middle">Prefill 池</text><path d="M495 405 H563" fill="none" stroke="#475569" stroke-width="2"  marker-end="url(#arrow)"/><rect x="565" y="373" width="210" height="65" rx="6" fill="#d1fae5" stroke="#cbd5e1"/><text x="670" y="413.5" font-size="23" fill="#172b3a" text-anchor="middle">Decode 池</text><text x="530" y="470" font-size="21" fill="#475569" text-anchor="middle">交接 KV</text><text x="836" y="412" font-size="23" fill="#172b3a" text-anchor="start">分阶段：P/D</text><text x="36" y="514" font-size="20" fill="#475569" text-anchor="start">简化分工示意；TP 在层内协作，EP 拆专家，CP 拆上下文，详见正文。</text></g></svg>
