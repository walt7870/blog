<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="655" viewBox="0 0 1120 655" role="img" aria-labelledby="title desc"><title id="title">及时补位，与穿插长任务，是两种调度改进</title><desc id="desc">上半部两个工作位用四轮展示静态batch空位与连续补位；下半部教学等时隙显示整段prefill阻塞decode与分块穿插。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L7 4 L0 8 Z" fill="#475569"/></marker></defs><rect width="1120" height="655" fill="#f8fafc"/><g font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif"><text x="36" y="48" font-size="29" fill="#172b3a" text-anchor="start">及时补位，与穿插长任务，是两种调度改进</text><text x="36" y="106" font-size="24" fill="#172b3a" text-anchor="start">短请求 A 两轮结束，B 继续：</text><text x="36" y="162" font-size="23" fill="#172b3a" text-anchor="start">整批才换人</text><rect x="266" y="128" width="91" height="46" rx="6" fill="#d1fae5" stroke="#cbd5e1"/><text x="311.5" y="159" font-size="23" fill="#172b3a" text-anchor="middle">A/B</text><rect x="365" y="128" width="91" height="46" rx="6" fill="#d1fae5" stroke="#cbd5e1"/><text x="410.5" y="159" font-size="23" fill="#172b3a" text-anchor="middle">A/B</text><rect x="464" y="128" width="91" height="46" rx="6" fill="#d1fae5" stroke="#cbd5e1"/><text x="509.5" y="159" font-size="23" fill="#172b3a" text-anchor="middle">空/B</text><rect x="563" y="128" width="91" height="46" rx="6" fill="#d1fae5" stroke="#cbd5e1"/><text x="608.5" y="159" font-size="23" fill="#172b3a" text-anchor="middle">空/B</text><text x="36" y="223" font-size="23" fill="#172b3a" text-anchor="start">每轮可补位</text><rect x="266" y="190" width="91" height="46" rx="6" fill="#d1fae5" stroke="#cbd5e1"/><text x="311.5" y="221" font-size="23" fill="#172b3a" text-anchor="middle">A/B</text><rect x="365" y="190" width="91" height="46" rx="6" fill="#d1fae5" stroke="#cbd5e1"/><text x="410.5" y="221" font-size="23" fill="#172b3a" text-anchor="middle">A/B</text><rect x="464" y="190" width="91" height="46" rx="6" fill="#d1fae5" stroke="#cbd5e1"/><text x="509.5" y="221" font-size="23" fill="#172b3a" text-anchor="middle">C/B</text><rect x="563" y="190" width="91" height="46" rx="6" fill="#d1fae5" stroke="#cbd5e1"/><text x="608.5" y="221" font-size="23" fill="#172b3a" text-anchor="middle">C/B</text><text x="714" y="222" font-size="22" fill="#047857" text-anchor="start">C 提早开始</text><path d="M36 270 H1084" fill="none" stroke="#cbd5e1" stroke-width="2"  /><text x="36" y="316" font-size="25" fill="#172b3a" text-anchor="start">长输入 P 到达时，正在生成的 D 会怎样？</text><text x="36" y="376" font-size="23" fill="#172b3a" text-anchor="start">整段 prefill</text><rect x="266" y="342" width="91" height="46" rx="6" fill="#dbeafe" stroke="#cbd5e1"/><text x="311.5" y="373" font-size="23" fill="#172b3a" text-anchor="middle">P</text><rect x="365" y="342" width="91" height="46" rx="6" fill="#dbeafe" stroke="#cbd5e1"/><text x="410.5" y="373" font-size="23" fill="#172b3a" text-anchor="middle">P</text><rect x="464" y="342" width="91" height="46" rx="6" fill="#dbeafe" stroke="#cbd5e1"/><text x="509.5" y="373" font-size="23" fill="#172b3a" text-anchor="middle">P</text><rect x="563" y="342" width="91" height="46" rx="6" fill="#dbeafe" stroke="#cbd5e1"/><text x="608.5" y="373" font-size="23" fill="#172b3a" text-anchor="middle">P</text><rect x="662" y="342" width="91" height="46" rx="6" fill="#d1fae5" stroke="#cbd5e1"/><text x="707.5" y="373" font-size="23" fill="#172b3a" text-anchor="middle">D</text><rect x="761" y="342" width="91" height="46" rx="6" fill="#d1fae5" stroke="#cbd5e1"/><text x="806.5" y="373" font-size="23" fill="#172b3a" text-anchor="middle">D</text><rect x="860" y="342" width="91" height="46" rx="6" fill="#d1fae5" stroke="#cbd5e1"/><text x="905.5" y="373" font-size="23" fill="#172b3a" text-anchor="middle">D</text><rect x="959" y="342" width="91" height="46" rx="6" fill="#d1fae5" stroke="#cbd5e1"/><text x="1004.5" y="373" font-size="23" fill="#172b3a" text-anchor="middle">D</text><text x="36" y="439" font-size="23" fill="#172b3a" text-anchor="start">分块 prefill</text><rect x="266" y="405" width="91" height="46" rx="6" fill="#dbeafe" stroke="#cbd5e1"/><text x="311.5" y="436" font-size="23" fill="#172b3a" text-anchor="middle">P</text><rect x="365" y="405" width="91" height="46" rx="6" fill="#d1fae5" stroke="#cbd5e1"/><text x="410.5" y="436" font-size="23" fill="#172b3a" text-anchor="middle">D</text><rect x="464" y="405" width="91" height="46" rx="6" fill="#dbeafe" stroke="#cbd5e1"/><text x="509.5" y="436" font-size="23" fill="#172b3a" text-anchor="middle">P</text><rect x="563" y="405" width="91" height="46" rx="6" fill="#d1fae5" stroke="#cbd5e1"/><text x="608.5" y="436" font-size="23" fill="#172b3a" text-anchor="middle">D</text><rect x="662" y="405" width="91" height="46" rx="6" fill="#dbeafe" stroke="#cbd5e1"/><text x="707.5" y="436" font-size="23" fill="#172b3a" text-anchor="middle">P</text><rect x="761" y="405" width="91" height="46" rx="6" fill="#d1fae5" stroke="#cbd5e1"/><text x="806.5" y="436" font-size="23" fill="#172b3a" text-anchor="middle">D</text><rect x="860" y="405" width="91" height="46" rx="6" fill="#dbeafe" stroke="#cbd5e1"/><text x="905.5" y="436" font-size="23" fill="#172b3a" text-anchor="middle">P</text><rect x="959" y="405" width="91" height="46" rx="6" fill="#d1fae5" stroke="#cbd5e1"/><text x="1004.5" y="436" font-size="23" fill="#172b3a" text-anchor="middle">D</text><path d="M266 482 H1050" fill="none" stroke="#475569" stroke-width="2"  marker-end="url(#arrow)"/><text x="660" y="516" font-size="22" fill="#475569" text-anchor="middle">时间向右；P 共四份工作，D 也共四份</text><text x="36" y="570" font-size="23" fill="#172b3a" text-anchor="start">P 更分散，D 更早推进；不是把长输入删短，也不保证总耗时下降。</text><text x="36" y="620" font-size="20" fill="#475569" text-anchor="start">教学等时隙示意；真实引擎可在同轮混合 prefill / decode，轮次耗时并不相等。</text></g></svg>
