<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="640" viewBox="0 0 1120 640" role="img" aria-labelledby="title desc"><title id="title">流式语音助手的关键路径与打断</title><desc id="desc">麦克风音频经VAD和ASR转文字，再由LLM生成文本，TTS和声码器输出可播放音频。用户停说前ASR已可运行；打断控制需要终止旧推理并清空待播放队列。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 Z" fill="#64748b"/></marker><marker id="control" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 Z" fill="#e88191"/></marker></defs><rect width="1120" height="640" fill="#f8fafc"/><g font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif"><text x="32" y="45" font-size="27" fill="#172b3a" text-anchor="start">流式语音助手的关键路径与打断</text><g><rect x="32" y="108" width="222" height="110" rx="6" fill="#fff" stroke="#cbd5e1"/><text x="50" y="140" font-size="21" fill="#172b3a" text-anchor="start">音频接入与 VAD</text><text x="50" y="170" font-size="17" fill="#475569" text-anchor="start">音频块、采样率与时钟</text><text x="50" y="196" font-size="17" fill="#475569" text-anchor="start">判断端点，不等于 ASR</text></g><g><rect x="346" y="108" width="288" height="110" rx="6" fill="#eff6ff" stroke="#60a5fa"/><text x="364" y="140" font-size="21" fill="#172b3a" text-anchor="start">流式 ASR</text><text x="364" y="170" font-size="17" fill="#475569" text-anchor="start">特征 / 编码 / 搜索</text><text x="364" y="196" font-size="17" fill="#475569" text-anchor="start">partial → 稳定 final</text></g><g><rect x="764" y="108" width="324" height="110" rx="6" fill="#ecfdf5" stroke="#14b8a6"/><text x="782" y="140" font-size="21" fill="#172b3a" text-anchor="start">语言模型</text><text x="782" y="170" font-size="17" fill="#475569" text-anchor="start">首段可合成文本 → 后续文本</text><text x="782" y="196" font-size="17" fill="#475569" text-anchor="start">KV、调度、工具与停止</text></g><path d="M254 163 H346" fill="none" stroke="#64748b" stroke-width="2"   marker-end="url(#arrow)"/><text x="300" y="151" font-size="17" fill="#64748b" text-anchor="middle">音频块</text><path d="M634 163 H764" fill="none" stroke="#64748b" stroke-width="2"   marker-end="url(#arrow)"/><text x="699" y="151" font-size="17" fill="#64748b" text-anchor="middle">文本 / 事件</text><g><rect x="764" y="340" width="324" height="110" rx="6" fill="#eff6ff" stroke="#60a5fa"/><text x="782" y="372" font-size="21" fill="#172b3a" text-anchor="start">TTS 与声码器 / codec</text><text x="782" y="402" font-size="17" fill="#475569" text-anchor="start">文本 → 声学 / 音频 token</text><text x="782" y="428" font-size="17" fill="#475569" text-anchor="start">生成首个可播放块与后续块</text></g><g><rect x="346" y="340" width="288" height="110" rx="6" fill="#ecfdf5" stroke="#14b8a6"/><text x="364" y="372" font-size="21" fill="#172b3a" text-anchor="start">播放与缓冲</text><text x="364" y="402" font-size="17" fill="#475569" text-anchor="start">音频时钟、续流与欠载</text><text x="364" y="428" font-size="17" fill="#475569" text-anchor="start">回声处理、可打断播放</text></g><path d="M926 218 V340" fill="none" stroke="#64748b" stroke-width="2"   marker-end="url(#arrow)"/><text x="992" y="284" font-size="17" fill="#64748b" text-anchor="middle">文本分块</text><path d="M764 394 H634" fill="none" stroke="#64748b" stroke-width="2"   marker-end="url(#arrow)"/><text x="699" y="382" font-size="17" fill="#64748b" text-anchor="middle">音频块</text><g><rect x="32" y="340" width="222" height="110" rx="6" fill="#fff1f2" stroke="#e88191"/><text x="50" y="372" font-size="21" fill="#172b3a" text-anchor="start">会话与打断控制</text><text x="50" y="402" font-size="17" fill="#475569" text-anchor="start">失效旧请求与输出</text><text x="50" y="428" font-size="17" fill="#475569" text-anchor="start">管理底层状态生命周期</text></g><path d="M254 394 H346" fill="none" stroke="#e88191" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#control)"/><text x="300" y="380" font-size="17" fill="#9f1239" text-anchor="middle">清空队列</text><path d="M143 340 V258 H810 V218" fill="none" stroke="#e88191" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#control)"/><path d="M490 258 V218" fill="none" stroke="#e88191" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#control)"/><path d="M810 258 H1103 V394 H1088" fill="none" stroke="#e88191" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#control)"/><text x="423" y="307" font-size="16" fill="#9f1239" text-anchor="start">取消旧 ASR / LLM / TTS 工作及待提交结果</text><text x="32" y="524" font-size="21" fill="#172b3a" text-anchor="start">用户停说 → 端点确认 → ASR 收尾 → 首段回复 → TTS 首块 → 可播放音频</text><text x="32" y="565" font-size="17" fill="#475569" text-anchor="start">ASR 主体可在说话时运行。首字、首 token、首个网络包、首音频是不同观测事件。</text><text x="32" y="601" font-size="17" fill="#475569" text-anchor="start">打断是控制路径；底层未安全结束前，不可提前复用仍被占用的缓冲或状态。</text></g></svg>
