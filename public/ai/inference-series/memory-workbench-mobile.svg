<svg xmlns="http://www.w3.org/2000/svg" width="480" height="524" viewBox="0 0 480 524" role="img" aria-labelledby="title desc"><title id="title">显存工作台装了什么</title><desc id="desc">共享权重、独立请求状态、临时工作区的纵向示意，不按真实字节比例。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L7 4 L0 8 Z" fill="#475569"/></marker></defs><rect width="480" height="524" fill="#f8fafc"/><g font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif"><text x="20" y="48" font-size="25" fill="#172b3a" text-anchor="start">显存工作台装了什么</text><rect x="20" y="82" width="440" height="342" rx="0" fill="#fff" stroke="#64748b"/><rect x="35" y="97" width="410" height="90" rx="6" fill="#dbeafe" stroke="#cbd5e1"/><rect x="55" y="112" width="120" height="25" rx="1" fill="#eff6ff" stroke="#60a5fa"/><rect x="64" y="121" width="120" height="25" rx="1" fill="#eff6ff" stroke="#60a5fa"/><rect x="73" y="130" width="120" height="25" rx="1" fill="#eff6ff" stroke="#60a5fa"/><text x="230" y="135" font-size="24" fill="#172b3a" text-anchor="start">共享模型权重</text><text x="230" y="169" font-size="20" fill="#475569" text-anchor="start">不按用户复制</text><rect x="36" y="207" width="132" height="89" rx="6" fill="#d1fae5" stroke="#cbd5e1"/><text x="102" y="241" font-size="23" fill="#172b3a" text-anchor="middle">小林</text><text x="102" y="277" font-size="21" fill="#172b3a" text-anchor="middle">请求 KV</text><rect x="174" y="207" width="132" height="89" rx="6" fill="#d1fae5" stroke="#cbd5e1"/><text x="240" y="241" font-size="23" fill="#172b3a" text-anchor="middle">小周</text><text x="240" y="277" font-size="21" fill="#172b3a" text-anchor="middle">请求 KV</text><rect x="312" y="207" width="132" height="89" rx="6" fill="#d1fae5" stroke="#cbd5e1"/><text x="378" y="241" font-size="23" fill="#172b3a" text-anchor="middle">小陈</text><text x="378" y="277" font-size="21" fill="#172b3a" text-anchor="middle">请求 KV</text><rect x="35" y="317" width="410" height="90" rx="6" fill="#fef3c7" stroke="#cbd5e1"/><text x="240" y="353" font-size="24" fill="#172b3a" text-anchor="middle">临时工作区</text><text x="240" y="388" font-size="21" fill="#475569" text-anchor="middle">激活、算子与通信缓冲等</text><text x="20" y="464" font-size="23" fill="#172b3a" text-anchor="start">文档更长、独立人数更多，</text><text x="20" y="497" font-size="20" fill="#475569" text-anchor="start">请求状态会扩张。分区非字节比例。</text></g></svg>
