<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="480" viewBox="0 0 1120 480" role="img" aria-labelledby="title desc"><title id="title">先读已知输入，再逐步生成未知输出</title><desc id="desc">Prefill并行处理已知输入的位置，仍使用因果遮罩；decode依赖已生成结果逐步继续。词块是教学token，不对应真实分词。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L7 4 L0 8 Z" fill="#475569"/></marker></defs><rect width="1120" height="480" fill="#f8fafc"/><g font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif"><text x="36" y="48" font-size="29" fill="#172b3a" text-anchor="start">先读已知输入，再逐步生成未知输出</text><text x="36" y="114" font-size="25" fill="#172b3a" text-anchor="start">Prefill：已知输入都已到齐</text><rect x="36" y="146" width="106" height="54" rx="6" fill="#dbeafe" stroke="#cbd5e1"/><text x="89" y="181" font-size="23" fill="#172b3a" text-anchor="middle">年假</text><rect x="150" y="146" width="106" height="54" rx="6" fill="#dbeafe" stroke="#cbd5e1"/><text x="203" y="181" font-size="23" fill="#172b3a" text-anchor="middle">怎么</text><rect x="264" y="146" width="106" height="54" rx="6" fill="#dbeafe" stroke="#cbd5e1"/><text x="317" y="181" font-size="23" fill="#172b3a" text-anchor="middle">申请</text><rect x="378" y="146" width="106" height="54" rx="6" fill="#dbeafe" stroke="#cbd5e1"/><text x="431" y="181" font-size="23" fill="#172b3a" text-anchor="middle">？</text><path d="M142 218 H466" fill="none" stroke="#475569" stroke-width="2"  marker-end="url(#arrow)"/><text x="520" y="180" font-size="26" fill="#172b3a" text-anchor="start">同一轮处理多个已知位置</text><text x="520" y="221" font-size="21" fill="#475569" text-anchor="start">因果遮罩仍限制各位置可见范围</text><path d="M36 265 H1084" fill="none" stroke="#cbd5e1" stroke-width="2"  /><text x="36" y="309" font-size="25" fill="#172b3a" text-anchor="start">Decode：下一个词块还未知</text><rect x="36" y="342" width="106" height="54" rx="6" fill="#d1fae5" stroke="#cbd5e1"/><text x="89" y="377" font-size="23" fill="#172b3a" text-anchor="middle">先</text><path d="M142 369 H217" fill="none" stroke="#475569" stroke-width="2"  marker-end="url(#arrow)"/><rect x="220" y="342" width="106" height="54" rx="6" fill="#d1fae5" stroke="#cbd5e1"/><text x="273" y="377" font-size="23" fill="#172b3a" text-anchor="middle">提交</text><path d="M326 369 H401" fill="none" stroke="#475569" stroke-width="2"  marker-end="url(#arrow)"/><rect x="404" y="342" width="106" height="54" rx="6" fill="#d1fae5" stroke="#cbd5e1"/><text x="457" y="377" font-size="23" fill="#172b3a" text-anchor="middle">申请</text><path d="M510 369 H585" fill="none" stroke="#475569" stroke-width="2"  marker-end="url(#arrow)"/><text x="625" y="365" font-size="25" fill="#172b3a" text-anchor="start">先有前一步，才能继续下一步</text><text x="36" y="445" font-size="21" fill="#475569" text-anchor="start">示意词块不是实际 tokenizer 的分词结果；两阶段都执行模型前向计算。</text></g></svg>
