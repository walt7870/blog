<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="420" viewBox="0 0 1120 420" role="img" aria-labelledby="title desc"><title id="title">训练积累方法，推理使用方法</title><desc id="desc">训练由样本、损失和优化更新参数；常规推理用已固定参数处理当前输入，不自动更新权重。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L7 4 L0 8 Z" fill="#475569"/></marker></defs><rect width="1120" height="420" fill="#f8fafc"/><g font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif"><text x="36" y="48" font-size="29" fill="#172b3a" text-anchor="start">训练积累方法，推理使用方法</text><text x="36" y="114" font-size="28" fill="#172b3a" text-anchor="start">训练</text><rect x="160" y="82" width="128" height="54" rx="6" fill="#dbeafe" stroke="#cbd5e1"/><text x="224" y="117" font-size="23" fill="#172b3a" text-anchor="middle">样本</text><rect x="296" y="82" width="128" height="54" rx="6" fill="#dbeafe" stroke="#cbd5e1"/><text x="360" y="117" font-size="23" fill="#172b3a" text-anchor="middle">预测</text><rect x="432" y="82" width="128" height="54" rx="6" fill="#dbeafe" stroke="#cbd5e1"/><text x="496" y="117" font-size="23" fill="#172b3a" text-anchor="middle">损失</text><path d="M288 109 H296" fill="none" stroke="#475569" stroke-width="2"  marker-end="url(#arrow)"/><path d="M424 109 H432" fill="none" stroke="#475569" stroke-width="2"  marker-end="url(#arrow)"/><rect x="695" y="82" width="389" height="89" rx="6" fill="#ffe4e6" stroke="#cbd5e1"/><text x="889" y="120" font-size="25" fill="#172b3a" text-anchor="middle">优化器更新参数</text><text x="889" y="151" font-size="20" fill="#475569" text-anchor="middle">方法本身改变</text><path d="M568 109 H695" fill="none" stroke="#475569" stroke-width="2"  marker-end="url(#arrow)"/><text x="36" y="271" font-size="28" fill="#172b3a" text-anchor="start">推理</text><rect x="160" y="237" width="220" height="54" rx="6" fill="#dbeafe" stroke="#cbd5e1"/><text x="270" y="272" font-size="23" fill="#172b3a" text-anchor="middle">当前输入</text><rect x="388" y="237" width="220" height="54" rx="6" fill="#d1fae5" stroke="#cbd5e1"/><text x="498" y="272" font-size="23" fill="#172b3a" text-anchor="middle">固定权重</text><rect x="616" y="237" width="220" height="54" rx="6" fill="#fff" stroke="#cbd5e1"/><text x="726" y="272" font-size="23" fill="#172b3a" text-anchor="middle">输出</text><path d="M380 264 H388" fill="none" stroke="#475569" stroke-width="2"  marker-end="url(#arrow)"/><path d="M608 264 H616" fill="none" stroke="#475569" stroke-width="2"  marker-end="url(#arrow)"/><text x="36" y="366" font-size="23" fill="#475569" text-anchor="start">把制度放进上下文，是提供这次参考材料；不等于重新训练模型。</text></g></svg>
