<svg xmlns="http://www.w3.org/2000/svg" width="480" height="448" viewBox="0 0 480 448" role="img" aria-labelledby="title desc"><title id="title">先读输入，再逐步续写</title><desc id="desc">与桌面图相同，已知输入可一轮处理，未知输出有串行依赖。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L7 4 L0 8 Z" fill="#475569"/></marker></defs><rect width="480" height="448" fill="#f8fafc"/><g font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif"><text x="20" y="48" font-size="25" fill="#172b3a" text-anchor="start">先读输入，再逐步续写</text><text x="20" y="104" font-size="23" fill="#172b3a" text-anchor="start">Prefill：输入已经全部给定</text><rect x="20" y="127" width="100" height="54" rx="6" fill="#dbeafe" stroke="#cbd5e1"/><text x="70" y="162" font-size="23" fill="#172b3a" text-anchor="middle">年假</text><rect x="128" y="127" width="100" height="54" rx="6" fill="#dbeafe" stroke="#cbd5e1"/><text x="178" y="162" font-size="23" fill="#172b3a" text-anchor="middle">怎么</text><rect x="236" y="127" width="100" height="54" rx="6" fill="#dbeafe" stroke="#cbd5e1"/><text x="286" y="162" font-size="23" fill="#172b3a" text-anchor="middle">申请</text><rect x="344" y="127" width="100" height="54" rx="6" fill="#dbeafe" stroke="#cbd5e1"/><text x="394" y="162" font-size="23" fill="#172b3a" text-anchor="middle">？</text><text x="20" y="218" font-size="21" fill="#475569" text-anchor="start">同轮处理；仍遵守因果遮罩</text><path d="M20 248 H460" fill="none" stroke="#cbd5e1" stroke-width="2"  /><text x="20" y="289" font-size="23" fill="#172b3a" text-anchor="start">Decode：下一词块仍未知</text><rect x="20" y="315" width="100" height="54" rx="6" fill="#d1fae5" stroke="#cbd5e1"/><text x="70" y="350" font-size="23" fill="#172b3a" text-anchor="middle">先</text><path d="M120 342 H183" fill="none" stroke="#475569" stroke-width="2"  marker-end="url(#arrow)"/><rect x="185" y="315" width="100" height="54" rx="6" fill="#d1fae5" stroke="#cbd5e1"/><text x="235" y="350" font-size="23" fill="#172b3a" text-anchor="middle">提交</text><path d="M285 342 H348" fill="none" stroke="#475569" stroke-width="2"  marker-end="url(#arrow)"/><rect x="350" y="315" width="100" height="54" rx="6" fill="#d1fae5" stroke="#cbd5e1"/><text x="400" y="350" font-size="23" fill="#172b3a" text-anchor="middle">申请</text><text x="20" y="411" font-size="22" fill="#172b3a" text-anchor="start">先有前一步，才能继续下一步。</text><text x="20" y="439" font-size="19" fill="#475569" text-anchor="start">词块仅为教学，不对应真实分词。</text></g></svg>
