<svg xmlns="http://www.w3.org/2000/svg" width="480" height="568" viewBox="0 0 480 568" role="img" aria-labelledby="title desc"><title id="title">从一句问题，逐层深入</title><desc id="desc">与桌面图相同的四阶段学习路线，改用纵向布局。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L7 4 L0 8 Z" fill="#475569"/></marker></defs><rect width="480" height="568" fill="#f8fafc"/><g font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif"><text x="20" y="48" font-size="25" fill="#172b3a" text-anchor="start">从一句问题，逐层深入</text><path d="M43 95 V493" fill="none" stroke="#475569" stroke-width="2"  marker-end="url(#arrow)"/><circle cx="43" cy="112" r="8" fill="#2563eb"/><text x="77" y="100" font-size="25" fill="#172b3a" text-anchor="start">01—02  看见回答</text><text x="77" y="141" font-size="22" fill="#475569" text-anchor="start">应用 → 一次请求</text><circle cx="43" cy="234" r="8" fill="#059669"/><text x="77" y="222" font-size="25" fill="#172b3a" text-anchor="start">03—05  打开工作台</text><text x="77" y="263" font-size="22" fill="#475569" text-anchor="start">显存 → 缓存 → 调度</text><circle cx="43" cy="356" r="8" fill="#b45309"/><text x="77" y="344" font-size="25" fill="#172b3a" text-anchor="start">06—09  走进引擎</text><text x="77" y="385" font-size="22" fill="#475569" text-anchor="start">量化 → 推测 → 两种实现</text><circle cx="43" cy="478" r="8" fill="#be123c"/><text x="77" y="466" font-size="25" fill="#172b3a" text-anchor="start">10—13  回到真实服务</text><text x="77" y="507" font-size="22" fill="#475569" text-anchor="start">多卡 → 语音 → 实测</text><text x="20" y="550" font-size="21" fill="#475569" text-anchor="start">同一个案例，每次打开一层。</text></g></svg>
