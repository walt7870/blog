<svg xmlns="http://www.w3.org/2000/svg" width="480" height="624" viewBox="0 0 480 624" role="img" aria-labelledby="title desc"><title id="title">补空位，穿插长任务</title><desc id="desc">两个工作位示意静态等待与连续补位；下半部分示意长prefill分块后decode可更早推进。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L7 4 L0 8 Z" fill="#475569"/></marker></defs><rect width="480" height="624" fill="#f8fafc"/><g font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif"><text x="20" y="48" font-size="25" fill="#172b3a" text-anchor="start">补空位，穿插长任务</text><text x="20" y="99" font-size="23" fill="#172b3a" text-anchor="start">A 两轮结束，B 继续</text><text x="20" y="151" font-size="21" fill="#172b3a" text-anchor="start">整批换人</text><rect x="160" y="121" width="68" height="44" rx="6" fill="#d1fae5" stroke="#cbd5e1"/><text x="194" y="151" font-size="23" fill="#172b3a" text-anchor="middle">A/B</text><rect x="236" y="121" width="68" height="44" rx="6" fill="#d1fae5" stroke="#cbd5e1"/><text x="270" y="151" font-size="23" fill="#172b3a" text-anchor="middle">A/B</text><rect x="312" y="121" width="68" height="44" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/><text x="346" y="151" font-size="23" fill="#172b3a" text-anchor="middle">空/B</text><rect x="388" y="121" width="68" height="44" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/><text x="422" y="151" font-size="23" fill="#172b3a" text-anchor="middle">空/B</text><text x="20" y="216" font-size="21" fill="#172b3a" text-anchor="start">每轮补位</text><rect x="160" y="186" width="68" height="44" rx="6" fill="#d1fae5" stroke="#cbd5e1"/><text x="194" y="216" font-size="23" fill="#172b3a" text-anchor="middle">A/B</text><rect x="236" y="186" width="68" height="44" rx="6" fill="#d1fae5" stroke="#cbd5e1"/><text x="270" y="216" font-size="23" fill="#172b3a" text-anchor="middle">A/B</text><rect x="312" y="186" width="68" height="44" rx="6" fill="#d1fae5" stroke="#cbd5e1"/><text x="346" y="216" font-size="23" fill="#172b3a" text-anchor="middle">C/B