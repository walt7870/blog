<svg xmlns="http://www.w3.org/2000/svg" width="480" height="615" viewBox="0 0 480 615" role="img" aria-labelledby="title desc"><title id="title">一句提问，怎样得到回答</title><desc id="desc">问题和检索制度一起进入模型服务，结果回到应用展示；制度是虚构教学例子。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L7 4 L0 8 Z" fill="#475569"/></marker></defs><rect width="480" height="615" fill="#f8fafc"/><g font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif"><text x="20" y="48" font-size="25" fill="#172b3a" text-anchor="start">一句提问，怎样得到回答</text><rect x="20" y="81" width="440" height="77" rx="6" fill="#dbeafe" stroke="#cbd5e1"/><text x="40" y="114" font-size="20" fill="#172b3a" text-anchor="start">小林的问题</text><text x="40" y="145" font-size="25" fill="#172b3a" text-anchor="start">年假怎么申请？</text><rect x="20" y="183" width="440" height="86" rx="6" fill="#fff" stroke="#cbd5e1"/><text x="40" y="214" font-size="21" fill="#172b3a" text-anchor="start">应用取到制度片段</text><text x="40" y="248" font-size="24" fill="#172b3a" text-anchor="start">“先提交申请，再审批。”</text><path d="M460 120 H471 V310 H350 V330" fill="none" stroke="#475569" stroke-width="2"  marker-end="url(#arrow)"/><path d="M240 269 V330" fill="none" stroke="#475569" stroke-width="2"  marker-end="url(#arrow)"/><rect x="20" y="331" width="440" height="85" rx="6" fill="#d1fae5" stroke="#cbd5e1"/><text x="240" y="367" font-size="26" fill="#172b3a" text-anchor="middle">模型服务</text><text x="240" y="399" font-size="21" fill="#172b3a" text-anchor="middle">引擎组织执行，模型计算答复</text><path d="M240 416 V450" fill="none" stroke="#475569" stroke-width="2"  marker-end="url(#arrow)"/><rect x="20" y="451" width="440" height="81" rx="6" fill="#fff" stroke="#cbd5e1"/><text x="40" y="484" font-size="24" fill="#172b3a" text-anchor="start">回复：先提交申请，</text><text x="40" y="517" font-size="24" fill="#172b3a" text-anchor="start">然后等待审批。</text><text x="20" y="568" font-size="20" fill="#475569" text-anchor="start">制度为教学示例；生成答复</text><text x="20" y="596" font-size="20" fill="#475569" text-anchor="start">不等于真正提交业务申请。</text></g></svg>
