<svg xmlns="http://www.w3.org/2000/svg" width="480" height="520" viewBox="0 0 480 520" role="img" aria-labelledby="title desc"><title id="title">保留便笺，仍要查询便笺</title><desc id="desc">当前新位置的Q查询历史K/V，自己的K/V追加缓存，历史位置不必重复建立。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L7 4 L0 8 Z" fill="#475569"/></marker></defs><rect width="480" height="520" fill="#f8fafc"/><g font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif"><text x="20" y="48" font-size="25" fill="#172b3a" text-anchor="start">保留便笺，仍要查询便笺</text><rect x="20" y="86" width="440" height="90" rx="6" fill="#dbeafe" stroke="#cbd5e1"/><text x="240" y="122" font-size="25" fill="#172b3a" text-anchor="middle">新位置产生 Q、K、V</text><text x="240" y="155" font-size="21" fill="#172b3a" text-anchor="middle">Q 查询历史；K/V 留给后续</text><path d="M125 176 V258" fill="none" stroke="#475569" stroke-width="2"  marker-end="url(#arrow)"/><path d="M440 176 V220 H471 V389 H418" fill="none" stroke="#475569" stroke-width="2"  marker-end="url(#arrow)"/><text x="25" y="222" font-size="22" fill="#475569" text-anchor="start">查询</text><text x="369" y="222" font-size="22" fill="#475569" text-anchor="start">追加</text><rect x="20" y="260" width="140" height="54" rx="6" fill="#d1fae5" stroke="#cbd5e1"/><text x="90" y="295" font-size="23" fill="#172b3a" text-anchor="middle">旧 K/V</text><rect x="168" y="260" width="140" height="54" rx="6" fill="#d1fae5" stroke="#cbd5e1"/><text x="238" y="295" font-size="23" fill="#172b3a" text-anchor="middle">旧 K/V</text><rect x="316" y="260" width="140" height="54" rx="6" fill="#d1fae5" stroke="#cbd5e1"/><text x="386" y="295" font-size="23" fill="#172b3a" text-anchor="middle">旧 K/V</text><rect x="278" y="362" width="140" height="54" rx="6" fill="#dbeafe" stroke="#cbd5e1"/><text x="348" y="397" font-size="23" fill="#172b3a" text-anchor="middle">新 K/V</text><path d="M277 389 H125 V314" fill="none" stroke="#475569" stroke-width="2"  marker-end="url(#arrow)"/><text x="20" y="455" font-size="23" fill="#172b3a" text-anchor="start">旧状态不必重新建立。</text><text x="20" y="489" font-size="21" fill="#475569" text-anchor="start">新位置仍要计算 attention，</text><text x="20" y="516" font-size="21" fill="#475569" text-anchor="start">包括对历史及当前位置的查询。</text></g></svg>
