<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="460" viewBox="0 0 1120 460" role="img" aria-labelledby="title desc"><title id="title">从一句问题，逐步走进推理系统</title><desc id="desc">四层学习路径：用户体验、资源与调度、机制与引擎、多卡语音和测量。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L7 4 L0 8 Z" fill="#475569"/></marker></defs><rect width="1120" height="460" fill="#f8fafc"/><g font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif"><text x="36" y="48" font-size="29" fill="#172b3a" text-anchor="start">从一句问题，逐步走进推理系统</text><path d="M76 125 H1040" fill="none" stroke="#475569" stroke-width="2"  marker-end="url(#arrow)"/><circle cx="110" cy="125" r="12" fill="#2563eb"/><text x="110" y="100" font-size="21" fill="#475569" text-anchor="middle">01—02</text><circle cx="395" cy="125" r="12" fill="#059669"/><text x="395" y="100" font-size="21" fill="#475569" text-anchor="middle">03—05</text><circle cx="680" cy="125" r="12" fill="#b45309"/><text x="680" y="100" font-size="21" fill="#475569" text-anchor="middle">06—09</text><circle cx="965" cy="125" r="12" fill="#be123c"/><text x="965" y="100" font-size="21" fill="#475569" text-anchor="middle">10—13</text><text x="36" y="193" font-size="27" fill="#172b3a" text-anchor="start">看见回答</text><text x="36" y="238" font-size="21" fill="#172b3a" text-anchor="start">问 → 等 → 逐步显示</text><text x="36" y="278" font-size="19" fill="#475569" text-anchor="start">应用、模型、一次请求</text><rect x="36" y="310" width="240" height="7" rx="0" fill="#dbeafe" stroke="none"/><text x="313" y="193" font-size="27" fill="#172b3a" text-anchor="start">打开工作台</text><text x="313" y="238" font-size="21" fill="#172b3a" text-anchor="start">长文档 → 多人排队</text><text x="313" y="278" font-size="19" fill="#475569" text-anchor="start">显存、缓存、调度</text><rect x="313" y="310" width="240" height="7" rx="0" fill="#d1fae5" stroke="none"/><text x="590" y="193" font-size="27" fill="#172b3a" text-anchor="start">走进引擎</text><text x="590" y="238" font-size="21" fill="#172b3a" text-anchor="start">少搬 → 少算 → 少等</text><text x="590" y="278" font-size="19" fill="#475569" text-anchor="start">量化、推测、两种实现</text><rect x="590" y="310" width="240" height="7" rx="0" fill="#fef3c7" stroke="none"/><text x="867" y="193" font-size="27" fill="#172b3a" text-anchor="start">回到真实服务</text><text x="867" y="238" font-size="21" fill="#172b3a" text-anchor="start">多卡 → 语音 → 实测</text><text x="867" y="278" font-size="19" fill="#475569" text-anchor="start">扩展、选型、验证</text><rect x="867" y="310" width="240" height="7" rx="0" fill="#ffe4e6" stroke="none"/><text x="36" y="392" font-size="23" fill="#172b3a" text-anchor="start">贯穿案例：小林问“年假怎么申请？”——每次只打开一层。</text></g></svg>
