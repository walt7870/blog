<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="480" viewBox="0 0 1120 480" role="img" aria-labelledby="title desc"><title id="title">相同 token 前缀，走同一段树枝</title><desc id="desc">A和B共享a b c d，C只与它们共享a b；分叉后不同部分不共享。树节点索引实际KV池，不是语义相似检索。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L7 4 L0 8 Z" fill="#475569"/></marker></defs><rect width="1120" height="480" fill="#f8fafc"/><g font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif"><text x="36" y="48" font-size="29" fill="#172b3a" text-anchor="start">相同 token 前缀，走同一段树枝</text><path d="M230 239 H306 V155 H385" fill="none" stroke="#475569" stroke-width="2"  marker-end="url(#arrow)"/><path d="M230 262 H306 V363 H727" fill="none" stroke="#475569" stroke-width="2"  marker-end="url(#arrow)"/><path d="M535 143 H625 V107 H727" fill="none" stroke="#475569" stroke-width="2"  marker-end="url(#arrow)"/><path d="M535 164 H625 V235 H727" fill="none" stroke="#475569" stroke-width="2"  marker-end="url(#arrow)"/><rect x="65" y="220" width="165" height="65" rx="6" fill="#d1fae5" stroke="#cbd5e1"/><text x="147.5" y="260.5" font-size="23" fill="#172b3a" text-anchor="middle">a b</text><rect x="385" y="124" width="150" height="65" rx="6" fill="#d1fae5" stroke="#cbd5e1"/><text x="460" y="164.5" font-size="23" fill="#172b3a" text-anchor="middle">c d</text><rect x="727" y="75" width="150" height="65" rx="6" fill="#dbeafe" stroke="#cbd5e1"/><text x="802" y="115.5" font-size="23" fill="#172b3a" text-anchor="middle">e f</text><rect x="727" y="204" width="150" height="65" rx="6" fill="#dbeafe" stroke="#cbd5e1"/><text x="802" y="244.5" font-size="23" fill="#172b3a" text-anchor="middle">x y</text><rect x="727" y="331" width="150" height="65" rx="6" fill="#fef3c7" stroke="#cbd5e1"/><text x="802" y="371.5" font-size="23" fill="#172b3a" text-anchor="middle">m n</text><text x="929" y="116" font-size="28" fill="#172b3a" text-anchor="start">A</text><text x="929" y="246" font-size="28" fill="#172b3a" text-anchor="start">B</text><text x="929" y="374" font-size="28" fill="#172b3a" text-anchor="start">C</text><text x="67" y="328" font-size="21" fill="#475569" text-anchor="start">三条请求共用</text><text x="386" y="232" font-size="21" fill="#475569" text-anchor="start">A / B 继续共用</text><text x="36" y="446" font-size="22" fill="#475569" text-anchor="start">树记录匹配与引用；KV 张量存放在状态池。相似意思不能代替相同 token 前缀。</text></g></svg>
