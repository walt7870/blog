<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="640" viewBox="0 0 1120 640" role="img" aria-labelledby="title desc"><title id="title">逻辑页通过块表访问物理 KV</title><desc id="desc">请求A的三页映射到7、2、19，请求B共享物理页7并拥有页11。最后一页有未用位置，共享页不能在仍有引用时回收。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 Z" fill="#64748b"/></marker><marker id="control" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 Z" fill="#e88191"/></marker></defs><rect width="1120" height="640" fill="#f8fafc"/><g font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif"><text x="32" y="45" font-size="27" fill="#172b3a" text-anchor="start">逻辑页通过块表访问物理 KV</text><g><rect x="32" y="104" width="290" height="132" rx="6" fill="#eff6ff" stroke="#60a5fa"/><text x="50" y="136" font-size="21" fill="#172b3a" text-anchor="start">请求 A：10 token</text><text x="50" y="166" font-size="17" fill="#475569" text-anchor="start">逻辑页 0：a b c d</text><text x="50" y="192" font-size="17" fill="#475569" text-anchor="start">逻辑页 1：e f g h</text><text x="50" y="218" font-size="17" fill="#475569" text-anchor="start">逻辑页 2：i j · ·</text></g><g><rect x="32" y="328" width="290" height="106" rx="6" fill="#ecfdf5" stroke="#14b8a6"/><text x="50" y="360" font-size="21" fill="#172b3a" text-anchor="start">请求 B：8 token</text><text x="50" y="390" font-size="17" fill="#475569" text-anchor="start">逻辑页 0：a b c d</text><text x="50" y="416" font-size="17" fill="#475569" text-anchor="start">逻辑页 1：x y z w</text></g><g><rect x="438" y="104" width="240" height="132" rx="6" fill="#fff" stroke="#cbd5e1"/><text x="456" y="136" font-size="21" fill="#172b3a" text-anchor="start">A 的块表</text><text x="456" y="166" font-size="17" fill="#475569" text-anchor="start">页 0 → 7</text><text x="456" y="192" font-size="17" fill="#475569" text-anchor="start">页 1 → 2</text><text x="456" y="218" font-size="17" fill="#475569" text-anchor="start">页 2 → 19</text></g><g><rect x="438" y="328" width="240" height="106" rx="6" fill="#fff" stroke="#cbd5e1"/><text x="456" y="360" font-size="21" fill="#172b3a" text-anchor="start">B 的块表</text><text x="456" y="390" font-size="17" fill="#475569" text-anchor="start">页 0 → 7（共享）</text><text x="456" y="416" font-size="17" fill="#475569" text-anchor="start">页 1 → 11</text></g><path d="M322 170 H438" fill="none" stroke="#64748b" stroke-width="2"   marker-end="url(#arrow)"/><text x="380" y="158" font-size="17" fill="#64748b" text-anchor="middle">映射</text><path d="M322 381 H438" fill="none" stroke="#64748b" stroke-width="2"   marker-end="url(#arrow)"/><text x="380" y="368" font-size="17" fill="#64748b" text-anchor="middle">映射</text><g><rect x="810" y="104" width="278" height="80" rx="6" fill="#ecfdf5" stroke="#14b8a6"/><text x="828" y="136" font-size="21" fill="#172b3a" text-anchor="start">物理页 7 · 引用 2</text><text x="828" y="166" font-size="17" fill="#475569" text-anchor="start">a b c d</text></g><g><rect x="810" y="212" width="278" height="80" rx="6" fill="#eff6ff" stroke="#60a5fa"/><text x="828" y="244" font-size="21" fill="#172b3a" text-anchor="start">物理页 2</text><text x="828" y="274" font-size="17" fill="#475569" text-anchor="start">e f g h</text></g><g><rect x="810" y="320" width="278" height="80" rx="6" fill="#eff6ff" stroke="#60a5fa"/><text x="828" y="352" font-size="21" fill="#172b3a" text-anchor="start">物理页 19</text><text x="828" y="382" font-size="17" fill="#475569" text-anchor="start">i j · ·（内部空位）</text></g><g><rect x="810" y="428" width="278" height="80" rx="6" fill="#ecfdf5" stroke="#14b8a6"/><text x="828" y="460" font-size="21" fill="#172b3a" text-anchor="start">物理页 11</text><text x="828" y="490" font-size="17" fill="#475569" text-anchor="start">x y z w</text></g><path d="M678 142 H810" fill="none" stroke="#64748b" stroke-width="2"   marker-end="url(#arrow)"/><path d="M678 174 H744 V252 H810" fill="none" stroke="#64748b" stroke-width="2"   marker-end="url(#arrow)"/><path d="M678 207 H723 V360 H810" fill="none" stroke="#64748b" stroke-width="2"   marker-end="url(#arrow)"/><path d="M678 380 H779 V162 H810" fill="none" stroke="#64748b" stroke-width="2"   marker-end="url(#arrow)"/><path d="M678 406 H760 V468 H810" fill="none" stroke="#64748b" stroke-width="2"   marker-end="url(#arrow)"/><text x="32" y="550" font-size="19" fill="#172b3a" text-anchor="start">块表使逻辑连续；物理页可以分散。两条请求共享页 7，不复制整段前缀。</text><text x="32" y="587" font-size="17" fill="#475569" text-anchor="start">A 结束只减少引用；B 仍使用页 7 时不能回收。分页本身不代表自动卸载到 CPU。</text></g></svg>
