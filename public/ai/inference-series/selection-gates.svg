<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="400" viewBox="0 0 1120 400" role="img" aria-labelledby="title desc"><title id="title">先确认能完成，再确认能运行，最后比较快慢</title><desc id="desc">候选依次经过质量、支持组合、真实负载三道验证，任一道不满足就需要重新选择。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L7 4 L0 8 Z" fill="#475569"/></marker></defs><rect width="1120" height="400" fill="#f8fafc"/><g font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif"><text x="36" y="48" font-size="29" fill="#172b3a" text-anchor="start">先确认能完成，再确认能运行，最后比较快慢</text><rect x="36" y="112" width="310" height="196" rx="6" fill="#dbeafe" stroke="#cbd5e1"/><text x="60" y="154" font-size="28" fill="#172b3a" text-anchor="start">1. 任务质量</text><text x="60" y="214" font-size="23" fill="#172b3a" text-anchor="start">回答是否正确？</text><text x="60" y="261" font-size="19" fill="#475569" text-anchor="start">语音是否完整、自然？</text><rect x="405" y="112" width="310" height="196" rx="6" fill="#d1fae5" stroke="#cbd5e1"/><text x="429" y="154" font-size="28" fill="#172b3a" text-anchor="start">2. 支持组合</text><text x="429" y="214" font-size="23" fill="#172b3a" text-anchor="start">模型 × 设备 × 精度</text><text x="429" y="261" font-size="19" fill="#475569" text-anchor="start">流式、工具、状态能否配合？</text><rect x="774" y="112" width="310" height="196" rx="6" fill="#fef3c7" stroke="#cbd5e1"/><text x="798" y="154" font-size="28" fill="#172b3a" text-anchor="start">3. 真实负载</text><text x="798" y="214" font-size="23" fill="#172b3a" text-anchor="start">同条件测 TTFT / ITL</text><text x="798" y="261" font-size="19" fill="#475569" text-anchor="start">比较有效容量与成本</text><path d="M346 210 H403" fill="none" stroke="#475569" stroke-width="2"  marker-end="url(#arrow)"/><path d="M715 210 H772" fill="none" stroke="#475569" stroke-width="2"  marker-end="url(#arrow)"/><text x="36" y="364" font-size="22" fill="#475569" text-anchor="start">任一道不满足，都要回到候选与配置；最新版本与最高 tokens/s 不能跳过前两道。</text></g></svg>
