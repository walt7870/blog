<svg xmlns="http://www.w3.org/2000/svg" width="480" height="820" viewBox="0 0 480 820" role="img" aria-labelledby="sherpa-runtime-mobile-title sherpa-runtime-mobile-desc">
  <title id="sherpa-runtime-mobile-title">语音框架与计算后端的分工</title>
  <desc id="sherpa-runtime-mobile-desc">音频依次经特征与流管理、ONNX Runtime 模型计算、解码与结果，再交给应用；前面三步由 sherpa-onnx 组织。</desc>
  <defs><marker id="sherpa-runtime-mobile-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#64748b"/></marker></defs>
  <rect width="480" height="820" fill="#f8fafc"/>
  <g font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" fill="#172b3a">
    <text x="24" y="44" font-size="25">从音频到文字，谁处理哪一步？</text>
    <rect x="16" y="76" width="448" height="472" rx="6" fill="#eff6ff" stroke="#60a5fa"/>
    <text x="32" y="112" font-size="22">sherpa-onnx 组织语音流程</text>
    <g fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#sherpa-runtime-mobile-arrow)"><path d="M240 248 V280"/><path d="M240 388 V420"/><path d="M240 528 V580"/></g>
    <g><rect x="40" y="140" width="400" height="108" rx="6" fill="#fff" stroke="#cbd5e1"/><text x="60" y="172" font-size="23">特征与流管理</text><text x="60" y="202" font-size="20" fill="#475569">输入音频采样</text><text x="60" y="230" font-size="20" fill="#475569">准备特征与所需状态</text></g>
    <g><rect x="40" y="280" width="400" height="108" rx="6" fill="#ecfdf5" stroke="#14b8a6"/><text x="60" y="312" font-size="23">ONNX Runtime</text><text x="60" y="342" font-size="20" fill="#475569">执行已适配模型的计算</text><text x="60" y="370" font-size="20" fill="#475569">返回分数或中间表示</text></g>
    <g><rect x="40" y="420" width="400" height="108" rx="6" fill="#fff" stroke="#cbd5e1"/><text x="60" y="452" font-size="23">解码与结果</text><text x="60" y="482" font-size="20" fill="#475569">解释模型输出与配套词表</text><text x="60" y="510" font-size="20" fill="#475569">得到识别文字</text></g>
    <g><rect x="40" y="580" width="400" height="108" rx="6" fill="#fff" stroke="#cbd5e1"/><text x="60" y="612" font-size="23">应用接力</text><text x="60" y="642" font-size="20" fill="#475569">接收“年假怎么申请？”</text><text x="60" y="670" font-size="20" fill="#475569">权限、检索、调用语言模型</text></g>
    <text x="24" y="732" font-size="20">ONNX 是格式；Runtime 执行模型计算。</text>
    <text x="24" y="764" font-size="18" fill="#475569">常见路线示意；实际步骤依模型架构而定。</text>
    <text x="24" y="792" font-size="18" fill="#475569">部分设备使用专门后端。</text>
  </g>
</svg>
