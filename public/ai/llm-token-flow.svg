<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="540" viewBox="0 0 1120 540" role="img" aria-labelledby="llm-token-flow-title llm-token-flow-desc"><title id="llm-token-flow-title">下一个 Token 来自条件分布，解码策略决定如何选择</title><desc id="llm-token-flow-desc">以自回归文本模型为例；候选甲乙丙是教学符号，不对应真实分词或答案正确率。</desc><defs><marker id="llm-token-flow-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker><style>text{font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#172b3a}.head{font-size:27px;font-weight:700}.node{font-size:20px;font-weight:700}.body{font-size:17px;fill:#475569}.box{fill:white;stroke:#cbd5e1;stroke-width:2}.blue{fill:#eff6ff;stroke:#60a5fa;stroke-width:2}.green{fill:#ecfdf5;stroke:#14b8a6;stroke-width:2}.red{fill:#fff1f2;stroke:#e88191;stroke-width:2}.line{fill:none;stroke:#64748b;stroke-width:2}.dash{stroke-dasharray:6 5}</style></defs><rect width="1120" height="540" fill="#f8fafc"/><text x="40" y="48" class="head" text-anchor="start">下一个 Token 来自条件分布，解码策略决定如何选择</text><text x="40" y="80" class="body" text-anchor="start">以自回归文本模型为例；候选甲乙丙是教学符号，不对应真实分词或答案正确率。</text><path d="M245 190H295" class="line" marker-end="url(#llm-token-flow-arrow)"/><path d="M490 190H540" class="line" marker-end="url(#llm-token-flow-arrow)"/><path d="M780 190H830" class="line" marker-end="url(#llm-token-flow-arrow)"/><path d="M950 250V322Q950 330 942 330H403Q395 330 395 322V250" class="line dash" marker-end="url(#llm-token-flow-arrow)"/><rect x="40" y="135" width="205" height="115" rx="6" class="box"/><text x="56" y="167" class="node" text-anchor="start">输入上下文</text><text x="56" y="197" class="body" text-anchor="start">规则 / 历史 / 证据</text><text x="56" y="222" class="body" text-anchor="start">按模型模板编码</text><rect x="295" y="135" width="195" height="115" rx="6" class="box"/><text x="311" y="167" class="node" text-anchor="start">Token 序列</text><text x="311" y="197" class="body" text-anchor="start">Token 嵌入与位置</text><text x="311" y="222" class="body" text-anchor="start">已有序列为条件</text><rect x="540" y="135" width="240" height="115" rx="6" class="blue"/><text x="556" y="167" class="node" text-anchor="start">模型前向计算</text><text x="556" y="197" class="body" text-anchor="start">注意力与前馈网络</text><text x="556" y="222" class="body" text-anchor="start">输出候选 Token 分布</text><rect x="830" y="135" width="250" height="115" rx="6" class="green"/><text x="846" y="167" class="node" text-anchor="start">解码与停止</text><text x="846" y="197" class="body" text-anchor="start">贪心或采样选下一个</text><text x="846" y="222" class="body" text-anchor="start">追加后继续，或终止</text><text x="40" y="385" class="node" text-anchor="start">教学分布：甲 0.6，乙 0.3，丙 0.1。</text><text x="40" y="425" class="body" text-anchor="start">贪心选甲；采样可能选乙或丙。高概率只表示模型倾向，不证明事实正确。</text><text x="40" y="475" class="body" text-anchor="start">历史 KV 可按运行时缓存复用；模型仍计算新位置，不是每次从原始字符串完整重跑。</text></svg>
