<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="515" viewBox="0 0 1120 515" role="img" aria-labelledby="time-series-backtest-title time-series-backtest-desc"><title id="time-series-backtest-title">每个回测时点，只能使用当时已经可用的数据</title><desc id="time-series-backtest-desc">示例采用扩展训练窗口；每格一周，预测窗口一周，验证选型后另留最终测试。</desc><defs><marker id="time-series-backtest-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker><style>text{font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#172b3a}.head{font-size:28px;font-weight:700}.node{font-size:20px;font-weight:700}.body{font-size:17px;fill:#475569}.box{fill:white;stroke:#cbd5e1;stroke-width:2}.blue{fill:#eff6ff;stroke:#60a5fa;stroke-width:2}.green{fill:#ecfdf5;stroke:#14b8a6;stroke-width:2}.red{fill:#fff1f2;stroke:#e88191;stroke-width:2}.pad{fill:#e2e8f0;stroke:#94a3b8}.line{fill:none;stroke:#64748b;stroke-width:2}.dash{stroke-dasharray:6 5}</style></defs><rect width="1120" height="515" fill="#f8fafc"/><text x="40" y="48" class="head" text-anchor="start">每个回测时点，只能使用当时已经可用的数据</text><text x="40" y="80" class="body" text-anchor="start">示例采用扩展训练窗口；每格一周，预测窗口一周，验证选型后另留最终测试。</text><text x="270" y="135" class="node" text-anchor="middle">第 1 周</text><text x="400" y="135" class="node" text-anchor="middle">第 2 周</text><text x="530" y="135" class="node" text-anchor="middle">第 3 周</text><text x="660" y="135" class="node" text-anchor="middle">第 4 周</text><text x="790" y="135" class="node" text-anchor="middle">第 5 周</text><text x="920" y="135" class="node" text-anchor="middle">第 6 周</text><text x="40" y="205" class="node" text-anchor="start">回测时点 1</text><rect x="210" y="170" width="380" height="60" class="blue" rx="6"/><rect x="600" y="170" width="120" height="60" class="green" rx="6"/><text x="225" y="207" class="body" text-anchor="start">训练：只拟合可见历史</text><text x="660" y="207" class="node" text-anchor="middle">预测</text><text x="40" y="300" class="node" text-anchor="start">回测时点 2</text><rect x="210" y="265" width="510" height="60" class="blue" rx="6"/><rect x="730" y="265" width="120" height="60" class="green" rx="6"/><text x="225" y="302" class="body" text-anchor="start">训练：只拟合可见历史</text><text x="790" y="302" class="node" text-anchor="middle">预测</text><text x="40" y="395" class="node" text-anchor="start">回测时点 3</text><rect x="210" y="360" width="640" height="60" class="blue" rx="6"/><rect x="860" y="360" width="120" height="60" class="green" rx="6"/><text x="225" y="397" class="body" text-anchor="start">训练：只拟合可见历史</text><text x="920" y="397" class="node" text-anchor="middle">预测</text><text x="40" y="485" class="body" text-anchor="start">注意：图中输入均假定已到达；标签窗口重叠、补录和外生变量可见性仍需单独检查。</text></svg>
