<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="530" viewBox="0 0 1200 530" role="img" aria-labelledby="rsi-feedback-title rsi-feedback-desc">
  <title id="rsi-feedback-title">文件工具的两轮递归回流</title>
  <desc id="rsi-feedback-desc">第一轮增加错误诊断，得到 V1；第二轮增加预览时使用 V1 的诊断定位错误。图示为教学机制，不是实验复现。</desc>
  <defs><marker id="rsi-feedback-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#206c53"/></marker></defs>
  <rect width="1200" height="530" fill="#f4f6f5"/>
  <g font-family="sans-serif" fill="#18241f">
    <text x="40" y="49" font-size="28" font-weight="700">上轮改进参与下轮改进</text>
    <text x="40" y="83" font-size="18" fill="#52635a">机制示意；不代表已复现实验或测得持续收益</text>
    <text x="40" y="144" font-size="23" font-weight="700">第一轮</text>
    <text x="40" y="327" font-size="23" font-weight="700">第二轮</text>
    <g stroke-width="2">
      <rect x="170" y="111" width="280" height="112" rx="6" fill="#fff" stroke="#345f9a"/>
      <rect x="525" y="111" width="280" height="112" rx="6" fill="#e5f0f2" stroke="#246b78"/>
      <rect x="880" y="111" width="280" height="112" rx="6" fill="#e6f1ea" stroke="#206c53"/>
      <rect x="170" y="294" width="280" height="112" rx="6" fill="#fff" stroke="#345f9a"/>
      <rect x="525" y="294" width="280" height="112" rx="6" fill="#e6f1ea" stroke="#206c53"/>
      <rect x="880" y="294" width="280" height="112" rx="6" fill="#e5f0f2" stroke="#246b78"/>
    </g>
    <g font-size="22" font-weight="700"><text x="190" y="151">V0：只有“失败”</text><text x="545" y="151">候选：增加诊断</text><text x="900" y="151">V1：留下诊断能力</text><text x="190" y="334">候选：增加改动预览</text><text x="545" y="334">使用 V1 的反馈</text><text x="900" y="334">修正并检查候选</text></g>
    <g font-size="19"><text x="190" y="192">不知道编辑失败的原因</text><text x="545" y="192">检查错误分类与旧功能</text><text x="900" y="192">明确报告匹配不唯一</text><text x="190" y="375">修改时遇到多处匹配</text><text x="545" y="375">缩小需要修改的范围</text><text x="900" y="375">验收预览及旧功能</text></g>
    <text x="765" y="269" font-size="19" fill="#206c53">第一轮产物进入第二轮过程</text>
    <text x="170" y="464" font-size="20">回流路径证明能力被使用；新任务、同预算对照用于检查收益。</text>
    <text x="170" y="499" font-size="19" fill="#52635a">模型权重可保持不变；一次成功不证明无限增长。</text>
  </g>
  <g fill="none" stroke="#206c53" stroke-width="3" marker-end="url(#rsi-feedback-arrow)"><path d="M450 167H519"/><path d="M805 167H874"/><path d="M450 350H519"/><path d="M805 350H874"/><path d="M1020 223V232Q1020 240 1012 240H673Q665 240 665 248V288"/></g>
</svg>
