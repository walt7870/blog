<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="740" viewBox="0 0 960 740" role="img" aria-labelledby="edge-pipeline-title edge-pipeline-desc" id="edge-pipeline-root">
<title id="edge-pipeline-title">端侧部署链路</title>
<desc id="edge-pipeline-desc">训练好的模型经过导出、量化与转换、后端编译或委托，得到 .pte、.gguf、.onnx、.mlpackage 等模型文件，由设备上的运行时加载，再调用 CPU、GPU 或 NPU 后端执行；NPU 不支持的算子回退到 CPU。图中区分模型格式、运行时和后端三个层次。</desc>
<defs><style>
#edge-pipeline-root text { font-family: Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #172b3a; }
#edge-pipeline-root .h { font-size: 26px; font-weight: 700; }
#edge-pipeline-root .t { font-size: 19px; font-weight: 600; }
#edge-pipeline-root .s { font-size: 15px; fill: #475569; }
#edge-pipeline-root .xs { font-size: 13px; fill: #64748b; }
#edge-pipeline-root .k { font-size: 13px; font-weight: 700; letter-spacing: .04em; fill: #64748b; }
#edge-pipeline-root .m { font-family: 'SFMono-Regular', Menlo, Consolas, monospace; font-size: 14px; fill: #172b3a; }
#edge-pipeline-root .node { fill: #fff; stroke: #cbd5e1; stroke-width: 2; }
#edge-pipeline-root .blue { fill: #eff6ff; stroke: #60a5fa; stroke-width: 2; }
#edge-pipeline-root .green { fill: #ecfdf5; stroke: #20a28c; stroke-width: 2; }
#edge-pipeline-root .red { fill: #fff1f2; stroke: #e88191; stroke-width: 2; }
#edge-pipeline-root .amber { fill: #fffbeb; stroke: #e0a63a; stroke-width: 2; }
#edge-pipeline-root .violet { fill: #f5f3ff; stroke: #9b87f5; stroke-width: 2; }
#edge-pipeline-root .gray { fill: #f1f5f9; stroke: #cbd5e1; stroke-width: 2; }
#edge-pipeline-root .fblue { fill: #93c5fd; } #edge-pipeline-root .fgreen { fill: #6ee7b7; } #edge-pipeline-root .fred { fill: #fda4af; }
#edge-pipeline-root .famber { fill: #fcd34d; } #edge-pipeline-root .fviolet { fill: #c4b5fd; } #edge-pipeline-root .fgray { fill: #e2e8f0; }
#edge-pipeline-root .edge { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#edge-pipeline-arrow); }
#edge-pipeline-root .dash { fill: none; stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 7 6; marker-end: url(#edge-pipeline-arrow); }
#edge-pipeline-root .line { stroke: #cbd5e1; stroke-width: 1.5; fill: none; }
#edge-pipeline-root .axis { stroke: #64748b; stroke-width: 2; fill: none; }
</style><marker id="edge-pipeline-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker></defs>
<rect width="960" height="740" fill="#f8fafc"/>
<text x="32" y="46" class="h">端侧部署：格式、运行时、后端是三个层次</text>
<text x="32" y="78" class="s">“支持 Android”“支持 NPU”“支持这个模型”是三个独立条件，要确认整个组合可用。</text>
<g data-node="train"><rect x="32" y="120" width="196" height="110" rx="8" class="gray"/><text x="50" y="156" class="t">训练好的模型</text><text x="50" y="184" class="s">PyTorch 权重</text><text x="50" y="207" class="s">safetensors</text></g>
<g data-node="export"><rect x="260" y="120" width="196" height="110" rx="8" class="node"/><text x="278" y="156" class="t">导出</text><text x="278" y="184" class="s">torch.export、ONNX</text><text x="278" y="207" class="s">或转换为 GGUF</text></g>
<g data-node="quant"><rect x="488" y="120" width="196" height="110" rx="8" class="node"/><text x="506" y="156" class="t">量化与转换</text><text x="506" y="184" class="s">4 位权重为主</text><text x="506" y="207" class="s">图变换、算子融合</text></g>
<g data-node="lower"><rect x="716" y="120" width="212" height="110" rx="8" class="node"/><text x="734" y="156" class="t">后端编译 / 委托</text><text x="734" y="184" class="s">按目标后端划分</text><text x="734" y="207" class="s">和编译子图</text></g>
<path d="M228 175H260" class="edge"/>
<path d="M456 175H488" class="edge"/>
<path d="M684 175H716" class="edge"/>
<g data-node="fmt"><rect x="32" y="280" width="896" height="108" rx="8" class="blue"/><text x="50" y="306" class="k">层次 1</text><text x="50" y="332" class="t">模型格式（文件）</text><text x="50" y="360" class="s">.pte（ExecuTorch）  .gguf（llama.cpp）  .onnx（ONNX Runtime）  .mlpackage（Core ML）</text></g>
<path d="M822 230V280" class="edge"/>
<g data-node="rt"><rect x="32" y="420" width="896" height="108" rx="8" class="green"/><text x="50" y="446" class="k">层次 2</text><text x="50" y="472" class="t">运行时（设备上的程序）</text><text x="50" y="500" class="s">加载模型、管理内存、调度执行：ExecuTorch、llama.cpp、MLX、MLC-LLM、ONNX Runtime、LiteRT</text></g>
<path d="M480 388V420" class="edge"/>
<g data-node="cpu"><rect x="32" y="580" width="280" height="90" rx="8" class="amber"/><text x="50" y="616" class="t">CPU</text><text x="50" y="644" class="s">兼容性最好，NEON 等向量指令</text></g>
<g data-node="gpu"><rect x="340" y="580" width="280" height="90" rx="8" class="amber"/><text x="358" y="616" class="t">GPU</text><text x="358" y="644" class="s">Metal、Vulkan、OpenCL</text></g>
<g data-node="npu"><rect x="648" y="580" width="280" height="90" rx="8" class="amber"/><text x="666" y="616" class="t">NPU</text><text x="666" y="644" class="s">能效高，算子支持受限</text></g>
<path d="M172 528V580" class="edge"/>
<path d="M480 528V580" class="edge"/>
<path d="M788 528V580" class="edge"/>
<path d="M788 670V700H172V676" class="dash"/>
<rect x="384" y="688" width="226" height="26" rx="4" fill="#f8fafc"/><text x="390" y="706" class="s">不支持的算子回退到 CPU 执行</text>
<text x="820" y="568" class="k">层次 3：后端</text>
</svg>
