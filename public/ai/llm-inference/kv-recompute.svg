<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="kv-recompute-title kv-recompute-desc" id="kv-recompute-root">
<title id="kv-recompute-title">不缓存与缓存 KV 时的计算量对比</title>
<desc id="kv-recompute-desc">输入 500 个 token、生成 200 个 token。不缓存时第 1 步到第 200 步分别处理 500 到 699 个位置，共 119,900 个；缓存后只有 Prefill 处理 500 个位置，之后每步只算 1 个新位置，共 699 个。</desc>
<defs><style>
#kv-recompute-root text { font-family: Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #172b3a; }
#kv-recompute-root .h { font-size: 26px; font-weight: 700; }
#kv-recompute-root .t { font-size: 19px; font-weight: 600; }
#kv-recompute-root .s { font-size: 15px; fill: #475569; }
#kv-recompute-root .xs { font-size: 13px; fill: #64748b; }
#kv-recompute-root .k { font-size: 13px; font-weight: 700; letter-spacing: .04em; fill: #64748b; }
#kv-recompute-root .m { font-family: 'SFMono-Regular', Menlo, Consolas, monospace; font-size: 14px; fill: #172b3a; }
#kv-recompute-root .node { fill: #fff; stroke: #cbd5e1; stroke-width: 2; }
#kv-recompute-root .blue { fill: #eff6ff; stroke: #60a5fa; stroke-width: 2; }
#kv-recompute-root .green { fill: #ecfdf5; stroke: #20a28c; stroke-width: 2; }
#kv-recompute-root .red { fill: #fff1f2; stroke: #e88191; stroke-width: 2; }
#kv-recompute-root .amber { fill: #fffbeb; stroke: #e0a63a; stroke-width: 2; }
#kv-recompute-root .violet { fill: #f5f3ff; stroke: #9b87f5; stroke-width: 2; }
#kv-recompute-root .gray { fill: #f1f5f9; stroke: #cbd5e1; stroke-width: 2; }
#kv-recompute-root .fblue { fill: #93c5fd; } #kv-recompute-root .fgreen { fill: #6ee7b7; } #kv-recompute-root .fred { fill: #fda4af; }
#kv-recompute-root .famber { fill: #fcd34d; } #kv-recompute-root .fviolet { fill: #c4b5fd; } #kv-recompute-root .fgray { fill: #e2e8f0; }
#kv-recompute-root .edge { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#kv-recompute-arrow); }
#kv-recompute-root .dash { fill: none; stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 7 6; marker-end: url(#kv-recompute-arrow); }
#kv-recompute-root .line { stroke: #cbd5e1; stroke-width: 1.5; fill: none; }
#kv-recompute-root .axis { stroke: #64748b; stroke-width: 2; fill: none; }
</style><marker id="kv-recompute-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker></defs>
<rect width="960" height="560" fill="#f8fafc"/>
<text x="32" y="46" class="h">输入 500 个 token，生成 200 个：要算多少个位置？</text>
<text x="32" y="78" class="s">条形长度按实际位置数等比例绘制。蓝色为本步重新计算，灰色为从缓存读取，绿色为新 token。</text>
<g data-node="no"><rect x="32" y="112" width="440" height="356" rx="8" class="node"/><text x="50" y="138" class="k">不缓存：每一步都从头算</text></g>
<g data-node="yes"><rect x="488" y="112" width="440" height="356" rx="8" class="node"/><text x="506" y="138" class="k">缓存 K、V：只算新 token</text></g>
<text x="52" y="218" class="s">第 1 步</text><rect x="132" y="196" width="215" height="32" rx="4" class="fblue"/><text x="355" y="218" class="xs">500</text><text x="52" y="270" class="s">第 2 步</text><rect x="132" y="248" width="215" height="32" rx="4" class="fblue"/><text x="355" y="270" class="xs">501</text><text x="52" y="322" class="s">第 3 步</text><rect x="132" y="300" width="215" height="32" rx="4" class="fblue"/><text x="355" y="322" class="xs">502</text><text x="52" y="374" class="s">…</text><text x="132" y="374" class="s">…</text><text x="52" y="426" class="s">第 200 步</text><rect x="132" y="404" width="300" height="32" rx="4" class="fblue"/><text x="440" y="426" class="xs">699</text>
<text x="508" y="218" class="s">第 1 步</text><rect x="588" y="196" width="215" height="32" rx="4" class="fblue"/><text x="811" y="218" class="xs">500</text><text x="508" y="270" class="s">第 2 步</text><rect x="588" y="248" width="215" height="32" rx="4" class="fgray"/><rect x="803" y="248" width="8" height="32" rx="4" class="fgreen"/><text x="819" y="270" class="xs">1</text><text x="508" y="322" class="s">第 3 步</text><rect x="588" y="300" width="215" height="32" rx="4" class="fgray"/><rect x="803" y="300" width="8" height="32" rx="4" class="fgreen"/><text x="819" y="322" class="xs">1</text><text x="508" y="374" class="s">…</text><text x="588" y="374" class="s">…</text><text x="508" y="426" class="s">第 200 步</text><rect x="588" y="404" width="300" height="32" rx="4" class="fgray"/><rect x="888" y="404" width="8" height="32" rx="4" class="fgreen"/><text x="904" y="426" class="xs">1</text>
<g data-node="no-total"><rect x="32" y="484" width="440" height="56" rx="8" class="red"/><text x="50" y="520" class="t">共 119,900 个位置</text></g>
<g data-node="yes-total"><rect x="488" y="484" width="440" height="56" rx="8" class="green"/><text x="506" y="520" class="t">共 699 个位置，约少 170 倍</text></g>
</svg>
