<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="580" viewBox="0 0 960 580" role="img" aria-labelledby="scheduler-states-title scheduler-states-desc" id="scheduler-states-root">
<title id="scheduler-states-title">请求在调度器中的状态变化</title>
<desc id="scheduler-states-desc">新请求进入等待队列，被调度选中后分配 KV 块进入运行；遇到结束符或长度上限完成并释放块；显存不够时被抢占，释放全部块回到等待队列队首、之后重新 Prefill；用户断开时取消并立刻释放块。</desc>
<defs><style>
#scheduler-states-root text { font-family: Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #172b3a; }
#scheduler-states-root .h { font-size: 26px; font-weight: 700; }
#scheduler-states-root .t { font-size: 19px; font-weight: 600; }
#scheduler-states-root .s { font-size: 15px; fill: #475569; }
#scheduler-states-root .xs { font-size: 13px; fill: #64748b; }
#scheduler-states-root .k { font-size: 13px; font-weight: 700; letter-spacing: .04em; fill: #64748b; }
#scheduler-states-root .m { font-family: 'SFMono-Regular', Menlo, Consolas, monospace; font-size: 14px; fill: #172b3a; }
#scheduler-states-root .node { fill: #fff; stroke: #cbd5e1; stroke-width: 2; }
#scheduler-states-root .blue { fill: #eff6ff; stroke: #60a5fa; stroke-width: 2; }
#scheduler-states-root .green { fill: #ecfdf5; stroke: #20a28c; stroke-width: 2; }
#scheduler-states-root .red { fill: #fff1f2; stroke: #e88191; stroke-width: 2; }
#scheduler-states-root .amber { fill: #fffbeb; stroke: #e0a63a; stroke-width: 2; }
#scheduler-states-root .violet { fill: #f5f3ff; stroke: #9b87f5; stroke-width: 2; }
#scheduler-states-root .gray { fill: #f1f5f9; stroke: #cbd5e1; stroke-width: 2; }
#scheduler-states-root .fblue { fill: #93c5fd; } #scheduler-states-root .fgreen { fill: #6ee7b7; } #scheduler-states-root .fred { fill: #fda4af; }
#scheduler-states-root .famber { fill: #fcd34d; } #scheduler-states-root .fviolet { fill: #c4b5fd; } #scheduler-states-root .fgray { fill: #e2e8f0; }
#scheduler-states-root .edge { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#scheduler-states-arrow); }
#scheduler-states-root .dash { fill: none; stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 7 6; marker-end: url(#scheduler-states-arrow); }
#scheduler-states-root .line { stroke: #cbd5e1; stroke-width: 1.5; fill: none; }
#scheduler-states-root .axis { stroke: #64748b; stroke-width: 2; fill: none; }
</style><marker id="scheduler-states-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker></defs>
<rect width="960" height="580" fill="#f8fafc"/>
<text x="32" y="46" class="h">一个请求的状态，以及每次变化时 KV 块怎样处理</text>
<text x="32" y="78" class="s">抢占采用重算方式：释放全部块，回到等待队列最前面，之后重新 Prefill。</text>
<text x="162" y="142" class="s">新请求</text>
<path d="M152 120V200" class="edge"/>
<g data-node="waiting"><rect x="32" y="200" width="240" height="120" rx="8" class="amber"/><text x="50" y="236" class="t">等待 WAITING</text><text x="50" y="264" class="s">排队，尚未占用 KV</text><text x="50" y="287" class="s">被抢占的请求排在队首</text></g>
<g data-node="running"><rect x="380" y="200" width="240" height="120" rx="8" class="blue"/><text x="398" y="236" class="t">运行 RUNNING</text><text x="398" y="264" class="s">每步推进 1 个 token</text><text x="398" y="287" class="s">当前块写满再申请新块</text></g>
<g data-node="finished"><rect x="700" y="110" width="228" height="120" rx="8" class="green"/><text x="718" y="146" class="t">完成 FINISHED</text><text x="718" y="174" class="s">块引用计数减一</text><text x="718" y="197" class="s">内容保留，可被前缀命中</text></g>
<g data-node="cancelled"><rect x="700" y="340" width="228" height="120" rx="8" class="red"/><text x="718" y="376" class="t">取消</text><text x="718" y="404" class="s">从队列或批中移除</text><text x="718" y="427" class="s">立刻释放 KV 块</text></g>
<path d="M272 250H380" class="edge"/>
<text x="326" y="238" class="s" text-anchor="middle">调度选中</text>
<text x="326" y="278" class="xs" text-anchor="middle">分配 KV 块</text>
<path d="M620 230L700 180" class="edge"/>
<rect x="518" y="164" width="126" height="26" rx="4" fill="#f8fafc"/><text x="524" y="182" class="s">EOS / 长度上限</text>
<path d="M620 290L700 380" class="edge"/>
<rect x="594" y="356" width="36" height="26" rx="4" fill="#f8fafc"/><text x="600" y="374" class="s">取消</text>
<path d="M500 320V404H152V320" class="dash"/>
<rect x="160" y="414" width="470" height="26" rx="4" fill="#f8fafc"/><text x="166" y="432" class="s">块不够：抢占队尾请求，释放全部块，回到队首，之后重新 Prefill</text>
<path d="M92 320V510H814V460" class="dash"/>
<rect x="324" y="482" width="84" height="26" rx="4" fill="#f8fafc"/><text x="330" y="500" class="s">排队时取消</text>
</svg>
