<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="700" viewBox="0 0 960 700" role="img" aria-labelledby="nano-vllm-map-title nano-vllm-map-desc" id="nano-vllm-map-root">
<title id="nano-vllm-map-title">nano-vllm 的结构</title>
<desc id="nano-vllm-map-desc">LLMEngine.step 每一圈调用 Scheduler 选出请求，BlockManager 分配 KV 块与前缀哈希，ModelRunner 准备输入并执行 Qwen3 模型，Attention 层写入分页 KV 并调用 FlashAttention，Sampler 选出 token，再由 postprocess 追加 token、判断结束。张量并行时其他 rank 的 ModelRunner 在子进程中通过共享内存和事件接收调用。</desc>
<defs><style>
#nano-vllm-map-root text { font-family: Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #172b3a; }
#nano-vllm-map-root .h { font-size: 26px; font-weight: 700; }
#nano-vllm-map-root .t { font-size: 19px; font-weight: 600; }
#nano-vllm-map-root .s { font-size: 15px; fill: #475569; }
#nano-vllm-map-root .xs { font-size: 13px; fill: #64748b; }
#nano-vllm-map-root .k { font-size: 13px; font-weight: 700; letter-spacing: .04em; fill: #64748b; }
#nano-vllm-map-root .m { font-family: 'SFMono-Regular', Menlo, Consolas, monospace; font-size: 14px; fill: #172b3a; }
#nano-vllm-map-root .node { fill: #fff; stroke: #cbd5e1; stroke-width: 2; }
#nano-vllm-map-root .blue { fill: #eff6ff; stroke: #60a5fa; stroke-width: 2; }
#nano-vllm-map-root .green { fill: #ecfdf5; stroke: #20a28c; stroke-width: 2; }
#nano-vllm-map-root .red { fill: #fff1f2; stroke: #e88191; stroke-width: 2; }
#nano-vllm-map-root .amber { fill: #fffbeb; stroke: #e0a63a; stroke-width: 2; }
#nano-vllm-map-root .violet { fill: #f5f3ff; stroke: #9b87f5; stroke-width: 2; }
#nano-vllm-map-root .gray { fill: #f1f5f9; stroke: #cbd5e1; stroke-width: 2; }
#nano-vllm-map-root .fblue { fill: #93c5fd; } #nano-vllm-map-root .fgreen { fill: #6ee7b7; } #nano-vllm-map-root .fred { fill: #fda4af; }
#nano-vllm-map-root .famber { fill: #fcd34d; } #nano-vllm-map-root .fviolet { fill: #c4b5fd; } #nano-vllm-map-root .fgray { fill: #e2e8f0; }
#nano-vllm-map-root .edge { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#nano-vllm-map-arrow); }
#nano-vllm-map-root .dash { fill: none; stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 7 6; marker-end: url(#nano-vllm-map-arrow); }
#nano-vllm-map-root .line { stroke: #cbd5e1; stroke-width: 1.5; fill: none; }
#nano-vllm-map-root .axis { stroke: #64748b; stroke-width: 2; fill: none; }
</style><marker id="nano-vllm-map-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker></defs>
<rect width="960" height="700" fill="#f8fafc"/>
<text x="32" y="46" class="h">nano-vllm：一圈 step() 经过的四层</text>
<text x="32" y="78" class="s">调度决定算谁，块管理决定 KV 放哪，执行器准备输入并跑模型，注意力层读写分页 KV。</text>
<g data-node="engine"><rect x="32" y="112" width="896" height="76" rx="8" class="amber"/><text x="50" y="148" class="t">LLMEngine.step()</text><text x="50" y="176" class="s">engine/llm_engine.py · 90 行：schedule → run → postprocess，循环到队列为空</text></g>
<g data-node="sched"><rect x="32" y="228" width="280" height="172" rx="8" class="blue"/><text x="50" y="254" class="k">调度</text><text x="50" y="280" class="t">Scheduler</text><text x="50" y="308" class="s">engine/scheduler.py · 92 行</text><text x="50" y="331" class="s">Prefill 优先、token 预算</text><text x="50" y="354" class="s">只有首个请求可分块</text><text x="50" y="377" class="s">块不够时抢占队尾</text></g>
<g data-node="block"><rect x="32" y="436" width="280" height="172" rx="8" class="blue"/><text x="50" y="462" class="k">KV 块</text><text x="50" y="488" class="t">BlockManager</text><text x="50" y="516" class="s">engine/block_manager.py · 120 行</text><text x="50" y="539" class="s">分配块、引用计数</text><text x="50" y="562" class="s">xxh64 链式哈希命中前缀</text><text x="50" y="585" class="s">块大小默认 256</text></g>
<g data-node="runner"><rect x="340" y="228" width="280" height="172" rx="8" class="green"/><text x="358" y="254" class="k">执行准备</text><text x="358" y="280" class="t">ModelRunner（rank 0）</text><text x="358" y="308" class="s">engine/model_runner.py · 257 行</text><text x="358" y="331" class="s">按显存余量算 KV 块数</text><text x="358" y="354" class="s">slot_mapping、块表</text><text x="358" y="377" class="s">Decode 用 CUDA Graph</text></g>
<g data-node="model"><rect x="340" y="436" width="280" height="172" rx="8" class="green"/><text x="358" y="462" class="k">前向计算</text><text x="358" y="488" class="t">Qwen3 模型层</text><text x="358" y="516" class="s">models/qwen3.py · 216 行</text><text x="358" y="539" class="s">layers/linear.py · 156 行</text><text x="358" y="562" class="s">张量并行线性层</text><text x="358" y="585" class="s">Sampler：只有温度</text></g>
<g data-node="attn"><rect x="648" y="436" width="280" height="172" rx="8" class="violet"/><text x="666" y="462" class="k">注意力</text><text x="666" y="488" class="t">Attention 层</text><text x="666" y="516" class="s">layers/attention.py · 75 行</text><text x="666" y="539" class="s">store_kvcache 写分页 KV</text><text x="666" y="562" class="s">flash_attn_varlen_func</text><text x="666" y="585" class="s">flash_attn_with_kvcache</text></g>
<g data-node="tp"><rect x="648" y="228" width="280" height="172" rx="8" class="gray"/><text x="666" y="254" class="k">其他 GPU</text><text x="666" y="280" class="t">ModelRunner（rank 1…）</text><text x="666" y="308" class="s">张量并行子进程</text><text x="666" y="331" class="s">共享内存 + 事件接收调用</text><text x="666" y="354" class="s">各算一份，all_reduce 汇总</text><text x="666" y="377" class="s">只支持单机，TP ≤ 8</text></g>
<path d="M172 188V228" class="edge"/>
<path d="M172 400V436" class="edge"/>
<path d="M312 300H340" class="edge"/>
<path d="M480 400V436" class="edge"/>
<path d="M620 522H648" class="edge"/>
<path d="M620 300H648" class="dash"/>
<rect x="618" y="268" width="40" height="26" rx="4" fill="#f8fafc"/><text x="624" y="286" class="s">call</text>
<path d="M32 632H928" class="line"/>
<text x="32" y="662" class="s">返回路径：Sampler 选出的 token 回到 Scheduler.postprocess，追加 token、为写满的块算哈希、遇到 EOS 或 max_tokens 就释放块。</text>
<text x="32" y="688" class="xs">行数按提交 bb823b3 用 wc -l 统计，含空行；nanovllm/ 包合计 1385 行。</text>
</svg>
