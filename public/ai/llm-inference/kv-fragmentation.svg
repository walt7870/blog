<rect x="865" y="330" width="30" height="48" rx="4" class="node"/>
<rect x="897" y="330" width="30" height="48" rx="4" class="node"/>
<text x="32" y="404" class="s">10 块在用，分散存放；18 块空闲，任何新请求都能用</text>
<text x="32" y="428" class="s">每个请求只有最后一块没填满（半格），浪费不到一个块</text>
<rect x="32" y="468" width="28" height="24" rx="4" class="fgreen"/>
<text x="68" y="486" class="s">有效 KV</text>
<rect x="180" y="468" width="28" height="24" rx="4" class="famber"/>
<text x="216" y="486" class="s">预留未用</text>
<rect x="340" y="468" width="28" height="24" rx="4" class="fgray"/>
