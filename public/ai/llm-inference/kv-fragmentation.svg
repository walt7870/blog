<rect x="737" y="140" width="30" height="48" rx="4" class="fgreen"/><text x="752" y="169" text-anchor="middle" class="xs">C</text>
<rect x="769" y="140" width="30" height="48" rx="4" class="famber"/>
<rect x="801" y="140" width="30" height="48" rx="4" class="famber"/>
<rect x="833" y="140" width="30" height="48" rx="4" class="famber"/>
<rect x="865" y="140" width="30" height="48" rx="4" class="famber"/>
<rect x="897" y="140" width="30" height="48" rx="4" class="famber"/>
<text x="160" y="214" class="s" text-anchor="middle">A 预留 8 格，只用 2 格</text>
<text x="320" y="214" class="xs" text-anchor="middle">碎片</text>
<text x="480" y="214" class="s" text-anchor="middle">B 预留 8 格，用 5 格</text>
<text x="640" y="214" class="xs" text-anchor="middle">碎片</text>
<text x="800" y="214" class="s" text-anchor="middle">C 预留 8 格，用 3 格</text>
<text x="32" y="246" class="s">在用 10 格；预留未用 14 格要等请求结束才释放，4 格零碎空隙放不下新请求</text>
<text x="32" y="316" class="t">分页分配：块大小 16 token，按需申请，靠块表找到</text>
