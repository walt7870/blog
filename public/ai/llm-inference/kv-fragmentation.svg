<rect x="449" y="330" width="30" height="48" rx="4" class="fgreen"/><text x="464" y="359" text-anchor="middle" class="xs">B</text>
<rect x="481" y="330" width="30" height="48" rx="4" class="node"/>
<rect x="513" y="330" width="30" height="48" rx="4" class="fgreen"/><text x="528" y="359" text-anchor="middle" class="xs">C</text>
