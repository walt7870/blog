<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="kv-fragmentation-title kv-fragmentation-desc" id="kv-fragmentation-root">
<title id="kv-fragmentation-title">连续预留与分页分配的对比</title>
<desc id="kv-fragmentation-desc">连续预留时每个请求按最大长度占一整块，大量空间预留未用，请求之间还留下拼不起来的空隙；分页后块按需分配、分散存放，只有每个请求最后一块没有填满。</desc>
<defs><style>
#kv-fragmentation-root text { font-family: Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #172b3a; }
#kv-fragmentation-root .h { font-size: 26px; font-weight: 700; }
#kv-fragmentation-root .t { font-size: 19px; font-weight: 600; }
#kv-fragmentation-root .s { font-size: 15px; fill: #475569; }
#kv-fragmentation-root .xs { font-size: 13px; fill: #64748b; }
#kv-fragmentation-root .k { font-size: 13px; font-weight: 700; letter-spacing: .04em; fill: #64748b; }
#kv-fragmentation-root .m { font-family: 'SFMono-Regular', Menlo, Consolas, monospace; font-size: 14px; fill: #172b3a; }
#kv-fragmentation-root .node { fill: #fff; stroke: #cbd5e1; stroke-width: 2; }
#kv-fragmentation-root .blue { fill: #eff6ff; stroke: #60a5fa; stroke-width: 2; }
#kv-fragmentation-root .green { fill: #ecfdf5; stroke: #20a28c; stroke-width: 2; }
#kv-fragmentation-root .red { fill: #fff1f2; stroke: #e88191; stroke-width: 2; }
#kv-fragmentation-root .amber { fill: #fffbeb; stroke: #e0a63a; stroke-width: 2; }
#kv-fragmentation-root .violet { fill: #f5f3ff; stroke: #9b87f5; stroke-width: 2; }
#kv-fragmentation-root .gray { fill: #f1f5f9; stroke: #cbd5e1; stroke-width: 2; }
#kv-fragmentation-root .fblue { fill: #93c5fd; } #kv-fragmentation-root .fgreen { fill: #6ee7b7; } #kv-fragmentation-root .fred { fill: #fda4af; }
#kv-fragmentation-root .famber { fill: #fcd34d; } #kv-fragmentation-root .fviolet { fill: #c4b5fd; } #kv-fragmentation-root .fgray { fill: #e2e8f0; }
#kv-fragmentation-root .edge { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#kv-fragmentation-arrow); }
#kv-fragmentation-root .dash { fill: none; stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 7 6; marker-end: url(#kv-fragmentation-arrow); }
#kv-fragmentation-root .line { stroke: #cbd5e1; stroke-width: 1.5; fill: none; }
#kv-fragmentation-root .axis { stroke: #64748b; stroke-width: 2; fill: none; }
</style><marker id="kv-fragmentation-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker></defs>
<rect width="960" height="560" fill="#f8fafc"/>
<text x="32" y="46" class="h">同一段显存，两种分配方式</text>
<text x="32" y="78" class="s">上：按最大长度为每个请求预留连续空间。下：切成固定大小的块，按需分配。每格代表一个块的空间。</text>
<text x="32" y="126" class="t">连续预留：A、B、C 各预留 8 格</text>
<rect x="33" y="140" width="30" height="48" rx="4" class="fgreen"/><text x="48" y="169" text-anchor="middle" class="xs">A</text>
<rect x="65" y="140" width="30" height="48" rx="4" class="fgreen"/><text x="80" y="169" text-anchor="middle" class="xs">A</text>
