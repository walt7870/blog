<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="block-hash-chain-title block-hash-chain-desc" id="block-hash-chain-root">
<title id="block-hash-chain-title">前缀缓存的块哈希链</title>
<desc id="block-hash-chain-desc">每个写满的块的哈希包含前一块的哈希、本块的 token 和额外标识；最后一个未写满的块不计算哈希。第二个请求在块 1 有一个 token 不同，块 1 之后所有块的哈希都与第一个请求不同，只有块 0 能命中。</desc>
<defs><style>
#block-hash-chain-root text { font-family: Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #172b3a; }
#block-hash-chain-root .h { font-size: 26px; font-weight: 700; }
#block-hash-chain-root .t { font-size: 19px; font-weight: 600; }
#block-hash-chain-root .s { font-size: 15px; fill: #475569; }
#block-hash-chain-root .xs { font-size: 13px; fill: #64748b; }
#block-hash-chain-root .k { font-size: 13px; font-weight: 700; letter-spacing: .04em; fill: #64748b; }
#block-hash-chain-root .m { font-family: 'SFMono-Regular', Menlo, Consolas, monospace; font-size: 14px; fill: #172b3a; }
#block-hash-chain-root .node { fill: #fff; stroke: #cbd5e1; stroke-width: 2; }
#block-hash-chain-root .blue { fill: #eff6ff; stroke: #60a5fa; stroke-width: 2; }
#block-hash-chain-root .green { fill: #ecfdf5; stroke: #20a28c; stroke-width: 2; }
#block-hash-chain-root .red { fill: #fff1f2; stroke: #e88191; stroke-width: 2; }
#block-hash-chain-root .amber { fill: #fffbeb; stroke: #e0a63a; stroke-width: 2; }
#block-hash-chain-root .violet { fill: #f5f3ff; stroke: #9b87f5; stroke-width: 2; }
#block-hash-chain-root .gray { fill: #f1f5f9; stroke: #cbd5e1; stroke-width: 2; }
#block-hash-chain-root .fblue { fill: #93c5fd; } #block-hash-chain-root .fgreen { fill: #6ee7b7; } #block-hash-chain-root .fred { fill: #fda4af; }
#block-hash-chain-root .famber { fill: #fcd34d; } #block-hash-chain-root .fviolet { fill: #c4b5fd; } #block-hash-chain-root .fgray { fill: #e2e8f0; }
#block-hash-chain-root .edge { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#block-hash-chain-arrow); }
#block-hash-chain-root .dash { fill: none; stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 7 6; marker-end: url(#block-hash-chain-arrow); }
#block-hash-chain-root .line { stroke: #cbd5e1; stroke-width: 1.5; fill: none; }
#block-hash-chain-root .axis { stroke: #64748b; stroke-width: 2; fill: none; }
</style><marker id="block-hash-chain-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker></defs>
<rect width="960" height="560" fill="#f8fafc"/>
<text x="32" y="46" class="h">每块的哈希都包含前一块的哈希</text>
<text x="32" y="78" class="s">哈希相同，意味着从第一个 token 到这块结尾全部相同。只有写满 16 个 token 的块才计算哈希。</text>
<text x="32" y="124" class="t">请求 1：写满的块计算哈希，存进“哈希 → 物理块”表</text>
<g data-node="r1b0"><rect x="32" y="136" width="160" height="128" rx="8" class="green"/><text x="50" y="172" class="t">块 0</text><text x="50" y="200" class="s">token 0–15</text><text x="50" y="223" class="s">h0 = hash(∅,</text><text x="50" y="246" class="s">块0, extra)</text></g><g data-node="r1b1"><rect x="216" y="136" width="160" height="128" rx="8" class="green"/><text x="234" y="172" class="t">块 1</text><text x="234" y="200" class="s">token 16–31</text><text x="234" y="223" class="s">h1 = hash(h0,</text><text x="234" y="246" class="s">块1, extra)</text></g><g data-node="r1b2"><rect x="400" y="136" width="160" height="128" rx="8" class="green"/><text x="418" y="172" class="t">块 2</text><text x="418" y="200" class="s">token 32–47</text><text x="418" y="223" class="s">h2 = hash(h1,</text><text x="418" y="246" class="s">块2, extra)</text></g><g data-node="r1b3"><rect x="584" y="136" width="160" height="128" rx="8" class="green"/><text x="602" y="172" class="t">块 3</text><text x="602" y="200" class="s">token 48–63</text><text x="602" y="223" class="s">h3 = hash(h2,</text><text x="602" y="246" class="s">块3, extra)</text></g><g data-node="r1b4"><rect x="768" y="136" width="160" height="128" rx="8" class="gray"/><text x="786" y="172" class="t">块 4（未满）</text><text x="786" y="200" class="s">token 64–70</text><text x="786" y="223" class="s">不计算哈希</text><text x="786" y="246" class="s">不能命中</text></g><path d="M192 200H216" class="edge"/><path d="M376 200H400" class="edge"/><path d="M560 200H584" class="edge"/><path d="M744 200H768" class="edge"/>
<text x="32" y="324" class="t">请求 2：块 1 里有一个 token 不同</text>
<g data-node="r2b0"><rect x="32" y="336" width="160" height="128" rx="8" class="green"/><text x="50" y="372" class="t">块 0</text><text x="50" y="400" class="s">token 完全相同</text><text x="50" y="423" class="s">h0 相同</text><text x="50" y="446" class="s">命中，直接引用</text></g><g data-node="r2b1"><rect x="216" y="336" width="160" height="128" rx="8" class="red"/><text x="234" y="372" class="t">块 1</text><text x="234" y="400" class="s">改了一个 token</text><text x="234" y="423" class="s">h1′ ≠ h1</text><text x="234" y="446" class="s">未命中</text></g><g data-node="r2b2"><rect x="400" y="336" width="160" height="128" rx="8" class="red"/><text x="418" y="372" class="t">块 2</text><text x="418" y="400" class="s">token 与请求 1 相同</text><text x="418" y="423" class="s">但父哈希不同</text><text x="418" y="446" class="s">h2′ ≠ h2</text></g><g data-node="r2b3"><rect x="584" y="336" width="160" height="128" rx="8" class="red"/><text x="602" y="372" class="t">块 3</text><text x="602" y="400" class="s">token 与请求 1 相同</text><text x="602" y="423" class="s">但父哈希不同</text><text x="602" y="446" class="s">h3′ ≠ h3</text></g><g data-node="r2b4"><rect x="768" y="336" width="160" height="128" rx="8" class="gray"/><text x="786" y="372" class="t">块 4（未满）</text><text x="786" y="400" class="s">不计算哈希</text><text x="786" y="423" class="s">需要计算</text></g><path d="M192 400H216" class="edge"/><path d="M376 400H400" class="edge"/><path d="M560 400H584" class="edge"/><path d="M744 400H768" class="edge"/>
<text x="32" y="512" class="s">查找从块 0 开始逐块比对，遇到第一个不命中的块就停止：请求 2 只复用块 0，块 1 起全部重新计算。</text>
<text x="32" y="538" class="s">extra 是额外标识，如 LoRA 适配器、图片内容、cache_salt；token 相同但这些不同时，哈希也不同。</text>
</svg>
