<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" role="img" aria-labelledby="gqa-heads-title gqa-heads-desc" id="gqa-heads-root">
<title id="gqa-heads-title">MHA、GQA 与 MQA 中 Query 头和 KV 头的对应关系</title>
<desc id="gqa-heads-desc">以 Llama-3.1-8B 的形状为例：32 个 Query 头。MHA 每个 Query 头配一个 KV 头，共 32 个，每 token KV 为 512 KiB；GQA 每 4 个 Query 头共用一个 KV 头，共 8 个，128 KiB；MQA 所有 Query 头共用 1 个 KV 头，16 KiB。</desc>
<defs><style>
#gqa-heads-root text { font-family: Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #172b3a; }
#gqa-heads-root .h { font-size: 26px; font-weight: 700; }
#gqa-heads-root .t { font-size: 19px; font-weight: 600; }
#gqa-heads-root .s { font-size: 15px; fill: #475569; }
#gqa-heads-root .xs { font-size: 13px; fill: #64748b; }
#gqa-heads-root .k { font-size: 13px; font-weight: 700; letter-spacing: .04em; fill: #64748b; }
#gqa-heads-root .m { font-family: 'SFMono-Regular', Menlo, Consolas, monospace; font-size: 14px; fill: #172b3a; }
#gqa-heads-root .node { fill: #fff; stroke: #cbd5e1; stroke-width: 2; }
#gqa-heads-root .blue { fill: #eff6ff; stroke: #60a5fa; stroke-width: 2; }
#gqa-heads-root .green { fill: #ecfdf5; stroke: #20a28c; stroke-width: 2; }
#gqa-heads-root .red { fill: #fff1f2; stroke: #e88191; stroke-width: 2; }
#gqa-heads-root .amber { fill: #fffbeb; stroke: #e0a63a; stroke-width: 2; }
#gqa-heads-root .violet { fill: #f5f3ff; stroke: #9b87f5; stroke-width: 2; }
#gqa-heads-root .gray { fill: #f1f5f9; stroke: #cbd5e1; stroke-width: 2; }
#gqa-heads-root .fblue { fill: #93c5fd; } #gqa-heads-root .fgreen { fill: #6ee7b7; } #gqa-heads-root .fred { fill: #fda4af; }
#gqa-heads-root .famber { fill: #fcd34d; } #gqa-heads-root .fviolet { fill: #c4b5fd; } #gqa-heads-root .fgray { fill: #e2e8f0; }
#gqa-heads-root .edge { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#gqa-heads-arrow); }
#gqa-heads-root .dash { fill: none; stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 7 6; marker-end: url(#gqa-heads-arrow); }
#gqa-heads-root .line { stroke: #cbd5e1; stroke-width: 1.5; fill: none; }
#gqa-heads-root .axis { stroke: #64748b; stroke-width: 2; fill: none; }
</style><marker id="gqa-heads-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker></defs>
<rect width="960" height="640" fill="#f8fafc"/>
<text x="32" y="46" class="h">KV 头越少，每个 token 的 KV 越小</text>
<text x="32" y="78" class="s">32 层、每头 128 维、BF16 的形状下，比较 32 个 Query 头配多少个 KV 头。GQA 中同色表示共用同一组 KV。</text>
<g data-node="mha"><rect x="32" y="108" width="288" height="420" rx="8" class="node"/><text x="50" y="134" class="k">MHA：32 个 KV 头</text></g>
<g data-node="gqa"><rect x="336" y="108" width="288" height="420" rx="8" class="node"/><text x="354" y="134" class="k">GQA：8 个 KV 头</text></g>
<g data-node="mqa"><rect x="640" y="108" width="288" height="420" rx="8" class="node"/><text x="658" y="134" class="k">MQA：1 个 KV 头</text></g>
<text x="56" y="160" class="xs">Query 头 × 32</text>
<text x="360" y="160" class="xs">Query 头 × 32</text>
<text x="664" y="160" class="xs">Query 头 × 32</text>
<text x="56" y="340" class="xs">KV 头（每个 Q 头各有一个）</text>
<text x="360" y="404" class="xs">KV 头 × 8：同一列的 4 个 Q 共用</text>
<text x="664" y="404" class="xs">KV 头 × 1：32 个 Q 全部共用</text>
