<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="cuda-graph-title cuda-graph-desc" id="cuda-graph-root">
<title id="cuda-graph-title">逐个启动内核与 CUDA Graph 回放</title>
<desc id="cuda-graph-desc">没有 CUDA Graph 时，CPU 逐个启动内核，GPU 在内核之间空等；使用 CUDA Graph 后，CPU 发出一次回放指令，GPU 上的内核一个接一个紧密执行。</desc>
<defs><style>
#cuda-graph-root text { font-family: Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #172b3a; }
#cuda-graph-root .h { font-size: 26px; font-weight: 700; }
#cuda-graph-root .t { font-size: 19px; font-weight: 600; }
#cuda-graph-root .s { font-size: 15px; fill: #475569; }
#cuda-graph-root .xs { font-size: 13px; fill: #64748b; }
#cuda-graph-root .k { font-size: 13px; font-weight: 700; letter-spacing: .04em; fill: #64748b; }
#cuda-graph-root .m { font-family: 'SFMono-Regular', Menlo, Consolas, monospace; font-size: 14px; fill: #172b3a; }
#cuda-graph-root .node { fill: #fff; stroke: #cbd5e1; stroke-width: 2; }
#cuda-graph-root .blue { fill: #eff6ff; stroke: #60a5fa; stroke-width: 2; }
#cuda-graph-root .green { fill: #ecfdf5; stroke: #20a28c; stroke-width: 2; }
#cuda-graph-root .red { fill: #fff1f2; stroke: #e88191; stroke-width: 2; }
#cuda-graph-root .amber { fill: #fffbeb; stroke: #e0a63a; stroke-width: 2; }
#cuda-graph-root .violet { fill: #f5f3ff; stroke: #9b87f5; stroke-width: 2; }
#cuda-graph-root .gray { fill: #f1f5f9; stroke: #cbd5e1; stroke-width: 2; }
#cuda-graph-root .fblue { fill: #93c5fd; } #cuda-graph-root .fgreen { fill: #6ee7b7; } #cuda-graph-root .fred { fill: #fda4af; }
#cuda-graph-root .famber { fill: #fcd34d; } #cuda-graph-root .fviolet { fill: #c4b5fd; } #cuda-graph-root .fgray { fill: #e2e8f0; }
#cuda-graph-root .edge { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#cuda-graph-arrow); }
#cuda-graph-root .dash { fill: none; stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 7 6; marker-end: url(#cuda-graph-arrow); }
#cuda-graph-root .line { stroke: #cbd5e1; stroke-width: 1.5; fill: none; }
#cuda-graph-root .axis { stroke: #64748b; stroke-width: 2; fill: none; }
</style><marker id="cuda-graph-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker></defs>
<rect width="960" height="600" fill="#f8fafc"/>
<text x="32" y="46" class="h">CPU 逐个下指令，GPU 在内核之间空等</text>
<text x="32" y="78" class="s">一次 Decode 前向有几百个内核；每次启动约几微秒，小批量时这些空隙会拖慢整步。</text>
<text x="32" y="126" class="t">逐个启动</text>
<text x="32" y="160" class="k">CPU</text><text x="32" y="200" class="k">GPU</text><rect x="110" y="140" width="818" height="28" rx="4" fill="#f1f5f9"/><rect x="110" y="180" width="818" height="28" rx="4" fill="#f1f5f9"/><rect x="120" y="140" width="40" height="28" rx="4" class="famber"/><rect x="216" y="140" width="40" height="28" rx="4" class="famber"/><rect x="312" y="140" width="40" height="28" rx="4" class="famber"/><rect x="408" y="140" width="40" height="28" rx="4" class="famber"/><rect x="504" y="140" width="40" height="28" rx="4" class="famber"/><rect x="600" y="140" width="40" height="28" rx="4" class="famber"/><rect x="696" y="140" width="40" height="28" rx="4" class="famber"/><rect x="792" y="140" width="40" height="28" rx="4" class="famber"/><rect x="162" y="180" width="52" height="28" rx="4" class="fblue"/><text x="188" y="199" text-anchor="middle" class="xs">k1</text><rect x="258" y="180" width="52" height="28" rx="4" class="fblue"/><text x="284" y="199" text-anchor="middle" class="xs">k2</text><rect x="354" y="180" width="52" height="28" rx="4" class="fblue"/><text x="380" y="199" text-anchor="middle" class="xs">k3</text><rect x="450" y="180" width="52" height="28" rx="4" class="fblue"/><text x="476" y="199" text-anchor="middle" class="xs">k4</text><rect x="546" y="180" width="52" height="28" rx="4" class="fblue"/><text x="572" y="199" text-anchor="middle" class="xs">k5</text><rect x="642" y="180" width="52" height="28" rx="4" class="fblue"/><text x="668" y="199" text-anchor="middle" class="xs">k6</text><rect x="738" y="180" width="52" height="28" rx="4" class="fblue"/><text x="764" y="199" text-anchor="middle" class="xs">k7</text><rect x="834" y="180" width="52" height="28" rx="4" class="fblue"/><text x="860" y="199" text-anchor="middle" class="xs">k8</text>
<text x="110" y="236" class="s">黄色：CPU 启动一个内核；蓝色：GPU 执行；之间的空白是 GPU 在等下一条指令</text>
<text x="32" y="286" class="t">CUDA Graph：录制一次，之后整张图回放</text>
<text x="32" y="320" class="k">CPU</text><text x="32" y="360" class="k">GPU</text><rect x="110" y="300" width="818" height="28" rx="4" fill="#f1f5f9"/><rect x="110" y="340" width="818" height="28" rx="4" fill="#f1f5f9"/><rect x="120" y="300" width="50" height="28" rx="4" class="famber"/><text x="145" y="319" text-anchor="middle" class="xs">replay</text><rect x="176" y="340" width="50" height="28" rx="4" class="fblue"/><text x="201" y="359" text-anchor="middle" class="xs">k1</text><rect x="228" y="340" width="50" height="28" rx="4" class="fblue"/><text x="253" y="359" text-anchor="middle" class="xs">k2</text><rect x="280" y="340" width="50" height="28" rx="4" class="fblue"/><text x="305" y="359" text-anchor="middle" class="xs">k3</text><rect x="332" y="340" width="50" height="28" rx="4" class="fblue"/><text x="357" y="359" text-anchor="middle" class="xs">k4</text><rect x="384" y="340" width="50" height="28" rx="4" class="fblue"/><text x="409" y="359" text-anchor="middle" class="xs">k5</text><rect x="436" y="340" width="50" height="28" rx="4" class="fblue"/><text x="461" y="359" text-anchor="middle" class="xs">k6</text><rect x="488" y="340" width="50" height="28" rx="4" class="fblue"/><text x="513" y="359" text-anchor="middle" class="xs">k7</text><rect x="540" y="340" width="50" height="28" rx="4" class="fblue"/><text x="565" y="359" text-anchor="middle" class="xs">k8</text>
<path d="M592 386V396H886V386" class="line"/>
<text x="739" y="418" class="s" text-anchor="middle">省下的时间（对比上方 k8 的结束位置）</text>
<text x="110" y="418" class="s">CPU 只发一条回放指令</text>
<g data-node="sizes"><rect x="32" y="450" width="896" height="120" rx="8" class="gray"/><text x="50" y="486" class="t">录制的限制</text><text x="50" y="514" class="s">形状和显存地址固定：通常只录制 Decode，每步每个请求 1 个 token</text><text x="50" y="537" class="s">批大小 1、2、4、8、16、32 … 512 各录一张；运行时取不小于实际批大小的那张，</text><text x="50" y="560" class="s">多出的位置填充空数据（槽位 -1）。超过最大录制尺寸时退回逐个启动。</text></g>
</svg>
