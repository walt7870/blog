<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="concurrency-sweep-title concurrency-sweep-desc" id="concurrency-sweep-root">
<title id="concurrency-sweep-title">并发扫描示意</title>
<desc id="concurrency-sweep-desc">示意图：随并发增加，系统吞吐先快速上升后趋于平缓，P99 延迟先基本不变，在拐点后急剧上升；P99 延迟越过 SLO 的位置就是满足延迟目标时的容量。</desc>
<defs><style>
#concurrency-sweep-root text { font-family: Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #172b3a; }
#concurrency-sweep-root .h { font-size: 26px; font-weight: 700; }
#concurrency-sweep-root .t { font-size: 19px; font-weight: 600; }
#concurrency-sweep-root .s { font-size: 15px; fill: #475569; }
#concurrency-sweep-root .xs { font-size: 13px; fill: #64748b; }
#concurrency-sweep-root .k { font-size: 13px; font-weight: 700; letter-spacing: .04em; fill: #64748b; }
#concurrency-sweep-root .m { font-family: 'SFMono-Regular', Menlo, Consolas, monospace; font-size: 14px; fill: #172b3a; }
#concurrency-sweep-root .node { fill: #fff; stroke: #cbd5e1; stroke-width: 2; }
#concurrency-sweep-root .blue { fill: #eff6ff; stroke: #60a5fa; stroke-width: 2; }
#concurrency-sweep-root .green { fill: #ecfdf5; stroke: #20a28c; stroke-width: 2; }
#concurrency-sweep-root .red { fill: #fff1f2; stroke: #e88191; stroke-width: 2; }
#concurrency-sweep-root .amber { fill: #fffbeb; stroke: #e0a63a; stroke-width: 2; }
#concurrency-sweep-root .violet { fill: #f5f3ff; stroke: #9b87f5; stroke-width: 2; }
#concurrency-sweep-root .gray { fill: #f1f5f9; stroke: #cbd5e1; stroke-width: 2; }
#concurrency-sweep-root .fblue { fill: #93c5fd; } #concurrency-sweep-root .fgreen { fill: #6ee7b7; } #concurrency-sweep-root .fred { fill: #fda4af; }
#concurrency-sweep-root .famber { fill: #fcd34d; } #concurrency-sweep-root .fviolet { fill: #c4b5fd; } #concurrency-sweep-root .fgray { fill: #e2e8f0; }
#concurrency-sweep-root .edge { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#concurrency-sweep-arrow); }
#concurrency-sweep-root .dash { fill: none; stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 7 6; marker-end: url(#concurrency-sweep-arrow); }
#concurrency-sweep-root .line { stroke: #cbd5e1; stroke-width: 1.5; fill: none; }
#concurrency-sweep-root .axis { stroke: #64748b; stroke-width: 2; fill: none; }
</style><marker id="concurrency-sweep-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker></defs>
<rect width="960" height="600" fill="#f8fafc"/>
<text x="32" y="46" class="h">并发扫描：找到吞吐与延迟的拐点</text>
<text x="32" y="78" class="s">纵轴为相对值；同一张图上看吞吐与 P99 延迟随并发的变化。</text>
<path d="M110 130V470H670" class="axis"/>
<text x="130" y="494" class="xs" text-anchor="middle">1</text>
<text x="216.66666666666669" y="494" class="xs" text-anchor="middle">2</text>
<text x="303.33333333333337" y="494" class="xs" text-anchor="middle">4</text>
<text x="390" y="494" class="xs" text-anchor="middle">8</text>
<text x="476.6666666666667" y="494" class="xs" text-anchor="middle">16</text>
<text x="563.3333333333333" y="494" class="xs" text-anchor="middle">32</text>
<text x="650" y="494" class="xs" text-anchor="middle">64</text>
<text x="390" y="522" class="s" text-anchor="middle">并发数（逐档加倍）</text>
<path d="M130.0 446.9L216.7 423.8L303.3 380.9L390.0 305.0L476.7 212.6L563.3 166.4L650.0 156.5" fill="none" stroke="#3b82f6" stroke-width="3"/>
<path d="M130.0 430.4L216.7 430.4L303.3 427.1L390.0 420.5L476.7 397.4L563.3 305.0L650.0 156.5" fill="none" stroke="#e11d48" stroke-width="3" stroke-dasharray="8 5"/>
<path d="M110 371H670" stroke="#e0a63a" stroke-width="2" stroke-dasharray="4 4"/>
<rect x="112" y="345" width="160" height="26" rx="4" fill="#f8fafc"/><text x="118" y="363" class="s">P99 延迟目标（SLO）</text>
<path d="M501.4 470V130" stroke="#64748b" stroke-width="1.5" stroke-dasharray="3 4"/>
<rect x="431.4285714285714" y="106" width="186" height="26" rx="4" fill="#f8fafc"/><text x="437.4285714285714" y="124" class="s">拐点：满足 SLO 的容量</text>
<g data-node="legend"><rect x="700" y="150" width="228" height="170" rx="8" class="node"/><text x="718" y="186" class="t">图例</text><text x="718" y="214" class="s">蓝色实线：系统吞吐</text><text x="718" y="237" class="s">红色虚线：P99 延迟</text><text x="718" y="260" class="s">黄色虚线：延迟目标</text><text x="718" y="283" class="s">灰色竖线：拐点</text></g>
<g data-node="note"><rect x="700" y="340" width="228" height="130" rx="8" class="amber"/><text x="718" y="376" class="t">示意图</text><text x="718" y="404" class="s">形状示意，不是实测数据</text><text x="718" y="427" class="s">拐点位置随模型、硬件</text><text x="718" y="450" class="s">和请求分布变化</text></g>
<text x="32" y="572" class="s">拐点之前：批变大几乎不增加步长，吞吐近似线性上升；拐点之后：KV 读取、抢占和排队让延迟急剧变差。</text>
</svg>
