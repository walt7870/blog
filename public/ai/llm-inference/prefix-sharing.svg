<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="prefix-sharing-title prefix-sharing-desc" id="prefix-sharing-root">
<title id="prefix-sharing-title">多个请求共享前缀的 KV</title>
<desc id="prefix-sharing-desc">三个请求都以系统提示和员工制度开头，这部分约 3000 token 的 KV 块只计算一次、只存一份，引用计数为 3；每个请求只为自己约 30 token 的问题计算新的 KV。</desc>
<defs><style>
#prefix-sharing-root text { font-family: Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #172b3a; }
#prefix-sharing-root .h { font-size: 26px; font-weight: 700; }
#prefix-sharing-root .t { font-size: 19px; font-weight: 600; }
#prefix-sharing-root .s { font-size: 15px; fill: #475569; }
#prefix-sharing-root .xs { font-size: 13px; fill: #64748b; }
#prefix-sharing-root .k { font-size: 13px; font-weight: 700; letter-spacing: .04em; fill: #64748b; }
#prefix-sharing-root .m { font-family: 'SFMono-Regular', Menlo, Consolas, monospace; font-size: 14px; fill: #172b3a; }
#prefix-sharing-root .node { fill: #fff; stroke: #cbd5e1; stroke-width: 2; }
#prefix-sharing-root .blue { fill: #eff6ff; stroke: #60a5fa; stroke-width: 2; }
#prefix-sharing-root .green { fill: #ecfdf5; stroke: #20a28c; stroke-width: 2; }
#prefix-sharing-root .red { fill: #fff1f2; stroke: #e88191; stroke-width: 2; }
#prefix-sharing-root .amber { fill: #fffbeb; stroke: #e0a63a; stroke-width: 2; }
#prefix-sharing-root .violet { fill: #f5f3ff; stroke: #9b87f5; stroke-width: 2; }
#prefix-sharing-root .gray { fill: #f1f5f9; stroke: #cbd5e1; stroke-width: 2; }
#prefix-sharing-root .fblue { fill: #93c5fd; } #prefix-sharing-root .fgreen { fill: #6ee7b7; } #prefix-sharing-root .fred { fill: #fda4af; }
#prefix-sharing-root .famber { fill: #fcd34d; } #prefix-sharing-root .fviolet { fill: #c4b5fd; } #prefix-sharing-root .fgray { fill: #e2e8f0; }
#prefix-sharing-root .edge { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#prefix-sharing-arrow); }
#prefix-sharing-root .dash { fill: none; stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 7 6; marker-end: url(#prefix-sharing-arrow); }
#prefix-sharing-root .line { stroke: #cbd5e1; stroke-width: 1.5; fill: none; }
#prefix-sharing-root .axis { stroke: #64748b; stroke-width: 2; fill: none; }
</style><marker id="prefix-sharing-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker></defs>
<rect width="960" height="520" fill="#f8fafc"/>
<text x="32" y="46" class="h">相同的开头只算一次，大家共用</text>
<text x="32" y="78" class="s">系统提示 + 员工制度约 3000 token；各人的问题约 30 token。</text>
<g data-node="lin"><rect x="32" y="120" width="200" height="96" rx="8" class="node"/><text x="50" y="156" class="t">小林的请求</text><text x="50" y="184" class="s">块表指向共享块</text><text x="50" y="207" class="s">和自己的块</text></g>
<g data-node="zhou"><rect x="32" y="240" width="200" height="96" rx="8" class="node"/><text x="50" y="276" class="t">小周的请求</text><text x="50" y="304" class="s">块表指向共享块</text><text x="50" y="327" class="s">和自己的块</text></g>
<g data-node="wang"><rect x="32" y="360" width="200" height="96" rx="8" class="node"/><text x="50" y="396" class="t">小王的请求</text><text x="50" y="424" class="s">块表指向共享块</text><text x="50" y="447" class="s">和自己的块</text></g>
<g data-node="shared"><rect x="300" y="120" width="340" height="336" rx="8" class="green"/><text x="318" y="156" class="t">共享前缀的 KV 块</text><text x="318" y="184" class="s">系统提示 + 员工制度</text><text x="318" y="207" class="s">约 3000 token</text><text x="318" y="230" class="s"></text><text x="318" y="253" class="s">只计算一次、只存一份</text><text x="318" y="276" class="s">引用计数 = 3</text><text x="318" y="299" class="s"></text><text x="318" y="322" class="s">第一个请求算完后留在显存，</text><text x="318" y="345" class="s">后来的请求命中后直接引用</text></g>
<path d="M232 168H300" class="edge"/>
<path d="M232 288H300" class="edge"/>
<path d="M232 408H300" class="edge"/>
<g data-node="q1"><rect x="708" y="120" width="220" height="96" rx="8" class="amber"/><text x="726" y="156" class="t">小林的问题</text><text x="726" y="184" class="s">约 30 token</text><text x="726" y="207" class="s">单独计算新 KV</text></g>
<g data-node="q2"><rect x="708" y="240" width="220" height="96" rx="8" class="amber"/><text x="726" y="276" class="t">小周的问题</text><text x="726" y="304" class="s">约 30 token</text><text x="726" y="327" class="s">单独计算新 KV</text></g>
<g data-node="q3"><rect x="708" y="360" width="220" height="96" rx="8" class="amber"/><text x="726" y="396" class="t">小王的问题</text><text x="726" y="424" class="s">约 30 token</text><text x="726" y="447" class="s">单独计算新 KV</text></g>
<path d="M640 168H708" class="edge"/>
<path d="M640 288H708" class="edge"/>
<path d="M640 408H708" class="edge"/>
<text x="32" y="492" class="s">第一个请求处理约 3030 个 token；之后每个请求只需计算约 30 个新 token。</text>
</svg>
