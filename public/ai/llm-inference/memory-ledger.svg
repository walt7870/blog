<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="556" viewBox="0 0 960 556" role="img" aria-labelledby="memory-ledger-title memory-ledger-desc" id="memory-ledger-root">
<title id="memory-ledger-title">一张 80 GB H100 上运行 Llama-3.1-8B 时的显存分配估算</title>
<desc id="memory-ledger-desc">实际可用约 79.6 GiB，按 0.9 的利用率留出约 8 GiB 余量；权重约 15 GiB，运行时工作区几 GiB，剩下约 50 GiB 给 KV Cache，按每 token 128 KiB 约可存 40 万个 token。</desc>
<defs><style>
#memory-ledger-root text { font-family: Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #172b3a; }
#memory-ledger-root .h { font-size: 26px; font-weight: 700; }
#memory-ledger-root .t { font-size: 19px; font-weight: 600; }
#memory-ledger-root .s { font-size: 15px; fill: #475569; }
#memory-ledger-root .xs { font-size: 13px; fill: #64748b; }
#memory-ledger-root .k { font-size: 13px; font-weight: 700; letter-spacing: .04em; fill: #64748b; }
#memory-ledger-root .m { font-family: 'SFMono-Regular', Menlo, Consolas, monospace; font-size: 14px; fill: #172b3a; }
#memory-ledger-root .node { fill: #fff; stroke: #cbd5e1; stroke-width: 2; }
#memory-ledger-root .blue { fill: #eff6ff; stroke: #60a5fa; stroke-width: 2; }
#memory-ledger-root .green { fill: #ecfdf5; stroke: #20a28c; stroke-width: 2; }
#memory-ledger-root .red { fill: #fff1f2; stroke: #e88191; stroke-width: 2; }
#memory-ledger-root .amber { fill: #fffbeb; stroke: #e0a63a; stroke-width: 2; }
#memory-ledger-root .violet { fill: #f5f3ff; stroke: #9b87f5; stroke-width: 2; }
#memory-ledger-root .gray { fill: #f1f5f9; stroke: #cbd5e1; stroke-width: 2; }
#memory-ledger-root .fblue { fill: #93c5fd; } #memory-ledger-root .fgreen { fill: #6ee7b7; } #memory-ledger-root .fred { fill: #fda4af; }
#memory-ledger-root .famber { fill: #fcd34d; } #memory-ledger-root .fviolet { fill: #c4b5fd; } #memory-ledger-root .fgray { fill: #e2e8f0; }
#memory-ledger-root .edge { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#memory-ledger-arrow); }
#memory-ledger-root .dash { fill: none; stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 7 6; marker-end: url(#memory-ledger-arrow); }
#memory-ledger-root .line { stroke: #cbd5e1; stroke-width: 1.5; fill: none; }
#memory-ledger-root .axis { stroke: #64748b; stroke-width: 2; fill: none; }
</style><marker id="memory-ledger-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker></defs>
<rect width="960" height="556" fill="#f8fafc"/>
<text x="32" y="46" class="h">80 GB 显存怎样分：一份权重，所有请求的 KV</text>
<text x="32" y="78" class="s">按比例绘制的估算，Llama-3.1-8B、BF16；实际数值以引擎启动日志为准。</text>
<rect x="32" y="170" width="169" height="64" rx="4" class="fblue"/><rect x="201" y="170" width="74" height="64" rx="4" class="famber"/><rect x="275" y="170" width="563" height="64" rx="4" class="fgreen"/><rect x="838" y="170" width="90" height="64" rx="4" class="fgray"/>
<path d="M32 164V156H838V164" class="line"/>
<text x="435" y="146" class="xs" text-anchor="middle">引擎可用 ≈ 71.6 GiB（79.6 × 0.9）</text>
<text x="928" y="146" class="xs" text-anchor="end">合计约 79.6 GiB</text>
<path d="M44 234V260" class="line"/><text x="36" y="282" class="t">权重</text><text x="36" y="306" class="s">约 15 GiB</text><path d="M213 234V310" class="line"/><text x="205" y="332" class="t">运行时工作区</text><text x="205" y="356" class="s">几 GiB</text><path d="M287 234V260" class="line"/><text x="279" y="282" class="t">KV Cache</text><text x="279" y="306" class="s">约 50 GiB</text><path d="M916 234V260" class="line"/><text x="928" y="282" class="t" text-anchor="end">安全余量</text><text x="928" y="306" class="s" text-anchor="end">约 8 GiB（10%）</text>
<g data-node="kv-cap"><rect x="32" y="388" width="432" height="140" rx="8" class="green"/><text x="50" y="424" class="t">KV 容量 ≈ 50 GiB ÷ 128 KiB</text><text x="50" y="452" class="s">≈ 40 万个 token，所有请求共享</text><text x="50" y="475" class="s">每个 token 128 KiB：</text><text x="50" y="498" class="s">2 × 32 层 × 8 KV 头 × 128 维 × 2 字节</text></g>
<g data-node="kv-use"><rect x="496" y="388" width="432" height="140" rx="8" class="node"/><text x="514" y="424" class="t">能同时容纳多少个对话</text><text x="514" y="452" class="s">每个 1000 token：约 400 个</text><text x="514" y="475" class="s">每个 8192 token：约 50 个</text><text x="514" y="498" class="s">每个 128K token：只有 3 个</text></g>
</svg>
