<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="series-map-title series-map-desc" id="series-map-root">
<title id="series-map-title">大模型推理优化系列的五个部分</title>
<desc id="series-map-desc">第一部分建立坐标系，第二部分解释瓶颈，第三部分讲引擎核心技术，第四部分讲量化与投机解码，第五部分讲多卡、部署、压测、运维与端侧。</desc>
<defs><style>
#series-map-root text { font-family: Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #172b3a; }
#series-map-root .h { font-size: 26px; font-weight: 700; }
#series-map-root .t { font-size: 19px; font-weight: 600; }
#series-map-root .s { font-size: 15px; fill: #475569; }
#series-map-root .xs { font-size: 13px; fill: #64748b; }
#series-map-root .k { font-size: 13px; font-weight: 700; letter-spacing: .04em; fill: #64748b; }
#series-map-root .m { font-family: 'SFMono-Regular', Menlo, Consolas, monospace; font-size: 14px; fill: #172b3a; }
#series-map-root .node { fill: #fff; stroke: #cbd5e1; stroke-width: 2; }
#series-map-root .blue { fill: #eff6ff; stroke: #60a5fa; stroke-width: 2; }
#series-map-root .green { fill: #ecfdf5; stroke: #20a28c; stroke-width: 2; }
#series-map-root .red { fill: #fff1f2; stroke: #e88191; stroke-width: 2; }
#series-map-root .amber { fill: #fffbeb; stroke: #e0a63a; stroke-width: 2; }
#series-map-root .violet { fill: #f5f3ff; stroke: #9b87f5; stroke-width: 2; }
#series-map-root .gray { fill: #f1f5f9; stroke: #cbd5e1; stroke-width: 2; }
#series-map-root .fblue { fill: #93c5fd; } #series-map-root .fgreen { fill: #6ee7b7; } #series-map-root .fred { fill: #fda4af; }
#series-map-root .famber { fill: #fcd34d; } #series-map-root .fviolet { fill: #c4b5fd; } #series-map-root .fgray { fill: #e2e8f0; }
#series-map-root .edge { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#series-map-arrow); }
#series-map-root .dash { fill: none; stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 7 6; marker-end: url(#series-map-arrow); }
#series-map-root .line { stroke: #cbd5e1; stroke-width: 1.5; fill: none; }
#series-map-root .axis { stroke: #64748b; stroke-width: 2; fill: none; }
</style><marker id="series-map-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker></defs>
<rect width="960" height="560" fill="#f8fafc"/>
<text x="32" y="46" class="h">五个部分，从一次推理一直讲到生产部署</text>
<text x="32" y="78" class="s">先立坐标系，再找瓶颈，然后逐个拆解引擎技术、压缩加速和规模化工程。</text>
<g data-node="p1"><rect x="32" y="112" width="280" height="180" rx="8" class="blue"/><text x="50" y="138" class="k">第一部分 · 01–05</text><text x="50" y="164" class="t">一次推理怎样发生</text><text x="50" y="192" class="s">Prefill 与 Decode</text><text x="50" y="215" class="s">KV Cache 与显存账本</text><text x="50" y="238" class="s">TTFT、TPOT、Goodput</text></g>
<g data-node="p2"><rect x="340" y="112" width="280" height="180" rx="8" class="violet"/><text x="358" y="138" class="k">第二部分 · 06–07</text><text x="358" y="164" class="t">瓶颈在哪里</text><text x="358" y="192" class="s">GPU 的算力与带宽</text><text x="358" y="215" class="s">Roofline 与算术强度</text><text x="358" y="238" class="s">一个请求的全链路</text></g>
<g data-node="p3"><rect x="648" y="112" width="280" height="180" rx="8" class="green"/><text x="666" y="138" class="k">第三部分 · 08–13</text><text x="666" y="164" class="t">推理引擎核心技术</text><text x="666" y="192" class="s">分页 KV、连续批处理</text><text x="666" y="215" class="s">前缀缓存、分块预填充</text><text x="666" y="238" class="s">算子、CUDA Graph、源码</text></g>
<g data-node="p4"><rect x="648" y="336" width="280" height="180" rx="8" class="amber"/><text x="666" y="362" class="k">第四部分 · 14–15</text><text x="666" y="388" class="t">压缩与加速</text><text x="666" y="416" class="s">量化：每步搬更少字节</text><text x="666" y="439" class="s">投机解码：一步推进多个 token</text></g>
<g data-node="p5"><rect x="32" y="336" width="588" height="180" rx="8" class="red"/><text x="50" y="362" class="k">第五部分 · 16–22</text><text x="50" y="388" class="t">规模化与工程</text><text x="50" y="416" class="s">多卡并行、P/D 分离、vLLM 与 SGLang、语音与多模态</text><text x="50" y="439" class="s">压测与分析、生产部署与运维、端侧推理</text></g>
<path d="M312 202H340" class="edge"/>
<path d="M620 202H648" class="edge"/>
<path d="M788 292V336" class="edge"/>
<path d="M648 426H620" class="edge"/>
</svg>
