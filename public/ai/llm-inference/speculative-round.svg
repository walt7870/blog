<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="610" viewBox="0 0 960 610" role="img" aria-labelledby="speculative-round-title speculative-round-desc" id="speculative-round-root">
<title id="speculative-round-title">一轮投机解码</title>
<desc id="speculative-round-desc">草稿模型猜出 4 个 token，目标模型一次前向验证 5 个位置，前 2 个接受，第 3 个替换为目标模型的结果，第 4 个作废，本轮前进 3 个 token。</desc>
<defs><style>
#speculative-round-root text { font-family: Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #172b3a; }
#speculative-round-root .h { font-size: 26px; font-weight: 700; }
#speculative-round-root .t { font-size: 19px; font-weight: 600; }
#speculative-round-root .s { font-size: 15px; fill: #475569; }
#speculative-round-root .xs { font-size: 13px; fill: #64748b; }
#speculative-round-root .k { font-size: 13px; font-weight: 700; letter-spacing: .04em; fill: #64748b; }
#speculative-round-root .m { font-family: 'SFMono-Regular', Menlo, Consolas, monospace; font-size: 14px; fill: #172b3a; }
#speculative-round-root .node { fill: #fff; stroke: #cbd5e1; stroke-width: 2; }
#speculative-round-root .blue { fill: #eff6ff; stroke: #60a5fa; stroke-width: 2; }
#speculative-round-root .green { fill: #ecfdf5; stroke: #20a28c; stroke-width: 2; }
#speculative-round-root .red { fill: #fff1f2; stroke: #e88191; stroke-width: 2; }
#speculative-round-root .amber { fill: #fffbeb; stroke: #e0a63a; stroke-width: 2; }
#speculative-round-root .violet { fill: #f5f3ff; stroke: #9b87f5; stroke-width: 2; }
#speculative-round-root .gray { fill: #f1f5f9; stroke: #cbd5e1; stroke-width: 2; }
#speculative-round-root .fblue { fill: #93c5fd; } #speculative-round-root .fgreen { fill: #6ee7b7; } #speculative-round-root .fred { fill: #fda4af; }
#speculative-round-root .famber { fill: #fcd34d; } #speculative-round-root .fviolet { fill: #c4b5fd; } #speculative-round-root .fgray { fill: #e2e8f0; }
#speculative-round-root .edge { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#speculative-round-arrow); }
#speculative-round-root .dash { fill: none; stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 7 6; marker-end: url(#speculative-round-arrow); }
#speculative-round-root .line { stroke: #cbd5e1; stroke-width: 1.5; fill: none; }
#speculative-round-root .axis { stroke: #64748b; stroke-width: 2; fill: none; }
</style><marker id="speculative-round-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker></defs>
<rect width="960" height="610" fill="#f8fafc"/>
<text x="32" y="46" class="h">一轮投机解码：猜 4 个，验 5 个位置，前进 3 个</text>
<text x="32" y="78" class="s">目标模型搬一次权重就检查完全部猜测，猜对的部分不必再逐个串行生成。</text>
<text x="32" y="132" class="t">起草：草稿模型连续猜 4 个（γ = 4）</text>
<rect x="32" y="150" width="96" height="44" rx="4" class="gray"/><text x="80" y="177" text-anchor="middle" class="s">…申请？</text>
<rect x="150" y="150" width="96" height="44" rx="4" class="fviolet"/><text x="198" y="177" text-anchor="middle" class="s">先</text>
<rect x="262" y="150" width="96" height="44" rx="4" class="fviolet"/><text x="310" y="177" text-anchor="middle" class="s">提交</text>
<rect x="374" y="150" width="96" height="44" rx="4" class="fviolet"/><text x="422" y="177" text-anchor="middle" class="s">审批</text>
<rect x="486" y="150" width="96" height="44" rx="4" class="fviolet"/><text x="534" y="177" text-anchor="middle" class="s">表单</text>
<text x="32" y="246" class="t">验证：目标模型一次前向，算出 5 个位置各自的下一个 token</text>
<rect x="150" y="264" width="96" height="44" rx="4" class="fblue"/><text x="198" y="291" text-anchor="middle" class="s">先</text>
<rect x="262" y="264" width="96" height="44" rx="4" class="fblue"/><text x="310" y="291" text-anchor="middle" class="s">提交</text>
<rect x="374" y="264" width="96" height="44" rx="4" class="fblue"/><text x="422" y="291" text-anchor="middle" class="s">申请</text>
<rect x="486" y="264" width="96" height="44" rx="4" class="fblue"/><text x="534" y="291" text-anchor="middle" class="s">再</text>
<rect x="598" y="264" width="96" height="44" rx="4" class="fblue"/><text x="646" y="291" text-anchor="middle" class="s">等待</text>
<text x="32" y="292" class="xs">目标给出</text>
<text x="32" y="360" class="t">接受：逐个比较，到第一个不一致为止</text>
<rect x="150" y="378" width="96" height="44" rx="4" class="fgreen"/><text x="198" y="405" text-anchor="middle" class="s">先</text>
<text x="198" y="444" class="xs" text-anchor="middle">接受</text>
<rect x="262" y="378" width="96" height="44" rx="4" class="fgreen"/><text x="310" y="405" text-anchor="middle" class="s">提交</text>
<text x="310" y="444" class="xs" text-anchor="middle">接受</text>
<rect x="374" y="378" width="96" height="44" rx="4" class="famber"/><text x="422" y="405" text-anchor="middle" class="s">申请</text>
<text x="422" y="444" class="xs" text-anchor="middle">替换为目标结果</text>
<rect x="486" y="378" width="96" height="44" rx="4" class="fred"/><text x="534" y="405" text-anchor="middle" class="s">表单</text>
<text x="534" y="444" class="xs" text-anchor="middle">作废</text>
<path d="M150 470H470" class="edge"/>
<text x="150" y="496" class="s">本轮前进 3 个 token（2 个接受 + 1 个替换），第 4 个是在错误前文之后猜的，丢弃</text>
<path d="M32 524H928" class="line"/>
<text x="32" y="556" class="s">每轮至少前进 1 个（第一个就猜错），至多 γ + 1 个（全部猜对，再加目标在最后位置给出的 1 个）。</text>
<text x="32" y="582" class="xs">猜对与否按接受规则判断；随机采样时以 min(1, p/q) 接受，被拒处从修正分布重采样，输出分布不变。</text>
</svg>
