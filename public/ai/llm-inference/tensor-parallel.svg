<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="580" viewBox="0 0 960 580" role="img" aria-labelledby="tensor-parallel-title tensor-parallel-desc" id="tensor-parallel-root">
<title id="tensor-parallel-title">张量并行切分 MLP</title>
<desc id="tensor-parallel-desc">两张 GPU 做张量并行：第一个矩阵按列切分，每张卡用完整输入算出一半中间结果，不需要通信；第二个矩阵按行切分，每张卡得到一份部分和，经 all-reduce 相加得到完整输出。每层注意力和 MLP 各一次 all-reduce。</desc>
<defs><style>
#tensor-parallel-root text { font-family: Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #172b3a; }
#tensor-parallel-root .h { font-size: 26px; font-weight: 700; }
#tensor-parallel-root .t { font-size: 19px; font-weight: 600; }
#tensor-parallel-root .s { font-size: 15px; fill: #475569; }
#tensor-parallel-root .xs { font-size: 13px; fill: #64748b; }
#tensor-parallel-root .k { font-size: 13px; font-weight: 700; letter-spacing: .04em; fill: #64748b; }
#tensor-parallel-root .m { font-family: 'SFMono-Regular', Menlo, Consolas, monospace; font-size: 14px; fill: #172b3a; }
#tensor-parallel-root .node { fill: #fff; stroke: #cbd5e1; stroke-width: 2; }
#tensor-parallel-root .blue { fill: #eff6ff; stroke: #60a5fa; stroke-width: 2; }
#tensor-parallel-root .green { fill: #ecfdf5; stroke: #20a28c; stroke-width: 2; }
#tensor-parallel-root .red { fill: #fff1f2; stroke: #e88191; stroke-width: 2; }
#tensor-parallel-root .amber { fill: #fffbeb; stroke: #e0a63a; stroke-width: 2; }
#tensor-parallel-root .violet { fill: #f5f3ff; stroke: #9b87f5; stroke-width: 2; }
#tensor-parallel-root .gray { fill: #f1f5f9; stroke: #cbd5e1; stroke-width: 2; }
#tensor-parallel-root .fblue { fill: #93c5fd; } #tensor-parallel-root .fgreen { fill: #6ee7b7; } #tensor-parallel-root .fred { fill: #fda4af; }
#tensor-parallel-root .famber { fill: #fcd34d; } #tensor-parallel-root .fviolet { fill: #c4b5fd; } #tensor-parallel-root .fgray { fill: #e2e8f0; }
#tensor-parallel-root .edge { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#tensor-parallel-arrow); }
#tensor-parallel-root .dash { fill: none; stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 7 6; marker-end: url(#tensor-parallel-arrow); }
#tensor-parallel-root .line { stroke: #cbd5e1; stroke-width: 1.5; fill: none; }
#tensor-parallel-root .axis { stroke: #64748b; stroke-width: 2; fill: none; }
</style><marker id="tensor-parallel-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker></defs>
<rect width="960" height="580" fill="#f8fafc"/>
<text x="32" y="46" class="h">张量并行：先按列切，再按行切，最后 all-reduce</text>
<text x="32" y="78" class="s">以两张 GPU 上的 MLP 为例；注意力层按头切分，结构相同。</text>
<g data-node="x"><rect x="32" y="230" width="150" height="110" rx="8" class="gray"/><text x="50" y="266" class="t">输入 X</text><text x="50" y="294" class="s">每张卡都有</text><text x="50" y="317" class="s">完整一份</text></g>
<g data-node="g0a"><rect x="232" y="130" width="210" height="120" rx="8" class="blue"/><text x="250" y="166" class="t">GPU 0：W₁ 左半列</text><text x="250" y="194" class="s">算出中间结果</text><text x="250" y="217" class="s">的前一半</text></g>
<g data-node="g1a"><rect x="232" y="320" width="210" height="120" rx="8" class="green"/><text x="250" y="356" class="t">GPU 1：W₁ 右半列</text><text x="250" y="384" class="s">算出中间结果</text><text x="250" y="407" class="s">的后一半</text></g>
<g data-node="g0b"><rect x="492" y="130" width="210" height="120" rx="8" class="blue"/><text x="510" y="166" class="t">GPU 0：W₂ 上半行</text><text x="510" y="194" class="s">得到部分和 Y₀</text></g>
<g data-node="g1b"><rect x="492" y="320" width="210" height="120" rx="8" class="green"/><text x="510" y="356" class="t">GPU 1：W₂ 下半行</text><text x="510" y="384" class="s">得到部分和 Y₁</text></g>
<g data-node="ar"><rect x="752" y="230" width="176" height="110" rx="8" class="amber"/><text x="770" y="266" class="t">all-reduce</text><text x="770" y="294" class="s">Y = Y₀ + Y₁</text><text x="770" y="317" class="s">需要卡间通信</text></g>
<path d="M182 270Q206 270 206 230Q206 190 232 190" class="edge"/>
<path d="M182 300Q206 300 206 340Q206 380 232 380" class="edge"/>
<path d="M442 190H492" class="edge"/>
<path d="M442 380H492" class="edge"/>
<rect x="440" y="158" width="64" height="26" rx="4" fill="#f8fafc"/><text x="446" y="176" class="s">无通信</text>
<rect x="440" y="348" width="64" height="26" rx="4" fill="#f8fafc"/><text x="446" y="366" class="s">无通信</text>
<path d="M702 190Q728 190 728 230Q728 262 752 262" class="edge"/>
<path d="M702 380Q728 380 728 340Q728 308 752 308" class="edge"/>
<text x="232" y="112" class="k">列切分（第一个矩阵）</text>
<text x="492" y="112" class="k">行切分（第二个矩阵）</text>
<path d="M32 474H928" class="line"/>
<text x="32" y="508" class="s">每层 2 次 all-reduce（注意力 1 次 + MLP 1 次）。70B 模型 80 层，每生成一个 token 要做 160 次。</text>
<text x="32" y="536" class="s">每次数据量不大但次数多，对延迟敏感，所以 TP 通常只在同一台机器内、有 NVLink 的 GPU 之间使用。</text>
</svg>
