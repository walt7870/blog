<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="556" viewBox="0 0 960 556" role="img" aria-labelledby="roofline-title roofline-desc" id="roofline-root">
<title id="roofline-title">H100 SXM 上的 Roofline 模型</title>
<desc id="roofline-desc">横轴是算术强度，纵轴是可达算力，均为对数刻度。斜坡由 3.35 TB/s 带宽决定，水平线是 989 TFLOPS 的峰值，平衡点约 295 FLOP/Byte。单请求 Decode 约 1，注意力读 KV 在个位数，批大小 64 的 Decode 约 64，都在斜坡上；2000 token 的 Prefill 约 2000，在水平线上。</desc>
<defs><style>
#roofline-root text { font-family: Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #172b3a; }
#roofline-root .h { font-size: 26px; font-weight: 700; }
#roofline-root .t { font-size: 19px; font-weight: 600; }
#roofline-root .s { font-size: 15px; fill: #475569; }
#roofline-root .xs { font-size: 13px; fill: #64748b; }
#roofline-root .k { font-size: 13px; font-weight: 700; letter-spacing: .04em; fill: #64748b; }
#roofline-root .m { font-family: 'SFMono-Regular', Menlo, Consolas, monospace; font-size: 14px; fill: #172b3a; }
#roofline-root .node { fill: #fff; stroke: #cbd5e1; stroke-width: 2; }
#roofline-root .blue { fill: #eff6ff; stroke: #60a5fa; stroke-width: 2; }
#roofline-root .green { fill: #ecfdf5; stroke: #20a28c; stroke-width: 2; }
#roofline-root .red { fill: #fff1f2; stroke: #e88191; stroke-width: 2; }
#roofline-root .amber { fill: #fffbeb; stroke: #e0a63a; stroke-width: 2; }
#roofline-root .violet { fill: #f5f3ff; stroke: #9b87f5; stroke-width: 2; }
#roofline-root .gray { fill: #f1f5f9; stroke: #cbd5e1; stroke-width: 2; }
#roofline-root .fblue { fill: #93c5fd; } #roofline-root .fgreen { fill: #6ee7b7; } #roofline-root .fred { fill: #fda4af; }
#roofline-root .famber { fill: #fcd34d; } #roofline-root .fviolet { fill: #c4b5fd; } #roofline-root .fgray { fill: #e2e8f0; }
#roofline-root .edge { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#roofline-arrow); }
#roofline-root .dash { fill: none; stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 7 6; marker-end: url(#roofline-arrow); }
#roofline-root .line { stroke: #cbd5e1; stroke-width: 1.5; fill: none; }
#roofline-root .axis { stroke: #64748b; stroke-width: 2; fill: none; }
</style><marker id="roofline-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker></defs>
<rect width="960" height="556" fill="#f8fafc"/>
<text x="32" y="46" class="h">Roofline：Decode 落在斜坡底部，Prefill 落在屋顶上</text>
<text x="32" y="78" class="s">示意图，各点位置按 989 TFLOPS 与 3.35 TB/s 计算，表示理论上限。</text>
<path d="M120 470H910" class="axis"/>
<path d="M120 470V110" class="axis"/>
<path d="M207 470V476" class="line"/><text x="207" y="496" class="xs" text-anchor="middle">1</text><path d="M380 470V476" class="line"/><text x="380" y="496" class="xs" text-anchor="middle">10</text><path d="M553 470V476" class="line"/><text x="553" y="496" class="xs" text-anchor="middle">100</text><path d="M727 470V476" class="line"/><text x="727" y="496" class="xs" text-anchor="middle">1000</text><path d="M900 470V476" class="line"/><text x="900" y="496" class="xs" text-anchor="middle">10000</text><path d="M114 442H120" class="line"/><text x="110" y="447" class="xs" text-anchor="end">1</text><path d="M114 347H120" class="line"/><text x="110" y="352" class="xs" text-anchor="end">10</text><path d="M114 253H120" class="line"/><text x="110" y="258" class="xs" text-anchor="end">100</text><path d="M114 158H120" class="line"/><text x="110" y="163" class="xs" text-anchor="end">1000</text>
<text x="900" y="524" class="xs" text-anchor="end">算术强度（FLOP/Byte，对数刻度）</text>
<text x="130" y="124" class="xs">可达算力（TFLOPS，对数刻度）</text>
<path d="M120 439L635 159H900" fill="none" stroke="#172b3a" stroke-width="3"/>
<path d="M635 159V470" class="line" stroke-dasharray="6 5"/>
<text x="643" y="458" class="xs">平衡点 ≈ 295</text>
<text x="643" y="147" class="s">峰值 989 TFLOPS</text>
<text x="259" y="313" class="s" text-anchor="end">带宽 3.35 TB/s</text>
<text x="259" y="333" class="s" text-anchor="end">决定斜坡</text>
<text x="537" y="420" class="t" text-anchor="middle">访存受限</text>
<text x="796" y="420" class="t" text-anchor="middle">计算受限</text>
<circle cx="207" cy="392" r="7" class="fred"/>
<circle cx="311" cy="335" r="7" class="famber"/>
<circle cx="520" cy="221" r="7" class="fblue"/>
<circle cx="779" cy="159" r="7" class="fgreen"/>
<text x="223" y="422" class="s">Decode 批大小 1：≈1</text>
<text x="327" y="365" class="s">注意力读 KV：个位数</text>
<text x="504" y="207" class="s" text-anchor="end">Decode 批大小 64：≈64</text>
<text x="779" y="189" class="s" text-anchor="middle">Prefill 2000 token：≈2000</text>
</svg>
