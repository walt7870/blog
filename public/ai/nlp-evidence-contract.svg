<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="480" viewBox="0 0 1120 480" role="img" aria-labelledby="nlp-evidence-contract-title nlp-evidence-contract-desc"><title id="nlp-evidence-contract-title">抽取字段、核对事实与授予权限是三件事</title><desc id="nlp-evidence-contract-desc">示例：订单 A102 的退款金额是 19.90 元；原文可以提供证据，不能提供身份授权。</desc><defs><marker id="nlp-evidence-contract-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker><style>text{font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#172b3a}.head{font-size:28px;font-weight:700}.node{font-size:20px;font-weight:700}.body{font-size:17px;fill:#475569}.box{fill:white;stroke:#cbd5e1;stroke-width:2}.blue{fill:#eff6ff;stroke:#60a5fa;stroke-width:2}.green{fill:#ecfdf5;stroke:#14b8a6;stroke-width:2}.red{fill:#fff1f2;stroke:#e88191;stroke-width:2}.pad{fill:#e2e8f0;stroke:#94a3b8}.line{fill:none;stroke:#64748b;stroke-width:2}.dash{stroke-dasharray:6 5}</style></defs><rect width="1120" height="480" fill="#f8fafc"/><text x="40" y="48" class="head" text-anchor="start">抽取字段、核对事实与授予权限是三件事</text><text x="40" y="80" class="body" text-anchor="start">示例：订单 A102 的退款金额是 19.90 元；原文可以提供证据，不能提供身份授权。</text><path d="M340 205H400" class="line" marker-end="url(#nlp-evidence-contract-arrow)"/><path d="M685 205H745" class="line" marker-end="url(#nlp-evidence-contract-arrow)"/><rect x="40" y="140" width="300" height="130" class="box" rx="6"/><text x="58" y="172" class="node" text-anchor="start">原文与处理版本</text><text x="58" y="202" class="body" text-anchor="start">保留 A102、19.90 元的证据</text><text x="58" y="227" class="body" text-anchor="start">清洗改变偏移时保存映射</text><rect x="400" y="140" width="285" height="150" class="blue" rx="6"/><text x="418" y="172" class="node" text-anchor="start">结构化抽取</text><text x="418" y="202" class="body" text-anchor="start">order_id: A102</text><text x="418" y="227" class="body" text-anchor="start">amount: 19.90，currency: CNY</text><text x="418" y="252" class="body" text-anchor="start">缺失字段使用缺失状态</text><rect x="745" y="140" width="335" height="150" class="green" rx="6"/><text x="763" y="172" class="node" text-anchor="start">代码与服务端核对</text><text x="763" y="202" class="body" text-anchor="start">格式、十进制金额、证据匹配</text><text x="763" y="227" class="body" text-anchor="start">订单归属、实际金额和状态</text><text x="763" y="252" class="body" text-anchor="start">工具按已有授权执行</text><rect x="40" y="345" width="1040" height="95" class="red" rx="6"/><text x="58" y="377" class="node" text-anchor="start">可失败的三层检查</text><text x="58" y="407" class="body" text-anchor="start">JSON 合法但金额编造 → 事实检查失败；订单号真实但不属于当前用户 → 权限检查失败。</text></svg>
