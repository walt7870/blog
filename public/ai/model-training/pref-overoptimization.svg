<g data-node="ovn"><rect x="880" y="140" width="328" height="300" rx="8" class="amber"/><text x="898" y="166" class="k">奖励过度优化</text><text x="898" y="192" class="t">读图</text><text x="898" y="220" class="s">训练只看得见紫线（奖励模型）</text><text x="898" y="243" class="s">真正想要的是绿线（人的判断）</text><text x="898" y="266" class="s">越过峰值后分数还在涨，</text><text x="898" y="289" class="s">回答却在变差：变长、讨好、</text><text x="898" y="312" class="s">套话、过度承诺</text><text x="898" y="335" class="s">KL 惩罚和提前停止，都是为了</text><text x="898" y="358" class="s">停在峰值附近</text></g>
</svg>
