<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="500" viewBox="0 0 1240 500" role="img" aria-labelledby="pref-overoptimization-title pref-overoptimization-desc" id="pref-overoptimization-root">
<title id="pref-overoptimization-title">奖励过度优化的示意曲线</title>
<desc id="pref-overoptimization-desc">横轴是策略离初始模型的距离（KL 的平方根），紫色代理奖励随训练一直上涨，绿色真实质量先升后降，峰值之后继续优化代理奖励反而让真实质量变差。曲线形式取自 Gao 等 2022 的 RL 拟合式，系数为示意。</desc>
<defs><style>
#pref-overoptimization-root text { font-family: Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #172b3a; }
#pref-overoptimization-root .h { font-size: 26px; font-weight: 700; }
#pref-overoptimization-root .t { font-size: 19px; font-weight: 600; }
#pref-overoptimization-root .s { font-size: 15px; fill: #475569; }
#pref-overoptimization-root .xs { font-size: 13px; fill: #64748b; }
#pref-overoptimization-root .k { font-size: 13px; font-weight: 700; letter-spacing: .04em; fill: #64748b; }
#pref-overoptimization-root .m { font-family: 'SFMono-Regular', Menlo, Consolas, monospace; font-size: 14px; fill: #172b3a; }
#pref-overoptimization-root .node { fill: #fff; stroke: #cbd5e1; stroke-width: 2; }
#pref-overoptimization-root .blue { fill: #eff6ff; stroke: #60a5fa; stroke-width: 2; }
#pref-overoptimization-root .green { fill: #ecfdf5; stroke: #20a28c; stroke-width: 2; }
#pref-overoptimization-root .red { fill: #fff1f2; stroke: #e88191; stroke-width: 2; }
#pref-overoptimization-root .amber { fill: #fffbeb; stroke: #e0a63a; stroke-width: 2; }
#pref-overoptimization-root .violet { fill: #f5f3ff; stroke: #9b87f5; stroke-width: 2; }
#pref-overoptimization-root .gray { fill: #f1f5f9; stroke: #cbd5e1; stroke-width: 2; }
#pref-overoptimization-root .fblue { fill: #93c5fd; } #pref-overoptimization-root .fgreen { fill: #6ee7b7; } #pref-overoptimization-root .fred { fill: #fda4af; }
#pref-overoptimization-root .famber { fill: #fcd34d; } #pref-overoptimization-root .fviolet { fill: #c4b5fd; } #pref-overoptimization-root .fgray { fill: #e2e8f0; }
#pref-overoptimization-root .edge { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#pref-overoptimization-arrow); }
#pref-overoptimization-root .dash { fill: none; stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 7 6; marker-end: url(#pref-overoptimization-arrow); }
#pref-overoptimization-root .line { stroke: #cbd5e1; stroke-width: 1.5; fill: none; }
#pref-overoptimization-root .axis { stroke: #64748b; stroke-width: 2; fill: none; }
</style><marker id="pref-overoptimization-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker></defs>
<rect width="1240" height="500" fill="#f8fafc"/>
<text x="32" y="46" class="h">奖励模型的分数一直涨，真实质量却先升后降</text>
<text x="32" y="78" class="s">曲线形式 R(d) = d(α − β·ln d) 取自 Gao 等 2022 的强化学习拟合式；系数为示意，不对应具体模型。</text>
