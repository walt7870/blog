<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="630" viewBox="0 0 1240 630" role="img" aria-labelledby="pref-rlhf-vs-dpo-title pref-rlhf-vs-dpo-desc" id="pref-rlhf-vs-dpo-root">
<title id="pref-rlhf-vs-dpo-title">RLHF 与 DPO 两条偏好对齐流程对比</title>
<desc id="pref-rlhf-vs-dpo-desc">RLHF 从 SFT 模型和偏好数据出发，先训练奖励模型，再用 PPO 让策略在线生成并追求高分，同时用 KL 惩罚拉住与参考模型的距离，训练中需要四个模型。DPO 用同样的偏好数据和参考模型，直接用一个分类式损失提高好回答相对差回答的概率比，只需两个模型、不在线生成。</desc>
<defs><style>
#pref-rlhf-vs-dpo-root text { font-family: Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #172b3a; }
#pref-rlhf-vs-dpo-root .h { font-size: 26px; font-weight: 700; }
#pref-rlhf-vs-dpo-root .t { font-size: 19px; font-weight: 600; }
#pref-rlhf-vs-dpo-root .s { font-size: 15px; fill: #475569; }
#pref-rlhf-vs-dpo-root .xs { font-size: 13px; fill: #64748b; }
#pref-rlhf-vs-dpo-root .k { font-size: 13px; font-weight: 700; letter-spacing: .04em; fill: #64748b; }
#pref-rlhf-vs-dpo-root .m { font-family: 'SFMono-Regular', Menlo, Consolas, monospace; font-size: 14px; fill: #172b3a; }
#pref-rlhf-vs-dpo-root .node { fill: #fff; stroke: #cbd5e1; stroke-width: 2; }
#pref-rlhf-vs-dpo-root .blue { fill: #eff6ff; stroke: #60a5fa; stroke-width: 2; }
#pref-rlhf-vs-dpo-root .green { fill: #ecfdf5; stroke: #20a28c; stroke-width: 2; }
#pref-rlhf-vs-dpo-root .red { fill: #fff1f2; stroke: #e88191; stroke-width: 2; }
#pref-rlhf-vs-dpo-root .amber { fill: #fffbeb; stroke: #e0a63a; stroke-width: 2; }
#pref-rlhf-vs-dpo-root .violet { fill: #f5f3ff; stroke: #9b87f5; stroke-width: 2; }
#pref-rlhf-vs-dpo-root .gray { fill: #f1f5f9; stroke: #cbd5e1; stroke-width: 2; }
#pref-rlhf-vs-dpo-root .fblue { fill: #93c5fd; } #pref-rlhf-vs-dpo-root .fgreen { fill: #6ee7b7; } #pref-rlhf-vs-dpo-root .fred { fill: #fda4af; }
#pref-rlhf-vs-dpo-root .famber { fill: #fcd34d; } #pref-rlhf-vs-dpo-root .fviolet { fill: #c4b5fd; } #pref-rlhf-vs-dpo-root .fgray { fill: #e2e8f0; }
#pref-rlhf-vs-dpo-root .edge { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#pref-rlhf-vs-dpo-arrow); }
#pref-rlhf-vs-dpo-root .dash { fill: none; stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 7 6; marker-end: url(#pref-rlhf-vs-dpo-arrow); }
#pref-rlhf-vs-dpo-root .line { stroke: #cbd5e1; stroke-width: 1.5; fill: none; }
#pref-rlhf-vs-dpo-root .axis { stroke: #64748b; stroke-width: 2; fill: none; }
</style><marker id="pref-rlhf-vs-dpo-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker></defs>
<rect width="1240" height="630" fill="#f8fafc"/>
<text x="32" y="46" class="h">同样的偏好数据，两条路：RLHF 先学打分器再追分，DPO 直接改概率</text>
<text x="32" y="78" class="s">两条路的起点都是 SFT 模型，都用 KL（或 β）把新模型拴在参考模型附近。</text>
<g data-node="lane1"><rect x="32" y="112" width="1176" height="250" rx="8" class="node"/><text x="50" y="138" class="k">RLHF（InstructGPT 流程）：先学一个打分器，再用强化学习追分</text></g>
<g data-node="sft1"><rect x="56" y="160" width="170" height="110" rx="8" class="gray"/><text x="74" y="196" class="t">SFT 模型</text><text x="74" y="224" class="s">起点，也作参考模型</text></g>
<g data-node="pairs1"><rect x="256" y="160" width="190" height="110" rx="8" class="amber"/><text x="274" y="196" class="t">偏好数据</text><text x="274" y="224" class="s">同一问题的回答</text><text x="274" y="247" class="s">排序或两两比较</text></g>
<g data-node="rm"><rect x="476" y="160" width="200" height="110" rx="8" class="violet"/><text x="494" y="196" class="t">奖励模型</text><text x="494" y="224" class="s">Bradley–Terry 损失</text><text x="494" y="247" class="s">输出一个分数</text></g>
<g data-node="ppo"><rect x="706" y="150" width="290" height="130" rx="8" class="blue"/><text x="724" y="186" class="t">PPO 循环</text><text x="724" y="214" class="s">策略生成回答 → 奖励模型打分</text><text x="724" y="237" class="s">分数 − β·KL(策略‖参考)</text><text x="724" y="260" class="s">还需要一个价值模型估基线</text></g>
<g data-node="out1"><rect x="1026" y="160" width="160" height="110" rx="8" class="green"/><text x="1044" y="196" class="t">对齐模型</text><text x="1044" y="224" class="s"></text></g>
<path d="M226 215H256" class="edge"/>
<path d="M446 215H476" class="edge"/>
<path d="M676 215H706" class="edge"/>
<path d="M996 215H1026" class="edge"/>
<text x="56" y="330" class="s">训练时同时在显存里：策略、参考、奖励、价值 4 个模型；需要在线生成回答，奖励模型可能被钻空子</text>
<g data-node="lane2"><rect x="32" y="386" width="1176" height="220" rx="8" class="node"/><text x="50" y="412" class="k">DPO：把“打分器 + 强化学习”化成一个分类式损失</text></g>
<g data-node="sft2"><rect x="56" y="434" width="170" height="110" rx="8" class="gray"/><text x="74" y="470" class="t">SFT 模型</text><text x="74" y="498" class="s">起点，也作参考模型</text></g>
<g data-node="pairs2"><rect x="256" y="434" width="190" height="110" rx="8" class="amber"/><text x="274" y="470" class="t">偏好数据</text><text x="274" y="498" class="s">(问题, 好回答, 差回答)</text></g>
<g data-node="dpo"><rect x="476" y="424" width="520" height="130" rx="8" class="blue"/><text x="494" y="460" class="t">DPO 损失</text><text x="494" y="488" class="s">比较策略与参考对两个回答的对数概率比</text><text x="494" y="511" class="s">好回答的比值要比差回答高，β 控制离参考多远</text><text x="494" y="534" class="s">不训练奖励模型、训练中不生成回答</text></g>
<g data-node="out2"><rect x="1026" y="434" width="160" height="110" rx="8" class="green"/><text x="1044" y="470" class="t">对齐模型</text><text x="1044" y="498" class="s"></text></g>
<path d="M226 489H256" class="edge"/>
<path d="M446 489H476" class="edge"/>
<path d="M996 489H1026" class="edge"/>
<text x="56" y="584" class="s">训练时只需策略和参考 2 个模型（参考的对数概率可预先算好）；数据是离线固定的</text>
</svg>
