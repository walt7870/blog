<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="merge-task-vectors-title merge-task-vectors-desc" id="merge-task-vectors-root">
<title id="merge-task-vectors-title">任务向量与 TIES 合并：同一底座上的两次微调怎样合成一个模型</title>
<desc id="merge-task-vectors-desc">左：同一个底座 W0 分别微调成“条款格式”模型 A 和“加班费计算”模型 B，任务向量 τA = A − W0、τB = B − W0，合并模型为 W0 + λ(τA + τB)。不同底座的权重坐标互不对应，不能这样相加。右：6 个参数的示意数值，直接平均时 p3 上 +0.5 和 −0.7 相互抵消成 −0.1；TIES 先修剪每个向量里变化小的参数，再按多数选符号，只平均符号一致的值，p3 保留 −0.7。</desc>
<defs><style>
#merge-task-vectors-root text { font-family: Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #172b3a; }
#merge-task-vectors-root .h { font-size: 26px; font-weight: 700; }
#merge-task-vectors-root .t { font-size: 19px; font-weight: 600; }
#merge-task-vectors-root .s { font-size: 15px; fill: #475569; }
#merge-task-vectors-root .xs { font-size: 13px; fill: #64748b; }
#merge-task-vectors-root .k { font-size: 13px; font-weight: 700; letter-spacing: .04em; fill: #64748b; }
#merge-task-vectors-root .m { font-family: 'SFMono-Regular', Menlo, Consolas, monospace; font-size: 14px; fill: #172b3a; }
#merge-task-vectors-root .node { fill: #fff; stroke: #cbd5e1; stroke-width: 2; }
#merge-task-vectors-root .blue { fill: #eff6ff; stroke: #60a5fa; stroke-width: 2; }
#merge-task-vectors-root .green { fill: #ecfdf5; stroke: #20a28c; stroke-width: 2; }
#merge-task-vectors-root .red { fill: #fff1f2; stroke: #e88191; stroke-width: 2; }
#merge-task-vectors-root .amber { fill: #fffbeb; stroke: #e0a63a; stroke-width: 2; }
#merge-task-vectors-root .violet { fill: #f5f3ff; stroke: #9b87f5; stroke-width: 2; }
#merge-task-vectors-root .gray { fill: #f1f5f9; stroke: #cbd5e1; stroke-width: 2; }
#merge-task-vectors-root .fblue { fill: #93c5fd; } #merge-task-vectors-root .fgreen { fill: #6ee7b7; } #merge-task-vectors-root .fred { fill: #fda4af; }
#merge-task-vectors-root .famber { fill: #fcd34d; } #merge-task-vectors-root .fviolet { fill: #c4b5fd; } #merge-task-vectors-root .fgray { fill: #e2e8f0; }
#merge-task-vectors-root .edge { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#merge-task-vectors-arrow); }
#merge-task-vectors-root .dash { fill: none; stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 7 6; marker-end: url(#merge-task-vectors-arrow); }
#merge-task-vectors-root .line { stroke: #cbd5e1; stroke-width: 1.5; fill: none; }
#merge-task-vectors-root .axis { stroke: #64748b; stroke-width: 2; fill: none; }
</style><marker id="merge-task-vectors-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker></defs>
<rect width="1200" height="620" fill="#f8fafc"/>
<text x="32" y="46" class="h">合并的是“相对底座改了什么”</text>
<text x="32" y="78" class="s">左：权重空间里的示意几何。右：6 个参数的示意数值，比较直接平均与 TIES。</text>
<g data-node="geo"><rect x="32" y="104" width="500" height="490" rx="8" class="node"/><text x="50" y="130" class="k">同一底座出发的两次微调</text></g>
<circle cx="140" cy="440" r="9" fill="#172b3a"/>
<text x="120" y="474" class="s">W0 底座</text>
<circle cx="420" cy="400" r="9" fill="#60a5fa"/>
<text x="330" y="432" class="s">A：条款格式</text>
<circle cx="200" cy="200" r="9" fill="#20a28c"/>
<text x="214" y="196" class="s">B：加班费计算</text>
<circle cx="440" cy="190" r="10" fill="#e0a63a"/>
<text x="330" y="168" class="m">W0 + λ(τA+τB)</text>
<path d="M148 437L410 402" class="edge"/>
<text x="250" y="445" class="m">τA</text>
<path d="M143 431L196 212" class="edge"/>
<text x="140" y="320" class="m">τB</text>
<path d="M147 433L432 198" class="dash"/>
<path d="M56 528H508" class="line"/>
<text x="56" y="558" class="xs">另一个底座 W0′ 的参数坐标和 W0 不对应，</text>
<text x="56" y="580" class="xs">把它的 τ 加到 W0 上只会得到噪声。</text>
<text x="560" y="186" class="s">τA 条款格式</text><rect x="700" y="160" width="68" height="38" rx="4" class="fblue"/><text x="734" y="184" text-anchor="middle" class="s">+0.8</text><rect x="776" y="160" width="68" height="38" rx="4" class="fblue"/><text x="810" y="184" text-anchor="middle" class="s">−0.1</text><rect x="852" y="160" width="68" height="38" rx="4" class="fblue"/><text x="886" y="184" text-anchor="middle" class="s">+0.5</text><rect x="928" y="160" width="68" height="38" rx="4" class="fblue"/><text x="962" y="184" text-anchor="middle" class="s">+0.02</text><rect x="1004" y="160" width="68" height="38" rx="4" class="fblue"/><text x="1038" y="184" text-anchor="middle" class="s">−0.6</text><rect x="1080" y="160" width="68" height="38" rx="4" class="fblue"/><text x="1114" y="184" text-anchor="middle" class="s">+0.3</text><text x="560" y="238" class="s">τB 加班费计算</text><rect x="700" y="212" width="68" height="38" rx="4" class="fgreen"/><text x="734" y="236" text-anchor="middle" class="s">+0.6</text><rect x="776" y="212" width="68" height="38" rx="4" class="fgreen"/><text x="810" y="236" text-anchor="middle" class="s">+0.4</text><rect x="852" y="212" width="68" height="38" rx="4" class="fgreen"/><text x="886" y="236" text-anchor="middle" class="s">−0.7</text><rect x="928" y="212" width="68" height="38" rx="4" class="fgreen"/><text x="962" y="236" text-anchor="middle" class="s">−0.01</text><rect x="1004" y="212" width="68" height="38" rx="4" class="fgreen"/><text x="1038" y="236" text-anchor="middle" class="s">−0.5</text><rect x="1080" y="212" width="68" height="38" rx="4" class="fgreen"/><text x="1114" y="236" text-anchor="middle" class="s">+0.04</text><text x="560" y="290" class="s">直接平均</text><rect x="700" y="264" width="68" height="38" rx="4" class="fgray"/><text x="734" y="288" text-anchor="middle" class="s">+0.7</text><rect x="776" y="264" width="68" height="38" rx="4" class="fgray"/><text x="810" y="288" text-anchor="middle" class="s">+0.15</text><rect x="852" y="264" width="68" height="38" rx="4" class="fgray"/><text x="886" y="288" text-anchor="middle" class="s">−0.1</text><rect x="928" y="264" width="68" height="38" rx="4" class="fgray"/><text x="962" y="288" text-anchor="middle" class="s">+0.005</text><rect x="1004" y="264" width="68" height="38" rx="4" class="fgray"/><text x="1038" y="288" text-anchor="middle" class="s">−0.55</text><rect x="1080" y="264" width="68" height="38" rx="4" class="fgray"/><text x="1114" y="288" text-anchor="middle" class="s">+0.17</text><text x="560" y="342" class="s">① 修剪后 τA</text><rect x="700" y="316" width="68" height="38" rx="4" class="fblue"/><text x="734" y="340" text-anchor="middle" class="s">+0.8</text><rect x="776" y="316" width="68" height="38" rx="4" class="gray"/><text x="810" y="340" text-anchor="middle" class="s">0</text><rect x="852" y="316" width="68" height="38" rx="4" class="fblue"/><text x="886" y="340" text-anchor="middle" class="s">+0.5</text><rect x="928" y="316" width="68" height="38" rx="4" class="gray"/><text x="962" y="340" text-anchor="middle" class="s">0</text><rect x="1004" y="316" width="68" height="38" rx="4" class="fblue"/><text x="1038" y="340" text-anchor="middle" class="s">−0.6</text><rect x="1080" y="316" width="68" height="38" rx="4" class="gray"/><text x="1114" y="340" text-anchor="middle" class="s">0</text><text x="560" y="394" class="s">① 修剪后 τB</text><rect x="700" y="368" width="68" height="38" rx="4" class="fgreen"/><text x="734" y="392" text-anchor="middle" class="s">+0.6</text><rect x="776" y="368" width="68" height="38" rx="4" class="gray"/><text x="810" y="392" text-anchor="middle" class="s">0</text><rect x="852" y="368" width="68" height="38" rx="4" class="fgreen"/><text x="886" y="392" text-anchor="middle" class="s">−0.7</text><rect x="928" y="368" width="68" height="38" rx="4" class="gray"/><text x="962" y="392" text-anchor="middle" class="s">0</text><rect x="1004" y="368" width="68" height="38" rx="4" class="fgreen"/><text x="1038" y="392" text-anchor="middle" class="s">−0.5</text><rect x="1080" y="368" width="68" height="38" rx="4" class="gray"/><text x="1114" y="392" text-anchor="middle" class="s">0</text><text x="560" y="446" class="s">② 选定符号</text><rect x="700" y="420" width="68" height="38" rx="4" class="fgray"/><text x="734" y="444" text-anchor="middle" class="s">+</text><rect x="776" y="420" width="68" height="38" rx="4" class="fgray"/><text x="810" y="444" text-anchor="middle" class="s">·</text><rect x="852" y="420" width="68" height="38" rx="4" class="fgray"/><text x="886" y="444" text-anchor="middle" class="s">−</text><rect x="928" y="420" width="68" height="38" rx="4" class="fgray"/><text x="962" y="444" text-anchor="middle" class="s">·</text><rect x="1004" y="420" width="68" height="38" rx="4" class="fgray"/><text x="1038" y="444" text-anchor="middle" class="s">−</text><rect x="1080" y="420" width="68" height="38" rx="4" class="fgray"/><text x="1114" y="444" text-anchor="middle" class="s">·</text><text x="560" y="498" class="s">③ TIES 结果</text><rect x="700" y="472" width="68" height="38" rx="4" class="famber"/><text x="734" y="496" text-anchor="middle" class="s">+0.7</text><rect x="776" y="472" width="68" height="38" rx="4" class="gray"/><text x="810" y="496" text-anchor="middle" class="s">0</text><rect x="852" y="472" width="68" height="38" rx="4" class="famber"/><text x="886" y="496" text-anchor="middle" class="s">−0.7</text><rect x="928" y="472" width="68" height="38" rx="4" class="gray"/><text x="962" y="496" text-anchor="middle" class="s">0</text><rect x="1004" y="472" width="68" height="38" rx="4" class="famber"/><text x="1038" y="496" text-anchor="middle" class="s">−0.55</text><rect x="1080" y="472" width="68" height="38" rx="4" class="gray"/><text x="1114" y="496" text-anchor="middle" class="s">0</text><text x="734" y="148" class="xs" text-anchor="middle">p1</text><text x="810" y="148" class="xs" text-anchor="middle">p2</text><text x="886" y="148" class="xs" text-anchor="middle">p3</text><text x="962" y="148" class="xs" text-anchor="middle">p4</text><text x="1038" y="148" class="xs" text-anchor="middle">p5</text><text x="1114" y="148" class="xs" text-anchor="middle">p6</text>
<text x="560" y="548" class="xs">p3：直接平均 +0.5 与 −0.7 互相抵消成 −0.1；TIES 按总和 −0.2 选负号，只保留 −0.7。</text>
<text x="560" y="572" class="xs">修剪：每个向量只留绝对值最大的 3 个；结果最后再乘系数 λ 加回底座。</text>
</svg>
