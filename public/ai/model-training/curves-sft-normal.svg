<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="620" viewBox="0 0 1320 620" role="img" aria-labelledby="curves-sft-normal-title curves-sft-normal-desc" id="curves-sft-normal-root">
<title id="curves-sft-normal-title">资料助手 SFT 的示意训练曲线</title>
<desc id="curves-sft-normal-desc">示意曲线，非真实日志：训练 3 轮，训练 loss 在每轮开头阶梯式下降；验证 loss 在第 2 轮末最低，第 3 轮回升，说明开始过拟合，应选第 2 轮末的检查点。右侧为预热加余弦衰减的学习率，以及开头偏大后稳定的梯度范数。</desc>
