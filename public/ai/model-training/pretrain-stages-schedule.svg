<text x="191.4" y="130" class="xs">预热</text>
<text x="150" y="270" class="s">蓝实线：余弦调度（Llama 3 用）</text>
<text x="150" y="296" class="s">绿虚线：WSD，预热—稳定—衰减</text>
<text x="1030" y="235" class="xs" text-anchor="end">最后约 10% 快速衰减</text>
<g data-node="main"><rect x="32" y="380" width="600" height="230" rx="8" class="blue"/><text x="50" y="406" class="k">最长、最贵</text><text x="50" y="432" class="t">① 主训练</text><text x="50" y="460" class="s">约 15T token（旗舰 15.6T）</text><text x="50" y="483" class="s">序列 4K → 8K，批大小 4M → 16M token</text><text x="50" y="506" class="s">lr 预热 8000 步后余弦下降（405B）</text><text x="50" y="529" class="s">配比：通用 50% · 数学推理 25%</text><text x="50" y="552" class="s">代码 17% · 多语言 8%</text></g>
<g data-node="long"><rect x="656" y="380" width="260" height="230" rx="8" class="violet"/><text x="674" y="416" class="t">② 长上下文</text><text x="674" y="444" class="s">6 个阶段</text><text x="674" y="467" class="s">8K 逐步到 128K</text><text x="674" y="490" class="s">约 800B token</text><text x="674" y="513" class="s">每段确认短文本能力</text><text x="674" y="536" class="s">恢复、长文本找得到</text></g>
<g data-node="anneal"><rect x="940" y="380" width="228" height="230" rx="8" class="amber"/><text x="958" y="416" class="t">③ 退火</text><text x="958" y="444" class="s">最后 40M token</text><text x="958" y="467" class="s">lr 线性降到 0</text><text x="958" y="490" class="s">上采样高质量数据</text><text x="958" y="513" class="s">不含基准训练集</text></g>
<path d="M632 495H656" class="edge"/>
<path d="M916 495H940" class="edge"/>
<text x="32" y="650" class="xs">RoPE base 一开始就设为 500,000，为后面拉长上下文留余地。退火对 8B 的 GSM8k、MATH 验证集分别提升 24.0% 和 6.4%，对 405B 几乎没有提升。</text>
</svg>
