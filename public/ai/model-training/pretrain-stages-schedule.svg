#pretrain-stages-root .axis { stroke: #64748b; stroke-width: 2; fill: none; }
</style><marker id="pretrain-stages-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker></defs>
<rect width="1200" height="700" fill="#f8fafc"/>
<text x="32" y="46" class="h">学习率怎样走，数据怎样换</text>
<text x="32" y="78" class="s">上：两种学习率调度的形状（示意）。下：Llama 3 论文公布的预训练阶段，宽度不按 token 比例。</text>
<path d="M120 130V330H1150" class="axis"/>
