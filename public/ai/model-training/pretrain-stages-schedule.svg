#pretrain-stages-root .violet { fill: #f5f3ff; stroke: #9b87f5; stroke-width: 2; }
#pretrain-stages-root .gray { fill: #f1f5f9; stroke: #cbd5e1; stroke-width: 2; }
#pretrain-stages-root .fblue { fill: #93c5fd; } #pretrain-stages-root .fgreen { fill: #6ee7b7; } #pretrain-stages-root .fred { fill: #fda4af; }
#pretrain-stages-root .famber { fill: #fcd34d; } #pretrain-stages-root .fviolet { fill: #c4b5fd; } #pretrain-stages-root .fgray { fill: #e2e8f0; }
#pretrain-stages-root .edge { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#pretrain-stages-arrow); }
