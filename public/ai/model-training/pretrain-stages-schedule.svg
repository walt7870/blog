<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="pretrain-stages-title pretrain-stages-desc" id="pretrain-stages-root">
<title id="pretrain-stages-title">预训练的学习率调度与 Llama 3 的三个训练阶段</title>
<desc id="pretrain-stages-desc">上半部分：两种常见学习率曲线的示意，余弦调度预热后一路平滑下降；WSD 调度预热后长时间保持不变，最后约 10% 的 token 快速衰减。下半部分：Llama 3 的预训练分三段，主训练约 15T token、余弦学习率、按通用知识 50% 数学推理 25% 代码 17% 多语言 8% 配比；长上下文扩展分 6 个阶段从 8K 到 128K，约 800B token；退火阶段在最后 40M token 把学习率线性降到 0，并上采样高质量数据。</desc>
