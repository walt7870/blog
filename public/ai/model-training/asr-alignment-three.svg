<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1340" height="800" viewBox="0 0 1340 800" role="img" aria-labelledby="asr-alignment-three-title asr-alignment-three-desc" id="asr-alignment-three-root">
<title id="asr-alignment-three-title">CTC、Transducer、注意力编解码三种对齐方式</title>
<desc id="asr-alignment-three-desc">CTC 在每帧输出一个字或 blank，合并重复再删 blank 得到文本，帧间条件独立；Transducer 用编码器、预测网络和 joiner，每帧可以输出零个或多个字，输出依赖已写出的字，适合流式；注意力编解码先编码整段音频，再由解码器用交叉注意力逐字生成。</desc>
<defs><style>
#asr-alignment-three-root text { font-family: Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #172b3a; }
#asr-alignment-three-root .h { font-size: 26px; font-weight: 700; }
#asr-alignment-three-root .t { font-size: 19px; font-weight: 600; }
#asr-alignment-three-root .s { font-size: 15px; fill: #475569; }
#asr-alignment-three-root .xs { font-size: 13px; fill: #64748b; }
#asr-alignment-three-root .k { font-size: 13px; font-weight: 700; letter-spacing: .04em; fill: #64748b; }
#asr-alignment-three-root .m { font-family: 'SFMono-Regular', Menlo, Consolas, monospace; font-size: 14px; fill: #172b3a; }
#asr-alignment-three-root .node { fill: #fff; stroke: #cbd5e1; stroke-width: 2; }
#asr-alignment-three-root .blue { fill: #eff6ff; stroke: #60a5fa; stroke-width: 2; }
#asr-alignment-three-root .green { fill: #ecfdf5; stroke: #20a28c; stroke-width: 2; }
#asr-alignment-three-root .red { fill: #fff1f2; stroke: #e88191; stroke-width: 2; }
#asr-alignment-three-root .amber { fill: #fffbeb; stroke: #e0a63a; stroke-width: 2; }
#asr-alignment-three-root .violet { fill: #f5f3ff; stroke: #9b87f5; stroke-width: 2; }
#asr-alignment-three-root .gray { fill: #f1f5f9; stroke: #cbd5e1; stroke-width: 2; }
#asr-alignment-three-root .fblue { fill: #93c5fd; } #asr-alignment-three-root .fgreen { fill: #6ee7b7; } #asr-alignment-three-root .fred { fill: #fda4af; }
#asr-alignment-three-root .famber { fill: #fcd34d; } #asr-alignment-three-root .fviolet { fill: #c4b5fd; } #asr-alignment-three-root .fgray { fill: #e2e8f0; }
#asr-alignment-three-root .edge { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#asr-alignment-three-arrow); }
#asr-alignment-three-root .dash { fill: none; stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 7 6; marker-end: url(#asr-alignment-three-arrow); }
#asr-alignment-three-root .line { stroke: #cbd5e1; stroke-width: 1.5; fill: none; }
#asr-alignment-three-root .axis { stroke: #64748b; stroke-width: 2; fill: none; }
</style><marker id="asr-alignment-three-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker></defs>
<rect width="1340" height="800" fill="#f8fafc"/>
<text x="32" y="46" class="h">同一句“年假怎么申请”，三种方法怎样把帧和字对上</text>
<text x="32" y="78" class="s">前两种在训练时对所有可能的对齐求和，第三种让注意力自己学会去哪里听</text>
<g data-node="ctc"><rect x="32" y="108" width="412" height="664" rx="8" class="node"/><text x="50" y="134" class="k">CTC：每帧各自出一个符号</text></g><g data-node="rnnt"><rect x="464" y="108" width="412" height="664" rx="8" class="node"/><text x="482" y="134" class="k">Transducer：每帧可吐 0 到多个字</text></g><g data-node="aed"><rect x="896" y="108" width="412" height="664" rx="8" class="node"/><text x="914" y="134" class="k">注意力编解码：先听完，再逐字写</text></g><text x="52" y="162" class="xs">编码器帧（只画 12 帧）</text><rect x="52" y="174" width="26" height="26" rx="4" class="fgray"/><rect x="52" y="210" width="26" height="30" rx="4" class="fblue"/><text x="65" y="230" text-anchor="middle" class="s">年</text><rect x="82" y="174" width="26" height="26" rx="4" class="fgray"/><rect x="82" y="210" width="26" height="30" rx="4" class="fblue"/><text x="95" y="230" text-anchor="middle" class="s">年</text><rect x="112" y="174" width="26" height="26" rx="4" class="fgray"/><rect x="112" y="210" width="26" height="30" rx="4" class="fgray"/><text x="125" y="230" text-anchor="middle" class="s">_</text><rect x="142" y="174" width="26" height="26" rx="4" class="fgray"/><rect x="142" y="210" width="26" height="30" rx="4" class="fblue"/><text x="155" y="230" text-anchor="middle" class="s">假</text><rect x="172" y="174" width="26" height="26" rx="4" class="fgray"/><rect x="172" y="210" width="26" height="30" rx="4" class="fgray"/><text x="185" y="230" text-anchor="middle" class="s">_</text><rect x="202" y="174" width="26" height="26" rx="4" class="fgray"/><rect x="202" y="210" width="26" height="30" rx="4" class="fgray"/><text x="215" y="230" text-anchor="middle" class="s">_</text><rect x="232" y="174" width="26" height="26" rx="4" class="fgray"/><rect x="232" y="210" width="26" height="30" rx="4" class="fblue"/><text x="245" y="230" text-anchor="middle" class="s">怎</text><rect x="262" y="174" width="26" height="26" rx="4" class="fgray"/><rect x="262" y="210" width="26" height="30" rx="4" class="fblue"/><text x="275" y="230" text-anchor="middle" class="s">么</text><rect x="292" y="174" width="26" height="26" rx="4" class="fgray"/><rect x="292" y="210" width="26" height="30" rx="4" class="fgray"/><text x="305" y="230" text-anchor="middle" class="s">_</text><rect x="322" y="174" width="26" height="26" rx="4" class="fgray"/><rect x="322" y="210" width="26" height="30" rx="4" class="fblue"/><text x="335" y="230" text-anchor="middle" class="s">申</text><rect x="352" y="174" width="26" height="26" rx="4" class="fgray"/><rect x="352" y="210" width="26" height="30" rx="4" class="fblue"/><text x="365" y="230" text-anchor="middle" class="s">请</text><rect x="382" y="174" width="26" height="26" rx="4" class="fgray"/><rect x="382" y="210" width="26" height="30" rx="4" class="fgray"/><text x="395" y="230" text-anchor="middle" class="s">_</text><text x="52" y="268" class="xs">_ 是 blank：这一帧不输出字</text><path d="M222 280V316" class="edge"/><text x="234" y="304" class="xs">合并重复，再删 blank</text><g data-node="ctc-out"><rect x="52" y="322" width="372" height="50" rx="8" class="blue"/><text x="70" y="358" class="t">年假怎么申请</text></g><text x="52" y="418" class="xs">为什么需要 blank：“看看”两个字要写成</text><text x="52" y="440" class="xs">看 _ 看，否则会被当成重复合并成“看”。</text><text x="52" y="474" class="xs">同一句话有很多种合法写法（路径），</text><text x="52" y="496" class="xs">训练时不必知道是哪一种。</text><g data-node="ctc-note"><rect x="52" y="552" width="372" height="200" rx="8" class="gray"/><text x="70" y="578" class="k">Graves 2006</text><text x="70" y="604" class="t">训练和代价</text><text x="70" y="632" class="s">损失 = 所有能折叠成正确文本的</text><text x="70" y="655" class="s">路径概率之和，动态规划求出</text><text x="70" y="678" class="s">每帧的输出互不依赖（条件独立）</text><text x="70" y="701" class="s">→ 速度快、天然可流式</text><text x="70" y="724" class="s">→ 同音字常靠外部语言模型或热词</text></g><g data-node="enc"><rect x="484" y="160" width="170" height="100" rx="8" class="blue"/><text x="502" y="186" class="k">声学</text><text x="502" y="212" class="t">编码器</text><text x="502" y="240" class="s">听：第 t 帧</text></g><g data-node="pred"><rect x="686" y="160" width="170" height="100" rx="8" class="violet"/><text x="704" y="186" class="k">文本</text><text x="704" y="212" class="t">预测网络</text><text x="704" y="240" class="s">看：已写出的字</text></g><g data-node="join"><rect x="585" y="300" width="170" height="100" rx="8" class="green"/><text x="603" y="326" class="k">联合</text><text x="603" y="352" class="t">Joiner</text><text x="603" y="380" class="s">合成下一步分布</text></g><path d="M569 262V278H634V296" class="edge"/><path d="M771 262V278H706V296" class="edge"/><path d="M670 402V428" class="edge"/><g data-node="rnnt-out"><rect x="484" y="432" width="372" height="104" rx="8" class="gray"/><text x="502" y="468" class="t">每一步二选一</text><text x="502" y="496" class="s">输出一个字：送回预测网络，同一帧再试</text><text x="502" y="519" class="s">输出 blank：前进到下一帧</text></g><path d="M858 460C880 380 880 230 858 210" class="dash"/><g data-node="rnnt-note"><rect x="484" y="552" width="372" height="200" rx="8" class="gray"/><text x="502" y="578" class="k">Graves 2012</text><text x="502" y="604" class="t">训练和代价</text><text x="502" y="632" class="s">同样对所有对齐路径求和</text><text x="502" y="655" class="s">输出依赖已写出的字，弥补 CTC</text><text x="502" y="678" class="s">按帧推进，适合边说边出字</text><text x="502" y="701" class="s">训练时要算 T × U × 词表 的张量，</text><text x="502" y="724" class="s">显存比 CTC 高得多</text></g><g data-node="aenc"><rect x="916" y="160" width="372" height="100" rx="8" class="blue"/><text x="934" y="186" class="k">先听完</text><text x="934" y="212" class="t">编码器</text><text x="934" y="240" class="s">一次读完整段（Whisper：30 秒）</text></g><g data-node="adec"><rect x="916" y="310" width="372" height="116" rx="8" class="amber"/><text x="934" y="336" class="k">再写</text><text x="934" y="362" class="t">解码器</text><text x="934" y="390" class="s">交叉注意力在全部帧里找位置</text><text x="934" y="413" class="s">逐个预测下一个字，像语言模型</text></g><path d="M1102 262V306" class="edge"/><text x="1112" y="290" class="xs">交叉注意力</text><rect x="916" y="456" width="42" height="30" rx="4" class="fgray"/><text x="937" y="476" text-anchor="middle" class="xs">&lt;sot&gt;</text><rect x="962" y="456" width="42" height="30" rx="4" class="famber"/><text x="983" y="476" text-anchor="middle" class="xs">年</text><rect x="1008" y="456" width="42" height="30" rx="4" class="famber"/><text x="1029" y="476" text-anchor="middle" class="xs">假</text><rect x="1054" y="456" width="42" height="30" rx="4" class="famber"/><text x="1075" y="476" text-anchor="middle" class="xs">怎</text><rect x="1100" y="456" width="42" height="30" rx="4" class="famber"/><text x="1121" y="476" text-anchor="middle" class="xs">么</text><rect x="1146" y="456" width="42" height="30" rx="4" class="famber"/><text x="1167" y="476" text-anchor="middle" class="xs">申</text><rect x="1192" y="456" width="42" height="30" rx="4" class="famber"/><text x="1213" y="476" text-anchor="middle" class="xs">请</text><rect x="1238" y="456" width="42" height="30" rx="4" class="fgray"/><text x="1259" y="476" text-anchor="middle" class="xs">&lt;eot&gt;</text><g data-node="aed-note"><rect x="916" y="552" width="372" height="200" rx="8" class="gray"/><text x="934" y="578" class="k">Whisper 2022</text><text x="934" y="604" class="t">训练和代价</text><text x="934" y="632" class="s">不需要 blank，直接用交叉熵</text><text x="934" y="655" class="s">和训练语言模型一样“预测下一个”</text><text x="934" y="678" class="s">上下文强、可同时学翻译和时间戳</text><text x="934" y="701" class="s">天然要等整段音频，流式需改造</text><text x="934" y="724" class="s">没对上时会编造或重复（幻觉）</text></g>
</svg>
