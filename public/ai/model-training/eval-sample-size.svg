#eval-sample-size-root .m { font-family: 'SFMono-Regular', Menlo, Consolas, monospace; font-size: 14px; fill: #172b3a; }
#eval-sample-size-root .node { fill: #fff; stroke: #cbd5e1; stroke-width: 2; }
#eval-sample-size-root .blue { fill: #eff6ff; stroke: #60a5fa; stroke-width: 2; }
#eval-sample-size-root .green { fill: #ecfdf5; stroke: #20a28c; stroke-width: 2; }
