#eval-sample-size-root .gray { fill: #f1f5f9; stroke: #cbd5e1; stroke-width: 2; }
#eval-sample-size-root .fblue { fill: #93c5fd; } #eval-sample-size-root .fgreen { fill: #6ee7b7; } #eval-sample-size-root .fred { fill: #fda4af; }
#eval-sample-size-root .famber { fill: #fcd34d; } #eval-sample-size-root .fviolet { fill: #c4b5fd; } #eval-sample-size-root .fgray { fill: #e2e8f0; }
#eval-sample-size-root .edge { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#eval-sample-size-arrow); }
#eval-sample-size-root .dash { fill: none; stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 7 6; marker-end: url(#eval-sample-size-arrow); }
#eval-sample-size-root .line { stroke: #cbd5e1; stroke-width: 1.5; fill: none; }
#eval-sample-size-root .axis { stroke: #64748b; stroke-width: 2; fill: none; }
