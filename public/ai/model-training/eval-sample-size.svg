<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="790" viewBox="0 0 1180 790" role="img" aria-labelledby="eval-sample-size-title eval-sample-size-desc" id="eval-sample-size-root">
<title id="eval-sample-size-title">评测题数与 95% 置信区间半宽</title>
<desc id="eval-sample-size-desc">准确率约 80% 时，100 到 2000 道题对应的置信区间半宽：单版准确率、两版各用一套题的差、同一套题配对比较的差；配对比较在约 500 题时区间半宽降到 3 个百分点以内，独立比较需要约 1400 题。</desc>
<defs><style>
#eval-sample-size-root text { font-family: Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #172b3a; }
