<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="distill-pipeline-title distill-pipeline-desc" id="distill-pipeline-root">
<title id="distill-pipeline-title">资料助手的序列级蒸馏流程，以及硬标签和软标签的区别</title>
<desc id="distill-pipeline-desc">上：问题集交给 8B 教师结合检索片段生成回答，程序过滤掉条款编号不在片段里、格式错误、该拒答没拒答的回答，剩下的用来对 1.5B 学生做 SFT，最后用同一份评测集比较教师、学生原版和蒸馏后的学生。下：预测“年假需提前三个”的下一个 token 时，硬标签只有“工作日”为 1；教师的软标签在 T=1 时为 0.80、0.12、0.05、0.03，T=2 时变得更平，为 0.55、0.21、0.14、0.11，学生能学到“自然日”比“月”更接近正确答案。</desc>
<defs><style>
#distill-pipeline-root text { font-family: Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #172b3a; }
#distill-pipeline-root .h { font-size: 26px; font-weight: 700; }
#distill-pipeline-root .t { font-size: 19px; font-weight: 600; }
#distill-pipeline-root .s { font-size: 15px; fill: #475569; }
#distill-pipeline-root .xs { font-size: 13px; fill: #64748b; }
#distill-pipeline-root .k { font-size: 13px; font-weight: 700; letter-spacing: .04em; fill: #64748b; }
#distill-pipeline-root .m { font-family: 'SFMono-Regular', Menlo, Consolas, monospace; font-size: 14px; fill: #172b3a; }
#distill-pipeline-root .node { fill: #fff; stroke: #cbd5e1; stroke-width: 2; }
#distill-pipeline-root .blue { fill: #eff6ff; stroke: #60a5fa; stroke-width: 2; }
#distill-pipeline-root .green { fill: #ecfdf5; stroke: #20a28c; stroke-width: 2; }
#distill-pipeline-root .red { fill: #fff1f2; stroke: #e88191; stroke-width: 2; }
#distill-pipeline-root .amber { fill: #fffbeb; stroke: #e0a63a; stroke-width: 2; }
#distill-pipeline-root .violet { fill: #f5f3ff; stroke: #9b87f5; stroke-width: 2; }
#distill-pipeline-root .gray { fill: #f1f5f9; stroke: #cbd5e1; stroke-width: 2; }
#distill-pipeline-root .fblue { fill: #93c5fd; } #distill-pipeline-root .fgreen { fill: #6ee7b7; } #distill-pipeline-root .fred { fill: #fda4af; }
#distill-pipeline-root .famber { fill: #fcd34d; } #distill-pipeline-root .fviolet { fill: #c4b5fd; } #distill-pipeline-root .fgray { fill: #e2e8f0; }
#distill-pipeline-root .edge { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#distill-pipeline-arrow); }
#distill-pipeline-root .dash { fill: none; stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 7 6; marker-end: url(#distill-pipeline-arrow); }
#distill-pipeline-root .line { stroke: #cbd5e1; stroke-width: 1.5; fill: none; }
#distill-pipeline-root .axis { stroke: #64748b; stroke-width: 2; fill: none; }
</style><marker id="distill-pipeline-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker></defs>
<rect width="1200" height="640" fill="#f8fafc"/>
<text x="32" y="46" class="h">把 8B 的回答“教”给 1.5B</text>
<text x="32" y="78" class="s">上：序列级蒸馏，只需要教师的文字输出。下：逐 token 蒸馏要教师的概率分布（数值示意）。</text>
<g data-node="d-q"><rect x="32" y="108" width="206" height="130" rx="8" class="node"/><text x="50" y="134" class="k">1</text><text x="50" y="160" class="t">问题集</text><text x="50" y="188" class="s">真实问法 + 改写</text><text x="50" y="211" class="s">覆盖拒答、跨条款</text></g><path d="M238 173H262" class="edge"/><g data-node="d-t"><rect x="262" y="108" width="206" height="130" rx="8" class="blue"/><text x="280" y="134" class="k">2</text><text x="280" y="160" class="t">教师生成</text><text x="280" y="188" class="s">8B + 检索片段</text><text x="280" y="211" class="s">每题采样多份回答</text></g><path d="M468 173H492" class="edge"/><g data-node="d-f"><rect x="492" y="108" width="206" height="130" rx="8" class="amber"/><text x="510" y="134" class="k">3</text><text x="510" y="160" class="t">程序过滤</text><text x="510" y="188" class="s">条款编号在片段里</text><text x="510" y="211" class="s">格式、拒答正确</text></g><path d="M698 173H722" class="edge"/><g data-node="d-s"><rect x="722" y="108" width="206" height="130" rx="8" class="green"/><text x="740" y="134" class="k">4</text><text x="740" y="160" class="t">学生 SFT</text><text x="740" y="188" class="s">1.5B 学教师回答</text><text x="740" y="211" class="s">只对回答算损失</text></g><path d="M928 173H952" class="edge"/><g data-node="d-e"><rect x="952" y="108" width="206" height="130" rx="8" class="violet"/><text x="970" y="134" class="k">5</text><text x="970" y="160" class="t">同卷评估</text><text x="970" y="188" class="s">教师 / 学生原版</text><text x="970" y="211" class="s">/ 学生蒸馏后</text></g>
<path d="M926 238V270H160V250" class="dash"/>
<text x="560" y="290" class="xs" text-anchor="middle">评估发现薄弱题型 → 补问题、再生成</text>
<g data-node="kd"><rect x="32" y="310" width="1136" height="300" rx="8" class="node"/></g>
<text x="56" y="600" class="xs">下一个 token：“年假需提前三个 ___”</text>
<text x="56" y="344" class="s">硬标签（训练语料里的答案）</text><rect x="56" y="370" width="60" height="150" rx="3" fill="#cbd5e1" stroke="none" stroke-width="2"/><text x="86" y="362" class="xs" text-anchor="middle">1.00</text><text x="86" y="544" class="xs" text-anchor="middle">工作日</text><rect x="142" y="520" width="60" height="2" rx="3" fill="#cbd5e1" stroke="none" stroke-width="2"/><text x="172" y="512" class="xs" text-anchor="middle">0</text><text x="172" y="544" class="xs" text-anchor="middle">自然日</text><rect x="228" y="520" width="60" height="2" rx="3" fill="#cbd5e1" stroke="none" stroke-width="2"/><text x="258" y="512" class="xs" text-anchor="middle">0</text><text x="258" y="544" class="xs" text-anchor="middle">小时</text><rect x="314" y="520" width="60" height="2" rx="3" fill="#cbd5e1" stroke="none" stroke-width="2"/><text x="344" y="512" class="xs" text-anchor="middle">0</text><text x="344" y="544" class="xs" text-anchor="middle">月</text>
<text x="440" y="344" class="s">教师概率，温度 T = 1</text><rect x="440" y="400" width="60" height="120" rx="3" fill="#93c5fd" stroke="none" stroke-width="2"/><text x="470" y="392" class="xs" text-anchor="middle">0.80</text><text x="470" y="544" class="xs" text-anchor="middle">工作日</text><rect x="526" y="502" width="60" height="18" rx="3" fill="#93c5fd" stroke="none" stroke-width="2"/><text x="556" y="494" class="xs" text-anchor="middle">0.12</text><text x="556" y="544" class="xs" text-anchor="middle">自然日</text><rect x="612" y="512" width="60" height="8" rx="3" fill="#93c5fd" stroke="none" stroke-width="2"/><text x="642" y="504" class="xs" text-anchor="middle">0.05</text><text x="642" y="544" class="xs" text-anchor="middle">小时</text><rect x="698" y="515" width="60" height="5" rx="3" fill="#93c5fd" stroke="none" stroke-width="2"/><text x="728" y="507" class="xs" text-anchor="middle">0.03</text><text x="728" y="544" class="xs" text-anchor="middle">月</text>
<text x="824" y="344" class="s">教师概率，温度 T = 2（更平）</text><rect x="824" y="437" width="60" height="83" rx="3" fill="#6ee7b7" stroke="none" stroke-width="2"/><text x="854" y="429" class="xs" text-anchor="middle">0.55</text><text x="854" y="544" class="xs" text-anchor="middle">工作日</text><rect x="910" y="488" width="60" height="32" rx="3" fill="#6ee7b7" stroke="none" stroke-width="2"/><text x="940" y="480" class="xs" text-anchor="middle">0.21</text><text x="940" y="544" class="xs" text-anchor="middle">自然日</text><rect x="996" y="499" width="60" height="21" rx="3" fill="#6ee7b7" stroke="none" stroke-width="2"/><text x="1026" y="491" class="xs" text-anchor="middle">0.14</text><text x="1026" y="544" class="xs" text-anchor="middle">小时</text><rect x="1082" y="503" width="60" height="17" rx="3" fill="#6ee7b7" stroke="none" stroke-width="2"/><text x="1112" y="495" class="xs" text-anchor="middle">0.11</text><text x="1112" y="544" class="xs" text-anchor="middle">月</text>
</svg>
