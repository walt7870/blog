<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1340" height="720" viewBox="0 0 1340 720" role="img" aria-labelledby="asrft-decision-loop-title asrft-decision-loop-desc" id="asrft-decision-loop-root">
<title id="asrft-decision-loop-title">语音识别微调的决策与数据评估循环</title>
<desc id="asrft-decision-loop-desc">先按错误类型分流：少量固定词用热词或提示，数字标点用文本规整，整体口音噪声或领域差距才进入微调；微调循环为采集、转写、扩增训练、评估，评估同时看业务集、切片、通用集和静音幻觉，通过则上线，不通过则做错误分析后补数据或改转写规范。</desc>
<defs><style>
#asrft-decision-loop-root text { font-family: Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #172b3a; }
#asrft-decision-loop-root .h { font-size: 26px; font-weight: 700; }
#asrft-decision-loop-root .t { font-size: 19px; font-weight: 600; }
#asrft-decision-loop-root .s { font-size: 15px; fill: #475569; }
#asrft-decision-loop-root .xs { font-size: 13px; fill: #64748b; }
#asrft-decision-loop-root .k { font-size: 13px; font-weight: 700; letter-spacing: .04em; fill: #64748b; }
#asrft-decision-loop-root .m { font-family: 'SFMono-Regular', Menlo, Consolas, monospace; font-size: 14px; fill: #172b3a; }
#asrft-decision-loop-root .node { fill: #fff; stroke: #cbd5e1; stroke-width: 2; }
#asrft-decision-loop-root .blue { fill: #eff6ff; stroke: #60a5fa; stroke-width: 2; }
#asrft-decision-loop-root .green { fill: #ecfdf5; stroke: #20a28c; stroke-width: 2; }
#asrft-decision-loop-root .red { fill: #fff1f2; stroke: #e88191; stroke-width: 2; }
#asrft-decision-loop-root .amber { fill: #fffbeb; stroke: #e0a63a; stroke-width: 2; }
#asrft-decision-loop-root .violet { fill: #f5f3ff; stroke: #9b87f5; stroke-width: 2; }
#asrft-decision-loop-root .gray { fill: #f1f5f9; stroke: #cbd5e1; stroke-width: 2; }
#asrft-decision-loop-root .fblue { fill: #93c5fd; } #asrft-decision-loop-root .fgreen { fill: #6ee7b7; } #asrft-decision-loop-root .fred { fill: #fda4af; }
#asrft-decision-loop-root .famber { fill: #fcd34d; } #asrft-decision-loop-root .fviolet { fill: #c4b5fd; } #asrft-decision-loop-root .fgray { fill: #e2e8f0; }
#asrft-decision-loop-root .edge { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#asrft-decision-loop-arrow); }
#asrft-decision-loop-root .dash { fill: none; stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 7 6; marker-end: url(#asrft-decision-loop-arrow); }
#asrft-decision-loop-root .line { stroke: #cbd5e1; stroke-width: 1.5; fill: none; }
#asrft-decision-loop-root .axis { stroke: #64748b; stroke-width: 2; fill: none; }
</style><marker id="asrft-decision-loop-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker></defs>
<rect width="1340" height="720" fill="#f8fafc"/>
<text x="32" y="46" class="h">先判断要不要训，再让数据和评估转起来</text>
<text x="32" y="78" class="s">左边决定改哪一层；右边每一轮都同时检查“变好了”和“没变坏”</text>
<g data-node="symptom"><rect x="32" y="112" width="300" height="112" rx="8" class="red"/><text x="50" y="138" class="k">现象</text><text x="50" y="164" class="t">听错“钉钉审批”</text><text x="50" y="192" class="s">先收集一批真实错例</text><text x="50" y="215" class="s">按错误类型分组</text></g><g data-node="dec-0"><rect x="32" y="262" width="300" height="96" rx="8" class="green"/><text x="50" y="288" class="k">错误类型 1</text><text x="50" y="314" class="t">只错少量固定词</text><text x="50" y="342" class="s">热词 / 提示 / 词表替换</text></g><g data-node="dec-1"><rect x="32" y="374" width="300" height="96" rx="8" class="green"/><text x="50" y="400" class="k">错误类型 2</text><text x="50" y="426" class="t">数字、标点、大小写</text><text x="50" y="454" class="s">文本规整（ITN）与后处理</text></g><g data-node="dec-2"><rect x="32" y="486" width="300" height="96" rx="8" class="amber"/><text x="50" y="512" class="k">错误类型 3</text><text x="50" y="538" class="t">整体口音、噪声、领域</text><text x="50" y="566" class="s">进入微调流程 →</text></g><path d="M182 226V258" class="edge"/><text x="32" y="620" class="xs">先试不训练的办法：改得快、可回滚，</text><text x="32" y="642" class="xs">它们不够时再微调。</text><g data-node="loop-0"><rect x="400" y="120" width="280" height="150" rx="8" class="blue"/><text x="418" y="146" class="k">1 采集</text><text x="418" y="172" class="t">真实场景录音</text><text x="418" y="200" class="s">取得说话人同意</text><text x="418" y="223" class="s">覆盖口音、会议室、手机</text><text x="418" y="246" class="s">按说话人划分训练/测试</text></g><path d="M682 195H712" class="edge"/><g data-node="loop-1"><rect x="716" y="120" width="280" height="150" rx="8" class="violet"/><text x="734" y="146" class="k">2 转写</text><text x="734" y="172" class="t">统一转写规范</text><text x="734" y="200" class="s">数字、中英混说、标点</text><text x="734" y="223" class="s">术语表固定写法</text><text x="734" y="246" class="s">双人抽检一致率</text></g><path d="M998 195H1028" class="edge"/><g data-node="loop-2"><rect x="1032" y="120" width="280" height="150" rx="8" class="green"/><text x="1050" y="146" class="k">3 训练</text><text x="1050" y="172" class="t">扩增 + 微调</text><text x="1050" y="200" class="s">速度扰动、SpecAugment</text><text x="1050" y="223" class="s">加噪声、加混响</text><text x="1050" y="246" class="s">全参 / 冻结编码器 / LoRA</text></g><g data-node="eval"><rect x="1032" y="360" width="280" height="230" rx="8" class="amber"/><text x="1050" y="386" class="k">每轮都做</text><text x="1050" y="412" class="t">4 评估</text><text x="1050" y="440" class="s">业务测试集：CER、术语召回</text><text x="1050" y="463" class="s">按口音、噪声切片看</text><text x="1050" y="486" class="s">通用测试集：查回退</text><text x="1050" y="509" class="s">静音与噪声片段：查幻觉</text><text x="1050" y="532" class="s">同一规范化后再算分</text></g><path d="M1172 272V356" class="edge"/><g data-node="ship"><rect x="716" y="420" width="280" height="110" rx="8" class="green"/><text x="734" y="446" class="k">通过</text><text x="734" y="472" class="t">5 上线</text><text x="734" y="500" class="s">业务集变好且通用集不退</text><text x="734" y="523" class="s">保留旧模型可回滚</text></g><path d="M1030 475H1000" class="edge"/><g data-node="analyze"><rect x="400" y="420" width="280" height="150" rx="8" class="red"/><text x="418" y="446" class="k">不通过</text><text x="418" y="472" class="t">错误分析</text><text x="418" y="500" class="s">哪类口音、哪些词还错</text><text x="418" y="523" class="s">是数据缺、标注乱</text><text x="418" y="546" class="s">还是学过头遗忘了</text></g><path d="M1072 592V650H540V574" class="dash"/><path d="M540 416V274" class="dash"/><rect x="546" y="372" width="160" height="26" rx="4" fill="#f8fafc"/><text x="552" y="390" class="s">补数据或改规范</text><path d="M334 534H380V195H396" class="edge"/>
</svg>
