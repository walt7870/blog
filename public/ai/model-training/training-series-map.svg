<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="380" viewBox="0 0 1360 380" role="img" aria-labelledby="training-series-map-title training-series-map-desc" id="training-series-map-root">
<title id="training-series-map-title">模型训练与调优系列的五个部分</title>
<desc id="training-series-map-desc">第一部分讲所有模型共用的训练机制与资源账；第二部分讲大语言模型从预训练到后训练；第三部分讲语音识别与合成；第四部分讲视觉、图文、扩散与向量模型；第五部分讲评估与训练工程。</desc>
<defs><style>
#training-series-map-root text { font-family: Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #172b3a; }
#training-series-map-root .h { font-size: 26px; font-weight: 700; }
#training-series-map-root .t { font-size: 19px; font-weight: 600; }
#training-series-map-root .s { font-size: 15px; fill: #475569; }
#training-series-map-root .xs { font-size: 13px; fill: #64748b; }
#training-series-map-root .k { font-size: 13px; font-weight: 700; letter-spacing: .04em; fill: #64748b; }
#training-series-map-root .m { font-family: 'SFMono-Regular', Menlo, Consolas, monospace; font-size: 14px; fill: #172b3a; }
#training-series-map-root .node { fill: #fff; stroke: #cbd5e1; stroke-width: 2; }
#training-series-map-root .blue { fill: #eff6ff; stroke: #60a5fa; stroke-width: 2; }
#training-series-map-root .green { fill: #ecfdf5; stroke: #20a28c; stroke-width: 2; }
#training-series-map-root .red { fill: #fff1f2; stroke: #e88191; stroke-width: 2; }
#training-series-map-root .amber { fill: #fffbeb; stroke: #e0a63a; stroke-width: 2; }
#training-series-map-root .violet { fill: #f5f3ff; stroke: #9b87f5; stroke-width: 2; }
#training-series-map-root .gray { fill: #f1f5f9; stroke: #cbd5e1; stroke-width: 2; }
#training-series-map-root .fblue { fill: #93c5fd; } #training-series-map-root .fgreen { fill: #6ee7b7; } #training-series-map-root .fred { fill: #fda4af; }
#training-series-map-root .famber { fill: #fcd34d; } #training-series-map-root .fviolet { fill: #c4b5fd; } #training-series-map-root .fgray { fill: #e2e8f0; }
#training-series-map-root .edge { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#training-series-map-arrow); }
#training-series-map-root .dash { fill: none; stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 7 6; marker-end: url(#training-series-map-arrow); }
