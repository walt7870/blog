<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1340" height="724" viewBox="0 0 1340 724" role="img" aria-labelledby="eng-pipeline-title eng-pipeline-desc" id="eng-pipeline-root">
<title id="eng-pipeline-title">从数据快照到模型注册表的训练流水线与断点续训回路</title>
<desc id="eng-pipeline-desc">数据快照和配置代码输入训练作业，训练作业定期把权重、优化器、调度器、随机数和数据位置写入检查点存储；节点故障后作业从最近一份完整检查点恢复。训练产出经过离线评估门禁，通过后登记到模型注册表再交付部署，不通过则改数据或配置开新实验。实验追踪贯穿全程。</desc>
<defs><style>
#eng-pipeline-root text { font-family: Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #172b3a; }
#eng-pipeline-root .h { font-size: 26px; font-weight: 700; }
#eng-pipeline-root .t { font-size: 19px; font-weight: 600; }
#eng-pipeline-root .s { font-size: 15px; fill: #475569; }
#eng-pipeline-root .xs { font-size: 13px; fill: #64748b; }
#eng-pipeline-root .k { font-size: 13px; font-weight: 700; letter-spacing: .04em; fill: #64748b; }
#eng-pipeline-root .m { font-family: 'SFMono-Regular', Menlo, Consolas, monospace; font-size: 14px; fill: #172b3a; }
#eng-pipeline-root .node { fill: #fff; stroke: #cbd5e1; stroke-width: 2; }
#eng-pipeline-root .blue { fill: #eff6ff; stroke: #60a5fa; stroke-width: 2; }
#eng-pipeline-root .green { fill: #ecfdf5; stroke: #20a28c; stroke-width: 2; }
#eng-pipeline-root .red { fill: #fff1f2; stroke: #e88191; stroke-width: 2; }
#eng-pipeline-root .amber { fill: #fffbeb; stroke: #e0a63a; stroke-width: 2; }
#eng-pipeline-root .violet { fill: #f5f3ff; stroke: #9b87f5; stroke-width: 2; }
#eng-pipeline-root .gray { fill: #f1f5f9; stroke: #cbd5e1; stroke-width: 2; }
#eng-pipeline-root .fblue { fill: #93c5fd; } #eng-pipeline-root .fgreen { fill: #6ee7b7; } #eng-pipeline-root .fred { fill: #fda4af; }
#eng-pipeline-root .famber { fill: #fcd34d; } #eng-pipeline-root .fviolet { fill: #c4b5fd; } #eng-pipeline-root .fgray { fill: #e2e8f0; }
#eng-pipeline-root .edge { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#eng-pipeline-arrow); }
#eng-pipeline-root .dash { fill: none; stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 7 6; marker-end: url(#eng-pipeline-arrow); }
#eng-pipeline-root .line { stroke: #cbd5e1; stroke-width: 1.5; fill: none; }
#eng-pipeline-root .axis { stroke: #64748b; stroke-width: 2; fill: none; }
</style><marker id="eng-pipeline-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker></defs>
<rect width="1340" height="724" fill="#f8fafc"/>
<text x="32" y="46" class="h">一次可复现、可续训的训练从哪里来、到哪里去</text>
<text x="32" y="78" class="s">上排是正常流程；下排是检查点回路：中断只损失最近一次保存之后的进度</text>
<g data-node="step-1"><rect x="32" y="150" width="190" height="180" rx="8" class="node"/><text x="50" y="176" class="k">输入 1</text><text x="50" y="202" class="t">数据快照</text><text x="50" y="230" class="s">版本号与哈希</text><text x="50" y="253" class="s">来源与许可证</text><text x="50" y="276" class="s">已清洗个人信息</text><text x="50" y="299" class="s">按条款分组切分</text></g><path d="M223 240H245" class="edge"/><g data-node="step-2"><rect x="248" y="150" width="190" height="180" rx="8" class="node"/><text x="266" y="176" class="k">输入 2</text><text x="266" y="202" class="t">配置与代码</text><text x="266" y="230" class="s">一个配置文件</text><text x="266" y="253" class="s">代码提交号</text><text x="266" y="276" class="s">随机种子</text><text x="266" y="299" class="s">镜像与依赖版本</text></g><path d="M439 240H461" class="edge"/><g data-node="step-3"><rect x="464" y="150" width="190" height="180" rx="8" class="blue"/><text x="482" y="176" class="k">运行</text><text x="482" y="202" class="t">训练作业</text><text x="482" y="230" class="s">单卡或多机多卡</text><text x="482" y="253" class="s">每 N 步保存检查点</text><text x="482" y="276" class="s">每 M 步跑小评测</text><text x="482" y="299" class="s">曲线实时上报</text></g><path d="M655 240H677" class="edge"/><g data-node="step-4"><rect x="680" y="150" width="190" height="180" rx="8" class="violet"/><text x="698" y="176" class="k">门禁</text><text x="698" y="202" class="t">离线评估</text><text x="698" y="230" class="s">业务评测集</text><text x="698" y="253" class="s">通用与安全回归</text><text x="698" y="276" class="s">第 21 篇的门</text></g><path d="M871 240H893" class="edge"/><g data-node="step-5"><rect x="896" y="150" width="190" height="180" rx="8" class="green"/><text x="914" y="176" class="k">登记</text><text x="914" y="202" class="t">模型注册表</text><text x="914" y="230" class="s">权重与适配器</text><text x="914" y="253" class="s">证据：数据、配置、</text><text x="914" y="276" class="s">评估报告链接</text><text x="914" y="299" class="s">状态：候选/生产</text></g><path d="M1087 240H1109" class="edge"/><g data-node="step-6"><rect x="1112" y="150" width="190" height="180" rx="8" class="amber"/><text x="1130" y="176" class="k">交付</text><text x="1130" y="202" class="t">部署</text><text x="1130" y="230" class="s">推理引擎加载</text><text x="1130" y="253" class="s">影子与小流量</text><text x="1130" y="276" class="s">可回滚到上一版</text></g><path d="M775 148V124H343V146" class="dash"/><rect x="367" y="98" width="270" height="26" rx="4" fill="#f8fafc"/><text x="373" y="116" class="s">不过：改数据或配置，开一个新实验</text><g data-node="ckpt"><rect x="394" y="420" width="330" height="168" rx="8" class="gray"/><text x="412" y="446" class="k">共享存储，保留最近几份</text><text x="412" y="472" class="t">检查点存储</text><text x="412" y="500" class="s">权重（或 LoRA 适配器）</text><text x="412" y="523" class="s">优化器状态、学习率调度器</text><text x="412" y="546" class="s">各进程随机数状态</text><text x="412" y="569" class="s">数据读到第几步、全局 step</text></g><path d="M514 332V416" class="edge"/><rect x="384" y="358" width="106" height="26" rx="4" fill="#f8fafc"/><text x="390" y="376" class="s">每 N 步保存</text><path d="M604 418V334" class="dash"/><rect x="610" y="358" width="210" height="26" rx="4" fill="#f8fafc"/><text x="616" y="376" class="s">从最近一份完整检查点恢复</text><g data-node="fail"><rect x="886" y="430" width="300" height="148" rx="8" class="red"/><text x="904" y="456" class="k">中断</text><text x="904" y="482" class="t">节点故障或被抢占</text><text x="904" y="510" class="s">作业中断，进度停在最近一次保存</text><text x="904" y="533" class="s">调度器重新拉起作业</text><text x="904" y="556" class="s">先校验检查点完整，再恢复</text></g><path d="M884 504H728" class="dash"/><g data-node="track"><rect x="32" y="604" width="1270" height="96" rx="8" class="node"/><text x="50" y="640" class="t">实验追踪</text><text x="50" y="668" class="s">每次运行记录配置、代码提交、数据版本、种子、曲线、评估结果和检查点路径；注册表里的每个版本都能追回到这里。</text></g>
</svg>
