<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1340" height="580" viewBox="0 0 1340 580" role="img" aria-labelledby="tts-codec-rvq-title tts-codec-rvq-desc" id="tts-codec-rvq-root">
<title id="tts-codec-rvq-title">神经音频编解码器的残差向量量化</title>
<desc id="tts-codec-rvq-desc">24 kHz 波形经编码器压缩为每秒 75 个连续向量，再用 8 层残差向量量化，每层从 1024 项码本中选一个最接近的向量并把剩余误差交给下一层，得到每秒 600 个离散 token、约 6 kbps，这是 VALL-E 使用的 EnCodec 设定。</desc>
<defs><style>
#tts-codec-rvq-root text { font-family: Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #172b3a; }
#tts-codec-rvq-root .h { font-size: 26px; font-weight: 700; }
#tts-codec-rvq-root .t { font-size: 19px; font-weight: 600; }
#tts-codec-rvq-root .s { font-size: 15px; fill: #475569; }
#tts-codec-rvq-root .xs { font-size: 13px; fill: #64748b; }
#tts-codec-rvq-root .k { font-size: 13px; font-weight: 700; letter-spacing: .04em; fill: #64748b; }
#tts-codec-rvq-root .m { font-family: 'SFMono-Regular', Menlo, Consolas, monospace; font-size: 14px; fill: #172b3a; }
#tts-codec-rvq-root .node { fill: #fff; stroke: #cbd5e1; stroke-width: 2; }
#tts-codec-rvq-root .blue { fill: #eff6ff; stroke: #60a5fa; stroke-width: 2; }
#tts-codec-rvq-root .green { fill: #ecfdf5; stroke: #20a28c; stroke-width: 2; }
#tts-codec-rvq-root .red { fill: #fff1f2; stroke: #e88191; stroke-width: 2; }
#tts-codec-rvq-root .amber { fill: #fffbeb; stroke: #e0a63a; stroke-width: 2; }
#tts-codec-rvq-root .violet { fill: #f5f3ff; stroke: #9b87f5; stroke-width: 2; }
#tts-codec-rvq-root .gray { fill: #f1f5f9; stroke: #cbd5e1; stroke-width: 2; }
#tts-codec-rvq-root .fblue { fill: #93c5fd; } #tts-codec-rvq-root .fgreen { fill: #6ee7b7; } #tts-codec-rvq-root .fred { fill: #fda4af; }
#tts-codec-rvq-root .famber { fill: #fcd34d; } #tts-codec-rvq-root .fviolet { fill: #c4b5fd; } #tts-codec-rvq-root .fgray { fill: #e2e8f0; }
#tts-codec-rvq-root .edge { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#tts-codec-rvq-arrow); }
#tts-codec-rvq-root .dash { fill: none; stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 7 6; marker-end: url(#tts-codec-rvq-arrow); }
#tts-codec-rvq-root .line { stroke: #cbd5e1; stroke-width: 1.5; fill: none; }
#tts-codec-rvq-root .axis { stroke: #64748b; stroke-width: 2; fill: none; }
</style><marker id="tts-codec-rvq-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker></defs>
<rect width="1340" height="580" fill="#f8fafc"/>
<text x="32" y="46" class="h">声音怎样变成可以“预测下一个”的 token</text>
<text x="32" y="78" class="s">以 VALL-E 使用的 EnCodec 6 kbps 设定为例</text>
<g data-node="wave"><rect x="32" y="140" width="220" height="150" rx="8" class="node"/><text x="50" y="166" class="k">输入</text><text x="50" y="192" class="t">24 kHz 波形</text><text x="50" y="220" class="s">1 秒 = 24,000 个采样</text><text x="50" y="243" class="s">编码器压缩 320 倍</text></g><path d="M254 215H290" class="edge"/><g data-node="frame"><rect x="294" y="140" width="220" height="150" rx="8" class="blue"/><text x="312" y="166" class="k">编码器输出</text><text x="312" y="192" class="t">75 帧 / 秒</text><text x="312" y="220" class="s">每帧一个连续向量</text><text x="312" y="243" class="s">还不能当 token 用</text></g><path d="M516 215H552" class="edge"/><rect x="556" y="116" width="420" height="46" rx="4" class="famber"/><text x="572" y="146" class="s">码本 1：粗略近似</text><text x="960" y="146" class="xs" text-anchor="end">1024 选 1</text><rect x="556" y="172" width="420" height="46" rx="4" class="famber"/><text x="572" y="202" class="s">码本 2：量化剩下的误差</text><text x="960" y="202" class="xs" text-anchor="end">1024 选 1</text><rect x="556" y="228" width="420" height="46" rx="4" class="fgray"/><text x="572" y="258" class="s">码本 3：再量化剩余误差</text><text x="960" y="258" class="xs" text-anchor="end">1024 选 1</text><rect x="556" y="284" width="420" height="46" rx="4" class="fgray"/><text x="572" y="314" class="s">…</text><text x="960" y="314" class="xs" text-anchor="end"></text><rect x="556" y="340" width="420" height="46" rx="4" class="fgray"/><text x="572" y="370" class="s">码本 8：最细的残差</text><text x="960" y="370" class="xs" text-anchor="end">1024 选 1</text><text x="556" y="410" class="xs">每层只编码上一层没表达好的部分（残差）</text><path d="M978 215H1012" class="edge"/><g data-node="tok"><rect x="1016" y="116" width="300" height="196" rx="8" class="green"/><text x="1034" y="142" class="k">输出</text><text x="1034" y="168" class="t">每秒 600 个 token</text><text x="1034" y="196" class="s">75 帧 × 8 个码本</text><text x="1034" y="219" class="s">每个 token 10 bit（1024 项）</text><text x="1034" y="242" class="s">600 × 10 = 6 kbps</text><text x="1034" y="265" class="s">VALL-E 的设定</text></g><g data-node="note"><rect x="32" y="444" width="1276" height="100" rx="8" class="gray"/><text x="50" y="480" class="t">为什么要分层</text><text x="50" y="508" class="s">每帧 8 × 10 = 80 bit。若只用一个码本表达同样的信息量，要有 2⁸⁰ 项，无法存储和训练；分 8 层，每层 1024 项就够。VALL-E 用自回归模型</text><text x="50" y="531" class="s">逐帧生成第 1 层，再用非自回归模型补齐第 2—8 层；丢掉后面的层，码率降低、音质变粗，SoundStream 借此让单个模型覆盖 3—18 kbps。</text></g>
</svg>
