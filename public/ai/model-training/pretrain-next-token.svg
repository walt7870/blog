<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="pretrain-next-token-title pretrain-next-token-desc" id="pretrain-next-token-root">
<title id="pretrain-next-token-title">预测下一个 token：每个位置都在猜下一个词，并按猜对的概率计损失</title>
<desc id="pretrain-next-token-desc">一句话“员工申请年假需提前三个工作日提交”被切成 token，输入是前 7 个，目标是整体右移一位的 7 个。模型在每个位置输出对下一个 token 的概率分布；正确 token 的概率越低，该位置损失 −ln p 越大。示意数值下 7 个位置的平均损失约 1.17。</desc>
<defs><style>
#pretrain-next-token-root text { font-family: Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #172b3a; }
#pretrain-next-token-root .h { font-size: 26px; font-weight: 700; }
#pretrain-next-token-root .t { font-size: 19px; font-weight: 600; }
#pretrain-next-token-root .s { font-size: 15px; fill: #475569; }
#pretrain-next-token-root .xs { font-size: 13px; fill: #64748b; }
#pretrain-next-token-root .k { font-size: 13px; font-weight: 700; letter-spacing: .04em; fill: #64748b; }
#pretrain-next-token-root .m { font-family: 'SFMono-Regular', Menlo, Consolas, monospace; font-size: 14px; fill: #172b3a; }
#pretrain-next-token-root .node { fill: #fff; stroke: #cbd5e1; stroke-width: 2; }
#pretrain-next-token-root .blue { fill: #eff6ff; stroke: #60a5fa; stroke-width: 2; }
#pretrain-next-token-root .green { fill: #ecfdf5; stroke: #20a28c; stroke-width: 2; }
#pretrain-next-token-root .red { fill: #fff1f2; stroke: #e88191; stroke-width: 2; }
#pretrain-next-token-root .amber { fill: #fffbeb; stroke: #e0a63a; stroke-width: 2; }
#pretrain-next-token-root .violet { fill: #f5f3ff; stroke: #9b87f5; stroke-width: 2; }
#pretrain-next-token-root .gray { fill: #f1f5f9; stroke: #cbd5e1; stroke-width: 2; }
#pretrain-next-token-root .fblue { fill: #93c5fd; } #pretrain-next-token-root .fgreen { fill: #6ee7b7; } #pretrain-next-token-root .fred { fill: #fda4af; }
#pretrain-next-token-root .famber { fill: #fcd34d; } #pretrain-next-token-root .fviolet { fill: #c4b5fd; } #pretrain-next-token-root .fgray { fill: #e2e8f0; }
#pretrain-next-token-root .edge { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#pretrain-next-token-arrow); }
#pretrain-next-token-root .dash { fill: none; stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 7 6; marker-end: url(#pretrain-next-token-arrow); }
#pretrain-next-token-root .line { stroke: #cbd5e1; stroke-width: 1.5; fill: none; }
#pretrain-next-token-root .axis { stroke: #64748b; stroke-width: 2; fill: none; }
</style><marker id="pretrain-next-token-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker></defs>
<rect width="1200" height="600" fill="#f8fafc"/>
<text x="32" y="46" class="h">一句话就是七道“猜下一个词”的题</text>
<text x="32" y="78" class="s">切分和概率都是示意值；真实训练里每个 batch 有几百万个这样的位置一起算。</text>
<text x="32" y="156" class="k">输入</text>
<g data-node="model"><rect x="120" y="210" width="1020" height="80" rx="8" class="violet"/></g>
<text x="630" y="248" class="t" text-anchor="middle">Transformer 解码器：每个位置只能看见它左边的 token（因果掩码）</text>
<text x="630" y="276" class="s" text-anchor="middle">输出：词表里 128,256 个候选各自的概率</text>
<text x="32" y="358" class="k">目标</text>
<text x="32" y="430" class="k">正确词</text>
<text x="32" y="450" class="k">的概率</text>
<path d="M120 480H1140" class="line"/>
<text x="32" y="504" class="k">−ln p</text>
<rect x="120" y="128" width="120" height="44" rx="4" class="fblue"/><text x="180" y="155" text-anchor="middle" class="t">员工</text><path d="M180 172V210" class="edge"/><path d="M180 290V326" class="edge"/><rect x="120" y="330" width="120" height="44" rx="4" class="fgreen"/><text x="180" y="357" text-anchor="middle" class="t">申请</text><rect x="150" y="475" width="60" height="5" rx="3" fill="#c4b5fd" stroke="none" stroke-width="2"/><text x="180" y="469" class="xs" text-anchor="middle">0.05</text><text x="180" y="504" class="s" text-anchor="middle">3.00</text><rect x="270" y="128" width="120" height="44" rx="4" class="fblue"/><text x="330" y="155" text-anchor="middle" class="t">申请</text><path d="M330 172V210" class="edge"/><path d="M330 290V326" class="edge"/><rect x="270" y="330" width="120" height="44" rx="4" class="fgreen"/><text x="330" y="357" text-anchor="middle" class="t">年假</text><rect x="300" y="453" width="60" height="27" rx="3" fill="#c4b5fd" stroke="none" stroke-width="2"/><text x="330" y="447" class="xs" text-anchor="middle">0.30</text><text x="330" y="504" class="s" text-anchor="middle">1.20</text><rect x="420" y="128" width="120" height="44" rx="4" class="fblue"/><text x="480" y="155" text-anchor="middle" class="t">年假</text><path d="M480 172V210" class="edge"/><path d="M480 290V326" class="edge"/><rect x="420" y="330" width="120" height="44" rx="4" class="fgreen"/><text x="480" y="357" text-anchor="middle" class="t">需</text><rect x="450" y="462" width="60" height="18" rx="3" fill="#c4b5fd" stroke="none" stroke-width="2"/><text x="480" y="456" class="xs" text-anchor="middle">0.20</text><text x="480" y="504" class="s" text-anchor="middle">1.61</text><rect x="570" y="128" width="120" height="44" rx="4" class="fblue"/><text x="630" y="155" text-anchor="middle" class="t">需</text><path d="M630 172V210" class="edge"/><path d="M630 290V326" class="edge"/><rect x="570" y="330" width="120" height="44" rx="4" class="fgreen"/><text x="630" y="357" text-anchor="middle" class="t">提前</text><rect x="600" y="426" width="60" height="54" rx="3" fill="#c4b5fd" stroke="none" stroke-width="2"/><text x="630" y="420" class="xs" text-anchor="middle">0.60</text><text x="630" y="504" class="s" text-anchor="middle">0.51</text><rect x="720" y="128" width="120" height="44" rx="4" class="fblue"/><text x="780" y="155" text-anchor="middle" class="t">提前</text><path d="M780 172V210" class="edge"/><path d="M780 290V326" class="edge"/><rect x="720" y="330" width="120" height="44" rx="4" class="fgreen"/><text x="780" y="357" text-anchor="middle" class="t">三个</text><rect x="750" y="439" width="60" height="41" rx="3" fill="#c4b5fd" stroke="none" stroke-width="2"/><text x="780" y="433" class="xs" text-anchor="middle">0.45</text><text x="780" y="504" class="s" text-anchor="middle">0.80</text><rect x="870" y="128" width="120" height="44" rx="4" class="fblue"/><text x="930" y="155" text-anchor="middle" class="t">三个</text><path d="M930 172V210" class="edge"/><path d="M930 290V326" class="edge"/><rect x="870" y="330" width="120" height="44" rx="4" class="fgreen"/><text x="930" y="357" text-anchor="middle" class="t">工作日</text><rect x="900" y="403" width="60" height="77" rx="3" fill="#c4b5fd" stroke="none" stroke-width="2"/><text x="930" y="397" class="xs" text-anchor="middle">0.85</text><text x="930" y="504" class="s" text-anchor="middle">0.16</text><rect x="1020" y="128" width="120" height="44" rx="4" class="fblue"/><text x="1080" y="155" text-anchor="middle" class="t">工作日</text><path d="M1080 172V210" class="edge"/><path d="M1080 290V326" class="edge"/><rect x="1020" y="330" width="120" height="44" rx="4" class="fgreen"/><text x="1080" y="357" text-anchor="middle" class="t">提交</text><rect x="1050" y="444" width="60" height="36" rx="3" fill="#c4b5fd" stroke="none" stroke-width="2"/><text x="1080" y="438" class="xs" text-anchor="middle">0.40</text><text x="1080" y="504" class="s" text-anchor="middle">0.92</text>
<text x="120" y="560" class="m">损失 = 平均(−ln p) = (3.00 + 1.20 + 1.61 + 0.51 + 0.80 + 0.16 + 0.92) ÷ 7 ≈ 1.17</text>
</svg>
