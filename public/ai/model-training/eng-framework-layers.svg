<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="640" viewBox="0 0 1300 640" role="img" aria-labelledby="eng-framework-layers-title eng-framework-layers-desc" id="eng-framework-layers-root">
<title id="eng-framework-layers-title">训练框架分层图</title>
<desc id="eng-framework-layers-desc">自下而上：硬件与通信、PyTorch、分布式与加速（FSDP2、DeepSpeed、Megatron-Core、Accelerate）、语音工具包、任务与模型库（Transformers、PEFT、TRL、diffusers、sentence-transformers）、强化学习编排（verl、OpenRLHF）、一站式微调工具（LLaMA-Factory、ms-swift、Axolotl、Unsloth）。</desc>
<defs><style>
#eng-framework-layers-root text { font-family: Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #172b3a; }
#eng-framework-layers-root .h { font-size: 26px; font-weight: 700; }
#eng-framework-layers-root .t { font-size: 19px; font-weight: 600; }
#eng-framework-layers-root .s { font-size: 15px; fill: #475569; }
#eng-framework-layers-root .xs { font-size: 13px; fill: #64748b; }
#eng-framework-layers-root .k { font-size: 13px; font-weight: 700; letter-spacing: .04em; fill: #64748b; }
#eng-framework-layers-root .m { font-family: 'SFMono-Regular', Menlo, Consolas, monospace; font-size: 14px; fill: #172b3a; }
#eng-framework-layers-root .node { fill: #fff; stroke: #cbd5e1; stroke-width: 2; }
#eng-framework-layers-root .blue { fill: #eff6ff; stroke: #60a5fa; stroke-width: 2; }
#eng-framework-layers-root .green { fill: #ecfdf5; stroke: #20a28c; stroke-width: 2; }
#eng-framework-layers-root .red { fill: #fff1f2; stroke: #e88191; stroke-width: 2; }
#eng-framework-layers-root .amber { fill: #fffbeb; stroke: #e0a63a; stroke-width: 2; }
#eng-framework-layers-root .violet { fill: #f5f3ff; stroke: #9b87f5; stroke-width: 2; }
#eng-framework-layers-root .gray { fill: #f1f5f9; stroke: #cbd5e1; stroke-width: 2; }
#eng-framework-layers-root .fblue { fill: #93c5fd; } #eng-framework-layers-root .fgreen { fill: #6ee7b7; } #eng-framework-layers-root .fred { fill: #fda4af; }
#eng-framework-layers-root .famber { fill: #fcd34d; } #eng-framework-layers-root .fviolet { fill: #c4b5fd; } #eng-framework-layers-root .fgray { fill: #e2e8f0; }
#eng-framework-layers-root .edge { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#eng-framework-layers-arrow); }
#eng-framework-layers-root .dash { fill: none; stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 7 6; marker-end: url(#eng-framework-layers-arrow); }
#eng-framework-layers-root .line { stroke: #cbd5e1; stroke-width: 1.5; fill: none; }
#eng-framework-layers-root .axis { stroke: #64748b; stroke-width: 2; fill: none; }
</style><marker id="eng-framework-layers-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker></defs>
<rect width="1300" height="640" fill="#f8fafc"/>
<text x="32" y="46" class="h">训练框架的分层：每一层替你做了什么</text>
<text x="32" y="78" class="s">同一行的项目处在同一层，各管一类任务；不同行之间是“上层调用下层”的关系</text>
<text x="32" y="128" class="t">一站式微调</text><text x="32" y="150" class="xs">改配置文件就能跑</text><rect x="258" y="104" width="245" height="54" rx="4" class="famber"/><text x="380.5" y="136" text-anchor="middle" class="m">LLaMA-Factory</text><rect x="513" y="104" width="245" height="54" rx="4" class="famber"/><text x="635.5" y="136" text-anchor="middle" class="m">ms-swift</text><rect x="768" y="104" width="245" height="54" rx="4" class="famber"/><text x="890.5" y="136" text-anchor="middle" class="m">Axolotl</text><rect x="1023" y="104" width="245" height="54" rx="4" class="famber"/><text x="1145.5" y="136" text-anchor="middle" class="m">Unsloth</text><text x="32" y="196" class="t">强化学习编排</text><text x="32" y="218" class="xs">采样与训练交替</text><rect x="258" y="172" width="330" height="54" rx="4" class="fviolet"/><text x="423" y="204" text-anchor="middle" class="m">verl</text><rect x="598" y="172" width="330" height="54" rx="4" class="fviolet"/><text x="763" y="204" text-anchor="middle" class="m">OpenRLHF</text><rect x="938" y="172" width="330" height="54" rx="4" class="fviolet"/><text x="1103" y="204" text-anchor="middle" class="m">TRL 的 GRPO 训练器</text><text x="32" y="264" class="t">任务与模型库</text><text x="32" y="286" class="xs">模型定义和训练器</text><rect x="258" y="240" width="194" height="54" rx="4" class="fblue"/><text x="355" y="272" text-anchor="middle" class="m">Transformers</text><rect x="462" y="240" width="194" height="54" rx="4" class="fblue"/><text x="559" y="272" text-anchor="middle" class="m">PEFT</text><rect x="666" y="240" width="194" height="54" rx="4" class="fblue"/><text x="763" y="272" text-anchor="middle" class="m">TRL</text><rect x="870" y="240" width="194" height="54" rx="4" class="fblue"/><text x="967" y="272" text-anchor="middle" class="m">diffusers</text><rect x="1074" y="240" width="194" height="54" rx="4" class="fblue"/><text x="1171" y="272" text-anchor="middle" class="m">sentence-transformers</text><text x="32" y="332" class="t">语音工具包</text><text x="32" y="354" class="xs">识别与合成配方</text><rect x="258" y="308" width="245" height="54" rx="4" class="fgreen"/><text x="380.5" y="340" text-anchor="middle" class="m">ESPnet</text><rect x="513" y="308" width="245" height="54" rx="4" class="fgreen"/><text x="635.5" y="340" text-anchor="middle" class="m">WeNet</text><rect x="768" y="308" width="245" height="54" rx="4" class="fgreen"/><text x="890.5" y="340" text-anchor="middle" class="m">FunASR</text><rect x="1023" y="308" width="245" height="54" rx="4" class="fgreen"/><text x="1145.5" y="340" text-anchor="middle" class="m">NeMo Speech</text><text x="32" y="400" class="t">分布式与加速</text><text x="32" y="422" class="xs">把模型和状态切到多卡</text><rect x="258" y="376" width="245" height="54" rx="4" class="fgray"/><text x="380.5" y="408" text-anchor="middle" class="m">FSDP2</text><rect x="513" y="376" width="245" height="54" rx="4" class="fgray"/><text x="635.5" y="408" text-anchor="middle" class="m">DeepSpeed ZeRO</text><rect x="768" y="376" width="245" height="54" rx="4" class="fgray"/><text x="890.5" y="408" text-anchor="middle" class="m">Megatron-Core</text><rect x="1023" y="376" width="245" height="54" rx="4" class="fgray"/><text x="1145.5" y="408" text-anchor="middle" class="m">Accelerate</text><text x="32" y="468" class="t">深度学习框架</text><text x="32" y="490" class="xs">张量、求导、编译</text><rect x="258" y="444" width="1010" height="54" rx="4" class="fgray"/><text x="763" y="476" text-anchor="middle" class="m">PyTorch：自动求导、torch.compile、分布式检查点</text><text x="32" y="536" class="t">硬件与通信</text><text x="32" y="558" class="xs">算子和集合通信</text><rect x="258" y="512" width="1010" height="54" rx="4" class="fgray"/><text x="763" y="544" text-anchor="middle" class="m">GPU 与驱动、CUDA 或 ROCm、NCCL 通信库</text><text x="32" y="598" class="s">越往上，现成配方越多、改动越少；越往下，可控性越强，也要自己处理更多细节。上层工具大多建在下层之上，出问题时要往下查。</text>
</svg>
