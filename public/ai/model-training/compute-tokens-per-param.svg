<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="540" viewBox="0 0 1300 540" role="img" aria-labelledby="compute-tokens-per-param-title compute-tokens-per-param-desc" id="compute-tokens-per-param-root">
<title id="compute-tokens-per-param-title">不同模型每个参数训练的 token 数</title>
<desc id="compute-tokens-per-param-desc">对数刻度：Gopher 和 GPT-3 每参数约 1 到 2 个 token，Chinchilla 约 20 个，Llama 3 405B 约 39 个，70B 约 212 个，8B 约 1868 个，比 Chinchilla 算力最优点多近百倍。</desc>
<defs><style>
#compute-tokens-per-param-root text { font-family: Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #172b3a; }
#compute-tokens-per-param-root .h { font-size: 26px; font-weight: 700; }
#compute-tokens-per-param-root .t { font-size: 19px; font-weight: 600; }
#compute-tokens-per-param-root .s { font-size: 15px; fill: #475569; }
#compute-tokens-per-param-root .xs { font-size: 13px; fill: #64748b; }
#compute-tokens-per-param-root .k { font-size: 13px; font-weight: 700; letter-spacing: .04em; fill: #64748b; }
#compute-tokens-per-param-root .m { font-family: 'SFMono-Regular', Menlo, Consolas, monospace; font-size: 14px; fill: #172b3a; }
#compute-tokens-per-param-root .node { fill: #fff; stroke: #cbd5e1; stroke-width: 2; }
#compute-tokens-per-param-root .blue { fill: #eff6ff; stroke: #60a5fa; stroke-width: 2; }
#compute-tokens-per-param-root .green { fill: #ecfdf5; stroke: #20a28c; stroke-width: 2; }
#compute-tokens-per-param-root .red { fill: #fff1f2; stroke: #e88191; stroke-width: 2; }
#compute-tokens-per-param-root .amber { fill: #fffbeb; stroke: #e0a63a; stroke-width: 2; }
#compute-tokens-per-param-root .violet { fill: #f5f3ff; stroke: #9b87f5; stroke-width: 2; }
#compute-tokens-per-param-root .gray { fill: #f1f5f9; stroke: #cbd5e1; stroke-width: 2; }
#compute-tokens-per-param-root .fblue { fill: #93c5fd; } #compute-tokens-per-param-root .fgreen { fill: #6ee7b7; } #compute-tokens-per-param-root .fred { fill: #fda4af; }
#compute-tokens-per-param-root .famber { fill: #fcd34d; } #compute-tokens-per-param-root .fviolet { fill: #c4b5fd; } #compute-tokens-per-param-root .fgray { fill: #e2e8f0; }
#compute-tokens-per-param-root .edge { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#compute-tokens-per-param-arrow); }
#compute-tokens-per-param-root .dash { fill: none; stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 7 6; marker-end: url(#compute-tokens-per-param-arrow); }
#compute-tokens-per-param-root .line { stroke: #cbd5e1; stroke-width: 1.5; fill: none; }
#compute-tokens-per-param-root .axis { stroke: #64748b; stroke-width: 2; fill: none; }
</style><marker id="compute-tokens-per-param-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker></defs>
<rect width="1300" height="540" fill="#f8fafc"/>
<text x="32" y="46" class="h">每个参数“读”了多少 token</text>
<text x="32" y="78" class="s">2020 年的大模型训练不足；Chinchilla 把比例拉到约 20；Llama 3 的小模型远超这个点，用更多训练换更便宜的推理</text>
<line x1="390.55416566009484" y1="120" x2="390.55416566009484" y2="454" stroke="#cbd5e1" stroke-width="1.5"/><text x="390.55416566009484" y="478" class="xs" text-anchor="middle">1</text><line x1="591.7107498288276" y1="120" x2="591.7107498288276" y2="454" stroke="#cbd5e1" stroke-width="1.5"/><text x="591.7107498288276" y="478" class="xs" text-anchor="middle">10</text><line x1="792.8673339975602" y1="120" x2="792.8673339975602" y2="454" stroke="#cbd5e1" stroke-width="1.5"/><text x="792.8673339975602" y="478" class="xs" text-anchor="middle">100</text><line x1="994.0239181662928" y1="120" x2="994.0239181662928" y2="454" stroke="#cbd5e1" stroke-width="1.5"/><text x="994.0239181662928" y="478" class="xs" text-anchor="middle">1000</text><text x="710" y="504" class="xs" text-anchor="middle">每个参数训练了多少个 token（对数刻度，每格 10 倍）</text><line x1="652.2649154889224" y1="106" x2="652.2649154889224" y2="454" stroke="#0f9f86" stroke-width="2" stroke-dasharray="6 5"/><text x="660.2649154889224" y="110" class="xs">Chinchilla 算力最优 ≈ 20</text><text x="32" y="162" class="s">Gopher 280B（2021）</text><line x1="330" y1="157" x2="396.58146532538603" y2="157" stroke="#94a3b8" stroke-width="6"/><circle cx="396.58146532538603" cy="157" r="7" fill="#94a3b8"/><text x="410.58146532538603" y="162" class="xs">1.1（300B token）</text><text x="32" y="216" class="s">GPT-3 175B（2020）</text><line x1="330" y1="211" x2="437.6415437970328" y2="211" stroke="#94a3b8" stroke-width="6"/><circle cx="437.6415437970328" cy="211" r="7" fill="#94a3b8"/><text x="451.6415437970328" y="216" class="xs">1.7（300B token）</text><text x="32" y="270" class="s">Chinchilla 70B（2022）</text><line x1="330" y1="265" x2="652.2649154889224" y2="265" stroke="#0f9f86" stroke-width="6"/><circle cx="652.2649154889224" cy="265" r="7" fill="#0f9f86"/><text x="666.2649154889224" y="270" class="xs">20（1.4T token）</text><text x="32" y="324" class="s">Llama 3 405B（2024）</text><line x1="330" y1="319" x2="709.5220410155011" y2="319" stroke="#2563eb" stroke-width="6"/><circle cx="709.5220410155011" cy="319" r="7" fill="#2563eb"/><text x="723.5220410155011" y="324" class="xs">39（15.6T token）</text><text x="32" y="378" class="s">Llama 3 70B（2024）</text><line x1="330" y1="373" x2="858.703180049962" y2="373" stroke="#2563eb" stroke-width="6"/><circle cx="858.703180049962" cy="373" r="7" fill="#2563eb"/><text x="872.703180049962" y="378" class="xs">212（约 15T token）</text><text x="32" y="432" class="s">Llama 3 8B（2024）</text><line x1="330" y1="427" x2="1048.6129297760258" y2="427" stroke="#2563eb" stroke-width="6"/><circle cx="1048.6129297760258" cy="427" r="7" fill="#2563eb"/><text x="1062.6129297760258" y="432" class="xs">1868（约 15T token）</text>
</svg>
