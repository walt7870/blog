<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="500" viewBox="0 0 1300 500" role="img" aria-labelledby="parallel-zero-memory-title parallel-zero-memory-desc" id="parallel-zero-memory-root">
<title id="parallel-zero-memory-title">Llama-3.1-8B 在 8 卡上用 ZeRO 各阶段时每卡的模型状态显存</title>
<desc id="parallel-zero-memory-desc">8B 全参训练、8 卡数据并行：普通数据并行每卡 128.5 GB，ZeRO-1 切优化器状态后 44.2 GB，ZeRO-2 再切梯度后 30.1 GB，ZeRO-3/FSDP 再切参数后 16.1 GB；前三者每步通信量都是 2Ψ，ZeRO-3 为 3Ψ。</desc>
<defs><style>
#parallel-zero-memory-root text { font-family: Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #172b3a; }
#parallel-zero-memory-root .h { font-size: 26px; font-weight: 700; }
#parallel-zero-memory-root .t { font-size: 19px; font-weight: 600; }
#parallel-zero-memory-root .s { font-size: 15px; fill: #475569; }
#parallel-zero-memory-root .xs { font-size: 13px; fill: #64748b; }
#parallel-zero-memory-root .k { font-size: 13px; font-weight: 700; letter-spacing: .04em; fill: #64748b; }
#parallel-zero-memory-root .m { font-family: 'SFMono-Regular', Menlo, Consolas, monospace; font-size: 14px; fill: #172b3a; }
#parallel-zero-memory-root .node { fill: #fff; stroke: #cbd5e1; stroke-width: 2; }
#parallel-zero-memory-root .blue { fill: #eff6ff; stroke: #60a5fa; stroke-width: 2; }
#parallel-zero-memory-root .green { fill: #ecfdf5; stroke: #20a28c; stroke-width: 2; }
#parallel-zero-memory-root .red { fill: #fff1f2; stroke: #e88191; stroke-width: 2; }
#parallel-zero-memory-root .amber { fill: #fffbeb; stroke: #e0a63a; stroke-width: 2; }
#parallel-zero-memory-root .violet { fill: #f5f3ff; stroke: #9b87f5; stroke-width: 2; }
#parallel-zero-memory-root .gray { fill: #f1f5f9; stroke: #cbd5e1; stroke-width: 2; }
#parallel-zero-memory-root .fblue { fill: #93c5fd; } #parallel-zero-memory-root .fgreen { fill: #6ee7b7; } #parallel-zero-memory-root .fred { fill: #fda4af; }
#parallel-zero-memory-root .famber { fill: #fcd34d; } #parallel-zero-memory-root .fviolet { fill: #c4b5fd; } #parallel-zero-memory-root .fgray { fill: #e2e8f0; }
#parallel-zero-memory-root .edge { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#parallel-zero-memory-arrow); }
#parallel-zero-memory-root .dash { fill: none; stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 7 6; marker-end: url(#parallel-zero-memory-arrow); }
#parallel-zero-memory-root .line { stroke: #cbd5e1; stroke-width: 1.5; fill: none; }
#parallel-zero-memory-root .axis { stroke: #64748b; stroke-width: 2; fill: none; }
</style><marker id="parallel-zero-memory-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker></defs>
<rect width="1300" height="500" fill="#f8fafc"/>
<text x="32" y="46" class="h">8B 全参训练，8 张卡，每卡要放多少模型状态</text>
<text x="32" y="78" class="s">条形按 GB 等比例绘制；切得越多每卡越省，ZeRO-3 的代价是多 50% 通信</text>
<line x1="250" y1="128" x2="250" y2="404" stroke="#e2e8f0" stroke-width="1.5"/><text x="250" y="426" class="xs" text-anchor="middle">0</text><line x1="367.1428571428571" y1="128" x2="367.1428571428571" y2="404" stroke="#e2e8f0" stroke-width="1.5"/><text x="367.1428571428571" y="426" class="xs" text-anchor="middle">20</text><line x1="484.2857142857143" y1="128" x2="484.2857142857143" y2="404" stroke="#e2e8f0" stroke-width="1.5"/><text x="484.2857142857143" y="426" class="xs" text-anchor="middle">40</text><line x1="601.4285714285713" y1="128" x2="601.4285714285713" y2="404" stroke="#e2e8f0" stroke-width="1.5"/><text x="601.4285714285713" y="426" class="xs" text-anchor="middle">60</text><line x1="718.5714285714286" y1="128" x2="718.5714285714286" y2="404" stroke="#e2e8f0" stroke-width="1.5"/><text x="718.5714285714286" y="426" class="xs" text-anchor="middle">80</text><line x1="835.7142857142858" y1="128" x2="835.7142857142858" y2="404" stroke="#e2e8f0" stroke-width="1.5"/><text x="835.7142857142858" y="426" class="xs" text-anchor="middle">100</text><line x1="952.8571428571428" y1="128" x2="952.8571428571428" y2="404" stroke="#e2e8f0" stroke-width="1.5"/><text x="952.8571428571428" y="426" class="xs" text-anchor="middle">120</text><line x1="1070" y1="128" x2="1070" y2="404" stroke="#e2e8f0" stroke-width="1.5"/><text x="1070" y="426" class="xs" text-anchor="middle">140</text><line x1="718.5714285714286" y1="110" x2="718.5714285714286" y2="404" stroke="#e11d48" stroke-width="2" stroke-dasharray="6 5"/><text x="726.5714285714286" y="114" class="xs">H100 80 GB</text><text x="1110" y="114" class="k">每步通信量</text><text x="32" y="177" class="s">普通数据并行</text><rect x="250" y="150" width="94.3" height="40" rx="3" fill="#93c5fd" stroke="none"/><rect x="344.3" y="150" width="94.3" height="40" rx="3" fill="#fcd34d" stroke="none"/><rect x="438.6" y="150" width="564.6285714285715" height="40" rx="3" fill="#c4b5fd" stroke="none"/><text x="1013.2285714285715" y="177" class="s">128.5 GB</text><text x="1110" y="177" class="m">2Ψ</text><text x="32" y="243" class="s">ZeRO-1：切优化器状态</text><rect x="250" y="216" width="94.3" height="40" rx="3" fill="#93c5fd" stroke="none"/><rect x="344.3" y="216" width="94.3" height="40" rx="3" fill="#fcd34d" stroke="none"/><rect x="438.6" y="216" width="70.28571428571429" height="40" rx="3" fill="#c4b5fd" stroke="none"/><text x="518.8857142857144" y="243" class="s">44.2 GB</text><text x="1110" y="243" class="m">2Ψ</text><text x="32" y="309" class="s">ZeRO-2：再切梯度</text><rect x="250" y="282" width="94.3" height="40" rx="3" fill="#93c5fd" stroke="none"/><rect x="344.3" y="282" width="11.714285714285714" height="40" rx="3" fill="#fcd34d" stroke="none"/><rect x="356.01428571428573" y="282" width="70.28571428571429" height="40" rx="3" fill="#c4b5fd" stroke="none"/><text x="436.3" y="309" class="s">30.1 GB</text><text x="1110" y="309" class="m">2Ψ</text><text x="32" y="375" class="s">ZeRO-3 / FSDP：再切参数</text><rect x="250" y="348" width="11.714285714285714" height="40" rx="3" fill="#93c5fd" stroke="none"/><rect x="261.7142857142857" y="348" width="11.714285714285714" height="40" rx="3" fill="#fcd34d" stroke="none"/><rect x="273.42857142857144" y="348" width="70.28571428571429" height="40" rx="3" fill="#c4b5fd" stroke="none"/><text x="353.7142857142857" y="375" class="s">16.1 GB</text><text x="1110" y="375" class="m">3Ψ</text><rect x="250" y="443" width="18" height="18" rx="3" fill="#93c5fd" stroke="none"/><text x="276" y="458" class="xs">BF16 参数</text><rect x="470" y="443" width="18" height="18" rx="3" fill="#fcd34d" stroke="none"/><text x="496" y="458" class="xs">BF16 梯度</text><rect x="690" y="443" width="18" height="18" rx="3" fill="#c4b5fd" stroke="none"/><text x="716" y="458" class="xs">FP32 主权重 + Adam 两个动量</text><text x="32" y="490" class="xs">Ψ 为参数量，通信量按“每卡收发多少个参数大小的数据”计；只算模型状态，激活另计。数值按 8 卡、每参数 16 字节手算。</text>
</svg>
