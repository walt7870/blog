<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="420" viewBox="0 0 1240 420" role="img" aria-labelledby="sft-packing-title sft-packing-desc" id="sft-packing-root">
<title id="sft-packing-title">填充与打包两种组批方式的对比</title>
<desc id="sft-packing-desc">四条长度为 6、11、4、9 个 token 的样本，按最大长度 16 组批。逐条填充时 64 个位置中有 34 个是无效填充；打包把 B 和 C、D 和 A 拼进同一行，只剩 2 个填充，但要隔断样本之间的注意力。</desc>
<defs><style>
#sft-packing-root text { font-family: Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #172b3a; }
#sft-packing-root .h { font-size: 26px; font-weight: 700; }
#sft-packing-root .t { font-size: 19px; font-weight: 600; }
#sft-packing-root .s { font-size: 15px; fill: #475569; }
#sft-packing-root .xs { font-size: 13px; fill: #64748b; }
#sft-packing-root .k { font-size: 13px; font-weight: 700; letter-spacing: .04em; fill: #64748b; }
#sft-packing-root .m { font-family: 'SFMono-Regular', Menlo, Consolas, monospace; font-size: 14px; fill: #172b3a; }
#sft-packing-root .node { fill: #fff; stroke: #cbd5e1; stroke-width: 2; }
#sft-packing-root .blue { fill: #eff6ff; stroke: #60a5fa; stroke-width: 2; }
#sft-packing-root .green { fill: #ecfdf5; stroke: #20a28c; stroke-width: 2; }
#sft-packing-root .red { fill: #fff1f2; stroke: #e88191; stroke-width: 2; }
#sft-packing-root .amber { fill: #fffbeb; stroke: #e0a63a; stroke-width: 2; }
#sft-packing-root .violet { fill: #f5f3ff; stroke: #9b87f5; stroke-width: 2; }
#sft-packing-root .gray { fill: #f1f5f9; stroke: #cbd5e1; stroke-width: 2; }
#sft-packing-root .fblue { fill: #93c5fd; } #sft-packing-root .fgreen { fill: #6ee7b7; } #sft-packing-root .fred { fill: #fda4af; }
#sft-packing-root .famber { fill: #fcd34d; } #sft-packing-root .fviolet { fill: #c4b5fd; } #sft-packing-root .fgray { fill: #e2e8f0; }
#sft-packing-root .edge { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#sft-packing-arrow); }
#sft-packing-root .dash { fill: none; stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 7 6; marker-end: url(#sft-packing-arrow); }
#sft-packing-root .line { stroke: #cbd5e1; stroke-width: 1.5; fill: none; }
#sft-packing-root .axis { stroke: #64748b; stroke-width: 2; fill: none; }
</style><marker id="sft-packing-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker></defs>
<rect width="1240" height="420" fill="#f8fafc"/>
<text x="32" y="46" class="h">同样四条样本：逐条填充浪费一半位置，打包几乎不浪费</text>
<text x="32" y="78" class="s">每个小格是一个 token 位置，灰色为填充。最大长度按 16 示意，实际训练常用 2048—8192。</text>
<g data-node="padbox"><rect x="32" y="112" width="560" height="290" rx="8" class="node"/><text x="50" y="138" class="k">逐条填充（padding）</text></g>
<g data-node="packbox"><rect x="648" y="112" width="560" height="290" rx="8" class="node"/><text x="666" y="138" class="k">打包（packing）</text></g>
