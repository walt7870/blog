t"/><rect x="346" y="308" width="27" height="32" rx="4" class="fgray"/><rect x="376" y="308" width="27" height="32" rx="4" class="fgray"/><rect x="406" y="308" width="27" height="32" rx="4" class="fgray"/><rect x="436" y="308" width="27" height="32" rx="4" class="fgray"/><rect x="466" y="308" width="27" height="32" rx="4" class="fgray"/><rect x="496" y="308" width="27" height="32" rx="4" class="fgray"/><rect x="526" y="308" width="27" height="32" rx="4" class="fgray"/><text x="76" y="376" class="s">64 个位置里 30 个有效，34 个是填充（53%）</text>
