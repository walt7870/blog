<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1340" height="600" viewBox="0 0 1340 600" role="img" aria-labelledby="embed-two-stage-title embed-two-stage-desc" id="embed-two-stage-root">
<title id="embed-two-stage-title">向量召回加交叉编码器重排的两阶段检索</title>
<desc id="embed-two-stage-desc">离线时，双塔编码器把 1.2 万条制度条款各自编码成向量存进索引。在线时只需编码问题一次，在索引里取最相近的 50 条；再由交叉编码器把问题和每条候选拼在一起逐对打分，取前 5 条交给大模型。更换编码器后，离线索引里的全部向量必须重算。</desc>
<defs><style>
#embed-two-stage-root text { font-family: Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #172b3a; }
#embed-two-stage-root .h { font-size: 26px; font-weight: 700; }
#embed-two-stage-root .t { font-size: 19px; font-weight: 600; }
#embed-two-stage-root .s { font-size: 15px; fill: #475569; }
#embed-two-stage-root .xs { font-size: 13px; fill: #64748b; }
#embed-two-stage-root .k { font-size: 13px; font-weight: 700; letter-spacing: .04em; fill: #64748b; }
#embed-two-stage-root .m { font-family: 'SFMono-Regular', Menlo, Consolas, monospace; font-size: 14px; fill: #172b3a; }
#embed-two-stage-root .node { fill: #fff; stroke: #cbd5e1; stroke-width: 2; }
#embed-two-stage-root .blue { fill: #eff6ff; stroke: #60a5fa; stroke-width: 2; }
#embed-two-stage-root .green { fill: #ecfdf5; stroke: #20a28c; stroke-width: 2; }
#embed-two-stage-root .red { fill: #fff1f2; stroke: #e88191; stroke-width: 2; }
#embed-two-stage-root .amber { fill: #fffbeb; stroke: #e0a63a; stroke-width: 2; }
#embed-two-stage-root .violet { fill: #f5f3ff; stroke: #9b87f5; stroke-width: 2; }
#embed-two-stage-root .gray { fill: #f1f5f9; stroke: #cbd5e1; stroke-width: 2; }
#embed-two-stage-root .fblue { fill: #93c5fd; } #embed-two-stage-root .fgreen { fill: #6ee7b7; } #embed-two-stage-root .fred { fill: #fda4af; }
#embed-two-stage-root .famber { fill: #fcd34d; } #embed-two-stage-root .fviolet { fill: #c4b5fd; } #embed-two-stage-root .fgray { fill: #e2e8f0; }
#embed-two-stage-root .edge { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#embed-two-stage-arrow); }
#embed-two-stage-root .dash { fill: none; stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 7 6; marker-end: url(#embed-two-stage-arrow); }
#embed-two-stage-root .line { stroke: #cbd5e1; stroke-width: 1.5; fill: none; }
#embed-two-stage-root .axis { stroke: #64748b; stroke-width: 2; fill: none; }
</style><marker id="embed-two-stage-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker></defs>
<rect width="1340" height="600" fill="#f8fafc"/>
<text x="32" y="46" class="h">先用向量快速捞 50 条，再用交叉编码器细看这 50 条</text>
<text x="32" y="78" class="s">资料助手的检索链路；条款数、候选数为示意。</text>
<text x="32" y="120" class="k">离线：每条条款只编码一次</text>
<g data-node="docs"><rect x="32" y="136" width="240" height="104" rx="8" class="node"/><text x="50" y="172" class="t">制度条款</text><text x="50" y="200" class="s">约 1.2 万条切块</text><text x="50" y="223" class="s">更新时增量编码</text></g>
<g data-node="benc"><rect x="320" y="136" width="260" height="104" rx="8" class="blue"/><text x="338" y="172" class="t">双塔编码器（文档侧）</text><text x="338" y="200" class="s">每条 → 1024 维向量</text></g>
<g data-node="index"><rect x="628" y="136" width="280" height="104" rx="8" class="violet"/><text x="646" y="172" class="t">向量索引</text><text x="646" y="200" class="s">1.2 万 × 1024 个数</text><text x="646" y="223" class="s">换模型 = 全部重算</text></g>
<path d="M272 188H320" class="edge"/>
<path d="M580 188H628" class="edge"/>
<path d="M32 276H1308" class="line"/>
<text x="32" y="312" class="k">在线：一次提问</text>
<g data-node="q"><rect x="32" y="328" width="240" height="120" rx="8" class="node"/><text x="50" y="364" class="t">小林的问题</text><text x="50" y="392" class="s">“年假能拆成</text><text x="50" y="415" class="s">半天休吗？”</text></g>
<g data-node="qenc"><rect x="320" y="328" width="260" height="120" rx="8" class="blue"/><text x="338" y="364" class="t">双塔编码器（问题侧）</text><text x="338" y="392" class="s">只编码 1 次</text><text x="338" y="415" class="s">与条款向量算点积</text></g>
<g data-node="top50"><rect x="628" y="328" width="280" height="120" rx="8" class="violet"/><text x="646" y="364" class="t">向量召回 top-50</text><text x="646" y="392" class="s">毫秒级</text><text x="646" y="415" class="s">语义相近但不一定答题</text></g>
<g data-node="ce"><rect x="956" y="328" width="352" height="120" rx="8" class="green"/><text x="974" y="364" class="t">交叉编码器重排</text><text x="974" y="392" class="s">（问题, 条款）拼在一起</text><text x="974" y="415" class="s">50 次前向逐对打分</text><text x="974" y="438" class="s">取前 5 条给大模型</text></g>
<path d="M272 388H320" class="edge"/>
<path d="M580 388H628" class="edge"/>
<path d="M908 388H956" class="edge"/>
<path d="M768 240V328" class="dash"/>
<g data-node="cmp"><rect x="32" y="480" width="1276" height="96" rx="8" class="node"/><text x="50" y="516" class="t">为什么分两段</text><text x="50" y="544" class="s">双塔：问题和条款各自编码、可提前算好，快，但两者在编码时看不到对方</text><text x="50" y="567" class="s">交叉编码器：两段文字在每一层注意力里互相看，准，但每对都要现算，只能用在少量候选上</text></g>
</svg>
