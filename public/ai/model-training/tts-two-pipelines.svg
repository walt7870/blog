<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1340" height="660" viewBox="0 0 1340 660" role="img" aria-labelledby="tts-two-pipelines-title tts-two-pipelines-desc" id="tts-two-pipelines-root">
<title id="tts-two-pipelines-title">经典三段式 TTS 与编解码 token 语言模型 TTS 的对比</title>
<desc id="tts-two-pipelines-desc">经典流水线为文本前端、声学模型生成 Mel 频谱、声码器生成波形，VITS 把后两段合成一个模型；新路线由语言模型根据文本和 3 秒参考音生成离散语音 token，再由 codec 解码器或流匹配加声码器还原波形，可零样本克隆音色，也带来冒用风险。</desc>
<defs><style>
#tts-two-pipelines-root text { font-family: Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #172b3a; }
#tts-two-pipelines-root .h { font-size: 26px; font-weight: 700; }
#tts-two-pipelines-root .t { font-size: 19px; font-weight: 600; }
#tts-two-pipelines-root .s { font-size: 15px; fill: #475569; }
#tts-two-pipelines-root .xs { font-size: 13px; fill: #64748b; }
#tts-two-pipelines-root .k { font-size: 13px; font-weight: 700; letter-spacing: .04em; fill: #64748b; }
#tts-two-pipelines-root .m { font-family: 'SFMono-Regular', Menlo, Consolas, monospace; font-size: 14px; fill: #172b3a; }
#tts-two-pipelines-root .node { fill: #fff; stroke: #cbd5e1; stroke-width: 2; }
#tts-two-pipelines-root .blue { fill: #eff6ff; stroke: #60a5fa; stroke-width: 2; }
#tts-two-pipelines-root .green { fill: #ecfdf5; stroke: #20a28c; stroke-width: 2; }
#tts-two-pipelines-root .red { fill: #fff1f2; stroke: #e88191; stroke-width: 2; }
#tts-two-pipelines-root .amber { fill: #fffbeb; stroke: #e0a63a; stroke-width: 2; }
#tts-two-pipelines-root .violet { fill: #f5f3ff; stroke: #9b87f5; stroke-width: 2; }
#tts-two-pipelines-root .gray { fill: #f1f5f9; stroke: #cbd5e1; stroke-width: 2; }
#tts-two-pipelines-root .fblue { fill: #93c5fd; } #tts-two-pipelines-root .fgreen { fill: #6ee7b7; } #tts-two-pipelines-root .fred { fill: #fda4af; }
#tts-two-pipelines-root .famber { fill: #fcd34d; } #tts-two-pipelines-root .fviolet { fill: #c4b5fd; } #tts-two-pipelines-root .fgray { fill: #e2e8f0; }
#tts-two-pipelines-root .edge { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#tts-two-pipelines-arrow); }
#tts-two-pipelines-root .dash { fill: none; stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 7 6; marker-end: url(#tts-two-pipelines-arrow); }
#tts-two-pipelines-root .line { stroke: #cbd5e1; stroke-width: 1.5; fill: none; }
#tts-two-pipelines-root .axis { stroke: #64748b; stroke-width: 2; fill: none; }
</style><marker id="tts-two-pipelines-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker></defs>
<rect width="1340" height="660" fill="#f8fafc"/>
<text x="32" y="46" class="h">两代语音合成：Mel 频谱流水线与语音 token 语言模型</text>
<text x="32" y="78" class="s">同一句播报，两条路线的中间表示和训练目标不同</text>
<text x="32" y="118" class="k">经典三段式（Tacotron 2 / FastSpeech 2 + HiFi-GAN）</text><g data-node="cl-0"><rect x="32" y="132" width="236" height="150" rx="8" class="node"/><text x="50" y="158" class="k">输入</text><text x="50" y="184" class="t">“请到行政楼办理”</text><text x="50" y="212" class="s">小林问到的制度原文</text><text x="50" y="235" class="s">可能含数字、缩写</text></g><path d="M270 207H294" class="edge"/><g data-node="cl-1"><rect x="298" y="132" width="236" height="150" rx="8" class="violet"/><text x="316" y="158" class="k">文本前端</text><text x="316" y="184" class="t">读法与韵律</text><text x="316" y="212" class="s">2026 年 → 二零二六年</text><text x="316" y="235" class="s">多音字：行政读 háng</text><text x="316" y="258" class="s">停顿、重音</text></g><path d="M536 207H560" class="edge"/><g data-node="cl-2"><rect x="564" y="132" width="236" height="150" rx="8" class="blue"/><text x="582" y="158" class="k">声学模型</text><text x="582" y="184" class="t">音素 → Mel 频谱</text><text x="582" y="212" class="s">Tacotron 2：注意力对齐</text><text x="582" y="235" class="s">FastSpeech 2：先预测时长</text><text x="582" y="258" class="s">再并行生成</text></g><path d="M802 207H826" class="edge"/><g data-node="cl-3"><rect x="830" y="132" width="236" height="150" rx="8" class="green"/><text x="848" y="158" class="k">声码器</text><text x="848" y="184" class="t">Mel → 波形</text><text x="848" y="212" class="s">HiFi-GAN</text><text x="848" y="235" class="s">补回相位和细节</text><text x="848" y="258" class="s">22.05 / 24 kHz 采样</text></g><path d="M1068 207H1092" class="edge"/><g data-node="cl-4"><rect x="1096" y="132" width="236" height="150" rx="8" class="node"/><text x="1114" y="158" class="k">输出</text><text x="1114" y="184" class="t">固定的播报声音</text><text x="1114" y="212" class="s">每个声音单独训练</text><text x="1114" y="235" class="s">或带说话人编号</text></g><path d="M564 296V308H1066V296" class="line"/><text x="815" y="332" class="xs" text-anchor="middle">VITS：把这两段合成一个模型端到端训练</text><text x="32" y="378" class="k">编解码 token + 语言模型（VALL-E、CosyVoice 一类）</text><g data-node="lm-0"><rect x="32" y="392" width="236" height="170" rx="8" class="node"/><text x="50" y="418" class="k">输入</text><text x="50" y="444" class="t">文本 + 3 秒参考音</text><text x="50" y="472" class="s">参考音给出音色</text><text x="50" y="495" class="s">可以是没见过的人</text></g><path d="M270 477H294" class="edge"/><g data-node="lm-1"><rect x="298" y="392" width="236" height="170" rx="8" class="amber"/><text x="316" y="418" class="k">语言模型</text><text x="316" y="444" class="t">文本 → 语音 token</text><text x="316" y="472" class="s">像续写文字一样</text><text x="316" y="495" class="s">逐个生成离散 token</text><text x="316" y="518" class="s">续写参考音的音色</text></g><path d="M536 477H560" class="edge"/><g data-node="lm-2"><rect x="564" y="392" width="236" height="170" rx="8" class="blue"/><text x="582" y="418" class="k">token 还原</text><text x="582" y="444" class="t">两种做法</text><text x="582" y="472" class="s">VALL-E：codec 解码器</text><text x="582" y="495" class="s">直接还原波形</text><text x="582" y="518" class="s">CosyVoice：流匹配 → Mel</text></g><path d="M802 477H826" class="edge"/><g data-node="lm-3"><rect x="830" y="392" width="236" height="170" rx="8" class="green"/><text x="848" y="418" class="k">声码器</text><text x="848" y="444" class="t">Mel → 波形</text><text x="848" y="472" class="s">CosyVoice 用 HiFi-GAN</text><text x="848" y="495" class="s">VALL-E 这步已在</text><text x="848" y="518" class="s">codec 解码器里完成</text></g><path d="M1068 477H1092" class="edge"/><g data-node="lm-4"><rect x="1096" y="392" width="236" height="170" rx="8" class="red"/><text x="1114" y="418" class="k">输出</text><text x="1114" y="444" class="t">零样本克隆的声音</text><text x="1114" y="472" class="s">音色像参考音</text><text x="1114" y="495" class="s">也可能像未授权的人</text></g><text x="32" y="602" class="xs">差别在中间表示：上面是连续的 Mel 频谱，靠回归损失训练；下面是离散 token，靠“预测下一个”的交叉熵训练，可以直接借用大语言模型的规模和技巧。</text>
</svg>
