<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="600" viewBox="0 0 1320 600" role="img" aria-labelledby="embed-inbatch-negatives-title embed-inbatch-negatives-desc" id="embed-inbatch-negatives-root">
<title id="embed-inbatch-negatives-title">批内负例、难负例与假负例</title>
<desc id="embed-inbatch-negatives-desc">每行是一条问题，它的正确条款在对角线上。同一批次里别人的正确条款自动成为它的负例，批次越大负例越多；每条问题还可以附带一条挖出的难负例，即看起来相关但答不了题的条款。问题 1“年假怎么申请”和问题 3 的正确条款都讲年假，P3 可能其实也能回答问题 1，被当作负例时就是假负例，会教错模型。</desc>
<defs><style>
#embed-inbatch-negatives-root text { font-family: Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #172b3a; }
#embed-inbatch-negatives-root .h { font-size: 26px; font-weight: 700; }
#embed-inbatch-negatives-root .t { font-size: 19px; font-weight: 600; }
#embed-inbatch-negatives-root .s { font-size: 15px; fill: #475569; }
#embed-inbatch-negatives-root .xs { font-size: 13px; fill: #64748b; }
#embed-inbatch-negatives-root .k { font-size: 13px; font-weight: 700; letter-spacing: .04em; fill: #64748b; }
#embed-inbatch-negatives-root .m { font-family: 'SFMono-Regular', Menlo, Consolas, monospace; font-size: 14px; fill: #172b3a; }
#embed-inbatch-negatives-root .node { fill: #fff; stroke: #cbd5e1; stroke-width: 2; }
#embed-inbatch-negatives-root .blue { fill: #eff6ff; stroke: #60a5fa; stroke-width: 2; }
#embed-inbatch-negatives-root .green { fill: #ecfdf5; stroke: #20a28c; stroke-width: 2; }
#embed-inbatch-negatives-root .red { fill: #fff1f2; stroke: #e88191; stroke-width: 2; }
#embed-inbatch-negatives-root .amber { fill: #fffbeb; stroke: #e0a63a; stroke-width: 2; }
#embed-inbatch-negatives-root .violet { fill: #f5f3ff; stroke: #9b87f5; stroke-width: 2; }
#embed-inbatch-negatives-root .gray { fill: #f1f5f9; stroke: #cbd5e1; stroke-width: 2; }
#embed-inbatch-negatives-root .fblue { fill: #93c5fd; } #embed-inbatch-negatives-root .fgreen { fill: #6ee7b7; } #embed-inbatch-negatives-root .fred { fill: #fda4af; }
#embed-inbatch-negatives-root .famber { fill: #fcd34d; } #embed-inbatch-negatives-root .fviolet { fill: #c4b5fd; } #embed-inbatch-negatives-root .fgray { fill: #e2e8f0; }
#embed-inbatch-negatives-root .edge { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#embed-inbatch-negatives-arrow); }
#embed-inbatch-negatives-root .dash { fill: none; stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 7 6; marker-end: url(#embed-inbatch-negatives-arrow); }
#embed-inbatch-negatives-root .line { stroke: #cbd5e1; stroke-width: 1.5; fill: none; }
#embed-inbatch-negatives-root .axis { stroke: #64748b; stroke-width: 2; fill: none; }
</style><marker id="embed-inbatch-negatives-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker></defs>
<rect width="1320" height="600" fill="#f8fafc"/>
<text x="32" y="46" class="h">B 条问题共享一批条款：每行一个正确答案，其余都当负例</text>
<text x="32" y="78" class="s">示意 batch=4、每条附 1 个难负例；每行做一次 softmax 交叉熵，即 InfoNCE。</text>
<text x="460" y="140" class="k" text-anchor="middle">同批其他人的正例（批内负例）</text><text x="860" y="140" class="k" text-anchor="middle">挖出的难负例</text><text x="310" y="176" class="t" text-anchor="middle">P1</text><text x="410" y="176" class="t" text-anchor="middle">P2</text><text x="510" y="176" class="t" text-anchor="middle">P3</text><text x="610" y="176" class="t" text-anchor="middle">P4</text><text x="710" y="176" class="t" text-anchor="middle">H1</text><text x="810" y="176" class="t" text-anchor="middle">H2</text><text x="910" y="176" class="t" text-anchor="middle">H3</text><text x="1010" y="176" class="t" text-anchor="middle">H4</text><text x="246" y="233" class="s" text-anchor="end">Q1 年假怎么申请</text><rect x="263" y="199" width="94" height="58" rx="4" class="fgreen"/><text x="310" y="233" text-anchor="middle" class="s">正</text><rect x="363" y="199" width="94" height="58" rx="4" class="fgray"/><text x="410" y="233" text-anchor="middle" class="s">负</text><rect x="463" y="199" width="94" height="58" rx="4" class="fred"/><text x="510" y="233" text-anchor="middle" class="s">假负？</text><rect x="563" y="199" width="94" height="58" rx="4" class="fgray"/><text x="610" y="233" text-anchor="middle" class="s">负</text><rect x="663" y="199" width="94" height="58" rx="4" class="famber"/><text x="710" y="233" text-anchor="middle" class="s">难负</text><rect x="763" y="199" width="94" height="58" rx="4" class="fgray"/><text x="810" y="233" text-anchor="middle" class="s">负</text><rect x="863" y="199" width="94" height="58" rx="4" class="fgray"/><text x="910" y="233" text-anchor="middle" class="s">负</text><rect x="963" y="199" width="94" height="58" rx="4" class="fgray"/><text x="1010" y="233" text-anchor="middle" class="s">负</text><text x="246" y="297" class="s" text-anchor="end">Q2 加班费怎么算</text><rect x="263" y="263" width="94" height="58" rx="4" class="fgray"/><text x="310" y="297" text-anchor="middle" class="s">负</text><rect x="363" y="263" width="94" height="58" rx="4" class="fgreen"/><text x="410" y="297" text-anchor="middle" class="s">正</text><rect x="463" y="263" width="94" height="58" rx="4" class="fgray"/><text x="510" y="297" text-anchor="middle" class="s">负</text><rect x="563" y="263" width="94" height="58" rx="4" class="fgray"/><text x="610" y="297" text-anchor="middle" class="s">负</text><rect x="663" y="263" width="94" height="58" rx="4" class="fgray"/><text x="710" y="297" text-anchor="middle" class="s">负</text><rect x="763" y="263" width="94" height="58" rx="4" class="famber"/><text x="810" y="297" text-anchor="middle" class="s">难负</text><rect x="863" y="263" width="94" height="58" rx="4" class="fgray"/><text x="910" y="297" text-anchor="middle" class="s">负</text><rect x="963" y="263" width="94" height="58" rx="4" class="fgray"/><text x="1010" y="297" text-anchor="middle" class="s">负</text><text x="246" y="361" class="s" text-anchor="end">Q3 年假能拆半天吗</text><rect x="263" y="327" width="94" height="58" rx="4" class="fgray"/><text x="310" y="361" text-anchor="middle" class="s">负</text><rect x="363" y="327" width="94" height="58" rx="4" class="fgray"/><text x="410" y="361" text-anchor="middle" class="s">负</text><rect x="463" y="327" width="94" height="58" rx="4" class="fgreen"/><text x="510" y="361" text-anchor="middle" class="s">正</text><rect x="563" y="327" width="94" height="58" rx="4" class="fgray"/><text x="610" y="361" text-anchor="middle" class="s">负</text><rect x="663" y="327" width="94" height="58" rx="4" class="fgray"/><text x="710" y="361" text-anchor="middle" class="s">负</text><rect x="763" y="327" width="94" height="58" rx="4" class="fgray"/><text x="810" y="361" text-anchor="middle" class="s">负</text><rect x="863" y="327" width="94" height="58" rx="4" class="famber"/><text x="910" y="361" text-anchor="middle" class="s">难负</text><rect x="963" y="327" width="94" height="58" rx="4" class="fgray"/><text x="1010" y="361" text-anchor="middle" class="s">负</text><text x="246" y="425" class="s" text-anchor="end">Q4 出差住宿标准</text><rect x="263" y="391" width="94" height="58" rx="4" class="fgray"/><text x="310" y="425" text-anchor="middle" class="s">负</text><rect x="363" y="391" width="94" height="58" rx="4" class="fgray"/><text x="410" y="425" text-anchor="middle" class="s">负</text><rect x="463" y="391" width="94" height="58" rx="4" class="fgray"/><text x="510" y="425" text-anchor="middle" class="s">负</text><rect x="563" y="391" width="94" height="58" rx="4" class="fgreen"/><text x="610" y="425" text-anchor="middle" class="s">正</text><rect x="663" y="391" width="94" height="58" rx="4" class="fgray"/><text x="710" y="425" text-anchor="middle" class="s">负</text><rect x="763" y="391" width="94" height="58" rx="4" class="fgray"/><text x="810" y="425" text-anchor="middle" class="s">负</text><rect x="863" y="391" width="94" height="58" rx="4" class="fgray"/><text x="910" y="425" text-anchor="middle" class="s">负</text><rect x="963" y="391" width="94" height="58" rx="4" class="famber"/><text x="1010" y="425" text-anchor="middle" class="s">难负</text>
<g data-node="note1"><rect x="1084" y="196" width="196" height="120" rx="8" class="node"/><text x="1102" y="232" class="t">批越大</text><text x="1102" y="260" class="s">负例越多</text><text x="1102" y="283" class="s">区分越细</text></g>
<g data-node="note2"><rect x="1084" y="336" width="196" height="120" rx="8" class="red"/><text x="1102" y="372" class="t">假负例</text><text x="1102" y="400" class="s">同主题条款</text><text x="1102" y="423" class="s">可能也对，需过滤</text></g>
<g data-node="formula"><rect x="32" y="476" width="1256" height="96" rx="8" class="node"/><text x="50" y="512" class="t">每行的损失：−log( exp(s正/τ) ÷ Σ exp(s/τ) )</text><text x="50" y="540" class="s">s 是问题与条款向量的余弦相似度，τ 是温度（BGE 用 0.01，sentence-transformers 默认 0.05）；τ 越小，越盯着最难分的几个负例</text></g>
</svg>
