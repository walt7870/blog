<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="640" viewBox="0 0 1300 640" role="img" aria-labelledby="mm-clip-matrix-title mm-clip-matrix-desc" id="mm-clip-matrix-root">
<title id="mm-clip-matrix-title">CLIP 的 N×N 对比训练与零样本分类</title>
<desc id="mm-clip-matrix-desc">一个批次 N 对图文分别编码成向量，两两点积得到 N×N 相似度矩阵。对角线上的 N 个是真实配对，训练把它们拉高；其余 N²−N 个是错配，训练把它们压低。按行做一次交叉熵、按列再做一次，两者平均。训练好后，把类别名写成句子编码，选与图片向量最相似的句子，就是零样本分类。</desc>
<defs><style>
#mm-clip-matrix-root text { font-family: Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #172b3a; }
#mm-clip-matrix-root .h { font-size: 26px; font-weight: 700; }
#mm-clip-matrix-root .t { font-size: 19px; font-weight: 600; }
#mm-clip-matrix-root .s { font-size: 15px; fill: #475569; }
#mm-clip-matrix-root .xs { font-size: 13px; fill: #64748b; }
#mm-clip-matrix-root .k { font-size: 13px; font-weight: 700; letter-spacing: .04em; fill: #64748b; }
#mm-clip-matrix-root .m { font-family: 'SFMono-Regular', Menlo, Consolas, monospace; font-size: 14px; fill: #172b3a; }
#mm-clip-matrix-root .node { fill: #fff; stroke: #cbd5e1; stroke-width: 2; }
#mm-clip-matrix-root .blue { fill: #eff6ff; stroke: #60a5fa; stroke-width: 2; }
#mm-clip-matrix-root .green { fill: #ecfdf5; stroke: #20a28c; stroke-width: 2; }
#mm-clip-matrix-root .red { fill: #fff1f2; stroke: #e88191; stroke-width: 2; }
#mm-clip-matrix-root .amber { fill: #fffbeb; stroke: #e0a63a; stroke-width: 2; }
#mm-clip-matrix-root .violet { fill: #f5f3ff; stroke: #9b87f5; stroke-width: 2; }
#mm-clip-matrix-root .gray { fill: #f1f5f9; stroke: #cbd5e1; stroke-width: 2; }
#mm-clip-matrix-root .fblue { fill: #93c5fd; } #mm-clip-matrix-root .fgreen { fill: #6ee7b7; } #mm-clip-matrix-root .fred { fill: #fda4af; }
#mm-clip-matrix-root .famber { fill: #fcd34d; } #mm-clip-matrix-root .fviolet { fill: #c4b5fd; } #mm-clip-matrix-root .fgray { fill: #e2e8f0; }
#mm-clip-matrix-root .edge { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#mm-clip-matrix-arrow); }
#mm-clip-matrix-root .dash { fill: none; stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 7 6; marker-end: url(#mm-clip-matrix-arrow); }
#mm-clip-matrix-root .line { stroke: #cbd5e1; stroke-width: 1.5; fill: none; }
#mm-clip-matrix-root .axis { stroke: #64748b; stroke-width: 2; fill: none; }
</style><marker id="mm-clip-matrix-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker></defs>
<rect width="1300" height="640" fill="#f8fafc"/>
<text x="32" y="46" class="h">CLIP：在 N×N 相似度矩阵上，认出谁和谁是一对</text>
<text x="32" y="78" class="s">示意 N=4；CLIP 实际训练 N=32,768，每行有 32,767 个错配。</text>
<g data-node="cap-0"><rect x="384" y="112" width="152" height="58" rx="8" class="blue"/><text x="402" y="148" class="t">增值税发票</text></g><g data-node="cap-1"><rect x="544" y="112" width="152" height="58" rx="8" class="blue"/><text x="562" y="148" class="t">打车发票</text></g><g data-node="cap-2"><rect x="704" y="112" width="152" height="58" rx="8" class="blue"/><text x="722" y="148" class="t">餐饮小票</text></g><g data-node="cap-3"><rect x="864" y="112" width="152" height="58" rx="8" class="blue"/><text x="882" y="148" class="t">会议白板照片</text></g><text x="700" y="196" class="xs" text-anchor="middle">文本编码器 → 文本向量 T1…T4</text><g data-node="img-0"><rect x="32" y="224" width="150" height="54" rx="8" class="violet"/><text x="50" y="260" class="t">发票照片</text></g><path d="M182 251H372" class="line"/><rect x="384" y="224" width="152" height="54" rx="4" class="fgreen"/><text x="460" y="256" text-anchor="middle" class="s">I1·T1 拉高</text><rect x="544" y="224" width="152" height="54" rx="4" class="fgray"/><text x="620" y="256" text-anchor="middle" class="s">I1·T2 压低</text><rect x="704" y="224" width="152" height="54" rx="4" class="fgray"/><text x="780" y="256" text-anchor="middle" class="s">I1·T3 压低</text><rect x="864" y="224" width="152" height="54" rx="4" class="fgray"/><text x="940" y="256" text-anchor="middle" class="s">I1·T4 压低</text><g data-node="img-1"><rect x="32" y="286" width="150" height="54" rx="8" class="violet"/><text x="50" y="322" class="t">出租车票</text></g><path d="M182 313H372" class="line"/><rect x="384" y="286" width="152" height="54" rx="4" class="fgray"/><text x="460" y="318" text-anchor="middle" class="s">I2·T1 压低</text><rect x="544" y="286" width="152" height="54" rx="4" class="fgreen"/><text x="620" y="318" text-anchor="middle" class="s">I2·T2 拉高</text><rect x="704" y="286" width="152" height="54" rx="4" class="fgray"/><text x="780" y="318" text-anchor="middle" class="s">I2·T3 压低</text><rect x="864" y="286" width="152" height="54" rx="4" class="fgray"/><text x="940" y="318" text-anchor="middle" class="s">I2·T4 压低</text><g data-node="img-2"><rect x="32" y="348" width="150" height="54" rx="8" class="violet"/><text x="50" y="384" class="t">餐厅小票</text></g><path d="M182 375H372" class="line"/><rect x="384" y="348" width="152" height="54" rx="4" class="fgray"/><text x="460" y="380" text-anchor="middle" class="s">I3·T1 压低</text><rect x="544" y="348" width="152" height="54" rx="4" class="fgray"/><text x="620" y="380" text-anchor="middle" class="s">I3·T2 压低</text><rect x="704" y="348" width="152" height="54" rx="4" class="fgreen"/><text x="780" y="380" text-anchor="middle" class="s">I3·T3 拉高</text><rect x="864" y="348" width="152" height="54" rx="4" class="fgray"/><text x="940" y="380" text-anchor="middle" class="s">I3·T4 压低</text><g data-node="img-3"><rect x="32" y="410" width="150" height="54" rx="8" class="violet"/><text x="50" y="446" class="t">会议白板</text></g><path d="M182 437H372" class="line"/><rect x="384" y="410" width="152" height="54" rx="4" class="fgray"/><text x="460" y="442" text-anchor="middle" class="s">I4·T1 压低</text><rect x="544" y="410" width="152" height="54" rx="4" class="fgray"/><text x="620" y="442" text-anchor="middle" class="s">I4·T2 压低</text><rect x="704" y="410" width="152" height="54" rx="4" class="fgray"/><text x="780" y="442" text-anchor="middle" class="s">I4·T3 压低</text><rect x="864" y="410" width="152" height="54" rx="4" class="fgreen"/><text x="940" y="442" text-anchor="middle" class="s">I4·T4 拉高</text><text x="200" y="206" class="xs">图像编码器 → 图像向量 I1…I4</text>
<g data-node="loss"><rect x="32" y="492" width="640" height="120" rx="8" class="node"/><text x="50" y="528" class="t">损失：行、列各做一次交叉熵</text><text x="50" y="556" class="s">每一行：图 i 要在 N 段文字里选中 T_i</text><text x="50" y="579" class="s">每一列：文字 j 要在 N 张图里选中 I_j</text><text x="50" y="602" class="s">相似度先除以温度 τ（CLIP 可学习，初值 0.07）</text></g>
<g data-node="zs"><rect x="700" y="492" width="568" height="120" rx="8" class="green"/><text x="718" y="528" class="t">零样本分类：类别名变成句子</text><text x="718" y="556" class="s">“一张{发票/打车票/餐饮小票}的照片”</text><text x="718" y="579" class="s">与上传图片的向量比相似度，取最高者</text><text x="718" y="602" class="s">不需要为新类别重新训练</text></g>
</svg>
