<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="630" viewBox="0 0 1240 630" role="img" aria-labelledby="lora-update-path-title lora-update-path-desc" id="lora-update-path-root">
<title id="lora-update-path-title">LoRA 在一个线性层上的计算路径</title>
<desc id="lora-update-path-desc">以 Llama-3.1-8B 的 gate_proj 为例：输入 x 同时经过冻结的 14336×4096 原矩阵和 LoRA 分支。分支先用 16×4096 的 A 降到 16 维，再用 14336×16 的 B 升回，乘以 α/r 后与原输出相加。B 初始化为 0，训练开始时输出与原模型相同。</desc>
<defs><style>
#lora-update-path-root text { font-family: Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #172b3a; }
#lora-update-path-root .h { font-size: 26px; font-weight: 700; }
#lora-update-path-root .t { font-size: 19px; font-weight: 600; }
#lora-update-path-root .s { font-size: 15px; fill: #475569; }
#lora-update-path-root .xs { font-size: 13px; fill: #64748b; }
#lora-update-path-root .k { font-size: 13px; font-weight: 700; letter-spacing: .04em; fill: #64748b; }
#lora-update-path-root .m { font-family: 'SFMono-Regular', Menlo, Consolas, monospace; font-size: 14px; fill: #172b3a; }
#lora-update-path-root .node { fill: #fff; stroke: #cbd5e1; stroke-width: 2; }
#lora-update-path-root .blue { fill: #eff6ff; stroke: #60a5fa; stroke-width: 2; }
#lora-update-path-root .green { fill: #ecfdf5; stroke: #20a28c; stroke-width: 2; }
#lora-update-path-root .red { fill: #fff1f2; stroke: #e88191; stroke-width: 2; }
#lora-update-path-root .amber { fill: #fffbeb; stroke: #e0a63a; stroke-width: 2; }
#lora-update-path-root .violet { fill: #f5f3ff; stroke: #9b87f5; stroke-width: 2; }
#lora-update-path-root .gray { fill: #f1f5f9; stroke: #cbd5e1; stroke-width: 2; }
#lora-update-path-root .fblue { fill: #93c5fd; } #lora-update-path-root .fgreen { fill: #6ee7b7; } #lora-update-path-root .fred { fill: #fda4af; }
#lora-update-path-root .famber { fill: #fcd34d; } #lora-update-path-root .fviolet { fill: #c4b5fd; } #lora-update-path-root .fgray { fill: #e2e8f0; }
#lora-update-path-root .edge { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#lora-update-path-arrow); }
#lora-update-path-root .dash { fill: none; stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 7 6; marker-end: url(#lora-update-path-arrow); }
#lora-update-path-root .line { stroke: #cbd5e1; stroke-width: 1.5; fill: none; }
#lora-update-path-root .axis { stroke: #64748b; stroke-width: 2; fill: none; }
</style><marker id="lora-update-path-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker></defs>
<rect width="1240" height="630" fill="#f8fafc"/>
<text x="32" y="46" class="h">LoRA 不改原矩阵，旁边加一条“先压到 16 维再放大”的支路</text>
<text x="32" y="78" class="s">以 Llama-3.1-8B 第一个 FFN 投影 gate_proj、秩 r = 16、α = 32 为例；同样的支路挂在 q/k/v/o/gate/up/down 七种线性层上。</text>
<g data-node="x"><rect x="32" y="248" width="150" height="96" rx="8" class="gray"/><text x="50" y="284" class="t">输入 x</text><text x="50" y="312" class="s">4096 维</text></g>
<g data-node="w0"><rect x="252" y="128" width="300" height="120" rx="8" class="blue"/><text x="270" y="154" class="k">gate_proj 原矩阵</text><text x="270" y="180" class="t">冻结的 W₀（不更新）</text><text x="270" y="208" class="s">14336 × 4096</text><text x="270" y="231" class="s">58,720,256 个参数</text></g>
<g data-node="a"><rect x="252" y="300" width="170" height="150" rx="8" class="green"/><text x="270" y="326" class="k">降到 16 维</text><text x="270" y="352" class="t">A：16 × 4096</text><text x="270" y="380" class="s">65,536 个参数</text><text x="270" y="403" class="s">随机初始化</text></g>
<g data-node="b"><rect x="446" y="300" width="170" height="150" rx="8" class="amber"/><text x="464" y="326" class="k">升回 14336 维</text><text x="464" y="352" class="t">B：14336 × 16</text><text x="464" y="380" class="s">229,376 个参数</text><text x="464" y="403" class="s">初始化为 0</text></g>
<g data-node="scale"><rect x="640" y="330" width="120" height="90" rx="8" class="violet"/><text x="658" y="366" class="t">× α/r</text><text x="658" y="394" class="s">32/16 = 2</text></g>
<g data-node="sum"><rect x="792" y="228" width="100" height="90" rx="8" class="node"/><text x="810" y="264" class="t">相加</text><text x="810" y="292" class="s"></text></g>
<g data-node="h"><rect x="932" y="228" width="276" height="90" rx="8" class="gray"/><text x="950" y="264" class="t">h = W₀x + (α/r)·B(Ax)</text><text x="950" y="292" class="s">14336 维</text></g>
<path d="M182 280Q216 280 216 188H252" class="edge"/>
<path d="M182 312Q216 312 216 375H252" class="edge"/>
<path d="M552 188Q842 188 842 228" class="edge"/>
<path d="M422 375H446" class="edge"/>
<path d="M616 375H640" class="edge"/>
<path d="M760 375Q842 375 842 318" class="edge"/>
<path d="M892 273H932" class="edge"/>
<g data-node="init"><rect x="32" y="480" width="560" height="120" rx="8" class="node"/><text x="50" y="506" class="k">为什么 B 要初始化为 0</text><text x="50" y="532" class="t">训练第 0 步：B = 0，所以 BA = 0</text><text x="50" y="560" class="s">输出和原模型完全一样，训练从底座出发</text><text x="50" y="583" class="s">之后只有 A、B 收到梯度和优化器状态</text></g>
<g data-node="cnt"><rect x="640" y="480" width="568" height="120" rx="8" class="node"/><text x="658" y="506" class="k">参数量</text><text x="658" y="532" class="t">这一层只多训练 294,912 个参数</text><text x="658" y="560" class="s">16 × (4096 + 14336) = 294,912</text><text x="658" y="583" class="s">是 W₀ 的 0.50%；7 种线性层 × 32 层共约 4194 万</text></g>
</svg>
