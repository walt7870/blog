<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1370" height="560" viewBox="0 0 1370 560" role="img" aria-labelledby="eval-release-gate-title eval-release-gate-desc" id="eval-release-gate-root">
<title id="eval-release-gate-title">资料助手新模型从离线评估到在线发布的六道门</title>
<desc id="eval-release-gate-desc">候选模型依次经过冒烟检查、业务评测集、回归套件、LLM 评委与人工抽检四道离线门，再经过影子评估和小流量 A/B 两道在线门，全部通过才登记发布；任何一道不过都退回，按失败切片补数据或改配方。</desc>
<defs><style>
#eval-release-gate-root text { font-family: Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #172b3a; }
#eval-release-gate-root .h { font-size: 26px; font-weight: 700; }
#eval-release-gate-root .t { font-size: 19px; font-weight: 600; }
#eval-release-gate-root .s { font-size: 15px; fill: #475569; }
#eval-release-gate-root .xs { font-size: 13px; fill: #64748b; }
#eval-release-gate-root .k { font-size: 13px; font-weight: 700; letter-spacing: .04em; fill: #64748b; }
#eval-release-gate-root .m { font-family: 'SFMono-Regular', Menlo, Consolas, monospace; font-size: 14px; fill: #172b3a; }
#eval-release-gate-root .node { fill: #fff; stroke: #cbd5e1; stroke-width: 2; }
#eval-release-gate-root .blue { fill: #eff6ff; stroke: #60a5fa; stroke-width: 2; }
#eval-release-gate-root .green { fill: #ecfdf5; stroke: #20a28c; stroke-width: 2; }
#eval-release-gate-root .red { fill: #fff1f2; stroke: #e88191; stroke-width: 2; }
#eval-release-gate-root .amber { fill: #fffbeb; stroke: #e0a63a; stroke-width: 2; }
#eval-release-gate-root .violet { fill: #f5f3ff; stroke: #9b87f5; stroke-width: 2; }
#eval-release-gate-root .gray { fill: #f1f5f9; stroke: #cbd5e1; stroke-width: 2; }
#eval-release-gate-root .fblue { fill: #93c5fd; } #eval-release-gate-root .fgreen { fill: #6ee7b7; } #eval-release-gate-root .fred { fill: #fda4af; }
#eval-release-gate-root .famber { fill: #fcd34d; } #eval-release-gate-root .fviolet { fill: #c4b5fd; } #eval-release-gate-root .fgray { fill: #e2e8f0; }
#eval-release-gate-root .edge { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#eval-release-gate-arrow); }
#eval-release-gate-root .dash { fill: none; stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 7 6; marker-end: url(#eval-release-gate-arrow); }
#eval-release-gate-root .line { stroke: #cbd5e1; stroke-width: 1.5; fill: none; }
#eval-release-gate-root .axis { stroke: #64748b; stroke-width: 2; fill: none; }
</style><marker id="eval-release-gate-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker></defs>
<rect width="1370" height="560" fill="#f8fafc"/>
<text x="32" y="46" class="h">新版资料助手怎样一步步证明“更好且没变坏”</text>
<text x="32" y="78" class="s">越靠前越便宜、越快；越靠后越接近真实用户，代价也越高，所以便宜的门先挡住明显问题</text>
<path d="M32 122V112H774V122" class="line"/><rect x="38" y="100" width="207" height="26" rx="4" fill="#f8fafc"/><text x="44" y="118" class="s">离线：模型没见过的固定题目</text><path d="M792 122V112H1154V122" class="line"/><rect x="798" y="100" width="117" height="26" rx="4" fill="#f8fafc"/><text x="804" y="118" class="s">在线：真实请求</text><g data-node="gate-1"><rect x="32" y="130" width="172" height="200" rx="8" class="node"/><text x="50" y="156" class="k">门 1</text><text x="50" y="182" class="t">冒烟检查</text><text x="50" y="210" class="s">几十条固定问题</text><text x="50" y="233" class="s">模板、格式、停止</text><text x="50" y="256" class="s">几分钟出结果</text></g><path d="M205 230H219" class="edge"/><g data-node="gate-2"><rect x="222" y="130" width="172" height="200" rx="8" class="blue"/><text x="240" y="156" class="k">门 2</text><text x="240" y="182" class="t">业务评测集</text><text x="240" y="210" class="s">按切片统计</text><text x="240" y="233" class="s">政策题、无答案题</text><text x="240" y="256" class="s">对抗题、条款编号</text><text x="240" y="279" class="s">和上一版逐题配对</text></g><path d="M395 230H409" class="edge"/><g data-node="gate-3"><rect x="412" y="130" width="172" height="200" rx="8" class="blue"/><text x="430" y="156" class="k">门 3</text><text x="430" y="182" class="t">回归套件</text><text x="430" y="210" class="s">通用能力基准</text><text x="430" y="233" class="s">安全与越权</text><text x="430" y="256" class="s">拒答率、回答长度</text><text x="430" y="279" class="s">只许在容差内波动</text></g><path d="M585 230H599" class="edge"/><g data-node="gate-4"><rect x="602" y="130" width="172" height="200" rx="8" class="violet"/><text x="620" y="156" class="k">门 4</text><text x="620" y="182" class="t">评委与抽检</text><text x="620" y="210" class="s">LLM 评委换序两次</text><text x="620" y="233" class="s">按评分细则打分</text><text x="620" y="256" class="s">人工复核分歧题</text></g><path d="M775 230H789" class="edge"/><g data-node="gate-5"><rect x="792" y="130" width="172" height="200" rx="8" class="amber"/><text x="810" y="156" class="k">门 5</text><text x="810" y="182" class="t">影子评估</text><text x="810" y="210" class="s">复制真实请求</text><text x="810" y="233" class="s">新旧版本同时跑</text><text x="810" y="256" class="s">只返回旧版答案</text><text x="810" y="279" class="s">比较差异与延迟</text></g><path d="M965 230H979" class="edge"/><g data-node="gate-6"><rect x="982" y="130" width="172" height="200" rx="8" class="amber"/><text x="1000" y="156" class="k">门 6</text><text x="1000" y="182" class="t">小流量 A/B</text><text x="1000" y="210" class="s">5% 员工用新版</text><text x="1000" y="233" class="s">看采纳率、追问率</text><text x="1000" y="256" class="s">看投诉与转人工</text><text x="1000" y="279" class="s">预先定好停止条件</text></g><path d="M1155 230H1169" class="edge"/><g data-node="gate-7"><rect x="1172" y="130" width="172" height="200" rx="8" class="green"/><text x="1190" y="156" class="k">通过</text><text x="1190" y="182" class="t">发布登记</text><text x="1190" y="210" class="s">注册表记录证据</text><text x="1190" y="233" class="s">保留旧版可回滚</text><text x="1190" y="256" class="s">继续监控漂移</text></g><path d="M118 332V406" class="dash"/><path d="M308 332V406" class="dash"/><path d="M498 332V406" class="dash"/><path d="M688 332V406" class="dash"/><path d="M878 332V406" class="dash"/><path d="M1068 332V406" class="dash"/><g data-node="go-back"><rect x="32" y="410" width="1312" height="116" rx="8" class="red"/><text x="50" y="446" class="t">任一关不过：退回，不带着问题往下走</text><text x="50" y="474" class="s">先看失败样本落在哪个切片，再决定补数据、改训练配方，还是放弃这次训练、保留旧版。</text><text x="50" y="497" class="s">为调参反复看过的题目转入回归集；最终结论用另外留出、从没看过的冻结测试集重新测一遍。</text></g>
</svg>
