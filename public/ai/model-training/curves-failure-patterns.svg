<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="740" viewBox="0 0 1320 740" role="img" aria-labelledby="curves-failure-patterns-title curves-failure-patterns-desc" id="curves-failure-patterns-root">
<title id="curves-failure-patterns-title">六种异常训练曲线的示意形状</title>
<desc id="curves-failure-patterns-desc">示意：学习率过大时 loss 震荡上升；过小时下降缓慢；loss 尖峰后恢复；出现 NaN 后曲线中断；验证集与训练集重复时验证 loss 紧贴训练 loss；训练集大量重复时训练 loss 接近 0 而验证 loss 早早停住。</desc>
