<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="760" viewBox="0 0 1320 760" role="img" aria-labelledby="map-training-pipeline-title map-training-pipeline-desc" id="map-training-pipeline-root">
<title id="map-training-pipeline-title">大语言模型从数据到上线的阶段，以及其他模型的同构流程</title>
<desc id="map-training-pipeline-desc">大语言模型先用海量文本预训练得到基础模型，再经过 SFT、偏好对齐和强化学习等后训练，评估通过后部署；评估发现的问题回流到数据和后训练。前沿实验室负责预训练和通用后训练，普通团队从开源底座出发做后训练、评估和部署。语音识别、视觉和向量模型也遵循先通用预训练、再用任务数据微调的模式。</desc>
<defs><style>
#map-training-pipeline-root text { font-family: Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #172b3a; }
#map-training-pipeline-root .h { font-size: 26px; font-weight: 700; }
#map-training-pipeline-root .t { font-size: 19px; font-weight: 600; }
#map-training-pipeline-root .s { font-size: 15px; fill: #475569; }
#map-training-pipeline-root .xs { font-size: 13px; fill: #64748b; }
#map-training-pipeline-root .k { font-size: 13px; font-weight: 700; letter-spacing: .04em; fill: #64748b; }
#map-training-pipeline-root .m { font-family: 'SFMono-Regular', Menlo, Consolas, monospace; font-size: 14px; fill: #172b3a; }
#map-training-pipeline-root .node { fill: #fff; stroke: #cbd5e1; stroke-width: 2; }
#map-training-pipeline-root .blue { fill: #eff6ff; stroke: #60a5fa; stroke-width: 2; }
#map-training-pipeline-root .green { fill: #ecfdf5; stroke: #20a28c; stroke-width: 2; }
#map-training-pipeline-root .red { fill: #fff1f2; stroke: #e88191; stroke-width: 2; }
#map-training-pipeline-root .amber { fill: #fffbeb; stroke: #e0a63a; stroke-width: 2; }
#map-training-pipeline-root .violet { fill: #f5f3ff; stroke: #9b87f5; stroke-width: 2; }
#map-training-pipeline-root .gray { fill: #f1f5f9; stroke: #cbd5e1; stroke-width: 2; }
#map-training-pipeline-root .fblue { fill: #93c5fd; } #map-training-pipeline-root .fgreen { fill: #6ee7b7; } #map-training-pipeline-root .fred { fill: #fda4af; }
#map-training-pipeline-root .famber { fill: #fcd34d; } #map-training-pipeline-root .fviolet { fill: #c4b5fd; } #map-training-pipeline-root .fgray { fill: #e2e8f0; }
#map-training-pipeline-root .edge { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#map-training-pipeline-arrow); }
#map-training-pipeline-root .dash { fill: none; stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 7 6; marker-end: url(#map-training-pipeline-arrow); }
#map-training-pipeline-root .line { stroke: #cbd5e1; stroke-width: 1.5; fill: none; }
#map-training-pipeline-root .axis { stroke: #64748b; stroke-width: 2; fill: none; }
</style><marker id="map-training-pipeline-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker></defs>
<rect width="1320" height="760" fill="#f8fafc"/>
<text x="32" y="46" class="h">一个大模型从数据到上线：先通用，再专用</text>
<text x="32" y="78" class="s">上排是大语言模型的阶段；中间是谁通常负责哪一段；下排是其他模型的同构流程。</text>
<g data-node="data"><rect x="32" y="120" width="196" height="196" rx="8" class="gray"/><text x="50" y="146" class="k">06</text><text x="50" y="172" class="t">数据</text><text x="50" y="200" class="s">网页、书籍、代码</text><text x="50" y="223" class="s">过滤、去重、去隐私</text><text x="50" y="246" class="s">分词</text></g>
<g data-node="pre"><rect x="268" y="120" width="228" height="196" rx="8" class="blue"/><text x="286" y="146" class="k">07</text><text x="286" y="172" class="t">预训练</text><text x="286" y="200" class="s">预测下一个 token</text><text x="286" y="223" class="s">约 15T token</text><text x="286" y="246" class="s">产出：基础模型</text><text x="286" y="269" class="s">会续写，不会听指令</text></g>
<g data-node="post"><rect x="536" y="104" width="476" height="228" rx="10" fill="none" stroke="#9b87f5" stroke-width="2" stroke-dasharray="6 5"/><text x="554" y="128" class="k">后训练 · 09—12</text></g>
<g data-node="sft"><rect x="552" y="140" width="140" height="176" rx="8" class="violet"/><text x="570" y="176" class="t">SFT</text><text x="570" y="204" class="s">照标准答案学</text><text x="570" y="227" class="s">格式与口径</text><text x="570" y="250" class="s">产出：指令模型</text></g>
<g data-node="pref"><rect x="704" y="140" width="140" height="176" rx="8" class="violet"/><text x="722" y="176" class="t">偏好对齐</text><text x="722" y="204" class="s">两个回答</text><text x="722" y="227" class="s">哪个更好</text><text x="722" y="250" class="s">RLHF / DPO</text></g>
<g data-node="rl"><rect x="856" y="140" width="140" height="176" rx="8" class="violet"/><text x="874" y="176" class="t">强化学习</text><text x="874" y="204" class="s">可验证奖励</text><text x="874" y="227" class="s">数学、代码</text><text x="874" y="250" class="s">推理模型</text></g>
<g data-node="eval"><rect x="1052" y="120" width="112" height="196" rx="8" class="amber"/><text x="1070" y="146" class="k">21</text><text x="1070" y="172" class="t">评估</text><text x="1070" y="200" class="s">基准</text><text x="1070" y="223" class="s">业务集</text><text x="1070" y="246" class="s">回归</text></g>
<g data-node="deploy"><rect x="1196" y="120" width="96" height="196" rx="8" class="green"/><text x="1214" y="146" class="k">上线</text><text x="1214" y="172" class="t">部署</text><text x="1214" y="200" class="s">推理</text><text x="1214" y="223" class="s">服务</text></g>
<path d="M228 218H268" class="edge"/>
<path d="M496 218H536" class="edge"/>
<path d="M692 228H704" class="edge"/>
<path d="M844 228H856" class="edge"/>
<path d="M1012 218H1052" class="edge"/>
<path d="M1164 218H1196" class="edge"/>
<path d="M1108 316V352H130V320" class="dash"/>
<rect x="554" y="342" width="330" height="26" rx="4" fill="#f8fafc"/><text x="560" y="360" class="s">失败样例回流：补数据、改目标，再训一轮</text>
<text x="32" y="418" class="k">谁来做</text>
<rect x="32" y="432" width="1260" height="40" rx="4" class="fred"/>
<text x="48" y="458" class="s">前沿实验室与大厂：数据、预训练、通用后训练都做，数万张卡、数月；Llama 3.1 8B 记录 146 万 H100 GPU 小时</text>
<rect x="552" y="484" width="740" height="40" rx="4" class="fgreen"/>
<text x="568" y="510" class="s">普通团队：从开源底座出发，只做后训练的一段 + 评估 + 部署；1—8 张卡、数小时到数天</text>
<text x="32" y="572" class="k">其他模型同一个套路：大规模通用训练 → 用自己的任务数据微调</text>
<g data-node="asr"><rect x="32" y="588" width="400" height="140" rx="8" class="node"/><text x="50" y="614" class="k">14—15</text><text x="50" y="640" class="t">语音识别</text><text x="50" y="668" class="s">Whisper：68 万小时弱监督音频—文本对</text><text x="50" y="691" class="s">→ 口音、内部术语的转写数据微调</text><text x="50" y="714" class="s">指标：字错率 CER</text></g>
<g data-node="vision"><rect x="462" y="588" width="400" height="140" rx="8" class="node"/><text x="480" y="614" class="k">17—18</text><text x="480" y="640" class="t">视觉与图文</text><text x="480" y="668" class="s">大规模图像或 4 亿图文对（CLIP）预训练</text><text x="480" y="691" class="s">→ 冻结骨干、换分类头，或指令微调</text><text x="480" y="714" class="s">例：识别报销单类型</text></g>
<g data-node="embed"><rect x="892" y="588" width="400" height="140" rx="8" class="node"/><text x="910" y="614" class="k">20</text><text x="910" y="640" class="t">向量与重排</text><text x="910" y="668" class="s">海量文本对做对比学习预训练</text><text x="910" y="691" class="s">→ 用业务问答对、难负例微调</text><text x="910" y="714" class="s">指标：召回率、MRR</text></g>
</svg>
