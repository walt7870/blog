<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1340" height="560" viewBox="0 0 1340 560" role="img" aria-labelledby="asr-feature-pipeline-title asr-feature-pipeline-desc" id="asr-feature-pipeline-root">
<title id="asr-feature-pipeline-title">语音识别的特征流水线</title>
<desc id="asr-feature-pipeline-desc">5 秒的提问以 16 kHz 采样得到 80,000 个数，按 25 ms 窗长、10 ms 步长分帧得到约 500 帧，每帧做频谱并压成 80 个 log-Mel 频带，编码器再降采样到 250 帧；标注只有 6 个字，没有逐帧对应关系，这就是对齐问题。</desc>
<defs><style>
#asr-feature-pipeline-root text { font-family: Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #172b3a; }
#asr-feature-pipeline-root .h { font-size: 26px; font-weight: 700; }
#asr-feature-pipeline-root .t { font-size: 19px; font-weight: 600; }
#asr-feature-pipeline-root .s { font-size: 15px; fill: #475569; }
#asr-feature-pipeline-root .xs { font-size: 13px; fill: #64748b; }
#asr-feature-pipeline-root .k { font-size: 13px; font-weight: 700; letter-spacing: .04em; fill: #64748b; }
#asr-feature-pipeline-root .m { font-family: 'SFMono-Regular', Menlo, Consolas, monospace; font-size: 14px; fill: #172b3a; }
#asr-feature-pipeline-root .node { fill: #fff; stroke: #cbd5e1; stroke-width: 2; }
#asr-feature-pipeline-root .blue { fill: #eff6ff; stroke: #60a5fa; stroke-width: 2; }
#asr-feature-pipeline-root .green { fill: #ecfdf5; stroke: #20a28c; stroke-width: 2; }
#asr-feature-pipeline-root .red { fill: #fff1f2; stroke: #e88191; stroke-width: 2; }
#asr-feature-pipeline-root .amber { fill: #fffbeb; stroke: #e0a63a; stroke-width: 2; }
#asr-feature-pipeline-root .violet { fill: #f5f3ff; stroke: #9b87f5; stroke-width: 2; }
#asr-feature-pipeline-root .gray { fill: #f1f5f9; stroke: #cbd5e1; stroke-width: 2; }
#asr-feature-pipeline-root .fblue { fill: #93c5fd; } #asr-feature-pipeline-root .fgreen { fill: #6ee7b7; } #asr-feature-pipeline-root .fred { fill: #fda4af; }
#asr-feature-pipeline-root .famber { fill: #fcd34d; } #asr-feature-pipeline-root .fviolet { fill: #c4b5fd; } #asr-feature-pipeline-root .fgray { fill: #e2e8f0; }
#asr-feature-pipeline-root .edge { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#asr-feature-pipeline-arrow); }
#asr-feature-pipeline-root .dash { fill: none; stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 7 6; marker-end: url(#asr-feature-pipeline-arrow); }
#asr-feature-pipeline-root .line { stroke: #cbd5e1; stroke-width: 1.5; fill: none; }
#asr-feature-pipeline-root .axis { stroke: #64748b; stroke-width: 2; fill: none; }
</style><marker id="asr-feature-pipeline-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker></defs>
<rect width="1340" height="560" fill="#f8fafc"/>
<text x="32" y="46" class="h">一句 5 秒的提问怎样变成模型输入</text>
<text x="32" y="78" class="s">数字按 Whisper 的预处理口径：16 kHz、25 ms 窗、10 ms 步长、80 维 log-Mel</text>
<g data-node="feat-1"><rect x="32" y="120" width="236" height="210" rx="8" class="node"/><text x="50" y="146" class="k">1 采样</text><text x="50" y="172" class="t">波形</text><text x="50" y="200" class="s">每秒 16,000 个采样点</text><text x="50" y="223" class="s">5 秒提问 = 80,000 个数</text><text x="50" y="246" class="s">只记录气压的起伏</text></g><path d="M270 225H288" class="edge"/><g data-node="feat-2"><rect x="292" y="120" width="236" height="210" rx="8" class="blue"/><text x="310" y="146" class="k">2 分帧</text><text x="310" y="172" class="t">切成重叠的短窗</text><text x="310" y="200" class="s">窗长 25 ms = 400 点</text><text x="310" y="223" class="s">步长 10 ms = 160 点</text><text x="310" y="246" class="s">每秒约 100 帧</text></g><path d="M530 225H548" class="edge"/><g data-node="feat-3"><rect x="552" y="120" width="236" height="210" rx="8" class="violet"/><text x="570" y="146" class="k">3 频谱</text><text x="570" y="172" class="t">每帧做傅里叶变换</text><text x="570" y="200" class="s">看这一小段里</text><text x="570" y="223" class="s">各频率的能量</text><text x="570" y="246" class="s">共振峰区分不同的音</text></g><path d="M790 225H808" class="edge"/><g data-node="feat-4"><rect x="812" y="120" width="236" height="210" rx="8" class="green"/><text x="830" y="146" class="k">4 Mel + log</text><text x="830" y="172" class="t">压成 80 个频带</text><text x="830" y="200" class="s">低频分得细、高频粗</text><text x="830" y="223" class="s">取对数压缩动态范围</text><text x="830" y="246" class="s">5 秒 ≈ 500 帧 × 80</text></g><path d="M1050 225H1068" class="edge"/><g data-node="feat-5"><rect x="1072" y="120" width="236" height="210" rx="8" class="amber"/><text x="1090" y="146" class="k">5 编码器</text><text x="1090" y="172" class="t">降采样后输出表示</text><text x="1090" y="200" class="s">Whisper 卷积步长 2</text><text x="1090" y="223" class="s">每秒 50 帧，5 秒 250 帧</text><text x="1090" y="246" class="s">要对上 6 个汉字</text></g><text x="292" y="360" class="xs">相邻窗重叠 15 ms：</text><rect x="292" y="372" width="80" height="10" rx="2" class="fblue"/><rect x="324" y="382" width="80" height="10" rx="2" class="fblue"/><rect x="356" y="392" width="80" height="10" rx="2" class="fblue"/><rect x="388" y="402" width="80" height="10" rx="2" class="fblue"/><rect x="420" y="412" width="80" height="10" rx="2" class="fblue"/><rect x="812" y="368" width="20" height="12" rx="4" class="fgreen"/><rect x="834" y="368" width="20" height="12" rx="4" class="fgray"/><rect x="856" y="368" width="20" height="12" rx="4" class="fgreen"/><rect x="878" y="368" width="20" height="12" rx="4" class="fgray"/><rect x="900" y="368" width="20" height="12" rx="4" class="fgreen"/><rect x="922" y="368" width="20" height="12" rx="4" class="fgray"/><rect x="944" y="368" width="20" height="12" rx="4" class="fgreen"/><rect x="966" y="368" width="20" height="12" rx="4" class="fgray"/><rect x="988" y="368" width="20" height="12" rx="4" class="fgreen"/><rect x="1010" y="368" width="20" height="12" rx="4" class="fgray"/><rect x="812" y="382" width="20" height="12" rx="4" class="fgray"/><rect x="834" y="382" width="20" height="12" rx="4" class="fgreen"/><rect x="856" y="382" width="20" height="12" rx="4" class="fgray"/><rect x="878" y="382" width="20" height="12" rx="4" class="fgreen"/><rect x="900" y="382" width="20" height="12" rx="4" class="fgray"/><rect x="922" y="382" width="20" height="12" rx="4" class="fgreen"/><rect x="944" y="382" width="20" height="12" rx="4" class="fgray"/><rect x="966" y="382" width="20" height="12" rx="4" class="fgreen"/><rect x="988" y="382" width="20" height="12" rx="4" class="fgray"/><rect x="1010" y="382" width="20" height="12" rx="4" class="fgreen"/><rect x="812" y="396" width="20" height="12" rx="4" class="fgreen"/><rect x="834" y="396" width="20" height="12" rx="4" class="fgray"/><rect x="856" y="396" width="20" height="12" rx="4" class="fgreen"/><rect x="878" y="396" width="20" height="12" rx="4" class="fgray"/><rect x="900" y="396" width="20" height="12" rx="4" class="fgreen"/><rect x="922" y="396" width="20" height="12" rx="4" class="fgray"/><rect x="944" y="396" width="20" height="12" rx="4" class="fgreen"/><rect x="966" y="396" width="20" height="12" rx="4" class="fgray"/><rect x="988" y="396" width="20" height="12" rx="4" class="fgreen"/><rect x="1010" y="396" width="20" height="12" rx="4" class="fgray"/><rect x="812" y="410" width="20" height="12" rx="4" class="fgray"/><rect x="834" y="410" width="20" height="12" rx="4" class="fgreen"/><rect x="856" y="410" width="20" height="12" rx="4" class="fgray"/><rect x="878" y="410" width="20" height="12" rx="4" class="fgreen"/><rect x="900" y="410" width="20" height="12" rx="4" class="fgray"/><rect x="922" y="410" width="20" height="12" rx="4" class="fgreen"/><rect x="944" y="410" width="20" height="12" rx="4" class="fgray"/><rect x="966" y="410" width="20" height="12" rx="4" class="fgreen"/><rect x="988" y="410" width="20" height="12" rx="4" class="fgray"/><rect x="1010" y="410" width="20" height="12" rx="4" class="fgreen"/><rect x="812" y="424" width="20" height="12" rx="4" class="fgreen"/><rect x="834" y="424" width="20" height="12" rx="4" class="fgray"/><rect x="856" y="424" width="20" height="12" rx="4" class="fgreen"/><rect x="878" y="424" width="20" height="12" rx="4" class="fgray"/><rect x="900" y="424" width="20" height="12" rx="4" class="fgreen"/><rect x="922" y="424" width="20" height="12" rx="4" class="fgray"/><rect x="944" y="424" width="20" height="12" rx="4" class="fgreen"/><rect x="966" y="424" width="20" height="12" rx="4" class="fgray"/><rect x="988" y="424" width="20" height="12" rx="4" class="fgreen"/><rect x="1010" y="424" width="20" height="12" rx="4" class="fgray"/><rect x="812" y="438" width="20" height="12" rx="4" class="fgray"/><rect x="834" y="438" width="20" height="12" rx="4" class="fgreen"/><rect x="856" y="438" width="20" height="12" rx="4" class="fgray"/><rect x="878" y="438" width="20" height="12" rx="4" class="fgreen"/><rect x="900" y="438" width="20" height="12" rx="4" class="fgray"/><rect x="922" y="438" width="20" height="12" rx="4" class="fgreen"/><rect x="944" y="438" width="20" height="12" rx="4" class="fgray"/><rect x="966" y="438" width="20" height="12" rx="4" class="fgreen"/><rect x="988" y="438" width="20" height="12" rx="4" class="fgray"/><rect x="1010" y="438" width="20" height="12" rx="4" class="fgreen"/><text x="812" y="472" class="xs">行 = 80 个频带，列 = 时间帧</text><g data-node="gap"><rect x="1072" y="356" width="236" height="150" rx="8" class="red"/><text x="1090" y="382" class="k">训练要解决</text><text x="1090" y="408" class="t">对齐问题</text><text x="1090" y="436" class="s">标注只说“年假怎么申请”</text><text x="1090" y="459" class="s">没说哪一帧对应哪个字</text><text x="1090" y="482" class="s">250 帧 : 6 个字</text></g><path d="M1190 332V352" class="dash"/>
</svg>
