<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1340" height="520" viewBox="0 0 1340 520" role="img" aria-labelledby="parallel-llama3-layout-title parallel-llama3-layout-desc" id="parallel-llama3-layout-root">
<title id="parallel-llama3-layout-title">Llama 3 405B 预训练的并行布局</title>
<desc id="parallel-llama3-layout-desc">一台服务器内 8 张 H100 组成张量并行组；16 台服务器按层串成流水线，构成一个模型副本；128 个副本做 FSDP 数据并行，共 16,384 张卡，每卡约 400 TFLOPS、MFU 约 41%；长上下文阶段改为 TP8×CP16×PP16×DP8。</desc>
<defs><style>
#parallel-llama3-layout-root text { font-family: Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #172b3a; }
#parallel-llama3-layout-root .h { font-size: 26px; font-weight: 700; }
#parallel-llama3-layout-root .t { font-size: 19px; font-weight: 600; }
#parallel-llama3-layout-root .s { font-size: 15px; fill: #475569; }
#parallel-llama3-layout-root .xs { font-size: 13px; fill: #64748b; }
#parallel-llama3-layout-root .k { font-size: 13px; font-weight: 700; letter-spacing: .04em; fill: #64748b; }
#parallel-llama3-layout-root .m { font-family: 'SFMono-Regular', Menlo, Consolas, monospace; font-size: 14px; fill: #172b3a; }
#parallel-llama3-layout-root .node { fill: #fff; stroke: #cbd5e1; stroke-width: 2; }
#parallel-llama3-layout-root .blue { fill: #eff6ff; stroke: #60a5fa; stroke-width: 2; }
#parallel-llama3-layout-root .green { fill: #ecfdf5; stroke: #20a28c; stroke-width: 2; }
#parallel-llama3-layout-root .red { fill: #fff1f2; stroke: #e88191; stroke-width: 2; }
#parallel-llama3-layout-root .amber { fill: #fffbeb; stroke: #e0a63a; stroke-width: 2; }
#parallel-llama3-layout-root .violet { fill: #f5f3ff; stroke: #9b87f5; stroke-width: 2; }
#parallel-llama3-layout-root .gray { fill: #f1f5f9; stroke: #cbd5e1; stroke-width: 2; }
#parallel-llama3-layout-root .fblue { fill: #93c5fd; } #parallel-llama3-layout-root .fgreen { fill: #6ee7b7; } #parallel-llama3-layout-root .fred { fill: #fda4af; }
#parallel-llama3-layout-root .famber { fill: #fcd34d; } #parallel-llama3-layout-root .fviolet { fill: #c4b5fd; } #parallel-llama3-layout-root .fgray { fill: #e2e8f0; }
#parallel-llama3-layout-root .edge { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#parallel-llama3-layout-arrow); }
#parallel-llama3-layout-root .dash { fill: none; stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 7 6; marker-end: url(#parallel-llama3-layout-arrow); }
#parallel-llama3-layout-root .line { stroke: #cbd5e1; stroke-width: 1.5; fill: none; }
#parallel-llama3-layout-root .axis { stroke: #64748b; stroke-width: 2; fill: none; }
</style><marker id="parallel-llama3-layout-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker></defs>
<rect width="1340" height="520" fill="#f8fafc"/>
<text x="32" y="46" class="h">Llama 3 405B 的 3D 并行：通信越密，放得越靠里</text>
<text x="32" y="78" class="s">从一台服务器到一万六千张卡：TP 在机内，PP 跨机串联，DP 在最外层复制</text>
<g data-node="srv"><rect x="32" y="112" width="330" height="250" rx="8" class="blue"/><text x="50" y="138" class="k">TP8</text><text x="50" y="164" class="t">一台服务器 = 1 个 TP 组</text><text x="50" y="192" class="s">8 张 H100，NVLink 互联</text></g><rect x="52" y="212" width="64" height="40" rx="4" class="fblue"/><text x="84" y="237" text-anchor="middle" class="xs">GPU 0</text><rect x="126" y="212" width="64" height="40" rx="4" class="fblue"/><text x="158" y="237" text-anchor="middle" class="xs">GPU 1</text><rect x="200" y="212" width="64" height="40" rx="4" class="fblue"/><text x="232" y="237" text-anchor="middle" class="xs">GPU 2</text><rect x="274" y="212" width="64" height="40" rx="4" class="fblue"/><text x="306" y="237" text-anchor="middle" class="xs">GPU 3</text><rect x="52" y="262" width="64" height="40" rx="4" class="fblue"/><text x="84" y="287" text-anchor="middle" class="xs">GPU 4</text><rect x="126" y="262" width="64" height="40" rx="4" class="fblue"/><text x="158" y="287" text-anchor="middle" class="xs">GPU 5</text><rect x="200" y="262" width="64" height="40" rx="4" class="fblue"/><text x="232" y="287" text-anchor="middle" class="xs">GPU 6</text><rect x="274" y="262" width="64" height="40" rx="4" class="fblue"/><text x="306" y="287" text-anchor="middle" class="xs">GPU 7</text><text x="52" y="326" class="xs">每层矩阵切 8 份，每层都要</text><text x="52" y="346" class="xs">在卡间交换结果</text><g data-node="pp"><rect x="392" y="112" width="470" height="250" rx="8" class="violet"/><text x="410" y="138" class="k">PP16</text><text x="410" y="164" class="t">16 台服务器串成 1 个模型副本</text><text x="410" y="192" class="s">每台负责约 1/16 的层</text></g><rect x="412" y="210" width="40" height="36" rx="4" class="fviolet"/><text x="432" y="233" text-anchor="middle" class="xs">1</text><path d="M453 228H463" class="edge"/><rect x="466" y="210" width="40" height="36" rx="4" class="fviolet"/><text x="486" y="233" text-anchor="middle" class="xs">2</text><path d="M507 228H517" class="edge"/><rect x="520" y="210" width="40" height="36" rx="4" class="fviolet"/><text x="540" y="233" text-anchor="middle" class="xs">3</text><path d="M561 228H571" class="edge"/><rect x="574" y="210" width="40" height="36" rx="4" class="fviolet"/><text x="594" y="233" text-anchor="middle" class="xs">4</text><path d="M615 228H625" class="edge"/><rect x="628" y="210" width="40" height="36" rx="4" class="fviolet"/><text x="648" y="233" text-anchor="middle" class="xs">5</text><path d="M669 228H679" class="edge"/><rect x="682" y="210" width="40" height="36" rx="4" class="fviolet"/><text x="702" y="233" text-anchor="middle" class="xs">6</text><path d="M723 228H733" class="edge"/><rect x="736" y="210" width="40" height="36" rx="4" class="fviolet"/><text x="756" y="233" text-anchor="middle" class="xs">7</text><path d="M777 228H787" class="edge"/><rect x="790" y="210" width="40" height="36" rx="4" class="fviolet"/><text x="810" y="233" text-anchor="middle" class="xs">8</text><rect x="412" y="266" width="40" height="36" rx="4" class="fviolet"/><text x="432" y="289" text-anchor="middle" class="xs">9</text><path d="M453 284H463" class="edge"/><rect x="466" y="266" width="40" height="36" rx="4" class="fviolet"/><text x="486" y="289" text-anchor="middle" class="xs">10</text><path d="M507 284H517" class="edge"/><rect x="520" y="266" width="40" height="36" rx="4" class="fviolet"/><text x="540" y="289" text-anchor="middle" class="xs">11</text><path d="M561 284H571" class="edge"/><rect x="574" y="266" width="40" height="36" rx="4" class="fviolet"/><text x="594" y="289" text-anchor="middle" class="xs">12</text><path d="M615 284H625" class="edge"/><rect x="628" y="266" width="40" height="36" rx="4" class="fviolet"/><text x="648" y="289" text-anchor="middle" class="xs">13</text><path d="M669 284H679" class="edge"/><rect x="682" y="266" width="40" height="36" rx="4" class="fviolet"/><text x="702" y="289" text-anchor="middle" class="xs">14</text><path d="M723 284H733" class="edge"/><rect x="736" y="266" width="40" height="36" rx="4" class="fviolet"/><text x="756" y="289" text-anchor="middle" class="xs">15</text><path d="M777 284H787" class="edge"/><rect x="790" y="266" width="40" height="36" rx="4" class="fviolet"/><text x="810" y="289" text-anchor="middle" class="xs">16</text><text x="412" y="326" class="xs">段与段之间只传激活和激活的梯度，</text><text x="412" y="346" class="xs">可以走机间网络</text><g data-node="dp"><rect x="892" y="112" width="416" height="250" rx="8" class="green"/><text x="910" y="138" class="k">DP128</text><text x="910" y="164" class="t">128 个副本 = 数据并行</text><text x="910" y="192" class="s">FSDP 分片参数、梯度、优化器状态</text></g><rect x="912" y="208" width="250" height="30" rx="3" fill="#6ee7b7" stroke="#20a28c"/><rect x="920" y="217" width="250" height="30" rx="3" fill="#6ee7b7" stroke="#20a28c"/><rect x="928" y="226" width="250" height="30" rx="3" fill="#6ee7b7" stroke="#20a28c"/><rect x="936" y="235" width="250" height="30" rx="3" fill="#6ee7b7" stroke="#20a28c"/><rect x="944" y="244" width="250" height="30" rx="3" fill="#6ee7b7" stroke="#20a28c"/><rect x="952" y="253" width="250" height="30" rx="3" fill="#6ee7b7" stroke="#20a28c"/><text x="1196" y="270" class="t">× 128</text><text x="912" y="326" class="xs">每个副本吃不同的数据，</text><text x="912" y="346" class="xs">梯度在副本之间归约</text><path d="M362 237H388" class="edge"/><path d="M862 237H888" class="edge"/><g data-node="sum"><rect x="32" y="392" width="1276" height="104" rx="8" class="node"/><text x="50" y="418" class="k">Llama 3 405B 预训练（论文表 4）</text><text x="50" y="444" class="t">8 × 16 × 128 = 16,384 张 H100，每批 1600 万 token，每卡约 400 TFLOPS，MFU 约 41%</text><text x="50" y="472" class="s">长上下文阶段改成 TP8 × CP16 × PP16 × DP8：同样 16,384 张卡，序列 131,072，MFU 约 38%。通信最密的 TP 放在最内层。</text></g>
</svg>
