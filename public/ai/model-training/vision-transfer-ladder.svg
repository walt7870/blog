<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="560" viewBox="0 0 1300 560" role="img" aria-labelledby="vision-transfer-ladder-title vision-transfer-ladder-desc" id="vision-transfer-ladder-root">
<title id="vision-transfer-ladder-title">迁移学习的三种做法：冻结多少层</title>
<desc id="vision-transfer-ladder-desc">同一个 ImageNet 预训练 ResNet-50 骨干接一个 4 类分类头。线性探针只训练分类头的 8196 个参数；微调最后一段训练 layer4 和头，约 1500 万参数；全量微调训练全部约 2352 万参数。越往下可训练参数越多，需要的数据和算力越多，也越容易过拟合。</desc>
<defs><style>
#vision-transfer-ladder-root text { font-family: Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #172b3a; }
#vision-transfer-ladder-root .h { font-size: 26px; font-weight: 700; }
#vision-transfer-ladder-root .t { font-size: 19px; font-weight: 600; }
#vision-transfer-ladder-root .s { font-size: 15px; fill: #475569; }
#vision-transfer-ladder-root .xs { font-size: 13px; fill: #64748b; }
#vision-transfer-ladder-root .k { font-size: 13px; font-weight: 700; letter-spacing: .04em; fill: #64748b; }
#vision-transfer-ladder-root .m { font-family: 'SFMono-Regular', Menlo, Consolas, monospace; font-size: 14px; fill: #172b3a; }
#vision-transfer-ladder-root .node { fill: #fff; stroke: #cbd5e1; stroke-width: 2; }
#vision-transfer-ladder-root .blue { fill: #eff6ff; stroke: #60a5fa; stroke-width: 2; }
#vision-transfer-ladder-root .green { fill: #ecfdf5; stroke: #20a28c; stroke-width: 2; }
#vision-transfer-ladder-root .red { fill: #fff1f2; stroke: #e88191; stroke-width: 2; }
#vision-transfer-ladder-root .amber { fill: #fffbeb; stroke: #e0a63a; stroke-width: 2; }
#vision-transfer-ladder-root .violet { fill: #f5f3ff; stroke: #9b87f5; stroke-width: 2; }
#vision-transfer-ladder-root .gray { fill: #f1f5f9; stroke: #cbd5e1; stroke-width: 2; }
#vision-transfer-ladder-root .fblue { fill: #93c5fd; } #vision-transfer-ladder-root .fgreen { fill: #6ee7b7; } #vision-transfer-ladder-root .fred { fill: #fda4af; }
#vision-transfer-ladder-root .famber { fill: #fcd34d; } #vision-transfer-ladder-root .fviolet { fill: #c4b5fd; } #vision-transfer-ladder-root .fgray { fill: #e2e8f0; }
#vision-transfer-ladder-root .edge { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#vision-transfer-ladder-arrow); }
#vision-transfer-ladder-root .dash { fill: none; stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 7 6; marker-end: url(#vision-transfer-ladder-arrow); }
#vision-transfer-ladder-root .line { stroke: #cbd5e1; stroke-width: 1.5; fill: none; }
#vision-transfer-ladder-root .axis { stroke: #64748b; stroke-width: 2; fill: none; }
</style><marker id="vision-transfer-ladder-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker></defs>
<rect width="1300" height="560" fill="#f8fafc"/>
<text x="32" y="46" class="h">同一个预训练骨干，冻结多少层是一条连续的旋钮</text>
<text x="32" y="78" class="s">ResNet-50 + 4 类报销单分类头；灰色冻结、绿色参与训练。数据量区间为示意，按验证集结果调整。</text>
<text x="296" y="112" class="k">预训练骨干（ImageNet-1K，约 128 万张、1000 类）</text>
<g data-node="row-128"><rect x="32" y="128" width="236" height="112" rx="8" class="node"/><text x="50" y="164" class="t">线性探针</text><text x="50" y="192" class="s">只换最后一层</text><text x="50" y="215" class="s">每类几十张也能起步</text></g><g data-node="st-128-0"><rect x="296" y="144" width="126" height="80" rx="8" class="gray"/><text x="314" y="180" class="t">layer1</text><text x="314" y="208" class="s">冻结</text></g><g data-node="st-128-1"><rect x="438" y="144" width="126" height="80" rx="8" class="gray"/><text x="456" y="180" class="t">layer2</text><text x="456" y="208" class="s">冻结</text></g><g data-node="st-128-2"><rect x="580" y="144" width="126" height="80" rx="8" class="gray"/><text x="598" y="180" class="t">layer3</text><text x="598" y="208" class="s">冻结</text></g><g data-node="st-128-3"><rect x="722" y="144" width="126" height="80" rx="8" class="gray"/><text x="740" y="180" class="t">layer4</text><text x="740" y="208" class="s">冻结</text></g><path d="M848 184H876" class="edge"/><g data-node="head-128"><rect x="876" y="144" width="118" height="80" rx="8" class="green"/><text x="894" y="180" class="t">分类头</text><text x="894" y="208" class="s">2048→4</text></g><g data-node="info-128"><rect x="1018" y="128" width="250" height="112" rx="8" class="node"/><text x="1036" y="164" class="t">可训练 8,196 个参数</text><text x="1036" y="192" class="s">单卡几分钟</text><text x="1036" y="215" class="s">特征不合适时上限低</text></g>
<g data-node="row-264"><rect x="32" y="264" width="236" height="112" rx="8" class="node"/><text x="50" y="300" class="t">微调最后一段</text><text x="50" y="328" class="s">底层通用纹理保留</text><text x="50" y="351" class="s">高层适配票据版式</text></g><g data-node="st-264-0"><rect x="296" y="280" width="126" height="80" rx="8" class="gray"/><text x="314" y="316" class="t">layer1</text><text x="314" y="344" class="s">冻结</text></g><g data-node="st-264-1"><rect x="438" y="280" width="126" height="80" rx="8" class="gray"/><text x="456" y="316" class="t">layer2</text><text x="456" y="344" class="s">冻结</text></g><g data-node="st-264-2"><rect x="580" y="280" width="126" height="80" rx="8" class="gray"/><text x="598" y="316" class="t">layer3</text><text x="598" y="344" class="s">冻结</text></g><g data-node="st-264-3"><rect x="722" y="280" width="126" height="80" rx="8" class="green"/><text x="740" y="316" class="t">layer4</text><text x="740" y="344" class="s">训练</text></g><path d="M848 320H876" class="edge"/><g data-node="head-264"><rect x="876" y="280" width="118" height="80" rx="8" class="green"/><text x="894" y="316" class="t">分类头</text><text x="894" y="344" class="s">2048→4</text></g><g data-node="info-264"><rect x="1018" y="264" width="250" height="112" rx="8" class="node"/><text x="1036" y="300" class="t">可训练约 1497 万参数</text><text x="1036" y="328" class="s">每类几百张较稳</text><text x="1036" y="351" class="s">学习率比头小一个量级</text></g>
<g data-node="row-400"><rect x="32" y="400" width="236" height="112" rx="8" class="node"/><text x="50" y="436" class="t">全量微调</text><text x="50" y="464" class="s">所有层一起改</text><text x="50" y="487" class="s">数据和预训练差别大时</text></g><g data-node="st-400-0"><rect x="296" y="416" width="126" height="80" rx="8" class="green"/><text x="314" y="452" class="t">layer1</text><text x="314" y="480" class="s">训练</text></g><g data-node="st-400-1"><rect x="438" y="416" width="126" height="80" rx="8" class="green"/><text x="456" y="452" class="t">layer2</text><text x="456" y="480" class="s">训练</text></g><g data-node="st-400-2"><rect x="580" y="416" width="126" height="80" rx="8" class="green"/><text x="598" y="452" class="t">layer3</text><text x="598" y="480" class="s">训练</text></g><g data-node="st-400-3"><rect x="722" y="416" width="126" height="80" rx="8" class="green"/><text x="740" y="452" class="t">layer4</text><text x="740" y="480" class="s">训练</text></g><path d="M848 456H876" class="edge"/><g data-node="head-400"><rect x="876" y="416" width="118" height="80" rx="8" class="green"/><text x="894" y="452" class="t">分类头</text><text x="894" y="480" class="s">2048→4</text></g><g data-node="info-400"><rect x="1018" y="400" width="250" height="112" rx="8" class="node"/><text x="1036" y="436" class="t">可训练约 2352 万参数</text><text x="1036" y="464" class="s">需要上千张以上</text><text x="1036" y="487" class="s">小数据下最容易过拟合</text></g>
</svg>
