<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="590" viewBox="0 0 1120 590" role="img" aria-labelledby="rag-tool-responsibilities-title rag-tool-responsibilities-desc"><title id="rag-tool-responsibilities-title">同一退款咨询，文档、实时状态与写操作分开核对</title><desc id="rag-tool-responsibilities-desc">教学示例：政策说明适用条件；订单接口说明查询时状态；授权由服务端检查。</desc><defs><marker id="rag-tool-responsibilities-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker><style>text{font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#172b3a}.head{font-size:27px;font-weight:700}.node{font-size:20px;font-weight:700}.body{font-size:17px;fill:#475569}.box{fill:white;stroke:#cbd5e1;stroke-width:2}.blue{fill:#eff6ff;stroke:#60a5fa;stroke-width:2}.green{fill:#ecfdf5;stroke:#14b8a6;stroke-width:2}.red{fill:#fff1f2;stroke:#e88191;stroke-width:2}.line{fill:none;stroke:#64748b;stroke-width:2}.dash{stroke-dasharray:6 5}</style></defs><rect width="1120" height="590" fill="#f8fafc"/><text x="40" y="48" class="head" text-anchor="start">同一退款咨询，文档、实时状态与写操作分开核对</text><text x="40" y="80" class="body" text-anchor="start">教学示例：政策说明适用条件；订单接口说明查询时状态；授权由服务端检查。</text><path d="M335 190H402Q410 190 410 198V250H465" class="line" marker-end="url(#rag-tool-responsibilities-arrow)"/><path d="M335 390H402Q410 390 410 382V310H465" class="line" marker-end="url(#rag-tool-responsibilities-arrow)"/><path d="M755 280H820" class="line" marker-end="url(#rag-tool-responsibilities-arrow)"/><rect x="40" y="135" width="295" height="115" rx="6" class="blue"/><text x="56" y="167" class="node" text-anchor="start">RAG：政策证据</text><text x="56" y="197" class="body" text-anchor="start">审核通过后3–5个工作日</text><text x="56" y="222" class="body" text-anchor="start">保留渠道、版本与片段ID</text><rect x="40" y="335" width="295" height="115" rx="6" class="green"/><text x="56" y="367" class="node" text-anchor="start">工具：订单状态</text><text x="56" y="397" class="body" text-anchor="start">A102：查询时已审核</text><text x="56" y="422" class="body" text-anchor="start">保留审核与查询时间</text><rect x="465" y="220" width="290" height="145" rx="6" class="box"/><text x="481" y="252" class="node" text-anchor="start">模型组织解释</text><text x="481" y="282" class="body" text-anchor="start">条件、状态与来源对应</text><text x="481" y="307" class="body" text-anchor="start">缺日期或渠道时补查询</text><text x="481" y="332" class="body" text-anchor="start">不把预计范围改成保证</text><rect x="820" y="220" width="260" height="145" rx="6" class="box"/><text x="836" y="252" class="node" text-anchor="start">回答与来源核对</text><text x="836" y="282" class="body" text-anchor="start">引用存在且支持结论</text><text x="836" y="307" class="body" text-anchor="start">工作日需核对日历</text><rect x="465" y="430" width="615" height="105" rx="6" class="red"/><text x="481" y="462" class="node" text-anchor="start">若要执行退款：进入独立业务合同</text><text x="481" y="492" class="body" text-anchor="start">身份、归属、金额、授权、幂等与回读；RAG证据不授予写权限。</text><text x="40" y="550" class="body" text-anchor="start">检索服务也可包装成工具；两者可以组合，MCP连接协议不替代业务鉴权。</text></svg>
