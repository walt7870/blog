<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="rule-layers-title rule-layers-desc" id="rule-layers-root">
<title id="rule-layers-title">规则从全局到单次授权的四层</title>
<desc id="rule-layers-desc">全局规则约束所有项目，仓库规则写项目红线，技能封装可复用的做法，单次授权只针对一个具体操作，不能外推到下一次。</desc>
<defs><style>
#rule-layers-root text { font-family: Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #172b3a; }
#rule-layers-root .h { font-size: 26px; font-weight: 700; }
#rule-layers-root .t { font-size: 19px; font-weight: 600; }
#rule-layers-root .s { font-size: 15px; fill: #475569; }
#rule-layers-root .k { font-size: 13px; font-weight: 700; letter-spacing: .04em; fill: #64748b; }
#rule-layers-root .node { fill: #fff; stroke: #cbd5e1; stroke-width: 2; }
#rule-layers-root .blue { fill: #eff6ff; stroke: #60a5fa; stroke-width: 2; }
#rule-layers-root .green { fill: #ecfdf5; stroke: #20a28c; stroke-width: 2; }
#rule-layers-root .red { fill: #fff1f2; stroke: #e88191; stroke-width: 2; }
#rule-layers-root .amber { fill: #fffbeb; stroke: #e0a63a; stroke-width: 2; }
#rule-layers-root .violet { fill: #f5f3ff; stroke: #9b87f5; stroke-width: 2; }
#rule-layers-root .edge { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#rule-layers-arrow); }
#rule-layers-root .dash { fill: none; stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 7 6; marker-end: url(#rule-layers-arrow); }
#rule-layers-root .line { stroke: #cbd5e1; stroke-width: 1.5; }
</style><marker id="rule-layers-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker></defs>
<rect width="960" height="560" fill="#f8fafc"/>
<text x="32" y="46" class="h">规则分四层：越往下越具体，也越短命</text>
<text x="32" y="78" class="s">上层回答“永远不做什么”，下层回答“这一次可以做什么”。</text>
<g data-node="global"><rect x="32" y="116" width="430" height="184" rx="8" class="node"/><text x="50" y="142" class="k">所有项目</text><text x="50" y="168" class="t">全局规则</text><text x="50" y="196" class="s">任何界面改动先过设计底线</text><text x="50" y="219" class="s">不在笔记里存密钥</text><text x="50" y="242" class="s">先读知识索引，再核对现状</text></g>
<g data-node="repo"><rect x="498" y="116" width="430" height="184" rx="8" class="blue"/><text x="516" y="142" class="k">一个项目</text><text x="516" y="168" class="t">仓库 AGENTS.md</text><text x="516" y="196" class="s">改生产前只读核对目标</text><text x="516" y="219" class="s">不 git clean / reset 工作区</text><text x="516" y="242" class="s">同一检查失败三次就停下分析</text></g>
<g data-node="skill"><rect x="32" y="328" width="430" height="184" rx="8" class="green"/><text x="50" y="354" class="k">一类任务</text><text x="50" y="380" class="t">技能 Skill</text><text x="50" y="408" class="s">界面设计、图示、交付手册</text><text x="50" y="431" class="s">同一份技能软链给多个 Agent</text><text x="50" y="454" class="s">按任务加载，不常驻上下文</text></g>
<g data-node="grant"><rect x="498" y="328" width="430" height="184" rx="8" class="amber"/><text x="516" y="354" class="k">一个操作</text><text x="516" y="380" class="t">单次授权</text><text x="516" y="408" class="s">“合并这个 MR”</text><text x="516" y="431" class="s">只管这一个 MR、这一台机器</text><text x="516" y="454" class="s">下一次要重新问</text></g>
</svg>
