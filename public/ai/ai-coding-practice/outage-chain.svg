<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" role="img" aria-labelledby="outage-chain-title outage-chain-desc" id="outage-chain-root">
<title id="outage-chain-title">验收脚本误判引发的连锁回滚</title>
<desc id="outage-chain-desc">验收脚本把尚未就绪的 ready=None 当成失败，触发模型回滚，回滚连续重启撞上 systemd 启动次数上限，服务中断约 13 分钟；改进措施分别切断三处传播。</desc>
<defs><style>
#outage-chain-root text { font-family: Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #172b3a; }
#outage-chain-root .h { font-size: 26px; font-weight: 700; }
#outage-chain-root .t { font-size: 19px; font-weight: 600; }
#outage-chain-root .s { font-size: 15px; fill: #475569; }
#outage-chain-root .k { font-size: 13px; font-weight: 700; letter-spacing: .04em; fill: #64748b; }
#outage-chain-root .node { fill: #fff; stroke: #cbd5e1; stroke-width: 2; }
#outage-chain-root .blue { fill: #eff6ff; stroke: #60a5fa; stroke-width: 2; }
#outage-chain-root .green { fill: #ecfdf5; stroke: #20a28c; stroke-width: 2; }
#outage-chain-root .red { fill: #fff1f2; stroke: #e88191; stroke-width: 2; }
#outage-chain-root .amber { fill: #fffbeb; stroke: #e0a63a; stroke-width: 2; }
#outage-chain-root .violet { fill: #f5f3ff; stroke: #9b87f5; stroke-width: 2; }
#outage-chain-root .edge { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#outage-chain-arrow); }
#outage-chain-root .dash { fill: none; stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 7 6; marker-end: url(#outage-chain-arrow); }
#outage-chain-root .line { stroke: #cbd5e1; stroke-width: 1.5; }
</style><marker id="outage-chain-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker></defs>
<rect width="960" height="620" fill="#f8fafc"/>
<text x="32" y="46" class="h">一次约 13 分钟的中断：错误怎样一步步放大</text>
<text x="32" y="78" class="s">每个环节单独看都“按规则执行”，问题在于判断条件和回滚范围。</text>
<g data-node="check"><rect x="32" y="120" width="200" height="136" rx="8" class="amber"/><text x="50" y="156" class="t">验收脚本</text><text x="50" y="184" class="s">把 ready=None</text><text x="50" y="207" class="s">当作失败</text></g>
<g data-node="rollback"><rect x="264" y="120" width="200" height="136" rx="8" class="red"/><text x="282" y="156" class="t">触发回滚</text><text x="282" y="184" class="s">网关检查失败</text><text x="282" y="207" class="s">连模型一起回滚</text></g>
<g data-node="restart"><rect x="496" y="120" width="200" height="136" rx="8" class="red"/><text x="514" y="156" class="t">连续重启</text><text x="514" y="184" class="s">撞上 systemd</text><text x="514" y="207" class="s">StartLimitBurst</text></g>
<g data-node="down"><rect x="728" y="120" width="200" height="136" rx="8" class="red"/><text x="746" y="156" class="t">服务不可用</text><text x="746" y="184" class="s">中断约 13 分钟</text><text x="746" y="207" class="s">启动保护生效</text></g>
<path d="M232 188H264" class="edge"/>
<path d="M464 188H496" class="edge"/>
<path d="M696 188H728" class="edge"/>
<g data-node="fix1"><rect x="32" y="328" width="280" height="152" rx="8" class="green"/><text x="50" y="354" class="k">改进 1</text><text x="50" y="380" class="t">先演练验收脚本</text><text x="50" y="408" class="s">停服务前，对线上</text><text x="50" y="431" class="s">只读跑一遍检查</text><text x="50" y="454" class="s">确认判断条件</text></g>
<g data-node="fix2"><rect x="340" y="328" width="280" height="152" rx="8" class="green"/><text x="358" y="354" class="k">改进 2</text><text x="358" y="380" class="t">回滚只动出错的部分</text><text x="358" y="408" class="s">网关检查失败</text><text x="358" y="431" class="s">只回滚网关</text><text x="358" y="454" class="s">模型保持不动</text></g>
<g data-node="fix3"><rect x="648" y="328" width="280" height="152" rx="8" class="green"/><text x="666" y="354" class="k">改进 3</text><text x="666" y="380" class="t">启动前清状态</text><text x="666" y="408" class="s">先 reset-failed</text><text x="666" y="431" class="s">同时检查 is-active</text><text x="666" y="454" class="s">和 ready</text></g>
<path d="M132 256V328" class="dash"/>
<path d="M364 256V328" class="dash"/>
<path d="M596 256Q596 292 760 292Q788 292 788 328" class="dash"/>
<text x="32" y="540" class="s">脚本由 Agent 编写和执行；改进以后写进项目交接文档，后续会话按新流程发布。</text>
</svg>
