<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" role="img" aria-labelledby="task-quadrant-title task-quadrant-desc" id="task-quadrant-root">
<title id="task-quadrant-title">按可验证和可撤回划分任务</title>
<desc id="task-quadrant-desc">横轴是结果能否被测试或回读证明，纵轴是操作能否撤回；两者都高的交给 Agent，难验证且难撤回的由人主导。</desc>
<defs><style>
#task-quadrant-root text { font-family: Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #172b3a; }
#task-quadrant-root .h { font-size: 26px; font-weight: 700; }
#task-quadrant-root .t { font-size: 19px; font-weight: 600; }
#task-quadrant-root .s { font-size: 15px; fill: #475569; }
#task-quadrant-root .k { font-size: 13px; font-weight: 700; letter-spacing: .04em; fill: #64748b; }
#task-quadrant-root .node { fill: #fff; stroke: #cbd5e1; stroke-width: 2; }
#task-quadrant-root .blue { fill: #eff6ff; stroke: #60a5fa; stroke-width: 2; }
#task-quadrant-root .green { fill: #ecfdf5; stroke: #20a28c; stroke-width: 2; }
#task-quadrant-root .red { fill: #fff1f2; stroke: #e88191; stroke-width: 2; }
#task-quadrant-root .amber { fill: #fffbeb; stroke: #e0a63a; stroke-width: 2; }
#task-quadrant-root .violet { fill: #f5f3ff; stroke: #9b87f5; stroke-width: 2; }
#task-quadrant-root .edge { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#task-quadrant-arrow); }
#task-quadrant-root .dash { fill: none; stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 7 6; marker-end: url(#task-quadrant-arrow); }
#task-quadrant-root .line { stroke: #cbd5e1; stroke-width: 1.5; }
</style><marker id="task-quadrant-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker></defs>
<rect width="960" height="640" fill="#f8fafc"/>
<text x="32" y="46" class="h">两个问题决定交给谁：能不能验证，能不能撤回</text>
<text x="32" y="78" class="s">交出去之前先问：做错了，我们多快能发现，又能不能退回去？</text>
<path d="M120 576H912" class="edge"/><path d="M120 576V112" class="edge"/>
<text x="700" y="610" class="s">结果容易验证 →</text>
<text x="20" y="128" class="s">容易</text><text x="20" y="150" class="s">撤回</text>
<g data-node="q1"><rect x="528" y="120" width="384" height="208" rx="8" class="green"/><text x="546" y="146" class="k">可验证 · 可撤回</text><text x="546" y="172" class="t">交给 Agent 做完</text><text x="546" y="200" class="s">重构、补测试、写脚本</text><text x="546" y="223" class="s">文档、页面、图示</text><text x="546" y="246" class="s">有测试和截图兜底</text></g>
<g data-node="q2"><rect x="136" y="120" width="376" height="208" rx="8" class="blue"/><text x="154" y="146" class="k">难验证 · 可撤回</text><text x="154" y="172" class="t">Agent 探索，人来判断</text><text x="154" y="200" class="s">界面风格、方案对比</text><text x="154" y="223" class="s">写作口吻、命名</text><text x="154" y="246" class="s">多给几个选项</text></g>
<g data-node="q3"><rect x="528" y="344" width="384" height="208" rx="8" class="amber"/><text x="546" y="370" class="k">可验证 · 难撤回</text><text x="546" y="396" class="t">Agent 准备，人批准</text><text x="546" y="424" class="s">生产发布、数据迁移</text><text x="546" y="447" class="s">升级、合并到主干</text><text x="546" y="470" class="s">先只读核对，再单次授权</text></g>
<g data-node="q4"><rect x="136" y="344" width="376" height="208" rx="8" class="red"/><text x="154" y="370" class="k">难验证 · 难撤回</text><text x="154" y="396" class="t">人主导</text><text x="154" y="424" class="s">客户沟通、对外发送</text><text x="154" y="447" class="s">授权与凭据、架构取舍</text><text x="154" y="470" class="s">Agent 起草，人发出</text></g>
</svg>
