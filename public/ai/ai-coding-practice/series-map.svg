<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="series-map-title series-map-desc" id="series-map-root">
<title id="series-map-title">实战手记六篇的阅读路线</title>
<desc id="series-map-desc">从认识 Agent 的工作循环开始，依次讲多会话分工、规则与授权、验证证据、出错复盘和任务选择，每篇都基于真实项目经验。</desc>
<defs><style>
#series-map-root text { font-family: Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #172b3a; }
#series-map-root .h { font-size: 26px; font-weight: 700; }
#series-map-root .t { font-size: 19px; font-weight: 600; }
#series-map-root .s { font-size: 15px; fill: #475569; }
#series-map-root .k { font-size: 13px; font-weight: 700; letter-spacing: .04em; fill: #64748b; }
#series-map-root .node { fill: #fff; stroke: #cbd5e1; stroke-width: 2; }
#series-map-root .blue { fill: #eff6ff; stroke: #60a5fa; stroke-width: 2; }
#series-map-root .green { fill: #ecfdf5; stroke: #20a28c; stroke-width: 2; }
#series-map-root .red { fill: #fff1f2; stroke: #e88191; stroke-width: 2; }
#series-map-root .amber { fill: #fffbeb; stroke: #e0a63a; stroke-width: 2; }
#series-map-root .violet { fill: #f5f3ff; stroke: #9b87f5; stroke-width: 2; }
#series-map-root .edge { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#series-map-arrow); }
#series-map-root .dash { fill: none; stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 7 6; marker-end: url(#series-map-arrow); }
#series-map-root .line { stroke: #cbd5e1; stroke-width: 1.5; }
</style><marker id="series-map-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker></defs>
<rect width="960" height="520" fill="#f8fafc"/>
<text x="32" y="46" class="h">六篇文章，沿一次任务的生命周期展开</text>
<text x="32" y="78" class="s">先认识工具，再看怎样分工、立规矩、验收、复盘，最后决定什么活交出去。</text>
<g data-node="01"><rect x="32" y="120" width="280" height="136" rx="8" class="blue"/><text x="50" y="146" class="k">01</text><text x="50" y="172" class="t">它怎么干活</text><text x="50" y="200" class="s">补全、对话到 Agent</text><text x="50" y="223" class="s">读、改、跑、看结果的循环</text></g>
<g data-node="02"><rect x="340" y="120" width="280" height="136" rx="8" class="node"/><text x="358" y="146" class="k">02</text><text x="358" y="172" class="t">多会话怎样分工</text><text x="358" y="200" class="s">一项目一会话</text><text x="358" y="223" class="s">交接文档与知识笔记</text></g>
<g data-node="03"><rect x="648" y="120" width="280" height="136" rx="8" class="node"/><text x="666" y="146" class="k">03</text><text x="666" y="172" class="t">给它立规矩</text><text x="666" y="200" class="s">仓库规则、技能</text><text x="666" y="223" class="s">一次授权只管一件事</text></g>
<g data-node="04"><rect x="648" y="328" width="280" height="136" rx="8" class="green"/><text x="666" y="354" class="k">04</text><text x="666" y="380" class="t">让它拿出证据</text><text x="666" y="408" class="s">测试、浏览器、线上回读</text><text x="666" y="431" class="s">每份证据写明范围</text></g>
<g data-node="05"><rect x="340" y="328" width="280" height="136" rx="8" class="red"/><text x="358" y="354" class="k">05</text><text x="358" y="380" class="t">出错以后</text><text x="358" y="408" class="s">误判回滚、过度宣称</text><text x="358" y="431" class="s">AI 审查门禁的取舍</text></g>
<g data-node="06"><rect x="32" y="328" width="280" height="136" rx="8" class="amber"/><text x="50" y="354" class="k">06</text><text x="50" y="380" class="t">什么活交出去</text><text x="50" y="408" class="s">按可验证、可撤回</text><text x="50" y="431" class="s">划分人和 Agent 的分工</text></g>
<path d="M312 188H340" class="edge"/>
<path d="M620 188H648" class="edge"/>
<path d="M788 256V328" class="edge"/>
<path d="M648 396H620" class="edge"/>
<path d="M340 396H312" class="edge"/>
</svg>
