<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="460" viewBox="0 0 1120 460" role="img" aria-labelledby="sql-readonly-boundaries-title sql-readonly-boundaries-desc"><title id="sql-readonly-boundaries-title">SQL助手：候选SQL不能直接执行</title><desc id="sql-readonly-boundaries-desc">模型生成后以AST限定子集，数据库authorizer限制表列和函数，执行预算限制资源。</desc><defs><marker id="sql-readonly-boundaries-a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#526678"/></marker><style>text{font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#243746}.h{font-size:26px;font-weight:700}.t{font-size:19px;font-weight:700}.s{font-size:16px;fill:#526678}.b{fill:#fff;stroke:#b9cbd4;stroke-width:1.5}.f{fill:#e5f4ee;stroke:#43836e;stroke-width:1.5}.l{fill:none;stroke:#526678;stroke-width:2;marker-end:url(#sql-readonly-boundaries-a)}.d{stroke-dasharray:6 5}</style></defs><rect width="1120" height="460" fill="#f4f8fa"/><text x="36" y="48" class="h">SQL助手：候选SQL不能直接执行</text><text x="36" y="80" class="s">教学范围：SQLite内存数据、sales表、单条SELECT；拒绝CTE和跨数据库引用。</text>
<path class="l" d="M230 191H280"/><path class="l" d="M510 191H570"/><path class="l" d="M800 191H860"/>
<rect x="36" y="130" width="194" height="122" rx="6" class="b"/><text x="52" y="161" class="t">模型候选SQL</text><text x="52" y="187" class="s">只提供必要Schema</text><text x="52" y="212" class="s">输出仍视为不可信</text>
<rect x="280" y="130" width="230" height="122" rx="6" class="f"/><text x="296" y="161" class="t">SQLGlot解析</text><text x="296" y="187" class="s">单语句 / 表白名单</text><text x="296" y="212" class="s">非负整数LIMIT≤200</text>
<rect x="570" y="130" width="230" height="122" rx="6" class="f"/><text x="586" y="161" class="t">数据库执行边界</text><text x="586" y="187" class="s">query_only + authorizer</text><text x="586" y="212" class="s">限制表、列、聚合函数</text>
<rect x="860" y="130" width="224" height="122" rx="6" class="b"/><text x="876" y="161" class="t">有预算的执行</text><text x="876" y="187" class="s">progress handler</text><text x="876" y="212" class="s">fetchmany(200)</text>
<path class="l" d="M395 252V347H570"/><path class="l" d="M685 252V305"/><path class="l" d="M972 252V350H800"/>
<rect x="570" y="305" width="230" height="84" rx="6" class="b"/><text x="586" y="336" class="t">拒绝并记录安全错误</text><text x="586" y="362" class="s">不把底层异常原样返回</text>
<text x="36" y="422" class="s">LIMIT不限制扫描、排序或大字段；生产还需用户行级权限、字节上限、语句超时与并发配额。</text></svg>
