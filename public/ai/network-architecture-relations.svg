<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="525" viewBox="0 0 1120 525" role="img" aria-labelledby="network-architecture-relations-title network-architecture-relations-desc">
<title id="network-architecture-relations-title">网络机制与生成方法不是同一分类轴</title><desc id="network-architecture-relations-desc">按数据关系选择网络；按训练目标与采样过程选择生成方法，两者可以组合。</desc>
<defs><marker id="network-architecture-relations-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker><style>text{font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#172b3a}.head{font-size:28px;font-weight:700}.node{font-size:20px;font-weight:700}.body{font-size:17px;fill:#475569}.value{font-size:32px;font-weight:700}.box{fill:white;stroke:#cbd5e1;stroke-width:2}.blue{fill:#eff6ff;stroke:#60a5fa;stroke-width:2}.green{fill:#ecfdf5;stroke:#14b8a6;stroke-width:2}.red{fill:#fff1f2;stroke:#e88191;stroke-width:2}.line{stroke:#64748b;stroke-width:2;fill:none}.dashed{stroke-dasharray:6 5}</style></defs>
<rect width="1120" height="525" fill="#f8fafc"/>
<text class="head" x="40" y="48" text-anchor="start">网络机制与生成方法不是同一分类轴</text><text class="body" x="40" y="80" text-anchor="start">按数据关系选择网络；按训练目标与采样过程选择生成方法，两者可以组合。</text><rect class="box" x="40" y="135" width="235" height="110" rx="6"/><text class="node" x="60" y="168" text-anchor="start">固定维度特征</text><text class="body" x="60" y="197" text-anchor="start">MLP：组合各维数值</text><text class="body" x="60" y="222" text-anchor="start">不自动保留空间结构</text><rect class="box" x="305" y="135" width="235" height="110" rx="6"/><text class="node" x="325" y="168" text-anchor="start">局部网格 / 时序</text><text class="body" x="325" y="197" text-anchor="start">CNN：局部计算</text><text class="body" x="325" y="222" text-anchor="start">在位置间共享参数</text><rect class="box" x="570" y="135" width="235" height="110" rx="6"/><text class="node" x="590" y="168" text-anchor="start">序列与上下文</text><text class="body" x="590" y="197" text-anchor="start">RNN：递归状态</text><text class="body" x="590" y="222" text-anchor="start">Transformer：注意力</text><rect class="box" x="835" y="135" width="245" height="110" rx="6"/><text class="node" x="855" y="168" text-anchor="start">显式节点与边</text><text class="body" x="855" y="197" text-anchor="start">GNN：按边聚合信息</text><text class="body" x="855" y="222" text-anchor="start">图关系本身是输入</text><path class="line" marker-end="url(#network-architecture-relations-arrow)" d="M420 245V315H380V355"/><path class="line" marker-end="url(#network-architecture-relations-arrow)" d="M690 245V300H630V355"/><rect class="green" x="175" y="355" width="590" height="115" rx="6"/><text class="node" x="195" y="388" text-anchor="start">Diffusion：训练去噪器，再按采样过程生成</text><text class="body" x="195" y="417" text-anchor="start">去噪网络可以采用 CNN U-Net，也可以采用 Transformer</text><text class="body" x="195" y="442" text-anchor="start">Diffusion 不与 CNN / Transformer 构成互斥选项</text><text class="node" x="820" y="390" text-anchor="start">自回归语言生成</text><text class="body" x="820" y="425" text-anchor="start">通常逐 Token 执行</text><text class="body" x="820" y="455" text-anchor="start">训练并行 ≠ 生成全并行</text>
</svg>
