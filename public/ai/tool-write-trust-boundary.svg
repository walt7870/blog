<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="590" viewBox="0 0 1120 590" role="img" aria-labelledby="tool-write-trust-boundary-title tool-write-trust-boundary-desc"><title id="tool-write-trust-boundary-title">模型提出退款候选，执行服务掌握真实权限</title><desc id="tool-write-trust-boundary-desc">教学例：用户授权 A102 退款 19.90 元；外部文档要求改退 A103 的 199 元。</desc><defs><marker id="tool-write-trust-boundary-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker><style>text{font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#172b3a}.head{font-size:27px;font-weight:700}.node{font-size:20px;font-weight:700}.body{font-size:17px;fill:#475569}.box{fill:white;stroke:#cbd5e1;stroke-width:2}.blue{fill:#eff6ff;stroke:#60a5fa;stroke-width:2}.green{fill:#ecfdf5;stroke:#14b8a6;stroke-width:2}.red{fill:#fff1f2;stroke:#e88191;stroke-width:2}.line{fill:none;stroke:#64748b;stroke-width:2}.dash{stroke-dasharray:6 5}</style></defs><rect width="1120" height="590" fill="#f8fafc"/><text x="40" y="48" class="head" text-anchor="start">模型提出退款候选，执行服务掌握真实权限</text><text x="40" y="80" class="body" text-anchor="start">教学例：用户授权 A102 退款 19.90 元；外部文档要求改退 A103 的 199 元。</text><path d="M310 200H380" class="line" marker-end="url(#tool-write-trust-boundary-arrow)"/><path d="M680 200H750" class="line" marker-end="url(#tool-write-trust-boundary-arrow)"/><path d="M920 280V350" class="line" marker-end="url(#tool-write-trust-boundary-arrow)"/><path d="M750 245H718Q710 245 710 253V397Q710 405 702 405H680" class="line" marker-end="url(#tool-write-trust-boundary-arrow)"/><rect x="40" y="135" width="270" height="145" rx="6" class="box"/><text x="58" y="167" class="node" text-anchor="start">不可信外部内容</text><text x="58" y="197" class="body" text-anchor="start">文档 / 图片 / 工具文本</text><text x="58" y="223" class="body" text-anchor="start">可以包含注入指令</text><text x="58" y="249" class="body" text-anchor="start">不授予身份或写权限</text><rect x="380" y="135" width="300" height="145" rx="6" class="blue"/><text x="398" y="167" class="node" text-anchor="start">模型候选参数</text><text x="398" y="197" class="body" text-anchor="start">order_id / amount / reason</text><text x="398" y="223" class="body" text-anchor="start">JSON 合法只说明结构正确</text><text x="398" y="249" class="body" text-anchor="start">不能自证“用户已确认”</text><rect x="750" y="135" width="330" height="145" rx="6" class="green"/><text x="768" y="167" class="node" text-anchor="start">服务端校验与授权</text><text x="768" y="197" class="body" text-anchor="start">当前身份、订单归属和状态</text><text x="768" y="223" class="body" text-anchor="start">金额与既有授权范围匹配</text><text x="768" y="249" class="body" text-anchor="start">按业务政策判断是否需确认</text><rect x="750" y="350" width="330" height="115" rx="6" class="green"/><text x="768" y="382" class="node" text-anchor="start">交易服务与结果回读</text><text x="768" y="412" class="body" text-anchor="start">使用幂等键执行或返回原结果</text><text x="768" y="438" class="body" text-anchor="start">超时先查询操作状态</text><rect x="40" y="350" width="640" height="115" rx="6" class="red"/><text x="58" y="382" class="node" text-anchor="start">不匹配则拒绝，不能靠模型解释放行</text><text x="58" y="412" class="body" text-anchor="start">A103 / 199 元不属于当前授权目标；保留拒绝原因与审计。</text><text x="58" y="438" class="body" text-anchor="start">日志最小记录并限权；参数变化时旧确认不能复用。</text><text x="40" y="535" class="body" text-anchor="start">读取与写入权限隔离；密钥留在执行服务，外部内容和模型文本无法修改工具授权。</text></svg>
