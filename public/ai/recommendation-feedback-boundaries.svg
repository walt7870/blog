<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="540" viewBox="0 0 1120 540" role="img" aria-labelledby="recommendation-feedback-boundaries-title recommendation-feedback-boundaries-desc"><title id="recommendation-feedback-boundaries-title">排序分数不能抵消硬约束，点击也不等于完整偏好</title><desc id="recommendation-feedback-boundaries-desc">示例：首页返回 20 个商品；未返回、返回但不可见、可见但未点击，应分别记录。</desc><defs><marker id="recommendation-feedback-boundaries-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker><style>text{font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#172b3a}.head{font-size:28px;font-weight:700}.node{font-size:20px;font-weight:700}.body{font-size:17px;fill:#475569}.box{fill:white;stroke:#cbd5e1;stroke-width:2}.blue{fill:#eff6ff;stroke:#60a5fa;stroke-width:2}.green{fill:#ecfdf5;stroke:#14b8a6;stroke-width:2}.red{fill:#fff1f2;stroke:#e88191;stroke-width:2}.pad{fill:#e2e8f0;stroke:#94a3b8}.line{fill:none;stroke:#64748b;stroke-width:2}.dash{stroke-dasharray:6 5}</style></defs><rect width="1120" height="540" fill="#f8fafc"/><text x="40" y="48" class="head" text-anchor="start">排序分数不能抵消硬约束，点击也不等于完整偏好</text><text x="40" y="80" class="body" text-anchor="start">示例：首页返回 20 个商品；未返回、返回但不可见、可见但未点击，应分别记录。</text><path d="M220 195H270" class="line" marker-end="url(#recommendation-feedback-boundaries-arrow)"/><path d="M450 195H500" class="line" marker-end="url(#recommendation-feedback-boundaries-arrow)"/><path d="M680 195H730" class="line" marker-end="url(#recommendation-feedback-boundaries-arrow)"/><path d="M910 195H960" class="line" marker-end="url(#recommendation-feedback-boundaries-arrow)"/><path d="M1015 250V345H785V390" class="line" marker-end="url(#recommendation-feedback-boundaries-arrow)"/><path d="M625 445H520" class="line" marker-end="url(#recommendation-feedback-boundaries-arrow)"/><path d="M230 445H130V250" class="line dash" marker-end="url(#recommendation-feedback-boundaries-arrow)"/><rect x="40" y="140" width="180" height="110" class="box" rx="6"/><text x="58" y="172" class="node" text-anchor="start">多路召回</text><text x="58" y="202" class="body" text-anchor="start">用户、物品、上下文</text><text x="58" y="227" class="body" text-anchor="start">合并候选并去重</text><rect x="270" y="140" width="180" height="110" class="green" rx="6"/><text x="288" y="172" class="node" text-anchor="start">硬约束过滤</text><text x="288" y="202" class="body" text-anchor="start">权限、下架、合规</text><text x="288" y="227" class="body" text-anchor="start">库存按时效核对</text><rect x="500" y="140" width="180" height="110" class="blue" rx="6"/><text x="518" y="172" class="node" text-anchor="start">模型排序</text><text x="518" y="202" class="body" text-anchor="start">点击 / 转化 / 价值</text><text x="518" y="227" class="body" text-anchor="start">特征版本与分数</text><rect x="730" y="140" width="180" height="110" class="box" rx="6"/><text x="748" y="172" class="node" text-anchor="start">重排与复核</text><text x="748" y="202" class="body" text-anchor="start">多样性与业务约束</text><text x="748" y="227" class="body" text-anchor="start">关键状态再次核对</text><rect x="960" y="140" width="130" height="110" class="box" rx="6"/><text x="978" y="172" class="node" text-anchor="start">展示</text><text x="978" y="202" class="body" text-anchor="start">服务返回</text><text x="978" y="227" class="body" text-anchor="start">可见曝光</text><rect x="625" y="390" width="320" height="110" class="green" rx="6"/><text x="643" y="422" class="node" text-anchor="start">曝光与行为日志</text><text x="643" y="452" class="body" text-anchor="start">位置、候选来源、策略版本</text><text x="643" y="477" class="body" text-anchor="start">点击 / 转化与归因窗口</text><rect x="230" y="390" width="290" height="110" class="blue" rx="6"/><text x="248" y="422" class="node" text-anchor="start">后续训练数据</text><text x="248" y="452" class="body" text-anchor="start">去重、反作弊、延迟标签</text><text x="248" y="477" class="body" text-anchor="start">不把未曝光候选直接作负例</text><text x="40" y="320" class="body" text-anchor="start">虚线：治理后的数据用于后续模型与召回更新，不是一次点击立即改写当前权重。</text></svg>
