<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="475" viewBox="0 0 1120 475" role="img" aria-labelledby="gradient-update-example-title gradient-update-example-desc">
<title id="gradient-update-example-title">同一个梯度，不同步长带来不同结果</title><desc id="gradient-update-example-desc">教学单样本：x = 2，y = 4，预测 = wx，损失 L = 0.5 × (wx − y)²。</desc>
<defs><marker id="gradient-update-example-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker><style>text{font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#172b3a}.head{font-size:28px;font-weight:700}.node{font-size:20px;font-weight:700}.body{font-size:17px;fill:#475569}.value{font-size:32px;font-weight:700}.box{fill:white;stroke:#cbd5e1;stroke-width:2}.blue{fill:#eff6ff;stroke:#60a5fa;stroke-width:2}.green{fill:#ecfdf5;stroke:#14b8a6;stroke-width:2}.red{fill:#fff1f2;stroke:#e88191;stroke-width:2}.line{stroke:#64748b;stroke-width:2;fill:none}.dashed{stroke-dasharray:6 5}</style></defs>
<rect width="1120" height="475" fill="#f8fafc"/>
<text class="head" x="40" y="48" text-anchor="start">同一个梯度，不同步长带来不同结果</text><text class="body" x="40" y="80" text-anchor="start">教学单样本：x = 2，y = 4，预测 = wx，损失 L = 0.5 × (wx − y)²。</text><path class="line" marker-end="url(#gradient-update-example-arrow)" d="M330 210H390"/><path class="line" marker-end="url(#gradient-update-example-arrow)" d="M700 190H770V160H820"/><path class="line" marker-end="url(#gradient-update-example-arrow)" d="M700 230H770V340H820"/><rect class="box" x="40" y="150" width="290" height="120" rx="6"/><text class="node" x="60" y="183" text-anchor="start">当前参数 w = 1</text><text class="body" x="60" y="212" text-anchor="start">预测 = 2；损失 = 2</text><text class="body" x="60" y="237" text-anchor="start">梯度 = (wx − y)x = −4</text><rect class="blue" x="390" y="150" width="310" height="120" rx="6"/><text class="node" x="410" y="183" text-anchor="start">更新：w − 学习率 × 梯度</text><text class="body" x="410" y="212" text-anchor="start">负梯度描述局部下降方向</text><text class="body" x="410" y="237" text-anchor="start">步长过大没有下降保证</text><rect class="green" x="820" y="115" width="260" height="120" rx="6"/><text class="node" x="840" y="148" text-anchor="start">学习率 0.1</text><text class="body" x="840" y="177" text-anchor="start">新 w = 1.4</text><text class="body" x="840" y="202" text-anchor="start">预测 2.8；损失 0.72</text><rect class="red" x="820" y="290" width="260" height="120" rx="6"/><text class="node" x="840" y="323" text-anchor="start">学习率 1</text><text class="body" x="840" y="352" text-anchor="start">新 w = 5</text><text class="body" x="840" y="377" text-anchor="start">预测 10；损失 18</text><text class="body" x="40" y="435" text-anchor="start">梯度的数值依赖参数与输入尺度，不能直接当作业务特征的重要性排名。</text>
</svg>
