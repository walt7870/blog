<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="495" viewBox="0 0 1120 495" role="img" aria-labelledby="rl-state-action-loop-title rl-state-action-loop-desc"><title id="rl-state-action-loop-title">动作改变未来状态，安全约束不能只靠奖励分数</title><desc id="rl-state-action-loop-desc">示例：仓库机器人在仿真环境训练；状态是否足够完整，取决于建模与观测。</desc><defs><marker id="rl-state-action-loop-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker><style>text{font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#172b3a}.head{font-size:28px;font-weight:700}.node{font-size:20px;font-weight:700}.body{font-size:17px;fill:#475569}.box{fill:white;stroke:#cbd5e1;stroke-width:2}.blue{fill:#eff6ff;stroke:#60a5fa;stroke-width:2}.green{fill:#ecfdf5;stroke:#14b8a6;stroke-width:2}.red{fill:#fff1f2;stroke:#e88191;stroke-width:2}.pad{fill:#e2e8f0;stroke:#94a3b8}.line{fill:none;stroke:#64748b;stroke-width:2}.dash{stroke-dasharray:6 5}</style></defs><rect width="1120" height="495" fill="#f8fafc"/><text x="40" y="48" class="head" text-anchor="start">动作改变未来状态，安全约束不能只靠奖励分数</text><text x="40" y="80" class="body" text-anchor="start">示例：仓库机器人在仿真环境训练；状态是否足够完整，取决于建模与观测。</text><path d="M280 205H350" class="line" marker-end="url(#rl-state-action-loop-arrow)"/><path d="M620 205H690" class="line" marker-end="url(#rl-state-action-loop-arrow)"/><path d="M960 205H1005V350H180V270" class="line" marker-end="url(#rl-state-action-loop-arrow)"/><rect x="40" y="150" width="240" height="120" class="blue" rx="6"/><text x="58" y="182" class="node" text-anchor="start">观测与策略</text><text x="58" y="212" class="body" text-anchor="start">位置、电量、可见障碍</text><text x="58" y="237" class="body" text-anchor="start">选择动作的分布</text><rect x="350" y="150" width="270" height="120" class="green" rx="6"/><text x="368" y="182" class="node" text-anchor="start">动作与约束检查</text><text x="368" y="212" class="body" text-anchor="start">移动 / 充电 / 等待</text><text x="368" y="237" class="body" text-anchor="start">越界或低电量动作被拦截</text><rect x="690" y="150" width="270" height="120" class="box" rx="6"/><text x="708" y="182" class="node" text-anchor="start">仿真或受控环境</text><text x="708" y="212" class="body" text-anchor="start">执行动作，生成下一状态</text><text x="708" y="237" class="body" text-anchor="start">返回奖励、终止与失败</text><text x="370" y="385" class="body" text-anchor="start">反馈：下一观测、奖励与是否终止</text><text x="40" y="435" class="body" text-anchor="start">两步奖励 [−1,10]、折扣 0.9：起点回报 = −1 + 0.9 × 10 = 8。</text><text x="40" y="470" class="body" text-anchor="start">动作耗尽电量可能使第二步无法到达；平均奖励不能替代约束、极端轨迹和回滚检查。</text></svg>
