<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 476" role="img" aria-labelledby="int16-title int16-desc"><title id="int16-title">INT16 的存储结构</title><desc id="int16-desc">最高位：1 位，1，位权为 −2^15；1 时计入这一负值；其余位：15 位，111111111111011，位权从 2^14 递减到 2^0</desc><rect width="720" height="476" fill="#f4f7f9"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif" fill="#243b45"><text x="24" y="36" font-size="25" font-weight="600">INT16</text><text x="24" y="71" font-size="15" fill="#536975">16 位补码整数；示例 -5</text><rect x="24" y="108" width="42" height="32" fill="#f9e5e9"/><line x1="24" y1="108" x2="24" y2="140" stroke="#ffffff"/><text x="45" y="130" font-size="15" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace">1</text><rect x="66" y="108" width="630" height="32" fill="#e0e9f6"/><line x1="66" y1="108" x2="66" y2="140" stroke="#ffffff"/><text x="87" y="130" font-size="15" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace">1</text><line x1="108" y1="108" x2="108" y2="140" stroke="#ffffff"/><text x="129" y="130" font-size="15" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace">1</text><line x1="150" y1="108" x2="150" y2="140" stroke="#ffffff"/><text x="171" y="130" font-size="15" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace">1</text><line x1="192" y1="108" x2="192" y2="140" stroke="#ffffff"/><text x="213" y="130" font-size="15" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace">1</text><line x1="234" y1="108" x2="234" y2="140" stroke="#ffffff"/><text x="255" y="130" font-size="15" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace">1</text><line x1="276" y1="108" x2="276" y2="140" stroke="#ffffff"/><text x="297" y="130" font-size="15" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace">1</text><line x1="318" y1="108" x2="318" y2="140" stroke="#ffffff"/><text x="339" y="130" font-size="15" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace">1</text><line x1="360" y1="108" x2="360" y2="140" stroke="#ffffff"/><text x="381" y="130" font-size="15" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace">1</text><line x1="402" y1="108" x2="402" y2="140" stroke="#ffffff"/><text x="423" y="130" font-size="15" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace">1</text><line x1="444" y1="108" x2="444" y2="140" stroke="#ffffff"/><text x="465" y="130" font-size="15" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace">1</text><line x1="486" y1="108" x2="486" y2="140" stroke="#ffffff"/><text x="507" y="130" font-size="15" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace">1</text><line x1="528" y1="108" x2="528" y2="140" stroke="#ffffff"/><text x="549" y="130" font-size="15" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace">1</text><line x1="570" y1="108" x2="570" y2="140" stroke="#ffffff"/><text x="591" y="130" font-size="15" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace">0</text><line x1="612" y1="108" x2="612" y2="140" stroke="#ffffff"/><text x="633" y="130" font-size="15" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace">1</text><line x1="654" y1="108" x2="654" y2="140" stroke="#ffffff"/><text x="675" y="130" font-size="15" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace">1</text><rect x="24" y="160" width="4" height="22" fill="#f9e5e9"/><text x="36" y="178" font-size="17" font-weight="600">最高位</text><text x="36" y="201" font-size="13" fill="#536975">1 位 · 位 15</text><text x="696" y="200" font-size="15" text-anchor="end" font-family="ui-monospace, SFMono-Regular, monospace">1</text><text x="36" y="225" font-size="14" >位权为 −2^15；1 时计入这一负值</text><rect x="24" y="246" width="4" height="22" fill="#e0e9f6"/><text x="36" y="264" font-size="17" font-weight="600">其余位</text><text x="36" y="287" font-size="13" fill="#536975">15 位 · 位 14—0</text><text x="696" y="286" font-size="15" text-anchor="end" font-family="ui-monospace, SFMono-Regular, monospace">111111111111011</text><text x="36" y="311" font-size="14" >位权从 2^14 递减到 2^0</text><line x1="24" y1="345" x2="696" y2="345" stroke="#c9d4db"/><text x="24" y="374" font-size="15" >读回：−2^15 + (2^15 − 5) = −5</text><text x="24" y="404" font-size="15" >范围：−2^15 到 2^15−1</text><text x="24" y="434" font-size="15" >用于整数数据；最高位按负位权参与求和</text></g></svg>