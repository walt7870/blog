<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 564" role="img" aria-labelledby="fp8-e4m3fnuz-title fp8-e4m3fnuz-desc"><title id="fp8-e4m3fnuz-title">FP8 E4M3FNUZ 的存储结构</title><desc id="fp8-e4m3fnuz-desc">符号 S：1 位，0，0 取正号，1 取负号；指数 E：4 位，1000，8 − 偏移 8 = 指数 0；小数部分 F：3 位，010，第二位的位权为 1/4；隐含开头的 1</desc><rect width="720" height="564" fill="#f4f7f9"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif" fill="#243b45"><text x="24" y="36" font-size="25" font-weight="600">FP8 E4M3FNUZ</text><text x="24" y="71" font-size="15" fill="#536975">8 位；示例 1.25</text><rect x="24" y="108" width="84" height="32" fill="#f9e5e9"/><line x1="24" y1="108" x2="24" y2="140" stroke="#ffffff"/><text x="66" y="130" font-size="15" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace">0</text><rect x="108" y="108" width="336" height="32" fill="#dcece9"/><line x1="108" y1="108" x2="108" y2="140" stroke="#ffffff"/><text x="150" y="130" font-size="15" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace">1</text><line x1="192" y1="108" x2="192" y2="140" stroke="#ffffff"/><text x="234" y="130" font-size="15" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace">0</text><line x1="276" y1="108" x2="276" y2="140" stroke="#ffffff"/><text x="318" y="130" font-size="15" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace">0</text><line x1="360" y1="108" x2="360" y2="140" stroke="#ffffff"/><text x="402" y="130" font-size="15" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace">0</text><rect x="444" y="108" width="252" height="32" fill="#e0e9f6"/><line x1="444" y1="108" x2="444" y2="140" stroke="#ffffff"/><text x="486" y="130" font-size="15" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace">0</text><line x1="528" y1="108" x2="528" y2="140" stroke="#ffffff"/><text x="570" y="130" font-size="15" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace">1</text><line x1="612" y1="108" x2="612" y2="140" stroke="#ffffff"/><text x="654" y="130" font-size="15" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace">0</text><rect x="24" y="160" width="4" height="22" fill="#f9e5e9"/><text x="36" y="178" font-size="17" font-weight="600">符号 S</text><text x="36" y="201" font-size="13" fill="#536975">1 位 · 位 7</text><text x="696" y="200" font-size="15" text-anchor="end" font-family="ui-monospace, SFMono-Regular, monospace">0</text><text x="36" y="225" font-size="14" >0 取正号，1 取负号</text><rect x="24" y="246" width="4" height="22" fill="#dcece9"/><text x="36" y="264" font-size="17" font-weight="600">指数 E</text><text x="36" y="287" font-size="13" fill="#536975">4 位 · 位 6—3</text><text x="696" y="286" font-size="15" text-anchor="end" font-family="ui-monospace, SFMono-Regular, monospace">1000</text><text x="36" y="311" font-size="14" >8 − 偏移 8 = 指数 0</text><rect x="24" y="332" width="4" height="22" fill="#e0e9f6"/><text x="36" y="350" font-size="17" font-weight="600">小数部分 F</text><text x="36" y="373" font-size="13" fill="#536975">3 位 · 位 2—0</text><text x="696" y="372" font-size="15" text-anchor="end" font-family="ui-monospace, SFMono-Regular, monospace">010</text><text x="36" y="397" font-size="14" >第二位的位权为 1/4；隐含开头的 1</text><line x1="24" y1="431" x2="696" y2="431" stroke="#c9d4db"/><text x="24" y="460" font-size="15" >读回：(+1) × (1 + 1/4) × 2^0 = 1.25</text><text x="24" y="490" font-size="15" >最大有限值：240</text><text x="24" y="520" font-size="15" >单一零；10000000 是 NaN；偏移量为 8</text></g></svg>