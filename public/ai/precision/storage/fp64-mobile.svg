<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 728" role="img" aria-labelledby="fp64-title fp64-desc"><title id="fp64-title">FP64 的存储结构</title><desc id="fp64-desc">符号 S：1 位，0，0 取正号，1 取负号；指数 E：11 位，01111111111，1023 − 偏移 1023 = 指数 0；小数部分 F：52 位，0100000000000000000000000000000000000000000000000000，第二位的位权为 1/4；隐含开头的 1</desc><rect width="320" height="728" fill="#f4f7f9"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif" fill="#243b45"><text x="20" y="36" font-size="22" font-weight="600">FP64</text><text x="20" y="68" font-size="15" fill="#536975">64 位；示例 1.25</text><rect x="20" y="105" width="4.375" height="32" fill="#f9e5e9"/><rect x="24.375" y="105" width="48.125" height="32" fill="#dcece9"/><rect x="72.5" y="105" width="227.5" height="32" fill="#e0e9f6"/><rect x="20" y="157" width="4" height="21" fill="#f9e5e9"/><text x="32" y="175" font-size="17" font-weight="600">符号 S</text><text x="32" y="198" font-size="13" fill="#536975">1 位 · 位 63</text><text x="32" y="227" font-size="16" font-family="ui-monospace, SFMono-Regular, monospace">0</text><text x="32" y="253" font-size="15" >0 取正号，1 取负号</text><rect x="20" y="278" width="4" height="21" fill="#dcece9"/><text x="32" y="296" font-size="17" font-weight="600">指数 E</text><text x="32" y="319" font-size="13" fill="#536975">11 位 · 位 62—52</text><text x="32" y="348" font-size="16" font-family="ui-monospace, SFMono-Regular, monospace">01111111111</text><text x="32" y="374" font-size="15" >1023 − 偏移 1023 = 指数 0</text><rect x="20" y="399" width="4" height="21" fill="#e0e9f6"/><text x="32" y="417" font-size="17" font-weight="600">小数部分 F</text><text x="32" y="440" font-size="13" fill="#536975">52 位 · 位 51—0</text><text x="32" y="469" font-size="16" font-family="ui-monospace, SFMono-Regular, monospace">010000000000000000000000000</text><text x="32" y="491" font-size="16" font-family="ui-monospace, SFMono-Regular, monospace">0000000000000000000000000</text><text x="32" y="517" font-size="15" >第二位的位权为 1/4；隐含开头的 1</text><line x1="20" y1="555" x2="300" y2="555" stroke="#c9d4db"/><text x="20" y="584" font-size="15" >读回：(+1) × (1 + 1/4) × 2^0 =</text><text x="20" y="605" font-size="15" > 1.25</text><text x="20" y="635" font-size="15" >最大有限值：约 1.80 × 10^308</text><text x="20" y="665" font-size="15" >科学计算常见；支持零、次正规数、Inf </text><text x="20" y="686" font-size="15" >与 NaN</text></g></svg>