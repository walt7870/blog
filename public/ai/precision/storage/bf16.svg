<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 564" role="img" aria-labelledby="bf16-title bf16-desc"><title id="bf16-title">BF16 的存储结构</title><desc id="bf16-desc">符号 S：1 位，0，0 取正号，1 取负号；指数 E：8 位，01111111，127 − 偏移 127 = 指数 0；小数部分 F：7 位，0100000，第二位的位权为 1/4；隐含开头的 1</desc><rect width="720" height="564" fill="#f4f7f9"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif" fill="#243b45"><text x="24" y="36" font-size="25" font-weight="600">BF16</text><text x="24" y="71" font-size="15" fill="#536975">16 位；示例 1.25</text><rect x="24" y="108" width="42" height="32" fill="#f9e5e9"/><line x1="24" y1="108" x2="24" y2="140" stroke="#ffffff"/><text x="45" y="130" font-size="15" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace">0</text><rect x="66" y="108" width="336" height="32" fill="#dcece9"/><line x1="66" y1="108" x2="66" y2="140" stroke="#ffffff"/><text x="87" y="130" font-size="15" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace">0</text><line x1="108" y1="108" x2="108" y2="140" stroke="#ffffff"/><text x="129" y="130" font-size="15" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace">1</text><line x1="150" y1="108" x2="150" y2="140" stroke="#ffffff"/><text x="171" y="130" font-size="15" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace">1</text><line x1="192" y1="108" x2="192" y2="140" stroke="#ffffff"/><text x="213" y="130" font-size="15" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace">1</text><line x1="234" y1="108" x2="234" y2="140" stroke="#ffffff"/><text x="255" y="130" font-size="15" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace">1</text><line x1="276" y1="108" x2="276" y2="140" stroke="#ffffff"/><text x="297" y="130" font-size="15" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace">1</text><line x1="318" y1="108" x2="318" y2="140" stroke="#ffffff"/><text x="339" y="130" font-size="15" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace">1</text><line x1="360" y1="108" x2="360" y2="140" stroke="#ffffff"/><text x="381" y="130" font-size="15" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace">1</text><rect x="402" y="108" width="294" height="32" fill="#e0e9f6"/><line x1="402" y1="108" x2="402" y2="140" stroke="#ffffff"/><text x="423" y="130" font-size="15" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace">0</text><line x1="444" y1="108" x2="444" y2="140" stroke="#ffffff"/><text x="465" y="130" font-size="15" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace">1</text><line x1="486" y1="108" x2="486" y2="140" stroke="#ffffff"/><text x="507" y="130" font-size="15" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace">0</text><line x1="528" y1="108" x2="528" y2="140" stroke="#ffffff"/><text x="549" y="130" font-size="15" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace">0</text><line x1="570" y1="108" x2="570" y2="140" stroke="#ffffff"/><text x="591" y="130" font-size="15" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace">0</text><line x1="612" y1="108" x2="612" y2="140" stroke="#ffffff"/><text x="633" y="130" font-size="15" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace">0</text><line x1="654" y1="108" x2="654" y2="140" stroke="#ffffff"/><text x="675" y="130" font-size="15" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace">0</text><rect x="24" y="160" width="4" height="22" fill="#f9e5e9"/><text x="36" y="178" font-size="17" font-weight="600">符号 S</text><text x="36" y="201" font-size="13" fill="#536975">1 位 · 位 15</text><text x="696" y="200" font-size="15" text-anchor="end" font-family="ui-monospace, SFMono-Regular, monospace">0</text><text x="36" y="225" font-size="14" >0 取正号，1 取负号</text><rect x="24" y="246" width="4" height="22" fill="#dcece9"/><text x="36" y="264" font-size="17" font-weight="600">指数 E</text><text x="36" y="287" font-size="13" fill="#536975">8 位 · 位 14—7</text><text x="696" y="286" font-size="15" text-anchor="end" font-family="ui-monospace, SFMono-Regular, monospace">01111111</text><text x="36" y="311" font-size="14" >127 − 偏移 127 = 指数 0</text><rect x="24" y="332" width="4" height="22" fill="#e0e9f6"/><text x="36" y="350" font-size="17" font-weight="600">小数部分 F</text><text x="36" y="373" font-size="13" fill="#536975">7 位 · 位 6—0</text><text x="696" y="372" font-size="15" text-anchor="end" font-family="ui-monospace, SFMono-Regular, monospace">0100000</text><text x="36" y="397" font-size="14" >第二位的位权为 1/4；隐含开头的 1</text><line x1="24" y1="431" x2="696" y2="431" stroke="#c9d4db"/><text x="24" y="460" font-size="15" >读回：(+1) × (1 + 1/4) × 2^0 = 1.25</text><text x="24" y="490" font-size="15" >最大有限值：约 3.39 × 10^38</text><text x="24" y="520" font-size="15" >8 位指数保留宽范围；小数部分保存 7 位</text></g></svg>