<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 564" role="img" aria-labelledby="fp64-title fp64-desc"><title id="fp64-title">FP64 的存储结构</title><desc id="fp64-desc">符号 S：1 位，0，0 取正号，1 取负号；指数 E：11 位，01111111111，1023 − 偏移 1023 = 指数 0；小数部分 F：52 位，0100000000000000000000000000000000000000000000000000，第二位的位权为 1/4；隐含开头的 1</desc><rect width="720" height="564" fill="#f4f7f9"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif" fill="#243b45"><text x="24" y="36" font-size="25" font-weight="600">FP64</text><text x="24" y="71" font-size="15" fill="#536975">64 位；示例 1.25</text><rect x="24" y="108" width="10.5" height="32" fill="#f9e5e9"/><rect x="34.5" y="108" width="115.5" height="32" fill="#dcece9"/><rect x="150" y="108" width="546" height="32" fill="#e0e9f6"/><rect x="24" y="160" width="4" height="22" fill="#f9e5e9"/><text x="36" y="178" font-size="17" font-weight="600">符号 S</text><text x="36" y="201" font-size="13" fill="#536975">1 位 · 位 63</text><text x="696" y="200" font-size="15" text-anchor="end" font-family="ui-monospace, SFMono-Regular, monospace">0</text><text x="36" y="225" font-size="14" >0 取正号，1 取负号</text><rect x="24" y="246" width="4" height="22" fill="#dcece9"/><text x="36" y="264" font-size="17" font-weight="600">指数 E</text><text x="36" y="287" font-size="13" fill="#536975">11 位 · 位 62—52</text><text x="696" y="286" font-size="15" text-anchor="end" font-family="ui-monospace, SFMono-Regular, monospace">01111111111</text><text x="36" y="311" font-size="14" >1023 − 偏移 1023 = 指数 0</text><rect x="24" y="332" width="4" height="22" fill="#e0e9f6"/><text x="36" y="350" font-size="17" font-weight="600">小数部分 F</text><text x="36" y="373" font-size="13" fill="#536975">52 位 · 位 51—0</text><text x="696" y="372" font-size="15" text-anchor="end" font-family="ui-monospace, SFMono-Regular, monospace">01000000000000000000000000000</text><text x="696" y="393" font-size="15" text-anchor="end" font-family="ui-monospace, SFMono-Regular, monospace">00000000000000000000000</text><text x="36" y="397" font-size="14" >第二位的位权为 1/4；隐含开头的 1</text><line x1="24" y1="431" x2="696" y2="431" stroke="#c9d4db"/><text x="24" y="460" font-size="15" >读回：(+1) × (1 + 1/4) × 2^0 = 1.25</text><text x="24" y="490" font-size="15" >最大有限值：约 1.80 × 10^308</text><text x="24" y="520" font-size="15" >科学计算常见；支持零、次正规数、Inf 与 NaN</text></g></svg>