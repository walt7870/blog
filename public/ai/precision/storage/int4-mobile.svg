<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 588" role="img" aria-labelledby="int4-title int4-desc"><title id="int4-title">INT4 的存储结构</title><desc id="int4-desc">最高位：1 位，1，位权为 −2^3；1 时计入这一负值；其余位：3 位，011，位权从 2^2 递减到 2^0</desc><rect width="320" height="588" fill="#f4f7f9"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif" fill="#243b45"><text x="20" y="36" font-size="22" font-weight="600">INT4</text><text x="20" y="68" font-size="15" fill="#536975">4 位补码整数；示例 -5</text><rect x="20" y="105" width="70" height="32" fill="#f9e5e9"/><line x1="20" y1="105" x2="20" y2="137" stroke="#ffffff"/><text x="55" y="127" font-size="15" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace">1</text><rect x="90" y="105" width="210" height="32" fill="#e0e9f6"/><line x1="90" y1="105" x2="90" y2="137" stroke="#ffffff"/><text x="125" y="127" font-size="15" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace">0</text><line x1="160" y1="105" x2="160" y2="137" stroke="#ffffff"/><text x="195" y="127" font-size="15" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace">1</text><line x1="230" y1="105" x2="230" y2="137" stroke="#ffffff"/><text x="265" y="127" font-size="15" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace">1</text><rect x="20" y="157" width="4" height="21" fill="#f9e5e9"/><text x="32" y="175" font-size="17" font-weight="600">最高位</text><text x="32" y="198" font-size="13" fill="#536975">1 位 · 位 3</text><text x="32" y="227" font-size="16" font-family="ui-monospace, SFMono-Regular, monospace">1</text><text x="32" y="253" font-size="15" >位权为 −2^3；1 时计入这一负值</text><rect x="20" y="278" width="4" height="21" fill="#e0e9f6"/><text x="32" y="296" font-size="17" font-weight="600">其余位</text><text x="32" y="319" font-size="13" fill="#536975">3 位 · 位 2—0</text><text x="32" y="348" font-size="16" font-family="ui-monospace, SFMono-Regular, monospace">011</text><text x="32" y="374" font-size="15" >位权从 2^2 递减到 2^0</text><line x1="20" y1="412" x2="300" y2="412" stroke="#c9d4db"/><text x="20" y="441" font-size="15" >读回：−8 + 0×4 + 1×2 + 1×1 = </text><text x="20" y="462" font-size="15" >−5</text><text x="20" y="492" font-size="15" >范围：−8 到 7</text><text x="20" y="522" font-size="15" >量化时另保存组级 scale，按方案还可有</text><text x="20" y="543" font-size="15" >零点</text></g></svg>