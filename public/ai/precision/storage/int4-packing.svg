<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 476" role="img" aria-labelledby="int4-packing-title int4-packing-desc"><title id="int4-packing-title">两个 INT4 怎样装进一字节 的存储结构</title><desc id="int4-packing-desc">高 4 位：4 位，0011，第二个值：补码 0011 = 3；低 4 位：4 位，1011，第一个值：补码 1011 = −5</desc><rect width="720" height="476" fill="#f4f7f9"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif" fill="#243b45"><text x="24" y="36" font-size="25" font-weight="600">两个 INT4 怎样装进一字节</text><text x="24" y="71" font-size="15" fill="#536975">采用 ONNX 的先低半字节、后高半字节排列</text><rect x="24" y="108" width="336" height="32" fill="#e0e9f6"/><line x1="24" y1="108" x2="24" y2="140" stroke="#ffffff"/><text x="66" y="130" font-size="15" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace">0</text><line x1="108" y1="108" x2="108" y2="140" stroke="#ffffff"/><text x="150" y="130" font-size="15" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace">0</text><line x1="192" y1="108" x2="192" y2="140" stroke="#ffffff"/><text x="234" y="130" font-size="15" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace">1</text><line x1="276" y1="108" x2="276" y2="140" stroke="#ffffff"/><text x="318" y="130" font-size="15" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace">1</text><rect x="360" y="108" width="336" height="32" fill="#e0e9f6"/><line x1="360" y1="108" x2="360" y2="140" stroke="#ffffff"/><text x="402" y="130" font-size="15" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace">1</text><line x1="444" y1="108" x2="444" y2="140" stroke="#ffffff"/><text x="486" y="130" font-size="15" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace">0</text><line x1="528" y1="108" x2="528" y2="140" stroke="#ffffff"/><text x="570" y="130" font-size="15" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace">1</text><line x1="612" y1="108" x2="612" y2="140" stroke="#ffffff"/><text x="654" y="130" font-size="15" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace">1</text><rect x="24" y="160" width="4" height="22" fill="#e0e9f6"/><text x="36" y="178" font-size="17" font-weight="600">高 4 位</text><text x="36" y="201" font-size="13" fill="#536975">4 位 · 位 7—4</text><text x="696" y="200" font-size="15" text-anchor="end" font-family="ui-monospace, SFMono-Regular, monospace">0011</text><text x="36" y="225" font-size="14" >第二个值：补码 0011 = 3</text><rect x="24" y="246" width="4" height="22" fill="#e0e9f6"/><text x="36" y="264" font-size="17" font-weight="600">低 4 位</text><text x="36" y="287" font-size="13" fill="#536975">4 位 · 位 3—0</text><text x="696" y="286" font-size="15" text-anchor="end" font-family="ui-monospace, SFMono-Regular, monospace">1011</text><text x="36" y="311" font-size="14" >第一个值：补码 1011 = −5</text><line x1="24" y1="345" x2="696" y2="345" stroke="#c9d4db"/><text x="24" y="374" font-size="15" >存储顺序：第一个值 −5，第二个值 3</text><text x="24" y="404" font-size="15" >整个字节：00111011₂ = 0x3B</text><text x="24" y="434" font-size="15" >奇数个值时，最后一个字节还会留下填充半字节</text></g></svg>