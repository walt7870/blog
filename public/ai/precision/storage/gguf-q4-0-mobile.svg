<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 628" role="img" aria-labelledby="gguf-q4-0-title gguf-q4-0-desc"><title id="gguf-q4-0-title">GGUF / GGML Q4_0 的存储结构</title><desc id="gguf-q4-0-desc">缩放因子 d：16 位，FP16，占 2 字节，一块的 32 个值共用 d；量化码 qs：128 位，32 × 4 位，占 16 字节，一个字节装两个 4 位码，q 范围为 0—15</desc><rect width="320" height="628" fill="#f4f7f9"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif" fill="#243b45"><text x="20" y="36" font-size="22" font-weight="600">GGUF / GGML Q4_0</text><text x="20" y="68" font-size="15" fill="#536975">32 个值一块；结构体中保存 scale 与</text><text x="20" y="89" font-size="15" fill="#536975">量化码</text><rect x="20" y="126" width="31.11111111111111" height="32" fill="#dcece9"/><rect x="51.111111111111114" y="126" width="248.88888888888889" height="32" fill="#e0e9f6"/><rect x="20" y="178" width="4" height="21" fill="#dcece9"/><text x="32" y="196" font-size="17" font-weight="600">缩放因子 d</text><text x="32" y="219" font-size="13" fill="#536975">16 位 · 块内字段</text><text x="32" y="248" font-size="16" font-family="ui-monospace, SFMono-Regular, monospace">FP16，占 2 字节</text><text x="32" y="274" font-size="15" >一块的 32 个值共用 d</text><rect x="20" y="299" width="4" height="21" fill="#e0e9f6"/><text x="32" y="317" font-size="17" font-weight="600">量化码 qs</text><text x="32" y="340" font-size="13" fill="#536975">128 位 · 块内字段</text><text x="32" y="369" font-size="16" font-family="ui-monospace, SFMono-Regular, monospace">32 × 4 位，占 16 字节</text><text x="32" y="395" font-size="15" >一个字节装两个 4 位码，q 范围为 0</text><text x="32" y="416" font-size="15" >—15</text><line x1="20" y1="454" x2="300" y2="454" stroke="#c9d4db"/><text x="20" y="483" font-size="15" >读回：x = d × (q − 8)</text><text x="20" y="513" font-size="15" >2 + 16 = 18 字节 / 32 值 = 4.5 </text><text x="20" y="534" font-size="15" >位/值</text><text x="20" y="564" font-size="15" >例如 d = 0.25、q = 9，得到 x = </text><text x="20" y="585" font-size="15" >0.25</text></g></svg>