<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 588" role="img" aria-labelledby="int64-title int64-desc"><title id="int64-title">INT64 的存储结构</title><desc id="int64-desc">最高位：1 位，1，位权为 −2^63；1 时计入这一负值；其余位：63 位，111111111111111111111111111111111111111111111111111111111111011，位权从 2^62 递减到 2^0</desc><rect width="320" height="588" fill="#f4f7f9"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif" fill="#243b45"><text x="20" y="36" font-size="22" font-weight="600">INT64</text><text x="20" y="68" font-size="15" fill="#536975">64 位补码整数；示例 -5</text><rect x="20" y="105" width="4.375" height="32" fill="#f9e5e9"/><rect x="24.375" y="105" width="275.625" height="32" fill="#e0e9f6"/><rect x="20" y="157" width="4" height="21" fill="#f9e5e9"/><text x="32" y="175" font-size="17" font-weight="600">最高位</text><text x="32" y="198" font-size="13" fill="#536975">1 位 · 位 63</text><text x="32" y="227" font-size="16" font-family="ui-monospace, SFMono-Regular, monospace">1</text><text x="32" y="253" font-size="15" >位权为 −2^63；1 时计入这一负值</text><rect x="20" y="278" width="4" height="21" fill="#e0e9f6"/><text x="32" y="296" font-size="17" font-weight="600">其余位</text><text x="32" y="319" font-size="13" fill="#536975">63 位 · 位 62—0</text><text x="32" y="348" font-size="16" font-family="ui-monospace, SFMono-Regular, monospace">111111111111111111111111111</text><text x="32" y="370" font-size="16" font-family="ui-monospace, SFMono-Regular, monospace">111111111111111111111111111</text><text x="32" y="392" font-size="16" font-family="ui-monospace, SFMono-Regular, monospace">111111011</text><text x="32" y="418" font-size="15" >位权从 2^62 递减到 2^0</text><line x1="20" y1="456" x2="300" y2="456" stroke="#c9d4db"/><text x="20" y="485" font-size="15" >读回：−2^63 + (2^63 − 5) = −5</text><text x="20" y="515" font-size="15" >范围：−2^63 到 2^63−1</text><text x="20" y="545" font-size="15" >用于整数数据；最高位按负位权参与求和</text></g></svg>