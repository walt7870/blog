<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 392" role="img" aria-labelledby="e8m0-title e8m0-desc"><title id="e8m0-title">E8M0 缩放格式 的存储结构</title><desc id="e8m0-desc">指数编码 E：8 位，10000000，128 − 偏移 127 = 1；因此 scale = 2^1</desc><rect width="720" height="392" fill="#f4f7f9"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif" fill="#243b45"><text x="24" y="36" font-size="25" font-weight="600">E8M0 缩放格式</text><text x="24" y="71" font-size="15" fill="#536975">8 位都用于指数；常保存 MX 块的 scale</text><rect x="24" y="108" width="672" height="32" fill="#dcece9"/><line x1="24" y1="108" x2="24" y2="140" stroke="#ffffff"/><text x="66" y="130" font-size="15" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace">1</text><line x1="108" y1="108" x2="108" y2="140" stroke="#ffffff"/><text x="150" y="130" font-size="15" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace">0</text><line x1="192" y1="108" x2="192" y2="140" stroke="#ffffff"/><text x="234" y="130" font-size="15" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace">0</text><line x1="276" y1="108" x2="276" y2="140" stroke="#ffffff"/><text x="318" y="130" font-size="15" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace">0</text><line x1="360" y1="108" x2="360" y2="140" stroke="#ffffff"/><text x="402" y="130" font-size="15" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace">0</text><line x1="444" y1="108" x2="444" y2="140" stroke="#ffffff"/><text x="486" y="130" font-size="15" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace">0</text><line x1="528" y1="108" x2="528" y2="140" stroke="#ffffff"/><text x="570" y="130" font-size="15" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace">0</text><line x1="612" y1="108" x2="612" y2="140" stroke="#ffffff"/><text x="654" y="130" font-size="15" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace">0</text><rect x="24" y="160" width="4" height="22" fill="#dcece9"/><text x="36" y="178" font-size="17" font-weight="600">指数编码 E</text><text x="36" y="201" font-size="13" fill="#536975">8 位 · 位 7—0</text><text x="696" y="200" font-size="15" text-anchor="end" font-family="ui-monospace, SFMono-Regular, monospace">10000000</text><text x="36" y="225" font-size="14" >128 − 偏移 127 = 1；因此 scale = 2^1</text><line x1="24" y1="259" x2="696" y2="259" stroke="#c9d4db"/><text x="24" y="288" font-size="15" >读回：2^(128−127) = 2</text><text x="24" y="318" font-size="15" >有限编码 0—254 对应 2^−127—2^127</text><text x="24" y="348" font-size="15" >11111111 表示 NaN；该格式保存正的 2 的幂</text></g></svg>