<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 688" role="img" aria-labelledby="fp16-title fp16-desc"><title id="fp16-title">FP16 的存储结构</title><desc id="fp16-desc">符号 S：1 位，0，0 取正号，1 取负号；指数 E：5 位，01111，15 − 偏移 15 = 指数 0；小数部分 F：10 位，0100000000，第二位的位权为 1/4；隐含开头的 1</desc><rect width="320" height="688" fill="#f4f7f9"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif" fill="#243b45"><text x="20" y="36" font-size="22" font-weight="600">FP16</text><text x="20" y="68" font-size="15" fill="#536975">16 位；示例 1.25</text><rect x="20" y="105" width="17.5" height="32" fill="#f9e5e9"/><line x1="20" y1="105" x2="20" y2="137" stroke="#ffffff"/><text x="28.75" y="127" font-size="15" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace">0</text><rect x="37.5" y="105" width="87.5" height="32" fill="#dcece9"/><line x1="37.5" y1="105" x2="37.5" y2="137" stroke="#ffffff"/><text x="46.25" y="127" font-size="15" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace">0</text><line x1="55" y1="105" x2="55" y2="137" stroke="#ffffff"/><text x="63.75" y="127" font-size="15" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace">1</text><line x1="72.5" y1="105" x2="72.5" y2="137" stroke="#ffffff"/><text x="81.25" y="127" font-size="15" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace">1</text><line x1="90" y1="105" x2="90" y2="137" stroke="#ffffff"/><text x="98.75" y="127" font-size="15" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace">1</text><line x1="107.5" y1="105" x2="107.5" y2="137" stroke="#ffffff"/><text x="116.25" y="127" font-size="15" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace">1</text><rect x="125" y="105" width="175" height="32" fill="#e0e9f6"/><line x1="125" y1="105" x2="125" y2="137" stroke="#ffffff"/><text x="133.75" y="127" font-size="15" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace">0</text><line x1="142.5" y1="105" x2="142.5" y2="137" stroke="#ffffff"/><text x="151.25" y="127" font-size="15" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace">1</text><line x1="160" y1="105" x2="160" y2="137" stroke="#ffffff"/><text x="168.75" y="127" font-size="15" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace">0</text><line x1="177.5" y1="105" x2="177.5" y2="137" stroke="#ffffff"/><text x="186.25" y="127" font-size="15" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace">0</text><line x1="195" y1="105" x2="195" y2="137" stroke="#ffffff"/><text x="203.75" y="127" font-size="15" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace">0</text><line x1="212.5" y1="105" x2="212.5" y2="137" stroke="#ffffff"/><text x="221.25" y="127" font-size="15" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace">0</text><line x1="230" y1="105" x2="230" y2="137" stroke="#ffffff"/><text x="238.75" y="127" font-size="15" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace">0</text><line x1="247.5" y1="105" x2="247.5" y2="137" stroke="#ffffff"/><text x="256.25" y="127" font-size="15" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace">0</text><line x1="265" y1="105" x2="265" y2="137" stroke="#ffffff"/><text x="273.75" y="127" font-size="15" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace">0</text><line x1="282.5" y1="105" x2="282.5" y2="137" stroke="#ffffff"/><text x="291.25" y="127" font-size="15" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace">0</text><rect x="20" y="157" width="4" height="21" fill="#f9e5e9"/><text x="32" y="175" font-size="17" font-weight="600">符号 S</text><text x="32" y="198" font-size="13" fill="#536975">1 位 · 位 15</text><text x="32" y="227" font-size="16" font-family="ui-monospace, SFMono-Regular, monospace">0</text><text x="32" y="253" font-size="15" >0 取正号，1 取负号</text><rect x="20" y="278" width="4" height="21" fill="#dcece9"/><text x="32" y="296" font-size="17" font-weight="600">指数 E</text><text x="32" y="319" font-size="13" fill="#536975">5 位 · 位 14—10</text><text x="32" y="348" font-size="16" font-family="ui-monospace, SFMono-Regular, monospace">01111</text><text x="32" y="374" font-size="15" >15 − 偏移 15 = 指数 0</text><rect x="20" y="399" width="4" height="21" fill="#e0e9f6"/><text x="32" y="417" font-size="17" font-weight="600">小数部分 F</text><text x="32" y="440" font-size="13" fill="#536975">10 位 · 位 9—0</text><text x="32" y="469" font-size="16" font-family="ui-monospace, SFMono-Regular, monospace">0100000000</text><text x="32" y="495" font-size="15" >第二位的位权为 1/4；隐含开头的 1</text><line x1="20" y1="533" x2="300" y2="533" stroke="#c9d4db"/><text x="20" y="562" font-size="15" >读回：(+1) × (1 + 1/4) × 2^0 =</text><text x="20" y="583" font-size="15" > 1.25</text><text x="20" y="613" font-size="15" >最大有限值：65504</text><text x="20" y="643" font-size="15" >支持零、次正规数、Inf 与 NaN</text></g></svg>