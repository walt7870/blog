<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 544" role="img" aria-labelledby="int16-title int16-desc"><title id="int16-title">INT16 的存储结构</title><desc id="int16-desc">最高位：1 位，1，位权为 −2^15；1 时计入这一负值；其余位：15 位，111111111111011，位权从 2^14 递减到 2^0</desc><rect width="320" height="544" fill="#f4f7f9"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif" fill="#243b45"><text x="20" y="36" font-size="22" font-weight="600">INT16</text><text x="20" y="68" font-size="15" fill="#536975">16 位补码整数；示例 -5</text><rect x="20" y="105" width="17.5" height="32" fill="#f9e5e9"/><line x1="20" y1="105" x2="20" y2="137" stroke="#ffffff"/><text x="28.75" y="127" font-size="15" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace">1</text><rect x="37.5" y="105" width="262.5" height="32" fill="#e0e9f6"/><line x1="37.5" y1="105" x2="37.5" y2="137" stroke="#ffffff"/><text x="46.25" y="127" font-size="15" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace">1</text><line x1="55" y1="105" x2="55" y2="137" stroke="#ffffff"/><text x="63.75" y="127" font-size="15" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace">1</text><line x1="72.5" y1="105" x2="72.5" y2="137" stroke="#ffffff"/><text x="81.25" y="127" font-size="15" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace">1</text><line x1="90" y1="105" x2="90" y2="137" stroke="#ffffff"/><text x="98.75" y="127" font-size="15" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace">1</text><line x1="107.5" y1="105" x2="107.5" y2="137" stroke="#ffffff"/><text x="116.25" y="127" font-size="15" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace">1</text><line x1="125" y1="105" x2="125" y2="137" stroke="#ffffff"/><text x="133.75" y="127" font-size="15" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace">1</text><line x1="142.5" y1="105" x2="142.5" y2="137" stroke="#ffffff"/><text x="151.25" y="127" font-size="15" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace">1</text><line x1="160" y1="105" x2="160" y2="137" stroke="#ffffff"/><text x="168.75" y="127" font-size="15" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace">1</text><line x1="177.5" y1="105" x2="177.5" y2="137" stroke="#ffffff"/><text x="186.25" y="127" font-size="15" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace">1</text><line x1="195" y1="105" x2="195" y2="137" stroke="#ffffff"/><text x="203.75" y="127" font-size="15" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace">1</text><line x1="212.5" y1="105" x2="212.5" y2="137" stroke="#ffffff"/><text x="221.25" y="127" font-size="15" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace">1</text><line x1="230" y1="105" x2="230" y2="137" stroke="#ffffff"/><text x="238.75" y="127" font-size="15" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace">1</text><line x1="247.5" y1="105" x2="247.5" y2="137" stroke="#ffffff"/><text x="256.25" y="127" font-size="15" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace">0</text><line x1="265" y1="105" x2="265" y2="137" stroke="#ffffff"/><text x="273.75" y="127" font-size="15" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace">1</text><line x1="282.5" y1="105" x2="282.5" y2="137" stroke="#ffffff"/><text x="291.25" y="127" font-size="15" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace">1</text><rect x="20" y="157" width="4" height="21" fill="#f9e5e9"/><text x="32" y="175" font-size="17" font-weight="600">最高位</text><text x="32" y="198" font-size="13" fill="#536975">1 位 · 位 15</text><text x="32" y="227" font-size="16" font-family="ui-monospace, SFMono-Regular, monospace">1</text><text x="32" y="253" font-size="15" >位权为 −2^15；1 时计入这一负值</text><rect x="20" y="278" width="4" height="21" fill="#e0e9f6"/><text x="32" y="296" font-size="17" font-weight="600">其余位</text><text x="32" y="319" font-size="13" fill="#536975">15 位 · 位 14—0</text><text x="32" y="348" font-size="16" font-family="ui-monospace, SFMono-Regular, monospace">111111111111011</text><text x="32" y="374" font-size="15" >位权从 2^14 递减到 2^0</text><line x1="20" y1="412" x2="300" y2="412" stroke="#c9d4db"/><text x="20" y="441" font-size="15" >读回：−2^15 + (2^15 − 5) = −5</text><text x="20" y="471" font-size="15" >范围：−2^15 到 2^15−1</text><text x="20" y="501" font-size="15" >用于整数数据；最高位按负位权参与求和</text></g></svg>