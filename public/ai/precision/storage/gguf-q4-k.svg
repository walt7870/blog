<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 564" role="img" aria-labelledby="gguf-q4-k-title gguf-q4-k-desc"><title id="gguf-q4-k-title">GGUF / GGML Q4_K 的存储结构</title><desc id="gguf-q4-k-desc">总 scale 与总 min：32 位，d、dmin 各为 FP16，两个 16 位数共占 4 字节；组级 scale 与 min：96 位，8 × (6 + 6) 位，打包为 12 字节，服务于 8 个子组；量化码 qs：1024 位，256 × 4 位，载荷占 128 字节，q 范围为 0—15</desc><rect width="720" height="564" fill="#f4f7f9"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif" fill="#243b45"><text x="24" y="36" font-size="25" font-weight="600">GGUF / GGML Q4_K</text><text x="24" y="71" font-size="15" fill="#536975">256 个值一块；细分为 8 组，每组 32 个值</text><rect x="24" y="108" width="18.666666666666668" height="32" fill="#dcece9"/><rect x="42.66666666666667" y="108" width="56" height="32" fill="#e0e9f6"/><rect x="98.66666666666667" y="108" width="597.3333333333334" height="32" fill="#e0e9f6"/><rect x="24" y="160" width="4" height="22" fill="#dcece9"/><text x="36" y="178" font-size="17" font-weight="600">总 scale 与总 min</text><text x="36" y="201" font-size="13" fill="#536975">32 位 · 块内字段</text><text x="696" y="200" font-size="15" text-anchor="end" font-family="ui-monospace, SFMono-Regular, monospace">d、dmin 各为 FP16</text><text x="36" y="225" font-size="14" >两个 16 位数共占 4 字节</text><rect x="24" y="246" width="4" height="22" fill="#e0e9f6"/><text x="36" y="264" font-size="17" font-weight="600">组级 scale 与 min</text><text x="36" y="287" font-size="13" fill="#536975">96 位 · 块内字段</text><text x="696" y="286" font-size="15" text-anchor="end" font-family="ui-monospace, SFMono-Regular, monospace">8 × (6 + 6) 位</text><text x="36" y="311" font-size="14" >打包为 12 字节，服务于 8 个子组</text><rect x="24" y="332" width="4" height="22" fill="#e0e9f6"/><text x="36" y="350" font-size="17" font-weight="600">量化码 qs</text><text x="36" y="373" font-size="13" fill="#536975">1024 位 · 块内字段</text><text x="696" y="372" font-size="15" text-anchor="end" font-family="ui-monospace, SFMono-Regular, monospace">256 × 4 位</text><text x="36" y="397" font-size="14" >载荷占 128 字节，q 范围为 0—15</text><line x1="24" y1="431" x2="696" y2="431" stroke="#c9d4db"/><text x="24" y="460" font-size="15" >读回：x = d × 组 scale × q − dmin × 组 min</text><text x="24" y="490" font-size="15" >4 + 12 + 128 = 144 字节 / 256 值</text><text x="24" y="520" font-size="15" >平均 4.5 位/值，已包含块内元数据</text></g></svg>