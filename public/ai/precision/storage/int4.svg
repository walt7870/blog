<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 476" role="img" aria-labelledby="int4-title int4-desc"><title id="int4-title">INT4 的存储结构</title><desc id="int4-desc">最高位：1 位，1，位权为 −2^3；1 时计入这一负值；其余位：3 位，011，位权从 2^2 递减到 2^0</desc><rect width="720" height="476" fill="#f4f7f9"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif" fill="#243b45"><text x="24" y="36" font-size="25" font-weight="600">INT4</text><text x="24" y="71" font-size="15" fill="#536975">4 位补码整数；示例 -5</text><rect x="24" y="108" width="168" height="32" fill="#f9e5e9"/><line x1="24" y1="108" x2="24" y2="140" stroke="#ffffff"/><text x="108" y="130" font-size="15" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace">1</text><rect x="192" y="108" width="504" height="32" fill="#e0e9f6"/><line x1="192" y1="108" x2="192" y2="140" stroke="#ffffff"/><text x="276" y="130" font-size="15" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace">0</text><line x1="360" y1="108" x2="360" y2="140" stroke="#ffffff"/><text x="444" y="130" font-size="15" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace">1</text><line x1="528" y1="108" x2="528" y2="140" stroke="#ffffff"/><text x="612" y="130" font-size="15" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace">1</text><rect x="24" y="160" width="4" height="22" fill="#f9e5e9"/><text x="36" y="178" font-size="17" font-weight="600">最高位</text><text x="36" y="201" font-size="13" fill="#536975">1 位 · 位 3</text><text x="696" y="200" font-size="15" text-anchor="end" font-family="ui-monospace, SFMono-Regular, monospace">1</text><text x="36" y="225" font-size="14" >位权为 −2^3；1 时计入这一负值</text><rect x="24" y="246" width="4" height="22" fill="#e0e9f6"/><text x="36" y="264" font-size="17" font-weight="600">其余位</text><text x="36" y="287" font-size="13" fill="#536975">3 位 · 位 2—0</text><text x="696" y="286" font-size="15" text-anchor="end" font-family="ui-monospace, SFMono-Regular, monospace">011</text><text x="36" y="311" font-size="14" >位权从 2^2 递减到 2^0</text><line x1="24" y1="345" x2="696" y2="345" stroke="#c9d4db"/><text x="24" y="374" font-size="15" >读回：−8 + 0×4 + 1×2 + 1×1 = −5</text><text x="24" y="404" font-size="15" >范围：−8 到 7</text><text x="24" y="434" font-size="15" >量化时另保存组级 scale，按方案还可有零点</text></g></svg>