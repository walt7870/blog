<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 392" role="img" aria-labelledby="uint4-title uint4-desc"><title id="uint4-title">UINT4 的存储结构</title><desc id="uint4-desc">全部位共同表示整数：4 位，1011，每位的正位权从 2^3 递减到 2^0</desc><rect width="720" height="392" fill="#f4f7f9"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif" fill="#243b45"><text x="24" y="36" font-size="25" font-weight="600">UINT4</text><text x="24" y="71" font-size="15" fill="#536975">4 位无符号整数；示例 11</text><rect x="24" y="108" width="672" height="32" fill="#e0e9f6"/><line x1="24" y1="108" x2="24" y2="140" stroke="#ffffff"/><text x="108" y="130" font-size="15" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace">1</text><line x1="192" y1="108" x2="192" y2="140" stroke="#ffffff"/><text x="276" y="130" font-size="15" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace">0</text><line x1="360" y1="108" x2="360" y2="140" stroke="#ffffff"/><text x="444" y="130" font-size="15" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace">1</text><line x1="528" y1="108" x2="528" y2="140" stroke="#ffffff"/><text x="612" y="130" font-size="15" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace">1</text><rect x="24" y="160" width="4" height="22" fill="#e0e9f6"/><text x="36" y="178" font-size="17" font-weight="600">全部位共同表示整数</text><text x="36" y="201" font-size="13" fill="#536975">4 位 · 位 3—0</text><text x="696" y="200" font-size="15" text-anchor="end" font-family="ui-monospace, SFMono-Regular, monospace">1011</text><text x="36" y="225" font-size="14" >每位的正位权从 2^3 递减到 2^0</text><line x1="24" y1="259" x2="696" y2="259" stroke="#c9d4db"/><text x="24" y="288" font-size="15" >读回：1011₂ = 11</text><text x="24" y="318" font-size="15" >范围：0 到 15</text><text x="24" y="348" font-size="15" >用于无符号数据，也可配零点与 scale 量化</text></g></svg>