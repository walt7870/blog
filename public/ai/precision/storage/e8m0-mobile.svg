<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 508" role="img" aria-labelledby="e8m0-title e8m0-desc"><title id="e8m0-title">E8M0 缩放格式 的存储结构</title><desc id="e8m0-desc">指数编码 E：8 位，10000000，128 − 偏移 127 = 1；因此 scale = 2^1</desc><rect width="320" height="508" fill="#f4f7f9"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif" fill="#243b45"><text x="20" y="36" font-size="22" font-weight="600">E8M0 缩放格式</text><text x="20" y="68" font-size="15" fill="#536975">8 位都用于指数；常保存 MX 块的 </text><text x="20" y="89" font-size="15" fill="#536975">scale</text><rect x="20" y="126" width="280" height="32" fill="#dcece9"/><line x1="20" y1="126" x2="20" y2="158" stroke="#ffffff"/><text x="37.5" y="148" font-size="15" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace">1</text><line x1="55" y1="126" x2="55" y2="158" stroke="#ffffff"/><text x="72.5" y="148" font-size="15" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace">0</text><line x1="90" y1="126" x2="90" y2="158" stroke="#ffffff"/><text x="107.5" y="148" font-size="15" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace">0</text><line x1="125" y1="126" x2="125" y2="158" stroke="#ffffff"/><text x="142.5" y="148" font-size="15" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace">0</text><line x1="160" y1="126" x2="160" y2="158" stroke="#ffffff"/><text x="177.5" y="148" font-size="15" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace">0</text><line x1="195" y1="126" x2="195" y2="158" stroke="#ffffff"/><text x="212.5" y="148" font-size="15" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace">0</text><line x1="230" y1="126" x2="230" y2="158" stroke="#ffffff"/><text x="247.5" y="148" font-size="15" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace">0</text><line x1="265" y1="126" x2="265" y2="158" stroke="#ffffff"/><text x="282.5" y="148" font-size="15" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace">0</text><rect x="20" y="178" width="4" height="21" fill="#dcece9"/><text x="32" y="196" font-size="17" font-weight="600">指数编码 E</text><text x="32" y="219" font-size="13" fill="#536975">8 位 · 位 7—0</text><text x="32" y="248" font-size="16" font-family="ui-monospace, SFMono-Regular, monospace">10000000</text><text x="32" y="274" font-size="15" >128 − 偏移 127 = 1；因此 scale</text><text x="32" y="295" font-size="15" > = 2^1</text><line x1="20" y1="333" x2="300" y2="333" stroke="#c9d4db"/><text x="20" y="362" font-size="15" >读回：2^(128−127) = 2</text><text x="20" y="392" font-size="15" >有限编码 0—254 对应 2^−127—2^</text><text x="20" y="413" font-size="15" >127</text><text x="20" y="443" font-size="15" >11111111 表示 NaN；该格式保存正的 </text><text x="20" y="464" font-size="15" >2 的幂</text></g></svg>