<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 688" role="img" aria-labelledby="fp32-title fp32-desc"><title id="fp32-title">FP32 的存储结构</title><desc id="fp32-desc">符号 S：1 位，0，0 取正号，1 取负号；指数 E：8 位，01111111，127 − 偏移 127 = 指数 0；小数部分 F：23 位，01000000000000000000000，第二位的位权为 1/4；隐含开头的 1</desc><rect width="320" height="688" fill="#f4f7f9"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif" fill="#243b45"><text x="20" y="36" font-size="22" font-weight="600">FP32</text><text x="20" y="68" font-size="15" fill="#536975">32 位；示例 1.25</text><rect x="20" y="105" width="8.75" height="32" fill="#f9e5e9"/><line x1="20" y1="105" x2="20" y2="137" stroke="#ffffff"/><rect x="28.75" y="105" width="70" height="32" fill="#dcece9"/><line x1="28.75" y1="105" x2="28.75" y2="137" stroke="#ffffff"/><line x1="37.5" y1="105" x2="37.5" y2="137" stroke="#ffffff"/><line x1="46.25" y1="105" x2="46.25" y2="137" stroke="#ffffff"/><line x1="55" y1="105" x2="55" y2="137" stroke="#ffffff"/><line x1="63.75" y1="105" x2="63.75" y2="137" stroke="#ffffff"/><line x1="72.5" y1="105" x2="72.5" y2="137" stroke="#ffffff"/><line x1="81.25" y1="105" x2="81.25" y2="137" stroke="#ffffff"/><line x1="90" y1="105" x2="90" y2="137" stroke="#ffffff"/><rect x="98.75" y="105" width="201.25" height="32" fill="#e0e9f6"/><line x1="98.75" y1="105" x2="98.75" y2="137" stroke="#ffffff"/><line x1="107.5" y1="105" x2="107.5" y2="137" stroke="#ffffff"/><line x1="116.25" y1="105" x2="116.25" y2="137" stroke="#ffffff"/><line x1="125" y1="105" x2="125" y2="137" stroke="#ffffff"/><line x1="133.75" y1="105" x2="133.75" y2="137" stroke="#ffffff"/><line x1="142.5" y1="105" x2="142.5" y2="137" stroke="#ffffff"/><line x1="151.25" y1="105" x2="151.25" y2="137" stroke="#ffffff"/><line x1="160" y1="105" x2="160" y2="137" stroke="#ffffff"/><line x1="168.75" y1="105" x2="168.75" y2="137" stroke="#ffffff"/><line x1="177.5" y1="105" x2="177.5" y2="137" stroke="#ffffff"/><line x1="186.25" y1="105" x2="186.25" y2="137" stroke="#ffffff"/><line x1="195" y1="105" x2="195" y2="137" stroke="#ffffff"/><line x1="203.75" y1="105" x2="203.75" y2="137" stroke="#ffffff"/><line x1="212.5" y1="105" x2="212.5" y2="137" stroke="#ffffff"/><line x1="221.25" y1="105" x2="221.25" y2="137" stroke="#ffffff"/><line x1="230" y1="105" x2="230" y2="137" stroke="#ffffff"/><line x1="238.75" y1="105" x2="238.75" y2="137" stroke="#ffffff"/><line x1="247.5" y1="105" x2="247.5" y2="137" stroke="#ffffff"/><line x1="256.25" y1="105" x2="256.25" y2="137" stroke="#ffffff"/><line x1="265" y1="105" x2="265" y2="137" stroke="#ffffff"/><line x1="273.75" y1="105" x2="273.75" y2="137" stroke="#ffffff"/><line x1="282.5" y1="105" x2="282.5" y2="137" stroke="#ffffff"/><line x1="291.25" y1="105" x2="291.25" y2="137" stroke="#ffffff"/><rect x="20" y="157" width="4" height="21" fill="#f9e5e9"/><text x="32" y="175" font-size="17" font-weight="600">符号 S</text><text x="32" y="198" font-size="13" fill="#536975">1 位 · 位 31</text><text x="32" y="227" font-size="16" font-family="ui-monospace, SFMono-Regular, monospace">0</text><text x="32" y="253" font-size="15" >0 取正号，1 取负号</text><rect x="20" y="278" width="4" height="21" fill="#dcece9"/><text x="32" y="296" font-size="17" font-weight="600">指数 E</text><text x="32" y="319" font-size="13" fill="#536975">8 位 · 位 30—23</text><text x="32" y="348" font-size="16" font-family="ui-monospace, SFMono-Regular, monospace">01111111</text><text x="32" y="374" font-size="15" >127 − 偏移 127 = 指数 0</text><rect x="20" y="399" width="4" height="21" fill="#e0e9f6"/><text x="32" y="417" font-size="17" font-weight="600">小数部分 F</text><text x="32" y="440" font-size="13" fill="#536975">23 位 · 位 22—0</text><text x="32" y="469" font-size="16" font-family="ui-monospace, SFMono-Regular, monospace">01000000000000000000000</text><text x="32" y="495" font-size="15" >第二位的位权为 1/4；隐含开头的 1</text><line x1="20" y1="533" x2="300" y2="533" stroke="#c9d4db"/><text x="20" y="562" font-size="15" >读回：(+1) × (1 + 1/4) × 2^0 =</text><text x="20" y="583" font-size="15" > 1.25</text><text x="20" y="613" font-size="15" >最大有限值：约 3.40 × 10^38</text><text x="20" y="643" font-size="15" >支持零、次正规数、Inf 与 NaN</text></g></svg>