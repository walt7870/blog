<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 564" role="img" aria-labelledby="int8-title int8-desc"><title id="int8-title">INT8 的存储结构</title><desc id="int8-desc">最高位：1 位，1，位权为 −2^7；1 时计入这一负值；其余位：7 位，1111011，位权从 2^6 递减到 2^0</desc><rect width="320" height="564" fill="#f4f7f9"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif" fill="#243b45"><text x="20" y="36" font-size="22" font-weight="600">INT8</text><text x="20" y="68" font-size="15" fill="#536975">8 位补码整数；示例 -5</text><rect x="20" y="105" width="35" height="32" fill="#f9e5e9"/><line x1="20" y1="105" x2="20" y2="137" stroke="#ffffff"/><text x="37.5" y="127" font-size="15" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace">1</text><rect x="55" y="105" width="245" height="32" fill="#e0e9f6"/><line x1="55" y1="105" x2="55" y2="137" stroke="#ffffff"/><text x="72.5" y="127" font-size="15" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace">1</text><line x1="90" y1="105" x2="90" y2="137" stroke="#ffffff"/><text x="107.5" y="127" font-size="15" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace">1</text><line x1="125" y1="105" x2="125" y2="137" stroke="#ffffff"/><text x="142.5" y="127" font-size="15" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace">1</text><line x1="160" y1="105" x2="160" y2="137" stroke="#ffffff"/><text x="177.5" y="127" font-size="15" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace">1</text><line x1="195" y1="105" x2="195" y2="137" stroke="#ffffff"/><text x="212.5" y="127" font-size="15" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace">0</text><line x1="230" y1="105" x2="230" y2="137" stroke="#ffffff"/><text x="247.5" y="127" font-size="15" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace">1</text><line x1="265" y1="105" x2="265" y2="137" stroke="#ffffff"/><text x="282.5" y="127" font-size="15" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace">1</text><rect x="20" y="157" width="4" height="21" fill="#f9e5e9"/><text x="32" y="175" font-size="17" font-weight="600">最高位</text><text x="32" y="198" font-size="13" fill="#536975">1 位 · 位 7</text><text x="32" y="227" font-size="16" font-family="ui-monospace, SFMono-Regular, monospace">1</text><text x="32" y="253" font-size="15" >位权为 −2^7；1 时计入这一负值</text><rect x="20" y="278" width="4" height="21" fill="#e0e9f6"/><text x="32" y="296" font-size="17" font-weight="600">其余位</text><text x="32" y="319" font-size="13" fill="#536975">7 位 · 位 6—0</text><text x="32" y="348" font-size="16" font-family="ui-monospace, SFMono-Regular, monospace">1111011</text><text x="32" y="374" font-size="15" >位权从 2^6 递减到 2^0</text><line x1="20" y1="412" x2="300" y2="412" stroke="#c9d4db"/><text x="20" y="441" font-size="15" >读回：−128 + 123 = −5</text><text x="20" y="471" font-size="15" >范围：−128 到 127</text><text x="20" y="501" font-size="15" >量化时另保存组级 scale，按方案还可有</text><text x="20" y="522" font-size="15" >零点</text></g></svg>