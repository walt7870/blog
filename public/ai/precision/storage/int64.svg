<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 496" role="img" aria-labelledby="int64-title int64-desc"><title id="int64-title">INT64 的存储结构</title><desc id="int64-desc">最高位：1 位，1，位权为 −2^63；1 时计入这一负值；其余位：63 位，111111111111111111111111111111111111111111111111111111111111011，位权从 2^62 递减到 2^0</desc><rect width="720" height="496" fill="#f4f7f9"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif" fill="#243b45"><text x="24" y="36" font-size="25" font-weight="600">INT64</text><text x="24" y="71" font-size="15" fill="#536975">64 位补码整数；示例 -5</text><rect x="24" y="108" width="10.5" height="32" fill="#f9e5e9"/><rect x="34.5" y="108" width="661.5" height="32" fill="#e0e9f6"/><rect x="24" y="160" width="4" height="22" fill="#f9e5e9"/><text x="36" y="178" font-size="17" font-weight="600">最高位</text><text x="36" y="201" font-size="13" fill="#536975">1 位 · 位 63</text><text x="696" y="200" font-size="15" text-anchor="end" font-family="ui-monospace, SFMono-Regular, monospace">1</text><text x="36" y="225" font-size="14" >位权为 −2^63；1 时计入这一负值</text><rect x="24" y="246" width="4" height="22" fill="#e0e9f6"/><text x="36" y="264" font-size="17" font-weight="600">其余位</text><text x="36" y="287" font-size="13" fill="#536975">63 位 · 位 62—0</text><text x="696" y="286" font-size="15" text-anchor="end" font-family="ui-monospace, SFMono-Regular, monospace">11111111111111111111111111111</text><text x="696" y="307" font-size="15" text-anchor="end" font-family="ui-monospace, SFMono-Regular, monospace">11111111111111111111111111111</text><text x="696" y="328" font-size="15" text-anchor="end" font-family="ui-monospace, SFMono-Regular, monospace">11011</text><text x="36" y="311" font-size="14" >位权从 2^62 递减到 2^0</text><line x1="24" y1="362" x2="696" y2="362" stroke="#c9d4db"/><text x="24" y="391" font-size="15" >读回：−2^63 + (2^63 − 5) = −5</text><text x="24" y="421" font-size="15" >范围：−2^63 到 2^63−1</text><text x="24" y="451" font-size="15" >用于整数数据；最高位按负位权参与求和</text></g></svg>