<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 564" role="img" aria-labelledby="fp6-e3m2-title fp6-e3m2-desc"><title id="fp6-e3m2-title">FP6 E3M2 的存储结构</title><desc id="fp6-e3m2-desc">符号 S：1 位，0，0 取正号，1 取负号；指数 E：3 位，011，3 − 偏移 3 = 指数 0；小数部分 F：2 位，01，第二位的位权为 1/4；隐含开头的 1</desc><rect width="720" height="564" fill="#f4f7f9"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif" fill="#243b45"><text x="24" y="36" font-size="25" font-weight="600">FP6 E3M2</text><text x="24" y="71" font-size="15" fill="#536975">6 位；示例 1.25</text><rect x="24" y="108" width="112" height="32" fill="#f9e5e9"/><line x1="24" y1="108" x2="24" y2="140" stroke="#ffffff"/><text x="80" y="130" font-size="15" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace">0</text><rect x="136" y="108" width="336" height="32" fill="#dcece9"/><line x1="136" y1="108" x2="136" y2="140" stroke="#ffffff"/><text x="192" y="130" font-size="15" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace">0</text><line x1="248" y1="108" x2="248" y2="140" stroke="#ffffff"/><text x="304" y="130" font-size="15" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace">1</text><line x1="360" y1="108" x2="360" y2="140" stroke="#ffffff"/><text x="416" y="130" font-size="15" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace">1</text><rect x="472" y="108" width="224" height="32" fill="#e0e9f6"/><line x1="472" y1="108" x2="472" y2="140" stroke="#ffffff"/><text x="528" y="130" font-size="15" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace">0</text><line x1="584" y1="108" x2="584" y2="140" stroke="#ffffff"/><text x="640" y="130" font-size="15" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace">1</text><rect x="24" y="160" width="4" height="22" fill="#f9e5e9"/><text x="36" y="178" font-size="17" font-weight="600">符号 S</text><text x="36" y="201" font-size="13" fill="#536975">1 位 · 位 5</text><text x="696" y="200" font-size="15" text-anchor="end" font-family="ui-monospace, SFMono-Regular, monospace">0</text><text x="36" y="225" font-size="14" >0 取正号，1 取负号</text><rect x="24" y="246" width="4" height="22" fill="#dcece9"/><text x="36" y="264" font-size="17" font-weight="600">指数 E</text><text x="36" y="287" font-size="13" fill="#536975">3 位 · 位 4—2</text><text x="696" y="286" font-size="15" text-anchor="end" font-family="ui-monospace, SFMono-Regular, monospace">011</text><text x="36" y="311" font-size="14" >3 − 偏移 3 = 指数 0</text><rect x="24" y="332" width="4" height="22" fill="#e0e9f6"/><text x="36" y="350" font-size="17" font-weight="600">小数部分 F</text><text x="36" y="373" font-size="13" fill="#536975">2 位 · 位 1—0</text><text x="696" y="372" font-size="15" text-anchor="end" font-family="ui-monospace, SFMono-Regular, monospace">01</text><text x="36" y="397" font-size="14" >第二位的位权为 1/4；隐含开头的 1</text><line x1="24" y1="431" x2="696" y2="431" stroke="#c9d4db"/><text x="24" y="460" font-size="15" >读回：(+1) × (1 + 1/4) × 2^0 = 1.25</text><text x="24" y="490" font-size="15" >最大有限值：28</text><text x="24" y="520" font-size="15" >有限值编码；指数更宽，小数部分更短</text></g></svg>