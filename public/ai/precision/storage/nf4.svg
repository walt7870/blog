<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 564" role="img" aria-labelledby="nf4-title nf4-desc"><title id="nf4-title">NF4 的存储结构</title><desc id="nf4-desc">码本索引：4 位，1111，四位组成索引 15，去固定码本查数值；固定 NF4 码本：表[15] = 1，例如：表[0] = −1，表[7] = 0；块级缩放因子：FP32，约为 0.3，图示 64 值共享一个 32 位 scale</desc><rect width="720" height="564" fill="#f4f7f9"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif" fill="#243b45"><text x="24" y="36" font-size="25" font-weight="600">NF4</text><text x="24" y="71" font-size="15" fill="#536975">每个数保存 4 位索引；一组另有共享缩放因子</text><rect x="24" y="108" width="672" height="32" fill="#e0e9f6"/><line x1="24" y1="108" x2="24" y2="140" stroke="#ffffff"/><text x="108" y="130" font-size="15" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace">1</text><line x1="192" y1="108" x2="192" y2="140" stroke="#ffffff"/><text x="276" y="130" font-size="15" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace">1</text><line x1="360" y1="108" x2="360" y2="140" stroke="#ffffff"/><text x="444" y="130" font-size="15" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace">1</text><line x1="528" y1="108" x2="528" y2="140" stroke="#ffffff"/><text x="612" y="130" font-size="15" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace">1</text><rect x="24" y="160" width="4" height="22" fill="#e0e9f6"/><text x="36" y="178" font-size="17" font-weight="600">码本索引</text><text x="36" y="201" font-size="13" fill="#536975">4 位 · 位 3—0</text><text x="696" y="200" font-size="15" text-anchor="end" font-family="ui-monospace, SFMono-Regular, monospace">1111</text><text x="36" y="225" font-size="14" >四位组成索引 15，去固定码本查数值</text><rect x="24" y="246" width="4" height="22" fill="#e0e9f6"/><text x="36" y="264" font-size="17" font-weight="600">固定 NF4 码本</text><text x="36" y="287" font-size="13" fill="#536975">固定规则或共享数据</text><text x="696" y="286" font-size="15" text-anchor="end" font-family="ui-monospace, SFMono-Regular, monospace">表[15] = 1</text><text x="36" y="311" font-size="14" >例如：表[0] = −1，表[7] = 0</text><rect x="24" y="332" width="4" height="22" fill="#dcece9"/><text x="36" y="350" font-size="17" font-weight="600">块级缩放因子</text><text x="36" y="373" font-size="13" fill="#536975">固定规则或共享数据</text><text x="696" y="372" font-size="15" text-anchor="end" font-family="ui-monospace, SFMono-Regular, monospace">FP32，约为 0.3</text><text x="36" y="397" font-size="14" >图示 64 值共享一个 32 位 scale</text><line x1="24" y1="431" x2="696" y2="431" stroke="#c9d4db"/><text x="24" y="460" font-size="15" >读回：表[15] × scale ≈ 1 × 0.3 = 0.3</text><text x="24" y="490" font-size="15" >NF4 的位表示查表索引，刻度由码本安排</text><text x="24" y="520" font-size="15" >图示每组 64×4 + 32 = 288 位，平均 4.5 位/值</text></g></svg>