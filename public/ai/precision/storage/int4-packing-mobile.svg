<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 588" role="img" aria-labelledby="int4-packing-title int4-packing-desc"><title id="int4-packing-title">两个 INT4 怎样装进一字节 的存储结构</title><desc id="int4-packing-desc">高 4 位：4 位，0011，第二个值：补码 0011 = 3；低 4 位：4 位，1011，第一个值：补码 1011 = −5</desc><rect width="320" height="588" fill="#f4f7f9"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif" fill="#243b45"><text x="20" y="36" font-size="22" font-weight="600">两个 INT4 怎样装进一字节</text><text x="20" y="68" font-size="15" fill="#536975">采用 ONNX 的先低半字节、后高半字节排</text><text x="20" y="89" font-size="15" fill="#536975">列</text><rect x="20" y="126" width="140" height="32" fill="#e0e9f6"/><line x1="20" y1="126" x2="20" y2="158" stroke="#ffffff"/><text x="37.5" y="148" font-size="15" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace">0</text><line x1="55" y1="126" x2="55" y2="158" stroke="#ffffff"/><text x="72.5" y="148" font-size="15" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace">0</text><line x1="90" y1="126" x2="90" y2="158" stroke="#ffffff"/><text x="107.5" y="148" font-size="15" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace">1</text><line x1="125" y1="126" x2="125" y2="158" stroke="#ffffff"/><text x="142.5" y="148" font-size="15" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace">1</text><rect x="160" y="126" width="140" height="32" fill="#e0e9f6"/><line x1="160" y1="126" x2="160" y2="158" stroke="#ffffff"/><text x="177.5" y="148" font-size="15" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace">1</text><line x1="195" y1="126" x2="195" y2="158" stroke="#ffffff"/><text x="212.5" y="148" font-size="15" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace">0</text><line x1="230" y1="126" x2="230" y2="158" stroke="#ffffff"/><text x="247.5" y="148" font-size="15" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace">1</text><line x1="265" y1="126" x2="265" y2="158" stroke="#ffffff"/><text x="282.5" y="148" font-size="15" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace">1</text><rect x="20" y="178" width="4" height="21" fill="#e0e9f6"/><text x="32" y="196" font-size="17" font-weight="600">高 4 位</text><text x="32" y="219" font-size="13" fill="#536975">4 位 · 位 7—4</text><text x="32" y="248" font-size="16" font-family="ui-monospace, SFMono-Regular, monospace">0011</text><text x="32" y="274" font-size="15" >第二个值：补码 0011 = 3</text><rect x="20" y="299" width="4" height="21" fill="#e0e9f6"/><text x="32" y="317" font-size="17" font-weight="600">低 4 位</text><text x="32" y="340" font-size="13" fill="#536975">4 位 · 位 3—0</text><text x="32" y="369" font-size="16" font-family="ui-monospace, SFMono-Regular, monospace">1011</text><text x="32" y="395" font-size="15" >第一个值：补码 1011 = −5</text><line x1="20" y1="433" x2="300" y2="433" stroke="#c9d4db"/><text x="20" y="462" font-size="15" >存储顺序：第一个值 −5，第二个值 3</text><text x="20" y="492" font-size="15" >整个字节：00111011₂ = 0x3B</text><text x="20" y="522" font-size="15" >奇数个值时，最后一个字节还会留下填充</text><text x="20" y="543" font-size="15" >半字节</text></g></svg>