line x1="633" y1="108" x2="633" y2="140" stroke="#ffffff"/><text x="643.5" y="130" font-size="15" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace">0</text><line x1="654" y1="108" x2="654" y2="140" stroke="#ffffff"/><text x="664.5" y="130" font-size="15" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace">0</text><line x1="675" y1="108" x2="675" y2="140" stroke="#ffffff"/><text x="685.5" y="130" font-size="15" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace">0</text><rect x="24" y="160" width="4" height="22" fill="#f9e5e9"/><text x="36" y="178" font-size="17" font-weight="600">符号 S</text><text x="36" y="201" font-size="13" fill="#536975">1 位 · 位 31</text><text x="696" y="200" font-size="15" text-anchor="end" font-family="ui-monospace, SFMono-Regular, monospace">0</text><text x="36" y="225" font-size="14" >0 取正号，1 取负号</text><rect x="24" y="246" width="4" height="22" fill="#dcece9"/><text x="36" y="264" font-size="17" font-weight="600">指数 E</text><text x="36" y="287" font-size="13" fill="#536975">8 位 · 位 30—23</text><text x="696" y="286" font-size="15" text-anchor="end" font-family="ui-monospace, SFMono-Regular, monospace">01111111</text><text x="36" y="311" font-size="14" >127 − 偏移 127 = 指数 0</text><rect x="24" y="332" width="4" height="22" fill="#e0e9f6"/><text x="36" y="350" font-size="17" font-weight="600">小数部分 F</text><text x="36" y="373" font-size="13" fill="#536975">23 位 · 位 22—0</text><text x="696" y="372" font-size="15" text-anchor="end" font-family="ui-monospace, SFMono-Regular, monospace">01000000000000000000000</text><text x="36" y="397" font-size="14" >第二位的位权为 1/4；隐含开头的 1</text><line x1="24" y1="431" x2="696" y2="431" stroke="#c9d4db"/><text x="24" y="460" font-size="15" >读回：(+1) × (1 + 1/4) × 2^0 = 1.25</text><text x="24" y="490" font-size="15" >最大有限值：约 3.40 × 10^38</text><text x="24" y="520" font-size="15" >支持零、次正规数、Inf 与 NaN</text></g></svg>