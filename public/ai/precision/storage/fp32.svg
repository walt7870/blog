<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 564" role="img" aria-labelledby="fp32-title fp32-desc"><title id="fp32-title">FP32 的存储结构</title><desc id="fp32-desc">符号 S：1 位，0，0 取正号，1 取负号；指数 E：8 位，01111111，127 − 偏移 127 = 指数 0；小数部分 F：23 位，01000000000000000000000，第二位的位权为 1/4；隐含开头的 1</desc><rect width="720" height="564" fill="#f4f7f9"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif" fill="#243b45"><text x="24" y="36" font-size="25" font-weight="600">FP32</text><text x="24" y="71" font-size="15" fill="#536975">32 位；示例 1.25</text><rect x="24" y="108" width="21" height="32" fill="#f9e5e9"/><line x1="24" y1="108" x2="24" y2="140" stroke="#ffffff"/><text x="34.5" y="130" font-size="15" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace">0</text><rect x="45" y="108" width="168" height="32" fill="#dcece9"/><line x1="45" y1="108" x2="45" y2="140" stroke="#ffffff"/><text x="55.5" y="130" font-size="15" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace">0</text><line x1="66" y1="108" x2="66" y2="140" stroke="#ffffff"/><text x="76.5" y="130" font-size="15" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace">1</text><line x1="87" y1="108" x2="87" y2="140" stroke="#ffffff"/><text x="97.5" y="130" font-size="15" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace">1</text><line x1="108" y1="108" x2="108" y2="140" stroke="#ffffff"/><text x="118.5" y="130" font-size="15" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace">1</text><line x1="129" y1="108" x2="129" y2="140" stroke="#ffffff"/><text x="139.5" y="130" font-size="15" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace">1</text><line x1="150" y1="108" x2="150" y2="140" stroke="#ffffff"/><text x="160.5" y="130" font-size="15" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace">1</text><line x1="171" y1="108" x2="171" y2="140" stroke="#ffffff"/><text x="181.5" y="130" font-size="15" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace">1</text><line x1="192" y1="108" x2="192" y2="140" stroke="#ffffff"/><text x="202.5" y="130" font-size="15" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace">1</text><rect x="213" y="108" width="483" height="32" fill="#e0e9f6"/><line x1="213" y1="108" x2="213" y2="140" stroke="#ffffff"/><text x="223.5" y="130" font-size="15" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace">0</text><line x1="234" y1="108" x2="234" y2="140" stroke="#ffffff"/><text x="244.5" y="130" font-size="15" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace">1</text><line x1="255" y1="108" x2="255" y2="140" stroke="#ffffff"/><text x="265.5" y="130" font-size="15" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace">0</text><line x1="276" y1="108" x2="276" y2="140" stroke="#ffffff"/><text x="286.5" y="130" font-size="15" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace">0</text><line x1="297" y1="108" x2="297" y2="140" stroke="#ffffff"/><text x="307.5" y="130" font-size="15" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace">0</text><line x1="318" y1="108" x2="318" y2="140" stroke="#ffffff"/><text x="328.5" y="130" font-size="15" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace">0</text><line x1="339" y1="108" x2="339" y2="140" stroke="#ffffff"/><text x="349.5" y="130" font-size="15" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace">0</text><line x1="360" y1="108" x2="360" y2="140" stroke="#ffffff"/><text x="370.5" y="130" font-size="15" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace">0</text><line x1="381" y1="108" x2="381" y2="140" stroke="#ffffff"/><text x="391.5" y="130" font-size="15" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace">0</text><li