<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 444" role="img" aria-labelledby="uint4-title uint4-desc"><title id="uint4-title">UINT4 的存储结构</title><desc id="uint4-desc">全部位共同表示整数：4 位，1011，每位的正位权从 2^3 递减到 2^0</desc><rect width="320" height="444" fill="#f4f7f9"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif" fill="#243b45"><text x="20" y="36" font-size="22" font-weight="600">UINT4</text><text x="20" y="68" font-size="15" fill="#536975">4 位无符号整数；示例 11</text><rect x="20" y="105" width="280" height="32" fill="#e0e9f6"/><line x1="20" y1="105" x2="20" y2="137" stroke="#ffffff"/><text x="55" y="127" font-size="15" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace">1</text><line x1="90" y1="105" x2="90" y2="137" stroke="#ffffff"/><text x="125" y="127" font-size="15" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace">0</text><line x1="160" y1="105" x2="160" y2="137" stroke="#ffffff"/><text x="195" y="127" font-size="15" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace">1</text><line x1="230" y1="105" x2="230" y2="137" stroke="#ffffff"/><text x="265" y="127" font-size="15" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace">1</text><rect x="20" y="157" width="4" height="21" fill="#e0e9f6"/><text x="32" y="175" font-size="17" font-weight="600">全部位共同表示整数</text><text x="32" y="198" font-size="13" fill="#536975">4 位 · 位 3—0</text><text x="32" y="227" font-size="16" font-family="ui-monospace, SFMono-Regular, monospace">1011</text><text x="32" y="253" font-size="15" >每位的正位权从 2^3 递减到 2^0</text><line x1="20" y1="291" x2="300" y2="291" stroke="#c9d4db"/><text x="20" y="320" font-size="15" >读回：1011₂ = 11</text><text x="20" y="350" font-size="15" >范围：0 到 15</text><text x="20" y="380" font-size="15" >用于无符号数据，也可配零点与 scale </text><text x="20" y="401" font-size="15" >量化</text></g></svg>