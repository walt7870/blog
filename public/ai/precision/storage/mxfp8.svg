<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 476" role="img" aria-labelledby="mxfp8-title mxfp8-desc"><title id="mxfp8-title">MXFP8（图中采用 E4M3） 的存储结构</title><desc id="mxfp8-desc">组级 scale：8 位，10000000，E8M0 编码 128 → 2^(128−127) = 2；32 个数值编码：256 位，32 × FP8，256 位载荷；每个数按自身格式解码</desc><rect width="720" height="476" fill="#f4f7f9"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif" fill="#243b45"><text x="24" y="36" font-size="25" font-weight="600">MXFP8（图中采用 E4M3）</text><text x="24" y="71" font-size="15" fill="#536975">32 个 8 位值，共用 1 个 E8M0 缩放因子</text><rect x="24" y="108" width="20.363636363636363" height="32" fill="#dcece9"/><rect x="44.36363636363636" y="108" width="651.6363636363636" height="32" fill="#e0e9f6"/><rect x="24" y="160" width="4" height="22" fill="#dcece9"/><text x="36" y="178" font-size="17" font-weight="600">组级 scale</text><text x="36" y="201" font-size="13" fill="#536975">8 位 · 块内字段</text><text x="696" y="200" font-size="15" text-anchor="end" font-family="ui-monospace, SFMono-Regular, monospace">10000000</text><text x="36" y="225" font-size="14" >E8M0 编码 128 → 2^(128−127) = 2</text><rect x="24" y="246" width="4" height="22" fill="#e0e9f6"/><text x="36" y="264" font-size="17" font-weight="600">32 个数值编码</text><text x="36" y="287" font-size="13" fill="#536975">256 位 · 块内字段</text><text x="696" y="286" font-size="15" text-anchor="end" font-family="ui-monospace, SFMono-Regular, monospace">32 × FP8</text><text x="36" y="311" font-size="14" >256 位载荷；每个数按自身格式解码</text><line x1="24" y1="345" x2="696" y2="345" stroke="#c9d4db"/><text x="24" y="374" font-size="15" >示例：组内编码读为 1.5，乘 scale 2 → 3</text><text x="24" y="404" font-size="15" >每组 33 字节；平均 8.25 位/值</text><text x="24" y="434" font-size="15" >scale 由一组共享，计入总存储空间</text></g></svg>