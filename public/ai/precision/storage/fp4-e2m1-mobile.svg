<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 688" role="img" aria-labelledby="fp4-e2m1-title fp4-e2m1-desc"><title id="fp4-e2m1-title">FP4 E2M1 的存储结构</title><desc id="fp4-e2m1-desc">符号 S：1 位，0，0 取正号，1 取负号；指数 E：2 位，01，1 − 偏移 1 = 指数 0；小数部分 F：1 位，1，首位的位权为 1/2；隐含开头的 1</desc><rect width="320" height="688" fill="#f4f7f9"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif" fill="#243b45"><text x="20" y="36" font-size="22" font-weight="600">FP4 E2M1</text><text x="20" y="68" font-size="15" fill="#536975">4 位；示例 1.5</text><rect x="20" y="105" width="70" height="32" fill="#f9e5e9"/><line x1="20" y1="105" x2="20" y2="137" stroke="#ffffff"/><text x="55" y="127" font-size="15" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace">0</text><rect x="90" y="105" width="140" height="32" fill="#dcece9"/><line x1="90" y1="105" x2="90" y2="137" stroke="#ffffff"/><text x="125" y="127" font-size="15" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace">0</text><line x1="160" y1="105" x2="160" y2="137" stroke="#ffffff"/><text x="195" y="127" font-size="15" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace">1</text><rect x="230" y="105" width="70" height="32" fill="#e0e9f6"/><line x1="230" y1="105" x2="230" y2="137" stroke="#ffffff"/><text x="265" y="127" font-size="15" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace">1</text><rect x="20" y="157" width="4" height="21" fill="#f9e5e9"/><text x="32" y="175" font-size="17" font-weight="600">符号 S</text><text x="32" y="198" font-size="13" fill="#536975">1 位 · 位 3</text><text x="32" y="227" font-size="16" font-family="ui-monospace, SFMono-Regular, monospace">0</text><text x="32" y="253" font-size="15" >0 取正号，1 取负号</text><rect x="20" y="278" width="4" height="21" fill="#dcece9"/><text x="32" y="296" font-size="17" font-weight="600">指数 E</text><text x="32" y="319" font-size="13" fill="#536975">2 位 · 位 2—1</text><text x="32" y="348" font-size="16" font-family="ui-monospace, SFMono-Regular, monospace">01</text><text x="32" y="374" font-size="15" >1 − 偏移 1 = 指数 0</text><rect x="20" y="399" width="4" height="21" fill="#e0e9f6"/><text x="32" y="417" font-size="17" font-weight="600">小数部分 F</text><text x="32" y="440" font-size="13" fill="#536975">1 位 · 位 0</text><text x="32" y="469" font-size="16" font-family="ui-monospace, SFMono-Regular, monospace">1</text><text x="32" y="495" font-size="15" >首位的位权为 1/2；隐含开头的 1</text><line x1="20" y1="533" x2="300" y2="533" stroke="#c9d4db"/><text x="20" y="562" font-size="15" >读回：(+1) × (1 + 1/2) × 2^0 =</text><text x="20" y="583" font-size="15" > 1.5</text><text x="20" y="613" font-size="15" >最大有限值：6</text><text x="20" y="643" font-size="15" >正幅值：0、0.5、1、1.5、2、3、4、6</text></g></svg>