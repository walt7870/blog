<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 708" role="img" aria-labelledby="fp6-e2m3-title fp6-e2m3-desc"><title id="fp6-e2m3-title">FP6 E2M3 的存储结构</title><desc id="fp6-e2m3-desc">符号 S：1 位，0，0 取正号，1 取负号；指数 E：2 位，01，1 − 偏移 1 = 指数 0；小数部分 F：3 位，010，第二位的位权为 1/4；隐含开头的 1</desc><rect width="320" height="708" fill="#f4f7f9"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif" fill="#243b45"><text x="20" y="36" font-size="22" font-weight="600">FP6 E2M3</text><text x="20" y="68" font-size="15" fill="#536975">6 位；示例 1.25</text><rect x="20" y="105" width="46.666666666666664" height="32" fill="#f9e5e9"/><line x1="20" y1="105" x2="20" y2="137" stroke="#ffffff"/><text x="43.33333333333333" y="127" font-size="15" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace">0</text><rect x="66.66666666666666" y="105" width="93.33333333333333" height="32" fill="#dcece9"/><line x1="66.66666666666666" y1="105" x2="66.66666666666666" y2="137" stroke="#ffffff"/><text x="89.99999999999999" y="127" font-size="15" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace">0</text><line x1="113.33333333333331" y1="105" x2="113.33333333333331" y2="137" stroke="#ffffff"/><text x="136.66666666666666" y="127" font-size="15" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace">1</text><rect x="160" y="105" width="140" height="32" fill="#e0e9f6"/><line x1="160" y1="105" x2="160" y2="137" stroke="#ffffff"/><text x="183.33333333333334" y="127" font-size="15" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace">0</text><line x1="206.66666666666666" y1="105" x2="206.66666666666666" y2="137" stroke="#ffffff"/><text x="230" y="127" font-size="15" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace">1</text><line x1="253.33333333333331" y1="105" x2="253.33333333333331" y2="137" stroke="#ffffff"/><text x="276.66666666666663" y="127" font-size="15" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace">0</text><rect x="20" y="157" width="4" height="21" fill="#f9e5e9"/><text x="32" y="175" font-size="17" font-weight="600">符号 S</text><text x="32" y="198" font-size="13" fill="#536975">1 位 · 位 5</text><text x="32" y="227" font-size="16" font-family="ui-monospace, SFMono-Regular, monospace">0</text><text x="32" y="253" font-size="15" >0 取正号，1 取负号</text><rect x="20" y="278" width="4" height="21" fill="#dcece9"/><text x="32" y="296" font-size="17" font-weight="600">指数 E</text><text x="32" y="319" font-size="13" fill="#536975">2 位 · 位 4—3</text><text x="32" y="348" font-size="16" font-family="ui-monospace, SFMono-Regular, monospace">01</text><text x="32" y="374" font-size="15" >1 − 偏移 1 = 指数 0</text><rect x="20" y="399" width="4" height="21" fill="#e0e9f6"/><text x="32" y="417" font-size="17" font-weight="600">小数部分 F</text><text x="32" y="440" font-size="13" fill="#536975">3 位 · 位 2—0</text><text x="32" y="469" font-size="16" font-family="ui-monospace, SFMono-Regular, monospace">010</text><text x="32" y="495" font-size="15" >第二位的位权为 1/4；隐含开头的 1</text><line x1="20" y1="533" x2="300" y2="533" stroke="#c9d4db"/><text x="20" y="562" font-size="15" >读回：(+1) × (1 + 1/4) × 2^0 =</text><text x="20" y="583" font-size="15" > 1.25</text><text x="20" y="613" font-size="15" >最大有限值：7.5</text><text x="20" y="643" font-size="15" >有限值编码；常作为 MX 块内的 6 位数</text><text x="20" y="664" font-size="15" >值</text></g></svg>