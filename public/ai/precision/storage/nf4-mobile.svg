<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 728" role="img" aria-labelledby="nf4-title nf4-desc"><title id="nf4-title">NF4 的存储结构</title><desc id="nf4-desc">码本索引：4 位，1111，四位组成索引 15，去固定码本查数值；固定 NF4 码本：表[15] = 1，例如：表[0] = −1，表[7] = 0；块级缩放因子：FP32，约为 0.3，图示 64 值共享一个 32 位 scale</desc><rect width="320" height="728" fill="#f4f7f9"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif" fill="#243b45"><text x="20" y="36" font-size="22" font-weight="600">NF4</text><text x="20" y="68" font-size="15" fill="#536975">每个数保存 4 位索引；一组另有共享缩</text><text x="20" y="89" font-size="15" fill="#536975">放因子</text><rect x="20" y="126" width="280" height="32" fill="#e0e9f6"/><line x1="20" y1="126" x2="20" y2="158" stroke="#ffffff"/><text x="55" y="148" font-size="15" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace">1</text><line x1="90" y1="126" x2="90" y2="158" stroke="#ffffff"/><text x="125" y="148" font-size="15" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace">1</text><line x1="160" y1="126" x2="160" y2="158" stroke="#ffffff"/><text x="195" y="148" font-size="15" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace">1</text><line x1="230" y1="126" x2="230" y2="158" stroke="#ffffff"/><text x="265" y="148" font-size="15" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace">1</text><rect x="20" y="178" width="4" height="21" fill="#e0e9f6"/><text x="32" y="196" font-size="17" font-weight="600">码本索引</text><text x="32" y="219" font-size="13" fill="#536975">4 位 · 位 3—0</text><text x="32" y="248" font-size="16" font-family="ui-monospace, SFMono-Regular, monospace">1111</text><text x="32" y="274" font-size="15" >四位组成索引 15，去固定码本查数值</text><rect x="20" y="299" width="4" height="21" fill="#e0e9f6"/><text x="32" y="317" font-size="17" font-weight="600">固定 NF4 码本</text><text x="32" y="340" font-size="13" fill="#536975">固定规则或共享数据</text><text x="32" y="369" font-size="16" font-family="ui-monospace, SFMono-Regular, monospace">表[15] = 1</text><text x="32" y="395" font-size="15" >例如：表[0] = −1，表[7] = 0</text><rect x="20" y="420" width="4" height="21" fill="#dcece9"/><text x="32" y="438" font-size="17" font-weight="600">块级缩放因子</text><text x="32" y="461" font-size="13" fill="#536975">固定规则或共享数据</text><text x="32" y="490" font-size="16" font-family="ui-monospace, SFMono-Regular, monospace">FP32，约为 0.3</text><text x="32" y="516" font-size="15" >图示 64 值共享一个 32 位 scale</text><line x1="20" y1="554" x2="300" y2="554" stroke="#c9d4db"/><text x="20" y="583" font-size="15" >读回：表[15] × scale ≈ 1 × 0.3</text><text x="20" y="604" font-size="15" > = 0.3</text><text x="20" y="634" font-size="15" >NF4 的位表示查表索引，刻度由码本安排</text><text x="20" y="664" font-size="15" >图示每组 64×4 + 32 = 288 位，平</text><text x="20" y="685" font-size="15" >均 4.5 位/值</text></g></svg>