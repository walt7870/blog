<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 608" role="img" aria-labelledby="mxfp4-title mxfp4-desc"><title id="mxfp4-title">MXFP4 的存储结构</title><desc id="mxfp4-desc">组级 scale：8 位，10000000，E8M0 编码 128 → 2^(128−127) = 2；32 个数值编码：128 位，32 × FP4 E2M1，128 位载荷；每个数按自身格式解码</desc><rect width="320" height="608" fill="#f4f7f9"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif" fill="#243b45"><text x="20" y="36" font-size="22" font-weight="600">MXFP4</text><text x="20" y="68" font-size="15" fill="#536975">32 个 4 位值，共用 1 个 E8M0 缩放</text><text x="20" y="89" font-size="15" fill="#536975">因子</text><rect x="20" y="126" width="16.470588235294116" height="32" fill="#dcece9"/><rect x="36.470588235294116" y="126" width="263.52941176470586" height="32" fill="#e0e9f6"/><rect x="20" y="178" width="4" height="21" fill="#dcece9"/><text x="32" y="196" font-size="17" font-weight="600">组级 scale</text><text x="32" y="219" font-size="13" fill="#536975">8 位 · 块内字段</text><text x="32" y="248" font-size="16" font-family="ui-monospace, SFMono-Regular, monospace">10000000</text><text x="32" y="274" font-size="15" >E8M0 编码 128 → 2^(128−127) </text><text x="32" y="295" font-size="15" >= 2</text><rect x="20" y="320" width="4" height="21" fill="#e0e9f6"/><text x="32" y="338" font-size="17" font-weight="600">32 个数值编码</text><text x="32" y="361" font-size="13" fill="#536975">128 位 · 块内字段</text><text x="32" y="390" font-size="16" font-family="ui-monospace, SFMono-Regular, monospace">32 × FP4 E2M1</text><text x="32" y="416" font-size="15" >128 位载荷；每个数按自身格式解码</text><line x1="20" y1="454" x2="300" y2="454" stroke="#c9d4db"/><text x="20" y="483" font-size="15" >示例：组内编码读为 1.5，乘 scale 2</text><text x="20" y="504" font-size="15" > → 3</text><text x="20" y="534" font-size="15" >每组 17 字节；平均 4.25 位/值</text><text x="20" y="564" font-size="15" >scale 由一组共享，计入总存储空间</text></g></svg>