<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 728" role="img" aria-labelledby="nvfp4-title nvfp4-desc"><title id="nvfp4-title">NVFP4 的存储结构</title><desc id="nvfp4-desc">块级 scale：8 位，0 | 1000 | 000，FP8 E4M3 编码读为 2；16 个 E2M1 编码：64 位，16 × 4 位，每个值 4 位；示例 0 | 01 | 1 读为 1.5；张量级 scale：FP32，例如 1.0，整个张量共享，单独保存</desc><rect width="320" height="728" fill="#f4f7f9"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif" fill="#243b45"><text x="20" y="36" font-size="22" font-weight="600">NVFP4</text><text x="20" y="68" font-size="15" fill="#536975">图示 16 值分组：块级 scale + E2M1</text><text x="20" y="89" font-size="15" fill="#536975"> 数值</text><rect x="20" y="126" width="31.11111111111111" height="32" fill="#dcece9"/><rect x="51.111111111111114" y="126" width="248.88888888888889" height="32" fill="#e0e9f6"/><rect x="20" y="178" width="4" height="21" fill="#dcece9"/><text x="32" y="196" font-size="17" font-weight="600">块级 scale</text><text x="32" y="219" font-size="13" fill="#536975">8 位 · 块内字段</text><text x="32" y="248" font-size="16" font-family="ui-monospace, SFMono-Regular, monospace">0 | 1000 | 000</text><text x="32" y="274" font-size="15" >FP8 E4M3 编码读为 2</text><rect x="20" y="299" width="4" height="21" fill="#e0e9f6"/><text x="32" y="317" font-size="17" font-weight="600">16 个 E2M1 编码</text><text x="32" y="340" font-size="13" fill="#536975">64 位 · 块内字段</text><text x="32" y="369" font-size="16" font-family="ui-monospace, SFMono-Regular, monospace">16 × 4 位</text><text x="32" y="395" font-size="15" >每个值 4 位；示例 0 | 01 | 1 读</text><text x="32" y="416" font-size="15" >为 1.5</text><rect x="20" y="441" width="4" height="21" fill="#e0e9f6"/><text x="32" y="459" font-size="17" font-weight="600">张量级 scale</text><text x="32" y="482" font-size="13" fill="#536975">固定规则或共享数据</text><text x="32" y="511" font-size="16" font-family="ui-monospace, SFMono-Regular, monospace">FP32，例如 1.0</text><text x="32" y="537" font-size="15" >整个张量共享，单独保存</text><line x1="20" y1="575" x2="300" y2="575" stroke="#c9d4db"/><text x="20" y="604" font-size="15" >读回示例：1.5 × 块级 2 × 张量级 </text><text x="20" y="625" font-size="15" >1 = 3</text><text x="20" y="655" font-size="15" >组内 72 位 / 16 = 4.5 位/值</text><text x="20" y="685" font-size="15" >另加张量级 FP32 scale 的摊销空间</text></g></svg>