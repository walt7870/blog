<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 476" role="img" aria-labelledby="gguf-q4-0-title gguf-q4-0-desc"><title id="gguf-q4-0-title">GGUF / GGML Q4_0 的存储结构</title><desc id="gguf-q4-0-desc">缩放因子 d：16 位，FP16，占 2 字节，一块的 32 个值共用 d；量化码 qs：128 位，32 × 4 位，占 16 字节，一个字节装两个 4 位码，q 范围为 0—15</desc><rect width="720" height="476" fill="#f4f7f9"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif" fill="#243b45"><text x="24" y="36" font-size="25" font-weight="600">GGUF / GGML Q4_0</text><text x="24" y="71" font-size="15" fill="#536975">32 个值一块；结构体中保存 scale 与量化码</text><rect x="24" y="108" width="74.66666666666667" height="32" fill="#dcece9"/><rect x="98.66666666666667" y="108" width="597.3333333333334" height="32" fill="#e0e9f6"/><rect x="24" y="160" width="4" height="22" fill="#dcece9"/><text x="36" y="178" font-size="17" font-weight="600">缩放因子 d</text><text x="36" y="201" font-size="13" fill="#536975">16 位 · 块内字段</text><text x="696" y="200" font-size="15" text-anchor="end" font-family="ui-monospace, SFMono-Regular, monospace">FP16，占 2 字节</text><text x="36" y="225" font-size="14" >一块的 32 个值共用 d</text><rect x="24" y="246" width="4" height="22" fill="#e0e9f6"/><text x="36" y="264" font-size="17" font-weight="600">量化码 qs</text><text x="36" y="287" font-size="13" fill="#536975">128 位 · 块内字段</text><text x="696" y="286" font-size="15" text-anchor="end" font-family="ui-monospace, SFMono-Regular, monospace">32 × 4 位，占 16 字节</text><text x="36" y="311" font-size="14" >一个字节装两个 4 位码，q 范围为 0—15</text><line x1="24" y1="345" x2="696" y2="345" stroke="#c9d4db"/><text x="24" y="374" font-size="15" >读回：x = d × (q − 8)</text><text x="24" y="404" font-size="15" >2 + 16 = 18 字节 / 32 值 = 4.5 位/值</text><text x="24" y="434" font-size="15" >例如 d = 0.25、q = 9，得到 x = 0.25</text></g></svg>