<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 848" role="img" aria-labelledby="tf32-title tf32-desc"><title id="tf32-title">TF32 矩阵计算模式 的存储结构</title><desc id="tf32-desc">符号：1 位，0，沿用输入的正负号；指数：8 位，01111111，保留 FP32 的 8 位指数范围；进入乘法的小数部分：10 位，0100000000，保留 10 位小数部分，隐含开头的 1；FP32 的其余小数位：13 位，0000000000000，进入乘法前参与舍入；累加通常采用 FP32</desc><rect width="320" height="848" fill="#f4f7f9"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif" fill="#243b45"><text x="20" y="36" font-size="22" font-weight="600">TF32 矩阵计算模式</text><text x="20" y="68" font-size="15" fill="#536975">输入仍为 FP32；图示进入乘法时的有效</text><text x="20" y="89" font-size="15" fill="#536975">位</text><rect x="20" y="126" width="8.75" height="32" fill="#f9e5e9"/><line x1="20" y1="126" x2="20" y2="158" stroke="#ffffff"/><rect x="28.75" y="126" width="70" height="32" fill="#dcece9"/><line x1="28.75" y1="126" x2="28.75" y2="158" stroke="#ffffff"/><line x1="37.5" y1="126" x2="37.5" y2="158" stroke="#ffffff"/><line x1="46.25" y1="126" x2="46.25" y2="158" stroke="#ffffff"/><line x1="55" y1="126" x2="55" y2="158" stroke="#ffffff"/><line x1="63.75" y1="126" x2="63.75" y2="158" stroke="#ffffff"/><line x1="72.5" y1="126" x2="72.5" y2="158" stroke="#ffffff"/><line x1="81.25" y1="126" x2="81.25" y2="158" stroke="#ffffff"/><line x1="90" y1="126" x2="90" y2="158" stroke="#ffffff"/><rect x="98.75" y="126" width="87.5" height="32" fill="#e0e9f6"/><line x1="98.75" y1="126" x2="98.75" y2="158" stroke="#ffffff"/><line x1="107.5" y1="126" x2="107.5" y2="158" stroke="#ffffff"/><line x1="116.25" y1="126" x2="116.25" y2="158" stroke="#ffffff"/><line x1="125" y1="126" x2="125" y2="158" stroke="#ffffff"/><line x1="133.75" y1="126" x2="133.75" y2="158" stroke="#ffffff"/><line x1="142.5" y1="126" x2="142.5" y2="158" stroke="#ffffff"/><line x1="151.25" y1="126" x2="151.25" y2="158" stroke="#ffffff"/><line x1="160" y1="126" x2="160" y2="158" stroke="#ffffff"/><line x1="168.75" y1="126" x2="168.75" y2="158" stroke="#ffffff"/><line x1="177.5" y1="126" x2="177.5" y2="158" stroke="#ffffff"/><rect x="186.25" y="126" width="113.75" height="32" fill="#e7eaed"/><line x1="186.25" y1="126" x2="186.25" y2="158" stroke="#ffffff"/><line x1="195" y1="126" x2="195" y2="158" stroke="#ffffff"/><line x1="203.75" y1="126" x2="203.75" y2="158" stroke="#ffffff"/><line x1="212.5" y1="126" x2="212.5" y2="158" stroke="#ffffff"/><line x1="221.25" y1="126" x2="221.25" y2="158" stroke="#ffffff"/><line x1="230" y1="126" x2="230" y2="158" stroke="#ffffff"/><line x1="238.75" y1="126" x2="238.75" y2="158" stroke="#ffffff"/><line x1="247.5" y1="126" x2="247.5" y2="158" stroke="#ffffff"/><line x1="256.25" y1="126" x2="256.25" y2="158" stroke="#ffffff"/><line x1="265" y1="126" x2="265" y2="158" stroke="#ffffff"/><line x1="273.75" y1="126" x2="273.75" y2="158" stroke="#ffffff"/><line x1="282.5" y1="126" x2="282.5" y2="158" stroke="#ffffff"/><line x1="291.25" y1="126" x2="291.25" y2="158" stroke="#ffffff"/><rect x="20" y="178" width="4" height="21" fill="#f9e5e9"/><text x="32" y="196" font-size="17" font-weight="600">符号</text><text x="32" y="219" font-size="13" fill="#536975">1 位 · 位 31</text><text x="32" y="248" font-size="16" font-family="ui-monospace, SFMono-Regular, monospace">0</text><text x="32" y="274" font-size="15" >沿用输入的正负号</text><rect x="20" y="299" width="4" height="21" fill="#dcece9"/><text x="32" y="317" font-size="17" font-weight="600">指数</text><text x="32" y="340" font-size="13" fill="#536975">8 位 · 位 30—23</text><text x="32" y="369" font-size="16" font-family="ui-monospace, SFMono-Regular, monospace">01111111</text><text x="32" y="395" font-size="15" >保留 FP32 的 8 位指数范围</text><rect x="20" y="420" width="4" height="21" fill="#e0e9f6"/><text x="32" y="438" font-size="17" font-weight="600">进入乘法的小数部分</text><text x="32" y="461" font-size="13" fill="#536975">10 位 · 位 22—13</text><text x="32" y="490" font-size="16" font-family="ui-monospace, SFMono-Regular, monospace">0100000000</text><text x="32" y="516" font-size="15" >保留 10 位小数部分，隐含开头的 1</text><rect x="20" y="541" width="4" height="21" fill="#e7eaed"/><text x="32" y="559" font-size="17" font-weight="600">FP32 的其余小数位</text><text x="32" y="582" font-size="13" fill="#536975">13 位 · 位 12—0</text><text x="32" y="611" font-size="16" font-family="ui-monospace, SFMono-Regular, monospace">0000000000000</text><text x="32" y="637" font-size="15" >进入乘法前参与舍入；累加通常采用 </text><text x="32" y="658" font-size="15" >FP32</text><line x1="20" y1="696" x2="300" y2="696" stroke="#c9d4db"/><text x="20" y="725" font-size="15" >示例 1.25 在这次舍入中仍为 1.25</text><text x="20" y="755" font-size="15" >模型输入与输出可以继续按 FP32 保存</text><text x="20" y="785" font-size="15" >记录配置时分别写保存 dtype 和 TF32</text><text x="20" y="806" font-size="15" > 计算开关</text></g></svg>