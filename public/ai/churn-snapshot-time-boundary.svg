<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="580" viewBox="0 0 1120 580" role="img" aria-labelledby="churn-snapshot-time-boundary-title churn-snapshot-time-boundary-desc"><title id="churn-snapshot-time-boundary-title">流失预测：过去30天的特征，未来14天的标签</title><desc id="churn-snapshot-time-boundary-desc">以6月1日0点为预测时点，按业务时区计日；时间轴间距按天数比例绘制。</desc><defs><marker id="churn-snapshot-time-boundary-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker><style>text{font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#172b3a}.head{font-size:27px;font-weight:700}.node{font-size:20px;font-weight:700}.body{font-size:17px;fill:#475569}.box{fill:white;stroke:#cbd5e1;stroke-width:2}.blue{fill:#eff6ff;stroke:#60a5fa;stroke-width:2}.green{fill:#ecfdf5;stroke:#14b8a6;stroke-width:2}.red{fill:#fff1f2;stroke:#e88191;stroke-width:2}.line{fill:none;stroke:#64748b;stroke-width:2}.dash{stroke-dasharray:6 5}</style></defs><rect width="1120" height="580" fill="#f8fafc"/><text x="40" y="48" class="head" text-anchor="start">流失预测：过去30天的特征，未来14天的标签</text><text x="40" y="80" class="body" text-anchor="start">以6月1日0点为预测时点，按业务时区计日；时间轴间距按天数比例绘制。</text><rect x="80" y="152" width="660" height="108" rx="6" class="blue"/><rect x="740" y="152" width="308" height="108" rx="6" class="green"/><text x="112" y="194" class="node" text-anchor="start">特征窗口 [T-30天, T)</text><text x="112" y="229" class="body" text-anchor="start">还需满足：预测时点已可用</text><text x="762" y="194" class="node" text-anchor="start">标签窗口 [T, T+14天)</text><text x="762" y="229" class="body" text-anchor="start">之后观察，不能作输入</text><path d="M80 296H1048M80 284V308M740 276V316M1048 284V308" class="line"/><text x="80" y="344" class="body" text-anchor="start">5月2日 / T-30天</text><text x="740" y="344" class="node" text-anchor="middle">6月1日 / T</text><text x="1048" y="344" class="body" text-anchor="end">6月15日</text><rect x="40" y="392" width="500" height="100" rx="6" class="box"/><text x="56" y="424" class="node" text-anchor="start">事件发生早，不代表当时可见</text><text x="56" y="454" class="body" text-anchor="start">5月31日事件在6月2日才补写，不能进入6月1日输入。</text><rect x="580" y="392" width="500" height="100" rx="6" class="red"/><text x="596" y="424" class="node" text-anchor="start">模拟上线训练，也要等标签成熟</text><text x="596" y="454" class="body" text-anchor="start">训练标签窗口已结束，且相关数据已经入齐。</text><text x="40" y="544" class="body" text-anchor="start">时间切分应避免训练标签跨入验证预测时点；名单效果与触达增量效果分开评估。</text></svg>
