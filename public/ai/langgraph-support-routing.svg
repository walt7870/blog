<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="470" viewBox="0 0 1120 470" role="img" aria-labelledby="langgraph-support-routing-title langgraph-support-routing-desc"><title id="langgraph-support-routing-title">客服状态图：先校验，再执行</title><desc id="langgraph-support-routing-desc">分类后经过确定性检查，ready才查询订单，缺输入与赔偿直接结束。</desc><defs><marker id="langgraph-support-routing-a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#526678"/></marker><style>text{font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#243746}.h{font-size:26px;font-weight:700}.t{font-size:19px;font-weight:700}.s{font-size:16px;fill:#526678}.b{fill:#fff;stroke:#b9cbd4;stroke-width:1.5}.f{fill:#e5f4ee;stroke:#43836e;stroke-width:1.5}.l{fill:none;stroke:#526678;stroke-width:2;marker-end:url(#langgraph-support-routing-a)}.d{stroke-dasharray:6 5}</style></defs><rect width="1120" height="470" fill="#f4f8fa"/><text x="36" y="48" class="h">客服状态图：先校验，再执行</text><text x="36" y="80" class="s">完整离线示例只处理教学订单，不创建工单；生产权限由服务端身份决定。</text>
<path class="l" d="M250 181H310"/><path class="l" d="M550 181H630"/><path class="l" d="M850 181H900"/>
<rect x="36" y="136" width="214" height="92" rx="6" class="b"/><text x="52" y="167" class="t">classify</text><text x="52" y="193" class="s">规则分类、提取订单号</text>
<path d="M430 120L550 181L430 242L310 181Z" class="f"/><text x="430" y="178" text-anchor="middle" class="t">guardrail</text><text x="430" y="204" text-anchor="middle" class="s">输入与风险条件</text>
<rect x="630" y="136" width="220" height="106" rx="6" class="b"/><text x="646" y="167" class="t">respond</text><text x="646" y="193" class="s">按意图调用只读Tool</text><text x="646" y="218" class="s">固定模板生成答复</text>
<rect x="900" y="143" width="184" height="76" rx="6" class="b"/><text x="916" y="174" class="t">completed</text>
<text x="572" y="164" class="s">ready</text>
<path class="l" d="M430 242V342H520"/><text x="448" y="284" class="s">缺订单号 / 赔偿</text>
<rect x="520" y="310" width="330" height="102" rx="6" class="b"/><text x="536" y="341" class="t">直接结束</text><text x="536" y="367" class="s">needs_input / escalated</text><text x="536" y="392" class="s">不调用查询，不创建工单</text>
<text x="36" y="445" class="s">State默认覆盖同名字段；需要累计消息时声明reducer。持久化与重放幂等需另外配置。</text></svg>
