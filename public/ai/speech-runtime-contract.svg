<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="620" viewBox="0 0 1120 620" role="img" aria-labelledby="speech-runtime-contract-title speech-runtime-contract-desc"><title id="speech-runtime-contract-title">临时转写可以修订，业务动作要等待完整条件</title><desc id="speech-runtime-contract-desc">示例为分模块全双工助手；模型可能内置部分模块，接口能力与顺序应单独核对。</desc><defs><marker id="speech-runtime-contract-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker><style>text{font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#172b3a}.head{font-size:28px;font-weight:700}.node{font-size:20px;font-weight:700}.body{font-size:17px;fill:#475569}.box{fill:white;stroke:#cbd5e1;stroke-width:2}.blue{fill:#eff6ff;stroke:#60a5fa;stroke-width:2}.green{fill:#ecfdf5;stroke:#14b8a6;stroke-width:2}.red{fill:#fff1f2;stroke:#e88191;stroke-width:2}.pad{fill:#e2e8f0;stroke:#94a3b8}.line{fill:none;stroke:#64748b;stroke-width:2}.dash{stroke-dasharray:6 5}</style></defs><rect width="1120" height="620" fill="#f8fafc"/><text x="40" y="48" class="head" text-anchor="start">临时转写可以修订，业务动作要等待完整条件</text><text x="40" y="80" class="body" text-anchor="start">示例为分模块全双工助手；模型可能内置部分模块，接口能力与顺序应单独核对。</text><path d="M205 185H255" class="line" marker-end="url(#speech-runtime-contract-arrow)"/><path d="M475 185H525" class="line" marker-end="url(#speech-runtime-contract-arrow)"/><path d="M745 185H795" class="line" marker-end="url(#speech-runtime-contract-arrow)"/><path d="M920 245V320H920V385" class="line" marker-end="url(#speech-runtime-contract-arrow)"/><path d="M795 445H745" class="line" marker-end="url(#speech-runtime-contract-arrow)"/><path d="M525 445H475" class="line" marker-end="url(#speech-runtime-contract-arrow)"/><path d="M255 445H205" class="line" marker-end="url(#speech-runtime-contract-arrow)"/><path d="M125 385V295H635V385" class="line dash" marker-end="url(#speech-runtime-contract-arrow)"/><rect x="40" y="130" width="165" height="110" class="box" rx="6"/><text x="58" y="162" class="node" text-anchor="start">采集合同</text><text x="58" y="192" class="body" text-anchor="start">采样率 / 声道</text><text x="58" y="217" class="body" text-anchor="start">编码与分块序号</text><rect x="255" y="130" width="220" height="110" class="box" rx="6"/><text x="273" y="162" class="node" text-anchor="start">音频前端</text><text x="273" y="192" class="body" text-anchor="start">按实现做回声消除</text><text x="273" y="217" class="body" text-anchor="start">降噪、VAD或模型特征</text><rect x="525" y="130" width="220" height="110" class="blue" rx="6"/><text x="543" y="162" class="node" text-anchor="start">ASR 与解码</text><text x="543" y="192" class="body" text-anchor="start">热词可能影响解码</text><text x="543" y="217" class="body" text-anchor="start">结果与时间戳依接口</text><rect x="795" y="130" width="285" height="115" class="green" rx="6"/><text x="813" y="162" class="node" text-anchor="start">结果稳定与意图</text><text x="813" y="192" class="body" text-anchor="start">临时 A10 可能修订为 A102</text><text x="813" y="217" class="body" text-anchor="start">静音、结束输入、final分开</text><rect x="795" y="385" width="285" height="120" class="blue" rx="6"/><text x="813" y="417" class="node" text-anchor="start">受控业务调用</text><text x="813" y="447" class="body" text-anchor="start">核对必要参数、身份与授权</text><text x="813" y="472" class="body" text-anchor="start">幂等执行并回读真实结果</text><rect x="525" y="385" width="220" height="110" class="box" rx="6"/><text x="543" y="417" class="node" text-anchor="start">回答与 TTS</text><text x="543" y="447" class="body" text-anchor="start">文本规范化与读法</text><text x="543" y="472" class="body" text-anchor="start">合成音频块按序输出</text><rect x="255" y="385" width="220" height="110" class="box" rx="6"/><text x="273" y="417" class="node" text-anchor="start">播放队列</text><text x="273" y="447" class="body" text-anchor="start">采样率与连续时序</text><text x="273" y="472" class="body" text-anchor="start">迟到旧块不能重新入队</text><rect x="40" y="385" width="165" height="110" class="green" rx="6"/><text x="58" y="417" class="node" text-anchor="start">用户打断</text><text x="58" y="447" class="body" text-anchor="start">停播并取消旧任务</text><text x="58" y="472" class="body" text-anchor="start">清理旧队列</text><text x="160" y="330" class="body" text-anchor="start">虚线：打断取消旧合成任务，播放队列按当前轮次接收音频。</text><text x="40" y="570" class="body" text-anchor="start">示例链路需按运行时适配；离线识别、端到端音频模型和非全双工场景可以采用不同结构。</text></svg>
