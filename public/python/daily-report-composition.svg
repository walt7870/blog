<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="520" viewBox="0 0 1120 520" role="img" aria-labelledby="daily-report-composition-title daily-report-composition-desc"><title id="daily-report-composition-title">日报模板接收已计算指标，不替代统计过程</title><desc id="daily-report-composition-desc">本课传入固定教学指标18、3、5、2，只演示格式化与文件输出。</desc><defs><marker id="daily-report-composition-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#607568"/></marker><style>text{font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;fill:#253c30;letter-spacing:0}.h{font-size:28px;font-weight:600}.n{font-size:21px;font-weight:600}.s{font-size:18px;fill:#52685b}.node{fill:#fff;stroke:#a6b9ad;stroke-width:1.5}.good{fill:#e9f4ee;stroke:#397657;stroke-width:1.5}.info{fill:#edf3fb;stroke:#739bbf;stroke-width:1.5}.warn{fill:#f8eef1;stroke:#ae7789;stroke-width:1.5}.edge{fill:none;stroke:#607568;stroke-width:2;marker-end:url(#daily-report-composition-arrow)}.dashed{stroke-dasharray:6 5}</style></defs><rect width="1120" height="520" fill="white"/><text x="32" y="44" class="h">日报模板接收已计算指标，不替代统计过程</text><text x="32" y="82" class="s">本课传入固定教学指标18、3、5、2，只演示格式化与文件输出。</text><path d="M352 190H444" class="edge"/><path d="M352 358H392Q400 358 400 350V238Q400 230 408 230H444" class="edge"/><path d="M732 210H816" class="edge"/><rect data-node="客户指标" x="32" y="136" width="320" height="120" rx="6" class="node"/><text x="52" y="172" class="n">客户指标</text><text x="52" y="204" class="s">新增18、待补3、回访5</text><text x="52" y="232" class="s">口径可重叠</text><rect data-node="订单指标" x="32" y="304" width="320" height="112" rx="6" class="node"/><text x="52" y="340" class="n">订单指标</text><text x="52" y="372" class="s">异常订单2</text><text x="52" y="400" class="s">附异常明细去向</text><rect data-node="build_report(summary)" x="444" y="152" width="288" height="120" rx="6" class="info"/><text x="464" y="188" class="n">build_report(summary)</text><text x="464" y="220" class="s">只负责文本模板</text><text x="464" y="248" class="s">不读原始表</text><rect data-node="outputs/日报.txt" x="816" y="152" width="272" height="120" rx="6" class="good"/><text x="836" y="188" class="n">outputs/日报.txt</text><text x="836" y="220" class="s">日期、批次、内容</text><text x="836" y="248" class="s">写入后核对指标</text><text x="32" y="472" class="s">新增客户、待补与回访不是互斥人群，不能把四个数相加当作总客户数。</text></svg>
