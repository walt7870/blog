<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="440" viewBox="0 0 1120 440" role="img" aria-labelledby="csv-validation-path-title csv-validation-path-desc"><title id="csv-validation-path-title">缺列是批级错误，缺值是行级检查结果</title><desc id="csv-validation-path-desc">原始客户表保持不变，另写待补信息名单。</desc><defs><marker id="csv-validation-path-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#607568"/></marker><style>text{font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;fill:#253c30;letter-spacing:0}.h{font-size:28px;font-weight:600}.n{font-size:21px;font-weight:600}.s{font-size:18px;fill:#52685b}.node{fill:#fff;stroke:#a6b9ad;stroke-width:1.5}.good{fill:#e9f4ee;stroke:#397657;stroke-width:1.5}.info{fill:#edf3fb;stroke:#739bbf;stroke-width:1.5}.warn{fill:#f8eef1;stroke:#ae7789;stroke-width:1.5}.edge{fill:none;stroke:#607568;stroke-width:2;marker-end:url(#csv-validation-path-arrow)}.dashed{stroke-dasharray:6 5}</style></defs><rect width="1120" height="440" fill="white"/><text x="32" y="44" class="h">缺列是批级错误，缺值是行级检查结果</text><text x="32" y="82" class="s">原始客户表保持不变，另写待补信息名单。</text><path d="M272 216H304" class="edge"/><path d="M544 216H576" class="edge"/><path d="M816 216H848" class="edge"/><rect data-node="读 CSV" x="32" y="144" width="240" height="144" rx="6" class="node"/><text x="52" y="180" class="n">读 CSV</text><text x="52" y="212" class="s">utf-8-sig</text><text x="52" y="240" class="s">newline=&quot;&quot;</text><rect data-node="先校验表头" x="304" y="144" width="240" height="144" rx="6" class="node"/><text x="324" y="180" class="n">先校验表头</text><text x="324" y="212" class="s">name / phone / city</text><text x="324" y="240" class="s">缺列立即终止</text><rect data-node="逐行检查" x="576" y="144" width="240" height="144" rx="6" class="node"/><text x="596" y="180" class="n">逐行检查</text><text x="596" y="212" class="s">空手机号或城市</text><text x="596" y="240" class="s">保留姓名和缺项</text><rect data-node="写结果 CSV" x="848" y="144" width="240" height="144" rx="6" class="good"/><text x="868" y="180" class="n">写结果 CSV</text><text x="868" y="212" class="s">独立结果文件</text><text x="868" y="240" class="s">两行待补信息</text><text x="32" y="392" class="s">合法表头但没有数据行是正常空表；零字节文件缺表头，不能当成同一种情况。</text></svg>
