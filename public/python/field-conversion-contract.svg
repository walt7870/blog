<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="440" viewBox="0 0 1120 440" role="img" aria-labelledby="field-conversion-contract-title field-conversion-contract-desc"><title id="field-conversion-contract-title">类型转换之前，先确认字段合同</title><desc id="field-conversion-contract-desc">手机号保留文本；计算字段按口径转换，空值与零分开处理。</desc><defs><marker id="field-conversion-contract-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#607568"/></marker><style>text{font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;fill:#253c30;letter-spacing:0}.h{font-size:28px;font-weight:600}.n{font-size:21px;font-weight:600}.s{font-size:18px;fill:#52685b}.node{fill:#fff;stroke:#a6b9ad;stroke-width:1.5}.good{fill:#e9f4ee;stroke:#397657;stroke-width:1.5}.info{fill:#edf3fb;stroke:#739bbf;stroke-width:1.5}.warn{fill:#f8eef1;stroke:#ae7789;stroke-width:1.5}.edge{fill:none;stroke:#607568;stroke-width:2;marker-end:url(#field-conversion-contract-arrow)}.dashed{stroke-dasharray:6 5}</style></defs><rect width="1120" height="440" fill="white"/><text x="32" y="44" class="h">类型转换之前，先确认字段合同</text><text x="32" y="82" class="s">手机号保留文本；计算字段按口径转换，空值与零分开处理。</text><path d="M272 216H304" class="edge"/><path d="M544 216H576" class="edge"/><path d="M816 216H848" class="edge"/><rect data-node="原始文本" x="32" y="144" width="240" height="144" rx="6" class="node"/><text x="52" y="180" class="n">原始文本</text><text x="52" y="212" class="s">phone = &quot;0138…&quot;</text><text x="52" y="240" class="s">amount = &quot;1200.50&quot;</text><rect data-node="字段校验" x="304" y="144" width="240" height="144" rx="6" class="node"/><text x="324" y="180" class="n">字段校验</text><text x="324" y="212" class="s">必需键、格式、空值</text><text x="324" y="240" class="s">非法值有明确错误</text><rect data-node="业务类型" x="576" y="144" width="240" height="144" rx="6" class="node"/><text x="596" y="180" class="n">业务类型</text><text x="596" y="212" class="s">手机号：str</text><text x="596" y="240" class="s">金额：Decimal / 分</text><rect data-node="规则与输出" x="848" y="144" width="240" height="144" rx="6" class="good"/><text x="868" y="180" class="n">规则与输出</text><text x="868" y="212" class="s">数值比较、求和</text><text x="868" y="240" class="s">展示与缺失报告</text><text x="32" y="392" class="s">Decimal 从原始字符串构造；bool(&quot;false&quot;) 为 True，文本布尔值需要显式映射。</text></svg>
