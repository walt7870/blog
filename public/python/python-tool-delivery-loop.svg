<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="528" viewBox="0 0 1120 528" role="img" aria-labelledby="python-tool-delivery-loop-title python-tool-delivery-loop-desc"><title id="python-tool-delivery-loop-title">先让最小工具结果可信，再逐条增加能力</title><desc id="python-tool-delivery-loop-desc">第一版只查手机号；每次扩展都增加输入样例、预期结果和失败说明。</desc><defs><marker id="python-tool-delivery-loop-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#607568"/></marker><style>text{font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;fill:#253c30;letter-spacing:0}.h{font-size:28px;font-weight:600}.n{font-size:21px;font-weight:600}.s{font-size:18px;fill:#52685b}.node{fill:#fff;stroke:#a6b9ad;stroke-width:1.5}.good{fill:#e9f4ee;stroke:#397657;stroke-width:1.5}.info{fill:#edf3fb;stroke:#739bbf;stroke-width:1.5}.warn{fill:#f8eef1;stroke:#ae7789;stroke-width:1.5}.edge{fill:none;stroke:#607568;stroke-width:2;marker-end:url(#python-tool-delivery-loop-arrow)}.dashed{stroke-dasharray:6 5}</style></defs><rect width="1120" height="528" fill="white"/><text x="32" y="44" class="h">先让最小工具结果可信，再逐条增加能力</text><text x="32" y="82" class="s">第一版只查手机号；每次扩展都增加输入样例、预期结果和失败说明。</text><path d="M272 212H304" class="edge"/><path d="M544 212H576" class="edge"/><path d="M816 212H848" class="edge"/><path d="M968 284V340Q968 348 960 348H160Q152 348 152 340V284" class="edge dashed"/><rect data-node="固定输入" x="32" y="140" width="240" height="144" rx="6" class="node"/><text x="52" y="176" class="n">固定输入</text><text x="52" y="208" class="s">三位客户</text><text x="52" y="236" class="s">韩梅梅缺手机号</text><rect data-node="执行参数版工具" x="304" y="140" width="240" height="144" rx="6" class="node"/><text x="324" y="176" class="n">执行参数版工具</text><text x="324" y="208" class="s">独立outputs目录</text><text x="324" y="236" class="s">保留原始CSV</text><rect data-node="对照预期" x="576" y="140" width="240" height="144" rx="6" class="info"/><text x="596" y="176" class="n">对照预期</text><text x="596" y="208" class="s">一行待补</text><text x="596" y="236" class="s">缺列必须失败</text><rect data-node="新环境交付" x="848" y="140" width="240" height="144" rx="6" class="good"/><text x="868" y="176" class="n">新环境交付</text><text x="868" y="208" class="s">按README重跑</text><text x="868" y="236" class="s">目录与结果都检查</text><rect x="376" y="358" width="232" height="30" fill="#fff"/><text x="384" y="380" class="s">新增规则后，补样例再验证</text><text x="32" y="480" class="s">恢复输入应恢复结果；变更规则应有新的预期，不能只看程序退出码为0。</text></svg>
