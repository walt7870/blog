<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="516" viewBox="0 0 1120 516" role="img" aria-labelledby="batch-file-boundaries-title batch-file-boundaries-desc"><title id="batch-file-boundaries-title">批处理读取原件，结果写到另一个目录</title><desc id="batch-file-boundaries-desc">按稳定原文件名派生目标名；排他创建防止重复运行静默覆盖。</desc><defs><marker id="batch-file-boundaries-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#607568"/></marker><style>text{font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;fill:#253c30;letter-spacing:0}.h{font-size:28px;font-weight:600}.n{font-size:21px;font-weight:600}.s{font-size:18px;fill:#52685b}.node{fill:#fff;stroke:#a6b9ad;stroke-width:1.5}.good{fill:#e9f4ee;stroke:#397657;stroke-width:1.5}.info{fill:#edf3fb;stroke:#739bbf;stroke-width:1.5}.warn{fill:#f8eef1;stroke:#ae7789;stroke-width:1.5}.edge{fill:none;stroke:#607568;stroke-width:2;marker-end:url(#batch-file-boundaries-arrow)}.dashed{stroke-dasharray:6 5}</style></defs><rect width="1120" height="516" fill="white"/><text x="32" y="44" class="h">批处理读取原件，结果写到另一个目录</text><text x="32" y="82" class="s">按稳定原文件名派生目标名；排他创建防止重复运行静默覆盖。</text><path d="M368 190H488" class="edge"/><path d="M368 358H488" class="edge"/><rect data-node="inputs/shanghai.txt" x="32" y="136" width="336" height="112" rx="6" class="node"/><text x="52" y="172" class="n">inputs/shanghai.txt</text><text x="52" y="204" class="s">只读UTF-8文本原件</text><rect data-node="inputs/hangzhou.txt" x="32" y="304" width="336" height="112" rx="6" class="node"/><text x="52" y="340" class="n">inputs/hangzhou.txt</text><text x="52" y="372" class="s">不改名、不重写内容</text><rect data-node="outputs/report-shanghai.txt" x="488" y="136" width="600" height="112" rx="6" class="good"/><text x="508" y="172" class="n">outputs/report-shanghai.txt</text><text x="508" y="204" class="s">第一次用x创建；已有目标就报错</text><rect data-node="outputs/report-hangzhou.txt" x="488" y="304" width="600" height="112" rx="6" class="good"/><text x="508" y="340" class="n">outputs/report-hangzhou.txt</text><text x="508" y="372" class="s">复制文本；本例不汇总多份内容</text><text x="32" y="468" class="s">空输入明确报错；中断可留下部分结果，重跑前先核对，不假装整批事务已回滚。</text></svg>
