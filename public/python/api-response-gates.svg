<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="440" viewBox="0 0 1120 440" role="img" aria-labelledby="api-response-gates-title api-response-gates-desc"><title id="api-response-gates-title">客户 API 的成功，要逐层判断</title><desc id="api-response-gates-desc">单页GET示意；分页游标和终止条件要按具体接口另行实现。</desc><defs><marker id="api-response-gates-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#607568"/></marker><style>text{font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;fill:#253c30;letter-spacing:0}.h{font-size:28px;font-weight:600}.n{font-size:21px;font-weight:600}.s{font-size:18px;fill:#52685b}.node{fill:#fff;stroke:#a6b9ad;stroke-width:1.5}.good{fill:#e9f4ee;stroke:#397657;stroke-width:1.5}.info{fill:#edf3fb;stroke:#739bbf;stroke-width:1.5}.warn{fill:#f8eef1;stroke:#ae7789;stroke-width:1.5}.edge{fill:none;stroke:#607568;stroke-width:2;marker-end:url(#api-response-gates-arrow)}.dashed{stroke-dasharray:6 5}</style></defs><rect width="1120" height="440" fill="white"/><text x="32" y="44" class="h">客户 API 的成功，要逐层判断</text><text x="32" y="82" class="s">单页GET示意；分页游标和终止条件要按具体接口另行实现。</text><path d="M272 216H304" class="edge"/><path d="M544 216H576" class="edge"/><path d="M816 216H848" class="edge"/><rect data-node="网络请求" x="32" y="144" width="240" height="144" rx="6" class="node"/><text x="52" y="180" class="n">网络请求</text><text x="52" y="212" class="s">HTTPS与认证头</text><text x="52" y="240" class="s">设置阻塞操作超时</text><rect data-node="HTTP 状态" x="304" y="144" width="240" height="144" rx="6" class="node"/><text x="324" y="180" class="n">HTTP 状态</text><text x="324" y="212" class="s">401认证 / 429限流</text><text x="324" y="240" class="s">5xx服务错误</text><rect data-node="JSON与业务合同" x="576" y="144" width="240" height="144" rx="6" class="node"/><text x="596" y="180" class="n">JSON与业务合同</text><text x="596" y="212" class="s">解析对象与客户数组</text><text x="596" y="240" class="s">识别业务失败状态</text><rect data-node="进入客户规则" x="848" y="144" width="240" height="144" rx="6" class="good"/><text x="868" y="180" class="n">进入客户规则</text><text x="868" y="212" class="s">校验记录和字段</text><text x="868" y="240" class="s">分页完成再汇总</text><text x="32" y="392" class="s">HTTP 200不保证业务成功；错误不能当空数组，凭证不能写入日志或源码。</text></svg>
