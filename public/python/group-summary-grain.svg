<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="520" viewBox="0 0 1120 520" role="img" aria-labelledby="group-summary-grain-title group-summary-grain-desc"><title id="group-summary-grain-title">先明确统计单位，再选择分组字段</title><desc id="group-summary-grain-desc">三条唯一客户记录，可分别按来源、城市和负责人统计；三份统计不互相相加。</desc><defs><marker id="group-summary-grain-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#607568"/></marker><style>text{font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;fill:#253c30;letter-spacing:0}.h{font-size:28px;font-weight:600}.n{font-size:21px;font-weight:600}.s{font-size:18px;fill:#52685b}.node{fill:#fff;stroke:#a6b9ad;stroke-width:1.5}.good{fill:#e9f4ee;stroke:#397657;stroke-width:1.5}.info{fill:#edf3fb;stroke:#739bbf;stroke-width:1.5}.warn{fill:#f8eef1;stroke:#ae7789;stroke-width:1.5}.edge{fill:none;stroke:#607568;stroke-width:2;marker-end:url(#group-summary-grain-arrow)}.dashed{stroke-dasharray:6 5}</style></defs><rect width="1120" height="520" fill="white"/><text x="32" y="44" class="h">先明确统计单位，再选择分组字段</text><text x="32" y="82" class="s">三条唯一客户记录，可分别按来源、城市和负责人统计；三份统计不互相相加。</text><path d="M376 174H624" class="edge"/><path d="M376 210H480Q488 210 488 218V314Q488 322 496 322H624" class="edge"/><path d="M376 246H432Q440 246 440 254V438Q440 446 448 446H624" class="edge"/><rect data-node="输入：3 位唯一客户" x="32" y="144" width="344" height="132" rx="6" class="info"/><text x="52" y="180" class="n">输入：3 位唯一客户</text><text x="52" y="212" class="s">每行代表1位客户</text><text x="52" y="240" class="s">重复行会被重复计数</text><rect data-node="按来源" x="624" y="128" width="464" height="96" rx="6" class="good"/><text x="644" y="164" class="n">按来源</text><text x="644" y="196" class="s">官网 2 + 展会 1 = 3</text><rect data-node="按城市" x="624" y="272" width="464" height="96" rx="6" class="good"/><text x="644" y="308" class="n">按城市</text><text x="644" y="340" class="s">上海 2 + 杭州 1 = 3</text><rect data-node="按负责人：张三 2 + 李四 1" x="624" y="416" width="464" height="80" rx="6" class="node"/><text x="644" y="452" class="n">按负责人：张三 2 + 李四 1</text></svg>
