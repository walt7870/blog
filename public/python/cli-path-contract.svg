<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="440" viewBox="0 0 1120 440" role="img" aria-labelledby="cli-path-contract-title cli-path-contract-desc"><title id="cli-path-contract-title">参数决定本次路径，规则留在程序里</title><desc id="cli-path-contract-desc">本例相对路径以终端当前目录为准，输出与原件必须分开。</desc><defs><marker id="cli-path-contract-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#607568"/></marker><style>text{font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;fill:#253c30;letter-spacing:0}.h{font-size:28px;font-weight:600}.n{font-size:21px;font-weight:600}.s{font-size:18px;fill:#52685b}.node{fill:#fff;stroke:#a6b9ad;stroke-width:1.5}.good{fill:#e9f4ee;stroke:#397657;stroke-width:1.5}.info{fill:#edf3fb;stroke:#739bbf;stroke-width:1.5}.warn{fill:#f8eef1;stroke:#ae7789;stroke-width:1.5}.edge{fill:none;stroke:#607568;stroke-width:2;marker-end:url(#cli-path-contract-arrow)}.dashed{stroke-dasharray:6 5}</style></defs><rect width="1120" height="440" fill="white"/><text x="32" y="44" class="h">参数决定本次路径，规则留在程序里</text><text x="32" y="82" class="s">本例相对路径以终端当前目录为准，输出与原件必须分开。</text><path d="M272 216H304" class="edge"/><path d="M544 216H576" class="edge"/><path d="M816 216H848" class="edge"/><rect data-node="解析参数" x="32" y="144" width="240" height="144" rx="6" class="node"/><text x="52" y="180" class="n">解析参数</text><text x="52" y="212" class="s">--input / --output</text><text x="52" y="240" class="s">--help不读数据</text><rect data-node="校验路径" x="304" y="144" width="240" height="144" rx="6" class="node"/><text x="324" y="180" class="n">校验路径</text><text x="324" y="212" class="s">拒绝相同实际文件</text><text x="324" y="240" class="s">解析符号与硬链接</text><rect data-node="读取与检查" x="576" y="144" width="240" height="144" rx="6" class="node"/><text x="596" y="180" class="n">读取与检查</text><text x="596" y="212" class="s">先检查表头</text><text x="596" y="240" class="s">只查空手机号</text><rect data-node="写结果" x="848" y="144" width="240" height="144" rx="6" class="good"/><text x="868" y="180" class="n">写结果</text><text x="868" y="212" class="s">默认x：不覆盖</text><text x="868" y="240" class="s">--overwrite显式替换</text><text x="32" y="392" class="s">输入三位客户得到韩梅梅一行；城市检查并未实现在这份参数版工具中。</text></svg>
