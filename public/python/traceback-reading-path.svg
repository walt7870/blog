<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="440" viewBox="0 0 1120 440" role="img" aria-labelledby="traceback-reading-path-title traceback-reading-path-desc"><title id="traceback-reading-path-title">错误阅读从异常类型回到输入合同</title><desc id="traceback-reading-path-desc">失败代码行是定位入口，根因可能是上游数据格式与约定不一致。</desc><defs><marker id="traceback-reading-path-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#607568"/></marker><style>text{font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;fill:#253c30;letter-spacing:0}.h{font-size:28px;font-weight:600}.n{font-size:21px;font-weight:600}.s{font-size:18px;fill:#52685b}.node{fill:#fff;stroke:#a6b9ad;stroke-width:1.5}.good{fill:#e9f4ee;stroke:#397657;stroke-width:1.5}.info{fill:#edf3fb;stroke:#739bbf;stroke-width:1.5}.warn{fill:#f8eef1;stroke:#ae7789;stroke-width:1.5}.edge{fill:none;stroke:#607568;stroke-width:2;marker-end:url(#traceback-reading-path-arrow)}.dashed{stroke-dasharray:6 5}</style></defs><rect width="1120" height="440" fill="white"/><text x="32" y="44" class="h">错误阅读从异常类型回到输入合同</text><text x="32" y="82" class="s">失败代码行是定位入口，根因可能是上游数据格式与约定不一致。</text><path d="M272 216H304" class="edge"/><path d="M544 216H576" class="edge"/><path d="M816 216H848" class="edge"/><rect data-node="看最后一行" x="32" y="144" width="240" height="144" rx="6" class="node"/><text x="52" y="180" class="n">看最后一行</text><text x="52" y="212" class="s">ValueError</text><text x="52" y="240" class="s">不能转成整数</text><rect data-node="找业务代码帧" x="304" y="144" width="240" height="144" rx="6" class="node"/><text x="324" y="180" class="n">找业务代码帧</text><text x="324" y="212" class="s">order_check.py</text><text x="324" y="240" class="s">amount = int(text)</text><rect data-node="核对原始输入" x="576" y="144" width="240" height="144" rx="6" class="node"/><text x="596" y="180" class="n">核对原始输入</text><text x="596" y="212" class="s">&quot;500元&quot; 而非 &quot;500&quot;</text><text x="596" y="240" class="s">是否允许附加单位</text><rect data-node="最小复现验证" x="848" y="144" width="240" height="144" rx="6" class="good"/><text x="868" y="180" class="n">最小复现验证</text><text x="868" y="212" class="s">单条输入重现</text><text x="868" y="240" class="s">修正规则后再回归</text><text x="32" y="392" class="s">异常链要读前后两段；记录命令、行号和类型，分享前去除客户数据与凭证。</text></svg>
