<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="440" viewBox="0 0 1120 440" role="img" aria-labelledby="function-rule-contract-title function-rule-contract-desc"><title id="function-rule-contract-title">规则函数返回判断，调用方决定结果去向</title><desc id="function-rule-contract-desc">同一函数可用于名单筛选与日报，不把文件读写混进单条规则。</desc><defs><marker id="function-rule-contract-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#607568"/></marker><style>text{font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;fill:#253c30;letter-spacing:0}.h{font-size:28px;font-weight:600}.n{font-size:21px;font-weight:600}.s{font-size:18px;fill:#52685b}.node{fill:#fff;stroke:#a6b9ad;stroke-width:1.5}.good{fill:#e9f4ee;stroke:#397657;stroke-width:1.5}.info{fill:#edf3fb;stroke:#739bbf;stroke-width:1.5}.warn{fill:#f8eef1;stroke:#ae7789;stroke-width:1.5}.edge{fill:none;stroke:#607568;stroke-width:2;marker-end:url(#function-rule-contract-arrow)}.dashed{stroke-dasharray:6 5}</style></defs><rect width="1120" height="440" fill="white"/><text x="32" y="44" class="h">规则函数返回判断，调用方决定结果去向</text><text x="32" y="82" class="s">同一函数可用于名单筛选与日报，不把文件读写混进单条规则。</text><path d="M272 216H304" class="edge"/><path d="M544 216H576" class="edge"/><path d="M816 216H848" class="edge"/><rect data-node="输入记录" x="32" y="144" width="240" height="144" rx="6" class="node"/><text x="52" y="180" class="n">输入记录</text><text x="52" y="212" class="s">姓名、手机号</text><text x="52" y="240" class="s">联系天数已校验</text><rect data-node="纯规则函数" x="304" y="144" width="240" height="144" rx="6" class="node"/><text x="324" y="180" class="n">纯规则函数</text><text x="324" y="212" class="s">is_incomplete</text><text x="324" y="240" class="s">need_followup</text><rect data-node="明确返回值" x="576" y="144" width="240" height="144" rx="6" class="node"/><text x="596" y="180" class="n">明确返回值</text><text x="596" y="212" class="s">True / False</text><text x="596" y="240" class="s">不修改原始记录</text><rect data-node="调用方组织" x="848" y="144" width="240" height="144" rx="6" class="good"/><text x="868" y="180" class="n">调用方组织</text><text x="868" y="212" class="s">筛选异常名单</text><text x="868" y="240" class="s">统计或格式化展示</text><text x="32" y="392" class="s">print 只展示文本，不等于 return；缺少联系天数不能默认成刚联系过。</text></svg>
