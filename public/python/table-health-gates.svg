<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="440" viewBox="0 0 1120 440" role="img" aria-labelledby="table-health-gates-title table-health-gates-desc"><title id="table-health-gates-title">字段映射在前，空值与疑似重复检查在后</title><desc id="table-health-gates-desc">表头名称对齐不代表数据正确；重复键需要结合业务确认。</desc><defs><marker id="table-health-gates-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#607568"/></marker><style>text{font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;fill:#253c30;letter-spacing:0}.h{font-size:28px;font-weight:600}.n{font-size:21px;font-weight:600}.s{font-size:18px;fill:#52685b}.node{fill:#fff;stroke:#a6b9ad;stroke-width:1.5}.good{fill:#e9f4ee;stroke:#397657;stroke-width:1.5}.info{fill:#edf3fb;stroke:#739bbf;stroke-width:1.5}.warn{fill:#f8eef1;stroke:#ae7789;stroke-width:1.5}.edge{fill:none;stroke:#607568;stroke-width:2;marker-end:url(#table-health-gates-arrow)}.dashed{stroke-dasharray:6 5}</style></defs><rect width="1120" height="440" fill="white"/><text x="32" y="44" class="h">字段映射在前，空值与疑似重复检查在后</text><text x="32" y="82" class="s">表头名称对齐不代表数据正确；重复键需要结合业务确认。</text><path d="M272 216H304" class="edge"/><path d="M544 216H576" class="edge"/><path d="M816 216H848" class="edge"/><rect data-node="外部行数据" x="32" y="144" width="240" height="144" rx="6" class="node"/><text x="52" y="180" class="n">外部行数据</text><text x="52" y="212" class="s">姓名 / 电话 / 城市</text><text x="52" y="240" class="s">CSV或xlsx读取器</text><rect data-node="检查并映射" x="304" y="144" width="240" height="144" rx="6" class="node"/><text x="324" y="180" class="n">检查并映射</text><text x="324" y="212" class="s">姓名 → name</text><text x="324" y="240" class="s">电话 → phone</text><rect data-node="记录质量检查" x="576" y="144" width="240" height="144" rx="6" class="node"/><text x="596" y="180" class="n">记录质量检查</text><text x="596" y="212" class="s">空手机号：1行</text><text x="596" y="240" class="s">疑似重复：1行</text><rect data-node="核对清单" x="848" y="144" width="240" height="144" rx="6" class="good"/><text x="868" y="180" class="n">核对清单</text><text x="868" y="212" class="s">保留记录和原因</text><text x="868" y="240" class="s">不自动删除客户</text><text x="32" y="392" class="s">本例用姓名+电话标记疑似重复；正式客户身份应优先用稳定客户编号。</text></svg>
