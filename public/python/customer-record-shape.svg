<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="540" viewBox="0 0 1120 540" role="img" aria-labelledby="customer-record-shape-title customer-record-shape-desc"><title id="customer-record-shape-title">一张客户表，对应客户字典的列表</title><desc id="customer-record-shape-desc">列名变成字段键，行变成一条记录；列表索引表示位置，不是客户身份。</desc><defs><marker id="customer-record-shape-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#607568"/></marker><style>text{font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;fill:#253c30;letter-spacing:0}.h{font-size:28px;font-weight:600}.n{font-size:21px;font-weight:600}.s{font-size:18px;fill:#52685b}.node{fill:#fff;stroke:#a6b9ad;stroke-width:1.5}.good{fill:#e9f4ee;stroke:#397657;stroke-width:1.5}.info{fill:#edf3fb;stroke:#739bbf;stroke-width:1.5}.warn{fill:#f8eef1;stroke:#ae7789;stroke-width:1.5}.edge{fill:none;stroke:#607568;stroke-width:2;marker-end:url(#customer-record-shape-arrow)}.dashed{stroke-dasharray:6 5}</style></defs><rect width="1120" height="540" fill="white"/><text x="32" y="44" class="h">一张客户表，对应客户字典的列表</text><text x="32" y="82" class="s">列名变成字段键，行变成一条记录；列表索引表示位置，不是客户身份。</text><path d="M332 190H432" class="edge"/><path d="M332 350H432" class="edge"/><rect data-node="表格第 1 行" x="32" y="138" width="300" height="116" rx="6" class="node"/><text x="52" y="174" class="n">表格第 1 行</text><text x="52" y="206" class="s">李雷｜138…｜上海</text><rect data-node="表格第 2 行" x="32" y="298" width="300" height="116" rx="6" class="node"/><text x="52" y="334" class="n">表格第 2 行</text><text x="52" y="366" class="s">韩梅梅｜空｜杭州</text><rect data-node="customers[0]：dict" x="432" y="138" width="656" height="116" rx="6" class="good"/><text x="452" y="174" class="n">customers[0]：dict</text><text x="452" y="206" class="s">name → 李雷　phone → &quot;138…&quot;　city → 上海</text><rect data-node="customers[1]：dict" x="432" y="298" width="656" height="116" rx="6" class="good"/><text x="452" y="334" class="n">customers[1]：dict</text><text x="452" y="366" class="s">name → 韩梅梅　phone → &quot;&quot;　city → 杭州</text><text x="32" y="462" class="s">customers 是 list；一行字典中的 name、phone、city 是字段名。</text><text x="32" y="492" class="s">对账按记录数；稳定身份应使用客户编号，不能依赖当前排序后的索引。</text></svg>
