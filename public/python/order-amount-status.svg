<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="520" viewBox="0 0 1120 520" role="img" aria-labelledby="order-amount-status-title order-amount-status-desc"><title id="order-amount-status-title">同一个金额字段，必须先定义业务含义</title><desc id="order-amount-status-desc">本例 amount 为净实收：收款减已完成退款；限无赠品且已完成对账的快照。</desc><defs><marker id="order-amount-status-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#607568"/></marker><style>text{font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;fill:#253c30;letter-spacing:0}.h{font-size:28px;font-weight:600}.n{font-size:21px;font-weight:600}.s{font-size:18px;fill:#52685b}.node{fill:#fff;stroke:#a6b9ad;stroke-width:1.5}.good{fill:#e9f4ee;stroke:#397657;stroke-width:1.5}.info{fill:#edf3fb;stroke:#739bbf;stroke-width:1.5}.warn{fill:#f8eef1;stroke:#ae7789;stroke-width:1.5}.edge{fill:none;stroke:#607568;stroke-width:2;marker-end:url(#order-amount-status-arrow)}.dashed{stroke-dasharray:6 5}</style></defs><rect width="1120" height="520" fill="white"/><text x="32" y="44" class="h">同一个金额字段，必须先定义业务含义</text><text x="32" y="82" class="s">本例 amount 为净实收：收款减已完成退款；限无赠品且已完成对账的快照。</text><rect data-node="净实收 ≠ 商品原价 ≠ 应付金额" x="32" y="132" width="1056" height="80" rx="6" class="info"/><text x="52" y="168" class="n">净实收 ≠ 商品原价 ≠ 应付金额</text><rect data-node="paid" x="32" y="256" width="320" height="120" rx="6" class="good"/><text x="52" y="292" class="n">paid</text><text x="52" y="324" class="s">净实收应 &gt; 0</text><text x="52" y="352" class="s">0或负数：待核对</text><rect data-node="cancelled" x="400" y="256" width="320" height="120" rx="6" class="warn"/><text x="420" y="292" class="n">cancelled</text><text x="420" y="324" class="s">净实收应 = 0</text><text x="420" y="352" class="s">正实收：核对退款</text><rect data-node="未知状态" x="768" y="256" width="320" height="120" rx="6" class="warn"/><text x="788" y="292" class="n">未知状态</text><text x="788" y="324" class="s">加入异常清单</text><text x="788" y="352" class="s">不静默排除</text><text x="32" y="442" class="s">取消订单可以保留商品原价；退款处理中也不代表已经退净，需结合时点与退款状态。</text><text x="32" y="472" class="s">规则仅生成核对项，不自动改订单、不自动发退款。</text></svg>
