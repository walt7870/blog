<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="520" viewBox="0 0 1120 520" role="img" aria-labelledby="batch-classification-title batch-classification-desc"><title id="batch-classification-title">循环让每条输入恰好进入一个分类</title><desc id="batch-classification-desc">计数器和结果列表在循环外初始化；本例没有静默跳过的记录。</desc><defs><marker id="batch-classification-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#607568"/></marker><style>text{font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;fill:#253c30;letter-spacing:0}.h{font-size:28px;font-weight:600}.n{font-size:21px;font-weight:600}.s{font-size:18px;fill:#52685b}.node{fill:#fff;stroke:#a6b9ad;stroke-width:1.5}.good{fill:#e9f4ee;stroke:#397657;stroke-width:1.5}.info{fill:#edf3fb;stroke:#739bbf;stroke-width:1.5}.warn{fill:#f8eef1;stroke:#ae7789;stroke-width:1.5}.edge{fill:none;stroke:#607568;stroke-width:2;marker-end:url(#batch-classification-arrow)}.dashed{stroke-dasharray:6 5}</style></defs><rect width="1120" height="520" fill="white"/><text x="32" y="44" class="h">循环让每条输入恰好进入一个分类</text><text x="32" y="82" class="s">计数器和结果列表在循环外初始化；本例没有静默跳过的记录。</text><path d="M364 180H708" class="edge"/><path d="M364 220H492Q500 220 500 228V346Q500 354 508 354H708" class="edge"/><rect data-node="逐条检查客户" x="32" y="140" width="332" height="112" rx="6" class="info"/><text x="52" y="176" class="n">逐条检查客户</text><text x="52" y="208" class="s">手机号和城市都存在？</text><rect data-node="完整：complete_count += 1" x="708" y="128" width="380" height="116" rx="6" class="good"/><text x="728" y="164" class="n">完整：complete_count += 1</text><text x="728" y="196" class="s">示例：李雷 1 位</text><rect data-node="待补：incomplete.append(row)" x="708" y="296" width="380" height="116" rx="6" class="warn"/><text x="728" y="332" class="n">待补：incomplete.append(row)</text><text x="728" y="364" class="s">示例：韩梅梅、王芳、赵强</text><rect x="432" y="144" width="34" height="30" fill="#fff"/><text x="440" y="166" class="s">是</text><rect x="524" y="318" width="34" height="30" fill="#fff"/><text x="532" y="340" class="s">否</text><text x="32" y="472" class="s">结束对账：输入 4 位 = 完整 1 位 + 待补 3 位。</text></svg>
