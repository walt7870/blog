<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="440" viewBox="0 0 1120 440" role="img" aria-labelledby="json-response-contract-title json-response-contract-desc"><title id="json-response-contract-title">JSON 语法成功，不代表客户响应合同成立</title><desc id="json-response-contract-desc">显式校验成功状态、对象与数组，避免接口变更被误判为空数据。</desc><defs><marker id="json-response-contract-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#607568"/></marker><style>text{font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;fill:#253c30;letter-spacing:0}.h{font-size:28px;font-weight:600}.n{font-size:21px;font-weight:600}.s{font-size:18px;fill:#52685b}.node{fill:#fff;stroke:#a6b9ad;stroke-width:1.5}.good{fill:#e9f4ee;stroke:#397657;stroke-width:1.5}.info{fill:#edf3fb;stroke:#739bbf;stroke-width:1.5}.warn{fill:#f8eef1;stroke:#ae7789;stroke-width:1.5}.edge{fill:none;stroke:#607568;stroke-width:2;marker-end:url(#json-response-contract-arrow)}.dashed{stroke-dasharray:6 5}</style></defs><rect width="1120" height="440" fill="white"/><text x="32" y="44" class="h">JSON 语法成功，不代表客户响应合同成立</text><text x="32" y="82" class="s">显式校验成功状态、对象与数组，避免接口变更被误判为空数据。</text><path d="M272 216H304" class="edge"/><path d="M544 216H576" class="edge"/><path d="M816 216H848" class="edge"/><rect data-node="JSON 文本" x="32" y="144" width="240" height="144" rx="6" class="node"/><text x="52" y="180" class="n">JSON 文本</text><text x="52" y="212" class="s">json.loads</text><text x="52" y="240" class="s">格式错则解析失败</text><rect data-node="顶层成功对象" x="304" y="144" width="240" height="144" rx="6" class="node"/><text x="324" y="180" class="n">顶层成功对象</text><text x="324" y="212" class="s">dict 且 status=ok</text><text x="324" y="240" class="s">失败响应停止处理</text><rect data-node="data.customers" x="576" y="144" width="240" height="144" rx="6" class="node"/><text x="596" y="180" class="n">data.customers</text><text x="596" y="212" class="s">data 必须是对象</text><text x="596" y="240" class="s">customers 必须是数组</text><rect data-node="客户记录" x="848" y="144" width="240" height="144" rx="6" class="good"/><text x="868" y="180" class="n">客户记录</text><text x="868" y="212" class="s">逐项校验文本姓名</text><text x="868" y="240" class="s">再做手机号检查</text><text x="32" y="392" class="s">customers=[] 可以是正常零客户；字段缺失、null 或对象都不等同于空数组。</text></svg>
