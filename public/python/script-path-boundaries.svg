<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="540" viewBox="0 0 1120 540" role="img" aria-labelledby="script-path-boundaries-title script-path-boundaries-desc"><title id="script-path-boundaries-title">相对路径的起点，决定程序寻找哪份文件</title><desc id="script-path-boundaries-desc">同一命令从不同目录运行时，工作目录可变；脚本目录由脚本文件位置确定。</desc><defs><marker id="script-path-boundaries-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#607568"/></marker><style>text{font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;fill:#253c30;letter-spacing:0}.h{font-size:28px;font-weight:600}.n{font-size:21px;font-weight:600}.s{font-size:18px;fill:#52685b}.node{fill:#fff;stroke:#a6b9ad;stroke-width:1.5}.good{fill:#e9f4ee;stroke:#397657;stroke-width:1.5}.info{fill:#edf3fb;stroke:#739bbf;stroke-width:1.5}.warn{fill:#f8eef1;stroke:#ae7789;stroke-width:1.5}.edge{fill:none;stroke:#607568;stroke-width:2;marker-end:url(#script-path-boundaries-arrow)}.dashed{stroke-dasharray:6 5}</style></defs><rect width="1120" height="540" fill="white"/><text x="32" y="44" class="h">相对路径的起点，决定程序寻找哪份文件</text><text x="32" y="82" class="s">同一命令从不同目录运行时，工作目录可变；脚本目录由脚本文件位置确定。</text><path d="M416 194H568" class="edge"/><path d="M416 362H568" class="edge"/><rect data-node="Path(&quot;customers.csv&quot;)" x="32" y="138" width="384" height="116" rx="6" class="node"/><text x="52" y="174" class="n">Path(&quot;customers.csv&quot;)</text><text x="52" y="206" class="s">起点：Path.cwd()</text><rect data-node="终端在 /tmp 运行" x="568" y="138" width="520" height="116" rx="6" class="info"/><text x="588" y="174" class="n">终端在 /tmp 运行</text><text x="588" y="206" class="s">寻找 /tmp/customers.csv</text><rect data-node="Path(__file__).resolve().parent" x="32" y="306" width="384" height="116" rx="6" class="node"/><text x="52" y="342" class="n">Path(__file__).resolve().parent</text><text x="52" y="374" class="s">起点：脚本所在目录</text><rect data-node="脚本位于 /work/tool/" x="568" y="306" width="520" height="116" rx="6" class="good"/><text x="588" y="342" class="n">脚本位于 /work/tool/</text><text x="588" y="374" class="s">寻找 /work/tool/customers.csv</text><text x="32" y="462" class="s">示例命令：python3 /work/tool/hello_customer.py</text><text x="32" y="492" class="s">解释器路径是另一个维度；先确认由哪个 Python 运行，再核对数据路径。</text></svg>
