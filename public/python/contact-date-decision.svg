<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="552" viewBox="0 0 1120 552" role="img" aria-labelledby="contact-date-decision-title contact-date-decision-desc"><title id="contact-date-decision-title">联系日期要区分缺失、非法、未来与正常日期</title><desc id="contact-date-decision-desc">业务日期固定为 2026-08-02；本课按自然日计算，不按精确 24 小时计算。</desc><defs><marker id="contact-date-decision-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#607568"/></marker><style>text{font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;fill:#253c30;letter-spacing:0}.h{font-size:28px;font-weight:600}.n{font-size:21px;font-weight:600}.s{font-size:18px;fill:#52685b}.node{fill:#fff;stroke:#a6b9ad;stroke-width:1.5}.good{fill:#e9f4ee;stroke:#397657;stroke-width:1.5}.info{fill:#edf3fb;stroke:#739bbf;stroke-width:1.5}.warn{fill:#f8eef1;stroke:#ae7789;stroke-width:1.5}.edge{fill:none;stroke:#607568;stroke-width:2;marker-end:url(#contact-date-decision-arrow)}.dashed{stroke-dasharray:6 5}</style></defs><rect width="1120" height="552" fill="white"/><text x="32" y="44" class="h">联系日期要区分缺失、非法、未来与正常日期</text><text x="32" y="82" class="s">业务日期固定为 2026-08-02；本课按自然日计算，不按精确 24 小时计算。</text><path d="M324 190H408" class="edge"/><path d="M324 230V384Q324 392 332 392H408" class="edge"/><path d="M688 190H792" class="edge"/><path d="M688 230V384Q688 392 696 392H792" class="edge"/><rect data-node="日期原始文本" x="32" y="144" width="292" height="116" rx="6" class="info"/><text x="52" y="180" class="n">日期原始文本</text><text x="52" y="212" class="s">先确认类型和格式</text><rect data-node="解析为 date" x="408" y="144" width="280" height="116" rx="6" class="node"/><text x="428" y="180" class="n">解析为 date</text><text x="428" y="212" class="s">计算 today - contact</text><rect data-node="不参与天数统计" x="408" y="336" width="280" height="116" rx="6" class="warn"/><text x="428" y="372" class="n">不参与天数统计</text><text x="428" y="404" class="s">缺失或解析失败</text><rect data-node="天数 ≥ 0" x="792" y="144" width="296" height="116" rx="6" class="good"/><text x="812" y="180" class="n">天数 ≥ 0</text><text x="812" y="212" class="s">&gt;14：超期</text><text x="812" y="240" class="s">0…14：正常</text><rect data-node="天数 &lt; 0" x="792" y="336" width="296" height="116" rx="6" class="warn"/><text x="812" y="372" class="n">天数 &lt; 0</text><text x="812" y="404" class="s">未来日期：需要核对</text><rect x="332" y="154" width="52" height="30" fill="#fff"/><text x="340" y="176" class="s">有效</text><rect x="136" y="346" width="142" height="30" fill="#fff"/><text x="144" y="368" class="s">无效 / 空白</text><rect x="700" y="154" width="52" height="30" fill="#fff"/><text x="708" y="176" class="s">非负</text><rect x="700" y="346" width="52" height="30" fill="#fff"/><text x="708" y="368" class="s">负数</text><text x="32" y="504" class="s">边界：7月19日为14天，7月18日为15天；8月3日不能当成联系正常。</text></svg>
