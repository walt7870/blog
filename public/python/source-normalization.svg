<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="440" viewBox="0 0 1120 440" role="img" aria-labelledby="source-normalization-title source-normalization-desc"><title id="source-normalization-title">清洗来源时，保留原值与标准分类</title><desc id="source-normalization-desc">只应用明确约定的归并规则，未知值和空值分开处理。</desc><defs><marker id="source-normalization-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#607568"/></marker><style>text{font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;fill:#253c30;letter-spacing:0}.h{font-size:28px;font-weight:600}.n{font-size:21px;font-weight:600}.s{font-size:18px;fill:#52685b}.node{fill:#fff;stroke:#a6b9ad;stroke-width:1.5}.good{fill:#e9f4ee;stroke:#397657;stroke-width:1.5}.info{fill:#edf3fb;stroke:#739bbf;stroke-width:1.5}.warn{fill:#f8eef1;stroke:#ae7789;stroke-width:1.5}.edge{fill:none;stroke:#607568;stroke-width:2;marker-end:url(#source-normalization-arrow)}.dashed{stroke-dasharray:6 5}</style></defs><rect width="1120" height="440" fill="white"/><text x="32" y="44" class="h">清洗来源时，保留原值与标准分类</text><text x="32" y="82" class="s">只应用明确约定的归并规则，未知值和空值分开处理。</text><path d="M272 216H304" class="edge"/><path d="M544 216H576" class="edge"/><path d="M816 216H848" class="edge"/><rect data-node="原始值" x="32" y="144" width="240" height="144" rx="6" class="node"/><text x="52" y="180" class="n">原始值</text><text x="52" y="212" class="s">&quot; Web &quot;</text><text x="52" y="240" class="s">&quot;展会-上海&quot;</text><rect data-node="基础清洗" x="304" y="144" width="240" height="144" rx="6" class="node"/><text x="324" y="180" class="n">基础清洗</text><text x="324" y="212" class="s">strip → lower</text><text x="324" y="240" class="s">只认展会-前缀</text><rect data-node="别名映射" x="576" y="144" width="240" height="144" rx="6" class="node"/><text x="596" y="180" class="n">别名映射</text><text x="596" y="212" class="s">web → 官网</text><text x="596" y="240" class="s">展会-上海 → 展会</text><rect data-node="标准值与原值" x="848" y="144" width="240" height="144" rx="6" class="good"/><text x="868" y="180" class="n">标准值与原值</text><text x="868" y="212" class="s">未知 → 其他</text><text x="868" y="240" class="s">空白 → 来源待补</text><text x="32" y="392" class="s">不要删除所有中间空格和横线；活动编号或客户名称中可能包含有意义的字符。</text></svg>
