<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="516" viewBox="0 0 1120 516" role="img" aria-labelledby="venv-interpreter-contract-title venv-interpreter-contract-desc"><title id="venv-interpreter-contract-title">安装包和运行工具，使用同一个项目解释器</title><desc id="venv-interpreter-contract-desc">venv 隔离 Python 包目录，不会固定操作系统、驱动或系统动态库。</desc><defs><marker id="venv-interpreter-contract-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#607568"/></marker><style>text{font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;fill:#253c30;letter-spacing:0}.h{font-size:28px;font-weight:600}.n{font-size:21px;font-weight:600}.s{font-size:18px;fill:#52685b}.node{fill:#fff;stroke:#a6b9ad;stroke-width:1.5}.good{fill:#e9f4ee;stroke:#397657;stroke-width:1.5}.info{fill:#edf3fb;stroke:#739bbf;stroke-width:1.5}.warn{fill:#f8eef1;stroke:#ae7789;stroke-width:1.5}.edge{fill:none;stroke:#607568;stroke-width:2;marker-end:url(#venv-interpreter-contract-arrow)}.dashed{stroke-dasharray:6 5}</style></defs><rect width="1120" height="516" fill="white"/><text x="32" y="44" class="h">安装包和运行工具，使用同一个项目解释器</text><text x="32" y="82" class="s">venv 隔离 Python 包目录，不会固定操作系统、驱动或系统动态库。</text><path d="M344 192H448" class="edge"/><path d="M720 176H816" class="edge"/><path d="M720 216H760Q768 216 768 224V372Q768 380 776 380H816" class="edge"/><rect data-node="已安装的 Python" x="32" y="140" width="312" height="112" rx="6" class="node"/><text x="52" y="176" class="n">已安装的 Python</text><text x="52" y="208" class="s">python3 -m venv .venv</text><rect data-node="项目 .venv" x="448" y="132" width="272" height="128" rx="6" class="info"/><text x="468" y="168" class="n">项目 .venv</text><text x="468" y="200" class="s">独立包目录</text><text x="468" y="228" class="s">记录Python版本</text><rect data-node="安装依赖" x="816" y="124" width="272" height="116" rx="6" class="node"/><text x="836" y="160" class="n">安装依赖</text><text x="836" y="192" class="s">环境Python -m pip</text><text x="836" y="220" class="s">只安装第三方依赖</text><rect data-node="运行入口" x="816" y="324" width="272" height="116" rx="6" class="good"/><text x="836" y="360" class="n">运行入口</text><text x="836" y="392" class="s">环境Python run.py</text><text x="836" y="420" class="s">输出路径检查</text><text x="32" y="468" class="s">标准库csv、json、logging不需要pip安装；跨电脑交付环境说明，不直接复制.venv。</text></svg>
