<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="496" viewBox="0 0 1120 496" role="img" aria-labelledby="module-dependency-title module-dependency-desc"><title id="module-dependency-title">入口组织任务，规则与展示分别负责自己的边界</title><desc id="module-dependency-desc">这是依赖树：main 导入两个模块；checks 和 report 不导入 main。</desc><defs><marker id="module-dependency-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#607568"/></marker><style>text{font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;fill:#253c30;letter-spacing:0}.h{font-size:28px;font-weight:600}.n{font-size:21px;font-weight:600}.s{font-size:18px;fill:#52685b}.node{fill:#fff;stroke:#a6b9ad;stroke-width:1.5}.good{fill:#e9f4ee;stroke:#397657;stroke-width:1.5}.info{fill:#edf3fb;stroke:#739bbf;stroke-width:1.5}.warn{fill:#f8eef1;stroke:#ae7789;stroke-width:1.5}.edge{fill:none;stroke:#607568;stroke-width:2;marker-end:url(#module-dependency-arrow)}.dashed{stroke-dasharray:6 5}</style></defs><rect width="1120" height="496" fill="white"/><text x="32" y="44" class="h">入口组织任务，规则与展示分别负责自己的边界</text><text x="32" y="82" class="s">这是依赖树：main 导入两个模块；checks 和 report 不导入 main。</text><path d="M480 232V272Q480 280 472 280H296Q288 280 288 288V328" class="edge"/><path d="M640 232V272Q640 280 648 280H824Q832 280 832 288V328" class="edge"/><rect data-node="main.py" x="376" y="124" width="368" height="108" rx="6" class="info"/><text x="396" y="160" class="n">main.py</text><text x="396" y="192" class="s">筛选后调用展示函数</text><rect data-node="checks.py" x="64" y="328" width="448" height="112" rx="6" class="good"/><text x="84" y="364" class="n">checks.py</text><text x="84" y="396" class="s">missing_phone：返回布尔值</text><rect data-node="report.py" x="608" y="328" width="448" height="112" rx="6" class="node"/><text x="628" y="364" class="n">report.py</text><text x="628" y="396" class="s">print_missing：打印待补名单</text></svg>
