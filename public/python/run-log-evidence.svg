<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="440" viewBox="0 0 1120 440" role="img" aria-labelledby="run-log-evidence-title run-log-evidence-desc"><title id="run-log-evidence-title">日志把一次运行串成可追溯的记录</title><desc id="run-log-evidence-desc">不记录完整客户姓名和电话；用行号或内部编号关联异常明细。</desc><defs><marker id="run-log-evidence-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#607568"/></marker><style>text{font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;fill:#253c30;letter-spacing:0}.h{font-size:28px;font-weight:600}.n{font-size:21px;font-weight:600}.s{font-size:18px;fill:#52685b}.node{fill:#fff;stroke:#a6b9ad;stroke-width:1.5}.good{fill:#e9f4ee;stroke:#397657;stroke-width:1.5}.info{fill:#edf3fb;stroke:#739bbf;stroke-width:1.5}.warn{fill:#f8eef1;stroke:#ae7789;stroke-width:1.5}.edge{fill:none;stroke:#607568;stroke-width:2;marker-end:url(#run-log-evidence-arrow)}.dashed{stroke-dasharray:6 5}</style></defs><rect width="1120" height="440" fill="white"/><text x="32" y="44" class="h">日志把一次运行串成可追溯的记录</text><text x="32" y="82" class="s">不记录完整客户姓名和电话；用行号或内部编号关联异常明细。</text><path d="M272 216H304" class="edge"/><path d="M544 216H576" class="edge"/><path d="M816 216H848" class="edge"/><rect data-node="INFO 开始" x="32" y="144" width="240" height="144" rx="6" class="node"/><text x="52" y="180" class="n">INFO 开始</text><text x="52" y="212" class="s">输入记录数：2</text><text x="52" y="240" class="s">时间与运行批次</text><rect data-node="INFO 成功" x="304" y="144" width="240" height="144" rx="6" class="node"/><text x="324" y="180" class="n">INFO 成功</text><text x="324" y="212" class="s">行号1处理完成</text><text x="324" y="240" class="s">累计成功：1</text><rect data-node="WARNING 跳过" x="576" y="144" width="240" height="144" rx="6" class="node"/><text x="596" y="180" class="n">WARNING 跳过</text><text x="596" y="212" class="s">行号2缺姓名</text><text x="596" y="240" class="s">累计跳过：1</text><rect data-node="INFO 批次结束" x="848" y="144" width="240" height="144" rx="6" class="good"/><text x="868" y="180" class="n">INFO 批次结束</text><text x="868" y="212" class="s">成功1 + 跳过1 = 2</text><text x="868" y="240" class="s">输出或失败去向</text><text x="32" y="392" class="s">ERROR级别不会自动返回非零退出码；整批失败仍需抛异常或明确退出。</text></svg>
