<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="520" viewBox="0 0 1120 520" role="img" aria-labelledby="row-error-boundary-title row-error-boundary-desc"><title id="row-error-boundary-title">是否继续处理，取决于错误影响的范围</title><desc id="row-error-boundary-desc">预期的行级问题记录原因；无法确认整批结果时报告失败。</desc><defs><marker id="row-error-boundary-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#607568"/></marker><style>text{font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;fill:#253c30;letter-spacing:0}.h{font-size:28px;font-weight:600}.n{font-size:21px;font-weight:600}.s{font-size:18px;fill:#52685b}.node{fill:#fff;stroke:#a6b9ad;stroke-width:1.5}.good{fill:#e9f4ee;stroke:#397657;stroke-width:1.5}.info{fill:#edf3fb;stroke:#739bbf;stroke-width:1.5}.warn{fill:#f8eef1;stroke:#ae7789;stroke-width:1.5}.edge{fill:none;stroke:#607568;stroke-width:2;marker-end:url(#row-error-boundary-arrow)}.dashed{stroke-dasharray:6 5}</style></defs><rect width="1120" height="520" fill="white"/><text x="32" y="44" class="h">是否继续处理，取决于错误影响的范围</text><text x="32" y="82" class="s">预期的行级问题记录原因；无法确认整批结果时报告失败。</text><path d="M364 180H708" class="edge"/><path d="M364 220H492Q500 220 500 228V346Q500 354 508 354H708" class="edge"/><rect data-node="遇到错误" x="32" y="140" width="332" height="112" rx="6" class="info"/><text x="52" y="176" class="n">遇到错误</text><text x="52" y="208" class="s">能归因到单条记录？</text><rect data-node="行级：记录原因，继续下一行" x="708" y="128" width="380" height="116" rx="6" class="good"/><text x="728" y="164" class="n">行级：记录原因，继续下一行</text><text x="728" y="196" class="s">非法日期、日期缺失</text><text x="728" y="224" class="s">对账成功行与失败行</text><rect data-node="批级：停止并返回失败" x="708" y="296" width="380" height="116" rx="6" class="warn"/><text x="728" y="332" class="n">批级：停止并返回失败</text><text x="728" y="364" class="s">文件读不到、整列缺失</text><text x="728" y="392" class="s">结果文件无法写入</text><rect x="432" y="144" width="34" height="30" fill="#fff"/><text x="440" y="166" class="s">是</text><rect x="524" y="318" width="88" height="30" fill="#fff"/><text x="532" y="340" class="s">影响整批</text><text x="32" y="472" class="s">只捕获已预期的异常；except: pass 会吞掉证据与编程错误。</text></svg>
