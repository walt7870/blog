<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="408" viewBox="0 0 1120 408" role="img" aria-labelledby="ep01_bottleneck_evidence_chain_title ep01_bottleneck_evidence_chain_desc"><title id="ep01_bottleneck_evidence_chain_title">用同一批任务建立可解释的证据链</title><desc id="ep01_bottleneck_evidence_chain_desc">慢在哪一段、哪个资源先满、哪个调用在等待，是三个不同的问题。</desc><defs><marker id="ep01_bottleneck_evidence_chain_arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#607568"/></marker><style>text{font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;letter-spacing:0;fill:#253c30}.h{font-size:28px;font-weight:600}.n{font-size:21px;font-weight:600}.s{font-size:18px;fill:#52685b}.node{fill:white;stroke:#a6b9ad;stroke-width:1.5}.good{fill:#e9f4ee;stroke:#397657;stroke-width:1.5}.info{fill:#edf3fb;stroke:#739bbf;stroke-width:1.5}.warn{fill:#f8eef1;stroke:#ae7789;stroke-width:1.5}.edge{fill:none;stroke:#607568;stroke-width:2;marker-end:url(#ep01_bottleneck_evidence_chain_arrow)}.dashed{stroke-dasharray:6 5}</style></defs><rect width="1120" height="408" fill="white"/><text x="32" y="44" class="h">用同一批任务建立可解释的证据链</text><text x="32" y="82" class="s">慢在哪一段、哪个资源先满、哪个调用在等待，是三个不同的问题。</text><path d="M272 216H304" class="edge"/><path d="M544 216H576" class="edge"/><path d="M816 216H848" class="edge"/><rect data-node="固定基线" x="32" y="144" width="240" height="144" rx="6" class="node"/><text x="50" y="178" class="n">固定基线</text><text x="50" y="209" class="s">同输入与环境</text><text x="50" y="236" class="s">顺序 / 低并发</text><rect data-node="分段计时" x="304" y="144" width="240" height="144" rx="6" class="node"/><text x="322" y="178" class="n">分段计时</text><text x="322" y="209" class="s">扫描、转码、API</text><text x="322" y="236" class="s">成功与失败分类</text><rect data-node="资源与调用栈" x="576" y="144" width="240" height="144" rx="6" class="node"/><text x="594" y="178" class="n">资源与调用栈</text><text x="594" y="209" class="s">CPU / 当前与峰值RSS</text><text x="594" y="236" class=