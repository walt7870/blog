<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="540" viewBox="0 0 1120 540" role="img" aria-labelledby="ep12_file_checkpoint_state_title ep12_file_checkpoint_state_desc"><title id="ep12_file_checkpoint_state_title">跳过需要同时满足输入未变与完成合同</title><desc id="ep12_file_checkpoint_state_desc">本例只统计字节数；真实产物还要验证存在、摘要和对应的配置版本。</desc><defs><marker id="ep12_file_checkpoint_state_arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#607568"/></marker><style>text{font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;letter-spacing:0;fill:#253c30}.h{font-size:28px;font-weight:600}.n{font-size:21px;font-weight:600}.s{font-size:18px;fill:#52685b}.node{fill:white;stroke:#a6b9ad;stroke-width:1.5}.good{fill:#e9f4ee;stroke:#397657;stroke-width:1.5}.info{fill:#edf3fb;stroke:#739bbf;stroke-width:1.5}.warn{fill:#f8eef1;stroke:#ae7789;stroke-width:1.5}.edge{fill:none;stroke:#607568;stroke-width:2;marker-end:url(#ep12_file_checkpoint_state_arrow)}.dashed{stroke-dasharray:6 5}</style></defs><rect width="1120" height="540" fill="white"/><text x="32" y="44" class="h">跳过需要同时满足输入未变与完成合同</text><text x="32" y="82" class="s">本例只统计字节数；真实产物还要验证存在、摘要和对应的配置版本。</text><path d="M324 190H424" class="edge"/><path d="M324 232H368Q376 232 376 240V388Q376 396 384 396H424" class="edge"/><path d="M704 198H792" class="edge"/><rect data-node="发现输入" x="32" y="144" width="292" height="120" rx="6" class="info"/><text x="50" y="178" class="n">发现输入</text><text x="50" y="209" class="s">路径 + 内容SHA256</text><text x="50" y="236" class="s">与上次状态比较</text><rect data-node="新输入 / 内容变化" x="424" y="128" width="280" height="120" rx="6" class="node"/><text x="442" y="162" class="n">新输入 / 内容变化</text><text x="442" y="193" class="s">执行任务并再查摘要</text><rect data-node="done或failed" x="792" y="128" width="296" height="120" rx="6" class="good"/><text x="810" y="162" class="n">done或failed</text><text x="810" y="193" class="s">主线程提交checkpoint</text><text x="810" y="220" class="s">失败下次可重试</text><rect data-node="已有done且SHA相同 → skipped" x="424" y="336" width="664" height="120" rx="6" class="node"/><text x="442" y="370" class="n">已有done且SHA相同 → skipped</text><text x="442" y="401" class="s">跳过是本次决定，不覆盖之前done的有效输入合同</text><text x="32" y="512" class="s">状态放在扫描树之外；临时JSON先flush/fsync，再os.replace，单进程维护。</text></svg>
