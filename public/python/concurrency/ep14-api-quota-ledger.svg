<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="544" viewBox="0 0 1120 544" role="img" aria-labelledby="ep14_api_quota_ledger_title ep14_api_quota_ledger_desc"><title id="ep14_api_quota_ledger_title">执行结果与费用确认分别记账</title><desc id="ep14_api_quota_ledger_desc">请求超时只说明客户端没有确认结果，不能推断服务端没执行或没收费。</desc><defs><marker id="ep14_api_quota_ledger_arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#607568"/></marker><style>text{font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;letter-spacing:0;fill:#253c30}.h{font-size:28px;font-weight:600}.n{font-size:21px;font-weight:600}.s{font-size:18px;fill:#52685b}.node{fill:white;stroke:#a6b9ad;stroke-width:1.5}.good{fill:#e9f4ee;stroke:#397657;stroke-width:1.5}.info{fill:#edf3fb;stroke:#739bbf;stroke-width:1.5}.warn{fill:#f8eef1;stroke:#ae7789;stroke-width:1.5}.edge{fill:none;stroke:#607568;stroke-width:2;marker-end:url(#ep14_api_quota_ledger_arrow)}.dashed{stroke-dasharray:6 5}</style></defs><rect width="1120" height="544" fill="white"/><text x="32" y="44" class="h">执行结果与费用确认分别记账</text><text x="32" y="82" class="s">请求超时只说明客户端没有确认结果，不能推断服务端没执行或没收费。</text><path d="M328 208H424" class="edge"/><path d="M704 184H792" class="edge"/><path d="M704 228H736Q744 228 744 236V388Q744 396 752 396H792" class="edge"/><rect data-node="持久任务身份" x="32" y="144" width="296" height="128" rx="6" class="node"/><text x="50" y="178" class="n">持久任务身份</text><text x="50" y="209" class="s">输入摘要与配置版本</text><text x="50" y="236" class="s">提供方支持的幂等键</text><rect data-node="并发与速率门" x="424" y="144" width="280" height="128" rx="6" class="info"/><text x="442" y="178" class="n">并发与速率门</text><text x="442" y="209" class="s">pending → running</text><text x="442" y="236" class="s">调用带超时</text><rect data-node="结果已确认" x="792" y="128" width="296" height="128" rx="6" class="good"/><text x="810" y="162" class="n">结果已确认</text><text x="810" y="193" class="s">done + 提供方回执</text><text x="810" y="220" class="s">账单确认费用</text><rect data-node="结果未知 / 超时" x="792" y="336" width="296" height="128" rx="6" class="warn"/><text x="810" y="370" class="n">结果未知 / 超时</text><text x="810" y="401" class="s">执行unknown</text><text x="810" y="428" class="s">费用unknown</text><rect x="704" y="144" width="52" height="30" fill="#fff"/><text x="712" y="166" class="s">确认</text><rect x="744" y="356" width="70" height="30" fill="#fff"/><text x="752" y="378" class="s">未确认</text><text x="32" y="516" class="s">本地去重无法保证服务端不重复扣费；先查提供方请求状态，再决定是否重试。</text></svg>
