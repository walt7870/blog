<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="548" viewBox="0 0 1120 548" role="img" aria-labelledby="ep02_four_concepts_map_title ep02_four_concepts_map_desc"><title id="ep02_four_concepts_map_title">四个概念观察同一系统的不同侧面</title><desc id="ep02_four_concepts_map_desc">三个各等1秒的请求可重叠等待；三个各算1秒的任务另看执行资源。</desc><defs><marker id="ep02_four_concepts_map_arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#607568"/></marker><style>text{font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;letter-spacing:0;fill:#253c30}.h{font-size:28px;font-weight:600}.n{font-size:21px;font-weight:600}.s{font-size:18px;fill:#52685b}.node{fill:white;stroke:#a6b9ad;stroke-width:1.5}.good{fill:#e9f4ee;stroke:#397657;stroke-width:1.5}.info{fill:#edf3fb;stroke:#739bbf;stroke-width:1.5}.warn{fill:#f8eef1;stroke:#ae7789;stroke-width:1.5}.edge{fill:none;stroke:#607568;stroke-width:2;marker-end:url(#ep02_four_concepts_map_arrow)}.dashed{stroke-dasharray:6 5}</style></defs><rect width="1120" height="548" fill="white"/><text x="32" y="44" class="h">四个概念观察同一系统的不同侧面</text><text x="32" y="82" class="s">三个各等1秒的请求可重叠等待；三个各算1秒的任务另看执行资源。</text><rect data-node="并发：管理多个未完成任务" x="32" y="128" width="512" height="136" rx="6" class="info"/><text x="50" y="162" class="n">并发：管理多个未完成任务</text><text x="50" y="193" class="s">任务A等待时，推进B或C</text><text x="50" y="220" class="s">多个任务在同一时间段内存在</text><rect data-node="并行：多个执行资源同时工作" x="576" y="128" width="512" height="136" rx="6" class="node"/><text x="594" y="162" class="n">并行：多个执行资源同时工作</text><text x="594" y="193" class="s">两个CPU核心同时做特征计算</text><text x="594" y="220" class="s">默认GIL影响纯Python线程执行</text><rect data-node="异步：调用不占住等待线程" x="32" y="292" width="512" height="136" rx="6" class="node"/><text x="50" y="326" class="n">异步：调用不占住等待线程</text><text x="50" y="357" class="s">未就绪的I/O允许事件循环调度其他Task</text><text x="50" y="384" class="s">await已完成对象不一定切换</text><rect data-node="流水线：按阶段传递任务与压力" x="576" y="292" width="512" height="136" rx="6" class="node"/><text x="594" y="326" class="n">流水线：按阶段传递任务与压力</text><text x="594" y="357" class="s">转码 → 转写 → 落盘，分别限容量</text><text x="594" y="384" class="s">首份延迟与稳定吞吐分别计算</text><text x="32" y="520" class="s">这些是观察维度，不是四个互斥工具，也不是必须逐项经历的执行步骤。</text></svg>
