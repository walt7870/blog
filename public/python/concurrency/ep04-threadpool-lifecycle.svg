<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="408" viewBox="0 0 1120 408" role="img" aria-labelledby="ep04_threadpool_lifecycle_title ep04_threadpool_lifecycle_desc"><title id="ep04_threadpool_lifecycle_title">线程数与待执行窗口分别受控</title><desc id="ep04_threadpool_lifecycle_desc">示例每批最多2×worker数，按完成顺序收集，批结束后才继续读取输入。</desc><defs><marker id="ep04_threadpool_lifecycle_arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#607568"/></marker><style>text{font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;letter-spacing:0;fill:#253c30}.h{font-size:28px;font-weight:600}.n{font-size:21px;font-weight:600}.s{font-size:18px;fill:#52685b}.node{fill:white;stroke:#a6b9ad;stroke-width:1.5}.good{fill:#e9f4ee;stroke:#397657;stroke-width:1.5}.info{fill:#edf3fb;stroke:#739bbf;stroke-width:1.5}.warn{fill:#f8eef1;stroke:#ae7789;stroke-width:1.5}.edge{fill:none;stroke:#607568;stroke-width:2;marker-end:url(#ep04_threadpool_lifecycle_arrow)}.dashed{stroke-dasharray:6 5}</style></defs><rect width="1120" height="408" fill="white"/><text x="32" y="44" class="h">线程数与待执行窗口分别受控</text><text x="32" y="82" class="s">示例每批最多2×worker数，按完成顺序收集，批结束后才继续读取输入。</text><path d="M272 216H304" class="edge"/><path d="M544 216H576" class="edge"/><path d="M816 216H848" class="edge"/><rect data-node="惰性输入" x="32" y="144" width="240" height="144" rx="6" class="node"/><text x="50" y="178" class="n">惰性输入</text><text x="50" y="209" class="s">迭代读取路径</text><text x="50" y="236" class="s">保留稳定任务编号</text><rect data-node="受限提交" x="304" y="144" width="240" height="144" rx="6" class="node"/><text x="322" y="178" class="n">受限提交</text><text x="322" y="209" class="s">max_workers限执行</text><text x="322" y="236" class="s">批大小限Future数</text><rect data-node="收敛结果" x="576" y="144" width="240" height="144" rx="6" class="node"/><text x="594" y="178" class="n">收敛结果</text><text x="594" y="209" class="s">读取future.result</text><text x="594" y="236" class="s">成功和异常都归档</text><rect data-node="输出与退出" x="848" y="144" width="240" height="144" rx="6" class="good"/><text x="866" y="178" class="n">输出与退出</text><text x="866" y="209" class="s">主线程合并结果</text><text x="866" y="236" class="s">有失败则报告失败</text><text x="32" y="380" class="s">取消Future不能杀死正在运行的线程；HTTP/SDK内部仍需自己的超时。</text></svg>
