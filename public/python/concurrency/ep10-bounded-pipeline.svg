<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="536" viewBox="0 0 1120 536" role="img" aria-labelledby="ep10_bounded_pipeline_title ep10_bounded_pipeline_desc"><title id="ep10_bounded_pipeline_title">各阶段有界，失败消息直接传给writer</title><desc id="ep10_bounded_pipeline_desc">监督者等上一阶段全部worker退出后，才向下一阶段发送每worker一个STOP。</desc><defs><marker id="ep10_bounded_pipeline_arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#607568"/></marker><style>text{font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;letter-spacing:0;fill:#253c30}.h{font-size:28px;font-weight:600}.n{font-size:21px;font-weight:600}.s{font-size:18px;fill:#52685b}.node{fill:white;stroke:#a6b9ad;stroke-width:1.5}.good{fill:#e9f4ee;stroke:#397657;stroke-width:1.5}.info{fill:#edf3fb;stroke:#739bbf;stroke-width:1.5}.warn{fill:#f8eef1;stroke:#ae7789;stroke-width:1.5}.edge{fill:none;stroke:#607568;stroke-width:2;marker-end:url(#ep10_bounded_pipeline_arrow)}.dashed{stroke-dasharray:6 5}</style></defs><rect width="1120" height="536" fill="white"/><text x="32" y="44" class="h">各阶段有界，失败消息直接传给writer</text><text x="32" y="82" class="s">监督者等上一阶段全部worker退出后，才向下一阶段发送每worker一个STOP。</text><path d="M272 210H304" class="edge"/><path d="M544 210H576" class="edge"/><path d="M816 210H848" class="edge"/><rect data-node="扫描 / main" x="32" y="144" width="240" height="136" rx="6" class="node"/><text x="50" y="178" class="n">扫描 / main</text><text x="50" y="209" class="s">路径 → q1(max=3)</text><text x="50" y="236" class="s">2个转码worker</text><rect data-node="转码" x="304" y="144" width="240" height="136" rx="6" class="node"/><text x="322" y="178" class="n">转码</text><text x="322" y="209" class="s">成功 → AudioJob</text><text x="322" y="236" class="s">异常 → StageResult</text><rect data-node="q2(max=2) → ASR" x="576" y="144" width="240" height="136" rx="6" class="info"/><text x="594" y="178" class="n">q2(max=2) → ASR</text><text x="594" y="209" class="s">只处理AudioJob</text><text x="594" y="236" class="s">失败结果原样透传</text><rect data-node="q3(max=8) → writer" x="848" y="144" width="240" height="136" rx="6" class="good"/><text x="866" y="178" class="n">q3(max=8) → writer</text><text x="866" y="209" class="s">收集成功与失败</text><text x="866" y="236" class="s">按任务编号对账</text><rect data-node="停止顺序：转码全部退出 → 两个ASR各收STOP → ASR全部退出 → writer收STOP" x="32" y="344" width="1056" height="96" rx="6" class="node"/><text x="50" y="378" class="n">停止顺序：转码全部退出 → 两个ASR各收STOP → ASR全部退出 → writer收STOP</text><text x="50" y="409" class="s">不会因一个上游提前结束而丢失另一个worker的尾部结果</text><text x="32" y="508" class="s">这里只打印模拟结果；真实存储故障仍需监督者停止上游，不能让join永久等待。</text></svg>
