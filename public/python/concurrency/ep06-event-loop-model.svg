<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="552" viewBox="0 0 1120 552" role="img" aria-labelledby="ep06_event_loop_model_title ep06_event_loop_model_desc"><title id="ep06_event_loop_model_title">Task只在真正等待未完成对象时暂停</title><desc id="ep06_event_loop_model_desc">就绪队列中的Task由事件循环推进；完成的任务进入结果收集，不回到创建。</desc><defs><marker id="ep06_event_loop_model_arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#607568"/></marker><style>text{font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;letter-spacing:0;fill:#253c30}.h{font-size:28px;font-weight:600}.n{font-size:21px;font-weight:600}.s{font-size:18px;fill:#52685b}.node{fill:white;stroke:#a6b9ad;stroke-width:1.5}.good{fill:#e9f4ee;stroke:#397657;stroke-width:1.5}.info{fill:#edf3fb;stroke:#739bbf;stroke-width:1.5}.warn{fill:#f8eef1;stroke:#ae7789;stroke-width:1.5}.edge{fill:none;stroke:#607568;stroke-width:2;marker-end:url(#ep06_event_loop_model_arrow)}.dashed{stroke-dasharray:6 5}</style></defs><rect width="1120" height="552" fill="white"/><text x="32" y="44" class="h">Task只在真正等待未完成对象时暂停</text><text x="32" y="82" class="s">就绪队列中的Task由事件循环推进；完成的任务进入结果收集，不回到创建。</text><path d="M288 200H376" class="edge"/><path d="M676 178H792" class="edge"/><path d="M676 220H728Q736 220 736 228V380Q736 388 744 388H792" class="edge"/><path d="M936 256V286Q936 294 928 294H160Q152 294 152 286V256" class="edge dashed"/><rect data-node="就绪Task队列" x="32" y="136" width="256" height="120" rx="6" class="node"/><text x="50" y="170" class="n">就绪Task队列</text><text x="50" y="201" class="s">等待当前执行段结束</text><rect data-node="运行当前Task" x="376" y="136" width="300" height="120" rx="6" class="info"/><text x="394" y="170" class="n">运行当前Task</text><text x="394" y="201" class="s">立即就绪的await继续</text><text x="394" y="228" class="s">CPU长循环会占住循环</text><rect data-node="未就绪I/O或定时器" x="792" y="136" width="296" height="120" rx="6" class="node"/><text x="810" y="170" class="n">未就绪I/O或定时器</text><text x="810" y="201" class="s">暂停后推进其他Task</text><text x="810" y="228" class="s">事件就绪再回队列</text><rect data-node="完成或异常" x="792" y="328" width="296" height="120" rx="6" class="good"/><text x="810" y="362" class="n">完成或异常</text><text x="810" y="393" class="s">交给等待方收集</text><text x="810" y="420" class="s">不再被调度</text><rect x="688" y="136" width="52" height="30" fill="#fff"/><text x="696" y="158" class="s">挂起</text><rect x="736" y="342" width="52" height="30" fill="#fff"/><text x="744" y="364" class="s">返回</text><rect x="400" y="306" width="214" height="30" fill="#fff"/><text x="408" y="328" class="s">事件就绪 → 再次调度</text><text x="32" y="524" class="s">示例sleep模拟非阻塞等待；真实请求还需连接池、超时和取消收尾。</text></svg>
