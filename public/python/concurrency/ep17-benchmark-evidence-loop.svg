<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="408" viewBox="0 0 1120 408" role="img" aria-labelledby="ep17_benchmark_evidence_loop_title ep17_benchmark_evidence_loop_desc"><title id="ep17_benchmark_evidence_loop_title">从提交开始计时，排队也属于延迟</title><desc id="ep17_benchmark_evidence_loop_desc">100项固定输入、每37项一次失败：97成功、3失败，1与4worker使用同一口径。</desc><defs><marker id="ep17_benchmark_evidence_loop_arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#607568"/></marker><style>text{font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;letter-spacing:0;fill:#253c30}.h{font-size:28px;font-weight:600}.n{font-size:21px;font-weight:600}.s{font-size:18px;fill:#52685b}.node{fill:white;stroke:#a6b9ad;stroke-width:1.5}.good{fill:#e9f4ee;stroke:#397657;stroke-width:1.5}.info{fill:#edf3fb;stroke:#739bbf;stroke-width:1.5}.warn{fill:#f8eef1;stroke:#ae7789;stroke-width:1.5}.edge{fill:none;stroke:#607568;stroke-width:2;marker-end:url(#ep17_benchmark_evidence_loop_arrow)}.dashed{stroke-dasharray:6 5}</style></defs><rect width="1120" height="408" fill="white"/><text x="32" y="44" class="h">从提交开始计时，排队也属于延迟</text><text x="32" y="82" class="s">100项固定输入、每37项一次失败：97成功、3失败，1与4worker使用同一口径。</text><path d="M272 216H304" class="edge"/><path d="M544 216H576" class="edge"/><path d="M816 216H848" class="edge"/><rect data-node="固定实验" x="32" y="144" width="240" height="144" rx="6" class="node"/><text x="50" y="178" class="n">固定实验</text><text x="50" y="209" class="s">输入、环境与预热</text><text x="50" y="236" class="s">一次改变worker数</text><rect data-node="实际执行" x="304" y="144" width="240" height="144" rx="6" class="node"/><text x="322" y="178" class="n">实际执行</text><text x="322" y="209" class="s">线程池使用参数</text><text x="322" y="236" class="s">保存提交时刻</text><rect data-node="统计全部请求" x="576" y="144" width="240" height="144" rx="6" class="node"/><text x="594" y="178" class="n">统计全部请求</text><text x="594" y="209" class="s">成功 / 失败对账</text><text x="594" y="236" class="s">P95最近秩法</text><rect data-node="评估运行范围" x="848" y="144" width="240" height="144" rx="6" class="good"/><text x="866" y="178" class="n">评估运行范围</text><text x="866" y="209" class="s">吞吐与错误率</text><text x="866" y="236" class="s">资源 / 到达模型</text><text x="32" y="380" class="s">完成吞吐与成功吞吐分别给出；本机sleep示例不是网络或模型容量压测。</text></svg>
