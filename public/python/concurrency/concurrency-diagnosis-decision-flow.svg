<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="640" viewBox="0 0 1120 640" role="img" aria-labelledby="concurrency_diagnosis_decision_flow_title concurrency_diagnosis_decision_flow_desc"><title id="concurrency_diagnosis_decision_flow_title">先定位瓶颈，再给各阶段选择并发模型</title><desc id="concurrency_diagnosis_decision_flow_desc">任务拆阶段 → 固定输入测量 → 按资源选工具 → 设置容量与恢复合同。</desc><defs><marker id="concurrency_diagnosis_decision_flow_arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#607568"/></marker><style>text{font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;letter-spacing:0;fill:#253c30}.h{font-size:28px;font-weight:600}.n{font-size:21px;font-weight:600}.s{font-size:18px;fill:#52685b}.node{fill:white;stroke:#a6b9ad;stroke-width:1.5}.good{fill:#e9f4ee;stroke:#397657;stroke-width:1.5}.info{fill:#edf3fb;stroke:#739bbf;stroke-width:1.5}.warn{fill:#f8eef1;stroke:#ae7789;stroke-width:1.5}.edge{fill:none;stroke:#607568;stroke-width:2;marker-end:url(#concurrency_diagnosis_decision_flow_arrow)}.dashed{stroke-dasharray:6 5}</style></defs><rect width="1120" height="640" fill="white"/><text x="32" y="44" class="h">先定位瓶颈，再给各阶段选择并发模型</text><text x="32" y="82" class="s">任务拆阶段 → 固定输入测量 → 按资源选工具 → 设置容量与恢复合同。</text><path d="M272 192H304" class="edge"/><path d="M544 192H576" class="edge"/><path d="M816 192H848" class="edge"/><rect data-node="真实任务" x="32" y="128" width="240" height="132" rx="6" class="node"/><text x="50" y="162" class="n">真实任务</text><text x="50" y="193" class="s">扫描、转码、转写</text><text x="50" y="220" class="s">结果与状态落盘</text><rect data-node="证据" x="304" y="128" width="240" height="132" rx="6" class="node"/><text x="322" y="162" class="n">证据</text><text x="322" y="193" class="s">阶段耗时与错误</text><text x="322" y="220" class="s">CPU、内存、队列</text><rect data-node="阶段模型" x="576" y="128" width="240" height="132" rx="6" class="info"/><text x="594" y="162" class="n">阶段模型</text><text x="594" y="193" class="s">等待与计算分开</text><text x="594" y="220" class="s">按下方边界选择</text><rect data-node="运行约束" x="848" y="128" width="240" height="132" rx="6" class="good"/><text x="866" y="162" class="n">运行约束</text><text x="866" y="193" class="s">限速、超时、背压</text><text x="866" y="220" class="s">幂等与恢复</text><rect data-node="阻塞 I/O → 受限线程池 / 异步客户端" x="32" y="336" width="512" height="104" rx="6" class="node"/><text x="50" y="370" class="n">阻塞 I/O → 受限线程池 / 异步客户端</text><text x="50" y="401" class="s">请求速率限制独立于在途数量</text><rect data-node="纯 Python CPU → 进程池 / 运行时比较" x="576" y="336" width="512" height="104" rx="6" class="node"/><text x="594" y="370" class="n">纯 Python CPU → 进程池 / 运行时比较</text><text x="594" y="401" class="s">计入启动、序列化与总内存</text><rect data-node="GPU → 复用模型 + 有界队列 + 组批" x="32" y="464" width="512" height="104" rx="6" class="node"/><text x="50" y="498" class="n">GPU → 复用模型 + 有界队列 + 组批</text><text x="50" y="529" class="s">显存上限与端到端截止时间</text><rect data-node="多阶段 → 各阶段限容量 + 监督者" x="576" y="464" width="512" height="104" rx="6" class="node"/><text x="594" y="498" class="n">多阶段 → 各阶段限容量 + 监督者</text><text x="594" y="529" class="s">失败消息、停止协议与持久状态</text><text x="32" y="612" class="s">吞吐、P95、错误率和成本一起验收；checkpoint不替代内存背压。</text></svg>
