<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Python 并发工具选型地图</title>
  <desc id="desc">工具不是性能排行榜，而是资源瓶颈到工程控制的映射。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#334155"/></marker>
    <marker id="blueArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#2563eb"/></marker>
    <style>
      .bg{fill:#f8fafc}.title{font:800 32px Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#0f172a}.sub{font:15px Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#475569}
      .tag{font:800 12px Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#64748b}.h{font:800 18px Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#0f172a}.b{font:14px Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#475569}
      .small{font:12px Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#64748b}.card{stroke-width:2.2}.hub{fill:#1e293b;stroke:#0f172a;stroke-width:2.4}.hubText{font:800 22px Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#fff}
      .line{stroke:#334155;stroke-width:2.2;fill:none;marker-end:url(#arrow)}.blueLine{stroke:#2563eb;stroke-width:2.6;fill:none;marker-end:url(#blueArrow)}.dash{stroke:#64748b;stroke-width:2;stroke-dasharray:8 8;fill:none;marker-end:url(#arrow)}
      .chip{fill:#e2e8f0;rx:10}.chipText{font:700 12px Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#334155}
    </style>
  </defs>
  <rect class="bg" width="1280" height="720" rx="26"/>
  <text class="title" x="56" y="58">Python 并发工具选型地图</text>
  <text class="sub" x="56" y="86">工具不是性能排行榜，而是资源瓶颈到工程控制的映射。</text><path class="line" d="M350 230 L500 318"/>
<path class="line" d="M570 260 L600 282"/>
<path class="line" d="M820 230 L780 318"/>
<path class="line" d="M500 506 L560 402"/>
<path class="line" d="M790 506 L720 402"/><rect class="hub" x="500" y="282" width="280" height="120" rx="24"/><text class="hubText" x="640" y="328" text-anchor="middle">资源瓶颈</text><text class="small" x="640" y="358" text-anchor="middle" fill="#cbd5e1">决定并发工具</text><rect class="card" style="stroke:#06b6d4;fill:#ffffff" x="70" y="164" width="280" height="132" rx="18"/>
  <text class="tag" x="96" y="198">STEP 01</text>
  <text class="h" x="96" y="234">ThreadPoolExecutor</text>
  <text class="b" x="96" y="270">阻塞 I/O</text>
<text class="b" x="96" y="298">文件 / 网络 / 命令等待</text>
<rect class="card" style="stroke:#6366f1;fill:#f8fbff" x="430" y="128" width="280" height="132" rx="18"/>
  <text class="tag" x="456" y="162">STEP 02</text>
  <text class="h" x="456" y="198">asyncio</text>
  <text class="b" x="456" y="234">高并发网络</text>
<text class="b" x="456" y="262">连接、超时、取消</text>
<rect class="card" style="stroke:#fb923c;fill:#ffffff" x="820" y="164" width="280" height="132" rx="18"/>
  <text class="tag" x="846" y="198">STEP 03</text>
  <text class="h" x="846" y="234">ProcessPoolExecutor</text>
  <text class="b" x="846" y="270">CPU 密集</text>
<text class="b" x="846" y="298">绕开默认 GIL 限制</text>
<rect class="card" style="stroke:#22c55e;fill:#f8fbff" x="220" y="452" width="280" height="132" rx="18"/>
  <text class="tag" x="246" y="486">STEP 04</text>
  <text class="h" x="246" y="522">Queue / Pipeline</text>
  <text class="b" x="246" y="558">多阶段任务</text>
<text class="b" x="246" y="586">背压、状态、恢复</text>
<rect class="card" style="stroke:#ec4899;fill:#ffffff" x="790" y="452" width="280" height="132" rx="18"/>
  <text class="tag" x="816" y="486">STEP 05</text>
  <text class="h" x="816" y="522">外部命令池</text>
  <text class="b" x="816" y="558">ffmpeg / 压缩</text>
<text class="b" x="816" y="586">退出码和临时文件</text><rect class="chip" x="56" y="642" width="168" height="36"/><text class="chipText" x="74" y="665">先诊断</text>
<rect class="chip" x="246" y="642" width="168" height="36"/><text class="chipText" x="264" y="665">再选型</text>
<rect class="chip" x="436" y="642" width="168" height="36"/><text class="chipText" x="454" y="665">后限流</text>
<rect class="chip" x="626" y="642" width="168" height="36"/><text class="chipText" x="644" y="665">最后压测</text></svg>