<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="548" viewBox="0 0 1120 548" role="img" aria-labelledby="ep03_tool_selection_map_title ep03_tool_selection_map_desc"><title id="ep03_tool_selection_map_title">工具选择先看执行边界</title><desc id="ep03_tool_selection_map_desc">线程、协程、进程与队列各解决不同约束，可在不同阶段组合。</desc><defs><marker id="ep03_tool_selection_map_arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#607568"/></marker><style>text{font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;letter-spacing:0;fill:#253c30}.h{font-size:28px;font-weight:600}.n{font-size:21px;font-weight:600}.s{font-size:18px;fill:#52685b}.node{fill:white;stroke:#a6b9ad;stroke-width:1.5}.good{fill:#e9f4ee;stroke:#397657;stroke-width:1.5}.info{fill:#edf3fb;stroke:#739bbf;stroke-width:1.5}.warn{fill:#f8eef1;stroke:#ae7789;stroke-width:1.5}.edge{fill:none;stroke:#607568;stroke-width:2;marker-end:url(#ep03_tool_selection_map_arrow)}.dashed{stroke-dasharray:6 5}</style></defs><rect width="1120" height="548" fill="white"/><text x="32" y="44" class="h">工具选择先看执行边界</text><text x="32" y="82" class="s">线程、协程、进程与队列各解决不同约束，可在不同阶段组合。</text><rect data-node="阻塞等待 → ThreadPoolExecutor" x="32" y="128" width="512" height="136" rx="6" class="info"/><text x="50" y="162" class="n">阻塞等待 → ThreadPoolExecutor</text><text x="50" y="193" class="s">同步SDK、文件或外部命令等待</text><text x="50" y="220" class="s">限制运行线程和待执行Future</text><rect data-node="非阻塞I/O → asyncio" x="576" y="128" width="512" height="136" rx="6" class="node"/><text x="594" y="162" class="n">非阻塞I/O → asyncio</text><text x="594" y="193" class="s">异步连接池、取消和超时</text><text x="594" y="220" class="s">在途上限与请求速率分别限制</text><rect data-node="CPU计算 → ProcessPoolExecutor" x="32" y="292" width="512" height="136" rx="6" class="node"/><text x="50" y="326" class="n">CPU计算 → ProcessPoolExecutor</text><text x="50" y="357" class="s">可导入的worker、可序列化参数</text><text x="50" y="384" class="s">考虑原生库内部线程与进程启动</text><rect data-node="阶段连接 → 对应并发模型的Queue" x="576" y="292" width="512" height="136" rx="6" class="node"/><text x="594" y="326" class="n">阶段连接 → 对应并发模型的Queue</text><text x="594" y="357" class="s">线程用queue.Queue，协程用asyncio.Queue</text><text x="594" y="384" class="s">ffmpeg在外部进程，GPU由专用worker承接</text><text x="32" y="520" class="s">队列只在对应线程/事件循环边界内使用；跨线程桥接本身也要有容量上限。</text></svg>
