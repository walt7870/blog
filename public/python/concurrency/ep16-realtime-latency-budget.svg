<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="408" viewBox="0 0 1120 408" role="img" aria-labelledby="ep16_realtime_latency_budget_title ep16_realtime_latency_budget_desc"><title id="ep16_realtime_latency_budget_title">音频序号和截止时间贯穿传输链</title><desc id="ep16_realtime_latency_budget_desc">是否保留静音、如何分段与何时结束，都要遵循识别协议。</desc><defs><marker id="ep16_realtime_latency_budget_arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#607568"/></marker><style>text{font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;letter-spacing:0;fill:#253c30}.h{font-size:28px;font-weight:600}.n{font-size:21px;font-weight:600}.s{font-size:18px;fill:#52685b}.node{fill:white;stroke:#a6b9ad;stroke-width:1.5}.good{fill:#e9f4ee;stroke:#397657;stroke-width:1.5}.info{fill:#edf3fb;stroke:#739bbf;stroke-width:1.5}.warn{fill:#f8eef1;stroke:#ae7789;stroke-width:1.5}.edge{fill:none;stroke:#607568;stroke-width:2;marker-end:url(#ep16_realtime_latency_budget_arrow)}.dashed{stroke-dasharray:6 5}</style></defs><rect width="1120" height="408" fill="white"/><text x="32" y="44" class="h">音频序号和截止时间贯穿传输链</text><text x="32" y="82" class="s">是否保留静音、如何分段与何时结束，都要遵循识别协议。</text><path d="M272 216H304" class="edge"/><path d="M544 216H576" class="edge"/><path d="M816 216H848" class="edge"/><rect data-node="采集一帧" x="32" y="144" width="240" height="144" rx="6" class="node"/><text x="50" y="178" class="n">采集一帧</text><text x="50" y="209" class="s">sequence递增</text><text x="50" y="236" class="s">记录单调时刻</text><rect data-node="受限缓冲 / 桥接" x="304" y="144" width="240" height="144" rx="6" class="node"/><text x="322" y="178" class="n">受限缓冲 / 桥接</text><text x="322" y="209" class="s">容量与最久等待</text><text x="322" y="236" class="s">溢出记录音频缺口</text><rect data-node="上传 / 识别" x="576" y="144" width="240" height="144" rx="6" class="node"/><text x="594" y="178" class="n">上传 / 识别</text><text x="594" y="209" class="s">检查连续性与过期</text><text x="594" y="236" class="s">按协议发送EOF</text><rect data-node="结果汇聚" x="848" y="144" width="240" height="144" rx="6" class="good"/><text x="866" y="178" class="n">结果汇聚</text><text x="866" y="209" class="s">partial按句覆盖</text><text x="866" y="236" class="s">final按句保存</text><text x="32" y="380" class="s">示例只模拟协程采集与上传；无损模式过载应停会话或落盘，不能静默丢帧。</text></svg>
