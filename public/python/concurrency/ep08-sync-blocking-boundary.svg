<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="616" viewBox="0 0 1120 616" role="img" aria-labelledby="ep08_sync_blocking_boundary_title ep08_sync_blocking_boundary_desc"><title id="ep08_sync_blocking_boundary_title">阻塞工作由专用执行边界承接</title><desc id="ep08_sync_blocking_boundary_desc">事件循环保留调度能力；外层超时与执行真正停止是两件事。</desc><defs><marker id="ep08_sync_blocking_boundary_arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#607568"/></marker><style>text{font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;letter-spacing:0;fill:#253c30}.h{font-size:28px;font-weight:600}.n{font-size:21px;font-weight:600}.s{font-size:18px;fill:#52685b}.node{fill:white;stroke:#a6b9ad;stroke-width:1.5}.good{fill:#e9f4ee;stroke:#397657;stroke-width:1.5}.info{fill:#edf3fb;stroke:#739bbf;stroke-width:1.5}.warn{fill:#f8eef1;stroke:#ae7789;stroke-width:1.5}.edge{fill:none;stroke:#607568;stroke-width:2;marker-end:url(#ep08_sync_blocking_boundary_arrow)}.dashed{stroke-dasharray:6 5}</style></defs><rect width="1120" height="616" fill="white"/><text x="32" y="44" class="h">阻塞工作由专用执行边界承接</text><text x="32" y="82" class="s">事件循环保留调度能力；外层超时与执行真正停止是两件事。</text><path d="M352 198H736Q744 198 744 190V144H776" class="edge"/><path d="M352 232H600Q608 232 608 240V292Q608 300 616 300H776" class="edge"/><path d="M352 266H496Q504 266 504 274V408Q504 416 512 416H776" class="edge"/><rect data-node="异步主流程" x="32" y="168" width="320" height="128" rx="6" class="info"/><text x="50" y="202" class="n">异步主流程</text><text x="50" y="233" class="s">连接、调度与结果收集</text><text x="50" y="260" class="s">每类入口限制容量</text><rect data-node="阻塞I/O → 线程池" x="776" y="112" width="312" height="112" rx="6" class="good"/><text x="794" y="146" class="n">阻塞I/O → 线程池</text><text x="794" y="177" class="s">SDK内部另设超时</text><text x="794" y="204" class="s">取消等待不杀线程</text><rect data-node="纯Python计算 → 进程池" x="776" y="248" width="312" height="112" rx="6" class="node"/><text x="794" y="282" class="n">纯Python计算 → 进程池</text><text x="794" y="313" class="s">隔离计算与事件循环</text><text x="794" y="340" class="s">计入序列化与进程成本</text><rect data-node="GPU → 推理worker" x="776" y="384" width="312" height="112" rx="6" class="node"/><text x="794" y="418" class="n">GPU → 推理worker</text><text x="794" y="449" class="s">复用模型、有界组批</text><text x="794" y="476" class="s">按任务编号回传结果</text><text x="32" y="588" class="s">to_thread不是可强制取消的SDK；超时后重试前先查外部操作或幂等合同。</text></svg>
