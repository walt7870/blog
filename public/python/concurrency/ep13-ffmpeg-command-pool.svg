<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="408" viewBox="0 0 1120 408" role="img" aria-labelledby="ep13_ffmpeg_command_pool_title ep13_ffmpeg_command_pool_desc"><title id="ep13_ffmpeg_command_pool_title">转换到临时输出，校验后排他发布</title><desc id="ep13_ffmpeg_command_pool_desc">规格由模型决定；本例PCM16、单声道、16kHz，不自动修改响度。</desc><defs><marker id="ep13_ffmpeg_command_pool_arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#607568"/></marker><style>text{font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;letter-spacing:0;fill:#253c30}.h{font-size:28px;font-weight:600}.n{font-size:21px;font-weight:600}.s{font-size:18px;fill:#52685b}.node{fill:white;stroke:#a6b9ad;stroke-width:1.5}.good{fill:#e9f4ee;stroke:#397657;stroke-width:1.5}.info{fill:#edf3fb;stroke:#739bbf;stroke-width:1.5}.warn{fill:#f8eef1;stroke:#ae7789;stroke-width:1.5}.edge{fill:none;stroke:#607568;stroke-width:2;marker-end:url(#ep13_ffmpeg_command_pool_arrow)}.dashed{stroke-dasharray:6 5}</style></defs><rect width="1120" height="408" fill="white"/><text x="32" y="44" class="h">转换到临时输出，校验后排他发布</text><text x="32" y="82" class="s">规格由模型决定；本例PCM16、单声道、16kHz，不自动修改响度。</text><path d="M272 216H304" class="edge"/><path d="M544 216H576" class="edge"/><path d="M816 216H848" class="edge"/><rect data-node="只读原输入" x="32" y="144" width="240" height="144" rx="6" class="node"/><text x="50" y="178" class="n">只读原输入</text><text x="50" y="209" class="s">路径与规格检查</text><text x="50" y="236" class="s">保留来源身份</text><rect data-node="受限命令池" x="304" y="144" width="240" height="144" rx="6" class="node"/><text x="322" y="178" class="n">受限命令池</text><text x="322" y="209" class="s">ffmpeg独立进程</text><text x="322" y="236" class="s">超时与stderr</text><rect data-node="检查临时WAV" x="576" y="144" width="240" height="144" rx="6" class="node"/><text x="594" y="178" class="n">检查临时WAV</text><text x="594" y="209" class="s">退出码与编码</text><text x="594" y="236" class="s">非空帧、声道、采样率</text><rect data-node="发布独立结果" x="848" y="144" width="240" height="144" rx="6" class="good"/><text x="866" y="178" class="n">发布独立结果</text><text x="866" y="209" class="s">os.link拒绝覆盖</text><text x="866" y="236" class="s">失败临时目录清理</text><text x="32" y="380" class="s">同名源路径用摘要区分；合并声道可能破坏分轨信息，需先确认模型输入合同。</text></svg>
