<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="408" viewBox="0 0 1120 408" role="img" aria-labelledby="ep18_runtime_selection_future_title ep18_runtime_selection_future_desc"><title id="ep18_runtime_selection_future_title">区分构建能力与进程当前GIL状态</title><desc id="ep18_runtime_selection_future_desc">Python3.14正式支持可选free-threaded构建；默认解释器仍启用GIL。</desc><defs><marker id="ep18_runtime_selection_future_arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#607568"/></marker><style>text{font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;letter-spacing:0;fill:#253c30}.h{font-size:28px;font-weight:600}.n{font-size:21px;font-weight:600}.s{font-size:18px;fill:#52685b}.node{fill:white;stroke:#a6b9ad;stroke-width:1.5}.good{fill:#e9f4ee;stroke:#397657;stroke-width:1.5}.info{fill:#edf3fb;stroke:#739bbf;stroke-width:1.5}.warn{fill:#f8eef1;stroke:#ae7789;stroke-width:1.5}.edge{fill:none;stroke:#607568;stroke-width:2;marker-end:url(#ep18_runtime_selection_future_arrow)}.dashed{stroke-dasharray:6 5}</style></defs><rect width="1120" height="408" fill="white"/><text x="32" y="44" class="h">区分构建能力与进程当前GIL状态</text><text x="32" y="82" class="s">Python3.14正式支持可选free-threaded构建；默认解释器仍启用GIL。</text><path d="M272 216H304" class="edge"/><path d="M544 216H576" class="edge"/><path d="M816 216H848" class="edge"/><rect data-node="定位CPU瓶颈" x="32" y="144" width="240" height="144" rx="6" class="node"/><text x="50" y="178" class="n">定位CPU瓶颈</text><text x="50" y="209" class="s">纯Python或原生库</text><text x="50" y="236" class="s">排除I/O与GPU等待</text><rect data-node="检查构建能力" x="304" y="144" width="240" height="144" rx="6" class="node"/><text x="322" y="178" class="n">检查构建能力</text><text x="322" y="209" class="s">Py_GIL_DISABLED</text><text x="322" y="236" class="s">Python版本与平台</text><rect data-node="导入实际依赖" x="576" y="144" width="240" height="144" rx="6" class="node"/><text x="594" y="178" class="n">导入实际依赖</text><text x="594" y="209" class="