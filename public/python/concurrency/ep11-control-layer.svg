<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="548" viewBox="0 0 1120 548" role="img" aria-labelledby="ep11_control_layer_title ep11_control_layer_desc"><title id="ep11_control_layer_title">容量、速率和重试分别设预算</title><desc id="ep11_control_layer_desc">8个50毫秒请求槽可产生约160次/秒，并不满足每分钟60次的配额。</desc><defs><marker id="ep11_control_layer_arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#607568"/></marker><style>text{font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;letter-spacing:0;fill:#253c30}.h{font-size:28px;font-weight:600}.n{font-size:21px;font-weight:600}.s{font-size:18px;fill:#52685b}.node{fill:white;stroke:#a6b9ad;stroke-width:1.5}.good{fill:#e9f4ee;stroke:#397657;stroke-width:1.5}.info{fill:#edf3fb;stroke:#739bbf;stroke-width:1.5}.warn{fill:#f8eef1;stroke:#ae7789;stroke-width:1.5}.edge{fill:none;stroke:#607568;stroke-width:2;marker-end:url(#ep11_control_layer_arrow)}.dashed{stroke-dasharray:6 5}</style></defs><rect width="1120" height="548" fill="white"/><text x="32" y="44" class="h">容量、速率和重试分别设预算</text><text x="32" y="82" class="s">8个50毫秒请求槽可产生约160次/秒，并不满足每分钟60次的配额。</text><rect data-node="Semaphore：同时在途数" x="32" y="128" width="512" height="136" rx="6" class="info"/><text x="50" y="162" class="n">Semaphore：同时在途数</text><text x="50" y="193" class="s">限制连接与执行资源，不保证QPS</text><text x="50" y="220" class="s">等待退避时释放请求槽</text><rect data-node="Pacer / 令牌桶：开始速率" x="576" y="128" width="512" height="136" rx="6" class="node"/><text x="594" y="162" class="n">Pacer / 令牌桶：开始速率</text><text x="594" y="193" class="s">每次尝试重新经过速率门</text><text x="594" y="220" class="s">多进程、多机需共享提供方配额</text><rect data-node="有界Queue：未执行积压" x="32" y="292" width="512" height="136" rx="6" class="node"/><text x="50" y="326" class="n">有界Queue：未执行积压</text><text x="50" y="357" class="s">队列满时让上游等待或拒绝</text><text x="50" y="384" class="s">还需限制消息字节和最久等待</text><rect data-node="有限重试：失败路径流量" x="576" y="292" width="512" height="136" rx="6" class="node"/><text x="594" y="326" class="n">有限重试：失败路径流量</text><text x="594" y="357" class="s">错误分类、退避、次数与总截止时间</text><text x="594" y="384" class="s">副作用重放依赖服务端幂等合同</text><text x="32" y="520" class="s">模拟临时错误可重试；真实超时可能已执行或已收费，先查状态再决定重放。</text></svg>
