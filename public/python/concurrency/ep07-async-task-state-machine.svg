<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="680" viewBox="0 0 1120 680" role="img" aria-labelledby="ep07_async_task_state_machine_title ep07_async_task_state_machine_desc"><title id="ep07_async_task_state_machine_title">成功、失败、超时和取消是不同结果</title><desc id="ep07_async_task_state_machine_desc">图中是业务任务状态，不等同于asyncio.Task内部的全部状态。</desc><defs><marker id="ep07_async_task_state_machine_arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#607568"/></marker><style>text{font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;letter-spacing:0;fill:#253c30}.h{font-size:28px;font-weight:600}.n{font-size:21px;font-weight:600}.s{font-size:18px;fill:#52685b}.node{fill:white;stroke:#a6b9ad;stroke-width:1.5}.good{fill:#e9f4ee;stroke:#397657;stroke-width:1.5}.info{fill:#edf3fb;stroke:#739bbf;stroke-width:1.5}.warn{fill:#f8eef1;stroke:#ae7789;stroke-width:1.5}.edge{fill:none;stroke:#607568;stroke-width:2;marker-end:url(#ep07_async_task_state_machine_arrow)}.dashed{stroke-dasharray:6 5}</style></defs><rect width="1120" height="680" fill="white"/><text x="32" y="44" class="h">成功、失败、超时和取消是不同结果</text><text x="32" y="82" class="s">图中是业务任务状态，不等同于asyncio.Task内部的全部状态。</text><path d="M264 214H400" class="edge"/><path d="M688 184H792" class="edge"/><path d="M688 220H736Q744 220 744 228V316Q744 324 752 324H792" class="edge"/><path d="M688 256H712Q720 256 720 264V448Q720 456 728 456H792" class="edge"/><path d="M544 280V508" class="edge"/><rect data-node="pending" x="32" y="152" width="232" height="112" rx="6" class="node"/><text x="50" y="186" class="n">pending</text><text x="50" y="217" class="s">等待业务调度</text><rect data-node="running" x="400" y="152" width="288" height="128" rx="6" class="info"/><text x="418" y="186" class="n">running</text><text x="418" y="217" class="s">执行服务操作</text><text x="418" y="244" class="s">观察截止时间</text><rect data-node="success" x="792" y="120" width="296" height="104" rx="6" class="good"/><text x="810" y="154" class="n">success</text><text x="810" y="185" class="s">结果保存成功</text><rect data-node="failed" x="792" y="272" width="296" height="104" rx="6" class="warn"/><text x="810" y="306" class="n">failed</text><text x="810" y="337" class="s">普通异常，保留原因</text><rect data-node="timeout" x="792" y="408" width="296" height="104" rx="6" class="warn"/><text x="810" y="442" class="n">timeout</text><text x="810" y="473" class="s">等待超时，外部状态待查</text><rect data-node="cancelled" x="400" y="508" width="288" height="88" rx="6" class="node"/><text x="418" y="542" class="n">cancelled</text><text x="418" y="573" class="s">清理后继续传播取消</text><rect x="696" y="144" width="52" height="30" fill="#fff"/><text x="704" y="166" class="s">返回</text><rect x="744" y="286" width="52" height="30" fill="#fff"/><text x="752" y="308" class="s">异常</text><rect x="720" y="418" width="52" height="30" fill="#fff"/><text x="728" y="440" class="s">超时</text><rect x="552" y="426" width="52" height="30" fill="#fff"/><text x="560" y="448" class="s">取消</text><text x="32" y="652" class="s">pending也可能取消；wait_for会等待取消清理，真实返回可能晚于配置超时。</text></svg>
