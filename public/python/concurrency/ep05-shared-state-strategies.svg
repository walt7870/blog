<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="520" viewBox="0 0 1120 520" role="img" aria-labelledby="ep05_shared_state_strategies_title ep05_shared_state_strategies_desc"><title id="ep05_shared_state_strategies_title">多个worker返回消息，一个writer拥有结果</title><desc id="ep05_shared_state_strategies_desc">共享状态首先看所有权；锁只保护无法去除的共享临界区。</desc><defs><marker id="ep05_shared_state_strategies_arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#607568"/></marker><style>text{font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;letter-spacing:0;fill:#253c30}.h{font-size:28px;font-weight:600}.n{font-size:21px;font-weight:600}.s{font-size:18px;fill:#52685b}.node{fill:white;stroke:#a6b9ad;stroke-width:1.5}.good{fill:#e9f4ee;stroke:#397657;stroke-width:1.5}.info{fill:#edf3fb;stroke:#739bbf;stroke-width:1.5}.warn{fill:#f8eef1;stroke:#ae7789;stroke-width:1.5}.edge{fill:none;stroke:#607568;stroke-width:2;marker-end:url(#ep05_shared_state_strategies_arrow)}.dashed{stroke-dasharray:6 5}</style></defs><rect width="1120" height="520" fill="white"/><text x="32" y="44" class="h">多个worker返回消息，一个writer拥有结果</text><text x="32" y="82" class="s">共享状态首先看所有权；锁只保护无法去除的共享临界区。</text><path d="M304 192H432" class="edge"/><path d="M304 364H368Q376 364 376 356V252Q376 244 384 244H432" class="edge"/><path d="M712 216H808" class="edge"/><rect data-node="worker A" x="32" y="136" width="272" height="112" rx="6" class="node"/><text x="50" y="170" class="n">worker A</text><text x="50" y="201" class="s">产出记录，不写结果</text><rect data-node="worker B" x="32" y="308" width="272" height="112" rx="6" class="node"/><text x="50" y="342" class="n">worker B</text><text x="50" y="373" class="s">错误也转成消息</text><rect data-node="有界结果队列" x="432" y="152" width="280" height="136" rx="6" class="info"/><text x="450" y="186" class="n">有界结果队列</text><text x="450" y="217" class="s">STOP在普通消息之后</text><text x="450" y="244" class="s">get对应task_done</text><rect data-node="单writer" x="808" y="152" width="280" height="136" rx="6" class="good"/><text x="826" y="186" class="n">单writer</text><text x="826" y="217" class="s">拥有结果与写入状态</text><text x="826" y="244" class="s">故障必须报告监督者</text><text x="32" y="464" class="s">join只等待计数归零，不证明落盘成功；单writer不自动提供事务和跨进程去重。</text><text x="32" y="492" class="s">必须共享的“先检查再修改”需锁或唯一约束；frozen对象也可能含可变字段。</text></svg>
