<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="548" viewBox="0 0 1120 548" role="img" aria-labelledby="ep09_processpool_cost_model_title ep09_processpool_cost_model_desc"><title id="ep09_processpool_cost_model_title">多核收益要覆盖跨进程成本</title><desc id="ep09_processpool_cost_model_desc">显式spawn让worker导入边界清楚；任务粒度决定成本能否摊薄。</desc><defs><marker id="ep09_processpool_cost_model_arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#607568"/></marker><style>text{font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;letter-spacing:0;fill:#253c30}.h{font-size:28px;font-weight:600}.n{font-size:21px;font-weight:600}.s{font-size:18px;fill:#52685b}.node{fill:white;stroke:#a6b9ad;stroke-width:1.5}.good{fill:#e9f4ee;stroke:#397657;stroke-width:1.5}.info{fill:#edf3fb;stroke:#739bbf;stroke-width:1.5}.warn{fill:#f8eef1;stroke:#ae7789;stroke-width:1.5}.edge{fill:none;stroke:#607568;stroke-width:2;marker-end:url(#ep09_processpool_cost_model_arrow)}.dashed{stroke-dasharray:6 5}</style></defs><rect width="1120" height="548" fill="white"/><text x="32" y="44" class="h">多核收益要覆盖跨进程成本</text><text x="32" y="82" class="s">显式spawn让worker导入边界清楚；任务粒度决定成本能否摊薄。</text><rect data-node="主进程：提交可序列化参数" x="32" y="128" width="512" height="136" rx="6" class="info"/><text x="50" y="162" class="n">主进程：提交可序列化参数</text><text x="50" y="193" class="s">传路径与小参数，避免重复复制大数组</text><text x="50" y="220" class="s">模块顶层函数与__main__入口守卫</text><rect data-node="worker：每进程独立执行" x="576" y="128" width="512" height="136" rx="6" class="node"/><text x="594" y="162" class="n">worker：每进程独立执行</text><text x="594" y="193" class="s">纯Python计算可跨核心并行</text><text x="594" y="220" class="s">大模型和缓存通常按进程增加内存</text><rect data-node="结果：传回小对象或输出路径" x="32" y="292" width="512" height="136" rx="6" class="node"/><text x="50" y="326" class="n">结果：传回小对象或输出路径</text><text x="50" y="357" class="s">map按输入顺序消费，可能等慢项</text><text x="50" y="384" class="s">完成即消费可用as_completed</text><rect data-node="对比：顺序、线程、进程" x="576" y="292" width="512" height="136" rx="6" class="node"/><text x="594" y="326" class="n">对比：顺序、线程、进程</text><text x="594" y="357" class="s">测总耗时、CPU与总RSS</text><text x="594" y="384" class="s">原生库内部线程池可能已并行</text><text x="32" y="520" class="s">示例只核对计算结果；Python3.14默认启动方式变化时也不依赖隐式fork。</text></svg>
