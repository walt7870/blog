<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">进程池适合 CPU 密集，但成本要算清</title>
  <desc id="desc">多进程能绕开默认 GIL 的限制，也会带来启动、序列化和内存放大的成本。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#334155"/></marker>
    <marker id="blueArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#2563eb"/></marker>
    <style>
      .bg{fill:#f8fafc}.title{font:800 32px Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#0f172a}.sub{font:15px Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#475569}
      .tag{font:800 12px Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#64748b}.h{font:800 18px Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#0f172a}.b{font:14px Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#475569}
      .small{font:12px Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#64748b}.card{stroke-width:2.2}.hub{fill:#1e293b;stroke:#0f172a;stroke-width:2.4}.hubText{font:800 22px Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#fff}
      .line{stroke:#334155;stroke-width:2.2;fill:none;marker-end:url(#arrow)}.blueLine{stroke:#2563eb;stroke-width:2.6;fill:none;marker-end:url(#blueArrow)}.dash{stroke:#64748b;stroke-width:2;stroke-dasharray:8 8;fill:none;marker-end:url(#arrow)}
      .chip{fill:#e2e8f0;rx:10}.chipText{font:700 12px Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#334155}
    </style>
  </defs>
  <rect class="bg" width="1280" height="720" rx="26"/>
  <text class="title" x="56" y="58">进程池适合 CPU 密集，但成本要算清</text>
  <text class="sub" x="56" y="86">多进程能绕开默认 GIL 的限制，也会带来启动、序列化和内存放大的成本。</text><rect class="card" style="stroke:#22c55e;fill:#ffffff" x="80" y="170" width="500" height="170" rx="18"/>
  <text class="tag" x="106" y="204">STEP 01</text>
  <text class="h" x="106" y="240">收益</text>
  <text class="b" x="106" y="276">多核并行计算</text>
<text class="b" x="106" y="304">隔离 GIL 影响</text>
<text class="b" x="106" y="332">适合大粒度任务</text>
<rect class="card" style="stroke:#fb923c;fill:#f8fbff" x="700" y="170" width="500" height="170" rx="18"/>
  <text class="tag" x="726" y="204">STEP 02</text>
  <text class="h" x="726" y="240">成本</text>
  <text class="b" x="726" y="276">进程启动</text>
<text class="b" x="726" y="304">参数序列化</text>
<text class="b" x="726" y="332">模型/缓存重复加载</text>
<rect class="card" style="stroke:#06b6d4;fill:#ffffff" x="80" y="420" width="500" height="170" rx="18"/>
  <text class="tag" x="106" y="454">STEP 03</text>
  <text class="h" x="106" y="490">适合</text>
  <text class="b" x="106" y="526">音频特征提取</text>
<text class="b" x="106" y="554">纯计算批任务</text>
<text class="b" x="106" y="582">可拆分大任务</text>
<rect class="card" style="stroke:#ec4899;fill:#f8fbff" x="700" y="420" width="500" height="170" rx="18"/>
  <text class="tag" x="726" y="454">STEP 04</text>
  <text class="h" x="726" y="490">谨慎</text>
  <text class="b" x="726" y="526">小任务高频提交</text>
<text class="b" x="726" y="554">共享大对象</text>
<text class="b" x="726" y="582">GPU 模型多份加载</text><rect class="hub" x="545" y="330" width="190" height="100" rx="24"/><text class="hubText" x="640" y="370" text-anchor="middle">收益 - 成本</text><text class="small" x="640" y="398" text-anchor="middle" fill="#cbd5e1">先算清再多开</text><rect class="chip" x="56" y="642" width="168" height="36"/><text class="chipText" x="74" y="665">chunksize</text>
<rect class="chip" x="246" y="642" width="168" height="36"/><text class="chipText" x="264" y="665">initializer</text>
<rect class="chip" x="436" y="642" width="168" height="36"/><text class="chipText" x="454" y="665">max_workers</text>
<rect class="chip" x="626" y="642" width="168" height="36"/><text class="chipText" x="644" y="665">RSS</text>
<rect class="chip" x="816" y="642" width="168" height="36"/><text class="chipText" x="834" y="665">CPU util</text></svg>