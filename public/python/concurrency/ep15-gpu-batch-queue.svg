<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="408" viewBox="0 0 1120 408" role="img" aria-labelledby="ep15_gpu_batch_queue_title ep15_gpu_batch_queue_desc"><title id="ep15_gpu_batch_queue_title">最大组批等待只是延迟预算的一部分</title><desc id="ep15_gpu_batch_queue_desc">从第一项入批开始计时，达到batch_size或max_wait_ms即运行。</desc><defs><marker id="ep15_gpu_batch_queue_arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#607568"/></marker><style>text{font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;letter-spacing:0;fill:#253c30}.h{font-size:28px;font-weight:600}.n{font-size:21px;font-weight:600}.s{font-size:18px;fill:#52685b}.node{fill:white;stroke:#a6b9ad;stroke-width:1.5}.good{fill:#e9f4ee;stroke:#397657;stroke-width:1.5}.info{fill:#edf3fb;stroke:#739bbf;stroke-width:1.5}.warn{fill:#f8eef1;stroke:#ae7789;stroke-width:1.5}.edge{fill:none;stroke:#607568;stroke-width:2;marker-end:url(#ep15_gpu_batch_queue_arrow)}.dashed{stroke-dasharray:6 5}</style></defs><rect width="1120" height="408" fill="white"/><text x="32" y="44" class="h">最大组批等待只是延迟预算的一部分</text><text x="32" y="82" class="s">从第一项入批开始计时，达到batch_size或max_wait_ms即运行。</text><path d="M272 216H304" class="edge"/><path d="M544 216H576" class="edge"/><path d="M816 216H848" class="edge"/><rect data-node="入口队列" x="32" y="144" width="240" height="144" rx="6" class="node"/><text x="50" y="178" class="n">入口队列</text><text x="50" y="209" class="s">限制项数与字节</text><text x="50" y="236" class="s">检查任务截止时间</text><rect data-node="组批调度" x="304" y="144" width="240" height="144" rx="6" class="node"/><text x="322" y="178" class="n">组批调度</text><text x="322" y="209" class="s">batch_size上限</text><text x="322" y="236" class="s">max_wait_ms等待</text><rect data-node="常驻推理worker" x="576" y="144" width="240" height="144" rx="6" class="node"/><text x="594" y="178" class="n">常驻推理worker</text><text x="594" y="209" class="s">复用模型与显存</text><text x="594" y="236" class="s">结果数等于输入数</text><rect data-node="按编号回传" x="848" y="144" width="240" height="144" rx="6" class="good"/><text x="866" y="178" class="n">按编号回传</text><text x="866" y="209" class="s">每项成功或失败</text><text x="866" y="236" class="s">监督worker异常</text><text x="32" y="380" class="s">本页sleep只模拟推理；TaskGroup让模型异常传播并停止join，避免挂死。</text></svg>
