<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="440" viewBox="0 0 1120 440" role="img" aria-labelledby="delivery-validation-gates-title delivery-validation-gates-desc"><title id="delivery-validation-gates-title">文件齐全之后，还要实际运行并核对结果</title><desc id="delivery-validation-gates-desc">结构检查器只读现有目录，不创建样例，不把缺失项变成通过项。</desc><defs><marker id="delivery-validation-gates-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#607568"/></marker><style>text{font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;fill:#253c30;letter-spacing:0}.h{font-size:28px;font-weight:600}.n{font-size:21px;font-weight:600}.s{font-size:18px;fill:#52685b}.node{fill:#fff;stroke:#a6b9ad;stroke-width:1.5}.good{fill:#e9f4ee;stroke:#397657;stroke-width:1.5}.info{fill:#edf3fb;stroke:#739bbf;stroke-width:1.5}.warn{fill:#f8eef1;stroke:#ae7789;stroke-width:1.5}.edge{fill:none;stroke:#607568;stroke-width:2;marker-end:url(#delivery-validation-gates-arrow)}.dashed{stroke-dasharray:6 5}</style></defs><rect width="1120" height="440" fill="white"/><text x="32" y="44" class="h">文件齐全之后，还要实际运行并核对结果</text><text x="32" y="82" class="s">结构检查器只读现有目录，不创建样例，不把缺失项变成通过项。</text><path d="M272 216H304" class="edge"/><path d="M544 216H576" class="edge"/><path d="M816 216H848" class="edge"/><rect data-node="准备交付目录" x="32" y="144" width="240" height="144" rx="6" class="node"/><text x="52" y="180" class="n">准备交付目录</text><text x="52" y="212" class="s">真实run.py</text><text x="52" y="240" class="s">README与样例</text><rect data-node="只读结构检查" x="304" y="144" width="240" height="144" rx="6" class="node"/><text x="324" y="180" class="n">只读结构检查</text><text x="324" y="212" class="s">文件必须is_file</text><text x="324" y="240" class="s">缺项退出码1</text><rect data-node="新环境运行" x="576" y="144" width="240" height="144" rx="6" class="node"/><text x="596" y="180" class="n">新环境运行</text><text x="596" y="212" class="s">固定输入与命令</text><text x="596" y="240" class="s">核对真实结果</text><rect data-node="边界验收" x="848" y="144" width="240" height="144" rx="6" class="good"/><text x="868" y="180" class="n">边界验收</text><text x="868" y="212" class="s">缺列、空表、重跑</text><text x="868" y="240" class="s">确认原输入不变</text><text x="32" y="392" class="s">outputs可在首次运行时创建；存在run.py不等于规则正确或工具已经通过验收。</text></svg>
