<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="560" viewBox="0 0 1120 560" role="img" aria-labelledby="python-basics-map-title python-basics-map-desc"><title id="python-basics-map-title">客户工具的能力地图：运行、规则、连接与交付</title><desc id="python-basics-map-desc">同一条业务线贯穿学习：客户名单 → 缺失检查 → 汇总与日报 → 可复现工具。</desc><defs><marker id="python-basics-map-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#607568"/></marker><style>text{font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;fill:#253c30;letter-spacing:0}.h{font-size:28px;font-weight:600}.n{font-size:21px;font-weight:600}.s{font-size:18px;fill:#52685b}.node{fill:#fff;stroke:#a6b9ad;stroke-width:1.5}.good{fill:#e9f4ee;stroke:#397657;stroke-width:1.5}.info{fill:#edf3fb;stroke:#739bbf;stroke-width:1.5}.warn{fill:#f8eef1;stroke:#ae7789;stroke-width:1.5}.edge{fill:none;stroke:#607568;stroke-width:2;marker-end:url(#python-basics-map-arrow)}.dashed{stroke-dasharray:6 5}</style></defs><rect width="1120" height="560" fill="white"/><text x="32" y="44" class="h">客户工具的能力地图：运行、规则、连接与交付</text><text x="32" y="82" class="s">同一条业务线贯穿学习：客户名单 → 缺失检查 → 汇总与日报 → 可复现工具。</text><path d="M344 196H420" class="edge"/><path d="M732 196H808" class="edge"/><path d="M936 272V328" class="edge"/><path d="M808 400H732" class="edge"/><path d="M420 400H344" class="edge"/><rect data-node="运行入口 EP01–04" x="32" y="128" width="312" height="144" rx="6" class="node"/><text x="52" y="164" class="n">运行入口 EP01–04</text><text x="52" y="196" class="s">解释器与路径</text><text x="52" y="224" class="s">变量、类型、列表与字典</text><rect data-node="批量规则 EP05–08" x="420" y="128" width="312" height="144" rx="6" class="node"/><text x="440" y="164" class="n">批量规则 EP05–08</text><text x="440" y="196" class="s">条件、循环、清洗</text><text x="440" y="224" class="s">金额与日期边界</text><rect data-node="组织 EP09–10" x="808" y="128" width="280" height="144" rx="6" class="node"/><text x="828" y="164" class="n">组织 EP09–10</text><text x="828" 