<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="548" viewBox="0 0 1120 548" role="img" aria-labelledby="customer-rule-branches-title customer-rule-branches-desc"><title id="customer-rule-branches-title">独立标签可以同时命中，联系状态只能二选一</title><desc id="customer-rule-branches-desc">示例：韩梅梅缺手机号且 12 天未联系，应保留两个标签。</desc><defs><marker id="customer-rule-branches-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#607568"/></marker><style>text{font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;fill:#253c30;letter-spacing:0}.h{font-size:28px;font-weight:600}.n{font-size:21px;font-weight:600}.s{font-size:18px;fill:#52685b}.node{fill:#fff;stroke:#a6b9ad;stroke-width:1.5}.good{fill:#e9f4ee;stroke:#397657;stroke-width:1.5}.info{fill:#edf3fb;stroke:#739bbf;stroke-width:1.5}.warn{fill:#f8eef1;stroke:#ae7789;stroke-width:1.5}.edge{fill:none;stroke:#607568;stroke-width:2;marker-end:url(#customer-rule-branches-arrow)}.dashed{stroke-dasharray:6 5}</style></defs><rect width="1120" height="548" fill="white"/><text x="32" y="44" class="h">独立标签可以同时命中，联系状态只能二选一</text><text x="32" y="82" class="s">示例：韩梅梅缺手机号且 12 天未联系，应保留两个标签。</text><path d="M328 180H424" class="edge"/><path d="M328 220H364Q372 220 372 228V384Q372 392 380 392H424" class="edge"/><path d="M708 368H792" class="edge"/><path d="M708 412H744Q752 412 752 420V468Q752 476 760 476H792" class="edge"/><rect data-node="一位客户" x="32" y="148" width="296" height="112" rx="6" class="info"/><text x="52" y="184" class="n">一位客户</text><text x="52" y="216" class="s">同一份字段输入</text><rect data-node="独立 if：缺手机号" x="424" y="128" width="284" height="116" rx="6" class="good"/><text x="444" y="164" class="n">独立 if：缺手机号</text><text x="444" y="196" class="s">命中 → 资料待补</text><rect data-node="互斥判断：天数 &gt; 7" x="424" y="336" width="284" height="112" rx="6" class="node"/><text x="444" y="372" class="n">互斥判断：天数 &gt; 7</text><text x="444" y="404" class="s">只选择一个联系状态</text><rect data-node="需要回访" x="792" y="320" width="296" height="84" rx="6" class="good"/><text x="812" y="356" class="n">需要回访</text><rect data-node="联系正常" x="792" y="440" width="296" height="72" rx="6" class="node"/><text x="812" y="476" class="n">联系正常</text><rect x="724" y="328" width="34" height="30" fill="#fff"/><text x="732" y="350" class="s">是</text><rect x="750" y="438" width="34" height="30" fill="#fff"/><text x="758" y="460" class="s">否</text><text x="32" y="298" class="s">高价值也可独立判断。</text><text x="32" y="330" class="s">勿用elif排除其他标签。</text></svg>
