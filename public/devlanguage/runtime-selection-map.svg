<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="580" viewBox="0 0 1120 580" role="img" aria-labelledby="runtime-selection-map-t runtime-selection-map-d"><title id="runtime-selection-map-t">订单业务跨越多种语言与运行位置</title><desc id="runtime-selection-map-d">先确定责任和交付约束，再比较语法与性能。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#607568"/></marker><style>text{font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;letter-spacing:0;fill:#253c30}.h{font-size:28px;font-weight:600}.n{font-size:21px;font-weight:600}.s{font-size:18px;fill:#52685b}.node{fill:white;stroke:#a6b9ad;stroke-width:1.5}.focus{fill:#e9f4ee;stroke:#397657;stroke-width:1.5}.info{fill:#edf3fb;stroke:#739bbf;stroke-width:1.5}.edge{fill:none;stroke:#607568;stroke-width:2;marker-end:url(#a)}</style></defs><rect width="1120" height="580" fill="white"/><text x="32" y="44" class="h">订单业务跨越多种语言与运行位置</text><text x="32" y="82" class="s">先确定责任和交付约束，再比较语法与性能。</text><path d="M336 192H408" class="edge"/><path d="M712 192H784" class="edge"/><g data-node="浏览器 / Flutter客户端"><rect x="32" y="132" width="304" height="120" rx="6" class="node"/><text x="48" y="164" class="n">浏览器 / Flutter客户端</text><text x="48" y="196" class="s">展示订单、输入与离线草稿</text><text x="48" y="224" class="s">前端与平台发布各自验收</text></g><g data-node="Java服务与业务合同"><rect x="408" y="132" width="304" height="120" rx="6" class="focus"/><text x="424" y="164" class="n">Java服务与业务合同</text><text x="424" y="196" class="s">订单、事务、权限和幂等</text><text x="424" y="224" class="s">规则不由语言自动补齐</text></g><g data-node="数据与外部系统"><rect x="784" y="132" width="304" height="120" rx="6" class="node"/><text x="800" y="164" class="n">数据与外部系统</text><text x="800" y="196" class="s">数据库、支付与消息</text><text x="800" y="224" class="s">一致性和结果确认边界</text></g><g data-node="Python对账工具"><rect x="32" y="344" width="304" height="120" rx="6" class="node"/><text x="48" y="376" class="n">Python对账工具</text><text x="48" y="408" class="s">CSV清洗、校验和失败报告</text><text x="48" y="436" class="s">固定输入与可复现环境</text></g><g data-node="Rust原生工具"><rect x="408" y="344" width="304" height="120" rx="6" class="info"/><text x="424" y="376" class="n">Rust原生工具</text><text x="424" y="408" class="s">有界资源、解析和并发</text><text x="424" y="436" class="s">目标架构与系统依赖</text></g><g data-node="Electron桌面适配"><rect x="784" y="344" width="304" height="120" rx="6" class="node"/><text x="800" y="376" class="n">Electron桌面适配</text><text x="800" y="408" class="s">窗口、本地文件和安全IPC</text><text x="800" y="436" class="s">主进程权限与升级边界</text></g><text x="32" y="544" class="s">下方为辅助工具与桌面场景，不表示订单服务必须经过这些组件。</text></svg>
