<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="590" viewBox="0 0 1120 590" role="img" aria-labelledby="maven-dependency-resolution-title maven-dependency-resolution-desc">
  <title id="maven-dependency-resolution-title">仓库路由与版本调解分别解决不同问题</title><desc id="maven-dependency-resolution-desc">上半部分展示构件解析的本地与远程路线，下半部分展示依赖路径深度与dependencyManagement的作用。镜像不是绕过私服直连中央仓库的兜底。</desc>
  <defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#74818a"/></marker>
  <style>text{font:18px Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#27343b}.title{font-size:25px;font-weight:700}.head{font-size:20px;font-weight:600}.small{font-size:16px;fill:#52616a}.box{fill:#fff;stroke:#bac4c9;stroke-width:1.4}.focus{fill:#e4f3ee;stroke:#3b8573;stroke-width:1.5}.blue{fill:#eef5ff;stroke:#a5b9cf;stroke-width:1.4}.line{fill:none;stroke:#74818a;stroke-width:1.5;marker-end:url(#arrow)}.rule{stroke:#d1d9dd;stroke-width:1}</style></defs>
  <rect width="1120" height="590" fill="#f7f9fa"/>
  <text x="36" y="45" class="title">仓库路由与版本调解分别解决不同问题</text>
  <text x="36" y="82" class="small">下载回答“从哪里获取”；版本调解回答“最终选哪个”。两条规则要分别核对。</text>
  <path d="M246 191H306" class="line"/>
  <path d="M526 191H586" class="line"/>
  <path d="M806 191H866" class="line"/>
  <rect x="36" y="132" width="210" height="120" rx="6" class="box"/><text x="54" y="167" class="head">依赖坐标</text>
  <text x="54" y="201" class="small">读取 POM 与构件</text>
  <text x="54" y="228" class="small">按 scope 形成路径</text>
  <rect x="306" y="132" width="220" height="120" rx="6" class="box"/><text x="324" y="167" class="head">本地仓库</text>
  <text x="324" y="201" class="small">复用可用结果</text>
  <text x="324" y="228" class="small">还要遵守更新策略</text>
  <rect x="586" y="132" width="220" height="120" rx="6" class="blue"/><text x="604" y="167" class="head">远程仓库路由</text>
  <text x="604" y="201" class="small">应用 mirror 配置</text>
  <text x="604" y="228" class="small">认证匹配实际 ID</text>
  <rect x="866" y="132" width="218" height="120" rx="6" class="box"/><text x="884" y="167" class="head">选定的远程端</text>
  <text x="884" y="201" class="small">私服可代理 Central</text>
  <text x="884" y="228" class="small">不自动绕过镜像</text>
  <text x="534" y="112" class="small">需远程</text>
  <path d="M36 302H1084" class="rule"/>
  <rect x="36" y="344" width="486" height="120" rx="6" class="box"/><text x="54" y="379" class="head">路径调解示例</text>
  <text x="54" y="413" class="small">订单 → SDK-A → 库 1.0</text>
  <text x="54" y="440" class="small">订单 → 库 2.0：路径更近，通常选 2.0</text>
  <rect x="586" y="344" width="498" height="120" rx="6" class="focus"/><text x="604" y="379" class="head">版本治理</text>
  <text x="604" y="413" class="small">dependencyManagement 提供默认管理信息</text>
  <text x="604" y="440" class="small">只管理不会引入库；最终看有效 POM 与依赖树</text>
  <text x="36" y="522" class="small">同深度通常先声明者优先；直接版本声明与管理表也参与结果，不能只画成“永远选最新”。</text>
  <text x="36" y="555" class="small">快照与缺失结果缓存受更新策略影响；本地存在文件不保证构建永远不访问远端。</text>
</svg>
