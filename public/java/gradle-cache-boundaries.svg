<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="530" viewBox="0 0 1120 530" role="img" aria-labelledby="gradle-cache-boundaries-title gradle-cache-boundaries-desc">
  <title id="gradle-cache-boundaries-title">复用配置模型与复用任务输出是两件事</title><desc id="gradle-cache-boundaries-desc">先尝试复用配置模型，再由任务输入输出状态决定up-to-date、从构建缓存恢复或执行动作。</desc>
  <defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#74818a"/></marker>
  <style>text{font:18px Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#27343b}.title{font-size:25px;font-weight:700}.head{font-size:20px;font-weight:600}.small{font-size:16px;fill:#52616a}.box{fill:#fff;stroke:#bac4c9;stroke-width:1.4}.focus{fill:#e4f3ee;stroke:#3b8573;stroke-width:1.5}.blue{fill:#eef5ff;stroke:#a5b9cf;stroke-width:1.4}.line{fill:none;stroke:#74818a;stroke-width:1.5;marker-end:url(#arrow)}.rule{stroke:#d1d9dd;stroke-width:1}</style></defs>
  <rect width="1120" height="530" fill="#f7f9fa"/>
  <text x="36" y="45" class="title">复用配置模型与复用任务输出是两件事</text>
  <text x="36" y="82" class="small">同一构建可以复用配置模型，同时仍执行某些任务；三类状态不能混成一个“缓存命中”。</text>
  <path d="M246 195H306" class="line"/>
  <path d="M566 195H626" class="line"/>
  <path d="M846 195H906" class="line"/>
  <rect x="36" y="134" width="210" height="122" rx="6" class="box"/><text x="54" y="169" class="head">构建请求</text>
  <text x="54" y="203" class="small">命令、项目与属性</text>
  <text x="54" y="230" class="small">配置相关输入</text>
  <rect x="306" y="134" width="260" height="122" rx="6" class="blue"/><text x="324" y="169" class="head">配置模型</text>
  <text x="324" y="203" class="small">可复用：Configuration Cache</text>
  <text x="324" y="230" class="small">否则重新配置模型</text>
  <rect x="626" y="134" width="220" height="122" rx="6" class="box"/><text x="644" y="169" class="head">任务输入与输出</text>
  <text x="644" y="203" class="small">快照未变且输出有效</text>
  <text x="644" y="230" class="small">可判 UP-TO-DATE</text>
  <rect x="906" y="134" width="178" height="122" rx="6" class="focus"/><text x="924" y="169" class="head">跳过动作</text>
  <text x="924" y="203" class="small">复用工作区</text>
  <text x="924" y="230" class="small">已有输出</text>
  <path d="M736 256V330" class="line"/>
  <text x="856" y="177" class="small">有效</text>
  <text x="754" y="300" class="small">需重建</text>
  <path d="M846 391H906" class="line"/>
  <rect x="626" y="330" width="220" height="122" rx="6" class="box"/><text x="644" y="365" class="head">需要生成输出</text>
  <text x="644" y="399" class="small">可缓存且键命中？</text>
  <text x="644" y="426" class="small">否则执行任务动作</text>
  <rect x="906" y="330" width="178" height="122" rx="6" class="box"/><text x="924" y="365" class="head">恢复或执行</text>
  <text x="924" y="399" class="small">FROM-CACHE</text>
  <text x="924" y="426" class="small">或实际生成</text>
  <text x="36" y="370" class="small">实验输入：buildVersion=1.0.0</text>
  <text x="36" y="407" class="small">改成 1.0.1 后，资源必须变化。</text>
  <text x="36" y="494" class="small">构建缓存存任务输出；依赖下载缓存与 Daemon / JVM 预热另有作用，不能互相等同。</text>
</svg>
