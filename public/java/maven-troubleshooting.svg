<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="480" viewBox="0 0 1120 480" role="img" aria-labelledby="maven-troubleshooting-title maven-troubleshooting-desc">
  <title id="maven-troubleshooting-title">先还原失败，再做可验证的修复</title><desc id="maven-troubleshooting-desc">失败后定位阶段、还原有效输入、针对性修改并用同一命令及最终产物复验。不同症状对应不同证据，而不是一律清空缓存。</desc>
  <defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#74818a"/></marker>
  <style>text{font:18px Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#27343b}.title{font-size:25px;font-weight:700}.head{font-size:20px;font-weight:600}.small{font-size:16px;fill:#52616a}.box{fill:#fff;stroke:#bac4c9;stroke-width:1.4}.focus{fill:#e4f3ee;stroke:#3b8573;stroke-width:1.5}.blue{fill:#eef5ff;stroke:#a5b9cf;stroke-width:1.4}.line{fill:none;stroke:#74818a;stroke-width:1.5;marker-end:url(#arrow)}.rule{stroke:#d1d9dd;stroke-width:1}</style></defs>
  <rect width="1120" height="480" fill="#f7f9fa"/>
  <text x="36" y="45" class="title">先还原失败，再做可验证的修复</text>
  <text x="36" y="82" class="small">保留首个错误与完整异常；每次针对已定位原因改配置，然后复验相同输入。</text>
  <path d="M246 200H306" class="line"/><path d="M526 200H586" class="line"/><path d="M806 200H866" class="line"/>
  <rect x="36" y="140" width="210" height="122" rx="6" class="box"/><text x="54" y="175" class="head">定位失败阶段</text>
  <text x="54" y="209" class="small">解析、编译、测试</text>
  <text x="54" y="236" class="small">打包或运行链接</text>
  <rect x="306" y="140" width="220" height="122" rx="6" class="blue"/><text x="324" y="175" class="head">还原有效输入</text>
  <text x="324" y="209" class="small">生效模型、版本</text>
  <text x="324" y="236" class="small">仓库与最终产物</text>
  <rect x="586" y="140" width="220" height="122" rx="6" class="box"/><text x="604" y="175" class="head">修改已定位原因</text>
  <text x="604" y="209" class="small">纠正绑定与配置</text>
  <text x="604" y="236" class="small">避免整库清缓存</text>
  <rect x="866" y="140" width="218" height="122" rx="6" class="focus"/><text x="884" y="175" class="head">同一入口复验</text>
  <text x="884" y="209" class="small">测试数量与结果</text>
  <text x="884" y="236" class="small">运行环境与包结构</text>
  <path d="M36 307H1084" class="rule"/>
  <text x="36" y="349" class="small">编译：Maven / JDK 版本、effective-pom</text>
  <text x="36" y="390" class="small">下载：坐标、HTTP 状态、仓库或 mirror ID</text>
  <text x="590" y="349" class="small">链接：依赖树、JAR 内容、运行 classpath</text>
  <text x="590" y="390" class="small">测试：Surefire / Failsafe 报告与跳过参数</text>
  <text x="36" y="450" class="small">退出码为 0 不证明测试已执行；编译依赖正确不证明最终部署包正确。</text>
</svg>
