<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="760" viewBox="0 0 1240 760" role="img" aria-labelledby="plugin-title plugin-desc">
  <title id="plugin-title">MyBatis插件与缓存的拦截边界</title>
  <desc id="plugin-desc">Mapper调用进入执行器代理。缓存命中可直接返回结果，未命中才进入语句准备、参数绑定、JDBC执行和结果映射。执行器的总耗时不能等同数据库执行耗时；同一目标先注册A再B时B位于外层。</desc>
  <defs><marker id="plugin-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#74818a"/></marker><style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#27343b;font-size:18px}.title{font-size:24px;font-weight:700}.head{font-size:20px;font-weight:600}.small{font-size:16px;fill:#52616a}.box{fill:#fff;stroke:#bac4c9;stroke-width:1.3;rx:6}.focus{fill:#e4f3ee;stroke:#3b8573;stroke-width:1.5;rx:6}.line{fill:none;stroke:#74818a;stroke-width:1.5;marker-end:url(#plugin-arrow)}</style></defs>
  <rect width="1240" height="760" fill="#f7f9fa"/><text x="36" y="44" class="title">记录的位置不同，耗时和次数的含义也不同</text><text x="36" y="80" class="small">普通查询主路径示意；缓存层按配置启用，游标、嵌套查询、REUSE与BATCH需要单独核对。</text>
  <path d="M316 210H420" class="line"/><path d="M780 210H940" class="line"/>
  <path d="M1072 280V390" class="line"/><path d="M940 452H780" class="line"/><path d="M420 452H316" class="line"/>
  <path d="M600 280V326Q600 334 592 334H176Q168 334 168 342V390" class="line"/>
  <rect x="36" y="144" width="280" height="136" class="box"/><text x="56" y="186" class="head">Mapper调用</text><text x="56" y="224" class="small">选择statement与参数</text><text x="56" y="260" class="small">不是每次都访问数据库</text>
  <rect x="420" y="144" width="360" height="136" class="focus"/><text x="440" y="186" class="head">Executor代理与缓存路径</text><text x="440" y="224" class="small">观测本次执行器调用总耗时</text><text x="440" y="260" class="small">同一会话可命中本地缓存</text>
  <rect x="940" y="144" width="264" height="136" class="box"/><text x="960" y="186" class="head">StatementHandler</text><text x="960" y="224" class="small">prepare实际准备语句</text><text x="960" y="260" class="small">缓存命中可绕过这里</text>
  <rect x="940" y="390" width="264" height="126" class="box"/><text x="960" y="430" class="head">参数绑定与JDBC</text><text x="960" y="468" class="small">ParameterHandler绑定</text><text x="960" y="500" class="small">驱动调用数据库执行</text>
  <rect x="420" y="390" width="360" height="126" class="box"/><text x="440" y="430" class="head">ResultSetHandler</text><text x="440" y="468" class="small">读取结果集，映射对象</text><text x="440" y="500" class="small">映射成本也在执行器耗时内</text>
  <rect x="36" y="390" width="280" height="126" class="focus"/><text x="56" y="430" class="head">查询结果返回</text><text x="56" y="468" class="small">缓存命中或数据库返回</text><text x="56" y="500" class="small">不等于外层事务已提交</text>
  <text x="804" y="186" class="small">未命中</text><text x="1078" y="342" class="small">执行</text><text x="352" y="320" class="small">缓存命中：直接返回</text>
  <path d="M36 570H1204" stroke="#bac4c9"/><text x="36" y="610" class="head">同一目标：先注册A，再注册B</text><text x="36" y="650">B进入 → A进入 → 目标 → A退出 → B退出</text><text x="36" y="694" class="small">这里只表达匹配同一方法的正常调用；代理内部自调用不会自动重新经过外部代理。</text><text x="36" y="730" class="small">失败时保留原异常，一次拦截只执行一次proceed；观测失败不应触发SQL重试。</text>
</svg>
