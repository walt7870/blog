<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="540" viewBox="0 0 1120 540" role="img" aria-labelledby="maven-lifecycle-title maven-lifecycle-desc">
  <title id="maven-lifecycle-title">到 package 为止，不会继续执行 install 和 deploy</title><desc id="maven-lifecycle-desc">展示默认生命周期按目标阶段停止，插件绑定执行动作；clean是另一生命周期。verify需要绑定相应校验，不会自动执行未配置集成测试。</desc>
  <defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#74818a"/></marker>
  <style>text{font:18px Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#27343b}.title{font-size:25px;font-weight:700}.head{font-size:20px;font-weight:600}.small{font-size:16px;fill:#52616a}.box{fill:#fff;stroke:#bac4c9;stroke-width:1.4}.focus{fill:#e4f3ee;stroke:#3b8573;stroke-width:1.5}.blue{fill:#eef5ff;stroke:#a5b9cf;stroke-width:1.4}.line{fill:none;stroke:#74818a;stroke-width:1.5;marker-end:url(#arrow)}.rule{stroke:#d1d9dd;stroke-width:1}</style></defs>
  <rect width="1120" height="540" fill="#f7f9fa"/>
  <text x="36" y="45" class="title">到 package 为止，不会继续执行 install 和 deploy</text>
  <text x="36" y="82" class="small">mvn package：从默认生命周期起点执行到 package；图只列关键阶段，中间阶段省略。</text>
  <path d="M216 191H276" class="line"/>
  <path d="M446 191H506" class="line"/>
  <path d="M676 191H736" class="line"/>
  <rect x="36" y="132" width="180" height="120" rx="6" class="box"/><text x="54" y="167" class="head">validate</text>
  <text x="54" y="201" class="small">模型校验入口</text>
  <text x="54" y="228" class="small">按已绑定目标</text>
  <rect x="276" y="132" width="170" height="120" rx="6" class="box"/><text x="294" y="167" class="head">compile</text>
  <text x="294" y="201" class="small">compiler:compile</text>
  <text x="294" y="228" class="small">编译主代码</text>
  <rect x="506" y="132" width="170" height="120" rx="6" class="box"/><text x="524" y="167" class="head">test</text>
  <text x="524" y="201" class="small">surefire:test</text>
  <text x="524" y="228" class="small">执行单元测试</text>
  <rect x="736" y="132" width="348" height="120" rx="6" class="focus"/><text x="754" y="167" class="head">package</text>
  <text x="754" y="201" class="small">jar:jar / war:war 等</text>
  <text x="754" y="228" class="small">由 packaging 与插件配置决定</text>
  <path d="M36 299H1084" class="rule"/>
  <text x="36" y="340" class="small">目标改为 verify：继续到校验阶段；集成测试与门禁需要实际的插件执行绑定。</text>
  <text x="36" y="380" class="small">目标改为 install：把项目产物安装到本地仓库；deploy 再发布到指定远程仓库。</text>
  <rect x="36" y="416" width="486" height="86" rx="6" class="box"/><text x="54" y="451" class="head">clean 生命周期</text>
  <text x="54" y="485" class="small">清理输出；mvn clean package 才会先清理</text>
  <rect x="586" y="416" width="498" height="86" rx="6" class="box"/><text x="604" y="451" class="head">直接 plugin:goal</text>
  <text x="604" y="485" class="small">执行某个目标，不承诺自动补齐此前全部阶段</text>
</svg>
