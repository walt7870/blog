<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="480" viewBox="0 0 1120 480" role="img" aria-labelledby="maven-position-title maven-position-desc">
  <title id="maven-position-title">POM 与命令共同决定插件执行</title><desc id="maven-position-desc">源码是插件输入，POM是项目模型，命令请求生命周期阶段，插件执行编译测试打包；仓库提供所需构件，不直接生成项目产物。</desc>
  <defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#74818a"/></marker>
  <style>text{font:18px Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#27343b}.title{font-size:25px;font-weight:700}.head{font-size:20px;font-weight:600}.small{font-size:16px;fill:#52616a}.box{fill:#fff;stroke:#bac4c9;stroke-width:1.4}.focus{fill:#e4f3ee;stroke:#3b8573;stroke-width:1.5}.blue{fill:#eef5ff;stroke:#a5b9cf;stroke-width:1.4}.line{fill:none;stroke:#74818a;stroke-width:1.5;marker-end:url(#arrow)}.rule{stroke:#d1d9dd;stroke-width:1}</style></defs>
  <rect width="1120" height="480" fill="#f7f9fa"/>
  <text x="36" y="45" class="title">POM 与命令共同决定插件执行</text>
  <text x="36" y="82" class="small">mvn package 请求到打包阶段；模型、源码和外部构件提供执行所需输入。</text>
  <path d="M246 198H306" class="line"/>
  <path d="M526 198H586" class="line"/>
  <path d="M806 198H866" class="line"/>
  <rect x="36" y="138" width="210" height="122" rx="6" class="blue"/><text x="54" y="173" class="head">POM + 命令</text>
  <text x="54" y="207" class="small">坐标、依赖、插件</text>
  <text x="54" y="234" class="small">请求 package</text>
  <rect x="306" y="138" width="220" height="122" rx="6" class="box"/><text x="324" y="173" class="head">生命周期计划</text>
  <text x="324" y="207" class="small">按 packaging 与绑定</text>
  <text x="324" y="234" class="small">选择插件目标</text>
  <rect x="586" y="138" width="220" height="122" rx="6" class="box"/><text x="604" y="173" class="head">插件动作</text>
  <text x="604" y="207" class="small">处理资源、编译</text>
  <text x="604" y="234" class="small">运行测试与组包</text>
  <rect x="866" y="138" width="218" height="122" rx="6" class="focus"/><text x="884" y="173" class="head">本项目产物</text>
  <text x="884" y="207" class="small">target/*.jar</text>
  <text x="884" y="234" class="small">不是自动的依赖全集</text>
  <path d="M416 365V260" class="line"/>
  <path d="M696 365V260" class="line"/>
  <rect x="306" y="365" width="220" height="86" rx="6" class="box"/><text x="324" y="400" class="head">仓库</text>
  <text x="324" y="434" class="small">提供插件与依赖</text>
  <rect x="586" y="365" width="220" height="86" rx="6" class="box"/><text x="604" y="400" class="head">源码与资源</text>
  <text x="604" y="434" class="small">作为实际动作的输入</text>
</svg>
