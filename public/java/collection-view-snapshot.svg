<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="760" viewBox="0 0 1240 760" role="img" aria-labelledby="java-list-title java-list-desc">
  <title id="java-list-title">Java集合只读视图与浅快照</title>
  <desc id="java-list-desc">source和unmodifiableList视图访问同一个列表。List.copyOf在复制时形成独立不可修改的列表结构，但元素引用仍共享。原列表增加第二项只影响视图；修改第一项StringBuilder会被两边看到。</desc>
  <defs><marker id="java-list-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#74818a"/></marker><style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#27343b;font-size:18px}.title{font-size:24px;font-weight:700}.head{font-size:20px;font-weight:600}.small{font-size:16px;fill:#52616a}.box{fill:#fff;stroke:#bac4c9;stroke-width:1.3;rx:6}.focus{fill:#e4f3ee;stroke:#3b8573;stroke-width:1.5;rx:6}.line{fill:none;stroke:#74818a;stroke-width:1.5;marker-end:url(#java-list-arrow)}.dash{stroke-dasharray:5 4}.mask{fill:#f7f9fa}</style></defs>
  <rect width="1240" height="760" fill="#f7f9fa"/>
  <text x="36" y="44" class="title">限制容器修改，不等于复制整个对象图</text><text x="36" y="80" class="small">先复制只有一项的列表，再向source添加第二项，最后修改第一项的StringBuilder内容。</text>
  <path d="M296 208H444" class="line"/>
  <path d="M296 392H364Q372 392 372 384V248Q372 240 380 240H444" class="line"/>
  <path d="M732 208H920" class="line dash"/>
  <path d="M540 272V520" class="line"/>
  <path d="M1060 272V464Q1060 472 1052 472H732Q724 472 724 480V520" class="line"/>
  <rect x="312" y="168" width="116" height="28" class="mask"/><text x="370" y="188" class="small" text-anchor="middle">原始引用</text>
  <rect x="748" y="168" width="156" height="28" class="mask"/><text x="826" y="188" class="small" text-anchor="middle">在添加第②项前复制</text>
  <rect x="556" y="352" width="204" height="28" class="mask"/><text x="568" y="372" class="small">两个容器仍引用同一元素①</text>
  <rect x="36" y="160" width="260" height="112" class="box"/><text x="56" y="204" class="head">source</text><text x="56" y="244" class="small">可调用add、set、remove</text>
  <rect x="36" y="344" width="260" height="112" class="box"/><text x="56" y="388" class="head">只读视图view</text><text x="56" y="428" class="small">unmodifiableList(source)</text>
  <rect x="444" y="160" width="288" height="112" class="focus"/><text x="464" y="204" class="head">原列表结构：2项</text><text x="464" y="244" class="small">①可变对象引用　②新加的元素</text>
  <rect x="920" y="160" width="284" height="112" class="box"/><text x="940" y="204" class="head">copyOf快照：1项</text><text x="940" y="244" class="small">①可变对象引用</text>
  <text x="36" y="512" class="small">从view读取会看到原列表新增的②。</text><text x="36" y="544" class="small">从view修改容器会抛异常。</text>
  <text x="800" y="320" class="small">新增②不影响快照结构。</text><text x="800" y="352" class="small">快照容器不支持修改。</text>
  <rect x="444" y="520" width="360" height="112" class="focus"/><text x="464" y="564" class="head">元素①：同一个StringBuilder</text><text x="464" y="604" class="small">内容从paid修改为paid-v2</text>
  <path d="M36 700H1204" stroke="#bac4c9"/><text x="36" y="736" class="small">实线：当前访问或元素引用；虚线：复制时的关系。示意逻辑合同，不规定JDK内部是否复用不可修改容器实例。</text>
</svg>
