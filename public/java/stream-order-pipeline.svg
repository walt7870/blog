<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="760" viewBox="0 0 1240 760" role="img" aria-labelledby="java-stream-title java-stream-desc">
  <title id="java-stream-title">Java订单筛选的Stream管线与终端操作</title>
  <desc id="java-stream-desc">内存列表有101待支付2000分、102已支付5000分和103已支付3000分。创建流并连接两个filter只是定义处理，终端toList执行所需筛选得到102和103，源列表仍为三项。结果列表不可修改但不深复制元素。对结果重新创建流累计得到8000分，原Stream终结后不能再用。</desc>
  <defs><marker id="java-stream-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#74818a"/></marker><style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#27343b;font-size:18px}.title{font-size:24px;font-weight:700}.head{font-size:20px;font-weight:600}.small{font-size:16px;fill:#52616a}.box{fill:#fff;stroke:#bac4c9;stroke-width:1.3;rx:6}.focus{fill:#e4f3ee;stroke:#3b8573;stroke-width:1.5;rx:6}.line{fill:none;stroke:#74818a;stroke-width:1.5;marker-end:url(#java-stream-arrow)}.mask{fill:#f7f9fa}</style></defs>
  <rect width="1240" height="760" fill="#f7f9fa"/>
  <text x="36" y="44" class="title">先描述筛选，再由终端操作计算结果</text>
  <text x="36" y="80" class="small">示例入口拒绝null列表和null元素，允许零项列表；这里仅画内存纯计算，不代表数据库查询或真实文件导出。</text>
  <path d="M280 234H388" class="line"/><path d="M696 234H804" class="line"/>
  <path d="M984 306V470" class="line"/>
  <path d="M804 542H696" class="line"/>
  <rect x="292" y="188" width="84" height="28" class="mask"/><text x="334" y="208" class="small" text-anchor="middle">stream()</text>
  <rect x="708" y="188" width="84" height="28" class="mask"/><text x="750" y="208" class="small" text-anchor="middle">toList()</text>
  <text x="1004" y="392" class="small">得到结果</text>
  <rect x="708" y="498" width="84" height="28" class="mask"/><text x="750" y="518" class="small" text-anchor="middle">新建流</text>
  <rect x="36" y="150" width="244" height="192" class="box"/>
  <text x="56" y="194" class="head">来源：orders，3项</text><text x="56" y="234" class="small">101：PENDING，2000分</text><text x="56" y="270" class="small">102：PAID，5000分</text><text x="56" y="306" class="small">103：PAID，3000分</text>
  <rect x="388" y="150" width="308" height="156" class="box"/>
  <text x="408" y="194" class="head">中间操作：两个filter</text><text x="408" y="234" class="small">状态为PAID，再检查金额大于0</text><text x="408" y="274" class="small">此时只是连接管线，尚未收集结果</text>
  <rect x="804" y="150" width="400" height="156" class="focus"/>
  <text x="824" y="194" class="head">终端操作：toList()</text><text x="824" y="234" class="small">执行结果所需的处理</text><text x="824" y="274" class="small">这条Stream随后不可再次使用</text>
  <rect x="804" y="470" width="400" height="144" class="focus"/>
  <text x="824" y="514" class="head">结果：paid，2项</text><text x="824" y="554" class="small">102、103；来源orders仍有3项</text><text x="824" y="590" class="small">结果列表不可修改，不深复制元素</text>
  <rect x="388" y="470" width="308" height="144" class="box"/>
  <text x="408" y="514" class="head">另一次金额归约</text><text x="408" y="554" class="small">5000 + 3000 = 8000分</text><text x="408" y="590" class="small">addExact在溢出时失败</text>
  <text x="36" y="430" class="small">List是数据容器；Stream是处理描述。</text>
  <text x="36" y="466" class="small">规则不修改订单，不发送通知。</text>
  <path d="M36 700H1204" stroke="#bac4c9"/>
  <text x="36" y="736" class="small">必须发生的校验与外部动作应显式执行，不能依赖可能被优化省略的peek/map；并行执行还需检查副作用与合并规则。</text>
</svg>
