<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="540" viewBox="0 0 1120 540" role="img" aria-labelledby="maven-multi-module-title maven-multi-module-desc">
  <title id="maven-multi-module-title">继承、聚合和模块依赖是三种关系</title><desc id="maven-multi-module-desc">根POM可聚合并被子模块继承，真实模块依赖形成Reactor顺序。箭头表示消费方依赖提供方，common先构建。</desc>
  <defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#74818a"/></marker>
  <style>text{font:18px Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#27343b}.title{font-size:25px;font-weight:700}.head{font-size:20px;font-weight:600}.small{font-size:16px;fill:#52616a}.box{fill:#fff;stroke:#bac4c9;stroke-width:1.4}.focus{fill:#e4f3ee;stroke:#3b8573;stroke-width:1.5}.blue{fill:#eef5ff;stroke:#a5b9cf;stroke-width:1.4}.line{fill:none;stroke:#74818a;stroke-width:1.5;marker-end:url(#arrow)}.rule{stroke:#d1d9dd;stroke-width:1}</style></defs>
  <rect width="1120" height="540" fill="#f7f9fa"/>
  <text x="36" y="45" class="title">继承、聚合和模块依赖是三种关系</text>
  <text x="36" y="82" class="small">parent 复用配置；modules 选择聚合项目；真实依赖让 Reactor 先构建生产者。</text>
  <rect x="36" y="132" width="486" height="118" rx="6" class="blue"/><text x="54" y="167" class="head">根 POM：shop-platform</text>
  <text x="54" y="201" class="small">packaging=pom；modules 列出各项目</text>
  <text x="54" y="228" class="small">子模块用 parent 继承公共配置</text>
  <rect x="586" y="132" width="498" height="118" rx="6" class="box"/><text x="604" y="167" class="head">两个机制可以分开</text>
  <text x="604" y="201" class="small">聚合根不必是父 POM</text>
  <text x="604" y="228" class="small">只在管理表列出坐标，不建立模块依赖</text>
  <path d="M316 365H446" class="line"/>
  <rect x="36" y="306" width="280" height="118" rx="6" class="box"/><text x="54" y="341" class="head">order-service</text>
  <text x="54" y="375" class="small">声明依赖 shop-common</text>
  <text x="54" y="402" class="small">消费方</text>
  <rect x="446" y="306" width="260" height="118" rx="6" class="focus"/><text x="464" y="341" class="head">shop-common</text>
  <text x="464" y="375" class="small">公共库生产者</text>
  <text x="464" y="402" class="small">先于订单模块构建</text>
  <text x="836" y="341" class="head">由依赖推导构建顺序</text>
  <text x="854" y="375" class="small">common → order</text>
  <text x="854" y="402" class="small">不是代码调用方向</text>
  <text x="334" y="346" class="small">依赖</text>
  <text x="36" y="476" class="small">mvn install -pl order-service -am：选择订单及其所需模块。</text>
  <text x="36" y="510" class="small">-rf 只从选定位置恢复，未必补建已跳过的上游；缺少上游产物时回根工程用 -pl 与 -am。</text>
</svg>
