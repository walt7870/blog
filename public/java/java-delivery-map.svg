<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="480" viewBox="0 0 1120 480" role="img" aria-labelledby="java-delivery-map-title java-delivery-map-desc">
  <title id="java-delivery-map-title">订单源码经过构建，才成为运行中的程序</title><desc id="java-delivery-map-desc">展示源码、构建工具、JAR与JVM的关系，以及构建和运行环境分别需要验证的边界。</desc>
  <defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#74818a"/></marker>
  <style>text{font:18px Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#27343b}.title{font-size:25px;font-weight:700}.head{font-size:20px;font-weight:600}.small{font-size:16px;fill:#52616a}.box{fill:#fff;stroke:#bac4c9;stroke-width:1.4}.focus{fill:#e4f3ee;stroke:#3b8573;stroke-width:1.5}.blue{fill:#eef5ff;stroke:#a5b9cf;stroke-width:1.4}.line{fill:none;stroke:#74818a;stroke-width:1.5;marker-end:url(#arrow)}.rule{stroke:#d1d9dd;stroke-width:1}</style></defs>
  <rect width="1120" height="480" fill="#f7f9fa"/>
  <text x="36" y="45" class="title">订单源码经过构建，才成为运行中的程序</text>
  <text x="36" y="82" class="small">同一段业务规则，分别经过类型检查、测试、打包与运行；各阶段的成功含义不同。</text>
  <path d="M246 200H306" class="line"/>
  <path d="M516 200H576" class="line"/>
  <path d="M786 200H846" class="line"/>
  <rect x="36" y="140" width="210" height="128" rx="6" class="box"/><text x="54" y="175" class="head">源码与规则</text>
  <text x="54" y="209" class="small">金额单位、数量校验</text>
  <text x="54" y="236" class="small">OrderTotal.java</text>
  <rect x="306" y="140" width="210" height="128" rx="6" class="blue"/><text x="324" y="175" class="head">构建工具</text>
  <text x="324" y="209" class="small">解析依赖、编译、测试</text>
  <text x="324" y="236" class="small">Maven / Gradle</text>
  <rect x="576" y="140" width="210" height="128" rx="6" class="box"/><text x="594" y="175" class="head">JAR 与资源</text>
  <text x="594" y="209" class="small">class、资源、元数据</text>
  <text x="594" y="236" class="small">普通包或重打包</text>
  <rect x="846" y="140" width="238" height="128" rx="6" class="focus"/><text x="864" y="175" class="head">目标运行时</text>
  <text x="864" y="209" class="small">JVM 加载并执行</text>
  <text x="864" y="236" class="small">JDK、参数、本地库</text>
  <path d="M36 318H1084" class="rule"/>
  <text x="36" y="354" class="small">编译成功：语法与所见 API 相容。</text>
  <text x="36" y="389" class="small">测试通过：已执行用例满足预期，不证明全部业务正确。</text>
  <text x="590" y="354" class="small">打包成功：得到指定结构，不保证依赖全被装入。</text>
  <text x="590" y="389" class="small">运行可用：还需验证目标环境、资源与外部服务。</text>
  <text x="36" y="447" class="small">示例：金额错查规则；类缺失查依赖与包；请求慢先定位等待、计算和资源，不能一律改 GC。</text>
</svg>
