<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="780" viewBox="0 0 1120 780" role="img" aria-labelledby="title desc">
<title id="title">订单模型的类关系与 UML 符号</title><desc id="desc">订单服务依赖订单和仓储，SQL仓储实现接口，订单组合明细并关联客户。底部列出依赖、关联、共享聚合、组合、泛化和实现六种符号。</desc>
<defs>
<marker id="open" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#52695c" stroke-width="1.2"/></marker>
<marker id="triangle" viewBox="0 0 14 14" refX="13" refY="7" markerWidth="13" markerHeight="13" orient="auto"><path d="M1 1L13 7L1 13Z" fill="#f8fafc" stroke="#52695c" stroke-width="1.2"/></marker>
<marker id="solid-diamond" viewBox="0 0 16 12" refX="0" refY="6" markerWidth="14" markerHeight="12" orient="auto"><path d="M0 6L8 0L16 6L8 12Z" fill="#52695c"/></marker>
<marker id="hollow-diamond" viewBox="0 0 16 12" refX="0" refY="6" markerWidth="14" markerHeight="12" orient="auto"><path d="M0 6L8 0L16 6L8 12Z" fill="#f8fafc" stroke="#52695c" stroke-width="1.1"/></marker>
</defs>
<style>text{font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#24362e}.title{font-size:25px;font-weight:700}.h{font-size:19px;font-weight:700}.t{font-size:16px}.note{font-size:15px;fill:#596b62}.code{font-family:Consolas,monospace;font-size:14px}.box{fill:#fff;stroke:#cbd5d0}.line{fill:none;stroke:#52695c;stroke-width:1.7}.div{stroke:#cbd5d0}</style>
<rect width="1120" height="780" fill="#f8fafc"/><text class="title" x="56" y="58">取消订单用例：类图表达静态关系</text><text class="note" x="56" y="91">示例约定：已创建订单至少有一项明细；一个订单项同时只属于一个订单</text>
<path class="line" d="M316 210H420" stroke-dasharray="5 4" marker-end="url(#open)"/><path class="line" d="M186 280V385" stroke-dasharray="5 4" marker-end="url(#open)"/>
<path class="line" d="M680 210H800" marker-start="url(#solid-diamond)"/>
<path class="line" d="M550 280V322Q550 330 558 330H922Q930 330 930 338V385"/>
<path class="line" d="M420 453H316" stroke-dasharray="5 4" marker-end="url(#triangle)"/>
<rect class="box" x="56" y="145" width="260" height="135" rx="5"/><text class="h" x="115" y="177">OrderService</text><path class="div" d="M56 193H316"/><text class="code" x="76" y="224">+ cancel(id): Result</text><text class="note" x="76" y="256">应用用例与事务编排</text>
<rect x="420" y="145" width="260" height="135" rx="5" fill="#e6f3e9" stroke="#759681"/><text class="h" x="522" y="177">Order</text><path class="div" d="M420 193H680"/><text class="code" x="440" y="224">- status: OrderStatus</text><text class="code" x="440" y="255">+ cancel(): void</text>
<rect class="box" x="800" y="145" width="264" height="135" rx="5"/><text class="h" x="885" y="177">OrderLine</text><path class="div" d="M800 193H1064"/><text class="code" x="820" y="224">- quantity: int</text><text class="note" x="820" y="256">通过订单行为修改</text>
<text class="note" x="341" y="193">依赖</text><text class="note" x="205" y="338">依赖</text><text class="note" x="710" y="190">1</text><text class="note" x="755" y="190">1..*</text><text class="note" x="706" y="244">组合</text>
<text class="note" x="575" y="314">0..*</text><text class="note" x="945" y="365">1</text><text class="note" x="696" y="315">客户关联（省略导航）</text>
<rect class="box" x="56" y="385" width="260" height="135" rx="5"/><text class="note" x="142" y="412">«interface»</text><text class="h" x="107" y="443">OrderRepository</text><path class="div" d="M56 459H316"/><text class="code" x="76" y="492">+ save(order): Result</text>
<rect class="box" x="420" y="385" width="260" height="135" rx="5"/><text class="h" x="458" y="424">SqlOrderRepository</text><path class="div" d="M420 442H680"/><text class="code" x="440" y="475">+ save(order): Result</text><text class="note" x="440" y="504">数据库实现</text>
<rect class="box" x="800" y="385" width="264" height="135" rx="5"/><text class="h" x="884" y="424">Customer</text><path class="div" d="M800 442H1064"/><text class="code" x="820" y="475">- id: CustomerId</text><text class="note" x="820" y="504">订单保存其关联标识</text><text class="note" x="348" y="435">实现</text>
<path d="M56 560H1064" stroke="#dce3df"/><text class="h" x="56" y="596">符号表</text><text class="note" x="188" y="596">菱形在整体端；三角在一般类型或接口端；普通依赖用开放箭头</text>
<path class="line" d="M72 640H192" stroke-dasharray="5 4" marker-end="url(#open)"/><text class="t" x="218" y="646">依赖</text>
<path class="line" d="M424 640H544"/><text class="t" x="570" y="646">关联</text>
<path class="line" d="M778 640H898" marker-start="url(#hollow-diamond)"/><text class="t" x="924" y="646">共享聚合</text>
<path class="line" d="M72 696H192" marker-start="url(#solid-diamond)"/><text class="t" x="218" y="702">组合</text>
<path class="line" d="M424 696H544" marker-end="url(#triangle)"/><text class="t" x="570" y="702">泛化</text>
<path class="line" d="M778 696H898" stroke-dasharray="5 4" marker-end="url(#triangle)"/><text class="t" x="924" y="702">实现</text>
<text class="note" x="56" y="752">共享聚合需额外约定语义；组合不等于取消时删库，字段和线型也不能替代业务不变量。</text>
</svg>
