<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="600" viewBox="0 0 1120 600" role="img" aria-labelledby="title desc">
  <title id="title">DDD 从业务语言到规则验证</title>
  <desc id="desc">以订单为例，业务场景形成统一语言，再划分限界上下文，在上下文内识别聚合和不变量，由应用用例协调，并通过业务反例验证。箭头表示设计推进路径。</desc>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" fill="#64748b"/></marker></defs>
  <style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#0f172a}.h{font-size:24px;font-weight:700}.n{font-size:20px;font-weight:700}.t{font-size:16px;fill:#475569}.b{fill:white;stroke:#cbd5e1;stroke-width:2}.l{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#a)}</style>
  <rect width="1120" height="600" fill="#f8fafc"/>
  <text x="48" y="52" class="h">DDD：让业务语言、模型边界和代码规则对应起来</text>
  <text x="48" y="84" class="t">沿一笔订单推进设计；箭头表示建模路径，不代表运行时调用。</text>
  <path class="l" d="M336 216H432"/><path class="l" d="M688 216H784"/>
  <path class="l" d="M928 280V360"/>
  <path class="l" d="M784 424H688"/><path class="l" d="M432 424H336"/>
  <rect class="b" x="48" y="152" width="288" height="128" rx="6"/>
  <text class="n" x="72" y="188">业务场景</text><text class="t" x="72" y="220">下单、付款、超时关闭</text><text class="t" x="72" y="248">确认时机、角色和失败结果</text>
  <rect class="b" x="432" y="152" width="256" height="128" rx="6"/>
  <text class="n" x="456" y="188">统一语言</text><text class="t" x="456" y="220">支付成功和订单已支付</text><text class="t" x="456" y="248">是两个边界中的事实</text>
  <rect class="b" x="784" y="152" width="288" height="128" rx="6"/>
  <text class="n" x="808" y="188">限界上下文</text><text class="t" x="808" y="220">订单、支付、库存各有模型</text><text class="t" x="808" y="248">接口/事件需翻译语义</text>
  <rect x="784" y="360" width="288" height="128" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text class="n" x="808" y="396">聚合与不变量</text><text class="t" x="808" y="428">订单根保护明细和状态</text><text class="t" x="808" y="456">提交后不能随意改价</text>
  <rect class="b" x="432" y="360" width="256" height="128" rx="6"/>
  <text class="n" x="456" y="396">应用用例</text><text class="t" x="456" y="428">加载模型，调用业务方法</text><text class="t" x="456" y="456">协调事务、接口与事件</text>
  <rect class="b" x="48" y="360" width="288" height="128" rx="6"/>
  <text class="n" x="72" y="396">业务反例验证</text><text class="t" x="72" y="428">重复支付、支付与关闭竞争</text><text class="t" x="72" y="456">故障后重试与补偿</text>
  <text class="t" x="48" y="548">战略设计明确语义与协作边界；战术设计把规则放进实体、值对象、聚合和领域服务。</text>
  <text class="t" x="48" y="576">可以在模块化单体中落地；上下文、聚合与微服务没有一一对应关系。</text>
</svg>
