<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="640" viewBox="0 0 1120 640" role="img" aria-labelledby="title desc">
<title id="title">分层的职责与依赖方向</title><desc id="desc">左侧按订单取消说明四类职责；右侧区分传统源码依赖与依赖倒置。层是代码职责，不表示独立部署。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#6b7d75"/></marker></defs>
<style>text{font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#24362e}.title{font-size:25px;font-weight:700}.h{font-size:20px;font-weight:700}.t{font-size:17px}.note{font-size:16px;fill:#596b62}.box{fill:#fff;stroke:#cbd5d0}.line{fill:none;stroke:#6b7d75;stroke-width:1.8;marker-end:url(#arrow)}</style>
<rect width="1120" height="640" fill="#f8fafc"/>
<text class="title" x="56" y="58">分层：先分清职责，再约定源码依赖</text>
<text class="note" x="56" y="90">例：客户取消待付款订单；图中箭头为源码依赖，不是网络请求</text>
<text class="h" x="56" y="145">职责分工</text>
<rect class="box" x="56" y="170" width="490" height="72" rx="5"/><text class="h" x="76" y="199">表示层</text><text class="t" x="220" y="199">解析 HTTP 与服务端身份</text><text class="note" x="220" y="224">转换参数与响应</text>
<rect class="box" x="56" y="254" width="490" height="72" rx="5"/><text class="h" x="76" y="283">应用层</text><text class="t" x="220" y="283">授权、加载、事务编排</text><text class="note" x="220" y="308">调用订单行为与仓储</text>
<rect x="56" y="338" width="490" height="72" rx="5" fill="#e6f3e9" stroke="#759681"/><text class="h" x="76" y="367">业务 / 领域</text><text class="t" x="220" y="367">判断状态与取消规则</text><text class="note" x="220" y="392">不变量由提交条件落实</text>
<rect class="box" x="56" y="422" width="490" height="72" rx="5"/><text class="h" x="76" y="451">技术实现</text><text class="t" x="220" y="451">SQL、映射与外部接口</text><text class="note" x="220" y="476">版本条件、回滚与可靠投递</text>
<text class="h" x="600" y="145">传统组织</text>
<rect class="box" x="600" y="170" width="200" height="72" rx="5"/><text class="t" x="623" y="212">业务服务</text>
<rect class="box" x="860" y="170" width="200" height="72" rx="5"/><text class="t" x="880" y="212">数据访问实现</text><path class="line" d="M800 206H860"/>
<text class="note" x="600" y="275">业务代码直接认识持久化实现</text>
<text class="h" x="600" y="330">采用依赖倒置</text>
<rect class="box" x="600" y="356" width="200" height="72" rx="5"/><text class="t" x="623" y="398">核心仓储契约</text>
<rect class="box" x="860" y="356" width="200" height="72" rx="5"/><text class="t" x="880" y="398">持久化实现</text><path class="line" d="M860 392H800"/>
<text class="note" x="600" y="462">外部实现依赖核心定义的合同</text>
<path d="M56 528H1064" stroke="#dce3df"/>
<text class="t" x="56" y="566">运行时仍可访问数据库；源码依赖与实际调用方向需要分别说明。</text>
<text class="note" x="56" y="599">代码层可以处于同一进程；层数、包名和网络部署单元没有固定对应关系。</text>
</svg>
