<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="760" viewBox="0 0 1120 760" role="img" aria-labelledby="title desc">
<title id="title">同一订单的结构、交互与状态</title><desc id="desc">类图表达订单与明细的组合；时序图表达应用向仓储提交并等待结果；状态片段表达待付款时取消成功或收到付款后进入已支付。三个视角共同核对实现。</desc>
<defs>
<marker id="filled" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#6b7d75"/></marker>
<marker id="diamond" viewBox="0 0 16 12" refX="0" refY="6" markerWidth="14" markerHeight="12" orient="auto"><path d="M0 6L8 0L16 6L8 12Z" fill="#52695c"/></marker>
</defs>
<style>text{font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#24362e}.title{font-size:25px;font-weight:700}.h{font-size:20px;font-weight:700}.t{font-size:17px}.note{font-size:16px;fill:#596b62}.box{fill:#fff;stroke:#cbd5d0}.line{fill:none;stroke:#6b7d75;stroke-width:1.8;marker-end:url(#filled)}</style>
<rect width="1120" height="760" fill="#f8fafc"/><text class="title" x="56" y="58">同一订单，用不同图回答不同问题</text><text class="note" x="56" y="91">以下均为局部示例，不把结构连线当作请求，也不省略成功所需的提交条件</text>
<text class="h" x="56" y="151">结构</text><text class="note" x="56" y="183">哪些对象组成订单？</text>
<path d="M550 183H780" stroke="#52695c" stroke-width="1.8" marker-start="url(#diamond)"/>
<rect class="box" x="310" y="130" width="240" height="100" rx="5"/><path d="M310 173H550" stroke="#cbd5d0"/><text class="h" x="390" y="159">Order</text><text class="t" x="336" y="204">+ cancel()</text>
<rect class="box" x="780" y="130" width="240" height="100" rx="5"/><path d="M780 173H1020" stroke="#cbd5d0"/><text class="h" x="848" y="159">OrderLine</text><text class="t" x="806" y="204">- quantity: int</text>
<text class="note" x="578" y="163">1</text><text class="note" x="728" y="163">1..*</text><text class="note" x="600" y="216">整体与部分</text>
<path d="M56 265H1064" stroke="#dce3df"/>
<text class="h" x="56" y="315">交互</text><text class="note" x="56" y="348">何时可以返回成功？</text>
<path d="M430 332V449M900 332V449" stroke="#b7c9bf" stroke-dasharray="5 5"/>
<rect class="box" x="310" y="290" width="240" height="42" rx="5"/><text class="t" x="360" y="318">订单应用服务</text>
<rect class="box" x="780" y="290" width="240" height="42" rx="5"/><text class="t" x="848" y="318">订单仓储</text>
<path class="line" d="M430 375H900"/><text class="note" x="510" y="361">按状态与版本条件提交取消</text>
<path class="line" d="M900 425H430" stroke-dasharray="6 5"/><text class="note" x="535" y="412">事务提交结果</text><text class="note" x="310" y="474">应用服务确认提交成功后，才向调用方返回成功。</text>
<path d="M56 502H1064" stroke="#dce3df"/>
<text class="h" x="56" y="557">状态</text><text class="note" x="56" y="590">哪些动作被允许？</text>
<path class="line" d="M550 603H780"/><path class="line" d="M430 636V674Q430 682 438 682H780"/>
<rect class="box" x="310" y="570" width="240" height="66" rx="6"/><text class="h" x="380" y="611">待付款</text>
<rect x="780" y="570" width="240" height="66" rx="6" fill="#e6f3e9" stroke="#759681"/><text class="h" x="850" y="611">已取消</text>
<rect class="box" x="780" y="652" width="240" height="60" rx="6"/><text class="h" x="850" y="690">已支付</text>
<text class="note" x="584" y="585">取消 [提交成功]</text><text class="note" x="502" y="666">接受支付事实 [提交成功]</text>
<text class="note" x="56" y="741">省略的发货、退款与取消后收款核对，需在各自流程展开；取消不等于删除订单。</text>
</svg>
