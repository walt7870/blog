<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="600" viewBox="0 0 1120 600" role="img" aria-labelledby="arch-evolution-title arch-evolution-desc">
  <title id="arch-evolution-title">架构按约束选择演进分支</title><desc id="arch-evolution-desc">从当前可运行系统和清楚的模块边界出发，规则复杂时加强领域模型，交付阻塞时评估独立部署，运行不稳定时补运行治理；这些分支可独立选择或组合，不是固定升级阶段。</desc>
  <defs><marker id="arch-evolution-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" fill="#657768"/></marker></defs>
  <rect width="1120" height="600" fill="#f8fafc"/>
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif" fill="#26372e">
    <text x="40" y="48" font-size="26" font-weight="600">演进分支：哪里受限，就验证哪里的改进</text>
    <text x="40" y="80" font-size="16" fill="#5d6f64">分支可组合，也可以长期保留单体；没有固定终点</text>
    <g fill="none" stroke="#657768" stroke-width="2" marker-end="url(#arch-evolution-arrow)"><path d="M360 292H464Q472 292 472 284V196Q472 188 480 188H584"/><path d="M360 324H584"/><path d="M360 356H464Q472 356 472 364V452Q472 460 480 460H584"/></g>
    <g fill="#fff" stroke="#c4cdd5"><rect x="40" y="252" width="320" height="144" rx="6" fill="#e5f3e9" stroke="#468363"/><rect x="584" y="136" width="496" height="104" rx="6"/><rect x="584" y="272" width="496" height="104" rx="6"/><rect x="584" y="408" width="496" height="104" rx="6"/></g>
    <g font-size="22" font-weight="600"><text x="64" y="292">当前系统</text><text x="608" y="172">规则复杂：模型与依赖</text><text x="608" y="308">交付阻塞：部署与所有权</text><text x="608" y="444">运行不稳：观测与交付治理</text></g>
    <g font-size="17" fill="#5d6f64"><text x="64" y="328">先明确模块和数据边界</text><text x="64" y="360">保留可靠、低成本的部分</text><text x="608" y="208">DDD、六边形；也可在原进程内完成</text><text x="608" y="344">满足前提后拆服务，保留跨边界恢复合同</text><text x="608" y="480">可追溯制品、自动发布、容量和云原生运行</text></g>
    <text x="40" y="564" font-size="17">以修改范围、交付等待、恢复时间和总成本复验；选择分支后仍需重新检查原有约束。</text>
  </g>
</svg>
