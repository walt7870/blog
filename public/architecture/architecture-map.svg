<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="560" viewBox="0 0 1120 560" role="img" aria-labelledby="arch-map-title arch-map-desc">
  <title id="arch-map-title">架构方法分别回答不同问题</title><desc id="arch-map-desc">业务模型、代码依赖、数据协作、运行交付是可组合的四个维度，分别可使用 DDD、分层或六边形、事件或 CQRS、微服务及云原生等方法。</desc>
  <rect width="1120" height="560" fill="#f8fafc"/>
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif" fill="#26372e">
    <text x="40" y="48" font-size="26" font-weight="600">架构地图：先问问题，再组合方法</text>
    <text x="40" y="80" font-size="16" fill="#5d6f64">同一个订单系统可以同时采用多个维度的设计</text>
    <g fill="#fff" stroke="#c4cdd5"><rect x="40" y="124" width="504" height="156" rx="6"/><rect x="576" y="124" width="504" height="156" rx="6"/><rect x="40" y="312" width="504" height="156" rx="6"/><rect x="576" y="312" width="504" height="156" rx="6"/></g>
    <g font-size="22" font-weight="600"><text x="64" y="160">业务模型：谁解释规则</text><text x="600" y="160">代码依赖：谁依赖谁</text><text x="64" y="348">数据协作：事实如何传播</text><text x="600" y="348">运行交付：谁部署和恢复</text></g>
    <g font-size="17"><text x="64" y="196">DDD：上下文、实体、值对象与聚合</text><text x="64" y="228">例：已关闭订单收到支付后由谁核对</text><text x="600" y="196">分层 / 六边形：职责与端口适配</text><text x="600" y="228">例：替换支付 SDK 不改订单规则</text><text x="64" y="384">事件驱动 / CQRS：消息、读写模型</text><text x="64" y="416">例：付款后积分晚到，怎样恢复和展示</text><text x="600" y="384">单体 / 微服务；云原生 / Serverless</text><text x="600" y="416">例：独立发布、弹性、故障与成本</text></g>
    <text x="40" y="520" font-size="17" fill="#5d6f64">企业级目标、现状与变革治理可结合 TOGAF；UML 用于表达模型，不是另一种部署形态。</text>
  </g>
</svg>
