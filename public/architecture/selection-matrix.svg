<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="640" viewBox="0 0 1120 640" role="img" aria-labelledby="arch-matrix-title arch-matrix-desc">
  <title id="arch-matrix-title">业务复杂度与组织复杂度的选型起点</title><desc id="arch-matrix-desc">横向业务复杂度增加，纵向组织复杂度增加。左下可从简单分层起步，右下优先模型与模块，左上重视契约集成，右上评估独立交付；矩阵不是自动决策。</desc>
  <defs><marker id="arch-matrix-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" fill="#657768"/></marker></defs>
  <rect width="1120" height="640" fill="#f8fafc"/>
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif" fill="#26372e">
    <text x="40" y="48" font-size="26" font-weight="600">选型起点：复杂度提供线索，约束决定方案</text>
    <text x="40" y="80" font-size="16" fill="#5d6f64">象限表示候选方向；数据归属、可靠性和运维能力仍需单独判断</text>
    <rect x="152" y="128" width="888" height="408" fill="#fff" stroke="#ccd6cf"/>
    <path d="M596 128V536M152 332H1040" stroke="#ccd6cf"/>
    <path d="M128 552V116" fill="none" stroke="#657768" stroke-width="2" marker-end="url(#arch-matrix-arrow)"/>
    <path d="M128 552H1056" fill="none" stroke="#657768" stroke-width="2" marker-end="url(#arch-matrix-arrow)"/>
    <g font-size="18"><text x="24" y="148">组织复杂度</text><text x="80" y="188">高</text><text x="80" y="524">低</text><text x="160" y="584">低</text><text x="1024" y="584">高</text><text x="800" y="616">业务复杂度</text></g>
    <g font-size="22" font-weight="600"><text x="184" y="176">契约与集成治理</text><text x="628" y="176">模型边界 + 独立交付评估</text><text x="184" y="380">简单分层 / 模块化单体</text><text x="628" y="380">DDD + 模块化单体</text></g>
    <g font-size="17" fill="#5d6f64"><text x="184" y="216">多团队集成，先管清接口与数据责任</text><text x="184" y="248">SOA 或已有系统集成都可能适用</text><text x="628" y="216">满足治理和数据边界后再考虑微服务</text><text x="628" y="248">团队多并不自动要求独立部署</text><text x="184" y="420">业务与协作简单，保持交付路径短</text><text x="184" y="452">不提前引入网络与分布式事务</text><text x="628" y="420">规则复杂但团队小，先集中规则</text><text x="628" y="452">按需用六边形隔离外部依赖</text></g>
  </g>
</svg>
