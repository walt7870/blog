<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="600" viewBox="0 0 1120 600" role="img" aria-labelledby="title desc">
  <title id="title">订单服务的云原生运行路径</title>
  <desc id="desc">用户请求经入口和 Service 到达订单副本，再访问独立数据库。控制平面调谐副本，应用输出观测数据，这两条路径不属于每次订单的同步调用链。此图是参考架构。</desc>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" fill="#64748b"/></marker></defs>
  <style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#0f172a}.h{font-size:24px;font-weight:700}.n{font-size:19px;font-weight:700}.t{font-size:15px;fill:#475569}.b{fill:white;stroke:#cbd5e1;stroke-width:2}.l{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#a)}</style>
  <rect width="1120" height="600" fill="#f8fafc"/>
  <text x="48" y="48" class="h">云原生运行：请求、调谐和观测有不同路径</text>
  <text x="48" y="80" class="t">订单服务参考架构；Service 是访问抽象，转发由网络数据面实现。</text>
  <path class="l" d="M240 212H312"/><path class="l" d="M536 212H608"/><path class="l" d="M808 212H880"/>
  <path class="l" d="M1008 260V368"/>
  <path class="l" d="M312 420H288Q280 420 280 412V220a8 8 0 0 1 0 -16V124Q280 116 288 116H968Q976 116 976 124V164" stroke-dasharray="6 4"/>
  <path class="l" d="M880 236H840Q832 236 832 244V332Q832 340 824 340H716Q708 340 708 348V368" stroke-dasharray="6 4"/>
  <rect class="b" x="48" y="164" width="192" height="96" rx="6"/>
  <text class="n" x="72" y="200">客户端</text><text class="t" x="72" y="232">下单 / 查询订单</text>
  <rect class="b" x="312" y="164" width="224" height="96" rx="6"/>
  <text class="n" x="336" y="200">入口负载均衡</text><text class="t" x="336" y="232">TLS、路由、流量治理</text>
  <rect class="b" x="608" y="164" width="200" height="96" rx="6"/>
  <text class="n" x="632" y="200">Service</text><text class="t" x="632" y="232">发现就绪的后端</text>
  <rect x="880" y="164" width="192" height="96" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text class="n" x="904" y="200">订单副本</text><text class="t" x="904" y="232">鉴权、规则、幂等</text>
  <rect class="b" x="880" y="368" width="192" height="104" rx="6"/>
  <text class="n" x="904" y="404">订单数据库</text><text class="t" x="904" y="436">事务、复制、备份</text>
  <rect class="b" x="608" y="368" width="200" height="104" rx="6"/>
  <text class="n" x="632" y="404">观测系统</text><text class="t" x="632" y="436">指标、日志、Trace</text>
  <rect x="312" y="368" width="224" height="104" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/>
  <text class="n" x="336" y="404">平台控制平面</text><text class="t" x="336" y="436">调谐副本、调度、扩缩</text>
  <text class="t" x="724" y="104">按期望状态调谐</text>
  <text class="t" x="728" y="324">输出遥测</text>
  <text class="t" x="48" y="528">实线：请求访问；虚线：控制或观测。入口外的内部组件仍需各自授权与网络策略。</text>
  <text class="t" x="48" y="560">应用可替换不等于数据可丢弃；平台重建副本不等于自动解决支付事务、数据库恢复和容量瓶颈。</text>
</svg>
