<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="640" viewBox="0 0 1120 640" role="img" aria-labelledby="title desc">
  <title id="title">云原生发布的制品与期望状态</title>
  <desc id="desc">CI 构建镜像推送仓库，审批后更新部署来源的 digest。GitOps 控制器调谐集群对象，节点拉取镜像运行。验收失败时按规则修改期望状态，数据库等外部副作用需另行恢复。</desc>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" fill="#64748b"/></marker></defs>
  <style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#0f172a}.h{font-size:24px;font-weight:700}.n{font-size:19px;font-weight:700}.t{font-size:15px;fill:#475569}.b{fill:white;stroke:#cbd5e1;stroke-width:2}.l{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#a)}</style>
  <rect width="1120" height="640" fill="#f8fafc"/>
  <text x="48" y="48" class="h">发布：同一制品逐环境晋级，运行结果决定继续或回退</text>
  <text x="48" y="80" class="t">GitOps 示例；制品仓库保存镜像，部署来源保存期望，不以同步成功代替业务验收。</text>
  <path class="l" d="M264 216H336"/>
  <path class="l" d="M156 268V368"/>
  <path class="l" d="M264 416H336"/><path class="l" d="M552 416H608"/>
  <path class="l" d="M708 368V320Q708 312 716 312H928Q936 312 936 304V268"/>
  <path class="l" d="M880 216H552" stroke-dasharray="6 4"/>
  <path class="l" d="M1008 268V368"/>
  <path class="l" d="M976 472V544Q976 552 968 552H164Q156 552 156 544V472" stroke-dasharray="6 4"/>
  <rect class="b" x="48" y="164" width="216" height="104" rx="6"/>
  <text class="n" x="72" y="200">CI 构建与验证</text><text class="t" x="72" y="232">测试、扫描、来源记录</text>
  <rect class="b" x="336" y="164" width="216" height="104" rx="6"/>
  <text class="n" x="360" y="200">镜像仓库</text><text class="t" x="360" y="232">固定 digest 的制品</text>
  <rect class="b" x="880" y="164" width="192" height="104" rx="6"/>
  <text class="n" x="904" y="200">节点与 Pod</text><text class="t" x="904" y="232">拉取镜像并运行</text>
  <rect x="48" y="368" width="216" height="104" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text class="n" x="72" y="404">部署来源 Git</text><text class="t" x="72" y="436">审批后的版本与配置</text>
  <rect class="b" x="336" y="368" width="216" height="104" rx="6"/>
  <text class="n" x="360" y="404">GitOps 控制器</text><text class="t" x="360" y="436">比较期望并提交对象</text>
  <rect class="b" x="608" y="368" width="200" height="104" rx="6"/>
  <text class="n" x="632" y="404">集群调谐</text><text class="t" x="632" y="436">API、控制器、调度</text>
  <rect x="880" y="368" width="192" height="104" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/>
  <text class="n" x="904" y="404">运行验收</text><text class="t" x="904" y="436">就绪 + 业务指标</text>
  <text class="t" x="172" y="324">更新 digest，走审批</text>
  <text class="t" x="632" y="200">运行时拉取</text>
  <text class="t" x="404" y="536">失败时按发布规则回退期望，并再次验证</text>
  <text class="t" x="48" y="608">回退边界：镜像和配置可切回；数据库模式、消息兼容和外部业务副作用需分别设计恢复。</text>
</svg>
