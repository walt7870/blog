<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="850" viewBox="0 0 1440 850" role="img" aria-labelledby="title desc">
  <title id="title">营销核心数据权威、应用协作与分析消费边界</title>
  <desc id="desc">上层展示五类权威事实及其 Owner，中层展示围绕事实协作的营销应用，下层展示只读消费的 CDP、实验归因和经营看板，并禁止分析结果反向修改业务事实。</desc>
  <defs>
    <marker id="writeArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#334155"/>
    </marker>
    <marker id="readArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#0f766e"/>
    </marker>
    <marker id="stopArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#be123c"/>
    </marker>
  </defs>
  <rect width="1440" height="850" fill="#ffffff"/>
  <g font-family="Arial, 'PingFang SC', sans-serif">
    <text x="66" y="54" fill="#172033" font-size="29" font-weight="700">数据能被组合消费，但事实只能由明确的 Owner 裁决</text>
    <text x="66" y="90" fill="#526078" font-size="17">责任分组视图，不表示逐层调用顺序或模块一一对应；跨系统交互见实时决策时序图。</text>

    <rect x="52" y="120" width="1336" height="220" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
    <rect x="52" y="120" width="150" height="220" rx="12" fill="#e2e8f0"/>
    <text x="127" y="166" text-anchor="middle" fill="#172033" font-size="16" font-weight="700">事实权威层</text>
    <text x="127" y="193" text-anchor="middle" fill="#526078" font-size="12">谁创建、变更</text>
    <text x="127" y="215" text-anchor="middle" fill="#526078" font-size="12">并解释生命周期</text>
    <rect x="76" y="259" width="102" height="48" rx="24" fill="#ffffff" stroke="#64748b"/>
    <text x="127" y="279" text-anchor="middle" fill="#334155" font-size="12" font-weight="700">单一裁决者</text>
    <text x="127" y="297" text-anchor="middle" fill="#526078" font-size="10">不等于单数据库</text>

    <g text-anchor="middle">
      <rect x="222" y="144" width="210" height="170" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
      <text x="327" y="175" fill="#1d4ed8" font-size="15" font-weight="700">会员与身份平台</text>
      <text x="327" y="200" fill="#172033" font-size="13">企业 customerId</text>
      <text x="327" y="222" fill="#172033" font-size="13">会员等级与身份映射</text>
      <rect x="252" y="247" width="150" height="42" rx="21" fill="#ffffff" stroke="#93c5fd"/>
      <text x="327" y="273" fill="#1d4ed8" font-size="12" font-weight="700">Customer / Membership</text>

      <rect x="450" y="144" width="210" height="170" rx="10" fill="#ecfdf5" stroke="#0f766e" stroke-width="1.8"/>
      <text x="555" y="175" fill="#0f766e" font-size="15" font-weight="700">Consent 服务</text>
      <text x="555" y="200" fill="#172033" font-size="13">授权目的、渠道</text>
      <text x="555" y="222" fill="#172033" font-size="13">版本、有效期与撤回</text>
      <rect x="480" y="247" width="150" height="42" rx="21" fill="#ffffff" stroke="#5eead4"/>
      <text x="555" y="273" fill="#0f766e" font-size="12" font-weight="700">Consent Grant</text>

      <rect x="678" y="144" width="210" height="170" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.8"/>
      <text x="783" y="175" fill="#6d28d9" font-size="15" font-weight="700">营销平台</text>
      <text x="783" y="200" fill="#172033" font-size="13">Campaign、Journey</text>
      <text x="783" y="222" fill="#172033" font-size="13">Offer 与人群定义</text>
      <rect x="708" y="247" width="150" height="42" rx="21" fill="#ffffff" stroke="#c4b5fd"/>
      <text x="783" y="273" fill="#6d28d9" font-size="12" font-weight="700">Policy / Decision</text>

      <rect x="906" y="144" width="210" height="170" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="1.8"/>
      <text x="1011" y="175" fill="#c2410c" font-size="15" font-weight="700">权益与预算账本</text>
      <text x="1011" y="200" fill="#172033" font-size="13">预留、发放、核销</text>
      <text x="1011" y="222" fill="#172033" font-size="13">释放、回冲与余额</text>
      <rect x="936" y="247" width="150" height="42" rx="21" fill="#ffffff" stroke="#fdba74"/>
      <text x="1011" y="273" fill="#c2410c" font-size="12" font-weight="700">Benefit Ledger</text>

      <rect x="1134" y="144" width="230" height="170" rx="10" fill="#fefce8" stroke="#a16207" stroke-width="1.8"/>
      <text x="1249" y="175" fill="#854d0e" font-size="15" font-weight="700">订单与支付域</text>
      <text x="1249" y="200" fill="#172033" font-size="13">订单、商品、价格快照</text>
      <text x="1249" y="222" fill="#172033" font-size="13">支付、退款与交易成本</text>
      <rect x="1174" y="247" width="150" height="42" rx="21" fill="#ffffff" stroke="#fde047"/>
      <text x="1249" y="273" fill="#854d0e" font-size="12" font-weight="700">Order / Payment</text>
    </g>

    <rect x="52" y="378" width="1336" height="196" rx="12" fill="#f2fbf8" stroke="#0f766e" stroke-width="1.5"/>
    <rect x="52" y="378" width="150" height="196" rx="12" fill="#ccfbf1"/>
    <text x="127" y="424" text-anchor="middle" fill="#0f766e" font-size="16" font-weight="700">应用协作层</text>
    <text x="127" y="451" text-anchor="middle" fill="#526078" font-size="12">读取权威事实</text>
    <text x="127" y="473" text-anchor="middle" fill="#526078" font-size="12">生成新业务凭证</text>
    <text x="127" y="512" text-anchor="middle" fill="#115e59" font-size="12">应用边界由</text>
    <text x="127" y="532" text-anchor="middle" fill="#115e59" font-size="12">责任而非数据副本划分</text>

    <g text-anchor="middle">
      <circle cx="300" cy="476" r="55" fill="#ffffff" stroke="#0f766e" stroke-width="1.8"/>
      <text x="300" y="470" fill="#115e59" font-size="14" font-weight="700">画像与标签</text><text x="300" y="493" fill="#526078" font-size="11">当前视图 + asOf</text>
      <circle cx="496" cy="476" r="55" fill="#ffffff" stroke="#0f766e" stroke-width="1.8"/>
      <text x="496" y="470" fill="#115e59" font-size="14" font-weight="700">人群计算</text><text x="496" y="493" fill="#526078" font-size="11">定义与成员快照</text>
      <circle cx="692" cy="476" r="65" fill="#ffffff" stroke="#0f766e" stroke-width="3"/>
      <text x="692" y="466" fill="#0f766e" font-size="15" font-weight="700">实时决策</text><text x="692" y="490" fill="#172033" font-size="12">资格、互斥、频控</text><text x="692" y="510" fill="#526078" font-size="11">生成 decisionId</text>
      <circle cx="908" cy="476" r="55" fill="#ffffff" stroke="#0f766e" stroke-width="1.8"/>
      <text x="908" y="470" fill="#115e59" font-size="14" font-weight="700">促销定价</text><text x="908" y="493" fill="#526078" font-size="11">价格与叠加裁决</text>
      <circle cx="1104" cy="476" r="55" fill="#ffffff" stroke="#0f766e" stroke-width="1.8"/>
      <text x="1104" y="470" fill="#115e59" font-size="14" font-weight="700">渠道网关</text><text x="1104" y="493" fill="#526078" font-size="11">投递与真实曝光</text>
      <circle cx="1296" cy="476" r="55" fill="#ffffff" stroke="#0f766e" stroke-width="1.8"/>
      <text x="1296" y="470" fill="#115e59" font-size="14" font-weight="700">事件采集</text><text x="1296" y="493" fill="#526078" font-size="11">统一契约与去重</text>
    </g>

    <rect x="52" y="612" width="1336" height="134" rx="12" fill="#fafafa" stroke="#64748b" stroke-width="1.5"/>
    <rect x="52" y="612" width="150" height="134" rx="12" fill="#e2e8f0"/>
    <text x="127" y="654" text-anchor="middle" fill="#334155" font-size="16" font-weight="700">分析消费层</text>
    <text x="127" y="681" text-anchor="middle" fill="#526078" font-size="12">组合、解释、比较</text>
    <text x="127" y="703" text-anchor="middle" fill="#526078" font-size="12">不成为交易写入口</text>

    <g text-anchor="middle">
      <rect x="260" y="638" width="300" height="82" rx="41" fill="#ffffff" stroke="#64748b" stroke-width="1.6"/>
      <text x="410" y="670" fill="#334155" font-size="15" font-weight="700">CDP 客户组合视图</text><text x="410" y="695" fill="#526078" font-size="12">拼接身份、画像、行为和活动上下文</text>
      <rect x="610" y="638" width="300" height="82" rx="41" fill="#ffffff" stroke="#64748b" stroke-width="1.6"/>
      <text x="760" y="670" fill="#334155" font-size="15" font-weight="700">实验与归因</text><text x="760" y="695" fill="#526078" font-size="12">解释相关、触点贡献与因果增量</text>
      <rect x="960" y="638" width="360" height="82" rx="41" fill="#ffffff" stroke="#64748b" stroke-width="1.6"/>
      <text x="1140" y="670" fill="#334155" font-size="15" font-weight="700">经营与三层证据看板</text><text x="1140" y="695" fill="#526078" font-size="12">业务结果、系统运行、数据质量</text>
    </g>

    <rect x="310" y="762" width="820" height="52" rx="26" fill="#fff1f2" stroke="#be123c" stroke-width="1.6"/>
    <text x="720" y="784" text-anchor="middle" fill="#9f1239" font-size="15" font-weight="700">禁止反向写入：CDP 与度量平台不能修改身份、Consent、权益状态和订单事实</text>
    <text x="720" y="804" text-anchor="middle" fill="#526078" font-size="11">分析结果通过策略评审产生下一版规则，而不是覆盖已经发生的业务事实</text>
  </g>
</svg>
