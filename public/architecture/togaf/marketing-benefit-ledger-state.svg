<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="820" viewBox="0 0 1280 820" role="img" aria-labelledby="title desc">
  <title id="title">营销承诺的预留、发放、核销与异常恢复</title>
  <desc id="desc">业务生命周期视图关联 Reservation 与 Grant。预留可过期释放；已发放权益可过期；核销失败经过确认恢复；核销成功后的退款以新凭证返还或回冲，不抹去历史。</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#718078"/></marker></defs>
  <rect width="1280" height="820" fill="#f8fafb"/>
  <g font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" fill="#293832">
    <text x="56" y="60" font-size="27" font-weight="700">客户承诺不能靠接口成功率证明</text>
    <text x="56" y="96" font-size="17" fill="#596b63">业务生命周期关联预留与权益对象；财务结算使用独立凭证，不能混成一个 status 字段。</text>
    <g fill="#fff" stroke="#c8d2cd">
      <rect x="56" y="170" width="230" height="112" rx="6"/>
      <rect x="356" y="170" width="230" height="112" rx="6"/>
      <rect x="686" y="170" width="230" height="112" rx="6"/>
      <rect x="986" y="170" width="238" height="112" rx="6" fill="#e7f2e8" stroke="#799b86"/>
      <rect x="56" y="400" width="230" height="102" rx="6"/>
      <rect x="356" y="400" width="230" height="102" rx="6"/>
      <rect x="986" y="400" width="238" height="102" rx="6"/>
    </g>
    <g font-size="20" font-weight="700">
      <text x="80" y="207">预留 RESERVED</text><text x="380" y="207">发放 GRANTED</text>
      <text x="710" y="207">核销中 REDEEMING</text><text x="1010" y="207">已核销 REDEEMED</text>
      <text x="80" y="438">已释放 RELEASED</text><text x="380" y="438">已过期 EXPIRED</text>
      <text x="1010" y="438">退款结果与新凭证</text>
    </g>
    <g font-size="16">
      <text x="80" y="240">占用预算与限量额度</text><text x="80" y="265">reservationId + version</text>
      <text x="380" y="240">形成客户权益 grantId</text><text x="380" y="265">保留预留与决策关联</text>
      <text x="710" y="240">绑定订单、阻止重复使用</text><text x="710" y="265">未知结果先查询裁决</text>
      <text x="1010" y="240">形成核销与费用事实</text><text x="1010" y="265">财务结算另外登记</text>
      <text x="80" y="472">恢复未使用预算与额度</text><text x="380" y="472">保留发放历史与失效凭证</text>
      <text x="1010" y="472">按政策返还或费用回冲</text>
    </g>
  </g>
  <g fill="none" stroke="#718078" stroke-width="2" marker-end="url(#arrow)">
    <path d="M286 226H356"/><path d="M586 226H686"/><path d="M916 226H986"/>
    <path d="M171 282V400"/><path d="M471 282V400"/><path d="M1105 282V400"/>
    <path d="M801 282V340H562V282"/>
  </g>
  <g font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" fill="#596b63">
    <text x="294" y="151">确认发放</text><text x="600" y="151">申请核销</text><text x="921" y="151">业务确认</text>
    <text x="186" y="344">到期且未发放</text><text x="386" y="368">有效期结束</text>
    <text x="620" y="328">确认交易失败 / 解除占用</text><text x="1120" y="344">退款政策</text>
    <path d="M56 554H1224" stroke="#dce3df"/>
    <text x="56" y="592" font-size="20" fill="#293832" font-weight="700">每次状态转移同时核对金额、数量与业务凭证</text>
    <text x="56" y="630">本地事务：请求键 + 状态前提 + 条件扣减 + 结果 + Outbox；任一条件失败整笔回滚。</text>
    <text x="56" y="666">跨服务：协调、幂等、超时查询和补偿；没有曝光回传不等于客户没看到，不能提前撤销承诺。</text>
    <text x="56" y="702">退款不擦除核销历史；返还可用权益时创建或关联受控的新状态，保留原始凭证。</text>
    <text x="56" y="752">预算与额度公式采用累计毛额口径；改用净额时同步调整回冲项，避免重复计数。</text>
  </g>
</svg>
