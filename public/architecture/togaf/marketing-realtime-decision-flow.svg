<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">实时营销决策、异常分支与异步曝光时序</title>
  <desc id="desc">展示渠道请求如何在一百毫秒内依次完成授权、特征、规则和权益裁决，并在授权拒绝、画像过期、权益不足时返回明确结果，渠道真实展示后再异步记录曝光。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#334155"/>
    </marker>
    <marker id="return" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#0f766e"/>
    </marker>
    <marker id="warning" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#b45309"/>
    </marker>
    <marker id="reject" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#be123c"/>
    </marker>
  </defs>
  <rect width="1440" height="900" fill="#ffffff"/>
  <g font-family="Arial, 'PingFang SC', sans-serif">
    <text x="66" y="54" fill="#172033" font-size="29" font-weight="700">一次实时决策包含业务承诺、明确拒绝和可观测降级</text>
    <text x="66" y="90" fill="#526078" font-size="17">同步路径只保留必须立即裁决的步骤；真实展示、转化和测量在业务响应之后异步发生。</text>
    <g font-size="12">
      <line x1="1018" y1="53" x2="1058" y2="53" stroke="#334155" stroke-width="2.2" marker-end="url(#arrow)"/><text x="1068" y="57" fill="#526078">同步调用</text>
      <line x1="1155" y1="53" x2="1195" y2="53" stroke="#b45309" stroke-width="2.2" marker-end="url(#warning)"/><text x="1205" y="57" fill="#526078">降级</text>
      <line x1="1265" y1="53" x2="1305" y2="53" stroke="#be123c" stroke-width="2.2" marker-end="url(#reject)"/><text x="1315" y="57" fill="#526078">拒绝</text>
    </g>

    <g text-anchor="middle">
      <rect x="34" y="118" width="172" height="68" rx="9" fill="#fff7ed" stroke="#c2410c" stroke-width="1.8"/>
      <text x="120" y="148" fill="#9a3412" font-size="15" font-weight="700">渠道 / BFF</text><text x="120" y="171" fill="#526078" font-size="11">场景与商品上下文</text>
      <rect x="234" y="118" width="172" height="68" rx="9" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
      <text x="320" y="148" fill="#1d4ed8" font-size="15" font-weight="700">决策入口</text><text x="320" y="171" fill="#526078" font-size="11">超时、幂等与组装</text>
      <rect x="434" y="118" width="172" height="68" rx="9" fill="#ecfdf5" stroke="#0f766e" stroke-width="1.8"/>
      <text x="520" y="148" fill="#0f766e" font-size="15" font-weight="700">身份 / Consent</text><text x="520" y="171" fill="#526078" font-size="11">客户与用途授权</text>
      <rect x="634" y="118" width="172" height="68" rx="9" fill="#ecfeff" stroke="#0e7490" stroke-width="1.8"/>
      <text x="720" y="148" fill="#155e75" font-size="15" font-weight="700">特征 / 人群</text><text x="720" y="171" fill="#526078" font-size="11">asOf 与新鲜度</text>
      <rect x="834" y="118" width="172" height="68" rx="9" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.8"/>
      <text x="920" y="148" fill="#6d28d9" font-size="15" font-weight="700">规则裁决</text><text x="920" y="171" fill="#526078" font-size="11">资格、互斥与频控</text>
      <rect x="1034" y="118" width="172" height="68" rx="9" fill="#fefce8" stroke="#a16207" stroke-width="1.8"/>
      <text x="1120" y="148" fill="#854d0e" font-size="15" font-weight="700">权益账本</text><text x="1120" y="171" fill="#526078" font-size="11">预算与稀缺额度</text>
      <rect x="1234" y="118" width="172" height="68" rx="9" fill="#f8fafc" stroke="#64748b" stroke-width="1.8"/>
      <text x="1320" y="148" fill="#334155" font-size="15" font-weight="700">决策 / 曝光日志</text><text x="1320" y="171" fill="#526078" font-size="11">版本、理由与凭证</text>
    </g>

    <g stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="6 6">
      <path d="M120 186 V792"/><path d="M320 186 V792"/><path d="M520 186 V792"/><path d="M720 186 V792"/>
      <path d="M920 186 V792"/><path d="M1120 186 V792"/><path d="M1320 186 V792"/>
    </g>
    <g fill="#334155">
      <rect x="116" y="205" width="8" height="488" rx="4"/><rect x="316" y="205" width="8" height="488" rx="4"/>
      <rect x="516" y="252" width="8" height="92" rx="4"/><rect x="716" y="362" width="8" height="78" rx="4"/>
      <rect x="916" y="450" width="8" height="190" rx="4"/><rect x="1116" y="508" width="8" height="86" rx="4"/>
      <rect x="1316" y="612" width="8" height="160" rx="4"/>
    </g>

    <rect x="42" y="202" width="1364" height="484" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.4"/>
    <rect x="42" y="202" width="102" height="28" rx="5" fill="#e2e8f0"/>
    <text x="93" y="221" text-anchor="middle" fill="#334155" font-size="12" font-weight="700">同步决策窗口</text>

    <g fill="none" stroke="#334155" stroke-width="2.1" marker-end="url(#arrow)">
      <path d="M124 220 H312"/>
      <path d="M324 262 H512"/>
      <path d="M324 372 H712"/>
      <path d="M324 460 H912"/>
      <path d="M924 518 H1112"/>
      <path d="M924 622 H1312"/>
    </g>
    <g fill="none" stroke="#0f766e" stroke-width="2.1" stroke-dasharray="7 5" marker-end="url(#return)">
      <path d="M712 414 H324"/>
      <path d="M1112 574 H924"/>
      <path d="M912 646 H324"/>
      <path d="M312 674 H124"/>
    </g>

    <g>
      <rect x="168" y="204" width="108" height="27" rx="5" fill="#ffffff"/><text x="222" y="223" text-anchor="middle" fill="#172033" font-size="13" font-weight="700">1 决策请求</text>
      <text x="140" y="245" fill="#526078" font-size="11">requestId、客户、场景、触点</text>
      <rect x="367" y="246" width="112" height="27" rx="5" fill="#ffffff"/><text x="423" y="265" text-anchor="middle" fill="#172033" font-size="13" font-weight="700">2 授权校验</text>
      <rect x="443" y="275" width="154" height="25" rx="12" fill="#eff6ff" stroke="#93c5fd"/><text x="520" y="292" text-anchor="middle" fill="#1d4ed8" font-size="10">身份与 Consent ≤ 10ms</text>

      <path d="M512 320 H324" fill="none" stroke="#be123c" stroke-width="2.2" marker-end="url(#reject)"/>
      <rect x="346" y="303" width="144" height="30" rx="5" fill="#fff1f2" stroke="#be123c"/>
      <text x="418" y="323" text-anchor="middle" fill="#9f1239" font-size="12" font-weight="700">Consent 不允许</text>
      <text x="538" y="323" fill="#9f1239" font-size="11">→ CONSENT_DENIED，终止后续裁决</text>

      <rect x="480" y="356" width="112" height="27" rx="5" fill="#ffffff"/><text x="536" y="375" text-anchor="middle" fill="#172033" font-size="13" font-weight="700">3 读取特征</text>
      <rect x="643" y="378" width="154" height="25" rx="12" fill="#ecfeff" stroke="#67e8f9"/><text x="720" y="395" text-anchor="middle" fill="#155e75" font-size="10">特征与人群 ≤ 15ms</text>
      <path d="M712 410 H324" fill="none" stroke="#b45309" stroke-width="2.2" marker-end="url(#warning)"/>
      <rect x="424" y="394" width="190" height="30" rx="5" fill="#fffbeb" stroke="#b45309"/>
      <text x="519" y="414" text-anchor="middle" fill="#92400e" font-size="12" font-weight="700">画像过期 → 保守候选</text>
      <text x="620" y="435" fill="#92400e" font-size="11">返回 featureVersion、asOf、degraded=true</text>

      <rect x="559" y="444" width="122" height="27" rx="5" fill="#ffffff"/><text x="620" y="463" text-anchor="middle" fill="#172033" font-size="13" font-weight="700">4 召回与裁决</text>
      <rect x="843" y="466" width="154" height="25" rx="12" fill="#f5f3ff" stroke="#c4b5fd"/><text x="920" y="483" text-anchor="middle" fill="#6d28d9" font-size="10">规则裁决 ≤ 15ms</text>

      <rect x="968" y="502" width="142" height="27" rx="5" fill="#ffffff"/><text x="1039" y="521" text-anchor="middle" fill="#172033" font-size="13" font-weight="700">5 预留权益</text>
      <rect x="1043" y="530" width="154" height="25" rx="12" fill="#fefce8" stroke="#fde047"/><text x="1120" y="547" text-anchor="middle" fill="#854d0e" font-size="10">账本预留 ≤ 20ms</text>
      <path d="M1112 566 H924" fill="none" stroke="#be123c" stroke-width="2.2" marker-end="url(#reject)"/>
      <rect x="951" y="550" width="138" height="30" rx="5" fill="#fff1f2" stroke="#be123c"/>
      <text x="1020" y="570" text-anchor="middle" fill="#9f1239" font-size="12" font-weight="700">预算 / 权益不足</text>
      <text x="1132" y="589" text-anchor="end" fill="#9f1239" font-size="11">→ BENEFIT_UNAVAILABLE</text>

      <rect x="1084" y="606" width="142" height="27" rx="5" fill="#ffffff"/><text x="1155" y="625" text-anchor="middle" fill="#172033" font-size="13" font-weight="700">6 保存决策证据</text>
      <text x="940" y="643" fill="#526078" font-size="11">decisionId、policyVersion、reasonCodes、reservationId</text>
      <rect x="551" y="632" width="172" height="27" rx="5" fill="#ffffff"/><text x="637" y="651" text-anchor="middle" fill="#0f766e" font-size="13" font-weight="700">7 返回可履约 Offer</text>
      <text x="334" y="669" fill="#526078" font-size="11">凭证、有效期、拒绝原因、降级标记；组装 ≤ 10ms</text>
    </g>

    <rect x="42" y="706" width="1364" height="82" rx="10" fill="#ecfdf5" stroke="#0f766e" stroke-width="1.5"/>
    <rect x="42" y="706" width="114" height="28" rx="5" fill="#ccfbf1"/>
    <text x="99" y="725" text-anchor="middle" fill="#0f766e" font-size="12" font-weight="700">响应后异步事实</text>
    <path d="M124 752 H1312" fill="none" stroke="#0f766e" stroke-width="2.3" stroke-dasharray="8 6" marker-end="url(#return)"/>
    <rect x="462" y="735" width="258" height="30" rx="5" fill="#ffffff" stroke="#0f766e"/>
    <text x="591" y="755" text-anchor="middle" fill="#115e59" font-size="13" font-weight="700">渠道真实渲染成功后记录 Exposure</text>
    <text x="935" y="773" text-anchor="middle" fill="#526078" font-size="11">决策返回不等于曝光；后续用 decisionId + exposureId 关联转化</text>

    <rect x="252" y="814" width="936" height="50" rx="25" fill="#172033"/>
    <text x="720" y="837" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="700">目标：端到端 p99 ≤ 80ms ｜ 超时优先拒绝稀缺权益，保留明确 reasonCode</text>
    <text x="720" y="855" text-anchor="middle" fill="#cbd5e1" font-size="11">目标预算不是各步骤可全部耗尽的配额，入口必须保留网络抖动与组装余量</text>
  </g>
</svg>
