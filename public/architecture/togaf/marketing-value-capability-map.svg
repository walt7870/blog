<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="850" viewBox="0 0 1440 850" role="img" aria-labelledby="title desc">
  <title id="title">营销价值流、关键事实与能力成熟度</title>
  <desc id="desc">横向展示从策略到学习的七阶段价值流，纵向对齐每一阶段必须留下的事实、支撑能力和成熟度，并标记三个会污染后续阶段的断点。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#334155"/>
    </marker>
    <marker id="breakArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#be123c"/>
    </marker>
  </defs>
  <rect width="1440" height="850" fill="#ffffff"/>
  <g font-family="Arial, 'PingFang SC', sans-serif">
    <text x="66" y="54" fill="#172033" font-size="29" font-weight="700">价值流不是活动步骤清单，而是一条连续生成事实的业务链</text>
    <text x="66" y="90" fill="#526078" font-size="17">上游没有形成可复现事实，后续规则、权益和归因就只能用猜测补齐。</text>

    <g font-size="12">
      <rect x="1110" y="44" width="14" height="14" rx="3" fill="#dcfce7" stroke="#15803d"/><text x="1132" y="56" fill="#526078">成熟 4—5</text>
      <rect x="1204" y="44" width="14" height="14" rx="3" fill="#fef3c7" stroke="#a16207"/><text x="1226" y="56" fill="#526078">成熟 2—3</text>
      <rect x="1298" y="44" width="14" height="14" rx="3" fill="#ffe4e6" stroke="#be123c"/><text x="1320" y="56" fill="#526078">成熟 1</text>
    </g>

    <rect x="48" y="122" width="1344" height="492" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <g>
      <rect x="48" y="122" width="126" height="118" rx="12" fill="#e2e8f0"/>
      <text x="111" y="168" text-anchor="middle" fill="#172033" font-size="16" font-weight="700">价值动作</text>
      <text x="111" y="194" text-anchor="middle" fill="#526078" font-size="12">业务如何前进</text>
      <text x="111" y="216" text-anchor="middle" fill="#526078" font-size="12">以及交给谁</text>

      <rect x="48" y="248" width="126" height="118" fill="#e8f2ff"/>
      <text x="111" y="294" text-anchor="middle" fill="#1d4ed8" font-size="16" font-weight="700">关键事实</text>
      <text x="111" y="320" text-anchor="middle" fill="#526078" font-size="12">本阶段必须留下</text>
      <text x="111" y="342" text-anchor="middle" fill="#526078" font-size="12">可追踪输入输出</text>

      <rect x="48" y="374" width="126" height="240" rx="12" fill="#ecfdf5"/>
      <text x="111" y="422" text-anchor="middle" fill="#0f766e" font-size="16" font-weight="700">支撑能力</text>
      <text x="111" y="448" text-anchor="middle" fill="#526078" font-size="12">当前成熟度</text>
      <text x="111" y="484" text-anchor="middle" fill="#115e59" font-size="12">1 依赖人工</text>
      <text x="111" y="510" text-anchor="middle" fill="#115e59" font-size="12">3 可重复</text>
      <text x="111" y="536" text-anchor="middle" fill="#115e59" font-size="12">5 可度量</text>
    </g>

    <g fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2">
      <rect x="182" y="134" width="166" height="94" rx="8"/><rect x="356" y="134" width="166" height="94" rx="8"/>
      <rect x="530" y="134" width="166" height="94" rx="8"/><rect x="704" y="134" width="166" height="94" rx="8"/>
      <rect x="878" y="134" width="166" height="94" rx="8"/><rect x="1052" y="134" width="166" height="94" rx="8"/>
      <rect x="1226" y="134" width="154" height="94" rx="8"/>
    </g>
    <path d="M332 181 H352 M506 181 H526 M680 181 H700 M854 181 H874 M1028 181 H1048 M1202 181 H1222" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
    <g text-anchor="middle">
      <text x="265" y="166" fill="#172033" font-size="15" font-weight="700">制定策略</text><text x="265" y="194" fill="#526078" font-size="12">定义行为假设</text><text x="265" y="214" fill="#526078" font-size="12">与投资边界</text>
      <text x="439" y="166" fill="#172033" font-size="15" font-weight="700">识别人群</text><text x="439" y="194" fill="#526078" font-size="12">确定此刻符合</text><text x="439" y="214" fill="#526078" font-size="12">条件的客户</text>
      <text x="613" y="166" fill="#172033" font-size="15" font-weight="700">生成决策</text><text x="613" y="194" fill="#526078" font-size="12">资格、互斥</text><text x="613" y="214" fill="#526078" font-size="12">利润与频控裁决</text>
      <text x="787" y="166" fill="#172033" font-size="15" font-weight="700">承诺权益</text><text x="787" y="194" fill="#526078" font-size="12">占用预算</text><text x="787" y="214" fill="#526078" font-size="12">与稀缺额度</text>
      <text x="961" y="166" fill="#172033" font-size="15" font-weight="700">渠道触达</text><text x="961" y="194" fill="#526078" font-size="12">送达、展示</text><text x="961" y="214" fill="#526078" font-size="12">与频次协调</text>
      <text x="1135" y="166" fill="#172033" font-size="15" font-weight="700">观察转化</text><text x="1135" y="194" fill="#526078" font-size="12">订单、支付</text><text x="1135" y="214" fill="#526078" font-size="12">退款和成本</text>
      <text x="1303" y="166" fill="#172033" font-size="15" font-weight="700">归因学习</text><text x="1303" y="194" fill="#526078" font-size="12">解释贡献</text><text x="1303" y="214" fill="#526078" font-size="12">验证增量</text>
    </g>

    <g>
      <path d="M174 307 H1380" fill="none" stroke="#93c5fd" stroke-width="2"/>
      <g text-anchor="middle">
        <circle cx="265" cy="307" r="31" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
        <text x="265" y="303" fill="#1d4ed8" font-size="12" font-weight="700">Strategy</text><text x="265" y="321" fill="#526078" font-size="11">Hypothesis</text>
        <circle cx="439" cy="307" r="31" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
        <text x="439" y="303" fill="#1d4ed8" font-size="12" font-weight="700">Audience</text><text x="439" y="321" fill="#526078" font-size="11">Snapshot</text>
        <circle cx="613" cy="307" r="31" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
        <text x="613" y="303" fill="#1d4ed8" font-size="12" font-weight="700">Decision</text><text x="613" y="321" fill="#526078" font-size="11">+ reasons</text>
        <circle cx="787" cy="307" r="31" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
        <text x="787" y="303" fill="#1d4ed8" font-size="10" font-weight="700">Reservation</text><text x="787" y="321" fill="#526078" font-size="11">+ budget</text>
        <circle cx="961" cy="307" r="31" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
        <text x="961" y="303" fill="#1d4ed8" font-size="12" font-weight="700">Exposure</text><text x="961" y="321" fill="#526078" font-size="11">rendered</text>
        <circle cx="1135" cy="307" r="31" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
        <text x="1135" y="303" fill="#1d4ed8" font-size="12" font-weight="700">Order</text><text x="1135" y="321" fill="#526078" font-size="11">+ Refund</text>
        <circle cx="1303" cy="307" r="31" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
        <text x="1303" y="303" fill="#1d4ed8" font-size="12" font-weight="700">Experiment</text><text x="1303" y="321" fill="#526078" font-size="11">Result</text>
      </g>
    </g>

    <g text-anchor="middle">
      <rect x="182" y="392" width="166" height="204" rx="8" fill="#ffffff" stroke="#cbd5e1"/><text x="265" y="424" fill="#172033" font-size="13" font-weight="700">目标与预算组合</text><text x="265" y="449" fill="#526078" font-size="12">成熟度 2 / 5</text>
      <rect x="356" y="392" width="166" height="204" rx="8" fill="#ffffff" stroke="#cbd5e1"/><text x="439" y="424" fill="#172033" font-size="13" font-weight="700">身份、人群、授权</text><text x="439" y="449" fill="#526078" font-size="12">成熟度 2 / 5</text>
      <rect x="530" y="392" width="166" height="204" rx="8" fill="#ffffff" stroke="#cbd5e1"/><text x="613" y="424" fill="#172033" font-size="13" font-weight="700">Offer 实时裁决</text><text x="613" y="449" fill="#526078" font-size="12">成熟度 1 / 5</text>
      <rect x="704" y="392" width="166" height="204" rx="8" fill="#ffffff" stroke="#cbd5e1"/><text x="787" y="424" fill="#172033" font-size="13" font-weight="700">权益与预算账本</text><text x="787" y="449" fill="#526078" font-size="12">成熟度 1 / 5</text>
      <rect x="878" y="392" width="166" height="204" rx="8" fill="#ffffff" stroke="#cbd5e1"/><text x="961" y="424" fill="#172033" font-size="13" font-weight="700">渠道协调与曝光</text><text x="961" y="449" fill="#526078" font-size="12">成熟度 2 / 5</text>
      <rect x="1052" y="392" width="166" height="204" rx="8" fill="#ffffff" stroke="#cbd5e1"/><text x="1135" y="424" fill="#172033" font-size="13" font-weight="700">交易事实采集</text><text x="1135" y="449" fill="#526078" font-size="12">成熟度 3 / 5</text>
      <rect x="1226" y="392" width="154" height="204" rx="8" fill="#ffffff" stroke="#cbd5e1"/><text x="1303" y="424" fill="#172033" font-size="13" font-weight="700">实验与归因</text><text x="1303" y="449" fill="#526078" font-size="12">成熟度 1 / 5</text>
    </g>

