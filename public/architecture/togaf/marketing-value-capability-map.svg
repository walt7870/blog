    <g fill="none" stroke="#be123c" stroke-width="2.2" stroke-dasharray="7 5" marker-end="url(#breakArrow)">
      <path d="M439 338 V660"/><path d="M787 338 V700"/><path d="M961 338 V740"/>
    </g>
    <g>
      <rect x="218" y="644" width="442" height="52" rx="8" fill="#fff1f2" stroke="#be123c"/>
      <text x="439" y="666" text-anchor="middle" fill="#9f1239" font-size="14" font-weight="700">人群不可重现 → 决策无法复盘</text>
      <text x="439" y="686" text-anchor="middle" fill="#526078" font-size="12">同名人群没有定义版本、计算时间和成员快照</text>
      <rect x="566" y="704" width="442" height="52" rx="8" fill="#fff1f2" stroke="#be123c"/>
      <text x="787" y="726" text-anchor="middle" fill="#9f1239" font-size="14" font-weight="700">权益无共同凭证 → 成本无法对账</text>
      <text x="787" y="746" text-anchor="middle" fill="#526078" font-size="12">发放、预算占用和核销之间没有同一 reservationId</text>
      <rect x="892" y="764" width="442" height="52" rx="8" fill="#fff1f2" stroke="#be123c"/>
      <text x="1113" y="786" text-anchor="middle" fill="#9f1239" font-size="14" font-weight="700">曝光定义不统一 → 归因失去可信输入</text>
      <text x="1113" y="806" text-anchor="middle" fill="#526078" font-size="12">发送、到达、展示和点击不能被重复计为真实曝光</text>
    </g>
