      <rect x="380" y="533" width="18" height="31" rx="4" fill="#fbbf24"/><rect x="406" y="518" width="18" height="46" rx="4" fill="#fbbf24"/>
      <g fill="#e2e8f0"><rect x="554" y="486" width="18" height="78" rx="4"/><rect x="580" y="486" width="18" height="78" rx="4"/><rect x="606" y="486" width="18" height="78" rx="4"/><rect x="632" y="486" width="18" height="78" rx="4"/><rect x="658" y="486" width="18" height="78" rx="4"/></g>
      <rect x="554" y="548" width="18" height="16" rx="4" fill="#fb7185"/>
      <g fill="#e2e8f0"><rect x="728" y="486" width="18" height="78" rx="4"/><rect x="754" y="486" width="18" height="78" rx="4"/><rect x="780" y="486" width="18" height="78" rx="4"/><rect x="806" y="486" width="18" height="78" rx="4"/><rect x="832" y="486" width="18" height="78" rx="4"/></g>
      <rect x="728" y="548" width="18" height="16" rx="4" fill="#fb7185"/>
      <g fill="#e2e8f0"><rect x="902" y="486" width="18" height="78" rx="4"/><rect x="928" y="486" width="18" height="78" rx="4"/><rect x="954" y="486" width="18" height="78" rx="4"/><rect x="980" y="486" width="18" height="78" rx="4"/><rect x="1006" y="486" width="18" height="78" rx="4"/></g>
      <rect x="902" y="533" width="18" height="31" rx="4" fill="#fbbf24"/><rect x="928" y="518" width="18" height="46" rx="4" fill="#fbbf24"/>
