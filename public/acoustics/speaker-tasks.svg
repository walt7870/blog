<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="700" viewBox="0 0 1400 700" role="img" aria-labelledby="speaker-tasks-title speaker-tasks-desc" id="speaker-tasks-root">
<title id="speaker-tasks-title">说话人相关的四个任务</title>
<desc id="speaker-tasks-desc">同一段 12 秒、两人交替并有重叠的音频，分别给出 VAD、说话人分离、声纹验证和目标说话人 ASR 的输出。</desc>
<defs><style>
#speaker-tasks-root text { font-family: Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #172b3a; }
#speaker-tasks-root .h { font-size: 26px; font-weight: 700; }
#speaker-tasks-root .t { font-size: 19px; font-weight: 600; }
#speaker-tasks-root .s { font-size: 15px; fill: #475569; }
#speaker-tasks-root .xs { font-size: 13px; fill: #64748b; }
#speaker-tasks-root .k { font-size: 13px; font-weight: 700; letter-spacing: .04em; fill: #64748b; }
#speaker-tasks-root .m { font-family: 'SFMono-Regular', Menlo, Consolas, monospace; font-size: 14px; fill: #172b3a; }
#speaker-tasks-root .node { fill: #fff; stroke: #cbd5e1; stroke-width: 2; }
#speaker-tasks-root .blue { fill: #eff6ff; stroke: #60a5fa; stroke-width: 2; }
#speaker-tasks-root .green { fill: #ecfdf5; stroke: #20a28c; stroke-width: 2; }
#speaker-tasks-root .red { fill: #fff1f2; stroke: #e88191; stroke-width: 2; }
#speaker-tasks-root .amber { fill: #fffbeb; stroke: #e0a63a; stroke-width: 2; }
#speaker-tasks-root .violet { fill: #f5f3ff; stroke: #9b87f5; stroke-width: 2; }
#speaker-tasks-root .gray { fill: #f1f5f9; stroke: #cbd5e1; stroke-width: 2; }
#speaker-tasks-root .fblue { fill: #93c5fd; } #speaker-tasks-root .fgreen { fill: #6ee7b7; } #speaker-tasks-root .fred { fill: #fda4af; }
#speaker-tasks-root .famber { fill: #fcd34d; } #speaker-tasks-root .fviolet { fill: #c4b5fd; } #speaker-tasks-root .fgray { fill: #e2e8f0; }
#speaker-tasks-root .edge { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#speaker-tasks-arrow); }
#speaker-tasks-root .dash { fill: none; stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 7 6; marker-end: url(#speaker-tasks-arrow); }
#speaker-tasks-root .line { stroke: #cbd5e1; stroke-width: 1.5; fill: none; }
#speaker-tasks-root .axis { stroke: #64748b; stroke-width: 2; fill: none; }
</style><marker id="speaker-tasks-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker></defs>
<rect width="1400" height="700" fill="#f8fafc"/>
<text x="32" y="46" class="h">同一段对话，四个任务给出四种答案</text>
<text x="32" y="78" class="s">两人交替说话，7.0—7.4 秒重叠；张三是事先登记过声音的目标说话人。</text>
<path d="M300 136H1284" class="axis"/><path d="M300 130V142" class="axis"/><text x="300" y="124" class="xs" text-anchor="middle">0s</text><path d="M464 130V142" class="axis"/><text x="464" y="124" class="xs" text-anchor="middle">2s</text><path d="M628 130V142" class="axis"/><text x="628" y="124" class="xs" text-anchor="middle">4s</text><path d="M792 130V142" class="axis"/><text x="792" y="124" class="xs" text-anchor="middle">6s</text><path d="M956 130V142" class="axis"/><text x="956" y="124" class="xs" text-anchor="middle">8s</text><path d="M1120 130V142" class="axis"/><text x="1120" y="124" class="xs" text-anchor="middle">10s</text><path d="M1284 130V142" class="axis"/><text x="1284" y="124" class="xs" text-anchor="middle">12s</text><g data-node="row-VAD"><rect x="32" y="160" width="244" height="76" rx="8" class="node"/><text x="50" y="196" class="t">VAD</text><text x="50" y="224" class="s">哪里有人声</text></g><path d="M300 198H1284" class="line"/><rect x="341" y="180" width="303.4000000000001" height="36" rx="4" class="fgray"/><text x="492.70000000000005" y="203" text-anchor="middle" class="xs">语音</text><rect x="693.5999999999999" y="180" width="311.6" height="36" rx="4" class="fgray"/><text x="849.3999999999999" y="203" text-anchor="middle" class="xs">语音</text><rect x="1054.4" y="180" width="196.79999999999973" height="36" rx="4" class="fgray"/><text x="1152.8" y="203" text-anchor="middle" class="xs">语音</text><g data-node="row-说话人分离"><rect x="32" y="260" width="244" height="76" rx="8" class="node"/><text x="50" y="296" class="t">说话人分离</text><text x="50" y="324" class="s">谁在什么时候说（匿名）</text></g><path d="M300 298H1284" class="line"/><rect x="341" y="268" width="303.4000000000001" height="30" rx="4" class="fblue"/><text x="492.70000000000005" y="288" text-anchor="middle" class="xs">spk0</text><rect x="693.5999999999999" y="268" width="213.20000000000016" height="30" rx="4" class="fgreen"/><text x="800.2" y="288" text-anchor="middle" class="xs">spk1</text><rect x="874" y="304" width="131.19999999999993" height="30" rx="4" class="fblue"/><text x="939.5999999999999" y="324" text-anchor="middle" class="xs">spk0</text><rect x="1054.4" y="268" width="196.79999999999973" height="30" rx="4" class="fgreen"/><text x="1152.8" y="288" text-anchor="middle" class="xs">spk1</text><g data-node="row-声纹验证"><rect x="32" y="380" width="244" height="76" rx="8" class="node"/><text x="50" y="416" class="t">声纹验证</text><text x="50" y="444" class="s">这段是不是登记的张三</text></g><path d="M300 418H1284" class="line"/><rect x="341" y="400" width="303.4000000000001" height="36" rx="4" class="fgreen"/><text x="492.70000000000005" y="423" text-anchor="middle" class="xs">是 0.81</text><rect x="693.5999999999999" y="400" width="180.4000000000001" height="36" rx="4" class="fred"/><text x="783.8" y="423" text-anchor="middle" class="xs">否 0.12</text><rect x="906.8000000000001" y="400" width="98.39999999999986" height="36" rx="4" class="fgreen"/><text x="956" y="423" text-anchor="middle" class="xs">是 0.74</text><rect x="1054.4" y="400" width="196.79999999999973" height="36" rx="4" class="fred"/><text x="1152.8" y="423" text-anchor="middle" class="xs">否 0.09</text><g data-node="row-目标说话人 ASR"><rect x="32" y="480" width="244" height="76" rx="8" class="node"/><text x="50" y="516" class="t">目标说话人 ASR</text><text x="50" y="544" class="s">只转写张三说的话</text></g><path d="M300 518H1284" class="line"/><rect x="341" y="500" width="303.4000000000001" height="36" rx="4" class="fviolet"/><text x="492.70000000000005" y="523" text-anchor="middle" class="xs">“下周三开评审会”</text><rect x="874" y="500" width="131.19999999999993" height="36" rx="4" class="fviolet"/><text x="939.5999999999999" y="523" text-anchor="middle" class="xs">“我来定”</text><text x="874" y="352" class="xs">7.0—7.4 s 两人重叠</text><g data-node="note"><rect x="32" y="588" width="1336" height="76" rx="8" class="amber"/><text x="50" y="624" class="t">它们的输出不能互相顶替</text><text x="50" y="652" class="s">分离给出的 spk0 只在本次会话内有意义，不等于张三；验证要先有登记录音；目标说话人 ASR 把登记参考作为模型输入；先用分离结果剪音频是另一种做法，重叠处易丢字或混入他人。</text></g>
</svg>
