<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="600" viewBox="0 0 1120 600" role="img" aria-labelledby="vad-state-flow-title vad-state-flow-desc"><title id="vad-state-flow-title">分段器确认开始与结束，也必须撤销未满足条件的候选</title><desc id="vad-state-flow-desc">应用层通用四状态示意；Silero VADIterator不等同于这套带最短语音确认的完整分段器。</desc><defs><marker id="vad-state-flow-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#52616b"/></marker><style>text{font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;fill:#17252a;letter-spacing:0}.h{font-size:26px;font-weight:600}.t{font-size:20px;font-weight:600}.s{font-size:17px;fill:#43545b}.b{fill:#edf4fa;stroke:#4280a8;stroke-width:1.5}.g{fill:#eaf5ed;stroke:#488661;stroke-width:1.5}.r{fill:#f5eef2;stroke:#a46a84;stroke-width:1.5}.e{fill:none;stroke:#52616b;stroke-width:2;marker-end:url(#vad-state-flow-arrow)}.d{stroke-dasharray:6 5}</style></defs><rect width="1120" height="600" fill="white"/><text x="32" y="44" class="h" text-anchor="start">分段器确认开始与结束，也必须撤销未满足条件的候选</text><text x="32" y="78" class="s" text-anchor="start">应用层通用四状态示意；Silero VADIterator不等同于这套带最短语音确认的完整分段器。</text><path d="M286 194H428" class="e"/><path d="M692 194H832" class="e"/><path d="M964 246V388" class="e"/><path d="M832 444H164Q156 444 156 436V246" class="e"/><path d="M560 142V112Q560 104 552 104H164Q156 104 156 112V142" class="e"/><path d="M1088 444H1098Q1106 444 1106 436V202Q1106 194 1098 194H1088" class="e"/><rect x="32" y="142" width="254" height="104" rx="6" class="b"/><text x="48" y="174" class="t" text-anchor="start">未说话 idle</text><text x="48" y="202" class="s" text-anchor="start">持续保留前置缓存</text><rect x="428" y="142" width="264" height="104" rx="6" class="b"/><text x="444" y="174" class="t" text-anchor="start">候选语音 starting</text><text x="444" y="202" class="s" text-anchor="start">累计满足起始条件</text><rect x="832" y="142" width="256" height="104" rx="6" class="g"/><text x="848" y="174" class="t" text-anchor="start">说话中 speech</text><text x="848" y="202" class="s" text-anchor="start">确认开始，回补字头</text><rect x="832" y="388" width="256" height="112" rx="6" class="b"/><text x="848" y="420" class="t" text-anchor="start">候选结束 ending</text><text x="848" y="448" class="s" text-anchor="start">累计低概率时长</text><text x="848" y="474" class="s" text-anchor="start">仍保留尾部音频</text><rect x="276" y="164" width="160" height="28" fill="white"/><text x="356" y="184" class="s" text-anchor="middle">p ≥ 起始阈值</text><rect x="698" y="164" width="124" height="28" fill="white"/><text x="760" y="184" class="s" text-anchor="middle">达到最短语音</text><rect x="259" y="84" width="142" height="28" fill="white"/><text x="330" y="104" class="s" text-anchor="middle">候选失败，回退</text><rect x="884" y="306" width="160" height="28" fill="white"/><text x="964" y="326" class="s" text-anchor="middle">p &lt; 结束阈值</text><rect x="400" y="424" width="340" height="28" fill="white"/><text x="570" y="444" class="s" text-anchor="middle">达到最短静音 / 输出结束，裁定片段</text><text x="310" y="320" class="t" text-anchor="start">概率恢复：撤销结束，回到说话中。</text><text x="310" y="354" class="s" text-anchor="start">右侧回路表示恢复；短停顿不立即封口。</text><text x="32" y="550" class="s" text-anchor="start">EOF：仅提交一次剩余音频；尚未结束的活动片段以真实样本长度封口，随后重置会话。</text><text x="32" y="582" class="s" text-anchor="start">最大段长、候选超时和异常断开由应用另设上限；时间戳来自采样点，不能按回调次数估计。</text></svg>
