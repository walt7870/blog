<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="796" viewBox="0 0 1400 796" role="img" aria-labelledby="npu-asr-convert-pipeline-title npu-asr-convert-pipeline-desc" id="npu-asr-convert-pipeline-root">
<title id="npu-asr-convert-pipeline-title">转换流水线与三道关卡</title>
<desc id="npu-asr-convert-pipeline-desc">从上游 FP32 图经固定形状与算子重写、后量化、离线编译得到设备模型，三道关卡分别是算子集预检、宿主等价性验证和设备准入，并列出各自漏掉的问题。</desc>
<defs><style>
#npu-asr-convert-pipeline-root text { font-family: Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #172b3a; }
#npu-asr-convert-pipeline-root .h { font-size: 26px; font-weight: 700; }
#npu-asr-convert-pipeline-root .t { font-size: 19px; font-weight: 600; }
#npu-asr-convert-pipeline-root .s { font-size: 15px; fill: #475569; }
#npu-asr-convert-pipeline-root .xs { font-size: 13px; fill: #64748b; }
#npu-asr-convert-pipeline-root .k { font-size: 13px; font-weight: 700; letter-spacing: .04em; fill: #64748b; }
#npu-asr-convert-pipeline-root .m { font-family: 'SFMono-Regular', Menlo, Consolas, monospace; font-size: 14px; fill: #172b3a; }
#npu-asr-convert-pipeline-root .node { fill: #fff; stroke: #cbd5e1; stroke-width: 2; }
#npu-asr-convert-pipeline-root .blue { fill: #eff6ff; stroke: #60a5fa; stroke-width: 2; }
#npu-asr-convert-pipeline-root .green { fill: #ecfdf5; stroke: #20a28c; stroke-width: 2; }
#npu-asr-convert-pipeline-root .red { fill: #fff1f2; stroke: #e88191; stroke-width: 2; }
#npu-asr-convert-pipeline-root .amber { fill: #fffbeb; stroke: #e0a63a; stroke-width: 2; }
#npu-asr-convert-pipeline-root .violet { fill: #f5f3ff; stroke: #9b87f5; stroke-width: 2; }
#npu-asr-convert-pipeline-root .gray { fill: #f1f5f9; stroke: #cbd5e1; stroke-width: 2; }
#npu-asr-convert-pipeline-root .fblue { fill: #93c5fd; } #npu-asr-convert-pipeline-root .fgreen { fill: #6ee7b7; } #npu-asr-convert-pipeline-root .fred { fill: #fda4af; }
#npu-asr-convert-pipeline-root .famber { fill: #fcd34d; } #npu-asr-convert-pipeline-root .fviolet { fill: #c4b5fd; } #npu-asr-convert-pipeline-root .fgray { fill: #e2e8f0; }
#npu-asr-convert-pipeline-root .edge { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#npu-asr-convert-pipeline-arrow); }
#npu-asr-convert-pipeline-root .dash { fill: none; stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 7 6; marker-end: url(#npu-asr-convert-pipeline-arrow); }
#npu-asr-convert-pipeline-root .line { stroke: #cbd5e1; stroke-width: 1.5; fill: none; }
#npu-asr-convert-pipeline-root .axis { stroke: #64748b; stroke-width: 2; fill: none; }
</style><marker id="npu-asr-convert-pipeline-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker></defs>
<rect width="1400" height="796" fill="#f8fafc"/>
<text x="32" y="46" class="h">从导出的图到设备肯收的模型</text>
<text x="32" y="78" class="s">四步串起来不难，难在每一步后面都要有一道能独立否掉它的关卡，而三道关卡各有各的盲区。</text>
<g data-node="s0"><rect x="32" y="128" width="300" height="119" rx="8" class="gray"/><text x="50" y="154" class="k">第 1 步</text><text x="50" y="180" class="t">上游 FP32 图</text><text x="50" y="208" class="s">10891 节点，batch 维是符号维，是</text><text x="50" y="231" class="s">所有后续产物的起点。</text></g><path d="M332 192H368" class="edge"/><g data-node="s1"><rect x="372" y="128" width="300" height="119" rx="8" class="blue"/><text x="390" y="154" class="k">第 2 步</text><text x="390" y="180" class="t">固定形状与算子重写</text><text x="390" y="208" class="s">按目标批次固定输入形状，替换设备拒</text><text x="390" y="231" class="s">收的算子，共改 20 个节点。</text></g><path d="M672 192H708" class="edge"/><g data-node="s2"><rect x="712" y="128" width="300" height="119" rx="8" class="violet"/><text x="730" y="154" class="k">第 3 步</text><text x="730" y="180" class="t">后量化</text><text x="730" y="208" class="s">权重按绝对值最大、激活按滑动极值定</text><text x="730" y="231" class="s">标；校准集要求全静态形状。</text></g><path d="M1012 192H1048" class="edge"/><g data-node="s3"><rect x="1052" y="128" width="300" height="119" rx="8" class="green"/><text x="1070" y="154" class="k">第 4 步</text><text x="1070" y="180" class="t">离线编译</text><text x="1070" y="208" class="s">编译成设备可加载的模型文件，编译器</text><text x="1070" y="231" class="s">自己会消除冗余转置。</text></g><path d="M522 247V279" class="edge"/><g data-node="g372"><rect x="372" y="283" width="300" height="103" rx="8" class="amber"/><text x="390" y="319" class="t">关卡一：算子集预检</text><text x="390" y="347" class="s">只做静态检查，不跑数值。实测 3766</text><text x="390" y="370" class="s">个节点全部支持。</text></g><path d="M862 247V279" class="edge"/><g data-node="g712"><rect x="712" y="283" width="300" height="103" rx="8" class="amber"/><text x="730" y="319" class="t">关卡二：宿主等价性验证</text><text x="730" y="347" class="s">重写前后同一批输入喂两次，117 路</text><text x="730" y="370" class="s">输出逐一比对偏差。</text></g><path d="M1202 247V279" class="edge"/><g data-node="g1052"><rect x="1052" y="283" width="300" height="103" rx="8" class="amber"/><text x="1070" y="319" class="t">关卡三：设备准入</text><text x="1070" y="347" class="s">兼容性查询返回 0 才算收，再看张量</text><text x="1070" y="370" class="s">路数与构建耗时。</text></g><g data-node="ex"><rect x="32" y="418" width="644" height="188" rx="8" class="red"/><text x="50" y="444" class="k">失败反例</text><text x="50" y="470" class="t">三道关卡各自漏掉什么</text><text x="50" y="498" class="s">关卡一通过不代表图是自洽的：一处漏改的整数位宽让宿主运行时报错，而离线编译器照样</text><text x="50" y="521" class="s">接受并产出了模型文件。</text><text x="50" y="544" class="s">关卡二通过不代表设备会收：批次为 16 的图在宿主上 117 路输出都对，设备仍在构建阶</text><text x="50" y="567" class="s">段拒收。</text><text x="50" y="590" class="s">关卡三通过不代表值得用：模型收下来了，但每拍比 CPU 慢。</text></g><g data-node="rw"><rect x="716" y="418" width="652" height="165" rx="8" class="blue"/><text x="734" y="444" class="k">怎么改</text><text x="734" y="470" class="t">重写要保持语义，不只是换名字</text><text x="734" y="498" class="s">掩码类算子不能直接删：上游用 −1 占位表示「没有历史」，去掉掩码会把占位当成真实索</text><text x="734" y="521" class="s">引；换成零填充查表后，占位行天然取到零。</text><text x="734" y="544" class="s">末尾的降维算子被适配层拒收时，换成等价的形状重排即可，输出字节完全一致。</text><text x="734" y="567" class="s">整数位宽也要改：设备侧的加法不收 64 位整数。</text></g><g data-node="verify"><rect x="32" y="638" width="1336" height="126" rx="8" class="green"/><text x="50" y="674" class="t">偏差到多少算过</text><text x="50" y="702" class="s">逐位一致是最强的判据：decoder 的两处重写在 2506 组输入上做到逐位一致，可以直接宣布等价。encoder 固定批次时做过常量折叠，重写后 117 路输出最大绝对偏差 9.59e-4，属于浮点</text><text x="50" y="725" class="s">重排的量级。</text><text x="50" y="748" class="s">但它只能说明「图没改错」，不能替代识别准确率的评测。两者要分开写进验收口径：等价性验证保证换图没引入错误，准确率评测回答换了精度之后业务还能不能用。</text></g>
</svg>
