<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="730" viewBox="0 0 1120 730" role="img" aria-labelledby="engineering-deployment-choice-title engineering-deployment-choice-desc"><title id="engineering-deployment-choice-title">先用离线边界选路线，再用目标设备决定能否交付</title><desc id="engineering-deployment-choice-desc">同一模型的文件转写吞吐与实时交互延迟不同；以下是候选路线，最终均需回放与设备验证。</desc><defs><marker id="engineering-deployment-choice-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#52616b"/></marker><style>text{font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;fill:#17252a;letter-spacing:0}.h{font-size:26px;font-weight:600}.t{font-size:20px;font-weight:600}.s{font-size:17px;fill:#43545b}.b{fill:#edf4fa;stroke:#4280a8;stroke-width:1.5}.g{fill:#eaf5ed;stroke:#488661;stroke-width:1.5}.r{fill:#f5eef2;stroke:#a46a84;stroke-width:1.5}.e{fill:none;stroke:#52616b;stroke-width:2;marker-end:url(#engineering-deployment-choice-arrow)}.d{stroke-dasharray:6 5}</style></defs><rect width="1120" height="730" fill="white"/><text x="32" y="44" class="h" text-anchor="start">先用离线边界选路线，再用目标设备决定能否交付</text><text x="32" y="78" class="s" text-anchor="start">同一模型的文件转写吞吐与实时交互延迟不同；以下是候选路线，最终均需回放与设备验证。</text><path d="M332 190H448" class="e"/><path d="M332 240V448Q332 456 340 456H448" class="e"/><path d="M724 190H824" class="e"/><path d="M586 246V294" class="e"/><path d="M724 456H824" class="e"/><path d="M586 512V574" class="e"/><rect x="32" y="146" width="300" height="120" rx="6" class="b"/><text x="48" y="178" class="t" text-anchor="start">部署边界</text><text x="48" y="206" class="s" text-anchor="start">必须离线 / 禁止上传？</text><text x="48" y="232" class="s" text-anchor="start">还是允许远端处理？</text><rect x="448" y="134" width="276" height="112" rx="6" class="b"/><text x="464" y="166" class="t" text-anchor="start">本地实测是否达标？</text><text x="464" y="194" class="s" text-anchor="start">内存、持续RTF、延迟</text><text x="464" y="220" class="s" text-anchor="start">功耗、语言与效果</text><rect x="824" y="134" width="264" height="112" rx="6" class="g"/><text x="840" y="166" class="t" text-anchor="start">端侧方案</text><text x="840" y="194" class="s" text-anchor="start">短句与长文本均可</text><text x="840" y="220" class="s" text-anchor="start">能力由模型和设备决定</text><rect x="448" y="294" width="276" height="64" rx="6" class="r"/><text x="464" y="326" class="t" text-anchor="start">升级设备 / 降低模型规模</text><rect x="448" y="400" width="276" height="112" rx="6" class="b"/><text x="464" y="432" class="t" text-anchor="start">远端候选评估</text><text x="464" y="460" class="s" text-anchor="start">网络、费用、数据边界</text><text x="464" y="486" class="s" text-anchor="start">负载、故障与回退</text><rect x="824" y="400" width="264" height="112" rx="6" class="g"/><text x="840" y="432" class="t" text-anchor="start">云端 / 私有服务</text><text x="840" y="460" class="s" text-anchor="start">确认数据和网络可用</text><text x="840" y="486" class="s" text-anchor="start">结合离线降级</text><rect x="448" y="574" width="640" height="78" rx="6" class="b"/><text x="464" y="606" class="t" text-anchor="start">混合方案：明确结果所有者与幂等请求</text><text x="464" y="634" class="s" text-anchor="start">本地先执行后，远端补强不得重复触发同一业务。</text><rect x="364" y="160" width="52" height="28" fill="white"/><text x="390" y="180" class="s" text-anchor="middle">必须</text><rect x="292" y="310" width="88" height="28" fill="white"/><text x="336" y="330" class="s" text-anchor="middle">允许上传</text><rect x="748" y="160" width="52" height="28" fill="white"/><text x="774" y="180" class="s" text-anchor="middle">达标</text><rect x="551" y="258" width="70" height="28" fill="white"/><text x="586" y="278" class="s" text-anchor="middle">未达标</text><rect x="750" y="426" width="52" height="28" fill="white"/><text x="776" y="446" class="s" text-anchor="middle">通过</text><rect x="560" y="534" width="52" height="28" fill="white"/><text x="586" y="554" class="s" text-anchor="middle">组合</text><text x="32" y="698" class="s" text-anchor="start">必须离线且设备不达标时，调整设备与需求；不能静默切到云端。</text></svg>
