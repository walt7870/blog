<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="578" viewBox="0 0 1120 578" role="img" aria-labelledby="structure-sound-paths-title structure-sound-paths-desc"><title id="structure-sound-paths-title">麦克风同时收到目标人声、反射与设备自播声</title><desc id="structure-sound-paths-desc">实线表示空气传播，虚线表示设备结构耦合；先对比原始分路录音，再调整算法。</desc><defs><marker id="structure-sound-paths-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#52616b"/></marker><style>text{font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;fill:#17252a;letter-spacing:0}.h{font-size:26px;font-weight:600}.t{font-size:20px;font-weight:600}.s{font-size:17px;fill:#43545b}.b{fill:#edf4fa;stroke:#4280a8;stroke-width:1.5}.g{fill:#eaf5ed;stroke:#488661;stroke-width:1.5}.r{fill:#f5eef2;stroke:#a46a84;stroke-width:1.5}.e{fill:none;stroke:#52616b;stroke-width:2;marker-end:url(#structure-sound-paths-arrow)}.d{stroke-dasharray:6 5}</style></defs><rect width="1120" height="578" fill="white"/><text x="32" y="44" class="h" text-anchor="start">麦克风同时收到目标人声、反射与设备自播声</text><text x="32" y="78" class="s" text-anchor="start">实线表示空气传播，虚线表示设备结构耦合；先对比原始分路录音，再调整算法。</text><path d="M256 210H824" class="e"/><path d="M180 258V302Q180 310 188 310H380" class="e"/><path d="M644 352H740Q748 352 748 344V238Q748 230 756 230H824" class="e"/><path d="M956 392V258" class="e"/><path d="M824 470H800Q792 470 792 462V282Q792 274 800 274H900Q908 274 908 266V258" class="e d"/><rect x="32" y="156" width="224" height="102" rx="6" class="b"/><text x="48" y="188" class="t" text-anchor="start">说话人</text><text x="48" y="216" class="s" text-anchor="start">直达声随距离衰减</text><rect x="380" y="284" width="264" height="112" rx="6" class="b"/><text x="396" y="316" class="t" text-anchor="start">墙面与桌面</text><text x="396" y="344" class="s" text-anchor="start">反射、遮挡、混响</text><text x="396" y="370" class="s" text-anchor="start">房间改变传播路径</text><rect x="824" y="156" width="264" height="102" rx="6" class="g"/><text x="840" y="188" class="t" text-anchor="start">声孔与麦克风</text><text x="840" y="216" class="s" text-anchor="start">网布、密封影响频响</text><rect x="824" y="392" width="264" height="112" rx="6" class="r"/><text x="840" y="424" class="t" text-anchor="start">设备扬声器</text><text x="840" y="452" class="s" text-anchor="start">播放声进入空气</text><text x="840" y="478" class="s" text-anchor="start">腔体与外壳也会振动</text><rect x="447" y="176" width="106" height="28" fill="white"/><text x="500" y="196" class="s" text-anchor="middle">目标直达声</text><rect x="912" y="310" width="88" height="28" fill="white"/><text x="956" y="330" class="s" text-anchor="middle">空气回声</text><rect x="672" y="472" width="88" height="28" fill="white"/><text x="716" y="492" class="s" text-anchor="middle">结构漏音</text><text x="32" y="540" class="s" text-anchor="start">改开孔或密封后重新测频响与多麦一致性；AEC不能恢复被结构遮挡的辅音。</text></svg>
