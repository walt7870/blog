<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="570" viewBox="0 0 1120 570" role="img" aria-labelledby="tts-acoustic-vocoder-title tts-acoustic-vocoder-desc"><title id="tts-acoustic-vocoder-title">文本条件经过生成模型成为音频，再交给播放器</title><desc id="tts-acoustic-vocoder-desc">示意常见声学特征路线；codec token等模型可能合并或替换中间阶段。</desc><defs><marker id="tts-acoustic-vocoder-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#52616b"/></marker><style>text{font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;fill:#17252a;letter-spacing:0}.h{font-size:26px;font-weight:600}.t{font-size:20px;font-weight:600}.s{font-size:17px;fill:#43545b}.b{fill:#edf4fa;stroke:#4280a8;stroke-width:1.5}.g{fill:#eaf5ed;stroke:#488661;stroke-width:1.5}.r{fill:#f5eef2;stroke:#a46a84;stroke-width:1.5}.e{fill:none;stroke:#52616b;stroke-width:2;marker-end:url(#tts-acoustic-vocoder-arrow)}.d{stroke-dasharray:6 5}</style></defs><rect width="1120" height="570" fill="white"/><text x="32" y="44" class="h" text-anchor="start">文本条件经过生成模型成为音频，再交给播放器</text><text x="32" y="78" class="s" text-anchor="start">示意常见声学特征路线；codec token等模型可能合并或替换中间阶段。</text><path d="M246 194H304" class="e"/><path d="M528 194H588" class="e"/><path d="M812 194H872" class="e"/><path d="M980 246V350" class="e"/><path d="M416 350V246" class="e d"/><rect x="32" y="142" width="214" height="104" rx="6" class="b"/><text x="48" y="174" class="t" text-anchor="start">文本前端 / 分句</text><text x="48" y="202" class="s" text-anchor="start">数字、单位、多音字</text><text x="48" y="228" class="s" text-anchor="start">按可朗读边界送入</text><rect x="304" y="142" width="224" height="104" rx="6" class="b"/><text x="320" y="174" class="t" text-anchor="start">声学生成</text><text x="320" y="202" class="s" text-anchor="start">韵律与声学特征</text><text x="320" y="228" class="s" text-anchor="start">可能包含内部对齐</text><rect x="588" y="142" width="224" height="104" rx="6" class="b"/><text x="604" y="174" class="t" text-anchor="start">声码器 / 解码器</text><text x="604" y="202" class="s" text-anchor="start">特征转为波形</text><text x="604" y="228" class="s" text-anchor="start">按模型合同出音频</text><rect x="872" y="142" width="216" height="104" rx="6" class="g"/><text x="888" y="174" class="t" text-anchor="start">播放适配</text><text x="888" y="202" class="s" text-anchor="start">响度、限幅、重采样</text><text x="888" y="228" class="s" text-anchor="start">生成有序PCM分片</text><rect x="304" y="350" width="224" height="104" rx="6" class="b"/><text x="320" y="382" class="t" text-anchor="start">音色与风格条件</text><text x="320" y="410" class="s" text-anchor="start">参考音频或说话人ID</text><text x="320" y="436" class="s" text-anchor="start">具体接口依模型确定</text><rect x="872" y="350" width="216" height="104" rx="6" class="g"/><text x="888" y="382" class="t" text-anchor="start">播放器与设备</text><text x="888" y="410" class="s" text-anchor="start">缓冲 / DAC / 喇叭</text><text x="888" y="436" class="s" text-anchor="start">同步送AEC参考</text><rect x="936" y="286" width="88" height="28" fill="white"/><text x="980" y="306" class="s" text-anchor="middle">音频数据</text><rect x="372" y="290" width="88" height="28" fill="white"/><text x="416" y="310" class="s" text-anchor="middle">模型条件</text><text x="32" y="510" class="s" text-anchor="start">文本流式切分、模型逐块生成和播放器分片传输是三层能力，不能仅凭HTTP分块宣称模型流式。</text><text x="32" y="546" class="s" text-anchor="start">用户打断时取消生成并清空旧轮次播放队列，迟到的旧音频不再入队。</text></svg>
