<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="780" viewBox="0 0 1400 780" role="img" aria-labelledby="asr-families-title asr-families-desc" id="asr-families-root">
<title id="asr-families-title">端到端语音识别的四类结构</title>
<desc id="asr-families-desc">同一段音频分别进入 CTC、Transducer、编码器-解码器和音频编码器加大语言模型四类结构，对比解码方式、长处、代价与代表模型。</desc>
<defs><style>
#asr-families-root text { font-family: Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #172b3a; }
#asr-families-root .h { font-size: 26px; font-weight: 700; }
#asr-families-root .t { font-size: 19px; font-weight: 600; }
#asr-families-root .s { font-size: 15px; fill: #475569; }
#asr-families-root .xs { font-size: 13px; fill: #64748b; }
#asr-families-root .k { font-size: 13px; font-weight: 700; letter-spacing: .04em; fill: #64748b; }
#asr-families-root .m { font-family: 'SFMono-Regular', Menlo, Consolas, monospace; font-size: 14px; fill: #172b3a; }
#asr-families-root .node { fill: #fff; stroke: #cbd5e1; stroke-width: 2; }
#asr-families-root .blue { fill: #eff6ff; stroke: #60a5fa; stroke-width: 2; }
#asr-families-root .green { fill: #ecfdf5; stroke: #20a28c; stroke-width: 2; }
#asr-families-root .red { fill: #fff1f2; stroke: #e88191; stroke-width: 2; }
#asr-families-root .amber { fill: #fffbeb; stroke: #e0a63a; stroke-width: 2; }
#asr-families-root .violet { fill: #f5f3ff; stroke: #9b87f5; stroke-width: 2; }
#asr-families-root .gray { fill: #f1f5f9; stroke: #cbd5e1; stroke-width: 2; }
#asr-families-root .fblue { fill: #93c5fd; } #asr-families-root .fgreen { fill: #6ee7b7; } #asr-families-root .fred { fill: #fda4af; }
#asr-families-root .famber { fill: #fcd34d; } #asr-families-root .fviolet { fill: #c4b5fd; } #asr-families-root .fgray { fill: #e2e8f0; }
#asr-families-root .edge { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#asr-families-arrow); }
#asr-families-root .dash { fill: none; stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 7 6; marker-end: url(#asr-families-arrow); }
#asr-families-root .line { stroke: #cbd5e1; stroke-width: 1.5; fill: none; }
#asr-families-root .axis { stroke: #64748b; stroke-width: 2; fill: none; }
</style><marker id="asr-families-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker></defs>
<rect width="1400" height="780" fill="#f8fafc"/>
<text x="32" y="46" class="h">端到端识别模型的四类结构</text>
<text x="32" y="78" class="s">区别在于“文字怎样从音频向量里生成出来”：逐帧判、边读边判、读完整段再写、交给大模型写。</text>
<g data-node="in-0"><rect x="32" y="112" width="312" height="84" rx="8" class="gray"/><text x="50" y="148" class="t">同一段音频</text><text x="50" y="176" class="s">16 kHz PCM → Fbank 特征</text></g><path d="M188 198V222" class="edge"/><g data-node="arch-0"><rect x="32" y="224" width="312" height="128" rx="8" class="blue"/><text x="50" y="250" class="k">CTC</text><text x="50" y="276" class="t">编码器 + CTC</text><text x="50" y="304" class="s">每一帧独立输出一个 token</text><text x="50" y="327" class="s">或空白，合并重复后得到文字</text></g><path d="M188 354V380" class="edge"/><g data-node="pro-0"><rect x="32" y="382" width="312" height="96" rx="8" class="green"/><text x="50" y="418" class="t">长处</text><text x="50" y="446" class="s">并行解码，快</text><text x="50" y="469" class="s">可做流式</text></g><g data-node="con-0"><rect x="32" y="494" width="312" height="96" rx="8" class="red"/><text x="50" y="530" class="t">代价</text><text x="50" y="558" class="s">帧之间条件独立</text><text x="50" y="581" class="s">上下文常靠外部语言模型补</text></g><g data-node="ex-0"><rect x="32" y="606" width="312" height="76" rx="8" class="node"/><text x="50" y="642" class="t">代表模型</text><text x="50" y="670" class="s">SenseVoice-Small、Parakeet-CTC</text></g><g data-node="in-1"><rect x="368" y="112" width="312" height="84" rx="8" class="gray"/><text x="386" y="148" class="t">同一段音频</text><text x="386" y="176" class="s">16 kHz PCM → Fbank 特征</text></g><path d="M524 198V222" class="edge"/><g data-node="arch-1"><rect x="368" y="224" width="312" height="128" rx="8" class="green"/><text x="386" y="250" class="k">Transducer</text><text x="386" y="276" class="t">编码器 + 预测网络</text><text x="386" y="304" class="s">联合网络每帧决定：输出</text><text x="386" y="327" class="s">token，还是读下一帧</text></g><path d="M524 354V380" class="edge"/><g data-node="pro-1"><rect x="368" y="382" width="312" height="96" rx="8" class="green"/><text x="386" y="418" class="t">长处</text><text x="386" y="446" class="s">天然流式</text><text x="386" y="469" class="s">解码时可加热词偏置</text></g><g data-node="con-1"><rect x="368" y="494" width="312" height="96" rx="8" class="red"/><text x="386" y="530" class="t">代价</text><text x="386" y="558" class="s">训练显存大</text><text x="386" y="581" class="s">结构比 CTC 复杂</text></g><g data-node="ex-1"><rect x="368" y="606" width="312" height="76" rx="8" class="node"/><text x="386" y="642" class="t">代表模型</text><text x="386" y="670" class="s">Zipformer、Parakeet-TDT</text></g><g data-node="in-2"><rect x="704" y="112" width="312" height="84" rx="8" class="gray"/><text x="722" y="148" class="t">同一段音频</text><text x="722" y="176" class="s">16 kHz PCM → Fbank 特征</text></g><path d="M860 198V222" class="edge"/><g data-node="arch-2"><rect x="704" y="224" width="312" height="128" rx="8" class="amber"/><text x="722" y="250" class="k">编码器-解码器</text><text x="722" y="276" class="t">编码器 + 自回归解码器</text><text x="722" y="304" class="s">解码器用交叉注意力读整段</text><text x="722" y="327" class="s">音频，逐个生成 token</text></g><path d="M860 354V380" class="edge"/><g data-node="pro-2"><rect x="704" y="382" width="312" height="96" rx="8" class="green"/><text x="722" y="418" class="t">长处</text><text x="722" y="446" class="s">整段上下文，准确率高</text><text x="722" y="469" class="s">一并输出标点和语言</text></g><g data-node="con-2"><rect x="704" y="494" width="312" height="96" rx="8" class="red"/><text x="722" y="530" class="t">代价</text><text x="722" y="558" class="s">通常非流式</text><text x="722" y="581" class="s">静音和噪声上会幻觉</text></g><g data-node="ex-2"><rect x="704" y="606" width="312" height="76" rx="8" class="node"/><text x="722" y="642" class="t">代表模型</text><text x="722" y="670" class="s">Whisper、Canary</text></g><g data-node="in-3"><rect x="1040" y="112" width="312" height="84" rx="8" class="gray"/><text x="1058" y="148" class="t">同一段音频</text><text x="1058" y="176" class="s">16 kHz PCM → Fbank 特征</text></g><path d="M1196 198V222" class="edge"/><g data-node="arch-3"><rect x="1040" y="224" width="312" height="128" rx="8" class="violet"/><text x="1058" y="250" class="k">大模型路线</text><text x="1058" y="276" class="t">音频编码器 + 大语言模型</text><text x="1058" y="304" class="s">音频向量经适配层投影成</text><text x="1058" y="327" class="s">LLM 的输入，由 LLM 生成文字</text></g><path d="M1196 354V380" class="edge"/><g data-node="pro-3"><rect x="1040" y="382" width="312" height="96" rx="8" class="green"/><text x="1058" y="418" class="t">长处</text><text x="1058" y="446" class="s">语言知识强，可用提示词</text><text x="1058" y="469" class="s">给上下文和热词</text></g><g data-node="con-3"><rect x="1040" y="494" width="312" height="96" rx="8" class="red"/><text x="1058" y="530" class="t">代价</text><text x="1058" y="558" class="s">参数大、首字慢</text><text x="1058" y="581" class="s">幻觉风险与 LLM 相同</text></g><g data-node="ex-3"><rect x="1040" y="606" width="312" height="76" rx="8" class="node"/><text x="1058" y="642" class="t">代表模型</text><text x="1058" y="670" class="s">Qwen3-ASR、FireRedASR-LLM</text></g><text x="32" y="732" class="s">非自回归的 Paraformer 介于第一、三类之间：先用 CIF 预测这段有几个字，再由解码器一次并行生成全部字，不逐字等待。</text>
</svg>
