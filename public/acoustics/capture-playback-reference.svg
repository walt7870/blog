<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="602" viewBox="0 0 1120 602" role="img" aria-labelledby="capture-playback-reference-title capture-playback-reference-desc"><title id="capture-playback-reference-title">AEC 需要采集 PCM，也需要完整且对齐的播放参考</title><desc id="capture-playback-reference-desc">参考通常取自实际混音和音量处理之后；硬件非线性、系统旁路声与时钟漂移仍须实测。</desc><defs><marker id="capture-playback-reference-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#52616b"/></marker><style>text{font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;fill:#17252a;letter-spacing:0}.h{font-size:26px;font-weight:600}.t{font-size:20px;font-weight:600}.s{font-size:17px;fill:#43545b}.b{fill:#edf4fa;stroke:#4280a8;stroke-width:1.5}.g{fill:#eaf5ed;stroke:#488661;stroke-width:1.5}.r{fill:#f5eef2;stroke:#a46a84;stroke-width:1.5}.e{fill:none;stroke:#52616b;stroke-width:2;marker-end:url(#capture-playback-reference-arrow)}.d{stroke-dasharray:6 5}</style></defs><rect width="1120" height="602" fill="white"/><text x="32" y="44" class="h" text-anchor="start">AEC 需要采集 PCM，也需要完整且对齐的播放参考</text><text x="32" y="78" class="s" text-anchor="start">参考通常取自实际混音和音量处理之后；硬件非线性、系统旁路声与时钟漂移仍须实测。</text><path d="M236 180H320" class="e"/><path d="M576 180H644" class="e"/><path d="M856 180H940" class="e"/><path d="M1014 230V380" class="e"/><path d="M940 430H856" class="e"/><path d="M644 430H576" class="e"/><path d="M320 430H236" class="e"/><path d="M448 230V292Q448 300 440 300H142Q134 300 134 308V380" class="e d"/><rect x="32" y="130" width="204" height="100" rx="6" class="b"/><text x="48" y="162" class="t" text-anchor="start">TTS / 音乐 / 提示</text><text x="48" y="190" class="s" text-anchor="start">所有播放源</text><rect x="320" y="130" width="256" height="100" rx="6" class="g"/><text x="336" y="162" class="t" text-anchor="start">混音与数字音量</text><text x="336" y="190" class="s" text-anchor="start">保留对应样本时间轴</text><rect x="644" y="130" width="212" height="100" rx="6" class="b"/><text x="660" y="162" class="t" text-anchor="start">播放缓冲 / DAC</text><text x="660" y="190" class="s" text-anchor="start">可观测排队与延迟</text><rect x="940" y="130" width="148" height="100" rx="6" class="b"/><text x="956" y="162" class="t" text-anchor="start">功放 / 喇叭</text><text x="956" y="190" class="s" text-anchor="start">输出声波</text><rect x="940" y="380" width="148" height="100" rx="6" class="b"/><text x="956" y="412" class="t" text-anchor="start">Mic / ADC</text><text x="956" y="440" class="s" text-anchor="start">采集含回声</text><rect x="644" y="380" width="212" height="100" rx="6" class="b"/><text x="660" y="412" class="t" text-anchor="start">驱动与 DMA</text><text x="660" y="440" class="s" text-anchor="start">时钟、声道、丢帧</text><rect x="320" y="380" width="256" height="100" rx="6" class="b"/><text x="336" y="412" class="t" text-anchor="start">有界环形缓冲</text><text x="336" y="440" class="s" text-anchor="start">按样本时间戳对齐</text><rect x="32" y="380" width="204" height="100" rx="6" class="g"/><text x="48" y="412" class="t" text-anchor="start">AEC</text><text x="48" y="440" class="s" text-anchor="start">近端语音送后级</text><rect x="970" y="288" width="88" height="28" fill="white"/><text x="1014" y="308" class="s" text-anchor="middle">空气回采</text><rect x="210" y="280" width="160" height="28" fill="white"/><text x="290" y="300" class="s" text-anchor="middle">播放参考 PCM</text><text x="32" y="538" class="s" text-anchor="start">20 ms × 5块缓冲 = 100 ms容量；它不是固定延迟，实际延迟看当前已排队样本数。</text><text x="32" y="576" class="s" text-anchor="start">例：16kHz单声道s16中，排队1600个样本占3200字节，对应100ms；溢出需显式报告。</text></svg>
