<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="586" viewBox="0 0 1120 586" role="img" aria-labelledby="acoustic-system-map-title acoustic-system-map-desc"><title id="acoustic-system-map-title">声学系统的三个观察层：物理路径、数字信号和业务反馈</title><desc id="acoustic-system-map-desc">分层用于定位问题；同层栏目是关注对象，不表示声音依次经过每一项。</desc><defs><marker id="acoustic-system-map-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#52616b"/></marker><style>text{font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;fill:#17252a;letter-spacing:0}.h{font-size:26px;font-weight:600}.t{font-size:20px;font-weight:600}.s{font-size:17px;fill:#43545b}.b{fill:#edf4fa;stroke:#4280a8;stroke-width:1.5}.g{fill:#eaf5ed;stroke:#488661;stroke-width:1.5}.r{fill:#f5eef2;stroke:#a46a84;stroke-width:1.5}.e{fill:none;stroke:#52616b;stroke-width:2;marker-end:url(#acoustic-system-map-arrow)}.d{stroke-dasharray:6 5}</style></defs><rect width="1120" height="586" fill="white"/><text x="32" y="44" class="h" text-anchor="start">声学系统的三个观察层：物理路径、数字信号和业务反馈</text><text x="32" y="78" class="s" text-anchor="start">分层用于定位问题；同层栏目是关注对象，不表示声音依次经过每一项。</text><rect x="32" y="124" width="1056" height="110" rx="6" class="b"/><text x="48" y="156" class="t" text-anchor="start">物理路径</text><text x="48" y="184" class="s" text-anchor="start">说话人、房间反射  /  麦克风声孔与阵列  /  扬声器、腔体与结构漏音</text><path d="M560 234V290" class="e"/><rect x="32" y="290" width="1056" height="110" rx="6" class="g"/><text x="48" y="322" class="t" text-anchor="start">数字信号</text><text x="48" y="350" class="s" text-anchor="start">采集与播放时钟  /  PCM格式与有界缓冲  /  AEC、NS、AGC  /  VAD概率与边界</text><path d="M560 400V456" class="e"/><rect x="32" y="456" width="1056" height="98" rx="6" class="b"/><text x="48" y="488" class="t" text-anchor="start">模型与业务</text><text x="48" y="516" class="s" text-anchor="start">KWS进入交互  /  ASR转写与确认  /  业务执行  /  TTS生成与播放</text><rect x="480" y="250" width="160" height="28" fill="white"/><text x="560" y="270" class="s" text-anchor="middle">换能、采样与播放</text><rect x="444" y="416" width="232" height="28" fill="white"/><text x="560" y="436" class="s" text-anchor="middle">提供稳定输入与可观测结果</text></svg>
