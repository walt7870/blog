<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="530" viewBox="0 0 1120 530" role="img" aria-labelledby="pulsar-subscription-modes-title pulsar-subscription-modes-desc"><title id="pulsar-subscription-modes-title">Pulsar：订阅类型决定分发，不替代业务事务</title><desc id="pulsar-subscription-modes-desc">Exclusive一个消费者，Failover分区主备，Shared分摊不保序，Key_Shared按key分派但需批处理约束；各订阅分别有cursor。</desc><defs><marker id="pulsar-subscription-modes-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#54778a"/></marker></defs><style>text{font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#183248}.h{font-size:28px;font-weight:700}.n{font-size:21px;font-weight:700}.b{font-size:18px}.s{font-size:16px;fill:#526877}.box{fill:#fff;stroke:#b8cad5;stroke-width:1.5}.focus{fill:#e5f4ef;stroke:#27846b;stroke-width:2}.edge{fill:none;stroke:#54778a;stroke-width:2;marker-end:url(#pulsar-subscription-modes-arrow)}.dash{stroke-dasharray:6 4}</style><rect width="1120" height="530" fill="#f4f8fa"/><text class="h" x="36" y="50">Pulsar：订阅类型决定分发，不替代业务事务</text><text class="b" x="36" y="86">下面各行是不同订阅；分区内和 key 内的顺序，不等于整个系统的全局顺序。</text><path class="edge" d="M432 173H548"/><path class="edge" d="M432 271H548"/><path class="edge" d="M432 369H548"/><path class="edge" d="M432 467H548"/><rect class="box" x="36" y="126" width="396" height="94" rx="6"/><text class="n" x="54" y="162">Exclusive</text><text class="b" x="54" y="196">一个订阅只允许一个消费者</text><rect class="box" x="548" y="126" width="536" height="94" rx="6"/><text class="n" x="566" y="162">一个消费者读取主题分区</text><text class="b" x="566" y="196">应用异步并行仍可能打乱完成顺序</text><rect class="box" x="36" y="224" width="396" height="94" rx="6"/><text class="n" x="54" y="260">Failover</text><text class="b" x="54" y="294">每分区一个活动消费者，其余备用</text><rect class="box" x="548" y="224" width="536" height="94" rx="6"/><text class="n" x="566" y="260">故障切换后继续读取</text><text class="b" x="566" y="294">重新投递的业务仍要幂等</text><rect class="box" x="36" y="322" width="396" height="94" rx="6"/><text class="n" x="54" y="358">Shared</text><text class="b" x="54" y="392">多个消费者分摊消息</text><rect class="box" x="548" y="322" width="536" height="94" rx="6"/><text class="n" x="566" y="358">可并行，但不保证顺序</text><text class="b" x="566" y="392">与 Key_Shared 支持延迟投递</text><rect class="focus" x="36" y="420" width="396" height="94" rx="6"/><text class="n" x="54" y="456">Key_Shared</text><text class="b" x="54" y="490">同 key 分派到同一个消费者</text><rect class="box" x="548" y="420" width="536" height="94" rx="6"/><text class="n" x="566" y="456">禁用普通 batching 或按 key batching</text><text class="b" x="566" y="490">负确认、重投和延迟还要单独核对顺序</text></svg>
