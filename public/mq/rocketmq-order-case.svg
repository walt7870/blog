<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="494" viewBox="0 0 1120 494" role="img" aria-labelledby="rocketmq-order-case-title rocketmq-order-case-desc"><title id="rocketmq-order-case-title">RocketMQ 订单案例：延时触发检查，事务保护发布</title><desc id="rocketmq-order-case-desc">5.x DELAY主题登记到期检查，TRANSACTION主题保证支付本地事务与事件发布最终一致；消费者以状态和唯一约束完成业务。</desc><defs><marker id="rocketmq-order-case-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#54778a"/></marker></defs><style>text{font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#183248}.h{font-size:28px;font-weight:700}.n{font-size:21px;font-weight:700}.b{font-size:18px}.s{font-size:16px;fill:#526877}.box{fill:#fff;stroke:#b8cad5;stroke-width:1.5}.focus{fill:#e5f4ef;stroke:#27846b;stroke-width:2}.edge{fill:none;stroke:#54778a;stroke-width:2;marker-end:url(#rocketmq-order-case-arrow)}.dash{stroke-dasharray:6 4}</style><rect width="1120" height="494" fill="#f4f8fa"/><text class="h" x="36" y="50">RocketMQ 订单案例：延时触发检查，事务保护发布</text><text class="b" x="36" y="86">各消息类型使用匹配 Topic；4.x 延时等级不能直接当作 5.x 定时时间戳 API。</text><path class="edge" d="M236 183H300"/><path class="edge" d="M556 183H620"/><path class="edge" d="M844 183H908"/><path class="edge" d="M236 355H300"/><path class="edge" d="M556 355H620"/><path class="edge" d="M844 355H908"/><rect class="box" x="36" y="126" width="200" height="114" rx="6"/><text class="n" x="54" y="162">订单提交</text><text class="b" x="54" y="196">可靠登记超时任务</text><text class="b" x="54" y="225">保留补偿扫描</text><rect class="box" x="300" y="126" width="256" height="114" rx="6"/><text class="n" x="318" y="162">DELAY Topic</text><text class="b" x="318" y="196">设定期望投递时间</text><text class="b" x="318" y="225">到期不等于准点执行</text><rect class="box" x="620" y="126" width="224" height="114" rx="6"/><text class="n" x="638" y="162">超时检查消费者</text><text class="b" x="638" y="196">查询权威订单状态</text><text class="b" x="638" y="225">带到期条件更新</text><rect class="focus" x="908" y="126" width="176" height="114" rx="6"/><text class="n" x="926" y="162">订单库</text><text class="b" x="926" y="196">只竞争关闭</text><text class="b" x="926" y="225">PENDING</text><rect class="box" x="36" y="298" width="200" height="114" rx="6"/><text class="n" x="54" y="334">支付本地事务</text><text class="b" x="54" y="368">半消息 → 事务结果</text><text class="b" x="54" y="397">可持久化回查</text><rect class="box" x="300" y="298" width="256" height="114" rx="6"/><text class="n" x="318" y="334">TRANSACTION Topic</text><text class="b" x="318" y="368">COMMIT 后可消费</text><text class="b" x="318" y="397">未定则回查</text><rect class="box" x="620" y="298" width="224" height="114" rx="6"/><text class="n" x="638" y="334">发券消费者</text><text class="b" x="638" y="368">幂等事务</text><text class="b" x="638" y="397">提交后确认</text><rect class="box" x="908" y="298" width="176" height="114" rx="6"/><text class="n" x="926" y="334">券库</text><text class="b" x="926" y="368">业务唯一键</text><text class="b" x="926" y="397">读取重复结果</text><text class="s" x="36" y="461">事务消息覆盖生产端一致性；下游仍需重试、死信、幂等与对账。</text></svg>
