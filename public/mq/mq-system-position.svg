<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="540" viewBox="0 0 1120 540" role="img" aria-labelledby="mq-system-position-title mq-system-position-desc"><title id="mq-system-position-title">MQ 在业务链路中的位置</title><desc id="mq-system-position-desc">业务服务将业务行和Outbox写入同一事务；relay发布消息，各订阅方独立消费，失败需要重试和补偿。</desc><defs><marker id="mq-system-position-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#54778a"/></marker></defs><style>text{font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#183248}.h{font-size:28px;font-weight:700}.n{font-size:21px;font-weight:700}.b{font-size:18px}.s{font-size:16px;fill:#526877}.box{fill:#fff;stroke:#b8cad5;stroke-width:1.5}.focus{fill:#e5f4ef;stroke:#27846b;stroke-width:2}.edge{fill:none;stroke:#54778a;stroke-width:2;marker-end:url(#mq-system-position-arrow)}.dash{stroke-dasharray:6 4}</style><rect width="1120" height="540" fill="#f4f8fa"/><text class="h" x="36" y="50">MQ 在业务链路中的位置</text><text class="b" x="36" y="86">订单响应等待必要事务提交；邮件和索引等后续动作可独立恢复。</text><path class="edge" d="M236 195H300"/><path class="edge" d="M588 195H652"/><path class="edge" d="M844 195H908"/><path class="edge" d="M1008 260V338Q1008 346 1000 346H844"/><path class="edge" d="M1008 260V452Q1008 460 1000 460H844"/><rect class="box" x="36" y="132" width="200" height="128" rx="6"/><text class="n" x="54" y="168">业务服务</text><text class="b" x="54" y="202">校验订单与支付</text><text class="b" x="54" y="231">返回业务提交结果</text><rect class="focus" x="300" y="132" width="288" height="128" rx="6"/><text class="n" x="318" y="168">同一数据库事务</text><text class="b" x="318" y="202">业务记录 + Outbox</text><text class="b" x="318" y="231">防止提交后漏发事件</text><rect class="box" x="652" y="132" width="192" height="128" rx="6"/><text class="n" x="670" y="168">Outbox relay</text><text class="b" x="670" y="202">重试发布</text><text class="b" x="670" y="231">eventId 保持稳定</text><rect class="box" x="908" y="132" width="176" height="128" rx="6"/><text class="n" x="926" y="168">MQ</text><text class="b" x="926" y="202">保存 / 路由</text><text class="b" x="926" y="231">按策略保留</text><rect class="box" x="548" y="302" width="296" height="88" rx="6"/><text class="n" x="566" y="338">通知订阅</text><text class="b" x="566" y="372">邮件 / 短信，独立重试</text><rect class="box" x="548" y="416" width="296" height="88" rx="6"/><text class="n" x="566" y="452">索引订阅</text><text class="b" x="566" y="486">派生视图，可重建</text><text class="n" x="36" y="341">relay 发送成功后仍可能退出。</text><text class="b" x="36" y="381">重复发布由消费幂等兜底。</text><text class="b" x="36" y="423">主事务与消费结果不是同一个事务。</text></svg>
