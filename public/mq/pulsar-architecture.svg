<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="580" viewBox="0 0 1120 580" role="img" aria-labelledby="pulsar-architecture-title pulsar-architecture-desc"><title id="pulsar-architecture-title">Pulsar：接入、持久化与元数据边界</title><desc id="pulsar-architecture-desc">客户端连接Broker，Broker向BookKeeper持久化消息并向消费者分发；元数据存储协调主题和ledger信息，Broker offloader复制封存日志到对象存储。</desc><defs><marker id="pulsar-architecture-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#54778a"/></marker></defs><style>text{font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#183248}.h{font-size:28px;font-weight:700}.n{font-size:21px;font-weight:700}.b{font-size:18px}.s{font-size:16px;fill:#526877}.box{fill:#fff;stroke:#b8cad5;stroke-width:1.5}.focus{fill:#e5f4ef;stroke:#27846b;stroke-width:2}.edge{fill:none;stroke:#54778a;stroke-width:2;marker-end:url(#pulsar-architecture-arrow)}.dash{stroke-dasharray:6 4}</style><rect width="1120" height="580" fill="#f4f8fa"/><text class="h" x="36" y="50">Pulsar：接入、持久化与元数据边界</text><text class="b" x="36" y="86">persistent Topic 的消息正文保存到 BookKeeper；Broker 仍持有连接、缓存与主题运行状态。</text><path class="edge" d="M236 196H300"/><path class="edge" d="M556 196H620"/><path class="edge" d="M428 258V338"/><path class="edge dash" d="M492 338V258"/><path class="edge dash" d="M236 382H256Q264 382 264 374V286Q264 278 272 278H336Q344 278 344 270V258"/><path class="edge dash" d="M236 430H300"/><path class="edge" d="M556 236H580Q588 236 588 244V392Q588 400 596 400H620"/><rect class="box" x="36" y="134" width="200" height="124" rx="6"/><text class="n" x="54" y="170">客户端发布</text><text class="b" x="54" y="204">lookup 后连接</text><text class="b" x="54" y="233">tenant / namespace</text><rect class="focus" x="300" y="134" width="256" height="124" rx="6"/><text class="n" x="318" y="170">Broker</text><text class="b" x="318" y="204">接入、缓存、分发</text><text class="b" x="318" y="233">ack / cursor 管理</text><rect class="box" x="620" y="134" width="464" height="124" rx="6"/><text class="n" x="638" y="170">订阅消费者</text><text class="b" x="638" y="204">从 Broker 读取消息，处理后 ack</text><text class="b" x="638" y="233">业务结果与消息确认分开提交</text><rect class="box" x="36" y="338" width="200" height="124" rx="6"/><text class="n" x="54" y="374">Metadata Store</text><text class="b" x="54" y="408">主题所有权 / 策略</text><text class="b" x="54" y="437">ledger 元数据</text><rect class="box" x="300" y="338" width="256" height="124" rx="6"/><text class="n" x="318" y="374">BookKeeper</text><text class="b" x="318" y="408">ledger 持久化</text><text class="b" x="318" y="437">按仲裁复制</text><rect class="box" x="620" y="338" width="464" height="124" rx="6"/><text class="n" x="638" y="374">对象存储</text><text class="b" x="638" y="408">Broker offloader 复制封存 ledger</text><text class="b" x="638" y="437">卸载后仍需元数据才能访问历史</text><text class="s" x="36" y="515">虚线为元数据关系或返回；实线为消息与卸载路径。卸载不代表立即删除热副本。</text><text class="s" x="36" y="550">持久订阅 cursor 可恢复；non-persistent Topic 不具备这条持久化链路。</text></svg>
