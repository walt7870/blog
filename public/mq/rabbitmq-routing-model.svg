<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="500" viewBox="0 0 1120 500" role="img" aria-labelledby="rabbitmq-routing-model-title rabbitmq-routing-model-desc"><title id="rabbitmq-routing-model-title">RabbitMQ：Exchange 路由到队列，消费者从队列取消息</title><desc id="rabbitmq-routing-model-desc">发布者根据路由键发送到交换机，交换机按绑定路由到独立队列；同队列消费者竞争任务，不是每人收到一份。</desc><defs><marker id="rabbitmq-routing-model-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#54778a"/></marker></defs><style>text{font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#183248}.h{font-size:28px;font-weight:700}.n{font-size:21px;font-weight:700}.b{font-size:18px}.s{font-size:16px;fill:#526877}.box{fill:#fff;stroke:#b8cad5;stroke-width:1.5}.focus{fill:#e5f4ef;stroke:#27846b;stroke-width:2}.edge{fill:none;stroke:#54778a;stroke-width:2;marker-end:url(#rabbitmq-routing-model-arrow)}.dash{stroke-dasharray:6 4}</style><rect width="1120" height="500" fill="#f4f8fa"/><text class="h" x="36" y="50">RabbitMQ：Exchange 路由到队列，消费者从队列取消息</text><text class="b" x="36" y="86">广播是每个匹配队列收到一份；同一队列中的多个消费者通常分摊处理。</text><path class="edge" d="M224 221H288"/><path class="edge" d="M540 196H572Q580 196 580 188V174Q580 166 588 166H620"/><path class="edge" d="M540 246H596Q604 246 604 254V354Q604 362 612 362H620"/><path class="edge" d="M828 166H892"/><path class="edge" d="M828 362H892"/><rect class="box" x="36" y="160" width="188" height="124" rx="6"/><text class="n" x="54" y="196">Producer</text><text class="b" x="54" y="230">带 routing key</text><text class="b" x="54" y="259">发布业务事件</text><rect class="focus" x="288" y="160" width="252" height="124" rx="6"/><text class="n" x="306" y="196">Exchange</text><text class="b" x="306" y="230">按 Binding 匹配</text><text class="b" x="306" y="259">自身不是任务存储</text><rect class="box" x="620" y="112" width="208" height="112" rx="6"/><text class="n" x="638" y="148">通知队列</text><text class="b" x="638" y="182">独立 backlog</text><text class="b" x="638" y="211">持久化按队列类型</text><rect class="box" x="892" y="112" width="192" height="112" rx="6"/><text class="n" x="910" y="148">通知消费者</text><text class="b" x="910" y="182">同队列竞争</text><text class="b" x="910" y="211">业务后 ack</text><rect class="box" x="620" y="308" width="208" height="112" rx="6"/><text class="n" x="638" y="344">索引队列</text><text class="b" x="638" y="378">自己的 backlog</text><text class="b" x="638" y="407">自己的消费者</text><rect class="box" x="892" y="308" width="192" height="112" rx="6"/><text class="n" x="910" y="344">索引消费者</text><text class="b" x="910" y="378">更新派生视图</text><text class="b" x="910" y="407">业务后 ack</text><text class="n" x="36" y="355">路由不到队列时：</text><text class="b" x="36" y="395">mandatory + return 或备用交换机。</text><text class="s" x="36" y="465">无路由仍可能收到 Publisher Confirm；confirm 不能代替拓扑验证。</text></svg>
