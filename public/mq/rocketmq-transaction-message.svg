<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="600" viewBox="0 0 1120 600" role="img" aria-labelledby="rocketmq-transaction-message-title rocketmq-transaction-message-desc"><title id="rocketmq-transaction-message-title">RocketMQ 事务消息：成功路径与异常恢复</title><desc id="rocketmq-transaction-message-desc">半消息先确认，再执行本地事务，数据库提交后commit消息才可消费；确定失败rollback，未知状态由持久事务记录回查。</desc><defs><marker id="rocketmq-transaction-message-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#54778a"/></marker></defs><style>text{font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#183248}.h{font-size:28px;font-weight:700}.n{font-size:21px;font-weight:700}.b{font-size:18px}.s{font-size:16px;fill:#526877}.box{fill:#fff;stroke:#b8cad5;stroke-width:1.5}.focus{fill:#e5f4ef;stroke:#27846b;stroke-width:2}.edge{fill:none;stroke:#54778a;stroke-width:2;marker-end:url(#rocketmq-transaction-message-arrow)}.dash{stroke-dasharray:6 4}</style><rect width="1120" height="600" fill="#f4f8fa"/><text class="h" x="36" y="50">RocketMQ 事务消息：成功路径与异常恢复</text><text class="b" x="36" y="86">下图画成功路径；半消息对普通消费者不可见，消息提交不证明下游业务完成。</text><path d="M100 156V466M390 156V466M690 156V466M1000 156V466" stroke="#aebfca" stroke-dasharray="5 5" fill="none"/><path class="edge" d="M100 194H390"/><path class="edge dash" d="M390 240H100"/><path class="edge" d="M100 286H690"/><path class="edge dash" d="M690 332H100"/><path class="edge" d="M100 378H390"/><path class="edge" d="M390 424H1000"/><rect class="box" x="36" y="110" width="160" height="46" rx="6"/><text class="n" x="54" y="146">Producer</text><rect class="box" x="310" y="110" width="160" height="46" rx="6"/><text class="n" x="328" y="146">Broker</text><rect class="box" x="610" y="110" width="160" height="46" rx="6"/><text class="n" x="628" y="146">本地数据库</text><rect class="box" x="920" y="110" width="164" height="46" rx="6"/><text class="n" x="938" y="146">Consumer</text><rect x="129" y="161" width="138" height="25" fill="#f4f8fa"/><text class="s" x="135" y="180">1 发送半消息</text><rect x="129" y="207" width="156" height="25" fill="#f4f8fa"/><text class="s" x="135" y="226">2 半消息已接受</text><rect x="424" y="253" width="192" height="25" fill="#f4f8fa"/><text class="s" x="430" y="272">3 业务与结果同事务</text><rect x="424" y="299" width="156" height="25" fill="#f4f8fa"/><text class="s" x="430" y="318">4 本地提交成功</text><rect x="129" y="345" width="156" height="25" fill="#f4f8fa"/><text class="s" x="135" y="364">5 COMMIT</text><rect x="729" y="391" width="174" height="25" fill="#f4f8fa"/><text class="s" x="735" y="410">6 消息可见并消费</text><text class="b" x="36" y="501">确定本地回滚：ROLLBACK，半消息不对消费者可见。</text><text class="b" x="36" y="539">未收到最终决定：Broker 回查 Producer；按持久化事务 ID 返回结果。</text><text class="s" x="36" y="575">查库失败或结果未定：UNKNOWN；回查窗口有限，超出后由业务对账补偿。</text></svg>
