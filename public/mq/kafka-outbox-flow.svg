<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="450" viewBox="0 0 1120 450" role="img" aria-labelledby="kafka-outbox-flow-title kafka-outbox-flow-desc"><title id="kafka-outbox-flow-title">Kafka Outbox：跨越业务库与消息系统的提交边界</title><desc id="kafka-outbox-flow-desc">同库事务保存业务和Outbox，relay重试写Kafka，消费者事务排重；relay确认与标记之间退出可能重复发布。</desc><defs><marker id="kafka-outbox-flow-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#54778a"/></marker></defs><style>text{font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#183248}.h{font-size:28px;font-weight:700}.n{font-size:21px;font-weight:700}.b{font-size:18px}.s{font-size:16px;fill:#526877}.box{fill:#fff;stroke:#b8cad5;stroke-width:1.5}.focus{fill:#e5f4ef;stroke:#27846b;stroke-width:2}.edge{fill:none;stroke:#54778a;stroke-width:2;marker-end:url(#kafka-outbox-flow-arrow)}.dash{stroke-dasharray:6 4}</style><rect width="1120" height="450" fill="#f4f8fa"/><text class="h" x="36" y="50">Kafka Outbox：跨越业务库与消息系统的提交边界</text><text class="b" x="36" y="86">Outbox 消除业务已提交却未登记事件的窗口；它不消除发布重试与消费重投。</text><path class="edge" d="M284 197H348"/><path class="edge" d="M560 197H624"/><path class="edge" d="M820 197H884"/><rect class="focus" x="36" y="132" width="248" height="130" rx="6"/><text class="n" x="54" y="168">同一数据库事务</text><text class="b" x="54" y="202">支付流水 + Outbox</text><text class="b" x="54" y="231">eventId 唯一且稳定</text><rect class="box" x="348" y="132" width="212" height="130" rx="6"/><text class="n" x="366" y="168">Relay / CDC</text><text class="b" x="366" y="202">发布后标记进度</text><text class="b" x="366" y="231">失败恢复继续发</text><rect class="box" x="624" y="132" width="196" height="130" rx="6"/><text class="n" x="642" y="168">Kafka 日志</text><text class="b" x="642" y="202">按分区保存</text><text class="b" x="642" y="231">多组各自读取</text><rect class="box" x="884" y="132" width="200" height="130" rx="6"/><text class="n" x="902" y="168">消费本地事务</text><text class="b" x="902" y="202">业务 + 幂等记录</text><text class="b" x="902" y="231">提交后交 offset</text><text class="n" x="36" y="329">重复窗口</text><text class="b" x="36" y="367">relay 发布成功后标记失败：再次发布；消费写库后提交 offset 失败：再次消费。</text><text class="b" x="36" y="407">两处都靠稳定业务键与原子排重恢复，不能用“已经发送”证明发券完成。</text></svg>
