<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="460" viewBox="0 0 1120 460" role="img" aria-labelledby="mq-delivery-semantics-title mq-delivery-semantics-desc"><title id="mq-delivery-semantics-title">可靠消费：提交与确认之间存在重复窗口</title><desc id="mq-delivery-semantics-desc">消息到达消费者后，本地事务提交业务和幂等记录，再确认；事务成功但确认前退出会重投，重复处理读取既有结果。</desc><defs><marker id="mq-delivery-semantics-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#54778a"/></marker></defs><style>text{font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#183248}.h{font-size:28px;font-weight:700}.n{font-size:21px;font-weight:700}.b{font-size:18px}.s{font-size:16px;fill:#526877}.box{fill:#fff;stroke:#b8cad5;stroke-width:1.5}.focus{fill:#e5f4ef;stroke:#27846b;stroke-width:2}.edge{fill:none;stroke:#54778a;stroke-width:2;marker-end:url(#mq-delivery-semantics-arrow)}.dash{stroke-dasharray:6 4}</style><rect width="1120" height="460" fill="#f4f8fa"/><text class="h" x="36" y="50">可靠消费：提交与确认之间存在重复窗口</text><text class="b" x="36" y="86">图示为业务恢复模型；具体重投、重试主题和死信由对应组件与应用配置实现。</text><path class="edge" d="M228 201H292"/><path class="edge" d="M568 201H632"/><path class="edge" d="M860 201H924"/><rect class="box" x="36" y="138" width="192" height="126" rx="6"/><text class="n" x="54" y="174">收到消息</text><text class="b" x="54" y="208">保留稳定业务键</text><text class="b" x="54" y="237">不急于确认</text><rect class="focus" x="292" y="138" width="276" height="126" rx="6"/><text class="n" x="310" y="174">同一数据库事务</text><text class="b" x="310" y="208">去重记录 + 业务结果</text><text class="b" x="310" y="237">唯一约束仲裁并发</text><rect class="box" x="632" y="138" width="228" height="126" rx="6"/><text class="n" x="650" y="174">事务提交成功</text><text class="b" x="650" y="208">此后退出会重投</text><text class="b" x="650" y="237">重投读取既有结果</text><rect class="box" x="924" y="138" width="160" height="126" rx="6"/><text class="n" x="942" y="174">消费确认</text><text class="b" x="942" y="208">ack / offset</text><text class="b" x="942" y="237">结束本轮处理</text><text class="n" x="36" y="333">失败恢复</text><text class="b" x="36" y="369">事务失败：不确认，受控重试；不可恢复：记录原因并进入异常处理。</text><text class="b" x="36" y="409">外部 API 不在本地事务内：使用对方的幂等请求键、结果查询与对账。</text></svg>
