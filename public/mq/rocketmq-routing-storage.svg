<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="560" viewBox="0 0 1120 560" role="img" aria-labelledby="rocketmq-routing-storage-title rocketmq-routing-storage-desc"><title id="rocketmq-routing-storage-title">RocketMQ：路由控制面与消息数据面</title><desc id="rocketmq-routing-storage-desc">NameServer供路由发现，4.x Remoting直连Broker，5.x gRPC经Proxy，Broker存储复制消息并向消费者提供消费数据。</desc><defs><marker id="rocketmq-routing-storage-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#54778a"/></marker></defs><style>text{font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#183248}.h{font-size:28px;font-weight:700}.n{font-size:21px;font-weight:700}.b{font-size:18px}.s{font-size:16px;fill:#526877}.box{fill:#fff;stroke:#b8cad5;stroke-width:1.5}.focus{fill:#e5f4ef;stroke:#27846b;stroke-width:2}.edge{fill:none;stroke:#54778a;stroke-width:2;marker-end:url(#rocketmq-routing-storage-arrow)}.dash{stroke-dasharray:6 4}</style><rect width="1120" height="560" fill="#f4f8fa"/><text class="h" x="36" y="50">RocketMQ：路由控制面与消息数据面</text><text class="b" x="36" y="86">NameServer 返回路由，不代存业务消息；复制、刷盘与选主是不同机制。</text><path class="edge dash" d="M284 196H348"/><path class="edge" d="M284 383H348"/><path class="edge" d="M580 383H644"/><path class="edge" d="M872 383H936"/><path class="edge dash" d="M758 322V204Q758 196 750 196H564"/><path class="edge" d="M160 258V294Q160 302 168 302H670Q678 302 678 310V322"/><rect class="box" x="36" y="134" width="248" height="124" rx="6"/><text class="n" x="54" y="170">4.x Remoting 客户端</text><text class="b" x="54" y="204">获取路由后直连 Broker</text><text class="b" x="54" y="233">不经 NameServer 转发</text><rect class="box" x="348" y="134" width="216" height="124" rx="6"/><text class="n" x="366" y="170">NameServer</text><text class="b" x="366" y="204">路由与服务发现</text><text class="b" x="366" y="233">Broker 注册信息</text><rect class="box" x="36" y="322" width="248" height="124" rx="6"/><text class="n" x="54" y="358">5.x gRPC 客户端</text><text class="b" x="54" y="392">连接 Proxy 接入</text><text class="b" x="54" y="421">匹配 SDK / 协议</text><rect class="box" x="348" y="322" width="232" height="124" rx="6"/><text class="n" x="366" y="358">Proxy</text><text class="b" x="366" y="392">接入与协议处理</text><text class="b" x="366" y="421">不替代持久化日志</text><rect class="focus" x="644" y="322" width="228" height="124" rx="6"/><text class="n" x="662" y="358">Broker</text><text class="b" x="662" y="392">Topic / MessageQueue</text><text class="b" x="662" y="421">CommitLog 与复制</text><rect class="box" x="936" y="322" width="148" height="124" rx="6"/><text class="n" x="954" y="358">消费者</text><text class="b" x="954" y="392">读取消息</text><text class="b" x="954" y="421">处理后确认</text><text class="s" x="36" y="510">虚线表示路由信息关系；实线表示客户端消息路径。真实消费接入同样取决于 SDK。</text></svg>
