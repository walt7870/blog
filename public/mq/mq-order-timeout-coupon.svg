<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="494" viewBox="0 0 1120 494" role="img" aria-labelledby="mq-order-timeout-coupon-title mq-order-timeout-coupon-desc"><title id="mq-order-timeout-coupon-title">订单超时与支付发券：由业务状态仲裁</title><desc id="mq-order-timeout-coupon-desc">延迟任务触发订单条件更新，支付事件经可靠发布触发唯一键发券；不同消息链路不提供全局顺序。</desc><defs><marker id="mq-order-timeout-coupon-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#54778a"/></marker></defs><style>text{font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#183248}.h{font-size:28px;font-weight:700}.n{font-size:21px;font-weight:700}.b{font-size:18px}.s{font-size:16px;fill:#526877}.box{fill:#fff;stroke:#b8cad5;stroke-width:1.5}.focus{fill:#e5f4ef;stroke:#27846b;stroke-width:2}.edge{fill:none;stroke:#54778a;stroke-width:2;marker-end:url(#mq-order-timeout-coupon-arrow)}.dash{stroke-dasharray:6 4}</style><rect width="1120" height="494" fill="#f4f8fa"/><text class="h" x="36" y="50">订单超时与支付发券：由业务状态仲裁</text><text class="b" x="36" y="86">消息触发检查；数据库决定合法状态。支付到账但订单先关闭时进入退款或对账。</text><path class="edge" d="M236 183H300"/><path class="edge" d="M556 183H620"/><path class="edge" d="M844 183H908"/><path class="edge" d="M236 355H300"/><path class="edge" d="M556 355H620"/><path class="edge" d="M844 355H908"/><rect class="box" x="36" y="126" width="200" height="114" rx="6"/><text class="n" x="54" y="162">订单提交</text><text class="b" x="54" y="196">记录 expires_at</text><text class="b" x="54" y="225">可靠登记到期任务</text><rect class="box" x="300" y="126" width="256" height="114" rx="6"/><text class="n" x="318" y="162">延迟 / 调度机制</text><text class="b" x="318" y="196">到期触发检查</text><text class="b" x="318" y="225">故障后补偿扫描</text><rect class="box" x="620" y="126" width="224" height="114" rx="6"/><text class="n" x="638" y="162">超时消费者</text><text class="b" x="638" y="196">状态与时间条件</text><text class="b" x="638" y="225">原子竞争关闭</text><rect class="focus" x="908" y="126" width="176" height="114" rx="6"/><text class="n" x="926" y="162">订单库</text><text class="b" x="926" y="196">PENDING</text><text class="b" x="926" y="225">才可关闭</text><rect class="box" x="36" y="298" width="200" height="114" rx="6"/><text class="n" x="54" y="334">支付提交</text><text class="b" x="54" y="368">持久化支付流水</text><text class="b" x="54" y="397">可靠登记事件</text><rect class="box" x="300" y="298" width="256" height="114" rx="6"/><text class="n" x="318" y="334">支付成功消息</text><text class="b" x="318" y="368">与超时链路独立</text><text class="b" x="318" y="397">允许重复投递</text><rect class="box" x="620" y="298" width="224" height="114" rx="6"/><text class="n" x="638" y="334">发券消费者</text><text class="b" x="638" y="368">事务内排重</text><text class="b" x="638" y="397">成功后确认</text><rect class="box" x="908" y="298" width="176" height="114" rx="6"/><text class="n" x="926" y="334">券库</text><text class="b" x="926" y="368">业务唯一键</text><text class="b" x="926" y="397">阻止重复</text><text class="s" x="36" y="461">超时与支付可并发到达；同 key、不同 Topic 不等于同一个顺序域。</text></svg>
