<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="470" viewBox="0 0 1120 470" role="img" aria-labelledby="rabbitmq-reliability-title rabbitmq-reliability-desc"><title id="rabbitmq-reliability-title">RabbitMQ：路由、发布确认和消费确认三个边界</title><desc id="rabbitmq-reliability-desc">Publisher confirm不证明路由成功，mandatory return处理无路由，消费者数据库提交后ack；确认丢失会重投。</desc><defs><marker id="rabbitmq-reliability-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#54778a"/></marker></defs><style>text{font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#183248}.h{font-size:28px;font-weight:700}.n{font-size:21px;font-weight:700}.b{font-size:18px}.s{font-size:16px;fill:#526877}.box{fill:#fff;stroke:#b8cad5;stroke-width:1.5}.focus{fill:#e5f4ef;stroke:#27846b;stroke-width:2}.edge{fill:none;stroke:#54778a;stroke-width:2;marker-end:url(#rabbitmq-reliability-arrow)}.dash{stroke-dasharray:6 4}</style><rect width="1120" height="470" fill="#f4f8fa"/><text class="h" x="36" y="50">RabbitMQ：路由、发布确认和消费确认三个边界</text><text class="b" x="36" y="86">持久队列 + 持久消息 + confirm 只覆盖相应发布持久化边界，消费者结果另行确认。</text><path class="edge" d="M236 174H340"/><path class="edge" d="M340 224H236"/><path class="edge" d="M632 174H736"/><path class="edge" d="M736 224H632"/><rect x="247" y="132" width="138" height="25" fill="#f4f8fa"/><text class="s" x="253" y="151">publish</text><rect x="247" y="235" width="138" height="25" fill="#f4f8fa"/><text class="s" x="253" y="254">confirm</text><rect x="641" y="132" width="138" height="25" fill="#f4f8fa"/><text class="s" x="647" y="151">deliver</text><rect x="641" y="235" width="66" height="25" fill="#f4f8fa"/><text class="s" x="647" y="254">ack</text><rect class="box" x="36" y="128" width="200" height="144" rx="6"/><text class="n" x="54" y="164">Producer</text><text class="b" x="54" y="198">超时重试 / Outbox</text><text class="b" x="54" y="227">处理 basic.return</text><rect class="focus" x="340" y="128" width="292" height="144" rx="6"/><text class="n" x="358" y="164">Exchange + Queue</text><text class="b" x="358" y="198">校验路由与存储条件</text><text class="b" x="358" y="227">Quorum 涉及多数副本</text><rect class="box" x="736" y="128" width="348" height="144" rx="6"/><text class="n" x="754" y="164">Consumer + 数据库</text><text class="b" x="754" y="198">业务与排重同事务提交</text><text class="b" x="754" y="227">提交成功之后才 ack</text><text class="n" x="36" y="341">无法路由</text><text class="b" x="36" y="378">mandatory 返回消息；有 confirm 也可能尚未进入任何业务队列。</text><text class="b" x="36" y="418">业务提交后 ack 丢失：重投；唯一约束让重复消息读取已有结果。</text></svg>
