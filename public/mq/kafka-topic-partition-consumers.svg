<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="560" viewBox="0 0 1120 560" role="img" aria-labelledby="kafka-topic-partition-consumers-title kafka-topic-partition-consumers-desc"><title id="kafka-topic-partition-consumers-title">Kafka：日志分区与消费组各自的进度</title><desc id="kafka-topic-partition-consumers-desc">同一Topic内分区独立追加，经典消费组分别分配分区和保存offset；读取不会直接删除日志。</desc><defs><marker id="kafka-topic-partition-consumers-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#54778a"/></marker></defs><style>text{font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#183248}.h{font-size:28px;font-weight:700}.n{font-size:21px;font-weight:700}.b{font-size:18px}.s{font-size:16px;fill:#526877}.box{fill:#fff;stroke:#b8cad5;stroke-width:1.5}.focus{fill:#e5f4ef;stroke:#27846b;stroke-width:2}.edge{fill:none;stroke:#54778a;stroke-width:2;marker-end:url(#kafka-topic-partition-consumers-arrow)}.dash{stroke-dasharray:6 4}</style><rect width="1120" height="560" fill="#f4f8fa"/><text class="h" x="36" y="50">Kafka：日志分区与消费组各自的进度</text><text class="b" x="36" y="86">每个分区独立排序；同 key 的顺序还受分区映射与业务执行方式约束。</text><rect x="340" y="116" width="296" height="362" fill="#edf3f7" stroke="#b8cad5" stroke-dasharray="6 4" rx="6"/><path class="edge" d="M288 206H364"/><path class="edge" d="M288 310H364"/><path class="edge" d="M288 414H364"/><rect class="box" x="36" y="144" width="252" height="308" rx="6"/><text class="n" x="54" y="180">Producer</text><text class="b" x="54" y="214">按 key 选择分区</text><text class="b" x="54" y="243">重试需可靠配置</text><text class="b" x="54" y="272">分区日志各自追加</text><text class="n" x="362" y="149">Topic：order-events</text><rect class="box" x="364" y="170" width="248" height="76" rx="6"/><text class="n" x="382" y="206">分区 0</text><text class="b" x="382" y="240">offset: 0, 1, 2…</text><rect class="box" x="364" y="274" width="248" height="76" rx="6"/><text class="n" x="382" y="310">分区 1</text><text class="b" x="382" y="344">独立 offset 序列</text><rect class="box" x="364" y="378" width="248" height="76" rx="6"/><text class="n" x="382" y="414">分区 2</text><text class="b" x="382" y="448">独立 offset 序列</text><path class="edge" d="M636 215H672"/><path class="edge" d="M636 389H672"/><rect class="focus" x="672" y="144" width="412" height="142" rx="6"/><text class="n" x="690" y="180">组 A：发券</text><text class="b" x="690" y="214">消费者 A1 负责分区 0、1</text><text class="b" x="690" y="243">消费者 A2 负责分区 2</text><text class="b" x="690" y="272">这是一次分配示例</text><rect class="box" x="672" y="318" width="412" height="142" rx="6"/><text class="n" x="690" y="354">组 B：搜索索引</text><text class="b" x="690" y="388">独立分配全部分区</text><text class="b" x="690" y="417">保存自己的分区进度</text><text class="b" x="690" y="446">不由组 A 的 offset 决定</text><text class="s" x="36" y="515">经典组一个分区同时分配给一个成员；每个组都可读取同一日志，读取不会立即删除消息。</text></svg>
