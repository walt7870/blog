<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="494" viewBox="0 0 1120 494" role="img" aria-labelledby="kafka-order-case-title kafka-order-case-desc"><title id="kafka-order-case-title">Kafka 订单案例：调度与事件日志各有职责</title><desc id="kafka-order-case-desc">订单库登记到期任务，调度器生成到期检查事件；支付Outbox发布支付事件，两路消费者以状态更新和唯一键处理。</desc><defs><marker id="kafka-order-case-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#54778a"/></marker></defs><style>text{font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#183248}.h{font-size:28px;font-weight:700}.n{font-size:21px;font-weight:700}.b{font-size:18px}.s{font-size:16px;fill:#526877}.box{fill:#fff;stroke:#b8cad5;stroke-width:1.5}.focus{fill:#e5f4ef;stroke:#27846b;stroke-width:2}.edge{fill:none;stroke:#54778a;stroke-width:2;marker-end:url(#kafka-order-case-arrow)}.dash{stroke-dasharray:6 4}</style><rect width="1120" height="494" fill="#f4f8fa"/><text class="h" x="36" y="50">Kafka 订单案例：调度与事件日志各有职责</text><text class="b" x="36" y="86">Kafka 保留事件；到期时间由调度服务管理，不靠消费者睡眠 30 分钟。</text><path class="edge" d="M236 183H300"/><path class="edge" d="M556 183H620"/><path class="edge" d="M844 183H908"/><path class="edge" d="M236 355H300"/><path class="edge" d="M556 355H620"/><path class="edge" d="M844 355H908"/><rect class="box" x="36" y="126" width="200" height="114" rx="6"/><text class="n" x="54" y="162">订单 + 到期任务</text><text class="b" x="54" y="196">同库可靠登记</text><text class="b" x="54" y="225">扫描遗漏任务</text><rect class="box" x="300" y="126" width="256" height="114" rx="6"/><text class="n" x="318" y="162">调度器 → Kafka</text><text class="b" x="318" y="196">到期才发布检查事件</text><text class="b" x="318" y="225">发送失败可重试</text><rect class="box" x="620" y="126" width="224" height="114" rx="6"/><text class="n" x="638" y="162">超时消费者</text><text class="b" x="638" y="196">查询并条件更新</text><text class="b" x="638" y="225">不接受过期结论</text><rect class="focus" x="908" y="126" width="176" height="114" rx="6"/><text class="n" x="926" y="162">订单库</text><text class="b" x="926" y="196">PENDING</text><text class="b" x="926" y="225">且已到期</text><rect class="box" x="36" y="298" width="200" height="114" rx="6"/><text class="n" x="54" y="334">支付 Outbox</text><text class="b" x="54" y="368">与流水原子提交</text><text class="b" x="54" y="397">稳定 eventId</text><rect class="box" x="300" y="298" width="256" height="114" rx="6"/><text class="n" x="318" y="334">order.paid.v1</text><text class="b" x="318" y="368">key = orderId</text><text class="b" x="318" y="397">不与超时主题排序</text><rect class="box" x="620" y="298" width="224" height="114" rx="6"/><text class="n" x="638" y="334">发券消费组</text><text class="b" x="638" y="368">先完成同库事务</text><text class="b" x="638" y="397">再提交 offset</text><rect class="box" x="908" y="298" width="176" height="114" rx="6"/><text class="n" x="926" y="334">券库</text><text class="b" x="926" y="368">订单 + 券模板</text><text class="b" x="926" y="397">唯一约束</text><text class="s" x="36" y="461">消费者重启、回放、Outbox 再发送都可能重复；重新消费必须通过幂等验收。</text></svg>
