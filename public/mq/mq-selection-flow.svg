<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="500" viewBox="0 0 1120 500" role="img" aria-labelledby="mq-selection-flow-title mq-selection-flow-desc"><title id="mq-selection-flow-title">MQ 选型：先写约束，再选择候选</title><desc id="mq-selection-flow-desc">不同中间件能力重叠，按路由、事件回放、交易语义、多租户列候选，再以现有基础设施与故障验证决定。</desc><defs><marker id="mq-selection-flow-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#54778a"/></marker></defs><style>text{font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#183248}.h{font-size:28px;font-weight:700}.n{font-size:21px;font-weight:700}.b{font-size:18px}.s{font-size:16px;fill:#526877}.box{fill:#fff;stroke:#b8cad5;stroke-width:1.5}.focus{fill:#e5f4ef;stroke:#27846b;stroke-width:2}.edge{fill:none;stroke:#54778a;stroke-width:2;marker-end:url(#mq-selection-flow-arrow)}.dash{stroke-dasharray:6 4}</style><rect width="1120" height="500" fill="#f4f8fa"/><text class="h" x="36" y="50">MQ 选型：先写约束，再选择候选</text><text class="b" x="36" y="86">这些是评估入口，不是互斥分支；同一需求可能有多个合理候选。</text><path class="edge" d="M450 173H548"/><path class="edge" d="M450 259H548"/><path class="edge" d="M450 345H548"/><path class="edge" d="M450 431H548"/><rect class="box" x="36" y="130" width="414" height="86" rx="6"/><text class="n" x="54" y="166">复杂路由 / AMQP 任务</text><text class="b" x="54" y="200">例如按事件类型分发通知</text><rect class="box" x="548" y="130" width="536" height="86" rx="6"/><text class="n" x="566" y="166">RabbitMQ</text><text class="b" x="566" y="200">核对 Queue 类型、确认与死信转发</text><rect class="box" x="36" y="216" width="414" height="86" rx="6"/><text class="n" x="54" y="252">长期事件保留与多路回放</text><text class="b" x="54" y="286">例如 CDC、埋点和实时计算</text><rect class="box" x="548" y="216" width="536" height="86" rx="6"/><text class="n" x="566" y="252">Kafka；同时评估 Pulsar / Stream</text><text class="b" x="566" y="286">核对保留期、消费进度与生态</text><rect class="box" x="36" y="302" width="414" height="86" rx="6"/><text class="n" x="54" y="338">交易事件、事务回查与到期检查</text><text class="b" x="54" y="372">例如支付提交后异步发券</text><rect class="focus" x="548" y="302" width="536" height="86" rx="6"/><text class="n" x="566" y="338">RocketMQ；或现有 MQ + Outbox</text><text class="b" x="566" y="372">核对回查、幂等与时间边界</text><rect class="box" x="36" y="388" width="414" height="86" rx="6"/><text class="n" x="54" y="424">多租户与存算独立扩展</text><text class="b" x="54" y="458">例如多业务线共用消息平台</text><rect class="box" x="548" y="388" width="536" height="86" rx="6"/><text class="n" x="566" y="424">Pulsar</text><text class="b" x="566" y="458">核对 BookKeeper、元数据与隔离成本</text></svg>
