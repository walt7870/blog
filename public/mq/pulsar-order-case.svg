<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="510" viewBox="0 0 1120 510" role="img" aria-labelledby="pulsar-order-case-title pulsar-order-case-desc"><title id="pulsar-order-case-title">Pulsar 订单案例：延迟订阅与状态仲裁</title><desc id="pulsar-order-case-desc">持久超时主题在Shared或Key_Shared延迟投递，TTL与配额不能提前清理待处理消息，支付消息另路发券且不保证跨主题顺序。</desc><defs><marker id="pulsar-order-case-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#54778a"/></marker></defs><style>text{font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#183248}.h{font-size:28px;font-weight:700}.n{font-size:21px;font-weight:700}.b{font-size:18px}.s{font-size:16px;fill:#526877}.box{fill:#fff;stroke:#b8cad5;stroke-width:1.5}.focus{fill:#e5f4ef;stroke:#27846b;stroke-width:2}.edge{fill:none;stroke:#54778a;stroke-width:2;marker-end:url(#pulsar-order-case-arrow)}.dash{stroke-dasharray:6 4}</style><rect width="1120" height="510" fill="#f4f8fa"/><text class="h" x="36" y="50">Pulsar 订单案例：延迟订阅与状态仲裁</text><text class="b" x="36" y="86">延迟与即时消息可能交错；同 key 不建立跨主题顺序，也不保证落到同一个进程。</text><path class="edge" d="M236 183H300"/><path class="edge" d="M556 183H620"/><path class="edge" d="M844 183H908"/><path class="edge" d="M236 355H300"/><path class="edge" d="M556 355H620"/><path class="edge" d="M844 355H908"/><rect class="box" x="36" y="126" width="200" height="114" rx="6"/><text class="n" x="54" y="162">订单可靠提交</text><text class="b" x="54" y="196">登记到期任务</text><text class="b" x="54" y="225">persistent Topic</text><rect class="box" x="300" y="126" width="256" height="114" rx="6"/><text class="n" x="318" y="162">超时检查主题</text><text class="b" x="318" y="196">Shared / Key_Shared</text><text class="b" x="318" y="225">延迟索引控制分发</text><rect class="box" x="620" y="126" width="224" height="114" rx="6"/><text class="n" x="638" y="162">超时消费者</text><text class="b" x="638" y="196">到期与状态条件</text><text class="b" x="638" y="225">不能直接相信到达时刻</text><rect class="focus" x="908" y="126" width="176" height="114" rx="6"/><text class="n" x="926" y="162">订单库</text><text class="b" x="926" y="196">原子仲裁</text><text class="b" x="926" y="225">关闭 / 支付</text><rect class="box" x="36" y="298" width="200" height="114" rx="6"/><text class="n" x="54" y="334">支付 Outbox</text><text class="b" x="54" y="368">持久化事件</text><text class="b" x="54" y="397">重发保持业务键</text><rect class="box" x="300" y="298" width="256" height="114" rx="6"/><text class="n" x="318" y="334">支付成功主题</text><text class="b" x="318" y="368">独立订阅与 cursor</text><text class="b" x="318" y="397">不和上排排序</text><rect class="box" x="620" y="298" width="224" height="114" rx="6"/><text class="n" x="638" y="334">Shared 发券订阅</text><text class="b" x="638" y="368">事务排重后 ack</text><text class="b" x="638" y="397">重投读取已有结果</text><rect class="box" x="908" y="298" width="176" height="114" rx="6"/><text class="n" x="926" y="334">券库</text><text class="b" x="926" y="368">订单 + 券模板</text><text class="b" x="926" y="397">唯一约束</text><text class="s" x="36" y="461">TTL 覆盖预期延迟与恢复时间；延迟消息占用 backlog，配额触发也要监控。</text></svg>
