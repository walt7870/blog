<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="510" viewBox="0 0 1120 510" role="img" aria-labelledby="rabbitmq-order-case-title rabbitmq-order-case-desc"><title id="rabbitmq-order-case-title">RabbitMQ 订单案例：固定延时队列与业务死信分开</title><desc id="rabbitmq-order-case-desc">订单事件经无消费者的固定TTL队列到期死信到检查队列，检查条件更新；支付事件另路发券。延时中转与业务失败死信不同。</desc><defs><marker id="rabbitmq-order-case-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#54778a"/></marker></defs><style>text{font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#183248}.h{font-size:28px;font-weight:700}.n{font-size:21px;font-weight:700}.b{font-size:18px}.s{font-size:16px;fill:#526877}.box{fill:#fff;stroke:#b8cad5;stroke-width:1.5}.focus{fill:#e5f4ef;stroke:#27846b;stroke-width:2}.edge{fill:none;stroke:#54778a;stroke-width:2;marker-end:url(#rabbitmq-order-case-arrow)}.dash{stroke-dasharray:6 4}</style><rect width="1120" height="510" fill="#f4f8fa"/><text class="h" x="36" y="50">RabbitMQ 订单案例：固定延时队列与业务死信分开</text><text class="b" x="36" y="86">延迟队列不挂普通消费者；到期转发的可靠性、过期精度和补偿任务要独立验证。</text><path class="edge" d="M236 183H300"/><path class="edge" d="M556 183H620"/><path class="edge" d="M844 183H908"/><path class="edge" d="M236 355H300"/><path class="edge" d="M556 355H620"/><path class="edge" d="M844 355H908"/><rect class="box" x="36" y="126" width="200" height="114" rx="6"/><text class="n" x="54" y="162">订单可靠发布</text><text class="b" x="54" y="196">业务 + Outbox</text><text class="b" x="54" y="225">confirm 与 return</text><rect class="box" x="300" y="126" width="256" height="114" rx="6"/><text class="n" x="318" y="162">固定 TTL 延迟队列</text><text class="b" x="318" y="196">30 分钟到期 → DLX</text><text class="b" x="318" y="225">无普通消费者</text><rect class="box" x="620" y="126" width="224" height="114" rx="6"/><text class="n" x="638" y="162">超时检查队列</text><text class="b" x="638" y="196">消费者手动 ack</text><text class="b" x="638" y="225">失败受控重试</text><rect class="focus" x="908" y="126" width="176" height="114" rx="6"/><text class="n" x="926" y="162">订单库</text><text class="b" x="926" y="196">状态 + 到期</text><text class="b" x="926" y="225">原子条件更新</text><rect class="box" x="36" y="298" width="200" height="114" rx="6"/><text class="n" x="54" y="334">支付可靠发布</text><text class="b" x="54" y="368">持久消息</text><text class="b" x="54" y="397">处理发布失败</text><rect class="box" x="300" y="298" width="256" height="114" rx="6"/><text class="n" x="318" y="334">支付 Exchange</text><text class="b" x="318" y="368">匹配到发券队列</text><text class="b" x="318" y="397">确认不等于消费完成</text><rect class="box" x="620" y="298" width="224" height="114" rx="6"/><text class="n" x="638" y="334">发券消费者</text><text class="b" x="638" y="368">数据库事务排重</text><text class="b" x="638" y="397">提交后 ack</text><rect class="box" x="908" y="298" width="176" height="114" rx="6"/><text class="n" x="926" y="334">券库</text><text class="b" x="926" y="368">订单 + 券模板</text><text class="b" x="926" y="397">唯一约束</text><text class="s" x="36" y="461">DLX 在上排承担延迟中转；失败超过上限应另有异常队列、告警与定向重放。</text></svg>
