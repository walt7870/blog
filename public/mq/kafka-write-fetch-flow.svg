<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="480" viewBox="0 0 1120 480" role="img" aria-labelledby="kafka-write-fetch-flow-title kafka-write-fetch-flow-desc"><title id="kafka-write-fetch-flow-title">Kafka：生产确认、复制与消费完成分开判断</title><desc id="kafka-write-fetch-flow-desc">生产者写Leader，Leader复制到ISR成员；生产确认满足配置，不证明消费者完成或每个副本逐条fsync。</desc><defs><marker id="kafka-write-fetch-flow-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#54778a"/></marker></defs><style>text{font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#183248}.h{font-size:28px;font-weight:700}.n{font-size:21px;font-weight:700}.b{font-size:18px}.s{font-size:16px;fill:#526877}.box{fill:#fff;stroke:#b8cad5;stroke-width:1.5}.focus{fill:#e5f4ef;stroke:#27846b;stroke-width:2}.edge{fill:none;stroke:#54778a;stroke-width:2;marker-end:url(#kafka-write-fetch-flow-arrow)}.dash{stroke-dasharray:6 4}</style><rect width="1120" height="480" fill="#f4f8fa"/><text class="h" x="36" y="50">Kafka：生产确认、复制与消费完成分开判断</text><text class="b" x="36" y="86">acks=all 结合 min.insync.replicas 判断接受条件；确认不等于消费者已经完成。</text><path class="edge" d="M236 189H300"/><path class="edge" d="M556 170H620"/><path class="edge" d="M620 218H556"/><path class="edge" d="M428 252V326Q428 334 436 334H620"/><rect class="box" x="36" y="128" width="200" height="124" rx="6"/><text class="n" x="54" y="164">Producer</text><text class="b" x="54" y="198">批量发送 / 重试</text><text class="b" x="54" y="227">协议幂等防重</text><rect class="focus" x="300" y="128" width="256" height="124" rx="6"/><text class="n" x="318" y="164">Partition Leader</text><text class="b" x="318" y="198">按分区日志追加</text><text class="b" x="318" y="227">校验 ISR 写入条件</text><rect class="box" x="620" y="128" width="464" height="124" rx="6"/><text class="n" x="638" y="164">ISR Follower</text><text class="b" x="638" y="198">按日志复制；落后副本可退出 ISR</text><text class="b" x="638" y="227">副本确认不等于每条记录同步 fsync</text><rect class="box" x="620" y="294" width="464" height="124" rx="6"/><text class="n" x="638" y="330">经典消费组</text><text class="b" x="638" y="364">读取可见日志 → 处理业务 → 提交 offset</text><text class="b" x="638" y="393">写库成功但 offset 未提交会重复处理</text><text class="n" x="36" y="407">生产确认与消费确认是两个阶段。</text><text class="s" x="36" y="448">副本因子 3、min ISR 2：只剩 1 个 ISR 时拒绝对应 acks=all 写入。</text></svg>
