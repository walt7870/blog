<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="460" viewBox="0 0 1120 460" role="img" aria-labelledby="rocketmq-fifo-message-title rocketmq-fifo-message-desc"><title id="rocketmq-fifo-message-title">RocketMQ FIFO：MessageGroup 定义 5.x 顺序边界</title><desc id="rocketmq-fifo-message-desc">单生产者按序发同组消息，服务端存储，同组消费者接收处理确认后再处理下一条；不同组可并行，不保证组间全局顺序。</desc><defs><marker id="rocketmq-fifo-message-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#54778a"/></marker></defs><style>text{font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#183248}.h{font-size:28px;font-weight:700}.n{font-size:21px;font-weight:700}.b{font-size:18px}.s{font-size:16px;fill:#526877}.box{fill:#fff;stroke:#b8cad5;stroke-width:1.5}.focus{fill:#e5f4ef;stroke:#27846b;stroke-width:2}.edge{fill:none;stroke:#54778a;stroke-width:2;marker-end:url(#rocketmq-fifo-message-arrow)}.dash{stroke-dasharray:6 4}</style><rect width="1120" height="460" fill="#f4f8fa"/><text class="h" x="36" y="50">RocketMQ FIFO：MessageGroup 定义 5.x 顺序边界</text><text class="b" x="36" y="86">普通业务 key 用于查询与识别，不等于 MessageGroup；多生产者并发没有天然因果序。</text><path class="edge" d="M284 199H348"/><path class="edge" d="M584 199H648"/><path class="edge" d="M844 199H908"/><rect class="box" x="36" y="136" width="248" height="126" rx="6"/><text class="n" x="54" y="172">同一生产者串行发送</text><text class="b" x="54" y="206">订单 A：创建 → 支付</text><text class="b" x="54" y="235">MessageGroup = A</text><rect class="focus" x="348" y="136" width="236" height="126" rx="6"/><text class="n" x="366" y="172">FIFO Topic</text><text class="b" x="366" y="206">同组消息按序存储</text><text class="b" x="366" y="235">不同组没有全局顺序</text><rect class="box" x="648" y="136" width="196" height="126" rx="6"/><text class="n" x="666" y="172">同组消费</text><text class="b" x="666" y="206">接收 → 处理</text><text class="b" x="666" y="235">确认后再继续</text><rect class="box" x="908" y="136" width="176" height="126" rx="6"/><text class="n" x="926" y="172">订单状态库</text><text class="b" x="926" y="206">校验版本</text><text class="b" x="926" y="235">拒绝非法回退</text><text class="n" x="36" y="333">不同版本的边界</text><text class="b" x="36" y="370">4.x 常见方案按 Queue 串行，慢消息可阻塞同队列；5.x FIFO 按 MessageGroup 讨论。</text><text class="b" x="36" y="411">同组消息交给无序线程池会破坏结果顺序；跨 Topic、跨生产者还需业务状态机与版本约束。</text></svg>
